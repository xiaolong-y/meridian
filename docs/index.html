et’s take a deeper look at what we mean when we talk about improved performance for Qiskit 1.0.<br>\nThere are many different metrics to analyze for judging performance in a project like Qiskit, we’re going to focus on two: memory and speed.<br>\nIn terms of speed, many features in Qiskit 1.0 just work faster now than they used to, due to ongoing internal refactoring and the introduction of Rust code under the hood. For example, the transpiler in Qiskit 1.0 can bind and transpile circuits 16x faster than Qiskit 0.33 (while also returning shorter circuit depths). See below for a comparison of the transpilation capabilities for different types of 100+ qubit circuits. The blue bars indicate how many times faster Qiskit can transpile these circuits compared to TKET (an alternative circuit building SDK), and the pink bars indicate the percentage reduction in two-qubit gates:<br>\nSimilarly, when it comes to memory, we’ve done a lot of internal refactoring to reduce the footprint of circuits, with Qiskit 1.0 demonstrating an average 55% decrease in memory usage compared to Qiskit 0.39. The chart below shows data collected on the maximum memory used in building a 127-qubit Two Local circuit at increasing circuit depth, comparing the last three Qiskit versions with the upcoming 1.0 version:<br>\nPre-release coming December 2023<br>\nBefore the full release in February 2024, we will be offering a very early pre-release of Qiskit 1.0 on December 4, 2023. This will include a subset of the changes coming in the full 1.0 release two months later.<br>\nAs an open-source project, we have always strived to bring our community along with us in our development journey, and so we’re thrilled to be able to provide this opportunity for users and contributors to test out Qiskit 1.0 early. As always, we greatly appreciate any bug reports and feedback made by opening an issue in our GitHub repository.<br>\nAlso, in early February 2024 (after the 1.0 pre-release but before the 1.0 stable release) we will release an additional Qiskit 0.46. This version will be compatible with 0.45, and will be a useful stepping stone in the transition to 1.0. We will continue to support Qiskit 0.46 for a further six months, overlapping with the release of Qiskit 1.0. This version will contain warnings for everything that is changing in Qiskit 1.0 and possibly some bug fixes, but no new features.<br>\nHow to upgrade to Qiskit 1.0<br>\nThe following instructions are relevant for upgrading to Qiskit 1.0 or installing the pre-release.<br>\nThe most important thing to know when the time comes to upgrade is this:<br>\nYou will need to create a new virtual environment to install Qiskit 1.0.<br>\nQiskit 1.0 will use a new packaging structure, and you will not be able to upgrade an existing Qiskit 0.x installation to Qiskit 1.0 in-place. This is the only time we expect to break packaging; you will be able to upgrade from Qiskit 1.0 and beyond in-place.<br>\nI’m a Qiskit user. What do I need to do?<br>\nQiskit 1.0 is not yet available, so there is nothing you need to do immediately. When it is released, you will not be able to use pip install -U qiskit to upgrade from any Qiskit 0.x version to 1.0.<br>\nTo upgrade, you will need to begin a new virtual environment.<br>\nFor example, using the standard tool venv, you might do the following:<br>\n# Create a new virtual environment (you only do this once)<br>\npython -m venv ~/qiskit-1.0-env<br>\n# Activate the new virtual environment (you do this every time you start a new session)<br>\nsource ~/qiskit-1.0-env/bin/activate<br>\n# Install Qiskit 1.0 (you only do this once for this environment)<br>\npip install ‘qiskit>=1.0’Note: For installing the pre-release, you can use the same steps above. The only difference is that for the last line, you should run pip install ‘qiskit==1.0.0b1’ instead.<br>\nYou can follow similar steps if you prefer to use virtualenv, Conda, or any other virtual-environment management. Consult the documentation for your chosen environment for more information on how to create new ones.<br>\nIn addition to creating a new virtual environment, you might need to adapt your code to work with Qiskit 1.0, as there will be some breaking changes with respect to 0.x.<br>\nTo prepare for this, we recommend that you install Qiskit 0.46 when it is released in early February 2024, and try running your code to see if anything breaks. Where there are places that you need to change, you will see DeprecationWarnings being issued, which will include descriptions of how to modify your code for Qiskit 1.0.<br>\nWe will support Qiskit 0.46 with bugfixes, but no new features, for six months after its release. This will give users time to make modifications, and will also give library maintainers time to upgrade any libraries users may depend on.<br>\nI use projects that depend on Qiskit . What do I need to do?<br>\nIt will take some time for downstream projects to begin supporting Qiskit 1.0. Please be patient with these projects; it is a lot of work to support new versions of libraries, and it can take maintainers time to switch over.<br>\nAs an end user, you must not install packages that require Qiskit versions before Qiskit 1.0 in the same environment where you have Qiskit 1.0 installed.<br>\nDoing so could break your virtual environment, and you might need to create a new one.<br>\nI maintain a project that depends on Qiskit . What do I need to do?<br>\nQiskit 1.0 will include breaking changes, and we do not expect that packages supporting the current 0.44 or 0.45 series will necessarily support 1.0 unchanged.<br>\nWe recommend two immediate modifications to your dependency management:<br>\n- Remove any dependencies on the qiskit-terraPyPI package, and replace them with dependencies on theqiskitpackage. You can find a table matching oldqiskitversions toqiskit-terraversions here, if you want to support old versions of Qiskit. From Qiskit 0.45 onwards, the versions ofqiskitandqiskit-terraare identical, and are not listed in the table. This is critical as theqiskit-terraPyPI package will no longer be updated in any form for the 1.0 series and above, as it is entirely superseded by theqiskitPyPI package.<br>\n- Place an upper bound on your qiskitdependency to restrict the use of1.0until you have verified that your package supports Qiskit 1.0. To do this, set your dependency asqiskit >=0.44, <1.0, or replace the0.44as appropriate.<br>\nAfter implementing the above steps, but before the full release of Qiskit 1.0 we recommend testing your project with Qiskit 0.46 once it is released in early February. This will enable you to find all the warnings it will generate so you can upgrade your library to support Qiskit 1.0 when it is released. We will support Qiskit 0.46 with bug fixes for six months after the release of Qiskit 1.0, to give you time to begin supporting 1.0.<br>\nOnce Qiskit 1.0 is released in February 2024 (and you have sufficiently tested it with your codebase), we recommend releasing a new version of your package with updated version requirements.<br>\nBreaking changes<br>\nThroughout the history of Qiskit development, we have strived to keep pace with the rapid progress of quantum technology while also trying very hard to keep breaking changes to a minimum, and to provide a clean upgrade path that allows library authors to support multiple versions of the Qiskit package simultaneously.<br>\nQiskit 1.0 will require some changes that could not necessarily be made safely in this manner. These largely affect data-structure internals, which we could not change smoothly without severely compromising performance. We hope that many of these changes will not affect user code, but are aware that this is not always the case. The best way to prepare for the transition to 1.0, and understand which breaking changes will impact you, is to try out the Qiskit 1.0 pre-release and the final minor version Qiskit 0.46 when they are released.<br>\nWith the transition to Qiskit 1.0 the development cycle of Qiskit is also changing. There will be a minimum of one year between major releases, and minor version releases will happen as usual every three months. This means that breaking changes will only occur during major releases. To dig into the details of how the release cycles are changing and why, you can check out our open RFC here.<br>\nWhile we anticipate the release of Qiskit 1.0 will result in some initial disruption, we see this as being necessary to pave the way towards a more stable and less breaking future for the package.<br>\nConclusion<br>\nWe are incredibly thankful to everyone who has taken the time over the past six years to get us to this place, whether it was a pull request, bug report, or just a comment on slack. Please keep it up! We are very proud of how far we’ve come, and can’t wait to embark on this next phase of our development journey with your continued support. Stay tuned for more Qiskit 1.0 updates!<br>\nFootnote for the GitHub Gurus!<br>\nWant to know more about what’s happening for Qiskit 1.0 at a codebase level? These resources may be of interest to you:<br>\n- If you wish to proactively test against changes coming in Qiskit 1.0, development is proceeding on the main branch of the Qiskit repository.<br>\n- Development on Qiskit 0.46 is happening on the stable/0.46 branch of the Qiskit repository.<br>\n- Conversations around release cycles, versioning and deprecation policies are happening in the release cycle RFC in the Qiskit organization RFC repository.<\/p>","content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-07-29 02:10:18","word_count":2003,"read_time_minutes":11,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"135w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":"<p>A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?<br>\nBy Maria Violaris, PhD student at the University of Oxford<br>\nTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.<br>\nHave you guessed the story I’m talking about? That’s right! It’s “A Christmas Carol,” the tale of the grumpy, selfish Ebenezer Scrooge who receives visits from ghosts of the past, present and future on Christmas Eve. Scrooge emerges from his experience a changed and newly generous man, but I can’t help but wonder, could the fantastical story of Scrooge really happen in a universe with quantum time-loops?<br>\nIn the latest installment of the Quantum Paradoxes video series on the Qiskit YouTube channel, I investigate the possibility that time-loops — more commonly known to physicists as “closed-timelike-curves” — may in fact be consistent with quantum mechanics. In this blog post, I apply my findings from that video to make sense of the story of “A Christmas Carol”.<br>\nA Christmas paradox<br>\nLet’s first consider the visit from the Ghost of Christmas Past. The ghost takes Scrooge to observe various happy scenes from his past. Scrooge does not interact with his past self, and his past self does not see him at all.<br>\nThis experience begins to change Scrooge’s outlook on life, so it has an effect on Scrooge’s future behaviour. However, there’s no paradox here. It is fully self-consistent for Scrooge to invisibly observe his past self, and then have that experience change his own future actions. In fact, this process isn’t too different from something most of us do just about every day. Like anyone else, Scrooge is simply reflecting on his past memories, and changing his actions as a result.<br>\nNext, the Ghost of Christmas Present takes Scrooge to see some scenes from the present day. No time-travel here, so all is good!<br>\nNow for the most interesting case: Scrooge receives a visit from the Ghost of Christmas Yet-To-Come. The ghost takes Scrooge to a scene that occurs after his death, where he sees that his death is celebrated rather than mourned, and also observes the tragic fate of a sick child, Tiny Tim. Seeing this future is the final straw for Scrooge to change his ways. He wakes up on Christmas morning as someone kind, generous and compassionate.<br>\nHere’s the paradox: If Scrooge changed his ways because he saw a bleak future, then the bleak future will never happen. If the bleak future never happens, it will never cause Scrooge to change his ways!<br>\nSelf-consistency is key<br>\nThe paradox we run into with our friend Ebenezer shares many similarities with the “Grandfather Paradox,” the idea that someone who goes back in time and kills their grandfather will never exist to go and kill their grandfather in the first place. These paradoxes can be solved in quantum mechanics using a “consistency condition,” which is a constraint that ensures everything makes logical sense in a time-loop. If someone goes into a time-machine, they must be in the same state as when they come out of the time-machine, and this limits the range of actions they can perform. If you go back in time, you physically will not be able to kill your own grandfather.<br>\nWith that in mind, we can resolve the paradox of Scrooge changing his ways. Consider a modified story, where the Ghost of Christmas Yet-to-Come shows Scrooge a bright and happy future. In this future, Scrooge is a kind and generous man. Seeing how much happiness he can bring about by being kind and generous, present-day selfish Scrooge is inspired to change his ways. He becomes kind and generous as well, leading to the bright and happy future he was shown by the ghost, with no logical contradiction.<br>\nIs everything all well and good now? Not quite. There’s another, more subtle time-travel paradox hidden in this modified story, called the Knowledge Paradox. Imagine I travel forward in time to read this blog post, copy it from my future self, and then post it, making it the blog post that my past self would eventually copy. This is logically consistent, but where did the knowledge of the ideas in the blog post come from?<br>\nOur Scrooge scenario is similar. Sure, Scrooge can see his kind future self and become a kinder person as a result. That is perfectly self-consistent. But where did Scrooge’s knowledge of the positive impacts of being kind come from? This Knowledge Paradox has not yet been solved in quantum mechanics, so I cannot quite finish the quantum modification of Scrooge in this blog post.<br>\nWho knows? Perhaps this Christmas Eve I will be visited by a Ghost of Christmas Yet-to-Come, one who will show me a future Qiskit video where the Knowledge Paradox has been resolved. I will then come back to the present, and make a new Qiskit video resolving the Knowledge Paradox with quantum circuits, which turns out to be the one I saw in the future…<br>\nUntil that happens, be sure to check out the current version of the video where I investigate this topic on Qiskit YouTube. You can also dive into the accompanying Jupyter notebook, which will show you how to simulate closed-timelike-curves as a quantum circuit. And of course, whether you are spending the festive season watching videos, reading Victorian morality tales, or reflecting on the past, present and future, best wishes for the holidays and everything yet to come!<\/p>","content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-07-29 02:10:19","word_count":957,"read_time_minutes":5,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"136w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":"<p>A new chapter for Qiskit algorithms and applications<br>\nIn recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these changes, and introduces the new maintainers.<br>\nAlgorithms as an independent package<br>\nIf you have been following our release updates, you may already be familiar with this change. Since Qiskit 0.44.0, qiskit.algorithms has been migrated to a new standalone package, qiskit-algorithms. The new library can be found in the qiskit-community GitHub organization and PyPi, and is the place to go for updated, primitive-based algorithm implementations.<br>\nThis move is significant because it separates the circuit-building tools from the libraries built on top of them. This separation allows algorithm development to move at a different pace than that of the core library. While Qiskit itself aims to provide a stable foundation layer for quantum development, algorithms are still an evolving field of research, and will benefit from more flexible development cycles.<br>\nCommunity-oriented algorithms and applications<br>\nIn the case of the Qiskit applications modules, the repository changes have been a bit more subtle. qiskit-nature, qiskit-machine-learning, qiskit-optimization, and qiskit-finance are now also part of the qiskit-community GitHub organization. The package installation path has remained unchanged, so the impact of this migration on end-users has been minimal. This move does however symbolize the strengthened community focus of the projects, which also involves the newly created qiskit-algorithms.<br>\nWhile these packages have always been open-source and welcomed external contributors, most feature development and maintenance efforts were sourced from within IBM Quantum. By joining forces with external partners, we enable the community to have a stronger impact on the direction of these libraries, bringing in new perspectives and areas of expertise. At the same time, we can focus more resources on improving the performance and stability of the core Qiskit package. The documentation of the applications can be found in their corresponding repositories as well as the Ecosystem page.<br>\nWelcoming new maintainers<br>\nThe algorithms and applications libraries have onboarded new code-owners and maintainers from IBM Quantum partner institutions:<br>\nAlgorithmiq (qiskit-nature): “Our mission is to revolutionise life sciences by exploiting the potential of quantum computing to solve currently inaccessible problems. Algorithmiq’s top quantum chemistry team and their knowledge of state-of-the-art quantum chemistry methods will, together with qiskit’s expert community, tackle some of the greatest quantum chemistry simulation challenges that lie ahead.”<br>\nSTFC Hartree Centre (qiskit-machine-learning): “We help UK businesses and organisations of any size to explore and adopt supercomputing, data analytics, AI and emerging technologies for enhanced productivity, smarter innovation and economic growth. Our Qiskit work will be supported by the Hartree National Centre for Digital Innovation (HNCDI) — a collaboration with IBM Research that bridges the gap between academic research and the adoption of new technologies to solve industry challenge and transfer the skills needed to adopt digital solutions.”<br>\nQuantagonia (qiskit-optimization): “Quantagonia’s mission is to democratize quantum computing, making it accessible and manageable for businesses across sectors, enabling them to leverage this powerful technology for transformative growth and a competitive edge.”<br>\nThese are domain experts in chemistry, machine learning and optimization, as well as active community contributors.<br>\nCleaning up legacy dependencies<br>\nTo facilitate the community’s greater role in the development of algorithms and applications, legacy dependencies in the applications have been cleaned up to simplify the code base and make the libraries more accessible to external contributors and new maintainers.<br>\nThis means the newly released versions of the application modules: qiskit-finance 0.4, qiskit-machine-learning 0.7, qiskit-optimization 0.6 and qiskit-nature 0.7 no longer depend on, or support, the now deprecated modules from Qiskit, such as opflow and quantum instance. These modules will no longer be available in the upcoming Qiskit 1.0 release.<br>\nIn addition to this, and in anticipation of the upcoming removal of qiskit.algorithms, which will also not be part of Qiskit 1.0, the applications modules have been updated to use only qiskit-algorithms instead.<br>\nConclusion<br>\nIn summary, the new algorithm and application libraries in the Qiskit Ecosystem have undergone a significant shift towards community-led development. Establishing an independent algorithms package, relocating applications, and simplifying legacy code were all steps designed to facilitate and enhance community engagement. As always, community contributions are most welcome, and — together with the new maintainers — we invite all of you to get involved via the GitHub repositories or the corresponding Qiskit Slack channels, such as #applications.<\/p>","content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-07-29 02:10:20","word_count":778,"read_time_minutes":4,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"139w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":"<p>Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations<br>\nBy Jay Shah<br>\nThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.<br>\nThe Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition to the Qiskit Ecosystem Community Tier. It’s designed to be easy to use, and its GUI-based software allows users to build their visualizations while simultaneously studying or working — no need to worry about code.<br>\nRead on to learn more about this handy tool and how you can use it!<br>\nWhat users see through Quantum Glasses<br>\nIndividual qubits and single-qubit gates are some of the most fundamental building blocks of quantum computation, and the Bloch sphere provides a convenient way of visualizing them. The challenge is that Bloch spheres are not very easy to draw by hand, and there aren’t many simulators that make it easy to generate them.<br>\nQuantum Glasses accomplishes this by providing a GUI app that makes it easy to produce and manipulate Bloch sphere visualizations. This, in turn, helps users visualize important quantum computing concepts to enhance their understanding of the subject.<br>\nThe Quantum Glasses package supports a total of 11 single-qubit gates. These 11 gates include both parameterized as well as non-parameterized gates, listed below:<br>\n- Hadamard Gate<br>\n- X Gate<br>\n- Y Gate<br>\n- Z Gate<br>\n- S Gate<br>\n- S Dagger Gate<br>\n- T Gate<br>\n- T Dagger gate<br>\n- RX Gate<br>\n- RY Gate<br>\n- RZ Gate<br>\nThe parameter values for the parameterized gates (RX, RY, RZ) are discretized into the following set: 2𝝥, 𝝥, 𝝥/2, 𝝥/4, -𝝥/4, -𝝥/2, -𝝥, -2𝝥.<br>\nWith Quantum Glasses, users can apply a series of single qubit gates and see how they affect a qubit, either starting in a default initial state of |0> or in any other state that can be prepared using the available gates. Users can see the direct impact of these gates as the state vector rotates around the Bloch Sphere. These visualizations can help users:<br>\n- Better understand the effect of a particular gate when we apply it to a qubit in a given state.<br>\n- Example: Effect of RX gate when applied to a qubit in the state |+><br>\n- Gain a different perspective on important quantum computing identities<br>\n- Example: H2 = Identity (Applying a Hadamard Gate twice has no effect)<br>\nGetting started<br>\nQuantum Glasses is a GUI app built using the tkinter python library. Users can follow these steps to get the app on their local machines.<br>\n- Clone this repository using git clone https://github.com/Jayshah25/Quantum-Glasses<br>\n- Activate the venv<br>\n- Run python quantum_glasses.py<br>\nOnce you have successfully followed these steps, you should see Quantum Glasses appear on your screen.<br>\nHow to use Quantum Glasses<br>\n- Apply the desired Gates. The Display Screen keeps track of the gates applied.<br>\n- Click the Visualize Button. A new window with should pop up with the animated Bloch sphere.<br>\n- Close the animation window once the animation is complete.<br>\n- Click the Clear Button to reset the Quantum Glasses app.<br>\n- Apply a new series of Gates for visualization ,or click the Quit Button to close the app.<br>\nHopefully Qiskit users will find the above to be pretty straightforward. For extra clarity, let’s take a look at two examples taken from the preceding section of this article.<br>\nEffect of RX Gate on a qubit in the state |+><br>\nH2 = Identity<br>\nWish to see more examples with Quantum Glasses? You’ll find several more on our YouTube playlist.<br>\nFuture Work<br>\nQuantum Glasses is a fun and potentially useful tool, but it does currently have some significant limitations.<br>\n- The visualizations are limited to a single qubit. Quantum Glasses cannot visualize important concepts like quantum entanglement, which involve more than one qubit.<br>\n- The parameterized gates can only take one of the 8 values (2𝝥, 𝝥, 𝝥/2, 𝝥/4, -𝝥/4, -𝝥/2, -𝝥, -2𝝥).<br>\n- The number of gates that you can apply at once is limited to 10. Once 10 gates are applied, all the buttons automatically deactivate.<br>\nFuture work will focus on addressing these limitations and making the Quantum Glasses app even more functional and versatile. If you’d like to contribute to these efforts, please contact us via the project GitHub, here.<\/p>","content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-07-29 02:10:20","word_count":755,"read_time_minutes":4,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"140w","domain":"medium.com"},{"id":"1edf7f311f4678be","feed_id":"qiskit-blog","guid":"https://medium.com/p/69e861fbfc88","title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":"<p>Qiskit v0.45 is here!<br>\nBy Abby Mitchell, Luciano Bello, Matthew Treinish, Jake Lishman<br>\nWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.<br>\nThe TL;DR<br>\nThe biggest updates we’re going to cover include the following:<br>\n- New passmanagersubmodule to make constructing passmanagers easier<br>\n- New hardware-aware synthesis functionality, so you can now write a synthesis plugin that uses hardware information<br>\n- New methods to make it easier to use TranspileLayout<br>\n- New SabrePreLayoutpass to provide a better “first guess” initial layout before runningSabreLayout<br>\n- Performance improvements due to refactoring gates into singletons (Note: Some attributes will now error because of mutability changes)<br>\n- Unrollerpass,- bind_parameters()and any duplicated gate methods are now deprecated.- qiskit.extensionsis pending deprecation<br>\n- Deprecated code from old releases (0.16, 0.19, 0.20 and 0.21) has been removed<br>\nAn important note about package versioning<br>\nIf you’re confused about version numbers and think you may have missed out on a lot — don’t panic! In our last release, we announced that we had renamed Qiskit Terra to just Qiskit. This means the python package qiskit (which used to refer to the metapackage codebase) now refers to the codebase that was formerly named qiskit-terra. The last phase of this renaming process is to sync the version numbers between the old qiskit metapackage (the last release was v0.44) and the old qiskit-terra (the last release was v0.25). We chose to stick with the higher version number, so this release of qiskit will be v0.45.<br>\nTop new features & improvements<br>\nIn this section we’ll cover some of the most important new features and enhancements included in this release. If you want to know more about these, or other features that didn’t make it into this article, you can see the full list of new features here.<br>\nNew passmanager sub-module<br>\nThe passmanager has been significantly refactored to make it easier to use and more performant. Users can use this new module to create their own custom passmanager using their own intermediate representations.<br>\nThe following example demonstrates how you can construct a toy passmanager that, when run, will take in a row of numbers and remove any digits that equal 5. In this example, the input and outputs are integers, whereas the intermediate representation is a string:<br>\nfrom qiskit.passmanager import BasePassManager, GenericPass, ConditionalController<br>\n# create custom passmanager using BasePassManager<br>\nclass ToyPassManager(BasePassManager):<br>\n    # convert input integer to string<br>\n    def _passmanager_frontend(self, input_program: int, **kwargs) -> str:<br>\n        return str(input_program)<br>\n    <br>\n    # convert IR string to integer for output<br>\n    def _passmanager_backend(self, passmanager_ir: str, in_program: int, **kwargs) -> int:<br>\n        return int(passmanager_ir)<br>\n# Create a pass to remove a number if it equals 5<br>\nclass RemoveFive(GenericPass):<br>\n    def run(self, passmanager_ir: str):<br>\n        return passmanager_ir.replace(\"5\", \"\")<br>\n# Initialize pass<br>\ntask = RemoveFive()<br>\n# Initialize passmanager<br>\npm = ToyPassManager()<br>\n# Add pass to passmanager<br>\npm.append(task)<br>\n# Run the passmanager<br>\npm.run([123456789, 45654, 36785554])Output:<br>\n[12346789, 464, 36784]Improved workflow for transpiler layout<br>\nA number of new methods have been added to simplify the workflow for using and applying the TranspileLayout class.<br>\nTranspileLayout itself now has the following new methods:<br>\n- .initial_index_layout()— returns a python list of- TranspileLayout.initial_layout<br>\n- .routing_permutation()— returns a python list of- TranspileLayout.final_layout<br>\n- .initial_virtual_layout()— same functionality as- TranspileLayout.initial_layoutbut with the option to exclude auxilary qubits by setting the argument- filter_ancillas=False<br>\n- .final_index_layout()— returns a python list of the output positions for each qubit from the input circuit to the transpiler<br>\n- .final_virtual_layout()— returns a- Layoutobject of the output positions for each qubit from the input circuit to the transpiler<br>\nIn addition, the SparsePauliOp class now has a new method, apply_layout(), that enables a transpiled layout to be applied to an observable locally before passing it to a primitive .run() function. E.g.:<br>\nfrom qiskit.circuit.library import RealAmplitudes<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nfrom qiskit.primitives import BackendEstimator<br>\nfrom qiskit.compiler import transpile<br>\nfrom qiskit.providers.fake_provider import FakeNairobiV2<br>\npsi = RealAmplitudes(num_qubits=2, reps=2)<br>\nH1 = SparsePauliOp.from_list([(\"YX\", 1), (\"XZ\", 2), (\"XI\", 3)])<br>\nbackend = FakeNairobiV2()<br>\nestimator = BackendEstimator(backend=backend, skip_transpilation=True)<br>\nthetas = [0, 1, 1, 2, 3, 5]<br>\ntranspiled_psi = transpile(psi, backend, optimization_level=3)<br>\npermuted_op = H1.apply_layout(transpiled_psi.layout)<br>\nres = estimator.run(transpiled_psi, permuted_op, thetas).result()New SabrePreLayout pass<br>\nThis release includes a new transpiler pass, called SabrePreLayout, designed to provide a better initial layout before running SabreLayout. This layout attempts to improve transpilation outputs in particular for large device topologies.<br>\nThe following example demonstrates how to use the SabrePreLayout pass before running a SabreLayout pass:<br>\nimport math<br>\nfrom qiskit.transpiler import CouplingMap, PassManager<br>\nfrom qiskit.circuit.library import EfficientSU2<br>\nfrom qiskit.transpiler.passes import SabrePreLayout, SabreLayout<br>\nqc = EfficientSU2(16, entanglement='circular', reps=3, flatten=True)<br>\nqc.assign_parameters([math.pi / 2] * len(qc.parameters), inplace=True)<br>\nqc.measure_all()<br>\ncoupling_map = CouplingMap.from_heavy_hex(7)<br>\npm = PassManager(<br>\n  [<br>\n    SabrePreLayout(coupling_map=coupling_map),<br>\n    SabreLayout(coupling_map),<br>\n  ]<br>\n)<br>\npm.run(qc)For more details on how this new pass does its thing, check out the PR for a more detailed description of the logic behind its development.<br>\nNote: This new feature is an experimental pass and is not yet included in the preset passmanagers.<br>\nPerformance improvements<br>\nIn this section, we’ll cover the most significant performance improvements that users will gain with this release.<br>\nFaster transpilation<br>\nThe transpiler has undergone some refactoring under the hood, resulting in performance improvements across all optimization levels. Users do not need to change anything in their transpiler development workflow. However, by upgrading to the latest version of Qiskit, you should see faster transpilation times, particularly noticeable for large circuit depths.<br>\nThe graphs below show the difference in transpile time between Qiskit v0.44 and v0.55 across a range of circuit depths and optimization levels:<br>\nFaster circuit construction and QASM parsing due to Singleton classes<br>\nThe following unparameterised and non-controlled gate classes have been refactored to be singletons:<br>\n- DCXGate,- ECRGate,- HGate,- IGate,- iSwapGate,- SGate,- SdgGate,- SwapGate,- SXGate,- SXdgGate,- TGate,- TdgGate,- XGate,- RCCXGate,- RC3XGate,- YGate,- ZGate,- CHGate,- CSGate,- CSdgGate,- CSwapGate,- CSXGate,- CXGate,- CCXGate,- C3SXGate,- C3XGate,- C4XGate,- CYGate,- CZGate<br>\nAs a result, implementing these gates has become significantly more efficient, requiring less memory, reducing circuit construction time and speeding up QASM parsing time. These effects are most noticeable in large circuits, and highlight the efforts being made to ensure Qiskit can continue to support users as they move towards utility-scale experimentation.<br>\nSee below a comparison of circuit build time and parameter binding time between Qiskit v0.44 and 0.45:<br>\nNew deprecations<br>\nIn this section we’ll cover some of the most important new deprecations in this release. This section aims to highlight things that will now start throwing deprecation warnings and will be removed in a later release, following Qiskit’s Deprecation Policy (documented in full here). Due to this being the last release before Qiskit 1.0, you may see more things than usual being highlighted in this section.<br>\nFor guidance on how to deal with deprecation warnings, check out the deprecations section in our previous article here. You can see more detail about the deprecations specific to this release here.<br>\nqiskit.extensions<br>\nThe qiskit.extensions sub-module is pending deprecation and will be fully deprecated in a future release, with its contents either being moved to other sub-modules or deprecated.<br>\nThe following qiskit.extensions classes have been moved to the circuit library, users should update their import statements accordingly, using from qiskit.circuit.library import ... instead of from qiskit.extensions import ... .<br>\n- UCPauliRotGate,- UCRXGate,- UCRYGate,- UCRZGate,- UnitaryGate,- HamiltonianGate,- Initialize<br>\nThe following qiskit.extensions classes have been deprecated, due to them being similar to existing functionality elsewhere:<br>\n- SingleQubitUnitaryand- Snapshot<br>\nAdditionally, the following QuantumCircuit methods have been deprecated as part of this change:<br>\n- .isometry(), .- snapshot(),- .ucrx(),- .ucry(),- .ucrz(),- .squ(),- .diagonal()and- .hamiltonian()<br>\nUnroller transpiler pass<br>\nThe Unroller pass has been deprecated due to its functionality being superseded by the BasisTranslator pass, which can be used in a wider range of use cases than was possible with the Unroller pass.<br>\nFor users currently using the Unroller pass, we recommended updating your code to use a custom pass manager with the BasisTranslator pass. For example:<br>\nfrom qiskit.transpiler import PassManager<br>\nfrom qiskit.transpiler.passes import UnrollCustomDefinitions, BasisTranslator<br>\nfrom qiskit.circuit.equivalence_library import SessionEquivalenceLibrary as sel<br>\ncircuit = YOUR_CIRCUIT<br>\nbasis_gates = YOUR_BASIS_GATE_LIST<br>\npm = PassManager(<br>\n [<br>\n   UnrollCustomDefinitions(sel, basis_gates=basis_gates),<br>\n   BasisTranslator(sel, target_basis=basis_gates),<br>\n ]<br>\n)<br>\npm.run(circuit)In addition, as part of this deprecation, the use of the unroller value for the translation_method argument in the transpile() function is also deprecated. Users should use the default translator option instead. So, instead of transpile(qc, backend, translation_method=\"unroller\", ...) , users can use transpile(qc, backend, ...) .<br>\nbind_parameters()<br>\nThe functionality of assign_parameters() is the same as that of bind_parameters() , so we’ve made the decision to deprecate bind_parameters() in an effort to clean up the Qiskit codebase. Users should update their code to use assign_parameters() instead of bind_parameters() going forward.<br>\nDuplicated circuit gate methods<br>\nThere are certain QuantumCircuit methods that apply the same gate as another existing method, so duplicated gate methods have been deprecated, and going forward only one gate method will exist for each gate. The following methods are being deprecated by this change:<br>\n- .i()is deprecated; users should use- .id()instead<br>\n- .cnot()is deprecated; users should use- .cx()instead<br>\n- .toffoli()is deprecated; users should use- .ccx()instead<br>\n- .mct()is deprecated; users should use- .mcx()instead<br>\n- .fredkin()is deprecated; users should use- .cswap()instead<br>\nBreaking changes<br>\nIn this section we’ll highlight any changes that could cause user’s existing code to break when updating to this latest version, such as deprecated classes/functions that have now been removed.<br>\nDeprecated code from numerous prior releases has been removed<br>\nDue to the upcoming release of Qiskit 1.0, we are doing as much as we can to remove outdated code that has been throwing deprecation warnings for 3 months or more (in line with the removal timeline stipulated in our deprecation policy). In this release we have removed all code that was deprecated in Qiskit (Terra) releases 0.16, 0.19, 0.20 and 0.21. Users who are using deprecated code from these release versions should check the deprecation warnings for information on how to update your code, or consider pinning your Qiskit version to v0.44 or earlier.<br>\nSingleton Gates<br>\nDue to unparameterised and non-controlled gates being refactored to singletons, users will no longer be able to set the label, condition, duration, or unit attributes after instantiating a gate object. Instead users will now only be able to set these attributes as arguments when creating a new gate object, or use the new method .to_mutable() to get a mutable copy of the gate and set the attribute on that copy instead of the original object.<br>\nFor example, the following code will now throw an error:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate()<br>\nxgate.label = \"My X Gate\"Instead, this example could be refactored like so:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate(label=\"My X Gate\")or alternatively:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate().to_mutable()<br>\nxgate.label = \"My X Gate\"And there you have it! The most important details of the latest release. Remember, if you want to put ideas forward for future versions of Qiskit, you can always open a GitHub issue to request a feature or report a bug! And if you want to follow what’s coming up in the next release (as well as releases for other packages in the Qiskit Ecosystem), you can take a look at the Qiskit Release Planning Wiki.<br>\nMany people contributed to this release, special thanks to (in alphabetical order): Abby Mitchell, Abhiraj Shrotriya, Abigail J. Cross, Alexander Ivrii, AlexanderGroeger, Andir16, Aniket Patil, Christopher J. Wood, David McKay, Diego Emilio Serrano, Edwin Navarro, Elena Peña Tapia, Eric Arellano, Erick Winston, Evgenii Zheltonozhskii, Henry Zou, Hunter Kemeny, Ikko Eltociear Ashimine, Ikko Hamamura, Jake Lishman, Jay M. Gambetta, John Lapeyre, Joonghoon Lee, Julien Gacon, Kevin Hartman, Kevin J. Sung, Kyle Lund, Luciano Bello, Mahnoor Fatima, Matthew Treinish, Michał Górny, MozammilQ, Naoki Kanazawa, Paul Nation, Pieter Eendebak, Raghav, Raynel Sanchez, Ryuhei Yoshida, SamD-1998, Santhosh G S, Simone Gasperini, Takashi Imamichi, Toshinari Itoko, TsafrirA, Will Shanks, adigaboy, atharva-satpute, danielleodigie, jaeunkim, rht<\/p>","content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-07-29 02:10:21","word_count":1976,"read_time_minutes":10,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"142w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":"<p>Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics<br>\nBy Zhiding Liang, Jinglei Cheng, and Hanrui Wang<br>\nThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?<br>\nTraditionally, researchers approach VQAs at the gate-level. More specifically, they focus on the design of a type of quantum circuit structure known as the “ansatz,” which serves as a kind of template for the quantum state that we believe is close to the solution of the problem at hand. The challenge with this approach is that gate-level quantum circuits have a lot of redundancies and inefficiencies that limit the execution of intricate quantum algorithms on the noisy quantum computing hardware we have today. Fortunately, there’s a new kid on the block who could very well open up a world of possibilities for running VQA algorithms on near-term quantum hardware. It’s called the Parameterized Quantum Pulse Circuit.<br>\nIn this blog post, we will showcase how to use a tool from the Qiskit Ecosystem called Qiskit Dynamics to simulate the parameterized quantum pulse circuits, with a focus on the variational quantum eigensolver (VQE) algorithm. More specifically, we will demonstrate the Pulse ansatz on near-term superconducting hardware by using part of the PAN [1] algorithm, implementing a pulse-based ansatz for estimating the H2 molecule’s ground state energy.<br>\nPulse programming in Qiskit<br>\nOne of the useful features of Qiskit is that it gives us a lot of flexibility. Most Qiskit users focus on gate-level operations. However, when we’re working with transmon qubits in superconducting hardware, we know the quantum system executes qubit operations by firing microwave pulses at the qubits. Qiskit provides both gate-level and pulse-level programming capabilities, allowing us to get much more creative with how we approach algorithms like VQE.<br>\nWithin Qiskit’s Pulse programming, users can customize pulse shapes for transmon qubits, adjusting parameters like amplitude, phase, shape, and frequency. (Check the Qiskit Pulse module for more details.) Users can also use the Qiskit Ecosystem project Qiskit Dynamics to quickly and efficiently simulate the generated pulse schedules.<br>\nPulse circuits offer much more versatility than gate-level programming, but they come at the cost of precision, leading to potential uncertainties in the resulting unitary matrix. This precision is crucial for non-variational algorithms that demand exact rotations and operations. However, in variational quantum algorithms, the primary goal is to approximate a specific quantum state, not to achieve perfect accuracy. Experiments in previous research — VQP [2] and Pan [1] by Liang, Zhiding, et al., and [3] by Egger, Daniel J, et al. — confirm that shorter circuit latency pulses can effectively achieve these outcomes on IBM hardware via pulse access with both quantum machine learning (QML) and quantum chemistry tasks, such as running the VQE algorithm.<br>\nVariational Quantum Eigensolver<br>\nThe Variational Quantum Eigensolver (VQE) is a prominent example of variational quantum algorithms. A comprehensive review of its methods and best practices can be found in the VQE documentation provided in Qiskit. Distinct from conventional quantum algorithms that require fault-tolerant quantum computers for proper execution, VQE can be tailored for efficient operations on our current generation of noisy quantum devices.<br>\nWhen using the typical gate-level approach, we begin the process of using a VQE algorithm by expressing a system’s Hamiltonian with weighted Pauli matrices, which we can translate into quantum circuits. Next, we deploy an ansatz, essentially a quantum circuit with tunable parameters, to prepare the ground eigenstate of the Hamiltonian. Further measurement of this eigenstate gives us the Hamiltonian’s ground state energy. The power of VQE lies in its iterative nature. It employs classical optimization techniques to adjust the ansatz parameters, minimizing the Hamiltonian’s expectation value and thereby approximating the system’s lowest energy state.<br>\nDifferent ansatz structures have been proposed, from hardware-efficient models to the UCCSD, and each possesses its own advantages and challenges. Some researchers have even proposed a search-based algorithm, the QuantumNAS [4], to simplify the process of finding the best ansatz. As quantum computing continues to advance, VQE remains a popular area of focus, with ongoing studies exploring innovative ansatz structures and optimization strategies to enhance its precision and applicability.<br>\nBefore diving into pulse-level VQE, let’s quickly recap the traditional gate-level approach:<br>\n- In gate-level VQE, the parameters we deal with are the angles of rotation gates.<br>\n- The ansatz, or the quantum circuit that approximates the desired quantum state, is composed of these parameterized gates (e.g. rotation gates) and fixed gates.<br>\n- The primary objective is to tweak these parameters such that the quantum state closely approximates the lowest energy state.<br>\nNow, let’s look at how pulse-level VQE differs from the usual approach:<br>\n- Instead of focusing on gate-level parameters, pulse-level VQE shifts attention to the parameters of quantum pulses.<br>\n- These quantum pulses are essentially microwave pulses that act directly on superconducting quantum qubits.<br>\n- By directly controlling the quantum pulses, we can significantly reduce circuit latency.<br>\nWhy Pulse-Level VQE?<br>\nYou might be wondering, “why should I bother with pulse-level VQE when the gate-level approach already exists?” Here are some compelling reasons:<br>\n- Expands the Design Space. Working with pulses allows us to potentially access areas of the Hilbert space that are inaccessible with a CNOT-based circuit decomposition. For example, leakage outside of the computational sub-space may allow the variational algorithm to take short-cuts.<br>\n- Lowers calibration cost. One of the challenges with quantum gates is calibration. With pulse-level VQE, the lack of calibration is automatically addressed as the parameters are updated to mitigate these errors. For example, quantum pulses can sometimes suffer from issues like overrotation and underrotation. Pulse-level VQE inherently corrects these errors by adjusting the parameters to find the optimal quantum state.<br>\n- Reduces Latency. By directly controlling the quantum pulses, the need for intermediate gate operations is reduced, leading to faster quantum computations.<br>\nHow to build parameterized pulse circuits in Qiskit<br>\nTo construct a pulse schedule, we can use the built-in functionality offered by Qiskit Pulse. This allows us to exercise control over the parameters in the quantum pulses, and extract the corresponding pulses from gates.<br>\nFor instance, let’s generate a bell state pulse schedule by directly obtaining the corresponding pulses from the gate-level circuit.<br>\nfrom qiskit import QuantumCircuit, pulse<br>\nfrom qiskit_dynamics.backend import DynamicsBackend<br>\nqc_test = QuantumCircuit(2)<br>\nqc_test.h(0)<br>\nqc_test.cx(0,1)<br>\nqc_test.measure_all()<br>\nwith pulse.build(backend) as pulse_test:<br>\n  pulse.call(qc_test)<br>\npulse_test.draw()We can visualize the pulse schedule as follows:<br>\nFurthermore, we can build parameterized quantum pulse circuits (see example code below). Here, we use the drag pulse shape from a single qubit gate, since drag pulse is the native pulse in IBM’s superconducting quantum machines. By using drag pulses, we can avoid population leaking outside of the computational subspace. However, we can also build a parameterized pulse from scratch depending on our needs.<br>\nfrom qiskit.pulse import Schedule, GaussianSquare, Drag, Delay, Play, ControlChannel, DriveChannel<br>\ndef drag_pulse(backend, amp, angle):<br>\n  backend_defaults = backend.defaults()<br>\n  inst_sched_map = backend_defaults.instruction_schedule_map<br>\n  x_pulse = inst_sched_map.get(‘x’, (0)).filter(channels = [DriveChannel(0)], instruction_types=[Play]).instructions[0][1].pulse<br>\n  duration_parameter = x_pulse.parameters[‘duration’]<br>\n  sigma_parameter = x_pulse.parameters[‘sigma’]<br>\n  beta_parameter = x_pulse.parameters[‘beta’]<br>\n  pulse1 = Drag(duration=duration_parameter, sigma=sigma_parameter, beta=beta_parameter, amp=amp, angle=angle)<br>\n  return pulse1How to simulate the pulse circuit with Qiskit Dynamics<br>\nTo run the pulse circuit using Qiskit Dynamics, first we need to initialize Qiskit Dynamics itself.<br>\nfrom qiskit_dynamics import Solver, DynamicsBackend<br>\nfrom qiskit_dynamics.backend import default_experiment_result_function<br>\nfrom qiskit_dynamics.array import Array<br>\nimport jax<br>\nfrom qiskit.providers.fake_provider import *<br>\ngate_backend = FakeManila()<br>\ngate_backend.configuration().hamiltonian[‘qub’] = {‘0’: 2,’1': 2,’2': 2,’3': 2,’4': 2}<br>\njax.config.update(“jax_enable_x64”, True)<br>\njax.config.update(“jax_platform_name”, “cpu”)<br>\nArray.set_default_backend(“jax”)<br>\npulse_backend = DynamicsBackend.from_backend(gate_backend, evaluation_mode=”sparse”)<br>\nsolver_options = {“method”: “jax_odeint”, “atol”: 1e-6, “rtol”: 1e-8}<br>\npulse_backend.set_options(solver_options=solver_options)<br>\npulse_backend.configuration = lambda: gate_backend.configuration()After the initialization, let’s try to run the pulse_test (the Bell state circuit we showed in the last section) on Qiskit Dynamics.<br>\nresults = pulse_backend.run(pulse_test).result()<br>\ncounts = results.get_counts()Pulse based VQE for Ground State Energy of H2<br>\nWe will now perform ground state energy estimation for the H2 molecule using our Pulse-based VQE. We’ll need to start with the following preprocessing steps:<br>\n- Use ‘sto-3g’ Gaussian equations to fit the spin orbital of the H2 molecule with bond length equals 0.735.<br>\n- Through the Fermionic mapping, we get the Pauli strings and corresponding coefficients that describe the problem. Based on these Pauli strings, we can generate the observable layer for the VQE algorithm.<br>\nfrom qiskit_nature.units import DistanceUnit<br>\nfrom qiskit_nature.second_q.drivers import PySCFDriver<br>\nfrom qiskit_nature.second_q.mappers import JordanWignerMapper,ParityMapper,QubitConverter<br>\nimport numpy as np<br>\nsimplified_h2_molecule = \"\"\"<br>\nH 0.0 0.0 0.0<br>\nH 0.0 0.0 0.735<br>\n\"\"\"<br>\ndriver = PySCFDriver(<br>\n  atom=ultra_simplified_ala_string.strip(),basis='sto3g',<br>\n  charge=0,<br>\n  spin=0,<br>\n  unit=DistanceUnit.ANGSTROM<br>\n)<br>\nqmolecule = driver.run()We define the VQE and build our own custom pulse ansatz. Then we can use the Qiskit Dynamics module to obtain the results of the estimated energy of H2. (For more details regarding implementation based on the PAN [1] algorithm, please refer to this pulse-level VQE tool based on Qiskit-Pulse and Qiskit-Dynamics.)<br>\ndef vqe(params,pauli_dict,pulse_backend, backend,n_qubit,n_shot):<br>\n  print(“params in def chemistry in vqe.py: “, params)<br>\n  # assert(len(params)%2==0)<br>\n  width_len = int(len(params)-1*(n_qubit-1))<br>\n  split_ind = int(width_len/2)<br>\n  amp = np.array(params[:split_ind])<br>\n  angle = np.array(params[split_ind:width_len])*np.pi*2<br>\n  width_1 = (np.array(params[width_len:]))<br>\n  num_items = (1024–256) // 16 + 1<br>\n  width_norm = (width_1–256) / (1024–256)<br>\n  width_norm = np.clip(width_norm, 0, 1)<br>\n  width = (np.round(width_norm * (num_items — 1)) * 16 + 256).astype(int)<br>\n  amp = amp.tolist()<br>\n  angle = angle.tolist()<br>\n  width = width.tolist()<br>\n  keys = [key for key in pauli_dict]<br>\n  values = [pauli_dict[key] for key in pauli_dict]<br>\n  expect_values = []<br>\n  for key, value in zip(keys, values):<br>\n    prepulse = HE_pulse(backend, amp, angle, width)<br>\n    expect = vqe_one(prepulse, n_qubit, n_shot, pulse_backend, backend, key, value)<br>\n    expect_values.append(expect)<br>\n  print(“E for cur_iter: “,sum(expect_values))<br>\n  return sum(expect_values)Here is a plot showing the convergence of estimated energy while training pulse-based VQE for the H2 molecule.<br>\nConclusion<br>\nPulse-level VQE offers a promising avenue for quantum optimization. By shifting the focus from gate-level parameters to quantum pulse parameters, we can address several challenges inherent in quantum computing, such as calibration and rotation errors.<br>\nWe hope this blog post provides you with a deeper understanding of pulse-level VQE and its advantages. Stay tuned for more insights into the fascinating world of quantum computing!<br>\nReferences<br>\n[1] Liang, Zhiding, et al. “Pan: Pulse ansatz on nisq machines.” arXiv preprint arXiv:2208.01215 (2022).<br>\n[2] Liang, Zhiding, et al. “Variational quantum pulse learning.” 2022 IEEE International Conference on Quantum Computing and Engineering (QCE). IEEE, 2022.<br>\n[3] Egger, Daniel J, et al. “Pulse variational quantum eigensolver on cross-resonance-based hardware.” PhysRevResearch.5.033159. American Physical Society (2023).<br>\n[4] Wang, Hanrui, et al. “Quantumnas: Noise-adaptive search for robust quantum circuits.” 2022 IEEE International Symposium on High-Performance Computer Architecture (HPCA). IEEE, 2022.<\/p>","content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-07-29 02:10:22","word_count":1754,"read_time_minutes":9,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"142w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":"<p>Sitemap<br>\nOpen in app<br>\nSign up<br>\nSign in<br>\nMedium Logo<br>\nGet app<br>\nWrite<br>\nSearch<br>\nSign up<br>\nSign in<\/p>","content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-07-29 02:10:24","word_count":18,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"143w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":"<p>Important changes to Qiskit documentation and learning resources<br>\nToday, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.<br>\nQiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made since Qiskit’s inception. However, it has been challenging to maintain Qiskit documentation and educational resources in their current form. We’ve also received lots of user feedback that these resources needed to be consolidated and better-organized to make Qiskit easier to use on real quantum hardware. Our hope is that the community will no longer need to jump between scattered, disjointed resources to develop quantum programs.<br>\nThat’s why we’re migrating Qiskit educational resources and documentation into the IBM Quantum Platform — to offer a more unified experience for users. Our eventual plan is to sunset all of the content on Qiskit.org and move it to the IBM Quantum Platform.<br>\nIBM Quantum is committed to open-source software development and education, so none of the old content is going away. Community-built content, such as the Qiskit Textbook, will be handed off to the community and remain available on GitHub.<br>\nThings will look a little different — so let’s walk you through the changes.<br>\nQiskit Documentation<br>\nQiskit and Qiskit Runtime documentation are moving to https://docs.quantum-computing.ibm.com/<br>\nThis migration is ongoing, with content due to be fully removed from Qiskit.org by the end of the year. Qiskit.org/documentation and qiskit.org/ecosystem/ibm-runtime/ will go away and redirect to https://docs.quantum-computing.ibm.com.<br>\nDocs will also be structured differently. Instead of API reference, tutorials, how-to guides and explanations, the content will be split into the following sections (to support natural workflows):<br>\n- Install: Begin using our tools and platforms with install and setup instructions.<br>\n- Build: Design and develop quantum circuits with primitives and advanced methods like dynamic circuits and mid-circuit measurements. You can also find our circuit library here.<br>\n- Verify: Validate and evaluate your quantum circuits.<br>\n- Run: Run on our hardware with job configuration options such as sessions.<br>\n- API reference: Find API references for Qiskit, Qiskit Runtime IBM Client, Qiskit IBM Runtime Rest API, and Qiskit IBM Provider in the API reference drop-down menu above. You can also find the Error code registry here.<br>\nUsers will have two ways to submit feedback and report bugs. For non API ref content, they should report issues/feedback in https://github.com/Qiskit/documentation/issues/new/choose. For any user interface-related issues, click the feedback button.<br>\nQiskit and Runtime docs will remain open source, and we still welcome community feedback and contributions to documentation. The translations program will also continue. We are currently working to define a robust process to facilitate contributions, so we are temporarily pausing contribution reviews until the content migration is complete. More details to come.<br>\nQiskit Textbook<br>\nStarting today, the following courses will redirect to the new learning app:<br>\n- Basics of quantum information, with John Watrous<br>\n- Fundamentals of quantum algorithms, with John Watrous<br>\n- Variational algorithm design<br>\n- Qiskit tutorials<br>\nWe invite you to explore IBM Quantum Learning to read these courses and explore the new Quantum-Safe Cryptographycourse. Over the next few months, we’re planning more free courses to help you learn foundations of quantum information, and experiment with Qiskit Runtime and IBM Quantum.<br>\nWe will sunset the textbook and the syllabus creation tool on November 29, 2023. Legacy textbook pages will remain available through a public archive on Github. Once archived, this content will not be maintained by IBMers, and new external contributions will not be accepted. We understand that the textbook is a much-beloved resource, and you’ll still be able to stand up the textbook locally with the instructions in the README.<br>\nWhy we’re making this change<br>\nMoving docs and learning resources will bring things closer to the same platform that developers, researchers, and students use every day for running actual workloads on quantum systems. Now, they’ll be able to find all of their resources in one, easy-to-navigate place.<br>\nIBM Quantum Platform will now be the home for all education, from the basics of quantum computing and programming with Qiskit to experimenting and prototyping with Qiskit Runtime on IBM Quantum systems. We’ll continue to develop this content in the open to promote trust and transparency within the quantum community, but moving it to the IBM Quantum Platform will help to ensure the quality of this content continues to be high as possible.<br>\nWe’re excited about this change, and hope that the result will be a seamless quantum computing experience for everyone. We look forward to building together.<\/p>","content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-07-29 02:10:24","word_count":789,"read_time_minutes":4,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"144w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":"<p>A guide to the Qiskit circuit library<br>\nBy Robert Davis, Julien Gacon, Abby Mitchell, and Luciano Bello<br>\nWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the process) by simply using circuits that already exist. That’s just one reason why we created the Qiskit circuit library.<br>\nThe Qiskit circuit library is a collection of valuable, well-studied circuits and gates that Qiskit users can easily plug into their quantum circuits. These include useful tools for a wide array of quantum computing applications—including quantum machine learning, quantum chemistry, circuits for benchmarking, and even a number of circuits that are hard to simulate classically. Whether you’re a complete beginner or a bona fide Qiskit wizard, we’re sure you’ll find something useful in our extensive circuit library module.<br>\nWhy every Qiskit user should give the circuit library a closer look<br>\nBefore we launched the circuit library a few years ago, users could only run quantum circuits they had constructed manually. If a user wanted to implement a phase estimation, a Fourier transform, or a variational circuit—really anything at all—they either had to build it themselves, or build a function that generated the circuit for them. In either case, the process was cumbersome, and documentation was limited and disorganized.<br>\nAs the Qiskit community began to grow, we developed a clearer sense of which circuits were most important to users. Eventually, we began to organize these into the circuit library we have today. This library is designed to be a repository of building blocks—a collection of any and all circuits we think are valuable to users. Here, we define “valuable” circuits as those that are either (1) widely used for common quantum computing tasks, (2) difficult to simulate classically, or (3) useful for quantum hardware benchmarking.<br>\nFor example, the quantum Fourier transform (QFT) is an essential building block in a number of quantum algorithms including quantum phase estimation and the famous Shor’s algorithm. Now, if they really want to, a user can certainly run a QFT on quantum hardware by building the circuit manually. That might look something like this:<br>\nimport numpy as np<br>\nfrom qiskit import QuantumCircuit<br>\ndef build_qft(n):<br>\n   circuit = QuantumCircuit(n)<br>\n   for j in reversed(range(n)):<br>\n       circuit.h(j)<br>\n       for k in reversed(range(j)):<br>\n           circuit.cp(np.pi * 2. ** (k - j), j, k)<br>\n   for j in range(n // 2):<br>\n       circuit.swap(j, n - j - 1)<br>\n   return circuit<br>\nqft = build_qft(5)But users who want to save time on this common quantum computing task can simply import the QFT from the circuit library and use it in their subroutines like so:<br>\nfrom qiskit.circuit.library import QFT<br>\nqft = QFT(5)Most Qiskit users are aware the circuit library exists, but not everyone realizes just how useful it can be. That’s why we suggest all users spend time familiarizing themselves with it. The circuit library provides essential tools for building quantum algorithms, and gives users the ability to write programs at a higher level of abstraction. Gates and other elements found in the circuit library are developed so that users can easily plug them into their own quantum circuits using the QuantumCircuit.append() method, meaning users shouldn’t need to concern themselves with the lower level details of how those elements actually work.<br>\nThe circuit library also provides tools that help users investigate properties of the quantum system itself, such as measuring quantum volume, and it offers useful information about the gates and circuits we use most often. It really is a library in the truest sense—in many cases; documentation for gates and other objects include links to a paper detailing the theory upon which they’re based.<br>\nNow, let’s take a look at some of the different kinds of circuits and gates that users will find in the Qiskit Circuit Library.<br>\nVariational quantum circuits (“N-local circuits”)<br>\nThe N-local circuits sub-module of the circuit library contains a selection of subclasses that serve as parameterized models in variational algorithms, such as the variational quantum eigensolver (VQE) algorithm and the quantum approximate optimization algorithm (QAOA).<br>\nIn fields like chemistry and physics, these algorithms serve to approximate wave functions efficiently, which is a task that is generally hard for classical computers. Variational algorithms are also useful for problems in classical optimization and machine learning, where a quantum computer might enable a better optimization of the objective.<br>\nLet’s take a look at an example of how to define a problem instance for a VQE algorithm, using the EfficientSU2 ansatz circuit taken from the circuit library. In this example, we’ll derive our Hamiltonian from a quantum chemistry problem:<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nhamiltonian = SparsePauliOp.from_list(<br>\n    [(\"YZ\", 0.3980), (\"ZI\", -0.3980), (\"ZZ\", -0.0113), (\"XX\", 0.1810)]<br>\n)As mentioned above, our choice of ansatz is the EfficientSU2 circuit. By default, the EfficientSU2 circuit linearly entangles qubits. This makes it ideal for use in quantum hardware with limited connectivity:<br>\nfrom qiskit.circuit.library import EfficientSU2<br>\nansatz = EfficientSU2(hamiltonian.num_qubits)<br>\nansatz.draw(\"mpl\")Here’s what the circuit looks like:<br>\nTry printing with the following code to see how the circuit is structured!<br>\nBased on the previous figure, we know that our ansatz circuit is defined by a vector of parameters, θi, with the total number given by:<br>\nnum_params = ansatz.num_parameters<br>\nprint(num_params)And in this case we get the output:<br>\n16For an example on how to use the circuit library to run a VQE, see: https://qiskit.org/ecosystem/algorithms/tutorials/01_algorithms_introduction.html<br>\nData encoding circuits<br>\nData encoding circuits enable the preparation of input data for QML applications. There are several techniques to encode classical data, or features, into a quantum state, for example:<br>\n- Amplitude encoding: Encode the features into the amplitude of a basis state. This allows to store 2^nnumbers in a single state, but can be costly to implement<br>\n- Basis encoding: Encode an integer kby preparing the corresponding basis state|k><br>\n- Angle encoding: Encode features as rotation angles in a variational quantum circuit<br>\nDeciding which of these approaches is best really depends upon the specifics of your application. On current quantum computers, however, we often use angle encoding.<br>\nOne example is the ZZFeatureMap found in the circuit library:<br>\nfrom qiskit.circuit.library import ZZFeatureMap<br>\nfeature = [0.2, 0.4, 0.8]<br>\nfeature_map = ZZFeatureMap(feature_dimension=len(feature))<br>\nencoded = feature_map.assign_parameters(feature)<br>\nencoded.draw('mpl')which prints<br>\nTry printing with the following code to see how the circuit is structured!<br>\nencoded.decompose().draw('mpl')For an example of how to use data encoding circuits for classication, see: https://qiskit.org/ecosystem/machine-learning/tutorials/02_neural_network_classifier_and_regressor.html.<br>\nTime evolution circuits<br>\nTime evolution circuits allow us to evolve a quantum state in time. Physics researchers make use of them for a wide-array of applications, including investigations of thermalization properties or potential phase transitions of a system. Time evolution circuits are also a fundamental building block of chemistry wave functions—e.g., for unitary coupled-cluster trial states—and of the QAOA algorithm we use for optimization problems.<br>\nfrom qiskit.circuit.library import PauliEvolutionGate<br>\nfrom qiskit.circuit import QuantumCircuit<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nhamiltonian = SparsePauliOp([\"ZZI\", \"IZZ\"])<br>\n# prepare an initial state with a Hamadard on the middle qubit<br>\nstate = QuantumCircuit(3)<br>\nstate.h(1)<br>\nevolution = PauliEvolutionGate(hamiltonian, time=1)<br>\n# evolve state by appending the evolution gate<br>\nstate.append(evolution)<br>\nstate.draw('mpl')And in this case we get the output:<br>\nBenchmarking and complexity theory circuits<br>\nBenchmarking and complexity theory circuits are a vital tool for anyone working with quantum computers. They give us a sense of how well our hardware is actually working, and the true level of computational complexity involved in the problems we want to solve.<br>\nOne of the most important examples of this is the QuantumVolume circuit, which allows us to quantify the largest random circuit of equal width and depth that a near-term quantum computer of relatively modest size can successfully implement. This single metric can help us understand how well the quantum computer is doing in terms of fidelity of operations, qubit connectivity, gate set calibration, and circuit rewiring tool chains.<br>\nA quantum volume model circuit comprises layers of Haar random elements of SU(4) applied between corresponding pairs of qubits in a random bipartition. Here’s an example of a quantum volume circuit built in Qiskit that runs on four qubits:<br>\nfrom qiskit.circuit.library import QuantumVolume<br>\nqv = QuantumVolume(4)<br>\nqv.decompose().decompose().draw('mpl')Some quantum circuits have been shown to deliver advantage over classical algorithms. Many readers will already be familiar with some of the more famous examples of these circuits, which include Shor’s algorithm for prime factorizationand the Grover search algorithm.<br>\nThe circuit library contains circuits that are conjectured to be hard to simulate classically, such as the IQP circuit. (Learn more about the IQP circuit here.)<br>\nIt also contains building blocks for algorithms that are believed to provide quantum advantage. Some of these are of a more practical nature. For example, Qiskit users can build the circuit for Grover’s algorithm by using GroverOperator.<br>\nOthers are of more theoretical interest. For example, Fourier checking uses the FourierChecking method. (Click here to learn more about Fourier checking.)<br>\nLet’s take a look at an example of the IQP circuit:<br>\nfrom qiskit.circuit.library import IQP<br>\ninteractions = [[6, 5, 3], [5, 4, 5], [3, 5, 1]]<br>\ncircuit = IQP(interactions)<br>\ncircuit.decompose().draw(\"mpl\")Arithmetic circuits<br>\nSome users may be surprised to learn that the circuit library includes numerous quantum circuits that are designed to perform classical arithmetic op
