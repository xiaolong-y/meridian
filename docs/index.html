  <title>Meridian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FFFCF0;
      --card: #F2F0E5;
      --text: #2D2B28;
      --dim: #6F6E69;
      --muted: #DAD8CE;
      --up: #66800B;
      --down: #AF3029;
      --accent: #205EA6;
      --spark: #8B5CF6;
      --score: #AD8301;
      --link: #24837B;
      --particle: #24837B;
    }

    html { font-size: 10px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding: 4px;
      min-height: 100vh;
      font-weight: 400;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 4px 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--muted);
    }

    .title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .timestamp { color: var(--dim); font-size: 9px; }

    .dashboard {
      position: relative;
    }

    .card-wrapper {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 2px;
      overflow: hidden;
      /* top, left, width set by JS layout engine */
    }

    .card-wrapper canvas {
      display: block;
      width: 100%;
    }

    .card-wrapper .links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card-wrapper .links a {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      color: transparent;
      text-decoration: none;
      display: block;
    }

    footer {
      margin-top: 8px;
      padding: 6px 4px;
      border-top: 1px solid var(--muted);
      text-align: center;
      color: var(--dim);
      font-size: 7px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .footer-links {
      margin-bottom: 6px;
    }

    .footer-links a {
      margin: 0 4px;
    }

    .ascii-footer {
      margin: 8px auto 4px;
      font-size: 8px;
      line-height: 1.1;
      color: var(--dim);
      opacity: 0.5;
      user-select: none;
      overflow: hidden;
      max-width: 400px;
    }

    .ascii-footer .particle {
      display: inline-block;
      color: var(--particle);
      opacity: 0.4;
    }

    .ascii-footer .meridian-text {
      color: var(--dim);
      letter-spacing: 1px;
    }

    @keyframes particleDrift {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.6; transform: translateY(-1px); }
    }

    .ascii-footer .p1 { animation: particleDrift 3s ease-in-out infinite; }
    .ascii-footer .p2 { animation: particleDrift 3s ease-in-out infinite 0.3s; }
    .ascii-footer .p3 { animation: particleDrift 3s ease-in-out infinite 0.6s; }
    .ascii-footer .p4 { animation: particleDrift 3s ease-in-out infinite 0.9s; }
    .ascii-footer .p5 { animation: particleDrift 3s ease-in-out infinite 1.2s; }
    .ascii-footer .p6 { animation: particleDrift 3s ease-in-out infinite 1.5s; }

    @media (prefers-reduced-motion: reduce) {
      .ascii-footer .particle {
        animation: none;
        opacity: 0.3;
      }
    }

    noscript p {
      text-align: center;
      padding: 20px;
      color: var(--dim);
      font-size: 9px;
    }
  </style>
</head>

n on IBM Hardware","url":"read/13cf0da19760fb4c.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"1h"},{"id":"5cb4257756e323f5","title":"IBM Launches Unified Quantum Safe Software Suite to Automate Enterprise PQC Migration","url":"read/5cb4257756e323f5.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"2h"},{"id":"72f66e6e719453da","title":"Sandia and Quantinuum Introduce Logical Gate Set Tomography to Map Fault-Tolerant Qubit Noise","url":"read/72f66e6e719453da.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"14h"},{"id":"c37cbe4be9ba0a89","title":"Quantinuum Chief Scientist Argues Physical Fidelity Trumps Gate Speed in Fault-Tolerant Scaling Race","url":"read/c37cbe4be9ba0a89.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"14h"},{"id":"797bb4783160fe6e","title":"Forschungszentrum Jülich Demonstrates 6.8-Nanosecond Single-Qubit Gates with > 99.98% Fidelity via Multi-Photon Leakage Suppression","url":"read/797bb4783160fe6e.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"14h"},{"id":"2e892dbfcffa8696","title":"Lumen Expands Quantum Footprint with Ohio State Fiber Research and Fortinet PQC SASE Rollout","url":"read/2e892dbfcffa8696.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"14h"}]}],"card_order":[{"type":"metric","index":0},{"type":"metric","index":1},{"type":"feed","id":"hn_tech"},{"type":"metric","index":2},{"type":"metric","index":3},{"type":"metric","index":4},{"type":"feed","id":"hn_ai"},{"type":"metric","index":5},{"type":"metric","index":6},{"type":"metric","index":7},{"type":"feed","id":"hn_startups"},{"type":"metric","index":8},{"type":"feed","id":"rss_quantum"}],"rss_entries":[{"id":"1fa06083b93ba5b3","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48355","title":"University of Stuttgart Deploys Quantum Dot QKD Link Using Frequency Conversion Over Campus Fiber","url":"https://quantumcomputingreport.com/university-of-stuttgart-deploys-quantum-dot-qkd-link-using-frequency-conversion-over-campus-fiber/","summary":"The University of Stuttgart, in collaboration with Saarland University and Leibniz IFW Dresden, successfully deployed an entanglement-based quantum key distribution (QKD) link using a quantum dot photon source. The system generated 14.2 Mbit of secure key material over a 1.59 km fiber link, achieving one-time pad image encryption. This demonstrates the viability of quantum dots with frequency conversion for metropolitan quantum key networks. The post University of Stuttgart Deploys Quantum Dot Q","content":"<p>In a preprint titled Deployed entanglement-based BBM92 quantum key distribution using frequency-converted photons emitted by a quantum dot, a collaborative team led by the University of Stuttgart alongside Saarland University and Leibniz IFW Dresden has demonstrated field-deployed entanglement-based quantum key distribution (QKD) using an epitaxial quantum dot photon source. Operating under a 1 GHz optical excitation rate over a 1.59 km installed fiber link on the Stuttgart-Vaihingen campus, the system generated 14.2 Mbit of secure key material to perform one-time pad image encryption.<br>\n| Stuttgart Deployed Quantum Dot QKD Operational Parameters |  |  | <br>\n|---|---|---|<br>\n| System Dimension | Reported Specification | Network & Cryptographic Role | <br>\n| Quantum Dot Emitter | Epitaxial droplet-etched GaAs (779.8 nm) | Generates polarization-entangled pairs via resonant two-photon biexciton-exciton (XX–X) cascade. | <br>\n| Fine-Structure Splitting (δ) | 2.1 ± 0.3 μeV | Yields a 91.4% fidelity to the \\|Φ+⟩ Bell state within a 275 ps coincidence window. | <br>\n| Wavelength Conversion | Sagnac QFC (779.8 nm → 1515 nm) | Translates biexciton photons to the telecom C-band with up to 50% internal efficiency. | <br>\n| Deployed Fiber Channel | 1.59 km campus link (1.09 dB total loss) | Connects IHFG lab to a 19-inch receiver rack at TIK with automated motorized polarization tracking. | <br>\n| Throughput & Error Rate | Raw: 504 Hz \\| Secure: 206 Hz | Maintains an average QBER of 4.70% (well below the 11% BBM92 security threshold). | <br>\n| Post-Processing Pipeline | 5,000-bit LDPC blocks & Toeplitz hashing | Achieves an effective error correction and privacy amplification retention ratio of 40.87%. | <br>\nMost field-deployed QKD networks rely on Poisson-distributed sources—such as attenuated lasers or spontaneous parametric down-conversion (SPDC)—which face intrinsic trade-offs between emitter brightness and multi-photon emission probabilities. While epitaxial quantum dots provide deterministic, sub-Poissonian emission, their native wavelengths lie outside standard telecommunication windows. The Stuttgart team bridged this gap by integrating a broadband antenna-coupled GaAs quantum dot with a polarization-preserving Sagnac frequency converter, transferring one photon of each entangled pair into low-loss silica fiber while preserving polarization correlations.<br>\nThe network executed the entanglement-based BBM92 protocol using passive 50:50 beam splitters to select between conjugate (Z) and (X) measurement bases, with a multi-photon squashing model to mitigate side-channel risks. Coincidence window optimization identified an operational balance at 275 ps: widening the gate captures more radiative decay events but elevates error rates from fine-structure precession and conversion noise. Motorized waveplates executing hourly polarization probes maintained Stokes parameters above 0.995 throughout 19 hours of continuous operation, with minor throughput declines isolated to thermal detuning in a 25 GHz volume Bragg grating filter. The experiment establishes quantum dots paired with frequency conversion as viable transmitters for metropolitan quantum key networks.<br>\nThe manuscript is available on arXiv here.<\/p>","content_hash":"7d806c937b65b59090936190d1cca486","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T15:04:57","fetched_at":"2026-10-31 16:43:14","word_count":462,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1h","domain":"quantumcomputingreport.com"},{"id":"b5b09b8bb2c3666b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48351","title":"Chalmers University Demonstrates Hardware-Level Microwave Crosstalk Suppression via Parasitic Capacitance Engineering","url":"https://quantumcomputingreport.com/chalmers-university-demonstrates-hardware-level-microwave-crosstalk-suppression-via-parasitic-capacitance-engineering/","summary":"Physicists at Chalmers University of Technology have developed a new method to eliminate microwave crosstalk in superconducting processors. Their research shows that by engineering on-chip parasitic capacitances, they can achieve destructive interference among parasitic capacitive channels, suppressing unwanted qubit excitations. This method offers a practical advantage for floating transmons and allows for alignment of classical microwave crosstalk nulls with quantum ZZ nulls. The post Chalmers","content":"<p>Physicists at Chalmers University of Technology have demonstrated an architectural layout method to eliminate classical microwave drive crosstalk in superconducting processors by engineering on-chip parasitic capacitances. Detailed in a preprint titled Suppressing microwave crosstalk in superconducting quantum processors by designing parasitic drive capacitances, the study challenges conventional assumptions by showing that microwave crosstalk suppression does not originate from cancelling effective exchange coupling (Jeff = 0), but from multi-path destructive interference among parasitic capacitive channels across drive lines, qubits, and tunable couplers.<br>\nIn multi-qubit superconducting architectures, pulsing an XY drive line to control a target qubit induces spurious excitations and AC Stark phase shifts in neighboring victim qubits. Standard design heuristics assume that tuning a coupler to eliminate the exchange interaction (Jeff = 0) concurrently minimizes drive crosstalk. Using a test chip with two fixed-frequency floating transmons (Q1 at 4.752 GHz, Q2 at 4.658 GHz) linked via a flux-tunable grounded transmon coupler, the Chalmers team found that the cross-Rabi minimum occurred roughly 300 MHz away from the Jeff = 0 operating frequency (3.665 GHz).<br>\n| Chalmers Two-Qubit Transmon Device & Crosstalk Model Parameters |  |  | <br>\n|---|---|---|<br>\n| Architecture Dimension | Measured / Extracted Parameter | Hardware & Modeling Role | <br>\n| Qubit Frequencies | Q1: 4.752 GHz \\| Q2: 4.658 GHz | Fixed-frequency floating transmons with ~240 MHz negative anharmonicity. | <br>\n| Tunable Coupler | Grounded transmon (max ωc / 2π = 4.93 GHz) | Mediates static ZZ coupling and exchange interactions via flux bias. | <br>\n| Crosstalk vs. Jeff Shift | Δf ≈ 0.3 GHz offset | Confirms cross-Rabi null occurs independently of qubit-qubit coupling cancellation. | <br>\n| Parasitic Capacitance Scale | Cdc ≈ 18–30 aF \\| Cd,victim ≈ 2–10 aF | Attofarad-scale paths whose interference dictates the crosstalk null. | <br>\n| Off-Resonant Suppression | Pmax reduced by orders of magnitude | Suppresses unwanted state populations on victim qubits during single-qubit gates. | <br>\nUsing a time-independent Hamiltonian derived via a first-order high-frequency expansion, the authors modeled the dressed drive amplitude at the victim qubit (Θm) as a coherent sum of three distinct channels: direct drive-to-target coupling, stray drive-to-coupler capacitance (Cdc), and stray drive-to-victim capacitance (Cd,victim). Sizing these parasitic capacitances allows the direct and coupler-mediated signals to arrive at the victim qubit with opposing phases, yielding a complete destructive cancellation (Θvictim = 0).<br>\nThe comparative analysis highlighted a pronounced practical advantage for floating transmons over grounded architectures. In floating configurations, the crosstalk-null frequencies for opposing drive lines shift with the same slope sign as parasitic capacitances vary, providing the lithographic leeway needed to align bidirectional nulls. In grounded transmons, the null frequencies shift in opposite directions, requiring impractically tight fabrication margins. Furthermore, because tunable couplers possess bias points where static ZZ interactions vanish, parasitic capacitances can be laid out geometrically so that the classical microwave crosstalk null aligns with the quantum ZZ null at the identical operating flux.<br>\nThe preprint is available on arXiv here.<\/p>","content_hash":"60ba17f1419e00c1677efcc016fd6859","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T14:58:16","fetched_at":"2026-10-31 16:43:14","word_count":492,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1h","domain":"quantumcomputingreport.com"},{"id":"13cf0da19760fb4c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48347","title":"Los Alamos and QC Ware Model Correlated Iron Oxides Using Sample-Based Quantum Diagonalization on IBM Hardware","url":"https://quantumcomputingreport.com/los-alamos-and-qc-ware-model-correlated-iron-oxides-using-sample-based-quantum-diagonalization-on-ibm-hardware/","summary":"Researchers from Los Alamos National Laboratory and QC Ware developed a hybrid quantum-classical workflow to simulate strongly correlated transition metal oxides. They used Sample-based Quantum Diagonalization (SQD) on IBM Quantum hardware, coupled with ab initio-informed d–p tight-binding models, to achieve chemical accuracy in modeling diatomic iron monoxide (FeO) and rhombic iron oxide dimers (Fe2O2). This method successfully recovered experimental ground states and outperformed traditional c","content":"<p>In a preprint titled Towards Quantum Computation of Bulk FeO, researchers from Los Alamos National Laboratory (LANL) and QC Ware present a hybrid workflow simulating strongly correlated transition metal oxides on quantum processors. Benchmarked on diatomic iron monoxide (FeO) and rhombic iron oxide dimers (Fe2O2), the team coupled ab initio-informed d–p tight-binding models with Sample-based Quantum Diagonalization (SQD) on IBM Quantum’s ibm_miami system, using near-term hardware purely as a Fock-space sampler to reach chemical accuracy where standalone Variational Quantum Eigensolver (VQE) optimizations stall.<br>\n| LANL / QC Ware Correlated Electronic Structure Benchmarks |  |  | <br>\n|---|---|---|<br>\n| System Dimension | FeO Diatomic Molecule | Fe2O2 Rhombic Dimer | <br>\n| Active Space & Qubit Footprint | 12 electrons in 16 spin orbitals (16 qubits) | 24 electrons in 32 spin orbitals (32 qubits) | <br>\n| Hardware Multiplexing ( ibm_miami) | 6 parallel instances across 96 qubits | 3 parallel instances across 96 qubits | <br>\n| Ansatz Architecture | 1-layer LUCJ (120 variational parameters) | 1-layer LUCJ (496 variational parameters) | <br>\n| Raw VQE Performance | Residual error ΔE ≈ 173 meV (exceeds 43 meV limit) | Trapped in nonlinear variational parameter manifold | <br>\n| SQD Post-Processing | Ground doublet recovered in 184 determinants (< 43 meV) | Chemical accuracy achieved via 1-shell expansion | <br>\n| Physical State Recovered | Experimental quintet (5Δi); ΔEexc ≈ 2,167 cm−1 | Nonet magnetic ground state (MS = 4 sector) | <br>\nBulk FeO is an archetypal Mott insulator whose strong electronic correlations cause conventional density functional theory (DFT) to mischaracterize it as metallic. To make these open-shell systems computationally tractable, the authors extracted localized Wannier functions from non-spin-polarized DFT calculations to build multi-orbital d–p Hamiltonians. Variational states were parameterized using a one-layer Local Unitary Cluster Jastrow (LUCJ) ansatz, which restricts two-mode Givens rotations to nearest-neighbor connectivity to eliminate non-local SWAP overheads.<br>\nTo bypass on-hardware barren plateaus, circuit parameters were optimized in classical statevector simulations and deployed to frozen QPUs strictly for configuration sampling. Measured bitstrings post-selected for particle-number conservation were then expanded into one- and two-shell Fock-space graphs based on non-zero Hamiltonian matrix elements. Classical exact diagonalization of the resulting projected Hamiltonian converged rapidly: two connectivity shells recovered the experimental 5Δi quintet state for FeO within a compressed subspace of 184 determinants, yielding an excitation energy of 2,167 cm−1 (substantially outperforming prior multireference configuration interaction baselines that predicted 300 cm−1). The methodology establishes a blueprint for modeling bulk periodic FeO by distributing SQD sub-blocks across Brillouin zone k-points.<br>\nThe preprint is accessible on arXiv here.<\/p>","content_hash":"d33c14b1fe4cd5ad3fedba8e61e28ce5","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T14:48:46","fetched_at":"2026-10-31 16:43:14","word_count":427,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1h","domain":"quantumcomputingreport.com"},{"id":"5cb4257756e323f5","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48343","title":"IBM Launches Unified Quantum Safe Software Suite to Automate Enterprise PQC Migration","url":"https://quantumcomputingreport.com/ibm-launches-unified-quantum-safe-software-suite-to-automate-enterprise-pqc-migration/","summary":"IBM has launched IBM Quantum Safe, a software suite designed to help enterprises migrate to post-quantum cryptography (PQC). This platform offers tools for strategic assessment, automated source-code discovery, and dynamic network mediation. It aims to address the challenge of identifying and remediating cryptographic vulnerabilities in existing IT infrastructure, enabling organizations to transition to PQC in anticipation of federal migration deadlines. The post IBM Launches Unified Quantum Saf","content":"<p>Coinciding with the publication of NIST’s final migration roadmap (NIST IR 8547), IBM has commercially released IBM Quantum Safe at its annual TechXchange conference. The unified software portfolio integrates strategic assessment, automated source-code discovery, and dynamic network mediation to transition enterprise IT estates toward post-quantum cryptography (PQC). Building on IBM’s earlier deployment of Guardium Cryptography Manager in 2025, the platform is designed to assist commercial enterprises and government agencies in meeting binding federal migration deadlines starting in 2030.<br>\nIBM Quantum Safe Platform Architecture<br>\nModular Solution<br>\nFunctional Scope & Tooling<br>\nEnterprise Remediation Role<br>\nQuantum Safe Explorer<br>\nSource-code scanning & CBOM generation<br>\nParses application code to identify hardcoded cryptographic algorithms, anti-patterns, and API dependencies within DevSecOps pipelines.<br>\nQuantum Safe Cryptography Manager<br>\nOperational estate discovery & posture governance<br>\nCatalogs cryptographic assets across servers, network endpoints, and cloud infrastructure to prioritize migration sequences.<br>\nQuantum Safe Proxy<br>\nDual-protocol network mediation<br>\nIntermediates traffic between legacy systems and post-quantum clients/servers without immediate application refactoring.<br>\nThe operational bottleneck in post-quantum modernization rarely lies in the algorithms themselves, but rather in finding where vulnerable public-key dependencies reside across millions of lines of legacy code and sprawling hybrid IT estates. To validate the tooling prior to commercial release, IBM applied Quantum Safe Explorer internally across its own CIO office, scanning more than 47 million lines of code across 5,815 software repositories and identifying over 3,900 cryptographic issues for remediation. By combining automated Cryptography Bill of Materials (CBOM) generation with a network-level proxy layer, the platform enables organizations to address “harvest now, decrypt later” (HNDL) exposure in transit before undergoing multi-year core application rebuilds.<br>\nThe release operationalizes technical migration guidelines established in QCR’s previous coverage of NIST IR 8547 here. Commercial licensing and platform trials are available via IBM Quantum Safe here and the official IBM Announcement here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"bf2b97c3b2681eeb5801a5c0f658a1bb","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T14:21:27","fetched_at":"2026-10-31 16:43:15","word_count":380,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2h","domain":"quantumcomputingreport.com"},{"id":"72f66e6e719453da","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48338","title":"Sandia and Quantinuum Introduce Logical Gate Set Tomography to Map Fault-Tolerant Qubit Noise","url":"https://quantumcomputingreport.com/sandia-and-quantinuum-introduce-logical-gate-set-tomography-to-map-fault-tolerant-qubit-noise/","summary":"Researchers from Sandia National Laboratories and Quantinuum have introduced \"Logical GST,\" a protocol that provides the first self-consistent, full tomographic reconstruction of a universal single-qubit logical gate set. This was implemented on a single logical qubit encoded in the [[7, 1, 3]] Steane code on the Quantinuum System Model H1-1. The study confirmed the assumption that quantum error correction converts complex physical noise into simple, uncorrelated Pauli-stochastic channels, but h","content":"<p>In a joint study published on arXiv under the title Logical Gate Set Tomography, researchers from Sandia National Laboratories and Quantinuum have introduced “Logical GST.” Executed as the final experimental campaign on the 20-qubit trapped-ion Quantinuum System Model H1-1, the work provides the first self-consistent, full tomographic reconstruction of a universal single-qubit logical gate set, extending physical-layer characterization protocols to encoded, fault-tolerant operations.<br>\nThe protocol was implemented on a single logical qubit encoded in the [[7, 1, 3]] Steane code, using seven data qubits and six syndrome degrees of freedom. While standard logical benchmarking often relies on software-based Pauli-frame tracking—which can artificially twirl and mask coherent phase errors—the team executed active quantum error correction via real-time classical feedforward, applying physical correction pulses directly to the ions inside the gate zones. The characterized gate set comprised logical state initialization (|0⟩L), terminating measurement (MZ,L), transversal Clifford gates (HL, SL, IL), and a non-transversal TL gate implemented via magic-state injection and teleportation (achieving a 95.9% acceptance rate per attempt).<br>\n| Quantinuum H1-1 Logical Gate Set Tomography Specifications |  |  | <br>\n|---|---|---|<br>\n| Logical Operation | Entanglement Infidelity (εF) | Diamond Distance Error (ε⋄) | <br>\n| Hadamard (HL) | 0.7 ± 0.4% | 1.3 ± 1.9% | <br>\n| Phase (SL) | 0.2 ± 0.4% | 1.3 ± 2.5% | <br>\n| Identity / QEC Cycle (IL) | 1.7 ± 9.2% | 3.2 ± 16.8% | <br>\n| Non-Clifford (TL) | 1.2 ± 1.5% | 2.1 ± 3.9% | <br>\n| Initialization (\\|0⟩L) | 0.0 ± 2.3% (State Infidelity) | — | <br>\n| Measurement (MZ,L) | 0.1 ± 1.4% | 0.7 ± 2.1% | <br>\nFault-tolerant threshold theorems typically assume that quantum error correction converts complex physical noise into simple, uncorrelated Pauli-stochastic channels (independent bit and phase flips). In the experimental H1-1 dataset (Nshots = 50 across 158 compressed circuits), Logical GST confirmed this assumption: the data aligned with a Pauli-stochastic model (NσS < 1) with no statistically significant non-Markovian memory effects (NσCPTP < 2). However, because low shot counts limit statistical resolution, the authors duplicated the protocol across 14,100-shot simulations using Quantinuum’s high-fidelity H1-1E emulator.<br>\nThe high-shot emulation revealed small but statistically significant logical non-Markovianity (NσCPTP ≈ 4.9) and definitive evidence of coherent logical over-rotations (Δθ ≈ 0.0015π on SL, IL, and TL). By systematically toggling error channels in the emulator, the researchers proved that physical dephasing accumulated during ion transport and sympathetic cooling serves as the primary mechanism generating coherent logical drift. Furthermore, the analysis demonstrated that non-Markovian dynamics can emerge directly from the syndrome extraction cycles of completely Markovian physical noise. The methodology provides a platform-agnostic framework to verify whether scaling fault-tolerant QPUs conform to the noise models required by modern decoders.<br>\nThe research paper is accessible on arXiv here, with corporate commentary shared via Quantinuum’s Technical Announcement here.<\/p>","content_hash":"599e096054e2eb20157ff9d4c16e6a70","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T02:40:36","fetched_at":"2026-10-31 16:43:15","word_count":471,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"c37cbe4be9ba0a89","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48334","title":"Quantinuum Chief Scientist Argues Physical Fidelity Trumps Gate Speed in Fault-Tolerant Scaling Race","url":"https://quantumcomputingreport.com/quantinuum-chief-scientist-argues-physical-fidelity-trumps-gate-speed-in-fault-tolerant-scaling-race/","summary":"Quantinuum's Chief Scientist, Harry Buhrman, argues that high physical fidelity in quantum gates is more critical than raw gate speed for achieving fault-tolerant quantum computing. He highlights Quantinuum's trapped-ion architecture as superior to superconducting platforms due to its low error rates, which significantly reduce the resources needed for quantum error correction. While trapped-ion systems currently have slower gate speeds, Quantinuum aims to overcome this limitation by 2029 to mak","content":"<p>In a technical essay titled Fidelity First in the Quantum Race, Quantinuum Chief Scientist Harry Buhrman challenges the quantum industry’s emphasis on nanosecond-scale physical gate speeds, arguing that high physical fidelity is the primary parameter governing practical time to solution. Positioning Quantinuum’s 98-qubit trapped-ion architecture against superconducting platforms, Buhrman asserts that raw gate speed without sub-threshold operation simply generates computational faults faster. In contrast, higher physical fidelity drastically cuts the physical qubit overhead, code distances, and space-time volume required for quantum error correction (QEC)—building directly on findings detailed in QCR’s coverage of Quantinuum’s 99.9995% logical memory fidelity on Helios.<br>\n| Quantinuum Architectural Metrics and Performance Benchmarks |  |  | <br>\n|---|---|---|<br>\n| System Dimension | Reported Metric / Platform | Architectural Significance | <br>\n| Physical Gate Fidelity | 99.9975% 1Q / 99.921% 2Q (Helios, 98 Qubits) | Pushes physical operations far below the fault-tolerance threshold on all-to-all connected ions. | <br>\n| Color-Code Scaling | Λ = 12 error suppression per Δd = 2 | Achieves a 5.0 × 10−6 logical failure rate per cycle on distance-7 codes (arXiv:2610.24077). | <br>\n| QUOPS Reach Metric | Superior circuit “Reach” vs. Google Willow & IBM Boston | Successfully completes larger unmitigated circuits before accumulating unrecoverable phase or bit errors. | <br>\n| Error-Mitigation Penalty | Up to 1,000× effective slowdown on QPUs | Highlights the exponential sampling overhead incurred when noisy superconducting chips rely on classical mitigation. | <br>\nThe essay frames the divergence between trapped-ion and superconducting roadmaps through the Quantum Universal Operations Performance System (QUOPS) benchmark, which pairs computational “reach” (circuit volume executed reliably) with effective wall-clock operational speed. Buhrman argues that while superconducting systems achieve higher operations per second on small, localized circuits, extending them to utility-scale algorithms requires error-mitigation protocols that compound sampling runs, making effective execution thousands of times slower. Conversely, operating trapped-ion systems with low physical error rates enables exponential logical error suppression under 2D color codes, minimizing the space-time volume required for fault-tolerant algorithms like FeMoco ground-state modeling or RSA factorization.<br>\nHowever, prioritizing fidelity over raw gate duration leaves trapped-ion hardware with distinct engineering bottlenecks. Physical gate times in shuttled trapped-ion lattices (typically measured in tens to hundreds of microseconds) remain orders of magnitude slower than superconducting circuits (operating in nanoseconds). To make its planned fault-tolerant Apollo system commercially competitive by 2029, Quantinuum must accelerate ion shuttling velocities, laser-cooling cycle durations, and real-time streaming syndrome decoding without inducing vibrational heating that erodes its physical fidelity baseline.<br>\nThe full perspective is available on the Quantinuum Technical Blog here, with underlying error-correction data accessible via arXiv here.<\/p>","content_hash":"16f29a2b51833f2010427d36f9af0439","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T02:26:32","fetched_at":"2026-10-31 16:43:15","word_count":432,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"797bb4783160fe6e","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48326","title":"Forschungszentrum Jülich Demonstrates 6.8-Nanosecond Single-Qubit Gates with > 99.98% Fidelity via Multi-Photon Leakage Suppression","url":"https://quantumcomputingreport.com/forschungszentrum-julich-demonstrates-6-8-nanosecond-single-qubit-gates-with-99-98-fidelity-via-multi-photon-leakage-suppression/","summary":"Physicists at Forschungszentrum Jülich, RWTH Aachen University, and the University of Cologne have achieved record-breaking 6.8-nanosecond single-qubit gate operations with over 99.98% fidelity on a superconducting transmon processor. Their \"R2D\" pulse-shaping method effectively suppresses multi-photon leakage, allowing for ultrafast gates while maintaining high fidelity. This advancement, detailed in Nature Communications, marks a significant step in quantum computing, though scaling to multi-q","content":"<p>Physicists at Forschungszentrum Jülich, RWTH Aachen University, and the University of Cologne have achieved single-qubit gate operations lasting 6.8 nanoseconds with gate fidelities exceeding 99.98% on a superconducting transmon processor. Detailed in Nature Communications under the title Ultrafast single-qubit gates through multi-photon transition removal, the study introduces the “R2D” pulse-shaping method to suppress multi-photon leakage into non-computational states (|2⟩ and |3⟩) in the strongly driven regime. Conducted within the German national QSOLID project, the work sets a speed record for high-fidelity transmon operations by cutting unwanted leakage transitions by more than a factor of 20 compared to standard DRAG protocols.<br>\n| Forschungszentrum Jülich Ultrafast Transmon Gate Benchmarks |  |  | <br>\n|---|---|---|<br>\n| Gate Metric / Parameter | Demonstrated Value / Configuration | Physical & Control Significance | <br>\n| Gate Duration (tp) | 6.8 ns (for both X and X/2 gates) | Compresses microwave drive times down to the strongly driven regime (Ω / \\|Δ\\| = 0.33). | <br>\n| Average Gate Fidelity | 99.981% (X gate) / 99.989% (X/2 gate) | Characterized via interleaved randomized benchmarking; total error remains decoherence-limited. | <br>\n| Leakage Rate (εleak) | < 2.0 × 10−5 per gate operation | Suppresses coherent leakage to \\|2⟩ and \\|3⟩ below 0.002%, preventing correlated error-correction faults. | <br>\n| Pulse Correction Architecture | R2D (Double Recursive DRAG) | Uses second-derivative filtering to notch out two-photon spectral components in ΩR2. | <br>\n| Metrology Protocol | Amplified Leakage Error (ALE) | Coherently accumulates state leakage to quantify non-computational transitions down to 10−6. | <br>\nIn weakly anharmonic superconducting transmons (operating here at Δ / 2π = −225 MHz), driving gates faster requires increasing microwave power. In this strongly driven limit, the drive field shifts the qubit’s dressed eigenstates, causing direct two-photon transitions (|0⟩ → |2⟩ and |1⟩ → |3⟩) that bypass traditional selection rules and degrade conventional Derivative Removal by Adiabatic Gate (DRAG) corrections. The Jülich team’s R2D method introduces a double recursive derivation that nulls spectral components at multi-photon transition frequencies using three in-situ optimized parameters (α12, α02, α13). Paired with an Amplified Leakage Error (ALE) sequence that isolates coherent leakage from thermal excitations, the protocol pushes gate speed while keeping coherent control errors well below the environmental decoherence floor (T1 = 40 μs, T2Echo = 56 μs).<br>\nWhile the 6.8-nanosecond gate addresses single-qubit limits on isolated transmons, scaling the technique across multi-qubit lattices introduces practical compiler hurdles. Operating at normalized drive strengths of Ω / |Δ| = 0.33 risks spectator-qubit dephasing, microwave cross-talk, and frequency crowding across densely packed planar chips. Adapting R2D to multi-qubit systems will require integrating multi-frequency spectral notch filters into automated calibration pipelines and evaluating whether similar recursive pulse corrections can mitigate leakage during nanosecond-scale two-qubit entangling gates.<br>\nThe complete peer-reviewed paper is available in Nature Communications here, with institutional background provided by Forschungszentrum Jülich here.<\/p>","content_hash":"c5f9d69270e57f06598315c67efcd1c5","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T02:01:28","fetched_at":"2026-10-31 16:43:15","word_count":475,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"2e892dbfcffa8696","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48322","title":"Lumen Expands Quantum Footprint with Ohio State Fiber Research and Fortinet PQC SASE Rollout","url":"https://quantumcomputingreport.com/lumen-expands-quantum-footprint-with-ohio-state-fiber-research-and-fortinet-pqc-sase-rollout/","summary":"Lumen Technologies is advancing quantum technology with two new initiatives. They are partnering with The Ohio State University to research quantum network transport over commercial optical fiber, and integrating Fortinet's post-quantum cryptography into their SASE solution to enhance enterprise security. These efforts aim to overcome challenges in quantum signal transmission and protect against future decryption threats. The post Lumen Expands Quantum Footprint with Ohio State Fiber Research an","content":"<p>Tier-1 network provider Lumen Technologies (NYSE: LUMN) has announced initiatives targeting quantum network transport and enterprise post-quantum cryptographic migration. The deployment pairs an academic research partnership with The Ohio State University (OSU) to evaluate non-classical light transmission across commercial optical fiber with a product roadmap update integrating Fortinet’s post-quantum cryptography (PQC) into Lumen’s managed Secure Access Service Edge (SASE) solution.<br>\n| Lumen Quantum Infrastructure and Security Architecture |  |  | <br>\n|---|---|---|<br>\n| Operational Domain | Partner / Technology Layer | Technical Mandate & Milestones | <br>\n| Terrestrial Quantum Transport | The Ohio State University (OSU) | Investigates long-range single-photon and entangled state propagation over deployed optical fiber footprints. | <br>\n| Distributed Quantum Sensing | Interferometric Fiber Diagnostics | Evaluates quantum sensing protocols along optical corridors to monitor seismic shifts and cable strain. | <br>\n| Enterprise PQC Integration | Fortinet (FortiOS / FortiGate) | Embeds NIST-standardized key encapsulation and signature primitives into Lumen’s managed SASE edge. | <br>\n| Commercial Availability | Enterprise Phased Rollout | Customer preview starting November 2026; General Availability (GA) planned for January 2027. | <br>\nConnecting geographically separated quantum computing clusters presents a physical challenge: the quantum no-cloning theorem prohibits the use of standard erbium-doped fiber amplifiers (EDFAs) to boost optical signals, leaving fiber loss and polarization drift as severe transmission ceilings. Lumen’s research funding with Ohio State will assess how commercial, field-deployed fiber bundles handle non-classical photonic states, establishing empirical channel bounds for optical repeaters and dispersion management. Concurrently, the project tests distributed quantum sensing techniques, using optical noise backscatter to detect environmental fluctuations and seismic anomalies that degrade physical fiber health.<br>\nAt the software layer, Lumen is addressing harvest-now, decrypt-later (HNDL) exfiltration risks by embedding Fortinet’s PQC libraries—standardized under FIPS 203 (ML-KEM) and FIPS 204 (ML-DSA)—directly into its SASE edge infrastructure. The integrated service aims to give enterprise customers a crypto-agile path to transition corporate wide-area networks away from vulnerable RSA and elliptic-curve cryptography without overhauling underlying hardware. Alongside these efforts, Lumen also announced an exploratory pilot with Emerald AI to dynamically steer AI compute workloads across its network based on power grid availability.<br>\nTechnical and commercial program details are documented in the official Lumen Announcement here.<\/p>","content_hash":"6a90a2a23ef03fed6f35d1946299544e","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T01:48:41","fetched_at":"2026-10-31 16:43:15","word_count":367,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"5160a37b8d5780f9","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48318","title":"TU Delft Achieves Direct Single-Atom Nuclear Magnetic Resonance via Scanning Tunneling Microscope Probe","url":"https://quantumcomputingreport.com/tu-delft-achieves-direct-single-atom-nuclear-magnetic-resonance-via-scanning-tunneling-microscope-probe/","summary":"TU Delft physicists have achieved direct nuclear magnetic resonance (NMR) control over a single surface-adsorbed atom, specifically a 47Ti atom. This was accomplished using an Electron-Nuclear Double Resonance (ENDOR) measurement scheme within an ultra-low-temperature scanning tunneling microscope. This breakthrough allows for coherent nuclear addressing without relying on electron-nuclear spin hybridization, opening doors for atomic-scale quantum memory registers and high-dimensional qudits. Th","content":"<p>Physicists at Delft University of Technology’s Kavli Institute of Nanoscience have demonstrated direct nuclear magnetic resonance (NMR) control over a single surface-adsorbed atom, achieving coherent nuclear addressing without relying on electron-nuclear spin hybridization. Published in Nature Communications under the title Nuclear magnetic resonance on a single atom with a local probe, the study introduces an Electron-Nuclear Double Resonance (ENDOR) measurement scheme into an ultra-low-temperature (0.4 K) scanning tunneling microscope (STM). The demonstration verifies that an isolated nuclear spin can be driven directly by local radio-frequency fields at high magnetic fields, opening an avenue for atomic-scale quantum memory registers and high-dimensional qudits.<br>\n| Single-Atom ENDOR Architecture and Physical Parameters |  |  | <br>\n|---|---|---|<br>\n| Parameter | Experimental Specification | Quantum Hardware Significance | <br>\n| Physical Platform | Isolated 47Ti atom on bilayer MgO/Ag(100) | Couples an S = 1/2 electronic spin to an I = 5/2 nuclear spin (6-level system). | <br>\n| Excitation Scheme | Dual-frequency ENDOR (GHz ESR + MHz NMR) | Separates the electronic readout channel from direct nuclear state manipulation. | <br>\n| Decoupled Field Regime | Bz = 200 mT to 1,400 mT (1.4 Tesla) | Suppresses electron-nuclear hybridization by ~10×, preserving intrinsic nuclear lifetimes. | <br>\n| State Selectivity | Quadrupole splitting (Q = −2.8 ± 0.8 MHz) | Lifts transition degeneracy, allowing independent addressing of nuclear spin sublevels. | <br>\n| Dominant Drive | RF electric-field-induced oscillating magnetic field | Enables transitions without needing system-dependent hyperfine or quadrupole modulation. | <br>\nBecause atomic nuclei have magnetic moments roughly three orders of magnitude smaller than electrons, they remain well shielded from environmental noise, yielding surface relaxation lifetimes on the order of seconds. Historically, addressing single nuclear spins with an STM required strong hyperfine hybridization at low fields (≤ 100 mT), which mixes the states and collapses that environmental isolation. By scaling magnetic fields up to 1.4 T, the Delft team operated where the electronic Zeeman energy dominates, demonstrating that the 47Ti nucleus can still be driven in the 50–85 MHz range while the GHz electronic channel provides spin-polarized readout. While full coherent quantum gate control will require pulsed-wave sequencing rather than continuous RF driving, the platform proves that atomic-scale nuclear qudits can be integrated into engineered surface lattices.<br>\nTechnical details and spectroscopy datasets are published in Nature Communications here, with institutional perspectives outlined via the TU Delft News Release here.<\/p>","content_hash":"35bcb65cf159872879f8899bf29f84da","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T01:40:53","fetched_at":"2026-10-31 16:43:16","word_count":397,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"15h","domain":"quantumcomputingreport.com"},{"id":"f318e4ba87f52acf","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48314","title":"IQM Verifies Full-Chip Entanglement Across 54-Qubit Emerald Superconducting Processor","url":"https://quantumcomputingreport.com/iqm-verifies-full-chip-entanglement-across-54-qubit-emerald-superconducting-processor/","summary":"IQM Quantum Computers has successfully demonstrated full-chip entanglement across all 54 qubits of its IQM Emerald processor, a significant advancement in quantum computing. This achievement validates full-lattice coherence on commercial hardware, with measured state fidelities exceeding the genuine multipartite entanglement threshold. The company utilized an automated scheduling compiler and dynamical decoupling to achieve this milestone, highlighting both progress and the ongoing challenges in","content":"<p>IQM Quantum Computers (Nasdaq: IQMX) has demonstrated simultaneous Greenberger–Horne–Zeilinger (GHZ) state entanglement across all 54 transmon qubits of its cloud-accessible IQM Emerald processor. The achievement validates full-lattice coherence on commercial hardware where users previously operated within ~30-qubit active partitions. The milestone builds on the company’s autonomous tuning initiatives reported in QCR’s previous coverage of IQM’s agentic calibration with NVIDIA Ising.<br>\nIQM Emerald Full-Chip Entanglement Benchmarks<br>\nSystem Scale<br>\nMitigation Protocol<br>\nMeasured State Fidelity<br>\n40 Qubits<br>\nRaw (Unmitigated)<br>\n0.515 (Exceeds genuine multipartite entanglement threshold of 0.500)<br>\n54 Qubits (Full Chip)<br>\nReadout Error Mitigation (REM)<br>\n0.516 (> 0.500 classical boundary separating entanglement from separable noise)<br>\nProcessor Topology<br>\n54 Transmons in Square Lattice<br>\nNative two-qubit CZ gates enabled by tunable couplers<br>\nThe state preparation relied on an automated scheduling compiler that balances individual two-qubit CZ gate fidelities against cumulative qubit idling times, cutting overall processor error rates by up to 50% alongside dynamical decoupling. While exceeding the 0.500 threshold confirms genuine multipartite entanglement across the full register, the narrow fidelity margin highlights the steep scaling challenge of deep circuit execution on unencoded physical QPUs. Maintaining full-chip coherence will require further gate-speed optimizations and continuous calibration to prevent localized cross-talk from degrading algorithmic sampling.<br>\nTechnical details are available in the official IQM Announcement here, with architecture specifications detailed on the IQM Emerald Platform Portal here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"684470582f23548c9209f1679f32a906","author":"Mohamed Abdel-Kareem","published_at":"2026-10-31T01:24:17","fetched_at":"2026-10-31 16:43:16","word_count":303,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"15h","domain":"quantumcomputingreport.com"},{"id":"0083cc178c901677","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10232","title":"Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)","url":"https://scottaaronson.blog/?p=10232","summary":"In my &#8220;Mathocalypse&#8221; post, I mentioned that my wife Dana&#8212;who&#8217;s been working on Subhash Khot&#8217;s Unique Games Conjecture since ~2009, for the entire time I&#8217;ve known her&#8212;has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI&#8217;s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, ","content":"<p>Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)<br>\nIn my “Mathocalypse” post, I mentioned that my wife Dana—who’s been working on Subhash Khot’s Unique Games Conjecture since ~2009, for the entire time I’ve known her—has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI’s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, Dor Minzer, and other colleagues, and (naturally) GPT-6 Astra, Dana probably now understands this crown jewel of OpenAI’s release as well as anyone does. This week, she gave two well-received whiteboard talks on the proof at Simons Institute. So, I and others encouraged her to give the same talks next week at UT Austin when she’s back here, and Dana agreed! Because of the large timely interest, we’re going to do a live Zoom option, and will also record the talk for later sharing on YouTube. Please note: While all are welcome, this is a 2-hour technical talk. The first hour will review key ideas from hardness of approximation, while the second hour will describe the new construction. —SA<br>\nTitle: The Unique Games Conjecture – Proved (!!?)<br>\nSpeaker: Dana Moshkovitz (UT Austin)<br>\nWhen: Wednesday Nov. 4, 3:30-5:30pm US Central (with a brief break in the middle)<br>\nWhere: UT Austin, Gates Dell Complex 6.302. Live Zoom will be available here, and a recording will be available later.<br>\nAbstract: The Unique Games Conjecture of Khot says that it is NP-hard, given a system of linear equations of the form xi-xj=bij (mod p) over variables x1…xn, where 99% fraction of the equations can be satisfied, to find an assignment satisfying 1% of the equations (here p is a sufficiently large constant).<br>\nThis conjecture implies optimal inapproximability results for many optimization problems.<br>\nA few weeks ago OpenAI released a writeup with a proof of the Unique Games Conjecture, as well as a Lean formalization of the proof. The writeup, like others released that day, is not written in a way that’s especially readable to human mathematicians.<br>\nMy goal in this talk is to offer my mental map of the proof, in a way that’s helpful to theoretical computer scientists who are familiar with the area. I think of the innovation as a new code construction, “Hadamard with a noise test.” I’ll sketch how it fits into the NP-hardness reduction. Then I’ll describe the code construction fully and sketch its soundness analysis.<br>\nI’ll also point out a couple of ingredients of the proof that are of independent interest, like a simple quadratic that behaves “like a linear,” and a probability bound using a trick with harmonic numbers.<\/p>","content_hash":"f81a4183271bf90cffcc544e4703c469","author":"Scott","published_at":"2026-10-30T23:27:34","fetched_at":"2026-10-31 16:43:10","word_count":454,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"17h","domain":"scottaaronson.blog"},{"id":"19962db08186efd4","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10239","title":"Podcasts about the Topic: Part II","url":"https://scottaaronson.blog/?p=10239","summary":"As always, I strongly recommend 2x speed, which compensates somewhat for my verbal infelicities! New! More podcasts keep dropping! This one is with the AI alignment researcher Roman Yampolskiy, about &#8230; well, AI alignment, plus the Mathocalypse, plus quantum computing, plus whether the universe is a simulation, and I forget what else! Man do the YouTube comments make me despair of humanity though. Another one that recently dropped, with Sophia Aryan: With Curt Jaimungal: The title Curt put ","content":"<p>Podcasts about the Topic: Part II<br>\nAs always, I strongly recommend 2x speed, which compensates somewhat for my verbal infelicities!<br>\nNew! More podcasts keep dropping! This one is with the AI alignment researcher Roman Yampolskiy, about … well, AI alignment, plus the Mathocalypse, plus quantum computing, plus whether the universe is a simulation, and I forget what else! Man do the YouTube comments make me despair of humanity though.<br>\nAnother one that recently dropped, with Sophia Aryan:<br>\nThe title Curt put next to my head could’ve been in reference to many, many things! But sorry, he just mean AI. He and I start with the Mathacre, of course, but then we get onto the firewall paradox and then Curt starts asking about computational complexity and the Second Law, and then about Integrated Information Theory.<br>\nAh, and another one that just dropped! Man’s Search for Meaning podcast (recorded in-person in Austin), with Yannick Bernard, who asked me about quantum computing, AI, my personal story, grade-skipping, antisemitism, and I don’t even remember what else. I didn’t refuse to answer anything. (Note: this one was recorded over the summer, which is why I so weirdly omit the latest AI math breakthroughs!)<br>\nOK, despite the title of this post, short break from “The Topic.” Here’s an absolute masterpiece of mathematical exposition, from the “Polylog” YouTube channel, which tells the story of the determination of Busy Beaver values through spectacular animations. I play cameo roles in the video, although I embarrass myself (as the video silently points out) by transposing two digits in the value of BB(5)…!<br>\nJust for old times’ sake, a short podcast about quantum computing with Danny Li.<br>\nAnd, coming soon (not on YouTube quite yet): a conversation about the Mathacre with celebrated physics popularizer (and character on The Big Bang Theory) Brian Greene, recorded in-person in NYC during my recent trip to speak in the math department at Columbia University!<br>\nAnd to preempt the inevitable comments about it: yes, my students just came to my office to tell me that an OpenAI model has now refuted the Exponential Time Hypothesis, by giving an algorithm to solve 3SAT in an amount of time that scales roughly like exp(n/√log(n)). Even as we struggle to digest the previous courses, the endless buffet continues!<\/p>","content_hash":"7dc0b77b2276479ae01c78d4fd42e578","author":"Scott","published_at":"2026-10-26T22:03:37","fetched_at":"2026-10-31 16:43:10","word_count":379,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"4d","domain":"scottaaronson.blog"},{"id":"971900c926d04767","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18331","title":"Lunch with Horace Walpole","url":"https://quantumfrontiers.com/2026/10/25/lunch-with-horace-walpole/","summary":"Did you know that Horace Walpole invented the Gothic novel? The Englishman spawned a genre by publishing The Castle of Otranto during the 1700s. Walpole’s work featured dark atmospheres, crumbling castles, family secrets, and taboo subjects such as madness and incest. If you’ve enjoyed Oscar Wilde&#8217;s novel The Portrait of Dorian Gray or the 2024 film Nosferatu,1 thank Horace Walpole. I memorized the above information in a high-school English class. My teacher, Mrs. Lukacs, demanded a great ","content":"<p>Did you know that Horace Walpole invented the Gothic novel? The Englishman spawned a genre by publishing The Castle of Otranto during the 1700s. Walpole’s work featured dark atmospheres, crumbling castles, family secrets, and taboo subjects such as madness and incest. If you’ve enjoyed Oscar Wilde’s novel The Portrait of Dorian Gray or the 2024 film Nosferatu,1 thank Horace Walpole.<br>\nI memorized the above information in a high-school English class. My teacher, Mrs. Lukacs, demanded a great deal of her students: we memorized boatloads of facts about literary genres (from Anglo-Saxon epics to elegies), history (the Enlightenment, the Romantic era, etc.), literary devices (enjambment and litote and synecdoche), and authors (Samuel Johnson, Anne Bradstreet, and their ilk.). Thanks to Mrs. Lukacs, I can add that Charles Brockden Brown Americanized the Gothic. He shifted stories’ settings to caves, dark forests, and villages at the edge of civilization. The novels Wieland, Edgar Huntly, and Arthur Mervyn exemplify his style.<br>\nMrs. Lukacs’s curriculum hibernated in me like an educational chipmunk after I’d graduated from high school. Imagine my surprise, during a recent lunchtime, when I lifted my gaze to find Horace Walpole a few feet away.<br>\nI was dining at King’s College, Cambridge. The University of Cambridge contains colleges similarly to how Hogwarts contains houses. Each house has students and faculty members from multiple departments. Some departments share their disciplines with institutes. An institute and a college account for my visiting Cambridge most of this autumn: the Isaac Newton Institute for the Mathematical Sciences is hosting a several-month program about quantum many-body physics. I’m grateful to be attending the program while holding a Visiting Fellowship at King’s College.<br>\nKing Henry VI founded King’s College in 1441. (Caltech, where I earned my PhD, precipitated from earlier institutions around the turn of the twentieth century.) The college’s alumni and former Fellows include centuries’ worth of luminaries. Some of their portraits hang in the dining hall, a Gothic confection that could play a cathedral on television.<br>\nI sometimes talk with other scholars over meals in the dining hall; but, when dining alone, I examine different facets of the hall over different meals. The room boasts carved wooden walls, a seventeenth-century tapestry, the gold-colored wall sconces. I couldn’t forgive myself if I squandered the opportunity to examine them. Sometimes, I’ve scrutinized a portrait per meal. One portrait depicts Horace Walpole.<br>\nDid I attempt to envision Horace Walpole during high school? Probably not. He lurked in my imagination as the silhouette of an eighteenth-century Englishman—likely as buttoned-up, industrious, and middle-aged.<br>\nThe portrait shows a youth in his teens or twenties, his skin smooth. A slight smile hints at levity. His clothing’s light coloring buttresses the impression: a white shirt peeps out from a cobalt-blue jacket. The young man’s pose suggests formality, his back straight and one hand tucked inside his jacket. Yet his large, dark eyes seek the viewer’s. I wouldn’t have expected such a plucky-looking youth to have founded the genre that includes Dracula. But I welcomed Horace Walpole as a lunch companion.<br>\nAfter finishing eating, I walked to one end of the dining hall to drop off my tray. Beside a doorway there hung another portrait whose name leaped out at me: Sir Robert Walpole. Google revealed that Sir Robert had fathered Horace—and served as Great Britain’s first prime minister.<br>\nDuring another meal, I found myself eyeing a portrait of a man wearing an Elizabethan ruff. He wore no smile, unlike Horace. Little wonder: a label revealed the portrait to be of Sir Francis Walsingham. Walsingham had headed Queen Elizabeth I’s spy network during the 1500s. Catholics across Europe sought—overtly and by cloak and dagger—to dethrone Elizabeth and the Protestantism to which Walsingham subscribed. I could hardly blame her right-hand man for looking as though he’d found a rat in his soup.<br>\nWhat a crew surrounds me, I keep thinking. What depth and richness it adds to my meals. I eat chicken-tikka sandwiches and minty-pea salads with history.<br>\nStudying physics unlocks similar depth and richness. Doing physics, one doesn’t merely pose a problem, translate it into math, and solve the mathematical problem. One interprets the mathematical outcome physically, illuminates it with examples, and applies the results to the world around us.<br>\nFor instance, odors waft out of the servery into the dining hall, savoring of flatbread pizza or falafel or beef Wellington. Why? Because improperly fed or watered students can cause riots. But why, more fundamentally? Because, by the second law of thermodynamics, every sufficiently large closed, isolated system’s entropy increases or remains constant. Entropy increases as a gas—which can carry an odor—spreads out.<br>\nAs its entropy grows, the gas approaches equilibrium: large-scale properties of the gas, such as its volume, cease to change. If any energy leaves the gas, an equal amount enters it, on average. The gas takes far less time to equilibrate than glass does. The dining hall’s stained-glass windows depict coats of arms and list college provosts of yore. A glass’s atoms don’t form a crystal, a pattern repeated across space. Diamonds, table salt, and the quartz in wristwatches consist of crystals. A glass’s atoms lie at random distances from each other. This randomness leads to randomness in the interatomic interactions’ strength.<br>\nSimilar randomness characterizes neural networks, which underlie conversations I’ve overheard and participated in at meals. Neural networks realize artificial intelligence, which has been widening, disrupting, monetizing, speeding up, eroding, and enhancing research. You don’t need for me to tell you that AI has ignited a quest for an understanding of what computers can and can’t accomplish. What better place to undertake such a quest than King’s? Alan Turing, a co-founder of computer science, studied and worked here.<br>\nI’ve written about how a liberal-arts education has enhanced my physics. So has a physics education enhanced my life. Physics adds depth and richness—as well as nuance, detail, and significance. I have the opportunity to eat lunch with Horace Walpole this autumn; we have the opportunity to eat our cosmic lunches in this universe for only slightly longer. I couldn’t forgive myself if I squandered the opportunity to examine my surroundings.<br>\nWith thanks to King’s College, the Isaac Newton Institute, David Arvidsson-Shukur, and many others for my visit.<br>\n1Or the 1922 original.<\/p>","content_hash":"c19f669a34e11e70d926022ee3e9b171","author":"Nicole Yunger Halpern","published_at":"2026-10-26T00:03:21","fetched_at":"2026-10-31 16:43:17","word_count":1039,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"5d","domain":"quantumfrontiers.com"},{"id":"24dff74b42fa198c","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10235","title":"Vote! (Israeli edition)","url":"https://scottaaronson.blog/?p=10235","summary":"Someone writing an article for the Israeli press about “people abroad who love Israel but might be worried” emailed me the following questions: “1. What is something about Israel that you admire/appreciate over the years? 2. What are you worried the most about Israel these days?” So I replied as follows: “It’s hard to know where to start with either of your questions! But briefly: Tiny Israel standing up for itself, against an often hostile and unjust world, is a huge part of what’s given me the","content":"<p>Vote! (Israeli edition)<br>\nSomeone writing an article for the Israeli press about “people abroad who love Israel but might be worried” emailed me the following questions:<br>\n“1. What is something about Israel that you admire/appreciate over the years?<br>\n2. What are you worried the most about Israel these days?”<br>\nSo I replied as follows:<br>\n“It’s hard to know where to start with either of your questions! But briefly:<br>\nTiny Israel standing up for itself, against an often hostile and unjust world, is a huge part of what’s given me the self-confidence to stand up for myself in my own life. That was true even before I had visited Israel or spent significant time there, gazed across the desert at the still-clear ruins of the Roman siege of Masada, staggered overwhelmed out of Yad Vashem into the sunlight of Jerusalem, tasted the hummus or pomegranate juice or ice cream with blended fruit, befriended or had academic collaborations with dozens of Israelis, or married an Israeli woman.<br>\nMy fear is merely the ‘obvious’ one — that, in response to the staggering hostility directed against the ‘Jew among the nations,’ Israel will become more and more belligerent, isolated, and right-wing. It will get demographically overwhelmed by those who don’t want to work or serve in the army, while hundreds of thousands of secular educated Israelis leave. It will be internally divided almost to the point of civil war. It will repudiate the liberal-democratic vision of Herzl and Ben-Gurion, of world-class universities and making the deserts bloom, for the swaggering, theocratic vision of Smotrich and Ben-Gvir, of chasing Palestinians from their olive groves. It will become more and more like the hateful caricature of itself that the anti-Israel people in the West always imagined. And then, having been internally weakened in all of these ways, it will finally be destroyed by its external enemies, who will never have rested the whole time, who never once wavered in their dream of a second Holocaust.<br>\nI hope and pray that in the upcoming election, the Israeli voters make optimistic choices that repudiate these fears.”<br>\nAs I’ll do more and more with political posts, I’m leaving the comments off. Why? Because my remaining life is too short to spend it battling an endless parade of trolls and griefers, leftists and rightists and just nihilists, who might or might not be AI.<\/p>","content_hash":"f2ee645b3e2ca56f2eb570bd2d98df53","author":"Scott","published_at":"2026-10-25T21:54:26","fetched_at":"2026-10-31 16:43:11","word_count":394,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5d","domain":"scottaaronson.blog"},{"id":"1be6e6aac8a834a3","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10222","title":"Vote!","url":"https://scottaaronson.blog/?p=10222","summary":"Today, I take a break from your regularly-scheduled AI mathocalypse programming to urge my American readers to vote in the Congressional midterms, early if possible, if you haven&#8217;t already. Especially if your state faces one or more major contests, as does my adopted home state of Texas. Me, I voted straight-ticket Democrat today, as I&#8217;ve done in every election since I became eligible over a quarter-century ago (except for when I vote-swapped with someone from another state). So yes,","content":"<p>Vote!<br>\nToday, I take a break from your regularly-scheduled AI mathocalypse programming to urge my American readers to vote in the Congressional midterms, early if possible, if you haven’t already. Especially if your state faces one or more major contests, as does my adopted home state of Texas.<br>\nMe, I voted straight-ticket Democrat today, as I’ve done in every election since I became eligible over a quarter-century ago (except for when I vote-swapped with someone from another state).<br>\nSo yes, I voted for the guy who studied theology a short walk from my house, and who seems to have really internalized the whole Jesus thing about kindness to everyone—<br>\n—over his sneering, thuggish, cartoonishly mafia-like opponent. Fingers crossed that Talarico pulls off a historic upset for our state (he’s currently a 2-to-1 favorite in the prediction markets).<br>\nThe Texas Republicans did everything they possibly could to make this choice easy for me, by being corrupt, conspiratorial, racist, and Taliban-like even by the jaw-droppingly debased standards of MAGA in 2026. As I draw breath, I could never vote for a slate one of whose candidates attacked UT students for the crime of being visibly Southeast Asian while cheering their school’s football victory from the stands—and whose other candidates could barely bring themselves to condemn this knuckle-dragging racist, for fear of angering their base. (It’s like, didn’t you want immigrants to assimilate to American culture? What more could these kids possibly do, short of skin bleach?)<br>\nAll the same, this was also the first US election in my lifetime where I felt like my vote was genuinely in play—especially when I listened to Talarico’s condemnations of Israel, for having the temerity to fight the same kind of war any random other nation would’ve fought had it been attacked as Israel was on October 7. When Hasan Piker came to speak to a cheering crowd here at UT Austin, I actually wrote to someone I know in the Talarico campaign, to ask whether Talarico would show enough balls to condemn Piker’s many antisemitic and anti-American statements, and renounce his support. My contact was nice enough to reply to me, saying: don’t worry, James is taking care to be far away from Austin during Piker’s visit, so he won’t need to engage at all!<br>\nSo then, this is my candidate: the guy who’s strategically silent on the wildly-popular streamer who’d gladly see my Israeli family members raped and beheaded, rather than campaigning with that streamer like Abdul El-Sayed did in Michigan. I unironically believe that, for Talarico, it took genuine moral courage to resist the whole momentum of his party’s youth even to this extent.<br>\nTo earn my vote in the near future under these circumstances, all a Texas Republican would need to do is be somewhat sane or reasonable. He or she might affirm, for example, that racism is bad, that abortion is a woman’s choice, that Christianity is not the state religion of the US, that Covid vaccines work, that human emissions are worryingly changing the earth’s climate, and/or that Joe Biden won in 2020, while still being arbitrarily right-wing on taxes and other stuff. He or she could then simply wait for the Democrats to descend fully into the worldview of the masked hooligans who are currently setting France’s beautiful cities aflame, terrorizing its shopkeepers, and looting as many Louis Vuitton handbags as they can carry … all for Palestine, of course, and for the death of global capitalism, and for the violent overthrow of the scheming, money-grubbing, hook-nosed, international Talmudic … err, I mean “Zionists.”<br>\nWhat I’m trying to say is, it was a genuine achievement on the part of the Texas Republicans to fail to earn a single vote from me this cycle.<\/p>","content_hash":"6078ad7dce6f0452da3b8d1dee36e3de","author":"Scott","published_at":"2026-10-21T05:13:08","fetched_at":"2026-10-31 16:43:11","word_count":624,"read_time_minutes":4,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"bd7da5bccbf49441","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10204","title":"AI Alignment Theory Course: Readings and Rapporteur Reports!","url":"https://scottaaronson.blog/?p=10204","summary":"As I announced on this blog a couple weeks ago, I&#8217;m teaching a new course this semester at UT Austin, entitled AI Alignment Theory. To call such a course &#8220;timely&#8221; seems like an understatement; this is the first course I&#8217;ve ever taught for which multiple gargantuan developments relevant to the course have happened while I was teaching it. Since AI alignment is still a field with no standard textbook (although that might be changing), no accepted body of mathematical theory","content":"<p>AI Alignment Theory Course: Readings and Rapporteur Reports!<br>\nAs I announced on this blog a couple weeks ago, I’m teaching a new course this semester at UT Austin, entitled AI Alignment Theory. To call such a course “timely” seems like an understatement; this is the first course I’ve ever taught for which multiple gargantuan developments relevant to the course have happened while I was teaching it.<br>\nSince AI alignment is still a field with no standard textbook (although that might be changing), no accepted body of mathematical theory, etc. etc., the way we’ve been running the course is like a humanities discussion seminar, albeit one that happens to be in a CS department and to include technical results from time to time. Basically, in each class session, a student “rapporteur” gives a talk on an AI alignment reading—which include “ancient” readings (from way back in 2016), “modern” readings (from, say, last week), and everything in between—and then we freely discuss and debate whatever was presented, with my own role mostly limited to that of gadfly (occasionally I’ll do a mini-lecture on some technical concept).<br>\nAnyway, two weeks ago, I promised a list of the papers and other writings that we’ve been discussing, as well as student “rapporteur reports” on those papers, which cover not only the papers themselves, but the students’ thoughts about the papers and (anonymized) summaries of points raised during our class discussion. People have been bugging me for that ever since.<br>\nSince I am to please, here you are, without further ado! I’ll continue to update the list as the semester progresses, so that this post can serve as a central public repository for the course.<br>\n- AGI Ruin: A List of Lethalities, by Eliezer Yudkowsky (2022). Rapporteur report by Tennyson Bardwell (this is the one that we posted previously).<br>\n- Concrete Problems in AI Safety, by Amodei, Olah, Steinhardt, Christiano, Schulman, and Mané (2016). Rapporteur report by Daniela Wiepert.<br>\n- The Alignment Problem from a Deep Learning Perspective, by Ngo, Chan, and Mindermann (many versions but latest is 2025), and Research Priorities for Robust and Beneficial Artificial Intelligence by Russell, Dewey, and Tegmark (2016). Rapporteur report by Oleg Pittman and Jack Holt.<br>\n- What Happened: OpenAI and HuggingFace, by Zvi Mowshowitz; The Rise and Fall of Agent Civilizations, by Dwarkesh Patel, and the METR report by on the HuggingFace incident, by Greenblatt, Cotra, and Wijk (all 2026). Rapporteur report by Shourjo Aditya Chaudhuri and John Robertson.<br>\n- We Must Pace the Frontier, by Dario Amodei (2026). Rapporteur report by Dhilan Shah.<br>\n- The Basic AI Drives, by Stephen Omohundro (2008), and Optimal Policies Tend to Seek Power, by Turner, Smith, Shah, Critch, and Tadepalli (2023). Rapporteur report by Bill Zheng.<br>\n- Corrigibility, by Soares, Fallenstein, Yudkowsky, and Armstrong (2015). Rapporteur report by Sukrut Chikodikar.<br>\n- The Off-Switch Game, by Hadfield-Menell, Dragan, Abbeel, and Russell (2017). Rapporteur report by Praneel Seth.<br>\n- Planting Undetectable Backdoors in Machine Learning Models, by Goldwasser, Kim, Vaikuntanathan, and Zamir (latest version 2024), and Oblivious Defense in ML Models: Backdoor Removal without Detection, by Goldwasser, Shafer, Vafa, and Vaikuntanathan (2025).  Rapporteur report by Agrim Jain and Indira Dutta.<br>\n- Backdoor Defense, Learnability, and Obfuscation by Christiano, Hilton, Lecomte, and Zhu (2024), and Unelicitable Backdoors in Language Models via Cryptographic Transformer Circuits, by Draguns et al. (2024). Rapporteur report by John Dunbar.<br>\n- Functional Decision Theory: A New Theory of Instrumental Rationality, by Eliezer Yudkowsky and Nate Soares (2018).  Rapporteur report by Isaac Noel (coming).<br>\n- Robust Cooperation In the Prisoner’s Dilemma: Program Equilibrium via Provability Logic, by Barasz, Christiano, Fallenstein, Herreshoff, LaVictoire, and Yudkowsky (latest version 2021).  Rapporteur report by Shunan Zheng (coming).<br>\n- Sleeper Agents: Training Deceptive LLMs that Persist Through Safety Training, by Hubinger et al. (long list of authors) (2024).  Rapporteur report by Anthony Wang (coming).<br>\n- Social Choice Should Guide AI Alignment in Dealing with Diverse Human Feedback, by Conitzer et al. (long list of authors) (2024) and Toward a Theory of Value in AI Alignment, by Ahmed, Birhane, Smart, Kay, Shrishak, and Tobin (2026).  Rapporteur report by Priyanka Sadagopan (coming).<br>\n- Claude’s Constitution, by Amanda Askell, Joe Carlsmith, Chris Olah, Jared Kaplan, Holden Karnofsky, et al. (2026).  Rapporteur report by Alan Li (coming).<br>\n- AI Safety via Debate, by Geoffrey Irving, Paul Christiano, and Dario Amodei (2018).  Rapporteur report by Sampoorna Poria (coming).<br>\n- Scalable AI Safety via Doubly-Efficient Debate, by Jonah Brown-Cohen, Geoffrey Irving, and Georgios Piliouras (2023).  Rapporteur report by Aarushi Lakhi (coming).<br>\n- AI as Normal Technology, by Arvind Narayanan and Sayash Kapoor (2025).  Rapporteur report by Weixi Chen (coming).<br>\n- On the Dangers of Stochastic Parrots, by Emily Bender, Timnit Gebru, Angelina McMillan-Major and Shmargaret Shmitchell (2021). Rapporteur report by George Tsoukalas (coming).<br>\n(More readings TBD, until the semester ends!)<br>\nThanks to my TA, Lin Lin Lee, for her help in getting all of this together.<br>\nUpdate: I welcome elevated discussion of these papers and rapporteur reports in the comment section; some of the students might chime in too! Because of the connection to an academic class, though, in this post I’ll be especially ruthless in keeping out nonconstructive or off-topic comments.<\/p>","content_hash":"e24430fd4c7637a5623676d6ab16e965","author":"Scott","published_at":"2026-10-19T21:07:12","fetched_at":"2026-10-31 16:43:12","word_count":859,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"28c597e089a405ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18358","title":"Even sampling from a quantum spin glass may not require a quantum computer (a video abstract, for a change)","url":"https://quantumfrontiers.com/2026/10/19/even-sampling-from-a-quantum-spin-glass-may-not-require-a-quantum-c
