rs (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"7w","domain":"quantumfrontiers.com"},{"id":"3f8f2a08f44c12ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18162","title":"How can objects interact without touching?","url":"https://quantumfrontiers.com/2026/09/06/how-can-objects-interact-without-touching/","summary":"Rethinking the electric field Have you ever wondered what an electric field actually is?&nbsp; The electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.&nbsp; Most textbooks define the electric field ","content":"<p>Rethinking the electric field<br>\nHave you ever wondered what an electric field actually is?<br>\nThe electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.<br>\nMost textbooks define the electric field as a property of space or a physical entity surrounding electric charges, or with the equation of force per unit charge. These definitions help us understand what the electric field does and its effect on electrically charged particles, but they do not fully answer what an electric field actually is and how it influences charges. Thus, I started thinking about the question: what allows charges to influence each other without touching?<br>\nThis question led me down a path that began with a simple observation in everyday life, and it eventually pointed toward much deeper ideas in modern physics.<br>\nObjects Influenced by Their Surroundings<br>\nBefore talking about electric fields, let’s consider a more basic question: Does it seem reasonable that objects can be influenced by their surroundings?<br>\nMost people would answer yes. We have all seen examples of objects responding to something else nearby, such as the Earth orbiting the Sun, a compass needle reacting to a magnet, and our phones responding to signals from a WiFi router. But what is the mechanism behind these interactions?<br>\nA simple physical phenomenon that we can look at is a balloon rubbed on a piece of clothing that can pick up strands of our hair. Many of us have seen this demonstration in kindergarten or first grade of elementary school. This might seem completely ordinary, but if we pause and think about it, something strange is happening – the balloon is influencing the hair without touching it.<br>\nHow is that possible? One answer is simply that the balloon “pulls” on the hair, but this raises more questions. How does the balloon reach the hair? What is happening in the space between them? These questions suggest that something is missing from the picture of objects pulling on each other directly through contact.<br>\nTo put this in the context of physics, we might all have learned that “like charges repel, and opposite charges attract”. We might have solved equations on how fast charges would move away from or toward each other. We were always told to just accept it because these motions result from the electric field. But why do these observations happen? What is happening between the charges?<br>\nHistorically, physics encountered the same problem. If one object can influence another at a distance, it is natural to ask what is happening in the space between them. One guiding principle that physicists often use is the concept of locality. Locality is the idea that an object can only be directly influenced by its immediate surroundings. Thus, an influence should not simply leap across space from one object to another, and changes should propagate through intermediate regions step by step.<br>\nAt first glance, locality seems reasonable because it matches many of our everyday experiences. If I push a book across a table, my hand influences the book through direct contact. The influence does not appear to jump instantaneously across the table.<br>\nHowever, locality creates a tension when we return to the scenario of the balloon pulling on strands of hair. If locality is true, something must be happening in the space between the balloon and the hair. But from a standard electromagnetic perspective, the space between the balloon and the hair is empty. Therefore, we have encountered a contradiction: if what is between the balloon and the hair is empty space, then what is responsible for transmitting the influence? Neither the usual electromagnetism nor locality tells us the answer to these questions.<br>\nThe Classical Electric Field<br>\nIn the usual electromagnetic picture, the answer to the puzzle is the electric field. Rather than allowing charges to influence one another directly across space, the theory assigns an electric field to the space surrounding charges. The field acts as the intermediary through which influence is transmitted.<br>\nA useful way to think about the electric field is that it assigns information to every point in space. If we imagine a charged particle that is placed at a particular location, the electric field tells us how that particle would move. This charged particle is what physicists call a test charge. By observing how the test charge behaves, we can infer information about the electric field at that location.<br>\nThis could seem like a satisfying answer as the electric field tells us how influence is transmitted, but it does not tell us what kind of thing is doing the transmission. Is the electric field a physical substance? Is it a mathematical tool? Or is it something else?<br>\nIt might be easy to fall back on the idea that the electric field ultimately works through tiny particles physically touching one another. After all, contact interactions are among the most familiar interactions that we experience.<br>\nBut physics challenges this intuition as well. It is surprisingly difficult to define what it means for two objects to “touch”. We usually think of the balloon attracting hair as an example of action at a distance, whereas pressing a hand on a table feels like direct physical contact. However, at the microscopic level, the two situations are fundamentally similar. If we could zoom in on our fingertip and the table with a microscope, we would find that the atoms in our skin never make contact with the atoms in the table. This is because of the repulsion between the electron clouds surrounding the atoms, which prevents the two atomic nuclei from overlapping. Say if we scale the atom in the table up to be the size of a marble, then the nearest atom in our fingertip would still be separated from it by a few centimeters. In the end, nothing is truly “touching” in the intuitive, physical sense.<br>\nThus, the idea of contact does not solve our problem. We are forced to ask the same question again: what is it that allows these interactions to occur? To answer that question, I turned to a different perspective of thinking about electric fields.<br>\nThe Electric Field as A Dynamical Structure<br>\nFrom our intuition, it is natural to imagine the electric field as some invisible substance filling space. This is often the picture suggested by the common field line diagrams in physics textbooks, which make the field appear to flow outward or inward from charges, almost like a moving fluid.<br>\nA useful analogy is the ocean. A boat floating on water can move because waves pass beneath it. The boat responds to changes in its surrounding waves rather than to some direct push from a distant object. Similarly, charged particles respond to changes in the electric field around them. We can then view the electric field as a dynamical structure that governs how the state of the world can evolve.<br>\nHowever, the ocean analogy can only take us so far. Ocean waves are made of water molecules. Sound waves are made of vibrating air molecules. But what is the electric field made of? When light travels through empty space, it seems that there is no material medium at all.<br>\nThis brings us back to the mystery: if locality suggests that something must exist in the space between interacting objects, and if the electric field is not made of the ordinary matter that we understand, then what exactly is occupying the space?<br>\nTo answer this question, we have to rethink what we mean by “empty” space itself.<br>\nEmpty Space is Not Empty<br>\nConventionally, we have always imagined empty space as exactly what the name suggests—empty. Just like if all the particles were removed and nothing was remaining. But modern physics suggests a very different picture.<br>\nIn quantum field theory, what we call “empty space” is not truly empty. Empty space is filled with underlying quantum fields that permeate all of space and time, even in the absence of particles. Even when the surface of the ocean looks perfectly still, the water is still there. The ocean is not defined only by visible waves, but by the underlying medium that can support waves in the first place. The waves are patterns of motion of the ocean itself, just like the electric field. These fields are part of the fundamental structure of the universe from which physical phenomena emerge. Quantum field theory suggests that particles are not independent objects moving through an otherwise empty space. Rather, they are localized patterns or excitations of underlying fields that already exist throughout the universe.<br>\nFrom this perspective, the electric field is not something that is added to empty space. It is part of the fundamental dynamical structure of space itself.<br>\nConclusion<br>\nAt the beginning, I asked a simple question: how can objects influence each other without touching? The straightforward answer is the electric field. Charges create electric fields, and those fields determine how other charges move. But what is an electric field? Is it an invisible material filling space between objects, or is it a dynamical structure that governs how physical systems in the world evolve?<br>\nFrom the perspective of quantum field theory, quantum fields permeate all of space and time. Particles are not separate objects moving through an empty space, but are excitations of these underlying fields; electric fields are not secondary matter surrounding charged particles, but are particular configurations of the underlying electromagnetic quantum fields. What we observe as the motion of a charged particle is the result of its interaction with the electromagnetic field, whose local state determines how the particle evolves.<br>\nIn the end, our original question may not have a single definitive answer. But asking it revealed a shift in perspective, and physics has repeatedly shown that every explanation opens the door to an even more fundamental question. Stopping at this step, a new mystery emerges: what are these underlying quantum fields themselves? What are they made of, and where do they arise from?<\/p>","content_hash":"72ad48be59eb5d47ff76fadb3908d2c5","author":"adelynnt","published_at":"2026-09-06T13:17:26","fetched_at":"2026-11-13 13:50:20","word_count":1697,"read_time_minutes":9,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"9w","domain":"quantumfrontiers.com"},{"id":"b2281c07172b699a","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18092","title":"The Universe, the Uncanny, and Fashion","url":"https://quantumfrontiers.com/2026/08/31/the-universe-the-uncanny-and-fashion/","summary":"In the beginning there was a question. Actually, no, in the beginning there was language. The question came later, presumably as one of its side effects. Since then we have asked about nearly everything, though the answers have done little to alter our circumstances. Human existence has always seemed strange to me. We arrive without consent, in a place not of our choosing, then spend decades asking why, until we close our eyes and enter the abyss of nothingness. Some people accept this situation","content":"<p>⚛⚛⚛<br>\nIn the beginning there was a question. Actually, no, in the beginning there was language. The question came later, presumably as one of its side effects. Since then we have asked about nearly everything, though the answers have done little to alter our circumstances. Human existence has always seemed strange to me. We arrive without consent, in a place not of our choosing, then spend decades asking why, until we close our eyes and enter the abyss of nothingness.<br>\nSome people accept this situation very well. I did not.<br>\nUntil my mid-teens, I tenaciously found one solution in fashion. If I could not understand who I was, I could at least decide what version I could become. Clothes gave form to something otherwise difficult to locate. Desire, after all, begins with a lack.<br>\nIt was only later that physics presented a solution to the same lack, only with more elaborate mathematics.<br>\nQuantum mechanics tells us that the world beneath the familiar world does not behave as we experience it. A thing can resist being one thing, certainty begins to dissolve, and reality becomes strangely unfamiliar. The uncanny begins very close to home.<br>\nIt is in this uncanniness that fashion and physics, liminally, meet for me: both begin with a human being standing before something they cannot understand, the universe in one case, the self in the other, and trying to make a form out of it.<br>\nBut even this distinction, on closer inspection, begins to collapse; for our desire to understand the universe has always concealed a deeper desire to understand the self that stands within it.<br>\nAll roads eventually lead back to the interests you had as a child, or so I say.<br>\nI would squint into the dark, my mind already at work. I would imagine the next thing I would wear, project its color and fabric onto the ceiling.<br>\nThen, go to the bazaar, Rangrizano Dana, where, as the Kandaharis like to say, everything is sold except one’s mother and father.<br>\nThe designs that had existed only in my head, after night upon night of theorizing and calculating, were finally beginning to take shape. The alleys of Rangrizano Dana were full of fabric of different textures and colors.<br>\nOnce the fabric was bought, came the tailoring. Tailors hold a special place in Afghanistan. Some are stars in their own right, the kind you have to book an appointment with. And once you get there, another matter comes up: making the tailor promise not to show your design to another woman. Everyone wants to wear something unique. So, naturally, there is a lot of secrecy.<br>\nThe designs themselves would either be described or sketched. Somewhere between what was imagined and what the tailor could make, something would emerge. And the day the tailor shipped your clothes was really a day of revelations.<br>\nTime passed, which is another way of saying the object of my desire changed. The same attention once spent on cut, texture, and appearance turned, little by little, toward the fabric of space and time.<br>\nStudying physics, I organized my process in the same way. There was again an idea that existed first in the mind, and then the problem of giving it form.<br>\nOnly now the materials were different. Instead of cloth, there was mathematics; instead of the tailor’s table, the blackboard and chalk. And, standing before it, more often than not, a badly dressed physicist covered in chalk dust. All the libidinal energy of the universe, you might say, had been sublimated into equations.<br>\nFashion had, in some ways, been the more serious pursuit. There was something at stake: you wanted to look better than everyone else. Physics, by comparison, could be surprisingly playful.<br>\nAlice sends a particle to Bob. The sound of those names would tickle my Pashto ear then, and still cracks me up now. Cats are placed in boxes, both dead and alive. Observers hover near black holes or sometimes even, whooooooosh, fall into them.<br>\nSo, in this way, in my mind’s eye, the physicist has become a rather more amusing figure: a tailor of space and time. The universe, of course, is a notoriously difficult client (perhaps even more difficult than a Kandahari woman making her tailor promise not to show her design to anyone else).<br>\nHe begins, as any tailor must, with an imagined shape. Mathematics is his chalk, his scissors, his needle. With it he marks the fabric, cuts it, folds it, joins one piece of reality to another. Some constructions fall upon the universe with elegance. Others bunch at the shoulder, pull at the waist, or refuse altogether to button, and must be altered, or thrown away completely.<br>\nA tailor works against the resistance of the human body; a physicist against the resistance of the universe.<br>\nImagine, then, a physicist seated at the edge of a black hole, spectacles low upon his nose, sewing little cloaks from the fabric of spacetime.<br>\n“How many dimensions will you need?” asks Alice.<br>\n“That depends upon the suit,” he replies.<br>\nFor AdS/CFT, suppose we are making a three-dimensional garment. The tailor of the universe never begins with three dimensions. Before him lies only the flat, two-dimensional fabric, with all its degrees of freedom spread upon the board.<br>\nIt is then, in a less sartorial language, we might call the disentangling and entangling of degrees of freedom; the tailor coaxes a third dimension out of the flat cloth. This is the secret embroidery of the holographic idea: what appears to the wearer as a three-dimensional world is encoded in a fundamentally two-dimensional way.<br>\nBob tries this newly fashioned quantum garment on before entering the black hole.<br>\n“Too tight,” he says. “See if there is more degree of freedom.”<br>\nThe physicist frowns, takes up his chalk, and makes another small mark, with some disentangling and entangling here and there.<br>\nWhat could have been wrong? Well, perhaps the group theory has been chosen badly, the symmetry is broken, and a representation must be changed, a seam opened, a dimension added, or one cunningly concealed.<br>\nAlice watches him work, the almighty tailor of the universe, making change without a change.<br>\n“But how do you know when the suit is right?”<br>\nAnd with that, the physicist looks at her.<br>\n“What do you want? Do you want to put me out of work? Unknowing is the lack that drives us to make more suits. If we knew the suit was right, that would be the end of everything.”<\/p>","content_hash":"8dd0c9a6fca489753e5d9567fc10e568","author":"Sola Mahfouz","published_at":"2026-08-31T21:28:38","fetched_at":"2026-11-13 13:50:21","word_count":1082,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"10w","domain":"quantumfrontiers.com"},{"id":"87fc3148874a6141","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18095","title":"Nicole’s guide to writing and editing","url":"https://quantumfrontiers.com/2026/08/26/nicoles-guide-to-writing-and-editing/","summary":"Freshman year of college, I took a writing seminar from German-literature professor Ellis Shookman. Professor Shookman loved Mozart’s music, he told us early in the term. He listened to Mozart on the radio while driving from campus to Boston. Static might mar the transmission, but he could often turn up the volume and continue enjoying the program. Sometimes, the static worsened during the drive. It could worsen and worsen, until Professor Shookman’s frustration outweighed his delight at listeni","content":"<p>Freshman year of college, I took a writing seminar from German-literature professor Ellis Shookman. Professor Shookman loved Mozart’s music, he told us early in the term. He listened to Mozart on the radio while driving from campus to Boston. Static might mar the transmission, but he could often turn up the volume and continue enjoying the program. Sometimes, the static worsened during the drive. It could worsen and worsen, until Professor Shookman’s frustration outweighed his delight at listening. He’d switch off the radio.<br>\nAs Professor Shookman loved listening to Mozart’s music, he loved reading about students’ ideas. Yet static can mar a piece of writing: infelicities in grammar, structure, composition, word choice, and more. If enough infelicities obscure the writing, the frustration of reading outweighs the benefits. Professor Shookman will quit reading.<br>\nProfessor Shookman marked up our essays with a blue pencil that achieved the status of legend among his students. If you’ve written a paper I’ve coauthored, you’ve probably received PDF drafts replete with green highlighting.1 A sticky note explains the reason for each highlighting: “Singular–plural mismatch.” “Active voice >> passive voice.” “Let’s clue the reader in as to this formula’s meaning before lobbing the math at them.”<br>\nOver the past year, I’ve catalogued the suggestions I write most often on paper drafts. The comments embody principles gleaned from Strunk and White’s The Elements of Style; the Physical Review style guide; other writing guides I esteem; literature whose writing I esteem;2 collaborations with professional editors; and writing instructors, including Professor Shookman. Each section below begins with more-important principles, shading into more-nuanced ones.<br>\nPlease use and disseminate these principles. Train your favorite large-language model (LLM) on them, and have the LLM critique your manuscripts. Instruct it to use green highlighting if you wish. Even if the LLM suggests fixes initially, tell it to stop offering suggestions later, so that you can devise the solutions: train not only the LLM, but also yourself. I hope to enjoy your papers as much as Professor Shookman enjoyed his sonatas.<br>\n- <br>\n        Organization<br>\n        <br>\n  - Motivate your work; then, present it; and then, explain its physical significance.<br>\n  - Begin each paragraph with a topic sentence.<br>\n  - Begin each section, apart from the introduction and conclusion, with (i) a statement of the takeaway and (ii) an outline of the section. When outlining a section, hyperlink to each subsection. Similar guidelines concern subsections and subsubsections.<br>\n  - <br>\n                Before presenting a piece of math, sketch its meaning and origin. This strategy enables the reader to understand the math as soon as they encounter it. If you throw math at the reader without introducing it, the reader will have to squint at the symbols for a while to figure out what the expression means and where it comes from.<br>\n                <br>\n    - Example: To calculate the average work, we substitute the Hamiltonian formula (10) into the definition (12): [equation].<br>\n  - Most citations belong at the ends of (i) sentences and (ii) phrases concluded with commas. Put a citation elsewhere only if you have a compelling reason for doing so.<br>\n  - <br>\n                Bridge each component of your writing to the next component; the next shouldn’t sound like a non sequitur.<br>\n                <br>\n    - <br>\n                        Suppose that the next sentence refers to (i) a topic mentioned in the previous sentence and (ii) a new topic. Mention (i) before (ii).<br>\n                        <br>\n      - Example: Smith et al. applied control theory to the extent possible. The attempt led to intractable equations, unlike our approach.<br>\n      - Example of a broken bridge: Smith et al. applied control theory to the extent possible. Our approach does not involve intractable equations, unlike theirs.<br>\n  - <br>\n                Whenever you tell a story, tell it from start to finish, step by step. Derivations, proofs, and descriptions of experiments qualify as stories.<br>\n                <br>\n    - This guideline extends to descriptions of experimental setups and of mathematical objects. For example, imagine referring to an element of a subgroup of the group generated by some operators. Did you have to read the preceding sentence multiple times to process it? The sentence begins at the end of a story, then rewinds to the story’s beginning. This structure impedes understanding. The subgroup forms the context for the subgroup element, which one can’t grasp until hearing about the subgroup. The subgroup participates in a similar relationship with the group, as does the group with its generators. Therefore, one should introduce the generators, then the group, then the subgroup, and then the subgroup element.<br>\n- <br>\n        Word choice<br>\n        <br>\n  - <br>\n                Use strong, specific words, rather than weak words.<br>\n                <br>\n    - Verbs and nouns are stronger than adjectives and adverbs.<br>\n    - Choose specific verbs (e.g., “prepare,” “evolve,” and “measure”), rather than vague, general verbs (e.g., variants of “to be” and “take,” as in “take a measurement”).<br>\n  - Avoid statements such as “we investigate,” “we study,” and “we analyze.” Such statements don’t relate that you’ve accomplished anything. State what you’ve accomplished. Verbs such as “prove,” “test,” “confirm,” “discover,” and “find” achieve this goal.<br>\n  - Adverbs such as “importantly” and “remarkably” pollute scientific writing with the authors’ opinions. Demonstrate that a claim is important or that a result is remarkable; then, leave readers to draw their own conclusions. Those conclusions will coincide with yours if you’ve demonstrated your point.<br>\n  - Use the active voice, rather than the passive voice. Take responsibility for your work. Editors of high-impact scientific journals have endorsed this advice.<br>\n  - <br>\n                Refer to yourself when necessary and only when necessary.<br>\n                <br>\n    - <br>\n                        Example of unnecessary reference to self: We use the superscript “max” to signify the maximal Fisher information.<br>\nPreferable alternative: The superscript “max” signifies the maximal Fisher information.<br>\n    - <br>\n                        Example of unnecessary reference to self: Our results establish several opportunities for future research. First, we can implement the experimental proposals.<br>\nPreferable alternative: Our results establish several opportunities for future research. First, one can implement the experimental proposals.<br>\n    - You may use the first-person plural when escorting the reader through a derivation.<br>\n    - Example: We substitute from Eq. (1) into Eq. (2).<br>\n  - If you’re the only author, don’t use the plural (“we,” “our,” etc.). The usage is inaccurate and misleading. It portrays you as dodging responsibility for your work by dispersing that responsibility across the scientific community.<br>\n  - Avoid dangling modifiers.<br>\n  - <br>\n                Pair every verb with the appropriate noun.<br>\n                <br>\n    - <br>\n                        Example of grammatically incorrect text: Equation (1) follows by calculating the sum.<br>\n                        <br>\n      - One should pair the verb “calculate” with the noun “we,” because “we” undertook the calculating. However, this example’s author omitted the noun out of squeamishness about using the first person in a scientific document. Hence the sentence says that the equation calculates the sum. Equations can’t calculate sums.<br>\n    - <br>\n                        Examples of correct alternatives<br>\n                        <br>\n      - We derived Eq. (1) by calculating the sum.<br>\n      - Equation (1) follows from the evaluation of the sum.<br>\n      - Calculating the sum yields Eq. (1).<br>\n  - Avoid empty subjects.<br>\n  - <br>\n                Include no unnecessary words.<br>\n                <br>\n    - “So-called” is unnecessary.<br>\n    - “Note that” and “We note that” are unnecessary.<br>\n    - Several phrases often preface mathematical statements but are unnecessary and lack contents: “we have,” “we have that,” “it holds that,” and “it follows that.” One can better serve the reader by prefacing the mathematical statement with (i) a derivation or (ii) a prose description of the statement.<br>\n    - Never write “is equal to”; “equals” is more concise.<br>\n    - Never write “is able to”; “can” is more concise.<br>\n    - Never write “gives an upper bound to,” “sets an upper bound on,” or “places an upper bound on”; “upper-bounds” is more concise. Analogous statements concern lower bounds and limits.<br>\n    - Never write “a large number of”; “many” is more concise. Never write “a small number of”; “few” is more concise.<br>\n    - Never write “We refer to [symbol] as [name]”; “we call [symbol] [name]” is more concise.<br>\n    - Never write “as long as”; “if” is more concise.<br>\n    - Never write “a single”; “one” is more concise.<br>\n    - Never write “in case” or “in the case that”; “if” is more concise (and “in the case that” suffers from a grammatical error).<br>\n    - The symbol means “greater than”; and , “greater than or equal to.” Don’t translate into “strictly greater than”; the “strictly” is unnecessary. Analogous statements concern and .<br>\n  - Avoid contractions, which are too informal for professional writing.<br>\n  - The possessive is not a contraction and belongs in professional writing. It facilitates conciseness.<br>\n  - <br>\n                Use the word “for” only when it belongs. Physicists often write “for” when they mean “if,” “per,” “at,” or something else.<br>\n                <br>\n    - <br>\n                        Example of inappropriate use: The function vanishes for odd arguments.<br>\nCorrected statement: If the argument is odd, the function vanishes.<br>\n    - <br>\n                        Example of inappropriate use: We performed 10 trials for each parameter value.<br>\nCorrected statement: We performed 10 trials per parameter value.<br>\n    - <br>\n                        Example of inappropriate use: The function is smaller for small x values.<br>\nCorrected statement: The function is smaller at small x values.<br>\n  - Write “we evolve the state,” “we measure,” etc. only if you’re an experimentalist who undertakes those actions. Alternatives include “Consider measuring,” “Suppose the system evolves,” and the command tense (e.g., “One can measure this quantity as follows: prepare the qubit in . Evolve it under …”).<br>\n  - The condition defines a regime, not a limit. The conditions and define limits and are inequivalent to .<br>\n  - Write “first,” “second,” “last,” etc., not “firstly,” “secondly,” “lastly,” etc. (I defer in this matter to The Elements of Style.)<br>\n  - Humans can assume, suppose, etc. Mathematical expressions, protocols, etc. can’t.<br>\n  - One multiplies factors together and sums terms. Don’t call factors terms and vice versa.<br>\n  - If you mean “X equals Y,” say so. Don’t write “X agrees with Y,” “X matches Y,” or “we identify X with Y.” The latter three phrases are vaguer, and two of them contain more words, than “X equals Y.”<br>\n  - <br>\n                Regarding the words “general” and “generally”:<br>\n                <br>\n    - A general object subsumes every example of that object. If any example behaves unlike a supposedly general object, don’t call the object general.<br>\n    - <br>\n                        Many claims contain the term “general,” “generally,” or “in general” but don’t need the term.<br>\n                        <br>\n      - Example of a sentence that contains “generally”: The terms generally commute.<br>\n      - Equivalent, more concise sentence: The terms commute.<br>\n    - Physicists tend to use the words “general” and “generic” differently. By “general,” physicists usually mean “subsuming every example.” By “generic,” we usually mean “typical,” or “common.”<br>\n  - <br>\n                “Then” makes sense (i) in discussions of chronology and (ii) in if–then statements. Don’t use “then” outside these contexts.<br>\n                <br>\n    - Example of inappropriate use: “Define Then Y.”<br>\n    - Examples of appropriate alternatives <br>\n      - Define This definition implies Y.<br>\n      - If then Y.<br>\n      - Define such that Y.<br>\n  - Don’t justify any equation with “we used that [such-and-such is true],” which violates the rules of grammar. Grammatically correct alternatives include “We applied [a property],” “The equation follows from [a property],” and “…since [such-and-such is true].”<br>\n  - <br>\n                Regarding tense:<br>\n                <br>\n    - When describing what you’ve accomplished, use only one tense.<br>\n    - Experiments happened in the past, so describe them in the past tense.<br>\n    - <br>\n                        When describing a proof’s steps, use the present tense.<br>\n                        <br>\n      - Example: We Taylor-approximate the function about . Substituting into Eq. (1) yields [equation].<br>\n  - <br>\n                Nouns, verbs, and adjectives should agree about whether a quantity is singular or plural.<br>\n                <br>\n    - Example of singular–plural mismatch: The equations are a rule for evolving the cellular automaton.<br>\n    - Example alternative: The equations form a rule for evolving the cellular automaton.<br>\n  - <br>\n                “Admit of” means “allow for,” or “permit.” The phrase needs the “of.”<br>\n                <br>\n    - Example: The formula admits of the following interpretation.<br>\n  - Use a pronoun only if the reader can identify its antecedent without ambiguity.<br>\n  - “Spin” has many meanings: “a quantum property that resembles angular momentum,” “a particle endowed with that property,” “the observable ,” “the spin quantum number ,” “the observable ” “the magnetic spin quantum number ” and “the observable .” Leave no ambiguity about which object you have in mind.<br>\n  - When referring to an appendix or a supplementary note, specify which you have in mind. Don’t write “the appendix,” “the appendices,” “the supplementary material,” or the like. By guiding the reader more precisely, you’ll smooth their path toward learning more about your work.<br>\n  - The gerund is the verb form that ends in “ing.” If you attribute the gerund to a subject (e.g., to a person), use the possessive.<br>\n    - Example: The students’ organizing of the conference enhanced their leadership skills.<br>\n- <br>\n        Punctuation<br>\n        <br>\n  - Consider any list that contains at least three items. If no item contains a comma, separate the items with commas. If any item contains a comma, separate the items with semicolons.<br>\n  - In American English, periods and commas belong inside quotation marks. (Example: She told me, “Have a good day.”) In British English, periods and commas belong outside quotation marks. (Example: She told me, “Have a good day”.)<br>\n  - To write quotation marks in LaTeX, don’t use your keyboard’s quotation-mark key; use the appropriate keys.<br>\n  - <br>\n                Regarding hyphens:<br>\n                <br>\n    - The hyphen (-) feeds into punctuation of three types: the hyphen (-), the en dash (–), and the em dash (—).<br>\n    - The hyphen appears in some compound words, as in “non-negative.”<br>\n    - <br>\n                        In American English, em dashes can separate ideas within a sentence. Don’t separate any em dash from neighboring text with a space.<br>\n                        <br>\n      - Example of appropriate use: The sample—the only product of this experiment—barely survived.<br>\n      - Example of inappropriate use: The sample — the only product of this experiment — barely survived.<br>\n      - Example of appropriate use: He told me only one sample had survived—hardly what I wanted to hear.<br>\n    - <br>\n                        This article specifies how to use the en dash. One use is “to separate the names of two or more people used as a compound modifier.”<br>\n                        <br>\n      - Example: Feynman–Kitaev clock<br>\n    - Hyphenate compound adjectives.<br>\n    - <br>\n                        If an adverb ends in “-ly,” it probably shouldn’t precede a hyphen.<br>\n                        <br>\n      - Example of inappropriate hyphenation: strongly-coupled systems<br>\n    - Follow a prefix with a hyphen if and only if the Physical Review style guide indicates that you should.<br>\n  - A complete clause must follow any semicolon (unless the semicolon separates items in a list).<br>\n- <br>\n        Math<br>\n        <br>\n  - Introduce only necessary notation, which readers will have enough trouble remembering. If a mathematical symbol appears only once, eliminate it. If a symbol appears only twice, try to eliminate it.<br>\n  - Every sentence must obey the rules of English grammar, punctuation, and syntax, regardless of whether the sentence contains mathematical symbols. All math-containing sentences must end with punctuation marks. If a sentence contains a list of mathematical expressions, precede the final expressions with an “and.” If the list contains at least three mathematical expressions, separate them with commas.<br>\n  - Introduce almost every mathematical symbol before you use it. If you introduce a symbol after using it, the reader will encounter the first use, stop, feel confused for a while, tentatively continue, find the definition, return to the earlier use to understand it, and then progress again. This back-and-forth breaks up the reading process. You may define a mathematical symbol after using it only if (i) the symbol is very common, known to nearly all physicists, and unmistakeable and (ii) defining the symbol earlier would disrupt the text’s flow.<br>\n  - <br>\n                If you define a new function, denote it by only one letter. (I defer in this matter to the Physical Review style guide.)<br>\n                <br>\n    - Example:<br>\n    - Examples of disallowed notation: ,<br>\n  - <br>\n                Suppose that a superscript or subscript stands for a word or phrase without representing any variable or constant. The superscript/subscript must not be italicized. (I defer in this matter to Physical Review style guide.)<br>\n                <br>\n    - Example: Let denote the measurement outcome.<br>\n  - <br>\n                If a variable or constant appears in a superscript, parenthesize it. The parentheses communicate that the superscript isn’t an exponent.<br>\n                <br>\n    - Example: Let denote the Pauli- operator of qubit<br>\n    - If a superscript is not italicized (stands for a word or phrase), don’t parenthesize it.<br>\n  - <br>\n                Regarding the definition of a symbol :<br>\n                <br>\n    - If you write alone on one side of a defining equation, use \\coloneqq or \\eqqcolon: \\coloneqq [expression], or [expression] \\eqqcolon . The symbols \\coloneqq and \\eqqcolon relate more information than does , encoding directionality.<br>\n    - Use if does not appear alone on its side of the equation: [function of ] [result of replacing with its definition in the equation’s left-hand side].<br>\n  - <br>\n                Refer to the Cartesian axes using the formatting “[italicized letter]-axis.” Don’t include any hat, boldface, or \\vec symbol.<br>\n                <br>\n    - Example: -axis<br>\n  - Avoid denoting any index by , which means to physicists. Use instead, unless you’re writing for engineers (who denote by ).<br>\n  - Don’t use the lowercase letter l (“ell”) as an index; readers might mistake it for a one. Use (\\ell) instead.<br>\n  - Give every set-off equation a number. Readers (and coauthors) may want to refer to the equation easily when discussing the paper. Save them (and us) from having to say, e.g., “that equation halfway down page three.”<br>\n  - When writing a set-off mathematical expression, use the align environment, not the equation environment. Using the align environment, one can easily extend an expression across multiple lines.<br>\n  - <br>\n                Regarding a set-off mathematical expression that extends across multiple lines:<br>\n                <br>\n    - <br>\n                        Format the expression as follows by default.<br>\n                        <br>\n      - Put an & symbol immediately leftward of the first = sign or analogous symbol (e.g., ).<br>\n      - If any subsequent line begins with another = sign (or analogous symbol), put an & immediately leftward of the symbol. (I’ll stop writing “or analogous symbol.”)<br>\n      - Suppose that a subsequent line begins with a , –, , or . Find the symbol immediately rightward of the initial = sign. Begin the new line directly below that symbol.<br>\n      - Example:<br>\n    - <br>\n                        Modify the default formatting if necessary (a) to reduce the number of lines used in a PRL submission or (b) if the initial = appears awkwardly far to the right.<br>\n                        <br>\n      - Example of (b):<br>\n    - <br>\n                        Suppose a new line begins with a term or factor, such as the  in the example under (A). Put the corresponding , –, , or  at the beginning of the new line, not at the end of the previous line.<br>\n                        <br>\n      - Examples of inappropriate placement:<br>\n  - The symbol means “approximately equals”; and ~, “scales as.” Approximations convey more information than scaling relations do.<br>\n  - Use big-O-type notation or ~ symbols, not both; they’re partially redundant.<br>\n  - <br>\n                \\ldots, rather than \\cdots, should stand in for elements that fit a pattern.<br>\n                <br>\n    - Example:<br>\n  - <br>\n                When using \\ldots as in the previous rule, present at least two initial examples of the pattern. One can’t define the pattern.<br>\n                <br>\n    - Contains insufficient examples: For example, if is odd, then and fit the template.<br>\n  - Parentheses (), square brackets [], and curly braces {} are delimiters. If you nest them, do so in the order dictated by the Physical Review style guide. You may need to use boldface parentheses, encoded via \\bm{} commands enabled by the bm package.<br>\n  - If delimiters enclose a symbol, it shouldn’t protrude above or below them (unless the delimiters would have to be grotesquely enormous). Use the \\left and \\right commands if the delimiters appear on the same line.<br>\n  - <br>\n                An operator  isn’t a matrix; a matrix represents an operator in terms of a particular basis. Therefore, no equals sign should interrelate an  and a matrix. An arrow can.<br>\n                <br>\n    - Example:<br>\n  - Every real number is complex. Don’t say “complex” if you mean “nonreal.”<br>\n  - Consider introducing a mathematical symbol in a prose sentence without using a comma or colon. Put the symbol immediately after the word that names the object represented by the symbol.<br>\n    - Example of inappropriate placement: the set of real numbers<br>\n    - Examples of appropriate placements<br>\n      - the set of real numbers<br>\n      - the set of real numbers and<br>\n      - Recall the set of real numbers, , in Lemma 1.<br>\n- <br>\n        More mechanics of writing<br>\n        <br>\n  - Use concise sentences, as advocated for in The Elements of Style. The reader can hold only so many ideas in their head at once.<br>\n  - <br>\n                Structure sentences simply, as advocated for in The Elements of Style. The reader should be able to grasp each sentence easily.<br>\n                <br>\n    - Avoid nesting ideas within a sentence, to avoid convoluting the sentence’s structure.<br>\n    - Example of sentence with convoluted, nested structure: Any model of equilibrium and nonequilibrium behaviors of systems observed in tabletop experiments and high-energy colliders must obey the laws of relativistic quantum mechanics.<br>\n    - Visualization of the nesting: [Any model of ([(equilibrium and nonequilibrium) behaviors] of {systems observed in [(tabletop experiments) and (high-energy colliders)]})] must obey [the laws of (relativistic quantum mechanics)].<br>\n  - The ideal paper title has the structure of a newspaper headline: it presents a claim, containing a subject and a predicate.<br>\n  - <br>\n                Regarding abbreviations:<br>\n                <br>\n    - Don’t abbreviate the first word in any sentence.<br>\n    - Abbreviate “Figure,” “Section,” “Professor,” and “Appendix” if such a word appears partway through a sentence.<br>\n    - Don’t abbreviate “Sections.”<br>\n  - <br>\n                Regarding acronyms:<br>\n                <br>\n    - Write every acronym in capital letters, as per the Physical Review style guide.<br>\n    - Introduce each acronym the first time you use it.<br>\n    - Thereafter, use only the acronym, not the spelled-out phrase, throughout the rest of the document’s main text. You may spell out the phrase in section, figure, and table titles if doing so improves the document’s clarity.<br>\n  - Every paragraph should contain at least three sentences.<br>\n  - Wherever you insert a blank line into your LateX code, a new paragraph begins in the corresponding PDF. Insert a blank line only if you wish to begin a new paragraph. This advice applies immediately before and after set-off equations.<br>\n  - Never begin a subsection immediately after a section title. Between the two titles, overview the section. Analogous rules govern subsections and subsubsections.<br>\n  - <br>\n                Put the word “only” in the appropriate place.<br>\n                <br>\n    - For example, suppose you’ve sampled data at a point in parameter space and sampled data at no other points. “We sampled data only at ” is correct; “We only sampled data at ” is probably not. The latter claim means that (i) you might have sampled data at and (ii) you did nothing to the data apart from sample it: you didn’t analyze the data, discuss the data, etc.<br>\n  - Specify subjects and objects precisely. Often, a physicist will describe an idea in multiple lines. In the following sentence, the physicist will attempt to encapsulate the idea in the word “this.” The pronoun is too vague to specify the idea. This what? Follow the pronoun with a noun.<br>\n- <br>\n        When in doubt, consult the Physical Review style guide or The Elements of Style.<br>\n        <br>\n  - If those references don’t contain the information you seek, search for it in online writing guides. Not all such guides have equal merit, however. Lean toward guides written by human editors or published by college writing centers.<br>\n1 Collaborators have wondered why I use green; a student guessed it’s my favorite color. It isn’t; but I bleed green, having graduated from the Big Green, also known as Dartmouth College. Sometimes, I highlight certain pieces of text for one reason (e.g., to point out logical inconsistencies) and other text for another reason (e.g., to point out grammatical inconsistencies). Green distinguishes the first highlightings, while orange distinguishes the second: when not bleeding Dartmouth green, I bleed Caltech orange.<br>\n2 Don’t learn how to write from physics papers.<\/p>","content_hash":"cb63495572f799cafd887f5e70ed4de7","author":"Nicole Yunger Halpern","published_at":"2026-08-26T23:53:01","fetched_at":"2026-11-13 13:50:21","word_count" seHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-11-13 13:50:19","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"151w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-11-13 13:50:19","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"152w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrad ,"title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":null,"content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-11-13 13:50:20","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"157w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":null,"content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-11-13 13:50:20","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"158w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":null,"content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-11-13 13:50:20","word_count":87,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"159w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":null,"content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-11-13 13:50:20","word_count":75,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"160w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":null,"content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-11-13 13:50:20","word_count":86,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"162w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"66c2bb0d4d6ae9b9","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48694","title":"Qunova Computing Achieves Chemical Accuracy at 80 Qubits on Iron-Sulfur Cluster Using IBM Quantum System Two and Fugaku","url":"https://quantumcomputingreport.com/qunova-computing-achieves-chemical-accuracy-at-80-qubits-on-iron-sulfur-cluster-using-ibm-quantum-system-two-and-fugaku/","summary":"Qunova Computing achieved a breakthrough in quantum chemistry by simulating an 80-qubit iron-sulfur cluster with chemical accuracy using a hybrid approach combining IBM Quantum System Two and the Fugaku supercomputer. Their HI-VQE algorithm reduced classical computing costs by approximately 300x while matching classical benchmarks. This advancement has significant implications for understanding complex biological and industrial processes. The post Qunova Computing Achieves Chemical Accuracy at 8","content":"<p>South Korean quantum algorithm developer Qunova Computing has demonstrated chemical accuracy in an 80-qubit electronic-structure simulation of the [4Fe-4S] iron-sulfur cubane cluster, executing a hybrid workflow across an IBM Quantum System Two processor and the Fugaku supercomputer at RIKEN. Running its Handover Iterative Variational Quantum Eigensolver (HI-VQE) algorithm, the team achieved an extrapolated ground-state energy within 1.6 milliHartree (1 kcal/mol) of classical density-matrix renormalization group (DMRG) benchmarks while cutting classical supercomputing costs by roughly 300× compared to prior quantum diagonalization runs.<br>\n| Qunova HI-VQE 80-Qubit [4Fe-4S] Simulation Benchmarks |  |  | <br>\n|---|---|---|<br>\n| Benchmark Dimension | Measured Result / Specification | Comparison & Significance | <br>\n| Target System | [4Fe-4S] iron-sulfur cubane cluster (80 qubits) | Catalytic core in nitrogenase and hydrogenase enzymes; intractable for exact classical solvers. | <br>\n| Extrapolated Energy | −327.2482 ± 0.0007 Hartree | Matches classical DMRG reference (−327.2471 Ha) within chemical accuracy (1.6 mHa). | <br>\n| Classical HPC Efficiency | 2,518 Fugaku node-hours (reached −326.9821 Ha by iteration 2) | Represents an ~300× reduction in classical compute cost versus prior SQD benchmarks. | <br>\n| Compute Infrastructure | IBM Quantum System Two & RIKEN Fugaku supercomputer | Supported by Japan’s NEDO Post-5G quantum-HPC hybrid platform initiative. | <br>\nTransition-metal complexes such as iron-sulfur clusters govern critical biological and industrial processes, including nitrogen fixation and clean hydrogen synthesis, yet their strongly correlated electrons challenge both standard density functional theory and early quantum algorithms. While prior quantum-centric supercomputing experiments demonstrated subspace sampling on smaller active spaces, reaching quantitative chemical accuracy at 80 qubits has remained an open milestone.<br>\nQunova’s HI-VQE architecture couples quantum state sampling with classical subspace diagonalization without relying on linearity or spatial locality assumptions, enabling application across catalysts, battery electrodes, and pharmaceutical targets. The company plans to integrate orbital rotation and optimization routines into future releases to process between 500 million and 3 billion unique electronic configurations.<br>\nOfficial release details are available via Qunova Computing here. Supporting scientific preprints on arXiv detail the [4Fe-4S] iron-sulfur cluster study here, the foundational HI-VQE methodology here, the classical DMRG benchmark for [4Fe-4S] here, and the prior Fugaku SQD comparison study here. Related QCR coverage includes Qunova’s entry into Japan’s JHPC-quantum test user program here, the addition of HI-VQE to IBM’s Qiskit Functions Catalog here, its launch on AWS Marketplace for Amazon Braket here, and the Cleveland Clinic, RIKEN, and IBM 12,635-atom protein-ligand simulation here.<\/p>","content_hash":"dcbae9801caedcf1aae37f8e553651cc","author":"Mohamed Abdel-Kareem","published_at":"2026-11-13T03:02:16","fetched_at":"2026-11-13 13:50:18","word_count":401,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"10h","domain":"quantumcomputingreport.com"},{"id":"d8f45a5217d99e1a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48704","title":"Cleveland Clinic, RIKEN, and IBM Cross 12,000-Atom Barrier in Heterogeneous Quantum-Classical Drug Binding Simulations","url":"https://quantumcomputingreport.com/cleveland-clinic-riken-and-ibm-cross-12000-atom-barrier-in-heterogeneous-quantum-classical-drug-binding-simulations/","summary":"A collaboration between Cleveland Clinic, RIKEN, and IBM Quantum has achieved the largest heterogeneous quantum-classical (HQC) electronic-structure calculation to date, simulating protein-ligand complexes exceeding 12,000 atoms. This research utilized 156-qubit IBM Heron r2 processors and leadership supercomputers to significantly advance molecular size and fragment energy accuracy in drug binding simulations. The team developed an Embedded Wavefunction (EWF) formalism and TrimSQD to efficientl","content":"<p>A research collaboration spanning the Cleveland Clinic Foundation, the RIKEN Center for Computational Science, and IBM Quantum has executed the largest heterogeneous quantum-classical (HQC) electronic-structure calculation to date, simulating full solvated protein–ligand complexes exceeding 12,000 atoms. Detailed in a technical preprint on arXiv, the team paired two 156-qubit IBM Heron r2 processors with three leadership supercomputers to collect 3.0 billion measurement shots across 21,006 circuits, achieving a greater than 40× increase in molecular size and up to a 210× improvement in fragment energy accuracy over previous quantum-embedding benchmarks.<br>\n| 12,635-Atom HQC Biomolecular Simulation Campaign Profile |  |  | <br>\n|---|---|---|<br>\n| System Dimension | Experimental Specification | Technical & Computational Benchmark | <br>\n| Target Biomolecules | Trypsin–benzamidine (12,635 atoms) & T4-lysozyme–n-butyl-benzene (11,608 atoms) | Up to 31,795 molecular orbitals in solvated environments; >40× larger than prior 303-atom Trp-cage benchmark. | <br>\n| Quantum Hardware | Two 156-qubit IBM Heron r2 QPUs (ibm_cleveland & ibm_kobe) | 21,006 circuits executed using up to 94 active qubits over 239+ QPU hours, gathering 3.0 × 109 samples. | <br>\n| Classical HPC Systems | Fugaku (152,064 nodes), Miyabi-G (1,104 GH200 nodes), & ROQUO (126 GB200 nodes) | Distributed GPU-accelerated Selected-Basis Diagonalization (SBD-G) reaching 72.5% strong-scaling parallel efficiency. | <br>\n| Fragment Solver Accuracy | TrimSQD & O(1)-scaling Embedded Wavefunction (EWF) | 0.10 mHa deviation vs. DMRG on trypsin’s largest 45-orbital fragment (210× accuracy gain over ExtSQD). | <br>\n| Biochemical Deliverable | First HQC protein–ligand binding energy prediction | Mixed-basis (3-21G / STO-3G) workflow resolved T4-lysozyme binding affinity at −21.07 kcal/mol. | <br>\nAccurately predicting how small-molecule drugs bind to target proteins requires solving the many-electron Schrödinger equation across thousands of solvated atoms, a regime where standard density functional theory approximations can misrank binding affinities and full-system wavefunction methods exceed classical memory limits. To bridge this gap, the researchers introduced a localized Embedded Wavefunction (EWF) formalism that partitions large macromolecules into spatially bounded atomic neighborhoods, reducing fragment construction costs from cubic O(M3) scaling to constant O(1) scaling per fragment.<br>\nFor heavy-atom fragments spanning 13 to 45 molecular orbitals, the team developed TrimSQD, an extension of sample-based quantum diagonalization that iteratively filters and merges electronic configurations across distributed GPU subgroups before performing a final subspace diagonalization. Using a Prefect-based automated workflow controller to orchestrate asynchronous job queues between IBM Quantum Runtime and the ROQUO supercomputer, the pipeline processed 608 million measurement samples in 62.4 hours of wall-clock time without manual intervention.<br>\nThe campaign was supported by the U.S. National Science Foundation, the National Institutes of Health, Japan’s New Energy and Industrial Technology Development Organization (NEDO), and the MEXT Supercomputer Fugaku program.<br>\nThe full technical manuscript is available on arXiv here. Related QCR reporting on IBM’s managed hybrid workflows and SQD scaling includes IBM’s QDC 2026 platform announcements here, and IBM and Mitsubishi Chemical’s 70-qubit generative quantum eigensolver study here.<\/p>","content_hash":"364efbf1245b238555c55727363a4946","author":"Mohamed Abdel-Kareem","published_at":"2026-11-13T03:01:11","fetched_at":"2026-11-13 13:50:18","word_count":475,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"10h","domain":"quantumcomputingreport.com"},{"id":"9971b12cce00e0c5","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48696","title":"LTM Becomes First Global Systems Integrator to Launch Function in IBM Quantum Functions Catalog with AI-QEM","url":"https://quantumcomputingreport.com/ltm-becomes-first-global-systems-integrator-to-launch-function-in-ibm-quantum-functions-catalog-with-ai-qem/","summary":"LTM has launched its AI-QEM software in the IBM Quantum Functions Catalog, becoming the first global systems integrator to do so. This software utilizes an AI-powered approach to mitigate hardware noise in quantum circuits without additional quantum processing unit (QPU) runtime. It has demonstrated high accuracy on up to 100-qubit circuits and provides a more efficient alternative to conventional error-mitigation protocols. The post LTM Becomes First Global Systems Integrator to Launch Function","content":"<p>Global technology services firm LTM (a Larsen & Toubro Group company) has deployed its proprietary AI-QEM (AI-powered Quantum Error Mitigation) software in the IBM Quantum Functions Catalog, becoming the first global systems integrator to publish a circuit function on the platform. Available to IBM Quantum Premium, Flex, and On-Prem Plan users via the ltm/ai-qem interface, the function integrates into Qiskit Estimator workflows to suppress hardware noise through classical deep-learning inference.<br>\n| LTM AI-QEM Circuit Function Specifications & Benchmarks |  |  | <br>\n|---|---|---|<br>\n| System Dimension | Technical Specification | Measured Benchmark / Platform Impact | <br>\n| Model Architecture | Graph Convolutional Network (GCN)-Transformer | Predicts per-Pauli correction factors (ζi) from circuit structure, backend topology, and qubit calibrations. | <br>\n| Hardware Overhead | Zero additional QPU runtime, circuit repetitions, or ancilla qubits | Matches native IBM EstimatorV2 QPU times (12 s commuting / 23 s non-commuting on ibm_kingston). | <br>\n| Hardware Benchmarks | Up to 100 qubits on IBM Heron r2 processors | Achieved 95.06% accuracy on 100-qubit Clifford circuits (depth 45) and 90.29% on 96-qubit 2D Ising runs. | <br>\n| Current Scope & Limits | IBM Heron processor family; applied when \\|⟨O⟩noisy\\| ≥ 0.1 | Targets non-trivial expectation values while avoiding noise amplification near zero. | <br>\nPhysical quantum processors remain constrained by gate errors and environmental decoherence that bias expectation values as circuit depth and qubit counts increase. Conventional error-mitigation protocols such as zero-noise extrapolation (ZNE) and probabilistic error cancellation (PEC) compensate for noise by executing ensembles of modified circuits, introducing exponential sampling overheads that inflate quantum runtime costs.<br>\nLTM’s circuit-agnostic approach bypasses additional quantum sampling by decomposing observables into Pauli operators and applying trained classical neural networks to rescale each noisy expectation value (⟨Pi⟩mitigated = ⟨Pi⟩noisy / ζi). Across 80- to 150-qubit validation suites, the GCN-Transformer architecture recorded a mean absolute error (MAE) of 0.343, outperforming random-forest mitigation baselines. The launch is accompanied by an IBM Quantum tutorial covering Trotterized time evolution of the 2D tilted-field Ising model.<br>\nOfficial release details are available via the LTM newsroom here. Catalog access, API documentation, and tutorials are accessible on the IBM Quantum Functions Catalog here, IBM Quantum Docs here, and the IBM Quantum Tutorials index here. Related QCR coverage of IBM’s Quantum Functions Catalog expansion at QDC 2026 is accessible here.<\/p>","content_hash":"a64ad8fd4e5f1b2604fd1112463bbb68","author":"Mohamed Abdel-Kareem","published_at":"2026-11-13T02:37:56","fetched_at":"2026-11-13 13:50:18","word_count":386,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"11h","domain":"quantumcomputingreport.com"},{"id":"f7df401c162312c6","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48683","title":"Kipu Quantum Launches Rimay Quantum Feature Extraction in IBM Quantum Functions Catalog","url":"https://quantumcomputingreport.com/kipu-quantum-launches-rimay-quantum-feature-extraction-in-ibm-quantum-functions-catalog/","summary":"Kipu Quantum has launched its Rimay quantum feature extraction service on the IBM Quantum Functions Catalog, allowing IBM Quantum users to access quantum-enhanced machine learning for feature engineering. This service, which operates as a preprocessing layer for classical machine learning models, has demonstrated improved recall and AUC scores in credit risk classification. It's designed to provide enriched data matrices for use with standard frameworks like scikit-learn. The post Kipu Quantum L","content":"<p>Quantum software developer Kipu Quantum has made its Rimay quantum feature extraction service available in the IBM Quantum Functions Catalog, giving IBM Quantum Flex, Premium, and On-Prem Plan users direct API access to quantum-enhanced machine learning within existing data science pipelines. Following the earlier catalog release of Kipu’s Iskay Quantum Optimizer, Rimay expands the company’s commercial presence on IBM Quantum hardware from combinatorial optimization into tabular and multimodal feature engineering.<br>\n| Kipu Quantum Rimay Function Specifications & Hardware Benchmarks |  |  | <br>\n|---|---|---|<br>\n| System Dimension | Operational Specification | Measured Benchmark / Platform Impact | <br>\n| Algorithmic Method | Digitized counterdiabatic evolution of spin-glass Hamiltonians | Extracts single-body expectations and two-body qubit correlations for classical classifiers. | <br>\n| Workload Capacity | Up to 156 features (1 qubit per feature) & 15,000 samples per job | Supports Small (≤2,999), Medium (3,000–9,999), and Large (10,000–15,000) compute tiers up to 10M shots. | <br>\n| Nighthawk r2 Runtime | 48-qubit German credit dataset (1,000 samples, 5,000 shots) | Cuts QPU usage from 22 min on Heron r3 (ibm_boston) to 2 min on Nighthawk r2 (ibm_phoenix). | <br>\n| Classifier Uplift | Hybrid Random Forest (classical + quantum features) | Increases recall from 0.921 to 0.957 and AUC from 0.781 to 0.798 over classical baselines. | <br>\nRather than replacing established machine learning models, Rimay operates as a drop-in preprocessing layer between train-test data splitting and classical model training. During the initial fit-transform phase, the function maps normalized numerical features to individual qubits and encodes pairwise mutual information into Hamiltonian coupling terms. After executing digitized counterdiabatic circuits on the quantum processor, it returns an enriched CSV matrix that teams can feed directly into standard frameworks such as scikit-learn, XGBoost, CatBoost, or LightGBM.<br>\nTo support repeatable production inference, Rimay stores the trained Hamiltonian topology under a persistent mapping_id bound to the calibrated processor layout. Data science teams can subsequently invoke transform mode on new, unlabeled datasets without re-fitting the feature map, or pair the service with Kipu’s offline classical surrogate framework to eliminate quantum hardware dependencies during high-volume inference.<br>\nKipu Quantum noted that Rimay was recently deployed with a Fortune 100 enterprise on an IBM Quantum Nighthawk processor to enhance customer-intent prediction models on tabular datasets. The release is accompanied by an end-to-end credit-risk classification tutorial in IBM Quantum documentation.<br>\nOfficial announcement details are available via the Kipu Quantum newsroom here and the Rimay product overview here. Catalog access and technical documentation are accessible on the IBM Quantum Functions Catalog here and IBM Quantum Docs here. Supporting scientific preprints on arXiv detail digitized counterdiabatic quantum feature extraction here and quantum-enhanced satellite image classification here. Related QCR coverage includes Kipu Quantum’s initial Rimay launch here, its offline surrogate inference framework here, and IBM’s QDC 2026 Nighthawk roadmap here.<br>\nNovember 13, 2026<\/p>","content_hash":"43a38f28b5327a7ef9944d2c74ed66b9","author":"Mohamed Abdel-Kareem","published_at":"2026-11-13T01:15:01","fetched_at":"2026-11-13 13:50:18","word_count":469,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"12h","domain":"quantumcomputingreport.com"},{"id":"b01f55b705abe41b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48677","title":"PsiQuantum and AMD Expand Partnership with Equity Investment to Co-Design Utility-Scale Quantum Infrastructure","url":"https://quantumcomputingreport.com/psiquantum-and-amd-expand-partnership-with-equity-investment-to-co-design-utility-scale-quantum-infrastructure/","summary":"PsiQuantum and AMD are expanding their partnership with an equity investment from AMD to co-design the infrastructure for fault-tolerant quantum systems. The collaboration integrates AMD's GPUs, CPUs, and software with PsiQuantum's silicon photonics architecture to enhance real-time error correction and classical computing for hybrid workloads. They are prioritizing pharmaceutical research and molecular simulation, with plans to present further technical details at the SC26 supercomputing confer","content":"<p>Photonic quantum computing developer PsiQuantum and semiconductor leader AMD (NASDAQ: AMD) have announced an expanded strategic partnership, accompanied by a planned equity investment from AMD, to co-design the classical and quantum computing infrastructure required for fault-tolerant quantum systems. Building on PsiQuantum’s existing adoption of AMD Versal adaptive system-on-chips, the collaboration integrates AMD Instinct GPUs, EPYC CPUs, and the ROCm open software stack with PsiQuantum’s silicon photonics architecture.<br>\n| PsiQuantum and AMD Hybrid Infrastructure & Co-Design Scope |  |  | <br>\n|---|---|---|<br>\n| Collaboration Layer | Technology / Platform | Operational & Strategic Function | <br>\n| Real-Time Error Correction | PRISM ML Decoder on AMD Versal Adaptive SoCs | Executes low-latency syndrome decoding on programmable hardware accelerators for utility-scale photonic QPUs. | <br>\n| Classical Compute Fabric | AMD Instinct GPUs, EPYC CPUs & ROCm Stack | Provides high-performance classical acceleration and unified software orchestration for hybrid workloads. | <br>\n| Target Application Domain | Covalent Inhibitor & Biological Modeling | Applies proprietary computational chemistry workflows on GPUs to oncology drug discovery under DOE Quantum Genesis. | <br>\n| Capital & Facility Footprint | AMD Equity Stake & Chicago IQMP Expansion | Reinforces commercial alignment and explores joint deployment at the Illinois Quantum and Microelectronics Park. | <br>\nOperating fault-tolerant photonic quantum computers at utility scale requires massive classical co-processing capacity to process error syndromes within strict optical clock cycles. Working alongside AMD engineers, PsiQuantum researchers tailored their machine-learning decoder, PRISM, to bridge classical logic and photonic control loops without introducing latency bottlenecks.<br>\nOn the commercial application side, the companies are prioritizing pharmaceutical research and molecular simulation. By running PsiQuantum’s proprietary computational chemistry methods on high-performance GPUs, the partnership aims to deliver immediate classical simulation gains while preparing enterprise drug discovery pipelines for future fault-tolerant quantum hardware.<br>\nAs part of their broader regional expansion, both organizations are evaluating a co-located presence in Chicago, where PsiQuantum serves as the anchor tenant for the state’s flagship quantum campus. The two companies will present further technical details on their joint roadmap at the SC26 supercomputing conference in Chicago from November 15 to 20.<br>\nOfficial announcement details are available via the PsiQuantum newsroom here. Related QCR coverage of PsiQuantum’s hardware, software, and infrastructure milestones includes its 8×8 optical circuit switch demonstration here, public access to its Construct fault-tolerant algorithm design suite here, and its anchor tenancy at the Illinois Quantum and Microelectronics Park here.<\/p>","content_hash":"ad2b9e644d4153b5b2ae443cbcf16e61","author":"Mohamed Abdel-Kareem","published_at":"2026-11-13T00:57:02","fetched_at":"2026-11-13 13:50:18","word_count":400,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"12h","domain":"quantumcomputingreport.com"},{"id":"41269aa34522a34a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48665","title":"IBM Unveils 520-Qubit Nighthawk r3 Processor, 1,040-Qubit Linked Roadmap, and Managed Hybrid Workflows at QDC 2026","url":"https://quantumcomputingreport.com/ibm-unveils-520-qubit-nighthawk-r3-processor-1040-qubit-linked-roadmap-and-managed-hybrid-workflows-at-qdc-2026/","summary":"IBM introduced the Nighthawk r3 processor with 520 programmable qubits and a roadmap to 1,040 qubits by 2027, demonstrating advancements in quantum computing hardware and software. The company also unveiled an expanded software stack, including Managed Workflows, and reported significant speedups and circuit executions with its Nighthawk r2 processors. These developments are geared towards achieving fault-tolerant quantum systems and addressing complex applications in chemistry, materials scienc","content":"<p>At its annual Quantum Developer Conference (QDC 2026) in Yorktown Heights, IBM (NYSE: IBM) unveiled its next-generation superconducting processor, IBM Quantum Nighthawk r3, alongside operational benchmarks from its active Nighthawk r2 fleet and an expanded software stack uniting classical high-performance computing with quantum execution. Scheduled for 2027, the Nighthawk r3 architecture is engineered to execute 10,000 quantum operations across 520 programmable qubits, with plans to link two chips via high-fidelity couplers into a 1,040-qubit system.<br>\n| IBM Quantum Nighthawk Architecture & Roadmap Progression |  |  | <br>\n|---|---|---|<br>\n| System Specification | IBM Quantum Nighthawk r2 (Deployed Sept 2026) | IBM Quantum Nighthawk r3 (Planned 2027) | <br>\n| Programmable Qubits | 120 programmable qubits (458 physical qubits) | 520 programmable qubits (2,034 physical qubits); 1,040 qubits via 2-chip link | <br>\n| Gate Operation Budget | >7,500 accurate two-qubit operations | 10,000 accurate two-qubit operations | <br>\n| Sampling & Reset Speed | Up to 100,000 samples/sec (100 kHz reset; 25× faster than Heron) | High-speed square-lattice architecture with rapid on-chip qubit reset | <br>\n| Modular Interconnects |
