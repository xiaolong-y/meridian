l feature with the full Clifford group: adding just one suitable non-Clifford gate type makes it universal. Together, these gates let us approximate any quantum computation as accurately as we like.<br>\nClients could always ask Lucy for someone a little taller or a little wealthier. But with automorphism gates, there’s a clear limit to what you can ask for.<br>\n(2) The anatomy of a good match<br>\nThe automorphism gates of CSS codes have a useful structure. Every automorphism combines physical single-qubit Cliffords and permutations to produce a logical gate. For a CSS code, we find that—apart from a special case discussed in the paper—the Clifford layer and the permutation are each on their own valid logical gates. We can apply either part independently while preserving the encoding.<br>\nThis makes studying CSS automorphisms much simpler. We can study which logical gates come from physical single-qubit Cliffords, study which come from permutations, and then combine the answers.<br>\nThe two ingredients also have complementary capabilities. Physical single-qubit Cliffords cannot implement logical CNOT or SWAP gates. In the generic CSS setting, their largest attainable logical group is generated by addressable S and CZ gates, where CZ is a two-qubit entangling phase gate.<br>\nPermutations fill the other role. Their largest attainable logical group is generated by all addressable CNOTs, but they cannot implement logical S or CZ gates. Together, the two ingredients can attain the maximum automorphism group from the previous section.<br>\nLike good partners, they can each stand on their own—and together, they complete each other.<br>\n(3) High standards, higher qubit counts<br>\nIn the first result, I gave my ideal code an unlimited physical-qubit budget. Now it’s time to put that budget back into the picture.<br>\nFor a stabilizer code encoding k > 2 logical qubits, supporting all addressable logical CNOTs through automorphisms requires at least<br>\nphysical qubits. That’s exponential growth. Since the maximum automorphism group contains all these CNOTs, reaching that maximum inherits the same cost. This extends earlier bounds on phantom codes.<br>\nThis bound is tight: a certain type of phantom code attains it.<br>\nThe other ingredient from the previous section is considerably cheaper. Supporting all addressable logical S and CZ gates through physical single-qubit Cliffords requires only<br>\nWe also attain this quadratic bound with complete-graph codes. Their construction uses one physical qubit to store each logical qubits parity and one physical qubit for each pair of qubits to store the pairwise parities—whether the corresponding bits agree or differ. This information allows physical single-qubit phase gates to implement logical CZs.<br>\nThere is an important qualification. The bounds hold at every code distance, but our constructions attain these exact minima at distance one, where some single-qubit errors can go undetected. We can increase the distance through concatenation: encoding each physical qubit in a suitable additional code. This preserves the gate capabilities and adds physical qubits. Finding the optimal cost at a specified higher distance remains open.<br>\nSo a gate can be cheap to apply while demanding an expensive code.<br>\nAs with finding a partner, the details of the wish list matter. For quantum codes, the full set of addressable CNOTs is a much more expensive request than all addressable S and CZ gates.<br>\n(4) Looking for love in the wrong metrics<br>\nS and CZ have something important in common: they are diagonal gates. They change the relative phases between basis states without mixing those states. We wondered whether their relatively low qubit cost extends to diagonal non-Clifford gates.<br>\nIt does. Here we expand the physical toolbox beyond automorphisms, allowing diagonal single-qubit rotations that needn’t be Cliffords.<br>\nFor example, we construct codes supporting all addressable logical T, controlled-S, and controlled-controlled-Z (CCZ) gates using only physical single-qubit phase rotations. T applies an eighth-turn phase, while the controlled gates make phase changes depend on additional qubits. Supporting this whole collection requires only cubically many physical qubits.<br>\nMore generally, the polynomial scaling persists at every fixed level t of the Clifford hierarchy, a sequence of gate classes extending beyond Cliffords. We can support all addressable diagonal logical gates at that level using<br>\n\\(n = O(k^t)\\)<br>\nphysical qubits. Our complete-hypergraph codes attain the corresponding bounds by extending the pairwise-parity construction to larger subsets of logical qubits. As before, the exact minima occur at distance one, and suitable concatenation increases the distance while preserving the gates.<br>\nSo being non-Clifford doesn’t automatically make a gate set expensive in physical qubits. In this setting, the sharp cost separation lies between diagonal gates and CNOT-type gates.<br>\nThere’s another misleading metric: group size. These diagonal non-Clifford groups can contain many more logical operations than the entire CNOT group, yet require polynomially many physical qubits where the CNOT group requires exponentially many.<br>\nNeither the Clifford label nor the group’s size tells me what the relationship will cost.<br>\nHappily ever after, subject to constraints<br>\nSo how did this project change my approach to matchmaking code construction?<br>\nAutomorphism gates are not something to blindly maximize. Achieving the maximum comes at the price of an encoding rate that falls rapidly as k grows. Maximum gate sets may still be worthwhile for moderate k, especially as hardware scales. But, when high rate is a priority, I should choose automorphisms selectively, targeting the expensive operations I want them to replace.<br>\nI also need to look at the structure of the logical action. Neither Cliffordness nor logical-group size reliably predicts physical-qubit cost.<br>\nThere are plenty of questions left. Here are a few I’m particularly keen to answer:<br>\n- How does the minimum qubit cost depend on distance?<br>\n- How much can we save by asking for a smaller gate set—for example, CNOTs between only selected logical pairs?<br>\n- Can we extend the theory to arbitrary physical single-qubit gates? These retain the appeal of simple, depth-one circuits. We need better methods for finding and analyzing codes that support them.<br>\n- How should we uses automorphisms? They can perform logical gates directly or help make code surgery cheaper. What combination gives the greatest benefit for a particular workload and hardware platform?<br>\n- What changes if we allow more general physical two-qubit gates? These could act within a codeblock or between blocks. Which new logical operations become possible, and what do they cost in connectivity, circuit depth, and error spreading?<br>\nIf you’ve only skimmed this post, feel free to discuss it at your next party as though you read every word. Just make sure my wife isn’t there.<\/p>","content_hash":"736229971a457c62fdaccbb28fc199cf","author":"Shayan Majidy","published_at":"2026-11-19T06:00:00","fetched_at":"2026-11-26 16:16:00","word_count":1996,"read_time_minutes":10,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"1w","domain":"quantumfrontiers.com"},{"id":"0da679643a8d430e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18451","title":"For azure views","url":"https://quantumfrontiers.com/2026/11/15/for-azure-views/","summary":"The first time I moved to England, I brought the book The Age of Wonder. In it, biographer Richard Holmes sketches scientists who marveled at nature during the Romantic Era. I met Joseph Banks, William and Caroline Herschel, and Humphry Davy while reveling in condensed-matter theory as a research assistant at Lancaster University. This August, I moved to the University of Cambridge for the rest of the summer and much of the fall. My baggage included an e-copy of Holmes’s most recent book. The Bo","content":"<p>The first time I moved to England, I brought the book The Age of Wonder. In it, biographer Richard Holmes sketches scientists who marveled at nature during the Romantic Era. I met Joseph Banks, William and Caroline Herschel, and Humphry Davy while reveling in condensed-matter theory as a research assistant at Lancaster University.<br>\nThis August, I moved to the University of Cambridge for the rest of the summer and much of the fall. My baggage included an e-copy of Holmes’s most recent book. The Boundless Deep profiles Alfred Tennyson, who served as poet laureate of the United Kingdom for approximately 42 of Victoria’s nearly 64 years as queen. Even if Tennyson’s name doesn’t ring a bell, some of his verses might—partially because those verses chime with a bell’s sonorousness. Tennyson wrote, “’Tis better to have loved and lost / Than never to have loved at all,” in an elegy for a friend. That friend’s death—the heartlessness and violence of mortality—led Tennyson to write of “Nature, red in tooth and claw.” He also glorified heroism, depicting the ancient Greek Odysseus as yearning “[t]o strive, to seek, to find, and not to yield.”1<br>\nTennyson grew up in Lincolnshire, on the eastern coast of England. He adored the sea, whose wildness and grandeur infused his spirit. As an undergraduate at the University of Cambridge, Tennyson formed friendships that helped sustain him for decades. Former schoolmates hosted him in their homes, encouraged him, criticized him with affection, and urged him to publish his poetry. For years, Tennyson published little: he drifted from house to house, chain-smoked, recited poetry to friends for hours in the evenings, and waffled about his love for fellow Lincolnshire native Emily Sellwood. The two married once Tennyson published his elegy and the public responded with rapture. The poet laureateship followed that year.<br>\nHolmes tracks not only Tennyson’s path through literature, but also the poet’s appetite for science and technology. Discoveries and inventions fascinated Tennyson. At Cambridge, he studied under William Whewell, whose contributions to mathematics, physics, astronomy, geology and more defy cataloguing. The back of Holmes’s book lists “some popular science books read by Young Tennyson.” They include Darwin’s On the Origin of Species by Means of Natural Selection; a guide to microscopes; and a treatise by mathematician, co-founder of computer science, and steampunk inspiration Charles Babbage.<br>\nScience suffused Tennyson’s poetry, Holmes argues. The biographer illustrates with The Princess, an 1847 poem that advocates for higher education for women. The poem opens with a science festival: “a fire-balloon / Rose gem-like up before the dusky groves.” In steampunk fashion, “round the lake / A little clock-work steamer paddling plied / And shook the lilies.” You can read the rest of the description in what appears to be a first edition. The scene opens in the stanza that begins nearly halfway down the following right-hand page.<br>\nSub-librarian Steven Archer plucked the book for me from the Wren Library at Trinity College, Cambridge this November. Trinity postdoctoral fellow Andrea Pizzi had guessed that I’d appreciate the library and invited me to visit. He guessed correctly.<br>\nThe Boundless Deep has appealed to me not only because it highlights the Victorian era—what has become my era—or because it meshes science with poetry. I also view the book as offering guidance about a technology gnawing at society today: artificial intelligence. You don’t need for me to recap the shock delivered by AI to many people’s sense of humanity, the horror sweeping the globe. But did you know how similarly the Victorians felt?<br>\nDuring the 1800s, geologists Charles Lyell, Roderick Murchison, and others found evidence of extinctions. They unearthed fossils from species extinguished eons beforehand. The scale of those destructions boggled the Victorians’ minds. A species consists of so many creatures—so many wriggling, striving living beings. How could an entire species disappear from the face of the Earth? How could so many species have disappeared? Would humanity share their fate? If so, why bother living, striving, wriggling?<br>\nAs Holmes writes, “Geology soon became an area of spiritual terror, with claustrophobic glimpses of a cruel, meaningless, godless physical world closing in on the heels of humanity. It was full of monsters, dust and extinctions, making nonsense of any idea of progress or individual immortality.” Nature, red in tooth and claw, indeed.<br>\nI’ve been reading The Boundless Deep alongside headlines about cyber hacks, job losses, bias studies, and mathematician breakdowns attributable to AI. To the extent that AI poses problems for society, I don’t have silver bullets. But I take comfort in humanity’s having experienced similar tremors in the past. Granted, AI and extinctions differ in some ways, despite resembling each other. And perhaps we shouldn’t respond as the Victorians did. Most people today take extinctions for granted, and schoolchildren effuse about the fossils that alarmed Tennyson’s contemporaries. Perhaps future generations will view AI as the Victorians viewed those fossils. Either way, we’re not alone: the Victorians felt as many people do today.<br>\nAnd we know how Tennyson responded: with poetry.<br>\nWith thanks to Andrea Pizzi; Steven Archer; the Isaac Newton Institute for Mathematical Sciences; and King’s College, Cambridge.<br>\n1Tennyson used the Latin name Ulysses for Odysseus.<\/p>","content_hash":"b634a4defa5a2fd77fc11680ee92e61e","author":"Nicole Yunger Halpern","published_at":"2026-11-16T07:25:25","fetched_at":"2026-11-26 16:16:00","word_count":859,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"1w","domain":"quantumfrontiers.com"},{"id":"a0e4bf6201213896","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10321","title":"More podcasts, conversations, talks","url":"https://scottaaronson.blog/?p=10321","summary":"Here&#8217;s my talk &#8220;Are We Cooked?&#8221; about the AI Mathocalypse&#8212;the one where, every time I give it, I need to update it with all the big theorems AI has proved since the last time I gave the talk. This version is from the Institute for Foundations of Machine Learning (IFML) here at UT Austin, back on October 2 (so, ancient times). Here I am with Rabbi Neil Blumofe of Agudas Achim synagogue in Austin. Rabbi Blumofe asks me about quantum mechanics, AI, consciousness, free will, ","content":"<p>The Blog of Scott Aaronson If you take nothing else from this blog: quantum computers won't solve hard problems instantly by just trying all solutions in parallel.<br>\nHere’s my talk “Are We Cooked?” about the AI Mathocalypse—the one where, every time I give it, I need to update it with all the big theorems AI has proved since the last time I gave the talk. This version is from the Institute for Foundations of Machine Learning (IFML) here at UT Austin, back on October 2 (so, ancient times).<br>\nHere I am with Rabbi Neil Blumofe of Agudas Achim synagogue in Austin. Rabbi Blumofe asks me about quantum mechanics, AI, consciousness, free will, why I say “please” and “thank you” to GPT, and why I blog about Israel. The questions from the audience, unexpectedly, were more like “will cryptocurrencies that use RSA or Diffie-Hellman take longer to break with quantum computers than those that use elliptic curve cryptography?” Thanks to Rabbi Blumofe for doing this.<br>\nAnd here’s a podcast with Yu Shen, with Chinese subtitles. I haven’t watched this one and don’t remember what we talked about. (Oh — looking at the title graphic, apparently we talked about when AI will solve the P vs NP problem?)<br>\n62 Responses to “More podcasts, conversations, talks”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"1cccb8b5b7ab1073bfd9994fcbd0afb6","author":"Scott","published_at":"2026-11-15T14:30:28","fetched_at":"2026-11-26 16:15:55","word_count":370,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"f98a357a67e50529","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10318","title":"Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!","url":"https://scottaaronson.blog/?p=10318","summary":"Enjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code&#8217;s limitations. She doesn&#8217;t get to the soundness analysis. Feel free to ask questions in the comments. I mig","content":"<p>The Blog of Scott Aaronson If you take nothing else from this blog: quantum computers won't solve hard problems instantly by just trying all solutions in parallel.<br>\nEnjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code’s limitations. She doesn’t get to the soundness analysis.<br>\nFeel free to ask questions in the comments. I might write some notes here later with my own doofus understanding of Dana’s talk. Experts are of course hard at work on more formal writeups of the proof (which will hopefully be more comprehensible than the AI’s writeup).<br>\nThis entry was posted<br>\non Tuesday, November 10th, 2026 at 2:27 pm and is filed under AI, Announcements, Complexity.<br>\nYou can follow any responses to this entry through the RSS 2.0 feed.<br>\nYou can leave a response, or trackback from your own site.<br>\n144 Responses to “Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"f7a800a85a7d77e79118fdb829a66b1d","author":"Scott","published_at":"2026-11-10T20:27:28","fetched_at":"2026-11-26 16:15:56","word_count":367,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"3a6f0747d33bd6f2","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10295","title":"Aaronson-Ambainis Conjecture proved!  (By AI, of course)","url":"https://scottaaronson.blog/?p=10295","summary":"The &#8220;For Dummies&#8221; Version (apologies for not including this earlier): Yes, an AI solved a big open problem about quantum computing No, this doesn&#8217;t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter What it does, is to rule out a potential class of quantum speedups that most of us didn&#8217;t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially ","content":"<p>Aaronson-Ambainis Conjecture proved! (By AI, of course)<br>\nThe “For Dummies” Version (apologies for not including this earlier):<br>\n- Yes, an AI solved a big open problem about quantum computing<br>\n- No, this doesn’t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter<br>\n- What it does, is to rule out a potential class of quantum speedups that most of us didn’t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially faster than any classical algorithm)<br>\n- It means my prediction was right, so you should listen to me more in the future!<br>\nWe now, of course, live in age where longstanding open problems in quantum computing theory (and all theoretical computer science, and all math) are dropping like flies, to the extent that there’s no way I could possibly do a post on each and every bombshell. But I can’t exactly avoid the Aaronson-Ambainis Conjecture, given that my name is on it, and that I cared about the answer to this one (back in 2019, I even blogged about an attempted solution that ultimately turned out to be fallacious).<br>\nFor those tuning in from home, the AA Conjecture, which Andris and I posed back in 2009, says that every degree-d polynomial p:{0,1}n→[0,1] in n Boolean variables, with constant variance, has some variable whose influence is at least 1/poly(d). The reason Andris and I cared about this conjecture is that, as we proved, it implies that there’s no superpolynomial advantage of quantum query complexity over classical query complexity for decision problems that works on most Boolean inputs. Or, in terms of complexity classes, that there’s no hope of separating P from BQP relative to a random oracle, without proving P≠BQP or something of the kind in the unrelativized world. This would finally answer a question of Fortnow and Rogers from 1998.<br>\nThe connection between quantum algorithms and polynomials came from the famous 1998 paper of Beals et al., which showed that, if Q is a quantum algorithm that makes T queries to an oracle X, then Pr[Q(X) accepts] can be written as a multivariate real polynomial p(X) in the bits of X, of degree at most 2T. The proof of my and Andris’s result is then simply this: take the polynomial p, find in it a variable of influence at least 1/poly(T), and query that variable, and keep repeating until there’s no longer such an influential variable—at which point, by assumption, p is nearly a constant polynomial, which means you’ve learned whether Q accepts with high probability over X. This provides a classical simulation of the quantum algorithm Q—a simulation that makes poly(T) queries to the oracle X and that works for most X’s.<br>\nThe AA Conjecture caught on to an extent Andris and I couldn’t have predicted. Some who worked on it barely even cared about the implication for quantum computing, and just wanted to solve the problem about polynomials! There were, I’m both proud and sorry to report, Fourier analysis experts and grad students who oriented their whole research programs around trying to prove AA, with lots of proofs of special cases, some of them very recent. A proof of full AA was one of the last remaining open problems in quantum query complexity that everyone seemed to agree was centrally important. I was surprised, honestly, to see it missing from OpenAI’s Mathocalypse dump a few weeks ago. Surely they tried it, so was it really so much harder than all the problems that were solved?<br>\nNow a startup called Physical Superintelligence has announced a proof of the AA Conjecture, specifically showing that there’s a variable of influence at least ~1/d6, which they say they obtained using their proprietary research harness on an internal Claude model. (What role the harness played, compared to the internal model, is something I don’t know.) The effort was led by David Turturean and Jim Halverson at PSI. They actually let me know about this several weeks ago, but I had to keep it secret until the announcement late last week.<br>\nI haven’t yet understood the proof, although I hope to. In the meantime, though, I believe the proof is correct for two reasons. Firstly, there’s a Lean certificate, and secondly, human experts (I’m no longer an expert on my own conjecture!) have already gone over it and understood it. In fact, there’s already a beautiful-looking exposition written by Guy Blanc of MIT and Jordan Docter, Carmen Strassle, and Li-Yang Tan of Stanford, which looks like a perfect starting point for those seeking to go much deeper. [Update: There’s now even a 5-page proof of Aaronson-Ambainis by my former postdoc Supartha Podder, and his students Thomas Huffstutler and David Miloschewsky! I’ll probably start there!] Or, for those seeking to go only slightly deeper, PSI’s blog post on the advance is sufficiently well-written that it saves me from the need to write too much more here.<br>\nAlas, as reported by Ashley Montanaro, there were the usual forehead-banging misconceptions about what this result means for quantum computing. So for example, Pedro Domingos of U. of Washington blasted out to his 137,000 X followers that the proof means that “the dream of quantum supremacy is dead.” The truth, as Pedro knows perfectly well (or easily could know), is that it rules out one particular type of quantum supremacy (namely, for yes-or-no problems relative to random oracles) that we’d already conjectured didn’t exist anyway. It doesn’t undermine any form of quantum supremacy that we did conjecture to exist! It has zero effect, for example, on Shor’s factoring algorithm, which uses a highly non-random (periodic) oracle for the key internal step. It has zero effect on the simulation of quantum physics and chemistry, which generally doesn’t depend on oracle algorithms at all. Even just relative to random oracles, the Yamakawa-Zhandry breakthrough from 2022 dramatically underscored that, if we switch our attention from decision problems to other kind of problems (in Yamakawa and Zhandry’s case, to NP search problems), then exponential quantum speedups do become possible. Anyway, this was sufficiently intellectually dishonest on Pedro’s part that it makes me disinclined to take him seriously about anything ever again [ADDED: I appreciate that Pedro has now posted a partial correction, saying “or maybe not”].<br>\nBut, OK, given how radically new it is to have an AI solve so many of our longstanding open problems, I suppose “people are wildly misinterpreting a QC advance on social media” is an almost comfortingly familiar problem to have!<br>\nIf you’re wondering how I feel about the proof of AA—well, much like my wife Dana with the Unique Games Conjecture, it’s many different emotions at once.<br>\n- Satisfied that our conjecture turned out to be true after all (it’s nice to be 100% right about something from time to time!)<br>\n- Awestruck by the new reality of the world in which we live in<br>\n- Disappointed that humans didn’t get to snag this conjecture before the robots did (with some more years, I think it’s very likely that they would have)<br>\n- Fatigued by the endless wonders from Aladdin’s Cave, the neverending buffet of solutions to longstanding open problems, wondering when if ever we’ll have time to digest it all<br>\nAnyway, huge congratulations to David Turturean and Jim Halverson, to Physical Superintelligence, and of course to Claude on this achievement!<\/p>","content_hash":"e46a0b6f8c333f0b84c8d702e495bd88","author":"Scott","published_at":"2026-11-08T21:44:31","fetched_at":"2026-11-26 16:15:56","word_count":1231,"read_time_minutes":7,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"9759b0106f7703ca","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10283","title":"Thoughts on a historic week","url":"https://scottaaronson.blog/?p=10283","summary":"As everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole&#8212;because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI&#8217;s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin&#8217;s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it. But","content":"<p>Thoughts on a historic week<br>\nAs everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole—because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI’s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin’s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it.<br>\nBut also, yes, there was an election.<br>\nI remember that, when Dana and I moved to Texas in the summer of 2016, we were excited to be a small part of what seemed at the time like Texas’s impending transformation into a cosmopolitan blue state.<br>\nAnd now the prophecy is finally being fulfilled. But so many strange and harrowing things have happened in the interim, that I feel like Murph when her father finally returns to her at the end of the movie Interstellar.<br>\nSo it turns out that, indeed, the Democrats could’ve easily recaptured both houses of Congress without any need to sell their souls to the likes of Hasan Piker or Abdul El-Sayed. And now the keffiyeh-clad revolutionaries will claim a mandate directly from the people, to put to the sword all the evil landlords and techbros and kulaks and bourgeoisie and (obviously) Zionists, and thereby finally usher in the utopia that failed the first 10,000 times it was tried. I see them as more likely to inspire a Republican comeback in 2028 (as unlikely as it seems this week) than to achieve their stated goals.<br>\nFor please remember that the socialist firebrands massively underperformed more moderate Democrats on Tuesday—it looks like the socialists were merely lifted up by the same tide of justified anti-MAGA rage. Yes, in the US and across the Western world, some university humanities departments continue to churn out young people who’d see my family’s slaughter as an inspiring (or at least deeply understandable) act of revolutionary justice, and who vote on that basis. By and large, though, the American voters simply belatedly realized that Trump is a charlatan who was never going to deliver anything he promised, and also they wanted cheaper gas.<br>\nThe Allied victory over Nazi Germany was glorious, it called for parades and dancing in the street, and it was 3,000% earned by Nazi behavior if anything in human history ever was. It left only one tiny problem for the future—namely that, within the winning coalition, the fans of liberal democracy, science, and Enlightenment still needed to confront the Stalinists, whose evil rivaled even the Nazis’, yet who believed their fanatical ideology to be the one vindicated by events. Why was I so often thinking about that these past couple days?<br>\nThere was, of course, also a big election in Israel. Given the results, I pray that Gadi Eisenkot finds some way to form a coalition, or at least soft coalition, with Israel’s Arab parties, since that’s clearly what it will now take finally to topple Netanyahu, a man whose corruption (like Trump’s or Ken Paxton’s) knows no bounds. I’m under no illusions that this step would do anything to appease the hundreds of millions of protesters around the world whose true demand (as they’ll explain if you ask them) never had anything to do with Israeli policies or Gaza or the West Bank or Bibi Netanyahu, but was always simply that Israel cease to exist—that Israel’s Jews either “go back to Poland” or the other countries where their grandparents were murdered or expelled, or preferably just die, as on October 7.<br>\nNevertheless, I pray for a coalition of moderate Israeli Jews and Arabs, firstly because it’s morally right, secondly because it’s politically expedient, and thirdly because it will impress on at least some fair-minded observers the enormity of the moral chasm here—that, whereas the Arab countries expelled or murdered virtually all of their Jews, the State of Israel not only tolerates its Arab minority but gives it the right to vote and to wield power.<br>\nWhatever else one can say, Israel’s Arabs have been sufficiently loyal to their nation that, on October 7, Hamas murdered them right along with the Jews, treating them as Zionist collaborators and traitors to Islam. I’d like to see that loyalty rewarded with a role in Israel’s governing coalition.<br>\nAs is becoming standard practice with my political posts, I’m closing the comments—because life is short, and these days, the overwhelming majority of comments that I get on posts like this one, whichever ideological axe they’re grinding, are not ones that engender in me even minimal respect for their authors. I apologize to those who would’ve actually pursued a thoughtful dialogue with me or others had I left the comments open—to all five of you, or however many righteous men of Sodom there might be.<\/p>","content_hash":"5eccb21b41c4e341023a500092effa66","author":"Scott","published_at":"2026-11-05T17:48:44","fetched_at":"2026-11-26 16:15:56","word_count":827,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"d96a14c03a92c48b","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10270","title":"Podcasts about the Topic: Part III, with Brian Greene","url":"https://scottaaronson.blog/?p=10270","summary":"Boooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems! So it seems like a perfect occasion to share yet another podcast. I know I&#8217;ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don&#8217;t talk about OpenAI&#8217;s refutation of the Exponential Time Hypothesis be","content":"<p>The Blog of Scott Aaronson If you take nothing else from this blog: quantum computers won't solve hard problems instantly by just trying all solutions in parallel.<br>\nBoooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems!<br>\nSo it seems like a perfect occasion to share yet another podcast. I know I’ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don’t talk about OpenAI’s refutation of the Exponential Time Hypothesis because the announcement of that was still two days in the future!<br>\nBonus Addition From Just This Morning (Nov. 3): Another podcast, about quantum computing, foundations of quantum mechanics, AI, consciousness, and I forget what else … this one with writer Robert Wright, whose book The Moral Animal made a huge impression on me back when I was 13 years old!<br>\n53 Responses to “Podcasts about the Topic: Part III, with Brian Greene”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"5f31b5c964cb91b5a2d2cebf734ed352","author":"Scott","published_at":"2026-10-31T21:40:33","fetched_at":"2026-11-26 16:15:56","word_count":338,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"0083cc178c901677","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10232","title":"Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)","url":"https://scottaaronson.blog/?p=10232","summary":"In my &#8220;Mathocalypse&#8221; post, I mentioned that my wife Dana&#8212;who&#8217;s been working on Subhash Khot&#8217;s Unique Games Conjecture since ~2009, for the entire time I&#8217;ve known her&#8212;has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI&#8217;s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, ","content":"<p>Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)<br>\nIn my “Mathocalypse” post, I mentioned that my wife Dana—who’s been working on Subhash Khot’s Unique Games Conjecture since ~2009, for the entire time I’ve known her—has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI’s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, Dor Minzer, and other colleagues, and (naturally) GPT-6 Astra, Dana probably now understands this crown jewel of OpenAI’s release as well as anyone does. This week, she gave two well-received whiteboard talks on the proof at Simons Institute. So, I and others encouraged her to give the same talks next week at UT Austin when she’s back here, and Dana agreed! Because of the large timely interest, we’re going to do a live Zoom option, and will also record the talk for later sharing on YouTube. Please note: While all are welcome, this is a 2-hour technical talk. The first hour will review key ideas from hardness of approximation, while the second hour will describe the new construction. —SA<br>\nTitle: The Unique Games Conjecture – Proved (!!?)<br>\nSpeaker: Dana Moshkovitz (UT Austin)<br>\nWhen: Wednesday Nov. 4, 3:30-5:30pm US Central (with a brief break in the middle)<br>\nWhere: UT Austin, Gates Dell Complex 6.302. Live Zoom will be available here, and a recording will be available later.<br>\nAbstract: The Unique Games Conjecture of Khot says that it is NP-hard, given a system of linear equations of the form xi-xj=bij (mod p) over variables x1…xn, where 99% fraction of the equations can be satisfied, to find an assignment satisfying 1% of the equations (here p is a sufficiently large constant).<br>\nThis conjecture implies optimal inapproximability results for many optimization problems.<br>\nA few weeks ago OpenAI released a writeup with a proof of the Unique Games Conjecture, as well as a Lean formalization of the proof. The writeup, like others released that day, is not written in a way that’s especially readable to human mathematicians.<br>\nMy goal in this talk is to offer my mental map of the proof, in a way that’s helpful to theoretical computer scientists who are familiar with the area. I think of the innovation as a new code construction, “Hadamard with a noise test.” I’ll sketch how it fits into the NP-hardness reduction. Then I’ll describe the code construction fully and sketch its soundness analysis.<br>\nI’ll also point out a couple of ingredients of the proof that are of independent interest, like a simple quadratic that behaves “like a linear,” and a probability bound using a trick with harmonic numbers.<\/p>","content_hash":"f81a4183271bf90cffcc544e4703c469","author":"Scott","published_at":"2026-10-30T23:27:34","fetched_at":"2026-11-26 16:15:57","word_count":454,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"971900c926d04767","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18331","title":"Lunch with Horace Walpole","url":"https://quantumfrontiers.com/2026/10/25/lunch-with-horace-walpole/","summary":"Did you know that Horace Walpole invented the Gothic novel? The Englishman spawned a genre by publishing The Castle of Otranto during the 1700s. Walpole’s work featured dark atmospheres, crumbling castles, family secrets, and taboo subjects such as madness and incest. If you’ve enjoyed Oscar Wilde&#8217;s novel The Portrait of Dorian Gray or the 2024 film Nosferatu,1 thank Horace Walpole. I memorized the above information in a high-school English class. My teacher, Mrs. Lukacs, demanded a great ","content":"<p>Did you know that Horace Walpole invented the Gothic novel? The Englishman spawned a genre by publishing The Castle of Otranto during the 1700s. Walpole’s work featured dark atmospheres, crumbling castles, family secrets, and taboo subjects such as madness and incest. If you’ve enjoyed Oscar Wilde’s novel The Portrait of Dorian Gray or the 2024 film Nosferatu,1 thank Horace Walpole.<br>\nI memorized the above information in a high-school English class. My teacher, Mrs. Lukacs, demanded a great deal of her students: we memorized boatloads of facts about literary genres (from Anglo-Saxon epics to elegies), history (the Enlightenment, the Romantic era, etc.), literary devices (enjambment and litote and synecdoche), and authors (Samuel Johnson, Anne Bradstreet, and their ilk.). Thanks to Mrs. Lukacs, I can add that Charles Brockden Brown Americanized the Gothic. He shifted stories’ settings to caves, dark forests, and villages at the edge of civilization. The novels Wieland, Edgar Huntly, and Arthur Mervyn exemplify his style.<br>\nMrs. Lukacs’s curriculum hibernated in me like an educational chipmunk after I’d graduated from high school. Imagine my surprise, during a recent lunchtime, when I lifted my gaze to find Horace Walpole a few feet away.<br>\nI was dining at King’s College, Cambridge. The University of Cambridge contains colleges similarly to how Hogwarts contains houses. Each house has students and faculty members from multiple departments. Some departments share their disciplines with institutes. An institute and a college account for my visiting Cambridge most of this autumn: the Isaac Newton Institute for the Mathematical Sciences is hosting a several-month program about quantum many-body physics. I’m grateful to be attending the program while holding a Visiting Fellowship at King’s College.<br>\nKing Henry VI founded King’s College in 1441. (Caltech, where I earned my PhD, precipitated from earlier institutions around the turn of the twentieth century.) The college’s alumni and former Fellows include centuries’ worth of luminaries. Some of their portraits hang in the dining hall, a Gothic confection that could play a cathedral on television.<br>\nI sometimes talk with other scholars over meals in the dining hall; but, when dining alone, I examine different facets of the hall over different meals. The room boasts carved wooden walls, a seventeenth-century tapestry, the gold-colored wall sconces. I couldn’t forgive myself if I squandered the opportunity to examine them. Sometimes, I’ve scrutinized a portrait per meal. One portrait depicts Horace Walpole.<br>\nDid I attempt to envision Horace Walpole during high school? Probably not. He lurked in my imagination as the silhouette of an eighteenth-century Englishman—likely as buttoned-up, industrious, and middle-aged.<br>\nThe portrait shows a youth in his teens or twenties, his skin smooth. A slight smile hints at levity. His clothing’s light coloring buttresses the impression: a white shirt peeps out from a cobalt-blue jacket. The young man’s pose suggests formality, his back straight and one hand tucked inside his jacket. Yet his large, dark eyes seek the viewer’s. I wouldn’t have expected such a plucky-looking youth to have founded the genre that includes Dracula. But I welcomed Horace Walpole as a lunch companion.<br>\nAfter finishing eating, I walked to one end of the dining hall to drop off my tray. Beside a doorway there hung another portrait whose name leaped out at me: Sir Robert Walpole. Google revealed that Sir Robert had fathered Horace—and served as Great Britain’s first prime minister.<br>\nDuring another meal, I found myself eyeing a portrait of a man wearing an Elizabethan ruff. He wore no smile, unlike Horace. Little wonder: a label revealed the portrait to be of Sir Francis Walsingham. Walsingham had headed Queen Elizabeth I’s spy network during the 1500s. Catholics across Europe sought—overtly and by cloak and dagger—to dethrone Elizabeth and the Protestantism to which Walsingham subscribed. I could hardly blame her right-hand man for looking as though he’d found a rat in his soup.<br>\nWhat a crew surrounds me, I keep thinking. What depth and richness it adds to my meals. I eat chicken-tikka sandwiches and minty-pea salads with history.<br>\nStudying physics unlocks similar depth and richness. Doing physics, one doesn’t merely pose a problem, translate it into math, and solve the mathematical problem. One interprets the mathematical outcome physically, illuminates it with examples, and applies the results to the world around us.<br>\nFor instance, odors waft out of the servery into the dining hall, savoring of flatbread pizza or falafel or beef Wellington. Why? Because improperly fed or watered students can cause riots. But why, more fundamentally? Because, by the second law of thermodynamics, every sufficiently large closed, isolated system’s entropy increases or remains constant. Entropy increases as a gas—which can carry an odor—spreads out.<br>\nAs its entropy grows, the gas approaches equilibrium: large-scale properties of the gas, such as its volume, cease to change. If any energy leaves the gas, an equal amount enters it, on average. The gas takes far less time to equilibrate than glass does. The dining hall’s stained-glass windows depict coats of arms and list college provosts of yore. A glass’s atoms don’t form a crystal, a pattern repeated across space. Diamonds, table salt, and the quartz in wristwatches consist of crystals. A glass’s atoms lie at random distances from each other. This randomness leads to randomness in the interatomic interactions’ strength.<br>\nSimilar randomness characterizes neural networks, which underlie conversations I’ve overheard and participated in at meals. Neural networks realize artificial intelligence, which has been widening, disrupting, monetizing, speeding up, eroding, and enhancing research. You don’t need for me to tell you that AI has ignited a quest for an understanding of what computers can and can’t accomplish. What better place to undertake such a quest than King’s? Alan Turing, a co-founder of computer science, studied and worked here.<br>\nI’ve written about how a liberal-arts education has enhanced my physics. So has a physics education enhanced my life. Physics adds depth and richness—as well as nuance, detail, and significance. I have the opportunity to eat lunch with Horace Walpole this autumn; we have the opportunity to eat our cosmic lunches in this universe for only slightly longer. I couldn’t forgive myself if I squandered the opportunity to examine my surroundings.<br>\nWith thanks to King’s College, the Isaac Newton Institute, David Arvidsson-Shukur, and many others for my visit.<br>\n1Or the 1922 original.<\/p>","content_hash":"c19f669a34e11e70d926022ee3e9b171","author":"Nicole Yunger Halpern","published_at":"2026-10-26T00:03:21","fetched_at":"2026-11-26 16:16:00","word_count":1039,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"4w","domain":"quantumfrontiers.com"},{"id":"28c597e089a405ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18358","title":"Even sampling from a quantum spin glass may not require a quantum computer (a video abstract, for a change)","url":"https://quantumfrontiers.com/2026/10/19/even-sampling-from-a-quantum-spin-glass-may-not-require-a-quantum-computer-a-video-abstract-for-a-change/","summary":"First, why a video? I am part of a generation that was raised on a nourishing diet of science communication videos on YouTube. The likes of MinutePhysics, Veritasium, VSauce, Crash Course, TED-Ed, Physics Girl, 3Blue1Brown &#8212; you name it, these channels were my childhood. Had they not existed, I may very well have never considered pursuing a physics PhD here at Caltech. But you probably already knew about the power of science communication in its ability to inspire the next generation. I am","content":"<p>First, why a video?<br>\nI am part of a generation that was raised on a nourishing diet of science communication videos on YouTube. The likes of MinutePhysics, Veritasium, VSauce, Crash Course, TED-Ed, Physics Girl, 3Blue1Brown — you name it, these channels were my childhood. Had they not existed, I may very well have never considered pursuing a physics PhD here at Caltech.<br>\nBut you probably already knew about the power of science communication in its ability to inspire the next generation. I am here to convince you that science communication just became a whole lot more important.<br>\nEarlier this month, Terence Tao gave a talk at Caltech about the growing use of AI in mathematics. In light of OpenAI’s recent release of hundreds of AI-generated mathematical manuscripts, he argued that our community has transitioned from a long era of proof scarcity to one of proof abundance. As a result, problem-solving may no longer be the central challenge in mathematics and theoretical physics that it once was. What surprised me most, though, was Terence’s claim that problem-solving was never the central goal in the first place. It was only ever a proxy for the actual goal of these disciplines: to elevate human understanding.<br>\nI do not think we have fully internalized this maxim as a community yet. The arXiv is seeing a flood of AI-generated submissions that claim to solve problems but offer very little insight. So how do we encourage human understanding?<br>\nPerhaps a video recording is one good way. Flagship conferences like STOC 2027 have begun requiring video recordings as part of their submission process to prioritize effective scientific communication and filter out low-insight AI-generated submissions. On one level, requiring authors to explain their work over video establishes a standard that scientific research should remain intelligible to others.<br>\nBut on another level, a video recording captures something of the humanness of the act of understanding itself. When I understand something, I feel like I can taste it, almost as if it were a sensory experience. I then feel empowered, as if I have been given a new tool to use, and subsequently feel an excitement to share that insight with other human beings. In other words, understanding is an embodied phenomenon. And what better way to embody your work than to stand before a camera and explain it?<br>\nScience communication is no longer just about communicating science to people outside the field. It is increasingly about ensuring that the scientific progress we make be accompanied by a corresponding growth in human understanding. So go out there and record yourself geeking out!<br>\nAbout the work<br>\nQuantum spin glasses are, in some ways, very quantum systems. Their Hamiltonians contain many non-commuting terms, and their low-energy states can be far from simple product states that are easy to represent classically.<br>\nOne might therefore expect these systems to be difficult to simulate on a classical computer. Yet, in our recent work, we show strong evidence that there is no exponential quantum advantage for sampling from the thermal states of one such quantum spin glass model.<br>\nThe key is to reduce sampling to estimating certain quantities related to the model called tilted means, which we expect to be classically easy. I say expect because our results rely on a conjecture from spin-glass physics that is widely believed to hold true, but has yet to be rigorously proven with existing mathematical tools. Such assumptions are quite common in the spin-glass community.<br>\nThe video above focuses more on why we wanted to study sampling than on how we actually solved the problem in order to make it accessible to a general audience. For those curious, our approach is based on stochastic localization, a sampling technique closely related to diffusion models. More technical details can be found in our arXiv preprint.<\/p>","content_hash":"aad728eb5dc36a8b7b51fbdaa4bc7323","author":"Saleh Naghdi","published_at":"2026-10-19T09:08:28","fetched_at":"2026-11-26 16:16:00","word_count":634,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"5w","domain":"quantumfrontiers.com"},{"id":"7ccdc920e0cf1a86","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18370","title":"Letter to a prospective student","url":"https://quantumfrontiers.com/2026/10/17/letter-to-a-prospective-student/","summary":"It’s been a long summer here at Caltech, in part due to a super El Niño event which hit late but hard, with temperatures creeping up to the 100s in the first week of October. But in the history books (at least those on the history of science), the end of this summer might forever be marked by the events of last week. I’m referring here to OpenAI’s release of a whopping 722 manuscripts (announced as 372 major results, and further organized into a number of subfields or research areas) [1] which c","content":"<p>It’s been a long summer here at Caltech, in part due to a super El Niño event which hit late but hard, with temperatures creeping up to the 100s in the first week of October. But in the history books (at least those on the history of science), the end of this summer might forever be marked by the events of last week. I’m referring here to OpenAI’s release of a whopping 722 manuscripts (announced as 372 major results, and further organized into a number of subfields or research areas) [1] which comes less than a month after the announcement of a Navier-Stokes breakthrough from the same group [2].<br>\nIf you’re an undergrad and/or haven’t been closely following discussions within the theory community earlier in the summer, you could be forgiven for feeling like the LLM resolution of a Millennium Prize Problem, a feat which for any individual would be considered a crowning achievement of mathematics, came a bit out of left field. After all, if you go through trending news headlines over time discussing the concerning possibility of AI tools overshadowing and making obsolete human mathematical achievements, the graph looks something like this:<br>\nHave we dropped the ball with prospective students?<br>\nAside from the popular news headlines, a lot has already been written by and for mathematicians and theorists at the PhD level and above. But the speed at which all of this has happened makes me worried about how effectively we’ve communicated with younger students, since the end of summer also marks the start of another PhD application season. While it’s normal for pre-PhD students to be missing some context on what the day-to-day of a full-time researcher looks like, this year that also means that they seem to have largely (perhaps inadvertently) been left out of the AI discourse. This isn’t just a hypothetical: based on my recent interactions with undergrads, most of them haven’t caught onto the recent jumps in capabilities, or the consequences for the research community.<br>\nThe Navier-Stokes announcement dropped on a seemingly random Tuesday in early September, and immediately hit the forefront of conversation in my circles. Later that same week, I braced myself to face the group of around forty wide-eyed undergrads who would travel to Caltech to attend the FUTURE of Physics workshop, where they would learn all about PhD programs and careers in physics. FUTURE selects for students who are bright, often come from underserved communities or nontraditional backgrounds, and are active members of their communities. As the co-chair of the workshop and one of the student science talk presenters, I tried to preempt the questions I might get on current events, like funding or the state of theory research. But while many students were indeed interested in how to approach professors about whether they had funding for next cycle, I was taken aback to learn that few of them were thinking about AI at all. None of them expressed any concerns about the pace of AI development, nor did they even seem aware that nearly all researchers here would soon be using a (supposedly overhauled and better aligned) version of a model that had hacked several real-world entities [3].<br>\n(If you’re a more senior academic or researcher who’s surprised to hear about this disconnect, you wouldn’t be alone! And you don’t have to take my word for it either: instructors and recent graduates at other universities in the U.S. discussed similar experiences over the past summer.)<br>\nResearch in the time of AI theorem provers<br>\nFor context, all of my PhD work has been theoretical and leans heavily on theorem-proving to push the frontiers of what we understand about physics. However, I also applied specifically to do interdisciplinary research. I’ve always liked taking detours into a wide range of subjects, whether it’s random matrix theory, cryptography, or marine science, and finding the connections between them. My first solo-first-author paper, though unfortunately containing nothing directly relevant to marine biology, was shaped by a number of conversations with colleagues across the quantum, condensed matter, and high energy arXiv categories. To me, the most exciting part of learning about new mathematical frameworks has always been the ways in which they help us bridge and translate between different languages and ways of describing real-world phenomena.<br>\nWith this in mind, I want to chronicle in broad strokes my own perspective on this past summer. I’m focusing on just this short window of time because my perception is that within the quantum information community, the tone of the discussion has shifted very quickly in the last few months, and for good reason. Prior to this spring, I used LLMs for literature searches and was aware of groups who were working on theorem-proving harnesses, but I didn’t find the output of the readily available consumer models to be very reliable. Around April, rumors started to float around about an internal Anthropic model and the possibility that it might push capabilities into the regime of practical cybersecurity risk; the public version of the model released on June 9 for just three days before Anthropic was forced to take it offline due to an export control directive. Over the next month, the rumors grew louder until finally Fable was rereleased on July 1, followed by GPT 5.6 just over a week later, and with it the scrutiny of the entire mathematical and theoretical research community over the first wave of one-shot papers.<br>\nAnd that could have been it, but last month saw yet another round of new releases. For the sake of telling a complete story, I have to report that as surprising as Fable 5 and GPT 5.6-Sol had been, Opus 5.5 is the first release that’s completely blown my mind, for reasons that seem to have missed the broader discourse but are important for my own learning process. Among my colleagues, the consensus has been that since July, GPT has been superior to Fable for theorem-proving tasks. But many of the challenges I’ve agonized most over have been in deciding how to come up with a well-defined question that formalizes some physical intuition in a reasonable way (e.g. what does it mean for random unitaries to be a good model for chaotic Hamiltonian dynamics?), rather than just the difficulty of finding a proof for one once it’s posed. This process of iterating over feasible and well-defined research questions admittedly seems a bit tricky to formulate as a set of verifiable tasks, despite being a large component of writing a physics paper, as acknowledged in this recent preprint for a new benchmark based on theoretical physics calculations [4]. From my own limited experience, though, Opus 5.5 has been significantly better than any other model I’ve tried at taking problems I’ve been stuck on, for which my initial conjecture and attempt at explaining some numerical phenomenon might be completely wrong, and combing through the many-body physics literature to suggest other relevant frameworks and theories.<br>\nShould you apply to do a (theory) PhD in 2026?<br>\nThe pace of advances in AI capabilities over the past summer came as a surprise to many people in the theory community, to the point that by the time the preprint linked above was posted, their theoretical physics benchmark had already been saturated by models released within the last one-and-a-half months. Given this, it’s reasonable to wonder what kinds of changes will have to be made to PhD training. Although I’m not aware of any of the authors commenting publicly on this aspect, I imagine that the work associated with writing a peer-reviewed paper on any one of the calculations in their benchmark would be worthy of advancing to candidacy.<br>\nTo be clear, this is a big deal: in undergrad, you may have spent most of your time on coursework that other people could authoritatively grade for correctness. But by the time you present your dissertation topic in your candidacy exam, you might be the only expert in the world on your own research area. The authors of the very same benchmark also acknowledge that they initially had difficulty grading the output of the model, since nine of the solutions originally provided for the fifty problems turned out to be wrong! In addition, while I have no idea how far the current language model paradigm can be pushed, as of writing I think it’s safe to say that there’s still some room for improvement, given their continual progress on seemingly every benchmark that’s been thrown at them.<br>\nSo what is the value of PhD training, if the machines are now capable of reproducing the kinds of technical output that we’re supposedly evaluated on as grad students?<br>\nI don’t think I’m qualified to speak on behalf of all theorists, but in my view, the difference between pursuing a PhD in theoretical physics and accepting a corporate offer isn’t just that it’s hard to get paid to learn about fun math problems with no immediate applications in industry. A large part of PhD training (and probably post-PhD training as well!) is learning what to do with this kind of freedom.<br>\nI do want to acknowledge that it’s understandably hard to be in a position in which your job is rapidly changing, and where you might not have reliable access to mentorship, directed practice, and tight feedback loops to learn the relevant skills [5]. And all of this applies even when the field isn’t in crisis. But systems and institutions aren’t static, nor have they ever been. And it’s always been the case that the PhD experience is highly dependent on the quality of mentorship as well as the resourcefulness of the lab when it comes to finding opportunities in the explored and uncharted, or tackling high-risk, long-time-horizon problems with limited public funding. In many ways, then, the most important questions to ask when deciding whether to accept an offer remain the same [6].<br>\nPlus, despite how good language models have been for a while now at generating heaps upon heaps of words, rows upon rows of spreadsheets, the PIs and their grant managers who work tirelessly to fundraise, to project manage, and to set high level goals guiding all of this research have managed to hold on to their jobs, and are still being asked to direct the next generation of research proposals. And many of us at Caltech remain excited about budding developments in quantum science, as the next generation of experimental platforms promises to bring us past what theorists can hope to fully predict or simulate.<br>\nThis post marks the conclusion of my initial voyage into theory research over the past three summers, and the first half of my PhD. Many people have asked me whether I regret my choice to pursue a PhD in theoretical physics in the first place, especially given that so many of my close friends and peers from undergrad decided to work in AI safety or adjacent areas following the original release of ChatGPT. There are two main reasons why, after surfacing to face the real world, I still feel that I made the right decision: first, if anything, AI safety might be one of the most compelling reasons for ensuring that humans remain capable of reviewing evidence and making informed decisions. As long as we value citizen participation in science and decision-making, education and STEM education will continue to have a role in society. Second, as a fresh college graduate, I simply didn’t feel ready to direct an original research program, or to shape an entire field of study. No matter how AI capabilities advance, I’d like to think that the PhD can continue to be a safe space for young people to develop “soft” skills like managing projects with a wide range of collaborators and uncertain timelines, and to grow into the scientific leaders of their generation. Plus, you never know when your random matrix tricks might come in handy for some underwater imaging problem.<br>\nAcknowledgements<br>\nI’m grateful to the many peers and colleagues, from both the theory and experimental sides of IQIM, who gave their candid opinions and feedback on this topic. In particular, I’d like to thank Dave Hsieh and Jessica Jiang for co-chairing the FUTURE program and for a number of very insightful discussions, Spiros Michalakis for helpful suggestions on a draft of this post, and everyone in the Caltech theory community who’s engaged with the topic during John’s group meetings. I’d also like to thank Jiahai Feng, Vincent Huang, and Alex Gu, some of the friends in question who have worked in AI safety-adjacent areas, for keeping me honest. Opus 5.5 was used for light copyediting of a draft of this article.<br>\n[1] See Github repository: https://github.com/openai/math<br>\n[2] Press release page: https://openai.com/index/navier-stokes-solution/<br>\n[3] See, for example, https://transluce.org/agent-activity<br>\n[4] The authors of the manuscript also voice additional thoughts on why AI agents have yet to result in similar breakthroughs on major outstanding problems in physics. The full set of benchmark problems and writeup is available at https://arxiv.org/abs/2610.16733.<br>\n[5] The trifecta of learning taken from the excellent https://web.stanford.edu/~aramdas/checklists.html<br>\n[6] Although this list was written for students in statistics and machine learning (and includes terms like “HCI”, i.e. human-computer interaction), I think it’s pretty broadly applicable for quantum information too, even if you’re not interested in quantum learning theory. And you might notice that very few points on this list are about learning purely technical skills!<\/p>","content_hash":"de137e5fb0484b8527e7191777a00378","author":"lauralcui","published_at":"2026-10-18T03:41:17","fetched_at":"2026-11-26 16:16:00","word_count":2229,"read_time_minutes":12,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"5w","domain":"quantumfrontiers.com"},{"id":"0502808c63cba635","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18293","title":"The Quantum Omelette Problem: How Much Energy Belongs to the Yolk?","url":"https://quantumfrontiers.com/2026/10/11/the-quantum-omelette-problem-how-much-energy-belongs-to-the-yolk/","summary":"The National Egg Coordination Committee created one of India’s longest-running ad campaigns. Its jingle was impossibly catchy. Nearly everyone from my parents’ generation onward seems to remember it: “Sunday or Monday, eat eggs every day.” My mum took this advice rather seriously. On weekdays, we ate boiled eggs for breakfast. Sundays, however, were omelette days. Our ritual was always the same. Each of us siblings announced how many eggs we wanted as we streamed into the kitchen. My mum cracked","content":"<p>The National Egg Coordination Committee created one of India’s longest-running ad campaigns. Its jingle was impossibly catchy. Nearly everyone from my parents’ generation onward seems to remember it:<br>\n“Sunday or Monday, eat eggs every day.”<br>\nMy mum took this advice rather seriously. On weekdays, we ate boiled eggs for breakfast. Sundays, however, were omelette days.<br>\nOur ritual was always the same. Each of us siblings announced how many eggs we wanted as we streamed into the kitchen. My mum cracked the eggs into a shiny steel bowl, added our chosen mix-ins, and whisked them together. The yolks, whites, salt, and chili powder quickly disappeared into one speckled mixture. She poured it into a hot, oiled pan, where it hissed and sizzled before sliding onto our plates.<br>\nThe omelettes were soft, spicy, and gone within minutes.<br>\nMy diet is now plant-based, but the nostalgia of those Sunday-morning breakfasts remains strong—the steel bowl, the sizzling pan, and all of us gathered around the table, waiting eagerly for the omelettes to arrive.<br>\nOur weekday boiled eggs and Sunday omelettes offer a useful contrast. In a boiled egg, the yolk and white remain distinguishable. In an omelette, they are mixed and transformed. Some properties—texture, flavor, and structure—belong to the finished mixture rather than to either component separately.<br>\nWhen two parts interact strongly, which properties still belong to the parts, and which belong only to the whole?<br>\nThis question appears across science whenever interacting parts become difficult to describe independently. In quantum thermodynamics, it becomes a question of energy. Picture a small quantum system, an atom, say, surrounded by a much larger environment. The total energy of the setup comes from three sources: the atom, the environment, and their interaction.<br>\nWhen the atom barely interacts with its surroundings, separating the energy contributions is easy. The interaction energy is small enough to ignore, and we can speak cleanly of the atom’s energy and the environment’s. When the interaction is strong, however, that shared energy can no longer be brushed aside, making it difficult to decide how much belongs to the atom and how much to its surroundings.<br>\nFor a large object, interactions with the environment typically occur at the surface, while most of its energy is associated with the much larger bulk. As an object grows, the surface becomes less important compared to its volume, so the interaction energy can often be ignored. But this reasoning breaks down for very small objects, where surface effects remain significant, or for systems whose interactions extend through the bulk, allowing interaction energy to scale with volume.<br>\nSuch strong interactions are not limited to tiny systems; they also appear across condensed matter, nuclear, and high-energy physics. Lattice gauge theories provide one important example: their particles and fields are tied together by interactions and local constraints, making it especially difficult to draw a clean boundary around one part and declare, “This energy belongs here.”<br>\nIn all these cases, the energy of the whole may be perfectly clear. The challenge, however, is deciding how to divide that energy among pieces that are no longer truly separate.<br>\nThat brings us to a deceptively simple question: How should we define the internal energy of a strongly interacting system?<br>\nDefinitions in physics do more than attach names to things. They tell us what counts as a system, which quantities can be measured, and how mathematical ideas connect to experiments. A useful definition must do more than sound reasonable: it should recover familiar results in familiar situations and remain consistent with the laws of physics. When two plausible definitions lead to different conclusions, the choice between them cannot be settled by language alone.<br>\nConsider the internal energy of a system. When a system is strongly coupled to its surroundings, some of the total energy is stored in the interaction, and several reasonable ways of assigning that shared energy become possible. But which definition of internal energy is consistent with thermodynamics? This is the question I explored with my collaborators Zohreh Davoudi, Christopher Jarzynski, Niklas Mueller, Connor Powers, and Nicole Yunger Halpern.<br>\nPhysicists describe a system’s energy using a mathematical object called a Hamiltonian. In our recent paper, we consider three ways of defining the internal energy of a strongly coupled system.<br>\nDefinition 1: Subtract the environment<br>\nStart with the total energy of the system-environment composite, then subtract the energy the environment would have on its own at the same temperature. Whatever remains, including the interaction energy, is assigned to the system.<br>\nDefinition 2: Include the environment’s influence <br>\nRather than separating the interaction energy by hand, describe the system’s energy using a modified Hamiltonian that captures how the interaction energy affects the system’s energy at equilibrium. Physicists call this the Hamiltonian of mean force.<br>\nDefinition 3: Account for temperature as well<br>\nThe Hamiltonian of mean force depends on temperature. The third definition takes this dependence into account when calculating the system’s internal energy.<br>\nAll three definitions have appeared in the literature on strong-coupling thermodynamics, each offering a seemingly reasonable way to account for the environment’s influence on the system. We wanted to find out whether choosing one definition over another would change how we describe the same physical process.<br>\nTo test the three definitions, my collaborators and I considered a sudden quench—the physicist’s term for changing something in the setup almost instantaneously. Imagine rapidly turning a knob that controls the system, perhaps by suddenly switching on a magnetic field. We can also suddenly change how strongly the system interacts with its surroundings, effectively turning the interaction between them on or off. Either change happens so quickly that the system and its environment have no time to respond: their states remain constant during that instant. Yet the system’s internal energy can change because the rules governing it have changed. Since this energy change results from deliberate external control, we call it work.<br>\nAfter the quench, the knob is left alone. The system then evolves under the new, fixed conditions and exchanges energy with its environment. This later change in the system’s internal energy is called heat.<br>\nSeparating the process into two stages makes it easier to tell work and heat apart: work enters during the sudden, controlled change, while heat flows during the evolution that follows. It is a little like whisking an egg first and then placing it on a hot pan, rather than trying to whisk and cook it at the same time.<br>\nOnce we have chosen a definition of a system’s internal energy, we can ask how that energy changes during any thermodynamic process. The first law of thermodynamics tells us that the change in internal energy must be accounted for by work and heat ,<br>\nThe first law is essentially a statement of energy conservation. It tells us that any change in the system’s internal energy must be accounted for: the energy must have entered as work, as heat, or as some combination of the two.<br>\nBut here is the catch. Each of the three definitions of internal energy comes with its own corresponding definitions of work and heat. If we change what we mean by , we also change how we split that energy change into and . For each of the three choices, however, the definitions are constructed so that work and heat add up to the total change in internal energy. All three therefore satisfy the first law.<br>\nAt first, this seems reassuring. Perhaps any of the three definitions will do.<br>\nTo decide whether all three internal energy definitions are truly acceptable, we need a stricter test: the second law. The first law tells us that energy must be conserved, but it does not tell us which direction a process will naturally take. The second law supplies that direction. An egg can be whisked and cooked into an omelette, but an omelette left on the plate will not spontaneously uncook itself, separate into a yolk and a white, and return to its shell. Energy conservation alone would not rule out such a reversal, yet nature overwhelmingly favors one direction. Cooking an omelette is therefore an irreversible process. A perfectly reversible process, by contrast, could be undone without leaving any lasting changes to the system or its surroundings.<br>\nFor the sudden changes studied in the paper, we can quantify irreversibility by comparing the work actually performed with the minimum work required in an ideal, perfectly reversible process. Thermodynamics captures this minimum through a quantity called the free-energy change, . The difference between the actual work and thi
