—quantum information encoded in MZMs, protected by topology, and processed through measurements—we’re ready to move from physics breakthrough to practical implementation.<br>\nThe next step is a scalable architecture built around a single-qubit device called a tetron (see Figure 2). At the Station Q meeting, we shared data demonstrating the basic operation of this qubit. One fundamental operation—measuring the parity of one of the topological nanowires in a tetron—uses the same technique described in our Nature paper.<br>\nAnother key operation puts the qubit in a superposition of parity states. This, too, is performed by a microwave reflectometry measurement of a quantum dot, but in a different measurement configuration in which we decouple the first quantum dot from the nanowire and connect a different dot to both nanowires at one end of the device. By performing these two orthogonal Pauli measurements, Z and X, we’ve demonstrated measurement-based control—a crucial milestone that unlocks the next steps on our roadmap.<br>\nOur roadmap now leads systematically toward scalable QEC. The next steps will involve a 4×2 tetron array. We will first use a two-qubit subset to demonstrate entanglement and measurement-based braiding transformations. Using the entire eight-qubit array, we will then implement quantum error detection on two logical qubits.<br>\nThe built-in error protection of topological qubits simplifies QEC. Moreover, our custom QEC codes reduce overhead roughly tenfold compared to the previous state-of-the-art approach. This dramatic reduction means that our scalable system can be built from fewer physical qubits and has the potential to run at a faster clock speed.<br>\nDARPA’s recognition of our approach<br>\nThe Defense Advanced Research Projects Agency (DARPA) has selected Microsoft as one of two companies to advance to the final phase of their rigorous benchmarking program known as Underexplored Systems for Utility-Scale Quantum Computing (US2QC)—one of the programs that makes up DARPA’s larger Quantum Benchmarking Initiative (QBI). Microsoft views this recognition as validation of our roadmap for building a fault-tolerant quantum computer with topological qubits.<br>\nDARPA’s US2QC program and its broader Quantum Benchmarking Initiative represent a rigorous approach to evaluating quantum systems that could solve problems that are beyond the capabilities of classical computers. To date, the US2QC program has brought together experts from DARPA, Air Force Research Laboratory, Johns Hopkins University Applied Physics Laboratory, Los Alamos National Laboratory, Oak Ridge National Laboratory, and NASA Ames Research Center to verify quantum hardware, software, and applications. Going forward, the larger Quantum Benchmarking Initiative is expected to engage with even more experts in the testing and evaluation of quantum computers.<br>\nPreviously, DARPA selected Microsoft for an earlier phase upon an assessment that we could plausibly build a utility-scale quantum computer in a reasonable timeframe. DARPA then evaluated the Microsoft quantum team’s architectural designs and engineering plan for a fault-tolerant quantum computer. As a result of this careful analysis, DARPA and Microsoft have executed an agreement to begin the final phase of the program. During this phase, Microsoft intends to build a fault-tolerant prototype based on topological qubits in years, not decades—a crucial acceleration step toward utility-scale quantum computing.<br>\nUnlocking quantum’s promise<br>\nEighteen months ago, we laid out our roadmap to a quantum supercomputer. Today we hit our second milestone, demonstrating the world’s first topological qubit. And we’ve already placed eight topological qubits on a chip designed to house one million.<br>\nA million-qubit quantum computer isn’t just a milestone—it’s a gateway to solving some of the world’s most difficult problems. Even today’s most powerful supercomputers cannot accurately predict the quantum processes that determine the properties of the materials essential to our future. But quantum computing at this scale could lead to innovations like self-healing materials that repair cracks in bridges, sustainable agriculture, and safer chemical discovery. What today requires billions of dollars in exhaustive experimental searches and wet-lab experiments could be found, instead, through calculation on a quantum computer.<br>\nOur path to useful quantum computing is clear. The foundational technology is proven, and we believe our architecture is scalable. Our new agreement with DARPA shows a commitment to relentless progress toward our goal: building a machine that can drive scientific discovery and solve problems that matter. Stay tuned for more updates on our journey.<br>\nStay informed of Microsoft’s advancements in quantum computing:<br>\n- Check out Dr. Chetan Nayak on the Microsoft Research Podcast as he explores these groundbreaking advances.<br>\n- Read our papers in Nature and on arXiv.<br>\n- Join us to become quantum ready.<br>\n- Read the Microsoft Source story about today’s news.<br>\n- Hear the Microsoft quantum team discuss these milestones:<\/p>","content_hash":"15c89a87936902d9a78c8878dc5851b8","author":"Chetan Nayak","published_at":"2025-02-19T16:00:00","fetched_at":"2026-10-19 18:17:26","word_count":1567,"read_time_minutes":8,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"86w","domain":"azure.microsoft.com"},{"id":"c87bca6f7346a09c","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2025/01/14/2025-the-year-to-become-quantum-ready/","title":"2025: The year to become Quantum-Ready","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/01/14/2025-the-year-to-become-quantum-ready/","summary":"We find ourselves in an exciting and pivotal time. We are at the advent of the reliable quantum computing era. This past November, Microsoft successfully created and entangled 24 logical qubits in collaboration with Atom Computing. As our industry looks toward the next 12 months, the pace of quantum research and development is only going to accelerate, making this a critical and catalyzing time for business leaders to act. We’re seeing a growing need for business leaders to have the information ","content":"<p>We find ourselves in an exciting and pivotal time. We are at the advent of the reliable quantum computing era. This past November, Microsoft successfully created and entangled 24 logical qubits in collaboration with Atom Computing. As our industry looks toward the next 12 months, the pace of quantum research and development is only going to accelerate, making this a critical and catalyzing time for business leaders to act. We’re seeing a growing need for business leaders to have the information and tools to understand better the depth of these amazing technical breakthroughs and the business applications and value they open up. In a business decision-maker study, 12% said their organizations were prepared to assess quantum opportunities. Clearly, there is an urgent need for leaders to get more information and better understand how technical advancements in quantum will enable real-world impact.<br>\nLeaders in global companies, investment funds, and governments across the world are making multi-billion-dollar investments in quantum computing. Those organizations that are in the throes of planning a comprehensive quantum-ready strategy are creating durable, competitive differentiation for their organizations and positioning themselves to harness the full power of quantum as it scales. Clearly, without strategic readiness, it’s a challenging proposition for leaders to assess the risks and returns, or to design effective and responsible quantum strategies that are necessary to create a full-on quantum roadmap for their organization.<br>\nThis is why at Microsoft we are excited to announce our new Quantum Ready program, designed to address these exact challenges by providing business leaders with the insights and tools needed to:<br>\n- Build practical, high-impact hybrid applications.<br>\n- Invest in strategic skilling and access to reliable quantum computers for experimentation.<br>\n- Embrace quantum safety and focus on cryptographic agility.<br>\n- Prepare for scale such that your investments are future-proofed.<br>\nBecoming quantum-ready is both a business and a global imperative. In fact, the United Nations announced 2025 as the International Year of Quantum Science and Technology (IYQ), reflecting the transformative impact quantum mechanics has had in the past century, and setting the stage for the next wave of quantum innovation. As part of this global initiative, Microsoft will be a leading partner with the IYQ, along with the American Physical Society (APS), to celebrate 100 years of quantum innovation. We are so excited to partner with APS and other leading institutions to support the IYQ as it engages with communities from across the world to scale awareness of how quantum science and applications will transform industries.<br>\nQuantum Ready<br>\nQuantum Ready can help future proof your organization today for a quantum-powered tomorrow<br>\nHybrid applications: Business value and security for today and tomorrow<br>\nGiven the rapid pace of innovation, it’s critical that organizations start exploring, identifying, and building an application roadmap that sets them up for success in a quantum future. Doing so will clarify where and when quantum will provide tangible business value and guide both how and to what degree, you should invest to become quantum-ready today.<br>\nThrough our Quantum Ready program, leaders will have an opportunity to engage with Microsoft in one-on-one workshops and industry-specific forums to accelerate their strategic readiness and identify high-value use cases. We hope to bring learnings that result from these industry-specific forums to the broader ecosystem to provide practical insights in the form of custom industry outlook reports to help guide your organization’s leadership and company strategy.<br>\nAdditionally, business leaders need to start preparing for a quantum-safe future; not because there is an immediate threat but because a transition to emerging cryptographic standards will take time. Security is a top priority at Microsoft—this is why we established the Microsoft Quantum Safe Program to enable security alignment from both business and technical perspectives.<br>\nCultivating a quantum-ready culture: Skilling and vision for the hybrid era<br>\nCultivating a culture of innovation begins with robust workforce skilling and training, empowering teams with the knowledge and mindset to embrace quantum-enabled possibilities. Putting this mindset into practice requires providing access to a unified hybrid platform integrating resilient quantum computing, classical supercomputing, and AI. Especially when 76% of leaders indicate that a quantum skills crisis is causing a deceleration in innovation, the organizations that can harness the power of these complementary technologies—and who understand their use is not a matter of either or, but when and how—are in a distinct position to stay ahead.<br>\nOur Quantum Ready program will offer different skilling and training opportunities to help prepare business and government leaders with resources, frameworks, and tools they need to:<br>\n- Understand why quantum technology is positioned to help revolutionize your business operations, talent strategies, and infrastructure.<br>\n- Gain an early-mover competitive edge by creating a quantum strategy that aligns the technology’s potential with your specific business and innovation goals.<br>\n- Explore deep insight and guidance into the impact quantum computing will make in your industry and what it means for your organization.<br>\nActing for success: Preparation for scale with the right partner<br>\nSo, where and how should organizations start? Navigating the many skilling, strategy, and culture considerations is not easy, and it requires the right partners: those with experience putting state-of-the-art hybrid tools into practice with real-world, impactful applications; those who carefully consider the risks quantum pose and are working to mitigate them with leading security solutions and commitments to safe use; and finally, those with an open ecosystem approach to future-proof your investments.<br>\nFrom envisioning new use cases and identifying co-innovation opportunities to receiving first access to visionary industry insights, outlook reports, skilling, workshops, and other exciting new programs to come, sign up here to join Microsoft’s Quantum Ready program. We look forward to connecting with you soon!<br>\nLearn how Microsoft can help you become quantum ready<br>\n- Join the Quantum Ready program.<br>\n- Explore the video learning modules in our Quantum Ready program.<\/p>","content_hash":"0cb778ae31331d9f5d2329c67a5aa941","author":"Mitra Azizirad","published_at":"2025-01-14T16:00:00","fetched_at":"2026-10-19 18:17:35","word_count":964,"read_time_minutes":5,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"91w","domain":"azure.microsoft.com"},{"id":"6bdde094fa0e91d3","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/11/19/microsoft-and-atom-computing-offer-a-commercial-quantum-machine-with-the-largest-number-of-entangled-logical-qubits-on-record/","title":"Microsoft and Atom Computing offer a commercial quantum machine with the largest number of entangled logical qubits on record","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/11/19/microsoft-and-atom-computing-offer-a-commercial-quantum-machine-with-the-largest-number-of-entangled-logical-qubits-on-record/","summary":"Azure Elements Purpose built to accelerate scientific discovery ↗ Microsoft and Atom Computing have made rapid progress in reliable quantum computing by creating and entangling 24 logical qubits made from neutral atoms—they have also demonstrated the ability to detect and correct errors, and perform computation, on 28 logical qubits. Together, the companies are offering a reliable quantum machine built with these state-of-the-art logical qubits and Microsoft’s qubit-virtualization system, and in","content":"<p>Azure Elements<br>\nMicrosoft and Atom Computing have made rapid progress in reliable quantum computing by creating and entangling 24 logical qubits made from neutral atoms—they have also demonstrated the ability to detect and correct errors, and perform computation, on 28 logical qubits. Together, the companies are offering a reliable quantum machine built with these state-of-the-art logical qubits and Microsoft’s qubit-virtualization system, and integrated with Azure Elements. This comprehensive package is available to order today with delivery in 2025. The results reported here showcase the advances being made toward scientific quantum advantage, which will require not only reliable quantum computation, but also integration with AI and high-performance computing.<br>\nAtom Computing’s neutral-atom qubits<br>\nIn the quantum computing industry, multiple types of physical qubits are being explored as potential pathways to hybrid quantum-classical supercomputing. But not all types of qubits allow for the quantum error correction needed to enable more reliable quantum computing. And without reliable quantum computing, valuable solutions to classically intractable problems are unlikely to be achieved. It’s essential to graduate from computing with noisy physical qubits to operating with reliable, logical ones.<br>\nOne type of qubit that opens opportunities for more reliable quantum computation, with more and better logical qubits, is based on neutral atoms. Our partner, Atom Computing, uses neutral atoms as qubits to store and process quantum information through manipulation with pulses of light. Compared to other qubit technologies, neutral atoms have several advantages including the ability to be tightly packed in arrays while being held in place by lasers, as well as the ability to be moved around so that they can interact with other atoms to enable all-to-all connectivity. Neutral atoms also have low susceptibility to noise and the high fidelities needed for quantum error correction to work. Due to their lack of charge, neutral atoms can be kept only microns (millionths of a meter) apart. Thus, atomic arrays can accommodate large numbers of neutral atoms, each of which serves as a physical qubit, in a small amount of space, offering extensive scalability.<br>\nAtom Computing recently announced that they have achieved 99.6% two-qubit gate fidelity, which represents the highest fidelity of neutral-atom qubits in a commercial system and unlocks the ability to perform meaningful error correction. Qubits with such low error rates and all-to-all connectivity are prime candidates for Microsoft’s custom qubit-virtualization system, which creates logical qubits and enables the detection and correction of errors while performing reliable quantum computation.<br>\nQuantum Insider<br>\nWebinar with Dr. Krysta Svore and Dr. Ben Bloom on the offering from Microsoft and Atom Computing<br>\nAzure Quantum compute platform<br>\nTo enable reliable quantum computing, Microsoft has developed the Azure Quantum compute platform. This compute platform combines Microsoft’s advanced qubit-virtualization system with quantum-processing units (QPUs) from our industry-leading hardware partners to create logical qubits by detecting and correcting the errors inherent in the QPU’s physical qubits, in turn enabling reliable quantum computation.<br>\nMicrosoft’s qubit-virtualization system is a core component of the Azure Quantum compute platform and builds on Microsoft’s world-class quantum error correction innovations. It offers high performance quantum error correction, custom-tailored for the underlying QPU and can be applied to a variety of QPU types. By co-designing the quantum computer with Atom Computing, we are enabling faster, more advanced, and more efficient quantum error correction as part of our qubit-virtualization system.<br>\nCreating and entangling logical qubits<br>\nTo enable complex quantum computations, qubits must meet several criteria. The physical qubits must have low enough error rates to enable error detection and correction so that they can be used to create reliable logical qubits. Those logical qubits must then be able to not only be entangled, but also to undergo many logical operations without failure to enable successful solutions to complex computations.<br>\nBy applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral-atom qubits, the teams created 24 logical qubits and entangled them in a cat state, or Greenberger-Horne-Zeilinger (GHZ) state—this represents the highest number of entangled logical qubits on record. Entanglement of the qubits is evidenced by their error rates being significantly below the 50% threshold for entanglement (Figure 1).<br>\nWhen using neutral atoms as qubits and attempting to hold them in place with lasers, some atoms can still become lost, resulting in a loss of that qubit and its quantum information. Thus, the teams took steps to not only detect errors but also to detect and correct losses of neutral-atom qubits during experiments. After creating logical qubits from neutral atoms and detecting errors and losses, the error rate in the logical qubits was 10.2%, which is 4.1 times better than the baseline physical error rate of 42% (Figure 1). When errors were detected and losses were detected and corrected, the error rate was 26.6%, which is 1.6 times better than the physical error rate (Figure 1). This is the first demonstration on record of loss correction in a commercial neutral-atom system.<br>\nTwenty-eight logical qubits, created from 112 physical qubits, were used to perform successful computations based on the Bernstein-Vazirani algorithm. Furthermore, the logical qubits were able to produce a more accurate solution than the corresponding computation based on physical qubits. The ability to compute while detecting and correcting errors is a critical component to scaling to achieve scientific quantum advantage.<br>\nFigure 1. Error rates of physical qubits (baseline) and the logical qubits created from them. The 24 logical qubits, which were entangled in a cat state, were created by applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral atoms. The entanglement of the logical qubits is evidenced by the error rate being below the 50% threshold (dashed line). The error rate of the logical qubits varied depending on whether losses were only detected or were detected and corrected. In both cases, the logical qubits demonstrated a higher fidelity of entanglement than the corresponding physical qubits.<br>\nCommercial offering from Microsoft and Atom Computing<br>\nMicrosoft and Atom Computing are offering a state-of-the-art reliable quantum computer built from Atom’s neutral-atom hardware and Microsoft’s qubit-virtualization system, and that integrates with Azure Elements. This offering is a comprehensive scientific suite that combines logical qubits, cloud HPC, and advanced AI models that, together, enable exploration across multiple fields, including chemistry and materials science, while also providing opportunities for skilling and education.<br>\nAzure Elements, which is included in the offering, uses AI and cloud high-performance computing (HPC) to greatly accelerate the pace of scientific research and discovery. Capabilities of Azure Elements include Generative Chemistry, which brings the power of generative AI to chemistry research to enable the rapid discovery of molecules that are novel, synthesizable, and useful. In addition, Accelerated DFT offers substantial increases in speed over other DFT (density functional theory) codes for modeling quantum-mechanical properties. These and other user-friendly features of Azure Elements greatly increase the productivity of scientific research, especially when coupled with the quantum capabilities of the Azure Quantum compute platform.<br>\nThis suite—offered by Microsoft and Atom Computing—will enable not only exploration of quantum applications, but also the creation of new datasets by the quantum computer that may be used to train AI models for improved performance or accuracy. And while the offering targets scientific discovery, it’s also possible to explore how quantum capabilities may provide solutions to complex problems in other industries.<br>\n“We are excited to continue our collaboration with Microsoft, which has already led to significant milestones in quantum computing. By coupling our state-of-the-art neutral-atom qubits with Microsoft’s qubit-virtualization system, we are now able to offer reliable logical qubits on a commercial quantum machine. This system will enable rapid progress in multiple fields including chemistry and materials science.” — Dr. Ben Bloom, Founder and CEO of Atom Computing<br>\nLearn more about our latest achievements in quantum computing<br>\n- Register to watch the Quantum Insider webinar with Dr. Krysta Svore and Dr. Ben Bloom on the offering from Microsoft and Atom Computing.<br>\n- Read the technical paper describing how Microsoft and Atom Computing created and entangled 24 logical qubits.<br>\n- Read the technical paper on Atom Computing’s best-in-class two-qubit gate fidelity.<br>\n- Read Jason Zander’s LinkedIn article on today’s announcement.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"df1fee32ff5f9655d1de9694cdb1d912","author":"Krysta Svore","published_at":"2024-11-19T13:30:00","fetched_at":"2026-10-19 18:17:44","word_count":1343,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"99w","domain":"azure.microsoft.com"},{"id":"07071061f61a76ac","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/09/10/microsoft-and-quantinuum-create-12-logical-qubits-and-demonstrate-a-hybrid-end-to-end-chemistry-simulation/","title":"Microsoft and Quantinuum create 12 logical qubits and demonstrate a hybrid, end-to-end chemistry simulation","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/09/10/microsoft-and-quantinuum-create-12-logical-qubits-and-demonstrate-a-hybrid-end-to-end-chemistry-simulation/","summary":"Microsoft and Quantinuum applied Azure Quantum’s qubit-virtualization system to Quantinuum’s H2 trapped-ion quantum computer to create 12 highly reliable logical qubits. Additionally, the teams demonstrated the emerging capabilities of reliable quantum computing by using two logical qubits, integrated with an AI model and cloud high-performance computing (HPC), to accurately estimate the ground state energy of the active space of an important catalytic intermediate. These achievements demonstrat","content":"<p>Microsoft and Quantinuum applied Azure Quantum’s qubit-virtualization system to Quantinuum’s H2 trapped-ion quantum computer to create 12 highly reliable logical qubits. Additionally, the teams demonstrated the emerging capabilities of reliable quantum computing by using two logical qubits, integrated with an AI model and cloud high-performance computing (HPC), to accurately estimate the ground state energy of the active space of an important catalytic intermediate. These achievements demonstrate continued progress toward scientific quantum advantage, a milestone that will be reached when a hybrid quantum-classical supercomputer can solve scientific problems too complex for classical computers alone.<br>\nMicrosoft Quantum Innovation Series<br>\nHow can quantum and AI unlock a new generation of hybrid applications for science?<br>\nTripling the number of highly reliable logical qubits<br>\nEarlier this year, Microsoft and Quantinuum created the most reliable logical qubits on record by applying Microsoft’s qubit-virtualization system to Quantinuum’s H-Series ion-trap qubits. At the time of that announcement, the teams had created four logical qubits from 30 physical qubits on Quantinuum’s H2 machine, with a logical error rate 800 times better than the physical error rate.<br>\nBy expanding Microsoft’s error-correction algorithms and optimizing them for Quantinuum’s H2 machine, which now has 56 qubits with 99.8% two-qubit fidelity, the teams have created 12 highly reliable logical qubits. Previously, Microsoft and Quantinuum entangled two logical qubits in a Bell state preparation, whereas in this study, all 12 logical qubits were entangled in a more complex arrangement known as a cat state, or Greenberger-Horne-Zeilinger (GHZ) state. When these logical qubits were entangled, they exhibited a circuit error rate of 0.0011, which is 22 times better than the corresponding physical qubits’ circuit error rate of 0.024.<br>\nMicrosoft and Quantinuum demonstrated several fault-tolerant computations with the improved logical qubits. On eight logical qubits, the teams successfully conducted five rounds of repeated error correction. Furthermore, the eight logical qubits were used to perform a fault-tolerant computation during error correction, successfully demonstrating the combination of logical entangling operations with multiple rounds of quantum error correction. The eight logical qubits exhibited a circuit error rate of 0.002, which is 11 times better than the corresponding physical qubits’ circuit error rate of 0.023. To our knowledge, this is the first demonstration of computation and error correction being beneficially combined, and it showcases the ability of these logical qubits to perform increasingly deeper quantum computations reliably, paving the way to fault-tolerant quantum computing.<br>\nUsing logical qubits, cloud HPC, and AI to solve problems in chemistry<br>\nTo demonstrate the emerging usefulness of quantum computing in chemistry applications, an end-to-end hybrid workflow was used to solve a real problem in chemistry, bringing together computation across cloud HPC, reliable quantum computing, and AI. In the quantum computation, two logical qubits—created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 machine—were used to prepare the ground state of the active space of an important catalytic intermediate (Figure 1) and then measured. The measurement outputs were then integrated with AI to estimate the ground state energy of the active space. This is the first time that HPC, AI, and quantum-computing hardware have been applied in concert to solve a scientific problem.<br>\nAs a first step, the team at Microsoft used AutoCAS and AutoRXN in Azure Quantum Elements to conduct HPC simulations that identified the active space of the catalyst and the catalyst’s reaction pathways, respectively. The team then optimized error-detection codes for use within a customized quantum algorithm on two logical qubits to simulate the quantum behavior of the active space. The logical qubits were then measured to generate classical data using a method known as classical shadows, which uses the measurement outcomes as classical data to train an AI model on the quantum properties of the molecule. This “shadow data” was then used in combination with the AI model to determine chemical properties of the catalyst and estimate the ground state energy of the active space within chemical accuracy (Figure 2). For comparison, the same calculation was performed with physical qubits.<br>\nThe ground state energy of the catalyst’s active space was calculated classically to gauge the accuracy of the hybrid quantum and AI-based result. Using qubits to solve this problem does not demonstrate scientific quantum advantage because the answer can be derived with classical computers. However, some complicated chemistry problems are unlikely to be solved classically with high accuracy, which provides an opportunity for quantum computers to outperform classical computation.<br>\nThe proof-of-concept case study described here is notable for several reasons. To our knowledge, this is the first demonstration of an end-to-end workflow that employs quantum computing, HPC, and AI to simulate and solve a chemistry problem. Furthermore, the quantum-mechanical problem was solved with a high degree of accuracy. These logical qubits produced a better estimate of the ground state energy than the comparable computation with the underlying physical qubits, demonstrating the higher reliability of these logical qubits.<br>\nThis demonstration provides evidence of the emerging usefulness of quantum-classical hybrid computing in chemistry, and it offers an example of how HPC, AI, and logical qubits can be used collectively to solve scientific problems. The logical qubits created with Microsoft’s qubit-virtualization system are being integrated into Azure Quantum Elements, our cloud platform designed to accelerate scientific discoveries. To increase our offerings further, we’re excited to announce that Quantinuum’s InQuantoTM computational-chemistry software package has been integrated into Azure Quantum Elements. InQuanto’sTM pioneering quantum-chemistry algorithms and methods expand Azure Quantum Elements’ tool kit and are available today through private preview.<br>\nMicrosoft’s qubit-virtualization system extends to all types of qubits<br>\nMultiple types of qubit architectures are being explored as potential pathways toward a quantum-computing future. The logical qubits described above were created on Quantinuum’s ion-trap qubit hardware. The team at Microsoft is also applying the Azure Quantum compute platform to the neutral-atom qubits in Atom Computing’s second-generation systems, designed to have over 1,200 physical qubits. Together, Microsoft and Atom Computing have created logical qubits and are optimizing their systems to enable reliable quantum computation. The team at Microsoft also plans to apply their qubit-virtualization system to the topological qubits that are still in development.<br>\nAs advances are made to both quantum hardware and software, qubits will continue to increase in number and fidelity, enabling deeper and more complex quantum computations with logical qubits. When approximately 100 logical qubits are available, scientific quantum advantage—which is expected to help solve some of the world’s most pressing challenges—will likely be achievable.<br>\nMaking logical qubits available through a new hybrid-computing offering<br>\nAt Microsoft, we’re ushering in a new era of reliable quantum computing by offering the Azure Quantum compute platform that brings together Microsoft’s qubit-virtualization system with industry-leading quantum processing units (QPUs) from hardware partners to create reliable logical qubits. Computation with those logical qubits is then integrated with cloud HPC and AI models. Additionally, in collaboration with Atom Computing, we have a commercial offering of a reliable quantum machine.<br>\nBy providing access to reliable logical qubits, accelerated HPC simulations, Copilot for Azure Quantum, and advanced AI models, Azure Quantum brings the powers of quantum computing, classical computing, and AI together. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about Microsoft’s advances in quantum computing<br>\n- Read about Microsoft’s hybrid-computing offering and our collaboration with Atom Computing in the Official Microsoft Blog.<br>\n- Register for the upcoming Microsoft Quantum Innovator Series on how quantum and AI can unlock a new generation of hybrid applications for science.<br>\n- Read the technical papers on today’s logical qubit announcement and the chemistry simulation performed with logical qubits from Microsoft and Quantinuum.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"c4c6ab72eaad17f4a0e8833008e9a220","author":"Krysta Svore","published_at":"2024-09-10T13:00:00","fetched_at":"2026-10-19 18:17:55","word_count":1289,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"109w","domain":"azure.microsoft.com"},{"id":"56f111ee2310cfc0","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","title":"Introducing two powerful new capabilities in Azure Quantum Elements: Generative Chemistry and Accelerated DFT","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","summary":"Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.&nbsp; Microsoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivi","content":"<p>Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.<br>\nMicrosoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivity of scientific research and remove barriers on the path to scientific discovery by substantially reducing the effort and expertise needed to perform what were previously daunting tasks. Specifically, these capabilities use Copilot for Azure Quantum, a natural-language interface that can be used by experts and non-experts alike, making Azure Quantum Elements accessible to more people and increasing the speed at which complex scientific problems can be solved.<br>\nUnlocking solutions to our most pressing challenges will require the world’s collective genius, and we’re excited to put new capabilities into the hands of scientists, students, and organizations such as Unilever so that everyone can contribute to making scientific discoveries that change the world for the better.<br>\nSince its launch, Azure Quantum Elements has served an important role in helping scientists achieve breakthroughs that have paved the way for more sustainable batteries and innovations in the pharmaceutical industry. Today, we’re announcing two new purpose-built capabilities in Azure Quantum Elements that will further increase the productivity and accessibility of chemistry and materials science research—Generative Chemistry and Accelerated DFT.<br>\nGenerative Chemistry helps scientists discover novel, synthesizable, and useful molecules quickly<br>\nThere are hundreds of millions of known molecular compounds and substances and many more remain to be discovered. In the field of chemistry, a major challenge is narrowing down an enormous number of candidate molecules to find the few that are best suited for a particular application. This challenge results in the streetlight effect, which is when the vast number of possibilities is reduced to a reasonable size, not based on the properties of the compounds, but by focusing only on those that have been studied previously. Relying on databases to identify suitable compounds limits the search space so that only known compounds are revealed as candidates for specific applications. Generative AI helps bring to light a much larger portion of the estimated 1060 possible combinations of atoms so that scientists are presented with novel candidates that are likely to serve the intended purpose.<br>\nToday, the Azure Quantum team at Microsoft is announcing Generative Chemistry—an upcoming capability that has the potential to greatly simplify this process and help scientists quickly discover and design new compounds with desired properties, thus increasing the productivity of product innovation.<br>\nGenerative Chemistry, which will be available through Azure Quantum Elements private preview, is an end-to-end workflow that involves multiple steps:<br>\n- You provide information on desired molecular characteristics for your specific application. Additionally, you can supply reference molecules if you already have some possibilities in mind.<br>\n- The information you provide is used to generate seed molecules from a dataset—those seed molecules are then used to initiate the guided AI generation of candidate molecules for your application. This is accomplished by applying multiple AI models and a unique methodology to identify new compounds that match your criteria. In this step, you have several options for configuration such as selecting the most relevant generative AI model, specifying the number of molecules to be generated, indicating the key molecular properties of interest, and screening compounds for toxicity.<br>\n- AI-based screening models predict properties of the candidate molecules that are important for real-world applications—such as boiling point, density, or solubility. A feedback loop sends this information back to the guided AI generation (step 2) to modify the selection of candidate molecules. In this step, you also have the option to fine tune the AI models for your specific application.<br>\n- The pool of potential candidates is further narrowed through a step that uses AI-guided synthesis planning to determine the feasibility of making the molecules in a laboratory—this is important because some novel molecules with desired properties may be difficult to synthesize. In this step, synthesis pathways are predicted, and candidate molecules are filtered based on how easy they are to make.<br>\n- Highly accurate HPC simulations are performed on the top candidates. Accelerated DFT can be used to screen candidates for electronic properties such as dielectric constant, ionization potential, and polarizability. AutoRXN predicts chemical stability or reactivity, and it can also be used to provide insights on possible synthesis pathways.<br>\n- You are presented with the final candidate molecules from which you can select the most promising for laboratory synthesis and testing.<br>\nThis entire process takes only days, shaving months or even years off trial-and-error laboratory experiments that were previously required to arrive at this point. Generative Chemistry suggests entirely new compounds and gives scientists the freedom to focus on only those molecules that are fit for the desired purpose—saving time, money, and effort. This new capability will allow for rapid progress in the development of novel therapeutics, sustainable materials, and more.<br>\nGenerative Chemistry<br>\nWebinar with American Chemical Society<br>\nAccelerated DFT offers substantial increases in speed compared to other density functional theory codes<br>\nDensity functional theory (DFT) is one of the most popular methods in computational chemistry due to its efficiency and accuracy in modeling quantum-mechanical properties. It allows researchers to simulate and study the electronic structures of atoms, molecules, and nanoparticles as well as surfaces and interfaces, thus predicting properties such as dielectric constant, ionization potential, and polarizability. Scientists can then tailor those properties to optimize them for specific applications.<br>\nAlthough DFT is highly valuable for research and product design, most DFT codes need to be run directly by the user in HPC clusters, which can be a difficult undertaking. Additionally, DFT—when run on traditional HPC hardware—requires substantial compute power and becomes constrained as the molecules being studied or designed increase in complexity and size.<br>\nTo simplify and improve this process, Azure Quantum and Microsoft Research designed and launched Accelerated DFT, a code used to simulate the electronic structure of molecules. Accelerated DFT can determine the properties of molecules with thousands of atoms in a matter of hours. It performs substantially faster than other DFT codes and offers a 20-fold average increase in speed compared to PySCF, a widely used open-source DFT code.1<br>\nThe setup of Accelerated DFT is made simple by providing the software as a service, requiring no code compilation or configuration on the user’s part, and it has a simplified API to streamline the computational process. Furthermore, a Python Software Development Kit (SDK) offers seamless integration into a wide variety of computational chemistry environments, which allows researchers to incorporate DFT calculations into complex chemistry workloads. Accelerated DFT is now available in Azure Quantum Elements private preview; it will also become part of Generative Chemistry.<br>\nAccelerated DFT can substantially expedite research across a wide spectrum of chemical disciplines by employing the power of Azure’s cloud architecture. Accelerated DFT can also produce large and highly accurate datasets of molecular properties that can be used to improve AI models, which require large amounts of training data. By rapidly generating training data, new molecules can be discovered faster, and known molecules can be improved, leading to innovations in therapeutics, sustainable products, and more.<br>\n“We have been very impressed by Accelerated DFT for simulating large systems with range-separated hybrid density functionals, where it speeds up the calculations considerably. Furthermore, the team at Microsoft has been very accommodating in quickly resolving technical challenges for our calculations of an active site of an enzyme.”—Tejs Vegge, Professor, Head of Section for Autonomous Materials Discovery, DTU Energy, Technical University of Denmark.<br>\n“Accelerated DFT has an easy-to-use Python interface, and the acceleration in calculations allows for the efficient use of novel hybrid functionals and a large basis set. Estimating key thermodynamic properties can thus be done in a matter of hours.<br>\nAspenTech is excited to be partnering with Microsoft to evaluate the application of quantum chemistry in our physical properties system for process modeling, especially in our sustainability pathways solutions. We anticipate that working with Accelerated DFT will result in strong use cases for characterizing new molecules and materials that are crucial to decarbonizing and circularizing industrial and consumer materials.”—Heiko Claussen, Senior Vice President, Artificial Intelligence Technology at AspenTech.<br>\nAzure Quantum Elements incorporates quantum computing<br>\nWith the addition of each new feature, Azure Quantum Elements becomes a more effective tool for scientists by harnessing AI, HPC, and emerging hybrid-computing capabilities that bring the power of quantum computing to scientific challenges. Recently, we simulated a chemical catalyst by combining classical supercomputers, AI, and logical qubits created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 hardware. In the coming months, we will introduce advanced logical qubit capabilities from Microsoft and Quantinuum to the private preview of Azure Quantum Elements. This classical-quantum hybrid computing offering follows our quantum computing milestone with Quantinuum in which we created the most reliable logical qubits on record with an error rate 800 times better than that of the corresponding physical qubits.<br>\nAdvances in AI and quantum computing have the potential to help researchers solve global scientific challenges. In the future, we plan to offer a quantum supercomputer that can simulate interactions of molecules and atoms at the quantum level, which is beyond the reach of classical computers. This capability is expected to transform research and innovation across many industries. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about how Azure Quantum Elements is revolutionizing chemistry and materials science<br>\n- Read about our collaboration with Unilever in the Official Microsoft Blog.<br>\n- Explore the product overview of Azure Quantum Elements.<br>\n1 Details on the performance of the private preview of Accelerated DFT can be found in the preprint of Acceleration without Disruption: DFT Software as a Service.<\/p>","content_hash":"a6fbb1579c24d7c640e136044b531c4d","author":"Dr. Nathan Baker","published_at":"2024-06-18T15:00:00","fetched_at":"2026-10-19 18:18:05","word_count":1663,"read_time_minutes":9,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"121w","domain":"azure.microsoft.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-10-19 18:16:30","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"142w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-10-19 18:16:30","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"147w","domain":"medium.com"},{"id":"2c9cd317131160fe",   // ═══════════════════════════════════════════════════════════════

  // ═══════════════════════════════════════════════════════════════

  };

  // ═══════════════════════════════════════════════════════════════
  // D.3  TEXT MEASUREMENT
  // ═══════════════════════════════════════════════════════════════

  function withAlpha(color, alpha) {
    if (color.charAt(0) === '#') {
      var r = parseInt(color.slice(1, 3), 16);
      var g = parseInt(color.slice(3, 5), 16);
      var b = parseInt(color.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }
    // Handle rgb() format
    var m = color.match(/[\d.]+/g);
    if (m && m.length >= 3) {
      return 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',' + alpha + ')';

  // Pretext-powered multi-line height prediction (canvas fallback for single line)
  function measureTextHeight(text, font, maxWidth, lineHeight) {

      return _pretext.layout(prepared, maxWidth, lineHeight);

  function truncateText(text, font, maxWidth) {
    var fullWidth = measureWidth(text, font);
    if (fullWidth <= maxWidth) return text;

      } else {
        hi = mid - 1;
      }

    return text.slice(0, lo) + ellipsis;
  }

  // ═══════════════════════════════════════════════════════════════
  // D.3b MASONRY LAYOUT ENGINE (pure JS positioning)
  // ═══════════════════════════════════════════════════════════════

  function computeMetricMinWidth(group) {
    var PAD = 4, GAP = 4, SPARK_W = 56;
    var metrics = group.metrics || [];
    if (metrics.length === 0) return 220;

    var nameWidths = metrics.map(function(m) { return measureWidth(m.name || '', FONTS.metricName); });
    var maxName = Math.max.apply(null, nameWidths);
    var valueWidths = metrics.map(function(m) { return measureWidth(m.formatted_value || '', FONTS.metricValue); });
    var maxValue = Math.max.apply(null, valueWidths);
    var changeTexts = metrics.map(function(m) {
      var t = m.formatted_change || '';
      if (m.change_period) t += ' ' + m.change_period;
      return t;
    });
    var changeWidths = changeTexts.map(function(t) { return measureWidth(t, FONTS.metricChange); });
    var maxChange = Math.max.apply(null, changeWidths);

    return PAD * 2 + maxName + GAP * 3 + SPARK_W + maxValue + maxChange;
  }

  function indexOfMin(arr) {
    var minIdx = 0;
    for (var i = 1; i < arr.length; i++) {
      if (arr[i] < arr[minIdx]) minIdx = i;
    }
    return minIdx;
  }

  function layoutDashboard(wrappers, data, gap) {
    var container = document.querySelector('.dashboard');
    var viewportWidth = container.clientWidth;
    if (viewportWidth < 1) return;

    // 1. Build card descriptors with measured min widths
    var cards = [];
    for (var i = 0; i < wrappers.length; i++) {
      var w = wrappers[i];
      var type = w.dataset.cardType;
      var cardData = null, minW = 220;

      if (type === 'metric') {
        var idx = parseInt(w.dataset.cardIndex, 10);
        cardData = data.metric_groups[idx];
        if (cardData) minW = computeMetricMinWidth(cardData);
      } else {
        var feedId = w.dataset.feedId;
        for (var f = 0; f < data.feeds.length; f++) {
          if (data.feeds[f].id === feedId) { cardData = data.feeds[f]; break; }
        }
        minW = 280;
      }
      cards.push({ wrapper: w, type: type, data: cardData, minWidth: minW });
    }

    // 2. Column count derived from widest card's measured width
    var allMinWidths = cards.map(function(c) { return c.minWidth; });
    var minColWidth = allMinWidths.length ? Math.max.apply(null, allMinWidths) : 260;
    minColWidth = Math.max(minColWidth, 220);

    var colCount = Math.max(1, Math.floor((viewportWidth + gap) / (minColWidth + gap)));
    var colWidth = (viewportWidth - (colCount - 1) * gap) / colCount;

    // 3. Masonry: pack each card into the shortest column
    var BORDER = 2; // 1px border top + 1px border bottom on .card-wrapper
    var colHeights = [];
    for (var c = 0; c < colCount; c++) colHeights.push(0);

    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var isNews = card.type === 'news';

      // Card height from content (news cards use pretext-measured variable heights)
      var cardH;
      if (isNews && card.data) {
        var newsLayout = computeNewsCardLayout(card.data, colWidth);
        cardH = newsLayout.totalHeight;
      } else {
        var headerH = 16, rowH = 16;
        var rowCount = (card.data && card.data.metrics) ? card.data.metrics.length : 0;
        cardH = headerH + rowCount * rowH;
      }

      // Find shortest column
      var bestCol = indexOfMin(colHeights);
      var bestY = colHeights[bestCol];

      // Position card
      var x = bestCol * (colWidth + gap);
      card.wrapper.style.left = Math.round(x) + 'px';
      card.wrapper.style.top = Math.round(bestY) + 'px';
      card.wrapper.style.width = Math.round(colWidth) + 'px';

      // Update column height (account for wrapper border)
      colHeights[bestCol] = bestY + cardH + BORDER + gap;
    }

    // 4. Set container height
    container.style.height = Math.round(Math.max.apply(null, colHeights)) + 'px';
  }

  // ═══════════════════════════════════════════════════════════════
  // D.4  METRIC CARD LAYOUT
  // ═══════════════════════════════════════════════════════════════

  function computeMetricCardLayout(group, containerWidth) {
    var PAD = 4;
    var GAP = 4;
    var HEADER_H = 16;
    var ROW_H = 16;
    var SPARK_W = 56;

    var metrics = group.metrics || [];

    var nameWidths = metrics.map(function(m) {
      return measureWidth(m.name || '', FONTS.metricName);
    });
    var valueWidths = metrics.map(function(m) {
      return measureWidth(m.formatted_value || '', FONTS.metricValue);
    });

    var changeTexts = metrics.map(function(m) {
      var t = m.formatted_change || '';
      if (m.change_period) t += ' ' + m.change_period;
      return t;
    });
    var changeWidths = changeTexts.map(function(t) {
      return measureWidth(t, FONTS.metricChange);
    });

    var maxValue = valueWidths.length ? Math.max.apply(null, valueWidths) : 0;
    var maxChange = changeWidths.length ? Math.max.apply(null, changeWidths) : 0;

    var fixedWidth = PAD * 2 + GAP * 3 + SPARK_W + maxValue + maxChange;
    var nameCol = Math.max(containerWidth - fixedWidth, 40);

    // Ensure value and change columns don't overlap
    var valueX = PAD + nameCol + GAP + SPARK_W + GAP;
    var changeX = containerWidth - PAD - maxChange;
    if (valueX + maxValue + GAP > changeX) {
      // Shrink sparkline to make room
      var overflow = (valueX + maxValue + GAP) - changeX;
      SPARK_W = Math.max(SPARK_W - overflow, 20);
      valueX = PAD + nameCol + GAP + SPARK_W + GAP;
    }

    var cols = {
      name:   { x: PAD, width: nameCol },
      spark:  { x: PAD + nameCol + GAP, width: SPARK_W },
      value:  { x: valueX, width: maxValue },
      change: { x: changeX, width: maxChange },
    };

    return {
      headerHeight: HEADER_H,
      rowHeight: ROW_H,
      padding: PAD,
      columns: cols,
      totalHeight: HEADER_H + metrics.length * ROW_H,
      changeTexts: changeTexts,
      _metricCount: metrics.length,
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.5  NEWS CARD LAYOUT
  // ═══════════════════════════════════════════════════════════════

  function computeNewsCardLayout(feed, containerWidth) {
    var PAD = 4;
    var GAP = 6;
    var HEADER_H = 16;
    var ROW_H = 18;

    var stories = feed.stories || [];

    var scoreWidths = stories.map(function(s) {
      return measureWidth(String(s.score || 0), FONTS.newsScore);
    });
    var scoreCol = scoreWidths.length ? Math.max(Math.max.apply(null, scoreWidths), 20) : 20;

    var metaTexts = stories.map(function(s) {
      return (s.time_ago || '') + ' ' + (s.comments || 0) + 'c';
    });
    var metaWidths = metaTexts.map(function(t) {
      return measureWidth(t, FONTS.newsMeta);
    });
    var metaCol = metaWidths.length ? Math.max(Math.max.apply(null, metaWidths), 30) : 30;

    var titleX = PAD + scoreCol + GAP;
    var titleWidth = Math.max(containerWidth - titleX - GAP - metaCol - PAD, 60);

    // Measure each title height via pretext (supports multi-line wrapping)
    var rowYOffsets = [];
    var y = HEADER_H;
    var rowHeights = stories.map(function(s) {
      var h = measureTextHeight(s.title || '', FONTS.newsTitle, titleWidth, ROW_H);
      rowYOffsets.push(y);
      var rh = Math.max(h.height, ROW_H); // at least one row tall
      y += rh;
      return rh;
    });

    return {
      headerHeight: HEADER_H,
      rowHeight: ROW_H,
      padding: PAD,
      columns: {
        score: { x: PAD, width: scoreCol },
        title: { x: titleX, width: titleWidth },
        meta:  { x: containerWidth - PAD - metaCol, width: metaCol },
      },
      totalHeight: y,
      rowHeights: rowHeights,
      rowYOffsets: rowYOffsets,
      metaTexts: metaTexts,
      _storyCount: stories.length,
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.6  DRAWING FUNCTIONS
  // ═══════════════════════════════════════════════════════════════

  function drawCardHeader(ctx, name, width, headerHeight, colors) {
    // Header background
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, width, headerHeight);

    // Header bottom border
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(0, headerHeight - 0.5);
    ctx.lineTo(width, headerHeight - 0.5);
    ctx.stroke();

    // Chevron
    ctx.font = FONTS.cardHeader;
    ctx.fillStyle = colors.muted;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('>', 4, headerHeight / 2);

    // Section name
    ctx.fillStyle = colors.accent;
    var chevronWidth = measureWidth('> ', FONTS.cardHeader);
    ctx.fillText(name.toUpperCase(), 4 + chevronWidth, headerHeight / 2);
  }

  function drawDottedSeparator(ctx, y, width, colors) {
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1;
    ctx.setLineDash([1, 2]);
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(width, y + 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawSparkline(ctx, values, x, y, width, height, colors) {
    if (!values || values.length < 2) return;

    var min = Infinity, max = -Infinity;
    for (var i = 0; i < values.length; i++) {
      if (values[i] < min) min = values[i];
      if (values[i] > max) max = values[i];
    }
    var range = max - min;
    if (range === 0) range = 1;

    var pad = 3;
    var drawH = height - pad * 2;
    var drawW = width;
    var stepX = drawW / (values.length - 1);

    ctx.save();
    ctx.beginPath();

    for (var i = 0; i < values.length; i++) {
      var px = x + i * stepX;
      var py = y + pad + drawH - ((values[i] - min) / range) * drawH;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    ctx.strokeStyle = colors.spark;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // Area fill with gradient
    ctx.lineTo(x + drawW, y + height);
    ctx.lineTo(x, y + height);
    ctx.closePath();

    var grad = ctx.createLinearGradient(0, y, 0, y + height);
    grad.addColorStop(0, withAlpha(colors.spark, 0.09));
    grad.addColorStop(1, withAlpha(colors.spark, 0.01));
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.restore();
  }

  function drawMetricRow(ctx, metric, rowIndex, layout, colors, changeText, isHovered) {
    var y = layout.headerHeight + rowIndex * layout.rowHeight;
    var cols = layout.columns;

    // Hover background
    if (isHovered) {
      ctx.fillStyle = colors.hoverBg;
      ctx.fillRect(0, y, cols.change.x + cols.change.width + layout.padding, layout.rowHeight);
    }

    var textY = y + layout.rowHeight * 0.72;

    // Metric name (truncate if needed)
    ctx.font = FONTS.metricName;
    ctx.fillStyle = colors.dim;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    var displayName = truncateText(metric.name || '', FONTS.metricName, cols.name.width);
    ctx.fillText(displayName, cols.name.x, textY);

    // Sparkline
    var sparkValues = metric.sparkline_values;
    if (sparkValues && sparkValues.length >= 2) {
      drawSparkline(ctx, sparkValues, cols.spark.x, y + 1, cols.spark.width, layout.rowHeight - 2, colors);
    }

    // Value (right-aligned within value column)
    ctx.font = FONTS.metricValue;
    ctx.fillStyle = colors.text;
    ctx.textAlign = 'right';
    ctx.fillText(metric.formatted_value || '', cols.value.x + cols.value.width, textY);

    // Change (right-aligned)
    ctx.font = FONTS.metricChange;
    if (metric.change_class === 'up') {
      ctx.fillStyle = colors.up;
    } else if (metric.change_class === 'down') {
      ctx.fillStyle = colors.down;
    } else {
      ctx.fillStyle = colors.dim;
    }
    ctx.textAlign = 'right';
    ctx.fillText(changeText, cols.change.x + cols.change.width, textY);

    // Row separator (except last row)
    var totalMetrics = (layout._metricCount !== undefined) ? layout._metricCount : 999;
    if (rowIndex < totalMetrics - 1) {
      drawDottedSeparator(ctx, y + layout.rowHeight, cols.change.x + cols.change.width + layout.padding, colors);
    }
  }

  function drawNewsRow(ctx, story, rowIndex, layout, colors, metaText, isHovered) {
    var y = layout.rowYOffsets ? layout.rowYOffsets[rowIndex] : (layout.headerHeight + rowIndex * layout.rowHeight);
    var rh = layout.rowHeights ? layout.rowHeights[rowIndex] : layout.rowHeight;
    var cols = layout.columns;

    // Hover background
    if (isHovered) {
      ctx.fillStyle = colors.hoverBg;
      ctx.fillRect(0, y, cols.meta.x + cols.meta.width + layout.padding, rh);
    }

    var textY = y + layout.rowHeight * 0.68;

    // Score (right-aligned)
    ctx.font = FONTS.newsScore;
    ctx.fillStyle = colors.score;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'right';
    ctx.fillText(String(story.score || 0), cols.score.x + cols.score.width, textY);

    // Title (truncated) + domain
    ctx.font = FONTS.newsTitle;
    ctx.fillStyle = colors.text;
    ctx.textAlign = 'left';
    var titleText = story.title || '';
    var domainText = story.domain ? ' (' + story.domain + ')' : '';
    var domainWidth = domainText ? measureWidth(domainText, FONTS.newsDomain) : 0;
    var availableForTitle = cols.title.width - domainWidth - 2;
    var displayTitle = truncateText(titleText, FONTS.newsTitle, availableForTitle);
    ctx.fillText(displayTitle, cols.title.x, textY);

    // Domain (after title)
    if (domainText) {
      var titleDisplayWidth = measureWidth(displayTitle, FONTS.newsTitle);
      ctx.font = FONTS.newsDomain;
      ctx.fillStyle = colors.dim;
      ctx.fillText(domainText, cols.title.x + titleDisplayWidth + 1, textY);
    }

    // Meta (time + comments, right-aligned)
    ctx.font = FONTS.newsMeta;
    ctx.fillStyle = colors.dim;
    ctx.textAlign = 'right';

    // Draw time and comments link separately
    var timeText = story.time_ago || '';
    var commentsText = (story.comments || 0) + 'c';
    var commentsWidth = measureWidth(commentsText, FONTS.newsMeta);
    var timeWidth = measureWidth(timeText, FONTS.newsMeta);
    var spacing = measureWidth(' ', FONTS.newsMeta);

    var metaRight = cols.meta.x + cols.meta.width;

    // Comments (right side, link-colored)
    ctx.fillStyle = colors.link;
    ctx.fillText(commentsText, metaRight, textY);

    // Time (left of comments)
    ctx.fillStyle = colors.dim;
    ctx.fillText(timeText, metaRight - commentsWidth - spacing, textY);

    // Row separator (except last row)
    var totalStories = (layout._storyCount !== undefined) ? layout._storyCount : 999;
    if (rowIndex < totalStories - 1) {
      drawDottedSeparator(ctx, y + rh, cols.meta.x + cols.meta.width + layout.padding, colors);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // D.7  CARD RENDER ORCHESTRATORS
  // ═══════════════════════════════════════════════════════════════

  function setupCanvas(canvas, logicalWidth, logicalHeight) {
    var dpr = window.devicePixelRatio || 1;
    var pw = Math.round(logicalWidth * dpr);
    var ph = Math.round(logicalHeight * dpr);
    // Only resize when dimensions change (avoids GPU buffer reallocation on hover)
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
      canvas.style.width = logicalWidth + 'px';
      canvas.style.height = logicalHeight + 'px';
    }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, logicalWidth, logicalHeight);
    return ctx;
  }

  function renderMetricCard(wrapper, group, colors, hoverIndex) {
    var canvas = wrapper.querySelector('canvas');
    var width = wrapper.clientWidth;
    if (width < 1) return;

    var layout = computeMetricCardLayout(group, width);
    wrapper._layout = layout;
    wrapper._data = group;

    var ctx = setupCanvas(canvas, width, layout.totalHeight);

    // Card background
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, width, layout.totalHeight);

    // Header
    drawCardHeader(ctx, group.name, width, layout.headerHeight, colors);

    // Metric rows
    var metrics = group.metrics || [];
    for (var i = 0; i < metrics.length; i++) {
      drawMetricRow(ctx, metrics[i], i, layout, colors, layout.changeTexts[i], i === hoverIndex);
    }

    // Accessibility
    var label = group.name + ': ' + metrics.map(function(m) {
      return m.name + ' ' + (m.formatted_value || '');
    }).join(', ');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', label);
  }

  function renderNewsCard(wrapper, feed, colors, hoverIndex) {
    var canvas = wrapper.querySelector('canvas');
    var width = wrapper.clientWidth;
    if (width < 1) return;

    var layout = computeNewsCardLayout(feed, width);
    var stories = feed.stories || [];
    wrapper._layout = layout;
    wrapper._data = feed;

    var ctx = setupCanvas(canvas, width, layout.totalHeight);

    // Card background
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, width, layout.totalHeight);

    // Header
    drawCardHeader(ctx, feed.name, width, layout.headerHeight, colors);

    // News rows
    for (var i = 0; i < stories.length; i++) {
      drawNewsRow(ctx, stories[i], i, layout, colors, layout.metaTexts[i], i === hoverIndex);
    }

    // Only create/update link overlays on initial render or resize, not on hover
    if (!wrapper._overlaysCreated || wrapper._lastOverlayWidth !== width) {
      createLinkOverlays(wrapper, stories, layout);
      wrapper._overlaysCreated = true;
      wrapper._lastOverlayWidth = width;
    }

    // Accessibility
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', feed.name + ' feed: ' + stories.length + ' stories');
  }

  // ═══════════════════════════════════════════════════════════════
  // D.8  LINK OVERLAYS
  // ═══════════════════════════════════════════════════════════════

  function createLinkOverlays(wrapper, stories, layout) {
    var linksDiv = wrapper.querySelector('.links');
    linksDiv.innerHTML = '';

    for (var i = 0; i < stories.length; i++) {
      var story = stories[i];
      var rowY = layout.rowYOffsets ? layout.rowYOffsets[i] : (layout.headerHeight + i * layout.rowHeight);
      var rh = layout.rowHeights ? layout.rowHeights[i] : layout.rowHeight;

      // Title link
      var a = document.createElement('a');
      a.href = story.url || ('https://news.ycombinator.com/item?id=' + story.id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', story.title);
      a.style.cssText = 'top:' + rowY + 'px;left:' + layout.columns.title.x + 'px;width:' + layout.columns.title.width + 'px;height:' + rh + 'px;';
      linksDiv.appendChild(a);

      // HN comments link
      var hn = document.createElement('a');
      hn.href = 'https://news.ycombinator.com/item?id=' + story.id;
      hn.target = '_blank';
      hn.rel = 'noopener';
      hn.setAttribute('aria-label', (story.comments || 0) + ' comments on Hacker News');
      var commentsWidth = measureWidth((story.comments || 0) + 'c', FONTS.newsMeta);
      var hnLeft = layout.columns.meta.x + layout.columns.meta.width - commentsWidth;
      hn.style.cssText = 'top:' + rowY + 'px;left:' + hnLeft + 'px;width:' + commentsWidth + 'px;height:' + rh + 'px;';
      linksDiv.appendChild(hn);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // D.9  HOVER SYSTEM
  // ═══════════════════════════════════════════════════════════════

  function attachHoverHandlers(wrapper, colors) {
    var canvas = wrapper.querySelector('canvas');
    var currentHover = -1;

    canvas.addEventListener('mousemove', function(e) {
      var layout = wrapper._layout;
      if (!layout) return;

      var rect = canvas.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var row;
      if (layout.rowYOffsets) {
        // Variable-height rows: binary search for the row containing y
        row = -1;
        for (var r = 0; r < layout.rowYOffsets.length; r++) {
          var ry = layout.rowYOffsets[r];
          var rh = layout.rowHeights[r];
          if (y >= ry && y < ry + rh) { row = r; break; }
        }
      } else {
        row = Math.floor((y - layout.headerHeight) / layout.rowHeight);
        var maxRow = wrapper.dataset.cardType === 'metric'
          ? (layout._metricCount || 0) - 1
          : (layout._storyCount || 0) - 1;
        if (row < 0 || row > maxRow) row = -1;
      }

      if (row !== currentHover) {
        currentHover = row;
        if (wrapper.dataset.cardType === 'metric') {
          renderMetricCard(wrapper, wrapper._data, colors, row);
        } else {
          renderNewsCard(wrapper, wrapper._data, colors, row);
        }
      }
    });

    canvas.addEventListener('mouseleave', function() {
      if (currentHover !== -1) {
        currentHover = -1;
        if (wrapper.dataset.cardType === 'metric') {
          renderMetricCard(wrapper, wrapper._data, colors, -1);
        } else {
          renderNewsCard(wrapper, wrapper._data, colors, -1);
        }
      }
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // D.10 RESIZE OBSERVER
  // ═══════════════════════════════════════════════════════════════

  function setupResizeObserver(wrappers, colors) {
    if (!window.ResizeObserver) return;

    var resizeTimeout = null;
    var observer = new ResizeObserver(function() {
      if (resizeTimeout) clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        layoutDashboard(wrappers, DASHBOARD_DATA, 3);
        renderAllCards(wrappers, colors);
      }, 50);
    });

    observer.observe(document.querySelector('.dashboard'));
    return observer;
  }

  // ═══════════════════════════════════════════════════════════════
  // D.11 INITIALIZATION
  // ═══════════════════════════════════════════════════════════════

  function renderAllCards(wrappers, colors) {
    var data = DASHBOARD_DATA;

    wrappers.forEach(function(wrapper) {
      var type = wrapper.dataset.cardType;
      if (type === 'metric') {
        var idx = parseInt(wrapper.dataset.cardIndex, 10);
        var group = data.metric_groups[idx];
        if (group) renderMetricCard(wrapper, group, colors, -1);
      } else if (type === 'news') {
        var feedId = wrapper.dataset.feedId;
        var feed = null;
        for (var i = 0; i < data.feeds.length; i++) {
          if (data.feeds[i].id === feedId) { feed = data.feeds[i]; break; }
        }
        if (feed) renderNewsCard(wrapper, feed, colors, -1);
      }
    });
  }

  function initDashboard() {
    var colors = readColors();
    var wrappers = Array.prototype.slice.call(document.querySelectorAll('.card-wrapper'));

    // Compute masonry layout from measured text, then render canvases
    layoutDashboard(wrappers, DASHBOARD_DATA, 3);
    renderAllCards(wrappers, colors);

    // Attach hover handlers
    wrappers.forEach(function(wrapper) {
      attachHoverHandlers(wrapper, colors);
    });

    // Responsive resize
    setupResizeObserver(wrappers, colors);

    // ═════════════════════════════════════════════════════════════
    // D.12 DEBUG MODE
    // ═════════════════════════════════════════════════════════════

    if (location.search.indexOf('debug=1') !== -1) {
      wrappers.forEach(function(wrapper) {
        var canvas = wrapper.querySelector('canvas');
        var ctx = canvas.getContext('2d');
        var dpr = window.devicePixelRatio || 1;
        var layout = wrapper._layout;
        if (!layout) return;

        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.lineWidth = 0.5;
        ctx.setLineDash([2, 2]);

        // Column boundaries
        var cols = layout.columns;
        Object.keys(cols).forEach(function(key) {
          var col = cols[key];
          ctx.beginPath();
          ctx.moveTo(col.x, 0);
          ctx.lineTo(col.x, layout.totalHeight);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(col.x + col.width, 0);
          ctx.lineTo(col.x + col.width, layout.totalHeight);
          ctx.stroke();
        });

        // Row boundaries
        ctx.strokeStyle = 'rgba(0, 0, 255, 0.2)';
        if (layout.rowYOffsets) {
          // Variable-height rows
          for (var r = 0; r < layout.rowYOffsets.length; r++) {
            var ry = layout.rowYOffsets[r];
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
          // Bottom edge of last row
          if (layout.rowYOffsets.length > 0) {
            var lastIdx = layout.rowYOffsets.length - 1;
            var ry = layout.rowYOffsets[lastIdx] + layout.rowHeights[lastIdx];
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
        } else {
          var rowH = layout.rowHeight;
          var count = layout._metricCount || layout._storyCount || 0;
          for (var r = 0; r <= count; r++) {
            var ry = layout.headerHeight + r * rowH;
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
        }

        ctx.restore();
      });
    }
  }

  // Wait for IBM Plex Mono to load before measuring/rendering
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 8px "IBM Plex Mono"'),
      document.fonts.load('500 10px "IBM Plex Mono"'),
    ]).then(initDashboard).catch(function() {
      // Font load failed (CDN down?), render with fallback monospace
      initDashboard();
    });
  } else {
    // Fallback for browsers without Font Loading API
    window.addEventListener('load', initDashboard);
  }

</script>

</body>
</html>
