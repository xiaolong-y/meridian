<br>\nWhat can we do with this autonomously emitted photon? We can use it to trigger an entangling gate. Two superconducting qubits with matching energy gaps can exchange excitations. Suppose we have a tunable-frequency transmon qubit capacitively coupled to a cavity. An incoming photon from our autonomous emitter, entering the cavity, can shift the frequency of the transmon. If this effective, shifted frequency matches a nearby qubit’s frequency, the two transmons can interact. The effect of this interaction depends on the cavity’s decay time, rendering our entangling gate random and potentially useful for the implementation of Brownian circuits, for example. A charming instance of a quantum Rube Goldberg machine, if you ask me.<br>\nThis example illustrates the spirit behind our autonomous-gate ideas. As mentioned before, we propose several more instances over different platforms. This all sounds nice and clean after looking at the end product. But the truth is that, when we started the project, I was a theory student with little knowledge about the inner workings of platforms, trying to pitch convincing arguments for novel gate protocols in these well-established technological fields. I had to go through decades of accumulated literature and famous experiments, trying to understand them and hopefully come up with ways to readapt them to the context of autonomy. Naturally, there were many old papers to read, many small details to understand that were obvious to a familiarized experimentalist but not to me, and, of course, many dumb questions to ask. Regarding this, I have to deeply thank Tom Manovitz, Norbert Linke and Simone Gasparinetti, our experimental collaborators, for their patience with these questions and their willingness to chat and clarify to a confused theorist what’s possible and interesting in experimental contexts.<br>\nA special mention, however, to postdoc Yuxin Wang. Earlier in the text I mentioned how being relentless with one’s confusion is helpful; she’s one of the clearest examples I can think of. She came into the project right as I was struggling to model one of our superconducting-qubit gates. I was knee-deep in a convoluted formalism, drowning in inefficient numerical simulations that were leading nowhere. She asked a bunch of questions about our system and my modeling attempts for which I had no good answers for, especially because her expertise in both AMO and open systems really made my explanations look weak. I mean this in the best way I can: polishing my arguments and deeply enquiring about modeling decisions forced us to zoom out and look at simpler, more-efficient ways in which we could model our physical setup. I can’t even begin to quantify Yuxin’s patience and helpfulness in the project, nor how much I learned from working closely with her.<br>\nResearch, of course, is about asking questions. Trying to clarify confusion and asking in the most transparent way possible are discomforts I still struggle with (much like with Zoom calls), but I’ve learned to appreciate these convoluted scenarios and sometimes even thrive in them. Not being the smartest or most-experienced person in a room has lots of perks. You can learn a lot, although you might need to ask one or two dumb questions to get there.<br>\n- It turns on and off by itself,<br>\nit goes out after hours.<br>\nCHARLY GARCÍA<br>\nThe happiness machine<br>\n↩︎<br>\n- I do have, however, a handbook of criteria detailing what makes a useful autonomous quantum machine useful, though. ↩︎<br>\n- Quantum thermodynamicists call these photon-emitting devices autonomous quantum clocks. ↩︎<\/p>","content_hash":"43a118f0636504057fd08f9563d3306f","author":"José Antonio Marín Guzmán","published_at":"2026-10-08T15:27:53","fetched_at":"2026-11-20 14:48:24","word_count":1329,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"6w","domain":"quantumfrontiers.com"},{"id":"f42f1089f5b28a25","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18260","title":"Marcus theory and Marcus practice","url":"https://quantumfrontiers.com/2026/09/27/marcus-theory-and-marcus-practice/","summary":"Rudy Marcus was 91 years old when I took a course from him. His age was, arguably, not his most remarkable quality. The course took place during the second spring of my PhD. I was completing not only the academic year, but also my course requirements. Why not, I figured, indulge in traditional statistical mechanics? Statistical mechanics neighbors, and partially overlaps with, thermodynamics. Modern approaches to statistical mechanics include fancy toolkits imparted in physics courses: the renor","content":"<p>Rudy Marcus was 91 years old when I took a course from him. His age was, arguably, not his most remarkable quality.<br>\nThe course took place during the second spring of my PhD. I was completing not only the academic year, but also my course requirements. Why not, I figured, indulge in traditional statistical mechanics? Statistical mechanics neighbors, and partially overlaps with, thermodynamics. Modern approaches to statistical mechanics include fancy toolkits imparted in physics courses: the renormalization-group method; Ginzburg–Landau theory; and the latter theory’s successor, topological order. I craved a more traditional approach, as won’t surprise readers of this blog. So I ditched the physics course list and signed up for Chemistry 166.<br>\nRudy didn’t disappoint. He began the course with a tradition passed down from a founder of thermodynamics: Boltzmann’s H theorem. The theorem amounts to the first argument ever published for the second law of thermodynamics: every (sufficiently large) closed, isolated system’s entropy increases or remains constant; it doesn’t decrease. Rederiving Boltzmann’s H theorem, I felt as I would while holding a lace collar worn by Queen Elizabeth I: as though I were touching history.<br>\nRudy proceeded through more of the greatest hits in statistical mechanics. For instance, the Fokker–Planck and Langevin equations describe random processes. Examples include the subject of one of Einstein’s most famous papers: the motion of a pollen grain suspended in a liquid and buffeted by the liquid’s molecules. Chemistry 166 provided much of the bread and butter, meat and potatoes, and even tofu and edamame of a thermodynamicist’s education.<br>\nRudy advanced step by step, rederiving every result in class. He recommended a textbook; but I refer to my lecture notes, rather than to the text, to refresh my memory about course topics nowadays. When I encounter complex integrals (a certain type of calculus) in statistical mechanics, I think back to Rudy’s treatment of them. The course also crystallized my understanding of the fluctuation–dissipation theorem, which describes systems perturbed slightly out of equilibrium; examples include a magnet subjected to a weak magnetic field.1 For the course’s final project, I studied quantum master equations—which featured in a Quantum Frontiers post afterward.<br>\nNo less than his explanations of science, Rudy’s enthusiasm for science impressed itself upon me. Again, he taught Chemistry 166 at age 91. He continued to collaborate on research. Whenever I saw him, even after the course ended, he asked for news about quantum information theory—which he didn’t work on.<br>\nTwo and a half years after the course, Rudy gave a speech at a dinner in honor of a couple’s engagement. The groom was pursuing a PhD in applied physics, and the bride worked as an engineer. The groom asked if Rudy had advice for young scientists. Rudy responded immediately: plenty of science remains to be done, so keep exploring.<br>\nDuring his speech, Rudy described his upbringing in Montreal. His high school had produced a “who’s who” of Canadians, in his words—and not because the school demanded high tuitions or offered tutors and social connections. Discrimination pushed Jewish working-class children out of other schools and into Baron Byng, where some students worked hard enough to thrive. Alumni include artists; judges; physicists; William Shatner, who played Captain Kirk in the original Star Trek series…and Rudy Marcus.<br>\nWhich leads me to the quality arguably more remarkable than Rudy’s teaching Chemistry 166 at age 91: he’d won a Nobel Prize in chemistry. Unlike most chemists, Rudy worked as a theorist, rather than an experimentalist. He developed a framework now called Marcus theory. It predicts the rate at which electrons hop between molecules. I can’t tell you much more about Marcus theory because I don’t know much more about it: Rudy had enough humility that, to my memory, he mentioned his theory only once in class, in passing.<br>\nAlthough I know little about Marcus theory, I’ve seen much of Marcus practice. In 2022, I emailed Rudy to ask where a holiday card could reach him. The pandemic had isolated enough people that I’d determined to reach out to more acquaintances. Rudy replied, “I have been working at home, meeting twice a week on zoom with my now small research group.” He was 98 years old. His curiosity, learning, mentoring, and exploring continued.<br>\nRudy passed away this July, five days before his 103rd birthday. I hope to learn Marcus theory someday. But I’d be even more grateful to undertake Marcus practice for even a decent fraction of the time for which he did.<br>\n1How rapidly does the system respond to the perturbation? This nonequilibrium response depends on a correlation function evaluated on an equilibrium state, according to the fluctuation–dissipation theorem. To understand why, imagine preparing the system in a thermal state, perturbing the system at an early time, and measuring the system later. What information can you extract about the perturbation? A two-time correlation function encodes this information. Imagine Fourier-transforming a two-time correlation function. The Fourier transform is proportional to a second derivative of a free energy, according to the fluctuation–dissipation theorem. (The second derivative should sound plausible because it depends on a two-time correlation function.) Second derivatives of free energies equal response functions, such as the magnetic susceptibility. Therefore, a nonequilibrium response depends on an equilibrium correlator.<\/p>","content_hash":"03441b4c88ad1e7bcaaf5c5d077f227b","author":"Nicole Yunger Halpern","published_at":"2026-09-27T19:29:51","fetched_at":"2026-11-20 14:48:24","word_count":869,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"7w","domain":"quantumfrontiers.com"},{"id":"abcdfe6532909136","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18268","title":"Quantum Computers Need More than “Magic”","url":"https://quantumfrontiers.com/2026/09/20/quantum-computers-need-more-than-magic/","summary":"The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.&nbsp; Between the bringing of the bread a","content":"<p>The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.<br>\nBetween the bringing of the bread and the serving of the soup, the conversation at my end of the table typically turns to my topic of research: quantum computers. These theoretical machines harness quantum physics to outperform their classical counterparts. Quantum computers hold great promise for the future, with applications ranging from drug discovery to cybersecurity. Yet, despite their promise, we still do not have a satisfying answer to the fundamental question: what makes quantum computers computationally stronger than classical computers?<br>\nTo answer this question, imagine that tonight, instead of the soup, the cooks are brewing a happiness potion. This potion causes the drinker to be joyful and content for the rest of the evening. The cooks know how to brew the potion perfectly well; they discovered the list of ingredients in the nineties and have been successfully brewing ever since. But the cooks still cannot solve one mystery: what makes the potion different from the soup? What ingredient sets the potion apart from the soup?<br>\nThe cooks come up with a simple approach. They leave out one ingredient in each serving, and then carefully observe the formal-goers. They find that almost every seat is filled by a happy student, chatting away to their neighbours, indicating a working potion. However, one student’s spirits have not been lifted, as they were solely served a simple soup. The cooks conclude that the ingredient they withheld for that student was essential. They name this ingredient magic.<br>\nIn my research, the potion is a quantum computer, the soup is a classical computer, and magic is the actual technical term used for quantum states that promote certain classical computers to quantum computers. Without magic, these quantum computers are computationally no stronger than a normal laptop.<br>\nSo magic is necessary for quantum computational advantage, but is it enough? Over a decade ago, researchers found that, for quantum computers built on qutrits, the answer is no. To understand what a qutrit is, consider the regular bit: a switch that’s either zero or one. The qubit, the quantum generalization of the bit, can be both zero and one simultaneously. The qutrit is a roomier qubit that can be zero, one, two, or any of those simultaneously.<br>\nIt is possible to build quantum computers using qutrits. However, the vast majority of quantum computers are built on qubits, the quantum generalisation of the everyday bit. My colleagues and I have recently discovered that for qubit-based quantum computers, too, magic is not enough to gain an advantage over classical computers. Picture the cooks dumping jar after jar of magic into a soup, only to find that the soup never gains magical powers. Potions need more than magic. Potions also need Kirkwood-Dirac negativity.<br>\nWhat is Kirkwood-Dirac negativity? The idea developed by John Kirkwood and Paul Dirac builds on probabilities—for example, the odds of obtaining a heads upon flipping a coin. One can describe a quantum computer using numbers that behave similarly to probabilities but come with a twist: they may be negative. These negative “probabilities” mark where quantum departs from classical. The main result of our paper is that this negativity, too, is a necessary ingredient: without it, no amount of magic will turn the soup into a potion.<br>\nAt this point in the conversation, I am typically cut off by the arrival of the soup. The conversation moves on from quantum computers to different subjects, and I usually look up at the paintings staring down at me. One of them is of Dirac, who spent many dinners discussing quantum theory in the same dining hall. The University of Cambridge is a special place.<\/p>","content_hash":"8c54ccd29fbd109c79f02546399e0593","author":"jjthio","published_at":"2026-09-20T16:49:32","fetched_at":"2026-11-20 14:48:24","word_count":678,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"8w","domain":"quantumfrontiers.com"},{"id":"3f8f2a08f44c12ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18162","title":"How can objects interact without touching?","url":"https://quantumfrontiers.com/2026/09/06/how-can-objects-interact-without-touching/","summary":"Rethinking the electric field Have you ever wondered what an electric field actually is?&nbsp; The electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.&nbsp; Most textbooks define the electric field ","content":"<p>Rethinking the electric field<br>\nHave you ever wondered what an electric field actually is?<br>\nThe electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.<br>\nMost textbooks define the electric field as a property of space or a physical entity surrounding electric charges, or with the equation of force per unit charge. These definitions help us understand what the electric field does and its effect on electrically charged particles, but they do not fully answer what an electric field actually is and how it influences charges. Thus, I started thinking about the question: what allows charges to influence each other without touching?<br>\nThis question led me down a path that began with a simple observation in everyday life, and it eventually pointed toward much deeper ideas in modern physics.<br>\nObjects Influenced by Their Surroundings<br>\nBefore talking about electric fields, let’s consider a more basic question: Does it seem reasonable that objects can be influenced by their surroundings?<br>\nMost people would answer yes. We have all seen examples of objects responding to something else nearby, such as the Earth orbiting the Sun, a compass needle reacting to a magnet, and our phones responding to signals from a WiFi router. But what is the mechanism behind these interactions?<br>\nA simple physical phenomenon that we can look at is a balloon rubbed on a piece of clothing that can pick up strands of our hair. Many of us have seen this demonstration in kindergarten or first grade of elementary school. This might seem completely ordinary, but if we pause and think about it, something strange is happening – the balloon is influencing the hair without touching it.<br>\nHow is that possible? One answer is simply that the balloon “pulls” on the hair, but this raises more questions. How does the balloon reach the hair? What is happening in the space between them? These questions suggest that something is missing from the picture of objects pulling on each other directly through contact.<br>\nTo put this in the context of physics, we might all have learned that “like charges repel, and opposite charges attract”. We might have solved equations on how fast charges would move away from or toward each other. We were always told to just accept it because these motions result from the electric field. But why do these observations happen? What is happening between the charges?<br>\nHistorically, physics encountered the same problem. If one object can influence another at a distance, it is natural to ask what is happening in the space between them. One guiding principle that physicists often use is the concept of locality. Locality is the idea that an object can only be directly influenced by its immediate surroundings. Thus, an influence should not simply leap across space from one object to another, and changes should propagate through intermediate regions step by step.<br>\nAt first glance, locality seems reasonable because it matches many of our everyday experiences. If I push a book across a table, my hand influences the book through direct contact. The influence does not appear to jump instantaneously across the table.<br>\nHowever, locality creates a tension when we return to the scenario of the balloon pulling on strands of hair. If locality is true, something must be happening in the space between the balloon and the hair. But from a standard electromagnetic perspective, the space between the balloon and the hair is empty. Therefore, we have encountered a contradiction: if what is between the balloon and the hair is empty space, then what is responsible for transmitting the influence? Neither the usual electromagnetism nor locality tells us the answer to these questions.<br>\nThe Classical Electric Field<br>\nIn the usual electromagnetic picture, the answer to the puzzle is the electric field. Rather than allowing charges to influence one another directly across space, the theory assigns an electric field to the space surrounding charges. The field acts as the intermediary through which influence is transmitted.<br>\nA useful way to think about the electric field is that it assigns information to every point in space. If we imagine a charged particle that is placed at a particular location, the electric field tells us how that particle would move. This charged particle is what physicists call a test charge. By observing how the test charge behaves, we can infer information about the electric field at that location.<br>\nThis could seem like a satisfying answer as the electric field tells us how influence is transmitted, but it does not tell us what kind of thing is doing the transmission. Is the electric field a physical substance? Is it a mathematical tool? Or is it something else?<br>\nIt might be easy to fall back on the idea that the electric field ultimately works through tiny particles physically touching one another. After all, contact interactions are among the most familiar interactions that we experience.<br>\nBut physics challenges this intuition as well. It is surprisingly difficult to define what it means for two objects to “touch”. We usually think of the balloon attracting hair as an example of action at a distance, whereas pressing a hand on a table feels like direct physical contact. However, at the microscopic level, the two situations are fundamentally similar. If we could zoom in on our fingertip and the table with a microscope, we would find that the atoms in our skin never make contact with the atoms in the table. This is because of the repulsion between the electron clouds surrounding the atoms, which prevents the two atomic nuclei from overlapping. Say if we scale the atom in the table up to be the size of a marble, then the nearest atom in our fingertip would still be separated from it by a few centimeters. In the end, nothing is truly “touching” in the intuitive, physical sense.<br>\nThus, the idea of contact does not solve our problem. We are forced to ask the same question again: what is it that allows these interactions to occur? To answer that question, I turned to a different perspective of thinking about electric fields.<br>\nThe Electric Field as A Dynamical Structure<br>\nFrom our intuition, it is natural to imagine the electric field as some invisible substance filling space. This is often the picture suggested by the common field line diagrams in physics textbooks, which make the field appear to flow outward or inward from charges, almost like a moving fluid.<br>\nA useful analogy is the ocean. A boat floating on water can move because waves pass beneath it. The boat responds to changes in its surrounding waves rather than to some direct push from a distant object. Similarly, charged particles respond to changes in the electric field around them. We can then view the electric field as a dynamical structure that governs how the state of the world can evolve.<br>\nHowever, the ocean analogy can only take us so far. Ocean waves are made of water molecules. Sound waves are made of vibrating air molecules. But what is the electric field made of? When light travels through empty space, it seems that there is no material medium at all.<br>\nThis brings us back to the mystery: if locality suggests that something must exist in the space between interacting objects, and if the electric field is not made of the ordinary matter that we understand, then what exactly is occupying the space?<br>\nTo answer this question, we have to rethink what we mean by “empty” space itself.<br>\nEmpty Space is Not Empty<br>\nConventionally, we have always imagined empty space as exactly what the name suggests—empty. Just like if all the particles were removed and nothing was remaining. But modern physics suggests a very different picture.<br>\nIn quantum field theory, what we call “empty space” is not truly empty. Empty space is filled with underlying quantum fields that permeate all of space and time, even in the absence of particles. Even when the surface of the ocean looks perfectly still, the water is still there. The ocean is not defined only by visible waves, but by the underlying medium that can support waves in the first place. The waves are patterns of motion of the ocean itself, just like the electric field. These fields are part of the fundamental structure of the universe from which physical phenomena emerge. Quantum field theory suggests that particles are not independent objects moving through an otherwise empty space. Rather, they are localized patterns or excitations of underlying fields that already exist throughout the universe.<br>\nFrom this perspective, the electric field is not something that is added to empty space. It is part of the fundamental dynamical structure of space itself.<br>\nConclusion<br>\nAt the beginning, I asked a simple question: how can objects influence each other without touching? The straightforward answer is the electric field. Charges create electric fields, and those fields determine how other charges move. But what is an electric field? Is it an invisible material filling space between objects, or is it a dynamical structure that governs how physical systems in the world evolve?<br>\nFrom the perspective of quantum field theory, quantum fields permeate all of space and time. Particles are not separate objects moving through an empty space, but are excitations of these underlying fields; electric fields are not secondary matter surrounding charged particles, but are particular configurations of the underlying electromagnetic quantum fields. What we observe as the motion of a charged particle is the result of its interaction with the electromagnetic field, whose local state determines how the particle evolves.<br>\nIn the end, our original question may not have a single definitive answer. But asking it revealed a shift in perspective, and physics has repeatedly shown that every explanation opens the door to an even more fundamental question. Stopping at this step, a new mystery emerges: what are these underlying quantum fields themselves? What are they made of, and where do they arise from?<\/p>","content_hash":"72ad48be59eb5d47ff76fadb3908d2c5","author":"adelynnt","published_at":"2026-09-06T13:17:26","fetched_at":"2026-11-20 14:48:24","word_count":1697,"read_time_minutes":9,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"10w","domain":"quantumfrontiers.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-11-20 14:48:23","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"147w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-11-20 14:48:23","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"152w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-11-20 14:48:23","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"153w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":null,"content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-11-20 14:48:23","word_count":79,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"155w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":null,"content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-11-20 14:48:23","word_count":76,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"157w","domain":"medium.com"},{"id":"1edf7f311f4678be","feed_id":"qiskit-blog","guid":"https://medium.com/p/69e861fbfc88","title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":null,"content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-11-20 14:48:23","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"158w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":null,"content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-11-20 14:48:23","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"159w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":null,"content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-11-20 14:48:23","word_count":87,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"160w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":null,"content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-11-20 14:48:23","word_count":75,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"161w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":null,"content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-11-20 14:48:23","word_count":86,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"163w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"d3144b1af24959fe","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49016","title":"University of Amsterdam Awards €800,000 Across Four Quantum Simulation Projects for Chemistry and Materials Design","url":"https://quantumcomputingreport.com/university-of-amsterdam-awards-e800000-across-four-quantum-simulation-projects-for-chemistry-and-materials-design/","summary":"The University of Amsterdam (UvA) has launched the Q-SIM4MMD initiative, investing €800,000 across four quantum simulation projects. These projects aim to explore quantum simulation and machine learning for molecular and materials discovery, focusing on applications like molecular design, bioinformatics, and developing safer molecules. The initiative connects researchers across various disciplines and seeks to integrate quantum approaches with classical modeling. The post University of Amsterdam","content":"<p>The University of Amsterdam (UvA) Faculty of Science has launched four two-year research projects under its new Q-SIM4MMD initiative, committing €200,000 in seed funding to each team (€800,000 ($877K USD) total) to evaluate quantum simulation and quantum machine learning for molecular and materials discovery. Embedded within UvA’s Molecular and Material Design Technology Hub (MMD TechHub), the effort is supported by a newly formed Q-Sim expertise group connecting researchers across physics, chemistry, life sciences, and computer science with the QuSoft research center and Quantum Delta NL Amsterdam.<br>\nUvA Q-SIM4MMD Funded Quantum Simulation Projects (€200,000 Each Over Two Years)<br>\nProject Title<br>\nPrincipal Investigators<br>\nTechnical Focus & Application Targets<br>\nQuantum Machine Learning for Molecular and Material Design<br>\nAlberto Pérez de Alba Ortíz, Clélia de Mulatier (UvA)<br>\nQuantum-circuit kernels for Bayesian optimization modeling PFAS and nanoplastic binding to human proteins.<br>\nExploring Quantum Computing in Bioinformatics<br>\nAalt-Jan van Dijk, Anna Heintz-Buschart (UvA)<br>\nBenchmarking hybrid quantum-classical workflows against classical tools for enzyme specificity and microbiome DNA analysis.<br>\nQuantum-assisted topological molecular representations for screening large chemical databases.<br>\nTesting Quantum Simulations Against Established Methods<br>\nPhilippe Corboz, Arghavan Safavi Naini (UvA), Natalia Chepiga (Oxford)<br>\nBenchmarking quantum simulations of 2D Hubbard models and spin-chain dynamics against classical tensor networks.<br>\nLaunched in June 2024 across eight Faculty of Science institutes, the MMD TechHub will assist the four project teams in transitioning proof-of-concept algorithms toward external public-private partnerships and follow-up industrial funding. By pairing domain chemists and biologists directly with quantum algorithm developers, the initiative aims to identify specific computational bottlenecks where near-term quantum processors or quantum-inspired methods can complement established classical modeling pipelines.<br>\nRead the University of Amsterdam announcement here, and view the ecosystem update from Quantum Delta NL Amsterdam here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"cc014fae2f4aebf96de20d88684dbc22","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T01:30:11","fetched_at":"2026-11-20 14:48:21","word_count":363,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"7dfd2801cc3840dd","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49012","title":"UCLA Researchers Model Collectively Enhanced Superconducting-Qubit Interfaces for Microwave-to-Optical Transduction","url":"https://quantumcomputingreport.com/ucla-researchers-model-collectively-enhanced-superconducting-qubit-interfaces-for-microwave-to-optical-transduction/","summary":"UCLA researchers have developed a theoretical model for enhancing microwave-to-optical quantum transduction using superconducting qubits. Their proposed architecture collectively couples multiple qubits to a shared optomechanical resonator, aiming to overcome limitations in current optical interconnects. The study shows that this collective coupling can improve conversion efficiency and bandwidth, with an auxiliary transmon further boosting single-photon optical target probability. The post UCLA","content":"<p>Researchers at the University of California, Los Angeles (UCLA) have published a theoretical and numerical study evaluating how ensembles of superconducting transmon qubits coupled collectively to a shared optomechanical resonator can enhance microwave-to-optical quantum transduction. Detailed in a technical preprint, the architecture addresses weak electromechanical coupling bottlenecks in optical interconnects designed to link cryogenic superconducting processors over low-loss fiber networks.<br>\nRather than routing signals through a single intermediate microwave resonator, the proposed interface couples multiple electrically distinct superconducting qubits directly to a common mechanical normal mode via displacement-dependent electrodes, while an optical cavity reads out the mechanical vibration through radiation pressure. In weak-excitation input-output simulations across ensembles of 4, 24, and 64 qubits, collective coupling increased peak external conversion efficiency from approximately 20% to 30% and 40% while broadening conversion bandwidth, though optical pump-induced mechanical heating bounded the optimal pump strength.<br>\nOperating near half excitation in the symmetric Dicke manifold accelerates electromechanical transfer nearly linearly with ensemble size, but the authors showed that this speedup is offset by the proportional relaxation exposure of additional excited qubits, leaving single-qubit coupling and lifetime as the governing coherence requirement. To isolate single-excitation transitions, the team introduced an auxiliary transmon that induces mechanical Kerr anharmonicity, raising lossless single-photon optical target probability in a four-qubit benchmark from 19.6% to 99.7% at 100 kHz anharmonicity, while quantifying how pair-dependent qubit-qubit disorder reduces gated optical retrieval efficiency from 58.1% to 35.4%.<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"41e493f06d73597b50f89f041ccad445","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T01:19:13","fetched_at":"2026-11-20 14:48:21","word_count":309,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"64ef65cd737f2aee","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49008","title":"Researchers Introduce QECLean Framework to Formally Verify Quantum Error-Correcting Codes in Lean 4","url":"https://quantumcomputingreport.com/researchers-introduce-qeclean-framework-to-formally-verify-quantum-error-correcting-codes-in-lean-4/","summary":"Researchers have developed QECLean, an open-source framework using Lean 4 to formally verify quantum error-correcting codes, addressing the difficulty of verifying complex, algorithmically discovered codes. It has successfully verified parameters for several significant QEC codes, including an IBM 360-qubit code and infinite planar code families. QECLean aims to validate AI-discovered codes and future quantum compilers by linking different mathematical representations within Lean's type system. ","content":"<p>Researchers from the University of Wisconsin-Madison and the University of Arizona (alongside QEC Labs) have introduced QECLean, an open-source formal verification framework built on the Lean 4 proof assistant to mechanically prove the parameters of quantum error-correcting (QEC) codes. Detailed in a technical preprint following a tutorial at IEEE Quantum Week 2026, the library addresses the growing challenge of verifying complex, algorithmically discovered QEC codes whose code distances are often too large for brute-force enumeration or constraint solvers.<br>\n| Quantum Error-Correcting Codes Formally Verified in QECLean |  |  | <br>\n|---|---|---|<br>\n| Code or Infinite Code Family | Verified Parameters [[n, k, d]] | Verification Approach & Significance | <br>\n| IBM 360-Qubit Bivariate Bicycle Code | [[360, 12, 24]] | Proved exact distance 24 via double-cover combinators (previously known only as an upper bound ≤ 24). | <br>\n| IBM Gross Code (Bivariate Bicycle) | [[144, 12, 12]] | Verified as a double cover of a [[72, 12, 6]] base code using kernel-checked certificates. | <br>\n| Oratomic Mitten Code | [[150, 30, 10]] | Verified high-rate (1/5) non-abelian lifted-product code via homological chain complexes. | <br>\n| Rotated Surface Code Family | [[L2, 1, L]] (odd L ≥ 3) | First machine-checked parametric distance proof across an infinite planar code family. | <br>\n| Toric & Triangular Color Families | [[2L2, 2, L]] and [[3r(r+1)+1, 1, 2r+1]] | Parametrically verified via homological wrapping invariants and boundary maps. | <br>\nBecause computing minimum code distance is NP-hard in general, conventional integer linear programming and satisfiability solvers typically stall on codes with distances above 18 and cannot certify infinite code families. QECLean bridges this gap by linking three mathematical representations within Lean’s dependent type system: stabilizer groups, binary symplectic check matrices, and homological chain complexes, allowing researchers to specify a code once and prove each property in the most tractable representation.<br>\nTo scale verification to large quantum low-density parity-check (qLDPC) architectures, Stavan Jain, Nithin Raveendran, and Aws Albarghouthi developed compositional code combinators, including a generalized double-cover combinator that derives the distance of a 2n-qubit lifted code from an n-qubit base code. While the current release verifies algebraic code distance rather than physical circuit-level fault tolerance or noise thresholds, the framework comprises roughly 57,000 lines of Lean code and 312,000 lines of kernel-checked certificates designed to validate AI-discovered codes and future verified quantum compilers.<br>\nRead the full research paper on arXiv here, access the open-source QECLean repository on GitHub here, and view the IEEE Quantum Week 2026 tutorial materials here.<\/p>","content_hash":"c9976e0d7597f9c97412bea307147f3a","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T01:11:39","fetched_at":"2026-11-20 14:48:21","word_count":419,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"2cbaf02e30ed06cc","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49004","title":"memQ and Infleqtion Sign MoU to Validate Quantum Networking Interoperability for Distributed Neutral-Atom Systems","url":"https://quantumcomputingreport.com/memq-and-infleqtion-sign-mou-to-validate-quantum-networking-interoperability-for-distributed-neutral-atom-systems/","summary":"memQ and Infleqtion have signed an MoU to validate interoperability between memQ’s quantum network architecture and Infleqtion’s quantum computing platform. This collaboration aims to enable modular multi-processor scaling by connecting separate quantum processing units. The initiative is crucial for enterprise and high-performance computing data centers to adopt standardized QPU-to-QPU networking. The post memQ and Infleqtion Sign MoU to Validate Quantum Networking Interoperability for Distribu","content":"<p>Quantum networking company memQ and neutral-atom quantum technology provider Infleqtion (NYSE: INFQ) have signed a memorandum of understanding (MoU) to pursue interoperability validation and certification between memQ’s extensible quantum network architecture (xQNA) and Infleqtion’s Sqale quantum computing platform and Superstaq software stack. The collaboration targets modular multi-processor scaling by enabling separate quantum processing units to connect and distribute workloads without collapsing quantum states.<br>\nBecause conventional data-center interconnects cannot preserve entanglement across independent quantum nodes, optical quantum networking is required to replicate the horizontal clustering model used in classical high-performance computing (HPC). Under the agreement, the two companies will evaluate how memQ’s optical connectivity and quantum control hardware interface with Infleqtion’s neutral-atom architecture and compiler workflows to support flexible, multi-system deployment configurations.<br>\nThe announcement follows Infleqtion’s 100-qubit Sqale deployment at the U.K. National Quantum Computing Centre and its roadmap to scale toward 1,000 logical qubits by 2030. While the MoU represents an early-stage validation framework subject to technical integration milestones, both companies noted that standardized QPU-to-QPU networking will be critical for enterprise and HPC data-center adoption.<br>\nRead the announcement on the memQ website here and view the press release in the Infleqtion newsroom here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"e94c3f3031fe695da6f4bd593ec8297b","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T01:04:26","fetched_at":"2026-11-20 14:48:21","word_count":276,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"61664148f0a59118","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49000","title":"Mastercard Launches Quantum Advisory Practice with QIZ Security and Releases PQC Readiness Whitepaper","url":"https://quantumcomputingreport.com/mastercard-launches-quantum-advisory-practice-with-qiz-security-and-releases-pqc-readiness-whitepaper/","summary":"Mastercard has launched a Quantum Advisory Practice with QIZ Security to help financial institutions transition to post-quantum cryptography, addressing immediate \"harvest now, decrypt later\" risks. This initiative, aligned with G7 and FS-ISAC guidance, offers services like cryptographic asset discovery and remediation roadmaps. Mastercard is also conducting quantum research with Oxford Quantum Circuits, focusing on financial fraud protection. The post Mastercard Launches Quantum Advisory Practi","content":"<p>Mastercard (NYSE: MA), through its Advisors and Transformation division, has launched a dedicated Quantum Advisory Practice accompanied by a whitepaper titled Quantum Computing and Financial Services outlining post-quantum cryptography (PQC) transition strategies for banks, acquirers, payment service providers, and fintechs. Positioned around a 2029–2030 planning horizon and aligned with G7 Cyber Expert Group and Financial Services Information Sharing and Analysis Center (FS-ISAC) guidance, the initiative addresses immediate “harvest now, decrypt later” (HNDL) exposure across long-lived financial and customer datasets.<br>\nTo execute the advisory offering, Mastercard is partnering with cryptography management provider QIZ Security, which joins the practice to support automated cryptographic asset discovery, data-longevity risk registers, phased remediation roadmaps, cryptographic agility guardrails, and board-level reporting frameworks. Alongside its PQC readiness services, Mastercard highlighted ongoing quantum research and development with Oxford Quantum Circuits (OQC), including a hybrid quantum-classical pilot focused on financial fraud protection.<br>\nRead Mastercard’s official press release here, view the insights overview here, and download the November 2026 whitepaper here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"692b43d488264820dfc3350668875fdc","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T00:58:59","fetched_at":"2026-11-20 14:48:21","word_count":244,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"88af74d29878ce03","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48996","title":"BMO Demonstrates Quantum Utility in Game-Theoretic Machine Learning Feature Selection on IBM Nighthawk r2","url":"https://quantumcomputingreport.com/bmo-demonstrates-quantum-utility-in-game-theoretic-machine-learning-feature-selection-on-ibm-nighthawk-r2/","summary":"BMO Financial Group, in collaboration with DUTH and IBM, has demonstrated a quantum machine learning feature-selection workflow on IBM quantum processors. They applied quantum game theory to identify high-value predictive variables in financial datasets, achieving comparable quality to classical methods with significantly fewer algorithmic samples. This milestone builds on BMO's earlier entry into the IBM Quantum Network and the launch of their AI &#038; Quantum Institute. The post BMO Demonstra","content":"<p>BMO Financial Group, in collaboration with the Democritus University of Thrace (DUTH) and IBM, has demonstrated a quantum machine learning feature-selection workflow on IBM superconducting processors, including the IBM Quantum Nighthawk r2 system. Reviewed by IBM’s quantum research team, the experiment applies quantum game theory to identify high-value predictive variables in financial datasets for downstream client modeling, risk assessment, and personalization workloads.<br>\nRather than treating feature selection as a conventional classical statistical search, the team adapted the Proxy Quantum Games framework developed by researchers at BMO, DUTH, and IBM. Within this formulation, each candidate variable in a dataset is modeled as a player in a quantum strategic game, receiving higher payoff scores when aligned with the target outcome variable and lower scores when uninformative or redundant. According to BMO, the quantum ranking approach achieved feature-selection quality comparable to classical baselines while requiring one to two orders of magnitude fewer algorithmic samples, though specific qubit counts, circuit depths, and wall-clock runtime comparisons have not yet been published.<br>\nThe milestone builds on BMO’s February 2025 entry into the IBM Quantum Network and the launch of the BMO Institute for Applied Artificial Intelligence & Quantum, alongside ecosystem collaborations with the Chicago Quantum Exchange and Quantum Industry Canada. BMO noted that the work remains at the early demonstration stage as the bank evaluates scalable hybrid integration within governed financial workflows.<br>\nRead BMO’s announcement here, view the overview on BMO’s AI portal here, and access the underlying Proxy Quantum Games paper in Parallel Processing Lettershere.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"acdc1629c72b917fe1188980b88234a9","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T00:36:52","fetched_at":"2026-11-20 14:48:21","word_count":333,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"8cf2205e971826d1","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48991","title":"Google Quantum AI Demonstrates Measurement Contextuality Across 105 Qubits on Willow Processors","url":"https://quantumcomputingreport.com/google-quantum-ai-demonstrates-measurement-contextuality-across-105-qubits-on-willow-processors/","summary":"Google Quantum AI has demonstrated quantum measurement contextuality on 72-qubit and 105-qubit Willow processors, moving contextuality testing to large two-dimensional qubit arrays. This research, published in Science, establishes a hardware benchmark for coherent control errors and has implications for fault-tolerant computing and molecular simulations. The experiments verified that quantum observables do not have predetermined values independent of compatible measurements. The post Google Quan","content":"<p>Google Quantum AI has published cover research in Science demonstrating that quantum measurement contextuality persists at many-body scale on superconducting processors and yields measurable computational separations in bounded-resource tasks. Conducted on 72-qubit and 105-qubit Willow processors, the experiments move contextuality testing from small few-particle systems to large two-dimensional qubit arrays while establishing a hardware benchmark sensitive to coherent control errors.<br>\n| Google Quantum AI Contextuality & Bounded-Resource Hardware Benchmarks |  |  |  | <br>\n|---|---|---|---|<br>\n| Experimental Protocol | Qubit Scale | Measured Quantum Performance | Classical Theoretical Limit | <br>\n| Mermin-Peres Magic Square Game | 4 qubits (2 Bell pairs) | 98.30% ± 0.01% win rate (900,000 trials) | 88.89% (8/9 rounds) | <br>\n| Kochen-Specker-Bell Inequality (χKSB) | 2 data qubits + 1 ancilla | 5.618 ± 0.005 (540 sequential QND measurements) | χ ≤ 4.0 (quantum ceiling: 6.0) | <br>\n| N-Player GHZ Parity Game | Up to 71 qubits | Exceeded classical win rate across all sizes; 45-qubit genuine entanglement | 75% at N = 3, decaying toward 50% | <br>\n| 2D Hidden Linear Function (HLF) | 9 to 105 qubits | Success probability > 0.5; effective depth ~4 to ~6 layers | Logarithmic classical circuit depth | <br>\nUnlike entanglement alone, measurement contextuality captures the principle that quantum observables do not possess predetermined values independent of which compatible measurements are performed alongside them. To verify this property without disturbing the underlying quantum register during the state-independent Kochen-Specker-Bell test, the team used a resettable ancilla qubit and calibrated virtual-Z phase rotations to execute 540 consecutive quantum nondemolition (QND) measurements per run. At larger scales, randomized breadth-first-search Greenberger-Horne-Zeilinger (GHZ) state preparation sustained contextuality up to 71 qubits, while constant-depth four-layer controlled-Z circuits solved 2D hidden linear function instances across grids up to 105 qubits.<br>\nBeyond probing the theoretical resource linked to non-Clifford magic states in fault-tolerant computing, Google researchers noted that contextuality tasks provide a sensitive hardware diagnostic for structured applications such as molecular simulations in chemistry and materials science. Because structured parity and hidden-function tests require exact multi-qubit phase agreement, they expose small coherent over-rotations that random-circuit sampling tends to average out, offering a fixed physical ceiling against which future processors can be calibrated even though the Clifford-based test circuits remain efficiently simulable classically via tools such as Stim.<br>\nRead the peer-reviewed study in Science here, view Google’s overview announcement here, and read the technical deep dive on the Google Research blog here. Readers can also access foundational theoretical papers on quantum pseudo-telepathy by Brassard, Broadbent, and Tapp here, shallow-circuit quantum advantage by Bravyi, Gosset, and König here, and contextuality in magic state distillation by Howard et al. here.<\/p>","content_hash":"9b676dec5e22f9e74ce7234691dfe566","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T00:22:47","fetched_at":"2026-11-20 14:48:22","word_count":445,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"f81cc800d45cfe44","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48987","title":"Your Best Quantum Error Correction Engineer Might Be a Bot","url":"https://quantumcomputingreport.com/your-best-quantum-error-correction-engineer-might-be-a-bot/","summary":"A description of how AI is playing an increasingly important role in assisting engineers developing new quantum error correction codes and quantum error correction decoders. The post Your Best Quantum Error Correction Engineer Might Be a Bot appeared first on Quantum Computing Report.","content":"<p>By Doug Finke<br>\nThe rate of innovation in quantum computing is accelerating. One of the reasons for this is that quantum providers are now using AI extensively for many of the design and other activities they used to do manually.<br>\nAt GQI, we categorize the interplay of AI and Quantum into three broad categories:<br>\n- AI for Quantum<br>\n- Quantum for AI<br>\n- Quantum + AI Hybrid Algorithms<br>\nAlthough “Quantum for AI” and the “Quantum + AI” may be a little further out due to their requirements for more powerful quantum computers which aren’t quite available yet, the AI for Quantum is here in spades today.<br>\nOne area that I would like to highlight in this article is the use of AI to help develop improved Quantum Error Correction (QEC) codes as well as new decoder algorithms that measure the ancilla qubits and figure out what errors have occurred and how to correct the errors. As we’ve discussed many times, one of the keys for achieving commercial quantum advantage is to utilize quantum error correction to make the calculations more accurate and reliable, and error-free.<br>\nOver the years, QEC codes have evolved from relatively simple codes such as the surface code or color code to very complex qLDPC (Quantum Low Density Parity Check) codes. In addition, research on QEC codes was performed with previous systems only contained a few dozen or perhaps a few hundred qubits. But soon, QEC codes will be required for systems that will contain thousands of qubits. The increase size greatly increases the complexity of the design.<br>\nIn the meantime, the requirements placed upon an engineer designing a QEC code keep getting more stringent and sometimes conflicting. At the same time, the engineers want to minimize the logical error rate, decrease the number of physical qubits per logical qubits, and minimize the cycle time it takes to perform a logical gate, error detection, and error correction process. There will be tradeoffs between these three factors and the engineer needs to figure out the best balance between these requirements.<br>\nThe scope of the problem and the enormous number of possibilities that need to be investigated grows to become more than what an individual can do manually as the quantum processer keep scaling up. This is where the AI assist because so helpful.<br>\nHere are a few examples of where AI is being called in to help.<br>\nIBM has created an open-source, LLM-guided evolutionary AI framework called OpenEvolve, The framework establishes a powerful, two-way interplay between classical AI and quantum computing. It utilizes large language models (LLMs) to generate informed hypotheses for algebraic expressions that could serve as valid code candidates. A recent test found 465 distinct quantum error correction code candidates. Some of the codes provided the lowest ratio of physical qubits per logical qubits to make maximum use of the available hardware, while others provided the best protection against errors by maximizing the number of errors that could still be corrected. Researchers can then review the different codes to see which one is most appropriate for their particular use case.<br>\nQC Design has introduced Meridian, a specialized AI platform designed to automate and optimize fault-tolerant quantum computing (FTQC) hardware architectures. In another test Meridian achieved a 14.6X median reduction in evaluated logical error rates compared to state-of-the-art methods published in scientific literature across an evaluation suite of over 100 fault-tolerance design tasks.<br>\nError correction codes contain both data qubits and ancilla qubits. Since one cannot directly measure a data qubit without destroying the information it contains, the ancilla qubits will contain certain patterns which can indirectly provide information on the states of the data qubits. The ancilla qubits are measured and return a pattern of ones and zeros that can be used to determine if there are any errors in the data qubits. Decoding this pattern is a critical function in fault tolerant quantum computers and is performed by classical electronic components such as FPGAs and GPUs. Ideally, a decoder will always be 100% correct in determining which qubits have errors, but this is never fully achieved, particularly if there are a large number qubit errors that exceed the number of errors the code was designed for. (This design point is called code distance.) Nonetheless, the goal of the error decoder design is to maximize the percentage of instances where it correctly decodes and corrects errors while do so in the shortest period of time.<br>\nGoogle has developed an AI-based decoder called AlphaQubit. This decoder uses a transformer-based neural networks to decode errors in quantum circuits, achieving superior performance compared to existing methods. In tests, AlphaQubit reduced errors by 6% over tensor network decoders and by 30% compared to correlated matching. The system also demonstrated adaptability to larger, simulated quantum devices with up to 241 qubits, maintaining high accuracy across extended error-correction rounds.<br>\nNVIDIA has introduced Ising Decoding which supports two variants of a 3D convolutional neural network model that can be optimized for either speed or accuracy to perform real-time decoding for quantum error correction. Ising Decoding models are up to 2.5x faster and 3x more accurate than pyMatching, the current open-source industry standard.<br>\nThese improvements provide direct benefits to end users. By reducing the number of physical qubits per logical qubits to implement a code, it will allow someone to use smaller and less costly quantum computer to run their program. In addition, those smaller quantum computers will be available earlier than the larger ones.<br>\nBy improving the error correction capability of the logical qubits, something that can be measured by the logical error rate and as well as by another measure called code distance, the accuracy rate of a user’s calculation will be better and minimize cases where the quantum computer returns the wrong answer.<br>\nAnd finally, improvements in the speed of the quantum error decoding and correction process, will directly result in reductions in the wall clock time needed to complete a user’s program. This can be quite significant for the larger problems that we expect that quantum computers will be used for in the future.<br>\nSo, while it may be an overstatement to say that complete quantum error correction design and implementation is being performed by a Bot, AI is certain assisting and accelerating the move to implement fault tolerant computers reducing the time it will take to start achieving commercial quantum advantage.<\/p>","content_hash":"c5cba6e72132f9ffb791d5d86efab7d3","author":"Doug Finke","published_at":"2026-11-19T23:44:15","fetched_at":"2026-11-20 14:48:22","word_count":1062,"read_time_minutes":6,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"15h","domain":"quantumcomputingreport.com"},{"id":"ee4c13cb8b69e882","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18473","title":"Love, Logical Gates, and Unrealistic Expectations","url":"https://quantumfrontiers.com/2026/11/18/love-logical-gates-and-unrealistic-expectations/","summary":"I have a confession. I watch YouTube recaps of movies and TV shows (at double speed) and then discuss them as if I had actually watched them. My wife hates it. We were at a party, and she overheard me discussing Game of Thrones. “He’s a phony! He hasn’t watched a single episode!” “I’m not sure what she’s talking about. Anyways, can you believe Arya killed the Night King?” I recently “watched” Materialists. It’s about Lucy Mason, a matchmaker whose clients shop for partners by spec sheet: height,","content":"<p>I have a confession. I watch YouTube recaps of movies and TV shows (at double speed) and then discuss them as if I had actually watched them. My wife hates it.<br>\nWe were at a party, and she overheard me discussing Game of Thrones.<br>\n“He’s a phony! He hasn’t watched a single episode!”<br>\n“I’m not sure what she’s talking about. Anyways, can you believe Arya killed the Night King?”<br>\nI recently “watched” Materialists. It’s about Lucy Mason, a matchmaker whose clients shop for partners by spec sheet: height, age, income, even star sign. One wants a 6′4″ man in his forties who earns over $500,000 and has a good hairline. She calls such guys “unicorns.”<br>\nThis is a lot like my job.<br>\nI’m looking for quantum error-correcting code unicorns. The main difference is my boxes are different: large code distance, high encoding rate, low-weight checks, low qubit degree, and cheap logical gates.<br>\nOf these, that last box has been on my mind a lot lately, and it’s the focus of our recent paper. What expectations should I have when searching for a code in this respect? Am I’m being as unrealistic as Lucy’s clients?<br>\nWhat are we looking for?<br>\nWe know of codes that make for excellent quantum memories. They pack many logical qubits into relatively few physical ones, protect them with a large code distance, and allow for errors to be checked in an efficient way: each check involves only a few physical qubits, and each physical qubit participates in only a few checks. Several boxes checked already. Not quite a unicorn, but close.<br>\nThe problem is that computation is another story. Intuitively, the more logical qubits we pack into a shared physical system, the harder it can become to operate on one without disturbing the others. This can make it difficult to implement addressable logical gates.<br>\nThere are several ways to implement such gates, and I won’t survey them here. But, among the cheapest are those implemented using only physical single-qubit gates and qubit permutations. The latter means rearranging the physical qubits, or sometimes just relabelling them in software. Note that, whether or not permutations are cheap is hardware dependent, but for neutral atom platforms they can be. Because the information is encoded collectively, these simple physical operations can produce various gates, including entangling logical gates.<br>\nThese gates have a lot going for them. The single-qubit operations fit into one parallel layer. They require no extra qubits or measurements. And when permutations are performed by physical rearrangement or software relabelling, they don’t spread errors between physical qubits. Single-qubit gates are also typically among the lowest error operations available on hardware.<br>\nIf you add one restriction—that the physical single-qubit gates must be Cliffords—these cheap gates become automorphism gates. The restriction is useful because we have tools for finding codes that support them. We can construct such codes analytically or search for them numerically. We’re much less good at doing the same for arbitrary single-qubit rotations. That combination of cheap implementation and tractable code design has made automorphism gates increasingly popular. They play a key role in most modern quantum computing architectures, for example, Mitten codes, IBM’s tour de Gross, and the Pinnacle architecture.<br>\nThese architectures use them both directly to perform logical gates and alongside the more resource-intensive method of code surgery to reduce its overhead. Surgery involves joint measurements between encoded systems, often with additional resource states and repeated measurement rounds. The aim is to let automorphism gates handle as much of the computation as possible, reducing how much surgery is needed.<br>\nNaturally, when searching for a code, we’d like a large automorphism group: a large collection of distinct logical operations available through these cheap physical ingredients.<br>\nHigh rate, large distance, simple checks, and now a large automorphism group. Add it to the list.<br>\nFour things I learned<br>\nIn our work we set out to understand how much automorphism gates can offer, and what a code has to give up to support them. Below are some things I learned (for a complete story you’ll need to read the paper).<br>\n(1) How much can you ask of one code?<br>\nSuppose I temporarily relax the other items on my checklist. I’ll allow as many physical qubits as needed and put aside concerns about encoding rate and check weight. Fix only the number of logical qubits, k. How large an automorphism group could a code possibly have?<br>\nFor stabilizer codes encoding k > 2 logical qubits, we determine the largest attainable automorphism group. In a suitable logical basis, it consists of all operations built from addressable logical phase gates (S) and controlled-NOT gates (CNOT). We also construct codes that attain this maximum. So this is a ceiling we can actually reach. (The cases k = 1 and k = 2 are special; we discuss them in the paper.)<br>\nCSS codes are an important family of quantum error-correcting codes. They allow bit-flip and phase-flip errors to be checked separately, and include most widely studied codes. CSS codes can also attain this maximum.<br>\nThe S gate changes the relative phase between a qubit’s two basis states by a quarter turn. CNOT flips a target qubit conditional on the state of the control qubit, and can generate entanglement. Addressability means we can apply S to any chosen logical qubit and CNOT to any chosen control–target pair. All combinations of these gate
