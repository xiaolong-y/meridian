  <title>Meridian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FFFCF0;
      --card: #F2F0E5;
      --text: #2D2B28;
      --dim: #6F6E69;
      --muted: #DAD8CE;
      --up: #66800B;
      --down: #AF3029;
      --accent: #205EA6;
      --spark: #8B5CF6;
      --score: #AD8301;
      --link: #24837B;
      --particle: #24837B;
    }

    html { font-size: 10px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding: 4px;
      min-height: 100vh;
      font-weight: 400;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 4px 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--muted);
    }

    .title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .timestamp { color: var(--dim); font-size: 9px; }

    .dashboard {
      position: relative;
    }

    .card-wrapper {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 2px;
      overflow: hidden;
      /* top, left, width set by JS layout engine */
    }

    .card-wrapper canvas {
      display: block;
      width: 100%;
    }

    .card-wrapper .links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card-wrapper .links a {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      color: transparent;
      text-decoration: none;
      display: block;
    }

    footer {
      margin-top: 8px;
      padding: 6px 4px;
      border-top: 1px solid var(--muted);
      text-align: center;
      color: var(--dim);
      font-size: 7px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .footer-links {
      margin-bottom: 6px;
    }

    .footer-links a {
      margin: 0 4px;
    }

    .ascii-footer {
      margin: 8px auto 4px;
      font-size: 8px;
      line-height: 1.1;
      color: var(--dim);
      opacity: 0.5;
      user-select: none;
      overflow: hidden;
      max-width: 400px;
    }

    .ascii-footer .particle {
      display: inline-block;
      color: var(--particle);
      opacity: 0.4;
    }

    .ascii-footer .meridian-text {
      color: var(--dim);
      letter-spacing: 1px;
    }

    @keyframes particleDrift {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.6; transform: translateY(-1px); }
    }

    .ascii-footer .p1 { animation: particleDrift 3s ease-in-out infinite; }
    .ascii-footer .p2 { animation: particleDrift 3s ease-in-out infinite 0.3s; }
    .ascii-footer .p3 { animation: particleDrift 3s ease-in-out infinite 0.6s; }
    .ascii-footer .p4 { animation: particleDrift 3s ease-in-out infinite 0.9s; }
    .ascii-footer .p5 { animation: particleDrift 3s ease-in-out infinite 1.2s; }
    .ascii-footer .p6 { animation: particleDrift 3s ease-in-out infinite 1.5s; }

    @media (prefers-reduced-motion: reduce) {
      .ascii-footer .particle {
        animation: none;
        opacity: 0.3;
      }
    }

    noscript p {
      text-align: center;
      padding: 20px;
      color: var(--dim);
      font-size: 9px;
    }
  </style>
</head>

ource":"hn_algolia","domain":"foxandlion.pub","time_ago":"2w","heat_symbol":"•","time_symbol":"📆"},{"id":50085296,"title":"I let an AI run my startup for a week","url":"https://daily.tinyprojects.dev/221","score":67,"comments":73,"author":"tinyprojects","posted_at":"2026-10-14T10:25:48+00:00","source":"hn_algolia","domain":"daily.tinyprojects.dev","time_ago":"3w","heat_symbol":"•","time_symbol":"📆"},{"id":50331001,"title":"In LLM era, can software startup survive?","url":null,"score":37,"comments":47,"author":"sjia","posted_at":"2026-11-01T23:28:46+00:00","source":"hn_algolia","domain":"","time_ago":"3d","heat_symbol":"•","time_symbol":"📅"}]},{"id":"rss_quantum","name":"RSS: Quantum","stories":[{"id":"9759b0106f7703ca","title":"Thoughts on a historic week","url":"read/9759b0106f7703ca.html","score":0,"comments":0,"domain":"Shtetl-Optimized","time_ago":"5h"},{"id":"6e5ba98d1d3eb8af","title":"University of Cologne Uncovers Spectroscopic Evidence of Topological Superconductivity in TI Josephson Junctions","url":"read/6e5ba98d1d3eb8af.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"21h"},{"id":"fe182902ed10c482","title":"IBM Quantum and QuICS Deploy AI Agents to Discover Over 500 High-Efficiency Magic-State Factories","url":"read/fe182902ed10c482.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"1d"},{"id":"37171130d823a650","title":"Qoro Quantum Opens Cloud GPU Simulation Tier to Accelerate Large-Scale Circuit Emulation","url":"read/37171130d823a650.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"1d"},{"id":"ab34c49c982e85e4","title":"IonQ Completes $1.15B Acquisition of Elisity to Integrate Zero Trust with Quantum Security","url":"read/ab34c49c982e85e4.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"1d"},{"id":"2bd431f65c762350","title":"IonQ Partners with QuantumCT to Provide Trapped-Ion Cloud Access Across Connecticut","url":"read/2bd431f65c762350.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"1d"},{"id":"28b644b89f8e9fb0","title":"D-Wave Enhances Stride Hybrid Solver and Releases Applied Optimization Learning Path","url":"read/28b644b89f8e9fb0.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"1d"},{"id":"9af8a5686d75cf86","title":"Universal Quantum Details Iterative Redecode Scheme for Fast Transversal Fault-Tolerant Logic","url":"read/9af8a5686d75cf86.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"2d"}]}],"card_order":[{"type":"metric","index":0},{"type":"metric","index":1},{"type":"feed","id":"hn_tech"},{"type":"metric","index":2},{"type":"metric","index":3},{"type":"metric","index":4},{"type":"feed","id":"hn_ai"},{"type":"metric","index":5},{"type":"metric","index":6},{"type":"metric","index":7},{"type":"feed","id":"hn_startups"},{"type":"metric","index":8},{"type":"feed","id":"rss_quantum"}],"rss_entries":[{"id":"9759b0106f7703ca","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10283","title":"Thoughts on a historic week","url":"https://scottaaronson.blog/?p=10283","summary":"As everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole&#8212;because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI&#8217;s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin&#8217;s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it. But","content":"<p>Thoughts on a historic week<br>\nAs everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole—because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI’s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin’s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it.<br>\nBut also, yes, there was an election.<br>\nI remember that, when Dana and I moved to Texas in the summer of 2016, we were excited to be a small part of what seemed at the time like Texas’s impending transformation into a cosmopolitan blue state.<br>\nAnd now the prophecy is finally being fulfilled. But so many strange and harrowing things have happened in the interim, that I feel like Murph when her father finally returns to her at the end of the movie Interstellar.<br>\nSo it turns out that, indeed, the Democrats could’ve easily recaptured both houses of Congress without any need to sell their souls to the likes of Hasan Piker or Abdul El-Sayed. And now the keffiyeh-clad revolutionaries will claim a mandate directly from the people, to put to the sword all the evil landlords and techbros and kulaks and bourgeoisie and (obviously) Zionists, and thereby finally usher in the utopia that failed the first 10,000 times it was tried. I see them as more likely to inspire a Republican comeback in 2028 (as unlikely as it seems this week) than to achieve their stated goals.<br>\nFor please remember that the socialist firebrands massively underperformed more moderate Democrats on Tuesday—it looks like the socialists were merely lifted up by the same tide of justified anti-MAGA rage. Yes, in the US and across the Western world, some university humanities departments continue to churn out young people who’d see my family’s slaughter as an inspiring (or at least deeply understandable) act of revolutionary justice, and who vote on that basis. By and large, though, the American voters simply belatedly realized that Trump is a charlatan who was never going to deliver anything he promised, and also they wanted cheaper gas.<br>\nThe Allied victory over Nazi Germany was glorious, it called for parades and dancing in the street, and it was 3,000% earned by Nazi behavior if anything in human history ever was. It left only one tiny problem for the future—namely that, within the winning coalition, the fans of liberal democracy, science, and Enlightenment still needed to confront the Stalinists, whose evil rivaled even the Nazis’, yet who believed their fanatical ideology to be the one vindicated by events. Why was I so often thinking about that these past couple days?<br>\nThere was, of course, also a big election in Israel. Given the results, I pray that Gadi Eisenkot finds some way to form a coalition, or at least soft coalition, with Israel’s Arab parties, since that’s clearly what it will now take finally to topple Netanyahu, a man whose corruption (like Trump’s or Ken Paxton’s) knows no bounds. I’m under no illusions that this step would do anything to appease the hundreds of millions of protesters around the world whose true demand (as they’ll explain if you ask them) never had anything to do with Israeli policies or Gaza or the West Bank or Bibi Netanyahu, but was always simply that Israel cease to exist—that Israel’s Jews either “go back to Poland” or the other countries where their grandparents were murdered or expelled, or, preferably just die, as on October 7.<br>\nNevertheless, I pray for a coalition of moderate Israeli Jews and Arabs, firstly because it’s morally right, secondly because it’s politically expedient, and thirdly because it will impress on at least some fair-minded observers the enormity of the moral chasm here—that, whereas the Arab countries expelled or murdered virtually all of their Jews, the State of Israel not only tolerates its Arab minority but gives it the right to vote and to wield power.<br>\nWhatever else one can say, Israel’s Arabs have been sufficiently loyal to their nation that, on October 7, Hamas murdered them right along with the Jews, treating them as Zionist collaborators and traitors to Islam. I’d like to see that loyalty rewarded with a role in Israel’s governing coalition.<br>\nAs is becoming standard practice with my political posts, I’m closing the comments—because life is short, and these days, the overwhelming majority of comments that I get on posts like this one, whichever ideological axe they’re grinding, are not ones that engender in me even minimal respect for their authors. I apologize to those who would’ve actually pursued a thoughtful dialogue with me or others had I left the comments open—to all five of you, or however many righteous men of Sodom there might be.<\/p>","content_hash":"5eccb21b41c4e341023a500092effa66","author":"Scott","published_at":"2026-11-05T17:48:44","fetched_at":"2026-11-05 23:11:41","word_count":827,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5h","domain":"scottaaronson.blog"},{"id":"6e5ba98d1d3eb8af","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48419","title":"University of Cologne Uncovers Spectroscopic Evidence of Topological Superconductivity in TI Josephson Junctions","url":"https://quantumcomputingreport.com/university-of-cologne-uncovers-spectroscopic-evidence-of-topological-superconductivity-in-ti-josephson-junctions/","summary":"Physicists at the University of Cologne have found direct spectroscopic evidence for topological superconductivity in topological insulator Josephson junctions. This research supports the Fu-Kane theoretical model and offers a way to achieve topological superconductivity and Majorana zero modes without relying on destructive magnetic fields. The study used tunneling spectroscopy to observe phase-controlled energy gap closing and reopening, a key signature of topological superconductivity. The po","content":"<p>Physicists at the University of Cologne’s Topological Matter Laboratory, in collaboration with theoretical researchers at RWTH Aachen University, have conducted tunneling spectroscopy on topological insulator Josephson junctions, revealing signatures of phase-controlled energy gap closing and reopening. Published in Science Advances under the title Tunneling spectroscopy of topological insulator Josephson junctions, the study delivers direct local spectroscopic support for the foundational 2008 Fu-Kane theoretical model, offering a physical pathway toward topological superconductivity and Majorana zero modes without relying on destructive Zeeman magnetic fields.<br>\n| Topological Insulator Josephson Junction Spectroscopy Metrics |  |  | <br>\n|---|---|---|<br>\n| Parameter Dimension | Experimental Specification | Architectural Significance | <br>\n| Material Platform | Exfoliated BiSbTeSe2 flakes with Al contacts | Bulk-insulating 3D topological insulator ensuring electrical transport is confined to topological surface states (TSS). | <br>\n| Junction Geometry | 50 nm length within an RF-SQUID loop | Operates in the short-junction limit below the surface coherence length to host discrete 1D Andreev modes. | <br>\n| Spectroscopic Probes | Dual Au/Al2O3 tunnel electrodes (TJ1, TJ2) | Measures local density of states (LDOS) at 50 mK base temperature across independent spatial positions. | <br>\n| Phase Dispersion | Coherence peaks at ±130 μeV merge at φ = π | Consistent with spin-momentum locking forbidding normal backscattering, forcing gap closing and ground-state parity reversal. | <br>\n| Vortex Localization | Magnetic fields between 5 mT and 6 mT | Spatially resolves individual Josephson vortex cores entering the junction, matching theoretical mode confinement. | <br>\n| Gate Stability | Back-gate sweeps from −20 V to +20 V (Δμ ≥ 40 meV) | Demonstrates that high-transmission states persist across chemical potentials, ruling out fine-tuned quantum dot artifacts. | <br>\nTopological quantum computation aims to encode information non-locally within Majorana zero modes to achieve hardware-level protection against local charge noise and magnetic fluctuations. Most experimental efforts have historically targeted 1D semiconductor Rashba nanowires, an approach that requires intense in-plane magnetic fields that can suppress superconductivity and generate false-positive zero-bias conductance peaks from trivial defect states. The Cologne experiment bypasses this limitation by leveraging the natural spin-momentum locking of the topological surface state in BiSbTeSe2, where normal backscattering is strictly suppressed for perpendicular trajectories, enforcing highly transmissive Andreev reflection (τ ≈ 1).<br>\nBy embedding the 50 nm planar junction into an RF-SQUID loop, the team systematically adjusted the superconducting phase difference (φ) using weak out-of-plane flux. Differential conductance measurements at 50 mK showed an induced superconducting gap of 130 μeV at zero phase that closed into a zero-bias feature as φ approached π. In higher fields where multiple Josephson vortices nucleated, dual tunnel contacts recorded distinct phase periodicities (230 μT versus 200 μT) tracking the physical passage of vortex cores across the probes, confirming that zero-energy modes localize at spatial phase gradients.<br>\nThe authors note critical engineering milestones that remain before topological qubits can be realized. Because the measurement setup has an energy resolution of approximately 30 μeV, the apparent gap closing establishes a transmission lower bound of τ ≥ 0.95 rather than definitive proof of a gapless transition. Furthermore, the presence of long quasi-classical electron trajectories produces an incompletely proximitized “soft gap.” To overcome these challenges on the roadmap to braiding, the researchers propose transitioning to high-critical-field niobium (Nb) electrodes and implementing charge-sensing electrometry to verify the 4π-periodic fermion parity flip.<br>\nThe research was conducted within the Matter and Light for Quantum Computing (ML4Q) Cluster of Excellence, with full experimental datasets available via the Science Advances Research Paper here and institutional commentary detailed in the University of Cologne News Release here.<\/p>","content_hash":"fb9c2eba912423d5600521af71116052","author":"Mohamed Abdel-Kareem","published_at":"2026-11-05T01:16:02","fetched_at":"2026-11-05 23:11:43","word_count":593,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"21h","domain":"quantumcomputingreport.com"},{"id":"fe182902ed10c482","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48413","title":"IBM Quantum and QuICS Deploy AI Agents to Discover Over 500 High-Efficiency Magic-State Factories","url":"https://quantumcomputingreport.com/ibm-quantum-and-quics-deploy-ai-agents-to-discover-over-500-high-efficiency-magic-state-factories/","summary":"IBM Quantum and QuICS researchers have discovered over 500 new \"magic-state factories\" using AI agents and deterministic solvers. These factories produce non-Clifford states with significantly lower resource requirements, which is crucial for advancing fault-tolerant quantum computing. The findings, including detailed circuit models, are openly accessible for community use. The post IBM Quantum and QuICS Deploy AI Agents to Discover Over 500 High-Efficiency Magic-State Factories appeared first o","content":"<p>Researchers from IBM Quantum, the Joint Center for Quantum Information and Computer Science (QuICS / NIST / UMD), and MIT have developed a neuro-symbolic search framework that pairs large language model (LLM) agents with deterministic solvers to map uncharted magic-state distillation protocols. Detailed in a preprint titled Symmetry and AI-assisted discovery of magic-state factories, the team uncovered 699 factory classes—including 564 previously unknown protocols—delivering non-Clifford states with record-low physical resource footprints.<br>\n| Key Magic-State Factory Milestones Discovered |  |  | <br>\n|---|---|---|<br>\n| Factory Class [[n, k, d]] | Output Gate & Metrics | Technical & Efficiency Significance | <br>\n| [[63, 11, 3]] | 11 pure T states (γ = 1.589) | Lowest known overhead exponent among pure-T distillation protocols consuming ≤ 100 inputs (5.73 inputs/output). | <br>\n| [[850, 128, 6]] | 128 pure T states (γ = 1.057) | Lowest reported overhead exponent for any known distillation protocol with ≤ 1,000 inputs. | <br>\n| [[1715, 287, 6]] | 287 pure T states (γ = 0.998) | Smallest known pure-T distillation factory to break the γ < 1 sub-linear overhead barrier. | <br>\n| Entangled Target States | Combinations of T, CS, and CCZ | Enables direct synthillation of multi-qubit non-Clifford gates, bypassing multi-stage decomposition. | <br>\nUniversal fault-tolerant quantum computers running planar CSS or surface codes cannot execute non-Clifford operations natively through transversal gates alone. Standard architectures rely on distillation factories to purify noisy ancilla states via gate teleportation, a routine historically projected to consume up to 90% of a machine’s physical qubits and runtime. While exhaustive classification historically stalled at small input sizes (n ≤ 54), the researchers made larger searches tractable by proving that achieving code distance d ≥ 3 is mathematically equivalent to selecting nonzero, pairwise distinct syndromes within a binary-matrix representation.<br>\nTo navigate the expanded search space, the team deployed an automated multi-agent loop: language-model agents propose targeted subgroup symmetry orbits, an integer-programming solver constructs candidate circuit matrices, and an independent verification engine validates gate identities and code distances. A reviewing agent evaluates solver logs to redirect subsequent rounds toward productive geometries. In addition to pure-T states, the framework yielded factories outputting entangled states such as CCZ⊗2 and T ⊗ CCZ⊗4, directly lowering the gate depth needed during algorithm synthesis.<br>\nTo support community resource estimation, the authors released the verified circuits in an open-access repository indexed with Clifford correction rules and matrix export formats.<br>\nThe research paper is accessible on arXiv here, with executive commentary shared in Jay Gambetta’s LinkedIn Post here, circuit models hosted on the GitHub Repository here, and the interactive Magic State Factory Catalog here; related QCR reporting on non-Clifford state generation includes Google Quantum AI’s Willow hardware cultivation demonstration here and NVIDIA and Jülich’s exascale cultivation simulation on JUPITER here.<\/p>","content_hash":"4d816f45ed436457c1da7eab8f7f80ef","author":"Mohamed Abdel-Kareem","published_at":"2026-11-04T16:20:05","fetched_at":"2026-11-05 23:11:43","word_count":462,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"37171130d823a650","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48409","title":"Qoro Quantum Opens Cloud GPU Simulation Tier to Accelerate Large-Scale Circuit Emulation","url":"https://quantumcomputingreport.com/qoro-quantum-opens-cloud-gpu-simulation-tier-to-accelerate-large-scale-circuit-emulation/","summary":"Qoro Quantum has launched a new cloud-based GPU simulation tier for its Divi Python framework, allowing researchers to run tensor-network and noisy quantum circuit simulations without manual cluster administration. This platform provides managed access to NVIDIA A10G and T4 GPU clusters, significantly accelerating complex simulations compared to CPU-based instances, especially for highly entangled circuits. The service aims to overcome classical memory limitations and simplify the use of cluster","content":"<p>Quantum software and middleware developer Qoro Quantum has launched its cloud-based GPU simulation tier for general availability, providing managed high-performance compute infrastructure designed to run tensor-network and noisy quantum circuit simulations without manual cluster administration. Integrated directly into Qoro’s Python framework, Divi (qoro-divi), the managed environment allows researchers to dispatch circuit workloads from local scripts to remote NVIDIA A10G and T4 GPU clusters.<br>\n| Qoro Quantum Cloud Simulation Benchmarks |  |  | <br>\n|---|---|---|<br>\n| Simulation Workload | Compute Configuration | Demonstrated Runtime & Scaling Performance | <br>\n| 64-Qubit Ising Quench (100 time points, ~60,000 gates/circuit) | Matrix Product State (MPS), bond dimension χ = 256 | GPU completed late-time entangled circuits ~5× faster than 16-vCPU instances (~3 min vs. 11–15 min per circuit). | <br>\n| High-Fidelity MPS Scaling (χ = 512, halving late-time energy drift) | NVIDIA A10G / T4 GPU cluster | All 100 circuits finished on GPU in < 9 min each (4.0 GPU-hours total); CPU instances timed out at 20-min limit. | <br>\n| Parallel Noise Sweep (2,560 circuits across 8 two-qubit error rates) | Parallelized 16-vCPU nodes | Finished full batch in 43 minutes on cloud CPUs, achieving ~22× wall-clock compression vs. 15.6 hours of sequential compute. | <br>\nAlgorithm development often encounters a classical memory wall as qubit numbers and entanglement scale beyond statevector limits (where 64 qubits require approximately 295 exabytes of RAM at double precision). Transitioning to cluster-based tensor-network methods typically forces algorithm developers to configure Slurm schedulers, containers, and CUDA drivers manually. Qoro’s platform automates this infrastructure routing through Divi, abstracting hardware provisioning behind a single backend declaration while managing resource allocation dynamically based on the workload’s entanglement profile.<br>\nIn technical validation benchmarks, the team simulated a 64-qubit non-integrable transverse and longitudinal Ising chain where non-local Jordan-Wigner terms rule out free-fermion classical shortcuts. While parallel CPU nodes handled low-entanglement circuits efficiently, GPU acceleration was required to sustain higher matrix product state (MPS) bond dimensions (χ = 512) to curb late-time energy drift. Free developer accounts receive 1,000 compute credits upon onboarding to evaluate hybrid workflows.<br>\nBenchmark data and code examples are detailed in Qoro’s Technical Blog here, with developer documentation available on the Divi Documentation Portal here.<\/p>","content_hash":"1ced86d395d79e7b08cc0ef21fc90672","author":"Mohamed Abdel-Kareem","published_at":"2026-11-04T16:02:38","fetched_at":"2026-11-05 23:11:43","word_count":368,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"ab34c49c982e85e4","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48405","title":"IonQ Completes $1.15B Acquisition of Elisity to Integrate Zero Trust with Quantum Security","url":"https://quantumcomputingreport.com/ionq-completes-1-15b-acquisition-of-elisity-to-integrate-zero-trust-with-quantum-security/","summary":"IonQ has acquired Elisity for $1.15 billion, integrating Elisity's zero-trust cybersecurity with IonQ's quantum security technologies. This acquisition allows IonQ to enter the enterprise IT security market, combining real-time breach containment with quantum-resistant encryption. The deal broadens IonQ's revenue base and addresses immediate and long-term enterprise security needs. The post IonQ Completes $1.15B Acquisition of Elisity to Integrate Zero Trust with Quantum Security appeared first ","content":"<p>Trapped-ion quantum computing firm IonQ (NYSE: IONQ) has completed its acquisition of enterprise cybersecurity provider Elisity, Inc. in an all-stock transaction valued at $1.15 billion at closing. The transaction includes an earnout structure of up to $150 million contingent on revenue milestones through January 2028, uniting Elisity’s identity-based network microsegmentation with IonQ’s post-quantum cryptography (PQC) and quantum key distribution (QKD) product roadmap.<br>\n| IonQ / Elisity Acquisition Transaction Summary |  |  | <br>\n|---|---|---|<br>\n| Deal Dimension | Transaction Term | Operational Mandate | <br>\n| Purchase Consideration | $1.15B at closing (All-stock) | Up to $150M in performance-based earnouts; $100M RSU retention pool for continuing personnel. | <br>\n| Core Software Platform | Elisity IdentityGraph | Maps connected devices, users, and AI agents to enforce access policies independently of network hardware. | <br>\n| Integrated Architecture | Zero Trust + PQC + QKD | Pairs real-time breach containment with quantum-resistant key generation and data encryption. | <br>\n| Commercial Base | 100+ active enterprise deployments | Extends market reach across Fortune 500 corporations, healthcare networks, and defense agencies. | <br>\n| Corporate Structure | Wholly owned operating subsidiary | Elisity CEO James Winebrenner continues to lead the unit without disruption to existing customer SLAs. | <br>\nWhile quantum vendors traditionally focus on long-horizon algorithm research or cloud compute access, this transaction gives IonQ an immediate entry into corporate IT security budgets. Elisity’s software layer discovers managed and unmanaged assets across corporate environments, blocking lateral threat movement at machine speed. By pairing this identity policy engine with quantum-safe encryption, the combined offering addresses near-term enterprise security while providing a migration path against long-term “Harvest Now, Decrypt Later” risks.<br>\nThe closing marks IonQ’s second major corporate transaction in recent quarters, following its acquisition of semiconductor foundry SkyWater Technology to onshore domestic microfabrication. By absorbing an enterprise software vendor with an established CISO customer footprint, IonQ broadens its revenue base beyond scientific computing ahead of federal post-quantum compliance mandates.<br>\nTransaction details and executive commentary are available in the Official IonQ Announcement here; readers can also review QCR’s initial reporting on the transaction terms in IonQ to Acquire Elisity for Up to $1.3 Billion to Integrate Zero Trust with Post-Quantum Cybersecurity here.<\/p>","content_hash":"261694aa909eb0342577640d51b654e4","author":"Mohamed Abdel-Kareem","published_at":"2026-11-04T15:52:47","fetched_at":"2026-11-05 23:11:43","word_count":369,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"2bd431f65c762350","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48401","title":"IonQ Partners with QuantumCT to Provide Trapped-Ion Cloud Access Across Connecticut","url":"https://quantumcomputingreport.com/ionq-partners-with-quantumct-to-provide-trapped-ion-cloud-access-across-connecticut/","summary":"IonQ has partnered with QuantumCT to provide over 150 hours of cloud access to IonQ's trapped-ion quantum systems for organizations across Connecticut. This collaboration, involving institutions like the University of Connecticut and Yale, aims to advance quantum algorithm development, workforce training, and research in fields such as optimization and materials science. It expands regional access to diverse quantum computing architectures, complementing Yale's existing work in superconducting c","content":"<p>Trapped-ion quantum hardware manufacturer IonQ (NYSE: IONQ) has entered into a commercial partnership with QuantumCT, the public-private initiative driving Connecticut’s statewide quantum technology strategy. Under the agreement, QuantumCT will purchase access to IonQ’s commercial quantum systems on behalf of regional organizations to advance practical algorithm development and workforce training.<br>\nIonQ / QuantumCT Partnership Specifications<br>\nPartnership Dimension<br>\nKey Agreement Details<br>\nRegional & Ecosystem Impact<br>\nContract Scope<br>\n> 150 hours of cloud runtime<br>\nSecures dedicated, managed compute allocation across IonQ’s commercial QPUs.<br>\nLinks academic laboratories, regional startups, and industrial partners into a shared network.<br>\nResearch Domains<br>\nAlgorithms, optimization, materials science, and education<br>\nSupports transition from exploratory theory to hardware execution and hands-on developer training.<br>\nInfrastructure Strategy<br>\nMulti-modality computing framework<br>\nIntegrates trapped-ion capacity as a primary pillar alongside other planned quantum architectures.<br>\nWhile Yale has historically anchored regional quantum research in superconducting circuit QED, the partnership with IonQ broadens local access to trapped-ion processors, which feature all-to-all qubit connectivity and long coherence times well-suited for complex combinatorial optimization and molecular modeling. The cloud runtime allows regional developers to benchmark applications directly against physical quantum hardware without the overhead of maintaining on-site cryogenic and vacuum facilities.<br>\nAccording to QuantumCT leadership, the agreement marks the initial phase of building a modality-diverse computing environment, enabling researchers to systematically compare algorithm execution across trapped-ion, superconducting, and photonic platforms.<br>\nDetails on regional access are provided in the Official IonQ Release here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"406f00720026c3e990e2d2a425abcf71","author":"Mohamed Abdel-Kareem","published_at":"2026-11-04T15:49:28","fetched_at":"2026-11-05 23:11:43","word_count":316,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"28b644b89f8e9fb0","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48396","title":"D-Wave Enhances Stride Hybrid Solver and Releases Applied Optimization Learning Path","url":"https://quantumcomputingreport.com/d-wave-enhances-stride-hybrid-solver-and-releases-applied-optimization-learning-path/","summary":"D-Wave has upgraded its Stride hybrid solver, significantly reducing solution times and improving quality for complex optimization problems like Traveling Salesperson and Assembly Line Balancing. They've also launched a new developer curriculum, \"Applied Quantum Optimization,\" to help users leverage their Leap quantum cloud platform. This comes as D-Wave's technology, specifically an annealing-based quantum support vector machine, demonstrated high accuracy in a lung cancer detection study, outp","content":"<p>Commercial quantum annealing and computing provider D-Wave Quantum Inc. (NYSE: QBTS) has announced algorithmic upgrades to its Stride hybrid solver alongside the rollout of a three-course developer curriculum titled Applied Quantum Optimization. Available via the Leap quantum cloud platform, the enhanced solver couples classical compute resources with D-Wave’s quantum annealing hardware to accelerate solution times and improve solution quality across combinatorial optimization problems.<br>\n| D-Wave Stride Hybrid Solver: Key Benchmark Comparisons |  |  | <br>\n|---|---|---|<br>\n| Optimization Problem Class | Benchmark Workload Scale | Demonstrated Runtime & Quality Gains | <br>\n| Traveling Salesperson (TSP) | Up to 10,000 target locations | Averaged within 0.02% of optimal result in 15 seconds; > 200× closer to optimal vs. prior Stride version at matched runtime. | <br>\n| Large-Scale TSP | Over 10,000 target locations | Averaged within 3.8% of optimal baseline in 120 seconds; > 500× closer to optimal vs. prior solver generation. | <br>\n| Assembly Line Balancing | Simple line balancing workflows | Achieved higher-quality solutions in 15 seconds than the previous Stride solver reached in 120 seconds. | <br>\n| Developer Curriculum | 3-course Applied Optimization track | Provides hands-on instruction for use-case formulation, mathematical modeling, and direct deployment via Leap. | <br>\nCombinatorial optimization represents one of the primary commercial applications for quantum annealing, spanning routing logistics, manufacturing scheduling, and supply chain allocation. Rather than treating optimization purely through unassisted QPU embedding, the Stride hybrid engine partitions problem sub-graphs across classical computing clusters and quantum annealers. The algorithmic revision targets the core solver architecture to shorten time-to-solution across large variable landscapes, demonstrating an eightfold speedup on assembly line benchmarks. To lower developer barriers, the accompanying learning path provides instruction on formulating Quadratic Unconstrained Binary Optimization (QUBO) problems and integrating hybrid solvers into production software stacks.<br>\nThe release coincides with academic evaluations of D-Wave’s technology in data-constrained healthcare machine learning. A study led by researchers at Florida Atlantic University (FAU) and published in Discover Quantum Science, titled Inferring lung cancer under limited learning data through gate-based and annealing-based quantum techniques, evaluated quantum classifiers under intentionally restricted training conditions. Utilizing QUBO-based feature selection to filter 16 clinical attributes down to 10 key symptoms, the researchers trained quantum models on only 108 patient samples while evaluating predictive accuracy on the remaining 432 out-of-sample records.<br>\nExecuted across five quantum software frameworks and both gate-based and annealing modalities, an annealing-based quantum support vector machine (QSVM) achieved the highest performance in the benchmark. Running on physical D-Wave hardware (Advantage_system6 on the Zephyr topology), the QSVM achieved 91.90% classification accuracy on hardware and 94.31% in simulation, outperforming gate-based implementations across Qiskit, Cirq, and PennyLane. Benchmarked against gate-based execution on an IBM quantum processor on a reduced 50-sample set, the annealing architecture completed hardware execution orders of magnitude faster due to lower circuit-shot overheads.<br>\nThe updated solver and training modules are available immediately on the D-Wave Leap Cloud Platform here, with commercial benchmarking details accessible in the Official Corporate Announcement here and the clinical study detailed in FAU’s Research Release here.<\/p>","content_hash":"568e056edfb7e1b3f5aa44c7c3e87f27","author":"Mohamed Abdel-Kareem","published_at":"2026-11-04T15:40:21","fetched_at":"2026-11-05 23:11:44","word_count":507,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"9af8a5686d75cf86","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48391","title":"Universal Quantum Details Iterative Redecode Scheme for Fast Transversal Fault-Tolerant Logic","url":"https://quantumcomputingreport.com/universal-quantum-details-iterative-redecode-scheme-for-fast-transversal-fault-tolerant-logic/","summary":"Universal Quantum's new Iterative Redecode Scheme (IRS) addresses the error-correlation bottleneck in fast transversal quantum logic. This decoding architecture, detailed in a paper by Mark Webber and colleagues, uses a propagation-assisted local (PAL) framework to coordinate corrections across logical blocks, resulting in significantly lower logical error rates compared to other decoders. The IRS achieves this by alternating local Minimum-Weight Perfect Matching (MWPM) with deterministic Pauli-","content":"<p>Trapped-ion hardware developer Universal Quantum has published a comprehensive technical study detailing its Iterative Redecode Scheme (IRS), a decoding architecture designed to resolve the error-correlation bottleneck in fast transversal quantum logic. Authored by Mark Webber and colleagues (arXiv:2610.26784), the research demonstrates that leveraging long-range trapped-ion connectivity for transversal CNOT (tCNOT) gates does not require decoding a global cross-block hypergraph. Instead, the propagation-assisted local (PAL) framework coordinates corrections across logical blocks using lightweight, memory-style decoders.<br>\n| Universal Quantum Iterative Redecode Scheme (IRS) Benchmarks |  |  | <br>\n|---|---|---|<br>\n| Benchmark Circuit | Comparison Decoder | Relative Performance Advantage (IRS) | <br>\n| Deep Random Clifford (d = 11) | Ghost Protocol / LOM Decoders | Achieves ~4× lower logical error rates than the ghost protocol; ~15× lower than Logical Observable Matching (LOM). | <br>\n| 3-Block GHZ Preparation (d = 19) | Reliable Logical Pauli-Products (RLPP) | Delivers up to 25× lower logical error rates when utilizing d/2 full syndrome-extraction rounds. | <br>\n| Repeated Logical S Gates (d = 9) | Naive MWPM / Standard LOM | Reduces circuit logical error rate to ~2.5 × 10−5 (~4–10× lower than LOM). | <br>\n| Syndrome Buffer Efficiency | Standard Lattice Surgery | Maintains distance-dependent error suppression with short syndrome-extraction buffers (⌊d/4⌋ rounds). | <br>\nTransversal operations—such as tCNOTs in CSS codes—execute multi-qubit entangling gates in constant circuit depth with respect to code distance, bypassing the O(d) overhead of surface-code lattice surgery. However, physical faults near a transversal gate propagate Pauli errors across blocks, generating higher-order correlations that break standard pairwise matching graphs. Universal Quantum’s IRS addresses this by alternating local Minimum-Weight Perfect Matching (MWPM) with deterministic Pauli-frame propagation. By storing detector corrections separately and iteratively re-decoding, the decoder strips away propagated contamination to leave clean, memory-equivalent subproblems.<br>\nThe paper also introduces a prior-informed DEM (Detector Error Model) to eliminate initialization bias and a robust treatment for initially indeterminate stabilizers during state preparation (such as |0⟩L initialization). Simulating adversarial circuits like alternating tCNOT chains, the authors show that IRS converges within a few iterations, making it well-suited for windowed streaming implementations in real-time fault-tolerant hardware.<br>\nThe full technical paper is available on arXiv here, with organizational commentary detailed in Universal Quantum’s Knowledge Hub here.<\/p>","content_hash":"ee10afb66da5fa92f5e4d10ad1556423","author":"Mohamed Abdel-Kareem","published_at":"2026-11-03T15:17:05","fetched_at":"2026-11-05 23:11:44","word_count":372,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"fdf610e0da0890b3","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48387","title":"Universal Quantum Unveils the iQPU: Foundry-Fabricated Trapped-Ion Processor Engineered for Modular Scaling","url":"https://quantumcomputingreport.com/universal-quantum-unveils-the-iqpu-foundry-fabricated-trapped-ion-processor-engineered-for-modular-scaling/","summary":"Universal Quantum has launched the iQPU, a foundry-fabricated trapped-ion processor designed for modular scaling. This integrated quantum processing unit aims to eliminate wiring bottlenecks in large-scale trapped-ion systems by integrating control electronics directly on-chip and using a proprietary interconnect technology called UQConnect to link multiple iQPU modules. The iQPU will be used in two quantum computers for the German Aerospace Center (DLR) to address challenges in space mission pl","content":"<p>Trapped-ion hardware developer Universal Quantum has commercially launched the iQPU (Integrated Quantum Processing Unit), a monolithic processor architecture designed to eliminate the physical wiring bottleneck in large-scale trapped-ion systems. The chips will serve as the core compute engine for two quantum computers currently being delivered under a €67 million ($73 million) contract with the German Aerospace Center (DLR).<br>\nCoherently links multiple discrete iQPU modules to operate as a unified, multi-chip quantum processor.<br>\nCustomer Deployment<br>\nDLR System Delivery<br>\nSupports institutional projects across space mission planning, climate modeling, and materials design.<br>\nTrapped-ion quantum computing achieves high operational fidelities through natural atomic homogeneity and long coherence times, but scaling beyond dozens of qubits typically induces severe optical and electronic congestion. Delivering independent radio-frequency, direct-current, and laser channels from external cryostat ports creates a physical “wiring wall.” Universal Quantum addresses this by combining its Quantum Charge-Coupled Device (QCCD) layout with integrated control silicon, dynamically shuttling ions across the substrate to execute gates without dedicated beam paths for every qubit site.<br>\nTo scale beyond the thermal and physical dimensions of a single chip, the architecture uses the company’s UQConnect interface to link adjacent modules without degrading global register coherence. Following the company’s recent $100 million Series A round, the launch positions Universal Quantum alongside Quantinuum and IonQ in the transition from bespoke laboratory assemblies to standardized, foundry-compatible multi-core QCCD engines.<br>\nFurther specifications are outlined on the Universal Quantum Announcement Page here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"aa1b20c856d3665d8b918f64d9da6e03","author":"Mohamed Abdel-Kareem","published_at":"2026-11-03T15:08:39","fetched_at":"2026-11-05 23:11:44","word_count":319,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"fc1b34087dc64119","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48383","title":"Ahead of EU Quantum Act, IQM Calls for Dedicated Qubit Foundries and DARPA-Style Procurement","url":"https://quantumcomputingreport.com/ahead-of-eu-quantum-act-iqm-calls-for-dedicated-qubit-foundries-and-darpa-style-procurement/","summary":"A new report by IQM Quantum Computers, \"Quantum Is Europe's Second Chance,\" calls for the EU to implement a Quantum Act to compete with other global powers in quantum computing. The report highlights Europe's strengths in public investment and QPU deployments but points out weaknesses in venture capital, chip manufacturing, and regulatory speed. It proposes dedicated qubit foundries, increased late-stage growth capital, and DARPA-style procurement to foster a robust European quantum ecosystem. T","content":"<p>Ahead of the European Commission’s expected presentation of the European Union Quantum Act, Finnish-German hardware developer IQM Quantum Computers (Nasdaq: IQMX) has released an industrial policy manifesto titled Quantum Is Europe’s Second Chance. The position piece argues that while Europe ceded commercial leadership in artificial intelligence to foreign hyperscalers, the continent enters the commercialization phase of quantum computing with structural advantages that risk eroding without coordinated manufacturing capacity, late-stage growth capital, and milestone-driven procurement.<br>\n| Europe’s Quantum Ecosystem: Current Footprint vs. Policy Asks |  |  | <br>\n|---|---|---|<br>\n| Ecosystem Pillar | Reported Metric / Current Baseline | Proposed Quantum Act Mechanism | <br>\n| Public Investment | ~$10B across EU Member States | Ranks second globally behind China; leads the U.S. in gross public commitments. | <br>\n| HPC Deployments | 21 on-premises QPU sites (~66% globally) | Embeds QPUs directly into national supercomputing hubs (versus two in the U.S.). | <br>\n| Growth Capital | EU captured 12% of venture capital (vs. 44% in U.S.) | Establishes a Scale-up Europe Fund for mixed primary/secondary late-stage financing. | <br>\n| Chip Manufacturing | Academic cleanrooms and R&D pilot lines | Funds shared packaging foundries and dedicated commercial qubit fabs by the 2030s. | <br>\n| Public Procurement | Traditional grant subsidies | Transitions to milestone-based co-development contracts modeled on DARPA’s QBI. | <br>\n| Regulatory Speed | State aid approval cycles exceeding 12 months | Imposes a single-window review capped at four to six months (matching Singapore). | <br>\nA central vulnerability highlighted in the manifesto is geographic fragmentation: European Centre for International Political Economy (ECIPE) data indicates that 23% of EU quantum funding is dispersed across 34 sub-scale regional clusters, compared to 2% in the U.S. and 1% in China. While EuroHPC initiatives have established European leadership in hybrid quantum-supercomputing installations, hardware developers face persistent barriers scaling beyond the laboratory. When early-stage investors seek liquidity, the absence of deep European institutional growth capital frequently transfers ownership, decision-making, and intellectual property overseas.<br>\nTo establish domestic commercial resilience, IQM outlines five legislative priorities for the Quantum Act and the companion European Chips Act 2.0. The strategy centers on creating dedicated industrial-grade quantum foundries and packaging facilities by the 2030s to match U.S. CHIPS Act infrastructure programs underway with IBM and GlobalFoundries. To finance large-scale systems, the manifesto urges the EU to model its Quantum Grand Challenges on the U.S. Defense Advanced Research Projects Agency (DARPA) Quantum Benchmarking Initiative (QBI)—replacing basic research grants with multi-hundred-million-dollar milestone contracts—while designating quantum cleanrooms and supply-chain infrastructure as “first-of-a-kind” facilities eligible for fast-tracked European state aid.<br>\nThe policy document is accessible on the IQM Perspective Portal here.<\/p>","content_hash":"1dcd6212b8f76f9aa77a251028ed1118","author":"Mohamed Abdel-Kareem","published_at":"2026-11-03T14:59:26","fetched_at":"2026-11-05 23:11:44","word_count":442,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"f4c85ff918032cc3","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48379","title":"FirstQFM Demonstrates Quantum Reservoir Computing on Rigetti’s 108-Qubit Processor to Outperform Classical Financial Benchmarks","url":"https://quantumcomputingreport.com/firstqfm-demonstrates-quantum-reservoir-computing-on-rigettis-108-qubit-processor-to-outperform-classical-financial-benchmarks/","summary":"FirstQFM, in collaboration with SW7 Group and Rigetti Computing, has successfully demonstrated a financial forecasting pilot using quantum reservoir computing (QRC) on Rigetti’s 108-qubit processor. This QRC system outperformed classical machine learning models and time-series foundation models in financial benchmarks, achieving significantly higher cumulative gross profit and loss and Sharpe ratios. The study highlights QRC as a promising and latency-efficient approach for deploying NISQ proces","content":"<p>Stockholm-based quantum software startup FirstQFM, in collaboration with London quantitative research firm SW7 Group and Rigetti Computing, has demonstrated a financial forecasting pilot using quantum reservoir computing (QRC) executed on Rigetti’s 108-qubit Cepheus-1-108Q superconducting processor. Across a blinded out-of-sample evaluation spanning 43 anonymized assets and 600 trading dates, FirstQFM’s hybrid QRC pipeline outperformed standard machine learning models and classical time-series foundation models across directional accuracy, macro-F1, cumulative gross profit and loss (P&L), and risk-adjusted Sharpe ratios.<br>\n| SW7 Financial Forecasting Pilot: Top Model Performance (600 Out-of-Sample Dates) |  |  | <br>\n|---|---|---|<br>\n| Forecasting Model | Directional Accuracy / Macro-F1 | Cumulative Gross P&L / Annualized Sharpe | <br>\n| FirstQFM QRC (Cepheus-1-108Q) | 52.02% / 0.5176 | 513,473 / 1.22 (Positive P&L on 41 of 43 assets) | <br>\n| Multilayer Perceptron (Pooled MLP) | 51.25% / 0.5075 | 242,100 / 0.75 | <br>\n| PCR with Ridge Regression | 50.44% / 0.4856 | 220,104 / 1.02 | <br>\n| PLS Regression | 50.62% / 0.4972 | 166,339 / 1.01 | <br>\n| Random Forest (Asset-Specific) | 50.66% / 0.5036 | 101,247 / 0.61 | <br>\n| Amazon Chronos-2 (Zero-Shot) | 50.70% / 0.4849 | 100,071 / 0.39 | <br>\nRather than requiring deep, error-mitigated circuit execution or variational parameter optimization on hardware, quantum reservoir computing injects time-series covariates into fixed, non-linear quantum dynamics and measures expectation values to construct high-dimensional feature representations for a classical linear readout head. In the pilot, FirstQFM generated hardware-stabilized reservoir embeddings utilizing 61 to 84 physical qubits across Rigetti’s multi-chiplet processor. When tested on a 43-asset equally weighted portfolio without transaction costs, the QRC system achieved 2.12× the cumulative gross P&L of the top classical baseline (pooled MLP) and an annualized Sharpe ratio of 1.22. A historically diversified five-asset sub-portfolio yielded a Sharpe ratio of 1.73.<br>\nTo eliminate lookahead bias and data leakage, SW7 Group anonymized all features and asset identifiers across six expanding chronological training, validation, and test folds. Notably, FirstQFM’s model exhibited a 49.0% average directional disagreement with classical benchmarks; on days where the QRC forecast opposed the majority consensus of the classical models, QRC achieved a 50.89% win rate. While the authors explicitly disclaim general quantum advantage—acknowledging that larger drawdowns accompanied the higher P&L and that classical simulability boundaries remain an evolving target—the study establishes QRC as a latency-efficient paradigm for deploying NISQ processors in quantitative finance.<br>\nTechnical methodology and validation data are detailed in FirstQFM’s Technical Report here and corporate Pilot Announcement here.<\/p>","content_hash":"0232a350085c73e643b760e1134e3e97","author":"Mohamed Abdel-Kareem","published_at":"2026-11-03T14:35:44","fetched_at":"2026-11-05 23:11:44","word_count":414,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"d96a14c03a92c48b","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10270","title":"Podcasts about the Topic: Part III, with Brian Greene","url":"https://scottaaronson.blog/?p=10270","summary":"Boooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems! So it seems like a perfect occasion to share yet another podcast. I know I&#8217;ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don&#8217;t talk about OpenAI&#8217;s refutation of the Exponential Time Hypothesis be","content":"<p>Boooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems!<br>\nSo it seems like a perfect occasion to share yet another podcast. I know I’ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don’t talk about OpenAI’s refutation of the Exponential Time Hypothesis because the announcement of that was still two days in the future!<br>\nBonus Addition From Just This Morning (Nov. 3):Another podcast, about quantum computing, foundations of quantum mechanics, AI, consciousness, and I forget what else … this one with writer Robert Wright, whose book The Moral Animal made a huge impression on me back when I was 13 years old!<br>\n45 Responses to “Podcasts about the Topic: Part III, with Brian Greene”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"5f31b5c964cb91b5a2d2cebf734ed352","author":"Scott","published_at":"2026-10-31T21:40:33","fetched_at":"2026-11-05 23:11:41","word_count":310,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5d","domain":"scottaaronson.blog"},{"id":"0083cc178c901677","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10232","title":"Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)","url":"https://scottaaronson.blog/?p=10232","summary":"In my &#8220;Mathocalypse&#8221; post, I mentioned that my wife Dana&#8212;who&#8217;s been working on Subhash Khot&#8217;s Unique Games Conjecture since ~2009, for the entire time I&#8217;ve known her&#8212;has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI&#8217;s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, ","content":"<p>Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)<br>\nIn my “Mathocalypse” post, I mentioned that my wife Dana—who’s been working on Subhash Khot’s Unique Games Conjecture since ~2009, for the entire time I’ve known her—has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI’s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, Dor Minzer, and other colleagues, and (naturally) GPT-6 Astra, Dana probably now understands this crown jewel of OpenAI’s release as well as anyone does. This week, she gave two well-received whiteboard talks on the proof at Simons Institute. So, I and others encouraged her to give the same talks next week at UT Austin when she’s back here, and Dana agreed! Because of the large timely interest, we’re going to do a live Zoom option, and will also record the talk for later sharing on YouTube. Please note: While all are welcome, this is a 2-hour technical talk. The first hour will review key ideas from hardness of approximation, while the second hour will describe the new construction. —SA<br>\nTitle: The Unique Games Conjecture – Proved (!!?)<br>\nSpeaker: Dana Moshkovitz (UT Austin)<br>\nWhen: Wednesday Nov. 4, 3:30-5:30pm US Central (with a brief break in the middle)<br>\nWhere: UT Austin, Gates Dell Complex 6.302. Live Zoom will be available here, and a recording will be available later.<br>\nAbstract: The Unique Games Conjecture of Khot says that it is NP-hard, given a system of linear equations of the form xi-xj=bij (mod p) over variables x1…xn, where 99% fraction of the equations can be satisfied, to find an assignment satisfying 1% of the equations (here p is a sufficiently large constant).<br>\nThis conjecture implies optimal inapproximability results for many optimization problems.<br>\nA few weeks ago OpenAI released a writeup with a proof of the Unique Games Conjecture, as well as a Lean formalization of the proof. The writeup, like others released that day, is not written in a way that’s especially readable to human mathematicians.<br>\nMy goal in this talk is to offer my mental map of the proof, in a way that’s helpful to theoretical computer scientists who are familiar with the area. I think of the innovation as a new code construction, “Hadamard with a noise test.” I’ll sketch how it fits into the NP-hardness reduction. Then I’ll describe the code construction fully and sketch its soundness analysis.<br>\nI’ll also point out a couple of ingredients of the proof that are of independent interest, like a simple quadratic that behaves “like a linear,” and a probability bound using a trick with harmonic numbers.<\/p>","content_hash":"f81a4183271bf90cffcc544e4703c469","author":"Scott","published_at":"2026-10-30T23:27:34","fetched_at":"2026-11-05 23:11:42","word_count":454,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5d","domain":"scottaaronson.blog"},{"id":"19962db08186efd4","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10239","title":"Podcasts about the Topic: Part II","url":"https://scottaaronson.blog/?p=10239","summary":"As always, I strongly recommend 2x speed, which compensates somewhat for my verbal infelicities! New! More podcasts keep dropping! This one is with the AI alignment researcher Roman Yampolskiy, about &#8230; well, AI alignment, plus the Mathocalypse, plus quantum computing, plus whether the universe is a simulation, and I forget what else! Man do the YouTube comments make me despair of humanity though. Another one that recently dropped, with Sophia Aryan: With Curt Jaimungal: The title Curt put ","content":"<p>Podcasts about the Topic: Part II<br>\nAs always, I strongly recommend 2x speed, which compensates somewhat for my verbal infelicities!<br>\nNew! More podcasts keep dropping! This one is with the AI alignment researcher Roman Yampolskiy, about … well, AI alignment, plus the Mathocalypse, plus quantum computing, plus whether the universe is a simulation, and I forget what else! Man do the YouTube comments make me despair of humanity though.<br>\nAnother one that recently dropped, with Sophia Aryan:<br>\nThe title Curt put next to my head could’ve been in reference to many, many things! But sorry, he just mean AI. He and I start with the Mathacre, of course, but then we get onto the firewall paradox and then Curt starts asking about computational complexity and the Second Law, and then about Integrated Information Theory.<br>\nAh, and another one that just dropped! Man’s Search for Meaning podcast (recorded in-person in Austin), with Yannick Bernard, who asked me about quantum computing, AI, my personal story, grade-skipping, antisemitism, and I don’t even remember what else. I didn’t refuse to answer anything. (Note: this one was recorded over the summer, which is why I so weirdly omit the latest AI math breakthroughs!)<br>\nOK, despite the title of this post, short break from “The Topic.” Here’s an absolute masterpiece of mathematical exposition, from the “Polylog” YouTube channel, which tells the story of the determination of Busy Beaver values through spectacular animations. I play cameo roles in the video, although I embarrass myself (as the video silently points out) by transposing two digits in the value of BB(5)…!<br>\nJust for old times’ sake, a short podcast about quantum computing with Danny Li.<br>\nAnd, coming soon (not on YouTube quite yet): a conversation about the Mathacre with celebrated physics popularizer (and character on The Big Bang Theory) Brian Greene, recorded in-person in NYC during my recent trip to speak in the math department at Columbia University!<br>\nAnd to preempt the inevitable comments about it: yes, my students just came to my office to tell me that an OpenAI model has now refuted the Exponential Time Hypothesis, by giving an algorithm to solve 3SAT in an amount of time that scales roughly like exp(n/√log(n)). Even as we struggle to digest the previous courses, the endless buffet continues!<\/p>","content_hash":"7dc0b77b2276479ae01c78d4fd42e578","author":"Scott","published_at":"2026-10-26T22:03:37","fetched_at":"2026-11-05 23:11:42","word_count":379,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"971900c926d04767","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18331","title":"Lunch with Horace Walpole","url":"https://quantumfrontiers.com/2026/10/25/lunch-with-horace-walpole/","summary":"Did you know that Horace Walpole invented the Gothic novel? The Englishman spawned a genre by publishing The Castle of Otranto during the 1700s. Walpole’s work featured dark atmospheres, crumbling castles, family secrets, and taboo subjects such as madness and incest. If you’ve enjoyed Oscar Wilde&#8217;s novel The Portrait of Dorian Gray or the 2024 film Nosferatu,1 thank Horace Walpole. I memorized the above information in a high-school English class. My teacher, Mrs. Lukacs, demanded a great ","content":"<p>Did you know that Horace Walpole invented the Gothic novel? The Englishman spawned a genre by publishing The Castle of Otranto during the 1700s. Walpole’s work featured dark atmospheres, crumbling castles, family secrets, and taboo subjects such as madness and incest. If you’ve enjoyed Oscar Wilde’s novel The Portrait of Dorian Gray or the 2024 film Nosferatu,1 thank Horace Walpole.<br>\nI memorized the above information in a high-school English class. My teacher, Mrs. Lukacs, demanded a great deal of her students: we memorized boatloads of facts about literary genres (from Anglo-Saxon epics to elegies), history (the Enlightenment, the Romantic era, etc.), literary devices (enjambment and litote and synecdoche), and authors (Samuel Johnson, Anne Bradstreet, and their ilk.). Thanks to Mrs. Lukacs, I can add that Charles Brockden Brown Americanized the Gothic. He shifted stories’ settings to caves, dark forests, and villages at the edge of civilization. The novels Wieland, Edgar Huntly, and Arthur Mervyn exemplify his style.<br>\nMrs. Lukacs’s curriculum hibernated in me like an educational chipmunk after I’d graduated from high school. Imagine my surprise, during a recent lunchtime, when I lifted my gaze to find Horace Walpole a few feet away.<br>\nI was dining at King’s College, Cambridge. The University of Cambridge contains colleges similarly to how Hogwarts contains houses. Each house has students and faculty members from multiple departments. Some departments share their disciplines with institutes. An institute and a college account for my visiting Cambridge most of this autumn: the Isaac Newton Institute for the Mathematical Sciences is hosting a several-month program about quantum many-body physics. I’m grateful to be attending the program while holding a Visiting Fellowship at King’s College.<br>\nKing Henry VI founded King’s College in 1441. (Caltech, where I earned my PhD, precipitated from earlier institutions around the turn of the twentieth century.) The college’s alumni and former Fellows include centuries’ worth of luminaries. Some of their portraits hang in the dining hall, a Gothic confection that could play a cathedral on television.<br>\nI sometimes talk with other scholars over meals in the dining hall; but, when dining alone, I examine different facets of the hall over different meals. The room boasts carved wooden walls, a seventeenth-century tapestry, the gold-colored wall sconces. I couldn’t forgive myself if I squandered the opportunity to examine them. Sometimes, I’ve scrutinized a portrait per meal. One portrait depicts Horace Walpole.<br>\nDid I attempt to envision Horace Walpole during high school? Probably not. He lurked in my imagination as the silhouette of an eighteenth-century Englishman—likely as buttoned-up, industrious, and middle-aged.<br>\nThe portrait shows a youth in his teens or twenties, his skin smooth. A slight smile hints at levity. His clothing’s light coloring buttresses the impression: a white shirt peeps out from a cobalt-blue jacket. The young man’s pose suggests formality, his back straight and one hand tucked inside his jacket. Yet his large, dark eyes seek the viewer’s. I wouldn’t have expected such a plucky-looking youth to have founded the genre that includes Dracula. But I welcomed Horace Walpole as a lunch companion.<br>\nAfter finishing eating, I walked to one end of the dining hall to drop off my tray. Beside a doorway there hung another portrait whose name leaped out at me: Sir Robert Walpole. Google revealed that Sir Robert had fathered Horace—and served as Great Britain’s first prime minister.<br>\nDuring another meal, I found myself eyeing a portrait of a man wearing an Elizabethan ruff. He wore no smile, unlike Horace. Little wonder: a label revealed the portrait to be of Sir Francis Walsingham. Walsingham had headed Queen Elizabeth I’s spy network during the 1500s. Catholics across Europe sought—overtly and by cloak and dagger—to dethrone Elizabeth and the Protestantism to which Walsingham subscribed. I could hardly blame her right-hand man for looking as though he’d found a rat in his soup.<br>\nWhat a crew surrounds me, I keep thinking. What depth and richness it adds to my meals. I eat chicken-tikka sandwiches and minty-pea salads with history.<br>\nStudying physics unlocks similar depth and richness. Doing physics, one doesn’t merely pose a problem, translate it into math, and solve the mathematical problem. One interprets the mathematical outcome physically, illuminates it with examples, and applies the results to the world around us.<br>\nFor instance, odors waft out of the servery into the dining hall, savoring of flatbread pizza or falafel or beef Wellington. Why? Because improperly fed or watered students can cause riots. But why, more fundamentally? Because, by the second law of thermodynamics, every sufficiently large closed, isolated system’s entropy increases or remains constant. Entropy increases as a gas—which can carry an odor—spreads out.<br>\nAs its entropy grows, the gas approaches equilibrium: large-scale properties of the gas, such as its volume, cease to change. If any energy leaves the gas, an equal amount enters it, on average. The gas takes far less time to equilibrate than glass does. The dining hall’s stained-glass windows depict coats of arms and list college provosts of yore. A glass’s atoms don’t form a crystal, a pattern repeated across space. Diamonds, table salt, and the quartz in wristwatches consist of crystals. A glass’s atoms lie at random distances from each other. This randomness leads to randomness in the interatomic interactions’ strength.<br>\nSimilar randomness characterizes neural networks, which underlie conversations I’ve overheard and participated in at meals. Neural networks realize artificial intelligence, which has been widening, disrupting, monetizing, speeding up, eroding, and enhancing research. You don’t need for me to tell you that AI has ignited a quest for an understanding of what computers can and can’t accomplish. What better place to undertake such a quest than King’s? Alan Turing, a co-founder of computer science, studied and worked here.<br>\nI’ve written about how a liberal-arts education has enhanced my physics. So has a physics education enhanced my life. Physics adds depth and richness—as well as nuance, detail, and significance. I have the opportunity to eat lunch with Horace Walpole this autumn; we have the opportunity to eat our cosmic lunches in this universe for only slightly longer. I couldn’t forgive myself if I squandered the opportunity to examine my surroundings.<br>\nWith thanks to King’s College, the Isaac Newton Institute, David Arvidsson-Shukur, and many others for my visit.<br>\n1Or the 1922 original.<\/p>","content_hash":"c19f669a34e11e70d926022ee3e9b171","author":"Nicole Yunger Halpern","published_at":"2026-10-26T00:03:21","fetched_at":"2026-11-05 23:11:45","word_count":1039,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"1w","domain":"quantumfrontiers.com"},{"id":"24dff74b42fa198c","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10235","title":"Vote! (Israeli edition)","url":"https://scottaaronson.blog/?p=10235","summary":"Someone writing an article for the Israeli press about “people abroad who love Israel but might be worried” emailed me the following questions: “1. What is something about Israel that you admire/appreciate over the years? 2. What are you worried the most about Israel these days?” So I replied as follows: “It’s hard to know where to start with either of your questions! But briefly: Tiny Israel standing up for itself, against an often hostile and unjust world, is a huge part of what’s given me the","content":"<p>Vote! (Israeli edition)<br>\nSomeone writing an article for the Israeli press about “people abroad who love Israel but might be worried” emailed me the following questions:<br>\n“1. What is something about Israel that you admire/appreciate over the years?<br>\n2. What are you worried the most about Israel these days?”<br>\nSo I replied as follows:<br>\n“It’s hard to know where to start with either of your questions! But briefly:<br>\nTiny Israel standing up for itself, against an often hostile and unjust world, is a huge part of what’s given me the self-confidence to stand up for myself in my own life. That was true even before I had visited Israel or spent significant time there, gazed across the desert at the still-clear ruins of the Roman siege of Masada, staggered overwhelmed out of Yad Vashem into the sunlight of Jerusalem, tasted the hummus or pomegranate juice or ice cream with blended fruit, befriended or had academic collaborations with dozens of Israelis, or married an Israeli woman.<br>\nMy fear is merely the ‘obvious’ one — that, in response to the staggering hostility directed against the ‘Jew among the nations,’ Israel will become more and more belligerent, isolated, and right-wing. It will get demographically overwhelmed by those who don’t want to work or serve in the army, while hundreds of thousands of secular educated Israelis leave. It will be internally divided almost to the point of civil war. It will repudiate the liberal-democratic vision of Herzl and Ben-Gurion, of world-class universities and making the deserts bloom, for the swaggering, theocratic vision of Smotrich and Ben-Gvir, of chasing Palestinians from their olive groves. It will become more and more like the hateful caricature of itself that the anti-Israel people in the West always imagined. And then, having been internally weakened in all of these ways, it will finally be destroyed by its external enemies, who will never have rested the whole time, who never once wavered in their dream of a second Holocaust.<br>\nI hope and pray that in the upcoming election, the Israeli voters make optimistic choices that repudiate these fears.”<br>\nAs I’ll do more and more with political posts, I’m leaving the comments off. Why? Because my remaining life is too short to spend it battling an endless parade of trolls and griefers, leftists and rightists and just nihilists, who might or might not be AI.<\/p>","content_hash":"f2ee645b3e2ca56f2eb570bd2d98df53","author":"Scott","published_at":"2026-10-25T21:54:26","fetched_at":"2026-11-05 23:11:42","word_count":394,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"1be6e6aac8a834a3","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10222","title":"Vote!","url":"https://scottaaronson.blog/?p=10222","summary":"Today, I take a break from your regularly-scheduled AI mathocalypse programming to urge my American readers to vote in the Congressional midterms, early if possible, if you haven&#8217;t already. Especially if your state faces one or more major contests, as does my adopted home state of Texas. Me, I voted straight-ticket Democrat today, as I&#8217;ve done in every election since I became eligible over a quarter-century ago (except for when I vote-swapped with someone from another state). So yes,","content":"<p>Vote!<br>\nToday, I take a break from your regularly-scheduled AI mathocalypse programming to urge my American readers to vote in the Congressional midterms, early if possible, if you haven’t already. Especially if your state faces one or more major contests, as does my adopted home state of Texas.<br>\nMe, I voted straight-ticket Democrat today, as I’ve done in every election since I became eligible over a quarter-century ago (except for when I vote-swapped with someone from another state).<br>\nSo yes, I voted for the guy who studied theology a short walk from my house, and who seems to have really internalized the whole Jesus thing about kindness to everyone—<br>\n—over his sneering, thuggish, cartoonishly mafia-like opponent. Fingers crossed that Talarico pulls off a historic upset for our state (he’s currently a 2-to-1 favorite in the prediction markets).<br>\nThe Texas Republicans did everything they possibly could to make this choice easy for me, by being corrupt, conspiratorial, racist, and Taliban-like even by the jaw-droppingly debased standards of MAGA in 2026. As I draw breath, I could never vote for a slate one of whose candidates attacked UT students for the crime of being visibly Southeast Asian while cheering their school’s football victory from the stands—and whose other candidates could barely bring themselves to condemn this knuckle-dragging racist, for fear of angering their base. (It’s like, didn
