  <title>Meridian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FFFCF0;
      --card: #F2F0E5;
      --text: #2D2B28;
      --dim: #6F6E69;
      --muted: #DAD8CE;
      --up: #66800B;
      --down: #AF3029;
      --accent: #205EA6;
      --spark: #8B5CF6;
      --score: #AD8301;
      --link: #24837B;
      --particle: #24837B;
    }

    html { font-size: 10px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding: 4px;
      min-height: 100vh;
      font-weight: 400;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 4px 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--muted);
    }

    .title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .timestamp { color: var(--dim); font-size: 9px; }

    .dashboard {
      position: relative;
    }

    .card-wrapper {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 2px;
      overflow: hidden;
      /* top, left, width set by JS layout engine */
    }

    .card-wrapper canvas {
      display: block;
      width: 100%;
    }

    .card-wrapper .links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card-wrapper .links a {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      color: transparent;
      text-decoration: none;
      display: block;
    }

    footer {
      margin-top: 8px;
      padding: 6px 4px;
      border-top: 1px solid var(--muted);
      text-align: center;
      color: var(--dim);
      font-size: 7px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .footer-links {
      margin-bottom: 6px;
    }

    .footer-links a {
      margin: 0 4px;
    }

    .ascii-footer {
      margin: 8px auto 4px;
      font-size: 8px;
      line-height: 1.1;
      color: var(--dim);
      opacity: 0.5;
      user-select: none;
      overflow: hidden;
      max-width: 400px;
    }

    .ascii-footer .particle {
      display: inline-block;
      color: var(--particle);
      opacity: 0.4;
    }

    .ascii-footer .meridian-text {
      color: var(--dim);
      letter-spacing: 1px;
    }

    @keyframes particleDrift {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.6; transform: translateY(-1px); }
    }

    .ascii-footer .p1 { animation: particleDrift 3s ease-in-out infinite; }
    .ascii-footer .p2 { animation: particleDrift 3s ease-in-out infinite 0.3s; }
    .ascii-footer .p3 { animation: particleDrift 3s ease-in-out infinite 0.6s; }
    .ascii-footer .p4 { animation: particleDrift 3s ease-in-out infinite 0.9s; }
    .ascii-footer .p5 { animation: particleDrift 3s ease-in-out infinite 1.2s; }
    .ascii-footer .p6 { animation: particleDrift 3s ease-in-out infinite 1.5s; }

    @media (prefers-reduced-motion: reduce) {
      .ascii-footer .particle {
        animation: none;
        opacity: 0.3;
      }
    }

    noscript p {
      text-align: center;
      padding: 20px;
      color: var(--dim);
      font-size: 9px;
    }
  </style>
</head>

antumfrontiers.com/?p=17917","title":"How I learned to stop worrying and…no, I’ve always adored entropy","url":"https://quantumfrontiers.com/2026/04/12/how-i-learned-to-stop-worrying-andno-ive-always-adored-entropy/","summary":"When I was pursuing a PhD at Caltech, so was my friend Jeremy. He used to throw a dinner party every few months. The email invitations welcomed friends to partake of his cooking and, if we wished, to help him cook. I didn’t help cook; but, when I arrived, the mess of pots and pans drew me to the kitchen like vinegar drawing a pathological fly. I couldn’t sit still while cookware needed cleaning, so I scrubbed and rinsed the pans and spoons and bowls. Jeremy, an applied-physics student, commented","content":"<p>When I was pursuing a PhD at Caltech, so was my friend Jeremy. He used to throw a dinner party every few months. The email invitations welcomed friends to partake of his cooking and, if we wished, to help him cook. I didn’t help cook; but, when I arrived, the mess of pots and pans drew me to the kitchen like vinegar drawing a pathological fly. I couldn’t sit still while cookware needed cleaning, so I scrubbed and rinsed the pans and spoons and bowls. Jeremy, an applied-physics student, commented on my adeptness at decreasing entropy.<br>\nIt’s the story of my life, I replied.<br>\nIn fourth grade, my classmates and I cleaned our desks every Friday afternoon. Once a student finished, my teacher dismissed him or her onto the playground. My neighbor’s desk horrified me like the disaster in a hurricane’s wake, so I neatened his desk after finishing with mine.1 Another friend requested the same favor. A third classmate offered to pay me for cleaning his desk, but I’d have undertaken the chore for its own sake. Ordering the world offered me fulfillment.<br>\nFrom cleaning a fourth-grade desk, I progressed to pursuing a PhD in theoretical physics. The two pursuits might seem to resemble each other no more than Dr. Jekyll and Mr. Hyde; yet, to me, the path between them is but a step. I trained as a theoretical physicist because I love organizing ideas. Caltech paid me to build models, propose definitions and theorems, and structure proofs—to dream up ideas and identify the optimal arrangements for them. I needed that pay, being an adult, as I hadn’t needed my fourth-grade classmate’s desk-cleaning fee. Yet I organized ideas for the same reason that drove me to organize my neighbor’s notebooks.<br>\nMany people have called entropy a measure of disorder. To see why, imagine that Jeremy’s crew has used thirty utensils while cooking. The chefs can have scattered the utensils across the kitchen in many ways: they may have dropped forks on the floor, left spoons in the sink, arranged spatulas on the drying rack, or filled a vase with knives like a modern-art bouquet. In few of these configurations do the forks lie in their compartment of the utensil drawer, the spoons lie in their compartment, etc. We call such configurations neat. Most of the other configurations, we call messy.<br>\nA system’s entropy is the number of configurations consistent with known large-scale properties of the system, such as the number of forks.2 More configurations are consistent with messiness (and a fixed number of forks and so on) than with neatness (and the same number of forks and so on). Messiness tends to correlate with high entropy. People often say, therefore, that entropy quantifies messiness. Hence Jeremy’s complimenting me on my decreasing of entropy.<br>\nJeremy’s dinner parties came to mind as I read the book The Mattering Instinct, published by Rebecca Newberger Goldstein this January. Rebecca is a philosopher of science and a writer. I had the good fortune to meet her through my undergraduate mentor Marcelo Gleiser, who’s had another cameo or two on Quantum Frontiers. Rebecca’s latest book covers what she calls the mattering instinct: the longing to know that we matter.<br>\nWe spend scads of energy and time on securing our “survival and flourishing,” as Rebecca says. We feed ourselves; work to earn money to purchase food; clean, shelter, and clothe ourselves; ingrain ourselves in societies that offer some degree of security; and more. Do we deserve all this effort? We long for assurance that, in the immortal words of L’Oreal, we’re worth it.<br>\nSurvival and flourishing, Rebecca writes, requires us to decrease entropy. Every closed, isolated system’s entropy increases or remains constant, according to the second law of thermodynamics. Entropy increases as a system becomes more uniform, loosely speaking. The system’s particles spread out across space, these particles’ temperature comes to equal those particles’ temperature, and so on. In contrast, your body exists because its particles clump together in a certain shape consistently. You withstand heat waves and snow because homeostasis maintains your temperature despite your environment’s temperature. You keep your body’s entropy low to survive. Rebecca therefore casts us as fighting entropy.<br>\nAs a thermodynamicist, I agree with Rebecca. Yet I also adore entropy. It helps explain why time flows, quantifies uncertainty, and determines the maximal efficiencies with which we can perform tasks such as communication. What versatility and richness! Entropy also embodies tension and subtlety: its mathematical definition looks obscure at first glance, yet entropy helps explain familiar phenomena such as aging. For these reasons, before beginning my PhD, I told a potential advisor that I could imagine devoting the next five years of my life to entropy.<br>\nI therefore aspire to rehabilitate entropy’s reputation. Novelist Terry Pratchett endeared mortality to millions of readers through anthropomorphism. His character Death, a mainstay of the Discworld series of novels, elicits empathy and fondness. I won’t anthropomorphize entropy here,3 but I aim to replace conflict with cooperation in the narrative above. To survive and flourish, I hold, we partner with entropy. How? We create oodles of entropy in our environments. This entropy increase offsets the entropy decrease that supports life.<br>\nFor example, imagine working at a desalination plant. You’d process high-entropy water throughout which salt has spread. You’d concentrate the salt in a tiny region, reducing the water’s entropy. This reduction, producing fresh water, could support your city’s drinking, cooking, and toothbrushing needs.<br>\nTo reduce the water’s entropy, you’d create loads more entropy. You’d eat breakfast before work, consuming energy stored neatly in your waffle’s chemical bonds. Your body would later break the bonds, releasing the energy. Some energy would power your muscles, so you could program the desalination system, test its output, etc. But much of the chemical energy would transform into heat radiated by your body. The heat would warm up the air molecules around you, magnifying their random jigglings and jostlings. You’d increase the entropy of the air—your environment—to decrease the water’s entropy. The air’s entropy increase would outweigh the water’s entropy decrease.<br>\nOrganisms survive and flourish by producing entropy in their environments. In fact, organisms have a knack for generating entropy. Entropy and life thereby further each other. A glass-half-full thinker could conclude that we partner with entropy.<br>\nSo did I partner with entropy as a PhD student, applying it to solve problems in quantum information theory and thermodynamics. So did I partner with entropy in fourth grade and at Jeremy’s apartment, deriving satisfaction from my cleaning. Rebecca would call these activities’ ultimate aim (beyond the aim of, e.g., not sitting beside a pigsty in fourth grade) mattering. She writes that we reduce entropy (within our immediate vicinities) to satisfy the mattering instinct. Rebecca’s proposition describes my behaviors with uncanny precision, I realized upon reading her book.<br>\nWhich I’ve now finished. So pardon me while I return to washing forks in the quantum kitchen of the universe.<br>\nWith thanks to Jeremy for his friendship…and food.<br>\n1I also ensured that my neighbor brought home, every afternoon, the sweater he’d brought to school that morning. Before I took charge, he’d ended up with three forgotten sweaters crammed into his cubby.<br>\n2At least, one entropy is. Many other entropies exist.<br>\n3If you anthropomorphize entropy elsewhere, let me know.<\/p>","content_hash":"fa0db26cbcb786f59f298f893b38d64a","author":"Nicole Yunger Halpern","published_at":"2026-04-13T00:06:06","fetched_at":"2026-04-13 19:10:05","word_count":1213,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"19h","domain":"quantumfrontiers.com"},{"id":"43d49b625c6b6a0c","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17937","title":"Unleashing the Advantage of Quantum AI","url":"https://quantumfrontiers.com/2026/04/09/unleashing-the-advantage-of-quantum-ai/","summary":"As experimental capabilities advance rapidly, the quantum computing community faces a critical elephant in the room: What will these quantum machines eventually be useful for? Will they deliver the promised broad societal impact, or will they remain highly specialized devices for exotic tasks known only to the experts? The elephant in the room Despite decades of effort, conclusive evidence of large quantum advantage in real-world applications remains confined to a few niche domains, such as simu","content":"<p>As experimental capabilities advance rapidly, the quantum computing community faces a critical elephant in the room: What will these quantum machines eventually be useful for? Will they deliver the promised broad societal impact, or will they remain highly specialized devices for exotic tasks known only to the experts?<br>\nThe elephant in the room<br>\nDespite decades of effort, conclusive evidence of large quantum advantage in real-world applications remains confined to a few niche domains, such as simulating quantum materials and cryptanalysis. These problems are either inherently quantum to begin with, or they possess specialized mathematical structure that quantum algorithms can easily exploit. But it seems unlikely that such structures appear broadly in everyday life.<br>\nIndeed, most applications of modern computation hinge on the processing of massive, noisy classical data, generated at an unprecedented pace across society. That is the driving force behind the overwhelming success of machine learning and AI. Since the data originates from the macroscopic classical world, there is no obvious reason it should exhibit the delicate, specialized structures that quantum computers require. To playfully adapt Richard Feynman’s famous quote: We live in an effectively classical world, dammit, and maybe classical computers and AI already suffice for most of our problems. (For those unfamiliar, Feynman originally quipped: “Nature isn’t classical, dammit, and if you want to make a simulation of nature, you’d better make it quantum mechanical.”)<br>\nThe central challenge<br>\nTo truly unlock the power of a quantum computer, quantum algorithms typically need to access data in quantum superposition, processing many different samples simultaneously in different branches of the quantum multiverse. To use technical jargon, this is called querying a quantum oracle. But in reality, the classical data samples that we want to process are generated from everyday activities in a classical world, and we can only access them one at a time.<br>\nThink of the movie reviews you scroll through on a streaming platform. How would you read the plain-text reviews from a million different users all at once in a quantum superposition? This bottleneck—the challenge of efficiently accessing the classical world in quantum superposition—is known as the data loading problem. It has arguably been one of the main obstacles to achieving broadly applicable quantum advantage.<br>\nSketching a quantum oracle<br>\nIn this new work [1], we provide a solution to this seemingly impossible challenge. We develop a framework, called quantum oracle sketching, that enables us to access the classical world in quantum superposition in an optimal way. Importantly, it automatically handles the noise and correlations in the data, and natively supports flexible data structures like vectors and matrices that enable machine learning applications.<br>\nThe core mechanism relies on processing data as a continuous stream. For each classical data sample we observe, we apply a carefully designed, small quantum rotation to our system. By sequentially accumulating these quantum rotations, we incrementally build up an accurate approximation of the target quantum oracle, which can then be used in any quantum algorithm for data processing. Because every data sample is processed once and immediately discarded, we completely eliminate the massive memory overhead typically required to store the dataset. The fundamental price to pay for assembling quantum queries from classical data lies in the sample complexity: our algorithm consumes a number of samples that scales quadratically with the number of quantum queries we need to make. We show that this rate is optimal and fundamentally arises from the quadratic relationship between quantum amplitudes and classical probabilities governed by the Born rule.<br>\nWith the data successfully loaded into the quantum computer, the final challenge is to efficiently read out classical results. To address this, we develop an efficient measurement protocol called interferometric classical shadow. Combined with quantum oracle sketching, it allows us to circumvent the data loading and readout bottleneck to construct exponentially compact classical models from massive classical data with quantum technology.<br>\nExponential quantum advantage in machine learning<br>\nUsing this new approach, we are finally able to find exponential quantum advantage in processing classical data and machine learning. We rigorously prove that a small quantum computer can perform large-scale classification and dimensionality reduction on massive classical data by processing samples on the fly. In contrast, any classical machine achieving the same prediction performance requires exponentially larger size. When the classical machine does not have the required exponentially large memory size, it needs super-polynomially more samples and time relative to our protocol running on a quantum device. Remarkably, this illustrates that quantum technology enables us to construct compact and accurate classical models out of classical data, which is impossible with classical machines alone unless given exponentially larger memory.<br>\nThe true scale of this exponential memory advantage is staggering. A quantum processor with 300 logical qubits can outperform a classical machine built from every atom in the observable universe. Of course, to actually see such a comical contrast, we would also need universe-scale datasets and processing time.<br>\nTo contextualize these results in realistic scenarios, consider a large-scale scientific experiment, like a large particle collider. Each experimental run generates a colossal volume of data. With a quantum computer, we can keep squeezing all the data into this tiny quantum chip to perform downstream machine learning tasks such as classification and dimensionality reduction. But if we only have classical machines, we would need to build massive, energy-consuming data centers to store the raw data to match the performance. Without this massive memory overhead, classical machines simply couldn’t extract the same clear signals from a single run, forcing us to repeat the massive, expensive experiment many more times to compensate. To put this into perspective, the Large Hadron Collider (LHC) at CERN generates petabytes (millions of gigabytes) of data per hour, but the data storage bottlenecks force researchers to discard all but a tiny fraction—retaining perhaps only one in a hundred thousand events.<br>\nWe validated these quantum advantages on real-world datasets, including movie review sentiment analysis and single-cell RNA sequencing. In these public datasets, we demonstrate four to six orders of magnitude (ten thousand to a million times) reduction in memory size with fewer than 60 logical qubits. Given the rapid advancements in high-rate quantum error correction codes and experimental techniques, quantum computers capable of demonstrating such applications are foreseeable in the near future. Crucially, the quantum advantage we propose likely carries a clearer positive impact for society and likely arrives sooner than the applications in cryptanalysis, where the current best estimate requires a thousand logical qubits.<br>\nTowards Quantum AI<br>\nOur results provide strong evidence that the utility of quantum computers extends far beyond specialized tasks, opening a path for quantum computers to be broadly useful in our everyday life. Rather than fearing that classical AI will “eat quantum computing’s lunch,” we now have rigorous evidence pointing towards a much more exciting prospect: quantum-enhanced AI overpowering classical AI.<br>\nOf course, there is still a long way to go towards the dream of quantum intelligence. Our current results establish the provable supremacy of quantum machines in foundational machine learning tasks, such as high-dimensional linear classification and dimensionality reduction. They do not yet imply immediate utility for modern generative AI such as large language models.<br>\nThat said, our results give me a strong feeling that we are living in an age strikingly reminiscent of the traditional machine learning era—an age dominated by support vector machines and random forests; an age when we relied on rigorous statistical analysis because we lacked the computational resources for large-scale heuristic exploration; an age that ultimately heralded the birth of deep learning and the AI revolution. Today, quantum AI seems to sit at a similar historical position. I cannot wait to see what quantum AI will become once we are capable of unconstrained heuristic exploration on large-scale fault-tolerant quantum computers.<br>\nTo accelerate this dawn of quantum AI, we invite physicists, computer scientists, developers, and machine learning practitioners to join our efforts and help us push the boundaries of what quantum AI can achieve. To bridge the gap between abstract quantum theory and hands-on machine learning practice, we are open-sourcing our core framework. Our numerical implementation of quantum oracle sketching is built in JAX, natively supporting GPU/TPU acceleration and automatic differentiation to integrate nicely with modern machine learning pipelines. Check out the code, run the simulations, and help us shape the future of quantum AI at github.com/haimengzhao/quantum-oracle-sketching!<br>\nReferences<br>\n[1]. Haimeng Zhao, Alexander Zlokapa, Hartmut Neven, Ryan Babbush, John Preskill, Jarrod R. McClean, and Hsin-Yuan Huang. Exponential quantum advantage in processing massive classical data, arXiv:2604.07639, 2026.<\/p>","content_hash":"020cf1275e987782d074dba4a9922f6a","author":"Haimeng Zhao","published_at":"2026-04-10T01:43:44","fetched_at":"2026-04-13 19:10:05","word_count":1410,"read_time_minutes":8,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"3d","domain":"quantumfrontiers.com"},{"id":"f681695608c41f13","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9668","title":"Before we start on quantum","url":"https://scottaaronson.blog/?p=9668","summary":"Imagine that every week for twenty years, people message you asking you to comment on the latest wolf sighting, and every week you have to tell them: I haven’t seen a wolf, I haven’t heard a wolf, I believe wolves exist but I don’t yet see evidence of them anywhere near our town. Then one evening, you hear a howl in the distance, and sure enough, on a hill overlooking the town is the clear silhouette of a large wolf. So you point to it — and all the same people laugh and accuse you of “crying wo","content":"<p>Before we start on quantum<br>\nImagine that every week for twenty years, people message you asking you to comment on the latest wolf sighting, and every week you have to tell them: I haven’t seen a wolf, I haven’t heard a wolf, I believe wolves exist but I don’t yet see evidence of them anywhere near our town.<br>\nThen one evening, you hear a howl in the distance, and sure enough, on a hill overlooking the town is the clear silhouette of a large wolf. So you point to it — and all the same people laugh and accuse you of “crying wolf.”<br>\nNow you know how it’s been for me with cryptographically relevant quantum computing.<br>\nI’ve been writing about QC on this blog for a while, and have done hundreds of public lectures and interviews and podcasts on the subject. By now, I can almost always predict where a non-expert’s QC question is going from its first few words, and have a well-rehearsed answer ready to go the moment they stop talking. Yet sometimes I feel like it’s all for naught.<br>\nOnly today did it occur to me that I should write about something more basic. Not quantum computing itself, but the habits of mind that seem to prevent some listeners from hearing whatever I or other researchers have to tell them about QC. The stuff that we’re wasting our breath if we don’t get past.<br>\nWhich habits of mind am I talking about?<br>\n- The Tyranny of Black and White. Hundreds of times, I’ve answered someone’s request to explain QC, only to have them nod impatiently, then interrupt as soon as they can with: “So basically, the take-home message is that quantum is coming, and it’ll change everything?” Someone else might respond to exactly the same words from me with: “So basically, you’re saying it’s all hype and I shouldn’t take any of it seriously?” As in my wolf allegory, the same person might even jump from one reaction to the other. Seeing this, I’ve become a fervent believer in horseshoe theory, in QC no less than in politics. Which sort of makes sense: if you think QCs are “the magic machines of the future that will revolutionize everything,” and then you learn that they’re not, why wouldn’t you jump to the opposite extreme and conclude you’ve been lied to and it’s all a scam?<br>\n- The Unidimensional Hype-Meter. “So … [long, thoughtful pause] … you’re actually telling me that some of what I hear about QC is real … but some of it is hype? Or—yuk yuk, I bet no one ever told you this one before—it’s a superposition of real and hype?” OK, that’s better. But it’s still trying to project everything down onto a 1-dimensional subspace that loses almost all the information!<br>\n- Words As Seasoning. I often get the sense that a listener is treating all the words of explanation—about amplitudes and interference, Shor versus Grover, physical versus logical qubits, etc.—as seasoning, filler, an annoying tic, a stalling tactic to put off answering the only questions that matter: “is Quantum real or not real? If it’s real, when is it coming? Which companies will own the Quantum space?” In reality, explanations are the entire substance of what I can offer. For my experience has consistently been that, if someone has no interest in learning what QC is, which classes of problems it helps for, etc., then even if I answer their simplistic questions like “which QC companies are good or bad?,” they won’t believe my answers anyway. Or they’ll believe my answers only until the next person comes along and tells them the opposite.<br>\n- Black-Boxing. Sometimes these days, I’ll survey the spectacular recent progress in fault-tolerance, 2-qubit gate fidelities, programmable hundred-qubit systems, etc., only to be answered with a sneer: “What’s the biggest number that Shor’s algorithm has factored? Still 15 after all these years? Haha, apparently the emperor has no clothes!” I’ve commented that this is sort of like dismissing the Manhattan Project as hopelessly stalled in 1944, on the ground that so far it hasn’t produced even a tiny nuclear explosion. Or the Apollo program in 1967, on the ground that so far it hasn’t gotten any humans even 10% of the way to the moon. Or GPT in 2020, on the ground that so far it can’t even do elementary-school math. Yes, sometimes emperors are naked—but you can’t tell until you actually look at the emperor! Engage with the specifics of quantum error correction. If there’s a reason why you think it can’t work beyond a certain scale, say so. But don’t fixate on one external benchmark and ignore everything happening under the hood, if the experts are telling you that under the hood is where all the action now is, and your preferred benchmark is only relevant later.<br>\n- Questions with Confused Premises. “When is Q-Day?” I confess that this question threw me for a loop the first few times I heard it, because I had no idea what “Q-Day” was. Apparently, it’s the single day when quantum computing becomes powerful enough to break all of cryptography? Or: “What differentiates quantum from binary?” “How will daily life be different once we all have quantum computers in our homes?” Try to minimize the number of presuppositions.<br>\n- Anchoring on Specific Marketing Claims. “What do you make of D-Wave’s latest quantum annealing announcement?” “What about IonQ’s claim to recognize handwriting with a QC?” “What about Microsoft’s claim to have built a topological qubit?” These questions can be fine as part of a larger conversation. Again and again, though, someone who doesn’t know the basics will lead with them—with whichever specific, contentious thing they most recently read. Then the entire conversation gets stuck at a deep node within the concept tree, and it can’t progress until we backtrack about five levels.<br>\nAnyway—sorry for yet another post of venting and ranting. Maybe this will help:<br>\nThe wise child asks, “what are the main classes of problems that are currently known to admit superpolynomial quantum speedups?” To this child, you can talk about quantum simulation and finding hidden structures in abelian and occasionally nonabelian groups, as well as Forrelation, glued trees, HHL, and DQI—explaining how the central challenge has been to find end-to-end speedups for non-oracular tasks.<br>\nThe wicked child asks, “so can I buy a quantum computer right now to help me pick stocks and search for oil and turbocharge LLMs, or is this entire thing basically a fraud?” To this child you answer: “the quantum computing people who seek you as their audience are frauds.”<br>\nThe simple child asks, “what is quantum computing?” You answer: “it’s a strange new way of harnessing nature to do computation, one that dramatically speeds up certain tasks, but doesn’t really help with others.”<br>\nAnd to the child who doesn’t know how to ask—well, to that child you don’t need to bring up quantum computing at all. That child is probably already fascinated to learn classical stuff.<\/p>","content_hash":"72007a1f3676037b97132297c7112642","author":"Scott","published_at":"2026-04-07T07:51:11","fetched_at":"2026-04-13 19:10:00","word_count":1170,"read_time_minutes":6,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"6d","domain":"scottaaronson.blog"},{"id":"c438f8ead87c93df","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9665","title":"Quantum computing bombshells that are not April Fools","url":"https://scottaaronson.blog/?p=9665","summary":"For those of you who haven&#8217;t seen, there were actually two “bombshell” QC announcements this week. One, from Caltech, including friend-of-the-blog John Preskill, showed how to do quantum fault-tolerance with lower overhead than was previously known, by using high-rate codes, which could work for example in neutral-atom architectures (or possibly other architectures that allow nonlocal operations, like trapped ions). The second bombshell, from Google, gave a lower-overhead implementation of","content":"<p>Quantum computing bombshells that are not April Fools<br>\nFor those of you who haven’t seen, there were actually two “bombshell” QC announcements this week. One, from Caltech, including friend-of-the-blog John Preskill, showed how to do quantum fault-tolerance with lower overhead than was previously known, by using high-rate codes, which could work for example in neutral-atom architectures (or possibly other architectures that allow nonlocal operations, like trapped ions). The second bombshell, from Google, gave a lower-overhead implementation of Shor’s algorithm to break 256-bit elliptic curve cryptography.<br>\nNotably, out of an abudance of caution, the Google team chose to “publish” its result via a cryptographic zero-knowledge proof that their circuit exists (so, without revealing the details to attackers). This is the first time I’ve ever seen a new mathematical result actually announced that way, although I understand that there’s precedent in the 1500’s, when mathematicians would (for example) prove their ability to solve quartic equations by challenging their rivals to duels. I’m not sure how much it will actually help, as once other groups know that a smaller circuit exists, it might be only a short time until they’re able to find it as well.<br>\nNeither of these results change the basic principles of QC that we’ve known for decades, but they do change the numbers.<br>\nWhen you put both of them together, Bitcoin signatures for example certainly look vulnerable to quantum attack earlier than was previously known! In particular, the Caltech group estimates that a mere 25,000 physical qubits might suffice for this, where a year ago the best estimates were in the millions. How much time will this save — maybe a year? Subtracting, of course, off a number of years that no one knows.<br>\nIn any case, these results provide an even stronger impetus for people to upgrade now to quantum-resistant cryptography. They—meaning you, if relevant—should really get on that!<br>\nWhen I got an early heads-up about these results—especially the Google team’s choice to “publish” via a zero-knowledge proof—I thought of Frisch and Peierls, calculating how much U-235 was needed for a chain reaction in 1940, but not publishing it, even though the latest results on nuclear fission had been openly published just the year prior. Will we, in quantum computing, also soon cross that threshold? But I got strong pushback on that analogy from the cryptography and cybersecurity people who I most respect. They said: we have decades of experience with this, and the answer is that you publish. And, they said, if publishing causes people still using quantum-vulnerable systems to crap their pants … well, maybe that’s what needs to happen right now.<br>\nNaturally, journalists have been hounding me for comments, though it was the worst possible week, when I needed to host like four separate visitors in Austin. I hope this post helps! Please feel free to ask questions or post further details in the comments.<br>\nAnd now, with no time for this blog post to leaven and rise, I need to go home for my family’s Seder. Happy Passover!<\/p>","content_hash":"bb5c09559d708b61528f47f936ea5498","author":"Scott","published_at":"2026-04-01T21:26:47","fetched_at":"2026-04-13 19:10:00","word_count":504,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"154b16074c21acc9","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9656","title":"Movie Review: “The AI Doc”","url":"https://scottaaronson.blog/?p=9656","summary":"Yesterday Dana, the kids, and I went to the theater to watch The AI Doc: Or How I Became An Apocaloptimist, the well-reviewed new documentary about whether AGI will destroy the world. This was surely the weirdest family movie night we’ve ever done. Firstly, because I personally know probably half of the many people interviewed in the film, from Eliezer Yudkowsky to Ajeya Cotra to Liv Boeree to Daniel Kokotajlo to Ilya Sutskever to Jan Leike to Yoshua Bengio to Shane Legg to Sam Altman and Dario ","content":"<p>Movie Review: “The AI Doc”<br>\nYesterday Dana, the kids, and I went to the theater to watch The AI Doc: Or How I Became An Apocaloptimist, the well-reviewed new documentary about whether AGI will destroy the world. This was surely the weirdest family movie night we’ve ever done. Firstly, because I personally know probably half of the many people interviewed in the film, from Eliezer Yudkowsky to Ajeya Cotra to Liv Boeree to Daniel Kokotajlo to Ilya Sutskever to Jan Leike to Yoshua Bengio to Shane Legg to Sam Altman and Dario Amodei. But more importantly, because this is a documentary that repeatedly, explicitly, earnestly raises the question of whether children now alive will make it to adulthood, before unaligned AI kills them and everyone else. So pass the popcorn, kiddos!<br>\n(We did have popcorn. And if the kids were scared — well, I figured we can’t shield them forever from the great questions of the world they’re entering. But actually they didn’t seem especially scared.)<br>\nI thought that the filmmaker, Daniel Roher, did about as good a job as can be done, in fitting into a 100-minute film a question that honestly seems too gargantuan for any film — the question of the future of life on earth. He tries to hear out every faction: first the AI existential risk people, then the AI optimists and accelerationists like “Beff Jezos,” then the “stochastic parrot” / “current harms” people like Emily Bender and Timnit Gebru, and finally the AI company CEOs (Altman, Amodei, and Hassabis were the three who agreed to be interviewed), with Yuval Noah Harari showing up from time to time to insert deepities.<br>\nRoher plays the part of an anxious, curious, uninformed everyman, who finds each stance to be plausible enough while he’s listening to it, and who mostly just wants to know what kind of world his soon-to-be-born son (about whom we get regular updates) will grow up in.<br>\nI didn’t think all the interviewees were equally cogent or equally deserved a hearing. But if any viewers were actually new to AI discourse, rather than marinated in it like me, the film would serve for them as an excellent introduction to the parameters of current debate (for better or worse) and to some of the leading representatives of each camp.<br>\nIf I had to summarize Roher’s conclusion, it would be something like: go ahead, enjoy your life, have children if you want, but understand that now is a time of world-historical promise and peril much like the early nuclear age, so pay attention, and demand of your elected leaders that they ensure that AGI is developed in a pro-human direction, because tech leaders (even the relatively well-intentioned ones) are trapped in a race to the bottom and can’t get out on their own. Honestly, I’d have a pretty hard time improving on that message.<br>\nThe main thing that gave me pause about the film was not on the screen but in the theater, which was nearly empty. For the film to serve its purpose, a significant fraction of the world will need to see and discuss it, either in the theater or on streaming. So, y’know, it’s still playing.<br>\nFor whatever it’s worth, here were my wife Dana’s comments: “The biggest flaw of this movie is that Daniel Roher never breaks out of his ‘clueless everyman’ character, even when he’s talking to the most important people in AI. He wastes an opportunity to ask them non-superficial questions, questions deeper than ‘so, uh, are we all gonna die or not?'”<br>\nAnd here were my 13-year-old daughter’s comments: “So many of the people they interviewed seemed like hippies, who don’t know what AI will do any more than I know!” Also, after Daniel Roher wishes Sam Altman mazel tov on his forthcoming baby: “Sam Altman is Jewish?!”<br>\nAnd here were my 9-year-old son’s comments: “I thought this would be a movie, where AI would try to take over and the humans would fight back! I had no idea it would just be people talking about it. The documentary kind of movie is so, so, so boring.”<\/p>","content_hash":"a72081d2ff4424d77337b75a185db752","author":"Scott","published_at":"2026-03-29T21:56:12","fetched_at":"2026-04-13 19:10:00","word_count":688,"read_time_minutes":4,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"df4e003a3ec454ca","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9650","title":"My theoretical computer science notes from Epsilon Camp","url":"https://scottaaronson.blog/?p=9650","summary":"Last summer, I was privileged to teach a two-week course on theoretical computer science to exceptional 11- and 12-year-olds at Epsilon Camp, held at Washington University in St. Louis. The course was basically a shorter version of the 6.045 course that I used to teach to undergrads at MIT. I was at Epsilon Camp to accompany my son Daniel, who attended a different course there, for the 7- and 8-year-olds. So they got me to teach while I was there. Teaching at Epsilon was some of the hardest work","content":"<p>My theoretical computer science notes from Epsilon Camp<br>\nLast summer, I was privileged to teach a two-week course on theoretical computer science to exceptional 11- and 12-year-olds at Epsilon Camp, held at Washington University in St. Louis. The course was basically a shorter version of the 6.045 course that I used to teach to undergrads at MIT.<br>\nI was at Epsilon Camp to accompany my son Daniel, who attended a different course there, for the 7- and 8-year-olds. So they got me to teach while I was there.<br>\nTeaching at Epsilon was some of the hardest work I’ve done in years: I taught two classes, held office hours, and interacted with or supervised students for 6-7 hours per day (compared to ~4 hours per week as a professor), on top of being Daniel’s sole caregiver, on top of email and all my other normal responsibilities. But it was also perhaps the most extraordinary teaching I’ve ever done: during “lecture,” the kids were throwing paper planes, talking over and interrupting me every ten seconds, and sometimes getting in physical fights with each other. In my ~20 years as a professor, this was the first time that I ever needed to worry about classroom discipline (!). It gave me newfound respect for what elementary school teachers handle every day.<br>\nBut then, when I did have the kids’ attention, they would often ask questions or make observations that I would’ve been thrilled to hear from undergrads at UT Austin or MIT. Some of these kids, I felt certain, can grow up if they want to be world-leading mathematicians and physicists and computer scientists, Terry Taos and Ed Wittens of their generation. Or at least, that’ll be true if AI isn’t soon going to outperform the top human scientists at their own game, a prospect that of course casts a giant shadow not only over Epsilon Camp but over our entire enterprise. But enough about the future. For now I can say: it was a privilege of a lifetime to teach these kids, to be the one who first introduced them to theoretical computer science.<br>\nOr at least, the one who first systematically introduced them. As I soon realized, there was no topic I could mention—not the halting problem or the Busy Beaver function, not NP-completeness or Diffie-Hellman encryption—that some of these 11-year-olds hadn’t previously seen, and that they didn’t want to interrupt me to share everything they already knew about. Rather than fighting that tendency, I smiled and let them do this. While their knowledge was stunningly precocious, it was also fragmentary and disjointed and weirdly overindexed on examples rather than general principles. So fine, I still had something to teach them!<br>\nComing to Epsilon Camp was also an emotional experience for me. When I was 15, I attended Canada/USA Mathcamp 1996, the first year that that camp operated. I might not have gone into research otherwise. Coming from a public high school—from the world of English teachers who mainly cared whether you adhered to the Five Paragraph Format, and chemistry teachers who’d give 0 on right answers if you didn’t write “1 mol / 1 mol” and then cross off both of the moles—I was suddenly thrust, sink or swim, into a course on elliptic curves taught by Ken Ribet, who’d played a major role in the proof of Fermat’s Last Theorem that had just been completed, and a talk on algorithms and complexity by Richard Karp himself, and lectures on number theory by Richard Guy, who had stories from when he knew G. H. Hardy.<br>\nBack when I was 15, I got to know George Rubin Thomas, the founding director of Mathcamp … and then, after 29 years, there he was again at Epsilon Camp—the patriarch of a whole ecosystem of math camps—and not only there, but sitting in on my course. Also at Epsilon Camp, unexpectedly, was a woman who I knew well back when we were undergrads at Cornell, both of took taking the theoretical computer science graduate sequence, but who I’d barely seen since. She, as it turned out, was accompanying her 8-year-old son, who got to know my 8-year-old. They played together every day and traded math facts.<br>\nIt occurred to me that the course I taught, on theoretical computer science, was one of the most accessible I’ve ever done, and therefore more people might be interested. So I advertised on this blog for someone to help me LaTeX up the notes for wider distribution. I was thrilled to find a talented student to volunteer. Alas, because of where that student lives, he needs to stay anonymous for now. I thank him, pray for his safety, and hope to be able to reveal his name in the future. I’m also thrilled to have gotten three great high school students—Ian Ko, Tzak Lau, and Sunetra Rao—to help with the figures. Thanks to them as well.<br>\nYou can read the notes here [59 pages, PDF]<br>\nIf you’re curious, here’s the table of contents:<br>\n- Lecture 1: Bits<br>\n- Lecture 2: Gates<br>\n- Lecture 3: Finite Automata<br>\n- Lecture 4: Turing Machines<br>\n- Lecture 5: Big Numbers<br>\n- Lecture 6: Complexity, or Number of Operations<br>\n- Lecture 7: Polynomial vs. Exponential<br>\n- Lecture 8: The P vs. NP Problem<br>\n- Lecture 9: NP-completeness<br>\n- Lecture 10: Foundations of Cryptography<br>\n- Lecture 11: Public-Key Cryptography and Quantum Computing<br>\nHappy as always to receive comments and corrections. Enjoy!<\/p>","content_hash":"53719557c9ea91fa6dbbe258567653ce","author":"Scott","published_at":"2026-03-29T05:17:35","fetched_at":"2026-04-13 19:10:01","word_count":906,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"538651b2b94946d2","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9642","title":"Congrats to Bennett and Brassard on the Turing Award!","url":"https://scottaaronson.blog/?p=9642","summary":"I&#8217;m on a spring break vacation-plus-lecture-tour with Dana and the kids in Mexico City this week, and wasn&#8217;t planning to blog, but I see that I need to make an exception. Charles Bennett and Gilles Brassard have won the Turing Award, for their seminal contributions to quantum computing and information including the BB84 quantum key distribution scheme. This is the first-ever Turing Award specifically for quantum stuff (though previous Turing Award winners, including Andy Yao, Leslie ","content":"<p>Congrats to Bennett and Brassard on the Turing Award!<br>\nI’m on a spring break vacation-plus-lecture-tour with Dana and the kids in Mexico City this week, and wasn’t planning to blog, but I see that I need to make an exception. Charles Bennett and Gilles Brassard have won the Turing Award, for their seminal contributions to quantum computing and information including the BB84 quantum key distribution scheme. This is the first-ever Turing Award specifically for quantum stuff (though previous Turing Award winners, including Andy Yao, Leslie Valiant, and Avi Wigderson, have had quantum among their interests).<br>\nAs a practical proposal, BB84 is already technologically feasible but has struggled to find an economic niche, in a world where conventional public-key encryption already solves much the same problem using only the standard Internet—and where, even after scalable quantum computers become able to break many of our current encryption schemes, post-quantum encryption (again running on the standard Internet) stands ready to replace those schemes. Nevertheless, as an idea, BB84 has already been transformative, playing a central role in the birth of quantum information science itself. Beyond BB84, Bennett and Brassard have made dozens of other major contributions to quantum information science, with a personal favorite of mine being the 1994 BBBV (Bennett Bernstein Brassard Vazirani) paper, which first established the limitations of quantum computers at solving unstructured search problems (and indeed, proved the optimality of Grover’s algorithm even before Grover’s algorithm had been discovered to exist).<br>\nWhile I take my kids to see Aztec artifacts, you can learn much more from Ben Brubaker’s Quanta article, to which I contributed without even knowing that it would be about Bennett and Brassard winning the Turing Award (info that was strictly embargoed before today). It’s an honor to have known Charlie and Gilles as well as I have for decades, and to have been able to celebrate one of their previous honors, the Wolf Prize, with them in Jerusalem. Huge congrats to two of the founders of our field!<\/p>","content_hash":"1712e4164a61e65b13301aa257c49cde","author":"Scott","published_at":"2026-03-18T16:10:13","fetched_at":"2026-04-13 19:10:01","word_count":332,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"c4b5878017fa9376","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9630","title":"On Montgomery County public magnet schools: a guest post by Daniel Gottesman","url":"https://scottaaronson.blog/?p=9630","summary":"Scott&#8217;s foreword: I&#8217;ve known fellow quantum computing theorist Daniel Gottesman, now at the University of Maryland, for a quarter-century at this point. Daniel has been a friend, colleague, coauthor, and one of the people from whom I&#8217;ve learned the most in my career. Today he writes about a topic close to my heart, and one to which I&#8217;ve regularly lent this blog over the decades: namely, the struggle to protect enrichment and acceleration in the United States (in this case","content":"<p>On Montgomery County public magnet schools: a guest post by Daniel Gottesman<br>\nScott’s foreword: I’ve known fellow quantum computing theorist Daniel Gottesman, now at the University of Maryland, for a quarter-century at this point. Daniel has been a friend, colleague, coauthor, and one of the people from whom I’ve learned the most in my career. Today he writes about a topic close to my heart, and one to which I’ve regularly lent this blog over the decades: namely, the struggle to protect enrichment and acceleration in the United States (in this case, the public magnet programs in Montgomery County, Maryland) from the constant attempts to weaken or dismantle them. Thanks so much to Daniel for doing this, and please help out if you can!<br>\nWithout further ado, Daniel Gottesman:<br>\nScott has kindly let me write this guest post because I’d like to ask the readers of Shtetl-Optimized for help. I live in Montgomery County, Maryland, and the county is getting ready to replace our current handful of great magnet programs with a plethora of mediocre ones.<br>\nMontgomery County has a generally quite good school system, but its gifted education programs are really inadequate at the elementary and middle school level. Montgomery County Public Schools (MCPS) offers nothing at all for gifted children until 4th grade. Starting in 4th grade, magnet programs are available, but there are not enough spaces for everyone who meets the minimum qualifications. A few years ago, the elementary and middle school magnets were switched to a lottery system, meaning the highest-achieving students, who most need special programming, might or might not get in, based purely on luck of the draw.<br>\nThe remaining bright spot has been the high school magnets. Montgomery County has two well-known and high-performing magnets, a STEM magnet at Montgomery Blair high school and an International Baccalaureate (IB) program at Richard Montgomery. The Richard Montgomery IB program draws students from the whole county and the Blair Magnet draws from 2/3 of the county (with the remaining 1/3 eligible to go to another successful but less well-known magnet at Poolesville). And these programs have so far resisted the lottery: They pick the best students from the application pool.<br>\nSo with inadequate magnets in the lower grades and stellar magnets in high school, you can guess which one is up for a change.<br>\nMCPS now wants to reconfigure the high school magnet programs by splitting the county up into 6 regions. Students will only be allowed to apply to programs in their home region. Each region will have its own STEM magnet and its own IB program, as well as programs in the arts, medicine, and leadership. And actually there are multiple program strands in each of these subjects, sometimes in different schools. The whole plan is big and complicated, with close to 100 different programs around the county, more than half of them new.<br>\nThe stated purpose of this plan is to expand access to these programs by admitting more students and reducing travel times to the programs. And who could object to that? There are definitely places in the county that are far from the current magnets and there are certainly more students that can benefit from high-quality magnets than there is currently space for.<br>\nThe problem is that making high-quality magnets has not been a priority in the design process. The last time MCPS tried adding regional magnets was about 7 years ago, when they added 3 regional IB programs while keeping Richard Montgomery available to students all over the county. It was a failure: Test scores at the regional IB programs are far below those at Richard Montgomery (the worst-performing regional IB had only 24% getting a passing grade in even one subject in 2024, compared to 99% at Richard Montgomery) and all 3 are underenrolled. Now MCPS has decided they can solve this problem by preventing students from going to Richard Montgomery to try to force them to go to the regional IBs. In addition, they want to repeat the same mistakes with the STEM and other magnets. The best programs in the county will shrink and only be accessible to a small fraction of students, leaving everyone else with new programs of likely highly-varying quality.<br>\nAnd if that were not enough, they want to do this revamp on a ridiculously short timeline. The new programs are supposed to start in the 2027-8 school year, and between now and then, they need to recruit and train teachers for these 100 programs, create all the curricula for the first year of the programs (they are only planning to do one year at a time), and much much more. The probability of a train wreck in the early years of the new system seems high.<br>\nEquity is certainly a concern driving this change. And let me be clear: I am totally in favor of improving equity in the school system. But I agree with Scott on this point: strong magnet programs in the public schools are pro-equity and weakening magnet programs is anti-equity. Magnet programs are pro-equity even if the magnets are disproportionally populated by more affluent students, which is admittedly the case in MCPS: Affluent students will always have access to enrichment outside school and to private schools for the most affluent, whereas the public magnet programs are the only source of enrichment for those without those resources.<br>\nIf MCPS really wants to address the difference in achievement between richer and poorer students, the way to do that is to create gifted programming starting from kindergarten. If you wait until high school, it is unreasonable to expect even brilliant students to catch up to their also highly-capable peers who have been doing math and science camps and extracurriculars and contests and whatnot since they were little. Some can manage it, but it is certainly not easy. Unfortunately, MCPS’s notion of equity seems more focused on optimizing the demographic breakdown of magnet programs, which is most easily achieved by techniques which don’t improve — and usually degrade — the quality of the education provided.<br>\nSo how can you help? The Board of Education (BOE) is supposed to vote on this plan on Mar. 26. Those of us opposed to it are hoping to sway enough members to vote to tell MCPS to investigate alternatives. For instance, I have proposed a model with only 3 regions, which could also substantially improve access while preserving the strong existing magnets.<br>\nIf you live in Montgomery County, write to BOE members telling them you oppose this change. You can also sign a petition — there are many, but my favorite is here.<br>\nIf you are an alumnus of one of the MCPS magnets, write to the BOE telling them how your education there was valuable to you and how a smaller program would not have served you as well.<br>\nIf you are unconnected to Montgomery County, you can still spread the word. If the BOE gets enough press inquiries asking about the many things that don’t add up in the MCPS proposal, perhaps they will recognize that this is a bad idea.<br>\nIf you are really really interested in this topic and want to learn more: Last fall, I put together a long analysis of some of the flaws in MCPS’s plan and their claims, and of the alternative 3-region model. You can find it here.<\/p>","content_hash":"de65f8ebbf9310166ed47890d33c1ec7","author":"Scott","published_at":"2026-03-15T01:42:54","fetched_at":"2026-04-13 19:10:02","word_count":1230,"read_time_minutes":7,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"4w","domain":"scottaaronson.blog"},{"id":"63d6aa7a56a8434d","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17888","title":"The FeMo-cofactor and classical and quantum computing","url":"https://quantumfrontiers.com/2026/03/12/the-femo-cofactor-and-classical-and-quantum-computing/","summary":"Recently, my coworkers and I put out a preprint “Classical solution of the FeMo-cofactor model to chemical accuracy and its implications’’&nbsp;(Zhai et al. 2026). It is a bit unusual to write commentary on one’s own scientific article. However, in this case, given the many inquiries I have had about the work in the context of quantum computing, many of which have contained similar questions (and often similar misunderstandings), I thought it would be useful to provide some perspective that we c","content":"<p>Recently, my coworkers and I put out a preprint “Classical solution of the FeMo-cofactor model to chemical accuracy and its implications’’ (Zhai et al. 2026). It is a bit unusual to write commentary on one’s own scientific article. However, in this case, given the many inquiries I have had about the work in the context of quantum computing, many of which have contained similar questions (and often similar misunderstandings), I thought it would be useful to provide some perspective that we could not provide in the original preprint, in an informal manner.<br>\nWhat is FeMo-co?<br>\nI will start with some background on the FeMo-cofactor (FeMo-co). This cofactor is the reaction center of nitrogenase, an enzyme found in certain soil-dwelling bacteria. Nitrogenase’s claim to fame is that it converts atmospheric dinitrogen, which is held together by a strong N-N triple bond, into a reduced form (ammonia) which can then be taken up by plants and thereby be passed onto the rest of the living biomass. In terms of incorporating nitrogen into biomass, nitrogenase is believed to be responsible for about 2/3 of biological nitrogen, with the remainder coming from fertilizers. Because it plays this critical role, it is sometimes referred to as the enzyme that feeds the planet.<br>\nThe chemistry of how dinitrogen is reduced at the FeMo-cofactor is still largely unknown. The basic stoichiometry of the reaction is often written as<br>\nbut this just a sketch of the process. In particular, the above equation contains, nominally, a large number of molecular reactants, and clearly they do not all just come together in a bang! The role of the cofactor, and the enzyme more generally, is to coordinate the protons, electrons, biological energy source (ATP), and the dinitrogen molecule, into a sequence of well-defined steps, known as the reaction mechanism. Since the work of Lowe and Thorneley (Thorneley and Lowe 1984), the most common proposal for the nitrogenase reaction mechanism contains 8 intermediate steps (corresponding roughly to 8 sequential proton and electron additions). However, due to the difficulty in isolating the intermediate states of FeMo-co, as well as challenges in using experimental probes to deduce what these states are, the Lowe-Thorneley cycle still remains an unproven hypothesis. Biochemists, spectroscopists, as well as a few theoretical quantum chemists, are today actively engaged in observing, computing, deducing (and arguing about) the nitrogenase mechanism (Jiang and Ryde 2023; Lancaster et al. 2011; Einsle and Rees 2020; Badding et al. 2023; Thorhallsson et al. 2019).<br>\nSo how did nitrogenase become so widely discussed in the setting of quantum computing? In 2016, an article “Elucidating reaction mechanisms on quantum computers’’, that has since become one of the most cited papers in the nitrogenase field, arguably started this all (Reiher et al. 2017). The article included a number of proposals, including (1) that the ‘promise of exponential speedups for the electronic structure problem’ could be applied to elucidate the nitrogenase reaction mechanism that had so far proved intractable for classical computation, and (2) that solving this problem would be an example of how quantum simulation could be ‘scientifically and economically impactful’. (Similar proposals can also be found repeated in less technical language and settings, see e.g. ‘Why do we want a quantum computer’). An important technical contribution of the article was to provide a detailed quantum resource estimate for a simulation of chemistry. The problem statement was to compute the ground-state energy of a specific ‘54 orbital’ (108 qubit) model of FeMo-co, to an accuracy of 1 kcal/mol, referred to as chemical accuracy. It is important to note the word ‘model’ in the problem statement. Electrons move in continuous space, and thus quantum chemical Hamiltonians are formulated in the continuum, while quantum computation requires discretization of this space. This discretization, in terms of a so-called active space set of orbitals that the electrons can variously occupy, constitutes the model. We will return to the definition of the model below. By compiling a Trotter-Suzuki implementation of the quantum phase estimation algorithm within a fault-tolerant resource model for their specific FeMo-co model Hamiltonian, Ref. (Reiher et al. 2017) provided a T-gate resource estimate. Combined with some assumptions about the quantum architecture, this provided perhaps the first concrete time-cost to solve an interesting chemistry problem on a quantum computer. This work has since served as an inspiration for many subsequent quantitative resource estimation efforts in the quantum computing for chemistry field.<br>\nExponential speedup and societal impact<br>\nBefore proceeding further in this story, it is worth examining the two key propositions made in Ref. (Reiher et al. 2017). I start with the question of exponential speedup. Quantum algorithms for the ground-state energy, such as quantum phase estimation, essentially perform a projective measurement of the energy (encoded in a phase). Thus, it is essential to prepare a good initial state, i.e. with large overlap with the desired eigenstate, to measure the correct energy. This, however, is a strong constraint, if we are seeking asymptotically large quantum advantage. For example, if such an initial state is first determined classically, as is often suggested, then exponential quantum advantage in a given problem requires that finding good classical guesses is easy, while improving them classically to fully solve the problem becomes exponentially hard as the problem size increases. Unfortunately, convincing evidence that chemically relevant electronic structure problems, including the problem of cofactor electronic structure exemplified by FeMo-co, fall into this category has not yet been found, as discussed in detail in Refs. (Lee et al. 2023; Chan 2024).<br>\nThe second proposition, that elucidating the reaction mechanism of nitrogenase will lead to a transformative societal impact, is similarly nuanced. The claim originates in the observation that the competing industrial process for fertilizer production via nitrogen reduction, namely, the Haber-Bosch process, takes place at high temperatures and pressures and consumes a significant percentage of the world’s energy. Bacteria, on the other hand, can do this process at room temperature.<br>\nWhile it is true that the nitrogenase enzyme functions at ambient temperature and pressure, it is simply false that it consumes much less energy. This is because the large amount of energy required for nitrogen fixation mainly originates from thermodynamics, i.e. one needs energy to break the strong nitrogen triple bond. In fact, taking into account the physiological conditions and the ATP cost, bacteria arguably expend more energy to reduce ammonia (Chan 2024) than a modern efficient industrial implementation of the Haber-Bosch process. Thus the real hope behind trying to understand the nitrogenase mechanism in the context of societal impact is that we may one day engineer a variant of it with more desirable properties, e.g. with higher turnover, or with a lower carbon footprint, or which is more selective for nitrogen reduction. Whether this is actually possible remains to be seen, and certainly requires much more than knowing the ground-state of FeMo-co, or even the full reaction mechanism.<br>\nWhich FeMo-cofactor model?<br>\nI now return to the question of FeMo-cofactor models. Ref. (Reiher et al. 2017) introduced a particular cofactor model, which I will refer to it as RWST, following the names of the authors. As we soon found out, simulating the ground-state of the RWST model was actually very easy classically, and in fact (as reported in (Li et al. 2019)) could be done using standard quantum chemistry methods with a few hours of calculation on a laptop. This was because although the RWST model was a 108 qubit model, and (in the worst case) a 108 qubit ground-state cannot be stored classically, the RSWT model Hamiltonian was constructed in such a way to not capture any of the difficult features of the FeMo-cofactor ground-state. This highlights the importance of not assuming worst case complexity about physical problems!<br>\nWhat makes the electronic structure of the FeMo-cofactor (relatively) complicated is the presence of many ‘unpaired’ electrons. In simple molecules, we can describe the ground-state as one where all the electrons sit in pairs in orbitals. Since an orbital can only carry a pair of electrons at a time, the ground-state is simply described by filling the lowest energy orbitals with pairs. However, in molecules with transition metals, there are typically ‘unpaired’ electrons (so-called open-shells), and then we need to consider whether and how they pair up, which orbitals are singly versus doubly occupied, and so on. The RSWT model ground-state had no unpaired electrons! It was therefore unrepresentatively easy to solve for the ground state classically.<br>\nBecause of the problems with the RWST model, my group formulated a more suitable 76 orbital/152 qubit model of FeMo-co in Ref. (Li et al. 2019), which I will refer to as the LLDUC model, again by the names of the authors. Although the LLDUC model is still a significant truncation of the true electronic structure of FeMo-co, we verified that it contains the correct open-shell character of the cofactor, and thus has a ‘representative’ complexity in its ground-state. Since we published the LLDUC model, it has become the most common benchmark model of FeMo-co used in quantum resource estimates for new quantum chemistry ground-state algorithms (Wan et al. 2022; Berry et al. 2019; Luo and Cirac 2025; Low et al. 2025).<br>\nHeuristics in the classical solution of the LLDUC FeMo-cofactor model<br>\nThis brings me now to the recent work in Ref. (Zhai et al. 2026), where, through a sequence of classical calculations, we could produce a classical estimate of the ground-state energy of the LLDUC model to chemical accuracy. How was this achieved?<br>\nClassical electronic structure methods (aside from exact diagonalization) are heuristic algorithms. Much like quantum algorithms, they implicitly or explicitly start from an initial state. In chemical applications, this can be viewed as a product state or set of product states: for tensor network algorithms, such as the density matrix renormalization group (when not considering topological order) this is the set of states (specified by the underlying basis) which connect to the space of slightly entangled states with that the algorithm naturally explores. In coupled cluster methods, this is the initial reference state to which excitations are applied. Although many classical heuristics are exact with exponential effort, e.g. by increasing the bond dimension in a tensor network or excitation level in coupled cluster theory, in practical computational chemistry, classical heuristics are used with the assumption that so long as the initial state is chosen appropriately, they will converge rapidly to the true ground-state without exponential effort. I analyze this heuristic working assumption in Ref. (Chan 2024) where I name it the classical heuristic cost conjecture. However, finding the good classical initial state is an NP hard problem, and this is often the crux of where the challenge in simulation actually lies.<br>\nIn FeMo-co, unlike in simpler molecules, it is not at all obvious what product state to start from. To address this, in Ref. (Zhai et al. 2026), we devised an enumeration and filtering protocol. The relevant manifold arises from the orbital and spin degrees of freedom of the Fe ions: which Fe orbitals are occupied, by how many electrons, and with which spins. One technical point is that the resulting product states do not generally conserve the global spin symmetry. However, as recognized by Anderson decades ago, for magnetic order in large systems, the eigenstates can be chosen to break symmetry due to the tower of symmetry preserving eigenstates at an energy scale of (where is the system volume). For a finite energy resolution we can equally use a broken symmetry description of the states, an example of the fragility of entanglement effects in physical systems.<br>\nBecause applying the highest level of classical approximation to all enumerated product states was far too expensive, we used a filtering funnel, where product states were ranked at different levels of theory, passing promising candidates to higher levels of classical computation. In the end, the final most accurate calculations were performed on only 3 candidates, which we deduced to all be essentially degenerate to within chemical accuracy.<br>\nThere are other important technical details in Ref. (Zhai et al. 2026) which I have not mentioned: the use of unrestricted orbitals, the systematic extrapolations to obtain the final energies and estimated errors, and the benchmarking required to be confident about the protocol. However, recognizing that the FeMo-co ground-state problem could be reduced essentially to a ranking problem was the essence of what made the estimate possible.<br>\nImplications of the classical solution for chemistry<br>\nFrom a chemical and biochemical perspective, computing the ground-state energy of a model to some specified accuracy – even chemical accuracy – is a highly artificial target. Most chemical calculations that have an impact on our understanding never achieve or even target chemical accuracy in the total energy. In addition, chemistry does not depend on the the total energy, but the relative energy of different chemical configurations, which typically differ only by changes in the bonding and chemistry.<br>\nThe main take-home from our work then is that there is nothing especially mysterious about FeMo-co’s electronic structure. The story of the FeMo-co ground-state is not one of multiconfigurational electronic structure (i.e. where the states are not at all close to product states), but one of multiple configurations (i.e. many competing product states). Indeed, this is basically how nitrogenase chemists have long reasoned about the electronic structure of iron-sulfur clusters and FeMo-co (Lovell et al. 2001; Yamaguchi et al. 1990). Our work thus now provides extensive and rigorous numerical support for this picture.<br>\nBecause of this simplicity, the full richness of classical quantum chemistry methods can now be brought to bear on FeMo-co electronic structure beyond the LLDUC model. Assuming the model already captures the qualitative complexity of the cluster’s electronic structure, we expect such investigations to provide quantitative corrections to the picture we have obtained. We took some initial steps to confirm this in our manuscript, considering larger orbital spaces, the effect of protein fluctuations, and the interpretation of certain spectroscopies. In the future, connecting these simulations to more spectroscopic measurements will be an exciting possibility. In addition, now that the electronic structure is on a conceptually sound footing, we have a foundation to support the central question of resolving the reaction mechanism. This opens up a whole new set of scientific challenges associated with observing reactions on extremely slow timescales.<br>\nImplications of the classical solution for quantum computing in chemistry<br>\nBecause of the success of classical heuristic methods for this problem, one may naturally wonder what these results mean for the application of quantum computers in chemistry. Here I address some commonly asked questions.<br>\nIs the classical simulation of the LLDUC model a ‘last hurrah’ for classical methods?<br>\nI have seen the analogy drawn between the FeMo-co result and the classical tensor network simulations for random circuit sampling experiments. In that case, while the famous Google Sycamore experiment (Arute et al. 2019) could be replicated by classical tensor network simulations (Gray and Kourtis 2021), subsequent improvements in quantum processors, soon led to random circuit sampling experiments outpacing the capabilities of classical simulations.<br>\nHowever, the situation here is quite different. There is strong evidence that generating samples from a random quantum circuit (without noise) is actually exponentially hard to do using a classical algorithm, and indeed, the classical simulations used for the task were (mostly) brute force simulations with exponential cost in circuit size. In contrast, the theoretical support for exponential quantum advantage in the FeMo-co problem is much weaker, and as an empirical fact, most of the methods used in the FeMo-co simulation (namely the coupled cluster methods for a given excitation level) are polynomial cost algorithms. Since a similar simulation strategy has also been successfully applied across the series of 2, 4, and 8 metal iron-sulfur complexes (Sharma et al. 2014; Li et al. 2019; Zhai et al. 2023, 2026), we have no reason to expect a radically different situation if we consider larger analogous complexes in this series.<br>\nAnd in any case, chemistry does not provide an endless scaling of problem size; FeMo-co is the largest enzyme cofactor in terms of the number of transition metals. Materials simulations provide a setting to scale the problem size, but one still faces the question as to whether the relevant states observed are truly that complicated classically. For example, classical simulations of the ground-state orders of the 2D Hubbard model currently show no exponential increase in difficulty when going to larger system sizes (Chen et al. 2025; Liu et al. 2025).<br>\nHas the availability of a classical strategy for FeMo-co changed your enthusiasm for quantum computers in chemistry?<br>\nAgain, my answer is no. There is an entire community of nitrogenase scientists: experimental spectroscopists, synthetic chemists, and of course computational chemists, who are working to map out the reaction mechanism, none of whose research is predicated on using a quantum computer. Personally, I have never thought that to understand nitrogenase we would first have to build a quantum computer, otherwise I would not work on the problem!<br>\nAt the same time, any computational tool brings new capabilities that will be useful. Quantum algorithms come with theoretical guarantees; for example, so long as the initial state is well prepared, we know the error in the energy that we measure from a quantum algorithm, which is more reliable than the classical estimates of error we obtain from extrapolations. Similarly, initial state preparation for a quantum computer, even for classically tractable problems, is probably easier than solving the entire problem classically, since only a ‘rough’ guess is needed. And finally, a polynomial or even constant factor speedup is exciting, so long as the speedup is large enough!<br>\nThus, I am in fact excited to see quantum computers applied to this problem, I am just not waiting for them to be built first.<br>\nHow should one think about past work on quantum algorithms that has used FeMo-co as a target?<br>\nFeMo-co was amongst the earliest examples of a chemical problem for which a case for quantum advantage was made. For this reason, it is overrepresented in the literature of quantum computing for chemistry. Should fully fault-tolerant quantum computers be available, they will naturally be applied to a wider set of systems (Chan 2024; Babbush et al. 2025).<br>\nAlso, one must recognize that the availability of a single concrete optimization target has led to undeniable advances in quantum algorithms for quantum chemistry. In most cases, prior work to improve quantum resources estimates for FeMo-co involve techniques that apply to other systems as well. Thus, there’s no need to throw away those papers!<br>\nWhat are some lessons and conclusions to draw?<br>\nThe first is obviously that, just because something has not been solved, or appears hard to solve classically, does not mean it is the best problem to choose for a quantum computer. The classi
