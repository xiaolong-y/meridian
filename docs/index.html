thing else.<br>\n                <br>\n    - <br>\n                        Example of inappropriate use: The function vanishes for odd arguments.<br>\nCorrected statement: If the argument is odd, the function vanishes.<br>\n    - <br>\n                        Example of inappropriate use: We performed 10 trials for each parameter value.<br>\nCorrected statement: We performed 10 trials per parameter value.<br>\n    - <br>\n                        Example of inappropriate use: The function is smaller for small x values.<br>\nCorrected statement: The function is smaller at small x values.<br>\n  - Write “we evolve the state,” “we measure,” etc. only if you’re an experimentalist who undertakes those actions. Alternatives include “Consider measuring,” “Suppose the system evolves,” and the command tense (e.g., “One can measure this quantity as follows: prepare the qubit in . Evolve it under …”).<br>\n  - The condition defines a regime, not a limit. The conditions and define limits and are inequivalent to .<br>\n  - Write “first,” “second,” “last,” etc., not “firstly,” “secondly,” “lastly,” etc. (I defer in this matter to The Elements of Style.)<br>\n  - Humans can assume, suppose, etc. Mathematical expressions, protocols, etc. can’t.<br>\n  - One multiplies factors together and sums terms. Don’t call factors terms and vice versa.<br>\n  - If you mean “X equals Y,” say so. Don’t write “X agrees with Y,” “X matches Y,” or “we identify X with Y.” The latter three phrases are vaguer, and two of them contain more words, than “X equals Y.”<br>\n  - <br>\n                Regarding the words “general” and “generally”:<br>\n                <br>\n    - A general object subsumes every example of that object. If any example behaves unlike a supposedly general object, don’t call the object general.<br>\n    - <br>\n                        Many claims contain the term “general,” “generally,” or “in general” but don’t need the term.<br>\n                        <br>\n      - Example of a sentence that contains “generally”: The terms generally commute.<br>\n      - Equivalent, more concise sentence: The terms commute.<br>\n    - Physicists tend to use the words “general” and “generic” differently. By “general,” physicists usually mean “subsuming every example.” By “generic,” we usually mean “typical,” or “common.”<br>\n  - <br>\n                “Then” makes sense (i) in discussions of chronology and (ii) in if–then statements. Don’t use “then” outside these contexts.<br>\n                <br>\n    - Example of inappropriate use: “Define Then Y.”<br>\n    - Examples of appropriate alternatives <br>\n      - Define This definition implies Y.<br>\n      - If then Y.<br>\n      - Define such that Y.<br>\n  - Don’t justify any equation with “we used that [such-and-such is true],” which violates the rules of grammar. Grammatically correct alternatives include “We applied [a property],” “The equation follows from [a property],” and “…since [such-and-such is true].”<br>\n  - <br>\n                Regarding tense:<br>\n                <br>\n    - When describing what you’ve accomplished, use only one tense.<br>\n    - Experiments happened in the past, so describe them in the past tense.<br>\n    - <br>\n                        When describing a proof’s steps, use the present tense.<br>\n                        <br>\n      - Example: We Taylor-approximate the function about . Substituting into Eq. (1) yields [equation].<br>\n  - <br>\n                Nouns, verbs, and adjectives should agree about whether a quantity is singular or plural.<br>\n                <br>\n    - Example of singular–plural mismatch: The equations are a rule for evolving the cellular automaton.<br>\n    - Example alternative: The equations form a rule for evolving the cellular automaton.<br>\n  - <br>\n                “Admit of” means “allow for,” or “permit.” The phrase needs the “of.”<br>\n                <br>\n    - Example: The formula admits of the following interpretation.<br>\n  - Use a pronoun only if the reader can identify its antecedent without ambiguity.<br>\n  - “Spin” has many meanings: “a quantum property that resembles angular momentum,” “a particle endowed with that property,” “the observable ,” “the spin quantum number ,” “the observable ” “the magnetic spin quantum number ” and “the observable .” Leave no ambiguity about which object you have in mind.<br>\n  - When referring to an appendix or a supplementary note, specify which you have in mind. Don’t write “the appendix,” “the appendices,” “the supplementary material,” or the like. By guiding the reader more precisely, you’ll smooth their path toward learning more about your work.<br>\n- <br>\n        Punctuation<br>\n        <br>\n  - Consider any list that contains at least three items. If no item contains a comma, separate the items with commas. If any item contains a comma, separate the items with semicolons.<br>\n  - In American English, periods and commas belong inside quotation marks. (Example: She told me, “Have a good day.”) In British English, periods and commas belong outside quotation marks. (Example: She told me, “Have a good day”.)<br>\n  - To write quotation marks in LaTeX, don’t use your keyboard’s quotation-mark key; use the appropriate keys.<br>\n  - <br>\n                Regarding hyphens:<br>\n                <br>\n    - The hyphen (-) feeds into punctuation of three types: the hyphen (-), the en dash (–), and the em dash (—).<br>\n    - The hyphen appears in some compound words, as in “non-negative.”<br>\n    - <br>\n                        In American English, em dashes can separate ideas within a sentence. Don’t separate any em dash from neighboring text with a space.<br>\n                        <br>\n      - Example of appropriate use: The sample—the only product of this experiment—barely survived.<br>\n      - Example of inappropriate use: The sample — the only product of this experiment — barely survived.<br>\n      - Example of appropriate use: He told me only one sample had survived—hardly what I wanted to hear.<br>\n    - <br>\n                        This article specifies how to use the en dash. One use is “to separate the names of two or more people used as a compound modifier.”<br>\n                        <br>\n      - Example: Feynman–Kitaev clock<br>\n    - Hyphenate compound adjectives.<br>\n    - <br>\n                        If an adverb ends in “-ly,” it probably shouldn’t precede a hyphen.<br>\n                        <br>\n      - Example of inappropriate hyphenation: strongly-coupled systems<br>\n    - Follow a prefix with a hyphen if and only if the Physical Review style guide indicates that you should.<br>\n  - A complete clause must follow any semicolon (unless the semicolon separates items in a list).<br>\n- <br>\n        Math<br>\n        <br>\n  - Introduce only necessary notation, which readers will have enough trouble remembering. If a mathematical symbol appears only once, eliminate it. If a symbol appears only twice, try to eliminate it.<br>\n  - Every sentence must obey the rules of English grammar, punctuation, and syntax, regardless of whether the sentence contains mathematical symbols. All math-containing sentences must end with punctuation marks. If a sentence contains a list of mathematical expressions, precede the final expressions with an “and.” If the list contains at least three mathematical expressions, separate them with commas.<br>\n  - Introduce almost every mathematical symbol before you use it. If you introduce a symbol after using it, the reader will encounter the first use, stop, feel confused for a while, tentatively continue, find the definition, return to the earlier use to understand it, and then progress again. This back-and-forth breaks up the reading process. You may define a mathematical symbol after using it only if (i) the symbol is very common, known to nearly all physicists, and unmistakeable and (ii) defining the symbol earlier would disrupt the text’s flow.<br>\n  - <br>\n                If you define a new function, denote it by only one letter. (I defer in this matter to the Physical Review style guide.)<br>\n                <br>\n    - Example:<br>\n    - Examples of disallowed notation: ,<br>\n  - <br>\n                Suppose that a superscript or subscript stands for a word or phrase without representing any variable or constant. The superscript/subscript must not be italicized. (I defer in this matter to Physical Review style guide.)<br>\n                <br>\n    - Example: Let denote the measurement outcome.<br>\n  - <br>\n                If a variable or constant appears in a superscript, parenthesize it. The parentheses communicate that the superscript isn’t an exponent.<br>\n                <br>\n    - Example: Let denote the Pauli- operator of qubit<br>\n    - If a superscript is not italicized (stands for a word or phrase), don’t parenthesize it.<br>\n  - <br>\n                Regarding the definition of a symbol :<br>\n                <br>\n    - If you write alone on one side of a defining equation, use \\coloneqq or \\eqqcolon: \\coloneqq [expression], or [expression] \\eqqcolon . The symbols \\coloneqq and \\eqqcolon relate more information than does , encoding directionality.<br>\n    - Use if does not appear alone on its side of the equation: [function of ] [result of replacing with its definition in the equation’s left-hand side].<br>\n  - <br>\n                Refer to the Cartesian axes using the formatting “[italicized letter]-axis.” Don’t include any hat, boldface, or \\vec symbol.<br>\n                <br>\n    - Example: -axis<br>\n  - Avoid denoting any index by , which means to physicists. Use instead, unless you’re writing for engineers (who denote by ).<br>\n  - Don’t use the lowercase letter l (“ell”) as an index; readers might mistake it for a one. Use (\\ell) instead.<br>\n  - Give every set-off equation a number. Readers (and coauthors) may want to refer to the equation easily when discussing the paper. Save them (and us) from having to say, e.g., “that equation halfway down page three.”<br>\n  - When writing a set-off mathematical expression, use the align environment, not the equation environment. Using the align environment, one can easily extend an expression across multiple lines.<br>\n  - <br>\n                Regarding a set-off mathematical expression that extends across multiple lines:<br>\n                <br>\n    - <br>\n                        Format the expression as follows by default.<br>\n                        <br>\n      - Put an & symbol immediately leftward of the first = sign or analogous symbol (e.g., ).<br>\n      - If any subsequent line begins with another = sign (or analogous symbol), put an & immediately leftward of the symbol. (I’ll stop writing “or analogous symbol.”)<br>\n      - Suppose that a subsequent line begins with a , –, , or . Find the symbol immediately rightward of the initial = sign. Begin the new line directly below that symbol.<br>\n      - Example:<br>\n    - <br>\n                        Modify the default formatting if necessary (a) to reduce the number of lines used in a PRL submission or (b) if the initial = appears awkwardly far to the right.<br>\n                        <br>\n      - Example of (b):<br>\n    - <br>\n                        Suppose a new line begins with a term or factor, such as the  in the example under (A). Put the corresponding , –, , or  at the beginning of the new line, not at the end of the previous line.<br>\n                        <br>\n      - Examples of inappropriate placement:<br>\n  - The symbol means “approximately equals”; and ~, “scales as.” Approximations convey more information than scaling relations do.<br>\n  - Use big-O-type notation or ~ symbols, not both; they’re partially redundant.<br>\n  - <br>\n                \\ldots, rather than \\cdots, should stand in for elements that fit a pattern.<br>\n                <br>\n    - Example:<br>\n  - <br>\n                When using \\ldots as in the previous rule, present at least two initial examples of the pattern. One can’t define the pattern.<br>\n                <br>\n    - Contains insufficient examples: For example, if is odd, then and fit the template.<br>\n  - Parentheses (), square brackets [], and curly braces {} are delimiters. If you nest them, do so in the order dictated by the Physical Review style guide.<br>\n  - If delimiters enclose a symbol, it shouldn’t protrude above or below them (unless the delimiters would have to be grotesquely enormous). Use the \\left and \\right commands if the delimiters appear on the same line.<br>\n  - <br>\n                An operator  isn’t a matrix; a matrix represents an operator in terms of a particular basis. Therefore, no equals sign should interrelate an  and a matrix. An arrow can.<br>\n                <br>\n    - Example:<br>\n  - Every real number is complex. Don’t say “complex” if you mean “nonreal.”<br>\n  - Consider introducing a mathematical symbol in a prose sentence without using a comma or colon. Put the symbol immediately after the word that names the object represented by the symbol.<br>\n    - Example of inappropriate placement: the set of real numbers<br>\n    - Examples of appropriate placements<br>\n      - the set of real numbers<br>\n      - the set of real numbers and<br>\n      - Recall the set of real numbers, , in Lemma 1.<br>\n- <br>\n        More mechanics of writing<br>\n        <br>\n  - Use concise sentences, as advocated for in The Elements of Style. The reader can hold only so many ideas in their head at once.<br>\n  - <br>\n                Structure sentences simply, as advocated for in The Elements of Style. The reader should be able to grasp each sentence easily.<br>\n                <br>\n    - Avoid nesting ideas within a sentence, to avoid convoluting the sentence’s structure.<br>\n    - Example of sentence with convoluted, nested structure: Any model of equilibrium and nonequilibrium behaviors of systems observed in tabletop experiments and high-energy colliders must obey the laws of relativistic quantum mechanics.<br>\n    - Visualization of the nesting: [Any model of ([(equilibrium and nonequilibrium) behaviors] of {systems observed in [(tabletop experiments) and (high-energy colliders)]})] must obey [the laws of (relativistic quantum mechanics)].<br>\n  - The ideal paper title has the structure of a newspaper headline: it presents a claim, containing a subject and a predicate.<br>\n  - <br>\n                Regarding abbreviations:<br>\n                <br>\n    - Don’t abbreviate the first word in any sentence.<br>\n    - Abbreviate “Figure,” “Section,” “Professor,” and “Appendix” if such a word appears partway through a sentence.<br>\n    - Don’t abbreviate “Sections.”<br>\n  - <br>\n                Regarding acronyms:<br>\n                <br>\n    - Write every acronym in capital letters, as per the Physical Review style guide.<br>\n    - Introduce each acronym the first time you use it.<br>\n    - Thereafter, use only the acronym, not the spelled-out phrase, throughout the rest of the document’s main text. You may spell out the phrase in section, figure, and table titles if doing so improves the document’s clarity.<br>\n  - Every paragraph should contain at least three sentences.<br>\n  - Wherever you insert a blank line into your LateX code, a new paragraph begins in the corresponding PDF. Insert a blank line only if you wish to begin a new paragraph. This advice applies immediately before and after set-off equations.<br>\n  - Never begin a subsection immediately after a section title. Between the two titles, overview the section. Analogous rules govern subsections and subsubsections.<br>\n  - <br>\n                Put the word “only” in the appropriate place.<br>\n                <br>\n    - For example, suppose you’ve sampled data at a point in parameter space and sampled data at no other points. “We sampled data only at ” is correct; “We only sampled data at ” is probably not. The latter claim means that (i) you might have sampled data at and (ii) you did nothing to the data apart from sample it: you didn’t analyze the data, discuss the data, etc.<br>\n  - Specify subjects and objects precisely. Often, a physicist will describe an idea in multiple lines. In the following sentence, the physicist will attempt to encapsulate the idea in the word “this.” The pronoun is too vague to specify the idea. This what? Follow the pronoun with a noun.<br>\n- <br>\n        When in doubt, consult the Physical Review style guide or The Elements of Style.<br>\n        <br>\n  - If those references don’t contain the information you seek, search for it in online writing guides. Not all such guides have equal merit, however. Lean toward guides written by human editors or published by college writing centers.<br>\n1 Collaborators have wondered why I use green; a student guessed it’s my favorite color. It isn’t; but I bleed green, having graduated from the Big Green, also known as Dartmouth College. Sometimes, I highlight certain pieces of text for one reason (e.g., to point out logical inconsistencies) and other text for another reason (e.g., to point out grammatical inconsistencies). Green distinguishes the first highlightings, while orange distinguishes the second: when not bleeding Dartmouth green, I bleed Caltech orange.<br>\n2 Don’t learn how to write from physics papers.<\/p>","content_hash":"cb63495572f799cafd887f5e70ed4de7","author":"Nicole Yunger Halpern","published_at":"2026-08-26T23:53:01","fetched_at":"2026-10-30 21:53:48","word_count":3905,"read_time_minutes":20,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"9w","domain":"quantumfrontiers.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-10-30 21:53:45","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"144w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-10-30 21:53:45","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"149w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-10-30 21:53:45","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"150w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":null,"content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-10-30 21:53:46","word_count":79,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"152w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":null,"content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-10-30 21:53:46","word_count":76,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"154w","domain":"medium.com"},{"id":"1edf7f311f4678be","feed_id":"qiskit-blog","guid":"https://medium.com/p/69e861fbfc88","title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":null,"content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-10-30 21:53:46","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"155w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":null,"content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-10-30 21:53:46","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"156w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":null,"content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-10-30 21:53:46","word_count":87,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"157w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":null,"content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-10-30 21:53:46","word_count":75,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"158w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":null,"content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-10-30 21:53:46","word_count":86,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"160w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"229efc748b29417b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48263","title":"UK Space Agency and DSIT Publish Quantum Technology Roadmap for Space Targeting 2035–2040 Sovereign Capabilities","url":"https://quantumcomputingreport.com/uk-space-agency-and-dsit-publish-quantum-technology-roadmap-for-space-targeting-2035-2040-sovereign-capabilities/","summary":"The UK Space Agency and DSIT have published a Quantum Technology Roadmap for Space, outlining strategic priorities for 2035–2040. The roadmap identifies four investment themes: assured timing, resilient sensing, sovereign communications, and long-term computing, aiming to transition prototypes into flight-qualified space systems. It also emphasizes the need to address engineering bottlenecks and proposes immediate actions to strengthen the UK's sovereign industrial capabilities in quantum space ","content":"<p>The UK Space Agency (UKSA) and the Department for Science, Innovation and Technology (DSIT) have published the Quantum Technology Roadmap for Space, establishing strategic priorities to guide public capital, qualification pathways, and industrial flight demonstrations through the 2035–2040 horizon. Prepared by Space Professionals Partnership Ltd and Quantum Technologies Associates Ltd, the policy framework aligns the UK’s National Space Strategy with its £2.5 billion, ten-year National Quantum Strategy. The roadmap identifies four primary investment themes—assured timing, resilient sensing, sovereign communications, and long-term computing—designed to transition domestic laboratory prototypes into radiation-tolerant, flight-qualified space systems amid accelerating global state investments exceeding £43 billion across North America, Europe, and Asia.<br>\nFour Strategic Investment Themes and Space-Qualification Trajectories<br>\nThe roadmap addresses five operational space drivers where classical payloads face physical limitations: assured resilience in congested orbits, drift-free precision sensing, high-throughput distributed architectures, strict Size, Weight, and Power (SWaP) constraints, and autonomous deep-space operations. Rather than treating all quantum modalities equally, the report establishes a phased deployment matrix distinguishing near-term insertable systems from formative, long-horizon technologies:<br>\n| UK Quantum Space Investment Themes and Deployment Horizons |  |  | <br>\n|---|---|---|<br>\n| Investment Theme | Priority Technologies | Operational Role & Target Horizon | <br>\n| Assured Timing & Synchronisation | Trapped-ion optical clocks, room-temperature vapor clocks, chip-scale optical clocks, and Quantum Time Transfer (QTT). | Provides GNSS-independent sovereign orbit determination, satellite cross-link synchronisation, and ultra-stable ground-space time distribution (5–10 year pathfinder LEO flights). | <br>\n| Resilient Position, Navigation & Sensing | Cold-atom accelerometers/gravimeters, Optically Pumped Magnetometers (OPMs), Nitrogen-Vacancy (NV) diamond sensors, and Rydberg RF sensors. | Enables drift-free inertial dead reckoning in GNSS-denied environments, space weather forecasting, satellite health monitoring, and Earth observation without cryogenics (5–10 year in-orbit demos). | <br>\n| Secure Sovereign Communications & Networking | Post-Quantum Cryptography (PQC), Quantum Key Distribution (QKD), and space-based quantum network nodes. | Mitigates “harvest now, decrypt later” vulnerabilities across telemetry, tracking, and command (TT&C); completes PQC migration by the 2035 NCSC deadline; deploys hybrid classical-quantum optical terminals. | <br>\n| Quantum Computing | Ground-based hybrid quantum-classical algorithms and high-value space workflow mapping. | Prioritizes ground-segment modeling (trajectory optimization, constellation routing, space weather prediction); treats on-orbit space-segment computing as an exploratory, long-horizon research effort (10–15+ years). | <br>\nSovereign Industrial Capabilities and Supply-Chain Scaling Realities<br>\nWhile the UK ecosystem includes more than 300 quantum enterprises and ranks fourth globally in patent volume, the report cautions that an expanding gap in sovereign in-orbit demonstrations threatens to create long-term dependence on foreign space hardware. Progress across all four themes is constrained by critical engineering bottlenecks rather than device physics alone, specifically the commercial supply of space-qualified narrow-linewidth lasers, optical frequency combs, ultra-high-vacuum chambers, and radiation-hardened control electronics. The roadmap recommends five immediate actions: mandating quantum-safe cryptographic migration across ground and satellite segments, funding flight pathfinders for sovereign optical clocks, advancing compact cold-atom sensors, expanding domestic environmental qualification and radiation test facilities, and establishing international interoperability standards to anchor UK components in emerging commercial satellite supply chains.<br>\nThe complete policy and technical analysis is available via the official UK Government Quantum Space Roadmap here.<\/p>","content_hash":"1efd5e32ce28f18ac3ccfcd59f16d160","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T03:39:30","fetched_at":"2026-10-30 21:53:43","word_count":514,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"dd8540df604a644c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48259","title":"Pasqal 256-Qubit Neutral-Atom Processor Observes Unpredicted Slowdown in 2D Quantum Magnet Dynamics","url":"https://quantumcomputingreport.com/pasqal-256-qubit-neutral-atom-processor-observes-unpredicted-slowdown-in-2d-quantum-magnet-dynamics/","summary":"Pasqal's 256-qubit neutral-atom processor observed an unexpected slowdown in a 2D quantum magnet's dynamics, diverging from classical simulations. This research, detailed in a preprint, explores the relaxation landscape of a 2D transverse-field Ising model, uncovering three distinct physical behaviors including a previously unpredicted relaxation slowdown at intermediate field strengths. The study highlights the quantum processor's ability to explore non-equilibrium condensed-matter regimes beyo","content":"<p>Pasqal, in collaboration with the Flatiron Institute’s Center for Computational Quantum Physics, the University of Augsburg, Forschungszentrum Jülich, the University of Regensburg, and the Institut d’Optique–CNRS, has mapped the non-equilibrium relaxation landscape of a two-dimensional transverse-field Ising model (TFIM) on a 256-qubit analog neutral-atom processor. Detailed in a preprint titled Exploring the Relaxation Landscape of a 2D Quantum Magnet on a 256-Qubit Processor and an accompanying technical analysis, the study investigates post-quench dynamics following a sudden Hamiltonian parameter shift. The experiments uncover an anomalous relaxation slowdown in a parameter regime where three state-of-the-art classical tensor-network algorithms diverge from one another and fail to maintain controlled late-time predictions.<br>\nRydberg Lattice Quenches and Three Non-Equilibrium Relaxation Regimes<br>\nThe experimental architecture configured 256 neutral rubidium-87 (87Rb) atoms into a 16×16 square array with nearest-neighbor distance R and van der Waals interactions decaying as U(R/rij)6. Ground and Rydberg electronic states encoded the pseudospin degrees of freedom, driven by global two-photon laser excitation with Rabi frequency Ω and detuning δ to simulate ferromagnetic Ising interactions under a transverse field hx. Initializing the processor in a fully polarized product state |↓···↓⟩, researchers executed an abrupt quantum quench across varying ratios of hx/J. The resulting dynamics revealed three distinct physical behaviors: rapid thermalization near the dynamical phase transition (hx/J ≈ 2.5), a long-lived prethermal plateau at large transverse fields (hx/J = 6.0) governed by an emergent U(1)-symmetric XY Floquet Hamiltonian (HZY), and an unexpected relaxation slowdown at intermediate field strengths (hx/J = 3.5).<br>\n| Dynamical Regimes and Classical Simulation Benchmarks on Pasqal 256-Qubit Array |  |  | <br>\n|---|---|---|<br>\n| Field Parameter Regime | Physical Behavior Observed on QPU | Theoretical & Computational Status | <br>\n| Near-Critical Field (hx/J ≈ 2.5) | Rapid thermalization; two-body correlations settle on interaction timescale tJ ≈ 1. | Consistent with non-integrable thermalization within a Z2 symmetry-broken sector. | <br>\n| Intermediate Field (hx/J ≈ 3.5) | Pronounced relaxation slowdown; correlations persist far from thermal values beyond t ≈ 1/J. | Unpredicted by existing theory; classical tensor-network methods lose numerical control. | <br>\n| Strong Field (hx/J ≈ 6.0) | Prethermal plateau; long-lived correlations matching ground state of effective ZY model. | Agrees with leading-order Floquet-Magnus expansion in the rotating frame (period TF = π/hx). | <br>\n| Classical Simulation Frontier | 2D Tensor Networks, Matrix Product States, and Tree Tensor Networks diverge at tJ ≳ 1. | Entanglement entropy growth saturates classical bond dimensions (χ = 40 to 600). | <br>\n| Hardware Noise Verification | SPAM mitigation (ε = 1%, ε’ = 3%), dephasing models, and 5×5 exact diagonalizations. | Confirms the three-regime landscape is intrinsic many-body physics, not a machine artifact. | <br>\nClassical Tensor-Network Limits and Physical Validation<br>\nTo verify the experimental observations, the team benchmarked the quantum processor against three numerical methods: two-dimensional tensor networks (2DTN) using belief-propagation message updates, matrix product states (MPS) using two-site time-dependent variational principles (TDVP), and tree tensor networks (TTN). While all three techniques achieved quantitative agreement with hardware measurements during early-time evolution (tJ ≤ 1), they diverged sharply from one another and from the experimental data at later times. Specifically, 2DTN encountered numerical discontinuities from bond-dimension truncations (χ = 40), while MPS (χ = 600) and TTN (χ = 512) introduced ansatz-induced geometric oscillations. In contrast, the neutral-atom processor maintained consistent relaxation trends across scaling lattice dimensions. Noise calibrations incorporating state preparation and measurement (SPAM) corrections and exact state-vector calculations on 5×5 sub-lattices confirmed that the intermediate slowdown originates from intrinsic many-body interactions rather than decoherence.<br>\nThe authors note that the study does not claim a formal computational quantum advantage, as it does not benchmark algorithmic execution runtimes. Instead, the experiment builds upon earlier material validation benchmarks—such as the simulation of the frustrated magnetic crystal TmMgGaO4—to demonstrate that analog neutral-atom arrays can explore non-equilibrium condensed-matter regimes that exceed the convergence boundaries of classical tensor-network simulations.<br>\nThe preprint is indexed on arXiv here, with technical perspectives outlined in Pasqal’s Technical Blog here and official Newsroom Release here.<\/p>","content_hash":"1433697fb8d967e9eb33b5f86ecc9600","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T02:47:07","fetched_at":"2026-10-30 21:53:43","word_count":666,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"d620167f13e71241","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48255","title":"BlueQubit Benchmarks Quantum Computational Advantage in Random-Circuit Sampling on IBM Nighthawk r2 Hardware","url":"https://quantumcomputingreport.com/bluequbit-benchmarks-quantum-computational-advantage-in-random-circuit-sampling-on-ibm-nighthawk-r2-hardware/","summary":"BlueQubit, in collaboration with EPFL and the XPRIZE Foundation, has demonstrated quantum computational advantage using IBM Quantum's 120-qubit ibm_phoenix processor. Their random-circuit sampling experiment, involving 61 active qubits, achieved a fidelity that would take over a century for classical supercomputers to replicate. This study highlights significant architectural improvements in IBM processors and validates the classical hardness of their quantum benchmarks. The post BlueQubit Bench","content":"<p>Researchers from BlueQubit, in collaboration with the Ecole Polytechnique Fédérale de Lausanne (EPFL) and the XPRIZE Foundation, have reported a demonstration of quantum computational advantage via random-circuit sampling (RCS) on commercial superconducting hardware. In a preprint titled Quantum computational advantage in random-circuit sampling on IBM superconducting quantum computers, the team executed forward RCS on IBM Quantum’s 120-qubit ibm_phoenix processor, which uses the square-lattice Nighthawk r2 architecture. Operating over 61 active qubits using native controlled-Z (CZ) gates, the circuits were submitted through standard Qiskit Runtime cloud queues without bespoke hardware calibration, yielding an output ensemble that would require over a century to sample classically under baseline rejection-sampling assumptions.<br>\nCircuit Construction, Dual Fidelity Verification, and Contraction Complexity<br>\nThe experiment deployed a four-color brickwork schedule (cycling through matchings A, B, C, and D) across 102 active couplers, averaging 25.5 native CZ operations per cycle. Rather than relying solely on extrapolation, the team established fidelity across depths ranging from 4 to 40 cycles using two independent methodologies: mirror benchmarking with randomized compiling and multi-partition cross-entropy benchmarking (XEB) across three and four balanced patches. At the anchor depth of 36 cycles (incorporating 918 CZ gates), where tensor-network contraction costs saturate at full system size with a width of w = 64, the experimental fidelity reached FXEB ≈ 2.3 × 10−3. While the ibm_phoenix processor collected 106 samples in 19 seconds of active quantum processing unit (QPU) time, reproducing that ensemble via tensor-network rejection sampling on the Oak Ridge National Laboratory Frontier supercomputer would require an estimated 1.2 × 1027 machine floating-point operations (FLOPs)—amounting to roughly 110 years of exascale compute.<br>\n| 61-Qubit Random-Circuit Sampling Benchmarks on ibm_phoenix (Nighthawk r2) |  |  | <br>\n|---|---|---|<br>\n| Depth (Cycles) | Single-Amplitude Cost (log10 Camp [FLOPs]) | Frontier Rejection-Sampling Runtime (Ns = 106) | <br>\n| 20 Cycles | 12.95 | 44 seconds | <br>\n| 24 Cycles | 15.45 | 2.2 hours | <br>\n| 28 Cycles | 17.58 | 7 days | <br>\n| 32 Cycles | 19.83 | 2 years | <br>\n| 36 Cycles (Anchor) | 21.82 | 110 years (FXEB ≈ 2.3 × 10−3) | <br>\n| 40 Cycles | 22.03 | 100 years (FXEB ≈ 1.3 × 10−3) | <br>\nClassical Hardness Limits, Spoofing Margins, and Commercial Reproducibility<br>\nThe study highlights architectural improvements between IBM processor generations: the per-cycle fidelity on the square-lattice Nighthawk r2 reached 0.872, compared to 0.836 on the first-generation Nighthawk r1 (ibm_miami), compounding to more than an order-of-magnitude fidelity gain at deep cycle depths. To evaluate vulnerabilities common to linear XEB metrics, the authors tested classical “severing attacks”—where cross-boundary couplers are deleted to simulate decoupled sub-circuits classically. At 36 cycles, all severing-attack modes scored below 2.2 × 10−4, falling at least an order of magnitude short of the experimental target score and confirming that the benchmark operates on the classically hard side of the noise-induced phase transition. However, the classical runtime estimate serves as an algorithmic baseline assuming exact single-amplitude contractions with unbounded memory; future classical developments in batched tensor slicing, matrix-product state approximations, or GPU-accelerated multi-amplitude reuse could lower classical runtimes, as observed in historical benchmarks against Google Quantum AI’s Sycamore and USTC’s Zuchongzhi processors.<br>\nTechnical details and experimental validation data are published on arXiv, with open-source circuits, execution scripts, and the full 106-sample dataset hosted on GitHub.<\/p>","content_hash":"8d02bfe5d89e5e2221e69afeed5a4519","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T02:21:59","fetched_at":"2026-10-30 21:53:43","word_count":551,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"47023bf93e9108e6","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48251","title":"Gothenburg and Chalmers Researchers Develop Modular Graph Neural Decoder for Surface Code Memory and Lattice Surgery","url":"https://quantumcomputingreport.com/gothenburg-and-chalmers-researchers-develop-modular-graph-neural-decoder-for-surface-code-memory-and-lattice-surgery/","summary":"Researchers from the University of Gothenburg and Chalmers University of Technology have developed a modular neural decoder for surface code quantum error correction (QEC). This decoder demonstrates superior performance compared to traditional methods and is capable of adapting across different hardware architectures, noise profiles, and multi-patch logical operations. Its efficient design, inspired by the renormalization group, allows for training on a single commercial GPU and offers portabili","content":"<p>Researchers from the University of Gothenburg and Chalmers University of Technology have demonstrated a modular neural decoder for surface code quantum error correction (QEC) capable of transferring across hardware architectures, variable noise profiles, and multi-patch logical operations. In a preprint titled Modular Neural Decoder for Surface Code Memory and Logic on Superconducting Processors, the team validated the architecture on superconducting hardware data from IBM Quantum’s Nighthawk r1 generation (ibm_berlin) and Google Quantum AI’s below-threshold Sycamore processor. The framework outperforms minimum-weight perfect matching (MWPM) on memory experiments and successfully decodes a real two-patch ZZ-merge lattice-surgery operation while remaining trainable on a single commercial GPU.<br>\nRenormalization-Inspired Graph Architecture and Experimental Decoding Milestones<br>\nState-of-the-art neural decoders such as AlphaQubit rely on dense recurrent Transformer blocks that require extensive high-performance computing clusters to train and scale with prohibitive O(d4) attention bottlenecks across code distance d. To circumvent model bloat, the Swedish team designed a hierarchical architecture inspired by the renormalization group: a shared local graph neural network (GNN) processes small 3×3×2 space-time clusters of syndrome detection events, which are subsequently coarse-grained via lightweight convolutional aggregation layers and integrated across time by a gated recurrent unit (GRU). Because scaling to larger code distances adds only small convolutional layers rather than expanding the primary neural backbone, the total parameter count remains bounded at roughly two to three million parameters across distances d = 3, 5, 7, and 9.<br>\n| Modular Neural Decoder Experimental Benchmarks across QEC Regimes |  |  | <br>\n|---|---|---|<br>\n| Experimental Benchmark | Hardware & Dataset Platform | Demonstrated Decoding Performance | <br>\n| Planar Memory (d = 3 & d = 5) | IBM Quantum (ibm_berlin Nighthawk r1) | Halves logical error per round relative to MWPM at d = 3 (1.26% vs. 2.60%); outperforms MWPM at d = 5 (2.48% vs. 3.79%). | <br>\n| Below-Threshold Memory (d = 3 to 7) | Google Quantum AI (Sycamore Public Dataset) | Achieves ε3 ≈ 0.638%, ε5 ≈ 0.330%, and ε7 ≈ 0.179% (Λ ≈ 1.9), closely matching AlphaQubit on Z-basis trials. | <br>\n| X-Type Stability Sweep | IBM Quantum (Continuous RX(α) Readout Rotation) | A single neural model fine-tuned across 17 distinct noise settings beats per-setting calibrated MWPM across all error rates without retraining. | <br>\n| Lattice Surgery ZZ-Merge | IBM Quantum (Two-Patch d = 3 Bell Preparation) | Corrects joint logical parity to 58.2% correlation accuracy, outperforming hardware MWPM (56.2%) and uncorrected raw data (54.2%). | <br>\nPortability Advantages and Latency Bottlenecks in Fault-Tolerant Logic<br>\nThe demonstration highlights a structural shift in neural decoder design: moving away from monolithic, task-specific deep-learning models toward reusable modules that generalize across different operational tasks. While prior neural decoders were restricted to static memory preservation, the Gothenburg-Chalmers decoder adapted directly to multi-patch boundaries by tiling three overlapping GNN encoders across two logical patches and their intermediate measurement bridge. However, translating these training and accuracy efficiencies into production-grade fault-tolerant computing requires addressing real-time hardware execution. While the fixed parameter size enables single-GPU training, streaming multi-round error correction on superconducting processors requires sub-microsecond inference. Achieving this throughput will depend on compiling the modular GNN-RNN architecture directly onto dedicated FPGA or ASIC accelerators to prevent syndrome backlogs during extended lattice-surgery circuits.<br>\nThe preprint is indexed on arXiv, with open-source models and training scripts available on GitHub.<\/p>","content_hash":"9a94bb5ae51f48c74e4ac040a2b3d68d","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T02:12:19","fetched_at":"2026-10-30 21:53:44","word_count":550,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"a738a84ff08aa75e","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48247","title":"Yonsei University Researchers Develop Mamba State-Space Neural Decoder to Enable Real-Time Quantum Error Correction","url":"https://quantumcomputingreport.com/yonsei-university-researchers-develop-mamba-state-space-neural-decoder-to-enable-real-time-quantum-error-correction/","summary":"Researchers at Yonsei University have developed a Mamba-based neural decoder for quantum error correction, significantly reducing computational complexity from O(d4) to O(d2) compared to Transformer-based models. This new decoder matches the accuracy of Transformer models like AlphaQubit but eliminates the quadratic self-attention bottlenecks, making real-time feedback on quantum hardware possible. The Mamba decoder shows superior performance in real-time conditions and has implications for adva","content":"<p>Researchers from Yonsei University have developed a neural quantum error correction (QEC) decoder based on the Mamba structured state-space architecture, reducing the computational complexity of deep-learning decoding from O(d4) to O(d2) in code distance d. In peer-reviewed research published in npj Quantum Information, the team demonstrated that the state-space model matches the accuracy of Transformer-based models such as AlphaQubit on experimental memory benchmarks while eliminating the quadratic self-attention bottlenecks that prevent real-time feedback on physical quantum hardware.<br>\nState-Space Syndrome Processing and Real-Time Decoding Metrics<br>\nIn planar surface codes, syndrome extraction generates sequences scaling with the number of stabilizers (Nstab = d2 − 1). Standard Transformer neural decoders utilize multi-head self-attention mechanisms that perform pairwise comparisons between all stabilizer tokens, yielding an O(d4) scaling that accumulates latency backlogs well beyond microsecond superconducting coherence limits. The Mamba decoder replaces explicit multi-head attention with selective state-space layers, utilizing input-dependent linear scans to maintain historical syndrome contexts within compressed hidden states. Evaluated on the Google Quantum AI Sycamore hardware dataset, the state-space architecture matched Transformer accuracy in static memory benchmarks and maintained an error-suppression advantage when accounting for decoder-induced latency noise.<br>\n| Decoding Performance and Scaling Metrics across Surface Code Benchmarks |  |  | <br>\n|---|---|---|<br>\n| Evaluation Metric | Mamba Decoder | Transformer Decoder (AlphaQubit Baseline) | <br>\n| Core Computational Complexity | O(d2) (Linear in syndrome tokens) | O(d4) (Quadratic pairwise self-attention) | <br>\n| Sycamore Memory LER (d = 3) | 2.981 × 10−2 | ∼ 2.98 × 10−2 | <br>\n| Sycamore Memory LER (d = 5) | 2.916 × 10−2 | ∼ 2.91 × 10−2 | <br>\n| Real-Time LER at d = 9 (With Latency Noise) | 1.59 × 10−5 | 6.82 × 10−5 | <br>\n| Effective Threshold Crossings (d = 7 to d = 9) | pth ≈ 0.0067 | pth ≈ 0.0043 | <br>\nInference Latency Limits and Hardware Deployment Constraints<br>\nThe performance divergence under simulated real-time conditions underscores a foundational constraint in fault-tolerant quantum computing: when decoders cannot process syndromes within the physical cycle time (typically 200 to 1,000 ns on superconducting hardware), idling physical data qubits accumulate uncorrected environmental noise. Under the circuit-level depolarizing SI1000 model, the latency-induced error gap between the two neural models expanded monotonically from d = 3 through d = 9. However, while Mamba resolves the attention-scaling bottleneck, translating neural state-space decoders into physical control stacks requires overcoming edge-compute limitations. Practical implementation requires porting the recurrent core, dilated convolutions, and ResNet feature embedders onto low-latency field-programmable gate arrays (FPGAs) or custom application-specific integrated circuits (ASICs) to execute inference within sub-microsecond cycle budgets.<br>\nThe peer-reviewed paper is available in npj Quantum Information, with open-source numerical datasets hosted on GitHub.<\/p>","content_hash":"5d6eedb7c2185d10624e847bd1efbb1d","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T02:04:03","fetched_at":"2026-10-30 21:53:44","word_count":449,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"6fe57e8aa3464a0e","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48243","title":"University of Sydney Demonstrates Multi-Qubit Logical Entanglement and 170-Round Stability on IBM Square-Lattice Nighthawk r2 Processor","url":"https://quantumcomputingreport.com/university-of-sydney-demonstrates-multi-qubit-logical-entanglement-and-170-round-stability-on-ibm-square-lattice-nighthawk-r2-processor/","summary":"University of Sydney researchers have demonstrated significant advancements in quantum error correction on IBM Quantum's ibm_phoenix processor. They achieved multi-qubit fault-tolerant logic and sustained error suppression for up to 170 rounds using a novel dynamic \"walking\" syndrome circuit. This breakthrough, utilizing the Nighthawk r2 architecture, includes successful logical Bell-state preparation and three-logical-qubit teleportation, marking a crucial step towards scalable fault-tolerant q","content":"<p>Researchers from the University of Sydney have demonstrated multi-qubit fault-tolerant logic and sustained error suppression on IBM Quantum‘s cloud-deployed ibm_phoenix processor, a 120-qubit superconducting system based on the square-lattice Nighthawk r2 architecture. The experimental findings, reported in an arXiv preprint (arXiv:2610.32347) and highlighted by IBM Research, validate distance-3 and distance-5 rotated surface code memories, logical Bell-state preparation via lattice surgery, and state and gate teleportation across three logical qubits. The results mark the first major multi-qubit logical benchmark executed on the platform just 54 days following its fleet integration.<br>\nDynamic Role Alternation and Multi-Round Stability Benchmarks<br>\nA primary bottleneck in multi-round superconducting quantum error correction (QEC) is population leakage into non-computational states (such as the |2⟩ transmon state). While ancilla qubits are reset following syndrome measurements, data qubits remain unmeasured during stabilizer cycles, allowing leakage errors to accumulate and saturate error-suppression scaling. To circumvent this degradation, the University of Sydney team implemented a dynamic “walking” syndrome circuit that alternates the physical roles of data and ancilla qubits on successive rounds. By swapping functional roles at each time step, every physical qubit across the active patch undergoes measurement and hardware reset every two rounds, clearing non-computational leakage states before they spread into uncorrectable correlated logical faults.<br>\n| University of Sydney QEC Experimental Benchmarks on ibm_phoenix |  |  | <br>\n|---|---|---|<br>\n| Operational Metric | Demonstrated Value | Fault-Tolerant System Significance | <br>\n| Processor Architecture | ibm_phoenix (120-qubit Nighthawk r2) | Features square-lattice planar connectivity and fast hardware active reset. | <br>\n| Memory Error per Round | < 1% (Distances d = 3 and d = 5) | Maintains logical memory suppression below fault-tolerant thresholds. | <br>\n| Logical Bell-State Fidelity | > 93% State Fidelity | Entangles two planar logical qubits via patch merging and splitting in lattice surgery. | <br>\n| Three-Logical-Qubit Teleportation | 78% to 93% Process Fidelity | Executes state and gate teleportation protocols across three distinct encoded patches. | <br>\n| Long-Duration Stability | ∼ 2 × 10−7 Error Probability | Achieves sustained error suppression out to 170 rounds (8 failures in 50 million runs). | <br>\nLattice Surgery and Architectural Scaling Realities<br>\nThe demonstration advances the execution of fault-tolerant operations from static memory preservation to multi-patch transversal and measurement-based logic. While earlier generations of IBM processors relied on heavy-hex layouts that required auxiliary flag qubits or modified compass codes, the square-lattice topology of Nighthawk r2 provides the direct nearest-neighbor connectivity needed for standard rotated surface code syndrome extraction. However, scaling lattice surgery across multi-logical architectures toward deep quantum algorithms will require mitigating residual cross-talk on denser square lattices, preserving two-qubit gate fidelities during concurrent mid-circuit readouts, and sustaining sub-microsecond classical decoder response times to support real-time feed-forward branching.<br>\nThe preprint is indexed on arXiv, with ecosystem context outlined in IBM Research’s QEC Retrospective.<\/p>","content_hash":"9d285dd98b235e4bd6d9216e48a76675","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T01:49:00","fetched_at":"2026-10-30 21:53:44","word_count":469,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"4ae9b91059788695","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48239","title":"Nord Quantique Secures $10 Million DARPA Quantum Benchmarking Initiative Stage B Agreement Extension","url":"https://quantumcomputingreport.com/nord-quantique-secures-10-million-darpa-quantum-benchmarking-initiative-stage-b-agreement-extension/","summary":"Nord Quantique secured a $10 million extension for Stage B of the DARPA Quantum Benchmarking Initiative (QBI) to advance its bosonic quantum error correction (QEC) architecture. This funding supports engineering milestones and prototyping to demonstrate the viability of their approach, which aims for a 1:1 physical-to-logical qubit footprint using superconducting bosonic codes. The company will focus on reducing error rates and developing hardware subsystems to meet DARPA's goal of achieving uti","content":"<p>Nord Quantique has secured a $10 million agreement extension under Stage B of the Defense Advanced Research Projects Agency (DARPA) Quantum Benchmarking Initiative (QBI), building on its earlier selection when DARPA advanced eleven teams to Stage B. The award finances ongoing engineering milestones and physical risk-mitigation prototyping for the company’s bosonic quantum error correction (QEC) architecture. DARPA’s QBI program is structured to evaluate whether emerging quantum computing hardware platforms can achieve utility-scale operational performance—defined as computational utility exceeding implementation cost—by 2033 through rigorous independent verification and validation (IV&V) metrics.<br>\nSuperconducting Bosonic Codes and Hardware-Level Fault-Tolerance Benchmarks<br>\nUnlike conventional discrete-variable solid-state architectures that require hundreds or thousands of physical transmons to assemble a single fault-tolerant logical qubit via surface or LDPC codes, Nord Quantique employs continuous-variable bosonic codes embedded in superconducting microwave cavities. As detailed in previous technical evaluations of Nord Quantique’s GKP reservoir engineering, the architecture encodes quantum information into multiphoton states to implement active error correction directly at the physical layer, targeting an effective 1:1 physical-to-logical footprint. Under Stage B of the DARPA protocol, performers must deliver comprehensive research and development execution plans, identify dominant decoherence channels—including photon loss and phase-space diffusion—and demonstrate prototype hardware subsystems that actively reduce state preparation and measurement (SPAM) and gate error rates below fault-tolerant thresholds.<br>\n| DARPA QBI Program Structure and Nord Quantique Evaluation Scope |  |  | <br>\n|---|---|---|<br>\n| Program Stage | Funding & Award Parameters | Technical Mandate & Verification Milestones | <br>\n| Stage A (Feasibility) | Awards up to $1 Million | Initial conceptual system design and theoretical derivation of utility-scale scalability paths. | <br>\n| Stage B (Risk Reduction) | Awards up to $15 Million ($10M Extension Awarded) | Detailed engineering roadmaps, risk-burn-down hardware prototypes, and physical bosonic QEC validation. | <br>\n| Stage C (Verification & Validation) | Awards up to $300 Million | Government IV&V hardware audit to verify whether a utility-scale machine can be built and operated as designed. | <br>\nFederal Benchmarking Realities and Scaling Pathways<br>\nThe contract extension reinforces Nord Quantique’s commercial execution following its previous capital expansion reported in QCR’s financing coverage. While other program performers—including IBM and IonQ—continue progressing through parallel benchmarking phases, executing Stage B deliverables remains a prerequisite for early-stage architectures to validate physical scalability. For Nord Quantique, advancing from individual cavity-stabilized bosonic states to multi-qubit computational processors introduces significant experimental constraints. Achieving fault-tolerant threshold margins requires realizing high-fidelity two-qubit entangling gates between distinct bosonic cavities, mitigating transmon ancilla-induced dephasing, and demonstrating that continuous autonomous error correction does not introduce unmanageable classical feedback latency or cryogenic thermal burdens.<br>\nContractual extension details are outlined in the official Nord Quantique Announcement, with institutional program specifications detailed on the DARPA QBI Portal.<\/p>","content_hash":"57c57ca43ebca272fa522ce6828b3514","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T01:33:18","fetched_at":"2026-10-30 21:53:44","word_count":451,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"7c6ffe5d84a82302","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48235","title":"LANL and Cornell Researchers Demonstrate Extraction of Quantum Information Structures from Condensed-Matter Dynamical Simulations","url":"https://quantumcomputingreport.com/lanl-and-cornell-researchers-demonstrate-extraction-of-quantum-information-structures-from-condensed-matter-dynamical-simulations/","summary":"Researchers from LANL and Cornell have developed a framework to extract quantum information from dynamical quantum simulations, revealing how information propagates and reorganizes in many-body states. Their work demonstrates that traditional measurements capture only a limited view of quantum information, and that multipartite entanglement can be certified even as entanglement is redistributed. This framework can repurpose quantum simulators as multi-purpose quantum information laboratories, th","content":"<p>Researchers at Los Alamos National Laboratory (LANL) and Cornell University have published an analytical and numerical framework demonstrating that intermediate many-body states prepared during dynamical quantum simulations can be repurposed to interrogate quantum information metrics. In a preprint titled Dynamical quantum simulations as laboratories for quantum information, the team analyzed local-pulse protocols traditionally executed on quantum hardware to calculate retarded spin Green functions and inelastic neutron scattering dynamical structure factors. By reframing opposite local spin rotations as the encoding of a classical bit or a continuous parameter into evolving many-body states, the study tracks how quantum information propagates, reorganizes across spatial partitions, and responds to physical measurement constraints in 50-spin XX and XXX (isotropic Heisenberg) chains.<br>\nInformation Propagation, Representation-Readout Inversion, and Multipartite Entanglement<br>\nThe investigation establishes that conventional local response functions capture only a restricted projection of the underlying quantum record. As the spatial observation aperture expands from a single site (k = 1) to seven sites (k = 7), the trace distance ΔR and Holevo information χR reveal persistent multi-site correlations that remain present even when local single-spin response functions vanish. A central finding is an inversion between mathematical representation complexity and physical measurement efficiency: while the free-fermionic XX chain admits an exact, compact description via two-point fermionic covariance matrices, simple product-Pauli spin measurements recover a larger fraction of available distinguishability, Holevo information, and quantum Fisher information (QFI) in the strongly interacting XXX chain. Furthermore, the prepared dynamical states allow direct certification of evolving quantum resources, demonstrating that localized perturbations reduce internal entanglement while establishing genuine five-partite entanglement across spatial blocks.<br>\n| Quantum Information Metrics Extracted from Dynamical Spin-Chain Simulations |  |  | <br>\n|---|---|---|<br>\n| Analytical Dimension | Observed Physical Behavior | Quantum Information & Computational Significance | <br>\n| Spatial Aperture Scaling | Median ΔR grows from 0.037 to 0.294 (XX) and 0.054 to 0.230 (XXX) between k = 1 and k = 7. | Confirms information spreads into non-local multi-qubit correlations inaccessible to single-site Green function probes. | <br>\n| Representation vs. Readout | Covariance matrices fully describe XX but fail in XXX (operator error eGξ ≈ 0.70); yet product-Pauli measurements extract more information in XXX. | Proves that simplicity in a theoretical quasiparticle basis (Jordan-Wigner) does not guarantee operational measurement accessibility on physical qubits. | <br>\n| Quantum Fisher Information (QFI) | Infinitesimal pulse-angle sensitivity ∂θρR relates directly to the signed response operator ξR; product-Pauli efficiency ηprodPF is higher in XXX at matched QFI. | Bridges condensed-matter response functions to precision bounds in quantum metrology and parameter estimation. | <br>\n| Channel Capacity Duality | Coherent information I(A‘ ⟩ AR) and quantum capacity Q satisfy Q(NR,t) = 1 − χR(t) under spin-flip symmetry. | Links the classical decodability of a lost spatial block to the exact quantum capacity and Bell-state distillation rate of the complementary system. | <br>\n| Entanglement Reorganization | Block-exterior entropy increases (ΔSR > 0) while internal logarithmic negativity decreases (ΔEN,med < 0); multipartite Rains and log-GMN remain positive. | Certifies that local reduced states preserve genuine multipartite entanglement even as the propagating wavefront redistributes entanglement globally. | <br>\nExperimental Validation Pathways and Quantum Hardware Realities<br>\nThe analytical framework builds directly upon experimental pulse sequences previously deployed on superconducting quantum processors to benchmark magnetic materials such as KCuF3 against neutron scattering facilities. By treating quantum simulation platforms as multi-purpose quantum information laboratories rather than single-observable estimators, the methodology extracts transport velocities, error-correcting thresholds, and channel capacities without requiring dedicated state preparation circuits. However, implementing full quantum information reconstruction on physical hardware introduces experimental bottlenecks: calculating exact trace distances, multipartite Rains bounds, and Holevo capacities requires full density matrix reconstruction, which scales exponentially with block size 2k. Extending these diagnostics to larger materials models or higher-dimensional lattices will require transitioning from full quantum state tomography to randomized measurement protocols and symmetry-adapted classical shadow estimation.<br>\nThe preprint is indexed on arXiv, with experimental context detailed via the Neutron-Scattering Quantum Simulation Benchmark here.<\/p>","content_hash":"b9409fb17373c861ffcd990a62b683c8","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T01:15:02","fetched_at":"2026-10-30 21:53:44","word_count":658,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"054e00bb1f1b8d09","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48228","title":"EPB and IonQ Deploy Hybrid Trapped-Ion Algorithms on Forte Enterprise to Optimize Power Grid Topology","url":"https://quantumcomputingreport.com/epb-and-ionq-deploy-hybrid-trapped-ion-algorithms-on-forte-enterprise-to-optimize-power-grid-topology/","summary":"EPB and IonQ have successfully deployed hybrid quantum-classical algorithms on IonQ Forte Enterprise to optimize power grid topology, significantly reducing power loss and improving efficiency. Their research, funded by a $4 million NIST grant, utilized trapped-ion systems to benchmark three distinct computational frameworks for distribution network reconfiguration. These methods demonstrated substantial parameter reduction, decreased classical solver runtime, and recovered global minimal-loss c","content":"<p>Municipal utility EPB, in collaboration with IonQ, has published experimental findings across three technical preprints demonstrating hybrid quantum-classical algorithms for distribution network reconfiguration (DNR). Funded under a $4 million grant from the National Institute of Standards and Technology (NIST), the project deployed EPB’s in-house Quantum Computing Fellows to execute optimization protocols on an on-premises IonQ Forte Enterprise trapped-ion system at the EPB Quantum Center in Chattanooga, Tennessee. The research benchmarks three distinct computational frameworks targeting active line-loss reduction and real-time switch allocation across distribution networks spanning up to 417 electrical buses.<br>\nConstraint-Preserving Mathematical Encodings and Hardware Implementations<br>\nDNR is a mixed-integer nonlinear programming challenge that requires selecting sectionalizing and tie switch states to minimize resistive dissipation while maintaining radial tree topologies without closed loops. Conventional quantum optimization approaches enforce radiality via penalty terms in Quadratic Unconstrained Binary Optimization (QUBO) matrices, introducing artificial energy barriers and barren plateaus. To bypass these issues, the joint research teams implemented three topology-preserving architectures directly on trapped-ion hardware:<br>\n| Technical Methodologies and Experimental Benchmarks across EPB-IonQ Preprints |  |  | <br>\n|---|---|---|<br>\n| Computational Architecture | Mathematical & Algorithmic Encoding | Demonstrated Hardware & Simulation Performance | <br>\n| Quantum-Enhanced Deep Reinforcement Learning (Q-DRL) | Double Deep Q-Network (Double DQN) with a 4-layer Parameterized Quantum Circuit (PQC) backbone and double decision-head masking. | Achieved 95.8% parameter reduction on the IEEE 33-bus system (9,156 parameters vs. 220,052 classically); IonQ Forte Enterprise execution yielded exact optimum (0.1396 MW loss) for 33 buses and within 0.30% of optimum for 69 buses. | <br>\n| Subspace LR-QAOA with Guided MISOCP Solver | Cycle-edge partitioning encoding spanning trees natively into multi-qubit W-state registers, generating mixed-integer programming (MIP) starts and variable hints. | Reduced median classical Gurobi MISOCP solver runtime to within 1% of target from 1,415.47 s down to 34.71 s on a 417-bus network using a fixed 29-qubit hardware budget. | <br>\n| Warm-Start Iterative Quantum Imaginary-Time Evolution (QITE) | Surrogate-assisted expectation matching with branch-exchange binary registers and a rolling-window stage queue for large networks. | Recovered global minimal-loss configurations across six benchmark networks; converged within 0.2% to 2.18% of published reference losses on remaining large-scale systems (up to 415 buses). | <br>\nTrapped-Ion Execution Realities and End-to-End Speedup Constraints<br>\nHardware validation was carried out on the IonQ Forte Enterprise platform, utilizing a linear Paul trap with up to 36 barium or ytterbium ions (171Yb+) manipulated by pulsed 355 nm Raman laser beams and acousto-optic deflectors. Across the Q-DRL and iterative QITE workflows, quantum sampling successfully guided classical alternating current power flow (ACPF) engines to low-loss configurations despite device noise. However, physical runtime analyses reveal practical limits for utility deployment: in the two-stage MISOCP workflow, total end-to-end execution times remained dominated by quantum circuit overhead and classical pre- and post-processing on small-to-medium networks. The relative runtime gap between unguided classical solvers and end-to-end quantum-assisted pipelines only began narrowing on the 473-line, 417-bus system, establishing an empirical boundary where quantum-derived variable hints offset circuit compilation and shot latency.<br>\nThe underlying preprints are indexed on arXiv covering Quantum-Enhanced Deep Reinforcement Learning here, Two-Stage Cycle-Edge MISOCP Reconfiguration here, and Warm-Start Iterative QITE here, with institutional program background detailed in IonQ’s Co-Innovation Report here.<\/p>","content_hash":"a5d60c0c4bca662364920184acc00603","author":"Mohamed Abdel-Kareem","published_at":"2026-10-29T01:07:36","fetched_at":"2026-10-30 21:53:44","word_count":531,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"1f490ca01c220700","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48221","title":"NQCP Spins Out Pelagic Systems to Commercialize Real-Time Hardware Calibration Software","url":"https://quantumcomputingreport.com/nqcp-spins-out-pelagic-systems-to-commercialize-real-time-hardware-calibration-software/","summary":"Pelagic Systems, a spin-out from the Novo Nordisk Foundation Quantum Computing Programme (NQCP), is commercializing software for real-time control, calibration, and characterization of quantum processors. Their platform addresses parameter instabilities in multi-qubit systems by running routines directly on FPGA controllers, significantly reducing latency compared to traditional methods. This technology aims to automate and streamline the tuning of complex quantum hardware, offering a solution t","content":"<p>The Novo Nordisk Foundation Quantum Computing Programme (NQCP) at the Niels Bohr Institute, University of Copenhagen, has spun out Pelagic Systems to commercialize real-time control, calibration, and characterization software for quantum processors. Developed and validated on superconducting quantum hardware at NQCP and supported by non-dilutive grant capital from Innovation Fund Denmark via its InnoExplorer and Grand Solutions programs, the platform addresses runtime parameter instabilities—such as qubit frequency drift, fluctuating coherence lifetimes, and readout degradation—that constrain multi-qubit system performance.<br>\nReal-Time FPGA Control Loops and Quantum Characterization Architecture<br>\nTraditional quantum processor characterization relies on host-mediated feedback loops: measurement data generated at the quantum processing unit (QPU) travels to a host CPU for analysis, which then issues updated pulse configurations back to the instrument rack, incurring latency penalties typically on the order of 250 ms for standard sweeps. Pelagic Systems shifts parameter estimation and feedback decision-making directly into the real-time execution loop by running routines locally on FPGA controllers. On operational superconducting hardware, this on-controller estimation pipeline measures relaxation times (T1) and executes recalib
