ad friends and colleagues over for dinner. We were still trying to process OpenAI&#8217;s and Anthropic&#8217;s proofs of VP ≠ VNP&#8212;hot on the heels, obviously, of the Alpöge/Anthropic proof of the Riemann Hypothesis, which already feels like last week&#8217;s news. But then before dessert was serv","content":"<p>HOLY SHIT HOLY SHIT HOLY SHIT HOLY SHIT<br>\nI feel like my previous posts (and post titles), and podcasts, and talks, have failed to do full justice to the magnitude of what’s now happening, so I’m trying again.<br>\nLast night, we had friends and colleagues over for dinner. We were still trying to process OpenAI’s and Anthropic’s proofs of VP ≠ VNP—hot on the heels, obviously, of the Alpöge/Anthropic proof of the Riemann Hypothesis, which already feels like last week’s news. But then before dessert was served, we saw that OpenAI claims to prove that ω, the exponent of matrix multiplication, is exactly 9/4—a lower bound (!!), matching the upper bound that OpenAI proved in the great Mathocalypse drop of October 6.<br>\nThere are two separate shocks here. The first shock is that we now, finally, know the right answer to this central mystery of algorithms going back to the late 1960s, when Volker Strassen first showed that ω<3 (he got ω≤log27) … and that the true answer is actually a rational number (!). But the even bigger shock is that the AI was able to prove any lower bound of the form ω>2. I never expected this challenge to be all that much easier than P ≠ NP.<br>\nOver the decades, I often heard colleagues express extreme confidence that ω=2, and I expressed skepticism whenever this came up—not because I had any strong argument for ω>2, but just because I saw that there was no strong argument for ω=2 either. So, I’m glad to have been vindicated about that!<br>\nBut wait, there was more. During dessert, we saw another OpenAI release proving that the true number of linear gates needed to compute the Fourier Transform is N (log N)1/2+o(1). The upper bound here improves, not only over the O(N log N) that stood since the 1960s (i.e., the Fast Fourier Transform or FFT), but also over the O(N log0.9999999999999 N) (give or take some 9’s) that OpenAI published back in the October 6 Mathocalypse. Again, though, the real shock here is that there’s also a matching lower bound (!!). All these questions from the ancient days are now just getting … straight-up answered, rather than slowly illuminated with a drip-drip-drip of clues.<br>\nTo give an idea of how much things have changed, the other day Yupan Liu put a preprint on the arXiv proving that QIP(2) = PSPACE—that is, quantum interactive protocols with only two messages have the full power of those with three, or any polynomial number. As recently as 2025, this would’ve considered been one of the top complexity results of the year, and the fact that Yupan had used AI to help achieve it would’ve been strange and wonderful. These days, I had to remind myself it had even happened, and the use of AI was so standard that it didn’t even raise an eyebrow.<br>\nIt’s now obvious that we’ll be getting, not one-off solutions to this or that complexity question, but a whole new continent of mathematical truth, one that we’d previously only glimpsed through fog. Picture van Leeuwenhoek first training a microscope on pondwater, or Galileo first training his telescope on the stars. That might give you some idea of how our resolution into the complexity-theoretic universe, and the whole universe of mathematical truth beyond it, has now improved.<br>\nAll through last night, as OpenAI and Anthropic uploaded more files to their GitHub repositories—because that’s what they’re doing now, they don’t even bother to issue press releases anymore, they just upload papers—my guests and I sat at the dinner table with phones out and a laptop, wondering which shoe was going to drop next. It was as though the clouds had parted above Mount Sinai, and we were waiting for the next sentence uttered by the Holy One Himself.<br>\nI now feel in my bones, for the first time ever, that a proof of P ≠ NP is not far.<br>\nFor all I care, despise the AI companies for bulldozing our garden. Or love them for opening a new vista, or anything in between. Just please don’t deny what’s happening. Now that the companies have repeatedly shown that they can back up their claims with Lean certificates, don’t be a raging doofus who seizes on some triviality (e.g., a minor discrepancy between the Lean and informal proofs, or unused sections of the Lean proof) to pretend that dozens of great open problems of math and theoretical computer science are not, in fact, getting solved. Because they are getting solved. It might take us years to understand the solutions, but my working assumption by this point is that any proof that comes directly from OpenAI or Anthropic is correct barring information to the contrary.<br>\nI can’t possibly put the matter better than one of my friends on Facebook:<br>\nAfter years of crackpot “solutions” claiming Millennium Problems are solved, now that we have actual solutions, we have crackpot “refutations” claiming Millennium Problems are not solved. It is really poetic, in a way.<br>\nAlong the way to so many lower bounds that we wondered whether ever we’d live to see, there will also, of course, be further shocking upper bounds: that is, ultimate barriers to lower bounds, also known as “algorithms.” And yes, some of those algorithms will break currently deployed cryptosystems.<br>\nBecause people have been hounding me about it: yes, I’m virtually certain, from multiple reliable sources, that the AI labs are now sitting on one or more bombshells in that area. However, until I either see details or hear directly from someone at a lab, I feel much, much less confident about the specific nature of those bombshells. I do not wish to be responsible for spreading unverified rumors. And I worry that exact statements of what was done may have been mangled in a game of Telephone.<br>\nI also, crucially, don’t want the cryptography part of the story to overshadow the intellectual enormity of what’s happening. If, in these days of long-prophesied revelation and wonders and terrors, your main worry is your Bitcoin wallet, then go somewhere else for rumors about whether or not ECDSA is broken or whatever. I don’t have what you’re looking for here.<br>\nLet me be clear: for those of my readers who celebrate, I believe that tomorrow would be a superb Thanksgiving to spend some quality time with your kids and parents and siblings and old friends.<br>\nRight now—this past week—is very much like I would’ve always imagined the beginning of an AI singularity to look and feel like. I just hope we’ll get lucky, and it will “merely” be a singularity for our little corner of the world that involves hard math problems.<br>\nAt some point at dinner last night, Dana had a sneezing fit. So I said to her, I hope it isn’t a swarm of nanobots that’s come to infect us! But if it is, then I hope it’s the friendly kind, the kind that will usher us all into an AI utopia.<br>\nNow, of course, another morning has dawned, and we’re still here. May we find a world where we and our children will be happy to live at the bottom of this rollercoaster. May we work to make it so.<br>\nUpdates (Nov. 26):<br>\n(1) Many commenters thought it was inappropriate and unnecessary of me to warn people to stop being “raging doofuses” who, fingers in their ears and seizing on the flimsiest of pretexts, just flat-out denied the reality of AI solving our longstanding open math problems. Surely no one was doing that?! And then, of course, tons of other people did exactly that. Gary Marcus, to his eternal shame (because he knows better), signal-boosted to his 260,000 Twitter followers Jenny Nielsen’s crackpot claim that the existence of unused sections of Alpöge’s Lean proof of the Riemann hypothesis somehow invalidated the proof—while, in the spirit of Tucker Carlson, never quite endorsing the crackpot claim. Meanwhile, in my moderation queue, I have someone angrily accuse me of “sucking off the AI companies,” patronizingly explaining to me that, if I myself say it will take years for experts fully to understand these proofs, then obviously it must take years to verify them as well! The entire concept of Lean verification just sails entirely over his head. So I say one more time: either give evidence of bugs in Lean that would actually matter here, for example by showing how the “con-leche” verifier can accept a proof of 0=1. Or else stop being a raging doofus.<br>\n(2) Many other people said some version of, “so computers are solving a bunch of super-hard math problems. Whoop-de-doo. Either explain to me why this matters for my everyday life, or shut up and go away.”<br>\nVery well then: there are probably no direct implications of a proof of the Riemann Hypothesis or of VP≠VNP for your everyday life. The vast new ideas that AI introduced to prove such theorems might well have indirect implications, eventually leading to new fields of mathematics with scientific and technological applications, but right now we can only speculate.<br>\nIn the meantime, however, the fact that AI now exists that’s capable of such things has potentially staggering implications for everyday life, which could be “merely” a transformation of the world’s economy, or could range all the way up (down?) to the destruction of all life on earth in a matter of years in a cataclysmic technological singularity. Opinions differ. But if you want to be part of the serious conversation on such matters, you’ll first need to set aside your “ooga booga, me only care about Riemann proof if it help me make sharper spear” caveman act.<br>\n(3) Finally, moving on to better questions, someone asked why I titled a blog post “HOLY SHIT HOLY SHIT HOLY SHIT HOLY SHIT” only now, and not earlier. Of course, I could’ve used that title at any time since May, if not before! In my mind, though, even after the AI Mathocalypse began in earnest, there remained two interesting hypotheses: (a) that AI was picking off problems “in the convex hull of existing techniques” (like, I dunno, just the friggin’ Riemann Hypothesis) while P≠NP remained serenely untouched and would still take a human conceptual leap, or (b) that AI had really, actually climbing the mountain that leads to P≠NP. Even after VP≠VNP, you could wonder if that was just a bizarre one-off. But with the determination of the matrix multiplication exponent and all the other breakthroughs of the past couple days, option (a) has become much less tenable. Yes, I do now think that AI is climbing the mountain that leads to P≠NP.<\/p>","content_hash":"5bcb4d759e8823e73df157968bb09931","author":"Scott","published_at":"2026-11-25T19:01:13","fetched_at":"2026-11-26 16:15:54","word_count":1774,"read_time_minutes":9,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"21h","domain":"scottaaronson.blog"},{"id":"9f36e539f989f0c1","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10362","title":"I’ve been drinking wine in my kitchen","url":"https://scottaaronson.blog/?p=10362","summary":"See I don&#8217;t even like alcohol much. Like, I&#8217;ll have a half-glass of wine at a fancy dinner if everyone else is having some, or one beer at a reception, but that&#8217;s it. These days, though, can you blame me? Yesterday, as you all probably saw, hot on the heels of its proof of the Generalized Riemann Hypothesis, Anthropic released a proof of Valiant&#8217;s VP≠VNP conjecture&#8212;a central algebraic analogue of the P≠NP conjecture, and considered a &#8220;warmup&#8221; to proving ","content":"<p>I’ve been drinking wine in my kitchen<br>\nSee I don’t even like alcohol much. Like, I’ll have a half-glass of wine at a fancy dinner if everyone else is having some, or one beer at a reception, but that’s it. These days, though, can you blame me?<br>\nYesterday, as you all probably saw, hot on the heels of its proof of the Generalized Riemann Hypothesis, Anthropic released a proof of Valiant’s VP≠VNP conjecture—a central algebraic analogue of the P≠NP conjecture, and considered a “warmup” to proving P≠NP since the late 1970s. Then, later the same day, OpenAI released a proof of the VP≠VNP conjecture as well.<br>\nYou can read all about the VP vs. VNP problem in Section 6.5 of my P vs. NP survey. But briefly, for those tuning in from home, Valiant’s conjecture says that the permanent of an n×n matrix has no algebraic circuits (that is, circuits built out of addition and multiplication gates and constants) of size polynomial in n, unlike the determinant, which does. Anthropic’s result says that a circuit of size exp(Ω(log4/3 n)) is needed, whereas OpenAI gets exp(Ω(log5/4 n)): so, more than polynomial albeit less than exponential. As is often the case, the best known upper bound here is ~2n. The lower bounds are said to work over all fields of characteristic other than 2. (What’s special about 2? Over a field of characteristic 2, addition and subtraction are the same, so the permanent just is the determinant, and is easy to compute!)<br>\nFrom what little I understand so far, the proof techniques in the Anthropic and OpenAI papers look similar. They both do some sort of highly nontrivial “compression” or “shortening,” followed in the end by a diagonalization—the oldest trick in the book! Diagonalization is what should let these arguments evade the infamous natural proofs barrier. There’s probably also a story to tell about how the arguments evade an algebraic-circuit version of the relativization barrier, but I don’t know how to tell it yet.<br>\nOne immediate implication of these results is that, if you want to map an n×n matrix A to an m×m matrix B whose entries are affine functions of the entries of A, and have the permanent of A be equal to the determinant of B, then m must be exp(Ω(log4/3 n)). This was the question directly targeted by Ketan Mulmuley’s Geometric Complexity Theory program—which, however, these papers don’t use, taking a more direct route to the desired lower bound.<br>\nAs is de rigueur these days, the proofs come with Lean, formally certifying their correctness to a level considerably beyond what we’d normally demand for a math paper published in a journal. If recent experience is any guide, this will not prevent boatloads of morons from denying that AI could possibly have solved these problems, and latching onto anything whatsoever (e.g., unused Lean code or Lean that deviates slightly from the natural-language version) to declare the proofs to be fallacious … and such claims will then go viral, lapped up by an eager audience on Bluesky and other places hungry for AI denial. If there’s any real technical issue with the proofs, I’ll be happy to hear about it from experts, but my patience for arguing with the flat-earthers is at an end.<br>\nDaniel Harlow asked me whether the proof of VP≠VNP raises my confidence in P≠NP itself, which I’d lowered from 97% to 95% in light of OpenAI’s and Anthropic’s recent refutation of the Exponential Time Hypothesis. I said sure, I’m now back up to 96%.<br>\nThe possibility that this will be followed up soon by a proof of P≠NP itself has not escaped my notice, or anyone else’s, certainly not at the AI companies. Will the big one come tomorrow? Next week? Next month? In a year? Who the hell knows? Hence the wine drinking, which I wouldn’t call sad, but just … thirsty.<br>\nIf that wasn’t enough for you—if you still want more—yesterday Sanjeev Khanna, Aaron Putterman, and Junkai Song posted an ECCC preprint with a deterministic linear-time algorithm for finding minimum spanning trees in graphs. (The best previously-known algorithm was ridiculously close to linear time—n α(n) where α is the inverse of the Ackermann function—but not quite. A randomized linear-time algorithm was known.) This was a huge open problem for decades, and one that my wife Dana spent roughly two years working on.<br>\nKhanna et al. write, “the main ideas in [our] paper were entirely generated by AI—specifically 6.2 Astra, on a mixture of Ultra and Max effort—with minimal human intellectual intervention. The authors then worked to first carefully verify, and then to simplify and clarify the treatment.”<br>\nAnyway, yeah, tonight I’ll again raise my glass, I’ll pray that at the bottom of this terrifying rollercoaster lies a world that my children and I will be glad to inhabit, and I’ll mutter to myself the eternal words:<br>\nGod would like us to be joyful<br>\nEven though our hearts lie panting on the floor;<br>\nHow much more can we be joyful,<br>\nWhen there’s really something<br>\nTo be joyful for.<br>\nTo life, to life, l’chaim!<br>\nL’chaim, l’chaim, to life!<br>\nIt gives you something to think about,<br>\nSomething to drink about,<br>\nDrink l’chaim, to life!<br>\nUpdate: See Lance’s post for more.<\/p>","content_hash":"5b66315e3ff0ac76f0b4a898039f01e3","author":"Scott","published_at":"2026-11-24T23:17:20","fetched_at":"2026-11-26 16:15:55","word_count":873,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1d","domain":"scottaaronson.blog"},{"id":"6eed544468425424","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49152","title":"Forschungszentrum Jülich and ARQUE Systems Secure €35 Million ($38.4 Million USD) to Build 200-Qubit Silicon Spin Quantum Computer","url":"https://quantumcomputingreport.com/forschungszentrum-julich-and-arque-systems-secure-e35-million-38-4-million-usd-to-build-200-qubit-silicon-spin-quantum-computer/","summary":"Forschungszentrum Jülich and ARQUE Systems have launched Q-STAR.NRW, a €35 million initiative to build a 200-qubit silicon spin quantum computer by the end of 2029. This project, primarily funded by German federal funds, will integrate the quantum computer into the Jülich UNified Infrastructure for Quantum Computing (JUNIQ). The computer will use ARQUE Systems' patented shuttling architecture for scalability and will provide academic and business researchers with access to test applications in v","content":"<p>Forschungszentrum Jülich and its Jülich–Aachen spin-off ARQUE Systems have launched Q-STAR.NRW, a €35 million ($38.4 million USD) initiative running through the end of 2029 to develop and integrate a semiconductor-based quantum computer with up to 200 qubits. Financed 90% through German federal funds under the Coal Regions Investment Act and 10% by the State of North Rhine-Westphalia via Forschungszentrum Jülich, the project will deploy the system into the Jülich UNified Infrastructure for Quantum Computing (JUNIQ) at the Jülich Supercomputing Centre (JSC).<br>\nBuilding on ARQUE Systems’ prior integration of a five-qubit prototype into JUNIQ, the processor encodes quantum information in the spins of individual electrons trapped in silicon and silicon–germanium structures. Rather than relying on fixed nearest-neighbor couplings and dedicated control lines for every qubit, ARQUE Systems’ patented shuttling architecture transports electrons across the chip to shared interaction and control zones, reducing wiring overhead and targeting long-term scaling beyond ten million qubits on a two-by-two-centimeter die.<br>\nAlongside hardware fabrication, the project partners will develop hybrid quantum-HPC software stacks, algorithms, and user-support services to connect the 200-qubit processor with JSC’s classical supercomputers. The resulting infrastructure will provide academic researchers and small and medium-sized enterprises with access to test applications in materials development, chemistry, pharmaceuticals, and logistics across the Rhenish mining region.<br>\nRead Forschungszentrum Jülich’s press release here. Related QCR coverage includes our earlier reports on JUNIQ’s initial integration of ARQUE Systems’ processor here and the Jülich Supercomputing Centre’s NVIDIA DGX Quantum deployment with Quantum Machines and ARQUE Systems here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\n- Players →Companies and institutions across the quantum industry, by segment.<br>\n- Scorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"e411f8cbe0a33319183af20981cf53ab","author":"Mohamed Abdel-Kareem","published_at":"2026-11-24T23:05:25","fetched_at":"2026-11-26 16:15:58","word_count":332,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"fef2efde3a457a7d","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49146","title":"IonQ Advances Quantum-Assured Navigation and Timing with DARPA Airborne Gravimeter Award and 51-Day Maritime Clock Trial","url":"https://quantumcomputingreport.com/ionq-advances-quantum-assured-navigation-and-timing-with-darpa-airborne-gravimeter-award-and-51-day-maritime-clock-trial/","summary":"IonQ's Vector Atomic subsidiary has made significant strides in quantum sensing for navigation and timing. They received a DARPA award to develop an airborne quantum gravimeter and successfully completed a 51-day maritime trial of their Evergreen-30 optical atomic clock for GPS-denied environments. These advancements aim to provide resilient position, navigation, and timing capabilities for defense platforms. The post IonQ Advances Quantum-Assured Navigation and Timing with DARPA Airborne Gravim","content":"<p>IonQ (NYSE: IONQ) has detailed two milestones across its quantum sensing subsidiary, Vector Atomic, targeting GPS-denied Position, Navigation, and Timing (PNT) for maritime and airborne defense platforms. The updates pair a Phase II Option award from the Defense Advanced Research Projects Agency (DARPA) to develop an airborne strapdown quantum gravimeter with field data from a 51-day U.S. Navy-sponsored maritime deployment of Vector Atomic’s commercial Evergreen-30 (EG-30) optical atomic clock.<br>\n| IonQ / Vector Atomic Quantum Sensing & PNT Specifications |  |  | <br>\n|---|---|---|<br>\n| System / Program | Core Architecture & Parameters | Operational & Development Milestones | <br>\n| Evergreen-30 (EG-30) Optical Clock | 3U 19-inch rackmount molecular iodine optical clock (29 L, 20 kg, 80 W); 2.5 × 10−14 instability at 1 s, <4 × 10−15/day drift, and 30-day holdover within 10 ns. | Completed a 51-day Navy-sponsored deployment aboard the TS Patriot State in 2026, building on a 21-day RIMPAC sea trial (<300 ps/day drift across three units). | <br>\n| DARPA GRAVMAP Gravimeter | Strapdown rubidium atomic gravimeter paired with conventional inertial sensors for vibration-immune airborne operation. | Awarded DARPA Phase II Option after completing top-level assembly vibration analysis; lab evaluation through late 2026 and flight/field tests in 2027. | <br>\n| Dual Optical Frequency Comb (DUAL-OFC) | 9 L rackmount module (8 kg, <25 W) Er-fiber dual frequency comb at 1560 nm (<5 × 10−17 stability at 1 s optically referenced). | Supports picosecond-level optical time transfer and multi-wavelength synchronization alongside EG-30 (1064 nm CW and 1560 nm comb outputs). | <br>\nUnder DARPA’s Gravimeter using Rubidium Atoms with Vibration-immunity for the Maritime and Airborne Platforms (GRAVMAP) program, originally awarded in September 2025, Vector Atomic is engineering an atomic gravimeter designed to operate without active motion stabilization during representative flight dynamics. Focusing on reductions in size, weight, and power (SWaP) and manufacturability, the team will complete full system integration and laboratory characterization through the remainder of 2026 ahead of airborne platform demonstrations in 2027.<br>\nComplementing its passive gravitational and magnetic navigation sensors, IonQ highlighted the autonomous holdover performance of the turnkey EG-30 iodine optical clock, which requires no vacuum chamber or reference cavity and delivers 100 MHz, 10 MHz, 5 MHz, and 1 PPS microwave outputs alongside optical references. Validated under live sea conditions aboard the training ship TS Patriot State, the clock provides continuous timing resilience when satellite signals are jammed or spoofed.<br>\nRead IonQ’s technical overview on optical clock holdover here, view IonQ’s LinkedIn announcements on the DARPA GRAVMAP Phase II Option here and maritime PNT deployments here, and inspect the Evergreen-30 here and Dual Comb here product datasheets.<\/p>","content_hash":"4e099b6bf53806f7aae00d7798b1de19","author":"Mohamed Abdel-Kareem","published_at":"2026-11-24T18:02:01","fetched_at":"2026-11-26 16:15:58","word_count":437,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"fb54b68b272424ea","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10359","title":"Moar Videos and Links","url":"https://scottaaronson.blog/?p=10359","summary":"In the wake of the Riemannocalypse, here, for better or worse, is a very special video&#8212;unlike any I&#8217;ve done before&#8212;recorded just this weekend at Lighthaven in Berkeley. You get to watch Václav Rozhoň, of the &#8220;Polylog&#8221; YouTube channel, torture me by handing me sticky notes with numerous future milestones (P≠NP, P=BPP, the Collatz Conjecture, Busy Beaver 6 and 7, scalable quantum computers, nuclear fusion, quantum gravity, diseases cured, Dyson sphere around the Sun…)","content":"<p>Moar Videos and Links<br>\nIn the wake of the Riemannocalypse, here, for better or worse, is a very special video—unlike any I’ve done before—recorded just this weekend at Lighthaven in Berkeley. You get to watch Václav Rozhoň, of the “Polylog” YouTube channel, torture me by handing me sticky notes with numerous future milestones (P≠NP, P=BPP, the Collatz Conjecture, Busy Beaver 6 and 7, scalable quantum computers, nuclear fusion, quantum gravity, diseases cured, Dyson sphere around the Sun…), and defying me to place them on the table in the order in which I guess that AIs and/or humans will achieve them.<br>\nYou can also read a full transcript here of my and Václav’s conversation (much of it was cut for the video).<br>\nHere’s one that I’ll share even though I’m less happy about it. Jake Newfield hosted Robin Hanson, who I’ve known for decades, and me for a conversation about … well, I didn’t know about what until I showed up! But Robin came ready to argue that we, humans, should be 100% fine to go extinct and get replaced by robots, whatever values the robots turn out to pursue, and I’m a meat chauvinist if I believe otherwise, and why on earth should I worry that AI will kill me more than I worry that my own children, who also have values potentially different from mine, will kill me? I left feeling like crap, thinking Robin had had the better of the argument, because I’d been unable to muster any counterargument to him that didn’t essentially amount to “seriously? dude? WTF?” But then people overwhelmingly take my side in the YouTube comments (and criticize Robin for not letting me speak), so I guess there’s that!<br>\nColleague and friend-of-the-blog Or Zamir shares his thoughts on the recent AI math breakthroughs—arguing that rather than lapsing into despair, we should seize the steering wheel, choose the destinations we care about, and use the new tools to help us get to them.<br>\nA high school student in India named Parth Anand, whose parents were injured by a pothole, has started what he calls Project Sadak, which can be used for reporting potholes anywhere in the world. He requests that people who are interested donate a few hundred dollars via PayPal to allow him to keep the project going.<\/p>","content_hash":"d25fd17b2dd664402db8240bc3c33e17","author":"Scott","published_at":"2026-11-23T15:15:25","fetched_at":"2026-11-26 16:15:55","word_count":384,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3d","domain":"scottaaronson.blog"},{"id":"35f0fd7f985086e3","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10344","title":"The stochastic parrots have apparently proved the Riemann Hypothesis","url":"https://scottaaronson.blog/?p=10344","summary":"&#8220;&#8230; it is very probable that all roots are real. Of course one would wish for a rigorous proof here; I have for the time being, after some fleeting vain attempts, provisionally put aside the search for this, as it appears dispensable for the immediate objective of my investigation.&#8221; &#8211;Bernhard Riemann, 1859 [Update: According to “Poe’s Law,” there is no irony or sarcasm on the Internet so obvious that it won’t fly over countless people’s heads. In line with that, lots of pe","content":"<p>The stochastic parrots have apparently proved the Riemann Hypothesis<br>\n“… it is very probable that all roots are real. Of course one would wish for a rigorous proof here; I have for the time being, after some fleeting vain attempts, provisionally put aside the search for this, as it appears dispensable for the immediate objective of my investigation.” –Bernhard Riemann, 1859<br>\n[Update: According to “Poe’s Law,” there is no irony or sarcasm on the Internet so obvious that it won’t fly over countless people’s heads. In line with that, lots of people on social media are now saying variants of “how dare Scott Aaronson call LLMs ‘stochastic parrots,’ that demeaning and trivializing term from 2021? Doesn’t he understand that these so-called ‘stochastic parrots’ just proved the Riemann Hypothesis?” ROFL.]<br>\nI’m in California to visit Oratomic and then Inkhaven. I woke up this morning to the news that Levent Alpöge says that he’s gotten Anthropic models to prove the Generalized Riemann Hypothesis, producing 17.4 million (!!) lines of Lean code.<br>\nAt a dinner last night, someone asked me “so, how much longer until an AI proves the Riemann Hypothesis? Still several more years?” I replied, don’t be sure of such things anymore. After all, AI has already proved that the nontrivial zeros of the Riemann zeta function are at most 3/8 away from the critical line (Quanta just published its article on that breakthrough yesterday!), and that already carries most of the implications for number theory that a full proof of RH would have. So who the hell knows what else is possible, and how quickly?<br>\nFor those tuning in from home, the Riemann Hypothesis says (in its easiest-to-understand version) that the number of prime numbers from 1 to n is very close to what it would be if each integer x>1 had an independent 1/ln(x) probability of being prime, up to a standard statistical error term that never exceeds Õ(√n). While we’ve known since 1896 that the number of primes from 1 to n is asymptotic to n/ln(n) (that’s the famous Prime Number Theorem), you could’ve imagined the deviations being much larger.<br>\nDavid Hilbert famously said, “If I were to awaken after having slept for a thousand years, my first question would be: Has the Riemann Hypothesis been proven?” Meanwhile G. H. Hardy, on a ship that he feared might sink, sent his colleagues a telegram claiming to have proven RH, so that if the worst came to pass, at least the world might believe that a proof sank with him.<br>\nMany will of course question whether the proof announced today will stand. They’ll point out that, despite how heavily the world is now “lean-ing” on it, the Lean formal verification system still has issues, from kernel bugs (which have, in the past, allowed proofs of 0=1) to uncertain soundness of the underlying type theory. In my view, these issues can and should urgently be fixed! Until they are, a sufficiently motivated AI could almost certainly exploit them to prove a false statement!<br>\n[Update (Nov 21): The proof has now been verified independently by the Lean community, using con-leche, a piece of Lean that itself is formally verified all the way down to the axioms of set theory. This is a much higher degree of verification than a typical human paper accepted to a math journal. The proof is correct.]<br>\nAll the same, I see zero indications that that’s happening right now. I note that, so far, not one of the AI results with Lean certificates has needed to be retracted (while several without Lean certificates have needed to be). So I’m not 100% sure, but my bet is that the proof will stand.<br>\nMathematicians of course won’t be satisfied with 17 million lines of Lean. They’ll be satisfied when, and only when, they’re able to explain and distill and reconstruct the ideas for themselves. And that will probably take years, since human mathematicians move only at biological speeds. And while they’re working on it, how many more such wonders will there be, in this age of wonders and terrors?<br>\nMy 9-year-old son, informed that RH was proved, replied that he’s not even surprised at this point. Maybe you need to have come of age in the human math era to be surprised by such things.<br>\nThe P=?NP problem now moves firmly into place as the Final Boss of the Math We’ve Cared About, the position I always thought it should occupy. But for how much longer? For how much longer will anything last that we currently take for granted?<br>\nIt was only a couple days ago that my wife and I had the following conversation:<br>\nDana: I turned off the irrigation, yet somehow water in our house is still leaking. We need to…<br>\nMe: Look, a lot of the smartest people I know now think that recursive self-improvement and the end of the entire known world are coming in 12-18 months. This leak…<br>\nDana: We should still fix the leak.<\/p>","content_hash":"c0438c60ff4122bbf851a45614e5d9a8","author":"Scott","published_at":"2026-11-20T18:29:03","fetched_at":"2026-11-26 16:15:55","word_count":831,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5d","domain":"scottaaronson.blog"},{"id":"ee4c13cb8b69e882","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18473","title":"Love, Logical Gates, and Unrealistic Expectations","url":"https://quantumfrontiers.com/2026/11/18/love-logical-gates-and-unrealistic-expectations/","summary":"I have a confession. I watch YouTube recaps of movies and TV shows (at double speed) and then discuss them as if I had actually watched them. My wife hates it. We were at a party, and she overheard me discussing Game of Thrones. “He’s a phony! He hasn’t watched a single episode!” “I’m not sure what she’s talking about. Anyways, can you believe Arya killed the Night King?” I recently “watched” Materialists. It’s about Lucy Mason, a matchmaker whose clients shop for partners by spec sheet: height,","content":"<p>I have a confession. I watch YouTube recaps of movies and TV shows (at double speed) and then discuss them as if I had actually watched them. My wife hates it.<br>\nWe were at a party, and she overheard me discussing Game of Thrones.<br>\n“He’s a phony! He hasn’t watched a single episode!”<br>\n“I’m not sure what she’s talking about. Anyways, can you believe Arya killed the Night King?”<br>\nI recently “watched” Materialists. It’s about Lucy Mason, a matchmaker whose clients shop for partners by spec sheet: height, age, income, even star sign. One wants a 6′4″ man in his forties who earns over $500,000 and has a good hairline. She calls such guys “unicorns.”<br>\nThis is a lot like my job.<br>\nI’m looking for quantum error-correcting code unicorns. The main difference is my boxes are different: large code distance, high encoding rate, low-weight checks, low qubit degree, and cheap logical gates.<br>\nOf these, that last box has been on my mind a lot lately, and it’s the focus of our recent paper. What expectations should I have when searching for a code in this respect? Am I’m being as unrealistic as Lucy’s clients?<br>\nWhat are we looking for?<br>\nWe know of codes that make for excellent quantum memories. They pack many logical qubits into relatively few physical ones, protect them with a large code distance, and allow for errors to be checked in an efficient way: each check involves only a few physical qubits, and each physical qubit participates in only a few checks. Several boxes checked already. Not quite a unicorn, but close.<br>\nThe problem is that computation is another story. Intuitively, the more logical qubits we pack into a shared physical system, the harder it can become to operate on one without disturbing the others. This can make it difficult to implement addressable logical gates.<br>\nThere are several ways to implement such gates, and I won’t survey them here. But, among the cheapest are those implemented using only physical single-qubit gates and qubit permutations. The latter means rearranging the physical qubits, or sometimes just relabelling them in software. Note that, whether or not permutations are cheap is hardware dependent, but for neutral atom platforms they can be. Because the information is encoded collectively, these simple physical operations can produce various gates, including entangling logical gates.<br>\nThese gates have a lot going for them. The single-qubit operations fit into one parallel layer. They require no extra qubits or measurements. And when permutations are performed by physical rearrangement or software relabelling, they don’t spread errors between physical qubits. Single-qubit gates are also typically among the lowest error operations available on hardware.<br>\nIf you add one restriction—that the physical single-qubit gates must be Cliffords—these cheap gates become automorphism gates. The restriction is useful because we have tools for finding codes that support them. We can construct such codes analytically or search for them numerically. We’re much less good at doing the same for arbitrary single-qubit rotations. That combination of cheap implementation and tractable code design has made automorphism gates increasingly popular. They play a key role in most modern quantum computing architectures, for example, Mitten codes, IBM’s tour de Gross, and the Pinnacle architecture.<br>\nThese architectures use them both directly to perform logical gates and alongside the more resource-intensive method of code surgery to reduce its overhead. Surgery involves joint measurements between encoded systems, often with additional resource states and repeated measurement rounds. The aim is to let automorphism gates handle as much of the computation as possible, reducing how much surgery is needed.<br>\nNaturally, when searching for a code, we’d like a large automorphism group: a large collection of distinct logical operations available through these cheap physical ingredients.<br>\nHigh rate, large distance, simple checks, and now a large automorphism group. Add it to the list.<br>\nFour things I learned<br>\nIn our work we set out to understand how much automorphism gates can offer, and what a code has to give up to support them. Below are some things I learned (for a complete story you’ll need to read the paper).<br>\n(1) How much can you ask of one code?<br>\nSuppose I temporarily relax the other items on my checklist. I’ll allow as many physical qubits as needed and put aside concerns about encoding rate and check weight. Fix only the number of logical qubits, k. How large an automorphism group could a code possibly have?<br>\nFor stabilizer codes encoding k > 2 logical qubits, we determine the largest attainable automorphism group. In a suitable logical basis, it consists of all operations built from addressable logical phase gates (S) and controlled-NOT gates (CNOT). We also construct codes that attain this maximum. So this is a ceiling we can actually reach. (The cases k = 1 and k = 2 are special; we discuss them in the paper.)<br>\nCSS codes are an important family of quantum error-correcting codes. They allow bit-flip and phase-flip errors to be checked separately, and include most widely studied codes. CSS codes can also attain this maximum.<br>\nThe S gate changes the relative phase between a qubit’s two basis states by a quarter turn. CNOT flips a target qubit conditional on the state of the control qubit, and can generate entanglement. Addressability means we can apply S to any chosen logical qubit and CNOT to any chosen control–target pair. All combinations of these gates make up the group.<br>\nSo, is that a lot?<br>\nIt depends what you mean by “a lot.” Compared with the full logical Clifford group, this group contains exponentially fewer gates. But it shares a useful feature with the full Clifford group: adding just one suitable non-Clifford gate type makes it universal. Together, these gates let us approximate any quantum computation as accurately as we like.<br>\nClients could always ask Lucy for someone a little taller or a little wealthier. But with automorphism gates, there’s a clear limit to what you can ask for.<br>\n(2) The anatomy of a good match<br>\nThe automorphism gates of CSS codes have a useful structure. Every automorphism combines physical single-qubit Cliffords and permutations to produce a logical gate. For a CSS code, we find that—apart from a special case discussed in the paper—the Clifford layer and the permutation are each on their own valid logical gates. We can apply either part independently while preserving the encoding.<br>\nThis makes studying CSS automorphisms much simpler. We can study which logical gates come from physical single-qubit Cliffords, study which come from permutations, and then combine the answers.<br>\nThe two ingredients also have complementary capabilities. Physical single-qubit Cliffords cannot implement logical CNOT or SWAP gates. In the generic CSS setting, their largest attainable logical group is generated by addressable S and CZ gates, where CZ is a two-qubit entangling phase gate.<br>\nPermutations fill the other role. Their largest attainable logical group is generated by all addressable CNOTs, but they cannot implement logical S or CZ gates. Together, the two ingredients can attain the maximum automorphism group from the previous section.<br>\nLike good partners, they can each stand on their own—and together, they complete each other.<br>\n(3) High standards, higher qubit counts<br>\nIn the first result, I gave my ideal code an unlimited physical-qubit budget. Now it’s time to put that budget back into the picture.<br>\nFor a stabilizer code encoding k > 2 logical qubits, supporting all addressable logical CNOTs through automorphisms requires at least<br>\nphysical qubits. That’s exponential growth. Since the maximum automorphism group contains all these CNOTs, reaching that maximum inherits the same cost. This extends earlier bounds on phantom codes.<br>\nThis bound is tight: a certain type of phantom code attains it.<br>\nThe other ingredient from the previous section is considerably cheaper. Supporting all addressable logical S and CZ gates through physical single-qubit Cliffords requires only<br>\nWe also attain this quadratic bound with complete-graph codes. Their construction uses one physical qubit to store each logical qubits parity and one physical qubit for each pair of qubits to store the pairwise parities—whether the corresponding bits agree or differ. This information allows physical single-qubit phase gates to implement logical CZs.<br>\nThere is an important qualification. The bounds hold at every code distance, but our constructions attain these exact minima at distance one, where some single-qubit errors can go undetected. We can increase the distance through concatenation: encoding each physical qubit in a suitable additional code. This preserves the gate capabilities and adds physical qubits. Finding the optimal cost at a specified higher distance remains open.<br>\nSo a gate can be cheap to apply while demanding an expensive code.<br>\nAs with finding a partner, the details of the wish list matter. For quantum codes, the full set of addressable CNOTs is a much more expensive request than all addressable S and CZ gates.<br>\n(4) Looking for love in the wrong metrics<br>\nS and CZ have something important in common: they are diagonal gates. They change the relative phases between basis states without mixing those states. We wondered whether their relatively low qubit cost extends to diagonal non-Clifford gates.<br>\nIt does. Here we expand the physical toolbox beyond automorphisms, allowing diagonal single-qubit rotations that needn’t be Cliffords.<br>\nFor example, we construct codes supporting all addressable logical T, controlled-S, and controlled-controlled-Z (CCZ) gates using only physical single-qubit phase rotations. T applies an eighth-turn phase, while the controlled gates make phase changes depend on additional qubits. Supporting this whole collection requires only cubically many physical qubits.<br>\nMore generally, the polynomial scaling persists at every fixed level t of the Clifford hierarchy, a sequence of gate classes extending beyond Cliffords. We can support all addressable diagonal logical gates at that level using<br>\n\\(n = O(k^t)\\)<br>\nphysical qubits. Our complete-hypergraph codes attain the corresponding bounds by extending the pairwise-parity construction to larger subsets of logical qubits. As before, the exact minima occur at distance one, and suitable concatenation increases the distance while preserving the gates.<br>\nSo being non-Clifford doesn’t automatically make a gate set expensive in physical qubits. In this setting, the sharp cost separation lies between diagonal gates and CNOT-type gates.<br>\nThere’s another misleading metric: group size. These diagonal non-Clifford groups can contain many more logical operations than the entire CNOT group, yet require polynomially many physical qubits where the CNOT group requires exponentially many.<br>\nNeither the Clifford label nor the group’s size tells me what the relationship will cost.<br>\nHappily ever after, subject to constraints<br>\nSo how did this project change my approach to matchmaking code construction?<br>\nAutomorphism gates are not something to blindly maximize. Achieving the maximum comes at the price of an encoding rate that falls rapidly as k grows. Maximum gate sets may still be worthwhile for moderate k, especially as hardware scales. But, when high rate is a priority, I should choose automorphisms selectively, targeting the expensive operations I want them to replace.<br>\nI also need to look at the structure of the logical action. Neither Cliffordness nor logical-group size reliably predicts physical-qubit cost.<br>\nThere are plenty of questions left. Here are a few I’m particularly keen to answer:<br>\n- How does the minimum qubit cost depend on distance?<br>\n- How much can we save by asking for a smaller gate set—for example, CNOTs between only selected logical pairs?<br>\n- Can we extend the theory to arbitrary physical single-qubit gates? These retain the appeal of simple, depth-one circuits. We need better methods for finding and analyzing codes that support them.<br>\n- How should we uses automorphisms? They can perform logical gates directly or help make code surgery cheaper. What combination gives the greatest benefit for a particular workload and hardware platform?<br>\n- What changes if we allow more general physical two-qubit gates? These could act within a codeblock or between blocks. Which new logical operations become possible, and what do they cost in connectivity, circuit depth, and error spreading?<br>\nIf you’ve only skimmed this post, feel free to discuss it at your next party as though you read every word. Just make sure my wife isn’t there.<\/p>","content_hash":"736229971a457c62fdaccbb28fc199cf","author":"Shayan Majidy","published_at":"2026-11-19T06:00:00","fetched_at":"2026-11-26 16:16:00","word_count":1996,"read_time_minutes":10,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"1w","domain":"quantumfrontiers.com"},{"id":"0da679643a8d430e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18451","title":"For azure views","url":"https://quantumfrontiers.com/2026/11/15/for-azure-views/","summary":"The first time I moved to England, I brought the book The Age of Wonder. In it, biographer Richard Holmes sketches scientists who marveled at nature during the Romantic Era. I met Joseph Banks, William and Caroline Herschel, and Humphry Davy while reveling in condensed-matter theory as a research assistant at Lancaster University. This August, I moved to the University of Cambridge for the rest of the summer and much of the fall. My baggage included an e-copy of Holmes’s most recent book. The Bo","content":"<p>The first time I moved to England, I brought the book The Age of Wonder. In it, biographer Richard Holmes sketches scientists who marveled at nature during the Romantic Era. I met Joseph Banks, William and Caroline Herschel, and Humphry Davy while reveling in condensed-matter theory as a research assistant at Lancaster University.<br>\nThis August, I moved to the University of Cambridge for the rest of the summer and much of the fall. My baggage included an e-copy of Holmes’s most recent book. The Boundless Deep profiles Alfred Tennyson, who served as poet laureate of the United Kingdom for approximately 42 of Victoria’s nearly 64 years as queen. Even if Tennyson’s name doesn’t ring a bell, some of his verses might—partially because those verses chime with a bell’s sonorousness. Tennyson wrote, “’Tis better to have loved and lost / Than never to have loved at all,” in an elegy for a friend. That friend’s death—the heartlessness and violence of mortality—led Tennyson to write of “Nature, red in tooth and claw.” He also glorified heroism, depicting the ancient Greek Odysseus as yearning “[t]o strive, to seek, to find, and not to yield.”1<br>\nTennyson grew up in Lincolnshire, on the eastern coast of England. He adored the sea, whose wildness and grandeur infused his spirit. As an undergraduate at the University of Cambridge, Tennyson formed friendships that helped sustain him for decades. Former schoolmates hosted him in their homes, encouraged him, criticized him with affection, and urged him to publish his poetry. For years, Tennyson published little: he drifted from house to house, chain-smoked, recited poetry to friends for hours in the evenings, and waffled about his love for fellow Lincolnshire native Emily Sellwood. The two married once Tennyson published his elegy and the public responded with rapture. The poet laureateship followed that year.<br>\nHolmes tracks not only Tennyson’s path through literature, but also the poet’s appetite for science and technology. Discoveries and inventions fascinated Tennyson. At Cambridge, he studied under William Whewell, whose contributions to mathematics, physics, astronomy, geology and more defy cataloguing. The back of Holmes’s book lists “some popular science books read by Young Tennyson.” They include Darwin’s On the Origin of Species by Means of Natural Selection; a guide to microscopes; and a treatise by mathematician, co-founder of computer science, and steampunk inspiration Charles Babbage.<br>\nScience suffused Tennyson’s poetry, Holmes argues. The biographer illustrates with The Princess, an 1847 poem that advocates for higher education for women. The poem opens with a science festival: “a fire-balloon / Rose gem-like up before the dusky groves.” In steampunk fashion, “round the lake / A little clock-work steamer paddling plied / And shook the lilies.” You can read the rest of the description in what appears to be a first edition. The scene opens in the stanza that begins nearly halfway down the following right-hand page.<br>\nSub-librarian Steven Archer plucked the book for me from the Wren Library at Trinity College, Cambridge this November. Trinity postdoctoral fellow Andrea Pizzi had guessed that I’d appreciate the library and invited me to visit. He guessed correctly.<br>\nThe Boundless Deep has appealed to me not only because it highlights the Victorian era—what has become my era—or because it meshes science with poetry. I also view the book as offering guidance about a technology gnawing at society today: artificial intelligence. You don’t need for me to recap the shock delivered by AI to many people’s sense of humanity, the horror sweeping the globe. But did you know how similarly the Victorians felt?<br>\nDuring the 1800s, geologists Charles Lyell, Roderick Murchison, and others found evidence of extinctions. They unearthed fossils from species extinguished eons beforehand. The scale of those destructions boggled the Victorians’ minds. A species consists of so many creatures—so many wriggling, striving living beings. How could an entire species disappear from the face of the Earth? How could so many species have disappeared? Would humanity share their fate? If so, why bother living, striving, wriggling?<br>\nAs Holmes writes, “Geology soon became an area of spiritual terror, with claustrophobic glimpses of a cruel, meaningless, godless physical world closing in on the heels of humanity. It was full of monsters, dust and extinctions, making nonsense of any idea of progress or individual immortality.” Nature, red in tooth and claw, indeed.<br>\nI’ve been reading The Boundless Deep alongside headlines about cyber hacks, job losses, bias studies, and mathematician breakdowns attributable to AI. To the extent that AI poses problems for society, I don’t have silver bullets. But I take comfort in humanity’s having experienced similar tremors in the past. Granted, AI and extinctions differ in some ways, despite resembling each other. And perhaps we shouldn’t respond as the Victorians did. Most people today take extinctions for granted, and schoolchildren effuse about the fossils that alarmed Tennyson’s contemporaries. Perhaps future generations will view AI as the Victorians viewed those fossils. Either way, we’re not alone: the Victorians felt as many people do today.<br>\nAnd we know how Tennyson responded: with poetry.<br>\nWith thanks to Andrea Pizzi; Steven Archer; the Isaac Newton Institute for Mathematical Sciences; and King’s College, Cambridge.<br>\n1Tennyson used the Latin name Ulysses for Odysseus.<\/p>","content_hash":"b634a4defa5a2fd77fc11680ee92e61e","author":"Nicole Yunger Halpern","published_at":"2026-11-16T07:25:25","fetched_at":"2026-11-26 16:16:00","word_count":859,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"1w","domain":"quantumfrontiers.com"},{"id":"a0e4bf6201213896","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10321","title":"More podcasts, conversations, talks","url":"https://scottaaronson.blog/?p=10321","summary":"Here&#8217;s my talk &#8220;Are We Cooked?&#8221; about the AI Mathocalypse&#8212;the one where, every time I give it, I need to update it with all the big theorems AI has proved since the last time I gave the talk. This version is from the Institute for Foundations of Machine Learning (IFML) here at UT Austin, back on October 2 (so, ancient times). Here I am with Rabbi Neil Blumofe of Agudas Achim synagogue in Austin. Rabbi Blumofe asks me about quantum mechanics, AI, consciousness, free will, ","content":"<p>The Blog of Scott Aaronson If you take nothing else from this blog: quantum computers won't solve hard problems instantly by just trying all solutions in parallel.<br>\nHere’s my talk “Are We Cooked?” about the AI Mathocalypse—the one where, every time I give it, I need to update it with all the big theorems AI has proved since the last time I gave the talk. This version is from the Institute for Foundations of Machine Learning (IFML) here at UT Austin, back on October 2 (so, ancient times).<br>\nHere I am with Rabbi Neil Blumofe of Agudas Achim synagogue in Austin. Rabbi Blumofe asks me about quantum mechanics, AI, consciousness, free will, why I say “please” and “thank you” to GPT, and why I blog about Israel. The questions from the audience, unexpectedly, were more like “will cryptocurrencies that use RSA or Diffie-Hellman take longer to break with quantum computers than those that use elliptic curve cryptography?” Thanks to Rabbi Blumofe for doing this.<br>\nAnd here’s a podcast with Yu Shen, with Chinese subtitles. I haven’t watched this one and don’t remember what we talked about. (Oh — looking at the title graphic, apparently we talked about when AI will solve the P vs NP problem?)<br>\n62 Responses to “More podcasts, conversations, talks”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"1cccb8b5b7ab1073bfd9994fcbd0afb6","author":"Scott","published_at":"2026-11-15T14:30:28","fetched_at":"2026-11-26 16:15:55","word_count":370,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"f98a357a67e50529","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10318","title":"Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!","url":"https://scottaaronson.blog/?p=10318","summary":"Enjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code&#8217;s limitations. She doesn&#8217;t get to the soundness analysis. Feel free to ask questions in the comments. I mig","content":"<p>The Blog of Scott Aaronson If you take nothing else from this blog: quantum computers won't solve hard problems instantly by just trying all solutions in parallel.<br>\nEnjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code’s limitations. She doesn’t get to the soundness analysis.<br>\nFeel free to ask questions in the comments. I might write some notes here later with my own doofus understanding of Dana’s talk. Experts are of course hard at work on more formal writeups of the proof (which will hopefully be more comprehensible than the AI’s writeup).<br>\nThis entry was posted<br>\non Tuesday, November 10th, 2026 at 2:27 pm and is filed under AI, Announcements, Complexity.<br>\nYou can follow any responses to this entry through the RSS 2.0 feed.<br>\nYou can leave a response, or trackback from your own site.<br>\n144 Responses to “Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"f7a800a85a7d77e79118fdb829a66b1d","author":"Scott","published_at":"2026-11-10T20:27:28","fetched_at":"2026-11-26 16:15:56","word_count":367,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"3a6f0747d33bd6f2","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10295","title":"Aaronson-Ambainis Conjecture proved!  (By AI, of course)","url":"https://scottaaronson.blog/?p=10295","summary":"The &#8220;For Dummies&#8221; Version (apologies for not including this earlier): Yes, an AI solved a big open problem about quantum computing No, this doesn&#8217;t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter What it does, is to rule out a potential class of quantum speedups that most of us didn&#8217;t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially ","content":"<p>Aaronson-Ambainis Conjecture proved! (By AI, of course)<br>\nThe “For Dummies” Version (apologies for not including this earlier):<br>\n- Yes, an AI solved a big open problem about quantum computing<br>\n- No, this doesn’t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter<br>\n- What it does, is to rule out a potential class of quantum speedups that most of us didn’t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially faster than any classical algorithm)<br>\n- It means my prediction was right, so you should listen to me more in the future!<br>\nWe now, of course, live in age where longstanding open problems in quantum computing theory (and all theoretical computer science, and all math) are dropping like flies, to the extent that there’s no way I could possibly do a post on each and every bombshell. But I can’t exactly avoid the Aaronson-Ambainis Conjecture, given that my name is on it, and that I cared about the answer to this one (back in 2019, I even blogged about an attempted solution that ultimately turned out to be fallacious).<br>\nFor those tuning in from home, the AA Conjecture, which Andris and I posed back in 2009, says that every degree-d polynomial p:{0,1}n→[0,1] in n Boolean variables, with constant variance, has some variable whose influence is at least 1/poly(d). The reason Andris and I cared about this conjecture is that, as we proved, it implies that there’s no superpolynomial advantage of quantum query complexity over classical query complexity for decision problems that works on most Boolean inputs. Or, in terms of complexity classes, that there’s no hope of separating P from BQP relative to a random oracle, without proving P≠BQP or something of the kind in the unrelativized world. This would finally answer a question of Fortnow and Rogers from 1998.<br>\nThe connection between quantum algorithms and polynomials came from the famous 1998 paper of Beals et al., which showed that, if Q is a quantum algorithm that makes T queries to an oracle X, then Pr[Q(X) accepts] can be written as a multivariate real polynomial p(X) in the bits of X, of degree at most 2T. The proof of my and Andris’s result is then simply this: take the polynomial p, find in it a variable of influence at least 1/poly(T), and query that variable, and keep repeating until there’s no longer such an influential variable—at which point, by assumption, p is nearly a constant polynomial, which means you’ve learned whether Q accepts with high probability over X. This provides a classical simulation of the quantum algorithm Q—a simulation that makes poly(T) queries to the oracle X and that works for most X’s.<br>\nThe AA Conjecture caught on to an extent Andris and I couldn’t have predicted. Some who worked on it barely even cared about the implication for quantum computing, and just wanted to solve the problem about polynomials! There were, I’m both proud and sorry to report, Fourier analysis experts and grad students who oriented their whole research programs around trying to prove AA, with lots of proofs of special cases, some of them very recent. A proof of full AA was one of the last remaining open problems in quantum query complexity that everyone seemed to agree was centrally important. I was surprised, honestly, to see it missing from OpenAI’s Mathocalypse dump a few weeks ago. Surely they tried it, so was it really so much harder than all the problems that were solved?<br>\nNow a startup called Physical Superintelligence has announced a proof of the AA Conjecture, specifically showing that there’s a variable of influence at least ~1/d6, which they say they obtained using their proprietary research harness on an internal Claude model. (What role the harness played, compared to the internal model, is something I don’t know.) The effort was led by David Turturean and Jim Halverson at PSI. They actually let me know about this several weeks ago, but I had to keep it secret until the announcement late last week.<br>\nI haven’t yet understood the proof, although I hope to. In the meantime, though, I believe the proof is correct for two reasons. Firstly, there’s a Lean certificate, and secondly, human experts (I’m no longer an expert on my own conjecture!) have already gone over it and understood it. In fact, there’s already a beautiful-looking exposition written by Guy Blanc of MIT and Jordan Docter, Carmen Strassle, and Li-Yang Tan of Stanford, which looks like a perfect starting point for those seeking to go much deeper. [Update: There’s now even a 5-page proof of Aaronson-Ambainis by my former postdoc Supartha Podder, and his students Thomas Huffstutler and David Miloschewsky! I’ll probably start there!] Or, for those seeking to go only slightly deeper, PSI’s blog post on the advance is sufficiently well-written that it saves me from the need to write too much more here.<br>\nAlas, as reported by Ashley Montanaro, there were the usual forehead-banging misconceptions about what this result means for quantum computing. So for example, Pedro Domingos of U. of Washington blasted out to his 137,000 X followers that the proof means that “the dream of quantum supremacy is dead.” The truth, as Pedro knows perfectly well (or easily could know), is that it rules out one particular type of quantum supremacy (namely, for yes-or-no problems relative to random oracles) that we’d already conjectured didn’t exist anyway. It doesn’t undermine any form of quantum supremacy that we did conjecture to exist! It has zero effect, for example, on Shor’s factoring algorithm, which uses a highly non-random (periodic) oracle for the key internal step. It has zero effect on the simulation of quantum physics and chemistry, which generally doesn’t depend on oracle algorithms at all. Even just relative to random oracles, the Yamakawa-Zhandry breakthrough from 2022 dramatically underscored that, if we switch our attention from decision problems to other kind of problems (in Yamakawa and Zhandry’s case, to NP search problems), then exponential quantum speedups do become possible. Anyway, this was sufficiently intellectually dishonest on Pedro’s part that it makes me disinclined to take him seriously about anything ever again [ADDED: I appreciate that Pedro has now posted a partial correction, saying “or maybe not”].<br>\nBut, OK, given how radically new it is to have an AI solve so many of our longstanding open problems, I suppose “people are wildly misinterpreting a QC advance on social media” is an almost comfortingly familiar problem to have!<br>\nIf you’re wondering how I feel about the proof of AA—well, much like my wife Dana with the Unique Games Conjecture, it’s many different emotions at once.<br>\n- Satisfied that our conjecture turned out to be true after all (it’s nice to be 100% right about something from time to time!)<br>\n- Awestruck by the new reality of the world in which we live in<br>\n- Disappointed that humans didn’t get to snag this conjecture before the robots did (with some more years, I think it’s very likely that they would have)<br>\n- Fatigued by the endless wonders from Aladdin’s Cave, the neverending buffet of solutions to longstanding open problems, wondering when if ever we’ll have time to digest it all<br>\nAnyway, huge congratulations to David Turturean and Jim Halverson, to Physical Superintelligence, and of course to Claude on this achievement!<\/p>","content_hash":"e46a0b6f8c333f0b84c8d702e495bd88","author":"Scott","published_at":"2026-11-08T21:44:31","fetched_at":"2026-11-26 16:15:56","word_count":1231,"read_time_minutes":7,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"9759b0106f7703ca","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10283","title":"Thoughts on a historic week","url":"https://scottaaronson.blog/?p=10283","summary":"As everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole&#8212;because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI&#8217;s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin&#8217;s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it. But","content":"<p>Thoughts on a historic week<br>\nAs everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole—because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI’s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin’s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it.<br>\nBut also, yes, there was an election.<br>\nI remember that, when Dana and I moved to Texas in the summer of 2016, we were excited to be a small part of what seemed at the time like Texas’s impending transformation into a cosmopolitan blue state.<br>\nAnd now the prophecy is finally being fulfilled. But so many strange and harrowing things have happened in the interim, that I feel like Murph when her father finally returns to her at the end of the movie Interstellar.<br>\nSo it turns out that, indeed, the Democrats could’ve easily recaptured both houses of Congress without any need to sell their souls to the likes of Hasan Piker or Abdul El-Sayed. And now the keffiyeh-clad revolutionaries will claim a mandate directly from the people, to put to the sword all the evil landlords and techbros and kulaks and bourgeoisie and (obviously) Zionists, and thereby finally usher in the utopia that failed the first 10,000 times it was tried. I see them as more likely to inspire a Republican comeback in 2028 (as unlikely as it seems this week) than to achieve their stated goals.<br>\nFor please remember that the socialist firebrands massively underperformed more moderate Democrats on Tuesday—it looks like the socialists were merely lifted up by the same tide of justified anti-MAGA rage. Yes, in the US and across the Western world, some university humanities departments continue to churn out young people who’d see my family’s slaughter as an inspiring (or at least deeply understandable) act of revolutionary justice, and who vote on that basis. By and large, though, the American voters simply belatedly realized that Trump is a charlatan who was never going to deliver anything he promised, and also they wanted cheaper gas.<br>\nThe Allied victory over Nazi Germany was glorious, it called for parades and dancing in the street, and it was 3,000% earned by Nazi behavior if anything in human history ever was. It left only one tiny problem for the future—namely that, within the winning coalition, the fans of liberal democracy, science, and Enlightenment still needed to confront the Stalinists, whose evil rivaled even the Nazis’, yet who believed their fanatical ideology to be the one vindicated by events. Why was I so often thinking about that these past couple days?<br>\nThere was, of course, also a big election in Israel. Given the results, I pray that Gadi Eisenkot finds some way to form a coalition, or at least soft coalition, with Israel’s Arab parties, since that’s clearly what it will now take finally to topple Netanyahu, a man whose corruption (like Trump’s or Ken Paxton’s) knows no bounds. I’m under no illusions that this step would do anything to appease the hundreds of millions of protesters around the world whose true demand (as they’ll explain if you ask them) never had anything to do with Israeli policies or Gaza or the West Bank or Bibi Netanyahu, but was always simply that Israel cease to exist—that Israel’s Jews either “go back to Poland” or the other countries where their grandparents were murdered or expelled, or preferably just die, as on October 7.<br>\nNevertheless, I pray for a coalition of moderate Israeli Jews and Arabs, firstly because it’s morally right, secondly because it’s politically expedient, and thirdly because it will impress on at least some fair-minded observers the enormity of the moral chasm here—that, whereas the Arab countries expelled or murdered virtually all of their Jews, the State of Israel not only tolerates its Arab minority but gives it the right to vote and to wield power.<br>\nWhatever else one can say, Israel’s Arabs have been sufficiently loyal to their nation that, on October 7, Hamas murdered them right along with the Jews, treating them as Zionist collaborators and traitors to Islam. I’d like to see that loyalty rewarded with a role in Israel’s governing coalition.<br>\nAs is becoming standard practice with my political posts, I’m closing the comments—because life is short, and these days, the overwhelming majority of comments that I get on posts like this one, whichever ideological axe they’re grinding, are not ones that engender in me even minimal respect for their authors. I apologize to those who would’ve actually pursued a thoughtful dialogue with me or others had I left the comments open—to all five of you, or however many righteous men of Sodom there might be.<\/p>","content_hash":"5eccb21b41c4e341023a500092effa66","author":"Scott","published_at":"2026-11-05T17:48:44","fetched_at":"2026-11-26 16:15:56","word_count":827,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"d96a14c03a92c48b","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10270","title":"Podcasts about the Topic: Part III, with Brian Greene","url":"https://scottaaronson.blog/?p=10270","summary":"Boooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems! So it seems like a perfect occasion to share yet another podcast. I know I&#8217;ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don&#8217;t talk about OpenAI&#8217;s refutation of the Exponential Time Hypothesis be","content":"<p>The Blog of Scott Aaronson If you take nothing else from this blog: quantum computers won't solve hard problems instantly by just trying all solutions in parallel.<br>\nBoooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems!<br>\nSo it seems like a perfect occasion to share yet another podcast. I know I’ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don’t talk about OpenAI’s refutation of the Exponential Time Hypothesis because the announcement of that was still two days in the future!<br>\nBonus Addition From Just This Morning (Nov. 3): Another podcast, about quantum computing, foundations of quantum mechanics, AI, consciousness, and I forget what else … this one with writer Robert Wright, whose book The Moral Animal made a huge impression on me back when I was 13 years old!<br>\n53 Responses to “Podcasts about the Topic: Part III, with Brian Greene”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"5f31b5c964cb91b5a2d2cebf734ed352","author":"Scott","published_at":"2026-10-31T21:40:33","fetched_at":"2026-11-26 16:15:56","word_count":338,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"0083cc178c901677","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10232","title":"Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)","url":"https://scottaaronson.blog/?p=10232","summary":"In my &#8220;Mathocalypse&#8221; post, I mentioned that my wife Dana&#8212;who&#8217;s been working on Subhash Khot&#8
