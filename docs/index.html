rs, as well as ping-pong and foosball and capture the flag.<br>\nThe whole thing is conducted, not in ignorance, but in conscious defiance of the looming tsunami, that AI can already do just about all the fun puzzles discussed at the camp better than humans any can, and that it might leave no point to human-led mathematical research by the time these brilliant kids are adults. Even the kids understand that. The kids and their parents come out of a conviction that, if anything has value in the world, this does—that as long as nerdy humans are alive and reproducing, this is what nerdy humans are here to do. To learn.<br>\nRelatedly, I’ve been reflecting a lot on my life up to this point—inspired by the camp, which reminded me in so many ways of my own childhood and adolescence. Should I have skipped three grades and started college at age 15? Was it worth it to get a head-start on my research career—all the trauma around dating, all the fear that I’d die alone as a celibate nerdy math freak, the decade of suffering and suicidal ideation, while I watched all the normies enjoy life? Or would I have suffered just the same if I hadn’t skipped? Is it all OK, now that I have a lovely family and things have “worked out”? Or am I still carrying around all the trauma from back then? I’ve been more open about my life than 99.99% of humanity, so regular Shtetl-Optimized readers will already know some parts of the story. Other parts I really don’t feel like making public right now.<br>\nI’ve been unloading every day to—who else?—GPT 5.6 Pro about all the pain and trauma and embarrassments of my past. It turns out that, where two years ago GPT was a passable therapist, now it’s the greatest therapist in history, at least for what I need. For every question I have, for example, about just how normal or abnormal my teenage setbacks and anxieties were, it takes the question 100% seriously, addresses it honestly and in depth, looks up relevant research papers, does little Bayesian calculations, and never once tries to change the subject. It also pushes back on my claims—and when it does so, is usually correct.<br>\nI can hear readers shout at me: so basically you’ve been wasting your time, distracting yourself, looking inward and backward as the world surges forward into a terrifyingly unknown future. Why don’t I respond directly to what’s happening—in math, in quantum computing, in AI?<br>\nI’d like to think that I am responding, in my way. I’ve observed that, the faster we race toward the Singularity, the more I feel like stepping back and asking myself: what do I actually value in life? How important to me are math and science, as human practices to be passed down to curious children? Would I even want solutions to P versus NP and the other problems, if the price were to destroy those human practices forever? How do I wish to spend whatever time I have remaining?<br>\nI can justify this focus partly in a pessimistic way: if we are nearing the end of civilization, or even just of the “mathematical research” part of civilization, then it’s time to get right with God, so to speak. It’s time to settle my accounts with myself, with other people, with the universe.<br>\nBut there’s also a more optimistic spin. If I continue doing the sorts of things that other people would expect me to do, then AI will soon do those things better than me, in the unlikely event that it doesn’t already. You want to understand the latest developments in quantum computing or complexity theory? Why are you even asking me, when you could ask GPT 5.6 or Claude Fable? If there’s anything I can still offer the world that AI can’t, I increasingly feel like it won’t involve responding to day-to-day events, but will instead draw on 45 years’ worth of memories and disappointments and ruminations.<\/p>","content_hash":"87de34f20935d8ff94cda6de01f5538e","author":"Scott","published_at":"2026-08-07T22:41:55","fetched_at":"2026-08-08 12:38:53","word_count":1445,"read_time_minutes":8,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"13h","domain":"scottaaronson.blog"},{"id":"d1107e0e5091ce9b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44900","title":"Florida Atlantic University Launches Executive Certificate in Quantum Computing Strategy","url":"https://quantumcomputingreport.com/florida-atlantic-university-launches-executive-certificate-in-quantum-computing-strategy/","summary":"The Executive Education program in the College of Business at Florida Atlantic University (FAU) has launched a new professional certificate course titled \"Quantum Computing: Business and Sourcing Strategy.\" Designed for non-technical enterprise leaders, technology executives, procurement directors, and strategists, the eight-week program focuses on evaluating, sourcing, and deploying quantum capabilities across commercial and public sector [...] The post Florida Atlantic University Launches Exec","content":"<p>The Executive Education program in the College of Business at Florida Atlantic University (FAU) has launched a new professional certificate course titled “Quantum Computing: Business and Sourcing Strategy.” Designed for non-technical enterprise leaders, technology executives, procurement directors, and strategists, the eight-week program focuses on evaluating, sourcing, and deploying quantum capabilities across commercial and public sector organizations.<br>\nScheduled to run from August 24 to October 12, 2026, the 24-hour course ($2,700 tuition) is offered both on-campus at FAU’s Boca Raton campus and via live virtual sessions. Led by Dr. Mehran Basiratmand, Director of Innovation and Programs, alongside College of Business Dean Dr. Daniel Gropper, the curriculum covers four primary areas: enterprise information systems and software licensing agreements, quantum ecosystem evaluation (spanning IBM Quantum, Google Quantum AI, D-Wave, IonQ, Quantinuum, AWS Braket, and Azure Quantum), Quantum-as-a-Service (QaaS) procurement strategies, post-quantum cryptography risk management, and hands-on laboratory exercises.<br>\nThe educational initiative follows FAU’s landmark $20 million agreement with D-Wave Quantum Inc. to install an on-site, 4,400+ qubit Advantage2™ annealing quantum computer at its Boca Raton campus. The installation makes FAU the first university in Florida to host a dedicated, on-premises quantum system, positioning South Florida as an emerging regional hub for hybrid quantum computing research, defense application development, and workforce training.<br>\nReview the official announcement on the FAU Newsdesk here, and explore curriculum details on the FAU Executive Education Portal here.<br>\nAugust 7, 2026<\/p>","content_hash":"eb07f80de8e0f99cf7230f2d085edca7","author":"Mohamed Abdel-Kareem","published_at":"2026-08-07T17:38:13","fetched_at":"2026-08-08 12:38:56","word_count":231,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"19h","domain":"quantumcomputingreport.com"},{"id":"b5acfcd076969f58","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44837","title":"IonQ Reports Record Q2 2026 Financial Results: Revenue Soars 287% to $80.1M, Full-Year Guidance Raised to $290M","url":"https://quantumcomputingreport.com/ionq-reports-record-q2-2026-financial-results-revenue-soars-287-to-80-1m-full-year-guidance-raised-to-290m/","summary":"IonQ, Inc. (NYSE: IONQ) has reported its financial results for the second quarter ended June 30, 2026. The College Park-based trapped-ion leader delivered its fifth consecutive quarter of record results, driven by global deployments of its IonQ Tempo systems, accelerating cloud utilization, and the recent closing of its acquisition of SkyWater Technology. The table below [...] The post IonQ Reports Record Q2 2026 Financial Results: Revenue Soars 287% to $80.1M, Full-Year Guidance Raised to $290M","content":"<p>IonQ, Inc. (NYSE: IONQ) has reported its financial results for the second quarter ended June 30, 2026. The College Park-based trapped-ion leader delivered its fifth consecutive quarter of record results, driven by global deployments of its IonQ Tempo systems, accelerating cloud utilization, and the recent closing of its acquisition of SkyWater Technology.<br>\nThe table below summarizes key GAAP financial metrics for Q2 2026 compared with the prior quarter (Q1 2026) and the year-ago quarter (Q2 2025).<br>\n| Amounts in $M | Q2’2026 | Q1’2026 | Q2’2025 | % vs Q1’2026 | % vs Q2’2025 | <br>\n| Revenue | $80.05 | $64.67 | $20.69 | +23.8% | +286.8% | <br>\n| Operating Expenses | $417.29 | $336.18 | $181.29 | +24.1% | +130.2% | <br>\n| Operating Loss | ($337.24) | ($271.51) | ($160.59) | +24.2% | +109.9% | <br>\n| Net Loss | ($1,867.74) | $805.36 | ($176.84) | N/M | +956.2% | <br>\n| Cash and Investments | $2,959.33* | $3,091.90* | $656.80* | -4.3% | +350.6% | <br>\n*Note: Cash and Investments aggregates Cash and Cash Equivalents, Short-term Investments, and Long-term Investments ($2.96 billion total as of June 30, 2026). Baseline comparisons reflect QCR’s previously reported figures ($3.09B for Q1 2026 and $656.8M for Q2 2025, which expanded to a pro-forma $1.6B following July 2025 equity offerings). On a pro-forma basis following the close of the SkyWater acquisition on July 31, 2026, total cash and investments stand at $2.0 billion.<br>\nFinancial Growth and Raised Full-Year Guidance<br>\nIonQ recognized record quarterly revenue of $80.05 million, representing a 287% increase year-over-year and topping the high end of its prior guidance. Revenue diversification strengthened significantly across the business, with international customers accounting for ~50%, commercial enterprise clients comprising ~60%, and multi-product offerings making up ~25% of total Q2 revenue.<br>\nGAAP Net Loss was ($1.87) billion, or ($5.08) per share, heavily impacted by a $1.65 billion non-cash loss from the mark-to-market revaluation of warrant liabilities driven by the increase in IonQ’s stock price. On a non-GAAP basis, Adjusted EBITDA loss was ($120.28) million, which included $24.7 million in R&D expenses associated with its commercial relationship with SkyWater prior to closing the transaction.<br>\nBuoyed by organic momentum, IonQ raised its full-year 2026 revenue guidance to between $280 million and $290 million (representing 100% year-over-year organic growth at the midpoint, excluding SkyWater’s future contributions).<br>\nStrategic M&A: Closing of SkyWater Technology<br>\nOn July 31, 2026 (subsequent to quarter-end), IonQ officially finalized its acquisition of SkyWater Technology, creating the industry’s first vertically integrated, full-stack quantum platform and foundry.<br>\n- Vertical Integration: The transaction embeds dedicated semiconductor manufacturing directly into IonQ’s supply chain, supporting chip-scale miniaturization and scaling for future quantum processing units (QPUs).<br>\n- Nexus Photonics: Complemented by the recent integration of Nexus Photonics, IonQ is expanding its integrated photonics manufacturing stack to accelerate photonic routing, optical interconnects, and QPU packaging.<br>\nCommercial Milestones and Ecosystem Momentum<br>\n- Anduril Partnership: Signed an MOU with defense technology leader Anduril to co-develop quantum sensing, networking, and computing solutions for mission-critical national security and defense bids.<br>\n- Tennessee Quantum Communications Research Center: Partnered with EPB to house the world’s first commercial quantum memory unit installed directly within a live fiber-optic network.<br>\n- Sandia National Laboratories: Entered an MOU to accelerate quantum hardware co-design for national security infrastructure.<br>\n- Quantum Security Expansion: Introduced ClavisXG Multiplex, adding high-performance physics-based key distribution to its network security suite.<br>\n- Space-Based Capabilities: Expanded its on-orbit optical communications terminals to a record high of 84 units in support of U.S. government space initiatives.<br>\nResources and Further Reading<br>\nAdditional information regarding this report can be found in the IonQ Q2 2026 press release here, the Q2 2026 Earnings Presentation here, and the company’s SEC Form 8-K filing here.<br>\nAugust 7, 2026<\/p>","content_hash":"fc36a91395b2699f172c63f35d84982b","author":"Mohamed Abdel-Kareem","published_at":"2026-08-07T17:29:29","fetched_at":"2026-08-08 12:38:56","word_count":625,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"19h","domain":"quantumcomputingreport.com"},{"id":"bee10f52f2ee366f","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44891","title":"SEC Declares Registration Statement Effective for Pasqal’s Business Combination with Bleichroeder Acquisition Corp. II","url":"https://quantumcomputingreport.com/sec-declares-registration-statement-effective-for-pasqals-business-combination-with-bleichroeder-acquisition-corp-ii/","summary":"French neutral-atom quantum computing developer Pasqal Holding SAS has announced that its joint Form F-4 Registration Statement with Special Purpose Acquisition Company (SPAC) Bleichroeder Acquisition Corp. II (NASDAQ: BBCQ) was declared effective by the U.S. Securities and Exchange Commission (SEC) on August 5, 2026. Bleichroeder has scheduled an extraordinary general meeting for August 25, 2026, [...] The post SEC Declares Registration Statement Effective for Pasqal&#8217;s Business Combinatio","content":"<p>French neutral-atom quantum computing developer Pasqal Holding SAS has announced that its joint Form F-4 Registration Statement with Special Purpose Acquisition Company (SPAC) Bleichroeder Acquisition Corp. II (NASDAQ: BBCQ) was declared effective by the U.S. Securities and Exchange Commission (SEC) on August 5, 2026. Bleichroeder has scheduled an extraordinary general meeting for August 25, 2026, where shareholders will vote to approve the transaction. Upon closing, the combined enterprise will operate as Pasqal Holding SA and trade on the Nasdaq stock exchange under the ticker symbol PSQL.<br>\nFounded in 2019 by Nobel laureate Alain Aspect and leading quantum physicists, Pasqal builds neutral-atom quantum processors operating in standard data center environments. With over $300 million in private funding raised to date, the company has deployed system architectures exceeding 1,000 physical qubits while targeting a roadmap of over 10,000 physical qubits and 200 fault-tolerant logical qubits.<br>\n                   [ Pasqal NASDAQ Public Listing Roadmap ]<br>\n                                       │<br>\n     ┌─────────────────────────────────┴─────────────────────────────────┐<br>\n     ▼                                                                   ▼<br>\n  Transaction Milestones                                Commercial & HPC Operational Base<br>\n  • SEC Form F-4 Declared Effective (Aug 5, 2026).     • CINECA Leonardo Supercomputer Integration (140 Qubits).<br>\n  • Shareholder Vote Date Set for August 25, 2026.     • LANL Materials Simulation Quantum Advantage Milestone.<br>\n  • Ticker Symbol PSQL Reserved for NASDAQ Debut.      • Partnerships: Aramco, Crédit Agricole, MegazoneCloud.<br>\nThe regulatory clearance follows several commercial and technical milestones for Pasqal:<br>\n- Materials Science Quantum Advantage: Collaborated with Los Alamos National Laboratory (LANL) to demonstrate quantum advantage in materials simulation workloads.<br>\n- European HPC Integration: Launched Italy’s first neutral-atom QPU at CINECA, integrating a 140-qubit Pasqal system directly with the Leonardo supercomputer.<br>\n- Commercial Enterprise Expansion: Formed strategic deployment partnerships with South Korea’s MegazoneCloud, expanded capital market algorithm development with Crédit Agricole CIB, continued industrial modeling with Saudi Aramco, and partnered with True Nexus on 3D protein gelation modeling for sustainable food design.<br>\nReview the official SEC registration announcement on the Pasqal Newsroom here, inspect official SEC filings on the SEC EDGAR System here, and examine our previous coverage of Pasqal’s CINECA HPC Integration here, Los Alamos Materials Science Benchmark here, Form F-4 SEC Registration Filing here, and $2B SPAC Business Combination Announcement here.<br>\nAugust 7, 2026<\/p>","content_hash":"90705cb04fd74620cecd441b8352065c","author":"Mohamed Abdel-Kareem","published_at":"2026-08-07T12:09:52","fetched_at":"2026-08-08 12:38:57","word_count":354,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"316724ab6cf3d4bc","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44884","title":"Eaton Awarded $7M AFRL Contract to Apply Quantum Computing to Power Grid Security","url":"https://quantumcomputingreport.com/eaton-awarded-7m-afrl-contract-to-apply-quantum-computing-to-power-grid-security/","summary":"Intelligent power management company Eaton (NYSE: ETN) has been awarded a $7 million, 24-month contract by the U.S. Air Force Research Laboratory (AFRL) to advance quantum-enabled analytics, machine learning, and advanced visualization for electrical grid resilience. Partnering with quantum hardware developer Infleqtion and Pennsylvania State University (Penn State), the project aims to develop hybrid quantum-classical [...] The post Eaton Awarded $7M AFRL Contract to Apply Quantum Computing to ","content":"<p>Intelligent power management company Eaton (NYSE: ETN) has been awarded a $7 million, 24-month contract by the U.S. Air Force Research Laboratory (AFRL) to advance quantum-enabled analytics, machine learning, and advanced visualization for electrical grid resilience. Partnering with quantum hardware developer Infleqtion and Pennsylvania State University (Penn State), the project aims to develop hybrid quantum-classical algorithms to better detect, visualize, and mitigate simultaneous physical and cyber threats targeting critical energy infrastructure.<br>\nThe initiative directly addresses the complex contingency problem in electrical grid management. While current North American Electric Reliability Corporation (NERC) regulatory standards require power transmission networks to withstand two sequential component failures (N−2), modern grids face unpredictable, compound threat scenarios—including severe weather, wildfires, cyberattacks, and physical sabotage—that demand real-time evaluation of exponentially larger combinatorial configurations.<br>\n                     [ Quantum Grid Resilience Framework ]<br>\n                                       │<br>\n     ┌─────────────────────────────────┴─────────────────────────────────┐<br>\n     ▼                                                                   ▼<br>\n  Hardware & Optimization Layer                       Predictive & Decision Layer<br>\n  • Infleqtion Specialized Quantum Hardware.           • Penn State AI & Machine Learning Algorithms.<br>\n  • Quantum Circuit Optimization & Error Mitigation.   • Real-Time Threat Visualization & Analytics.<br>\n  • Multi-Platform Hardware Testing & Evaluation.      • Beyond N-2 Multi-Threat Contingency Control.<br>\nThe 24-month program will encompass developing novel quantum algorithms, optimizing quantum circuits for hybrid quantum-classical execution, testing protocols across multiple quantum hardware platforms, and evaluating hardware error mitigation methods. Leadership from Eaton—including Sid Suryanarayanan, Senior Chief Engineer of Strategic Partnerships and Innovation, and Dr. Christopher A. Herbst, Vice President of Strategic Partnerships and Innovation—noted that the effort will culminate in a proof-of-concept demonstration showcasing how near-term quantum processors can provide actionable awareness and automated contingency responses for critical defense and commercial power grids.<br>\nReview the official announcement on the Eaton Newsroom here.<br>\nAugust 7, 2026<\/p>","content_hash":"e275c42976f9f78348670ee6cd019a9e","author":"Mohamed Abdel-Kareem","published_at":"2026-08-07T11:44:43","fetched_at":"2026-08-08 12:38:57","word_count":277,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"13e7cbc514565c92","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44880","title":"ZeroTier and Carahsoft Partner to Bring Post-Quantum Software-Defined Networking to the Public Sector","url":"https://quantumcomputingreport.com/zerotier-and-carahsoft-partner-to-bring-post-quantum-software-defined-networking-to-the-public-sector/","summary":"Software-defined networking (SDN) provider ZeroTier and government IT aggregator Carahsoft Technology Corp. have entered into a strategic partnership to distribute ZeroTier Quantum across U.S. public sector and defense agencies. Under the agreement, Carahsoft will serve as ZeroTier's Master Government Aggregator, making its software-defined, post-quantum secure networking platform available through Carahsoft’s reseller network and the NASA [...] The post ZeroTier and Carahsoft Partner to Bring P","content":"<p>Software-defined networking (SDN) provider ZeroTier and government IT aggregator Carahsoft Technology Corp. have entered into a strategic partnership to distribute ZeroTier Quantum across U.S. public sector and defense agencies. Under the agreement, Carahsoft will serve as ZeroTier’s Master Government Aggregator, making its software-defined, post-quantum secure networking platform available through Carahsoft’s reseller network and the NASA Solutions for Enterprise-Wide Procurement (SEWP V) contract vehicles (NNG15SC03B and NNG15SC27B).<br>\nZeroTier Quantum embeds post-quantum cryptographic resilience directly into the transport layer via the ZeroTier Transport Protocol (ZTP). Developed using a memory-safe Rust architecture, the software overlay implements a hybrid ML-KEM-1024 (NIST-standardized Module-Lattice-Based Key-Encapsulation Mechanism) and ECDH P-384 (Elliptic Curve Diffie-Hellman) key exchange protocol. This hybrid model protects against “Harvest Now, Decrypt Later” (HNDL) interdictions and satisfies National Security Agency Commercial National Security Algorithm Suite 2.0 (NSA CNSA 2.0) timelines and NIST post-quantum migration mandates.<br>\n                 [ ZeroTier Quantum Transport Security Architecture ]<br>\n                                          │<br>\n     ┌────────────────────────────────────┴────────────────────────────────────┐<br>\n     ▼                                                                         ▼<br>\n  Hybrid Key Exchange Layer                                      Infrastructure-Agnostic Overlay<br>\n  • NIST ML-KEM-1024 (Post-Quantum).                            • Memory-Safe Rust Architecture (ZTP).<br>\n  • ECDH P-384 (Classic Asymmetric).                             • Encapsulates Legacy High Value Assets (HVAs).<br>\n  • NSA CNSA 2.0 & FIPS Standard Compliance.                    • Public Cloud, Edge, Tactical & Air-Gapped Deployments.<br>\nDesigned as an infrastructure-agnostic overlay, the platform enables defense and government entities to wrap legacy infrastructure, High Value Assets (HVAs), and edge platforms—such as uncrewed aerial vehicles (UAVs), tactical sensors, and software-defined vehicles (SDVs)—in a post-quantum encrypted mesh without needing to replace underlying hardware or re-architect underlying network routes. The software functions across multi-cloud, sovereign, air-gapped, and offline operational environments, providing Zero Trust network access (ZTNA) and data sovereignty for critical federal missions.<br>\nReview the official partnership release on Carahsoft News here.<br>\nAugust 7, 2026<\/p>","content_hash":"3c18f33748e3194b8335bff2bb7d7dbf","author":"Mohamed Abdel-Kareem","published_at":"2026-08-07T11:35:48","fetched_at":"2026-08-08 12:38:57","word_count":279,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"ee22b59bd0aa7311","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44875","title":"Canada Launches $20.3M Quantum Defence Innovation Secure Hub in Calgary","url":"https://quantumcomputingreport.com/canada-launches-20-3m-quantum-defence-innovation-secure-hub-in-calgary/","summary":"Canadian Minister of National Defence David J. McGuinty has announced the launch of Canada’s first Quantum Defence Innovation Secure Hub (DISH) in Calgary, Alberta. Operated by a 13-member consortium led by the University of Calgary and its Quantum City initiative—under Managing Director Dr. Megan Lee—the hub will receive $20.3 million CAD over two years to [...] The post Canada Launches $20.3M Quantum Defence Innovation Secure Hub in Calgary appeared first on Quantum Computing Report.","content":null,"content_hash":"73abecf6042f404ca4866f1ace767fe4","author":"Mohamed Abdel-Kareem","published_at":"2026-08-07T11:28:15","fetched_at":"2026-08-08 12:38:57","word_count":74,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"79af4d2db19827d1","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44860","title":"Podcast with Stephen DiAdamo, Co-founder and CTO of Qoro Quantum","url":"https://quantumcomputingreport.com/podcast-with-stephen-diadamo-co-founder-and-cto-of-qoro-quantum/","summary":"Stephen DiAdamo, co-founder and CTO of Qoro Quantum, is interviewed by Yuval Boger. DiAdamo discusses Qoro’s position as a software middleware company that abstracts hardware away from applications, walking through the Divi SDK, circuit serialization and parallelization, and an orchestrator that automatically selects between 12 simulation methods on CPU and GPU or dispatches to QPUs [...] The post Podcast with Stephen DiAdamo, Co-founder and CTO of Qoro Quantum appeared first on Quantum Computin","content":"<p>Stephen DiAdamo, co-founder and CTO of Qoro Quantum, is interviewed by Yuval Boger. DiAdamo discusses Qoro’s position as a software middleware company that abstracts hardware away from applications, walking through the Divi SDK, circuit serialization and parallelization, and an orchestrator that automatically selects between 12 simulation methods on CPU and GPU or dispatches to QPUs from any vendor. They explore how Qoro plugs into HPC schedulers like SLURM rather than replacing them, the CESGA proof of concept built on the CUNQA platform, the “150,000 lines of code to 20” claim, and the argument that multi-QPU centers are needed today for fallback and resilience and for scaling applications. DiAdamo also reflects on developer experience for students learning QAOA and variational algorithms, and Qoro’s two-year history.<br>\nKey takeaways<br>\n- Qoro’s Divi SDK takes optimization inputs (QUBO, HUBO, variational algorithms) and automatically generates, serializes, and parallelizes thousands of quantum circuits without the user writing transpilation or scheduling code<br>\n- Their orchestrator picks among 12 CPU/GPU simulation methods (stabilizer, tensor network, Pauli propagation, MPS, etc.) or routes to QPUs from any vendor, choosing based on circuit properties rather than user input<br>\n- Qoro relies entirely on hardware vendors’ own transpilers rather than building their own, acting as an automation and routing layer rather than solving the hardware-specific compilation problem<br>\n- Multi-QPU access is a resilience requirement today, not a future scaling need: when an HPC center’s only quantum computer goes down (as happened with an IBM outage), users have no fallback unless multiple vendors and modalities are integrated<br>\n- In a CESGA pilot using the CUNQA platform, Qoro connected to 15 compute nodes mimicking a distributed quantum network and ran 15,000-20,000 circuits remotely, with the secure integration taking about a day to wire up<br>\nTranscript<br>\nYuval: Hello, Stephen, and thank you for joining me today.<br>\nStephen: Thank you very much.<br>\nYuval: So who are you and what do you do?<br>\nStephen: So I’m Stephen DiAdamo. I am the CTO of Qoro Quantum. Qoro Quantum is a software company looking at quantum computing from a bit of a different perspective, as we are approaching from the middleware of the stack. So Qoro Quantum, we do look at the other layers of the stack, but our focus is on middleware, but we look top down. This is our approach. As we start with applications, we move into the middleware and then we do orchestration and access multiple quantum computers, heterogeneous compute systems, including traditional compute technologies like CPUs, GPUs, and QPUs, and of different QPU modalities. And what we do is make it as easy as possible to access this type of compute network by making applications abstract from the hardware and automating the stack. And this is our unique position in the market, because we make this, you know, PhD is not necessary to have anymore because the applications are inputs that people are familiar with. The abstractions are there to scale for hardware agnosticism. We don’t rely on any particular vendor to be hosting the quantum computer. And we can also move to simulation when we need to. And we essentially are targeting high-performance simulation in the cloud. And of course I go into a lot of detail in that. But you can consider us a software middleware company looking at simplifying infrastructure deployments and accessing many quantum computers from any vendor in a seamless and automated way.<br>\nYuval: So let’s take an example just to help me clarify. So let’s assume I have an optimization problem and I have an algorithm that I want to execute. Do you provide the compiler? Do you rely on the hardware vendor or someone else to provide the compiler? How would that work for me as an end user?<br>\nStephen: So as an end user, we start with our software layer called Divi. Divi is an open source Python SDK. And we look at just taking the optimization inputs. So oftentimes an optimization problem requires a QUBO or a HUBO or a variational quantum algorithm for material science or in other aspects, and we take in just the parameters. And Divi will then translate this into a collection of quantum circuits. We focus really on parallelization, partitioning of problems, breaking them down so that we can use what’s available in the network to then optimize what we send to the network to compute with. This is automated through Divi. Then we serialize these circuits. This is very important because oftentimes you can produce 10,000 circuits, but getting them over the wire is very costly, or even producing the circuits themselves is very costly. And so you need to be very focused on how you can generate all those circuits in the first place. Once we send them to the cloud, we have our orchestrator there ingesting all of these circuits and we can put them into one of two paths. One is send them for simulation or send them for hardware execution. And we handle this automatically by looking at how many qubits are in the quantum computer. Can we put multiple circuits together to use the quantum resources effectively? What modality would be best suited for this quantum circuit? Is it too connected for a superconducting quantum computer? Is it, you know, too many gates for a trapped ion based quantum computer? And we make these decisions on the fly. If we send it on the other hand to the simulation platform, again, we do an automation there because we interface to many simulators. We support 12 different simulation methods on CPU and GPU. And of course, not everyone is familiar with developing their own tensor network simulations. They don’t know how to develop a Pauli propagation simulation. So we always take circuit input to optimal simulation engine, and we put a layer there in place to analyze the circuit again to see what simulation method would be best. Is it a stabilizer simulation? Is it going to be instantaneous? Or is it going to be a three-day job with a GPU MPS-based simulation? And then on the simulation side, we scale because we’re parallelizing 10,000 circuits, for example, we can parallelize. They’re all independent and they all need to be executed, so we can put 50 nodes in place immediately and get a big horizontal improvement there. So we’re looking at it really from the traditional standpoint of high-performance computing in the cloud for now and in the future, we of course integrate very deeply with HPC. But to bring it back all the way around, all these things come back together. All the results from all the circuit execution, CPU, GPU, QPU come through this pipeline all the way back and then are processed again at the application layer, where now all you see is the final results. You don’t have to worry about error mitigation, transpilation, compilation, resource selection, scheduling, orchestration, all these things are handled by us and from the optimization, you, the person who wants to run such a problem, they just put in their inputs, run, everything happens for them, results come in and the job is finished.<br>\nYuval: How far is this from reality? I mean, as an end user, some would say this sounds too good to be true. So where are you in the process of building the environment that you’re describing?<br>\nStephen: This is ready today. We’ve already been working with customers on different use cases. It’s also application agnostic, or not targeting any particular type of consumer. We’ve worked in the energy sector, we’ve worked in the finance sector, and in our work with these types of customers, we see they want to access quantum computers like this. We see them get stuck because they’re so integrated with IBM, but they’re using libraries from here and here and here, and they don’t know how to put it all into one environment, or they don’t know about these transpilation techniques. So they get stuck trying to run large-scale simulations for their research or for their job. And what happens is we say, OK, put the same problem into our software. Let’s see what happens. Let’s see if we can scale. We bring them Tensor Network Simulation. It’s already deployed in the cloud. You can access it today. And then we bring them access to different computers that are hosted on the cloud- quantum computers, specifically, I mean- that are hosted in the cloud. And we do the interfacing for them. And so we’ve done this many times with different customers showing them, look how easy it could be. Just trust us. It’s a unique perspective, of course, and not anyone else is really doing this. So it takes a bit of convincing that, trust us to handle the middleware. But once they see it, it changes the entire direction of the projects.<br>\nYuval: Let me see if I can organize this in my head and then maybe go layer by layer and ask you some questions. So as I think about it, listening to you, there’s sort of layer zero simulation, say you guys can parallelize it and I have a lot of computing resources and I can run a lot of circuits in different places and speed up the time. I think I can understand that. One layer above that is optimizing the circuit for a particular type of quantum computer. One layer above that, at least in my mind, is synchronizing and orchestrating a quantum computer with a classical computer. And then the third layer is, oh, by the way, we can do that with multiple quantum computers or even with multiple quantum modalities, not just multiple computers of the same type, but multiple modalities. So I think I understand level 0. But let’s talk about level 1. As you mentioned, it does seem that a circuit that’s optimized for, say, a superconducting machine is not going to run very well on a trapped ion machine. A circuit that is optimized for using the parallelism and transversal gates and whatever, if an atom machine might not be optimal or might not be possible to execute on superconducting. And this is a very active area of research where the vendors themselves are putting a lot of effort in that. So is this something that you believe that you’ve already solved? How do you address the complexities and the differences between different modalities?<br>\nStephen: Yeah, so we don’t invent transpilation techniques. We always rely on the vendor to provide the transpilation methods. This way, we bring the circuits from application layer to the lowest point that we can bring, and then we use the vendors’ transpilation techniques. We may adjust them slightly by doing, you know, if they’re heuristic or something, we may wrap a little bit of software around them to try to improve them as much as we can. But generally, we’re relying on the vendor to come with their own transpiler and compilers. And what we do is we just automate this system for the user so they don’t have to think about it. And what that also allows is if the user really wants to use a particular vendor, they can add configurations to send along with the job so that, you know, they can use transpiler version one versus transpiler version two, or optimize for a particular gate set. But it’s always up to the vendor to provide that layer. It’s a hard problem, of course, and we’re not there to solve it. We’re just here to bring access to the users in a simple way.<br>\nYuval: So let’s talk about the next layer of the classical quantum interface. And I think that some people are thinking about this in three sort of timescales. One is batch processing, where the quantum computer is almost like a printer. I send the job, and when it’s done, it’s done. The other one is sort of near time, where a QAOA circuit or something has to sort of go back and forth. And then there’s almost real time, especially that relates to quantum error correction, mid-circuit measurement, dynamic decisions. Where do you guys come in and how do you address these issues?<br>\nStephen: We’re at the top two, more or less. We’re not doing any low latency close to the QPU type of work, where we’re not focused on error correction at all. I mean, these are things that we know are coming, but these are huge topics. And what we’re here to do is bring access as fast as possible to people who want it. So with layer one, or sorry, with the layer, I forget the order, you know, the slow latency layer, the printer version, that’s where we put a lot of effort in because we treat them as independent devices. And there we send, you know, 15, you know, many circuits per device to execute in parallel, but there’s no connection between the devices at that stage. And then when we go for the QAOA, for example, where there’s a feedback loop, we try to use, again, parallelization techniques when applicable. Sometimes it doesn’t work, sometimes it does. But if you choose an optimizer that is more of an exploratory optimizer, let’s say it samples the entire space in a clever way. So this could be like Monte Carlo sampling or different types of optimizers that use populations. This generates many circuits and can be parallelized in the same way. So we can break up the problem set, you know, half the load there, half the load there, and parallelize in a slow latency environment. And this is really well suited for, you know, networks of computers over the internet where they may be sitting across the country and we don’t get low latency, but you still get this horizontal scale up instantly. But of course, yeah, these low level, you know, right to the computer, this requires more than software, I would say it requires some hardware innovation to get things right. So we don’t touch hardware, we’re not hardware to manufacture.<br>\nYuval: So that’s very interesting. You bring up a sampling algorithm as something that could be parallelized across multiple machines. For my education, I’m curious, what other algorithms other than sampling do you see that have the potential of being parallelized?<br>\nStephen: So, for example, time evolution is one that we focus on a lot. Material science and looking at how systems evolve over time is a very natural thing to simulate on quantum computers. There of course, you need to check every point in time what’s happening. So if you want to, for a pixel, you could parallelize like that. You can parallelize error mitigation, for example, when you need to add folding layers for ZNE, you can parallelize like that. You can parallelize search algorithms. So if you need to search a space and check is this working or not in this area, no, this area, you can always search in parallel. So there’s so many different parallelizations that we see and they tend to be application specific, of course, that’s what Divi is for. Divi optimization problems or the search problems or the sampling problems. And this always generates batches of jobs so we can scatter them across the compute network and be more efficient.<br>\nYuval: Today, HPC centers often use SLURM or PBS Pro for scheduling and related in synchronization and resource reservation and so on. How does your software fit in that framework? Does it replace them? Does it become a plugin? Where do you sit relative to them?<br>\nStephen: It’s precisely in the plugin layer. So we’re never gonna replace SLURM, we don’t want to go into that direction, but we need to look at the new types of resources joining the compute network, which are these new quantum computers. What information should they be transmitting so we can make decisions? This is something we need to control from Qoro side. And then we built, essentially this engine we have deploying in the cloud, we put it into the HPC as a SLURM plugin. This could also be two separate layers because perhaps what we envision is people can then send jobs from the application layer to the HPC. That requires an orchestration layer. And then inside the HPC, it requires orchestration at another layer. And that’s because they’ll have GPUs available or not available. They’ll have CPUs available and not available. And they may have multiple quantum computers available and not available. And the scheduler needs to be informed about this because you may have multiple users with hundreds of thousands of circuits that need to be executed at once. And now you need to be making optimal resource allocations. And this is something we also will work on when we, you know, with time. So we’re really not changing anyone’s scheduler. We’re putting in something that can be intelligent inside the scheduler to make better use of the resource system.<br>\nYuval: I read someplace that someone said that you’re replacing 150,000 lines of code with 20. What do these 150 lines of code contain?<br>\nStephen: I would say that’s a very, very low estimate. This is a bit of marketing that we do, but people can’t really distinguish in their brain 100,000, a million, 100 million. It’s a lot of abstraction in these huge numbers. But what this means is we take the application layer and we abstract everything outside of application away so that they can focus on just building the application. And because Divi is so simple to use, it’s simply populating about 20 lines of configuration code that will generate the entire workflow for them. And do optimization, and do transpilation, and do compilation, and do all this resource management. But from the user perspective, they only see 20 lines of code. So we’re handling so much of the infrastructure. We have, I don’t know, almost 40 repos in our GitHub. There’s so many packages that we separate and make services out of that they don’t see any of that. They see only that much, you know, the 20 lines. And that’s what we’re promoting there.<br>\nYuval: I think you did a proof of concept or a project at CESGA. Could you tell me a little bit about that? What was the challenge? What were the results? What was the innovation that you added there?<br>\nStephen: Yeah, so CESGA is very much aligned with the mentality of Qoro and Divi of Qoro in that distributed systems will work together. And what we did there is we used their software platform called CUNQA and CUNQA is integrated nicely with SLURM sessions so that you can allocate resources and do real-time computations mimicking a distributed quantum computing network. And what we did is we put our interface in place that points to their HPC center through a secure channel. And then we used their resources inside of CESGA allocating, I think in that experiment, quite some time, but I think we had 15 compute nodes mimicking a quantum computer, and we were generating the application load outside of the center. I was doing it from my chair at home, and we sent them 15, 20,000 circuits through this secure channel through our orchestrator and making the resource adjustments so that we say, this batch of circuits goes to compute one, this batch of circuits goes to compute two, this batch of circuits compute three, etc. And we made this interface with them. And later, what we did was introduce our simulation platform Maestro, which I was saying is this multi simulator automatic decision maker for which simulation choice to make, that sits also in CUNQA. And so the results were that we could make this connection and what was really nice about it is because we have these layers of abstraction, this took us just a day of wiring up the secure channel and once it was ready, everything was in place to start running. And so we ran a couple of optimization problems using this sampling approach where we needed a batch of circuits and it worked very well. I think the results were that it’s possible users can be sending jobs to HPCs from their home and you’d be using you know state-of-the-art simulation techniques on state-of-the-art compute technologies without having to purchase a thing and still use those 20 lines of code to do it all.<br>\nYuval: I want to go back to my simple mental model of simulation and then a single quantum computer and then quantum with classical and then multiple quantum computers. I can understand the immediate need to do a parallel simulation today, but for the rest, you know, I work in a quantum computing vendor and I know that it’s hard work to make quantum computers, even a single one, truly useful. So to what extent are you ahead of your time? You know, when do you think people will really need this.<br>\nStephen: I think it’s absolutely necessary. I mean, of course, you’re going to predict what I’m going to say, but it’s needed today. And the reasons are very simple. It’s simply imagine you’re an HPC center and you have one quantum computer. And let’s say that one quantum computer goes down. What do you do with your user base? Do you just let them sit for a week or who knows how long that maintenance is going to take to get it back online? And we see this repeatedly, even just yesterday, we were running experiments and not to throw them under the bus, but IBM, the network went down for about a day. And we needed those quantum computers. What do we do? They have six of them and they all went down. So you can imagine, what do we do in that situation? If with our platform, we can just point it to another backend and all those transpilation passes and all the complexity of accessing a new modality or a new vendor is all taken care of. So the user will never have downtime. And that’s my answer. People should be thinking about more quantum computers in the center because you need fallbacks, you need resilience, you need robustness. You can’t let your users sit idle if they’re spending a hundred thousand on a project per day or something. They’re paying contractors, there’s so much on the line, they can’t sit for a week when quantum computers are not accessible. So building multiples of them is just smart for that situation. When it comes to scaling applications, correct, I don’t think it’s necessary, but it’s more about the user experience and the production readiness and bringing it to market. You know, you can’t, for now, it’s, you know, individual sales one at a time, but in the future, I can’t imagine, even in the near future, if we want to be selling cloud infrastructure and cloud access to quantum computers, supporting a thousand users, can’t have one quantum computer. Need to have more.<br>\nYuval: You mentioned user experience. So I wanted to latch onto that. So a user starts and does, you know, pip install Qiskit and starts working and running a sample program. When do you think the sort of light goes on and says, “Oh wow, I really need these Qoro guys.”<br>\nStephen: Yeah, I mean, so what we see is we work with universities and they teach applications of quantum computers. And what that usually entails is pip install Qiskit, go to Qiskit guide and look at how to implement QAOA. And now they need to understand, you know, what different mixers are involved and how to set the layers of the QAOA and what optimization parameters to use. What optimizers to execute, build your own optimizer. And there’s a lot behind Qiskit, of course, and a lot of plugins for Qiskit, a lot of open source. But then you’ll see very quickly that you need to build a lot of pieces repeatedly from scratch, copy and paste different code snippets from different packages, or sorry, different examples, and then, you know, the lessons even just as a student complex. If you just want to know what is the input of QAOA and what does QAOA produce and now I want to compare against IBM quantum computer one or QuEra quantum computer two and see how do they perform differently. That’s what the students want, should be learning. They should be learning engineering problems not software bottlenecks. They should be being able to compare and contrast and test different methods instead of having to, especially in the era of AI that we have, we can get examples done, but what we can do is bring the complexities way up, sorry, not way up, way down, and see, okay, now people can just use QAOA out of the box as a tool, or use variational quantum algorithms as a tool, or build a quantum neural network as a tool, and this just speeds things up significantly. This is also a problem we face, is how do we convince people that this is still, this is the new way of quantum programming. Take the pieces that we know work and build on those instead of rebuilding the pieces that we know work every single time you want to do something new.<br>\nYuval: Tell me a bit about the company. Size of company, where are you located, what is the funding situation, about the founders, anything you can share.<br>\nStephen: So we started the company in 2024. We just passed two year mark this month officially. That was our incorporation date. And we’re incorporated both in the United Kingdom and in Germany. So I’m based in Munich and my co-founder, Dan, he’s based in the UK. And we come from a background of network technologies. I worked at Cisco as well as Dan, and I was researching quantum network technologies. How do you put quantum networks into practice? And part of that was in distributed quantum computing. And Dan has a long history of working in network technologies, deploying national networks and data center networks and working more on from the business side. So we are coming from, my background is in research and PhD level of education. Dan has a long history of working in the business units of networking companies. So we come together and Qoro was a perfect fit because we’re a networking quantum computing company. The team now is 10 full time, pretty sure. We’re growing quite fast and we lose track sometimes. We just raised a pre-seed in March and we’re looking into finishing a seed round coming hopefully by the end of summer.<br>\nYuval: And if I were an HPC center, do I buy a license for a software package? Is that something that I use on the cloud? How long does integration take? I mean, take me sort of through the customer journey if you could.<br>\nStephen: Yeah. So our products are threefold in a sense. We have our go to market or kind of landing page where, our landing product where people can sign up today, get an API token and start running immediately with no contracts, it’s pay as you go. We have the cloud infrastructure in place. So anyone can do that. There’s credits, it’s a credit system, very simple. And they can build their applications in Divi, run them in the cloud, get access to CPUs and GPUs, very standard. Then for enterprise-based customers, we have something very similar, but we dedicate all of the compute nodes for that customer. So if they have a team of researchers constantly running simulations and eventually accessing quantum computers, we provide that dedicated access as an infrastructure service. So it’s infrastructure as a service, for example. But when it comes to HPC, of course, they have a lot of constraints. They need a lot of on-premise solutions. And so with an HPC center, we have two different things that we offer them. Is one is purely our simulation capabilities. So the GPU based simulation and the CPU based simulation, of course, with some services and support around them as a company, but our software is also a lot of it is open source. So it’s an open core type model with premium features as a service. And that was the one thing that we, that’s one of the products we offer HPC. And then the second is an integration demo, for example. So this is the bottleneck generally is how do we integrate quantum into an HPC center and essentially deploy the software aspect of that via pure software integration where we mimic the quantum computer via emulation. So we still have all the software components in place, we still use control technologies, we still bring them the simulation aspects, but it’s as if the quantum computer was there but they don’t have to buy a quantum computer. At this play, it helps them to keep the cost down, keep the investment a bit more, a lot less risky, because if they need to invest a million or five million just to see how it feels to have a quantum computer, it’s a lot more risky if they can spend, let’s say, 100k or 200k to see the same thing. And so that’s how we approach HPC centers.<br>\nYuval: Excellent. And so as we come to the end of our conversation today, I wanted to ask you a hypothetical. If you could have dinner with one of the quantum greats, dead or alive, who would that be?<br>\nStephen: Yeah, I knew this question was coming, so I prepared a little bit. And my answer is mixed. I mean, I would like to have dinner with Claude Shannon, because I come from an information theory background, but he’s not exactly a quantum guy. So I changed it to John von Neumann, who took a lot of the information theory concepts and brought them to Qoro. Actually, I forget who did it first. I think Shannon may have taken from von Neumann, but I forget the history. But the reason von Neumann is also a great fit for me is he’s a scientist and an engineer and just explored so many different topics. And I love that you can take concepts from, I don’t know, all these different fields and bring them together into one. And I think this is what’s happening at Qoro is we’re looking at network technologies, interfacing, different hardware components, communication, latency, all these things that result from a lot of the technologies that he would have been highly interested in and definitely influenced. So John von Neumann is my answer. I think because of him, I’m here today being able to work on these types of topics.<br>\nYuval: Wonderful. Stephen, thank you so much for joining me today.<br>\nStephen: And thank you for the time and the great conversation.<br>\nYuval Boger is the Chief Commercial Officer of QuEra Computing.<br>\nAugust 6, 2026<\/p>","content_hash":"a15d6290825b51086c90d896fec02566","author":"dougfinke","published_at":"2026-08-07T02:17:20","fetched_at":"2026-08-08 12:38:58","word_count":5199,"read_time_minutes":26,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"a203100961ec152e","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44854","title":"Xanadu Reports Q2 2026 Financial Results: $312.8M Cash Position, $67.2M Raised via ATM Facility, and Albany Expansion","url":"https://quantumcomputingreport.com/xanadu-reports-q2-2026-financial-results-312-8m-cash-position-67-2m-raised-via-atm-facility-and-albany-expansion/","summary":"Xanadu Quantum Technologies Ltd. (NASDAQ/TSX: XNDU) has announced its financial results for the second quarter ended June 30, 2026. The Toronto-based photonic quantum leader highlighted significant hardware and algorithmic progress, expansion of its U.S. operations, and strategic use of its synthetic at-the-market (ATM) equity facility to fortify its balance sheet. Because of the reverse recapitalization [...] The post Xanadu Reports Q2 2026 Financial Results: $312.8M Cash Position, $67.2M Raise","content":"<p>Xanadu Quantum Technologies Ltd. (NASDAQ/TSX: XNDU) has announced its financial results for the second quarter ended June 30, 2026. The Toronto-based photonic quantum leader highlighted significant hardware and algorithmic progress, expansion of its U.S. operations, and strategic use of its synthetic at-the-market (ATM) equity facility to fortify its balance sheet.<br>\nBecause of the reverse recapitalization resulting from its Q1 2026 SPAC merger, historical share counts and per-share metrics have been retroactively recast. The table below summarizes key GAAP financial metrics for Q2 2026 compared with the prior quarter (Q1 2026) and the year-ago quarter (Q2 2025).<br>\n| Amounts in $M | Q2’2026 | Q1’2026 | Q2’2025 | % vs Q1’2026 | % vs Q2’2025 | <br>\n| Revenue | $1.51 | $2.83 | $1.06 | -46.6% | +42.5% | <br>\n| Operating Expenses | $31.50 | $26.10 | $16.58 | +20.7% | +90.0% | <br>\n| Operating Loss | ($29.99) | ($23.27) | ($15.52) | +28.9% | +93.2% | <br>\n| Net Loss | ($42.05) | ($20.60) | ($15.14) | +104.1% | +177.7% | <br>\n| Cash and Cash Equivalents | $312.78 | $272.47 | $16.16* | +14.8% | +1,835.5% | <br>\n*Note: Q2 2025 cash balance reflects the pre-merger private entity baseline.<br>\nFinancial Results and ATM Equity Facility Utilization<br>\nXanadu ended the second quarter in a strong liquidity position with $312.8 million in cash and cash equivalents, up from $272.5 million at the end of Q1 2026. This increase was primarily driven by the disciplined utilization of its $300 million Standby Equity Purchase Agreement (synthetic ATM facility) established with Yorkville Advisors in May 2026. During Q2, the company raised $67.2 million in net proceeds by issuing 5.5 million Class B subordinate voting shares at an average net price of $12.28 per share.<br>\nSecond-quarter revenue was $1.51 million, representing a 42.5% increase year-over-year compared to $1.06 million in Q2 2025 (primarily driven by DARPA Stage B contract revenue), though down sequentially from $2.83 million in Q1 2026.<br>\nGAAP Net Loss for Q2 2026 expanded to ($42.05) million, or ($0.14) per basic and diluted share, compared to ($20.60) million in Q1 2026 and ($15.14) million in Q2 2025. The widening loss was driven by increased R&D engineering hires ($19.72M vs $17.35M in Q1), higher G&A public company costs ($11.05M), and a $10.60 million non-cash loss on the fair value remeasurement of earn-out share liabilities. On a non-GAAP basis, Adjusted EBITDA loss was ($21.33) million.<br>\nCapital expenditures for the quarter rose sharply to $6.4 million (up from $0.3M in Q1 2026), reflecting increased investments in foundry fabrication runs and laboratory infrastructure.<br>\nHardware and Fabrication Breakthroughs<br>\n- Edge-Coupling Efficiency: Achieved a record low average edge-coupling loss of 0.085 dB per facet, enabled by internal packaging breakthroughs and manufacturing collaborations with Corning and DISCO.<br>\n- Expanded Foundry Runs: Scaled up fabrication runs across its two primary material platforms—increasing thin-film lithium niobate (TFLN) runs by ~75% and silicon nitride (SiN) runs by ~50%.<br>\n- U.S. Operational Scaling: Announced a major expansion of U.S. operations centered in Albany, New York. Xanadu’s U.S. headcount has grown more than five-fold since 2023, with continued engineering recruitment planned through the end of 2026.<br>\nSoftware, Algorithms, and Ecosystem Momentum<br>\n- QROM Algorithmic Cut: Published a breakthrough in Quantum Read-Only Memory (QROM) that cuts required Toffoli gate operations by roughly 50%. The capability has been patent-filed and integrated directly into PennyLane.<br>\n- Ribosomal RNA Model: Successfully trained a Fourier-based quantum machine learning model featuring over one million parameters, demonstrated learning the complex distribution of ribosomal RNA.<br>\n- PennyLane & Catalyst Updates: Released PennyLane 0.45 and Catalyst 0.15, while the foundational PennyLane research paper crossed 2,000 academic citations.<br>\n- High-Performance & Enterprise Partnerships:<br>\n  - Oak Ridge National Laboratory: Partnered to deploy PennyLane onto the Frontier exascale supercomputer.<br>\n  - Rolls-Royce: Re-signed a multi-year partnership focused on quantum computational fluid dynamics (CFD) and aerodynamics.<br>\n  - Lockheed Martin: Launched a joint quantum machine learning and workforce training initiative under Lockheed’s Quantum Talent Pipeline.<br>\n  - Financial Sector & Research: Advanced engagements with the Fidelity Center for Applied Technology (FCAT), major banking institutions, Los Alamos National Laboratory, and joined the Unitary Foundation.<br>\nResources and Further Reading<br>\nAdditional information regarding this report can be found in the Xanadu Q2 2026 press release here.<br>\nAugust 6, 2026<\/p>","content_hash":"3c7f735ff010b0ea41dc9c6937908df5","author":"Mohamed Abdel-Kareem","published_at":"2026-08-06T20:33:03","fetched_at":"2026-08-08 12:38:58","word_count":708,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"d49cf9c026ca9861","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44824","title":"Horizon Quantum Reports Q2 2026 Financial Results: Warrant Cash Infusion, Beryllium Early Access, and European Testbed Expansion","url":"https://quantumcomputingreport.com/horizon-quantum-reports-q2-2026-financial-results-warrant-cash-infusion-beryllium-early-access-and-european-testbed-expansion/","summary":"Horizon Quantum Holdings Ltd. (NASDAQ: HQ) has reported its financial results for the second quarter ended June 30, 2026. Highlights of the quarter include a major capital injection from public warrant exercises, early access availability for its flagship programming language Beryllium, and the strategic expansion of its quantum hardware testbed into Europe. Because the company [...] The post Horizon Quantum Reports Q2 2026 Financial Results: Warrant Cash Infusion, Beryllium Early Access, and Eu","content":"<p>Horizon Quantum Holdings Ltd. (NASDAQ: HQ) has reported its financial results for the second quarter ended June 30, 2026. Highlights of the quarter include a major capital injection from public warrant exercises, early access availability for its flagship programming language Beryllium, and the strategic expansion of its quantum hardware testbed into Europe.<br>\nBecause the company completed its SPAC merger with dMY Squared Technology Group on March 19, 2026, financial metrics prior to that date reflect Horizon Quantum Computing Pte. Ltd., while subsequent periods reflect Horizon Quantum Holdings Ltd. The table below summarizes key GAAP financial metrics for Q2 2026 compared with the prior quarter (Q1 2026) and the year-ago quarter (Q2 2025).<br>\n| Amounts in $M | Q2’2026 | Q1’2026 | Q2’2025 | % vs Q1’2026 | % vs Q2’2025 | <br>\n| Revenue | $0.00 | $0.00 | $0.04 | — | -100.0% | <br>\n| Operating Expenses | $7.18 | $6.50 | $2.78 | +10.5% | +158.3% | <br>\n| Operating Loss | ($7.18) | ($6.50) | ($2.74) | +10.5% | +162.0% | <br>\n| Net Loss | ($115.23) | ($3.56) | ($2.90) | +3,136.8% | +3,873.4% | <br>\n| Cash and Cash Equivalents | $113.25 | $96.60 | $0.71 | +17.2% | +15,932.4% | <br>\nFinancial Results and Warrant Cash Infusion<br>\nHorizon Quantum’s cash position was significantly fortified during the second quarter. The company received $27.5 million in gross proceeds from the exercise of 2.4 million publicly traded warrants (HQWWW) during Q2. Subsequent to quarter-end, as of August 3, 2026, total warrant exercises reached approximately 2.5 million (79% of total outstanding public warrants), bringing cumulative gross proceeds to $28.7 million. This cash inflow elevated total cash and cash equivalents to $113.25 million as of June 30, 2026, up $16.65 million from $96.60 million at the end of Q1 2026.<br>\nReported GAAP Net Loss for Q2 2026 was ($115.23) million, or ($2.20) per ordinary share, compared to ($3.56) million in Q1 2026 and ($2.90) million in Q2 2025. This significant loss was primarily driven by a $108.29 million non-cash accounting charge resulting from the mark-to-market fair value remeasurement of warrant-related derivative liabilities, caused by an increase in Horizon’s stock price during the quarter. This charge had no impact on cash balances or operations.<br>\nOn a non-GAAP basis, excluding the non-cash derivative adjustment, share-based compensation, and non-recurring public transition costs, the company reported an Adjusted EBITDA loss of ($5.46) million for Q2 2026, compared to ($2.06) million in Q2 2025. Total operating expenses rose to $7.18 million, up 10.5% sequentially from Q1 2026, reflecting expanded R&D headcount and public company compliance infrastructure.<br>\nOperational Highlights: Triple Alpha and Beryllium Release<br>\n- Beryllium Early Access: At the end of Q2 2026, Horizon released Beryllium—its high-level, object-oriented quantum programming language—to early access users. Designed to enable modern classical software engineering constructs (classes, functions, libraries) within quantum workflows, Beryllium compiles down to Helium (a BASIC-like language) and Hydrogen (assembly language) to abstract away low-level quantum mechanics for developers.<br>\n- Ember-1 Testbed Open to Users: Horizon’s first quantum testbed system, Ember-1 (a superconducting system located at its Singapore headquarters), officially opened to select early users. Integrated directly with Triple Alpha, Ember-1 enables real-time execution of complete quantum programs with pulse- and gate-level access, bypassing latency issues associated with remote cloud execution.<br>\n- Dublin Testbed Expansion: In June 2026, Horizon announced that its second hardware testbed system—a 256-qubit trapped-ion system purchased from IonQ—will be located at its European headquarters in Dublin, Ireland, giving the company a multi-modality testbed across both solid-state and atom-based architectures.<br>\nEcosystem Collaborations<br>\n- Quantum Machines Partnership: In July 2026, Horizon announced a strategic collaboration with Quantum Machines to co-develop an embedded calibration framework for Ember-1. By integrating lightweight, continuous calibration routines directly into system operation, the companies aim to maximize system uptime and eliminate the need for lengthy full-system calibration halts.<br>\nResources and Further Reading<br>\nAdditional details regarding this report can be found in the Horizon Quantum Q2 2026 press release here.<br>\nAugust 6, 2026<\/p>","content_hash":"7f4c1a0545650e1688ac8c3e6f97f252","author":"Mohamed Abdel-Kareem","published_at":"2026-08-06T19:48:29","fetched_at":"2026-08-08 12:38:59","word_count":664,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"7f884b517c98a686","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44802","title":"IQM Quantum Computers Reports First Earnings as Public Company: H1 2026 Results, Record Backlog, and FY 2026 Guidance","url":"https://quantumcomputingreport.com/iqm-quantum-computers-reports-first-earnings-as-public-company-h1-2026-results-record-backlog-and-fy-2026-guidance/","summary":"IQM Quantum Computers Plc (Nasdaq: IQMX; Nasdaq Helsinki: IQMX.HE) has released its financial results for the first half (H1) and second quarter (Q2) ended June 30, 2026. This release marks IQM’s inaugural earnings report following its dual-listing milestone in July 2026 as the first European pure-play quantum computing company on Nasdaq and Nasdaq Helsinki. To [...] The post IQM Quantum Computers Reports First Earnings as Public Company: H1 2026 Results, Record Backlog, and FY 2026 Guidance app","content":"<p>IQM Quantum Computers Plc (Nasdaq: IQMX; Nasdaq Helsinki: IQMX.HE) has released its financial results for the first half (H1) and second quarter (Q2) ended June 30, 2026. This release marks IQM’s inaugural earnings report following its dual-listing milestone in July 2026 as the first European pure-play quantum computing company on Nasdaq and Nasdaq Helsinki.<br>\nTo support tracking alongside US peers, the table below displays the raw reported Euros (€) figures alongside their approximate United States Dollars (USD) equivalents based on an exchange rate of €1.00 = $1.15 USD.<br>\n| Amounts in €M (except per share) | Q2 2026 (€) | Q2 2026 (USD) | Q2 2025 (€) | H1 2026 (€) | H1 2026 (USD) | H1 2025 (€) | % YoY (H1 €) | <br>\n| Revenue | €6.68 | $7.68 | €5.23 | €8.87 | $10.20 | €6.03 | +47.0% | <br>\n| Gross Profit | €3.06 | $3.52 | €2.08 | €3.60 | $4.14 | €2.41 | +49.7% | <br>\n| Operating Expenses | €35.54 | $40.87 | €17.62 | €67.30 | $77.40 | €34.98 | +92.4% | <br>\n| Operating Loss | (€30.90) | ($35.54) | (€14.95) | (€60.54) | ($69.62) | (€31.64) | +91.3% | <br>\n| Net Loss | (€36.55) | (€42.03) | (€15.01) | (€74.90) | ($86.14) | (€34.58) | +116.6% | <br>\n| Cash and Short-Term Investments | — | — | — | €118.88* | $136.71* | €147.42 (12/31/25) | -19.4%* | <br>\n*Note: Cash and Short-Term Investments as of June 30, 2026, includes €113.42M in cash and cash equivalents plus €5.46M in current other financial assets. Sequentially, this is compared to the December 31, 2025 baseline (€146.54M cash + €0.88M short-term financial assets = €147.42M). Following the post-period close of the business combination on July 1, 2026, IQM’s pro-forma cash balance expanded to €309.4M ($337.2M USD).<br>\nFinancial Performance and Commercial Momentum<br>\nIQM delivered strong top-line momentum, generating €8.87 million ($9.67M) in revenue for H1 2026, a 47% increase compared to €6.03 million in H1 2025. Q2 2026 revenue rose 28% year-over-year to €6.68 million, driven primarily by the delivery of standardized on-premises quantum computing systems and milestone progress on customized long-term projects.<br>\nOperating loss for H1 2026 widened to €60.54 million, compared to €31.64 million in the prior-year period. This was principally driven by €9.9 million in transaction costs associated with the SPAC business combination and dual-listing process, an expansion in R&D activity (€34.05M vs. €25.65M in H1 2025), and headcount growth to 460 employees globally.<br>\nNet loss for H1 2026 stood at €74.90 million, impacted by non-cash finance costs including a €9.0 million fair-value adjustment on the conversion feature of the Aalto University convertible loan (which converted into equity on June 30) and the revaluation/extinguishment of Kreos Capital loan warrants.<br>\nLiquidity Position and Capital Expansion<br>\n- Pro-Forma Cash: IQM closed the reporting period on June 30, 2026, with €118.88 million in liquid assets. Immediately following the period close, the completion of its business combination with Real Asset Acquisition Corp. (RAAQ) and concurrent PIPE financing infused net listing proceeds into the business. As of July 2, 2026, IQM’s cash balance stood at €309.4 million ($337.2M USD), establishing a runway into Q2 2028.<br>\n- Debt Extinguishment: In July 2026, IQM fully prepaid and terminated its €5.0 million Kreos Capital term loan facility, removing debt obligations from its balance sheet.<br>\n- Order Backlog Acceleration: Order backlog at the end of the quarter (June 30, 2026) reached €69.1 million. In July 2026, IQM secured a landmark €33.0 million contract with CSC to integrate a quantum computer into the LUMI AI Factory, elevating total order backlog past €102.1 million as of August 3, 2026.<br>\nOperational Highlights and Technical Achievements<br>\n- Global Deployments: To date, IQM has sold 26 full-stack quantum computers and delivered 17 globally. Notably, the company completed its first US delivery to the US Department of Energy’s Oak Ridge National Laboratory (ORNL) in Tennessee in June 2026.<br>\n- Fab Cleanroom Expansion: IQM is committing over €40 million to expand its proprietary fabrication facility in Espoo, Finland. The investment will double cleanroom capacity to enable the production of up to 30 full-stack quantum computers annually.<br>\n- Error Correction Breakthroughs: Introduced “barbell codes”—a novel family of quantum Low-Density Parity-Check (qLDPC) error correction codes tailored for the IQM Constellation topology.<br>\n- HPC/AI Ecosystem Integration: Partnered with NVIDIA for AI-driven parallel qubit calibration using the NVIDIA Ising model family, and collaborated with HPE to integrate IQM systems with HPE Cray HPC infrastructure.<br>\n- M&A Expansion: On July 1, 2026, IQM acquired selected technology-related assets of Berlin-based Quantistry GmbH for €1.9 million to enhance its cloud-based, AI-enabled chemical and materials simulation stack.<br>\nFull-Year 2026 Guidance<br>\nIQM initiated its formal financial outlook for the full year 2026:<br>\n- FY 2026 Revenue Target: €42 million to €47 million (supported by scheduled delivery and customer acceptance milestones of its initial 150-qubit system).<br>\n- FY 2026 Order Intake Target: €65 million to €75 million.<br>\nResources and Further Reading<br>\nAdditional details can be found in the IQM H1/Q2 2026 press release here, the complete Management Discussion & Analysis Report here, the Financial Statements Tables here, and the H1/Q2 2026 Results Presentation here.<br>\nAugust 5, 2026<\/p>","content_hash":"4d4d36ad1e46b5d120923d56c5e08408","author":"Mohamed Abdel-Kareem","published_at":"2026-08-06T19:36:07","fetched_at":"2026-08-08 12:39:00","word_count":863,"read_time_minutes":5,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"5b4a6d9fa436625e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18023","title":"Wise guy","url":"https://quantumfrontiers.com/2026/07/26/wise-guy/","summary":"In my closet, in a basket labeled “Random stuff,” sits a bag of quarters. They total only a few dollars, but their worth to me exceeds their monetary value. I received the quarters from Mark Wise. Mark taught a course about the Standard Model of particle physics at my master’s program at the Perimeter Institute for Theoretical Physics, near Toronto. Perimeter borrowed him from Caltech, to whose faculty he belonged. Mark had grown up in Canada and studied at the University of Toronto; so he didn’","content":"<p>In my closet, in a basket labeled “Random stuff,” sits a bag of quarters. They total only a few dollars, but their worth to me exceeds their monetary value. I received the quarters from Mark Wise.<br>\nMark taught a course about the Standard Model of particle physics at my master’s program at the Perimeter Institute for Theoretical Physics, near Toronto. Perimeter borrowed him from Caltech, to whose faculty he belonged. Mark had grown up in Canada and studied at the University of Toronto; so he didn’t mind visiting Canada even in the depths of winter.<br>\nWhat would Mark have minded? He projected a mild manner—an innocuousness—that suited his sense of humor, which he often directed at himself. Mark had a bald patch and glasses, and he wore a mustache. Physics jokes and science-fiction references decorated his T-shirts, one of which he wore beneath a black suit jacket to our first class. His voice was nasal; it grated a little. But I relished listening to Mark’s lectures.<br>\nMark’s lecturing exemplified clarity, because he knew particle physics so deeply. When he walked us through its Lagrangians and scattering diagrams, his conclusions seemed inescapable. His lectures’ logic and structure appealed to me as someone who’s been hyper-organized since at least fourth grade.<br>\nYet Mark cared about us students beyond the requirements of pedagogy. His T-shirts invited conversation from those who arrived to class early. Whenever a student answered or asked a question, he tossed them a quarter. Sometimes, he’d pause to examine the quarter, deliberate about whether to toss a Canadian quarter or an American one, or opine about the motto printed on the coin. (Mark confessed to having lower standards than those ingrained in the New Hampshire state motto, “Live free or die.” Where he came from, “We just wanna live!”)<br>\nSome days, Mark found little change in his pocket and announced that he needed to return to the bank for more quarters. The announcements sounded like complaints. He didn’t need to return to the bank, though, as nobody needs to bring doughnuts to the office for sharing.<br>\nI discovered the icing on the doughnut two years later, as a PhD student at Caltech. I sat in on part of a quantum course taught by Mark. To every student who completed the course, Mark gave a T-shirt that read, “Licensed quantum mechanic.” I received a T-shirt, although I only sat in on part of the course. I’ve never worn it, because I’ve wanted never to wear it out.<br>\nIn 2024 and 2025, I co-taught a course on quantum-steampunk creative writing. Students learned about quantum physics, quantum technologies, and thermodynamics. Quanta are discrete units. For example, a photon is a quantum of energy. I illustrated quanta with coins, which are discrete units of money. From then on, I tossed a quarter to every student who answered or asked a question about quantum physics. (I joked that I should have tossed pennies, the minimal units of money, but chose quarters because inflation had been high recently.) I adapted Mark’s tradition to thermodynamics—the study of energy—by tossing Hershey’s kisses—dense packets of energy.<br>\nBefore moving out of Caltech, I said goodbye to Mark. He worked among the high-energy theorists, rather than the quantum information or condensed-matter theorists, so I had to hunt down his office. He smiled and made a joke, of course.<br>\nMark passed away this summer. His Caltech colleague John Preskill published a eulogy as a blog post here. (I learned from John’s post that infla
