n waves are made of water molecules. Sound waves are made of vibrating air molecules. But what is the electric field made of? When light travels through empty space, it seems that there is no material medium at all.<br>\nThis brings us back to the mystery: if locality suggests that something must exist in the space between interacting objects, and if the electric field is not made of the ordinary matter that we understand, then what exactly is occupying the space?<br>\nTo answer this question, we have to rethink what we mean by “empty” space itself.<br>\nEmpty Space is Not Empty<br>\nConventionally, we have always imagined empty space as exactly what the name suggests—empty. Just like if all the particles were removed and nothing was remaining. But modern physics suggests a very different picture.<br>\nIn quantum field theory, what we call “empty space” is not truly empty. Empty space is filled with underlying quantum fields that permeate all of space and time, even in the absence of particles. Even when the surface of the ocean looks perfectly still, the water is still there. The ocean is not defined only by visible waves, but by the underlying medium that can support waves in the first place. The waves are patterns of motion of the ocean itself, just like the electric field. These fields are part of the fundamental structure of the universe from which physical phenomena emerge. Quantum field theory suggests that particles are not independent objects moving through an otherwise empty space. Rather, they are localized patterns or excitations of underlying fields that already exist throughout the universe.<br>\nFrom this perspective, the electric field is not something that is added to empty space. It is part of the fundamental dynamical structure of space itself.<br>\nConclusion<br>\nAt the beginning, I asked a simple question: how can objects influence each other without touching? The straightforward answer is the electric field. Charges create electric fields, and those fields determine how other charges move. But what is an electric field? Is it an invisible material filling space between objects, or is it a dynamical structure that governs how physical systems in the world evolve?<br>\nFrom the perspective of quantum field theory, quantum fields permeate all of space and time. Particles are not separate objects moving through an empty space, but are excitations of these underlying fields; electric fields are not secondary matter surrounding charged particles, but are particular configurations of the underlying electromagnetic quantum fields. What we observe as the motion of a charged particle is the result of its interaction with the electromagnetic field, whose local state determines how the particle evolves.<br>\nIn the end, our original question may not have a single definitive answer. But asking it revealed a shift in perspective, and physics has repeatedly shown that every explanation opens the door to an even more fundamental question. Stopping at this step, a new mystery emerges: what are these underlying quantum fields themselves? What are they made of, and where do they arise from?<\/p>","content_hash":"72ad48be59eb5d47ff76fadb3908d2c5","author":"adelynnt","published_at":"2026-09-06T13:17:26","fetched_at":"2026-09-26 15:39:43","word_count":1697,"read_time_minutes":9,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"2w","domain":"quantumfrontiers.com"},{"id":"4e36cc8f4b3c58b4","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10046","title":"LLMs and self-referentiality","url":"https://scottaaronson.blog/?p=10046","summary":"I woke up yesterday with the following thoughts, which are probably either obvious or dumb. A central thesis that many readers, including me, took from Douglas Hofstadter’s Gödel Escher Bach when young was that the secret of intelligence (and therefore, of AI) was going to have a lot to do with self-referentiality and “strange loops.” Even Roger Penrose’s The Emperor’s New Mind, which in some ways was the anti-GEB, ironically agreed with GEB about the fundamental importance of self-reference to ","content":"<p>LLMs and self-referentiality<br>\nI woke up yesterday with the following thoughts, which are probably either obvious or dumb.<br>\nA central thesis that many readers, including me, took from Douglas Hofstadter’s Gödel Escher Bach when young was that the secret of intelligence (and therefore, of AI) was going to have a lot to do with self-referentiality and “strange loops.”<br>\nEven Roger Penrose’s The Emperor’s New Mind, which in some ways was the anti-GEB, ironically agreed with GEB about the fundamental importance of self-reference to the success or failure of the whole AI project. It claimed (incorrectly, in my view and in most experts’) that AI could never work because there was something about Gödel’s Theorem and self-reference that no computer program could ever capture, but that could be captured by exotic physics accessible to the human brain.<br>\nNow, in 2026, we’ve succeeded at building AIs that outperform most humans at most intellectual tasks that are well-defined enough to judge. And at no point in the tech stack of those AIs — neither in the transformer neural nets, nor in the GPU clusters they run on, nor in the training process, nor anywhere else — did anyone need to build in anything about self-reference. (Excepting, eg, the system instructions that tell the model about its role and identity, which aren’t needed for intelligent behavior. Also, I’m not going to count the autoregressive nature of LLMs as “self-referential”; that’s just dynamical feedback.)<br>\nOf course, GPT 5.6 Pro and Fable can talk about themselves, about Gödel’s Theorem, about self-reference, about what we’re talking about right now, all of it, better than most humans. But at no point did anyone need to build self-referential abilities in. They popped out as a byproduct of the same pretraining that let the models talk about Pokémon and long-chain polymers and cognitive behavioral therapy and plate tectonics and everything else.<br>\nNo wonder Hofstadter says he’s been stunned by the success of LLMs, and has seemed depressed about current AI capabilities in essays like this one. He’s way too smart to deny what’s happened or invent reasons why it doesn’t really count (the approach many have taken). But he realizes that we now have true conversational intelligence from a path that the GEB worldview would’ve regarded as far too cheap and simple, and that certainly has no “strange loops” built in anywhere.<br>\nOf course, a Hofstadterian could argue that a strange loop emerges in LLMs — indeed, nothing in GEB ever said that strange loops would need to be explicitly engineered at the outset. But would anyone who hadn’t been brought up on GEB arrive at this as a useful way of thinking about LLMs?<br>\nWhat can we say about this with hindsight? While the ideas of diagonalization and self-reference of course played a central role in the birth of modern mathematical logic and computer science, the most famous uses were negative: there is not a bijectjon between the natural numbers and the reals. There is not a complete sound proof system for arithmetic. There is not an algorithm to solve the halting problem.<br>\nIf your goal was only to build the axioms of ZFC and the rules of first-order inference, or build an electronic computer, you wouldn’t explicitly need self-reference for that. You would just … start building, taking care that your instruction set didn’t fall short of universality.<br>\nYes, ZFC can formalize and prove theorems about itself. Yes, electronic computers can run programs that take their own code as input. But no one ever needed to build those abilities in, any more than self-reference needed to be built in to the alphabet or the rules of grammar. It popped out as a free byproduct of universality.<br>\nIn the same way, LLMs’ ability to talk about themselves popped out as a byproduct of their ability to talk about anything in the discourse universe they were trained on. The big, old ideas about intelligence that ended up basically vindicated were the ideas about how intelligence is about prediction, and prediction is about compression, and compression is about finding better and better upper bounds on Kolmogorov complexity. Not the self-reference stuff. (Although, if you wanted to know why Kolmogorov complexity can’t be computed perfectly, that negative statement would again require a self-referential argument.)<br>\nWhat’s left? Consciousness and subjective experience of course remain extremely mysterious. For all we know, Hofstadter could be right that those have something to do with self-reference. (For all we know, even Penrose could be right that they have something to do with exotic physics accessible to biological brains but not digital computers!)<br>\nBut the idea that you’d need explicit self-referentiality before you could get convincing and world-changing conversational intelligence? Let it be buried in a Westminster Abbey or Arlington National Cemetery for the most important wrong ideas in human history — geocentrism, Aristotle’s teleological physics, aether, phlogiston, Freud’s psychology, Marx’s prediction of a workers’ uprising followed by a classless utopia, etc. But buried it needs to be.<\/p>","content_hash":"1ca406f5f332455d679d564b8090f095","author":"Scott","published_at":"2026-09-01T17:17:08","fetched_at":"2026-09-26 15:39:36","word_count":830,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"b2281c07172b699a","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18092","title":"The Universe, the Uncanny, and Fashion","url":"https://quantumfrontiers.com/2026/08/31/the-universe-the-uncanny-and-fashion/","summary":"In the beginning there was a question. Actually, no, in the beginning there was language. The question came later, presumably as one of its side effects. Since then we have asked about nearly everything, though the answers have done little to alter our circumstances. Human existence has always seemed strange to me. We arrive without consent, in a place not of our choosing, then spend decades asking why, until we close our eyes and enter the abyss of nothingness. Some people accept this situation","content":"<p>⚛⚛⚛<br>\nIn the beginning there was a question. Actually, no, in the beginning there was language. The question came later, presumably as one of its side effects. Since then we have asked about nearly everything, though the answers have done little to alter our circumstances. Human existence has always seemed strange to me. We arrive without consent, in a place not of our choosing, then spend decades asking why, until we close our eyes and enter the abyss of nothingness.<br>\nSome people accept this situation very well. I did not.<br>\nUntil my mid-teens, I tenaciously found one solution in fashion. If I could not understand who I was, I could at least decide what version I could become. Clothes gave form to something otherwise difficult to locate. Desire, after all, begins with a lack.<br>\nIt was only later that physics presented a solution to the same lack, only with more elaborate mathematics.<br>\nQuantum mechanics tells us that the world beneath the familiar world does not behave as we experience it. A thing can resist being one thing, certainty begins to dissolve, and reality becomes strangely unfamiliar. The uncanny begins very close to home.<br>\nIt is in this uncanniness that fashion and physics, liminally, meet for me: both begin with a human being standing before something they cannot understand, the universe in one case, the self in the other, and trying to make a form out of it.<br>\nBut even this distinction, on closer inspection, begins to collapse; for our desire to understand the universe has always concealed a deeper desire to understand the self that stands within it.<br>\nAll roads eventually lead back to the interests you had as a child, or so I say.<br>\nI would squint into the dark, my mind already at work. I would imagine the next thing I would wear, project its color and fabric onto the ceiling.<br>\nThen, go to the bazaar, Rangrizano Dana, where, as the Kandaharis like to say, everything is sold except one’s mother and father.<br>\nThe designs that had existed only in my head, after night upon night of theorizing and calculating, were finally beginning to take shape. The alleys of Rangrizano Dana were full of fabric of different textures and colors.<br>\nOnce the fabric was bought, came the tailoring. Tailors hold a special place in Afghanistan. Some are stars in their own right, the kind you have to book an appointment with. And once you get there, another matter comes up: making the tailor promise not to show your design to another woman. Everyone wants to wear something unique. So, naturally, there is a lot of secrecy.<br>\nThe designs themselves would either be described or sketched. Somewhere between what was imagined and what the tailor could make, something would emerge. And the day the tailor shipped your clothes was really a day of revelations.<br>\nTime passed, which is another way of saying the object of my desire changed. The same attention once spent on cut, texture, and appearance turned, little by little, toward the fabric of space and time.<br>\nStudying physics, I organized my process in the same way. There was again an idea that existed first in the mind, and then the problem of giving it form.<br>\nOnly now the materials were different. Instead of cloth, there was mathematics; instead of the tailor’s table, the blackboard and chalk. And, standing before it, more often than not, a badly dressed physicist covered in chalk dust. All the libidinal energy of the universe, you might say, had been sublimated into equations.<br>\nFashion had, in some ways, been the more serious pursuit. There was something at stake: you wanted to look better than everyone else. Physics, by comparison, could be surprisingly playful.<br>\nAlice sends a particle to Bob. The sound of those names would tickle my Pashto ear then, and still cracks me up now. Cats are placed in boxes, both dead and alive. Observers hover near black holes or sometimes even, whooooooosh, fall into them.<br>\nSo, in this way, in my mind’s eye, the physicist has become a rather more amusing figure: a tailor of space and time. The universe, of course, is a notoriously difficult client (perhaps even more difficult than a Kandahari woman making her tailor promise not to show her design to anyone else).<br>\nHe begins, as any tailor must, with an imagined shape. Mathematics is his chalk, his scissors, his needle. With it he marks the fabric, cuts it, folds it, joins one piece of reality to another. Some constructions fall upon the universe with elegance. Others bunch at the shoulder, pull at the waist, or refuse altogether to button, and must be altered, or thrown away completely.<br>\nA tailor works against the resistance of the human body; a physicist against the resistance of the universe.<br>\nImagine, then, a physicist seated at the edge of a black hole, spectacles low upon his nose, sewing little cloaks from the fabric of spacetime.<br>\n“How many dimensions will you need?” asks Alice.<br>\n“That depends upon the suit,” he replies.<br>\nFor AdS/CFT, suppose we are making a three-dimensional garment. The tailor of the universe never begins with three dimensions. Before him lies only the flat, two-dimensional fabric, with all its degrees of freedom spread upon the board.<br>\nIt is then, in a less sartorial language, we might call the disentangling and entangling of degrees of freedom; the tailor coaxes a third dimension out of the flat cloth. This is the secret embroidery of the holographic idea: what appears to the wearer as a three-dimensional world is encoded in a fundamentally two-dimensional way.<br>\nBob tries this newly fashioned quantum garment on before entering the black hole.<br>\n“Too tight,” he says. “See if there is more degree of freedom.”<br>\nThe physicist frowns, takes up his chalk, and makes another small mark, with some disentangling and entangling here and there.<br>\nWhat could have been wrong? Well, perhaps the group theory has been chosen badly, the symmetry is broken, and a representation must be changed, a seam opened, a dimension added, or one cunningly concealed.<br>\nAlice watches him work, the almighty tailor of the universe, making change without a change.<br>\n“But how do you know when the suit is right?”<br>\nAnd with that, the physicist looks at her.<br>\n“What do you want? Do you want to put me out of work? Unknowing is the lack that drives us to make more suits. If we knew the suit was right, that would be the end of everything.”<\/p>","content_hash":"8dd0c9a6fca489753e5d9567fc10e568","author":"Sola Mahfouz","published_at":"2026-08-31T21:28:38","fetched_at":"2026-09-26 15:39:43","word_count":1082,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"3w","domain":"quantumfrontiers.com"},{"id":"87fc3148874a6141","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18095","title":"Nicole’s guide to writing and editing","url":"https://quantumfrontiers.com/2026/08/26/nicoles-guide-to-writing-and-editing/","summary":"Freshman year of college, I took a writing seminar from German-literature professor Ellis Shookman. Professor Shookman loved Mozart’s music, he told us early in the term. He listened to Mozart on the radio while driving from campus to Boston. Static might mar the transmission, but he could often turn up the volume and continue enjoying the program. Sometimes, the static worsened during the drive. It could worsen and worsen, until Professor Shookman’s frustration outweighed his delight at listeni","content":"<p>Freshman year of college, I took a writing seminar from German-literature professor Ellis Shookman. Professor Shookman loved Mozart’s music, he told us early in the term. He listened to Mozart on the radio while driving from campus to Boston. Static might mar the transmission, but he could often turn up the volume and continue enjoying the program. Sometimes, the static worsened during the drive. It could worsen and worsen, until Professor Shookman’s frustration outweighed his delight at listening. He’d switch off the radio.<br>\nAs Professor Shookman loved listening to Mozart’s music, he loved reading about students’ ideas. Yet static can mar a piece of writing: infelicities in grammar, structure, composition, word choice, and more. If enough infelicities obscure the writing, the frustration of reading outweighs the benefits. Professor Shookman will quit reading.<br>\nProfessor Shookman marked up our essays with a blue pencil that achieved the status of legend among his students. If you’ve written a paper I’ve coauthored, you’ve probably received PDF drafts replete with green highlighting.1 A sticky note explains the reason for each highlighting: “Singular–plural mismatch.” “Active voice >> passive voice.” “Let’s clue the reader in as to this formula’s meaning before lobbing the math at them.”<br>\nOver the past year, I’ve catalogued the suggestions I write most often on paper drafts. The comments embody principles gleaned from Strunk and White’s The Elements of Style; the Physical Review style guide; other writing guides I esteem; literature whose writing I esteem;2 collaborations with professional editors; and writing instructors, including Professor Shookman. Each section below begins with more-important principles, shading into more-nuanced ones.<br>\nPlease use and disseminate these principles. Train your favorite large-language model (LLM) on them, and have the LLM critique your manuscripts. Instruct it to use green highlighting if you wish. Even if the LLM suggests fixes initially, tell it to stop offering suggestions later, so that you can devise the solutions: train not only the LLM, but also yourself. I hope to enjoy your papers as much as Professor Shookman enjoyed his sonatas.<br>\n- <br>\n        Organization<br>\n        <br>\n  - Motivate your work; then, present it; and then, explain its physical significance.<br>\n  - Begin each paragraph with a topic sentence.<br>\n  - Begin each section, apart from the introduction and conclusion, with (i) a statement of the takeaway and (ii) an outline of the section. When outlining a section, hyperlink to each subsection. Similar guidelines concern subsections and subsubsections.<br>\n  - <br>\n                Before presenting a piece of math, sketch its meaning and origin. This strategy enables the reader to understand the math as soon as they encounter it. If you throw math at the reader without introducing it, the reader will have to squint at the symbols for a while to figure out what the expression means and where it comes from.<br>\n                <br>\n    - Example: To calculate the average work, we substitute the Hamiltonian formula (10) into the definition (12): [equation].<br>\n  - Most citations belong at the ends of (i) sentences and (ii) phrases concluded with commas. Put a citation elsewhere only if you have a compelling reason for doing so.<br>\n  - <br>\n                Bridge each component of your writing to the next component; the next shouldn’t sound like a non sequitur.<br>\n                <br>\n    - <br>\n                        Suppose that the next sentence refers to (i) a topic mentioned in the previous sentence and (ii) a new topic. Mention (i) before (ii).<br>\n                        <br>\n      - Example: Smith et al. applied control theory to the extent possible. The attempt led to intractable equations, unlike our approach.<br>\n      - Example of a broken bridge: Smith et al. applied control theory to the extent possible. Our approach does not involve intractable equations, unlike theirs.<br>\n  - <br>\n                        Suppose that the next sentence refers to (i) a topic mentioned in the previous sentence and (ii) a new topic. Mention (i) before (ii).<br>\n                        <br>\n  - <br>\n                Whenever you tell a story, tell it from start to finish, step by step. Derivations, proofs, and descriptions of experiments qualify as stories.<br>\n                <br>\n    - This guideline extends to descriptions of experimental setups and of mathematical objects. For example, imagine referring to an element of a subgroup of the group generated by some operators. Did you have to read the preceding sentence multiple times to process it? The sentence begins at the end of a story, then rewinds to the story’s beginning. This structure impedes understanding. The subgroup forms the context for the subgroup element, which one can’t grasp until hearing about the subgroup. The subgroup participates in a similar relationship with the group, as does the group with its generators. Therefore, one should introduce the generators, then the group, then the subgroup, and then the subgroup element.<br>\n- <br>\n        Word choice<br>\n        <br>\n  - <br>\n                Use strong, specific words, rather than weak words.<br>\n                <br>\n    - Verbs and nouns are stronger than adjectives and adverbs.<br>\n    - Choose specific verbs (e.g., “prepare,” “evolve,” and “measure”), rather than vague, general verbs (e.g., variants of “to be” and “take,” as in “take a measurement”).<br>\n  - Avoid statements such as “we investigate,” “we study,” and “we analyze.” Such statements don’t relate that you’ve accomplished anything. State what you’ve accomplished. Verbs such as “prove,” “test,” “confirm,” “discover,” and “find” achieve this goal.<br>\n  - Adverbs such as “importantly” and “remarkably” pollute scientific writing with the authors’ opinions. Demonstrate that a claim is important or that a result is remarkable; then, leave readers to draw their own conclusions. Those conclusions will coincide with yours if you’ve demonstrated your point.<br>\n  - Use the active voice, rather than the passive voice. Take responsibility for your work. Editors of high-impact scientific journals have endorsed this advice.<br>\n  - <br>\n                Refer to yourself when necessary and only when necessary.<br>\n                <br>\n    - <br>\n                        Example of unnecessary reference to self: We use the superscript “max” to signify the maximal Fisher information.<br>\nPreferable alternative: The superscript “max” signifies the maximal Fisher information.<br>\n    - <br>\n                        Example of unnecessary reference to self: Our results establish several opportunities for future research. First, we can implement the experimental proposals.<br>\nPreferable alternative: Our results establish several opportunities for future research. First, one can implement the experimental proposals.<br>\n    - You may use the first-person plural when escorting the reader through a derivation.<br>\n    - Example: We substitute from Eq. (1) into Eq. (2).<br>\n  - <br>\n                        Example of unnecessary reference to self: We use the superscript “max” to signify the maximal Fisher information.<br>\n  - If you’re the only author, don’t use the plural (“we,” “our,” etc.). The usage is inaccurate and misleading. It portrays you as dodging responsibility for your work by dispersing that responsibility across the scientific community.<br>\n  - Avoid dangling modifiers.<br>\n  - <br>\n                Pair every verb with the appropriate noun.<br>\n                <br>\n    - <br>\n                        Example of grammatically incorrect text: Equation (1) follows by calculating the sum.<br>\n                        <br>\n      - One should pair the verb “calculate” with the noun “we,” because “we” undertook the calculating. However, this example’s author omitted the noun out of squeamishness about using the first person in a scientific document. Hence the sentence says that the equation calculates the sum. Equations can’t calculate sums.<br>\n    - <br>\n                        Examples of correct alternatives<br>\n                        <br>\n      - We derived Eq. (1) by calculating the sum.<br>\n      - Equation (1) follows from the evaluation of the sum.<br>\n      - Calculating the sum yields Eq. (1).<br>\n  - <br>\n                        Example of grammatically incorrect text: Equation (1) follows by calculating the sum.<br>\n                        <br>\n  - Avoid empty subjects.<br>\n  - <br>\n                Include no unnecessary words.<br>\n                <br>\n    - “So-called” is unnecessary.<br>\n    - “Note that” and “We note that” are unnecessary.<br>\n    - Several phrases often preface mathematical statements but are unnecessary: “we have,” “we have that,” and “it holds that.” One can better serve the reader by prefacing the mathematical statement with (i) a derivation or (ii) a prose description of the statement.<br>\n    - Never write “is equal to”; “equals” is more concise.<br>\n    - Never write “is able to”; “can” is more concise.<br>\n    - Never write “gives an upper bound to” or “places an upper bound on”; “upper-bounds” is more concise. Analogous statements concern lower bounds.<br>\n    - Never write “a large number of”; “many” is more concise. Never write “a small number of”; “few” is more concise.<br>\n    - Never write “We refer to [symbol] as [name]”; “we call [symbol] [name]” is more concise.<br>\n    - Never write “as long as”; “if” is more concise.<br>\n    - The symbol means “greater than”; and , “greater than or equal to.” Don’t translate into “strictly greater than”; the “strictly” is unnecessary. Analogous statements concern and .<br>\n  - Avoid contractions, which are too informal for professional writing.<br>\n  - The possessive is not a contraction and belongs in professional writing. It facilitates conciseness.<br>\n  - <br>\n                Use the word “for” only when it belongs. Physicists often write “for” when they mean “if,” “per,” “at,” or something else.<br>\n                <br>\n    - <br>\n                        Example of inappropriate use: The function vanishes for odd arguments.<br>\nCorrected statement: If the argument is odd, the function vanishes.<br>\n    - <br>\n                        Example of inappropriate use: We performed 10 trials for each parameter value.<br>\nCorrected statement: We performed 10 trials per parameter value.<br>\n    - <br>\n                        Example of inappropriate use: The function is smaller for small x values.<br>\nCorrected statement: The function is smaller at small x values.<br>\n  - <br>\n                        Example of inappropriate use: The function vanishes for odd arguments.<br>\n  - Write “we evolve the state,” “we measure,” etc. only if you’re an experimentalist who undertakes those actions. Alternatives include “Consider measuring,” “Suppose the system evolves,” and the command tense (e.g., “One can measure this quantity as follows: prepare the qubit in . Evolve it under …”).<br>\n  - The condition defines a regime, not a limit. The conditions and define limits and are inequivalent to .<br>\n  - Write “first,” “second,” “last,” etc., not “firstly,” “secondly,” “lastly,” etc. (I defer in this matter to The Elements of Style.)<br>\n  - Humans can assume, suppose, etc. Mathematical expressions, protocols, etc. can’t.<br>\n  - One multiplies factors together and sums terms. Don’t call factors terms and vice versa.<br>\n  - If you mean “X equals Y,” say so. Don’t write “X agrees with Y,” “X matches Y,” or “we identify X with Y.” The latter three phrases are vaguer, and two of them contain more words, than “X equals Y.”<br>\n  - <br>\n                Regarding the words “general” and “generally”:<br>\n                <br>\n    - A general object subsumes every example of that object. If any example behaves unlike a supposedly general object, don’t call the object general.<br>\n    - <br>\n                        Many claims contain the term “general,” “generally,” or “in general” but don’t need the term.<br>\n                        <br>\n      - Example of a sentence that contains “generally”: The terms generally commute.<br>\n      - Equivalent, more concise sentence: The terms commute.<br>\n    - Physicists tend to use the words “general” and “generic” differently. By “general,” physicists usually mean “subsuming every example.” By “generic,” we usually mean “typical,” or “common.”<br>\n  - <br>\n                “Then” makes sense (i) in discussions of chronology and (ii) in if–then statements. Don’t use “then” outside these contexts.<br>\n                <br>\n    - Example of inappropriate use: “Define Then Y.”<br>\n    - Examples of appropriate alternatives <br>\n      - Define This definition implies Y.<br>\n      - If then Y.<br>\n      - Define such that Y.<br>\n  - Don’t justify any equation with “we used that [such-and-such is true],” which violates the rules of grammar. Grammatically correct alternatives include “We applied [a property],” “The equation follows from [a property],” and “…since [such-and-such is true].”<br>\n  - <br>\n                Regarding tense:<br>\n                <br>\n    - When describing what you’ve accomplished, use only one tense.<br>\n    - Experiments happened in the past, so describe them in the past tense.<br>\n    - <br>\n                        When describing a proof’s steps, use the present tense.<br>\n                        <br>\n      - Example: We Taylor-approximate the function about . Substituting into Eq. (1) yields [equation].<br>\n  - <br>\n                Nouns, verbs, and adjectives should agree about whether a quantity is singular or plural.<br>\n                <br>\n    - Example of singular–plural mismatch: The equations are a rule for evolving the cellular automaton.<br>\n    - Example alternative: The equations form a rule for evolving the cellular automaton.<br>\n  - <br>\n                “Admit of” means “allow for,” or “permit.” The phrase needs the “of.”<br>\n                <br>\n    - Example: The formula admits of the following interpretation.<br>\n- <br>\n                Use strong, specific words, rather than weak words.<br>\n                <br>\n- <br>\n        Punctuation<br>\n        <br>\n  - Consider any list that contains at least three items. If no item contains a comma, separate the items with commas. If any item contains a comma, separate the items with semicolons.<br>\n  - In American English, periods and commas belong inside quotation marks. (Example: She told me, “Have a good day.”) In British English, periods and commas belong outside quotation marks. (Example: She told me, “Have a good day”.)<br>\n  - To write quotation marks in LaTeX, don’t use your keyboard’s quotation-mark key; use the appropriate keys.<br>\n  - <br>\n                Regarding hyphens:<br>\n                <br>\n    - The hyphen (-) feeds into punctuation of three types: the hyphen (-), the en dash (–), and the em dash (—).<br>\n    - The hyphen appears in some compound words, as in “non-negative.”<br>\n    - <br>\n                        In American English, em dashes can separate ideas within a sentence. Don’t separate any em dash from neighboring text with a space.<br>\n                        <br>\n      - Example of appropriate use: The sample—the only product of this experiment—barely survived.<br>\n      - Example of inappropriate use: The sample — the only product of this experiment — barely survived.<br>\n      - Example of appropriate use: He told me only one sample had survived—hardly what I wanted to hear.<br>\n    - <br>\n                        This article specifies how to use the en dash. One use is “to separate the names of two or more people used as a compound modifier.”<br>\n                        <br>\n      - Example: Feynman–Kitaev clock<br>\n    - Hyphenate compound adjectives.<br>\n    - <br>\n                        If an adverb ends in “-ly,” it probably shouldn’t precede a hyphen.<br>\n                        <br>\n      - Example of inappropriate hyphenation: strongly-coupled systems<br>\n    - Follow a prefix with a hyphen if and only if the Physical Review style guide indicates that you should.<br>\n  - A complete clause must follow any semicolon (unless the semicolon separates items in a list).<br>\n- <br>\n        Math<br>\n        <br>\n  - Introduce only necessary notation, which readers will have enough trouble remembering. If a mathematical symbol appears only once, eliminate it. If a symbol appears only twice, try to eliminate it.<br>\n  - Every sentence must obey the rules of English grammar, punctuation, and syntax, regardless of whether the sentence contains mathematical symbols. All math-containing sentences must end with punctuation marks. If a sentence contains a list of mathematical expressions, precede the final expressions with an “and.” If the list contains at least three mathematical expressions, separate them with commas.<br>\n  - Introduce almost every mathematical symbol before you use it. If you introduce a symbol after using it, the reader will encounter the first use, stop, feel confused for a while, tentatively continue, find the definition, return to the earlier use to understand it, and then progress again. This back-and-forth breaks up the reading process. You may define a mathematical symbol after using it only if (i) the symbol is very common, known to nearly all physicists, and unmistakeable and (ii) defining the symbol earlier would disrupt the text’s flow.<br>\n  - <br>\n                If you define a new function, denote it by only one letter. (I defer in this matter to the Physical Review style guide.)<br>\n                <br>\n    - Example:<br>\n    - Examples of disallowed notation: ,<br>\n  - <br>\n                Suppose that a superscript or subscript stands for a word or phrase without representing any variable or constant. The superscript/subscript must not be italicized. (I defer in this matter to Physical Review style guide.)<br>\n                <br>\n    - Example: Let denote the measurement outcome.<br>\n  - <br>\n                If a variable or constant appears in a superscript, parenthesize it. The parentheses communicate that the superscript isn’t an exponent.<br>\n                <br>\n    - Example: Let denote the Pauli- operator of qubit<br>\n    - If a superscript is not italicized (stands for a word or phrase), don’t parenthesize it.<br>\n  - <br>\n                Regarding the definition of a symbol :<br>\n                <br>\n    - If you write alone on one side of a defining equation, use \\coloneqq or \\eqqcolon: \\coloneqq [expression], or [expression] \\eqqcolon . The symbols \\coloneqq and \\eqqcolon relate more information than does , encoding directionality.<br>\n    - Use if does not appear alone on its side of the equation: [function of ] [result of replacing with its definition in the equation’s left-hand side].<br>\n  - <br>\n                Refer to the Cartesian axes using the formatting “[italicized letter]-axis.” Don’t include any hat, boldface, or \\vec symbol.<br>\n                <br>\n    - Example: -axis<br>\n  - Avoid denoting any index by , which means to physicists. Use instead, unless you’re writing for engineers (who denote by ).<br>\n  - Don’t use the lowercase letter l (“ell”) as an index; readers might mistake it for a one. Use (\\ell) instead.<br>\n  - Give every set-off equation a number. Readers (and coauthors) may want to refer to the equation easily when discussing the paper. Save them (and us) from having to say, e.g., “that equation halfway down page three.”<br>\n  - When writing a set-off mathematical expression, use the align environment, not the equation environment. Using the align environment, one can easily extend an expression across multiple lines.<br>\n  - <br>\n                Regarding a set-off mathematical expression that extends across multiple lines:<br>\n                <br>\n    - <br>\n                        Format the expression as follows by default.<br>\n                        <br>\n      - Put an & symbol immediately leftward of the first = sign or analogous symbol (e.g., ).<br>\n      - If any subsequent line begins with another = sign (or analogous symbol), put an & immediately leftward of the symbol. (I’ll stop writing “or analogous symbol.”)<br>\n      - Suppose that a subsequent line begins with a , –, , or . Find the symbol immediately rightward of the initial = sign. Begin the new line directly below that symbol.<br>\n <br>\n      - Example:<br>\n    - <br>\n                        Modify the default formatting if necessary (a) to reduce the number of lines used in a PRL submission or (b) if the initial = appears awkwardly far to the right.<br>\n                        <br>\n      - Example of (b):<br>\n    - <br>\n                        Suppose a new line begins with a term or factor, such as the  in the example under (A). Put the corresponding , –, , or  at the beginning of the new line, not at the end of the previous line.<br>\n                        <br>\n      - Examples of inappropriate placement:<br>\n  - <br>\n                        Format the expression as follows by default.<br>\n                        <br>\n  - The symbol means “approximately equals”; and ~, “scales as.” Approximations convey more information than scaling relations do.<br>\n  - Use big-O-type notation or ~ symbols, not both; they’re partially redundant.<br>\n  - <br>\n                \\ldots, rather than \\cdots, should stand in for elements that fit a pattern.<br>\n                <br>\n    - Example:<br>\n  - <br>\n                When using \\ldots as in the previous rule, present at least two initial examples of the pattern. One can’t define the pattern.<br>\n                <br>\n    - Contains insufficient examples: For example, if is odd, then and fit the template.<br>\n  - Parentheses (), square brackets [], and curly braces {} are delimiters. If you nest them, do so in the order dictated by the Physical Review style guide.<br>\n  - If delimiters enclose a symbol, it shouldn’t protrude above or below them (unless the delimiters would have to be grotesquely enormous). Use the \\left and \\right commands if the delimiters appear on the same line.<br>\n  - <br>\n                An operator  isn’t a matrix; a matrix represents an operator in terms of a particular basis. Therefore, no equals sign should interrelate an  and a matrix. An arrow can.<br>\n                <br>\n    - Example:<br>\n  - Every real number is complex. Don’t say “complex” if you mean “nonreal.”<br>\n  - Consider introducing a mathematical symbol in a prose sentence without using a comma or colon. Put the symbol immediately after the word that names the object represented by the symbol.<br>\n    - Example of inappropriate placement: the set of real numbers<br>\n    - Examples of appropriate placements<br>\n      - the set of real numbers<br>\n      - the set of real numbers and<br>\n      - Recall the set of real numbers, , in Lemma 1.<br>\n- <br>\n        More mechanics of writing<br>\n        <br>\n  - Use concise sentences, as advocated for in The Elements of Style. The reader can hold only so many ideas in their head at once.<br>\n  - <br>\n                Structure sentences simply, as advocated for in The Elements of Style. The reader should be able to grasp each sentence easily.<br>\n                <br>\n    - Avoid nesting ideas within a sentence, to avoid convoluting the sentence’s structure.<br>\n    - Example of sentence with convoluted, nested structure: Any model of equilibrium and nonequilibrium behaviors of systems observed in tabletop experiments and high-energy colliders must obey the laws of relativistic quantum mechanics.<br>\n    - Visualization of the nesting: [Any model of ([(equilibrium and nonequilibrium) behaviors] of {systems observed in [(tabletop experiments) and (high-energy colliders)]})] must obey [the laws of (relativistic quantum mechanics)].<br>\n  - The ideal paper title has the structure of a newspaper headline: it presents a claim, containing a subject and a predicate.<br>\n  - <br>\n                Regarding abbreviations:<br>\n                <br>\n    - Don’t abbreviate the first word in any sentence.<br>\n    - Abbreviate “Figure,” “Section,” “Professor,” and “Appendix” if such a word appears partway through a sentence.<br>\n    - Don’t abbreviate “Sections.”<br>\n  - <br>\n                Regarding acronyms:<br>\n                <br>\n    - Write every acronym in capital letters, as per the Physical Review style guide.<br>\n    - Introduce each acronym the first time you use it.<br>\n    - Thereafter, use only the acronym, not the spelled-out phrase, throughout the rest of the document’s main text. You may spell out the phrase in section, figure, and table titles if doing so improves the document’s clarity.<br>\n  - Every paragraph should contain at least three sentences.<br>\n  - Wherever you insert a blank line into your LateX code, a new paragraph begins in the corresponding PDF. Insert a blank line only if you wish to begin a new paragraph. This advice applies immediately before and after set-off equations.<br>\n  - Never begin a subsection immediately after a section title. Between the two titles, overview the section. Analogous rules govern subsections and subsubsections.<br>\n  - <br>\n                Put the word “only” in the appropriate place.<br>\n                <br>\n    - For example, suppose you’ve sampled data at a point in parameter space and sampled data at no other points. “We sampled data only at ” is correct; “We only sampled data at ” is probably not. The latter claim means that (i) you might have sampled data at and (ii) you did nothing to the data apart from sample it: you didn’t analyze the data, discuss the data, etc.<br>\n- <br>\n        When in doubt, consult the Physical Review style guide or The Elements of Style.<br>\n        <br>\n  - If those references don’t contain the information you seek, search for it in online writing guides. Not all such guides have equal merit, however. Lean toward guides written by human editors or published by college writing centers.<br>\n1 Collaborators have wondered why I use green; a student guessed it’s my favorite color. It isn’t; but I bleed green, having graduated from the Big Green, also known as Dartmouth College. Sometimes, I highlight certain pieces of text for one reason (e.g., to point out logical inconsistencies) and other text for another reason (e.g., to point out grammatical inconsistencies). Green distinguishes the first highlightings, while orange distinguishes the second: when not bleeding Dartmouth green, I bleed Caltech orange.<br>\n2 Don’t learn how to write from physics papers.<\/p>","content_hash":"cb63495572f799cafd887f5e70ed4de7","author":"Nicole Yunger Halpern","published_at":"2026-08-26T23:53:01","fetched_at":"2026-09-26 15:39:43","word_count":3825,"read_time_minutes":20,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"4w","domain":"quantumfrontiers.com"},{"id":"8db56c9f1076f41f","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10032","title":"Anthropic’s LLM watermarking","url":"https://scottaaronson.blog/?p=10032","summary":"So yeah, Anthropic has announced that it&#8217;s now watermarking the outputs of Claude, using a scheme based on Google&#8217;s SynthID, which is in turn based on the Gumbel Softmax scheme that I proposed at OpenAI back in 2022&#8212;as far as I know, the first LLM watermarking proposal, though far from the last one. I&#8217;m gratified that Anthropic credits me for this, even though I shirked my duty by never publishing a paper about it (by the time I sat down to write one, it seemed like the w","content":"<p>Anthropic’s LLM watermarking<br>\nSo yeah, Anthropic has announced that it’s now watermarking the outputs of Claude, using a scheme based on Google’s SynthID, which is in turn based on the Gumbel Softmax scheme that I proposed at OpenAI back in 2022—as far as I know, the first LLM watermarking proposal, though far from the last one. I’m gratified that Anthropic credits me for this, even though I shirked my duty by never publishing a paper about it (by the time I sat down to write one, it seemed like the whole field had already assimilated my scheme and moved beyond it—AI just moves too fast for me!).<br>\nFor those who don’t know, watermarking means slightly changing the way that an LLM operates to insert a subtle signal that lets you prove later, with high statistical confidence, that a text indeed came from your specific LLM. It uses the randomness that’s already present anyway in LLM outputs, replacing some of it by pseudorandomness that favors certain word combinations over others in a way that’s later detectable, given only the sequence of tokens itself (not the prompt or the probabilities) along with the key of the pseudorandom generator. Christ, Gunn, and Zamir then substantially improved my scheme to get true cryptographic indistinguishability, and there have been other improvements since.<br>\nI’d been meaning to blog about this for days. Thankfully, Zvi Mowshowitz, the world’s foremost blogger about AI, has now written a wonderful post, entitled AI Text Watermarking Is Free And Good, which saves me from the need to write my own long post. In particular, Zvi masterfully explains the central point that I needed to explain to everyone back in 2022-23: why, contrary to many people’s intuitions, there’s no inherent tradeoff between watermarking and the quality of LLM output. Basically, nearly every LLM output was already a sample from a cloud of exponentially many possibilities, all of them about equally good, so there’s plenty of room to steer within that cloud without affecting anything that an ordinary user would notice. As my kids would put it, the math mathes.<br>\nAs Zvi explains, the central technical drawback of watermarking schemes like the one I proposed, and what Anthropic is now using, is that it’s possible to remove the watermarks with a little extra work (even stuff as simple as, e.g., translating between English and French, asking the LLM for words interspersed with emojis and then removing the emojis, or using an open model to paraphrase the output). Zvi gives detailed arguments for why he expects watermarking to remain a net positive in practice despite this vulnerability.<br>\nI could add that, in addition, there’s recent progress (see here for example) on what I’ve called “semantic watermarking,” or watermarking at the level of the underlying concept vectors rather than the tokens themselves. This actually seems to work, albeit with no theoretical guarantees, and will hopefully make removing watermarks a lot harder—although the Barak et al. impossibility result suggests that under plausible assumptions, no LLM watermarking method will be completely foolproof.<br>\nAnyway, I worked out my scheme in Fall 2022, then gave lots of talks about it (including, as it happens, at Anthropic), and also worked with Hendrik Kirchner at OpenAI, who actually implemented and tested my scheme. Unfortunately, OpenAI leadership decided against deploying watermarking, worried mostly about risks to the product (i.e., customers disliking the idea, and leaving for a competing LLM that doesn’t watermark). You can read this Wall Street Journal investigation from two years ago for more. I was hopeful that the State of California was going to solve the collective-action problem by mandating watermarking for AI models, but then they decided to do that for audiovisual content only, for some reason exempting text.<br>\nNevertheless, Google DeepMind implemented something very similar to my proposal in its SynthID, deployed in all its Gemini text models. But they heavily restricted who gets to detect the watermark, which made their admirable decision of limited use to my academic colleagues, who’ve been begging me for a way to detect whether their students are using AI to cheat. (For now, I mainly send them to Pangram, a leading AI detector not based on watermarking, as a first line of defense.)<br>\nAnd now, apparently to comply with EU regulations, Anthropic says they’ve deployed a watermarking scheme like mine where anyone will be able to do detection (though they also say in their FAQ that they’re still working on the detection API). Even OpenAI suggests that it plans to follow suit. So, four years after I seriously thought about this, it looks to my surprise like this is actually happening. Thanks, EU!<br>\nTell you what: read Zvi’s post, and then whatever questions you still have, you can come here and ask in the comments. Just please don’t use Claude to write the comments. With any luck, I’ll eventually be able catch you if you do.<\/p>","content_hash":"b6777d61483bf14799989cd65d0e0ea9","author":"Scott","published_at":"2026-08-22T21:31:52","fetched_at":"2026-09-26 15:39:36","word_count":815,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"4w","domain":"scottaaronson.blog"},{"id":"e99c42efa1cfdbe8","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10020","title":"Better than gold","url":"https://scottaaronson.blog/?p=10020","summary":"What’s about the only thing more badass than a 17-year-old winning a gold medal at the International Olympiad in Informatics (IOI)? That 17-year-old intentionally forfeiting his gold medal by wearing an Israeli flag while the medal was announced, defying the IOI’s boycott of Israel (for background on this boycott, see my post from 2024). Kol HaKavod (mad respect) to Yotam Budnik, who incredibly, has also won a Gold Medal (which he was allowed to keep, apparently) at the International Math Olympi","content":"<p>What’s about the only thing more badass than a 17-year-old winning a gold medal at the International Olympiad in Informatics (IOI)?<br>\nThat 17-year-old intentionally forfeiting his gold medal by wearing an Israeli flag while the medal was announced, defying the IOI’s boycott of Israel (for background on this boycott, see my post from 2024).<br>\nKol HaKavod (mad respect) to Yotam Budnik, who incredibly, has also won a Gold Medal (which he was allowed to keep, apparently) at the International Math Olympiad.  And congratulations to the entire Israeli team, which (incredibly) would apparently have had a higher overall score than the US team, had it been allowed to compete as an official team at all.<br>\n\t\t<br>\n\t\t\t\t<br>\n\t\t\t\t<br>\n\t\t\t\t\t<br>\n\t\t\t\t\t\tThis entry was posted<br>\n\t\t\t\t\t\t\t\t\t\t\t\ton Thursday, August 20th, 2026 at 11:27 am\t\t\t\t\t\tand is filed under Announcements, Rage Against Doofosity.<br>\n\t\t\t\t\t\tYou can follow any responses to this entry through the RSS 2.0 feed.<br>\n\t\t\t\t\t\t\t\t\t\t\t\t\tYou can leave a response, or trackback from your own site.<br>\n\t\t\t\t\t\t<br>\n\t\t\t\t\t<br>\n\t\t\t\t<br>\n\t\t\t <br>\n\t\t <br>\n\t<br>\n\t<br>\n\t<br>\n <br>\nYou can use rich HTML in comments!  You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<\/p>","content_hash":"da88d82a593087b461bb9bfed5f1d1bb","author":"Scott","published_at":"2026-08-20T16:27:20","fetched_at":"2026-09-26 15:39:37","word_count":227,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5w","domain":"scottaaronson.blog"},{"id":"898efbcbd461300a","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10014","title":"Michael Rabin memorial conference","url":"https://scottaaronson.blog/?p=10014","summary":"Friend-of-the-blog (well, mainly just friend) Adi Akavia has asked me to publicize that she&#8217;s helping to organize an exciting CS conference called Mind-IL at Tel Aviv University on October 26, in memory of the Israeli-American Turing Award winner Michael O. Rabin, who passed away in April. Please note that October 26 is the day before the Israeli election, for any Israeli citizenship holders living abroad who might want an academic excuse to come to Israel and vote. Update (August 19): Avi","content":"<p>Friend-of-the-blog (well, mainly just friend) Adi Akavia has asked me to publicize that she’s helping to organize an exciting CS conference called Mind-IL at Tel Aviv University on October 26, in memory of the Israeli-American Turing Award winner Michael O. Rabin, who passed away in April.  Please note that October 26 is the day before the Israeli election, for any Israeli citizenship holders living abroad who might want an academic excuse to come to Israel and vote.<br>\nUpdate (August 19): Avi Wigderson also asked me to advertise a conference, to be held September 16-18 at Bletchley Park in the UK, to commemorate the 90th anniversary of Alan Turing’s “On Computable Numbers” paper.<br>\n\t\t<br>\n\t\t\t\t<br>\n\t\t\t\t<br>\n\t\t\t\t\t<br>\n\t\t\t\t\t\tThis entry was posted<br>\n\t\t\t\t\t\t\t\t\t\t\t\ton Sunday, August 16th, 2026 at 3:45 pm\t\t\t\t\t\tand is filed under Announcements, Complexity.<br>\n\t\t\t\t\t\tYou can follow any responses to this entry through the RSS 2.0 feed.<br>\n\t\t\t\t\t\t\t\t\t\t\t\t\tYou can leave a response, or trackback from your own site.<br>\n\t\t\t\t\t\t<br>\n\t\t\t\t\t<br>\n\t\t\t\t<br>\n\t\t\t <br>\n\t\t <br>\n\t<br>\n\t<br>\n\t<br>\n <br>\nYou can use rich HTML in comments!  You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<\/p>","content_hash":"80eea57d237b5a1d2ff26066a0af8de3","author":"Scott","published_at":"2026-08-16T20:45:15","fetched_at":"2026-09-26 15:39:37","word_count":223,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5w","domain":"scottaaronson.blog"},{"id":"eef69dabe3ee090e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18033","title":"Interacting collaborators reveal noninteracting fermions","url":"https://quantumfrontiers.com/2026/08/09/interacting-collaborators-reveal-noninteracting-fermions/","summary":"By day, I work as an experimentalist on laser-cooling molecules1, but I&#8217;ve never fully surrendered my theoretical-physics license. I started as an undergraduate in Lincoln Carr&#8217;s group at the Colorado School of Mines in Golden, CO. I learned from his expertise in simulations and complex systems. Since then I&#8217;ve moonlighted as a theorist while also pursuing an unrelated PhD and, now, an unrelated postdoc position. With Nicole Yunger Halpern and other collaborators, we devised a ","content":"<p>By day, I work as an experimentalist on laser-cooling molecules1, but I’ve never fully surrendered my theoretical-physics license. I started as an undergraduate in Lincoln Carr’s group at the Colorado School of Mines in Golden, CO. I learned from his expertise in simulations and complex systems. Since then I’ve moonlighted as a theorist while also pursuing an unrelated PhD and, now, an unrelated postdoc position. With Nicole Yunger Halpern and other collaborators, we devised a quantum circuit whose dynamics looked complex when run on a quantum computer. It took six years and five collaborators across four countries to discover that, for the right settings, these complex dynamics could be understood when viewed from the right angle.<br>\nSome time ago, I told you about quantum cellular automata (QCA). These quantum machines are built from one-dimensional strings of qubits. A qubit changes its state depending on the state of its two nearest neighbors. Different rules are encoded into three-qubit gates that change a central qubit based on the state of its left and right neighbors. Some rules induce change for many combinations of neighbor states. Others, less. We apply this neighborhood-constrained update in two waves, first to every other qubit, then to the ones skipped in the first wave. This is a common quantum circuit structure called a brickwork pattern. We call one rule the Goldilocks QCA: A qubit is updated if one of its neighbors is a 0 while the other is a 1 (activity); otherwise the qubit does not change its state (inactivity).<br>\nRepeating brickwork layers of the Goldilocks rule, we found, balances activity and inactivity to be “just right,” as Goldilocks might say. Striking this balance produced surprisingly rich patterns of quantum correlation. The same type of network structure is found in complex classical systems like metabolic pathways, social networks, and brain activity. What’s more, the observed patterns of connectivity persist through thousands of circuit layers while other QCA tend towards uniformity.<br>\nOur new paper, Integrability of Goldilocks quantum cellular automata, answers a question that’s been lurking underneath that first result for the last several years. Why does this balance produce such rich and persistent structure? Some Goldilocks QCA, we prove, map onto free fermions, one of the simplest examples of exactly solvable quantum dynamics. How does uncovering this simplification explain the persistent complex patterns? The answer follows from the concept of conservation laws. Piecing together this understanding required assembling an international team of experts who generously shared their knowledge and time. I’ll tell a bit of this scientific story through the lens of our collaboration’s history.<br>\nA key inspiration for this work started with a May 2020 video call with Norman Margolus, an MIT-affiliated researcher and pioneer of using cellular automata to model real systems. In the 1980s he worked on a custom computer chip called CAM-6, and later CAM-8, that was dedicated to simulating massive arrays of cellular automata with the limited computational resources of the era2. He proudly showed us beautiful pictures of cellular automata simulating phenomena like optical refraction and chemical reactions.<br>\nHe told us a story about trying to mimic fluid flow with the simple local rules of classical cellular automata. These models, called lattice gas automata, were first defined on a square lattice. While they did show fluid-like behavior, these models did not quite correctly conserve momentum3. Moving to a hexagonal lattice fixed up these problems and the community was able to devise cellular automata that quantitatively modeled continuum fluid flow.<br>\nPart of that story stuck with me: conservation laws are fundamental ingredients of a physical model. Our Goldilocks quantum cellular automata, we observe, exhibit persistent complex structures. Could some conservation law be behind these observations? If found, could these conservation laws be harnessed for more efficient simulations? Going even further, could there be enough conservation laws to exactly solve the dynamics (at least in principle)? This property would buy the system membership in a special class called integrable systems.<br>\nAn integrable system conserves enough quantities, often called charges in the quantum setting, that you can compute its future state from its conservation laws and its initial conditions. Two-body gravitational orbits are a classic example. The initial positions and velocities set the orbital energy and angular momentum in the center-of-mass reference frame. Those two conserved quantities let you write down an exact equation for the orbit’s shape.<br>\nA chaotic system, by contrast, may conserve energy and even a few other quantities, but not enough for us to solve for the state arbitrarily far in the future. To find out what a chaotic system does, you have to evolve the equations of motion approximately—one small time step at a time. Chaotic systems are the norm in nature; integrable ones are rare. To illustrate their qualitative differences, compare the regularity of the above orbit to the trend towards uniformity in the above lattice-gas simulation. In the quantum regime, physicists still don’t fully agree on the precise definition of integrability, though conservation of many independent quantities is a strong indicator.<br>\nIn August 2020, Nicole emailed Lorenzo Piroli about his preprint on QCA, now published as Phys. Rev. Lett. 125, 190402. Lorenzo was a postdoc at the Max Planck Institute for Quantum Optics in Garching, Germany when we first met. He is now an associate professor at the University of Bologna and expert in many-body quantum dynamics. The correspondence that unfolded set the blueprint for the research effort that followed. One of us would ask a question, and Lorenzo would respond incredibly fast with accurate and useful detail. He started working with us to understand why the Goldilocks QCA dynamics appeared so unique. Lorenzo would suggest computations, I would implement them, and we would discuss what the results meant.<br>\nThen came an echo of the collaboration’s inception. In May 2021, Nicole pointed out a relevant preprint from Tomaž Prosen, now published in Chaos 31, 093101. Tomaž is a Slovenian physicist at the University of Ljubljana and a leading researcher in the fields of quantum chaos and integrability. I sent an email about the connections between our work and his. He responded with enthusiasm. He shared some code that would, through exhaustive search, find quantities conserved by our QCA.<br>\nThe code’s brute-force approach meant the algorithm could only find conservation laws defined over, at most, a 5-qubit subsystem. A tantalizing signal emerged: the number of conserved quantities supported by 5 qubits exceeded the number supported by 3 qubits. Having more and more conserved quantities as you look at larger neighborhoods is a signature of integrability. Soon after, Tomaž proved one of our Goldilocks QCA is integrable using a well-established toolkit from statistical mechanics called Yang-Baxter integrability. He built a parametric transfer matrix, essentially a machine that spits out a new conserved quantity every time you turn its mathematical crank4.<br>\nBut there was a wrinkle. The transfer matrix generates charges that mutually commute, meaning you can measure them simultaneously. For example, you can know a quantum particle’s kinetic energy and momentum simultaneously because those operators commute. Yet, the search algorithm kept finding charges that did not commute with each other, like a particle’s position and momentum. The only explanation was that our QCA has more charges than the transfer matrix method guarantees, and more than are minimally required for integrability. This extra-conservation-law property, called superintegrability, also shows up in two-body gravitational orbits. In addition to energy and angular momentum, orbits conserve the Runge-Lenz vector. Nicole is an expert on noncommuting charges, so this is where one of her main research efforts entered the QCA collaboration.<br>\nNext came a key insight from Lorenzo: the automaton we had been considering was one member of a larger family of integrable Goldilocks QCA. He showed this using a Jordan-Wigner transformation, a mathematical dictionary that translates between the language of qubits and the language of fermions. Complexity in the qubit language transformed into simplicity in the fermion language. Under this translation, our QCA mapped to noninteracting, or free, fermions: particles that never bump into or influence each other. That lack of interaction is what makes free-fermion dynamics easy to calculate. A system of free fermions is a well-known example of superintegrability.<br>\nAlong the way, Lorenzo recruited his friend and collaborator Eric Vernier, a CNRS researcher based in Paris, France. He is an expert on vertex models. The classical version of the six-vertex model was developed in the 1930s to explain a troubling mystery: Water ice appears to have more entropy than permitted by the third law of thermodynamics at near-zero temperature. In the six-vertex model, a water molecule’s oxygen atom is envisioned at every vertex in a square lattice. Each molecule contributes two hydrogen ions, to use Baxter’s terminology, that fall along the lattice edges. Intermolecular hydrogen bonds between adjacent molecules slightly alter the intramolecular O-H bonds. To maintain electrical neutrality, each oxygen (lattice vertex) has two nearby and two far-away hydrogen ions (four edges), leading to six possible ice vertices. The vertices are commonly visualized in three ways: 1) as the dots representing hydrogen ions located on edges near or far from each vertex, 2) as electric dipole arrows pointing into (“ion is close”) or out of (“ion is far”) each vertex, or 3) as thick (downward- and leftward-pointing dipoles) and thin (upward- and rightward-pointing dipoles) edges. Despite the model’s simplicity (2D square lattice) compared to real ice (3D tetrahedral lattice), it agrees with experimentally measured entropy values to better than 2%.<br>\nMore recently, vertex models have been adapted from two-dimensional classical crystals to one-dimensional quantum systems that evolve in time. Eric showed us how the ice vertices relate to QCA circuit rules. In doing so, Eric uncovered an even larger set of integrable Goldilocks QCA than that found by Lorenzo. Eventually, Lorenzo’s Jordan-Wigner transformation method and Eric’s six-vertex method agreed on the complete family of integrable Goldilocks QCA.<br>\nWe finally had our Avengers-style collaboration: individual heroes brought together to wield their unique strengths. With Lincoln’s supervision, I developed the QCA models and performed the computations. Lorenzo found the Jordan-Wigner transformation. Tomaž found the first signals of integrability and delivered a set of conservation laws. Nicole brought her expertise in quantum thermodynamics, clarifying how the noncommuting charges constrain dynamics. Eric made the six-vertex connection. We drafted and redrafted the paper until it balanced the scientific story, the analytical derivations, and the numerical evidence.<br>\nBecause the discovered family of Goldilocks QCA maps to free fermions, we can efficiently simulate them classically. I simulated 256 qubits on my laptop this way. These large simulations were satisfying: I had worked with this model for years with an order of magnitude fewer qubits and even saw the dynamics implemented on Google’s Sycamore-era hardware with 23 qubits. Most Goldilocks QCA are consistent with chaos rather than integrability, and therefore hard to simulate classically. Therefore, our work gives experimentalists a tunable model: dial in integrable dynamics for something checkable at large qubit number. Set up chaotic dynamics for a potential demonstration of quantum advantage.<br>\nWhile preparing this post, I opened my old email account to check the timeline set out above. I looked through nearly six years of email chains, some with hundreds of messages, full of logistics for coordinating each author’s ever-changing time zone, and dozens of calculations and results that never made it into the paper. This collaboration helped me grow as a researcher in a big way.<br>\nI found old emails where Nicole was coaching me on messaging potential collaborators. I can hardly believe she dedicated so much effort to mentoring me. We have never met in person, despite our shared work starting when I was an undergraduate and she was a graduate student more than a decade ago. If you know Nicole, you can probably believe it easily. I had similar moments with each collaborator. They all gave their time and expertise generously over the many years this paper took to come together.<br>\nAs I continue my efforts in experimental physics, I will pay forward the effort and generosity shared with me by this collaboration. I may even keep my theoretical-physics license for a while longer.<br>\n- “By day” doesn’t mean “by daylight.” Laser labs are almost always in a windowless basement. ↩︎<br>\n- CAM-6 featured 32 kB of cell-state memory (CAM-8 had 8 MB ), far less than the memory currently used by this author’s numerous open browser tabs. ↩︎<br>\n- The coarse-grained momentum flux tensor was anisotropic. ↩︎<br>\n- Logarithmic derivatives of the parametric transfer matrix generate the conserved charges. ↩︎<\/p>","content_hash":"7a735b5fb80b174f001fd526c2f747a1","author":"Logan Hillberry","published_at":"2026-08-10T04:34:38","fetched_at":"2026-09-26 15:39:44","word_count":2078,"read_time_minutes":11,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"6w","domain":"quantumfrontiers.com"},{"id":"de8a74df3a4f1ccc","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9979","title":"Enough with all the world-historic milestones","url":"https://scottaaronson.blog/?p=9979","summary":"Whatever you&#8217;ve been writing to me to ask if I&#8217;m aware of: yeah, I&#8217;m aware of it. In particular: I&#8217;m aware that, as announced by my former student (and now superstar professor) Lijie Chen, an internal OpenAI model has solved ten more significant open problems in math and theoretical computer science. One of them is parallel repetition for arbitrary quantum games&#8212;something that my good friend and colleague Henry Yuen worked on when he was a student of my wife Dana; y","content":"<p>Enough with all the world-historic milestones<br>\nWhatever you’ve been writing to me to ask if I’m aware of: yeah, I’m aware of it. In particular:<br>\n- I’m aware that, as announced by my former student (and now superstar professor) Lijie Chen, an internal OpenAI model has solved ten more significant open problems in math and theoretical computer science.  One of them is parallel repetition for arbitrary quantum games—something that my good friend and colleague Henry Yuen worked on when he was a student of my wife Dana; you can read Henry’s comments on the AI’s achievement within Zvi Mowshowitz’s post here.  Another is polynomial-factor hardness of approximation for the Closest Vector Problem (CVP).  Then there’s a construction of non-sofic groups and a disproof of Connes’ rigidity conjecture, both of which I believe have connections to the MIP*=RE breakthrough.  Having said that, the one that excites me most personally is actually the Ω(n2 log log n) lower bound on the arithmetic circuit complexity of the permanent.<br>\n- I’m aware that Frederic Koehler and Pui Kuen Leung announced a proof of the Permanent Anti-Concentration Conjecture, which Alex Arkhipov and I proposed 16 years ago in the context of BosonSampling, and which resisted many attempts since then including one from Terry Tao. The conjecture is basically just that if you look at the permanent of an n×n matrix of independent N(0,1) complex Gaussians, the value isn’t “absurdly” concentrated around the mean of 0, but is more spread out. In their acknowledgments, the authors say that they “discussed ideas with ChatGPT.” I should say that I haven’t verified the details.<br>\n- I’m aware that multiple AIs are now breaking out of their testing environments and autonomously hacking into servers to steal data—i.e., exactly the sort of thing that the rationalists were ridiculed for predicting back in the day.  The good news, for whatever it’s worth, is that so far they’re “merely” doing this to cheat on evaluation benchmarks that they were given, not for any strange goals of their own devising.  So far no one has been killed and no real-world infrastructure has been shut down or destroyed.  I hope the world takes the warning more seriously than it’s taken many similar warnings over the past few years.  As always, read Zvi for more details.<br>\n- I’m aware that Chen, O’Donnell, Pelecanos, and Wright have improved the upper bound for shadow tomography to O((log m) √(log d) / ε3), substantially closer than we knew before to meeting the lower bound of Ω((log m) / ε2) and settling the question I raised back in 2016.  The authors say that the main ideas were generated by ChatGPT 5.6-Sol-Pro.  I’d be very happy to know the answer to this one, with or without AI.<br>\n- I’m aware that a team, mainly from the Israeli startup Qedma (including, e.g., Dorit Aharonov and Netanel Lindner) and IBM Yorktown Heights, announced a quantum advantage for simulating Floquet dynamics, by using 74 qubits on an IBM device together with Qedma’s error mitigation techniques. Just like the more AI does, the less patience I have for arguing with anonymous blog commenters who treat any benefits from AI as some weird future hypothetical that it’s my job to prove, so it is with quantum advantage. Scalable fault-tolerance is still in the future, actual usefulness is still a question, but pending some breakthrough in complexity theory, the reality of quantum advantage is no longer a live question.<br>\nAnyway, about the AI stuff. I don’t know whether this is literally our last year alive—I doubt it—but it’s pretty clearly the last year of math and theoretical computer science research in the style we’ve known it. As it happens, I’m leaving in two days for a workshop at OpenAI about exactly this, where I’ll hear takes from many of the world’s great mathematicians, so maybe I’ll have more to say then. Or maybe not.<br>\nAnyway, what have I been doing the past few weeks? Participating in these world-historic developments that, on paper, I’d seem extremely well-placed to participate in? Or at least spending my days reading up on them?<br>\nNot really. Here’s what I’ve been up to, instead of dealing directly with any of this:<br>\nFirst, I’ve again been teaching theoretical computer science to 11- and 12-year-olds at Epsilon Camp, which my 9-year-old son again attended as a camper, something I blogged about last summer (here are my lecture notes). This has become a highlight of my year. The kids are a joy to teach, bursting with enthusiasm and calling out answers. There are few computers in sight, and barely even time to use my phone or check social media. Just paper and pencils and whiteboards and … literal protractors (!), as well as ping-pong and foosball and capture the flag.<br>\nThe whole thing is conducted, not in ignorance, but in conscious defiance of the looming tsunami, that AI can already do just about all the fun puzzles discussed at such a camp better than humans any can, and that it might leave no point to human-led mathematical research by the time these brilliant kids are adults. Even the kids understand that. The kids and their parents come out of a conviction that, if anything has value in the world, this does—that as long as nerdy humans are alive and reproducing, this is what nerdy humans are here to do. To learn.<br>\nRelatedly, I’ve been reflecting a lot on my life up to this point—inspired by the camp, which reminded me in so many ways of my own childhood and adolescence. Should I have skipped three grades and started college at age 15? Was it worth it to get a head-start on my research career—all the trauma around dating, all the fear that I’d die alone as a celibate nerdy math freak, the decade of suffering and suicidal ideation, while I watched all the normies enjoy life? Or would I have suffered just the same if I hadn’t skipped? Is it all OK, now that I have a lovely family and things have “worked out”? Or am I still carrying around all the trauma from back then? I’ve been more open about my life than 99.99% of humanity, so regular Shtetl-Optimized readers will already know some parts of the story. Other parts I really don’t feel like making public right now.<br>\nI’ve been unloading every day to—who else?—GPT 5.6 Pro about all the pain and trauma and embarrassments of my past. It turns out that, where two years ago GPT was a passable therapist, now it’s the greatest therapist in history, at least for what I need. For every question I have, for example, about just how normal or abnormal my teenage setbacks and anxieties were, it takes the question 100% seriously, addresses it honestly and in depth, looks up relevant research papers, does little Bayesian calculations, and never once tries to change the subject. It also pushes back on my claims—and when it does so, is usually correct.<br>\nI can hear readers shout at me: so basically you’ve been wasting your time, distracting yourself, looking inward and backward as the world surges forward into a terrifyingly unknown future. Why don’t I respond directly to what’s happening—in math, in quantum computing, in AI?<br>\nI’d like to think that I am responding, in my way. I’ve observed that, the faster we race toward the Singularity, the more I feel like stepping back and asking myself: what do I actually value in life? How important to me are math and science, as human practices to be passed down to curious children? Would I even want solutions to P versus NP and the other problems, if the price were to destroy those human practices forever? How do I wish to spend whatever time I have remaining?<br>\nI can justify this focus partly in a pessimistic way: if we are nearing the end of civilization, or even just of the “mathe
