ing in performance improvements across all optimization levels. Users do not need to change anything in their transpiler development workflow. However, by upgrading to the latest version of Qiskit, you should see faster transpilation times, particularly noticeable for large circuit depths.<br>\nThe graphs below show the difference in transpile time between Qiskit v0.44 and v0.55 across a range of circuit depths and optimization levels:<br>\nFaster circuit construction and QASM parsing due to Singleton classes<br>\nThe following unparameterised and non-controlled gate classes have been refactored to be singletons:<br>\n- DCXGate,- ECRGate,- HGate,- IGate,- iSwapGate,- SGate,- SdgGate,- SwapGate,- SXGate,- SXdgGate,- TGate,- TdgGate,- XGate,- RCCXGate,- RC3XGate,- YGate,- ZGate,- CHGate,- CSGate,- CSdgGate,- CSwapGate,- CSXGate,- CXGate,- CCXGate,- C3SXGate,- C3XGate,- C4XGate,- CYGate,- CZGate<br>\nAs a result, implementing these gates has become significantly more efficient, requiring less memory, reducing circuit construction time and speeding up QASM parsing time. These effects are most noticeable in large circuits, and highlight the efforts being made to ensure Qiskit can continue to support users as they move towards utility-scale experimentation.<br>\nSee below a comparison of circuit build time and parameter binding time between Qiskit v0.44 and 0.45:<br>\nNew deprecations<br>\nIn this section we’ll cover some of the most important new deprecations in this release. This section aims to highlight things that will now start throwing deprecation warnings and will be removed in a later release, following Qiskit’s Deprecation Policy (documented in full here). Due to this being the last release before Qiskit 1.0, you may see more things than usual being highlighted in this section.<br>\nFor guidance on how to deal with deprecation warnings, check out the deprecations section in our previous article here. You can see more detail about the deprecations specific to this release here.<br>\nqiskit.extensions<br>\nThe qiskit.extensions sub-module is pending deprecation and will be fully deprecated in a future release, with its contents either being moved to other sub-modules or deprecated.<br>\nThe following qiskit.extensions classes have been moved to the circuit library, users should update their import statements accordingly, using from qiskit.circuit.library import ... instead of from qiskit.extensions import ... .<br>\n- UCPauliRotGate,- UCRXGate,- UCRYGate,- UCRZGate,- UnitaryGate,- HamiltonianGate,- Initialize<br>\nThe following qiskit.extensions classes have been deprecated, due to them being similar to existing functionality elsewhere:<br>\n- SingleQubitUnitaryand- Snapshot<br>\nAdditionally, the following QuantumCircuit methods have been deprecated as part of this change:<br>\n- .isometry(), .- snapshot(),- .ucrx(),- .ucry(),- .ucrz(),- .squ(),- .diagonal()and- .hamiltonian()<br>\nUnroller transpiler pass<br>\nThe Unroller pass has been deprecated due to its functionality being superseded by the BasisTranslator pass, which can be used in a wider range of use cases than was possible with the Unroller pass.<br>\nFor users currently using the Unroller pass, we recommended updating your code to use a custom pass manager with the BasisTranslator pass. For example:<br>\nfrom qiskit.transpiler import PassManager<br>\nfrom qiskit.transpiler.passes import UnrollCustomDefinitions, BasisTranslator<br>\nfrom qiskit.circuit.equivalence_library import SessionEquivalenceLibrary as sel<br>\ncircuit = YOUR_CIRCUIT<br>\nbasis_gates = YOUR_BASIS_GATE_LIST<br>\npm = PassManager(<br>\n [<br>\n   UnrollCustomDefinitions(sel, basis_gates=basis_gates),<br>\n   BasisTranslator(sel, target_basis=basis_gates),<br>\n ]<br>\n)<br>\npm.run(circuit)In addition, as part of this deprecation, the use of the unroller value for the translation_method argument in the transpile() function is also deprecated. Users should use the default translator option instead. So, instead of transpile(qc, backend, translation_method=\"unroller\", ...) , users can use transpile(qc, backend, ...) .<br>\nbind_parameters()<br>\nThe functionality of assign_parameters() is the same as that of bind_parameters() , so we’ve made the decision to deprecate bind_parameters() in an effort to clean up the Qiskit codebase. Users should update their code to use assign_parameters() instead of bind_parameters() going forward.<br>\nDuplicated circuit gate methods<br>\nThere are certain QuantumCircuit methods that apply the same gate as another existing method, so duplicated gate methods have been deprecated, and going forward only one gate method will exist for each gate. The following methods are being deprecated by this change:<br>\n- .i()is deprecated; users should use- .id()instead<br>\n- .cnot()is deprecated; users should use- .cx()instead<br>\n- .toffoli()is deprecated; users should use- .ccx()instead<br>\n- .mct()is deprecated; users should use- .mcx()instead<br>\n- .fredkin()is deprecated; users should use- .cswap()instead<br>\nBreaking changes<br>\nIn this section we’ll highlight any changes that could cause user’s existing code to break when updating to this latest version, such as deprecated classes/functions that have now been removed.<br>\nDeprecated code from numerous prior releases has been removed<br>\nDue to the upcoming release of Qiskit 1.0, we are doing as much as we can to remove outdated code that has been throwing deprecation warnings for 3 months or more (in line with the removal timeline stipulated in our deprecation policy). In this release we have removed all code that was deprecated in Qiskit (Terra) releases 0.16, 0.19, 0.20 and 0.21. Users who are using deprecated code from these release versions should check the deprecation warnings for information on how to update your code, or consider pinning your Qiskit version to v0.44 or earlier.<br>\nSingleton Gates<br>\nDue to unparameterised and non-controlled gates being refactored to singletons, users will no longer be able to set the label, condition, duration, or unit attributes after instantiating a gate object. Instead users will now only be able to set these attributes as arguments when creating a new gate object, or use the new method .to_mutable() to get a mutable copy of the gate and set the attribute on that copy instead of the original object.<br>\nFor example, the following code will now throw an error:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate()<br>\nxgate.label = \"My X Gate\"Instead, this example could be refactored like so:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate(label=\"My X Gate\")or alternatively:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate().to_mutable()<br>\nxgate.label = \"My X Gate\"And there you have it! The most important details of the latest release. Remember, if you want to put ideas forward for future versions of Qiskit, you can always open a GitHub issue to request a feature or report a bug! And if you want to follow what’s coming up in the next release (as well as releases for other packages in the Qiskit Ecosystem), you can take a look at the Qiskit Release Planning Wiki.<br>\nMany people contributed to this release, special thanks to (in alphabetical order): Abby Mitchell, Abhiraj Shrotriya, Abigail J. Cross, Alexander Ivrii, AlexanderGroeger, Andir16, Aniket Patil, Christopher J. Wood, David McKay, Diego Emilio Serrano, Edwin Navarro, Elena Peña Tapia, Eric Arellano, Erick Winston, Evgenii Zheltonozhskii, Henry Zou, Hunter Kemeny, Ikko Eltociear Ashimine, Ikko Hamamura, Jake Lishman, Jay M. Gambetta, John Lapeyre, Joonghoon Lee, Julien Gacon, Kevin Hartman, Kevin J. Sung, Kyle Lund, Luciano Bello, Mahnoor Fatima, Matthew Treinish, Michał Górny, MozammilQ, Naoki Kanazawa, Paul Nation, Pieter Eendebak, Raghav, Raynel Sanchez, Ryuhei Yoshida, SamD-1998, Santhosh G S, Simone Gasperini, Takashi Imamichi, Toshinari Itoko, TsafrirA, Will Shanks, adigaboy, atharva-satpute, danielleodigie, jaeunkim, rht<\/p>","content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-06-28 19:12:54","word_count":1976,"read_time_minutes":10,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"137w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":"<p>Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics<br>\nBy Zhiding Liang, Jinglei Cheng, and Hanrui Wang<br>\nThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?<br>\nTraditionally, researchers approach VQAs at the gate-level. More specifically, they focus on the design of a type of quantum circuit structure known as the “ansatz,” which serves as a kind of template for the quantum state that we believe is close to the solution of the problem at hand. The challenge with this approach is that gate-level quantum circuits have a lot of redundancies and inefficiencies that limit the execution of intricate quantum algorithms on the noisy quantum computing hardware we have today. Fortunately, there’s a new kid on the block who could very well open up a world of possibilities for running VQA algorithms on near-term quantum hardware. It’s called the Parameterized Quantum Pulse Circuit.<br>\nIn this blog post, we will showcase how to use a tool from the Qiskit Ecosystem called Qiskit Dynamics to simulate the parameterized quantum pulse circuits, with a focus on the variational quantum eigensolver (VQE) algorithm. More specifically, we will demonstrate the Pulse ansatz on near-term superconducting hardware by using part of the PAN [1] algorithm, implementing a pulse-based ansatz for estimating the H2 molecule’s ground state energy.<br>\nPulse programming in Qiskit<br>\nOne of the useful features of Qiskit is that it gives us a lot of flexibility. Most Qiskit users focus on gate-level operations. However, when we’re working with transmon qubits in superconducting hardware, we know the quantum system executes qubit operations by firing microwave pulses at the qubits. Qiskit provides both gate-level and pulse-level programming capabilities, allowing us to get much more creative with how we approach algorithms like VQE.<br>\nWithin Qiskit’s Pulse programming, users can customize pulse shapes for transmon qubits, adjusting parameters like amplitude, phase, shape, and frequency. (Check the Qiskit Pulse module for more details.) Users can also use the Qiskit Ecosystem project Qiskit Dynamics to quickly and efficiently simulate the generated pulse schedules.<br>\nPulse circuits offer much more versatility than gate-level programming, but they come at the cost of precision, leading to potential uncertainties in the resulting unitary matrix. This precision is crucial for non-variational algorithms that demand exact rotations and operations. However, in variational quantum algorithms, the primary goal is to approximate a specific quantum state, not to achieve perfect accuracy. Experiments in previous research — VQP [2] and Pan [1] by Liang, Zhiding, et al., and [3] by Egger, Daniel J, et al. — confirm that shorter circuit latency pulses can effectively achieve these outcomes on IBM hardware via pulse access with both quantum machine learning (QML) and quantum chemistry tasks, such as running the VQE algorithm.<br>\nVariational Quantum Eigensolver<br>\nThe Variational Quantum Eigensolver (VQE) is a prominent example of variational quantum algorithms. A comprehensive review of its methods and best practices can be found in the VQE documentation provided in Qiskit. Distinct from conventional quantum algorithms that require fault-tolerant quantum computers for proper execution, VQE can be tailored for efficient operations on our current generation of noisy quantum devices.<br>\nWhen using the typical gate-level approach, we begin the process of using a VQE algorithm by expressing a system’s Hamiltonian with weighted Pauli matrices, which we can translate into quantum circuits. Next, we deploy an ansatz, essentially a quantum circuit with tunable parameters, to prepare the ground eigenstate of the Hamiltonian. Further measurement of this eigenstate gives us the Hamiltonian’s ground state energy. The power of VQE lies in its iterative nature. It employs classical optimization techniques to adjust the ansatz parameters, minimizing the Hamiltonian’s expectation value and thereby approximating the system’s lowest energy state.<br>\nDifferent ansatz structures have been proposed, from hardware-efficient models to the UCCSD, and each possesses its own advantages and challenges. Some researchers have even proposed a search-based algorithm, the QuantumNAS [4], to simplify the process of finding the best ansatz. As quantum computing continues to advance, VQE remains a popular area of focus, with ongoing studies exploring innovative ansatz structures and optimization strategies to enhance its precision and applicability.<br>\nBefore diving into pulse-level VQE, let’s quickly recap the traditional gate-level approach:<br>\n- In gate-level VQE, the parameters we deal with are the angles of rotation gates.<br>\n- The ansatz, or the quantum circuit that approximates the desired quantum state, is composed of these parameterized gates (e.g. rotation gates) and fixed gates.<br>\n- The primary objective is to tweak these parameters such that the quantum state closely approximates the lowest energy state.<br>\nNow, let’s look at how pulse-level VQE differs from the usual approach:<br>\n- Instead of focusing on gate-level parameters, pulse-level VQE shifts attention to the parameters of quantum pulses.<br>\n- These quantum pulses are essentially microwave pulses that act directly on superconducting quantum qubits.<br>\n- By directly controlling the quantum pulses, we can significantly reduce circuit latency.<br>\nWhy Pulse-Level VQE?<br>\nYou might be wondering, “why should I bother with pulse-level VQE when the gate-level approach already exists?” Here are some compelling reasons:<br>\n- Expands the Design Space. Working with pulses allows us to potentially access areas of the Hilbert space that are inaccessible with a CNOT-based circuit decomposition. For example, leakage outside of the computational sub-space may allow the variational algorithm to take short-cuts.<br>\n- Lowers calibration cost. One of the challenges with quantum gates is calibration. With pulse-level VQE, the lack of calibration is automatically addressed as the parameters are updated to mitigate these errors. For example, quantum pulses can sometimes suffer from issues like overrotation and underrotation. Pulse-level VQE inherently corrects these errors by adjusting the parameters to find the optimal quantum state.<br>\n- Reduces Latency. By directly controlling the quantum pulses, the need for intermediate gate operations is reduced, leading to faster quantum computations.<br>\nHow to build parameterized pulse circuits in Qiskit<br>\nTo construct a pulse schedule, we can use the built-in functionality offered by Qiskit Pulse. This allows us to exercise control over the parameters in the quantum pulses, and extract the corresponding pulses from gates.<br>\nFor instance, let’s generate a bell state pulse schedule by directly obtaining the corresponding pulses from the gate-level circuit.<br>\nfrom qiskit import QuantumCircuit, pulse<br>\nfrom qiskit_dynamics.backend import DynamicsBackend<br>\nqc_test = QuantumCircuit(2)<br>\nqc_test.h(0)<br>\nqc_test.cx(0,1)<br>\nqc_test.measure_all()<br>\nwith pulse.build(backend) as pulse_test:<br>\n  pulse.call(qc_test)<br>\npulse_test.draw()We can visualize the pulse schedule as follows:<br>\nFurthermore, we can build parameterized quantum pulse circuits (see example code below). Here, we use the drag pulse shape from a single qubit gate, since drag pulse is the native pulse in IBM’s superconducting quantum machines. By using drag pulses, we can avoid population leaking outside of the computational subspace. However, we can also build a parameterized pulse from scratch depending on our needs.<br>\nfrom qiskit.pulse import Schedule, GaussianSquare, Drag, Delay, Play, ControlChannel, DriveChannel<br>\ndef drag_pulse(backend, amp, angle):<br>\n  backend_defaults = backend.defaults()<br>\n  inst_sched_map = backend_defaults.instruction_schedule_map<br>\n  x_pulse = inst_sched_map.get(‘x’, (0)).filter(channels = [DriveChannel(0)], instruction_types=[Play]).instructions[0][1].pulse<br>\n  duration_parameter = x_pulse.parameters[‘duration’]<br>\n  sigma_parameter = x_pulse.parameters[‘sigma’]<br>\n  beta_parameter = x_pulse.parameters[‘beta’]<br>\n  pulse1 = Drag(duration=duration_parameter, sigma=sigma_parameter, beta=beta_parameter, amp=amp, angle=angle)<br>\n  return pulse1How to simulate the pulse circuit with Qiskit Dynamics<br>\nTo run the pulse circuit using Qiskit Dynamics, first we need to initialize Qiskit Dynamics itself.<br>\nfrom qiskit_dynamics import Solver, DynamicsBackend<br>\nfrom qiskit_dynamics.backend import default_experiment_result_function<br>\nfrom qiskit_dynamics.array import Array<br>\nimport jax<br>\nfrom qiskit.providers.fake_provider import *<br>\ngate_backend = FakeManila()<br>\ngate_backend.configuration().hamiltonian[‘qub’] = {‘0’: 2,’1': 2,’2': 2,’3': 2,’4': 2}<br>\njax.config.update(“jax_enable_x64”, True)<br>\njax.config.update(“jax_platform_name”, “cpu”)<br>\nArray.set_default_backend(“jax”)<br>\npulse_backend = DynamicsBackend.from_backend(gate_backend, evaluation_mode=”sparse”)<br>\nsolver_options = {“method”: “jax_odeint”, “atol”: 1e-6, “rtol”: 1e-8}<br>\npulse_backend.set_options(solver_options=solver_options)<br>\npulse_backend.configuration = lambda: gate_backend.configuration()After the initialization, let’s try to run the pulse_test (the Bell state circuit we showed in the last section) on Qiskit Dynamics.<br>\nresults = pulse_backend.run(pulse_test).result()<br>\ncounts = results.get_counts()Pulse based VQE for Ground State Energy of H2<br>\nWe will now perform ground state energy estimation for the H2 molecule using our Pulse-based VQE. We’ll need to start with the following preprocessing steps:<br>\n- Use ‘sto-3g’ Gaussian equations to fit the spin orbital of the H2 molecule with bond length equals 0.735.<br>\n- Through the Fermionic mapping, we get the Pauli strings and corresponding coefficients that describe the problem. Based on these Pauli strings, we can generate the observable layer for the VQE algorithm.<br>\nfrom qiskit_nature.units import DistanceUnit<br>\nfrom qiskit_nature.second_q.drivers import PySCFDriver<br>\nfrom qiskit_nature.second_q.mappers import JordanWignerMapper,ParityMapper,QubitConverter<br>\nimport numpy as np<br>\nsimplified_h2_molecule = \"\"\"<br>\nH 0.0 0.0 0.0<br>\nH 0.0 0.0 0.735<br>\n\"\"\"<br>\ndriver = PySCFDriver(<br>\n  atom=ultra_simplified_ala_string.strip(),basis='sto3g',<br>\n  charge=0,<br>\n  spin=0,<br>\n  unit=DistanceUnit.ANGSTROM<br>\n)<br>\nqmolecule = driver.run()We define the VQE and build our own custom pulse ansatz. Then we can use the Qiskit Dynamics module to obtain the results of the estimated energy of H2. (For more details regarding implementation based on the PAN [1] algorithm, please refer to this pulse-level VQE tool based on Qiskit-Pulse and Qiskit-Dynamics.)<br>\ndef vqe(params,pauli_dict,pulse_backend, backend,n_qubit,n_shot):<br>\n  print(“params in def chemistry in vqe.py: “, params)<br>\n  # assert(len(params)%2==0)<br>\n  width_len = int(len(params)-1*(n_qubit-1))<br>\n  split_ind = int(width_len/2)<br>\n  amp = np.array(params[:split_ind])<br>\n  angle = np.array(params[split_ind:width_len])*np.pi*2<br>\n  width_1 = (np.array(params[width_len:]))<br>\n  num_items = (1024–256) // 16 + 1<br>\n  width_norm = (width_1–256) / (1024–256)<br>\n  width_norm = np.clip(width_norm, 0, 1)<br>\n  width = (np.round(width_norm * (num_items — 1)) * 16 + 256).astype(int)<br>\n  amp = amp.tolist()<br>\n  angle = angle.tolist()<br>\n  width = width.tolist()<br>\n  keys = [key for key in pauli_dict]<br>\n  values = [pauli_dict[key] for key in pauli_dict]<br>\n  expect_values = []<br>\n  for key, value in zip(keys, values):<br>\n    prepulse = HE_pulse(backend, amp, angle, width)<br>\n    expect = vqe_one(prepulse, n_qubit, n_shot, pulse_backend, backend, key, value)<br>\n    expect_values.append(expect)<br>\n  print(“E for cur_iter: “,sum(expect_values))<br>\n  return sum(expect_values)Here is a plot showing the convergence of estimated energy while training pulse-based VQE for the H2 molecule.<br>\nConclusion<br>\nPulse-level VQE offers a promising avenue for quantum optimization. By shifting the focus from gate-level parameters to quantum pulse parameters, we can address several challenges inherent in quantum computing, such as calibration and rotation errors.<br>\nWe hope this blog post provides you with a deeper understanding of pulse-level VQE and its advantages. Stay tuned for more insights into the fascinating world of quantum computing!<br>\nReferences<br>\n[1] Liang, Zhiding, et al. “Pan: Pulse ansatz on nisq machines.” arXiv preprint arXiv:2208.01215 (2022).<br>\n[2] Liang, Zhiding, et al. “Variational quantum pulse learning.” 2022 IEEE International Conference on Quantum Computing and Engineering (QCE). IEEE, 2022.<br>\n[3] Egger, Daniel J, et al. “Pulse variational quantum eigensolver on cross-resonance-based hardware.” PhysRevResearch.5.033159. American Physical Society (2023).<br>\n[4] Wang, Hanrui, et al. “Quantumnas: Noise-adaptive search for robust quantum circuits.” 2022 IEEE International Symposium on High-Performance Computer Architecture (HPCA). IEEE, 2022.<\/p>","content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-06-28 19:12:55","word_count":1754,"read_time_minutes":9,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"138w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":"<p>Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?<br>\nBy Maria Violaris, PhD student at the University of Oxford<br>\nCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum superposition. By modelling Schrödinger’s cat as a qubit and simulating his thought experiment on a quantum computer, we can resolve the apparent paradox, and explain how even a quantum mechanical cat will always be observed as either dead or alive.<br>\nWelcome back to the Quantum Paradoxes series, where we resolve quantum paradoxes using the tools of quantum computing. In addition to blog posts like this one, each instalment of the series includes a video on the Qiskit YouTube channel and a Qiskit code tutorial that shows you how to reproduce our simulations for yourself. So far, this series has covered five thought experiments ranging from the quantum bomb tester to the quantum pigeonhole paradox, and we’ve got plenty more on the way. This week, we’re centering our attention on perhaps the most famous thought experiment in the history of quantum mechanics. But before we see how quantum computing helps us resolve Schrödinger’s apparent paradox, let’s take a closer look at the original thought experiment.<br>\nClick here to watch “Schrödinger’s Cat Explained with Quantum Computing” on the Qiskit YouTube Channel.<br>\nIntroducing Schrödinger’s cat<br>\nImagine we put a cat inside a box along with a vial of poison, a small hammer and a radioactive atom. If the atom decays, it will trigger the hammer to smash open the vial of poison and the cat will die. If the atom does not decay, the hammer will not smash open the vial of poison and the cat will stay alive.<br>\nImportantly, the radioactive atom can be in a quantum superposition of “decaying” and “not decaying.” Since everything inside the box is ultimately made of atoms, let’s treat the entire box as a quantum system. As the radioactive atom interacts with the hammer, which interacts with the poison, which interacts with the cat, they all enter a big joint superposition.<br>\nThis means the states of the atom, hammer, poison and cat have become quantum entangled. In one part of their overall state, the atom has decayed and the cat is dead. In the other part, the atom has not decayed and the cat is alive. We are left with a seemingly absurd conclusion that inside the box, the cat is in a superposition of being alive and dead at the same time!<br>\nThe collapse postulate<br>\nThe apparent paradox comes in when an observer looks inside the box. At that point, they will only see a living cat, or a dead one.<br>\nTo explain this, quantum theorists developed the collapse postulate, which states that when you observe a quantum system in superposition, it undergoes an irreversible collapse into just one state, with some probability. Applying the collapse postulate to Schrödinger’s cat means that if anyone opens the box containing the cat and observes the cat’s state, their observation will cause a collapse so they only see either a living cat, or a dead one.<br>\nThe idea that observation causes an irreversible collapse to a single state is often referred to as the “Copenhagen Interpretation” of quantum mechanics. This viewpoint is typically presented as the conventional explanation for why we see a single outcome, yet it fails to address the key questions of the Schrödinger’s cat thought experiment.<br>\nIs a cat an observer?<br>\nA natural question arises from this postulate: surely the cat itself is an observer? If so, the cat’s observation of the atom should be enough to collapse its state into being decayed or not decayed. The cat will then either be dead or alive, with no need for absurd, cat-sized superpositions.<br>\nThe problem with this reasoning is that it breaks down when we apply it to smaller and smaller scales. Does the vial of poison count as an observer which can collapse the atom’s state? How about the hammer? We could even go down to the scale of using a single particle as a detector — one that changes state if the atom decays, and stays the same if it does not. Would this single-particle detector cause the radioactive atom’s state to collapse?<br>\nThe Copenhagen interpretation has no answer to these questions. It does not say what counts as an observer, simply that observation somehow causes an irreversible collapse. It does not tell us whether hammers, vials of poison, or cats can be in a quantum superposition.<br>\nTo answer these questions, we need theories of quantum mechanics that explicitly model the measurement process. These theories fall into two main categories, known as collapse theories and no-collapse theories.<br>\nCollapse theories<br>\nCollapse theories modify the laws of quantum mechanics, such that when we describe Schrödinger’s cat using these modified laws, they explicitly model the cause of collapse. Under these theories, it is specific properties of the system — e.g., mass, size, complexity, etc. — that cause the irreversible collapse into a single state. Whether or not hammers and cats can be in superpositions depends on each individual theory’s precise conditions for collapse.<br>\nThe standard dynamical laws of quantum mechanics have been thoroughly studied, tested, and extended to incorporate special relativity. To date, the objective collapse proposals which modify quantum mechanics remain incomplete theories, and using them to recover all the results of standard quantum mechanics is an open problem.<br>\nNo-collapse theories<br>\nAn alternative approach is to take the existing theory of quantum mechanics at face value as a universal theory — meaning it applies to macroscopic objects, detectors, observers, and our environment. Then, observing Schrödinger’s cat actually corresponds to the observer (or measurement apparatus) becoming quantum entangled with the cat. The observer, cat and atom really do enter a big joint superposition of states.<br>\nCrucially, this measurement process is reversible — there is no irreversible collapse. The observer, cat and atom could in theory be unentangled, and return to their original states.<br>\nOne version of quantum theory which uses this “no collapse” approach is Everettian quantum mechanics. Applying it to the Schrödinger’s cat thought experiment, we find that the act of observation precipitates the emergence of two branches of the universe — one where an observer sees an alive cat and one where an observer sees a dead cat. Hence, this is commonly known as the “many worlds” interpretation.<br>\nOther no-collapse versions of quantum theory include Bohmian mechanics, relational quantum mechanics, and QBism, amongst others. Explanations for the physical meaning of a superposition, and the emergence of measurement outcome probabilities, continue to be discussed and debated among quantum scientists.<br>\nCan Schrödinger’s cat come back from the dead?<br>\nIf we treat observers and the environment as quantum systems, then there’s a clear explanation for why we never see cats being dead and alive in everyday life. As soon as an observer encounters that cat, they join its entangled superposition. As such, the observer only sees the cat being either dead or alive.<br>\nHowever, there is still a missing ingredient for universal quantum theory to explain our everyday experience: since measurements are reversible, measured objects can become unentangled. Schrödinger’s cat could become unentangled from the radioactive atom — it could even come “back from the dead” and return to a fixed alive state!<br>\nThis problem is known as the emergence of classicality in quantum theory. How does a classical world where measurement results have fixed outcomes emerge if all the underlying laws of physics are quantum mechanical, and therefore reversible? Here we need to introduce the notion of decoherence.<br>\nDecoherence<br>\nTo understand decoherence, I like to imagine the environment surrounding the observer as a collection of dominoes. As soon as we knock over one domino, it triggers a chain reaction that spreads out across the entire set until they have all been knocked over.<br>\nThis is analogous to what happens after the observer measures Schrödinger’s cat. As the observer interacts with their environment, they cause a chain reaction where more and more of the environment surrounding them enters the giant entangled superposition with the cat.<br>\nNow, it is much easier to knock down all the dominoes than to stand them all back up. In a similar way, it is much easier for the information about whether the cat is alive or dead to spread out across the environment than it is to erase it from the environment. This is why the cat becomes effectively fixed into either the dead state or alive state: without quantum control over the environment, not even the most powerful technology can unentangle the cat from its environment.<br>\nWe call this process decoherence, because the atom, cat and observer lose their quantum coherence once they interact with the environment. In general, when a system is measured by any part of the environment over which we have no quantum control, the system is projected into a single state, destroying its coherence.<br>\nFighting the effects of decoherence is one of the key challenges of quantum computing. To preserve the coherent properties of the quantum states we use for computation, we want to keep them as isolated from the environment as possible. Once they interact with the environment, qubits decohere and become fixed into separate branches, where they are either in the |0> state or the |1> state.<br>\nEffective collapse<br>\nDecoherence gives the exact appearance of measurement causing an irreversible collapse: if we write down the state of Schrödinger’s cat mathematically, it is exactly the same whether it has undergone a reversible quantum measurement by its environment or an irreversible collapse.<br>\nA fact which is often under-appreciated in explanations of decoherence is that we do not actually need a large, macroscopic environment to cause the cat’s state to decohere. Using even a single-particle detector to store information about whether the cat is dead or alive would effectively collapse the cat’s state. The important property for this effective collapse is that we no longer have access to quantum control over the measurement device or environment. In general, quantum control over a larger device is more difficult, making it harder to unentangle from the measured system.<br>\nSchrödinger’s cat on a quantum computer<br>\nThe Schrödinger’s cat thought experiment becomes much simpler when it is expressed via qubits and quantum circuits.<br>\nWe can model the atom and the cat as qubits, which we can put into an entangled quantum superposition using basic quantum gates. Then we can model irreversible collapse by adding a measurement operation to the cat qubit, or model a quantum observer’s measurement by representing the observer as a third qubit that becomes entangled with the cat and the atom. Finally, we can model environment-induced decoherence by treating the environment as a large collection of qubits, which join in the entangled superposition.<br>\nUltimately the quantum-computing representation of Schrödinger’s cat leads to the creation of states in a superposition of having a large number of qubits in the |0> state, and a large number of qubits in the |1> state. The technical term for these superposition states is actually “Schrödinger’s cat states” because of this thought experiment! Preparing good quality cat states turns out to be useful for some error-correction techniques.<br>\nTo understand in detail how to represent Schrödinger’s thought experiment as a quantum circuit you can run on a quantum computer, and to learn how to code it yourself using Qiskit, have a watch of the Qiskit YouTube video, and see the Jupyter Notebook for the complete Qiskit code, ready to run.<br>\nMake sure to follow the Qiskit Blog and subscribe to our YouTube channel for lots more paradox-busting to come.<\/p>","content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-06-28 19:12:55","word_count":1995,"read_time_minutes":10,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"139w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":"<p>Important changes to Qiskit documentation and learning resources<br>\nToday, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.<br>\nQiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made since Qiskit’s inception. However, it has been challenging to maintain Qiskit documentation and educational resources in their current form. We’ve also received lots of user feedback that these resources needed to be consolidated and better-organized to make Qiskit easier to use on real quantum hardware. Our hope is that the community will no longer need to jump between scattered, disjointed resources to develop quantum programs.<br>\nThat’s why we’re migrating Qiskit educational resources and documentation into the IBM Quantum Platform — to offer a more unified experience for users. Our eventual plan is to sunset all of the content on Qiskit.org and move it to the IBM Quantum Platform.<br>\nIBM Quantum is committed to open-source software development and education, so none of the old content is going away. Community-built content, such as the Qiskit Textbook, will be handed off to the community and remain available on GitHub.<br>\nThings will look a little different — so let’s walk you through the changes.<br>\nQiskit Documentation<br>\nQiskit and Qiskit Runtime documentation are moving to https://docs.quantum-computing.ibm.com/<br>\nThis migration is ongoing, with content due to be fully removed from Qiskit.org by the end of the year. Qiskit.org/documentation and qiskit.org/ecosystem/ibm-runtime/ will go away and redirect to https://docs.quantum-computing.ibm.com.<br>\nDocs will also be structured differently. Instead of API reference, tutorials, how-to guides and explanations, the content will be split into the following sections (to support natural workflows):<br>\n- Install: Begin using our tools and platforms with install and setup instructions.<br>\n- Build: Design and develop quantum circuits with primitives and advanced methods like dynamic circuits and mid-circuit measurements. You can also find our circuit library here.<br>\n- Verify: Validate and evaluate your quantum circuits.<br>\n- Run: Run on our hardware with job configuration options such as sessions.<br>\n- API reference: Find API references for Qiskit, Qiskit Runtime IBM Client, Qiskit IBM Runtime Rest API, and Qiskit IBM Provider in the API reference drop-down menu above. You can also find the Error code registry here.<br>\nUsers will have two ways to submit feedback and report bugs. For non API ref content, they should report issues/feedback in https://github.com/Qiskit/documentation/issues/new/choose. For any user interface-related issues, click the feedback button.<br>\nQiskit and Runtime docs will remain open source, and we still welcome community feedback and contributions to documentation. The translations program will also continue. We are currently working to define a robust process to facilitate contributions, so we are temporarily pausing contribution reviews until the content migration is complete. More details to come.<br>\nQiskit Textbook<br>\nStarting today, the following courses will redirect to the new learning app:<br>\n- Basics of quantum information, with John Watrous<br>\n- Fundamentals of quantum algorithms, with John Watrous<br>\n- Variational algorithm design<br>\n- Qiskit tutorials<br>\nWe invite you to explore IBM Quantum Learning to read these courses and explore the new Quantum-Safe Cryptographycourse. Over the next few months, we’re planning more free courses to help you learn foundations of quantum information, and experiment with Qiskit Runtime and IBM Quantum.<br>\nWe will sunset the textbook and the syllabus creation tool on November 29, 2023. Legacy textbook pages will remain available through a public archive on Github. Once archived, this content will not be maintained by IBMers, and new external contributions will not be accepted. We understand that the textbook is a much-beloved resource, and you’ll still be able to stand up the textbook locally with the instructions in the README.<br>\nWhy we’re making this change<br>\nMoving docs and learning resources will bring things closer to the same platform that developers, researchers, and students use every day for running actual workloads on quantum systems. Now, they’ll be able to find all of their resources in one, easy-to-navigate place.<br>\nIBM Quantum Platform will now be the home for all education, from the basics of quantum computing and programming with Qiskit to experimenting and prototyping with Qiskit Runtime on IBM Quantum systems. We’ll continue to develop this content in the open to promote trust and transparency within the quantum community, but moving it to the IBM Quantum Platform will help to ensure the quality of this content continues to be high as possible.<br>\nWe’re excited about this change, and hope that the result will be a seamless quantum computing experience for everyone. We look forward to building together.<\/p>","content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-06-28 19:12:56","word_count":789,"read_time_minutes":4,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"140w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":"<p>A guide to the Qiskit circuit library<br>\nBy Robert Davis, Julien Gacon, Abby Mitchell, and Luciano Bello<br>\nWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the process) by simply using circuits that already exist. That’s just one reason why we created the Qiskit circuit library.<br>\nThe Qiskit circuit library is a collection of valuable, well-studied circuits and gates that Qiskit users can easily plug into their quantum circuits. These include useful tools for a wide array of quantum computing applications—including quantum machine learning, quantum chemistry, circuits for benchmarking, and even a number of circuits that are hard to simulate classically. Whether you’re a complete beginner or a bona fide Qiskit wizard, we’re sure you’ll find something useful in our extensive circuit library module.<br>\nWhy every Qiskit user should give the circuit library a closer look<br>\nBefore we launched the circuit library a few years ago, users could only run quantum circuits they had constructed manually. If a user wanted to implement a phase estimation, a Fourier transform, or a variational circuit—really anything at all—they either had to build it themselves, or build a function that generated the circuit for them. In either case, the process was cumbersome, and documentation was limited and disorganized.<br>\nAs the Qiskit community began to grow, we developed a clearer sense of which circuits were most important to users. Eventually, we began to organize these into the circuit library we have today. This library is designed to be a repository of building blocks—a collection of any and all circuits we think are valuable to users. Here, we define “valuable” circuits as those that are either (1) widely used for common quantum computing tasks, (2) difficult to simulate classically, or (3) useful for quantum hardware benchmarking.<br>\nFor example, the quantum Fourier transform (QFT) is an essential building block in a number of quantum algorithms including quantum phase estimation and the famous Shor’s algorithm. Now, if they really want to, a user can certainly run a QFT on quantum hardware by building the circuit manually. That might look something like this:<br>\nimport numpy as np<br>\nfrom qiskit import QuantumCircuit<br>\ndef build_qft(n):<br>\n   circuit = QuantumCircuit(n)<br>\n   for j in reversed(range(n)):<br>\n       circuit.h(j)<br>\n       for k in reversed(range(j)):<br>\n           circuit.cp(np.pi * 2. ** (k - j), j, k)<br>\n   for j in range(n // 2):<br>\n       circuit.swap(j, n - j - 1)<br>\n   return circuit<br>\nqft = build_qft(5)But users who want to save time on this common quantum computing task can simply import the QFT from the circuit library and use it in their subroutines like so:<br>\nfrom qiskit.circuit.library import QFT<br>\nqft = QFT(5)Most Qiskit users are aware the circuit library exists, but not everyone realizes just how useful it can be. That’s why we suggest all users spend time familiarizing themselves with it. The circuit library provides essential tools for building quantum algorithms, and gives users the ability to write programs at a higher level of abstraction. Gates and other elements found in the circuit library are developed so that users can easily plug them into their own quantum circuits using the QuantumCircuit.append() method, meaning users shouldn’t need to concern themselves with the lower level details of how those elements actually work.<br>\nThe circuit library also provides tools that help users investigate properties of the quantum system itself, such as measuring quantum volume, and it offers useful information about the gates and circuits we use most often. It really is a library in the truest sense—in many cases; documentation for gates and other objects include links to a paper detailing the theory upon which they’re based.<br>\nNow, let’s take a look at some of the different kinds of circuits and gates that users will find in the Qiskit Circuit Library.<br>\nVariational quantum circuits (“N-local circuits”)<br>\nThe N-local circuits sub-module of the circuit library contains a selection of subclasses that serve as parameterized models in variational algorithms, such as the variational quantum eigensolver (VQE) algorithm and the quantum approximate optimization algorithm (QAOA).<br>\nIn fields like chemistry and physics, these algorithms serve to approximate wave functions efficiently, which is a task that is generally hard for classical computers. Variational algorithms are also useful for problems in classical optimization and machine learning, where a quantum computer might enable a better optimization of the objective.<br>\nLet’s take a look at an example of how to define a problem instance for a VQE algorithm, using the EfficientSU2 ansatz circuit taken from the circuit library. In this example, we’ll derive our Hamiltonian from a quantum chemistry problem:<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nhamiltonian = SparsePauliOp.from_list(<br>\n    [(\"YZ\", 0.3980), (\"ZI\", -0.3980), (\"ZZ\", -0.0113), (\"XX\", 0.1810)]<br>\n)As mentioned above, our choice of ansatz is the EfficientSU2 circuit. By default, the EfficientSU2 circuit linearly entangles qubits. This makes it ideal for use in quantum hardware with limited connectivity:<br>\nfrom qiskit.circuit.library import EfficientSU2<br>\nansatz = EfficientSU2(hamiltonian.num_qubits)<br>\nansatz.draw(\"mpl\")Here’s what the circuit looks like:<br>\nTry printing with the following code to see how the circuit is structured!<br>\nBased on the previous figure, we know that our ansatz circuit is defined by a vector of parameters, θi, with the total number given by:<br>\nnum_params = ansatz.num_parameters<br>\nprint(num_params)And in this case we get the output:<br>\n16For an example on how to use the circuit library to run a VQE, see: https://qiskit.org/ecosystem/algorithms/tutorials/01_algorithms_introduction.html<br>\nData encoding circuits<br>\nData encoding circuits enable the preparation of input data for QML applications. There are several techniques to encode classical data, or features, into a quantum state, for example:<br>\n- Amplitude encoding: Encode the features into the amplitude of a basis state. This allows to store 2^nnumbers in a single state, but can be costly to implement<br>\n- Basis encoding: Encode an integer kby preparing the corresponding basis state|k><br>\n- Angle encoding: Encode features as rotation angles in a variational quantum circuit<br>\nDeciding which of these approaches is best really depends upon the specifics of your application. On current quantum computers, however, we often use angle encoding.<br>\nOne example is the ZZFeatureMap found in the circuit library:<br>\nfrom qiskit.circuit.library import ZZFeatureMap<br>\nfeature = [0.2, 0.4, 0.8]<br>\nfeature_map = ZZFeatureMap(feature_dimension=len(feature))<br>\nencoded = feature_map.assign_parameters(feature)<br>\nencoded.draw('mpl')which prints<br>\nTry printing with the following code to see how the circuit is structured!<br>\nencoded.decompose().draw('mpl')For an example of how to use data encoding circuits for classication, see: https://qiskit.org/ecosystem/machine-learning/tutorials/02_neural_network_classifier_and_regressor.html.<br>\nTime evolution circuits<br>\nTime evolution circuits allow us to evolve a quantum state in time. Physics researchers make use of them for a wide-array of applications, including investigations of thermalization properties or potential phase transitions of a system. Time evolution circuits are also a fundamental building block of chemistry wave functions—e.g., for unitary coupled-cluster trial states—and of the QAOA algorithm we use for optimization problems.<br>\nfrom qiskit.circuit.library import PauliEvolutionGate<br>\nfrom qiskit.circuit import QuantumCircuit<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nhamiltonian = SparsePauliOp([\"ZZI\", \"IZZ\"])<br>\n# prepare an initial state with a Hamadard on the middle qubit<br>\nstate = QuantumCircuit(3)<br>\nstate.h(1)<br>\nevolution = PauliEvolutionGate(hamiltonian, time=1)<br>\n# evolve state by appending the evolution gate<br>\nstate.append(evolution)<br>\nstate.draw('mpl')And in this case we get the output:<br>\nBenchmarking and complexity theory circuits<br>\nBenchmarking and complexity theory circuits are a vital tool for anyone working with quantum computers. They give us a sense of how well our hardware is actually working, and the true level of computational complexity involved in the problems we want to solve.<br>\nOne of the most important examples of this is the QuantumVolume circuit, which allows us to quantify the largest random circuit of equal width and depth that a near-term quantum computer of relatively modest size can successfully implement. This single metric can help us understand how well the quantum computer is doing in terms of fidelity of operations, qubit connectivity, gate set calibration, and circuit rewiring tool chains.<br>\nA quantum volume model circuit comprises layers of Haar random elements of SU(4) applied between corresponding pairs of qubits in a random bipartition. Here’s an example of a quantum volume circuit built in Qiskit that runs on four qubits:<br>\nfrom qiskit.circuit.library import QuantumVolume<br>\nqv = QuantumVolume(4)<br>\nqv.decompose().decompose().draw('mpl')Some quantum circuits have been shown to deliver advantage over classical algorithms. Many readers will already be familiar with some of the more famous examples of these circuits, which include Shor’s algorithm for prime factorizationand the Grover search algorithm.<br>\nThe circuit library contains circuits that are conjectured to be hard to simulate classically, such as the IQP circuit. (Learn more about the IQP circuit here.)<br>\nIt also contains building blocks for algorithms that are believed to provide quantum advantage. Some of these are of a more practical nature. For example, Qiskit users can build the circuit for Grover’s algorithm by using GroverOperator.<br>\nOthers are of more theoretical interest. For example, Fourier checking uses the FourierChecking method. (Click here to learn more about Fourier checking.)<br>\nLet’s take a look at an example of the IQP circuit:<br>\nfrom qiskit.circuit.library import IQP<br>\ninteractions = [[6, 5, 3], [5, 4, 5], [3, 5, 1]]<br>\ncircuit = IQP(interactions)<br>\ncircuit.decompose().draw(\"mpl\")Arithmetic circuits<br>\nSome users may be surprised to learn that the circuit library includes numerous quantum circuits that are designed to perform classical arithmetic operations on qubit states or state amplitudes, such as addition or multiplication. These are useful for applications like amplitude estimation, which have the potential to be valuable in finance applications, and in algorithms like HHL, which is a proposed method for solving linear systems of equations.<br>\nAs an example, let’s try adding two 3-bit-long numbers, using a ripple-carry circuit to perform in-place addition (CDKMRippleCarryAdder). This adder take two numbers—A and B—then it adds them, and “sets” B with the result. In this example, A=2 and B=3:<br>\nfrom qiskit.circuit.library import CDKMRippleCarryAdder<br>\nadder = CDKMRippleCarryAdder(3)  # Create an adder of 3-bit-long numbers<br>\nfrom qiskit import QuantumCircuit, QuantumRegister, ClassicalRegister<br>\n# Create the number A=2<br>\nreg_a = QuantumRegister(3, 'a')<br>\nnumber_a = QuantumCircuit(reg_a)<br>\nnumber_a.initialize('010') # number 2 - equivalent to format(2, '03b')<br>\n# Create the number B=3<br>\nreg_b = QuantumRegister(3, 'b')<br>\nnumber_b = QuantumCircuit(reg_b)<br>\nnumber_b.initialize('011')  # number 3 - equivalent to format(3, '03b')<br>\n# Create a circuit to hold everything, including a classical register to put the result<br>\nreg_result = ClassicalRegister(3)<br>\ncircuit = QuantumCircuit(*adder.qregs, reg_result)<br>\n# Compose setting A and B with the adder. Measure the result in B<br>\ncircuit = circuit.compose(number_a, qubits=reg_a).compose(number_b, qubits=reg_b).compose(adder)<br>\ncircuit.measure(reg_b, reg_result)<br>\ncircuit.draw('mpl')By calling the sampler in qiskit.primitives.Sampler, it is possible to simulate the execution of this circuit and observe that the result is 5.<br>\nfrom qiskit.primitives import Sampler<br>\nresult = Sampler().run(circuit).result()<br>\nprint(result.quasi_dists[0].keys())dict_keys([5])Standard gates<br>\nThe Standard Gates section of the Qiskit Circuit Library is a foundational toolbox for building up a wide array of quantum circuits—from the humble X Gate all the way to more complex multi-controlled rotation gates.<br>\nUsers can add standard gates to their circuits by calling the gates as methods—e.g., circuit.x(3) will append an X Gate to the qubit 3. That's the most common way to use them. With that being said, this is still an incredibly useful section of the circuit library, and of our documentation in general, as it provides some very useful information about the matrices underlying these gates.<br>\nLet’s take a look at an example of how to append a multi-controlled CNOT to an existing quantum circuit, using the circuit library as a reference. In the following example we are constructing a multi-controlled X Gate (MCXGate) with 4 control qubits from the circuit library and applying it to a quantum circuit, specifying the control qubits are at indices 0,1,2 and 4:<br>\nfrom qiskit import QuantumCircuit<br>\nfrom qiskit.circuit.library import MCXGate<br>\n# create circuit<br>\ncircuit = QuantumCircuit(5)<br>\n# initialise MCX gate with 4 control qubits<br>\ngate = MCXGate(4)<br>\n# append gate to circuit, specifying qubit indices<br>\ncircuit.append(gate, [0, 1, 4, 2, 3])<br>\ncircuit.draw('mpl')The resulting quantum circuit looks like this:<br>\nAnd here’s an example of how we would transpile that to a quantum backend:<br>\nfrom qiskit import transpile<br>\nfrom qiskit.providers.fake_provider import FakeTokyo<br>\nbackend = FakeTokyo()<br>\ntranspiled = transpile(circuit, backend)<br>\ntranspiled.draw('mpl', idle_wires=False)Other interesting circuits<br>\nThis article only scratches the surface in terms of describing the many, many different types of circuits that are available in the Qiskit Circuit Library. Some other notable examples include the quantum Fourier transform (QFT), which is an essential subroutine in many algorithms, PhaseOracle, which implements the oracles used in grover search, and multi-control multi-target gate (MCMT), which makes it possible to (for example) implement an X gate acting on two qubits and controlled by three others.<br>\nBe sure to head over to the Qiskit Circuit Library to learn more about how to put these resources to use in your research.<\/p>","content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-06-28 19:12:57","word_count":2123,"read_time_minutes":11,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"142w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"d6ddb4244d4ab88a","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9875","title":"50 Years of Aumann’s Agreement Theorem","url":"https://scottaaronson.blog/?p=9875","summary":"One of the most popular posts in this blog&#8217;s history was Common Knowledge and Aumann&#8217;s Agreement Theorem, based on a lecture that I gave to high-school students 11 years ago. One of the impacts of that post, I&#8217;m proud to say, is that (according to Steven Pinker) it helped to inspire Steve&#8217;s excellent recent popular book, which you should read, entitled What Everyone Knows That Everyone Knows&#8230;: Common Knowledge and the Mysteries of Money, Power, and Everyday Life. Tw","content":"<p>50 Years of Aumann’s Agreement Theorem<br>\nOne of the most popular posts in this blog’s history was Common Knowledge and Aumann’s Agreement Theorem, based on a lecture that I gave to high-school students 11 years ago. One of the impacts of that post, I’m proud to say, is that (according to Steven Pinker) it helped to inspire Steve’s excellent recent popular book, which you should read, entitled What Everyone Knows That Everyone Knows…: Common Knowledge and the Mysteries of Money, Power, and Everyday Life.<br>\nTwo weeks ago, I was privileged to attend a workshop in Paris on “50 Years of Agreeing to Disagree,” where (among other things) I got to meet the 96-year-old Economics Nobel Laureate Robert Aumann for the first time.<br>\nI got to catch up there with Steven Pinker as well, who gave a phenomenal talk on the psychology of common knowledge. My own talk was entitled The Complexity of Agreement, with New Directions and Applications (link goes to my PowerPoint slides).<br>\nAran Nayebi has graciously posted on YouTube some partial video from the meeting, including his talk, brief snippets from my talk, and Aumann’s own remarks:<br>\nMeanwhile, here were the Aumannian insights that I remembered to write down:<br>\nAUDIENCE QUESTION: What questions did people ask you after you published your famous agreement theorem in 1976?<br>\nAUMANN: I don’t remember what happened yesterday, let alone 1976.<br>\nAlso:<br>\nME: I thought you might enjoy knowing that I just came here from a meeting of rationalists…<br>\nAUMANN: A meeting of who?<br>\nME: Rationalists, they call themselves, at a beautiful venue called Lighthaven in Berkeley, and that they named the main building there “Aumann Hall” in your honor.<br>\nAUMANN: OK, so I’ve made it then.<br>\nOne reccent result announced at the workshop, for those who care, is that the proof of Aumann’s Theorem has now been formalized in Lean, by Scott Kominers at Harvard and a group from the startup company Axiom Math.<br>\nThanks so much to Christina Katt-Pawlowitsch, Ziv Hellman, and others for organizing the workshop and for including me in it.<br>\nHappy to field questions in the comments, although if someone wants to call me an idiot like usual, we’ll just need to agree to disagree!<\/p>","content_hash":"60b5ed7db43f584102bc7ee4c600ad0b","author":"Scott","published_at":"2026-06-28T14:56:56","fetched_at":"2026-06-28 19:12:47","word_count":367,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"4h","domain":"scottaaronson.blog"},{"id":"003198210e05d822","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9861","title":"My response to the White House executive order on QC","url":"https://scottaaronson.blog/?p=9861","summary":"I’ve been getting emails from journalists asking me to comment on the new White House executive order on quantum computing. Alas, I don’t have time for a long response or interviews since I’m at a beautiful science camp in the California mountains, and heading soon to STOC’2026 in Salt Lake City. But I gave anyone who asked me the following statement, which I thought might be of interest to readers of this blog as well. “I hope that at least some of the new funds made available from this Executi","content":"<p>My response to the White House executive order on QC<br>\nI’ve been getting emails from journalists asking me to comment on the new White House executive order on quantum computing. Alas, I don’t have time for a long response or interviews since I’m at a beautiful science camp in the California mountains, and heading soon to STOC’2026 in Salt Lake City. But I gave anyone who asked me the following statement, which I thought might be of interest to readers of this blog as well.<br>\n“I hope that at least some of the new funds made available from this Executive Order will go to basic, curiosity-driven academic research — the kind that led to the idea of quantum computing in the first place, and to the main quantum algorithms and other advances that everything builds on today — and not only to large organizations that have gotten good at capturing federal funds by repeating the requisite buzzwords.”<\/p>","content_hash":"0c9222bbc091a78996b6dc74584d5d7c","author":"Scott","published_at":"2026-06-23T14:13:49","fetched_at":"2026-06-28 19:12:48","word_count":157,"read_time_minutes":1,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5d","domain":"scottaaronson.blog"},{"id":"201d83c02a168630","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9851","title":"Bipartite matching is in NC!","url":"https://scottaaronson.blog/?p=9851","summary":"Since I&#8217;m a good mood today&#8212;at a beautiful science camp with my kids, high in the mountains near Big Bear Lake in California&#8212;I thought I&#8217;d blog about something positive. Last week, five authors (Chatterjee, Ghosh, Gurjar, Raj, and Thierauf) posted a major paper to the Electronic Colloquium on Computational Complexity, which shows (or anyway, credibly claims to show) that the Bipartite Matching problem is in the complexity class NC. Assuming this stands, it resolves a cent","content":"<p>Bipartite matching is in NC!<br>\nSince I’m a good mood today—at a beautiful science camp with my kids, high in the mountains near Big Bear Lake in California—I thought I’d blog about something positive. Last week, five authors (Chatterjee, Ghosh, Gurjar, Raj, and Thierauf) posted a major paper to the Electronic Colloquium on Computational Complexity, which shows (or anyway, credibly claims to show) that the Bipartite Matching problem is in the complexity class NC. Assuming this stands, it resolves a central problem in parallel algorithms and derandomization that’s been open since the 1980s.<br>\nIn Bipartite Matching, you’re given a list of n men and n women, you’re told who’s willing to date whom, and your goal is to<br>\n- decide whether it’s possible to pair everyone off with a willing partner, and<br>\n- if they are, actually pair them off.<br>\nOne of the great early discoveries of combinatorial algorithms, taught in every introductory algorithms course, is that this problem is solvable in time polynomial in n, even though the naïve, brute-force approach would require examining n! possibilities.<br>\n(Note that in the bipartite version, we assume that the men and women are all straight. If the men and women can be LGBT, we get the problem of matching in general graphs, which again turns out to be solvable in polynomial time, but now the algorithm is much more sophisticated, and was a major discovery of Edmonds in the 1960s.)<br>\nAnyway, the question is whether we can do even better than polynomial time: in particular, can we solve the problem in time polynomial in log(n), given polynomially many parallel processors?<br>\nBack in the 1980s, first Karp, Upfal, and Wigderson, and then (via a very different method) Mulmuley, my former PhD adviser Umesh Vazirani, and Umesh’s brother Vijay Vazirani managed to show that the answer is yes, but only if the parallel processors additionally get access to random bits, and only need to succeed with high probability.<br>\nThe new achievement is to derandomize the Mulmuley-Vazirani-Vazirani algorithm, and show that problems 1 and 2 above are both solvable in deterministic polylogarithmic time with parallel processing (in other words, in the complexity class NC).<br>\nNo, I don’t understand how it works yet. If anyone does, feel free to explain in the comments! Or ask your favorite AI to generate a summary. If I run out of options, at some point I might actually try reading the paper.<br>\n(Note: Thanks to Gil Kalai for some corrections to an earlier version of this post.)<br>\nOne other announcement: Today is the day of primary elections in NYC! Virtually all of my smartest friends who work on AI governance and safety are extremely excited about the Congressional campaign of Alex Bores—indeed, it would be little exaggeration to say that they consider him the last best hope of humankind. Bores has been a national leader on trying to regulate AI, to the extent that Marc Andreessen’s “Leading the Future” anti-AI-regulation PAC has spent millions of dollars trying to sink his candidacy. Outside of AI, Bores seems like a sane, conventional Democrat, i.e. the kind I like, and much more moderate than his base on Israel (note that his main opponent is also such). Without commenting on Bores’ views on every possible issue, I’ll simply say: if you live in New York’s 12th Congressional District (comprising a huge chunk of central Manhattan), and you care about AI safety, please consider a vote for Bores while there’s still time.<\/p>","content_hash":"b617814d4003c23268513795d67e49a0","author":"Scott","published_at":"2026-06-22T17:27:42","fetched_at":"2026-06-28 19:12:48","word_count":577,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"6d","domain":"scottaaronson.blog"},{"id":"7a9e22b6719f5004","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9833","title":"Never trust a T-Rex","url":"https://scottaaronson.blog/?p=9833","summary":"In 2024, at the same time as I was being called a genocide apologist, Zionist baby killer, etc. etc., I was also being hounded by my right-wing, pro-Israel readers, who demanded of me: knowing what you know, understanding what you understand, how could you possibly vote for Kamala Harris? How could you donate to Kamala&#8217;s campaign, urge your readers to vote for her, when she (like most Democrats) is obviously beholden to young left-wing activists, and young left-wing activists&#8217; centra","content":"<p>Never trust a T-Rex<br>\nIn 2024, at the same time as I was being called a genocide apologist, Zionist baby killer, etc. etc., I was also being hounded by my right-wing, pro-Israel readers, who demanded of me: knowing what you know, understanding what you understand, how could you possibly vote for Kamala Harris? How could you donate to Kamala’s campaign, urge your readers to vote for her, when she (like most Democrats) is obviously beholden to young left-wing activists, and young left-wing activists’ central unifying cause has become the death of “Zionists” like yourself and your children? Can’t you see that, even if Trump is a raging, lying, bullying, incoherent monster, at least he’s our monster?<br>\nThis view, I confess, gave me more pause than “just accept that the liberation of the world’s oppressed requires Israel’s annihilation and hence the death of much of your family,” which my far-left critics considered their most persuasive argument. And yet I also rejected, with extreme prejudice, the right-wingers’ constant invitations to join their MAGA brigade. I replied: I’ll simply continue being a moderate Enlightenment liberal, transported here in a block of ice from the 1990s, even if I’m the last such on earth, even if I’m condemned by everyone on either side for it.<br>\nWhy? Because, I said at the time, while I’m honest enough to admit when a rampaging T-Rex happens to do something that aligns with my interests—when, e.g., it chases away some velociraptors ready to slice me open, or cracks down on antisemitic fanatics trying to dominate the universities where I spend my life—still, I’ll never delude myself into imagining the T-Rex my ally. I understand that it would just as soon devour me. If the monster goes after my enemies not because of liberal principles or recognizable moral emotions, but just raw self-interest and ego gratification, then what happens the instant its perceived self-interest changes?<br>\nIt gives me no pleasure that this week Trump proved my instincts here 3,000% correct, by fully capitulating to the Islamic Republic of Iran, far more so than Barack Obama ever did, or than President Kamala Harris ever would have. Trump has now abandoned both the Iranian and the Israeli peoples to suffer and die at the hands of the IRGC, as he abandoned the Ukrainians and the Venezuelans before them, as Neville Chamberlain abandoned Czechoslovakia. All because of the price of gas and the midterm elections.<br>\nOn the most charitable reading, Trump gambled that taking out Ayatollah Khamenei would lead to a cowed and compliant puppet regime, as basically happened in Venezuela, with no need for a ground invasion or arming the Iranian resistance. His gamble predictably failed, because (alas) the Iranian government actually believes in something—horrifying and medieval though it is. Trump was unable to process that fact, because he’s never believed in anything beyond himself, and he wrongly assumes that everyone else is the same.<br>\nWith the $300 billion and control over the Strait of Hormuz, I expect that Iran will rebuild its military and proxies to stronger than they were before Trump’s idiotically mismanaged war. I expect that Iran will then launch attacks against Israel that make October 7 look like the Little League—and that, when it does so, a large fraction of the Western world will ecstatically cheer, as it did on October 7 itself. Netanyahu is a fool for expecting otherwise from Trump, a man who’s betrayed everyone who’s ever trusted him outside possibly his immediate family.<br>\nI salute those Israelis who will choose to stay and fight even after their abandonment and betrayal, in the spirit of the Bar-Kochba revolt and other desperate battles of Jewish history. Despite the existential danger that Israel will soon be in, facing a victorious and emboldened Iran essentially alone, I also see it as possible that Western countries will rapidly become even more dangerous for Jews than Israel. If that happens, I’ll be grateful that Israel still exists, that it considers itself unbound by America’s surrender, and that I’ll be able to seek refuge there, as was the idea when Israel was founded.<br>\nAt the same time, I wouldn’t begrudge any Israelis who moved to the US, or Switzerland, or whatever other country will take them. As in the 1930s and at countless other points in Jewish history, the priority now is physical survival, wherever that turns out to be possible.<br>\nWith hindsight, I spent the first half of my life in a strange interregnum, wherein Jewish history seemed to have finally ended. Now, fueled by fading memory of the Holocaust and by the greatest lie-amplification technologies the world has ever seen, the history I learned as a child has come roaring back. Jews, as they have for millennia, look out on a world of murderous enemies and fickle friends. It’s just the restoration of a norm.<br>\nIncredibly, abandoning both the Iranian and Israeli peoples to the Revolutionary Guard might not have been the most shortsighted or catastrophic thing Trump did in the last couple weeks. Another candidate would have to be Trump’s attempt to destroy Anthropic (and as collateral damage, American AI development more generally), transparently to punish Anthropic for the crime of having any principles that it was willing to put ahead of obedience to Trump and Pete Hegseth. Specifically, the White House forced Anthropic to pull Fable, its new flagship model (and the “safe” version of Mythos), off the market just a few days after customers had started using it, by subjecting it to export controls that it knew were impossible to enforce. Even the many foreign nationals who work at Anthropic are no longer allowed to use their own model (!). A plausible consequence is that those foreign nationals will stop working at American AI companies altogether, and will move to China or whichever other country rolls out the red carpet for them.<br>\nFor AI accelerationists, you’d think that this would be a worst-case scenario: a direct government crackdown on AI that goes beyond anything the AI safetyists had proposed, and that indeed would’ve sounded like fantasy even a year ago. And yet many of the accelerationists are gleeful. Why? Because Anthropic, in supporting reasonable AI regulations, had made itself the accelerationists’ enemy. So, the accelerationists’ attitude now is quintessentially Trumpian: “Haha, Anthropic, you say you like regulation? Then take that!” Never mind that whatever dangerous behavior can be elicited from Fable, can almost certainly be elicited as well from GPT 5.5 Pro, and yet there’s no talk of any similar crackdown against OpenAI. Sam Altman, after all, donated $1 million to Trump’s inaugural fund. No one finds it remarkable anymore, in Trump’s destroyed and recreated United States, that your rights depend entirely on your standing with the Don.<br>\nAnd so, just like the question of whether Trump would side with the isolationists or with the hawks who wanted to liberate Iran, was resolved by his worst-of-all-worlds choice to surrender to Iran, so too the question of whether Trump would hit the brakes on the race to dangerous AI, or accelerate in order to beat China, has been resolved by his worst-of-all-worlds choice to lose the race to China. I.e., we’re still in full race mode, but we’re also going to do whatever we can to lose the race—by, for example, letting NVIDIA sell its chips to China, and now, scaring away our top researchers and punishing our AI firms with capricious and arbitrary crackdowns.<br>\nIt’s disconcerting to reflect that, while the prognosis of the world is arguably the worst it’s ever been in my lifetime, my own life is pleasant. Intellectually I know that the Titanic has already hit the iceberg, but the band is still playing and I’m still being served delicious food.<br>\nLast week I visited Paris and the French countryside with my wife and kids. In addition to sightseeing, I spoke at a workshop celebrating 50 years of Aumann’s Agreement Theorem (where I got to meet the 96-year-old Aumann), and gave a quantum computing talk at the Sorbonne. Next week I’m going with my family to a science camp in California, then to STOC in Salt Lake City, where I’ll accept the Trevisan Prize and give an after-dinner speech, then to Epsilon Camp where I’ll again teach theoretical computer science to 11- and 12-year-olds.<br>\nLike I said, life is good here on the Titanic, if you ignore the rapidly rising seawater at your feet.<\/p>","content_hash":"8a63b508dcec1662cee5c6a6a17f47c8","author":"Scott","published_at":"2026-06-20T01:06:51","fetched_at":"2026-06-28 19:12:48","word_count":1401,"read_time_minutes":8,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"a286f094d89cc18d","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9801","title":"On hope","url":"https://scottaaronson.blog/?p=9801","summary":"The comments on my previous post, on recent AI breakthroughs in solving Erdös problems and beyond, must&#8217;ve set some sort of record for the number of separate reasons commenters offered me to despair about the future of humanity. All this in a post that I saw as relatively nerdy and anodyne, goring few oxen, when I clicked &#8220;Publish&#8221;! According to some persistent commenters, the only reason why I wrote about recent AI-enabled math breakthroughs is that I&#8217;m a shameless shill","content":"<p>On hope<br>\nThe comments on my previous post, on recent AI b
