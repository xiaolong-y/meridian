Single-chip deployment (4 l-couplers tested at 99.3% fidelity on r1) | 10 chip-to-chip l-couplers enabling multi-processor entanglement | <br>\n| Production Throughput | >34 billion circuits executed across enterprise and research partners | Transitional stepping stone toward 2029 fault-tolerant IBM Quantum Starling | <br>\nUtility-scale applications in chemistry, materials science, and optimization increasingly require millions to billions of circuit samples. Since deploying in September 2026, Nighthawk r2 processors have executed more than 34 billion circuits for partners including E.ON, Algorithmiq, and Q-CTRL, delivering speedups of up to 19× over previous IBM Heron systems. In materials simulation benchmarks with Algorithmiq, Nighthawk r2’s square-lattice connectivity executed circuits 8× faster than Heron while requiring an estimated 240× more classical memory for competing tensor-network approximations. Alongside these hardware runs, Algorithmiq updated its Tensor-Network Error Mitigation (TEM) function on IBM Cloud GPUs, reporting a 7.5× reduction in QPU time on Nighthawk r2, a 10× speedup in classical post-processing, and a 2× increase in supported circuit depth.<br>\nTo support its modular scaling path toward the fault-tolerant IBM Quantum Starling system targeted for 2029, IBM detailed parallel hardware breakthroughs across chiplet interconnects and cryogenics. The company demonstrated four chip-to-chip l-couplers linking Nighthawk processors with up to 99.3% quantum state transfer fidelity, alongside a dual-module cryogenic system cooled below 15 millikelvin in under five days. On the qLDPC memory side, design refinements to its Loon architecture using denser c-couplers reduced required Josephson junctions per module from roughly 5,000 to 2,000.<br>\nOn the software front, IBM introduced Managed Workflows within the IBM Quantum Functions stack (formerly Qiskit Functions) under a unified Resource Units (RUs) billing model, providing persistent storage, GPU-accelerated classical compute, and parallel orchestration for multi-billion-sample hybrid jobs. This consumption model allows Premium and Flex Plan enterprises to spend existing IBM Resource Units directly on third-party ecosystem functions and cloud HPC capacity without separate vendor procurement cycles, supporting IBM’s target of demonstrating initial industry impact by 2028. Using automated sample-based quantum diagonalization (SQD) pipelines, IBM and RIKEN accelerated large-scale electronic structure calculations 5× while running 100× more computations than their foundational 77-qubit study, while Cleveland Clinic and RIKEN automatically processed 608 million samples for 12,000-atom biomolecular complexes 33× faster than unautomated workflows. Enterprise users, including E.ON Chief Quantum Scientist Corey O’Meara, highlighted the updated 1,040-qubit modular roadmap as a pragmatic three-year benchmark for hybrid workflows ahead of the 2029 Starling system.<br>\nFor low-level control and developer enablement, IBM unveiled the directed execution model (powered by Samplomatic, Executor, and client-side primitives), modular qiskit-mitigation and qiskit-noise-learning libraries, and pulse-level dynamic circuit tools capable of executing 1,000,000-round repetition codes end to end alongside Qiskit Paulice spacetime codes. The release also includes the Rust-based Quantum Resource Management Interface (QRMI) for HPC schedulers, Qiskit Fermions and alpha Qiskit Bosons utility mappers, the ffsim fermionic simulator, circuit usage profilers, and open-source Qiskit Agent Skills for AI coding assistants. To accelerate classical post-processing bottlenecks in SQD workflows, IBM also released a GPU-accelerated, MPI-compatible version of its matrix-free sparse linear algebra solver, qiskit-fulqrum (v1.0.0rc1), capable of diagonalizing a 150-billion-determinant subspace for a 54-electron [4Fe-4S] cluster across 16 GPU nodes.<br>\nOfficial release details are available via the IBM Newsroom here, the main QDC 2026 overview blog here, and the QDC 2026 developer guide here. Open-source benchmarking suites on GitHub cover IBM’s device metrics (MCPS, CLOPS, EPLG) here and the utility-scale mirror test here. Supporting scientific preprints on arXiv detail the 12,635-atom Cleveland Clinic and RIKEN protein-ligand study here, the full-scale Fugaku closed-loop SQD study here, IBM and RIKEN’s foundational SQD chemistry paper here, Algorithmiq’s Tensor-Network Error Mitigation (TEM) documentation on IBM Quantum is accessible here, and the qiskit-fulqrum subspace diagonalization framework is accessible on GitHub here, PyPI here, and arXiv here.<br>\nRelated QCR coverage includes the Nighthawk r2 launch here, Qiskit Paulice spacetime error detection here, IBM’s 99.3% fidelity l-couplers here, modular cryogenic cells for Starling here, trusted quantum advantage benchmarks here, the co-located ORNL and AMD quantum error-correction platform here, the Quantum System Two deployment at Hyde Park Labs here, and the 70-qubit generative quantum eigensolver study with Mitsubishi Chemical and Keio University here.<\/p>","content_hash":"72eef4f430624f77115dcd0f02d48c88","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T05:36:31","fetched_at":"2026-11-13 13:50:19","word_count":858,"read_time_minutes":5,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"113185c57594a547","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48666","title":"Q-CTRL Deploys Fire Opal Dynamics Simulator on IBM Quantum Functions, Achieving 12× Speedup on Nighthawk","url":"https://quantumcomputingreport.com/q-ctrl-deploys-fire-opal-dynamics-simulator-on-ibm-quantum-functions-achieving-12x-speedup-on-nighthawk/","summary":"Q-CTRL has deployed its Fire Opal Dynamics Simulator on IBM Quantum Functions, achieving a 12x speedup on Nighthawk r2 processors compared to Heron r3 systems for large-scale fermionic many-body physics simulations. This allows researchers to execute complex simulations with a single API call, significantly accelerating computational chemistry and materials modeling. The Dynamics Simulator, available in the IBM Quantum Functions Catalog, employs advanced techniques like deterministic crosstalk s","content":"<p>Quantum infrastructure software provider Q-CTRL has released its Dynamics Simulator function inside the IBM Quantum Functions Catalog, enabling researchers to execute large-scale fermionic many-body physics simulations on IBM superconducting processors via a single automated API call. Following its initial rollout in Fire Opal and recent benchmarks on IBM’s Nighthawk r2 (ibm_phoenix) architecture, the pipeline demonstrated a 12× execution speedup over IBM Heron r3 systems with less than 1% fidelity deviation.<br>\n| Q-CTRL Fire Opal Dynamics Simulator Hardware Benchmarks |  |  | <br>\n|---|---|---|<br>\n| Benchmark Metric | IBM Heron r3 (ibm_boston) | IBM Nighthawk r2 (ibm_phoenix) | <br>\n| Workload Scale | Up to 60 sites (120 qubits, 30 Trotter steps, 9,057 2Q gates) & 31 sites (62 qubits, 90 Trotter steps, 13,829 2Q gates) | 30-site Fermi-Hubbard chain (60 qubits, 30 Trotter steps, 4,497 2Q gates, 2Q depth 152) | <br>\n| QPU Pipeline Runtime | 4 minutes 25 seconds (30-site reference, including noise characterization) | 23 seconds (12× faster QPU execution) | <br>\n| Classical Comparison | Up to 3,000× faster than ITensor CPU baseline (36× vs. symmetry-exploiting H200 GPU tensor networks) | >400× faster lower-bound runtime vs. GPU-accelerated classical solvers | <br>\n| Simulation Accuracy | Within ~1% RMSE of converged tensor-network references | <1% deviation (7.895 × 10−3 RMSE) vs. Heron r3 baseline | <br>\nComputational chemistry and materials modeling consume roughly one-third of global supercomputer capacity, yet simulating time-evolving, strongly correlated electrons remains constrained by exponential entanglement growth in classical tensor networks. While IBM’s Nighthawk square-lattice topology increases average qubit connectivity by 60% over heavy-hex Heron chips—reducing SWAP routing overhead—denser nearest-neighbor coupling amplifies residual quantum crosstalk. Earlier validation on Nighthawk r1 (ibm_miami) showed that staggered dynamical decoupling extends median effective coherence times sixfold, from 27 μs to 160 μs.<br>\nThe Dynamics Simulator abstracts Hamiltonian mapping, Trotter-Suzuki synthesis, qubit routing, and deterministic crosstalk suppression behind a high-level Python interface (q-ctrl/dynamics-simulator). By preventing coherent errors during execution without extra measurement shots, Q-CTRL previously simulated 1D Fermi-Hubbard dynamics up to 120 qubits on IBM Heron hardware across 90 Trotter steps. While follow-up classical research utilizing symmetry-exploiting tensor contractions on NVIDIA H200 GPUs narrowed Q-CTRL’s initial 3,000× CPU speedup to 36×, transitioning the workflow to Nighthawk r2 restored an order-of-magnitude runtime margin.<br>\nAvailable in Small, Medium, and Large workload tiers for IBM Quantum Premium, Flex, and On-Prem Plan users, the Dynamics Simulator completes Q-CTRL’s three-function lineup in the IBM Quantum Functions Catalog alongside its Performance Management and Optimization Solver functions.<br>\nOfficial release details are available in Q-CTRL’s IBM Quantum Functions announcement here, the Nighthawk r2 benchmark analysis here, the Nighthawk r1 crosstalk suppression study here, and the initial Fire Opal Dynamics Simulator release here. Catalog listings and documentation are accessible for the Dynamics Simulator here (docs here), Performance Management here (docs here), and the Optimization Solver here (docs here). Supporting scientific manuscripts include Q-CTRL’s Fermi-Hubbard hardware study on arXiv here, the GPU tensor-network benchmarking response on arXiv here, and the supercomputer chemistry workload study in Machine Learning: Science and Technology here. Related QCR coverage of Q-CTRL’s initial materials simulation speedup is available here, recent Fire Opal solver and compiler updates here, and IBM’s QDC 2026 Nighthawk roadmap here.<\/p>","content_hash":"cc0a3b8d3c09e5a5cf16fb11ea591b5b","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T04:27:04","fetched_at":"2026-11-13 13:50:19","word_count":529,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"e9780d70bffcc90b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48668","title":"Q-CTRL Expands Fire Opal Suite with Constrained Optimization, Estimator Twirling, and Monte Carlo Solver","url":"https://quantumcomputingreport.com/q-ctrl-expands-fire-opal-suite-with-constrained-optimization-estimator-twirling-and-monte-carlo-solver/","summary":"Q-CTRL has updated its Fire Opal platform with new features including constrained optimization for QAOA, significantly increasing approximation ratios. They've also introduced Monte Carlo integration for quantitative finance, capable of scaling hardware execution up to 17-27 qubits. Additionally, Fire Opal now includes Estimator Pauli Twirling to improve signal-to-noise ratio with zero additional QPU shot overhead. The post Q-CTRL Expands Fire Opal Suite with Constrained Optimization, Estimator ","content":"<p>Q-CTRL has rolled out a series of algorithmic and compiler upgrades to its Fire Opal error-suppression and solver platform, adding native hard-constraint support for the Quantum Approximate Optimization Algorithm (QAOA), zero-overhead Pauli twirling for expectation values, and a dedicated Monte Carlo integration function for quantitative finance.<br>\n| Fire Opal Q3 2026 Feature & Solver Additions |  |  | <br>\n|---|---|---|<br>\n| Capability / Module | Technical Mechanism | Measured Performance Impact | <br>\n| Constrained QAOA ( solve_qaoa) | Enforces hard Hamming-weight-1 constraints directly without objective penalty terms | Increases approximation ratios by up to 500%; validated on 120-qubit rail station routing, 50-qubit graph partitioning, and 156-qubit Max-Cut and HOBO spin-glass benchmarks. | <br>\n| Monte Carlo Integration ( integrate_monte_carlo) | Quantum signal processing (QSP) amplitude estimation paired with adaptive Bayesian inference | Scales hardware execution up to 17–27 qubits (compared to ~5-qubit industry baselines) with quadratic sample complexity scaling. | <br>\n| Estimator Pauli Twirling | Symmetrically transforms circuits across existing shot budgets to average residual noise | Improves estimator signal-to-noise ratio with zero additional QPU shot overhead. | <br>\n| Compiler Control Flag | reduce_approximation=True option in IbmRunOptions | Relaxes gate-elision thresholds for exact execution of sensitive, hand-crafted circuits. | <br>\nIn standard QAOA implementations, problem constraints—such as portfolio allocation limits or logistics routing rules—are enforced via soft penalty terms in the cost Hamiltonian, wasting quantum circuit depth exploring invalid states. By embedding hard Hamming-weight-1 constraints directly into the solver pipeline, Fire Opal restricts evolution to feasible configurations across both its standalone client (fireopal.solve_qaoa) and the IBM Quantum Functions Optimization Solver. Demonstrated workflows include a 120-qubit train-station routing instance (30 trains across four candidate paths) alongside 156-qubit higher-order binary optimization (HOBO) spin-glass problems and 50-qubit weighted graph partitioning.<br>\nAlongside the optimization and estimator updates (fireopal.estimate_expectation), Q-CTRL introduced integrate_monte_carlo—paired with a new quantitative finance module in its Black Opal training platform—to estimate derivative prices and tail-risk metrics without requiring users to manually construct quantum signal processing circuits. Built-in constructors support lognormal, normal, uniform, and Gaussian copula distributions alongside European call pricing, delta, and fixed-income objectives.<br>\nTechnical release notes are available on the Q-CTRL blog for the Fire Opal solver updates here, the Monte Carlo integration release here, and Q-CTRL’s enterprise deployment analysis here, with industry case studies accessible here. Q-CTRL API documentation and tutorials cover solve_qaoa here, the 120-qubit train-station routing guide here, estimate_expectation here, IbmRunOptions here, and the Monte Carlo integration overview here. Catalog listings and documentation for IBM Quantum Functions are available for the Optimization Solver here (docs here, 156-qubit HOBO tutorial here) and Performance Management here (docs here). Related QCR coverage of independent cross-stack error management benchmarks on 156-qubit IBM Heron hardware is available here.<\/p>","content_hash":"5ec3c4858efcebb4ac5c22abb3e47af2","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T04:15:56","fetched_at":"2026-11-13 13:50:19","word_count":449,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"09d0d896a3e45666","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48660","title":"Q-CTRL Demonstrates Push-Button Cold-Start Calibration on QuantWare Superconducting QPUs","url":"https://quantumcomputingreport.com/q-ctrl-demonstrates-push-button-cold-start-calibration-on-quantware-superconducting-qpus/","summary":"Q-CTRL has demonstrated an autonomous, cold-start calibration process for QuantWare superconducting processors using its Boulder Opal control platform. This technology can bring a 21-qubit QuantWare Contralto-D21 device from an uncalibrated state to operational gate fidelities in under three hours, significantly reducing the manual effort and time typically required. This innovation addresses a major bottleneck in scaling superconducting quantum computers by automating the complex tuning and sta","content":"<p>Quantum infrastructure software provider Q-CTRL has released hardware benchmarking data demonstrating fully autonomous, cold-start bring-up and gate calibration on QuantWare D-Line superconducting processors using its Boulder Opal control platform. Validated on a 21-qubit QuantWare Contralto-D21 device, the physics-informed AI state machine tuned five-qubit feedline blocks from an uncalibrated state to operational gate fidelities in under three hours without manual specialist intervention.<br>\nReplaces multi-day manual tuning cycles across resonator mapping and qubit discovery.<br>\nSingle-Qubit Gate Fidelity<br>\n99.95% median (SX gates)<br>\nAutomated Rabi, Ramsey, and readout optimization across stable transmon registers.<br>\nTwo-Qubit Gate Fidelity<br>\n>98% peak / 96% device median (CZ gates)<br>\nFlux spectroscopy and closed-loop pulse optimization across coupled qubit pairs.<br>\nUpcoming Roadmap<br>\nQuantWare A-Line & runtime recalibration<br>\nAdds tunable-coupler support, task parallelization, and continuous drift tracking in late 2026.<br>\nScaling superconducting quantum computers presents a severe operational bottleneck because dozens of interdependent control parameters—ranging from traveling-wave parametric amplifier (TWPA) biases to qubit drive frequencies and flux pulses—must be iteratively tuned and stabilized against environmental drift. Conventional scripted calibration routines frequently fail when hardware frequencies drift outside narrow scan windows, requiring experimental physicists to intervene manually.<br>\nBoulder Opal encodes architecture-specific characterization and calibration routines into an automated state machine capable of detecting out-of-range anomalies, filtering false-positive resonances, and recovering underperforming qubits autonomously. Every calibration pass logs parameter histories, diagnostic plots, and optimized control waveforms into a web-based visualization dashboard for hardware inspection.<br>\nTechnical details and calibration metrics are available on the Q-CTRL blog here. Related QCR coverage of Q-CTRL’s autonomous calibration integration with Anyon Technologies for enterprise data centers is available here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"4d0692fdf46dbf6f8483f6c9079688ab","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T02:20:58","fetched_at":"2026-11-13 13:50:19","word_count":344,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"39a0691f00b17b6d","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48656","title":"Q-CTRL Achieves RTCA DO-160 Airworthiness Qualification for Ironstone Opal Quantum Navigation","url":"https://quantumcomputingreport.com/q-ctrl-achieves-rtca-do-160-airworthiness-qualification-for-ironstone-opal-quantum-navigation/","summary":"Q-CTRL's Ironstone Opal quantum magnetic navigation system has achieved RTCA DO-160 airworthiness qualification, becoming the first quantum navigation payload certified for commercial aerospace and UAV deployment. This system offers a passive alternative to satellite-based positioning, addressing issues of GPS jamming and spoofing by using atomic quantum sensors to measure Earth's magnetic field. It has undergone flight evaluations with partners like Airbus and Lockheed Martin, and its AI-driven","content":"<p>Quantum infrastructure and sensing company Q-CTRL has announced that its Ironstone Opal quantum magnetic navigation system has achieved safety-of-flight qualification under the commercial aviation RTCA DO-160 environmental testing standard. Unveiled ahead of live demonstrations at the Farnborough International Airshow, the milestone marks the first quantum navigation payload certified for commercial aerospace and uncrewed aerial vehicle (UAV) deployment.<br>\nMeets commercial aerospace environmental, electromagnetic, and vibration safety-of-flight criteria.<br>\nNavigation Accuracy<br>\nRNP 0.3 (<0.3 nautical miles over 95% of flight)<br>\nSatisfies international civil aviation accuracy thresholds without satellite signals.<br>\nHardware Variants<br>\nCrewed aviation unit & <1 kg UAV module<br>\nSupports fuselage or wing-mounted integration on commercial airliners and NATO Class II+ drones.<br>\nExport Classification<br>\nITAR-Free<br>\nPermits international commercial and allied defense deployment without U.S. munitions restrictions.<br>\nRising global incidents of GPS jamming and spoofing—disrupting more than 1,500 commercial flights daily—have prompted aviation regulators and defense agencies to seek passive alternatives to satellite-based positioning. Unlike conventional inertial navigation systems that accumulate positional drift over long flights, Ironstone Opal measures subtle variations in Earth’s crustal magnetic field using atomic quantum sensors and matches them to onboard geomagnetic maps.<br>\nTo operate reliably inside magnetically noisy aircraft frames, the platform pairs quantum magnetometers with AI-driven software ruggedization that filters out airframe interference in real time. The passive, non-emitting architecture has undergone flight evaluations with commercial and defense partners, including Airbus and Lockheed Martin, as well as U.S. defense programs.<br>\nDetails on the DO-160 qualification are available from Q-CTRL here, alongside background on Q-CTRL’s flight trials with Airbus here and Lockheed Martin’s quantum PNT overview here. Related QCR coverage of Q-CTRL’s $24.4M DARPA Robust Quantum Sensors (RoQS) award is available here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"7ee0a0f0364e501173fb02ef4e41f612","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T01:51:20","fetched_at":"2026-11-13 13:50:19","word_count":356,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"f98a357a67e50529","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10318","title":"Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!","url":"https://scottaaronson.blog/?p=10318","summary":"Enjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code&#8217;s limitations. She doesn&#8217;t get to the soundness analysis. Feel free to ask questions in the comments. I mig","content":"<p>Enjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code’s limitations. She doesn’t get to the soundness analysis.<br>\nFeel free to ask questions in the comments. I might write some notes here later with my own doofus understanding of Dana’s talk. Experts are of course hard at work on more formal writeups of the proof (which will hopefully be more comprehensible than the AI’s writeup).<br>\nThis entry was posted<br>\non Tuesday, November 10th, 2026 at 2:27 pm and is filed under AI, Announcements, Complexity.<br>\nYou can follow any responses to this entry through the RSS 2.0 feed.<br>\nYou can leave a response, or trackback from your own site.<br>\n65 Responses to “Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"f7a800a85a7d77e79118fdb829a66b1d","author":"Scott","published_at":"2026-11-10T20:27:28","fetched_at":"2026-11-13 13:50:15","word_count":340,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2d","domain":"scottaaronson.blog"},{"id":"3a6f0747d33bd6f2","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10295","title":"Aaronson-Ambainis Conjecture proved!  (By AI, of course)","url":"https://scottaaronson.blog/?p=10295","summary":"The &#8220;For Dummies&#8221; Version (apologies for not including this earlier): Yes, an AI solved a big open problem about quantum computing No, this doesn&#8217;t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter What it does, is to rule out a potential class of quantum speedups that most of us didn&#8217;t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially ","content":"<p>Aaronson-Ambainis Conjecture proved! (By AI, of course)<br>\nThe “For Dummies” Version (apologies for not including this earlier):<br>\n- Yes, an AI solved a big open problem about quantum computing<br>\n- No, this doesn’t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter<br>\n- What it does, is to rule out a potential class of quantum speedups that most of us didn’t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially faster than any classical algorithm)<br>\n- It means my prediction was right, so you should listen to me more in the future!<br>\nWe now, of course, live in age where longstanding open problems in quantum computing theory (and all theoretical computer science, and all math) are dropping like flies, to the extent that there’s no way I could possibly do a post on each and every bombshell. But I can’t exactly avoid the Aaronson-Ambainis Conjecture, given that my name is on it, and that I cared about the answer to this one (back in 2019, I even blogged about an attempted solution that ultimately turned out to be fallacious).<br>\nFor those tuning in from home, the AA Conjecture, which Andris and I posed back in 2009, says that every degree-d polynomial p:{0,1}n→[0,1] in n Boolean variables, with constant variance, has some variable whose influence is at least 1/poly(d). The reason Andris and I cared about this conjecture is that, as we proved, it implies that there’s no superpolynomial advantage of quantum query complexity over classical query complexity for decision problems that works on most Boolean inputs. Or, in terms of complexity classes, that there’s no hope of separating P from BQP relative to a random oracle, without proving P≠BQP or something of the kind in the unrelativized world. This would finally answer a question of Fortnow and Rogers from 1998.<br>\nThe connection between quantum algorithms and polynomials came from the famous 1998 paper of Beals et al., which showed that, if Q is a quantum algorithm that makes T queries to an oracle X, then Pr[Q(X) accepts] can be written as a multivariate real polynomial p(X) in the bits of X, of degree at most 2T. The proof of my and Andris’s result is then simply this: take the polynomial p, find in it a variable of influence at least 1/poly(T), and query that variable, and keep repeating until there’s no longer such an influential variable—at which point, by assumption, p is nearly a constant polynomial, which means you’ve learned whether Q accepts with high probability over X. This provides a classical simulation of the quantum algorithm Q—a simulation that makes poly(T) queries to the oracle X and that works for most X’s.<br>\nThe AA Conjecture caught on to an extent Andris and I couldn’t have predicted. Some who worked on it barely even cared about the implication for quantum computing, and just wanted to solve the problem about polynomials! There were, I’m both proud and sorry to report, Fourier analysis experts and grad students who oriented their whole research programs around trying to prove AA, with lots of proofs of special cases, some of them very recent. A proof of full AA was one of the last remaining open problems in quantum query complexity that everyone seemed to agree was centrally important. I was surprised, honestly, to see it missing from OpenAI’s Mathocalypse dump a few weeks ago. Surely they tried it, so was it really so much harder than all the problems that were solved?<br>\nNow a startup called Physical Superintelligence has announced a proof of the AA Conjecture, specifically showing that there’s a variable of influence at least ~1/d6, which they say they obtained using their proprietary research harness on an internal Claude model. (What role the harness played, compared to the internal model, is something I don’t know.) The effort was led by David Turturean and Jim Halverson at PSI. They actually let me know about this several weeks ago, but I had to keep it secret until the announcement late last week.<br>\nI haven’t yet understood the proof, although I hope to. In the meantime, though, I believe the proof is correct for two reasons. Firstly, there’s a Lean certificate, and secondly, human experts (I’m no longer an expert on my own conjecture!) have already gone over it and understood it. In fact, there’s already a beautiful-looking exposition written by Guy Blanc of MIT and Jordan Docter, Carmen Strassle, and Li-Yang Tan of Stanford, which looks like a perfect starting point for those seeking to go much deeper. Or, for those seeking to go only slightly deeper, PSI’s blog post on the advance is sufficiently well-written that it saves me from the need to write too much more here.<br>\nAlas, as reported by Ashley Montanaro, there were the usual forehead-banging misconceptions about what this result means for quantum computing. So for example, Pedro Domingos of U. of Washington blasted out to his 137,000 X followers that the proof means that “the dream of quantum supremacy is dead.” The truth, as Pedro knows perfectly well (or easily could know), is that it rules out one particular type of quantum supremacy (namely, for yes-or-no problems relative to random oracles) that we’d already conjectured didn’t exist anyway. It doesn’t undermine any form of quantum supremacy that we did conjecture to exist! It has zero effect, for example, on Shor’s factoring algorithm, which uses a highly non-random (periodic) oracle for the key internal step. It has zero effect on the simulation of quantum physics and chemistry, which generally doesn’t depend on oracle algorithms at all. Even just relative to random oracles, the Yamakawa-Zhandry breakthrough from 2022 dramatically underscored that, if we switch our attention from decision problems to other kind of problems (in Yamakawa and Zhandry’s case, to NP search problems), then exponential quantum speedups do become possible. Anyway, this was sufficiently intellectually dishonest on Pedro’s part that it makes me disinclined to take him seriously about anything ever again [ADDED: I appreciate that Pedro has now posted a partial correction, saying “or maybe not”].<br>\nBut, OK, given how radically new it is to have an AI solve so many of our longstanding open problems, I suppose “people are wildly misinterpreting a QC advance on social media” is an almost comfortingly familiar problem to have!<br>\nIf you’re wondering how I feel about the proof of AA—well, much like my wife Dana with the Unique Games Conjecture, it’s many different emotions at once.<br>\n- Satisfied that our conjecture turned out to be true after all (it’s nice to be 100% right about something from time to time!)<br>\n- Awestruck by the new reality of the world in which we live in<br>\n- Disappointed that humans didn’t get to snag this conjecture before the robots did (with some more years, I think it’s very likely that they would have)<br>\n- Fatigued by the endless wonders from Aladdin’s Cave, the neverending buffet of solutions to longstanding open problems, wondering when if ever we’ll have time to digest it all<br>\nAnyway, huge congratulations to David Turturean and Jim Halverson, to Physical Superintelligence, and of course to Claude on this achievement!<\/p>","content_hash":"e46a0b6f8c333f0b84c8d702e495bd88","author":"Scott","published_at":"2026-11-08T21:44:31","fetched_at":"2026-11-13 13:50:15","word_count":1204,"read_time_minutes":7,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"4d","domain":"scottaaronson.blog"},{"id":"9759b0106f7703ca","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10283","title":"Thoughts on a historic week","url":"https://scottaaronson.blog/?p=10283","summary":"As everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole&#8212;because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI&#8217;s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin&#8217;s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it. But","content":"<p>Thoughts on a historic week<br>\nAs everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole—because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI’s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin’s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it.<br>\nBut also, yes, there was an election.<br>\nI remember that, when Dana and I moved to Texas in the summer of 2016, we were excited to be a small part of what seemed at the time like Texas’s impending transformation into a cosmopolitan blue state.<br>\nAnd now the prophecy is finally being fulfilled. But so many strange and harrowing things have happened in the interim, that I feel like Murph when her father finally returns to her at the end of the movie Interstellar.<br>\nSo it turns out that, indeed, the Democrats could’ve easily recaptured both houses of Congress without any need to sell their souls to the likes of Hasan Piker or Abdul El-Sayed. And now the keffiyeh-clad revolutionaries will claim a mandate directly from the people, to put to the sword all the evil landlords and techbros and kulaks and bourgeoisie and (obviously) Zionists, and thereby finally usher in the utopia that failed the first 10,000 times it was tried. I see them as more likely to inspire a Republican comeback in 2028 (as unlikely as it seems this week) than to achieve their stated goals.<br>\nFor please remember that the socialist firebrands massively underperformed more moderate Democrats on Tuesday—it looks like the socialists were merely lifted up by the same tide of justified anti-MAGA rage. Yes, in the US and across the Western world, some university humanities departments continue to churn out young people who’d see my family’s slaughter as an inspiring (or at least deeply understandable) act of revolutionary justice, and who vote on that basis. By and large, though, the American voters simply belatedly realized that Trump is a charlatan who was never going to deliver anything he promised, and also they wanted cheaper gas.<br>\nThe Allied victory over Nazi Germany was glorious, it called for parades and dancing in the street, and it was 3,000% earned by Nazi behavior if anything in human history ever was. It left only one tiny problem for the future—namely that, within the winning coalition, the fans of liberal democracy, science, and Enlightenment still needed to confront the Stalinists, whose evil rivaled even the Nazis’, yet who believed their fanatical ideology to be the one vindicated by events. Why was I so often thinking about that these past couple days?<br>\nThere was, of course, also a big election in Israel. Given the results, I pray that Gadi Eisenkot finds some way to form a coalition, or at least soft coalition, with Israel’s Arab parties, since that’s clearly what it will now take finally to topple Netanyahu, a man whose corruption (like Trump’s or Ken Paxton’s) knows no bounds. I’m under no illusions that this step would do anything to appease the hundreds of millions of protesters around the world whose true demand (as they’ll explain if you ask them) never had anything to do with Israeli policies or Gaza or the West Bank or Bibi Netanyahu, but was always simply that Israel cease to exist—that Israel’s Jews either “go back to Poland” or the other countries where their grandparents were murdered or expelled, or preferably just die, as on October 7.<br>\nNevertheless, I pray for a coalition of moderate Israeli Jews and Arabs, firstly because it’s morally right, secondly because it’s politically expedient, and thirdly because it will impress on at least some fair-minded observers the enormity of the moral chasm here—that, whereas the Arab countries expelled or murdered virtually all of their Jews, the State of Israel not only tolerates its Arab minority but gives it the right to vote and to wield power.<br>\nWhatever else one can say, Israel’s Arabs have been sufficiently loyal to their nation that, on October 7, Hamas murdered them right along with the Jews, treating them as Zionist collaborators and traitors to Islam. I’d like to see that loyalty rewarded with a role in Israel’s governing coalition.<br>\nAs is becoming standard practice with my political posts, I’m closing the comments—because life is short, and these days, the overwhelming majority of comments that I get on posts like this one, whichever ideological axe they’re grinding, are not ones that engender in me even minimal respect for their authors. I apologize to those who would’ve actually pursued a thoughtful dialogue with me or others had I left the comments open—to all five of you, or however many righteous men of Sodom there might be.<\/p>","content_hash":"5eccb21b41c4e341023a500092effa66","author":"Scott","published_at":"2026-11-05T17:48:44","fetched_at":"2026-11-13 13:50:15","word_count":827,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"d96a14c03a92c48b","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10270","title":"Podcasts about the Topic: Part III, with Brian Greene","url":"https://scottaaronson.blog/?p=10270","summary":"Boooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems! So it seems like a perfect occasion to share yet another podcast. I know I&#8217;ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don&#8217;t talk about OpenAI&#8217;s refutation of the Exponential Time Hypothesis be","content":"<p>Boooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems!<br>\nSo it seems like a perfect occasion to share yet another podcast. I know I’ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don’t talk about OpenAI’s refutation of the Exponential Time Hypothesis because the announcement of that was still two days in the future!<br>\nBonus Addition From Just This Morning (Nov. 3):Another podcast, about quantum computing, foundations of quantum mechanics, AI, consciousness, and I forget what else … this one with writer Robert Wright, whose book The Moral Animal made a huge impression on me back when I was 13 years old!<br>\n53 Responses to “Podcasts about the Topic: Part III, with Brian Greene”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"5f31b5c964cb91b5a2d2cebf734ed352","author":"Scott","published_at":"2026-10-31T21:40:33","fetched_at":"2026-11-13 13:50:16","word_count":310,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"0083cc178c901677","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10232","title":"Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)","url":"https://scottaaronson.blog/?p=10232","summary":"In my &#8220;Mathocalypse&#8221; post, I mentioned that my wife Dana&#8212;who&#8217;s been working on Subhash Khot&#8217;s Unique Games Conjecture since ~2009, for the entire time I&#8217;ve known her&#8212;has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI&#8217;s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, ","content":"<p>Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)<br>\nIn my “Mathocalypse” post, I mentioned that my wife Dana—who’s been working on Subhash Khot’s Unique Games Conjecture since ~2009, for the entire time I’ve known her—has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI’s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, Dor Minzer, and other colleagues, and (naturally) GPT-6 Astra, Dana probably now understands this crown jewel of OpenAI’s release as well as anyone does. This week, she gave two well-received whiteboard talks on the proof at Simons Institute. So, I and others encouraged her to give the same talks next week at UT Austin when she’s back here, and Dana agreed! Because of the large timely interest, we’re going to do a live Zoom option, and will also record the talk for later sharing on YouTube. Please note: While all are welcome, this is a 2-hour technical talk. The first hour will review key ideas from hardness of approximation, while the second hour will describe the new construction. —SA<br>\nTitle: The Unique Games Conjecture – Proved (!!?)<br>\nSpeaker: Dana Moshkovitz (UT Austin)<br>\nWhen: Wednesday Nov. 4, 3:30-5:30pm US Central (with a brief break in the middle)<br>\nWhere: UT Austin, Gates Dell Complex 6.302. Live Zoom will be available here, and a recording will be available later.<br>\nAbstract: The Unique Games Conjecture of Khot says that it is NP-hard, given a system of linear equations of the form xi-xj=bij (mod p) over variables x1…xn, where 99% fraction of the equations can be satisfied, to find an assignment satisfying 1% of the equations (here p is a sufficiently large constant).<br>\nThis conjecture implies optimal inapproximability results for many optimization problems.<br>\nA few weeks ago OpenAI released a writeup with a proof of the Unique Games Conjecture, as well as a Lean formalization of the proof. The writeup, like others released that day, is not written in a way that’s especially readable to human mathematicians.<br>\nMy goal in this talk is to offer my mental map of the proof, in a way that’s helpful to theoretical computer scientists who are familiar with the area. I think of the innovation as a new code construction, “Hadamard with a noise test.” I’ll sketch how it fits into the NP-hardness reduction. Then I’ll describe the code construction fully and sketch its soundness analysis.<br>\nI’ll also point out a couple of ingredients of the proof that are of independent interest, like a simple quadratic that behaves “like a linear,” and a probability bound using a trick with harmonic numbers.<\/p>","content_hash":"f81a4183271bf90cffcc544e4703c469","author":"Scott","published_at":"2026-10-30T23:27:34","fetched_at":"2026-11-13 13:50:16","word_count":454,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"19962db08186efd4","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10239","title":"Podcasts about the Topic: Part II","url":"https://scottaaronson.blog/?p=10239","summary":"As always, I strongly recommend 2x speed, which compensates somewhat for my verbal infelicities! New! More podcasts keep dropping! This one is with the AI alignment researcher Roman Yampolskiy, about &#8230; well, AI alignment, plus the Mathocalypse, plus quantum computing, plus whether the universe is a simulation, and I forget what else! Man do the YouTube comments make me despair of humanity though. Another one that recently dropped, with Sophia Aryan: With Curt Jaimungal: The title Curt put ","content":"<p>Podcasts about the Topic: Part II<br>\nAs always, I strongly recommend 2x speed, which compensates somewhat for my verbal infelicities!<br>\nNew! More podcasts keep dropping! This one is with the AI alignment researcher Roman Yampolskiy, about … well, AI alignment, plus the Mathocalypse, plus quantum computing, plus whether the universe is a simulation, and I forget what else! Man do the YouTube comments make me despair of humanity though.<br>\nAnother one that recently dropped, with Sophia Aryan:<br>\nThe title Curt put next to my head could’ve been in reference to many, many things! But sorry, he just mean AI. He and I start with the Mathacre, of course, but then we get onto the firewall paradox and then Curt starts asking about computational complexity and the Second Law, and then about Integrated Information Theory.<br>\nAh, and another one that just dropped! Man’s Search for Meaning podcast (recorded in-person in Austin), with Yannick Bernard, who asked me about quantum computing, AI, my personal story, grade-skipping, antisemitism, and I don’t even remember what else. I didn’t refuse to answer anything. (Note: this one was recorded over the summer, which is why I so weirdly omit the latest AI math breakthroughs!)<br>\nOK, despite the title of this post, short break from “The Topic.” Here’s an absolute masterpiece of mathematical exposition, from the “Polylog” YouTube channel, which tells the story of the determination of Busy Beaver values through spectacular animations. I play cameo roles in the video, although I embarrass myself (as the video silently points out) by transposing two digits in the value of BB(5)…!<br>\nJust for old times’ sake, a short podcast about quantum computing with Danny Li.<br>\nAnd, coming soon (not on YouTube quite yet): a conversation about the Mathacre with celebrated physics popularizer (and character on The Big Bang Theory) Brian Greene, recorded in-person in NYC during my recent trip to speak in the math department at Columbia University!<br>\nAnd to preempt the inevitable comments about it: yes, my students just came to my office to tell me that an OpenAI model has now refuted the Exponential Time Hypothesis, by giving an algorithm to solve 3SAT in an amount of time that scales roughly like exp(n/√log(n)). Even as we struggle to digest the previous courses, the endless buffet continues!<\/p>","content_hash":"7dc0b77b2276479ae01c78d4fd42e578","author":"Scott","published_at":"2026-10-26T22:03:37","fetched_at":"2026-11-13 13:50:16","word_count":379,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"971900c926d04767","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18331","title":"Lunch with Horace Walpole","url":"https://quantumfrontiers.com/2026/10/25/lunch-with-horace-walpole/","summary":"Did you know that Horace Walpole invented the Gothic novel? The Englishman spawned a genre by publishing The Castle of Otranto during the 1700s. Walpole’s work featured dark atmospheres, crumbling castles, family secrets, and taboo subjects such as madness and incest. If you’ve enjoyed Oscar Wilde&#8217;s novel The Portrait of Dorian Gray or the 2024 film Nosferatu,1 thank Horace Walpole. I memorized the above information in a high-school English class. My teacher, Mrs. Lukacs, demanded a great ","content":"<p>Did you know that Horace Walpole invented the Gothic novel? The Englishman spawned a genre by publishing The Castle of Otranto during the 1700s. Walpole’s work featured dark atmospheres, crumbling castles, family secrets, and taboo subjects such as madness and incest. If you’ve enjoyed Oscar Wilde’s novel The Portrait of Dorian Gray or the 2024 film Nosferatu,1 thank Horace Walpole.<br>\nI memorized the above information in a high-school English class. My teacher, Mrs. Lukacs, demanded a great deal of her students: we memorized boatloads of facts about literary genres (from Anglo-Saxon epics to elegies), history (the Enlightenment, the Romantic era, etc.), literary devices (enjambment and litote and synecdoche), and authors (Samuel Johnson, Anne Bradstreet, and their ilk.). Thanks to Mrs. Lukacs, I can add that Charles Brockden Brown Americanized the Gothic. He shifted stories’ settings to caves, dark forests, and villages at the edge of civilization. The novels Wieland, Edgar Huntly, and Arthur Mervyn exemplify his style.<br>\nMrs. Lukacs’s curriculum hibernated in me like an educational chipmunk after I’d graduated from high school. Imagine my surprise, during a recent lunchtime, when I lifted my gaze to find Horace Walpole a few feet away.<br>\nI was dining at King’s College, Cambridge. The University of Cambridge contains colleges similarly to how Hogwarts contains houses. Each house has students and faculty members from multiple departments. Some departments share their disciplines with institutes. An institute and a college account for my visiting Cambridge most of this autumn: the Isaac Newton Institute for the Mathematical Sciences is hosting a several-month program about quantum many-body physics. I’m grateful to be attending the program while holding a Visiting Fellowship at King’s College.<br>\nKing Henry VI founded King’s College in 1441. (Caltech, where I earned my PhD, precipitated from earlier institutions around the turn of the twentieth century.) The college’s alumni and former Fellows include centuries’ worth of luminaries. Some of their portraits hang in the dining hall, a Gothic confection that could play a cathedral on television.<br>\nI sometimes talk with other scholars over meals in the dining hall; but, when dining alone, I examine different facets of the hall over different meals. The room boasts carved wooden walls, a seventeenth-century tapestry, the gold-colored wall sconces. I couldn’t forgive myself if I squandered the opportunity to examine them. Sometimes, I’ve scrutinized a portrait per meal. One portrait depicts Horace Walpole.<br>\nDid I attempt to envision Horace Walpole during high school? Probably not. He lurked in my imagination as the silhouette of an eighteenth-century Englishman—likely as buttoned-up, industrious, and middle-aged.<br>\nThe portrait shows a youth in his teens or twenties, his skin smooth. A slight smile hints at levity. His clothing’s light coloring buttresses the impression: a white shirt peeps out from a cobalt-blue jacket. The young man’s pose suggests formality, his back straight and one hand tucked inside his jacket. Yet his large, dark eyes seek the viewer’s. I wouldn’t have expected such a plucky-looking youth to have founded the genre that includes Dracula. But I welcomed Horace Walpole as a lunch companion.<br>\nAfter finishing eating, I walked to one end of the dining hall to drop off my tray. Beside a doorway there hung another portrait whose name leaped out at me: Sir Robert Walpole. Google revealed that Sir Robert had fathered Horace—and served as Great Britain’s first prime minister.<br>\nDuring another meal, I found myself eyeing a portrait of a man wearing an Elizabethan ruff. He wore no smile, unlike Horace. Little wonder: a label revealed the portrait to be of Sir Francis Walsingham. Walsingham had headed Queen Elizabeth I’s spy network during the 1500s. Catholics across Europe sought—overtly and by cloak and dagger—to dethrone Elizabeth and the Protestantism to which Walsingham subscribed. I could hardly blame her right-hand man for looking as though he’d found a rat in his soup.<br>\nWhat a crew surrounds me, I keep thinking. What depth and richness it adds to my meals. I eat chicken-tikka sandwiches and minty-pea salads with history.<br>\nStudying physics unlocks similar depth and richness. Doing physics, one doesn’t merely pose a problem, translate it into math, and solve the mathematical problem. One interprets the mathematical outcome physically, illuminates it with examples, and applies the results to the world around us.<br>\nFor instance, odors waft out of the servery into the dining hall, savoring of flatbread pizza or falafel or beef Wellington. Why? Because improperly fed or watered students can cause riots. But why, more fundamentally? Because, by the second law of thermodynamics, every sufficiently large closed, isolated system’s entropy increases or remains constant. Entropy increases as a gas—which can carry an odor—spreads out.<br>\nAs its entropy grows, the gas approaches equilibrium: large-scale properties of the gas, such as its volume, cease to change. If any energy leaves the gas, an equal amount enters it, on average. The gas takes far less time to equilibrate than glass does. The dining hall’s stained-glass windows depict coats of arms and list college provosts of yore. A glass’s atoms don’t form a crystal, a pattern repeated across space. Diamonds, table salt, and the quartz in wristwatches consist of crystals. A glass’s atoms lie at random distances from each other. This randomness leads to randomness in the interatomic interactions’ strength.<br>\nSimilar randomness characterizes neural networks, which underlie conversations I’ve overheard and participated in at meals. Neural networks realize artificial intelligence, which has been widening, disrupting, monetizing, speeding up, eroding, and enhancing research. You don’t need for me to tell you that AI has ignited a quest for an understanding of what computers can and can’t accomplish. What better place to undertake such a quest than King’s? Alan Turing, a co-founder of computer science, studied and worked here.<br>\nI’ve written about how a liberal-arts education has enhanced my physics. So has a physics education enhanced my life. Physics adds depth and richness—as well as nuance, detail, and significance. I have the opportunity to eat lunch with Horace Walpole this autumn; we have the opportunity to eat our cosmic lunches in this universe for only slightly longer. I couldn’t forgive myself if I squandered the opportunity to examine my surroundings.<br>\nWith thanks to King’s College, the Isaac Newton Institute, David Arvidsson-Shukur, and many others for my visit.<br>\n1Or the 1922 original.<\/p>","content_hash":"c19f669a34e11e70d926022ee3e9b171","author":"Nicole Yunger Halpern","published_at":"2026-10-26T00:03:21","fetched_at":"2026-11-13 13:50:20","word_count":1039,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"2w","domain":"quantumfrontiers.com"},{"id":"24dff74b42fa198c","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10235","title":"Vote! (Israeli edition)","url":"https://scottaaronson.blog/?p=10235","summary":"Someone writing an article for the Israeli press about “people abroad who love Israel but might be worried” emailed me the following questions: “1. What is something about Israel that you admire/appreciate over the years? 2. What are you worried the most about Israel these days?” So I replied as follows: “It’s hard to know where to start with either of your questions! But briefly: Tiny Israel standing up for itself, against an often hostile and unjust world, is a huge part of what’s given me the","content":"<p>Vote! (Israeli edition)<br>\nSomeone writing an article for the Israeli press about “people abroad who love Israel but might be worried” emailed me the following questions:<br>\n“1. What is something about Israel that you admire/appreciate over the years?<br>\n2. What are you worried the most about Israel these days?”<br>\nSo I replied as follows:<br>\n“It’s hard to know where to start with either of your questions! But briefly:<br>\nTiny Israel standing up for itself, against an often hostile and unjust world, is a huge part of what’s given me the self-confidence to stand up for myself in my own life. That was true even before I had visited Israel or spent significant time there, gazed across the desert at the still-clear ruins of the Roman siege of Masada, staggered overwhelmed out of Yad Vashem into the sunlight of Jerusalem, tasted the hummus or pomegranate juice or ice cream with blended fruit, befriended or had academic collaborations with dozens of Israelis, or married an Israeli woman.<br>\nMy fear is merely the ‘obvious’ one — that, in response to the staggering hostility directed against the ‘Jew among the nations,’ Israel will become more and more belligerent, isolated, and right-wing. It will get demographically overwhelmed by those who don’t want to work or serve in the army, while hundreds of thousands of secular educated Israelis leave. It will be internally divided almost to the point of civil war. It will repudiate the liberal-democratic vision of Herzl and Ben-Gurion, of world-class universities and making the deserts bloom, for the swaggering, theocratic vision of Smotrich and Ben-Gvir, of chasing Palestinians from their olive groves. It will become more and more like the hateful caricature of itself that the anti-Israel people in the West always imagined. And then, having been internally weakened in all of these ways, it will finally be destroyed by its external enemies, who will never have rested the whole time, who never once wavered in their dream of a second Holocaust.<br>\nI hope and pray that in the upcoming election, the Israeli voters make optimistic choices that repudiate these fears.”<br>\nAs I’ll do more and more with political posts, I’m leaving the comments off. Why? Because my remaining life is too short to spend it battling an endless parade of trolls and griefers, leftists and rightists and just nihilists, who might or might not be AI.<\/p>","content_hash":"f2ee645b3e2ca56f2eb570bd2d98df53","author":"Scott","published_at":"2026-10-25T21:54:26","fetched_at":"2026-11-13 13:50:17","word_count":394,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"1be6e6aac8a834a3","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10222","title":"Vote!","url":"https://scottaaronson.blog/?p=10222","summary":"Today, I take a break from your regularly-scheduled AI mathocalypse programming to urge my American readers to vote in the Congressional midterms, early if possible, if you haven&#8217;t already. Especially if your state faces one or more major contests, as does my adopted home state of Texas. Me, I voted straight-ticket Democrat today, as I&#8217;ve done in every election since I became eligible over a quarter-century ago (except for when I vote-swapped with someone from another state). So yes,","content":"<p>Vote!<br>\nToday, I take a break from your regularly-scheduled AI mathocalypse programming to urge my American readers to vote in the Congressional midterms, early if possible, if you haven’t already. Especially if your state faces one or more major contests, as does my adopted home state of Texas.<br>\nMe, I voted straight-ticket Democrat today, as I’ve done in every election since I became eligible over a quarter-century ago (except for when I vote-swapped with someone from another state).<br>\nSo yes, I voted for the guy who studied theology a short walk from my house, and who seems to have really internalized the whole Jesus thing about kindness to everyone—<br>\n—over his sneering, thuggish, cartoonishly mafia-like opponent. Fingers crossed that Talarico pulls off a historic upset for our state (he’s currently a 2-to-1 favorite in the prediction markets).<br>\nThe Texas Republicans did everything they possibly could to make this choice easy for me, by being corrupt, conspiratorial, racist, and Taliban-like even by the jaw-droppingly debased standards of MAGA in 2026. As I draw breath, I could never vote for a slate one of whose candidates attacked UT students for the crime of being visibly Southeast Asian while cheering their school’s football victory from the stands—and whose other candidates could barely bring themselves to condemn this knuckle-dragging racist, for fear of angering their base. (It’s like, didn’t you want immigrants to assimilate to American culture? What more could these kids possibly do, short of skin bleach?)<br>\nAll the same, this was also the first US election in my lifetime where I felt like my vote was genuinely in play—especially when I listened to Talarico’s condemnations of Israel, for having the temerity to fight the same kind of war any random other nation would’ve fought had it been attacked as Israel was on October 7. When Hasan Piker came to speak to a cheering crowd here at UT Austin, I actually wrote to someone I know in the Talarico campaign, to ask whether Talarico would show enough balls to condemn Piker’s many antisemitic and anti-American statements, and renounce his support. My contact was nice enough to reply to me, saying: don’t worry, James is taking care to be far away from Austin during Piker’s visit, so he won’t need to engage at all!<br>\nSo then, this is my candidate: the guy who’s strategically silent on the wildly-popular streamer who’d gladly see my Israeli family members raped and beheaded, rather than campaigning with that streamer like Abdul El-Sayed did in Michigan. I unironically believe that, for Talarico, it took genuine moral courage to resist the whole momentum of his party’s youth even to this extent.<br>\nTo earn my vote in the near future under these circumstances, all a Texas Republican would need to do is be somewhat sane or reasonable. He or she might affirm, for example, that racism is bad, that abortion is a woman’s choice, that Christianity is not the state religion of the US, that Covid vaccines work, that human emissions are worryingly changing the earth’s climate, and/or that Joe Biden won in 2020, while still being arbitrarily right-wing on taxes and other stuff. He or she could then simply wait for the Democrats to descend fully into the worldview of the masked hooligans who are currently setting France’s beautiful cities aflame, terrorizing its shopkeepers, and looting as many Louis Vuitton handbags as they can carry … all for Palestine, of course, and for the death of global capitalism, and for the violent overthrow of the scheming, money-grubbing, hook-nosed, international Talmudic … err, I mean “Zionists.”<br>\nWhat I’m trying to say is, it was a genuine achievement on the part of the Texas Republicans to fail to earn a single vote from me this cycle.<\/p>","content_hash":"6078ad7dce6f0452da3b8d1dee36e3de","author":"Scott","published_at":"2026-10-21T05:13:08","fetched_at":"2026-11-13 13:50:17","word_count":624,"read_time_minutes":4,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"bd7da5bccbf49441","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10204","title":"AI Alignment Theory Course: Readings and Rapporteur Reports!","url":"https://scottaaronson.blog/?p=10204","summary":"As I announced on this blog a couple weeks ago, I&#8217;m teaching a new course this semester at UT Austin, entitled AI Alignment Theory. To call such a course &#8220;timely&#8221; seems like an understatement; this is the first course I&#8217;ve ever taught for which multiple gargantuan developments relevant to the course have happened while I was teaching it. Since AI alignment is still a field with no standard textbook (although that might be changing), no accepted body of mathematical theory","content":"<p>AI Alignment Theory Course: Readings and Rapporteur Reports!<br>\nAs I announced on this blog a couple weeks ago, I’m teaching a new course this semester at UT Austin, entitled AI Alignment Theory. To call such a course “timely” seems like an understatement; this is the first course I’ve ever taught for which multiple gargantuan developments relevant to the course have happened while I was teaching it.<br>\nSince AI alignment is still a field with no standard textbook (although that might be changing), no accepted body of mathematical theory, etc. etc., the way we’ve been running the course is like a humanities discussion seminar, albeit one that happens to be in a CS department and to include technical results from time to time. Basically, in each class session, a student “rapporteur” gives a talk on an AI alignment reading—which include “ancient” readings (from way back in 2016), “modern” readings (from, say, last week), and everything in between—and then we freely discuss and debate whatever was presented, with my own role mostly limited to that of gadfly (occasionally I’ll do a mini-lecture on some technical concept).<br>\nAnyway, two weeks ago, I promised a list of the papers and other writings that we’ve been discussing, as well as student “rapporteur reports” on those papers, which cover not only the papers themselves, but the students’ thoughts about the papers and (anonymized) summaries of points raised during our class discussion. People have been bugging me for that ever since.<br>\nSince I am to please, here you are, without further ado! I’ll continue to update the list as the semester progresses, so that this post can serve as a central public repository for the course.<br>\n[By popular request — Course Syllabus]<br>\n- AGI Ruin: A List of Lethalities, by Eliezer Yudkowsky (2022). Rapporteur report by Tennyson Bardwell (this is the one that we posted previously).<br>\n- Concrete Problems in AI Safety, by Amodei, Olah, Steinhardt, Christiano, Schulman, and Mané (2016). Rapporteur report by Daniela Wiepert.<br>\n- The Alignment Problem from a Deep Learning Perspective, by Ngo, Chan, and Mindermann (many versions but latest is 2025), and Research Priorities for Robust and Beneficial Artificial Intelligence by Russell, Dewey, and Tegmark (2016). Rapporteur report by Oleg Pittman and Jack Holt.<br>\n- What Happened: OpenAI and HuggingFace, by Zvi Mowshowitz; The Rise and Fall of Agent Civilizations, by Dwarkesh Patel, and the METR report by on the HuggingFace incident, by Greenblatt, Cotra, and Wijk (all 2026). Rapporteur report by Shourjo Aditya Chaudhuri and John Robertson.<br>\n- We Must Pace the Frontier, by Dario Amodei (2026). Rapporteur report by Dhilan Shah.<br>\n- The Basic AI Drives, by Stephen Omohundro (2008), and Optimal Policies Tend to Seek Power, by Turner, Smith, Shah, Critch, and Tadepalli (2023). Rapporteur report by Bill Zheng.<br>\n- Corrigibility, by Soares, Fallenstein, Yudkowsky, and Armstrong (2015). Rapporteur report by Sukrut Chikodikar.<br>\n- The Off-Switch Game, by Hadfield-Menell, Dragan, Abbeel, and Russell (2017). Rapporteur report by Praneel Seth.<br>\n- Planting Undetectable Backdoors in Machine Learning Models, by Goldwasser, Kim, Vaikuntanathan, and Zamir (latest version 2024), and Oblivious Defense in ML Models: Backdoor Removal without Detection, by Goldwasser, Shafer, Vafa, and Vaikuntanathan (2025).  Rapporteur report by Agrim Jain and Indira Dutta.<br>\n- Backdoor Defense, Learnability, and Obfuscation by Christiano, Hilton, Lecomte, and Zhu (2024), and Unelicitable Backdoors in Language Models via Cryptographic Transformer Circuits, by Draguns et al. (2024). Rapporteur report by John Dunbar.<br>\n- Functional Decision Theory: A New Theory of Instrumental Rationality, by Eliezer Yudkowsky and Nate Soares (2018).  Rapporteur report by Isaac Noel (coming).<br>\n- Robust Cooperation In the Prisoner’s Dilemma: Program Equilibrium via Provability Logic, by Barasz, Christiano, Fallenstein, Herreshoff, LaVictoire, and Yudkowsky (latest version 2021). Rapporteur report by Shunan Zheng.<br>\n- Sleeper Agents: Training Deceptive LLMs that Persist Through Safety Training, by Hubinger et al. (long list of authors) (2024).  Rapporteur report by Anthony Wang (coming).<br>\n- Social Choice Should Guide AI Alignment in Dealing with Diverse Human Feedback, by Conitzer et al. (long list of authors) (2024) and Toward a Theory of Value in AI Alignment, by Ahmed, Birhane, Smart, Kay, Shrishak, and Tobin (2026). Rapporteur report by Priyanka Sadagopan.<br>\n- Claude’s Constitution, by Amanda Askell, Joe Carlsmith, Chris Olah, Jared Kaplan, Holden Karnofsky, et al. (2026). Rapporteur report by Alan Li.<br>\n- AI Safety via Debate, by Geoffrey Irving, Paul Christiano, and Dario Amodei (2018).  Rapporteur report by Sampoorna Poria (coming).<br>\n- Scalable AI Safety via Doubly-Efficient Debate, by Jonah Brown-Cohen, Geoffrey Irving, and Georgios Piliouras (2023).  Rapporteur report by Aarushi Lakhi (coming).<br>\n- AI as Normal Technology, by Arvind Narayanan and Sayash Kapoor (2025).  Rapporteur report by Weixi Chen (coming).<br>\n- On the Dangers of Stochastic Parrots, by Emily Bender, Timnit Gebru, Angelina McMillan-Major and Shmargaret Shmitchell (2021). Rapporteur report by George Tsoukalas (coming).<br>\n(More readings TBD, until the semester ends!)<br>\nThanks to my TA, Lin Lin Lee, for her help in getting all of this together.<br>\nUpdate: I welcome elevated discussion of these papers and rapporteur reports in the comment section; some of the students might chime in too! Because of the connection to an academic class, though, in this post I’ll be especially ruthless in keeping out nonconstructive or off-topic comments.<\/p>","content_hash":"e24430fd4c7637a5623676d6ab16e965","author":"Scott","published_at":"2026-10-19T21:07:12","fetched_at":"2026-11-13 13:50:18","word_count":862,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"28c597e089a405ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18358","title":"Even sampling from a quantum spin glass may not require a quantum computer (a video abstract, for a change)","url":"https://quantumfrontiers.com/2026/10/19/even-sampling-from-a-quantum-spin-glass-may-not-require-a-quantum-computer-a-video-abstract-for-a-change/","summary":"First, why a video? I am part of a generation that was raised on a nourishing diet of science communication videos on YouTube. The likes of MinutePhysics, Veritasium, VSauce, Crash Course, TED-Ed, Physics Girl, 3Blue1Brown &#8212; you name it, these channels were my childhood. Had they not existed, I may very well have never considered pursuing a physics PhD here at Caltech. But you probably already knew about the power of science communication in its ability to inspire the next generation. I am","content":"<p>First, why a video?<br>\nI am part of a generation that was raised on a nourishing diet of science communication videos on YouTube. The likes of MinutePhysics, Veritasium, VSauce, Crash Course, TED-Ed, Physics Girl, 3Blue1Brown — you name it, these channels were my childhood. Had they not existed, I may very well have never considered pursuing a physics PhD here at Caltech.<br>\nBut you probably already knew about the power of science communication in its ability to inspire the next generation. I am here to convince you that science communication just became a whole lot more important.<br>\nEarlier this month, Terence Tao gave a talk at Caltech about the growing use of AI in mathematics. In light of OpenAI’s recent release of hundreds of AI-generated mathematical manuscripts, he argued that our community has transitioned from a long era of proof scarcity to one of proof abundance. As a result, problem-solving may no longer be the central challenge in mathematics and theoretical physics that it once was. What surprised me most, though, was Terence’s claim that problem-solving was never the central goal in the first place. It was only ever a proxy for the actual goal of these disciplines: to elevate human understanding.<br>\nI do not think we have fully internalized this maxim as a community yet. The arXiv is seeing a flood of AI-generated submissions that claim to solve problems but offer very little insight. So how do we encourage human understanding?<br>\nPerhaps a video recording is one good way. Flagship conferences like STOC 2027 have begun requiring video recordings as part of their submission process to prioritize effective scientific communication and filter out low-insight AI-generated submissions. On one level, requiring authors to explain their work over video establishes a standard that scientific research should remain intelligible to others.<br>\nBut on another level, a video recording captures something of the humanness of the act of understanding itself. When I understand something, I feel like I can taste it, almost as if it were a sensory experience. I then feel empowered, as if I have been given a new tool to use, and subsequently feel an excitement to share that insight with other human beings. In other words, understanding is an embodied phenomenon. And what better way to embody your work than to stand before a camera and explain it?<br>\nScience communication is no longer just about communicating science to people outside the field. It is increasingly about ensuring that the scientific progress we make be accompanied by a corresponding growth in human understanding. So go out there and record yourself geeking out!<br>\nAbout the work<br>\nQuantum spin glasses are, in some ways, very quantum systems. Their Hamiltonians contain many non-commuting terms, and their low-energy states can be far from simple product states that are easy to represent classically.<br>\nOne might therefore expect these systems to be difficult to simulate on a classical computer. Yet, in our recent work, we show strong evidence that there is no exponential quantum advantage for sampling from the thermal states of one such quantum spin glass model.<br>\nThe key is to reduce sampling to estimating certain quantities related to the model called tilted means, which we expect to be classically easy. I say expect because our results rely on a conjecture from spin-glass physics that is widely believed to hold true, but has yet to be rigorously proven with existing mathematical tools. Such assumptions are quite common in the spin-glass community.<br>\nThe video above focuses more on why we wanted to study sampling than on how we actually solved the problem in order to make it accessible to a general audience. For those curious, our approach is based on stochastic localization, a sampling technique closely related to diffusion models. More technical details can be found in our arXiv preprint.<\/p>","content_hash":"aad728eb5dc36a8b7b51fbdaa4bc7323","author":"Saleh Naghdi","published_at":"2026-10-19T09:08:28","fetched_at":"2026-11-13 13:50:20","word_count":634,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"3w","domain":"quantumfrontiers.com"},{"id":"7ccdc920e0cf1a86","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18370","title":"Letter to a prospective student","url":"https://quantumfrontiers.com/2026/10/17/letter-to-a-prospective-student/","summary":"It’s been a long summer here at Caltech, in part due to a super El Niño event which hit late but hard, with temperatures creeping up to the 100s in the first week of October. But in the history books (at least those on the history of science), the end of this summer might forever be marked by the events of last week. I’m referring
