Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":"<p>Important changes to Qiskit documentation and learning resources<br>\nToday, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.<br>\nQiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made since Qiskit’s inception. However, it has been challenging to maintain Qiskit documentation and educational resources in their current form. We’ve also received lots of user feedback that these resources needed to be consolidated and better-organized to make Qiskit easier to use on real quantum hardware. Our hope is that the community will no longer need to jump between scattered, disjointed resources to develop quantum programs.<br>\nThat’s why we’re migrating Qiskit educational resources and documentation into the IBM Quantum Platform — to offer a more unified experience for users. Our eventual plan is to sunset all of the content on Qiskit.org and move it to the IBM Quantum Platform.<br>\nIBM Quantum is committed to open-source software development and education, so none of the old content is going away. Community-built content, such as the Qiskit Textbook, will be handed off to the community and remain available on GitHub.<br>\nThings will look a little different — so let’s walk you through the changes.<br>\nQiskit Documentation<br>\nQiskit and Qiskit Runtime documentation are moving to https://docs.quantum-computing.ibm.com/<br>\nThis migration is ongoing, with content due to be fully removed from Qiskit.org by the end of the year. Qiskit.org/documentation and qiskit.org/ecosystem/ibm-runtime/ will go away and redirect to https://docs.quantum-computing.ibm.com.<br>\nDocs will also be structured differently. Instead of API reference, tutorials, how-to guides and explanations, the content will be split into the following sections (to support natural workflows):<br>\n- Install: Begin using our tools and platforms with install and setup instructions.<br>\n- Build: Design and develop quantum circuits with primitives and advanced methods like dynamic circuits and mid-circuit measurements. You can also find our circuit library here.<br>\n- Verify: Validate and evaluate your quantum circuits.<br>\n- Run: Run on our hardware with job configuration options such as sessions.<br>\n- API reference: Find API references for Qiskit, Qiskit Runtime IBM Client, Qiskit IBM Runtime Rest API, and Qiskit IBM Provider in the API reference drop-down menu above. You can also find the Error code registry here.<br>\nUsers will have two ways to submit feedback and report bugs. For non API ref content, they should report issues/feedback in https://github.com/Qiskit/documentation/issues/new/choose. For any user interface-related issues, click the feedback button.<br>\nQiskit and Runtime docs will remain open source, and we still welcome community feedback and contributions to documentation. The translations program will also continue. We are currently working to define a robust process to facilitate contributions, so we are temporarily pausing contribution reviews until the content migration is complete. More details to come.<br>\nQiskit Textbook<br>\nStarting today, the following courses will redirect to the new learning app:<br>\n- Basics of quantum information, with John Watrous<br>\n- Fundamentals of quantum algorithms, with John Watrous<br>\n- Variational algorithm design<br>\n- Qiskit tutorials<br>\nWe invite you to explore IBM Quantum Learning to read these courses and explore the new Quantum-Safe Cryptographycourse. Over the next few months, we’re planning more free courses to help you learn foundations of quantum information, and experiment with Qiskit Runtime and IBM Quantum.<br>\nWe will sunset the textbook and the syllabus creation tool on November 29, 2023. Legacy textbook pages will remain available through a public archive on Github. Once archived, this content will not be maintained by IBMers, and new external contributions will not be accepted. We understand that the textbook is a much-beloved resource, and you’ll still be able to stand up the textbook locally with the instructions in the README.<br>\nWhy we’re making this change<br>\nMoving docs and learning resources will bring things closer to the same platform that developers, researchers, and students use every day for running actual workloads on quantum systems. Now, they’ll be able to find all of their resources in one, easy-to-navigate place.<br>\nIBM Quantum Platform will now be the home for all education, from the basics of quantum computing and programming with Qiskit to experimenting and prototyping with Qiskit Runtime on IBM Quantum systems. We’ll continue to develop this content in the open to promote trust and transparency within the quantum community, but moving it to the IBM Quantum Platform will help to ensure the quality of this content continues to be high as possible.<br>\nWe’re excited about this change, and hope that the result will be a seamless quantum computing experience for everyone. We look forward to building together.<\/p>","content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-09-01 03:17:04","word_count":789,"read_time_minutes":4,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"149w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":"<p>A guide to the Qiskit circuit library<br>\nBy Robert Davis, Julien Gacon, Abby Mitchell, and Luciano Bello<br>\nWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the process) by simply using circuits that already exist. That’s just one reason why we created the Qiskit circuit library.<br>\nThe Qiskit circuit library is a collection of valuable, well-studied circuits and gates that Qiskit users can easily plug into their quantum circuits. These include useful tools for a wide array of quantum computing applications—including quantum machine learning, quantum chemistry, circuits for benchmarking, and even a number of circuits that are hard to simulate classically. Whether you’re a complete beginner or a bona fide Qiskit wizard, we’re sure you’ll find something useful in our extensive circuit library module.<br>\nWhy every Qiskit user should give the circuit library a closer look<br>\nBefore we launched the circuit library a few years ago, users could only run quantum circuits they had constructed manually. If a user wanted to implement a phase estimation, a Fourier transform, or a variational circuit—really anything at all—they either had to build it themselves, or build a function that generated the circuit for them. In either case, the process was cumbersome, and documentation was limited and disorganized.<br>\nAs the Qiskit community began to grow, we developed a clearer sense of which circuits were most important to users. Eventually, we began to organize these into the circuit library we have today. This library is designed to be a repository of building blocks—a collection of any and all circuits we think are valuable to users. Here, we define “valuable” circuits as those that are either (1) widely used for common quantum computing tasks, (2) difficult to simulate classically, or (3) useful for quantum hardware benchmarking.<br>\nFor example, the quantum Fourier transform (QFT) is an essential building block in a number of quantum algorithms including quantum phase estimation and the famous Shor’s algorithm. Now, if they really want to, a user can certainly run a QFT on quantum hardware by building the circuit manually. That might look something like this:<br>\nimport numpy as np<br>\nfrom qiskit import QuantumCircuit<br>\ndef build_qft(n):<br>\n   circuit = QuantumCircuit(n)<br>\n   for j in reversed(range(n)):<br>\n       circuit.h(j)<br>\n       for k in reversed(range(j)):<br>\n           circuit.cp(np.pi * 2. ** (k - j), j, k)<br>\n   for j in range(n // 2):<br>\n       circuit.swap(j, n - j - 1)<br>\n   return circuit<br>\nqft = build_qft(5)<br>\nBut users who want to save time on this common quantum computing task can simply import the QFT from the circuit library and use it in their subroutines like so:<br>\nfrom qiskit.circuit.library import QFT<br>\nqft = QFT(5)<br>\nMost Qiskit users are aware the circuit library exists, but not everyone realizes just how useful it can be. That’s why we suggest all users spend time familiarizing themselves with it. The circuit library provides essential tools for building quantum algorithms, and gives users the ability to write programs at a higher level of abstraction. Gates and other elements found in the circuit library are developed so that users can easily plug them into their own quantum circuits using the QuantumCircuit.append() method, meaning users shouldn’t need to concern themselves with the lower level details of how those elements actually work.<br>\nThe circuit library also provides tools that help users investigate properties of the quantum system itself, such as measuring quantum volume, and it offers useful information about the gates and circuits we use most often. It really is a library in the truest sense—in many cases; documentation for gates and other objects include links to a paper detailing the theory upon which they’re based.<br>\nNow, let’s take a look at some of the different kinds of circuits and gates that users will find in the Qiskit Circuit Library.<br>\nVariational quantum circuits (“N-local circuits”)<br>\nThe N-local circuits sub-module of the circuit library contains a selection of subclasses that serve as parameterized models in variational algorithms, such as the variational quantum eigensolver (VQE) algorithm and the quantum approximate optimization algorithm (QAOA).<br>\nIn fields like chemistry and physics, these algorithms serve to approximate wave functions efficiently, which is a task that is generally hard for classical computers. Variational algorithms are also useful for problems in classical optimization and machine learning, where a quantum computer might enable a better optimization of the objective.<br>\nLet’s take a look at an example of how to define a problem instance for a VQE algorithm, using the EfficientSU2 ansatz circuit taken from the circuit library. In this example, we’ll derive our Hamiltonian from a quantum chemistry problem:<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nhamiltonian = SparsePauliOp.from_list(<br>\n    [(\"YZ\", 0.3980), (\"ZI\", -0.3980), (\"ZZ\", -0.0113), (\"XX\", 0.1810)]<br>\n)<br>\nAs mentioned above, our choice of ansatz is the EfficientSU2 circuit. By default, the EfficientSU2 circuit linearly entangles qubits. This makes it ideal for use in quantum hardware with limited connectivity:<br>\nfrom qiskit.circuit.library import EfficientSU2<br>\nansatz = EfficientSU2(hamiltonian.num_qubits)<br>\nansatz.draw(\"mpl\")<br>\nHere’s what the circuit looks like:<br>\nTry printing with the following code to see how the circuit is structured!<br>\nBased on the previous figure, we know that our ansatz circuit is defined by a vector of parameters, θi, with the total number given by:<br>\nnum_params = ansatz.num_parameters<br>\nprint(num_params)<br>\nAnd in this case we get the output:<br>\n16<br>\nFor an example on how to use the circuit library to run a VQE, see: https://qiskit.org/ecosystem/algorithms/tutorials/01_algorithms_introduction.html<br>\nData encoding circuits<br>\nData encoding circuits enable the preparation of input data for QML applications. There are several techniques to encode classical data, or features, into a quantum state, for example:<br>\n- Amplitude encoding: Encode the features into the amplitude of a basis state. This allows to store 2^n numbers in a single state, but can be costly to implement<br>\n- Basis encoding: Encode an integer k by preparing the corresponding basis state|k><br>\n- Angle encoding: Encode features as rotation angles in a variational quantum circuit<br>\nDeciding which of these approaches is best really depends upon the specifics of your application. On current quantum computers, however, we often use angle encoding.<br>\nOne example is the ZZFeatureMap found in the circuit library:<br>\nfrom qiskit.circuit.library import ZZFeatureMap<br>\nfeature = [0.2, 0.4, 0.8]<br>\nfeature_map = ZZFeatureMap(feature_dimension=len(feature))<br>\nencoded = feature_map.assign_parameters(feature)<br>\nencoded.draw('mpl')<br>\nwhich prints<br>\nTry printing with the following code to see how the circuit is structured!<br>\nencoded.decompose().draw('mpl')<br>\nFor an example of how to use data encoding circuits for classication, see: https://qiskit.org/ecosystem/machine-learning/tutorials/02_neural_network_classifier_and_regressor.html.<br>\nTime evolution circuits<br>\nTime evolution circuits allow us to evolve a quantum state in time. Physics researchers make use of them for a wide-array of applications, including investigations of thermalization properties or potential phase transitions of a system. Time evolution circuits are also a fundamental building block of chemistry wave functions—e.g., for unitary coupled-cluster trial states—and of the QAOA algorithm we use for optimization problems.<br>\nfrom qiskit.circuit.library import PauliEvolutionGate<br>\nfrom qiskit.circuit import QuantumCircuit<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nhamiltonian = SparsePauliOp([\"ZZI\", \"IZZ\"])<br>\n# prepare an initial state with a Hamadard on the middle qubit<br>\nstate = QuantumCircuit(3)<br>\nstate.h(1)<br>\nevolution = PauliEvolutionGate(hamiltonian, time=1)<br>\n# evolve state by appending the evolution gate<br>\nstate.append(evolution)<br>\nstate.draw('mpl')<br>\nAnd in this case we get the output:<br>\nBenchmarking and complexity theory circuits<br>\nBenchmarking and complexity theory circuits are a vital tool for anyone working with quantum computers. They give us a sense of how well our hardware is actually working, and the true level of computational complexity involved in the problems we want to solve.<br>\nOne of the most important examples of this is the QuantumVolume circuit, which allows us to quantify the largest random circuit of equal width and depth that a near-term quantum computer of relatively modest size can successfully implement. This single metric can help us understand how well the quantum computer is doing in terms of fidelity of operations, qubit connectivity, gate set calibration, and circuit rewiring tool chains.<br>\nA quantum volume model circuit comprises layers of Haar random elements of SU(4) applied between corresponding pairs of qubits in a random bipartition. Here’s an example of a quantum volume circuit built in Qiskit that runs on four qubits:<br>\nfrom qiskit.circuit.library import QuantumVolume<br>\nqv = QuantumVolume(4)<br>\nqv.decompose().decompose().draw('mpl')<br>\nSome quantum circuits have been shown to deliver advantage over classical algorithms. Many readers will already be familiar with some of the more famous examples of these circuits, which include Shor’s algorithm for prime factorizationand the Grover search algorithm.<br>\nThe circuit library contains circuits that are conjectured to be hard to simulate classically, such as the IQP circuit. (Learn more about the IQP circuit here.)<br>\nIt also contains building blocks for algorithms that are believed to provide quantum advantage. Some of these are of a more practical nature. For example, Qiskit users can build the circuit for Grover’s algorithm by using GroverOperator.<br>\nOthers are of more theoretical interest. For example, Fourier checking uses the FourierChecking method. (Click here to learn more about Fourier checking.)<br>\nLet’s take a look at an example of the IQP circuit:<br>\nfrom qiskit.circuit.library import IQP<br>\ninteractions = [[6, 5, 3], [5, 4, 5], [3, 5, 1]]<br>\ncircuit = IQP(interactions)<br>\ncircuit.decompose().draw(\"mpl\")<br>\nArithmetic circuits<br>\nSome users may be surprised to learn that the circuit library includes numerous quantum circuits that are designed to perform classical arithmetic operations on qubit states or state amplitudes, such as addition or multiplication. These are useful for applications like amplitude estimation, which have the potential to be valuable in finance applications, and in algorithms like HHL, which is a proposed method for solving linear systems of equations.<br>\nAs an example, let’s try adding two 3-bit-long numbers, using a ripple-carry circuit to perform in-place addition (CDKMRippleCarryAdder). This adder take two numbers—A and B—then it adds them, and “sets” B with the result. In this example, A=2 and B=3:<br>\nfrom qiskit.circuit.library import CDKMRippleCarryAdder<br>\nadder = CDKMRippleCarryAdder(3)  # Create an adder of 3-bit-long numbers<br>\nfrom qiskit import QuantumCircuit, QuantumRegister, ClassicalRegister<br>\n# Create the number A=2<br>\nreg_a = QuantumRegister(3, 'a')<br>\nnumber_a = QuantumCircuit(reg_a)<br>\nnumber_a.initialize('010') # number 2 - equivalent to format(2, '03b')<br>\n# Create the number B=3<br>\nreg_b = QuantumRegister(3, 'b')<br>\nnumber_b = QuantumCircuit(reg_b)<br>\nnumber_b.initialize('011')  # number 3 - equivalent to format(3, '03b')<br>\n# Create a circuit to hold everything, including a classical register to put the result<br>\nreg_result = ClassicalRegister(3)<br>\ncircuit = QuantumCircuit(*adder.qregs, reg_result)<br>\n# Compose setting A and B with the adder. Measure the result in B<br>\ncircuit = circuit.compose(number_a, qubits=reg_a).compose(number_b, qubits=reg_b).compose(adder)<br>\ncircuit.measure(reg_b, reg_result)<br>\ncircuit.draw('mpl')<br>\nBy calling the sampler in qiskit.primitives.Sampler, it is possible to simulate the execution of this circuit and observe that the result is 5.<br>\nfrom qiskit.primitives import Sampler<br>\nresult = Sampler().run(circuit).result()<br>\nprint(result.quasi_dists[0].keys())dict_keys([5])<br>\nStandard gates<br>\nThe Standard Gates section of the Qiskit Circuit Library is a foundational toolbox for building up a wide array of quantum circuits—from the humble X Gate all the way to more complex multi-controlled rotation gates.<br>\nUsers can add standard gates to their circuits by calling the gates as methods—e.g., circuit.x(3) will append an X Gate to the qubit 3. That's the most common way to use them. With that being said, this is still an incredibly useful section of the circuit library, and of our documentation in general, as it provides some very useful information about the matrices underlying these gates.<br>\nLet’s take a look at an example of how to append a multi-controlled CNOT to an existing quantum circuit, using the circuit library as a reference. In the following example we are constructing a multi-controlled X Gate (MCXGate) with 4 control qubits from the circuit library and applying it to a quantum circuit, specifying the control qubits are at indices 0,1,2 and 4:<br>\nfrom qiskit import QuantumCircuit<br>\nfrom qiskit.circuit.library import MCXGate<br>\n# create circuit<br>\ncircuit = QuantumCircuit(5)<br>\n# initialise MCX gate with 4 control qubits<br>\ngate = MCXGate(4)<br>\n# append gate to circuit, specifying qubit indices<br>\ncircuit.append(gate, [0, 1, 4, 2, 3])<br>\ncircuit.draw('mpl')<br>\nThe resulting quantum circuit looks like this:<br>\nAnd here’s an example of how we would transpile that to a quantum backend:<br>\nfrom qiskit import transpile<br>\nfrom qiskit.providers.fake_provider import FakeTokyo<br>\nbackend = FakeTokyo()<br>\ntranspiled = transpile(circuit, backend)<br>\ntranspiled.draw('mpl', idle_wires=False)<br>\nOther interesting circuits<br>\nThis article only scratches the surface in terms of describing the many, many different types of circuits that are available in the Qiskit Circuit Library. Some other notable examples include the quantum Fourier transform (QFT), which is an essential subroutine in many algorithms, PhaseOracle, which implements the oracles used in grover search, and multi-control multi-target gate (MCMT), which makes it possible to (for example) implement an X gate acting on two qubits and controlled by three others.<br>\nBe sure to head over to the Qiskit Circuit Library to learn more about how to put these resources to use in your research.<\/p>","content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-09-01 03:17:05","word_count":2140,"read_time_minutes":11,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"151w","domain":"medium.com"}]},"rss_feeds":[{"id":"microsoft-quantum","title":"Microsoft Quantum Blog","feed_url":"https://cloudblogs.microsoft.com/quantum/feed/","site_url":"https://cloudblogs.microsoft.com/quantum","category":"quantum","tier":"curated","etag":"\"014a34be0b62abbe3fb482ed46ffd3a1-gzip\"","last_modified":"Wed, 17 Jun 2026 22:55:27 GMT","last_fetched_at":"2026-09-01 03:18:39","last_status":200,"error_count":0,"created_at":"2026-09-01 03:17:06"},{"id":"qiskit-blog","title":"Qiskit Blog","feed_url":"https://medium.com/feed/qiskit","site_url":"https://medium.com/qiskit","category":"quantum","tier":"curated","etag":null,"last_modified":null,"last_fetched_at":"2026-09-01 03:17:05","last_status":200,"error_count":0,"created_at":"2026-09-01 03:16:56"},{"id":"quantum-computing-report","title":"Quantum Computing Report","feed_url":"https://quantumcomputingreport.com/feed/","site_url":"https://quantumcomputingreport.com","category":"quantum","tier":"curated","etag":"W/\"04fd9de6a57015a1dc9febc32f2f20dd\"","last_modified":"Mon, 31 Aug 2026 20:21:01 GMT","last_fetched_at":"2026-09-01 03:16:56","last_status":200,"error_count":0,"created_at":"2026-09-01 03:16:56"},{"id":"quantum-frontiers","title":"Quantum Frontiers (Caltech)","feed_url":"https://quantumfrontiers.com/feed/","site_url":"https://quantumfrontiers.com","category":"quantum","tier":"curated","etag":null,"last_modified":"Mon, 31 Aug 2026 21:28:51 GMT","last_fetched_at":"2026-09-01 03:17:06","last_status":200,"error_count":0,"created_at":"2026-09-01 03:17:05"},{"id":"scott-aaronson","title":"Shtetl-Optimized","feed_url":"https://scottaaronson.blog/?feed=rss2","site_url":"https://scottaaronson.blog","category":"quantum","tier":"curated","etag":"W/\"17efb908e7d9a35ab3c2e6c0d000953d\"","last_modified":"Sun, 23 Aug 2026 19:21:10 GMT","last_fetched_at":"2026-09-01 03:16:56","last_status":200,"error_count":0,"created_at":"2026-09-01 03:16:53"}]};

<script type="module">

  // ═══════════════════════════════════════════════════════════════
  // D.0  PRETEXT IMPORT (dynamic, with canvas fallback)
  // ═══════════════════════════════════════════════════════════════

  var _pretext = null;
  try {
    var mod = await import('https://cdn.jsdelivr.net/npm/@chenglou/pretext@0.0.3/dist/layout.js');
    _pretext = { prepare: mod.prepare, layout: mod.layout };
  } catch (e) {
    // CDN unreachable — fall back to canvas-only measurement
  }

  // ═══════════════════════════════════════════════════════════════
  // D.1  COLOR CONSTANTS
  // ═══════════════════════════════════════════════════════════════

  function readColors() {
    var s = getComputedStyle(document.documentElement);
    return {
      bg:      s.getPropertyValue('--bg').trim(),
      card:    s.getPropertyValue('--card').trim(),
      text:    s.getPropertyValue('--text').trim(),
      dim:     s.getPropertyValue('--dim').trim(),
      muted:   s.getPropertyValue('--muted').trim(),
      up:      s.getPropertyValue('--up').trim(),
      down:    s.getPropertyValue('--down').trim(),
      accent:  s.getPropertyValue('--accent').trim(),
      spark:   s.getPropertyValue('--spark').trim(),
      score:   s.getPropertyValue('--score').trim(),
      link:    s.getPropertyValue('--link').trim(),
      hoverBg: 'rgba(45, 43, 40, 0.03)',
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.2  FONT CONSTANTS
  // ═══════════════════════════════════════════════════════════════

  var FONTS = {
    cardHeader:   '500 8px "IBM Plex Mono", monospace',
    metricName:   '400 8px "IBM Plex Mono", monospace',
    metricValue:  '500 10px "IBM Plex Mono", monospace',
    metricChange: '400 8px "IBM Plex Mono", monospace',
    newsScore:    '500 8px "IBM Plex Mono", monospace',
    newsTitle:    '400 9px "IBM Plex Mono", monospace',
    newsDomain:   '400 7px "IBM Plex Mono", monospace',
    newsMeta:     '400 7px "IBM Plex Mono", monospace',
  };

  // ═══════════════════════════════════════════════════════════════
  // D.3  TEXT MEASUREMENT
  // ═══════════════════════════════════════════════════════════════

  function withAlpha(color, alpha) {
    if (color.charAt(0) === '#') {
      var r = parseInt(color.slice(1, 3), 16);
      var g = parseInt(color.slice(3, 5), 16);
      var b = parseInt(color.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }
    // Handle rgb() format
    var m = color.match(/[\d.]+/g);
    if (m && m.length >= 3) {
      return 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',' + alpha + ')';
    }
    return color;
  }

  var _measureCanvas = document.createElement('canvas');
  var _measureCtx = _measureCanvas.getContext('2d');

  function measureWidth(text, font) {
    _measureCtx.font = font;
    return _measureCtx.measureText(text).width;
  }

  // Pretext-powered multi-line height prediction (canvas fallback for single line)
  function measureTextHeight(text, font, maxWidth, lineHeight) {
    if (_pretext) {
      var prepared = _pretext.prepare(text, font);
      return _pretext.layout(prepared, maxWidth, lineHeight);
    }
    // Fallback: assume single line if text fits, else estimate line count
    var w = measureWidth(text, font);
    var lines = Math.max(1, Math.ceil(w / maxWidth));
    return { height: lines * lineHeight, lineCount: lines };
  }

  function truncateText(text, font, maxWidth) {
    var fullWidth = measureWidth(text, font);
    if (fullWidth <= maxWidth) return text;

    var ellipsis = '\u2026';
    var ellipsisWidth = measureWidth(ellipsis, font);
    var targetWidth = maxWidth - ellipsisWidth;
    if (targetWidth <= 0) return ellipsis;

    var lo = 0, hi = text.length;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (measureWidth(text.slice(0, mid), font) <= targetWidth) {
        lo = mid;
      } else {
        hi = mid - 1;
      }
    }
    return text.slice(0, lo) + ellipsis;
  }

  // ═══════════════════════════════════════════════════════════════
  // D.3b MASONRY LAYOUT ENGINE (pure JS positioning)
  // ═══════════════════════════════════════════════════════════════

  function computeMetricMinWidth(group) {
    var PAD = 4, GAP = 4, SPARK_W = 56;
    var metrics = group.metrics || [];
    if (metrics.length === 0) return 220;

    var nameWidths = metrics.map(function(m) { return measureWidth(m.name || '', FONTS.metricName); });
    var maxName = Math.max.apply(null, nameWidths);
    var valueWidths = metrics.map(function(m) { return measureWidth(m.formatted_value || '', FONTS.metricValue); });
    var maxValue = Math.max.apply(null, valueWidths);
    var changeTexts = metrics.map(function(m) {
      var t = m.formatted_change || '';
      if (m.change_period) t += ' ' + m.change_period;
      return t;
    });
    var changeWidths = changeTexts.map(function(t) { return measureWidth(t, FONTS.metricChange); });
    var maxChange = Math.max.apply(null, changeWidths);

    return PAD * 2 + maxName + GAP * 3 + SPARK_W + maxValue + maxChange;
  }

  function indexOfMin(arr) {
    var minIdx = 0;
    for (var i = 1; i < arr.length; i++) {
      if (arr[i] < arr[minIdx]) minIdx = i;
    }
    return minIdx;
  }

  function layoutDashboard(wrappers, data, gap) {
    var container = document.querySelector('.dashboard');
    var viewportWidth = container.clientWidth;
    if (viewportWidth < 1) return;

    // 1. Build card descriptors with measured min widths
    var cards = [];
    for (var i = 0; i < wrappers.length; i++) {
      var w = wrappers[i];
      var type = w.dataset.cardType;
      var cardData = null, minW = 220;

      if (type === 'metric') {
        var idx = parseInt(w.dataset.cardIndex, 10);
        cardData = data.metric_groups[idx];
        if (cardData) minW = computeMetricMinWidth(cardData);
      } else {
        var feedId = w.dataset.feedId;
        for (var f = 0; f < data.feeds.length; f++) {
          if (data.feeds[f].id === feedId) { cardData = data.feeds[f]; break; }
        }
        minW = 280;
      }
      cards.push({ wrapper: w, type: type, data: cardData, minWidth: minW });
    }

    // 2. Column count derived from widest card's measured width
    var allMinWidths = cards.map(function(c) { return c.minWidth; });
    var minColWidth = allMinWidths.length ? Math.max.apply(null, allMinWidths) : 260;
    minColWidth = Math.max(minColWidth, 220);

    var colCount = Math.max(1, Math.floor((viewportWidth + gap) / (minColWidth + gap)));
    var colWidth = (viewportWidth - (colCount - 1) * gap) / colCount;

    // 3. Masonry: pack each card into the shortest column
    var BORDER = 2; // 1px border top + 1px border bottom on .card-wrapper
    var colHeights = [];
    for (var c = 0; c < colCount; c++) colHeights.push(0);

    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var isNews = card.type === 'news';

      // Card height from content (news cards use pretext-measured variable heights)
      var cardH;
      if (isNews && card.data) {
        var newsLayout = computeNewsCardLayout(card.data, colWidth);
        cardH = newsLayout.totalHeight;
      } else {
        var headerH = 16, rowH = 16;
        var rowCount = (card.data && card.data.metrics) ? card.data.metrics.length : 0;
        cardH = headerH + rowCount * rowH;
      }

      // Find shortest column
      var bestCol = indexOfMin(colHeights);
      var bestY = colHeights[bestCol];

      // Position card
      var x = bestCol * (colWidth + gap);
      card.wrapper.style.left = Math.round(x) + 'px';
      card.wrapper.style.top = Math.round(bestY) + 'px';
      card.wrapper.style.width = Math.round(colWidth) + 'px';

      // Update column height (account for wrapper border)
      colHeights[bestCol] = bestY + cardH + BORDER + gap;
    }

    // 4. Set container height
    container.style.height = Math.round(Math.max.apply(null, colHeights)) + 'px';
  }

  // ═══════════════════════════════════════════════════════════════
  // D.4  METRIC CARD LAYOUT
  // ═══════════════════════════════════════════════════════════════

  function computeMetricCardLayout(group, containerWidth) {
    var PAD = 4;
    var GAP = 4;
    var HEADER_H = 16;
    var ROW_H = 16;
    var SPARK_W = 56;

    var metrics = group.metrics || [];

    var nameWidths = metrics.map(function(m) {
      return measureWidth(m.name || '', FONTS.metricName);
    });
    var valueWidths = metrics.map(function(m) {
      return measureWidth(m.formatted_value || '', FONTS.metricValue);
    });

    var changeTexts = metrics.map(function(m) {
      var t = m.formatted_change || '';
      if (m.change_period) t += ' ' + m.change_period;
      return t;
    });
    var changeWidths = changeTexts.map(function(t) {
      return measureWidth(t, FONTS.metricChange);
    });

    var maxValue = valueWidths.length ? Math.max.apply(null, valueWidths) : 0;
    var maxChange = changeWidths.length ? Math.max.apply(null, changeWidths) : 0;

    var fixedWidth = PAD * 2 + GAP * 3 + SPARK_W + maxValue + maxChange;
    var nameCol = Math.max(containerWidth - fixedWidth, 40);

    // Ensure value and change columns don't overlap
    var valueX = PAD + nameCol + GAP + SPARK_W + GAP;
    var changeX = containerWidth - PAD - maxChange;
    if (valueX + maxValue + GAP > changeX) {
      // Shrink sparkline to make room
      var overflow = (valueX + maxValue + GAP) - changeX;
      SPARK_W = Math.max(SPARK_W - overflow, 20);
      valueX = PAD + nameCol + GAP + SPARK_W + GAP;
    }

    var cols = {
      name:   { x: PAD, width: nameCol },
      spark:  { x: PAD + nameCol + GAP, width: SPARK_W },
      value:  { x: valueX, width: maxValue },
      change: { x: changeX, width: maxChange },
    };

    return {
      headerHeight: HEADER_H,
      rowHeight: ROW_H,
      padding: PAD,
      columns: cols,
      totalHeight: HEADER_H + metrics.length * ROW_H,
      changeTexts: changeTexts,
      _metricCount: metrics.length,
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.5  NEWS CARD LAYOUT
  // ═══════════════════════════════════════════════════════════════

  function computeNewsCardLayout(feed, containerWidth) {
    var PAD = 4;
    var GAP = 6;
    var HEADER_H = 16;
    var ROW_H = 18;

    var stories = feed.stories || [];

    var scoreWidths = stories.map(function(s) {
      return measureWidth(String(s.score || 0), FONTS.newsScore);
    });
    var scoreCol = scoreWidths.length ? Math.max(Math.max.apply(null, scoreWidths), 20) : 20;

    var metaTexts = stories.map(function(s) {
      return (s.time_ago || '') + ' ' + (s.comments || 0) + 'c';
    });
    var metaWidths = metaTexts.map(function(t) {
      return measureWidth(t, FONTS.newsMeta);
    });
    var metaCol = metaWidths.length ? Math.max(Math.max.apply(null, metaWidths), 30) : 30;

    var titleX = PAD + scoreCol + GAP;
    var titleWidth = Math.max(containerWidth - titleX - GAP - metaCol - PAD, 60);

    // Measure each title height via pretext (supports multi-line wrapping)
    var rowYOffsets = [];
    var y = HEADER_H;
    var rowHeights = stories.map(function(s) {
      var h = measureTextHeight(s.title || '', FONTS.newsTitle, titleWidth, ROW_H);
      rowYOffsets.push(y);
      var rh = Math.max(h.height, ROW_H); // at least one row tall
      y += rh;
      return rh;
    });

    return {
      headerHeight: HEADER_H,
      rowHeight: ROW_H,
      padding: PAD,
      columns: {
        score: { x: PAD, width: scoreCol },
        title: { x: titleX, width: titleWidth },
        meta:  { x: containerWidth - PAD - metaCol, width: metaCol },
      },
      totalHeight: y,
      rowHeights: rowHeights,
      rowYOffsets: rowYOffsets,
      metaTexts: metaTexts,
      _storyCount: stories.length,
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.6  DRAWING FUNCTIONS
  // ═══════════════════════════════════════════════════════════════

  function drawCardHeader(ctx, name, width, headerHeight, colors) {
    // Header background
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, width, headerHeight);

    // Header bottom border
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(0, headerHeight - 0.5);
    ctx.lineTo(width, headerHeight - 0.5);
    ctx.stroke();

    // Chevron
    ctx.font = FONTS.cardHeader;
    ctx.fillStyle = colors.muted;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('>', 4, headerHeight / 2);

    // Section name
    ctx.fillStyle = colors.accent;
    var chevronWidth = measureWidth('> ', FONTS.cardHeader);
    ctx.fillText(name.toUpperCase(), 4 + chevronWidth, headerHeight / 2);
  }

  function drawDottedSeparator(ctx, y, width, colors) {
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1;
    ctx.setLineDash([1, 2]);
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(width, y + 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawSparkline(ctx, values, x, y, width, height, colors) {
    if (!values || values.length < 2) return;

    var min = Infinity, max = -Infinity;
    for (var i = 0; i < values.length; i++) {
      if (values[i] < min) min = values[i];
      if (values[i] > max) max = values[i];
    }
    var range = max - min;
    if (range === 0) range = 1;

    var pad = 3;
    var drawH = height - pad * 2;
    var drawW = width;
    var stepX = drawW / (values.length - 1);

    ctx.save();
    ctx.beginPath();

    for (var i = 0; i < values.length; i++) {
      var px = x + i * stepX;
      var py = y + pad + drawH - ((values[i] - min) / range) * drawH;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    ctx.strokeStyle = colors.spark;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // Area fill with gradient
    ctx.lineTo(x + drawW, y + height);
    ctx.lineTo(x, y + height);
    ctx.closePath();

    var grad = ctx.createLinearGradient(0, y, 0, y + height);
    grad.addColorStop(0, withAlpha(colors.spark, 0.09));
    grad.addColorStop(1, withAlpha(colors.spark, 0.01));
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.restore();
  }

  function drawMetricRow(ctx, metric, rowIndex, layout, colors, changeText, isHovered) {
    var y = layout.headerHeight + rowIndex * layout.rowHeight;
    var cols = layout.columns;

    // Hover background
    if (isHovered) {
      ctx.fillStyle = colors.hoverBg;
      ctx.fillRect(0, y, cols.change.x + cols.change.width + layout.padding, layout.rowHeight);
    }

    var textY = y + layout.rowHeight * 0.72;

    // Metric name (truncate if needed)
    ctx.font = FONTS.metricName;
    ctx.fillStyle = colors.dim;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    var displayName = truncateText(metric.name || '', FONTS.metricName, cols.name.width);
    ctx.fillText(displayName, cols.name.x, textY);

    // Sparkline
    var sparkValues = metric.sparkline_values;
    if (sparkValues && sparkValues.length >= 2) {
      drawSparkline(ctx, sparkValues, cols.spark.x, y + 1, cols.spark.width, layout.rowHeight - 2, colors);
    }

    // Value (right-aligned within value column)
    ctx.font = FONTS.metricValue;
    ctx.fillStyle = colors.text;
    ctx.textAlign = 'right';
    ctx.fillText(metric.formatted_value || '', cols.value.x + cols.value.width, textY);

    // Change (right-aligned)
    ctx.font = FONTS.metricChange;
    if (metric.change_class === 'up') {
      ctx.fillStyle = colors.up;
    } else if (metric.change_class === 'down') {
      ctx.fillStyle = colors.down;
    } else {
      ctx.fillStyle = colors.dim;
    }
    ctx.textAlign = 'right';
    ctx.fillText(changeText, cols.change.x + cols.change.width, textY);

    // Row separator (except last row)
    var totalMetrics = (layout._metricCount !== undefined) ? layout._metricCount : 999;
    if (rowIndex < totalMetrics - 1) {
      drawDottedSeparator(ctx, y + layout.rowHeight, cols.change.x + cols.change.width + layout.padding, colors);
    }
  }

  function drawNewsRow(ctx, story, rowIndex, layout, colors, metaText, isHovered) {
    var y = layout.rowYOffsets ? layout.rowYOffsets[rowIndex] : (layout.headerHeight + rowIndex * layout.rowHeight);
    var rh = layout.rowHeights ? layout.rowHeights[rowIndex] : layout.rowHeight;
    var cols = layout.columns;

    // Hover background
    if (isHovered) {
      ctx.fillStyle = colors.hoverBg;
      ctx.fillRect(0, y, cols.meta.x + cols.meta.width + layout.padding, rh);
    }

    var textY = y + layout.rowHeight * 0.68;

    // Score (right-aligned)
    ctx.font = FONTS.newsScore;
    ctx.fillStyle = colors.score;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'right';
    ctx.fillText(String(story.score || 0), cols.score.x + cols.score.width, textY);

    // Title (truncated) + domain
    ctx.font = FONTS.newsTitle;
    ctx.fillStyle = colors.text;
    ctx.textAlign = 'left';
    var titleText = story.title || '';
    var domainText = story.domain ? ' (' + story.domain + ')' : '';
    var domainWidth = domainText ? measureWidth(domainText, FONTS.newsDomain) : 0;
    var availableForTitle = cols.title.width - domainWidth - 2;
    var displayTitle = truncateText(titleText, FONTS.newsTitle, availableForTitle);
    ctx.fillText(displayTitle, cols.title.x, textY);

    // Domain (after title)
    if (domainText) {
      var titleDisplayWidth = measureWidth(displayTitle, FONTS.newsTitle);
      ctx.font = FONTS.newsDomain;
      ctx.fillStyle = colors.dim;
      ctx.fillText(domainText, cols.title.x + titleDisplayWidth + 1, textY);
    }

    // Meta (time + comments, right-aligned)
    ctx.font = FONTS.newsMeta;
    ctx.fillStyle = colors.dim;
    ctx.textAlign = 'right';

    // Draw time and comments link separately
    var timeText = story.time_ago || '';
    var commentsText = (story.comments || 0) + 'c';
    var commentsWidth = measureWidth(commentsText, FONTS.newsMeta);
    var timeWidth = measureWidth(timeText, FONTS.newsMeta);
    var spacing = measureWidth(' ', FONTS.newsMeta);

    var metaRight = cols.meta.x + cols.meta.width;

    // Comments (right side, link-colored)
    ctx.fillStyle = colors.link;
    ctx.fillText(commentsText, metaRight, textY);

    // Time (left of comments)
    ctx.fillStyle = colors.dim;
    ctx.fillText(timeText, metaRight - commentsWidth - spacing, textY);

    // Row separator (except last row)
    var totalStories = (layout._storyCount !== undefined) ? layout._storyCount : 999;
    if (rowIndex < totalStories - 1) {
      drawDottedSeparator(ctx, y + rh, cols.meta.x + cols.meta.width + layout.padding, colors);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // D.7  CARD RENDER ORCHESTRATORS
  // ═══════════════════════════════════════════════════════════════

  function setupCanvas(canvas, logicalWidth, logicalHeight) {
    var dpr = window.devicePixelRatio || 1;
    var pw = Math.round(logicalWidth * dpr);
    var ph = Math.round(logicalHeight * dpr);
    // Only resize when dimensions change (avoids GPU buffer reallocation on hover)
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
      canvas.style.width = logicalWidth + 'px';
      canvas.style.height = logicalHeight + 'px';
    }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, logicalWidth, logicalHeight);
    return ctx;
  }

  function renderMetricCard(wrapper, group, colors, hoverIndex) {
    var canvas = wrapper.querySelector('canvas');
    var width = wrapper.clientWidth;
    if (width < 1) return;

    var layout = computeMetricCardLayout(group, width);
    wrapper._layout = layout;
    wrapper._data = group;

    var ctx = setupCanvas(canvas, width, layout.totalHeight);

    // Card background
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, width, layout.totalHeight);

    // Header
    drawCardHeader(ctx, group.name, width, layout.headerHeight, colors);

    // Metric rows
    var metrics = group.metrics || [];
    for (var i = 0; i < metrics.length; i++) {
      drawMetricRow(ctx, metrics[i], i, layout, colors, layout.changeTexts[i], i === hoverIndex);
    }

    // Accessibility
    var label = group.name + ': ' + metrics.map(function(m) {
      return m.name + ' ' + (m.formatted_value || '');
    }).join(', ');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', label);
  }

  function renderNewsCard(wrapper, feed, colors, hoverIndex) {
    var canvas = wrapper.querySelector('canvas');
    var width = wrapper.clientWidth;
    if (width < 1) return;

    var layout = computeNewsCardLayout(feed, width);
    var stories = feed.stories || [];
    wrapper._layout = layout;
    wrapper._data = feed;

    var ctx = setupCanvas(canvas, width, layout.totalHeight);

    // Card background
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, width, layout.totalHeight);

    // Header
    drawCardHeader(ctx, feed.name, width, layout.headerHeight, colors);

    // News rows
    for (var i = 0; i < stories.length; i++) {
      drawNewsRow(ctx, stories[i], i, layout, colors, layout.metaTexts[i], i === hoverIndex);
    }

    // Only create/update link overlays on initial render or resize, not on hover
    if (!wrapper._overlaysCreated || wrapper._lastOverlayWidth !== width) {
      createLinkOverlays(wrapper, stories, layout);
      wrapper._overlaysCreated = true;
      wrapper._lastOverlayWidth = width;
    }

    // Accessibility
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', feed.name + ' feed: ' + stories.length + ' stories');
  }

  // ═══════════════════════════════════════════════════════════════
  // D.8  LINK OVERLAYS
  // ═══════════════════════════════════════════════════════════════

  function createLinkOverlays(wrapper, stories, layout) {
    var linksDiv = wrapper.querySelector('.links');
    linksDiv.innerHTML = '';

    for (var i = 0; i < stories.length; i++) {
      var story = stories[i];
      var rowY = layout.rowYOffsets ? layout.rowYOffsets[i] : (layout.headerHeight + i * layout.rowHeight);
      var rh = layout.rowHeights ? layout.rowHeights[i] : layout.rowHeight;

      // Title link
      var a = document.createElement('a');
      a.href = story.url || ('https://news.ycombinator.com/item?id=' + story.id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', story.title);
      a.style.cssText = 'top:' + rowY + 'px;left:' + layout.columns.title.x + 'px;width:' + layout.columns.title.width + 'px;height:' + rh + 'px;';
      linksDiv.appendChild(a);

      // HN comments link
      var hn = document.createElement('a');
      hn.href = 'https://news.ycombinator.com/item?id=' + story.id;
      hn.target = '_blank';
      hn.rel = 'noopener';
      hn.setAttribute('aria-label', (story.comments || 0) + ' comments on Hacker News');
      var commentsWidth = measureWidth((story.comments || 0) + 'c', FONTS.newsMeta);
      var hnLeft = layout.columns.meta.x + layout.columns.meta.width - commentsWidth;
      hn.style.cssText = 'top:' + rowY + 'px;left:' + hnLeft + 'px;width:' + commentsWidth + 'px;height:' + rh + 'px;';
      linksDiv.appendChild(hn);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // D.9  HOVER SYSTEM
  // ═══════════════════════════════════════════════════════════════

  function attachHoverHandlers(wrapper, colors) {
    var canvas = wrapper.querySelector('canvas');
    var currentHover = -1;

    canvas.addEventListener('mousemove', function(e) {
      var layout = wrapper._layout;
      if (!layout) return;

      var rect = canvas.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var row;
      if (layout.rowYOffsets) {
        // Variable-height rows: binary search for the row containing y
        row = -1;
        for (var r = 0; r < layout.rowYOffsets.length; r++) {
          var ry = layout.rowYOffsets[r];
          var rh = layout.rowHeights[r];
          if (y >= ry && y < ry + rh) { row = r; break; }
        }
      } else {
        row = Math.floor((y - layout.headerHeight) / layout.rowHeight);
        var maxRow = wrapper.dataset.cardType === 'metric'
          ? (layout._metricCount || 0) - 1
          : (layout._storyCount || 0) - 1;
        if (row < 0 || row > maxRow) row = -1;
      }

      if (row !== currentHover) {
        currentHover = row;
        if (wrapper.dataset.cardType === 'metric') {
          renderMetricCard(wrapper, wrapper._data, colors, row);
        } else {
          renderNewsCard(wrapper, wrapper._data, colors, row);
        }
      }
    });

    canvas.addEventListener('mouseleave', function() {
      if (currentHover !== -1) {
        currentHover = -1;
        if (wrapper.dataset.cardType === 'metric') {
          renderMetricCard(wrapper, wrapper._data, colors, -1);
        } else {
          renderNewsCard(wrapper, wrapper._data, colors, -1);
        }
      }
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // D.10 RESIZE OBSERVER
  // ═══════════════════════════════════════════════════════════════

  function setupResizeObserver(wrappers, colors) {
    if (!window.ResizeObserver) return;

    var resizeTimeout = null;
    var observer = new ResizeObserver(function() {
      if (resizeTimeout) clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        layoutDashboard(wrappers, DASHBOARD_DATA, 3);
        renderAllCards(wrappers, colors);
      }, 50);
    });

    observer.observe(document.querySelector('.dashboard'));
    return observer;
  }

  // ═══════════════════════════════════════════════════════════════
  // D.11 INITIALIZATION
  // ═══════════════════════════════════════════════════════════════

  function renderAllCards(wrappers, colors) {
    var data = DASHBOARD_DATA;

    wrappers.forEach(function(wrapper) {
      var type = wrapper.dataset.cardType;
      if (type === 'metric') {
        var idx = parseInt(wrapper.dataset.cardIndex, 10);
        var group = data.metric_groups[idx];
        if (group) renderMetricCard(wrapper, group, colors, -1);
      } else if (type === 'news') {
        var feedId = wrapper.dataset.feedId;
        var feed = null;
        for (var i = 0; i < data.feeds.length; i++) {
          if (data.feeds[i].id === feedId) { feed = data.feeds[i]; break; }
        }
        if (feed) renderNewsCard(wrapper, feed, colors, -1);
      }
    });
  }

  function initDashboard() {
    var colors = readColors();
    var wrappers = Array.prototype.slice.call(document.querySelectorAll('.card-wrapper'));

    // Compute masonry layout from measured text, then render canvases
    layoutDashboard(wrappers, DASHBOARD_DATA, 3);
    renderAllCards(wrappers, colors);

    // Attach hover handlers
    wrappers.forEach(function(wrapper) {
      attachHoverHandlers(wrapper, colors);
    });

    // Responsive resize
    setupResizeObserver(wrappers, colors);

    // ═════════════════════════════════════════════════════════════
    // D.12 DEBUG MODE
    // ═════════════════════════════════════════════════════════════

    if (location.search.indexOf('debug=1') !== -1) {
      wrappers.forEach(function(wrapper) {
        var canvas = wrapper.querySelector('canvas');
        var ctx = canvas.getContext('2d');
        var dpr = window.devicePixelRatio || 1;
        var layout = wrapper._layout;
        if (!layout) return;

        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.lineWidth = 0.5;
        ctx.setLineDash([2, 2]);

        // Column boundaries
        var cols = layout.columns;
        Object.keys(cols).forEach(function(key) {
          var col = cols[key];
          ctx.beginPath();
          ctx.moveTo(col.x, 0);
          ctx.lineTo(col.x, layout.totalHeight);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(col.x + col.width, 0);
          ctx.lineTo(col.x + col.width, layout.totalHeight);
          ctx.stroke();
        });

        // Row boundaries
        ctx.strokeStyle = 'rgba(0, 0, 255, 0.2)';
        if (layout.rowYOffsets) {
          // Variable-height rows
          for (var r = 0; r < layout.rowYOffsets.length; r++) {
            var ry = layout.rowYOffsets[r];
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
          // Bottom edge of last row
          if (layout.rowYOffsets.length > 0) {
            var lastIdx = layout.rowYOffsets.length - 1;
            var ry = layout.rowYOffsets[lastIdx] + layout.rowHeights[lastIdx];
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
        } else {
          var rowH = layout.rowHeight;
          var count = layout._metricCount || layout._storyCount || 0;
          for (var r = 0; r <= count; r++) {
            var ry = layout.headerHeight + r * rowH;
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
        }

        ctx.restore();
      });
    }
  }

  // Wait for IBM Plex Mono to load before measuring/rendering
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 8px "IBM Plex Mono"'),
      document.fonts.load('500 10px "IBM Plex Mono"'),
    ]).then(initDashboard).catch(function() {
      // Font load failed (CDN down?), render with fallback monospace
      initDashboard();
    });
  } else {
    // Fallback for browsers without Font Loading API
    window.addEventListener('load', initDashboard);
  }

</script>

</body>
</html>
