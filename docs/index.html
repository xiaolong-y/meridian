ft and Quantinuum.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"c4c6ab72eaad17f4a0e8833008e9a220","author":"Krysta Svore","published_at":"2024-09-10T13:00:00","fetched_at":"2026-04-13 19:11:21","word_count":1303,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"82w","domain":"azure.microsoft.com"},{"id":"56f111ee2310cfc0","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","title":"Introducing two powerful new capabilities in Azure Quantum Elements: Generative Chemistry and Accelerated DFT","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","summary":"Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.&nbsp; Microsoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivi","content":"<p>Introducing two powerful new capabilities in Azure Quantum Elements: Generative Chemistry and Accelerated DFT<br>\nAzure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.<br>\nMicrosoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivity of scientific research and remove barriers on the path to scientific discovery by substantially reducing the effort and expertise needed to perform what were previously daunting tasks. Specifically, these capabilities use Copilot for Azure Quantum, a natural-language interface that can be used by experts and non-experts alike, making Azure Quantum Elements accessible to more people and increasing the speed at which complex scientific problems can be solved.<br>\nUnlocking solutions to our most pressing challenges will require the world’s collective genius, and we’re excited to put new capabilities into the hands of scientists, students, and organizations such as Unilever so that everyone can contribute to making scientific discoveries that change the world for the better.<br>\nSince its launch, Azure Quantum Elements has served an important role in helping scientists achieve breakthroughs that have paved the way for more sustainable batteries and innovations in the pharmaceutical industry. Today, we’re announcing two new purpose-built capabilities in Azure Quantum Elements that will further increase the productivity and accessibility of chemistry and materials science research—Generative Chemistry and Accelerated DFT.<br>\nGenerative Chemistry helps scientists discover novel, synthesizable, and useful molecules quickly<br>\nThere are hundreds of millions of known molecular compounds and substances and many more remain to be discovered. In the field of chemistry, a major challenge is narrowing down an enormous number of candidate molecules to find the few that are best suited for a particular application. This challenge results in the streetlight effect, which is when the vast number of possibilities is reduced to a reasonable size, not based on the properties of the compounds, but by focusing only on those that have been studied previously. Relying on databases to identify suitable compounds limits the search space so that only known compounds are revealed as candidates for specific applications. Generative AI helps bring to light a much larger portion of the estimated 1060 possible combinations of atoms so that scientists are presented with novel candidates that are likely to serve the intended purpose.<br>\nToday, the Azure Quantum team at Microsoft is announcing Generative Chemistry—an upcoming capability that has the potential to greatly simplify this process and help scientists quickly discover and design new compounds with desired properties, thus increasing the productivity of product innovation.<br>\nGenerative Chemistry, which will be available through Azure Quantum Elements private preview, is an end-to-end workflow that involves multiple steps:<br>\n- You provide information on desired molecular characteristics for your specific application. Additionally, you can supply reference molecules if you already have some possibilities in mind.<br>\n- The information you provide is used to generate seed molecules from a dataset—those seed molecules are then used to initiate the guided AI generation of candidate molecules for your application. This is accomplished by applying multiple AI models and a unique methodology to identify new compounds that match your criteria. In this step, you have several options for configuration such as selecting the most relevant generative AI model, specifying the number of molecules to be generated, indicating the key molecular properties of interest, and screening compounds for toxicity.<br>\n- AI-based screening models predict properties of the candidate molecules that are important for real-world applications—such as boiling point, density, or solubility. A feedback loop sends this information back to the guided AI generation (step 2) to modify the selection of candidate molecules. In this step, you also have the option to fine tune the AI models for your specific application.<br>\n- The pool of potential candidates is further narrowed through a step that uses AI-guided synthesis planning to determine the feasibility of making the molecules in a laboratory—this is important because some novel molecules with desired properties may be difficult to synthesize. In this step, synthesis pathways are predicted, and candidate molecules are filtered based on how easy they are to make.<br>\n- Highly accurate HPC simulations are performed on the top candidates. Accelerated DFT can be used to screen candidates for electronic properties such as dielectric constant, ionization potential, and polarizability. AutoRXN predicts chemical stability or reactivity, and it can also be used to provide insights on possible synthesis pathways.<br>\n- You are presented with the final candidate molecules from which you can select the most promising for laboratory synthesis and testing.<br>\nThis entire process takes only days, shaving months or even years off trial-and-error laboratory experiments that were previously required to arrive at this point. Generative Chemistry suggests entirely new compounds and gives scientists the freedom to focus on only those molecules that are fit for the desired purpose—saving time, money, and effort. This new capability will allow for rapid progress in the development of novel therapeutics, sustainable materials, and more.<br>\nAccelerated DFT offers substantial increases in speed compared to other density functional theory codes<br>\nDensity functional theory (DFT) is one of the most popular methods in computational chemistry due to its efficiency and accuracy in modeling quantum-mechanical properties. It allows researchers to simulate and study the electronic structures of atoms, molecules, and nanoparticles as well as surfaces and interfaces, thus predicting properties such as dielectric constant, ionization potential, and polarizability. Scientists can then tailor those properties to optimize them for specific applications.<br>\nAlthough DFT is highly valuable for research and product design, most DFT codes need to be run directly by the user in HPC clusters, which can be a difficult undertaking. Additionally, DFT—when run on traditional HPC hardware—requires substantial compute power and becomes constrained as the molecules being studied or designed increase in complexity and size.<br>\nTo simplify and improve this process, Azure Quantum and Microsoft Research designed and launched Accelerated DFT, a code used to simulate the electronic structure of molecules. Accelerated DFT can determine the properties of molecules with thousands of atoms in a matter of hours. It performs substantially faster than other DFT codes and offers a 20-fold average increase in speed compared to PySCF, a widely used open-source DFT code.1<br>\nThe setup of Accelerated DFT is made simple by providing the software as a service, requiring no code compilation or configuration on the user’s part, and it has a simplified API to streamline the computational process. Furthermore, a Python Software Development Kit (SDK) offers seamless integration into a wide variety of computational chemistry environments, which allows researchers to incorporate DFT calculations into complex chemistry workloads. Accelerated DFT is now available in Azure Quantum Elements private preview; it will also become part of Generative Chemistry.<br>\nAccelerated DFT can substantially expedite research across a wide spectrum of chemical disciplines by employing the power of Azure’s cloud architecture. Accelerated DFT can also produce large and highly accurate datasets of molecular properties that can be used to improve AI models, which require large amounts of training data. By rapidly generating training data, new molecules can be discovered faster, and known molecules can be improved, leading to innovations in therapeutics, sustainable products, and more.<br>\n“We have been very impressed by Accelerated DFT for simulating large systems with range-separated hybrid density functionals, where it speeds up the calculations considerably. Furthermore, the team at Microsoft has been very accommodating in quickly resolving technical challenges for our calculations of an active site of an enzyme.”—Tejs Vegge, Professor, Head of Section for Autonomous Materials Discovery, DTU Energy, Technical University of Denmark.<br>\n“Accelerated DFT has an easy-to-use Python interface, and the acceleration in calculations allows for the efficient use of novel hybrid functionals and a large basis set. Estimating key thermodynamic properties can thus be done in a matter of hours.<br>\nAspenTech is excited to be partnering with Microsoft to evaluate the application of quantum chemistry in our physical properties system for process modeling, especially in our sustainability pathways solutions. We anticipate that working with Accelerated DFT will result in strong use cases for characterizing new molecules and materials that are crucial to decarbonizing and circularizing industrial and consumer materials.”—Heiko Claussen, Senior Vice President, Artificial Intelligence Technology at AspenTech.<br>\nAzure Quantum Elements incorporates quantum computing<br>\nWith the addition of each new feature, Azure Quantum Elements becomes a more effective tool for scientists by harnessing AI, HPC, and emerging hybrid-computing capabilities that bring the power of quantum computing to scientific challenges. Recently, we simulated a chemical catalyst by combining classical supercomputers, AI, and logical qubits created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 hardware. In the coming months, we will introduce advanced logical qubit capabilities from Microsoft and Quantinuum to the private preview of Azure Quantum Elements. This classical-quantum hybrid computing offering follows our quantum computing milestone with Quantinuum in which we created the most reliable logical qubits on record with an error rate 800 times better than that of the corresponding physical qubits.<br>\nAdvances in AI and quantum computing have the potential to help researchers solve global scientific challenges. In the future, we plan to offer a quantum supercomputer that can simulate interactions of molecules and atoms at the quantum level, which is beyond the reach of classical computers. This capability is expected to transform research and innovation across many industries. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about how Azure Quantum Elements is revolutionizing chemistry and materials science<br>\n- Read about our collaboration with Unilever in the Official Microsoft Blog.<br>\n- Explore the product overview of Azure Quantum Elements.<br>\n1 Details on the performance of the private preview of Accelerated DFT can be found in the preprint of Acceleration without Disruption: DFT Software as a Service.<\/p>","content_hash":"a6fbb1579c24d7c640e136044b531c4d","author":"Dr. Nathan Baker","published_at":"2024-06-18T15:00:00","fetched_at":"2026-04-13 19:11:32","word_count":1670,"read_time_minutes":9,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"94w","domain":"azure.microsoft.com"},{"id":"8c89da2ceb6f9d85","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/05/30/in-collaboration-with-microsoft-photonic-demonstrates-quantum-entanglement-at-telecom-wavelengths/","title":"In collaboration with Microsoft, Photonic demonstrates quantum entanglement at telecom wavelengths","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/05/30/in-collaboration-with-microsoft-photonic-demonstrates-quantum-entanglement-at-telecom-wavelengths/","summary":"Photonic executed a teleported CNOT gate between physically separated silicon spin qubits, thus satisfying the first requirement of long-distance quantum communication. In November 2023, Microsoft and Photonic initiated their collaborative effort to advance quantum networking and computing. Today, Photonic announced the capability to successfully transfer quantum information between two physically separated qubits in a point-to-point connection using photons at telecom wavelengths. In a span of ","content":"<p>In collaboration with Microsoft, Photonic demonstrates quantum entanglement at telecom wavelengths<br>\nPhotonic executed a teleported CNOT gate between physically separated silicon spin qubits, thus satisfying the first requirement of long-distance quantum communication.<br>\nIn November 2023, Microsoft and Photonic initiated their collaborative effort to advance quantum networking and computing. Today, Photonic announced the capability to successfully transfer quantum information between two physically separated qubits in a point-to-point connection using photons at telecom wavelengths. In a span of only six months, Photonic was able to achieve this significant scientific milestone on the path to a quantum internet, thereby accomplishing the first of our three collaborative goals and putting theory into practice. Notably, this accomplishment demonstrates that existing telecommunication networks have the potential to enable long-distance quantum communications—the foundation for a quantum internet and distributed quantum computing.<br>\n“This milestone extends the boundaries of quantum computing beyond isolated systems. Effective execution of large-scale quantum algorithms across multiple quantum computers relies heavily on vast amounts of distributed entanglement. Our work with Microsoft and these recent demonstrations emphasize the promise of our unique architectural strategy in addressing the challenge of scaling beyond individual nodes. Despite the significant work that remains, recognizing the critical role of entanglement distribution in the development of scalable quantum technologies is essential.“<br>\n—Dr. Stephanie Simmons, Founder and Chief Quantum Officer of Photonic, and the Co-Chair of Canada’s National Quantum Strategy Advisory Council<br>\nPhotonic’s spin-photon architecture<br>\nQuantum computing uses qubits, or quantum bits, to store and process information. There are multiple types of qubits, one of which is a silicon spin qubit. Photonic’s architecture combines the information-storage and information-processing capabilities of silicon spin qubits with the information-transmission capabilities of photons in a spin-photon interface that can be used for quantum networking and quantum computing. This novel architecture supports quantum communication by operating natively in the O-band of telecom wavelengths, giving it the potential to scale globally by using existing telecom fibers.<br>\nQuantum logic gates<br>\nBoth classical and quantum computers perform operations with logic gates that convert input data into outputs. One type of quantum logic gate is a controlled NOT (CNOT) gate, which operates on two qubits—a control qubit and a target qubit. If the state of the control qubit is 0, then the state of the target qubit remains unchanged. However, when the control qubit’s state is 1, the state of the target qubit is flipped, so that 0 becomes 1, or 1 becomes 0. To perform quantum computation on a large system, logic gates like the CNOT must be implemented within and between modules. As a prerequisite to scalable, long-distance quantum computation, the distribution of entanglement to physically separated quantum systems—known as distributed entanglement—must be achieved.<br>\nDistributed quantum entanglement<br>\nThrough a collaboration with Microsoft, Photonic achieved distributed entanglement between silicon spin qubits housed in separate cryostats, connected by a 40-meter fiber-optic cable. In a sequence of three demonstrations, each building upon the success of the last, the Photonic team:<br>\n- Verified that the photons transmitting the quantum information through the fiber were indistinguishable from one another.<br>\n- Successfully entangled the qubits with these photons.<br>\n- Executed a remote quantum logic gate sequence—for a teleported CNOT gate—between physically separated qubits.<br>\nThis accomplishment showcases the capability to operate a quantum computer in an industrial setting by using teleportation to execute logic gates between qubits in different locations. Entanglement between qubits that are not connected physically, or even located in the same cryostat, paves the way for long-distance communication between quantum computers and is one means to accomplish scaled quantum computing. Potential applications of this technology include securely distributing keys for encrypted data communication and enabling reliable, long-distance quantum networks. This animation demonstrates how the team at Photonic achieved distributed quantum entanglement:<br>\nQuantum networking is not intended to replace classical networks—rather, it will expand their capabilities so that quantum information can be transmitted between quantum or classical endpoints. Now that we have entered Stage 1 of quantum networking, defined as achieving entanglement between two separate quantum devices in a point-to-point connection, the next step is to improve the quality of the entanglement distribution. After doing so, we will work toward entangling additional quantum devices, the achievement of which will mark entry into Stage 2. Ultimately, we aim to achieve Stage 3, which is when long-distance quantum communication will enable a quantum internet.<br>\nIntegrating Photonic’s architecture into Microsoft Azure<br>\nMicrosoft and Photonic will continue their collaboration and work toward integrating quantum-networking capabilities into everyday operating environments through the global infrastructure of the Microsoft Azure cloud. In addition to having applications in quantum networking, Photonic’s architecture is equally applicable to distributed quantum computing. We intend to provide customers of Azure Quantum Elements with an opportunity to access Photonic’s hardware when available, unlocking the potential to solve complex scientific problems.<br>\nBy working together, Microsoft and Photonic are bringing their shared vision—creating and scaling systems that can help solve issues affecting all of humanity—closer to reality. At Microsoft, we are incorporating quantum technologies, as they arise, into our existing cloud high-performance computers to create hybrid systems that—along with the power of AI—have the potential to help scientists create more sustainable products, discover new therapeutics, and more.<br>\nAdvances in AI and quantum computing have the potential to help researchers solve global scientific challenges. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about Photonic’s achievement and how Microsoft intends to apply it<br>\n- Register for the upcoming expert-led panel from the Economist Insights Hour: Commercializing Quantum.<br>\n- Read Photonic’s announcement on achieving distributed quantum entanglement.<br>\n- Read the technical paper that provides more details on this achievement.<br>\n- Sign up to learn more about the private preview of Azure Quantum Elements.<br>\n- Register for upcoming webinars as part of the Future of Cloud series.<\/p>","content_hash":"b4e5c1cf86f9216197c3f30e139d1cf6","author":"Dennis Tom","published_at":"2024-05-30T13:00:00","fetched_at":"2026-04-13 19:11:42","word_count":989,"read_time_minutes":5,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"97w","domain":"azure.microsoft.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-04-13 19:10:04","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"115w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-04-13 19:10:04","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"120w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-04-13 19:10:04","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"121w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the communi .com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":null,"content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-04-13 19:10:04","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"127w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":null,"content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-04-13 19:10:04","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"127w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":null,"content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-04-13 19:10:04","word_count":87,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"128w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":null,"content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-04-13 19:10:04","word_count":75,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"129w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":null,"content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-04-13 19:10:05","word_count":86,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"131w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"2b1b4a6dc4ac6b5f","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17917","title":"How I learned to stop worrying and…no, I’ve always adored entropy","url":"https://quantumfrontiers.com/2026/04/12/how-i-learned-to-stop-worrying-andno-ive-always-adored-entropy/","summary":"When I was pursuing a PhD at Caltech, so was my friend Jeremy. He used to throw a dinner party every few months. The email invitations welcomed friends to partake of his cooking and, if we wished, to help him cook. I didn’t help cook; but, when I arrived, the mess of pots and pans drew me to the kitchen like vinegar drawing a pathological fly. I couldn’t sit still while cookware needed cleaning, so I scrubbed and rinsed the pans and spoons and bowls. Jeremy, an applied-physics student, commented","content":"<p>When I was pursuing a PhD at Caltech, so was my friend Jeremy. He used to throw a dinner party every few months. The email invitations welcomed friends to partake of his cooking and, if we wished, to help him cook. I didn’t help cook; but, when I arrived, the mess of pots and pans drew me to the kitchen like vinegar drawing a pathological fly. I couldn’t sit still while cookware needed cleaning, so I scrubbed and rinsed the pans and spoons and bowls. Jeremy, an applied-physics student, commented on my adeptness at decreasing entropy.<br>\nIt’s the story of my life, I replied.<br>\nIn fourth grade, my classmates and I cleaned our desks every Friday afternoon. Once a student finished, my teacher dismissed him or her onto the playground. My neighbor’s desk horrified me like the disaster in a hurricane’s wake, so I neatened his desk after finishing with mine.1 Another friend requested the same favor. A third classmate offered to pay me for cleaning his desk, but I’d have undertaken the chore for its own sake. Ordering the world offered me fulfillment.<br>\nFrom cleaning a fourth-grade desk, I progressed to pursuing a PhD in theoretical physics. The two pursuits might seem to resemble each other no more than Dr. Jekyll and Mr. Hyde; yet, to me, the path between them is but a step. I trained as a theoretical physicist because I love organizing ideas. Caltech paid me to build models, propose definitions and theorems, and structure proofs—to dream up ideas and identify the optimal arrangements for them. I needed that pay, being an adult, as I hadn’t needed my fourth-grade classmate’s desk-cleaning fee. Yet I organized ideas for the same reason that drove me to organize my neighbor’s notebooks.<br>\nMany people have called entropy a measure of disorder. To see why, imagine that Jeremy’s crew has used thirty utensils while cooking. The chefs can have scattered the utensils across the kitchen in many ways: they may have dropped forks on the floor, left spoons in the sink, arranged spatulas on the drying rack, or filled a vase with knives like a modern-art bouquet. In few of these configurations do the forks lie in their compartment of the utensil drawer, the spoons lie in their compartment, etc. We call such configurations neat. Most of the other configurations, we call messy.<br>\nA system’s entropy is the number of configurations consistent with known large-scale properties of the system, such as the number of forks.2 More configurations are consistent with messiness (and a fixed number of forks and so on) than with neatness (and the same number of forks and so on). Messiness tends to correlate with high entropy. People often say, therefore, that entropy quantifies messiness. Hence Jeremy’s complimenting me on my decreasing of entropy.<br>\nJeremy’s dinner parties came to mind as I read the book The Mattering Instinct, published by Rebecca Newberger Goldstein this January. Rebecca is a philosopher of science and a writer. I had the good fortune to meet her through my undergraduate mentor Marcelo Gleiser, who’s had another cameo or two on Quantum Frontiers. Rebecca’s latest book covers what she calls the mattering instinct: the longing to know that we matter.<br>\nWe spend scads of energy and time on securing our “survival and flourishing,” as Rebecca says. We feed ourselves; work to earn money to purchase food; clean, shelter, and clothe ourselves; ingrain ourselves in societies that offer some degree of security; and more. Do we deserve all this effort? We long for assurance that, in the immortal words of L’Oreal, we’re worth it.<br>\nSurvival and flourishing, Rebecca writes, requires us to decrease entropy. Every closed, isolated system’s entropy increases or remains constant, according to the second law of thermodynamics. Entropy increases as a system becomes more uniform, loosely speaking. The system’s particles spread out across space, these particles’ temperature comes to equal those particles’ temperature, and so on. In contrast, your body exists because its particles clump together in a certain shape consistently. You withstand heat waves and snow because homeostasis maintains your temperature despite your environment’s temperature. You keep your body’s entropy low to survive. Rebecca therefore casts us as fighting entropy.<br>\nAs a thermodynamicist, I agree with Rebecca. Yet I also adore entropy. It helps explain why time flows, quantifies uncertainty, and determines the maximal efficiencies with which we can perform tasks such as communication. What versatility and richness! Entropy also embodies tension and subtlety: its mathematical definition looks obscure at first glance, yet entropy helps explain familiar phenomena such as aging. For these reasons, before beginning my PhD, I told a potential advisor that I could imagine devoting the next five years of my life to entropy.<br>\nI therefore aspire to rehabilitate entropy’s reputation. Novelist Terry Pratchett endeared mortality to millions of readers through anthropomorphism. His character Death, a mainstay of the Discworld series of novels, elicits empathy and fondness. I won’t anthropomorphize entropy here,3 but I aim to replace conflict with cooperation in the narrative above. To survive and flourish, I hold, we partner with entropy. How? We create oodles of entropy in our environments. This entropy increase offsets the entropy decrease that supports life.<br>\nFor example, imagine working at a desalination plant. You’d process high-entropy water throughout which salt has spread. You’d concentrate the salt in a tiny region, reducing the water’s entropy. This reduction, producing fresh water, could support your city’s drinking, cooking, and toothbrushing needs.<br>\nTo reduce the water’s entropy, you’d create loads more entropy. You’d eat breakfast before work, consuming energy stored neatly in your waffle’s chemical bonds. Your body would later break the bonds, releasing the energy. Some energy would power your muscles, so you could program the desalination system, test its output, etc. But much of the chemical energy would transform into heat radiated by your body. The heat would warm up the air molecules around you, magnifying their random jigglings and jostlings. You’d increase the entropy of the air—your environment—to decrease the water’s entropy. The air’s entropy increase would outweigh the water’s entropy decrease.<br>\nOrganisms survive and flourish by producing entropy in their environments. In fact, organisms have a knack for generating entropy. Entropy and life thereby further each other. A glass-half-full thinker could conclude that we partner with entropy.<br>\nSo did I partner with entropy as a PhD student, applying it to solve problems in quantum information theory and thermodynamics. So did I partner with entropy in fourth grade and at Jeremy’s apartment, deriving satisfaction from my cleaning. Rebecca would call these activities’ ultimate aim (beyond the aim of, e.g., not sitting beside a pigsty in fourth grade) mattering. She writes that we reduce entropy (within our immediate vicinities) to satisfy the mattering instinct. Rebecca’s proposition describes my behaviors with uncanny precision, I realized upon reading her book.<br>\nWhich I’ve now finished. So pardon me while I return to washing forks in the quantum kitchen of the universe.<br>\nWith thanks to Jeremy for his friendship…and food.<br>\n1I also ensured that my neighbor brought home, every afternoon, the sweater he’d brought to school that morning. Before I took charge, he’d ended up with three forgotten sweaters crammed into his cubby.<br>\n2At least, one entropy is. Many other entropies exist.<br>\n3If you anthropomorphize entropy elsewhere, let me know.<\/p>","content_hash":"fa0db26cbcb786f59f298f893b38d64a","author":"Nicole Yunger Halpern","published_at":"2026-04-13T00:06:06","fetched_at":"2026-04-13 19:10:05","word_count":1213,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"19h","domain":"quantumfrontiers.com"},{"id":"43d49b625c6b6a0c","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17937","title":"Unleashing the Advantage of Quantum AI","url":"https://quantumfrontiers.com/2026/04/09/unleashing-the-advantage-of-quantum-ai/","summary":"As experimental capabilities advance rapidly, the quantum computing community faces a critical elephant in the room: What will these quantum machines eventually be useful for? Will they deliver the promised broad societal impact, or will they remain highly specialized devices for exotic tasks known only to the experts? The elephant in the room Despite decades of effort, conclusive evidence of large quantum advantage in real-world applications remains confined to a few niche domains, such as simu","content":"<p>As experimental capabilities advance rapidly, the quantum computing community faces a critical elephant in the room: What will these quantum machines eventually be useful for? Will they deliver the promised broad societal impact, or will they remain highly specialized devices for exotic tasks known only to the experts?<br>\nThe elephant in the room<br>\nDespite decades of effort, conclusive evidence of large quantum advantage in real-world applications remains confined to a few niche domains, such as simulating quantum materials and cryptanalysis. These problems are either inherently quantum to begin with, or they possess specialized mathematical structure that quantum algorithms can easily exploit. But it seems unlikely that such structures appear broadly in everyday life.<br>\nIndeed, most applications of modern computation hinge on the processing of massive, noisy classical data, generated at an unprecedented pace across society. That is the driving force behind the overwhelming success of machine learning and AI. Since the data originates from the macroscopic classical world, there is no obvious reason it should exhibit the delicate, specialized structures that quantum computers require. To playfully adapt Richard Feynman’s famous quote: We live in an effectively classical world, dammit, and maybe classical computers and AI already suffice for most of our problems. (For those unfamiliar, Feynman originally quipped: “Nature isn’t classical, dammit, and if you want to make a simulation of nature, you’d better make it quantum mechanical.”)<br>\nThe central challenge<br>\nTo truly unlock the power of a quantum computer, quantum algorithms typically need to access data in quantum superposition, processing many different samples simultaneously in different branches of the quantum multiverse. To use technical jargon, this is called querying a quantum oracle. But in reality, the classical data samples that we want to process are generated from everyday activities in a classical world, and we can only access them one at a time.<br>\nThink of the movie reviews you scroll through on a streaming platform. How would you read the plain-text reviews from a million different users all at once in a quantum superposition? This bottleneck—the challenge of efficiently accessing the classical world in quantum superposition—is known as the data loading problem. It has arguably been one of the main obstacles to achieving broadly applicable quantum advantage.<br>\nSketching a quantum oracle<br>\nIn this new work [1], we provide a solution to this seemingly impossible challenge. We develop a framework, called quantum oracle sketching, that enables us to access the classical world in quantum superposition in an optimal way. Importantly, it automatically handles the noise and correlations in the data, and natively supports flexible data structures like vectors and matrices that enable machine learning applications.<br>\nThe core mechanism relies on processing data as a continuous stream. For each classical data sample we observe, we apply a carefully designed, small quantum rotation to our system. By sequentially accumulating these quantum rotations, we incrementally build up an accurate approximation of the target quantum oracle, which can then be used in any quantum algorithm for data processing. Because every data sample is processed once and immediately discarded, we completely eliminate the massive memory overhead typically required to store the dataset. The fundamental price to pay for assembling quantum queries from classical data lies in the sample complexity: our algorithm consumes a number of samples that scales quadratically with the number of quantum queries we need to make. We show that this rate is optimal and fundamentally arises from the quadratic relationship between quantum amplitudes and classical probabilities governed by the Born rule.<br>\nWith the data successfully loaded into the quantum computer, the final challenge is to efficiently read out classical results. To address this, we develop an efficient measurement protocol called interferometric classical shadow. Combined with quantum oracle sketching, it allows us to circumvent the data loading and readout bottleneck to construct exponentially compact classical models from massive classical data with quantum technology.<br>\nExponential quantum advantage in machine learning<br>\nUsing this new approach, we are finally able to find exponential quantum advantage in processing classical data and machine learning. We rigorously prove that a small quantum computer can perform large-scale classification and dimensionality reduction on massive classical data by processing samples on the fly. In contrast, any classical machine achieving the same prediction performance requires exponentially larger size. When the classical machine does not have the required exponentially large memory size, it needs super-polynomially more samples and time relative to our protocol running on a quantum device. Remarkably, this illustrates that quantum technology enables us to construct compact and accurate classical models out of classical data, which is impossible with classical machines alone unless given exponentially larger memory.<br>\nThe true scale of this exponential memory advantage is staggering. A quantum processor with 300 logical qubits can outperform a classical machine built from every atom in the observable universe. Of course, to actually see such a comical contrast, we would also need universe-scale datasets and processing time.<br>\nTo contextualize these results in realistic scenarios, consider a large-scale scientific experiment, like a large particle collider. Each experimental run generates a colossal volume of data. With a quantum computer, we can keep squeezing all the data into this tiny quantum chip to perform downstream machine learning tasks such as classification and dimensionality reduction. But if we only have classical machines, we would need to build massive, energy-consuming data centers to store the raw data to match the performance. Without this massive memory overhead, classical machines simply couldn’t extract the same clear signals from a single run, forcing us to repeat the massive, expensive experiment many more times to compensate. To put this into perspective, the Large Hadron Collider (LHC) at CERN generates petabytes (millions of gigabytes) of data per hour, but the data storage bottlenecks force researchers to discard all but a tiny fraction—retaining perhaps only one in a hundred thousand events.<br>\nWe validated these quantum advantages on real-world datasets, including movie review sentiment analysis and single-cell RNA sequencing. In these public datasets, we demonstrate four to six orders of magnitude (ten thousand to a million times) reduction in memory size with fewer than 60 logical qubits. Given the rapid advancements in high-rate quantum error correction codes and experimental techniques, quantum computers capable of demonstrating such applications are foreseeable in the near future. Crucially, the quantum advantage we propose likely carries a clearer positive impact for society and likely arrives sooner than the applications in cryptanalysis, where the current best estimate requires a thousand logical qubits.<br>\nTowards Quantum AI<br>\nOur results provide strong evidence that the utility of quantum computers extends far beyond specialized tasks, opening a path for quantum computers to be broadly useful in our everyday life. Rather than fearing that classical AI will “eat quantum computing’s lunch,” we now have rigorous evidence pointing towards a much more exciting prospect: quantum-enhanced AI overpowering classical AI.<br>\nOf course, there is still a long way to go towards the dream of quantum intelligence. Our current results establish the provable supremacy of quantum machines in foundational machine learning tasks, such as high-dimensional linear classification and dimensionality reduction. They do not yet imply immediate utility for modern generative AI such as large language models.<br>\nThat said, our results give me a strong feeling that we are living in an age strikingly reminiscent of the traditional machine learning era—an age dominated by support vector machines and random forests; an age when we relied on rigorous statistical analysis because we lacked the computational resources for large-scale heuristic exploration; an age that ultimately heralded the birth of deep learning and the AI revolution. Today, quantum AI seems to sit at a similar historical position. I cannot wait to see what quantum AI will become once we are capable of unconstrained heuristic exploration on large-scale fault-tolerant quantum computers.<br>\nTo accelerate this dawn of quantum AI, we invite physicists, computer scientists, developers, and machine learning practitioners to join our efforts and help us push the boundaries of what quantum AI can achieve. To bridge the gap between abstract quantum theory and hands-on machine learning practice, we are open-sourcing our core framework. Our numerical implementation of quantum oracle sketching is built in JAX, natively supporting GPU/TPU acceleration and automatic differentiation to integrate nicely with modern machine learning pipelines. Check out the code, run the simulations, and help us shape the future of quantum AI at github.com/haimengzhao/quantum-oracle-sketching!<br>\nReferences<br>\n[1]. Haimeng Zhao, Alexander Zlokapa, Hartmut Neven, Ryan Babbush, John Preskill, Jarrod R. McClean, and Hsin-Yuan Huang. Exponential quantum advantage in processing massive classical data, arXiv:2604.07639, 2026.<\/p>","content_hash":"020cf1275e987782d074dba4a9922f6a","author":"Haimeng Zhao","published_at":"2026-04-10T01:43:44","fetched_at":"2026-04-13 19:10:05","word_count":1410,"read_time_minutes":8,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"3d","domain":"quantumfrontiers.com"},{"id":"f681695608c41f13","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9668","title":"Before we start on quantum","url":"https://scottaaronson.blog/?p=9668","summary":"Imagine that every week for twenty years, people message you asking you to comment on the latest wolf sighting, and every week you have to tell them: I haven’t seen a wolf, I haven’t heard a wolf, I believe wolves exist but I don’t yet see evidence of them anywhere near our town. Then one evening, you hear a howl in the distance, and sure enough, on a hill overlooking the town is the clear silhouette of a large wolf. So you point to it — and all the same people laugh and accuse you of “crying wo","content":"<p>Before we start on quantum<br>\nImagine that every week for twenty years, people message you asking you to comment on the latest wolf sighting, and every week you have to tell them: I haven’t seen a wolf, I haven’t heard a wolf, I believe wolves exist but I don’t yet see evidence of them anywhere near our town.<br>\nThen one evening, you hear a howl in the distance, and sure enough, on a hill overlooking the town is the clear silhouette of a large wolf. So you point to it — and all the same people laugh and accuse you of “crying wolf.”<br>\nNow you know how it’s been for me with cryptographically relevant quantum computing.<br>\nI’ve been writing about QC on this blog for a while, and have done hundreds of public lectures and interviews and podcasts on the subject. By now, I can almost always predict where a non-expert’s QC question is going from its first few words, and have a well-rehearsed answer ready to go the moment they stop talking. Yet sometimes I feel like it’s all for naught.<br>\nOnly today did it occur to me that I should write about something more basic. Not quantum computing itself, but the habits of mind that seem to prevent some listeners from hearing whatever I or other researchers have to tell them about QC. The stuff that we’re wasting our breath if we don’t get past.<br>\nWhich habits of mind am I talking about?<br>\n- The Tyranny of Black and White. Hundreds of times, I’ve answered someone’s request to explain QC, only to have them nod impatiently, then interrupt as soon as they can with: “So basically, the take-home message is that quantum is coming, and it’ll change everything?” Someone else might respond to exactly the same words from me with: “So basically, you’re saying it’s all hype and I shouldn’t take any of it seriously?” As in my wolf allegory, the same person might even jump from one reaction to the other. Seeing this, I’ve become a fervent believer in horseshoe theory, in QC no less than in politics. Which sort of makes sense: if you think QCs are “the magic machines of the future that will revolutionize everything,” and then you learn that they’re not, why wouldn’t you jump to the opposite extreme and conclude you’ve been lied to and it’s all a scam?<br>\n- The Unidimensional Hype-Meter. “So … [long, thoughtful pause] … you’re actually telling me that some of what I hear about QC is real … but some of it is hype? Or—yuk yuk, I bet no one ever told you this one before—it’s a superposition of real and hype?” OK, that’s better. But it’s still trying to project everything down onto a 1-dimensional subspace that loses almost all the information!<br>\n- Words As Seasoning. I often get the sense that a listener is treating all the words of explanation—about amplitudes and interference, Shor versus Grover, physical versus logical qubits, etc.—as seasoning, filler, an annoying tic, a stalling tactic to put off answering the only questions that matter: “is Quantum real or not real? If it’s real, when is it coming? Which companies will own the Quantum space?” In reality, explanations are the entire substance of what I can offer. For my experience has consistently been that, if someone has no interest in learning what QC is, which classes of problems it helps for, etc., then even if I answer their simplistic questions like “which QC companies are good or bad?,” they won’t believe my answers anyway. Or they’ll believe my answers only until the next person comes along and tells them the opposite.<br>\n- Black-Boxing. Sometimes these days, I’ll survey the spectacular recent progress in fault-tolerance, 2-qubit gate fidelities, programmable hundred-qubit systems, etc., only to be answered with a sneer: “What’s the biggest number that Shor’s algorithm has factored? Still 15 after all these years? Haha, apparently the emperor has no clothes!” I’ve commented that this is sort of like dismissing the Manhattan Project as hopelessly stalled in 1944, on the ground that so far it hasn’t produced even a tiny nuclear explosion. Or the Apollo program in 1967, on the ground that so far it hasn’t gotten any humans even 10% of the way to the moon. Or GPT in 2020, on the ground that so far it can’t even do elementary-school math. Yes, sometimes emperors are naked—but you can’t tell until you actually look at the emperor! Engage with the specifics of quantum error correction. If there’s a reason why you think it can’t work beyond a certain scale, say so. But don’t fixate on one external benchmark and ignore everything happening under the hood, if the experts are telling you that under the hood is where all the action now is, and your preferred benchmark is only relevant later.<br>\n- Questions with Confused Premises. “When is Q-Day?” I confess that this question threw me for a loop the first few times I heard it, because I had no idea what “Q-Day” was. Apparently, it’s the single day when quantum computing becomes powerful enough to break all of cryptography? Or: “What differentiates quantum from binary?” “How will daily life be different once we all have quantum computers in our homes?” Try to minimize the number of presuppositions.<br>\n- Anchoring on Specific Marketing Claims. “What do you make of D-Wave’s latest quantum annealing announcement?” “What about IonQ’s claim to recognize handwriting with a QC?” “What about Microsoft’s claim to have built a topological qubit?” These questions can be fine as part of a larger conversation. Again and again, though, someone who doesn’t know the basics will lead with them—with whichever specific, contentious thing they most recently read. Then the entire conversation gets stuck at a deep node within the concept tree, and it can’t progress until we backtrack about five levels.<br>\nAnyway—sorry for yet another post of venting and ranting. Maybe this will help:<br>\nThe wise child asks, “what are the main classes of problems that are currently known to admit superpolynomial quantum speedups?” To this child, you can talk about quantum simulation and finding hidden structures in abelian and occasionally nonabelian groups, as well as Forrelation, glued trees, HHL, and DQI—explaining how the central challenge has been to find end-to-end speedups for non-oracular tasks.<br>\nThe wicked child asks, “so can I buy a quantum computer right now to help me pick stocks and search for oil and turbocharge LLMs, or is this entire thing basically a fraud?” To this child you answer: “the quantum computing people who seek you as their audience are frauds.”<br>\nThe simple child asks, “what is quantum computing?” You answer: “it’s a strange new way of harnessing nature to do computation, one that dramatically speeds up certain tasks, but doesn’t really help with others.”<br>\nAnd to the child who doesn’t know how to ask—well, to that child you don’t need to bring up quantum computing at all. That child is probably already fascinated to learn classical stuff.<\/p>","content_hash":"72007a1f3676037b97132297c7112642","author":"Scott","published_at":"2026-04-07T07:51:11","fetched_at":"2026-04-13 19:10:00","word_count":1170,"read_time_minutes":6,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"6d","domain":"scottaaronson.blog"},{"id":"c438f8ead87c93df","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9665","title":"Quantum computing bombshells that are not April Fools","url":"https://scottaaronson.blog/?p=9665","summary":"For those of you who haven&#8217;t seen, there were actually two “bombshell” QC announcements this week. One, from Caltech, including friend-of-the-blog John Preskill, showed how to do quantum fault-tolerance with lower overhead than was previously known, by using high-rate codes, which could work for example in neutral-atom architectures (or possibly other architectures that allow nonlocal operations, like trapped ions). The second bombshell, from Google, gave a lower-overhead implementation of","content":"<p>Quantum computing bombshells that are not April Fools<br>\nFor those of you who haven’t seen, there were actually two “bombshell” QC announcements this week. One, from Caltech, including friend-of-the-blog John Preskill, showed how to do quantum fault-tolerance with lower overhead than was previously known, by using high-rate codes, which could work for example in neutral-atom architectures (or possibly other architectures that allow nonlocal operations, like trapped ions). The second bombshell, from Google, gave a lower-overhead implementation of Shor’s algorithm to break 256-bit elliptic curve cryptography.<br>\nNotably, out of an abudance of caution, the Google team chose to “publish” its result via a cryptographic zero-knowledge proof that their circuit exists (so, without revealing the details to attackers). This is the first time I’ve ever seen a new mathematical result actually announced that way, although I understand that there’s precedent in the 1500’s, when mathematicians would (for example) prove their ability to solve quartic equations by challenging their rivals to duels. I’m not sure how much it will actually help, as once other groups know that a smaller circuit exists, it might be only a short time until they’re able to find it as well.<br>\nNeither of these results change the basic principles of QC that we’ve known for decades, but they do change the numbers.<br>\nWhen you put both of them together, Bitcoin signatures for example certainly look vulnerable to quantum attack earlier than was previously known! In particular, the Caltech group estimates that a mere 25,000 physical qubits might suffice for this, where a year ago the best estimates were in the millions. How much time will this save — maybe a year? Subtracting, of course, off a number of years that no one knows.<br>\nIn any case, these results provide an even stronger impetus for people to upgrade now to quantum-resistant cryptography. They—meaning you, if relevant—should really get on that!<br>\nWhen I got an early heads-up about these results—especially the Google team’s choice to “publish” via a zero-knowledge proof—I thought of Frisch and Peierls, calculating how much U-235 was needed for a chain reaction in 1940, but not publishing it, even though the latest results on nuclear fission had been openly published just the year prior. Will we, in quantum computing, also soon cross that threshold? But I got strong pushback on that analogy from the cryptography and cybersecurity people who I most respect. They said: we have decades of experience with this, and the answer is that you publish. And, they said, if publishing causes people still using quantum-vulnerable systems to crap their pants … well, maybe that’s what needs to happen right now.<br>\nNaturally, journalists have been hounding me for comments, though it was the worst possible week, when I needed to host like four separate visitors in Austin. I hope this post helps! Please feel free to ask questions or post further details in the comments.<br>\nAnd now, with no time for this blog post to leaven and rise, I need to go home for my family’s Seder. Happy Passover!<\/p>","content_hash":"bb5c09559d708b61528f47f936ea5498","author":"Scott","published_at":"2026-04-01T21:26:47","fetched_at":"2026-04-13 19:10:00","word_count":504,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"154b16074c21acc9","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9656","title":"Movie Review: “The AI Doc”","url":"https://scottaaronson.blog/?p=9656","summary":"Yesterday Dana, the kids, and I went to the theater to watch The AI Doc: Or How I Became An Apocaloptimist, the well-reviewed new documentary about whether AGI will destroy the world. This was surely the weirdest family movie night we’ve ever done. Firstly, because I personally know probably half of the many people interviewed in the film, from Eliezer Yudkowsky to Ajeya Cotra to Liv Boeree to Daniel Kokotajlo to Ilya Sutskever to Jan Leike to Yoshua Bengio to Shane Legg to Sam Altman and Dario ","content":"<p>Movie Review: “The AI Doc”<br>\nYesterday Dana, the kids, and I went to the theater to watch The AI Doc: Or How I Became An Apocaloptimist, the well-reviewed new documentary about whether AGI will destroy the world. This was surely the weirdest family movie night we’ve ever done. Firstly, because I personally know probably half of the many people interviewed in the film, from Eliezer Yudkowsky to Ajeya Cotra to Liv Boeree to Daniel Kokotajlo to Ilya Sutskever to Jan Leike to Yoshua Bengio to Shane Legg to Sam Altman and Dario Amodei. But more importantly, because this is a documentary that repeatedly, explicitly, earnestly raises the question of whether children now alive will make it to adulthood, before unaligned AI kills them and everyone else. So pass the popcorn, kiddos!<br>\n(We did have popcorn. And if the kids were scared — well, I figured we can’t shield them forever from the great questions of the world they’re entering. But actually they didn’t seem especially scared.)<br>\nI thought that the filmmaker, Daniel Roher, did about as good a job as can be done, in fitting into a 100-minute film a question that honestly seems too gargantuan for any film — the question of the future of life on earth. He tries to hear out every faction: first the AI existential risk people, then the AI optimists and accelerationists like “Beff Jezos,” then the “stochastic parrot” / “current harms” people like Emily Bender and Timnit Gebru, and finally the AI company CEOs (Altman, Amodei, and Hassabis were the three who agreed to be interviewed), with Yuval Noah Harari showing up from time to time to insert deepities.<br>\nRoher plays the part of an anxious, curious, uninformed everyman, who finds each stance to be plausible enough while he’s listening to it, and who mostly just wants to know what kind of world his soon-to-be-born son (about whom we get regular updates) will grow up in.<br>\nI didn’t think all the interviewees were equally cogent or equally deserved a hearing. But if any viewers were actually new to AI discourse, rather than marinated in it like me, the film would serve for them as an excellent introduction to the parameters of current debate (for better or worse) and to some of the leading representatives of each camp.<br>\nIf I had to summarize Roher’s conclusion, it would be something like: go ahead, enjoy your life, have children if you want, but understand that now is a time of world-historical promise and peril much like the early nuclear age, so pay attention, and demand of your elected leaders that they ensure that AGI is developed in a pro-human direction, because tech leaders (even the relatively well-intentioned ones) are trapped in a race to the bottom and can’t get out on their own. Honestly, I’d have a pretty hard time improving on that message.<br>\nThe main thing that gave me pause about the film was not on the screen but in the theater, which was nearly empty. For the film to serve its purpose, a significant fraction of the world will need to see and discuss it, either in the theater or on streaming. So, y’know, it’s still playing.<br>\nFor whatever it’s worth, here were my wife Dana’s comments: “The biggest flaw of this movie is that Daniel Roher never breaks out of his ‘clueless everyman’ character, even when he’s talking to the most important people in AI. He wastes an opportunity to ask them non-superficial questions, questions deeper than ‘so, uh, are we all gonna die or not?'”<br>\nAnd here were my 13-year-old daughter’s comments: “So many of the people they interviewed seemed like hippies, who don’t know what AI will do any more than I know!” Also, after Daniel Roher wishes Sam Altman mazel tov on his forthcoming baby: “Sam Altman is Jewish?!”<br>\nAnd here were my 9-year-old son’s comments: “I thought this would be a movie, where AI would try to take over and the humans would fight back! I had no idea it would just be people talking about it. The documentary kind of movie is so, so, so boring.”<\/p>","content_hash":"a72081d2ff4424d77337b75a185db752","author":"Scott","published_at":"2026-03-29T21:56:12","fetched_at":"2026-04-13 19:10:00","word_count":688,"read_time_minutes":4,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"df4e003a3ec454ca","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9650","title":"My theoretical computer science notes from Epsilon Camp","url":"https://scottaaronson.blog/?p=9650","summary":"Last summer, I was privileged to teach a two-week course on theoretical computer science to exceptional 11- and 12-year-olds at Epsilon Camp, held at Washington University in St. Louis. The course was basically a shorter version of the 6.045 course that I used to teach to undergrads at MIT. I was at Epsilon Camp to accompany my son Daniel, who attended a different course there, for the 7- and 8-year-olds. So they got me to teach while I was there. Teaching at Epsilon was some of the hardest work","content":"<p>My theoretical computer science notes from Epsilon Camp<br>\nLast summer, I was privileged to teach a two-week course on theoretical computer science to exceptional 11- and 12-year-olds at Epsilon Camp, held at Washington University in St. Louis. The course was basically a shorter version of the 6.045 course that I used to teach to undergrads at MIT.<br>\nI was at Epsilon Camp to accompany my son Daniel, who attended a different course there, for the 7- and 8-year-olds. So they got me to teach while I was there.<br>\nTeaching at Epsilon was some of the hardest work I’ve done in years: I taught two classes, held office hours, and interacted with or supervised students for 6-7 hours per day (compared to ~4 hours per week as a professor), on top of being Daniel’s sole caregiver, on top of email and all my other normal responsibilities. But it was also perhaps the most extraordinary teaching I’ve ever done: during “lecture,” the kids were throwing paper planes, talking over and interrupting me every ten seconds, and sometimes getting in physical fights with each other. In my ~20 years as a professor, this was the first time that I ever needed to worry about classroom discipline (!). It gave me newfound respect for what elementary school teachers handle every day.<br>\nBut then, when I did have the kids’ attention, they would often ask questions or make observations that I would’ve been thrilled to hear from undergrads at UT Austin or MIT. Some of these kids, I felt certain, can grow up if they want to be world-leading mathematicians and physicists and computer scientists, Terry Taos and Ed Wittens of their generation. Or at least, that’ll be true if AI isn’t soon going to outperform the top human scientists at their own game, a prospect that of course casts a giant shadow not only over Epsilon Camp but over our entire enterprise. But enough about the future. For now I can say: it was a privilege of a lifetime to teach these kids, to be the one who first introduced them to theoretical computer science.<br>\nOr at least, the one who first systematically introduced them. As I soon realized, there was no topic I could mention—not the halting problem or the Busy Beaver function, not NP-completeness or Diffie-Hellman encryption—that some of these 11-year-olds hadn’t previously seen, and that they didn’t want to interrupt me to share everything they already knew about. Rather than fighting that tendency, I smiled and let them do this. While their knowledge was stunningly precocious, it was also fragmentary and disjointed and weirdly overindexed on examples rather than general principles. So fine, I still had something to teach them!<br>\nComing to Epsilon Camp was also an emotional experience for me. When I was 15, I attended Canada/USA Mathcamp 1996, the first year that that camp operated. I might not have gone into research otherwise. Coming from a public high school—from the world of English teachers who mainly cared whether you adhered to the Five Paragraph Format, and chemistry teachers who’d give 0 on right answers if you didn’t write “1 mol / 1 mol” and then cross off both of the moles—I was suddenly thrust, sink or swim, into a course on elliptic curves taught by Ken Ribet, who’d played a major role in the proof of Fermat’s Last Theorem that had just been completed, and a talk on algorithms and complexity by Richard Karp himself, and lectures on number theory by Richard Guy, who had stories from when he knew G. H. Hardy.<br>\nBack when I was 15, I got to know George Rubin Thomas, the founding director of Mathcamp … and then, after 29 years, there he was again at Epsilon Camp—the patriarch of a whole ecosystem of math camps—and not only there, but sitting in on my course. Also at Epsilon Camp, unexpectedly, was a woman who I knew well back when we were undergrads at Cornell, both of took taking the theoretical computer science graduate sequence, but who I’d barely seen since. She, as it turned out, was accompanying her 8-year-old son, who got to know my 8-year-old. They played together every day and traded math facts.<br>\nIt occurred to me that the course I taught, on theoretical computer science, was one of the most accessible I’ve ever done, and therefore more people might be interested. So I advertised on this blog for someone to help me LaTeX up the notes for wider distribution. I was thrilled to find a talented student to volunteer. Alas, because of where that student lives, he needs to stay anonymous for now. I thank him, pray for his safety, and hope to be able to reveal his name in the future. I’m also thrilled to have gotten three great high school students—Ian Ko, Tzak Lau, and Sunetra Rao—to help with the figures. Thanks to them as well.<br>\nYou can read the notes here [59 pages, PDF]<br>\nIf you’re curious, here’s the table of contents:<br>\n- Lecture 1: Bits<br>\n- Lecture 2: Gates<br>\n- Lecture 3: Finite Automata<br>\n- Lecture 4: Turing Machines<br>\n- Lecture 5: Big Numbers<br>\n- Lecture 6: Complexity, or Number of Operations<br>\n- Lecture 7: Polynomial vs. Exponential<br>\n- Lecture 8: The P vs. NP Problem<br>\n- Lecture 9: NP-completeness<br>\n- Lecture 10: Foundations of Cryptography<br>\n- Lecture 11: Public-Key Cryptography and Quantum Computing<br>\nHappy as always to receive comments and corrections. Enjoy!<\/p>","content_hash":"53719557c9ea91fa6dbbe258567653ce","author":"Scott","published_at":"2026-03-29T05:17:35","fetched_at":"2026-04-13 19:10:01","word_count":906,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"538651b2b94946d2","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9642","title":"Congrats to Bennett and Brassard on the Turing Award!","url":"https://scottaaronson.blog/?p=9642","summary":"I&#8217;m on a spring break vacation-plus-lecture-tour with Dana and the kids in Mexico City this week, and wasn&#8217;t planning to blog, but I see that I need to make an exception. Charles Bennett and Gilles Brassard have won the Turing Award, for their seminal contributions to quantum computing and information including the BB84 quantum key distribution scheme. This is the first-ever Turing Award specifically for quantum stuff (though previous Turing Award winners, including Andy Yao, Leslie ","content":"<p>Congrats to Bennett and Brassard on the Turing Award!<br>\nI’m on a spring break vacation-plus-lecture-tour with Dana and the kids in Mexico City this week, and wasn’t planning to blog, but I see that I need to make an exception. Charles Bennett and Gilles Brassard have won the Turing Award, for their seminal contributions to quantum computing and information including the BB84 quantum key distribution scheme. This is the first-ever Turing Award specifically for quantum stuff (though previous Turing Award winners, including Andy Yao, Leslie Valiant, and Avi Wigderson, have had quantum among their interests).<br>\nAs a practical proposal, BB84 is already technologically feasible but has struggled to find an economic niche, in a world where conventional public-key encryption already solves much the same problem using only the standard Internet—and where, even after scalable quantum computers become able to break many of our current encryption schemes, post-quantum encryption (again running on the standard Internet) stands ready to replace those schemes. Nevertheless, as an idea, BB84 has already been transformative, playing a central role in the birth of quantum information science itself. Beyond BB84, Bennett and Brassard have made dozens of other major contributions to quantum information science, with a personal favorite of mine being the 1994 BBBV (Bennett Bernstein Brassard Vazirani) paper, which first established the limitations of quantum computers at solving unstructured search problems (and indeed, proved the optimality of Grover’s algorithm even before Grover’s algorithm had been discovered to exist).<br>\nWhile I take my kids to see Aztec artifacts, you can learn much more from Ben Brubaker’s Quanta article, to which I contributed without even knowing that it would be about Bennett and Brassard winning the Turing Award (info that was strictly embargoed before today). It’s an honor to have known Charlie and Gilles as well as I have for decades, and to have been able to celebrate one of their previous honors, the Wolf Prize, with them in Jerusalem. Huge congrats to two of the founders of our field!<\/p>","content_hash":"1712e4164a61e65b13301aa257c49cde","author":"Scott","published_at":"2026-03-18T16:10:13","fetched_at":"2026-04-13 19:10:01","word_count":332,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"c4b5878017fa9376","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9630","title":"On Montgomery County public magnet schools: a guest post by Daniel Gottesman","url":"https://scottaaronson.blog/?p=9630","summary":"Scott&#8217;s foreword: I&#8217;ve known fellow quantum computing theorist Daniel Gottesman, now at the University of Maryland, for a quarter-century at this point. Daniel has been a friend, colleague, coauthor, and one of the people from whom I&#8217;ve learned the most in my career. Today he writes about a topic close to my heart, and one to which I&#8217;ve regularly lent this blog over the decades: namely, the struggle to protect enrichment and acceleration in the United States (in this case","content":"<p>On Montgomery County public magnet schools: a guest post by Daniel Gottesman<br>\nScott’s foreword: I’ve known fellow quantum computing theorist Daniel Gottesman, now at the University of Maryland, for a quarter-century at this point. Daniel has been a friend, colleague, coauthor, and one of the people from whom I’ve learned the most in my career. Today he writes about a topic close to my heart, and one to which I’ve regularly lent this blog over the decades: namely, the struggle to protect enrichment and acceleration in the United States (in this case, the public magnet programs in Montgomery County, Maryland) from the constant attempts to weaken or dismantle them. Thanks so much to Daniel for doing this, and please help out if you can!<br>\nWithout further ado, Daniel Gottesman:<br>\nScott has kindly let me write this guest post because I’d like to ask the readers of Shtetl-Optimized for help. I live in Montgomery County, Maryland, and the county is getting ready to replace our current handful of grea
