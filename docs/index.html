codes.<br>\n- Read the paper on the quantum error correction achieved by incorporating Atom Computing’s QPUs into the Microsoft Quantum compute platform.<\/p>","content_hash":"fd54504b8b56050668d3db61cbcfc3a7","author":"Krysta Svore","published_at":"2025-06-19T20:00:00","fetched_at":"2026-09-01 03:17:39","word_count":1092,"read_time_minutes":6,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"62w","domain":"azure.microsoft.com"},{"id":"fda519d43db4a205","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14344","title":"Transforming R&D with agentic AI: Introducing Microsoft Discovery","url":"https://azure.microsoft.com/en-us/blog/transforming-rd-with-agentic-ai-introducing-microsoft-discovery/","summary":"We are announcing a new enterprise agentic platform called Microsoft Discovery to accelerate research and development (R&amp;D) at Microsoft Build 2025.Our goal is to bring the power of AI to scientists and engineers to transform the entire discovery process—from advanced knowledge reasoning and hypothesis formulation to experimental simulation and iterative learning. Microsoft Discovery enables researchers to collaborate with a team of specialized AI agents combined with a graph-based knowledge","content":"<p>We are announcing a new enterprise agentic platform called Microsoft Discovery to accelerate research and development (R&D) at Microsoft Build 2025.<br>\nOur goal is to bring the power of AI to scientists and engineers to transform the entire discovery process—from advanced knowledge reasoning and hypothesis formulation to experimental simulation and iterative learning. Microsoft Discovery enables researchers to collaborate with a team of specialized AI agents combined with a graph-based knowledge engine, to drive scientific outcomes with speed, scale, and accuracy.<br>\nWe have architected Microsoft Discovery to be highly extensible, enabling researchers to integrate the latest Microsoft innovations with their own models, tools, and datasets as well as a wide range of partner and open-source solutions. Built on top of Microsoft Azure, trust, compliance, transparency, and governance are key design principles of this enterprise-ready platform to enable responsible innovation, keeping the researcher in control.<br>\nAt Microsoft, our researchers have leveraged the advanced AI models and high-performance computing (HPC) simulation tools in Microsoft Discovery to discover a novel coolant prototype with promising properties for immersion cooling in datacenters in about 200 hours—a process that otherwise would have taken months, if not years. This rapid discovery lays the groundwork for future developments in safer and sustainable solutions across multiple industries and is a demonstration of how Microsoft Discovery can potentially transform R&D in any company.<br>\nWe are working with a notable set of Microsoft customers who are interested in co-innovating in diverse industries including chemistry and materials, silicon design, energy, manufacturing, and pharma. We are also working with a broad partner base that is building on top of the platform to drive this acceleration, and we couldn’t be more excited. The possibilities are endless as we realize the full potential of AI in R&D and we are just getting started!<br>\nThe agentic vision for science<br>\nAt Microsoft, we want to amplify the ingenuity of scientists to usher in a new era of accelerating discovery and expand the horizons of research. Doing so requires empowering R&D teams with transformative technologies that can drive meaningful business impact. However, R&D has very specific challenges compared to other domains:<br>\n- Scientific knowledge is vast, nuanced, and distributed.<br>\n- The discovery process is diverse and dynamic, involving multiple highly specialized methods and tasks, making it very hard to connect the dots across the different domains involved.<br>\n- R&D is iterative. There are rarely simple, clear-cut answers. Instead, scientific knowledge evolves through evidence, discourse, and refinement.<br>\nThis complexity demands a new paradigm—one that isn’t aimed at doing the same experiments faster, but rather fundamentally changing the paradigm of how we approach R&D.<br>\nImagine if every researcher could collaborate with a tireless team of intelligent, synergistic AI agents with the sole purpose of accelerated innovation. This is our vision for a new agentic R&D paradigm, embedding AI in every stage of the scientific method.<br>\nIn this new world, people and specialized AI agents will cooperatively refine knowledge and experimentation in real time in a continuous, iterative cycle of discovery—all while maintaining the control, transparency, and trust that enterprises and governmental institutions require. This requires a comprehensive platform where AI can capture both the scientific domain and the cognitive processes involved in managing scientific thought. To realize this vision, scientific AI agents must be able to:<br>\n- Reason over a complex and contextual graph connecting all knowledge sources.<br>\n- Specialize across distinct domains and tasks.<br>\n- Learn from results and adapt entire research plans accordingly.<br>\nIntroducing Microsoft Discovery<br>\nWe are taking a big step toward realizing this vision with Microsoft Discovery, bringing agentic R&D to life by leveraging the latest innovations from Microsoft and the broader scientific ecosystem.<br>\nGraph-based scientific co-reasoning <br>\nThe advent of large language models (LLMs) hinted at this new era, offering capabilities to speed up certain scientific tasks, particularly for information retrieval and hypothesis generation. However, LLMs often lack the contextual understanding required to deeply reason over distributed, nuanced, and often contradictory scientific data.<br>\nMicrosoft Discovery<br>\nGet started today by using Azure HPC and Azure AI Foundry infrastructure.<br>\nMicrosoft Discovery is built on top of a powerful graph-based knowledge engine. Instead of merely retrieving facts, this engine builds graphs of nuanced relationships between proprietary data as well as external scientific research. This allows the platform to have a deep understanding of conflicting theories, diverse experimental results, and even underlying assumptions across disciplines.<br>\nThis contextual reasoning is also transparent. Rather than outputting monolithic answers, it keeps the expert in the loop with detailed source tracking and reasoning, providing the level of transparency in AI systems that builds trust, ensures accountability, and allows experts to validate and understand every step or make any adjustments as needed.<br>\nSpecialized discovery agents for conducting research<br>\nInstead of siloed and static pipelines, Microsoft Discovery implements a continuous and iterative R&D cycle where researchers can guide and orchestrate a team of specialized AI agents that learn and adapt over time—not just for reasoning, but for conducting research itself. The definition of these specialized agents captures both domain knowledge and process logic, simply through natural language.<br>\nR&D teams will be able to build a custom AI team aligned to their specific processes and knowledge, easily encoding these agents with their expertise and methodologies to ensure they can adapt and orchestrate as research progresses. This approach is far more flexible than hard-coding behaviors of today’s digital simulation tools, which often are highly specialized and lack streamlined integration with others, and it means that research teams no longer require computational expertise to drive impact. As an example, users can access and define various agents’ specialties, such as ‘molecular properties simulation specialist’ or ‘literature review specialist.’ They can even suggest which tools or models the agents should use or create, and how they should collaborate with others.<br>\nThis organic, bidirectional collaboration is a game-changer for managing R&D: agents are not only capable of working for the researchers, but with them in a manner that can truly amplify human ingenuity—seeing both the forest and the trees at once.<br>\nAt the center of this collaboration is Microsoft Copilot, acting as a scientific AI assistant that orchestrates these specialized agents based on the researcher’s prompts. Copilot is aware of all the tools, models, and knowledge bases in a customer’s catalog on the platform, can identify which agents to leverage, and can set up end-to-end workflows that cover the full discovery process by combining advanced AI and HPC simulations through the joint work of these agents.<br>\nExtensible and enterprise-ready<br>\nMicrosoft Discovery is built on top of Azure infrastructure and services, leveraging by design the trust, compliance, and governance controls at the core of Microsoft’s secure cloud foundation.<br>\nWe believe in the power of an open ecosystem that leverages the strengths of Microsoft’s latest advancements in combination with other innovative solutions from customers and partners. Microsoft Discovery allows R&D teams to extend the platform’s catalog by bringing their toolkit of choice to cover their specific research needs in a comprehensive scientific bookshelf. This extensibility at the core of Microsoft Discovery simplifies the onboarding of their choice of computational tools, models, and knowledge bases—whether they are custom developments, open-source, or commercial solutions. As we bring to market new capabilities in reliable quantum computing and embodied AI, the platform will remain future-proofed with the best technologies available at Microsoft and across the industry.<br>\nReal impact: Discovering a novel, non-PFAS coolant prototype<br>\nOver the past months, we have made significant strides aiding computational scientists in their research and incorporating cutting-edge innovations from Microsoft Research. This has led to remarkable breakthroughs, such as discovering a novel solid-state electrolyte candidate that uses 70% less lithium in collaboration with the Department of Energy’s Pacific Northwest National Laboratory (PNNL) and enabling rapid computational simulations that accelerate scientific discoveries at Unilever. Microsoft Discovery is designed to bring these innovations to every scientist—not only those with deep computational expertise.<br>\nOne of the more exciting early use cases of Microsoft Discovery is unfolding at the Pacific Northwest National Laboratory, where scientists are using Microsoft Discovery’s advanced generative AI and HPC capabilities to further develop machine learning models that predict and optimize complex chemical separations—a critical process in nuclear science. These separations are essential for effectively isolating radioactive elements after the nuclear fission process, a notoriously time-sensitive and incredibly chemically complex task. In the future, the team aims to use these advancements to reduce the time scientists must spend in hazardous radioactive environments, while improving yields and purity, enhancing both safety and efficiency.<br>\n—Scott Godwin, Director, Center for Cloud Computing, Pacific Northwest National Laboratory<br>\nBy leveraging advanced AI models and HPC tools for simulation that will be available on Microsoft Discovery, Microsoft researchers discovered a novel, non-PFAS, immersion datacenter coolant prototype in about 200 hours.1 Current coolants often take many years to develop and can contain harmful PFAS-based chemicals that make them unviable to use, as there’s a global push to ban these “forever chemicals” in favor of more environmentally friendly options in this industry and many others.<br>\nAfter the digital discovery process, we successfully synthesized this coolant prototype in under four months, and it’s currently under further analysis and refinement. We have already tested some of the primary properties of this material and they align to the AI predictions, which is a testament to the accuracy of the predictive models used. While this project is only an experiment, it lays the groundwork for future developments and improvements in coolant technology and demonstrates how the combination of HPC and specialized AI models can accelerate and transform R&D processes.<br>\nAccording to Daniel Pope, founder of Submer, a company whose mission is to build datacenters with a strong focus on sustainability, efficiency, and a smarter usage of resources:<br>\nThe speed and depth of molecular screening achieved by Microsoft Discovery would’ve been impossible with traditional methods. What once took years of lab work and trial and error, Microsoft Discovery can accomplish in just weeks, and with greater confidence.<br>\nA growing ecosystem<br>\nWe are putting this enterprise-grade platform into the hands of global innovators to demonstrate real-world impact across industries—from chemistry and pharma to manufacturing and silicon design.<br>\nIt’s only with a strong ecosystem that we’ll be able to realize the full potential of Microsoft Discovery, and it’s why we’re working with customers, partners, and other Microsoft teams to bring first-party advancements together with leading industry tools and domain expertise.<br>\nCustomers and internal collaborators<br>\nGSK is working to revolutionize healthcare, uniting science, technology and talent—including world-class partnerships—to get ahead of disease together. The company uses tech to advance science and accelerate the development and delivery of medicines and vaccines to positively impact the health of people at scale.<br>\nGSK’s depth and breadth of data and integrated use of tech across every part of its business—from early scientific exploration through to manufacture and delivery of medicines and vaccines in market—provide a unique offering when working with others. The company looks forward to a possible partnership with Microsoft with the intent of further advancing GSK’s generative platforms for parallel prediction and testing, creating new medicines with greater speed and precision, and potentially transforming medicinal chemistry to new unimaginable levels. The possibilities ahead are exciting, and together, we can strive for the most innovative solutions for patients and for health.<br>\nThe Estée Lauder Companies has gained a worldwide reputation for high-quality skincare, makeup, haircare and fragrance products that deliver highly effective results demonstrated by extensive research and product evaluation. The company is excited to harness the power of Microsoft Discovery to further accelerate the development of products that uphold the finest standards of excellence.<br>\nOur proprietary R&D data, stemming from the minds of our brilliant scientists and nearly 80 years of research, development, and experimentation, is a key competitive advantage. The Microsoft Discovery platform will help us to unleash the power of our data to drive fast, agile, breakthrough innovation and high-quality, personalized products that will delight our consumers.<br>\n—Kosmas Kretsos, PhD, MBA, Vice President, R&D and Innovation Technology, The Estée Lauder Companies<br>\nAdditionally, Microsoft is releasing a medical research agent that uses the same graph-based knowledge engine available in Microsoft Discovery to enhance information retrieval by synthesizing insights from trusted medical journals. As part of a broader set of specialized agents in the healthcare agent orchestrator code sample in Azure AI Foundry, this agent enables researchers and developers to deliver actionable and evidence-based guidance tailored specifically to complex, multi-disciplinary healthcare workflows—such as cancer care.<br>\nDomain-specific offerings<br>\nCombining Microsoft’s and NVIDIA’s strengths in generative Al and scientific computing, we plan to integrate Microsoft Discovery with NVIDIA ALCHEMI and NVIDIA BioNeMo NIM microservices to accelerate breakthroughs in materials and life sciences. Materials researchers will now have access to state-of-the-art inference capabilities for candidate identification, property mapping, and synthetic data generation. Biomolecular R&D teams will be able to accelerate Al model development for drug discovery, leveraging pre-trained BioNeMo Al workflows, all in Microsoft Discovery’s unified, enterprise-grade platform.<br>\nResearchers can also deploy their AI agents on high-performance NVIDIA-accelerated Azure AI Foundry infrastructure, enabling them to efficiently process and synthesize large volumes of scientific data with exceptional speed and responsiveness for accelerated discovery and enhanced research outcomes.<br>\nAI is dramatically accelerating the pace of scientific discovery. By integrating NVIDIA ALCHEMI and BioNeMo NIM microservices into Azure Discovery, we’re giving scientists the ability to move from data to discovery with unprecedented speed, scale, and efficiency.<br>\n—Dion Harris, Senior Director of Accelerated Data Center Solutions, NVIDIA<br>\nAdditionally, we plan to integrate Synopsys’ industry solutions in Microsoft Discovery to accelerate semiconductor engineering, helping both hardware designers and software developers deliver superior products.<br>\nSemiconductor engineering is among the most complex, consequential, and high-stakes scientific endeavors of our time, which makes it an extremely compelling use case for artificial intelligence. By integrating Synopsys’ pioneering AI-powered design solutions with Microsoft Discovery, we can realize the potential of agentic AI, re-engineer chip design workflows, supercharge engineering productivity, and accelerate the pace of technology innovation.<br>\n—Raja Tabet, Senior Vice President, Engineering Excellence Group, Synopsys<br>\nMicrosoft is also working with PhysicsX, planning to integrate the company’s physics AI foundation models into Microsoft Discovery so customers can unlock new levels of automation, optimization, and performance across engineering and manufacturing.<br>\nThe Microsoft Discovery platform represents a seismic shift in how AI can accelerate scientific discovery and engineering. This is about transforming how complex physical systems are designed, built, and operated across advanced industries—in aerospace and defense, semiconductors, minerals and materials, energy, and automotive. Together, PhysicsX and Microsoft are building the software infrastructure that will define the next era of engineering.<br>\n—Jacomo Corbo, Chief Executive Officer and Cofounder, PhysicsX<br>\nIntegration support<br>\nLastly, we’re excited to partner with a growing list of software integrators, such as Accenture and Capgemini, to help customers and collaborators scale custom platform deployments.<br>\nTogether with Microsoft, we are shaping a bold AI vision for organizations who use deep science to bring innovative products to patients and consumers. Our laboratory transformation strategies and Microsoft’s Microsoft Discovery platform create a dynamic ecosystem for scientific advancement. This collaboration will help us realize the laboratory of the future, enabling scientists to push the boundaries of discovery, experimentation, and testing with greater speed and precision.<br>\n—Adam Borenstein, Managing Director, Global Laboratory Reinvention Lead, Accenture<br>\nWe are excited to be bringing the Microsoft Discovery platform and AI agents to R&D-intensive sectors. We believe these technologies have the potential to enable expert scientists to unlock step changes in the pace of innovation, bringing transformative benefits to business and society. This partnership will drive productivity in laboratory-driven R&D by drawing on Capgemini’s industry experience, specialist physical and biological AI capabilities, and science-led ‘lab-in-the-loop’ intellectual property, including that of Cambridge Consultants, the deep tech powerhouse of Capgemini. For our clients this could mean accelerated discovery and predictive modelling or other competitive advantages through using data and AI at scale.<br>\n—Roshan Gya, Chief Executive Officer, Capgemini Invent<br>\nReady to take the next steps?<br>\nLearn more about how Microsoft Discovery can help scientists and engineers transform research and development:<br>\n- Watch the announcement of Microsoft Discovery at the Microsoft Build 2025 Keynote.<br>\n- Sign up to receive updates on the Microsoft Discovery preview<br>\n¹Based on the definitions of PFAS provided by the Organisation for Economic Co-operation and Development (OECD) (2021), the U.S. Environmental Protection Agency and Buck et. al. (2011)<\/p>","content_hash":"19018fa2d51b3b31d2279d5c4c79bcdb","author":"Aseem Datar","published_at":"2025-05-19T16:05:00","fetched_at":"2026-09-01 03:17:50","word_count":2706,"read_time_minutes":14,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"67w","domain":"azure.microsoft.com"},{"id":"c07b2ffa91188e08","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2025/02/19/microsoft-unveils-majorana-1-the-worlds-first-quantum-processor-powered-by-topological-qubits/","title":"Microsoft unveils Majorana 1, the world’s first quantum processor powered by topological qubits","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/02/19/microsoft-unveils-majorana-1-the-worlds-first-quantum-processor-powered-by-topological-qubits/","summary":"Built with a breakthrough class of materials called a topoconductor, Majorana 1 marks a transformative leap toward practical quantum computing. Quantum computers promise to transform science and society—but only after they achieve the scale that once seemed distant and elusive, and their reliability is ensured by quantum error correction. Today, we’re announcing rapid advancements on the path to useful quantum computing: Majorana 1: the world’s first Quantum Processing Unit (QPU) powered by a To","content":"<p>Built with a breakthrough class of materials called a topoconductor, Majorana 1 marks a transformative leap toward practical quantum computing.<br>\nQuantum computers promise to transform science and society—but only after they achieve the scale that once seemed distant and elusive, and their reliability is ensured by quantum error correction. Today, we’re announcing rapid advancements on the path to useful quantum computing:<br>\n- Majorana 1: the world’s first Quantum Processing Unit (QPU) powered by a Topological Core, designed to scale to a million qubits on a single chip.<br>\n- A hardware-protected topological qubit: research published today in Nature, along with data shared at the Station Q meeting, demonstrate our ability to harness a new type of material and engineer a radically different type of qubit that is small, fast, and digitally controlled.<br>\n- A device roadmap to reliable quantum computation: our path from single-qubit devices to arrays that enable quantum error correction.<br>\n- Building the world’s first fault-tolerant prototype (FTP) based on topological qubits: Microsoft is on track to build an FTP of a scalable quantum computer—in years, not decades—as part of the final phase of the Defense Advanced Research Projects Agency (DARPA) Underexplored Systems for Utility-Scale Quantum Computing (US2QC) program.<br>\nTogether, these milestones mark a pivotal moment in quantum computing as we advance from scientific exploration to technological innovation.<br>\nMicrosoft Quantum Innovator Series<br>\nJoin Chetan Nayak to learn about the advancements Microsoft is making in quantum computing.<br>\nHarnessing a new type of material<br>\nAll of today’s announcements build on our team’s recent breakthrough: the world’s first topoconductor. This revolutionary class of materials enables us to create topological superconductivity, a new state of matter that previously existed only in theory. The advance stems from Microsoft’s innovations in the design and fabrication of gate-defined devices that combine indium arsenide (a semiconductor) and aluminum (a superconductor). When cooled to near absolute zero and tuned with magnetic fields, these devices form topological superconducting nanowires with Majorana Zero Modes (MZMs) at the wires’ ends.<br>\nFor nearly a century, these quasiparticles existed only in textbooks. Now, we can create and control them on demand in our topoconductors. MZMs are the building blocks of our qubits, storing quantum information through ‘parity’—whether the wire contains an even or odd number of electrons. In conventional superconductors, electrons bind into Cooper pairs and move without resistance. Any unpaired electron can be detected because its presence requires extra energy. Our topoconductors are different: here, an unpaired electron is shared between a pair of MZMs, making it invisible to the environment. This unique property protects the quantum information.<br>\nWhile this makes our topoconductors ideal candidates for qubits, it also presents a challenge: How do we read quantum information that is so well hidden? How can we distinguish between, say, 1,000,000,000 and 1,000,000,001 electrons?<br>\nOur solution to this measurement challenge works as follows (also see Figure 1):<br>\n- We use digital switches to couple both ends of the nanowire to a quantum dot, which is a tiny semiconductor device that can store electrical charge.<br>\n- This connection increases the dot’s ability to hold charge. Crucially, the exact increase depends on the parity of the nanowire.<br>\n- We measure this change using microwaves. The dot’s ability to hold charge determines how the microwaves reflect off the quantum dot. As a result, they return carrying an imprint of the nanowire’s quantum state.<br>\nWe designed our devices so these changes are large enough to measure reliably in a single shot. Our initial measurements had an error probability of 1%, and we’ve identified clear paths to significantly reduce this.<br>\nOur system shows impressive stability. External energy—such as electromagnetic radiation—can break Cooper pairs, creating unpaired electrons that can flip the qubit’s state from even to odd parity. However, our results show that this is rare, occurring only once per millisecond on average. This indicates that the shielding that envelops our processor is effective at keeping such radiation out. We are exploring ways to reduce this even further.<br>\nIt’s perhaps not surprising that quantum computation would require us to engineer a new state of matter specifically designed to enable it. What’s remarkable is how accurate our readout technique already is, demonstrating that we are harnessing this exotic state of matter for quantum computation.<br>\nRevolutionizing quantum control through digital precision<br>\nThis readout technique enables a fundamentally different approach to quantum computing in which measurements are used to perform calculations.<br>\nTraditional quantum computing rotates quantum states through precise angles, requiring complex analog control signals customized for each qubit. This complicates quantum error correction (QEC), which must rely on these same sensitive operations to detect and correct errors.<br>\nOur measurement-based approach simplifies QEC dramatically. We perform error correction entirely through measurements activated by simple digital pulses that connect and disconnect quantum dots from nanowires. This digital control makes it practical to manage the large numbers of qubits needed for real-world applications.<br>\nFrom physics to engineering<br>\nWith the core building blocks now demonstrated—quantum information encoded in MZMs, protected by topology, and processed through measurements—we’re ready to move from physics breakthrough to practical implementation.<br>\nThe next step is a scalable architecture built around a single-qubit device called a tetron (see Figure 2). At the Station Q meeting, we shared data demonstrating the basic operation of this qubit. One fundamental operation—measuring the parity of one of the topological nanowires in a tetron—uses the same technique described in our Nature paper.<br>\nAnother key operation puts the qubit in a superposition of parity states. This, too, is performed by a microwave reflectometry measurement of a quantum dot, but in a different measurement configuration in which we decouple the first quantum dot from the nanowire and connect a different dot to both nanowires at one end of the device. By performing these two orthogonal Pauli measurements, Z and X, we’ve demonstrated measurement-based control—a crucial milestone that unlocks the next steps on our roadmap.<br>\nOur roadmap now leads systematically toward scalable QEC. The next steps will involve a 4×2 tetron array. We will first use a two-qubit subset to demonstrate entanglement and measurement-based braiding transformations. Using the entire eight-qubit array, we will then implement quantum error detection on two logical qubits.<br>\nThe built-in error protection of topological qubits simplifies QEC. Moreover, our custom QEC codes reduce overhead roughly tenfold compared to the previous state-of-the-art approach. This dramatic reduction means that our scalable system can be built from fewer physical qubits and has the potential to run at a faster clock speed.<br>\nDARPA’s recognition of our approach<br>\nThe Defense Advanced Research Projects Agency (DARPA) has selected Microsoft as one of two companies to advance to the final phase of their rigorous benchmarking program known as Underexplored Systems for Utility-Scale Quantum Computing (US2QC)—one of the programs that makes up DARPA’s larger Quantum Benchmarking Initiative (QBI). Microsoft views this recognition as validation of our roadmap for building a fault-tolerant quantum computer with topological qubits.<br>\nDARPA’s US2QC program and its broader Quantum Benchmarking Initiative represent a rigorous approach to evaluating quantum systems that could solve problems that are beyond the capabilities of classical computers. To date, the US2QC program has brought together experts from DARPA, Air Force Research Laboratory, Johns Hopkins University Applied Physics Laboratory, Los Alamos National Laboratory, Oak Ridge National Laboratory, and NASA Ames Research Center to verify quantum hardware, software, and applications. Going forward, the larger Quantum Benchmarking Initiative is expected to engage with even more experts in the testing and evaluation of quantum computers.<br>\nPreviously, DARPA selected Microsoft for an earlier phase upon an assessment that we could plausibly build a utility-scale quantum computer in a reasonable timeframe. DARPA then evaluated the Microsoft quantum team’s architectural designs and engineering plan for a fault-tolerant quantum computer. As a result of this careful analysis, DARPA and Microsoft have executed an agreement to begin the final phase of the program. During this phase, Microsoft intends to build a fault-tolerant prototype based on topological qubits in years, not decades—a crucial acceleration step toward utility-scale quantum computing.<br>\nUnlocking quantum’s promise<br>\nEighteen months ago, we laid out our roadmap to a quantum supercomputer. Today we hit our second milestone, demonstrating the world’s first topological qubit. And we’ve already placed eight topological qubits on a chip designed to house one million.<br>\nA million-qubit quantum computer isn’t just a milestone—it’s a gateway to solving some of the world’s most difficult problems. Even today’s most powerful supercomputers cannot accurately predict the quantum processes that determine the properties of the materials essential to our future. But quantum computing at this scale could lead to innovations like self-healing materials that repair cracks in bridges, sustainable agriculture, and safer chemical discovery. What today requires billions of dollars in exhaustive experimental searches and wet-lab experiments could be found, instead, through calculation on a quantum computer.<br>\nOur path to useful quantum computing is clear. The foundational technology is proven, and we believe our architecture is scalable. Our new agreement with DARPA shows a commitment to relentless progress toward our goal: building a machine that can drive scientific discovery and solve problems that matter. Stay tuned for more updates on our journey.<br>\nStay informed of Microsoft’s advancements in quantum computing:<br>\n- Check out Dr. Chetan Nayak on the Microsoft Research Podcast as he explores these groundbreaking advances.<br>\n- Read our papers in Nature and on arXiv.<br>\n- Join us to become quantum ready.<br>\n- Read the Microsoft Source story about today’s news.<br>\n- Hear the Microsoft quantum team discuss these milestones:<\/p>","content_hash":"15c89a87936902d9a78c8878dc5851b8","author":"Chetan Nayak","published_at":"2025-02-19T16:00:00","fetched_at":"2026-09-01 03:17:59","word_count":1567,"read_time_minutes":8,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"79w","domain":"azure.microsoft.com"},{"id":"c87bca6f7346a09c","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2025/01/14/2025-the-year-to-become-quantum-ready/","title":"2025: The year to become Quantum-Ready","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/01/14/2025-the-year-to-become-quantum-ready/","summary":"We find ourselves in an exciting and pivotal time. We are at the advent of the reliable quantum computing era. This past November, Microsoft successfully created and entangled 24 logical qubits in collaboration with Atom Computing. As our industry looks toward the next 12 months, the pace of quantum research and development is only going to accelerate, making this a critical and catalyzing time for business leaders to act. We’re seeing a growing need for business leaders to have the information ","content":"<p>We find ourselves in an exciting and pivotal time. We are at the advent of the reliable quantum computing era. This past November, Microsoft successfully created and entangled 24 logical qubits in collaboration with Atom Computing. As our industry looks toward the next 12 months, the pace of quantum research and development is only going to accelerate, making this a critical and catalyzing time for business leaders to act. We’re seeing a growing need for business leaders to have the information and tools to understand better the depth of these amazing technical breakthroughs and the business applications and value they open up. In a business decision-maker study, 12% said their organizations were prepared to assess quantum opportunities. Clearly, there is an urgent need for leaders to get more information and better understand how technical advancements in quantum will enable real-world impact.<br>\nLeaders in global companies, investment funds, and governments across the world are making multi-billion-dollar investments in quantum computing. Those organizations that are in the throes of planning a comprehensive quantum-ready strategy are creating durable, competitive differentiation for their organizations and positioning themselves to harness the full power of quantum as it scales. Clearly, without strategic readiness, it’s a challenging proposition for leaders to assess the risks and returns, or to design effective and responsible quantum strategies that are necessary to create a full-on quantum roadmap for their organization.<br>\nThis is why at Microsoft we are excited to announce our new Quantum Ready program, designed to address these exact challenges by providing business leaders with the insights and tools needed to:<br>\n- Build practical, high-impact hybrid applications.<br>\n- Invest in strategic skilling and access to reliable quantum computers for experimentation.<br>\n- Embrace quantum safety and focus on cryptographic agility.<br>\n- Prepare for scale such that your investments are future-proofed.<br>\nBecoming quantum-ready is both a business and a global imperative. In fact, the United Nations announced 2025 as the International Year of Quantum Science and Technology (IYQ), reflecting the transformative impact quantum mechanics has had in the past century, and setting the stage for the next wave of quantum innovation. As part of this global initiative, Microsoft will be a leading partner with the IYQ, along with the American Physical Society (APS), to celebrate 100 years of quantum innovation. We are so excited to partner with APS and other leading institutions to support the IYQ as it engages with communities from across the world to scale awareness of how quantum science and applications will transform industries.<br>\nQuantum Ready<br>\nQuantum Ready can help future proof your organization today for a quantum-powered tomorrow<br>\nHybrid applications: Business value and security for today and tomorrow<br>\nGiven the rapid pace of innovation, it’s critical that organizations start exploring, identifying, and building an application roadmap that sets them up for success in a quantum future. Doing so will clarify where and when quantum will provide tangible business value and guide both how and to what degree, you should invest to become quantum-ready today.<br>\nThrough our Quantum Ready program, leaders will have an opportunity to engage with Microsoft in one-on-one workshops and industry-specific forums to accelerate their strategic readiness and identify high-value use cases. We hope to bring learnings that result from these industry-specific forums to the broader ecosystem to provide practical insights in the form of custom industry outlook reports to help guide your organization’s leadership and company strategy.<br>\nAdditionally, business leaders need to start preparing for a quantum-safe future; not because there is an immediate threat but because a transition to emerging cryptographic standards will take time. Security is a top priority at Microsoft—this is why we established the Microsoft Quantum Safe Program to enable security alignment from both business and technical perspectives.<br>\nCultivating a quantum-ready culture: Skilling and vision for the hybrid era<br>\nCultivating a culture of innovation begins with robust workforce skilling and training, empowering teams with the knowledge and mindset to embrace quantum-enabled possibilities. Putting this mindset into practice requires providing access to a unified hybrid platform integrating resilient quantum computing, classical supercomputing, and AI. Especially when 76% of leaders indicate that a quantum skills crisis is causing a deceleration in innovation, the organizations that can harness the power of these complementary technologies—and who understand their use is not a matter of either or, but when and how—are in a distinct position to stay ahead.<br>\nOur Quantum Ready program will offer different skilling and training opportunities to help prepare business and government leaders with resources, frameworks, and tools they need to:<br>\n- Understand why quantum technology is positioned to help revolutionize your business operations, talent strategies, and infrastructure.<br>\n- Gain an early-mover competitive edge by creating a quantum strategy that aligns the technology’s potential with your specific business and innovation goals.<br>\n- Explore deep insight and guidance into the impact quantum computing will make in your industry and what it means for your organization.<br>\nActing for success: Preparation for scale with the right partner<br>\nSo, where and how should organizations start? Navigating the many skilling, strategy, and culture considerations is not easy, and it requires the right partners: those with experience putting state-of-the-art hybrid tools into practice with real-world, impactful applications; those who carefully consider the risks quantum pose and are working to mitigate them with leading security solutions and commitments to safe use; and finally, those with an open ecosystem approach to future-proof your investments.<br>\nFrom envisioning new use cases and identifying co-innovation opportunities to receiving first access to visionary industry insights, outlook reports, skilling, workshops, and other exciting new programs to come, sign up here to join Microsoft’s Quantum Ready program. We look forward to connecting with you soon!<br>\nLearn how Microsoft can help you become quantum ready<br>\n- Join the Quantum Ready program.<br>\n- Explore the video learning modules in our Quantum Ready program.<\/p>","content_hash":"0cb778ae31331d9f5d2329c67a5aa941","author":"Mitra Azizirad","published_at":"2025-01-14T16:00:00","fetched_at":"2026-09-01 03:18:10","word_count":964,"read_time_minutes":5,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"84w","domain":"azure.microsoft.com"},{"id":"6bdde094fa0e91d3","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/11/19/microsoft-and-atom-computing-offer-a-commercial-quantum-machine-with-the-largest-number-of-entangled-logical-qubits-on-record/","title":"Microsoft and Atom Computing offer a commercial quantum machine with the largest number of entangled logical qubits on record","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/11/19/microsoft-and-atom-computing-offer-a-commercial-quantum-machine-with-the-largest-number-of-entangled-logical-qubits-on-record/","summary":"Azure Elements Purpose built to accelerate scientific discovery ↗ Microsoft and Atom Computing have made rapid progress in reliable quantum computing by creating and entangling 24 logical qubits made from neutral atoms—they have also demonstrated the ability to detect and correct errors, and perform computation, on 28 logical qubits. Together, the companies are offering a reliable quantum machine built with these state-of-the-art logical qubits and Microsoft’s qubit-virtualization system, and in","content":"<p>Azure Elements<br>\nMicrosoft and Atom Computing have made rapid progress in reliable quantum computing by creating and entangling 24 logical qubits made from neutral atoms—they have also demonstrated the ability to detect and correct errors, and perform computation, on 28 logical qubits. Together, the companies are offering a reliable quantum machine built with these state-of-the-art logical qubits and Microsoft’s qubit-virtualization system, and integrated with Azure Elements. This comprehensive package is available to order today with delivery in 2025. The results reported here showcase the advances being made toward scientific quantum advantage, which will require not only reliable quantum computation, but also integration with AI and high-performance computing.<br>\nAtom Computing’s neutral-atom qubits<br>\nIn the quantum computing industry, multiple types of physical qubits are being explored as potential pathways to hybrid quantum-classical supercomputing. But not all types of qubits allow for the quantum error correction needed to enable more reliable quantum computing. And without reliable quantum computing, valuable solutions to classically intractable problems are unlikely to be achieved. It’s essential to graduate from computing with noisy physical qubits to operating with reliable, logical ones.<br>\nOne type of qubit that opens opportunities for more reliable quantum computation, with more and better logical qubits, is based on neutral atoms. Our partner, Atom Computing, uses neutral atoms as qubits to store and process quantum information through manipulation with pulses of light. Compared to other qubit technologies, neutral atoms have several advantages including the ability to be tightly packed in arrays while being held in place by lasers, as well as the ability to be moved around so that they can interact with other atoms to enable all-to-all connectivity. Neutral atoms also have low susceptibility to noise and the high fidelities needed for quantum error correction to work. Due to their lack of charge, neutral atoms can be kept only microns (millionths of a meter) apart. Thus, atomic arrays can accommodate large numbers of neutral atoms, each of which serves as a physical qubit, in a small amount of space, offering extensive scalability.<br>\nAtom Computing recently announced that they have achieved 99.6% two-qubit gate fidelity, which represents the highest fidelity of neutral-atom qubits in a commercial system and unlocks the ability to perform meaningful error correction. Qubits with such low error rates and all-to-all connectivity are prime candidates for Microsoft’s custom qubit-virtualization system, which creates logical qubits and enables the detection and correction of errors while performing reliable quantum computation.<br>\nQuantum Insider<br>\nWebinar with Dr. Krysta Svore and Dr. Ben Bloom on the offering from Microsoft and Atom Computing<br>\nAzure Quantum compute platform<br>\nTo enable reliable quantum computing, Microsoft has developed the Azure Quantum compute platform. This compute platform combines Microsoft’s advanced qubit-virtualization system with quantum-processing units (QPUs) from our industry-leading hardware partners to create logical qubits by detecting and correcting the errors inherent in the QPU’s physical qubits, in turn enabling reliable quantum computation.<br>\nMicrosoft’s qubit-virtualization system is a core component of the Azure Quantum compute platform and builds on Microsoft’s world-class quantum error correction innovations. It offers high performance quantum error correction, custom-tailored for the underlying QPU and can be applied to a variety of QPU types. By co-designing the quantum computer with Atom Computing, we are enabling faster, more advanced, and more efficient quantum error correction as part of our qubit-virtualization system.<br>\nCreating and entangling logical qubits<br>\nTo enable complex quantum computations, qubits must meet several criteria. The physical qubits must have low enough error rates to enable error detection and correction so that they can be used to create reliable logical qubits. Those logical qubits must then be able to not only be entangled, but also to undergo many logical operations without failure to enable successful solutions to complex computations.<br>\nBy applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral-atom qubits, the teams created 24 logical qubits and entangled them in a cat state, or Greenberger-Horne-Zeilinger (GHZ) state—this represents the highest number of entangled logical qubits on record. Entanglement of the qubits is evidenced by their error rates being significantly below the 50% threshold for entanglement (Figure 1).<br>\nWhen using neutral atoms as qubits and attempting to hold them in place with lasers, some atoms can still become lost, resulting in a loss of that qubit and its quantum information. Thus, the teams took steps to not only detect errors but also to detect and correct losses of neutral-atom qubits during experiments. After creating logical qubits from neutral atoms and detecting errors and losses, the error rate in the logical qubits was 10.2%, which is 4.1 times better than the baseline physical error rate of 42% (Figure 1). When errors were detected and losses were detected and corrected, the error rate was 26.6%, which is 1.6 times better than the physical error rate (Figure 1). This is the first demonstration on record of loss correction in a commercial neutral-atom system.<br>\nTwenty-eight logical qubits, created from 112 physical qubits, were used to perform successful computations based on the Bernstein-Vazirani algorithm. Furthermore, the logical qubits were able to produce a more accurate solution than the corresponding computation based on physical qubits. The ability to compute while detecting and correcting errors is a critical component to scaling to achieve scientific quantum advantage.<br>\nFigure 1. Error rates of physical qubits (baseline) and the logical qubits created from them. The 24 logical qubits, which were entangled in a cat state, were created by applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral atoms. The entanglement of the logical qubits is evidenced by the error rate being below the 50% threshold (dashed line). The error rate of the logical qubits varied depending on whether losses were only detected or were detected and corrected. In both cases, the logical qubits demonstrated a higher fidelity of entanglement than the corresponding physical qubits.<br>\nCommercial offering from Microsoft and Atom Computing<br>\nMicrosoft and Atom Computing are offering a state-of-the-art reliable quantum computer built from Atom’s neutral-atom hardware and Microsoft’s qubit-virtualization system, and that integrates with Azure Elements. This offering is a comprehensive scientific suite that combines logical qubits, cloud HPC, and advanced AI models that, together, enable exploration across multiple fields, including chemistry and materials science, while also providing opportunities for skilling and education.<br>\nAzure Elements, which is included in the offering, uses AI and cloud high-performance computing (HPC) to greatly accelerate the pace of scientific research and discovery. Capabilities of Azure Elements include Generative Chemistry, which brings the power of generative AI to chemistry research to enable the rapid discovery of molecules that are novel, synthesizable, and useful. In addition, Accelerated DFT offers substantial increases in speed over other DFT (density functional theory) codes for modeling quantum-mechanical properties. These and other user-friendly features of Azure Elements greatly increase the productivity of scientific research, especially when coupled with the quantum capabilities of the Azure Quantum compute platform.<br>\nThis suite—offered by Microsoft and Atom Computing—will enable not only exploration of quantum applications, but also the creation of new datasets by the quantum computer that may be used to train AI models for improved performance or accuracy. And while the offering targets scientific discovery, it’s also possible to explore how quantum capabilities may provide solutions to complex problems in other industries.<br>\n“We are excited to continue our collaboration with Microsoft, which has already led to significant milestones in quantum computing. By coupling our state-of-the-art neutral-atom qubits with Microsoft’s qubit-virtualization system, we are now able to offer reliable logical qubits on a commercial quantum machine. This system will enable rapid progress in multiple fields including chemistry and materials science.” — Dr. Ben Bloom, Founder and CEO of Atom Computing<br>\nLearn more about our latest achievements in quantum computing<br>\n- Register to watch the Quantum Insider webinar with Dr. Krysta Svore and Dr. Ben Bloom on the offering from Microsoft and Atom Computing.<br>\n- Read the technical paper describing how Microsoft and Atom Computing created and entangled 24 logical qubits.<br>\n- Read the technical paper on Atom Computing’s best-in-class two-qubit gate fidelity.<br>\n- Read Jason Zander’s LinkedIn article on today’s announcement.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"df1fee32ff5f9655d1de9694cdb1d912","author":"Krysta Svore","published_at":"2024-11-19T13:30:00","fetched_at":"2026-09-01 03:18:19","word_count":1343,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"92w","domain":"azure.microsoft.com"},{"id":"07071061f61a76ac","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/09/10/microsoft-and-quantinuum-create-12-logical-qubits-and-demonstrate-a-hybrid-end-to-end-chemistry-simulation/","title":"Microsoft and Quantinuum create 12 logical qubits and demonstrate a hybrid, end-to-end chemistry simulation","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/09/10/microsoft-and-quantinuum-create-12-logical-qubits-and-demonstrate-a-hybrid-end-to-end-chemistry-simulation/","summary":"Microsoft and Quantinuum applied Azure Quantum’s qubit-virtualization system to Quantinuum’s H2 trapped-ion quantum computer to create 12 highly reliable logical qubits. Additionally, the teams demonstrated the emerging capabilities of reliable quantum computing by using two logical qubits, integrated with an AI model and cloud high-performance computing (HPC), to accurately estimate the ground state energy of the active space of an important catalytic intermediate. These achievements demonstrat","content":"<p>Microsoft and Quantinuum applied Azure Quantum’s qubit-virtualization system to Quantinuum’s H2 trapped-ion quantum computer to create 12 highly reliable logical qubits. Additionally, the teams demonstrated the emerging capabilities of reliable quantum computing by using two logical qubits, integrated with an AI model and cloud high-performance computing (HPC), to accurately estimate the ground state energy of the active space of an important catalytic intermediate. These achievements demonstrate continued progress toward scientific quantum advantage, a milestone that will be reached when a hybrid quantum-classical supercomputer can solve scientific problems too complex for classical computers alone.<br>\nMicrosoft Quantum Innovation Series<br>\nHow can quantum and AI unlock a new generation of hybrid applications for science?<br>\nTripling the number of highly reliable logical qubits<br>\nEarlier this year, Microsoft and Quantinuum created the most reliable logical qubits on record by applying Microsoft’s qubit-virtualization system to Quantinuum’s H-Series ion-trap qubits. At the time of that announcement, the teams had created four logical qubits from 30 physical qubits on Quantinuum’s H2 machine, with a logical error rate 800 times better than the physical error rate.<br>\nBy expanding Microsoft’s error-correction algorithms and optimizing them for Quantinuum’s H2 machine, which now has 56 qubits with 99.8% two-qubit fidelity, the teams have created 12 highly reliable logical qubits. Previously, Microsoft and Quantinuum entangled two logical qubits in a Bell state preparation, whereas in this study, all 12 logical qubits were entangled in a more complex arrangement known as a cat state, or Greenberger-Horne-Zeilinger (GHZ) state. When these logical qubits were entangled, they exhibited a circuit error rate of 0.0011, which is 22 times better than the corresponding physical qubits’ circuit error rate of 0.024.<br>\nMicrosoft and Quantinuum demonstrated several fault-tolerant computations with the improved logical qubits. On eight logical qubits, the teams successfully conducted five rounds of repeated error correction. Furthermore, the eight logical qubits were used to perform a fault-tolerant computation during error correction, successfully demonstrating the combination of logical entangling operations with multiple rounds of quantum error correction. The eight logical qubits exhibited a circuit error rate of 0.002, which is 11 times better than the corresponding physical qubits’ circuit error rate of 0.023. To our knowledge, this is the first demonstration of computation and error correction being beneficially combined, and it showcases the ability of these logical qubits to perform increasingly deeper quantum computations reliably, paving the way to fault-tolerant quantum computing.<br>\nUsing logical qubits, cloud HPC, and AI to solve problems in chemistry<br>\nTo demonstrate the emerging usefulness of quantum computing in chemistry applications, an end-to-end hybrid workflow was used to solve a real problem in chemistry, bringing together computation across cloud HPC, reliable quantum computing, and AI. In the quantum computation, two logical qubits—created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 machine—were used to prepare the ground state of the active space of an important catalytic intermediate (Figure 1) and then measured. The measurement outputs were then integrated with AI to estimate the ground state energy of the active space. This is the first time that HPC, AI, and quantum-computing hardware have been applied in concert to solve a scientific problem.<br>\nAs a first step, the team at Microsoft used AutoCAS and AutoRXN in Azure Quantum Elements to conduct HPC simulations that identified the active space of the catalyst and the catalyst’s reaction pathways, respectively. The team then optimized error-detection codes for use within a customized quantum algorithm on two logical qubits to simulate the quantum behavior of the active space. The logical qubits were then measured to generate classical data using a method known as classical shadows, which uses the measurement outcomes as classical data to train an AI model on the quantum properties of the molecule. This “shadow data” was then used in combination with the AI model to determine chemical properties of the catalyst and estimate the ground state energy of the active space within chemical accuracy (Figure 2). For comparison, the same calculation was performed with physical qubits.<br>\nThe ground state energy of the catalyst’s active space was calculated classically to gauge the accuracy of the hybrid quantum and AI-based result. Using qubits to solve this problem does not demonstrate scientific quantum advantage because the answer can be derived with classical computers. However, some complicated chemistry problems are unlikely to be solved classically with high accuracy, which provides an opportunity for quantum computers to outperform classical computation.<br>\nThe proof-of-concept case study described here is notable for several reasons. To our knowledge, this is the first demonstration of an end-to-end workflow that employs quantum computing, HPC, and AI to simulate and solve a chemistry problem. Furthermore, the quantum-mechanical problem was solved with a high degree of accuracy. These logical qubits produced a better estimate of the ground state energy than the comparable computation with the underlying physical qubits, demonstrating the higher reliability of these logical qubits.<br>\nThis demonstration provides evidence of the emerging usefulness of quantum-classical hybrid computing in chemistry, and it offers an example of how HPC, AI, and logical qubits can be used collectively to solve scientific problems. The logical qubits created with Microsoft’s qubit-virtualization system are being integrated into Azure Quantum Elements, our cloud platform designed to accelerate scientific discoveries. To increase our offerings further, we’re excited to announce that Quantinuum’s InQuantoTM computational-chemistry software package has been integrated into Azure Quantum Elements. InQuanto’sTM pioneering quantum-chemistry algorithms and methods expand Azure Quantum Elements’ tool kit and are available today through private preview.<br>\nMicrosoft’s qubit-virtualization system extends to all types of qubits<br>\nMultiple types of qubit architectures are being explored as potential pathways toward a quantum-computing future. The logical qubits described above were created on Quantinuum’s ion-trap qubit hardware. The team at Microsoft is also applying the Azure Quantum compute platform to the neutral-atom qubits in Atom Computing’s second-generation systems, designed to have over 1,200 physical qubits. Together, Microsoft and Atom Computing have created logical qubits and are optimizing their systems to enable reliable quantum computation. The team at Microsoft also plans to apply their qubit-virtualization system to the topological qubits that are still in development.<br>\nAs advances are made to both quantum hardware and software, qubits will continue to increase in number and fidelity, enabling deeper and more complex quantum computations with logical qubits. When approximately 100 logical qubits are available, scientific quantum advantage—which is expected to help solve some of the world’s most pressing challenges—will likely be achievable.<br>\nMaking logical qubits available through a new hybrid-computing offering<br>\nAt Microsoft, we’re ushering in a new era of reliable quantum computing by offering the Azure Quantum compute platform that brings together Microsoft’s qubit-virtualization system with industry-leading quantum processing units (QPUs) from hardware partners to create reliable logical qubits. Computation with those logical qubits is then integrated with cloud HPC and AI models. Additionally, in collaboration with Atom Computing, we have a commercial offering of a reliable quantum machine.<br>\nBy providing access to reliable logical qubits, accelerated HPC simulations, Copilot for Azure Quantum, and advanced AI models, Azure Quantum brings the powers of quantum computing, classical computing, and AI together. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about Microsoft’s advances in quantum computing<br>\n- Read about Microsoft’s hybrid-computing offering and our collaboration with Atom Computing in the Official Microsoft Blog.<br>\n- Register for the upcoming Microsoft Quantum Innovator Series on how quantum and AI can unlock a new generation of hybrid applications for science.<br>\n- Read the technical papers on today’s logical qubit announcement and the chemistry simulation performed with logical qubits from Microsoft and Quantinuum.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"c4c6ab72eaad17f4a0e8833008e9a220","author":"Krysta Svore","published_at":"2024-09-10T13:00:00","fetched_at":"2026-09-01 03:18:29","word_count":1289,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"102w","domain":"azure.microsoft.com"},{"id":"56f111ee2310cfc0","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","title":"Introducing two powerful new capabilities in Azure Quantum Elements: Generative Chemistry and Accelerated DFT","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","summary":"Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.&nbsp; Microsoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivi","content":"<p>Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.<br>\nMicrosoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivity of scientific research and remove barriers on the path to scientific discovery by substantially reducing the effort and expertise needed to perform what were previously daunting tasks. Specifically, these capabilities use Copilot for Azure Quantum, a natural-language interface that can be used by experts and non-experts alike, making Azure Quantum Elements accessible to more people and increasing the speed at which complex scientific problems can be solved.<br>\nUnlocking solutions to our most pressing challenges will require the world’s collective genius, and we’re excited to put new capabilities into the hands of scientists, students, and organizations such as Unilever so that everyone can contribute to making scientific discoveries that change the world for the better.<br>\nSince its launch, Azure Quantum Elements has served an important role in helping scientists achieve breakthroughs that have paved the way for more sustainable batteries and innovations in the pharmaceutical industry. Today, we’re announcing two new purpose-built capabilities in Azure Quantum Elements that will further increase the productivity and accessibility of chemistry and materials science research—Generative Chemistry and Accelerated DFT.<br>\nGenerative Chemistry helps scientists discover novel, synthesizable, and useful molecules quickly<br>\nThere are hundreds of millions of known molecular compounds and substances and many more remain to be discovered. In the field of chemistry, a major challenge is narrowing down an enormous number of candidate molecules to find the few that are best suited for a particular application. This challenge results in the streetlight effect, which is when the vast number of possibilities is reduced to a reasonable size, not based on the properties of the compounds, but by focusing only on those that have been studied previously. Relying on databases to identify suitable compounds limits the search space so that only known compounds are revealed as candidates for specific applications. Generative AI helps bring to light a much larger portion of the estimated 1060 possible combinations of atoms so that scientists are presented with novel candidates that are likely to serve the intended purpose.<br>\nToday, the Azure Quantum team at Microsoft is announcing Generative Chemistry—an upcoming capability that has the potential to greatly simplify this process and help scientists quickly discover and design new compounds with desired properties, thus increasing the productivity of product innovation.<br>\nGenerative Chemistry, which will be available through Azure Quantum Elements private preview, is an end-to-end workflow that involves multiple steps:<br>\n- You provide information on desired molecular characteristics for your specific application. Additionally, you can supply reference molecules if you already have some possibilities in mind.<br>\n- The information you provide is used to generate seed molecules from a dataset—those seed molecules are then used to initiate the guided AI generation of candidate molecules for your application. This is accomplished by applying multiple AI models and a unique methodology to identify new compounds that match your criteria. In this step, you have several options for configuration such as selecting the most relevant generative AI model, specifying the number of molecules to be generated, indicating the key molecular properties of interest, and screening compounds for toxicity.<br>\n- AI-based screening models predict properties of the candidate molecules that are important for real-world applications—such as boiling point, density, or solubility. A feedback loop sends this information back to the guided AI generation (step 2) to modify the selection of candidate molecules. In this step, you also have the option to fine tune the AI models for your specific application.<br>\n- The pool of potential candidates is further narrowed through a step that uses AI-guided synthesis planning to determine the feasibility of making the molecules in a laboratory—this is important because some novel molecules with desired properties may be difficult to synthesize. In this step, synthesis pathways are predicted, and candidate molecules are filtered based on how easy they are to make.<br>\n- Highly accurate HPC simulations are performed on the top candidates. Accelerated DFT can be used to screen candidates for electronic properties such as dielectric constant, ionization potential, and polarizability. AutoRXN predicts chemical stability or reactivity, and it can also be used to provide insights on possible synthesis pathways.<br>\n- You are presented with the final candidate molecules from which you can select the most promising for laboratory synthesis and testing.<br>\nThis entire process takes only days, shaving months or even years off trial-and-error laboratory experiments that were previously required to arrive at this point. Generative Chemistry suggests entirely new compounds and gives scientists the freedom to focus on only those molecules that are fit for the desired purpose—saving time, money, and effort. This new capability will allow for rapid progress in the development of novel therapeutics, sustainable materials, and more.<br>\nGenerative Chemistry<br>\nWebinar with American Chemical Society<br>\nAccelerated DFT offers substantial increases in speed compared to other density functional theory codes<br>\nDensity functional theory (DFT) is one of the most popular methods in computational chemistry due to its efficiency and accuracy in modeling quantum-mechanical properties. It allows researchers to simulate and study the electronic structures of atoms, molecules, and nanoparticles as well as surfaces and interfaces, thus predicting properties such as dielectric constant, ionization potential, and polarizability. Scientists can then tailor those properties to optimize them for specific applications.<br>\nAlthough DFT is highly valuable for research and product design, most DFT codes need to be run directly by the user in HPC clusters, which can be a difficult undertaking. Additionally, DFT—when run on traditional HPC hardware—requires substantial compute power and becomes constrained as the molecules being studied or designed increase in complexity and size.<br>\nTo simplify and improve this process, Azure Quantum and Microsoft Research designed and launched Accelerated DFT, a code used to simulate the electronic structure of molecules. Accelerated DFT can determine the properties of molecules with thousands of atoms in a matter of hours. It performs substantially faster than other DFT codes and offers a 20-fold average increase in speed compared to PySCF, a widely used open-source DFT code.1<br>\nThe setup of Accelerated DFT is made simple by providing the software as a service, requiring no code compilation or configuration on the user’s part, and it has a simplified API to streamline the computational process. Furthermore, a Python Software Development Kit (SDK) offers seamless integration into a wide variety of computational chemistry environments, which allows researchers to incorporate DFT calculations into complex chemistry workloads. Accelerated DFT is now available in Azure Quantum Elements private preview; it will also become part of Generative Chemistry.<br>\nAccelerated DFT can substantially expedite research across a wide spectrum of chemical disciplines by employing the power of Azure’s cloud architecture. Accelerated DFT can also produce large and highly accurate datasets of molecular properties that can be used to improve AI models, which require large amounts of training data. By rapidly generating training data, new molecules can be discovered faster, and known molecules can be improved, leading to innovations in therapeutics, sustainable products, and more.<br>\n“We have been very impressed by Accelerated DFT for simulating large systems with range-separated hybrid density functionals, where it speeds up the calculations considerably. Furthermore, the team at Microsoft has been very accommodating in quickly resolving technical challenges for our calculations of an active site of an enzyme.”—Tejs Vegge, Professor, Head of Section for Autonomous Materials Discovery, DTU Energy, Technical University of Denmark.<br>\n“Accelerated DFT has an easy-to-use Python interface, and the acceleration in calculations allows for the efficient use of novel hybrid functionals and a large basis set. Estimating key thermodynamic properties can thus be done in a matter of hours.<br>\nAspenTech is excited to be partnering with Microsoft to evaluate the application of quantum chemistry in our physical properties system for process modeling, especially in our sustainability pathways solutions. We anticipate that working with Accelerated DFT will result in strong use cases for characterizing new molecules and materials that are crucial to decarbonizing and circularizing industrial and consumer materials.”—Heiko Claussen, Senior Vice President, Artificial Intelligence Technology at AspenTech.<br>\nAzure Quantum Elements incorporates quantum computing<br>\nWith the addition of each new feature, Azure Quantum Elements becomes a more effective tool for scientists by harnessing AI, HPC, and emerging hybrid-computing capabilities that bring the power of quantum computing to scientific challenges. Recently, we simulated a chemical catalyst by combining classical supercomputers, AI, and logical qubits created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 hardware. In the coming months, we will introduce advanced logical qubit capabilities from Microsoft and Quantinuum to the private preview of Azure Quantum Elements. This classical-quantum hybrid computing offering follows our quantum computing milestone with Quantinuum in which we created the most reliable logical qubits on record with an error rate 800 times better than that of the corresponding physical qubits.<br>\nAdvances in AI and quantum computing have the potential to help researchers solve global scientific challenges. In the future, we plan to offer a quantum supercomputer that can simulate interactions of molecules and atoms at the quantum level, which is beyond the reach of classical computers. This capability is expected to transform research and innovation across many industries. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about how Azure Quantum Elements is revolutionizing chemistry and materials science<br>\n- Read about our collaboration with Unilever in the Official Microsoft Blog.<br>\n- Explore the product overview of Azure Quantum Elements.<br>\n1 Details on the performance of the private preview of Accelerated DFT can be found in the preprint of Acceleration without Disruption: DFT Software as a Service.<\/p>","content_hash":"a6fbb1579c24d7c640e136044b531c4d","author":"Dr. Nathan Baker","published_at":"2024-06-18T15:00:00","fetched_at":"2026-09-01 03:18:39","word_count":1663,"read_time_minutes":9,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"114w","domain":"azure.microsoft.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":"<p>The Qiskit blog is moving!<br>\nThat’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.<br>\nThe Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and quantum information science. Now, we think it’s time for a change of scenery.<br>\nAs part of ongoing efforts at IBM to pool resources into a unified quantum experience, and to make it easier for our community to find and access the information they care about, we’re building a new home for the Qiskit blog. Moving forward, you’ll find all new Qiskit blog posts published at ibm.com/quantum/blog. Simply click the “Qiskit” tag on the menu in the top left corner of the page, and you’ll be able to see the new Qiskit blog content we plan to start publishing in the weeks and months ahead. Historical content previously posted here on Medium will remain live for your reference.<br>\nWe may be changing addresses, but we’ll still be bringing you the high-quality quantum computing news, resources and storytelling we’ve been producing for years. So, we hope you’ll bookmark the new blog and check in regularly. You can also follow the IBM Quantum page on LinkedIn for updates featuring the latest blog content.<br>\nA look back at seven years of Qiskit blogging<br>\nSeven years is a long time, so we thought it would be worth taking a look back at some of the amazing stories we’ve shared here. Below, we’ve compiled a short selection of our personal favorites, as well as a few of the posts that were most popular among our readers.<br>\n*PLEASE NOTE*: Many of the articles listed below were published several years ago, meaning they may feature outdated information, broken links, and code examples that no longer work. Be sure to check our documentation for the latest.<br>\nLet’s get started with a few stories that signal how just how far we’ve come since launching the Qiskit blog back in 2016. We’ll begin with — what else? — our first post ever. The article was written by IBM researcher James Wootton, who contributed an enormous amount of content to the Qiskit blog in its earliest years:<br>\nIn reviewing our archive of Qiskit Medium blogs, we were also struck by this 2020 post proposing version 3.0 of the OpenQASM quantum assembly language. It’s fascinating to read about the specific issues and limitations in OpenQASM 2.0 that 3.0 was built to address:<br>\nAnd, of course, we’d be remiss if we didn’t highlight the most recent post on Qiskit Medium celebrating the upcoming launch of Qiskit 1.0. Be sure to take a look if you haven’t already:<br>\nQuantum Computing Explainers<br>\nLearning quantum computing can be easy and fun. Explaining quantum computing concepts—and doing so in a straightforward way that makes those concepts easy to understand—is a little more challenging. That hasn’t stopped us from trying, however. And in many cases, the results of those efforts have given us some of the only layman-friendly explanations of quantum computing concepts that you’ll find just about anywhere.<br>\nREMINDER: Keep an eye out for outdated code in this section and check our documentation for up-to-date tutorials on how to implement any of the quantum programming concepts detailed in t
