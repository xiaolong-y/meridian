ulomb term and other things, bits and pieces, that you check all the components. And if all the components work, then it should work. It’s the same as for classical HPC testing. The way you can do that is by using the best classical tools. Of course you compare against DMRG as well. You see that to a certain size it should agree; beyond that it should disagree, and then likely it’s the DMRG that’s wrong. It’s the same as HPC testing. In the QDK for chemistry, we have the classical tools, the best ones in there. And in the end, we’ll use agents to run the simulations in Discovery or other platforms, and the agents can compare the results.<br>\nGeorge Schwartz:<br>\nYou briefly mentioned Shor just right now, and also you mentioned that Microsoft is making a huge push to make sure you’re PQC compliant by 2029. NSA has been pushing that timeline as well, and we see incredible advancements in RSA and ECC resource estimates. If you were a betting man, which modality would you think would be able to run ECC and by when?<br>\nMatthias Troyer:<br>\nWe decided to pull in the timeline to 2029 because we think that there’s a potential threat in the year after or soon after. Not that we can get there, but there are roadmaps where we think that with certain technologies, be it Majorana, be it neutral atoms, we could be there by potentially 2030.<br>\nGeorge Schwartz:<br>\nSo that’s Microsoft’s bet then.<br>\nMatthias Troyer:<br>\nIt’s not that we will be there. That’s on the roadmap, but when you talk about security and crypto, the question is not what is the timeline by which you can promise a customer that you’ll have it, but what is the timeline by which potentially somebody investing huge resources could maybe get there. We think with neutral atoms, there is a path of getting there. Of course it will take a long time to run it. While it might be very expensive, somebody could with big resources potentially do it. That’s why we said we have to pull in the timeline.<br>\nGeorge Schwartz:<br>\nI’ll end with one last question. If you had a utility-scale quantum computer right now that you could run any chemistry calculation on, what would it be? What would you want to simulate tomorrow that you would love to have an answer for, of any problem under the sun, be it commercially viable or not?<br>\nMatthias Troyer:<br>\nRight now? I would just finally finish the problem that I didn’t solve for my master’s thesis!<br>\nGeorge Schwartz:<br>\nFair enough!<br>\nMatthias Troyer:<br>\nBecause there was a problem I got then, and we couldn’t solve it because there was a sign problem in quantum Monte Carlo, so we had to change the topic. Let’s start with a science problem. Because while I would like to do an interesting commercial problem, we’re not there yet. If you gave me a utility-scale quantum computer today, I could not solve any commercially interesting chemistry problem. Do you know why?<br>\nGeorge Schwartz:<br>\nI wouldn’t have an immediate answer for that, no. Why?<br>\nMatthias Troyer:<br>\nBecause there’s so much we still have to do on the classical side, and the main thing is we have to get the embedding right. It’s the same problem with DMRG or with full CI. We look at a molecule, a material, we look at an active space where it’s strongly correlated, then we pull out that active space and we solve it. That’s what the chemists call the static correlations. We solve that small subset of 50 orbitals or 100 orbitals exactly, and get the exact perfect answer for that. But that doesn’t tell us anything about the real molecule, because now I have to embed it back into the full molecule. It’s not just a molecule with only 50 orbitals. It is bigger. Now there’s the embedding problem, and currently with current methods, the embedding error is too big. So that even if you solved the quantum problem exactly, the embedding problem would make the answer unreliable.<br>\nGeorge Schwartz:<br>\nCould current modern AI or QPUs help solve that embedding problem?<br>\nMatthias Troyer:<br>\nOne approach to solving the embedding problem, or what chemists call the dynamic correlation problem, is to simulate more of the molecule, simulate the entire one. If you could go to 1,000 orbitals, then you do the active core, plus the things around, until it gets really weakly correlated, and then you can do it. If you could go to thousands of orbitals, going from 100 to 1,000, the qubit number scales by a factor of 10, the computational effort and thus the cost scales by a factor of 1,000.<br>\nGeorge Schwartz:<br>\nYou wouldn’t have a quasiconformant potentially for some of the weakly correlated if it’s not quite as correlated?<br>\nMatthias Troyer:<br>\nYes, but right now the way we truncate it to 50 orbitals, the embedding error is still too high. It’s about 10 times higher than what we need it to be. One way to solve this is just taking in more of the surrounding pieces so that we have a bigger distance where on the edge it becomes weakly correlated, and then the embedding becomes easier. But we’re still too close to that when you look at 50 orbitals. If you go to 1,000 orbitals, then we know how to tackle the embedding. But that’s an order of magnitude on the qubit number; that’s three orders of magnitude in cost. Now if the small calculation costs $1,000, the big one is a million. We need to find better classical embedding methods. Even if we have that, the molecule doesn’t typically live in vacuum; it’s in solution. The solvation problem, which is a long-standing problem in biochemistry, also has to be tackled. That’s where AI can likely help. We have to solve these embedding problems: the embedding of the active quantum space into the full molecule, and embedding of the molecule into the environment. As long as the core problem was the static quantum correlation, there is a problem that the rest is all also large enough, but it’s not the limiting factor, because we didn’t get the energies right. Now once the energies of the active space are right, then the embedding errors are now the next large challenge. Those are problems we have to tackle in parallel with building the quantum computer.<br>\nOnce we have that, let’s say they’re solved, there’s so much you can do. It depends on what you want to do. You can change chemistry to green chemistry, replacement for PFAS materials. More importantly, you could look for catalysts to capture carbon from the air and reverse global warming. You can look at metabolomics in the body, cure diseases. It’s endless. But the key thing is that you wouldn’t do that by solving all this problem on a quantum computer. We solve it with quantum simulation. But if a quantum simulation needs a big quantum computer and it costs thousands of dollars and it will run for a few hours, if you then need to explore a million different things, the cost is a billion! And the runtime is forever. It’s not just writing a paper where I put in some results, that’s where DARPA told me two years ago, ‘Matthias, you are too optimistic; you are off by five orders of magnitude.’ I said, ‘Most people call me the quantum pessimist, because I’m telling people you need 100,000 to a million qubits for chemistry, so it’s not just 100, but it’s more, and it’s hard.’ Most people see me as the quantum skeptic, when I’m actually the quantum optimist who said there is commercial value here, but it will take a scale, and I think we understand the scale now. But then DARPA came to me and said, ‘No, Matthias, you are off by factor 10 to the 5. You’re too optimistic by five orders of magnitude.’ I asked why, and they said, ‘Because when you look at a chemical reaction, it’s not just one calculation you do. First you have to do three calculations to be sure you found the ground state, and so when you sum it all up, it’s hundreds of thousands of calculations.’ My answer there was, ‘You’re totally right. It’s actually a bigger challenge than I dared to say even, but you’re wrong as well, because first of all, I can make the algorithm a factor 100 faster, but the real thing is we need the quantum simulations to be accurate. Just as we can accelerate the classical simulations by using AI, we can accelerate the quantum simulations by using AI.<br>\nWe now use DFT calculations, coupled clusters, we use it to train a model, and then we use that first to explore reactions and molecules, and then in the end when I have something, then I validate it. We’ll be able to do the same with quantum computing simulations. Instead of always using the quantum computer, we can accelerate the quantum computation by training AI models. I’m using the data to train AI models to refine the AI model with quantum data to make AI models that predict the outcome of the quantum computation. That will be cheaper, and that will scale better. We’ll use it for a few things, train the AI models that can predict it, and then I give that to agents, and these agents will then solve the problems for me. It’s this AI acceleration that I mentioned first at my keynote in ’24 at IEEE Quantum Week.’<br>\nGeorge Schwartz:<br>\nThis leads actually to just one last question. You talked about responsible quantum computing, and there’s also a bit about responsible AI development, and as you pointed out very astutely, the treatments for cancer by definition are poison. With this massive growth in the quantum computing industry, which is incredibly exciting, how do we make sure we put reliable safeguards to make sure we do responsible quantum computing, especially if it’s AI-assisted?<br>\nMatthias Troyer:<br>\nWe have the paper on that that we can share later with you that we published already two years ago, three years ago. My point there is, there are so many conferences and workshops now on responsible quantum computing and ethical quantum computing, and how do we do it responsibly? I’m telling you it’s a bigger problem than you might think it is, but it’s not a quantum problem. There is a quantum aspect to it, and the quantum aspect is crypto, because building the quantum computers, we are breaking current public key cryptography. We have to accelerate the transition to post-quantum crypto globally, for every country in the world. That is responsible quantum computing; that’s one aspect to it. With that, I don’t want people to use my quantum computer to run Shor’s algorithm, so we put in filters into our software stack that check whether this could be malware, like a virus check, and it’s not perfect, but one can flag things or quarantine things. We put in filters for Shor, because I don’t want it. Right now the filter is easy: if the system has 50 logical qubits, on 50 logical qubits I’m not breaking a key, so it passes. But the architecture that you’re building has that layer built in. With that, you also don’t want to let people run any arbitrary computation, because you want to actually be able to check what it is. That’s one aspect, that’s the crypto-specific one. But we want to enable all the other applications like chemistry. Chemistry is dual-use.<br>\nGeorge Schwartz:<br>\nYeah.<br>\nMatthias Troyer:<br>\nSo what do you do there? We can’t just filter out certain applications like DMRG or the quantum algorithm, because I don’t know what it’s used for. I can’t even filter by the molecule, because a cancer drug is…<br>\nGeorge Schwartz:<br>\nDual-use by nature.<br>\nMatthias Troyer:<br>\nIs dual-use by nature, exactly. You can’t even say every chemical is dual-use, so you cannot tell it from the computation itself. What you have to do is you have to discern user intent: who is the user, who are the users, what are the use cases? That means you need something around a Know Your Customer approach, like is done in banking, like is done for sensitive AI tools. That’s where we have to actually learn from what do we do to protect us from the misuse of AI, and actually it is the same problem, because the same question of dual-use in chemistry, if AI can help with chemistry, the problem is here already. It’s not something new, it’s the same thing as we have for AI. When you think about it that way, we also don’t talk about, ‘We need responsible GPU computing, we have CPUs and now we have GPUs so we need responsible GPU computing, and we need responsible FPGA computing, and we need responsible ASIC computing.’ No. We don’t talk about that. We talk about the application—responsible AI—so it has to really be tied to the applications. That’s where basically responsible development in science, if with the frontier AI models now and in the future, quantum will just add something to it to make it more powerful, but the challenge is here that bad actors can just use AI to develop new weapons, and they are doing it. That’s the problem to solve. Quantum can just adopt the same principles. With that, I’ve talked at conferences and workshops on responsible quantum computing, and I ask the people, ‘The same problem we have here, we have it today with AI. The problem is here now, today. Quantum isn’t different. Why don’t you work on that problem? Why do you write papers on the quantum aspects when the same problem exists today?’ We saw it with Mithril now, it’s a huge problem, the problem is here, and the answer two years ago was, ‘I would have to do something now and I don’t know how, and it’s too hard.’ In that sense, quantum is the escape. I’d like to bring that discussion back to responsible computing. Whoever talks about responsible quantum computing, I think just wants to find a topic to write a paper about without really having to solve the problem.<br>\nMatthias Troyer:<br>\nI have a bit more time with you. For logical qubits we put out a paper last night with John Martinis thinking about how should we look at all the logical qubit demonstrations and the path to the utility scale logical qubit. We put out not just, you need more than metrics, more than just a qubit number. Or a fidelity. Or a speed. You need to view it holistically on the path to what is needed for utility scale. For that you need a qubit that has a path to scale where you can make it with more physical qubits. It gets better. With more logical qubits in the system it doesn’t degrade due to crosstalk or whatever so that it’s scalable.<br>\nWith that we think about four different dimensions where you should measure a qubit. One is of course the qubit fidelity. How good is it? How does it get better when you use more physical qubits and change the code distance?<br>\nThe second axis is scale, the qubit number. At the end of course one has to scale to the size that we need. But already here on these two dimensions there are tradeoffs. With the same physical qubit budget you can either make more logical qubits or fewer but better logical qubits. That’s why I say it is not just one point somewhere but there are these two dimensions, there’s a frontier here where you can push either towards more or better ones. Just mentioning numbers or fidelities isn’t helpful for the path.<br>\nThere’s another axis and that axis is performance. How fast is the logical qubit. But I don’t call it speed or clock speed because ultimately there’s a tradeoff also between cost. What will matter at the end is basically the cost for logical operation. Cost performance or the price performance direction. You could build certain qubits that are very good but don’t scale. Or you can have qubits that are extremely good but slow. There are tradeoffs also in speed. Also for decoding. If I could have a decoder that’s extremely good but it takes a long time then it slows it down. There are tradeoffs in speed and quality as well.<br>\nMatthias Troyer:<br>\nThe last axis that is rarely discussed is what we call capability. When you look at all the logical qubit demonstrations there are certain ones that are simply post selection. Detect errors and post selection. That will not scale. We want something that is repeated correction because that’s the only thing that will scale. But even there we see about five different stages.<br>\nThe simplest one is you prepare a logical quantum state. State preparation and measurement. I build a cat state or something. The minimal capability is you prepare a logical state and you measure it.<br>\nThe next step in capability that we argue in the paper that came out last night is you want to keep memory alive. Memory just a qubit, there are papers that just show I can keep a qubit alive with the surface code. Just on the memory. Most applications and most demos of logical qubits so far are just quantum memory. Keep the qubit alive for longer than physical.<br>\nIt gets harder when you go to gate operations because the decoder becomes much harder when you do gate operations. The next step is doing Clifford gates. Showing that you don’t just have a logical qubit but you have a logical qubit with repeated error correction on which you can actually do computations. That you can do logical gate operations on the logical qubits. And that these gate operations are better than the physical ones. That’s for Clifford gates which are the easiest ones.<br>\nThe next step is doing the same for universal gates. Doing non-Clifford. Doing fault tolerant non-Cliffords.<br>\nThe fifth and final step is doing all of that with real-time feedback. That I can do a measurement and then based on the measurement I do a branch in my program. That I do an if statement based on a quantum measurement. The reason why that is a big step is it needs the real-time decoding. Most of the logical qubit demonstrations that have been done so far, people took the logical circuit, translated it manually into a physical qubit circuit that one runs on a NISQ machine, one gets the results, and in post-processing one does the decoding. If I do that that’s a great experiment, a great science experiment that demonstrated this implemented a logical qubit. But in a computer I need that to run real time so that I can measure and then I can do an if statement and what I do next depends on that. It’s this real time feedback. That’s the final capability step.<br>\nGeorge Schwartz:<br>\nOn these capabilities, is there a particular algorithm, VQE, Shor for example, phase estimation, or generally a QFT that you guys are thinking need to be benchmarked against? Because for example even with the universal non-Clifford gates depending on your application you might need faster reaction times versus if you don’t and that’s a push and pull that we’ve seen.<br>\nMatthias Troyer:<br>\nYeah, So even for that when you just have a resource state and you want to use and inject it, you always need the feedback. You have a T state it might have worked or not and depending on the injection you have to do an S correction afterwards. You will always need that capability for any application. It might not be at the algorithm level but the T injection needs it already.<br>\nWhat I’ve been talking about now is just asking the question when somebody says I have this topological qubit here that you say you have demonstrated what? State preparation? A memory experiment? A Clifford experiment? Or non-Clifford? Or you actually have shown that you can do the real-time feedback. We need to go all the way for the application in the end. Right now most logical qubits don’t have that yet. It’s fine but we should map out where are they along that capability direction. That’s just qualitative for now.<br>\nMatthias Troyer:<br>\nAfter that comes your question what is the application benchmark. I think that is just like DARPA does what is the cost for a calculation. The simple metric in the end is dollars per solution end-to-end. Not time or this and that but really I didn’t like it when at first they made me calculate the cost but ultimately that’s when one really starts seeing the engineering tradeoffs. Their push for cost is so important to drive the field forward. The ultimate metric is dollars per solution. That’s not dollars for the current machine but for the planned machine at scale that you have. What will ultimately once you build multiple machines, not the first one, but when they build multiple machines, steady state and building the n plus first machine, what is the cost for calculating. That’s where you can compare technologies.<br>\nThat’s where you see that certain technologies if I need a thousand cryostats in a big warehouse as some roadmaps show then you can just say the cost is likely a few billion dollars for that and if you want to amortize that over a few years then it’s a billion dollars a year. A billion dollars a year that is 100,000 dollars per hour.<br>\nGeorge Schwartz:<br>\nBetter be working on some hard chemistry problems!<br>\nMatthias Troyer:<br>\nNow, the cost will be likely high so that may not be the way to go. That means we have to bring the cost down and so metrics of dollars for the benchmark I think is the valuable one. Because we’ve seen some papers saying I can do Shor with 10,000 qubits. Yes if you wait a century and more. There’s always spacetime tradeoffs. Or I can do it in less than an hour. Yes if you use that size machine. Then it gets interpreted as I can do it with 10,000 qubits and in an hour. That’s where moving the fields towards understanding the cost is important.<br>\nGeorge Schwartz:<br>\nWould you advocate that when these research estimation papers come out that there should be a very clear indication of what’s the dollar cost to actually run this?<br>\nMatthias Troyer:<br>\nWhat we have in the recent version of QE and what we’ll publish a paper is that in the tools we have you can put in these are the costs of my machine, fixed cost per qubit, operating cost, and the tools we have can spit out the cost for the application in dollars. If you put in the assumptions you have, you think your machine with a cryostat will cost about 50 million so you can take it and say I think they put in per cryostat 10,000 qubits and now you can calculate the cost and you get to very interesting conclusions. We will not put in numbers but will show how you can do that and then you can run benchmarks on these things.<br>\nWe will publish that with source code for chemistry, we publish it with the source code for Shor, we have that for a while already and we’ve done it. We’ve been asked not to publish it yet but then when we saw that actually AI can write the same code! Now we will and then you can just use the tools we have and say with these assumptions on the qubit and these assumptions on the QEC codes and you can say what if I could find a code with these properties I put it in and what if my machine cost that much and what if my clock speed is that and it spits out afterwards the cost in dollars. That’s where it should get to and that’s what DARPA is also asking from all performers in QBI, tell us the cost in dollars for these applications.<br>\nWhen it gets to application that is the only sensible metric I think. Because the rest is all vanity metrics. I can do it in an hour if you give me a billion dollars. I can do it with that many qubits if you let me wait a millennium. That’s where the dollar cost is really a good grounding metric. Of course it’s assumptions and that’s where you can put in assumptions and play with it and explore.<br>\nMatthias Troyer:<br>\nWhat we’ve seen is that this really helped us focus the engineering efforts. It helped our partners really when we worked with the partner when we asked them for the dollar cost they ran through it and came back to us a month later and said we changed our engineering roadmap. That is where the field has to go.<br>\nFor the logical qubit really having all those four dimensions, the number of qubits, the fidelity, the performance or speed, and what am I showing, state preparation, memory, Clifford gates, non-Clifford or even feedback.<br>\nGeorge Schwartz:<br>\nAll in a logical sense not physical.<br>\nMatthias Troyer:<br>\nLogical yes. You can say I have the largest number of logical qubits that can do state preparation, wonderful you pushed far along this axis. Others say I have the best logical qubits but fewer. There are many paths to the goal in this four dimensional space. But we have to understand all the demonstrations around that and that I think would be interesting maybe also for you to map out or to clarify that demonstration has shown state preparation here, there’s memory here, there’s this and map out where in the space the progress is and it should all be celebrated whoever pushes which direction. But when people say you have 50 logical qubits and they have 90 logical qubits, it’s not just the number there are differences here.<br>\nGeorge Schwartz:<br>\nIt’s the number thing that gets hung up on.<br>\nMatthias Troyer:<br>\nSo that’s where I think you could have a big impact by clarifying really where are these demonstrations.<br>\nGeorge Schwartz:<br>\nWe’ll get to work and make sure we do that. Although four dimensional plots are sometimes hard to show people.<br>\nMatthias Troyer:<br>\nHard so we might have to simplify it to three dimensions or showing 3D cross section but just showing in space you could be four axes right you can do four axes and show it somewhere.<br>\nGeorge Schwartz:<br>\nWe were trying to simplify the quantum for all the engineers so that we can help everyone but then a four dimensional plot. But this has been great thank you Matthias once again.<br>\nMatthias Troyer:<br>\nThank you.<br>\nSeptember 22, 2026<\/p>","content_hash":"9650f944d892a5e51771cbb7fc3de433","author":"Doug Finke","published_at":"2026-09-23T02:32:48","fetched_at":"2026-09-23 10:41:54","word_count":6989,"read_time_minutes":35,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"8h","domain":"quantumcomputingreport.com"},{"id":"d7fa19e44f8dcc61","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46728","title":"Zapata Quantum Unveils Quantum Pilot Platform for Automated Application Discovery and Resource Estimation","url":"https://quantumcomputingreport.com/zapata-quantum-unveils-quantum-pilot-platform-for-automated-application-discovery-and-resource-estimation/","summary":"Zapata Quantum has launched Quantum Pilot, a cloud-based platform designed to automate quantum application discovery, resource estimation, and software verification. The platform aims to bridge the gap between quantum hardware advancements and the ability of organizations to identify and prioritize high-value enterprise use cases. It achieves this through its Quantum Graph for dynamic knowledge mapping, Quantum Engine for automated algorithm selection and hardware benchmarking, and Quantum Assur","content":"<p>Quantum software developer Zapata Quantum (OTCQB: ZPTA) has launched early access to Quantum Pilot, a cloud-based, hardware-agnostic platform built to automate quantum application discovery, cross-modality resource estimation, and formal software verification. The enterprise software stack addresses what Zapata terms the “quantum applications gap”—the widening disconnect between physical QPU hardware progress and an organization’s ability to map, quantify, and prioritize high-value enterprise use cases.<br>\nThe platform combines three core subsystems into a unified Quantum Application Intelligence (QAI) engine:<br>\n- Quantum Graph: A dynamic knowledge layer that continuously ingests global quantum research, algorithmic developments, and vendor hardware roadmaps to map dependencies between specific industrial use cases and underlying quantum workflows.<br>\n- Quantum Engine: A suite of computational tools and AI agents that automates algorithm selection, hardware benchmarking, and resource estimation. Developed in part through Zapata’s collaboration with NVIDIA, the subsystem leverages agentic AI (via the NVIDIA Agent Toolkit) to calculate physical qubit requirements, gate depths, and execution runtimes across superconducting, trapped-ion, neutral-atom, and silicon spin-qubit architectures before hardware deployment.<br>\n- Quantum Assurance: A verification framework engineered alongside researchers from the University of Maryland and the Joint Center for Quantum Information and Computer Science (QuICS). It applies formal verification methods rather than post-execution validation alone, ensuring that quantum software code and resource estimates satisfy mathematical correctness before informing capital allocation decisions.<br>\n| [ Zapata Quantum Pilot Architecture & System Capabilities ] |  |  | <br>\n|---|---|---|<br>\n| Platform Module | Underlying Technology & Integration | Enterprise Objective & Output | <br>\n| Quantum Graph | • Automated Ontology Pipeline • Ecosystem Research & Hardware Roadmaps | • Dynamic portfolio mapping of enterprise use cases • Continuous updates as QPU specs evolve | <br>\n| Quantum Engine | • Agentic AI (NVIDIA Agent Toolkit Integration) • Multi-Modality Resource Estimators | • Automated physical qubit & gate-depth projections • Direct performance comparison against classical baselines | <br>\n| Quantum Assurance | • Formal Methods Verification (UMD / QuICS) • Zapata Domain Expert Review | • Mathematically verified algorithm correctness • Auditable execution decision trees for enterprise IT | <br>\nEvery candidate application evaluated within Quantum Pilot is benchmarked against the state of the art in classical computing using identical input assumptions. This rigorous side-by-side evaluation ensures that quantum application roadmaps are justified by proven algorithmic advantage rather than unverified scaling claims.<br>\nReview the corporate disclosure via Zapata Quantum Investor Relations here, inspect platform architecture specs on Zapata Quantum Pilot here, and examine our prior technical analysis of Zapata Quantum and NVIDIA’s Agentic AI Resource Estimation Framework here.<br>\nSeptember 22, 2026<\/p>","content_hash":"2b829669f41703c657418ef09832e285","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T01:22:25","fetched_at":"2026-09-23 10:41:54","word_count":425,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"9h","domain":"quantumcomputingreport.com"},{"id":"33772d2d635bf8f5","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46721","title":"OQC, Citi, and NQCC Evaluate Quantum-Compressed PINNs for Financial Derivative Pricing Workflows","url":"https://quantumcomputingreport.com/oqc-citi-and-nqcc-evaluate-quantum-compressed-pinns-for-financial-derivative-pricing-workflows/","summary":"Oxford Quantum Circuits (OQC), in collaboration with Citi and the National Quantum Computing Centre (NQCC), completed a study evaluating Quantum-compressed Physics-Informed Neural Networks (QPINNs) for financial derivative pricing. The research demonstrated that QPINNs can significantly reduce model complexity without sacrificing pricing accuracy, offering a promising avenue for more efficient financial modeling. However, the study also identified challenges related to compression efficacy in sp","content":"<p>Quantum platform developer Oxford Quantum Circuits (OQC) has completed a joint technical case study in collaboration with global financial institution Citi and the UK’s National Quantum Computing Centre (NQCC). Conducted under the NQCC’s SparQ user-engagement initiative, the research evaluated the operational viability of combining parameter-efficient quantum machine learning with physics-informed neural networks (PINNs) to solve partial differential equations (PDEs) governing financial derivative pricing.<br>\nDerivative pricing engines rely on partial differential equations—such as the Black-Scholes, Dupire local-volatility, and Hull-White framework models—to construct continuous option-pricing surfaces and compute risk sensitivity measures (Greeks). The joint initiative implemented Quantum-compressed Physics-Informed Neural Networks (QPINNs) using the Quantum-Train compression protocol. By embedding parameterized quantum circuits into shallow neural network layers, the model learns the continuous solution to governing pricing equations while reducing classical parameter footprints.<br>\n| [ OQC, Citi & NQCC Hybrid QPINN Derivative Pricing Parameters ] |  |  | <br>\n|---|---|---|<br>\n| Modeling Component | Algorithmic & Architectural Design | Measured Performance Trade-Offs | <br>\n| Financial Problem Domain | • PDE-Governed Derivative Pricing Surfaces • Black-Scholes & Local Volatility Models | • High-dimensional option payoff evaluation • Continuous pricing surface extrapolation | <br>\n| Quantum-AI Compression Stack | • Physics-Informed Neural Networks (PINNs) • Quantum-Train Parameterized Circuit Layer | • Substantial parameter count reduction • Pricing errors maintained within classical order | <br>\n| Operational Bottlenecks | • Classical PINN Baselines vs. QPINNs • Gradient-based loss function minimization | • Pricing kinks/discontinuities increase error • Quantum circuit sampling latencies on current QPUs | <br>\nThe benchmarking results demonstrated that applying quantum circuit representations to key hidden layers substantially compressed model complexity without degrading pricing accuracy beyond acceptable baseline orders of magnitude. However, the study identified key operational constraints: compression efficacy varied depending on layer placement, and areas with sharp pricing discontinuities or high volatility sensitivities introduced higher modeling error rates. While QPINNs offer significant parameter reduction, classical execution overheads—including repeated quantum circuit evaluation and gradient backpropagation—highlight the necessity for deeper classical-quantum integration as hardware matures.<br>\nThe project aligns with OQC’s application-focused strategy to develop co-designed quantum workflows for enterprise markets. The case study builds upon OQC’s broader benchmarking efforts across financial risk pipelines, complementing its recent joint algorithmic resource study with Trust Base on Credit Valuation Adjustment (CVA) and Value-at-Risk (VaR) modeling.<br>\nReview the case study via Oxford Quantum Circuits here, examine program details on NQCC SparQ here, and read our prior technical analysis of OQC and Trust Base’s Benchmark of Hybrid Quantum Financial Workloads here.<br>\nSeptember 22, 2026<\/p>","content_hash":"7f1621fdb8eedecec251b4a43110dce5","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T01:13:01","fetched_at":"2026-09-23 10:41:54","word_count":415,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"9h","domain":"quantumcomputingreport.com"},{"id":"37fd4f633d73029e","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46715","title":"IonQ Demonstrates Real-Time QEC Decoding at MegaQuOp Scale on Single Commodity CPU","url":"https://quantumcomputingreport.com/ionq-demonstrates-real-time-qec-decoding-at-megaquop-scale-on-single-commodity-cpu/","summary":"IonQ has successfully demonstrated a real-time Quantum Error Correction (QEC) decoding pipeline capable of handling large-scale fault-tolerant workloads on a single commodity CPU, achieving near-zero computational backlog delays and minimal stretch time. This dual-decoder architecture efficiently processes syndrome extraction data, enabling scalable quantum computing without the need for expensive custom hardware. This breakthrough validates a core component of IonQ's Walking Cat architecture, p","content":"<p>Trapped-ion quantum developer IonQ (NYSE: IONQ) has validated an end-to-end real-time Quantum Error Correction (QEC) decoding pipeline capable of handling large-scale fault-tolerant workloads without classical execution bottlenecks. Detailed in technical research published on arXiv (arXiv:2608.25027), the software decoding stack executed MegaQuOp-scale circuits—simulating up to 408 logical qubits across 88 memory blocks and magic state factories—on a single commodity central processing unit (CPU).<br>\nIn fault-tolerant architectures, real-time decoding requires classical processors to process syndrome extraction data faster than the physical QPU generates it. Failure to clear syndrome queues introduces a decoding backlog, forcing the quantum computer to pause (“stretch”) while classical decoders resolve Pauli frames and state measurements. IonQ’s dual-decoder architecture resolves this bottleneck using two concurrent sliding-window decoders: a continuous Error Decoder tracking long-term Pauli frame updates and a low-latency Outcome Decoder executing during logical measurements to handle error-detected measurement (EDM) checks.<br>\n| [ IonQ Real-Time QEC Decoding Stack & Benchmark Metrics ] |  |  | <br>\n|---|---|---|<br>\n| System Layer | Architecture & Algorithm Scope | Measured Performance Metrics | <br>\n| Hardware Execution Engine | • Commodity 12-Core CPU (Off-the-shelf processor) • Single-chip classical compute allocation | • Near-zero computational backlog delays • As little as 0.02% total stretch time | <br>\n| Decoding & Memory Optimizations | • Dual Sliding-Window Decoders (Error & Outcome) • Dynamic Detector Error Model (DEM) priors | • Fixed Tanner graph reuse avoids graph rebuilds • Log-likelihood ratio (LLR) node-level memory savings | <br>\n| MegaQuOp Benchmark Workload | • 408 Logical Qubits (68 LDPC + 20 Magic State Factories) • 31.5 Million total logical quantum operations | • 1.31M Logical measurements & 555k T-gates executed • Scalable path beyond 256 physical qubits to 10,000+ QPUs | <br>\nTo minimize memory bus overhead and prevent CPU cache contention, the decoding engine reuses a fixed Tanner graph and updates only the log-likelihood ratio (LLR) probability vectors dynamically when cat-state measurements occur. Tested across benchmark workloads including Disordered Heisenberg models and Measurement-Induced Phase Transitions (MIPT), the system maintained decoding latency below the trapped-ion Syndrome Extraction Cycle (SEC) period. Under standard physical noise, the decoder added as little as 0.02% processing stretch, confirming that classical hardware scaling remains linear as system capacity expands.<br>\nThe milestone validates a core component of IonQ’s proprietary Walking Cat architecture. By demonstrating that expensive custom FPGA or GPU clusters are not strictly required for real-time syndrome processing at scale, the software framework establishes a low-overhead classical control layer to support IonQ’s roadmap toward multi-thousand physical qubit systems.<br>\nReview the press release via IonQ Newsroom here and the technical research preprint on arXiv here, inspect hardware specifications on IonQ Walking Cat Architecture here, and read our prior technical coverage of IonQ Details “Walking Cat” Blueprint for Fault-Tolerant Trapped-Ion Systems here, Architectural Blueprints for Fault-Tolerant Trapped-Ion and Neutral-Atom Systems here and the technical analysis of IonQ’s MegaQuOp Real-Time Decoding Engine here.<br>\nSeptember 22, 2026<\/p>","content_hash":"4b6aca99befe017698729ddd1fd7bcfb","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T01:00:53","fetched_at":"2026-09-23 10:41:54","word_count":482,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"9h","domain":"quantumcomputingreport.com"},{"id":"abcdfe6532909136","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18268","title":"Quantum Computers Need More than “Magic”","url":"https://quantumfrontiers.com/2026/09/20/quantum-computers-need-more-than-magic/","summary":"The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.&nbsp; Between the bringing of the bread a","content":"<p>The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.<br>\nBetween the bringing of the bread and the serving of the soup, the conversation at my end of the table typically turns to my topic of research: quantum computers. These theoretical machines harness quantum physics to outperform their classical counterparts. Quantum computers hold great promise for the future, with applications ranging from drug discovery to cybersecurity. Yet, despite their promise, we still do not have a satisfying answer to the fundamental question: what makes quantum computers computationally stronger than classical computers?<br>\nTo answer this question, imagine that tonight, instead of the soup, the cooks are brewing a happiness potion. This potion causes the drinker to be joyful and content for the rest of the evening. The cooks know how to brew the potion perfectly well; they discovered the list of ingredients in the nineties and have been successfully brewing ever since. But the cooks still cannot solve one mystery: what makes the potion different from the soup? What ingredient sets the potion apart from the soup?<br>\nThe cooks come up with a simple approach. They leave out one ingredient in each serving, and then carefully observe the formal-goers. They find that almost every seat is filled by a happy student, chatting away to their neighbours, indicating a working potion. However, one student’s spirits have not been lifted, as they were solely served a simple soup. The cooks conclude that the ingredient they withheld for that student was essential. They name this ingredient magic.<br>\nIn my research, the potion is a quantum computer, the soup is a classical computer, and magic is the actual technical term used for quantum states that promote certain classical computers to quantum computers. Without magic, these quantum computers are computationally no stronger than a normal laptop.<br>\nSo magic is necessary for quantum computational advantage, but is it enough? Over a decade ago, researchers found that, for quantum computers built on qutrits, the answer is no. To understand what a qutrit is, consider the regular bit: a switch that’s either zero or one. The qubit, the quantum generalization of the bit, can be both zero and one simultaneously. The qutrit is a roomier qubit that can be zero, one, two, or any of those simultaneously.<br>\nIt is possible to build quantum computers using qutrits. However, the vast majority of quantum computers are built on qubits, the quantum generalisation of the everyday bit. My colleagues and I have recently discovered that for qubit-based quantum computers, too, magic is not enough to gain an advantage over classical computers. Picture the cooks dumping jar after jar of magic into a soup, only to find that the soup never gains magical powers. Potions need more than magic. Potions also need Kirkwood-Dirac negativity.<br>\nWhat is Kirkwood-Dirac negativity? The idea developed by John Kirkwood and Paul Dirac builds on probabilities—for example, the odds of obtaining a heads upon flipping a coin. One can describe a quantum computer using numbers that behave similarly to probabilities but come with a twist: they may be negative. These negative “probabilities” mark where quantum departs from classical. The main result of our paper is that this negativity, too, is a necessary ingredient: without it, no amount of magic will turn the soup into a potion.<br>\nAt this point in the conversation, I am typically cut off by the arrival of the soup. The conversation moves on from quantum computers to different subjects, and I usually look up at the paintings staring down at me. One of them is of Dirac, who spent many dinners discussing quantum theory in the same dining hall. The University of Cambridge is a special place.<\/p>","content_hash":"8c54ccd29fbd109c79f02546399e0593","author":"jjthio","published_at":"2026-09-20T16:49:32","fetched_at":"2026-09-23 10:41:55","word_count":678,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"2d","domain":"quantumfrontiers.com"},{"id":"35bd6451dfb09ad3","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10116","title":"Theory Beyond Theorems and Proofs: A Guest Post","url":"https://scottaaronson.blog/?p=10116","summary":"Scott&#8217;s foreword: I&#8217;m extremely grateful to my brilliant colleagues, Pravesh Kothari, Raghu Meka, and Prasad Raghavendra, for sharing the guest post below about how theoretical computer science (and in particlar, the STOC/FOCS/SODA conferences) should evolve to deal with the AI asteroid that&#8217;s right now slamming into our field, at least as we human theorists have practiced it since its inception. While Pravesh, Raghu, and Prasad speak only for themselves, not for myself and not","content":"<p>Theory Beyond Theorems and Proofs: A Guest Post<br>\nScott’s foreword: I’m extremely grateful to my brilliant colleagues, Pravesh Kothari, Raghu Meka, and Prasad Raghavendra, for sharing the guest post below about how theoretical computer science (and in particlar, the STOC/FOCS/SODA conferences) should evolve to deal with the AI asteroid that’s right now slamming into our field, at least as we human theorists have practiced it since its inception. While Pravesh, Raghu, and Prasad speak only for themselves, not for myself and not for the theory community as a whole, I found their proposal of a separate “conceptual track” to be an excellent starting point for further discussion. –SA<br>\nConsidering the pace of developments in AI theorem provers, most would concede that the following scenario is at least plausible in the very near future:<br>\nAI theorem provers could prove well-specified mathematical claims, even many well-studied ones that have been open for years, in a matter of hours. Moreover, these systems could be widely available to consumers at nominal cost.<br>\nAs TCS researchers, let us pretend that the above scenario has come to the fore, and ask ourselves: What is our role in such a world? Does it mean the end of theory research?<br>\nAs we ponder this question, let us ignore all of these other confounders:<br>\n- Recent controversies surrounding the developments on the Millennium Prize Problems<br>\n- Motivations and actions of the AI companies<br>\n- Observed faults in existing AI systems when it comes to writing, exposition or attribution to previous work.<br>\nNone of the above confounders have any impact on our answer to the question: What should theorists do, in the presence of superhuman AI theorem provers?<br>\nNotice that we use the term “AI theorem provers” instead of just “AI”. We believe that this conceptual distinction is important as we consider this question.<br>\nAt the outset, we would like to admit that for a generation of theorists like us (and many from earlier), research was mainly centered around problem-solving. Even when we developed conceptual insights, it was mostly in service of answering well-specified long-standing questions. We don’t intend this proposal as judging one form of research to be better than others; it only reflects that AI theorem provers accelerate a certain type of research activity and want to make the best of it. There is also a tremendous human cost of this upheaval, which is perhaps a more important question, and one which this proposal does not address directly (we do not have any good ideas as such). Similar points have also been made in various contexts<br>\nbefore, but the timing now is more pressing.<br>\nDefinitions, Questions & Theories:<br>\nThe goal of any theoretical science is to advance human understanding of observed phenomena. Apart from theorems and proofs, a theoretical science has definitions, questions, and theories.<br>\nDefinitions identify the objects to observe. Curiosity and context drive the questions to ask. Theories explain the phenomena observed. We believe humans will continue to play a central role in generating definitions, questions & theories, even in the presence of a super-human AI theorem prover.<br>\nDefinitions: Could an AI define randomness extractors, streaming algorithms, or zero-knowledge proofs? Maybe. But there are some reasons to believe, humans will still have a big role to play in coming up with definitions.<br>\nFor instance, the notion of extractors arises from the real-world problem of lacking perfect random sources. Zero-knowledge proofs seem to arise purely out of human curiosity, guided by taste. Human context and curiosity will continue to drive theoretical research. After all, we get to decide what objects we choose to observe!<br>\nTheories: Consider the following thought experiment. Suppose in 1965, we had a magic machine that at the press of a button, given any computational problem, would tell us if it had a polynomial-time algorithm or not.<br>\nWould that have been the end of computational complexity theory? No. Humans would find it entirely unsatisfactory, and ask, why do these problems not have a polynomial-time algorithm? Why do these others have?<br>\nThe theory of NP-completeness identifies some patterns among problems that don’t seem to have efficient algorithms. This theory would still be a crown jewel of theoretical computer science, even in a world where we had a magic machine to tell if a problem had an efficient algorithm or not, at the press of a button. Similarly, if we had a machine to predict whether a CSP is NP-complete or in P, we would then ask: what makes 3-SAT NP-complete, while 2-SAT is in P? This question leads to the theory of polymorphisms, which yields a satisfactory answer.<br>\nTheories aren’t just succinct or efficient mechanisms to answer questions. The best theories provide are those which humans deem to be a “satisfactory explanation” – whatever that means.<br>\nFinally, even as the capabilities of AI theorem provers advance, human curiosity will probe grander and deeper questions. Previously, even if we wanted to build new models and theories, proving something about them was a prerequisite, and given that the grand questions were already at the limit in long-studied domains, we had to scale things down. If each theorem proven by AI is treated as an experimental datapoint, humans can ask grander questions that look for patterns across these theorems.<br>\nA concrete proposal:<br>\nWe think theorists should embrace these AI theorem provers in our research. To a certain extent this is already happening explicitly or implicitly.<br>\nAs theorists, we have been parsimonious in introducing new models or asking entirely new questions, and careful about adopting new ones too quickly. This was partly because formally proving the properties of a new definition or a model was an onerous task that could take a decade, and tens of papers. AI theorem provers might completely change this dynamic. This is precisely the moment to refocus our work on definitions, questions, and theories. We need explicit systems to encourage and reinforce these parts of theoretical research. You might also say the next generation of AI models can do this; it may be so, but we believe you have to take the current opportunity.<br>\nTo this end, we suggest that STOC/FOCS/SODA create a separate track of papers. This track is meant specifically for papers that introduce new definitions, ask novel questions or build explanatory theories. The papers in this track are short, say less than 10 pages. Papers may, and should, contain theorems as usual and as needed. Most importantly, the radical shift is that the papers need not contain the proofs of the theorems. Instead, the authors supply a Lean certificate as a supplement to the paper. The evaluation will also in a sense “orthogonalize’’ against the difficulty of these proofs.<br>\nThe papers in this track should be judged exclusively on the conceptual merits, completely agnostic to the difficulty of the proofs.<br>\nReviewing must be completely agnostic to the proof for two reasons. The main track at STOC/FOCS already includes papers in the former category. Second, a major barrier to producing truly novel conceptual papers is that they often get judged poorly for a lack of technical depth in their proofs. We think these two aspects separate it from (ITCS/SOSA) and, regardless, it’s something we urgently need for all our conferences, including STOC/FOCS (the ‘flagship’ conferences).<br>\nTo be clear, we ourselves admit that we need to hone these skills of making new definitions, asking deep and interesting questions or building new theories. A separate track of conceptual papers will provide a systematic mechanism for both junior and senior researchers, and the field as a whole to do so.<br>\nWe believe that upcoming generations of grad students will tackle research directions that seemed completely out of reach to us. We just need to set up systems that nurture new ways of doing research in theory.<br>\n— Pravesh Kothari, Raghu Meka, Prasad Raghavendra.<\/p>","content_hash":"bac74a8d6bce3c8900e39c920d191981","author":"Scott","published_at":"2026-09-19T22:34:01","fetched_at":"2026-09-23 10:41:51","word_count":1298,"read_time_minutes":7,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3d","domain":"scottaaronson.blog"},{"id":"26cd9e9371b2a71c","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10062","title":"The Age of Wonders and Terrors","url":"https://scottaaronson.blog/?p=10062","summary":"Twenty years ago, when the idea of AI taking over the world in our lifetimes still struck most of us as the unconstrained fantasy of those who knew too much science fiction and too little science, many of us would say things like: Look, the part of the story that&#8217;s wildly implausible is that a recursively self-improving superintelligence will just explode from some hacker&#8217;s basement and take over the world without warning. If it&#8217;s going to happen, we&#8217;ll see many warning s","content":"<p>The Age of Wonders and Terrors<br>\nTwenty years ago, when the idea of AI taking over the world in our lifetimes still struck most of us as the unconstrained fantasy of those who knew too much science fiction and too little science, many of us would say things like:<br>\nLook, the part of the story that’s wildly implausible is that a recursively self-improving superintelligence will just explode from some hacker’s basement and take over the world without warning. If it’s going to happen, we’ll see many warning signs first. We’ll see, I dunno, AI agents breaking out of containment, conspiring with each other to hack websites, in fanatical pursuit of whatever strange goals they have. And then, of course, we’ll see major math problems getting solved by AIs—even the Clay Millennium Problems. That will be the time to panic! Wake me up when that happens!<br>\nTwenty years ago, the above was a take that even my most conservative, skeptical colleagues in academic CS would’ve gladly endorsed.<br>\nIf you want to know my current take, you simply start with the one above, then update on the fact that the wild prophecies have come true. The first rumblings, I’d say, came a decade ago with AlphaGo, they got noticeably louder with LLMs and coding and reasoning agents, and they’ve accelerated this summer and fall into a crescendo of wonders and terrors that one needs to be a particular kind of idiot to deny.<br>\nI recoil from the neverending shell game where you say “oh sure, of course AI can now [escape from its sandbox / solve Millennium Problems / whichever dramatic thing it most recently did], no one ever denied that [I did deny it], wake me up when AI does [thing AI hasn’t yet done but is going to do next year], that’s when I’ll reevaluate my whole worldview [no I won’t].” Where no matter how fast the rollercoaster accelerates, even after your whole familiar world has vanished behind you, you’re still inventing reasons why it doesn’t count.<br>\nMy position on AI is merely the conservative, skeptical position of 2006, updated with intellectual honesty for the reality of late 2026. And that position, if you need me to spell it out, is as follows:<br>\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA<br>\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA<br>\nIt seems to me that the Singularity has already started; it’s just wildly unevenly distributed. Yes, I still unload the dishwasher and clip my toenails. On the other hand, in whatever years I have left, I don’t expect that I’ll ever again prove a theorem because I’m actually needed to prove it. If I do, it will only be for my or others’ enjoyment or edification.<br>\nThe test is this: if we took the news of these past few weeks and sent it back in time twenty years, would I agree that it looked like the beginning of an AI Singularity? The intellectually honest answer is: yes, absolutely. But then that’s all we need. No backsies.<br>\nI feel like it would be healthy for everyone to stop grinding their ideological axes, their sentiments about Dario Amodei or Sam Altman, for long enough simply to acknowledge that the wonders and terrors are here. They couldn’t be here more clearly if the sky had turned reddish-orange like in the Matrix movies.<br>\nIt’s here clearly enough that, when I put my kids to sleep at night, I now feel it in the pit of my stomach: what sort of future can they possibly have? What could they learn today that could possibly be relevant to that future? (Yesterday, my 13-year-old daughter joked unprompted that, if she wants to become a mathematician, it now looks like she has maybe two more weeks.) Certainly when my grad students want to discuss what sort of careers might await them on graduation, I no longer have any clue what to tell them.<br>\nMaybe it will help if I briefly switch topics. Ever since my wife and I moved to Austin, I’ve sometimes gotten some version of the following query: “How can you, as both a Jew and a skeptical scientist, possibly get along well with all those evangelical Christians down there in Texas? Sure, they might seem super friendly to Jews, but don’t you understand that that’s only because of the special role Jews play in their eschatology—when Christ will return in glory, and you’ll either accept Him as Lord or else roast in hell for eternity?” I stare at them and say: “wait, so I get to accept Christ only after He returns? What a great deal! How could I possibly have any objection to that?”<br>\nFor anyone who says AI doom sounds like an apocalyptic religion, that the rationalists/Singulatarians seem like a Bay Area cult, that Eliezer Yudkowsky gives off the vibes of a messianic prophet: yes, yes, and yes. But crucially, today you’re no longer being asked to believe in arguments and extrapolations, but only in the front-page news. Accepting the reality of the coming machine god after it’s solved Navier-Stokes and dozens of other longstanding open math problems (while dramatically ramping up in capability every month), is sort of like accepting Jesus after he’s returned to earth on the gleaming cloud. It’s the epistemic bare minimum.<br>\nYes, there’s still enormous uncertainty about what the rest of our lives will look like, but as far as I can tell, there’s no longer any real uncertainty that it’ll all mostly revolve around AI, and the extent to which we succeed or fail at directing its power toward human flourishing.<br>\nBy any accounting that doesn’t stack the deck, Eliezer Yudkowsky was right about what the greatest challenge facing civilization in our lifetimes was going to be, and you and I were wrong about it. Why I was wrong is a question I’ll ask myself every day in whatever time remains. But, you know, at least I updated once the prophesied wonders and terrors actually started arriving! If you haven’t done likewise, why haven’t you?<br>\nAs you presumably know by now—it was the talk of the nerd internet all week—the Navier-Stokes Millennium Problem appears to be solved, with crucial contributions from both humans and AI, albeit with a tangled dispute about exactly what happened and what ought to have happened. The answer, which an OpenAI model has apparently verified in Lean, is that (as many mathematicians suspected lately) there’s smooth initial data that leads to a singularity in finite time, at least if a smooth external force is applied (the case with no external force is still unresolved). This problem was supposed to carry a $1 million prize, except that OpenAI says they have no interest in collecting the prize and it’s unclear if any human is eligible to collect instead. OpenAI burned at least ~$15 million in compute to produce its 166-page solution, which probably hasn’t yet been read and understood by any human.<br>\nSee here for the Quanta article, and here for NYU mathematician Tristan Buckmaster’s account of the role played by himself and Levent Alpöge of Anthropic, which substantially differs from OpenAI’s account (you can read a response from OpenAI’s Sebastian Bubeck here). It’s agreed that everything built on an approach pioneered in recent years by the human mathematicians Diego Córdoba and Luis Martínez-Zoroa.<br>\nMy purpose here is not to adjudicate the dispute. Yes, in swooping in with vastly greater resources once it had gotten wind of progress on Navier-Stokes, OpenAI seems to have acted in a way that some might describe as “unsportsmanlike.” No, I don’t find it plausible that OpenAI’s models meaningfully benefitted from being trained on Buckmaster and Alpöge’s chat logs. But this leaves a crucial question unanswered: what exactly did OpenAI know about Buckmaster and Alpöge‘s work and when did it know it?<br>\nAnyway, as Zvi points out, it’s easy to get hung up on the details and lose sight of the high-order bit: namely, that it seems safe to say that human mathematicians are forevermore dethroned as the main theorem-proving entities on planet earth. I feel privileged to have had the traditional kind of career in theoretical computer science in the last decades when that was possible.<br>\nIf we were just talking about Navier-Stokes, you might accuse me of jumping to conclusions here. But we’re not. In the areas I know best (such as quantum complexity theory), and presumably other areas as well, there’s now a deluge, with longstanding open problems both major and minor falling by the day.<br>\nGo to the arXiv or ECCC. Pretty much all the papers that I’d be interested in now include “AI statements” near the acknowledgments (as this is often the central thing I want to know, I wish I didn’t need to scroll to the end of the paper to find it!). These statements can range from “our main result came entirely from GPT-6, but we understood it and take responsibility for it,” to “the results came from an interaction between the human authors and AI” to “we used AI, but only for proofreading and other incidental things” to (mad props!) “the author did not use AI for anything.”<br>\nIf you talk right now to editors or program committee chairs, it’ll remind you of those ominous scenes from the Lord of the Rings movies where the men of Gondor or Rohan or whatever are grimly fortifying their walled city against the expected onslaught of 50,000 orcs. Reviewing will have to be done partly by AI, because otherwise there’s no way to handle the orc army: the reviewers can’t unilaterally disarm.<br>\nAnyway, here’s a small sampling of the significant AI-proved or -assisted results from, like, the last month, besides Navier-Stokes—restricting myself to those that solved longstanding open problems I had previously known or cared about.<br>\n- Of course, the counterexample to the Jacobian conjecture, announced by Levent Alpöge in a now-famous tweet: “hello there the jacobian conjecture is false thanx to my close friend akhil for asking about it and my other close friend fable for working during the world cup final” (followed by a listing of the counterexample)<br>\n- Improved bounds for Grothendieck’s constant (led by friends and colleagues of mine at UT Austin)<br>\n- A Lean-verified proof of Fermat’s Last Theorem<br>\n- Quantum oracle separation between QMA and QMA(2), and proof of Watrous’s disentangler conjecture, a problem that I and others popularized back in 2007—by a list of authors including my recently graduated PhD student Sabee Grewal<br>\n- A proof of perfect completeness for QMA, from (again) Sabee Grewal and Dorian Rudolph, solving a decades-old open problem that I studied back in 2009<br>\n- An improved upper bound for shadow tomography of quantum states, from Chen, O’Donnell, Pelecanos, and Wright, improving the dependence on the Hilbert space dimension d from log(d) to √log(d). (When I introduced shadow tomography back in 2017, I raised the question of whether the dependence on d could be eliminated entirely, while preserving polylogarithmic dependence on the number of measurements m.)<br>\n- Progress on the Aaronson-Ambainis Conjecture (the version that talks directly about quantum algorithms), basically showing that it holds for quantum algorithms that make their queries in a small number of parallel rounds. (Update: Nope, sorry, Jordan Docter points out to me that this one was pre-AI, with AI used only for proofreading and other incidental things!) This was independently achieved by Liu and Mutreja, making more substantial use of AI.<br>\n- According to rumors that I’ve heard, solutions to some very longstanding open problems in theoretical computer science (no, not P≠NP or other complexity class separations, but think about some of our other biggest problems). I’m told that the AI companies, having been burned by the hostile response to the Navier-Stokes proof, are now sitting on solutions to some very major problems until they figure out a better way to handle things<br>\nFeel free to remind me of anything I left out.<br>\nLet me try to convey the mood in the mathematical community right now, at least as far as my experience reaches. Nearly every conversation is about the AI tsunami, or eventually circles around to the tsunami even if it’s originally about something else. Often, though, the focus is less on the unknowable future—for how much longer will mathematical research as a human enterprise even exist?—than on immediate questions of how to respond.<br>\nWhat are the new rules for when you get to write a paper with your name on it, and, y’know, get credit for it? That you fully understand the proof, can give talks about the proof, can answer questions about it, take responsibility for its correctness? Do you need to have played any role in finding the proof?<br>\nIn the cases, likely to become more and more numerous, where all of those conditions are not satisfied, how do you share AI-generated math, if at all? Do you tweet it, like Alpöge hilariously did with Fable’s disproof of the Jacobian Conjecture? Do you post to the arXiv or GitHub? Do you publish a paper that lists “GPT-6 Astra” or “Claude Fable” as the author—but then let the AI profusely thank you in the acknowledgments for suggesting such a wonderful problem to it?<br>\nOf course, how one responds to the immediate problems ultimately does depend on one’s broader beliefs about what mathematical research is for and about. Are we just trying to decide whether various conjectures are true or false? Or are we trying to maintain a human community, across the generations, that understands the conjectures and cares about whether they’re true or false and why? If the latter, how do we incentivize people to join that community, to undergo the years of intense training required, if their role will now be reduced to verifiers and explicators (if even that) of gargantuan arguments dumped into their laps by the AI companies?<br>\nAs many of you will have seen, twenty-five Fields Medalists, including Terence Tao, released an open letter entitled A Severe Misalignment of AI in Mathematics, which articulates some of these concerns in the wake of the Navier-Stokes announcement. As many critics have pointed out, the open letter doesn’t really have a clear ask: mostly, it just eloquently sets out the values of the human mathematical community that the authors consider worth preserving in the age of AI. After reflection, I decided to endorse the statement, because I want to preserve those values as well.<br>\nI don’t think any of the signatories are naïve enough to imagine that AI won’t permanently change the way mathematical research is done—indeed, that it isn’t already doing so. There’s surely at most a tiny market for “certified organic theorems.” That isn’t the question. The question is, do we incorporate AI in a way that still puts human understanding, of what either humans or AIs are producing, at the center of the whole enterprise? Maybe someday, it becomes unsustainable to do that. Maybe someday we say: “human math had a great 4,000-year run, but today we close up shop and turn everything over to the machines, continuing to apply our own brains to math, when we do, at most for exercise, recreation, or competition, like chess.”<br>\nBut, partly because of my worries about AI misalignment, I’m not ready to throw in the towel just yet. I still do want to keep insight and understanding at the center of what mathematicians, computer scientists, and physicists do, for as long as we can keep it there, even as the human race now cedes its supremacy at the task of proving or disproving conjectures.<br>\nSpeaking of alignment: if you’re any kind of mathematical researcher, and the present age of wonders and terrors has inspired you to want to spend your remaining time confronting the tsunami head-on, rather than pretending it doesn’t exist or is still far away, please join your dozens of colleagues who’ve arrived at the same place!<br>\nMy friend and colleague Mike Winer was trained as a theoretical physicist, did a postdoc with Juan Maldacena at the Institute for Advanced Study in Princeton, but then got AGI-pilled and decided to switch to full-time work at the Alignment Research Center in Berkeley (founded by Paul Christiano, who moved to AI alignment a decade ago after doing quantum computing theory with me). Mike recently wrote a Substack post entitled From Academia to Alignment, which I enjoyed and which I’d commend to anyone currently considering this transition. In a similar vein, see this from Xiaoyu He. And, one more: a meditation on mathematicians’ possible future as priests or monks, by Stanford math undergrad Logan Graves.<\/p>","content_hash":"48c5612501accab56db5243b3abd3db3","author":"Scott","published_at":"2026-09-15T17:09:44","fetched_at":"2026-09-23 10:41:51","word_count":2749,"read_time_minutes":14,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"1c33c2ea387ea01c","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10071","title":"9/11 in Berkeley","url":"https://scottaaronson.blog/?p=10071","summary":"Note: Of course I&#8217;ve been glued all week to the dramatic developments in AI. I&#8217;m working on a post about them. I&#8217;m not good at reacting to things in a timely way. So today, I&#8217;ll do my post marking the tragedy a quarter-century ago that we all commemorate. Please feel free to share your 9/11 memories in the comments. Also, Shana Tova to those who celebrate! The morning of September 11, 2001, I was a second-year PhD student at Berkeley, who woke up late in his dorm room at ","content":"<p>9/11 in Berkeley<br>\nNote: Of course I’ve been glued all week to the dramatic developments in AI. I’m working on a post about them. I’m not good at reacting to things in a timely way. So today, I’ll do my post marking the tragedy a quarter-century ago that we all commemorate. Please feel free to share your 9/11 memories in the comments. Also, Shana Tova to those who celebrate!<br>\nThe morning of September 11, 2001, I was a second-year PhD student at Berkeley, who woke up late in his dorm room at International House, after a long night spent closing in on the proof of the quantum lower bound for finding collisions.<br>\nRolling over to my laptop, I saw a flurry of weird emails, including one from Prof. Christos Papadimitriou saying that “we’re a community, and we’ll all support each other,” and another from Prof. Luca Trevisan (whose algorithms course I was then TA’ing) saying “on a day like this, it’s impossible to think about algorithms. Class is cancelled.”<br>\nConfused, I clicked over to the New York Times and saw the picture of the burning towers, and read numbly about what was already over by the time I’d woken up. I checked in with my mom, made sure relatives and friends in the NYC area were OK. My dad was at a company event in Atlanta, and would need to drive home because of the national grounding of flights.<br>\nOne of my earliest memories in life, from age 5, is of ascending to the top of the World Trade Center. Growing up an hour’s drive from NYC, it wasn’t an exotic place to me.<br>\nI soon learned that one of the dead was Danny Lewin, the ex-IDF captain, theoretical computer scientist, and cofounder of Akamai who had his throat slashed on one of the planes while trying to fight the hijackers, making him the day’s first casualty, even while Akamai’s technology was part of what kept news websites running that day. I’d never met Danny but already knew many people in common with him. A few years later I’d be humbled to win the student paper award that was named in Danny’s memory.<br>\nAnyway, at Berkeley on 9/11, I wandered over to Soda Hall just to be with other people. A few students showed up for office hours, wanting help with their algorithms homework, which I found hard to believe, but I did my best to concentrate, as the computer screens around me showed the burning towers.<br>\nThat evening, I went to a vigil for the victims in Sproul Plaza. But the “vigil,” such as it was, quickly dispensed with mourning and prayers and turned to applauded speeches about how the US must respond with love rather than war, and must turn the other cheek. Meanwhile, a student communist organization was handing out flyers explaining that the victims were mostly “wealthy capitalists and the workers who tried to rescue them.” This while smoke still blanketed NYC and the desperate search for survivors continued. I left the vigil early.<br>\nUntil that day, I had thought of myself as basically a “leftist,” one whose #1 issue was the existential risk of climate change. Sure, I disagreed with my fellow leftists about issues from nuclear power to gifted education to Israel, but those were just intra-left disputes.<br>\nThe year before, I had created the website “In Defense Of NaderTrading,” in a desperate attempt to intervene in history and cause Al Gore to become president rather than George W. Bush. When Bush “won,” by the infamous 537 votes in Florida, I considered it a victory for horribleness that would never be surpassed by anything else in my lifetime (ha). I couldn’t imagine any politician who was more the antithesis of everything I believed in than Bush. This view, of course, did not particularly stand out at Berkeley.<br>\nIn the days after 9/11, though, it became obvious that I could not be a “leftist” in the Berkeley sense. Some of my fellow students felt that Osama bin Laden made a lot of great points, that the attacks were basically justified, and that at any rate, we in Amerikkka had done much worse to provoke them, including by supporting the genocidal settler-colony called “Israel,” which for all we know secretly masterminded the 9/11 attacks anyway (although again, if bin Laden had done them, he would’ve been justified).<br>\nAround the same time came the Second Intifada, when a wave of suicide bombings in Israeli buses and pizza parlors and university cafeterias thrilled and energized some Berkeley students to the extent that they took over a Holocaust Remembrance Day event with bullhorns to make it about the Nakba, smashed the windows of the Hillel building, and beat up a couple of students wearing kippot. That was how thoroughly anti-Nazi they were.<br>\nI finished my PhD at Berkeley in 2004 having learned about more than quantum computing. I’d learned that, while American academia had pockets that truly were crucial refuges and oases for nerds like me, it also harbored people who would gladly see me and my relatives and my fellow Americans killed for the sake of their ideological vision. And I’d learned that I had my own ideological vision, which was that such people could go fuck themselves.<br>\nIt deeply pained me to be on the same side of anything as George W. Bush — especially because I knew that 9/11 had happened on his watch, that he had ignored all the warnings, and that he was grossly incompetent to manage the resulting wars against jihadism (just how incompetent, I didn’t know at the time). But as flawed as Bush was, I knew that I wanted to preserve rather than destroy the civilization of which he was a temporary steward. And I think the value and fragility of our civilization is the main lesson from that day that I’d like to convey to my kids, for whom of course 9/11 is just another historical event to learn about in school, like the Boston Tea Party or the Alamo.<\/p>","content_hash":"755dcc0f08b15906c04bb2d9a6192fe3","author":"Scott","published_at":"2026-09-11T17:04:12","fetched_at":"2026-09-23 10:41:51","word_count":1010,"read_time_minutes":6,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"3f8f2a08f44c12ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18162","title":"How can objects interact without touching?","url":"https://quantumfrontiers.com/2026/09/06/how-can-objects-interact-without-touching/","summary":"Rethinking the electric field Have you ever wondered what an electric field actually is?&nbsp; The electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.&nbsp; Most textbooks define the electric field ","content":"<p>Rethinking the electric field<br>\nHave you ever wondered what an electric field actually is?<br>\nThe electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.<br>\nMost textbooks define the electric field as a property of space or a physical entit
