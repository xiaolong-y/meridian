tion on record of loss correction in a commercial neutral-atom system.<br>\nTwenty-eight logical qubits, created from 112 physical qubits, were used to perform successful computations based on the Bernstein-Vazirani algorithm. Furthermore, the logical qubits were able to produce a more accurate solution than the corresponding computation based on physical qubits. The ability to compute while detecting and correcting errors is a critical component to scaling to achieve scientific quantum advantage.<br>\nFigure 1. Error rates of physical qubits (baseline) and the logical qubits created from them. The 24 logical qubits, which were entangled in a cat state, were created by applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral atoms. The entanglement of the logical qubits is evidenced by the error rate being below the 50% threshold (dashed line). The error rate of the logical qubits varied depending on whether losses were only detected or were detected and corrected. In both cases, the logical qubits demonstrated a higher fidelity of entanglement than the corresponding physical qubits.<br>\nCommercial offering from Microsoft and Atom Computing<br>\nMicrosoft and Atom Computing are offering a state-of-the-art reliable quantum computer built from Atom’s neutral-atom hardware and Microsoft’s qubit-virtualization system, and that integrates with Azure Elements. This offering is a comprehensive scientific suite that combines logical qubits, cloud HPC, and advanced AI models that, together, enable exploration across multiple fields, including chemistry and materials science, while also providing opportunities for skilling and education.<br>\nAzure Elements, which is included in the offering, uses AI and cloud high-performance computing (HPC) to greatly accelerate the pace of scientific research and discovery. Capabilities of Azure Elements include Generative Chemistry, which brings the power of generative AI to chemistry research to enable the rapid discovery of molecules that are novel, synthesizable, and useful. In addition, Accelerated DFT offers substantial increases in speed over other DFT (density functional theory) codes for modeling quantum-mechanical properties. These and other user-friendly features of Azure Elements greatly increase the productivity of scientific research, especially when coupled with the quantum capabilities of the Azure Quantum compute platform.<br>\nThis suite—offered by Microsoft and Atom Computing—will enable not only exploration of quantum applications, but also the creation of new datasets by the quantum computer that may be used to train AI models for improved performance or accuracy. And while the offering targets scientific discovery, it’s also possible to explore how quantum capabilities may provide solutions to complex problems in other industries.<br>\n“We are excited to continue our collaboration with Microsoft, which has already led to significant milestones in quantum computing. By coupling our state-of-the-art neutral-atom qubits with Microsoft’s qubit-virtualization system, we are now able to offer reliable logical qubits on a commercial quantum machine. This system will enable rapid progress in multiple fields including chemistry and materials science.” — Dr. Ben Bloom, Founder and CEO of Atom Computing<br>\nLearn more about our latest achievements in quantum computing<br>\n- Register to watch the Quantum Insider webinar with Dr. Krysta Svore and Dr. Ben Bloom on the offering from Microsoft and Atom Computing.<br>\n- Read the technical paper describing how Microsoft and Atom Computing created and entangled 24 logical qubits.<br>\n- Read the technical paper on Atom Computing’s best-in-class two-qubit gate fidelity.<br>\n- Read Jason Zander’s LinkedIn article on today’s announcement.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"df1fee32ff5f9655d1de9694cdb1d912","author":"Krysta Svore","published_at":"2024-11-19T13:30:00","fetched_at":"2026-07-29 02:11:40","word_count":1343,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"88w","domain":"azure.microsoft.com"},{"id":"07071061f61a76ac","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/09/10/microsoft-and-quantinuum-create-12-logical-qubits-and-demonstrate-a-hybrid-end-to-end-chemistry-simulation/","title":"Microsoft and Quantinuum create 12 logical qubits and demonstrate a hybrid, end-to-end chemistry simulation","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/09/10/microsoft-and-quantinuum-create-12-logical-qubits-and-demonstrate-a-hybrid-end-to-end-chemistry-simulation/","summary":"Microsoft and Quantinuum applied Azure Quantum’s qubit-virtualization system to Quantinuum’s H2 trapped-ion quantum computer to create 12 highly reliable logical qubits. Additionally, the teams demonstrated the emerging capabilities of reliable quantum computing by using two logical qubits, integrated with an AI model and cloud high-performance computing (HPC), to accurately estimate the ground state energy of the active space of an important catalytic intermediate. These achievements demonstrat","content":"<p>Microsoft and Quantinuum applied Azure Quantum’s qubit-virtualization system to Quantinuum’s H2 trapped-ion quantum computer to create 12 highly reliable logical qubits. Additionally, the teams demonstrated the emerging capabilities of reliable quantum computing by using two logical qubits, integrated with an AI model and cloud high-performance computing (HPC), to accurately estimate the ground state energy of the active space of an important catalytic intermediate. These achievements demonstrate continued progress toward scientific quantum advantage, a milestone that will be reached when a hybrid quantum-classical supercomputer can solve scientific problems too complex for classical computers alone.<br>\nMicrosoft Quantum Innovation Series<br>\nHow can quantum and AI unlock a new generation of hybrid applications for science?<br>\nTripling the number of highly reliable logical qubits<br>\nEarlier this year, Microsoft and Quantinuum created the most reliable logical qubits on record by applying Microsoft’s qubit-virtualization system to Quantinuum’s H-Series ion-trap qubits. At the time of that announcement, the teams had created four logical qubits from 30 physical qubits on Quantinuum’s H2 machine, with a logical error rate 800 times better than the physical error rate.<br>\nBy expanding Microsoft’s error-correction algorithms and optimizing them for Quantinuum’s H2 machine, which now has 56 qubits with 99.8% two-qubit fidelity, the teams have created 12 highly reliable logical qubits. Previously, Microsoft and Quantinuum entangled two logical qubits in a Bell state preparation, whereas in this study, all 12 logical qubits were entangled in a more complex arrangement known as a cat state, or Greenberger-Horne-Zeilinger (GHZ) state. When these logical qubits were entangled, they exhibited a circuit error rate of 0.0011, which is 22 times better than the corresponding physical qubits’ circuit error rate of 0.024.<br>\nMicrosoft and Quantinuum demonstrated several fault-tolerant computations with the improved logical qubits. On eight logical qubits, the teams successfully conducted five rounds of repeated error correction. Furthermore, the eight logical qubits were used to perform a fault-tolerant computation during error correction, successfully demonstrating the combination of logical entangling operations with multiple rounds of quantum error correction. The eight logical qubits exhibited a circuit error rate of 0.002, which is 11 times better than the corresponding physical qubits’ circuit error rate of 0.023. To our knowledge, this is the first demonstration of computation and error correction being beneficially combined, and it showcases the ability of these logical qubits to perform increasingly deeper quantum computations reliably, paving the way to fault-tolerant quantum computing.<br>\nUsing logical qubits, cloud HPC, and AI to solve problems in chemistry<br>\nTo demonstrate the emerging usefulness of quantum computing in chemistry applications, an end-to-end hybrid workflow was used to solve a real problem in chemistry, bringing together computation across cloud HPC, reliable quantum computing, and AI. In the quantum computation, two logical qubits—created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 machine—were used to prepare the ground state of the active space of an important catalytic intermediate (Figure 1) and then measured. The measurement outputs were then integrated with AI to estimate the ground state energy of the active space. This is the first time that HPC, AI, and quantum-computing hardware have been applied in concert to solve a scientific problem.<br>\nAs a first step, the team at Microsoft used AutoCAS and AutoRXN in Azure Quantum Elements to conduct HPC simulations that identified the active space of the catalyst and the catalyst’s reaction pathways, respectively. The team then optimized error-detection codes for use within a customized quantum algorithm on two logical qubits to simulate the quantum behavior of the active space. The logical qubits were then measured to generate classical data using a method known as classical shadows, which uses the measurement outcomes as classical data to train an AI model on the quantum properties of the molecule. This “shadow data” was then used in combination with the AI model to determine chemical properties of the catalyst and estimate the ground state energy of the active space within chemical accuracy (Figure 2). For comparison, the same calculation was performed with physical qubits.<br>\nThe ground state energy of the catalyst’s active space was calculated classically to gauge the accuracy of the hybrid quantum and AI-based result. Using qubits to solve this problem does not demonstrate scientific quantum advantage because the answer can be derived with classical computers. However, some complicated chemistry problems are unlikely to be solved classically with high accuracy, which provides an opportunity for quantum computers to outperform classical computation.<br>\nThe proof-of-concept case study described here is notable for several reasons. To our knowledge, this is the first demonstration of an end-to-end workflow that employs quantum computing, HPC, and AI to simulate and solve a chemistry problem. Furthermore, the quantum-mechanical problem was solved with a high degree of accuracy. These logical qubits produced a better estimate of the ground state energy than the comparable computation with the underlying physical qubits, demonstrating the higher reliability of these logical qubits.<br>\nThis demonstration provides evidence of the emerging usefulness of quantum-classical hybrid computing in chemistry, and it offers an example of how HPC, AI, and logical qubits can be used collectively to solve scientific problems. The logical qubits created with Microsoft’s qubit-virtualization system are being integrated into Azure Quantum Elements, our cloud platform designed to accelerate scientific discoveries. To increase our offerings further, we’re excited to announce that Quantinuum’s InQuantoTM computational-chemistry software package has been integrated into Azure Quantum Elements. InQuanto’sTM pioneering quantum-chemistry algorithms and methods expand Azure Quantum Elements’ tool kit and are available today through private preview.<br>\nMicrosoft’s qubit-virtualization system extends to all types of qubits<br>\nMultiple types of qubit architectures are being explored as potential pathways toward a quantum-computing future. The logical qubits described above were created on Quantinuum’s ion-trap qubit hardware. The team at Microsoft is also applying the Azure Quantum compute platform to the neutral-atom qubits in Atom Computing’s second-generation systems, designed to have over 1,200 physical qubits. Together, Microsoft and Atom Computing have created logical qubits and are optimizing their systems to enable reliable quantum computation. The team at Microsoft also plans to apply their qubit-virtualization system to the topological qubits that are still in development.<br>\nAs advances are made to both quantum hardware and software, qubits will continue to increase in number and fidelity, enabling deeper and more complex quantum computations with logical qubits. When approximately 100 logical qubits are available, scientific quantum advantage—which is expected to help solve some of the world’s most pressing challenges—will likely be achievable.<br>\nMaking logical qubits available through a new hybrid-computing offering<br>\nAt Microsoft, we’re ushering in a new era of reliable quantum computing by offering the Azure Quantum compute platform that brings together Microsoft’s qubit-virtualization system with industry-leading quantum processing units (QPUs) from hardware partners to create reliable logical qubits. Computation with those logical qubits is then integrated with cloud HPC and AI models. Additionally, in collaboration with Atom Computing, we have a commercial offering of a reliable quantum machine.<br>\nBy providing access to reliable logical qubits, accelerated HPC simulations, Copilot for Azure Quantum, and advanced AI models, Azure Quantum brings the powers of quantum computing, classical computing, and AI together. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about Microsoft’s advances in quantum computing<br>\n- Read about Microsoft’s hybrid-computing offering and our collaboration with Atom Computing in the Official Microsoft Blog.<br>\n- Register for the upcoming Microsoft Quantum Innovator Series on how quantum and AI can unlock a new generation of hybrid applications for science.<br>\n- Read the technical papers on today’s logical qubit announcement and the chemistry simulation performed with logical qubits from Microsoft and Quantinuum.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"c4c6ab72eaad17f4a0e8833008e9a220","author":"Krysta Svore","published_at":"2024-09-10T13:00:00","fetched_at":"2026-07-29 02:11:50","word_count":1289,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"98w","domain":"azure.microsoft.com"},{"id":"56f111ee2310cfc0","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","title":"Introducing two powerful new capabilities in Azure Quantum Elements: Generative Chemistry and Accelerated DFT","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","summary":"Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.&nbsp; Microsoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivi","content":"<p>Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.<br>\nMicrosoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivity of scientific research and remove barriers on the path to scientific discovery by substantially reducing the effort and expertise needed to perform what were previously daunting tasks. Specifically, these capabilities use Copilot for Azure Quantum, a natural-language interface that can be used by experts and non-experts alike, making Azure Quantum Elements accessible to more people and increasing the speed at which complex scientific problems can be solved.<br>\nUnlocking solutions to our most pressing challenges will require the world’s collective genius, and we’re excited to put new capabilities into the hands of scientists, students, and organizations such as Unilever so that everyone can contribute to making scientific discoveries that change the world for the better.<br>\nSince its launch, Azure Quantum Elements has served an important role in helping scientists achieve breakthroughs that have paved the way for more sustainable batteries and innovations in the pharmaceutical industry. Today, we’re announcing two new purpose-built capabilities in Azure Quantum Elements that will further increase the productivity and accessibility of chemistry and materials science research—Generative Chemistry and Accelerated DFT.<br>\nGenerative Chemistry helps scientists discover novel, synthesizable, and useful molecules quickly<br>\nThere are hundreds of millions of known molecular compounds and substances and many more remain to be discovered. In the field of chemistry, a major challenge is narrowing down an enormous number of candidate molecules to find the few that are best suited for a particular application. This challenge results in the streetlight effect, which is when the vast number of possibilities is reduced to a reasonable size, not based on the properties of the compounds, but by focusing only on those that have been studied previously. Relying on databases to identify suitable compounds limits the search space so that only known compounds are revealed as candidates for specific applications. Generative AI helps bring to light a much larger portion of the estimated 1060 possible combinations of atoms so that scientists are presented with novel candidates that are likely to serve the intended purpose.<br>\nToday, the Azure Quantum team at Microsoft is announcing Generative Chemistry—an upcoming capability that has the potential to greatly simplify this process and help scientists quickly discover and design new compounds with desired properties, thus increasing the productivity of product innovation.<br>\nGenerative Chemistry, which will be available through Azure Quantum Elements private preview, is an end-to-end workflow that involves multiple steps:<br>\n- You provide information on desired molecular characteristics for your specific application. Additionally, you can supply reference molecules if you already have some possibilities in mind.<br>\n- The information you provide is used to generate seed molecules from a dataset—those seed molecules are then used to initiate the guided AI generation of candidate molecules for your application. This is accomplished by applying multiple AI models and a unique methodology to identify new compounds that match your criteria. In this step, you have several options for configuration such as selecting the most relevant generative AI model, specifying the number of molecules to be generated, indicating the key molecular properties of interest, and screening compounds for toxicity.<br>\n- AI-based screening models predict properties of the candidate molecules that are important for real-world applications—such as boiling point, density, or solubility. A feedback loop sends this information back to the guided AI generation (step 2) to modify the selection of candidate molecules. In this step, you also have the option to fine tune the AI models for your specific application.<br>\n- The pool of potential candidates is further narrowed through a step that uses AI-guided synthesis planning to determine the feasibility of making the molecules in a laboratory—this is important because some novel molecules with desired properties may be difficult to synthesize. In this step, synthesis pathways are predicted, and candidate molecules are filtered based on how easy they are to make.<br>\n- Highly accurate HPC simulations are performed on the top candidates. Accelerated DFT can be used to screen candidates for electronic properties such as dielectric constant, ionization potential, and polarizability. AutoRXN predicts chemical stability or reactivity, and it can also be used to provide insights on possible synthesis pathways.<br>\n- You are presented with the final candidate molecules from which you can select the most promising for laboratory synthesis and testing.<br>\nThis entire process takes only days, shaving months or even years off trial-and-error laboratory experiments that were previously required to arrive at this point. Generative Chemistry suggests entirely new compounds and gives scientists the freedom to focus on only those molecules that are fit for the desired purpose—saving time, money, and effort. This new capability will allow for rapid progress in the development of novel therapeutics, sustainable materials, and more.<br>\nGenerative Chemistry<br>\nWebinar with American Chemical Society<br>\nAccelerated DFT offers substantial increases in speed compared to other density functional theory codes<br>\nDensity functional theory (DFT) is one of the most popular methods in computational chemistry due to its efficiency and accuracy in modeling quantum-mechanical properties. It allows researchers to simulate and study the electronic structures of atoms, molecules, and nanoparticles as well as surfaces and interfaces, thus predicting properties such as dielectric constant, ionization potential, and polarizability. Scientists can then tailor those properties to optimize them for specific applications.<br>\nAlthough DFT is highly valuable for research and product design, most DFT codes need to be run directly by the user in HPC clusters, which can be a difficult undertaking. Additionally, DFT—when run on traditional HPC hardware—requires substantial compute power and becomes constrained as the molecules being studied or designed increase in complexity and size.<br>\nTo simplify and improve this process, Azure Quantum and Microsoft Research designed and launched Accelerated DFT, a code used to simulate the electronic structure of molecules. Accelerated DFT can determine the properties of molecules with thousands of atoms in a matter of hours. It performs substantially faster than other DFT codes and offers a 20-fold average increase in speed compared to PySCF, a widely used open-source DFT code.1<br>\nThe setup of Accelerated DFT is made simple by providing the software as a service, requiring no code compilation or configuration on the user’s part, and it has a simplified API to streamline the computational process. Furthermore, a Python Software Development Kit (SDK) offers seamless integration into a wide variety of computational chemistry environments, which allows researchers to incorporate DFT calculations into complex chemistry workloads. Accelerated DFT is now available in Azure Quantum Elements private preview; it will also become part of Generative Chemistry.<br>\nAccelerated DFT can substantially expedite research across a wide spectrum of chemical disciplines by employing the power of Azure’s cloud architecture. Accelerated DFT can also produce large and highly accurate datasets of molecular properties that can be used to improve AI models, which require large amounts of training data. By rapidly generating training data, new molecules can be discovered faster, and known molecules can be improved, leading to innovations in therapeutics, sustainable products, and more.<br>\n“We have been very impressed by Accelerated DFT for simulating large systems with range-separated hybrid density functionals, where it speeds up the calculations considerably. Furthermore, the team at Microsoft has been very accommodating in quickly resolving technical challenges for our calculations of an active site of an enzyme.”—Tejs Vegge, Professor, Head of Section for Autonomous Materials Discovery, DTU Energy, Technical University of Denmark.<br>\n“Accelerated DFT has an easy-to-use Python interface, and the acceleration in calculations allows for the efficient use of novel hybrid functionals and a large basis set. Estimating key thermodynamic properties can thus be done in a matter of hours.<br>\nAspenTech is excited to be partnering with Microsoft to evaluate the application of quantum chemistry in our physical properties system for process modeling, especially in our sustainability pathways solutions. We anticipate that working with Accelerated DFT will result in strong use cases for characterizing new molecules and materials that are crucial to decarbonizing and circularizing industrial and consumer materials.”—Heiko Claussen, Senior Vice President, Artificial Intelligence Technology at AspenTech.<br>\nAzure Quantum Elements incorporates quantum computing<br>\nWith the addition of each new feature, Azure Quantum Elements becomes a more effective tool for scientists by harnessing AI, HPC, and emerging hybrid-computing capabilities that bring the power of quantum computing to scientific challenges. Recently, we simulated a chemical catalyst by combining classical supercomputers, AI, and logical qubits created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 hardware. In the coming months, we will introduce advanced logical qubit capabilities from Microsoft and Quantinuum to the private preview of Azure Quantum Elements. This classical-quantum hybrid computing offering follows our quantum computing milestone with Quantinuum in which we created the most reliable logical qubits on record with an error rate 800 times better than that of the corresponding physical qubits.<br>\nAdvances in AI and quantum computing have the potential to help researchers solve global scientific challenges. In the future, we plan to offer a quantum supercomputer that can simulate interactions of molecules and atoms at the quantum level, which is beyond the reach of classical computers. This capability is expected to transform research and innovation across many industries. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about how Azure Quantum Elements is revolutionizing chemistry and materials science<br>\n- Read about our collaboration with Unilever in the Official Microsoft Blog.<br>\n- Explore the product overview of Azure Quantum Elements.<br>\n1 Details on the performance of the private preview of Accelerated DFT can be found in the preprint of Acceleration without Disruption: DFT Software as a Service.<\/p>","content_hash":"a6fbb1579c24d7c640e136044b531c4d","author":"Dr. Nathan Baker","published_at":"2024-06-18T15:00:00","fetched_at":"2026-07-29 02:11:59","word_count":1663,"read_time_minutes":9,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"110w","domain":"azure.microsoft.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":"<p>The Qiskit blog is moving!<br>\nThat’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.<br>\nThe Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and quantum information science. Now, we think it’s time for a change of scenery.<br>\nAs part of ongoing efforts at IBM to pool resources into a unified quantum experience, and to make it easier for our community to find and access the information they care about, we’re building a new home for the Qiskit blog. Moving forward, you’ll find all new Qiskit blog posts published at ibm.com/quantum/blog. Simply click the “Qiskit” tag on the menu in the top left corner of the page, and you’ll be able to see the new Qiskit blog content we plan to start publishing in the weeks and months ahead. Historical content previously posted here on Medium will remain live for your reference.<br>\nWe may be changing addresses, but we’ll still be bringing you the high-quality quantum computing news, resources and storytelling we’ve been producing for years. So, we hope you’ll bookmark the new blog and check in regularly. You can also follow the IBM Quantum page on LinkedIn for updates featuring the latest blog content.<br>\nA look back at seven years of Qiskit blogging<br>\nSeven years is a long time, so we thought it would be worth taking a look back at some of the amazing stories we’ve shared here. Below, we’ve compiled a short selection of our personal favorites, as well as a few of the posts that were most popular among our readers.<br>\n*PLEASE NOTE*: Many of the articles listed below were published several years ago, meaning they may feature outdated information, broken links, and code examples that no longer work. Be sure to check our documentation for the latest.<br>\nLet’s get started with a few stories that signal how just how far we’ve come since launching the Qiskit blog back in 2016. We’ll begin with — what else? — our first post ever. The article was written by IBM researcher James Wootton, who contributed an enormous amount of content to the Qiskit blog in its earliest years:<br>\nIn reviewing our archive of Qiskit Medium blogs, we were also struck by this 2020 post proposing version 3.0 of the OpenQASM quantum assembly language. It’s fascinating to read about the specific issues and limitations in OpenQASM 2.0 that 3.0 was built to address:<br>\nAnd, of course, we’d be remiss if we didn’t highlight the most recent post on Qiskit Medium celebrating the upcoming launch of Qiskit 1.0. Be sure to take a look if you haven’t already:<br>\nQuantum Computing Explainers<br>\nLearning quantum computing can be easy and fun. Explaining quantum computing concepts—and doing so in a straightforward way that makes those concepts easy to understand—is a little more challenging. That hasn’t stopped us from trying, however. And in many cases, the results of those efforts have given us some of the only layman-friendly explanations of quantum computing concepts that you’ll find just about anywhere.<br>\nREMINDER: Keep an eye out for outdated code in this section and check our documentation for up-to-date tutorials on how to implement any of the quantum programming concepts detailed in the articles below.<br>\nFirst up, a popular article which reminds us that, sometimes, even the explainers need a good explainer. This post offers helpful tips for those who want to teach others the basics of what quantum computing is and why it matters. Best of all, the article provides a variety of suggestions for tailoring your explanation of the subject to people — and even non-people — who may have differing levels of expertise:<br>\nAnd here’s a few more of our favorite explainer articles…<br>\nThe Variational Quantum Eigensolver — examining the inner-workings of the VQE algorithm:<br>\nThe benefits of high-resolution pulses for quantum computers:<br>\nWhat Is Quantum Volume, Anyway?:<br>\nExplore The Clifford Group, A Crucial Tool For Benchmarking, Error Correction, And More:<br>\nWhat Can a Quantum Computer Actually Do? (This post explains where quantum computing sits in the world of computational complexity theory):<br>\nWhat are Qiskit Primitives?:<br>\nA user’s guide to the Qiskit Circuit Library:<br>\nDIY Quantum Computing Projects<br>\nA good explainer will take you a long way when it comes to learning quantum computing fundamentals, but often the best way to learn is not by reading, but by doing. The Qiskit community has brought us tons of creative DIY projects over the years, projects that get users hands on with quantum computing and important concepts in the field. Here are a few of our favorites.<br>\nREMINDER: Posts in this section have *a lot* of outdated code, so be sure to check our documentation or consider reaching out to the post author if you’d like to recreate their project!<br>\nRasQberry — Quantum Computing is the Coolest Project for Raspberry Pi:<br>\nGetting to know your quantum processor (a game that helps users understand the connections between qubits in a quantum device):<br>\nBuilding the world’s smallest quantum classifier:<br>\nIntroducing Bosonic Qiskit — A package for simulating bosonic and hybrid qubit-bosonic circuits (stay tuned for an upcoming follow-up post to be published on the new Qiskit blog):<br>\nProgramming a quantum computer—generating true random numbers:<br>\nHumans of Quantum<br>\nFrom profiles of the world’s most famous quantum computing researchers to first-person narratives spotlighting everyday users, many of our most popular and compelling blog posts have focused not just on quantum computing, but on the people who are actually doing it.<br>\nI’ve Worked in Game Development My Whole Career — Here’s Why I’m Learning Quantum Computing:<br>\nWhy Quantum Computing Pioneer Dorit Aharonov Thinks We Need More People Working on Quantum Algorithms:<br>\nI Transitioned to Quantum Computing Later in My Career — Here’s What It Was Like:<br>\nScott Aaronson Says Complexity Theory is ‘Inextricable’ from Quantum Computing:<br>\nHow Ewin Tang’s Dequantized Algorithms are Helping Quantum Algorithm Researchers:<br>\nI Worked in Finance — Here’s Why I’m Learning Quantum Computing:<br>\nQiskit Community<br>\nThe Qiskit community has grown by leaps and bounds since our founding in 2016, and it’s amazing to look back at just how far we’ve come. For example, today our Qiskit Advocates Program is made up of hundreds of quantum computing advocates based all around the world. So, it’s hard to believe that we made our first post launching the program just a few years ago, in late 2019:<br>\nThe Ultimate Guide for Contributing to Qiskit — No Matter Your Background:<br>\nJoin Us For The Quantum Women Invited Talk Series:<br>\nQuantum Careers<br>\nSome of our all-time most popular posts have centered on the subject of quantum careers, and on providing users with tips and tricks for landing a job in the field. These two posts continue to be great resources for anyone in quantum who may be thinking about their next career move:<br>\nThe Hitchhiking Cat’s Guide to Getting a Job in Quantum Computing (by Jay Gambetta!):<br>\nWe Asked Experts Their Advice for Getting a Job in Quantum Computing:<br>\nSee you at the new Qiskit blog!<br>\nAn article like this one can only ever scratch the surface when it comes to recapping seven full years of amazing storytelling, and there are lots of wonderful pieces that didn’t make the cut. Be sure to take a look through our extensive archive here on Medium for more. We’ll be leaving the Qiskit Medium up for the foreseeable future, so readers can easily reference our past articles.<br>\nWe may be closing the chapter on our time here at Medium.com, but the story is far from over! Be sure to head over to ibm.com/quantum/blog to keep up with the latest and greatest from the Qiskit team.<\/p>","content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-07-29 02:10:17","word_count":1321,"read_time_minutes":7,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"130w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":"<p>Coming soon: Qiskit 1.0!<br>\nBy Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish & Blake Johnson<br>\nQiskit 1.0 will be released in February 2024 🎉<br>\nThis is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.<br>\nIn this article you’ll find the following:<br>\n- What this upcoming major version means for users<br>\n- How to test out 1.0 functionality before the stable release<br>\n- How to upgrade to Qiskit 1.0<br>\n- Possible disruptions to be aware of during the transition period<br>\nThe article below is a repost of our original announcement on the IBM Research blog.<br>\nA new phase of Qiskit development<br>\nThis upcoming release signals a new phase for Qiskit development, one centered on performance, stability and usability. Qiskit 1.0 is an open-source SDK for working with quantum computers at the level of extended quantum circuits, operators, and primitives.<br>\nWhat does this mean, exactly? We have been making numerous changes over the past few minor releases to prepare for this new phase, with an emphasis on the following:<br>\n- A high performance code base: We have steadily been improving performance over the years, and Qiskit 1.0 is set to be the best version yet. It will enable users to build and transpile 100+ qubit circuits with comparative ease, and lay the groundwork for future 1000+ qubit capabilities.<br>\n- A leaner package: We’ve made changes such as the removal of the metapackage architecture, the splitting out of qiskit.algorithmsinto a separate package, and the deprecation of various modules (e.g.qiskit.opflow) — all in an effort to keep the Qiskit codebase more focused, stable, and maintainable. This paves the way for a more performant and usable package in the long run.<br>\n- A more stable API: The launch of Qiskit 1.0 will move Qiskit development into a new release and versioning cycle, with less frequent breaking changes. (More details on this later.)<br>\n- Primitives are the access model for quantum hardware: The Qiskit codebase provides the definition for a primitives execution model for quantum hardware, with pre-existing functionality being refactored to use primitives and future functionality being developed with a primitives-first approach.<br>\n- An SDK to build upon: The transpiler plugin interface and the Qiskit Ecosystem program (among other things) are designed to encourage the further extension of Qiskit’s capabilities by users and contributors.<br>\nPerformance: let’s take a closer look<br>\nWe know it’s not enough for us to just say “Qiskit is more performant now!” We know you want to see the numbers, so let’s take a deeper look at what we mean when we talk about improved performance for Qiskit 1.0.<br>\nThere are many different metrics to analyze for judging performance in a project like Qiskit, we’re going to focus on two: memory and speed.<br>\nIn terms of speed, many features in Qiskit 1.0 just work faster now than they used to, due to ongoing internal refactoring and the introduction of Rust code under the hood. For example, the transpiler in Qiskit 1.0 can bind and transpile circuits 16x faster than Qiskit 0.33 (while also returning shorter circuit depths). See below for a comparison of the transpilation capabilities for different types of 100+ qubit circuits. The blue bars indicate how many times faster Qiskit can transpile these circuits compared to TKET (an alternative circuit building SDK), and the pink bars indicate the percentage reduction in two-qubit gates:<br>\nSimilarly, when it comes to memory, we’ve done a lot of internal refactoring to reduce the footprint of circuits, with Qiskit 1.0 demonstrating an average 55% decrease in memory usage compared to Qiskit 0.39. The chart below shows data collected on the maximum memory used in building a 127-qubit Two Local circuit at increasing circuit depth, comparing the last three Qiskit versions with the upcoming 1.0 version:<br>\nPre-release coming December 2023<br>\nBefore the full release in February 2024, we will be offering a very early pre-release of Qiskit 1.0 on December 4, 2023. This will include a subset of the changes coming in the full 1.0 release two months later.<br>\nAs an open-source project, we have always strived to bring our community along with us in our development journey, and so we’re thrilled to be able to provide this opportunity for users and contributors to test out Qiskit 1.0 early. As always, we greatly appreciate any bug reports and feedback made by opening an issue in our GitHub repository.<br>\nAlso, in early February 2024 (after the 1.0 pre-release but before the 1.0 stable release) we will release an additional Qiskit 0.46. This version will be compatible with 0.45, and will be a useful stepping stone in the transition to 1.0. We will continue to support Qiskit 0.46 for a further six months, overlapping with the release of Qiskit 1.0. This version will contain warnings for everything that is changing in Qiskit 1.0 and possibly some bug fixes, but no new features.<br>\nHow to upgrade to Qiskit 1.0<br>\nThe following instructions are relevant for upgrading to Qiskit 1.0 or installing the pre-release.<br>\nThe most important thing to know when the time comes to upgrade is this:<br>\nYou will need to create a new virtual environment to install Qiskit 1.0.<br>\nQiskit 1.0 will use a new packaging structure, and you will not be able to upgrade an existing Qiskit 0.x installation to Qiskit 1.0 in-place. This is the only time we expect to break packaging; you will be able to upgrade from Qiskit 1.0 and beyond in-place.<br>\nI’m a Qiskit user. What do I need to do?<br>\nQiskit 1.0 is not yet available, so there is nothing you need to do immediately. When it is released, you will not be able to use pip install -U qiskit to upgrade from any Qiskit 0.x version to 1.0.<br>\nTo upgrade, you will need to begin a new virtual environment.<br>\nFor example, using the standard tool venv, you might do the following:<br>\n# Create a new virtual environment (you only do this once)<br>\npython -m venv ~/qiskit-1.0-env<br>\n# Activate the new virtual environment (you do this every time you start a new session)<br>\nsource ~/qiskit-1.0-env/bin/activate<br>\n# Install Qiskit 1.0 (you only do this once for this environment)<br>\npip install ‘qiskit>=1.0’Note: For installing the pre-release, you can use the same steps above. The only difference is that for the last line, you should run pip install ‘qiskit==1.0.0b1’ instead.<br>\nYou can follow similar steps if you prefer to use virtualenv, Conda, or any other virtual-environment management. Consult the documentation for your chosen environment for more information on how to create new ones.<br>\nIn addition to creating a new virtual environment, you might need to adapt your code to work with Qiskit 1.0, as there will be some breaking changes with respect to 0.x.<br>\nTo prepare for this, we recommend that you install Qiskit 0.46 when it is released in early February 2024, and try running your code to see if anything breaks. Where there are places that you need to change, you will see DeprecationWarnings being issued, which will include descriptions of how to modify your code for Qiskit 1.0.<br>\nWe will support Qiskit 0.46 with bugfixes, but no new features, for six months after its release. This will give users time to make modifications, and will also give library maintainers time to upgrade any libraries users may depend on.<br>\nI use projects that depend on Qiskit . What do I need to do?<br>\nIt will take some time for downstream projects to begin supporting Qiskit 1.0. Please be patient with these projects; it is a lot of work to support new versions of libraries, and it can take maintainers time to switch over.<br>\nAs an end user, you must not install packages that require Qiskit versions before Qiskit 1.0 in the same environment where you have Qiskit 1.0 installed.<br>\nDoing so could break your virtual environment, and you might need to create a new one.<br>\nI maintain a project that depends on Qiskit . What do I need to do?<br>\nQiskit 1.0 will include breaking changes, and we do not expect that packages supporting the current 0.44 or 0.45 series will necessarily support 1.0 unchanged.<br>\nWe recommend two immediate modifications to your dependency management:<br>\n- Remove any dependencies on the qiskit-terraPyPI package, and replace them with dependencies on theqiskitpackage. You can find a table matching oldqiskitversions toqiskit-terraversions here, if you want to support old versions of Qiskit. From Qiskit 0.45 onwards, the versions ofqiskitandqiskit-terraare identical, and are not listed in the table. This is critical as theqiskit-terraPyPI package will no longer be updated in any form for the 1.0 series and above, as it is entirely superseded by theqiskitPyPI package.<br>\n- Place an upper bound on your qiskitdependency to restrict the use of1.0until you have verified that your package supports Qiskit 1.0. To do this, set your dependency asqiskit >=0.44, <1.0, or replace the0.44as appropriate.<br>\nAfter implementing the above steps, but before the full release of Qiskit 1.0 we recommend testing your project with Qiskit 0.46 once it is released in early February. This will enable you to find all the warnings it will generate so you can upgrade your library to support Qiskit 1.0 when it is released. We will support Qiskit 0.46 with bug fixes for six months after the release of Qiskit 1.0, to give you time to begin supporting 1.0.<br>\nOnce Qiskit 1.0 is released in February 2024 (and you have sufficiently tested it with your codebase), we recommend releasing a new version of your package with updated version requirements.<br>\nBreaking changes<br>\nThroughout the history of Qiskit development, we have strived to keep pace with the rapid progress of quantum technology while also trying very hard to keep breaking changes to a minimum, and to provide a clean upgrade path that allows library authors to support multiple versions of the Qiskit package simultaneously.<br>\nQiskit 1.0 will require some changes that could not necessarily be made safely in this manner. These largely affect data-structure internals, which we could not change smoothly without severely compromising performance. We hope that many of these changes will not affect user code, but are aware that this is not always the case. The best way to prepare for the transition to 1.0, and understand which breaking changes will impact you, is to try out the Qiskit 1.0 pre-release and the final minor version Qiskit 0.46 when they are released.<br>\nWith the transition to Qiskit 1.0 the development cycle of Qiskit is also changing. There will be a minimum of one year between major releases, and minor version releases will happen as usual every three months. This means that breaking changes will only occur during major releases. To dig into the details of how the release cycles are changing and why, you can check out our open RFC here.<br>\nWhile we anticipate the release of Qiskit 1.0 will result in some initial disruption, we see this as being necessary to pave the way towards a more stable and less breaking future for the package.<br>\nConclusion<br>\nWe are incredibly thankful to everyone who has taken the time over the past six years to get us to this place, whether it was a pull request, bug report, or just a comment on slack. Please keep it up! We are very proud of how far we’ve come, and can’t wait to embark on this next phase of our development journey with your continued support. Stay tuned for more Qiskit 1.0 updates!<br>\nFootnote for the GitHub Gurus!<br>\nWant to know more about what’s happening for Qiskit 1.0 at a codebase level? These resources may be of interest to you:<br>\n- If you wish to proactively test against changes coming in Qiskit 1.0, development is proceeding on the main branch of the Qiskit repository.<br>\n- Development on Qiskit 0.46 is happening on the stable/0.46 branch of the Qiskit repository.<br>\n- Conversations around release cycles, versioning and deprecation policies are happening in the release cycle RFC in the Qiskit organization RFC repository.<\/p>","content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-07-29 02:10:18","word_count":2003,"read_time_minutes":11,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"135w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":"<p>A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?<br>\nBy Maria Violaris, PhD student at the University of Oxford<br>\nTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.<br>\nHave you guessed the story I’m talking about? That’s right! It’s “A Christmas Carol,” the tale of the grumpy, selfish Ebenezer Scrooge who receives visits from ghosts of the past, present and future on Christmas Eve. Scrooge emerges from his experience a changed and newly generous man, but I can’t help but wonder, could the fantastical story of Scrooge really happen in a universe with quantum time-loops?<br>\nIn the latest installment of the Quantum Paradoxes video series on the Qiskit YouTube channel, I investigate the possibility that time-loops — more commonly known to physicists as “closed-timelike-curves” — may in fact be consistent with quantum mechanics. In this blog post, I apply my findings from that video to make sense of the story of “A Christmas Carol”.<br>\nA Christmas paradox<br>\nLet’s first consider the visit from the Ghost of Christmas Past. The ghost takes Scrooge to observe various happy scenes from his past. Scrooge does not interact with his past self, and his past self does not see him at all.<br>\nThis experience begins to change Scrooge’s outlook on life, so it has an effect on Scrooge’s future behaviour. However, there’s no paradox here. It is fully self-consistent for Scrooge to invisibly observe his past self, and then have that experience change his own future actions. In fact, this process isn’t too different from something most of us do just about every day. Like anyone else, Scrooge is simply reflecting on his past memories, and changing his actions as a result.<br>\nNext, the Ghost of Christmas Present takes Scrooge to see some scenes from the present day. No time-travel here, so all is good!<br>\nNow for the most interesting case: Scrooge receives a visit from the Ghost of Christmas Yet-To-Come. The ghost takes Scrooge to a scene that occurs after his death, where he sees that his death is celebrated rather than mourned, and also observes the tragic fate of a sick child, Tiny Tim. Seeing this future is the final straw for Scrooge to change his ways. He wakes up on Christmas morning as someone kind, generous and compassionate.<br>\nHere’s the paradox: If Scrooge changed his ways because he saw a bleak future, then the bleak future will never happen. If the bleak future never happens, it will never cause Scrooge to change his ways!<br>\nSelf-consistency is key<br>\nThe paradox we run into with our friend Ebenezer shares many similarities with the “Grandfather Paradox,” the idea that someone who goes back in time and kills their grandfather will never exist to go and kill their grandfather in the first place. These paradoxes can be solved in quantum mechanics using a “consistency condition,” which is a constraint that ensures everything makes logical sense in a time-loop. If someone goes into a time-machine, they must be in the same state as when they come out of the time-machine, and this limits the range of actions they can perform. If you go back in time, you physically will not be able to kill your own grandfather.<br>\nWith that in mind, we can resolve the paradox of Scrooge changing his ways. Consider a modified story, where the Ghost of Christmas Yet-to-Come shows Scrooge a bright and happy future. In this future, Scrooge is a kind and generous man. Seeing how much happiness he can bring about by being kind and generous, present-day selfish Scrooge is inspired to change his ways. He becomes kind and generous as well, leading to the bright and happy future he was shown by the ghost, with no logical contradiction.<br>\nIs everything all well and good now? Not quite. There’s another, more subtle time-travel paradox hidden in this modified story, called the Knowledge Paradox. Imagine I travel forward in time to read this blog post, copy it from my future self, and then post it, making it the blog post that my past self would eventually copy. This is logically consistent, but where did the knowledge of the ideas in the blog post come from?<br>\nOur Scrooge scenario is similar. Sure, Scrooge can see his kind future self and become a kinder person as a result. That is perfectly self-consistent. But where did Scrooge’s knowledge of the positive impacts of being kind come from? This Knowledge Paradox has not yet been solved in quantum mechanics, so I cannot quite finish the quantum modification of Scrooge in this blog post.<br>\nWho knows? Perhaps this Christmas Eve I will be visited by a Ghost of Christmas Yet-to-Come, one who will show me a future Qiskit video where the Knowledge Paradox has been resolved. I will then come back to the present, and make a new Qiskit video resolving the Knowledge Paradox with quantum circuits, which turns out to be the one I saw in the future…<br>\nUntil that happens, be sure to check out the current version of the video where I investigate this topic on Qiskit YouTube. You can also dive into the accompanying Jupyter notebook, which will show you how to simulate closed-timelike-curves as a quantum circuit. And of course, whether you are spending the festive season watching videos, reading Victorian morality tales, or reflecting on the past, present and future, best wishes for the holidays and everything yet to come!<\/p>","content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-07-29 02:10:19","word_count":957,"read_time_minutes":5,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"136w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":"<p>A new chapter for Qiskit algorithms and applications<br>\nIn recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these changes, and introduces the new maintainers.<br>\nAlgorithms as an independent package<br>\nIf you have been following our release updates, you may already be familiar with this change. Since Qiskit 0.44.0, qiskit.algorithms has been migrated to a new standalone package, qiskit-algorithms. The new library can be found in the qiskit-community GitHub organization and PyPi, and is the place to go for updated, primitive-based algorithm implementations.<br>\nThis move is significant because it separates the circuit-building tools from the libraries built on top of them. This separation allows algorithm development to move at a different pace than that of the core library. While Qiskit itself aims to provide a stable foundation layer for quantum development, algorithms are still an evolving field of research, and will benefit from more flexible development cycles.<br>\nCommunity-oriented algorithms and applications<br>\nIn the case of the Qiskit applications modules, the repository changes have been a bit more subtle. qiskit-nature, qiskit-machine-learning, qiskit-optimization, and qiskit-finance are now also part of the qiskit-community GitHub organization. The package installation path has remained unchanged, so the impact of this migration on end-users has been minimal. This move does however symbolize the strengthened community focus of the projects, which also involves the newly created qiskit-algorithms.<br>\nWhile these packages have always been open-source and welcomed external contributors, most feature development and maintenance efforts were sourced from within IBM Quantum. By joining forces with external partners, we enable the community to have a stronger impact on the direction of these libraries, bringing in new perspectives and areas of expertise. At the same time, we can focus more resources on improving the performance and stability of the core Qiskit package. The documentation of the applications can be found in their corresponding repositories as well as the Ecosystem page.<br>\nWelcoming new maintainers<br>\nThe algorithms and applications libraries have onboarded new code-owners and maintainers from IBM Quantum partner institutions:<br>\nAlgorithmiq (qiskit-nature): “Our mission is to revolutionise life sciences by exploiting the potential of quantum computing to solve currently inaccessible problems. Algorithmiq’s top quantum chemistry team and their knowledge of state-of-the-art quantum chemistry methods will, together with qiskit’s expert community, tackle some of the greatest quantum chemistry simulation challenges that lie ahead.”<br>\nSTFC Hartree Centre (qiskit-machine-learning): “We help UK businesses and organisations of any size to explore and adopt supercomputing, data analytics, AI and emerging technologies for enhanced productivity, smarter innovation and economic growth. Our Qiskit work will be supported by the Hartree National Centre for Digital Innovation (HNCDI) — a collaboration with IBM Research that bridges the gap between academic research and the adoption of new technologies to solve industry challenge and transfer the skills needed to adopt digital solutions.”<br>\nQuantagonia (qiskit-optimization): “Quantagonia’s mission is to democratize quantum computing, making it accessible and manageable for businesses across sectors, enabling them to leverage this powerful technology for transformative growth and a competitive edge.”<br>\nThese are domain experts in chemistry, machine learning and optimization, as well as active community contributors.<br>\nCleaning up legacy dependencies<br>\nTo facilitate the community’s greater role in the development of algorithms and applications, legacy dependencies in the applications have been cleaned up to simplify the code base and make the libraries more accessible to external contributors and new maintainers.<br>\nThis means the newly released versions of the application modules: qiskit-finance 0.4, qiskit-machine-learning 0.7, qiskit-optimization 0.6 and qiskit-nature 0.7 no longer depend on, or support, the now deprecated modules from Qiskit, such as opflow and quantum instance. These modules will no longer be available in the upcoming Qiskit 1.0 release.<br>\nIn addition to this, and in anticipation of the upcoming removal of qiskit.algorithms, which will also not be part of Qiskit 1.0, the applications modules have been updated to use only qiskit-algorithms instead.<br>\nConclusion<br>\nIn summary, the new algorithm and application libraries in the Qiskit Ecosystem have undergone a significant shift towards community-led development. Establishing an independent algorithms package, relocating applications, and simplifying legacy code were all steps designed to facilitate and enhance community engagement. As always, community contributions are most welcome, and — together with the new maintainers — we invite all of you to get involved via the GitHub repositories or the corresponding Qiskit Slack channels, such as #applications.<\/p>","content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-07-29 02:10:20","word_count":778,"read_time_minutes":4,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"139w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":"<p>Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations<br>\nBy Jay Shah<br>\nThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.<br>\nThe Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition to the Qiskit Ecosystem Community Tier. It’s designed to be easy to use, and its GUI-based software allows users to build their visualizations while simultaneously studying or working — no need to worry about code.<br>\nRead on to learn more about this handy tool and how you can use it!<br>\nWhat users see through Quantum Glasses<br>\nIndividual qubits and single-qubit gates are some of the most fundamental building blocks of quantum computation, and the Bloch sphere provides a convenient way of visualizing them. The challenge is that Bloch spheres are not very easy to draw by hand, and there aren’t many simulators that make it easy to generate them.<br>\nQuantum Glasses accomplishes this by providing a GUI app that makes it easy to produce and manipulate Bloch sphere visualizations. This, in turn, helps users visualize important quantum computing concepts to enhance their understanding of the subject.<br>\nThe Quantum Glasses package supports a total of 11 single-qubit gates. These 11 gates include both parameterized as well as non-parameterized gates, listed below:<br>\n- Hadamard Gate<br>\n- X Gate<br>\n- Y Gate<br>\n- Z Gate<br>\n- S Gate<br>\n- S Dagger Gate<br>\n- T Gate<br>\n- T Dagger gate<br>\n- RX Gate<br>\n- RY Gate<br>\n- RZ Gate<br>\nThe parameter values for the parameterized gates (RX, RY, RZ) are discretized into the following set: 2𝝥, 𝝥, 𝝥/2, 𝝥/4, -𝝥/4, -𝝥/2, -𝝥, -2𝝥.<br>\nWith Quantum Glasses, users can apply a series of single qubit gates and see how they affect a qubit, either starting in a default initial state of |0> or in any other state that can be prepared using the available gates. Users can see the direct impact of these gates as the state vector rotates around the Bloch Sphere. These visualizations can help users:<br>\n- Better understand the effect of a particular gate when we apply it to a qubit in a given state.<br>\n- Example: Effect of RX gate when applied to a qubit in the state |+><br>\n- Gain a different perspective on important quantum computing identities<br>\n- Example: H2 = Identity (Applying a Hadamard Gate twice has no effect)<br>\nGetting started<br>\nQuantum Glasses is a GUI app built using the tkinter python library. Users can follow these steps to get the app on their local machines.<br>\n- Clone this repository using git clone https://github.com/Jayshah25/Quantum-Glasses<br>\n- Activate the venv<br>\n- Run python quantum_glasses.py<br>\nOnce you have successfully followed these steps, you should see Quantum Glasses appear on your screen.<br>\nHow to use Quantum Glasses<br>\n- Apply the desired Gates. The Display Screen keeps track of the gates applied.<br>\n- Click the Visualize Button. A new window with should pop up with the animated Bloch sphere.<br>\n- Close the animation window once the animation is complete.<br>\n- Click the Clear Button to reset the Quantum Glasses app.<br>\n- Apply a new series of Gates for visualization ,or click the Quit Button to close the app.<br>\nHopefully Qiskit users will find the above to be pretty straightforward. For extra clarity, let’s take a look at two examples taken from the preceding section of this article.<br>\nEffect of RX Gate on a qubit in the state |+><br>\nH2 = Identity<br>\nWish to see more examples with Quantum Glasses? You’ll find several more on our YouTube playlist.<br>\nFuture Work<br>\nQuantum Glasses is a fun and potentially useful tool, but it does currently have some significant limitations.<br>\n- The visualizations are limited to a single qubit. Quantum Glasses cannot visualize important concepts like quantum entanglement, which involve more than one qubit.<br>\n- The parameterized gates can only take one of the 8 values (2𝝥, 𝝥, 𝝥/2, 𝝥/4, -𝝥/4, -𝝥/2, -𝝥, -2𝝥).<br>\n- The number of gates that you can apply at once is limited to 10. Once 10 gates are applied, all the buttons automatically deactivate.<br>\nFuture work will focus on addressing these limitations and making the Quantum Glasses app even more functional and versatile. If you’d like to contribute to these efforts, please contact us via the project GitHub, here.<\/p>","content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-07-29 02:10:20","word_count":755,"read_time_minutes":4,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"140w","domain":"medium.com"},{"id":"1edf7f311f4678be","feed_id":"qiskit-blog","guid":"https://medium.com/p/69e861fbfc88","title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":"<p>Qiskit v0.45 is here!<br>\nBy Abby Mitchell, Luciano Bello, Matthew Treinish, Jake Lishman<br>\nWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.<br>\nThe TL;DR<br>\nThe biggest updates we’re going to cover include the following:<br>\n- New passmanagersubmodule to make constructing passmanagers easier<br>\n- New hardware-aware synthesis functionality, so you can now write a synthesis plugin that uses hardware information<br>\n- New methods to make it easier to use TranspileLayout<br>\n- New SabrePreLayoutpass to provide a better “first guess” initial layout before runningSabreLayout<br>\n- Performance improvements due to refactoring gates into singletons (Note: Some attributes will now error because of mutability changes)<br>\n- Unrollerpass,- bind_parameters()and any duplicated gate methods are now deprecated.- qiskit.extensionsis pending deprecation<br>\n- Deprecated code from old releases (0.16, 0.19, 0.20 and 0.21) has been removed<br>\nAn important note about package versioning<br>\nIf you’re confused about version numbers and think you may have missed out on a lot — don’t panic! In our last release, we announced that we had renamed Qiskit Terra to just Qiskit. This means the python package qiskit (which used to refer to the metapackage codebase) now refers to the codebase that was formerly named qiskit-terra. The last phase of this renaming process is to sync the version numbers between the old qiskit metapackage (the last release was v0.44) and the old qiskit-terra (the last release was v0.25). We chose to stick with the higher version number, so this release of qiskit will be v0.45.<br>\nTop new features & improvements<br>\nIn this section we’ll cover some of the most important new features and enhancements included in this release. If you want to know more about these, or other features that didn’t make it into this article, you can see the full list of new features here.<br>\nNew passmanager sub-module<br>\nThe passmanager has been significantly refactored to make it easier to use and more performant. Users can use this new module to create their own custom passmanager using their own intermediate representations.<br>\nThe following example demonstrates how you can construct a toy passmanager that, when run, will take in a row of numbers and remove any digits that equal 5. In this example, the input and outputs are integers, whereas the intermediate representation is a string:<br>\nfrom qiskit.passmanager import BasePassManager, GenericPass, ConditionalController<br>\n# create custom passmanager using BasePassManager<br>\nclass ToyPassManager(BasePassManager):<br>\n    # convert input integer to string<br>\n    def _passmanager_frontend(self, input_program: int, **kwargs) -> str:<br>\n        return str(input_program)<br>\n    <br>\n    # convert IR string to integer for output<br>\n    def _passmanager_backend(self, passmanager_ir: str, in_program: int, **kwargs) -> int:<br>\n        return int(passmanager_ir)<br>\n# Create a pass to remove a number if it equals 5<br>\nclass RemoveFive(GenericPass):<br>\n    def run(self, passmanager_ir: str):<br>\n        return passmanager_ir.replace(\"5\", \"\")<br>\n# Initialize pass<br>\ntask = RemoveFive()<br>\n# Initialize passmanager<br>\npm = ToyPassManager()<br>\n# Add pass to passmanager<br>\npm.append(task)<br>\n# Run the passmanager<br>\npm.run([123456789, 45654, 36785554])Output:<br>\n[12346789, 464, 36784]Improved workflow for transpiler layout<br>\nA number of new methods have been added to simplify the workflow for using and applying the TranspileLayout class.<br>\nTranspileLayout itself now has the following new methods:<br>\n- .initial_index_layout()— returns a python list of- TranspileLayout.initial_layout<br>\n- .routing_permutation()— returns a python list of- TranspileLayout.final_layout<br>\n- .initial_virtual_layout()— same functionality as- TranspileLayout.initial_layoutbut with the option to exclude auxilary qubits by setting the argument- filter_ancillas=False<br>\n- .final_index_layout()— returns a python list of the output positions for each qubit from the input circuit to the transpiler<br>\n- .final_virtual_layout()— returns a- Layoutobject of the output positions for each qubit from the input circuit to the transpiler<br>\nIn addition, the SparsePauliOp class now has a new method, apply_layout(), that enables a transpiled layout to be applied to an observable locally before passing it to a primitive .run() function. E.g.:<br>\nfrom qiskit.circuit.library import RealAmplitudes<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nfrom qiskit.primitives import BackendEstimator<br>\nfrom qiskit.compiler import transpile<br>\nfrom qiskit.providers.fake_provider import FakeNairobiV2<br>\npsi = RealAmplitudes(num_qubits=2, reps=2)<br>\nH1 = SparsePauliOp.from_list([(\"YX\", 1), (\"XZ\", 2), (\"XI\", 3)])<br>\nbackend = FakeNairobiV2()<br>\nestimator = BackendEstimator(backend=backend, skip_transpilation=True)<br>\nthetas = [0, 1, 1, 2, 3, 5]<br>\ntranspiled_psi = transpile(psi, backend, optimization_level=3)<br>\npermuted_op = H1.apply_layout(transpiled_psi.layout)<br>\nres = estimator.run(transpiled_psi, permuted_op, thetas).result()New SabrePreLayout pass<br>\nThis release includes a new transpiler pass, called SabrePreLayout, designed to provide a better initial layout before running SabreLayout. This layout attempts to improve transpilation outputs in particular for large device topologies.<br>\nThe following example demonstrates how to use the SabrePreLayout pass before running a SabreLayout pass:<br>\nimport math<br>\nfrom qiskit.transpiler import CouplingMap, PassManager<br>\nfrom qiskit.circuit.library import EfficientSU2<br>\nfrom qiskit.transpiler.passes import SabrePreLayout, SabreLayout<br>\nqc = EfficientSU2(16, entanglement='circular', reps=3, flatten=True)<br>\nqc.assign_parameters([math.pi / 2] * len(qc.parameters), inplace=True)<br>\nqc.measure_all()<br>\ncoupling_map = CouplingMap.from_heavy_hex(7)<br>\npm = PassManager(<br>\n  [<br>\n    SabrePreLayout(coupling_map=coupling_map),<br>\n    SabreLayout(coupling_map),<br>\n  ]<br>\n)<br>\npm.run(qc)For more details on how this new pass does its thing, check out the PR for a more detailed description of the logic behind its development.<br>\nNote: This new feature is an experimental pass and is not yet included in the preset passmanagers.<br>\nPerformance improvements<br>\nIn this section, we’ll cover the most significant performance improvements that users will gain with this release.<br>\nFaster transpilation<br>\nThe transpiler has undergone some refactoring under the hood, resulting in performance improvements across all optimization levels. Users do not need to change anything in their transpiler development workflow. However, by upgrading to the latest version of Qiskit, you should see faster transpilation times, particularly noticeable for large circuit depths.<br>\nThe graphs below show the difference in transpile time between Qiskit v0.44 and v0.55 across a range of circuit depths and optimization levels:<br>\nFaster circuit construction and QASM parsing due to Singleton classes<br>\nThe following unparameterised and non-controlled gate classes have been refactored to be singletons:<br>\n- DCXGate,- ECRGate,- HGate,- IGate,- iSwapGate,- SGate,- SdgGate,- SwapGate,- SXGate,- SXdgGate,- TGate,- TdgGate,- XGate,- RCCXGate,- RC3XGate,- YGate,- ZGate,- CHGate,- CSGate,- CSdgGate,- CSwapGate,- CSXGate,- CXGate,- CCXGate,- C3SXGate,- C3XGate,- C4XGate,- CYGate,- CZGate<br>\nAs a result, implementing these gates has become significantly more efficient, requiring less memory, reducing circuit construction time and speeding up QASM parsing time. These effects are most noticeable in large circuits, and highlight the efforts being made to ensure Qiskit can continue to support users as they move towards utility-scale experimentation.<br>\nSee below a comparison of circuit build time and parameter binding time between Qiskit v0.44 and 0.45:<br>\nNew deprecations<br>\nIn this section we’ll cover some of the most important new deprecations in this release. This section aims to highlight things that will now start throwing deprecation warnings and will be removed in a later release, following Qiskit’s Deprecation Policy (documented in full here). Due to this being the last release before Qiskit 1.0, you may see more things than usual being highlighted in this section.<br>\nFor guidance on how to deal with deprecation warnings, check out the deprecations section in our previous article here. You can see more detail about the deprecations specific to this release here.<br>\nqiskit.extensions<br>\nThe qiskit.extensions sub-module is pending deprecation and will be fully deprecated in a future release, with its contents either being moved to other sub-modules or deprecated.<br>\nThe following qiskit.extensions classes have been moved to the circuit library, users should update
