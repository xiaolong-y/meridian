s ideal minimum,<br>\nis called dissipated work. It measures the extra work associated with carrying out the process irreversibly, and the second law says that it cannot be negative.<br>\nThis is where the three definitions part ways. All three satisfy the first law, but only two satisfy the second law for the processes considered in the paper. The third definition, which accounts for the temperature dependence of the Hamiltonian of mean force, can predict negative dissipated work.<br>\nDoes this mean that our quantum system has somehow broken the second law? Not at all. Rather, the third definition assigns internal energy, work, and heat in a way that makes a valid process look thermodynamically inconsistent.<br>\nThe next question is why the three definitions agree in classical physics but separate in the quantum case. The answer lies in one of quantum mechanics’ defining features: observables do not always commute. Roughly speaking, when noncommuting observables describe two quantum properties, they cannot both be measured simultaneously. This has no direct counterpart in classical physics, where two observables describing different properties can be measured simultaneously. When the system’s energy and interaction energy cannot be simultaneously measured, the three definitions of work can give three different values.<br>\nTo explore this connection, we considered what happens when the system’s Hamiltonian commutes with the interaction Hamiltonian, both before and after the sudden quench. In this classical-like limit, all three expressions for work give the same value, which also obeys the second law. In hindsight, the result may seem obvious. Still, there is something oddly satisfying about pinpointing precisely when the three definitions agree: strong coupling alone does not force them to give different answers. Quantum noncommutativity is what allows them to part ways.<br>\nOver the years, our family’s egg repertoire expanded. MasterChef episodes, new cookbooks, and travel brought poached eggs, Scotch eggs, shakshuka, eggs-in-purgatory, Tamagoyaki, and plenty of experiments in between. In some dishes, the yolk and white remain almost perfectly distinct; in others, the boundary between them nearly disappears. A whole spectrum exists between separation and complete mixing.<br>\nThe same is true of a system and its environment: their interaction can range from barely noticeable to overwhelmingly strong. Our results identify two definitions that remain consistent with the laws of thermodynamics for the processes we studied, even when those interactions become strong.<\/p>","content_hash":"0e2010f973ab2f514212cd2fd3efe8aa","author":"greeshmaoruganti","published_at":"2026-10-11T22:21:40","fetched_at":"2026-11-26 16:16:00","word_count":1800,"read_time_minutes":10,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"6w","domain":"quantumfrontiers.com"},{"id":"26bb0ca55c7452a3","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18273","title":"In praise of questions","url":"https://quantumfrontiers.com/2026/10/08/in-praise-of-questions/","summary":"Prende y se apaga sola, sale después de hora. CHARLY GARCÍA La máquina de ser feliz1 I’ve learned to tolerate them, and sometimes even like them, but Zoom meetings are weird. Even in familiar contexts: I have weekly check-ins with a close friend/collaborator based in Germany, and despite our familiarity, it still feels weird at times. I joined Nicole Yunger Halpern’s group almost when it was established, during Summer of 2021. The pandemic wasn’t exactly over, and most of us were geographically ","content":"<p>Prende y se apaga sola,<br>\nsale después de hora.<br>\nCHARLY GARCÍA<br>\nLa máquina de ser feliz1<br>\nI’ve learned to tolerate them, and sometimes even like them, but Zoom meetings are weird. Even in familiar contexts: I have weekly check-ins with a close friend/collaborator based in Germany, and despite our familiarity, it still feels weird at times. I joined Nicole Yunger Halpern’s group almost when it was established, during Summer of 2021. The pandemic wasn’t exactly over, and most of us were geographically scattered, as well as complete strangers. To half-palliate this awkwardness, Nicole came up with what’s now sort of a group tradition: icebreaker questions. These are chosen by group members (in a secret order that I believe only Nicole fully knows), and can range from day-to-day stuff (“what’s the best type of pasta?”) to deeper matters.<br>\nA while back, a group member asked something along the lines of: “If you could give your younger self any scientific advice, what would it be?” My response then was: “ask the dumb questions you have as they come.” I had two reasons for this answer. First, dumb questions usually sound dumber in your head and are not as bad as you might think. Second, a dumb matter that doesn’t seem dumb at first, can turn into a really, really dumb question if it’s long unanswered. If I were to be asked this same icebreaker question today, I’d surely reply the same thing, but I believe the reasoning would be more nuanced.<br>\nOver my PhD, I’ve had the opportunity to interact, discuss physics, and even collaborate with truly amazing scientists. I still don’t have a foolproof handbook of criteria detailing what makes a great physicist great,2 but I have observed some patterns. An important one is that great physicists speak their mind: they’re usually relentless with their own confusion and ask whatever they have to ask to overcome it. Don’t get me wrong here; these people are giants, and I wouldn’t dare call their questions dumb, but asking good questions is a skill more than a gift. It’s like seeing Claudia Poll swim or hearing Hilary Hahn play a cadenza: yes, these people are objectively good, but there’s also a huge amount of practice that goes behind what one sees. And, in the case of asking great questions, practice comes from asking not-great (and sometimes even dumb) questions.<br>\nI got a crash course in asking questions during a recent project. A driving theme of my PhD research has been the study of autonomous quantum machines. These devices execute tasks without classical, time-dependent control, operating under a time-independent Hamiltonian. My first experience with these devices was during an experimental collaboration in which Simone Gasparinetti’s group built an autonomous quantum refrigerator from superconducting qubits. The refrigerator ran on a thermal gradient: as heat flowed from a hot bath to a cold one, a three-qubit interaction carried energy out of a target qubit, cooling it with no external control. The experiment was a success, and its potential usefulness in information-processing devices led us to ask about other contexts in which autonomous quantum machines could shine.<br>\nAt the time, we came in close contact with folks at Marcus Huber’s group in Vienna, who were thinking in abstract terms about a fully autonomous quantum processing unit. We had the idea of designing autonomous protocols for logical gates in current-day quantum-technology platforms: Rydberg atoms, trapped ions and superconducting qubits.<br>\nTo illustrate this autonomous-gate idea, I’ll briefly describe a gate protocol from our paper. As I mentioned before, an autonomous quantum fridge can be built by exploiting a thermal gradient. The same principle can help build a heat engine. Suppose one has three qubits, with energy gaps and . Let’s call these qubits the cold, hot and target qubits, respectively. The cold qubit couples to a bath at temperature and the hot qubit to a bath at a temperature , with . Under the resonance condition , the three qubits can swap energy all at once: the hot qubit loses an excitation while the cold and target qubits each gain one, or vice versa. The gradient makes the first direction more likely. The cold qubit can be engineered to quickly decay to its bath, so the exchange can’t run backward, and the target accumulates excitations. The cold qubit’s energy is lost to its bath, while the target could emit into a waveguide that delivers the photon to a chosen destination. The thermal gradient thus powers a device that emits useful photons with no external control.3<br>\nWhat can we do with this autonomously emitted photon? We can use it to trigger an entangling gate. Two superconducting qubits with matching energy gaps can exchange excitations. Suppose we have a tunable-frequency transmon qubit capacitively coupled to a cavity. An incoming photon from our autonomous emitter, entering the cavity, can shift the frequency of the transmon. If this effective, shifted frequency matches a nearby qubit’s frequency, the two transmons can interact. The effect of this interaction depends on the cavity’s decay time, rendering our entangling gate random and potentially useful for the implementation of Brownian circuits, for example. A charming instance of a quantum Rube Goldberg machine, if you ask me.<br>\nThis example illustrates the spirit behind our autonomous-gate ideas. As mentioned before, we propose several more instances over different platforms. This all sounds nice and clean after looking at the end product. But the truth is that, when we started the project, I was a theory student with little knowledge about the inner workings of platforms, trying to pitch convincing arguments for novel gate protocols in these well-established technological fields. I had to go through decades of accumulated literature and famous experiments, trying to understand them and hopefully come up with ways to readapt them to the context of autonomy. Naturally, there were many old papers to read, many small details to understand that were obvious to a familiarized experimentalist but not to me, and, of course, many dumb questions to ask. Regarding this, I have to deeply thank Tom Manovitz, Norbert Linke and Simone Gasparinetti, our experimental collaborators, for their patience with these questions and their willingness to chat and clarify to a confused theorist what’s possible and interesting in experimental contexts.<br>\nA special mention, however, to postdoc Yuxin Wang. Earlier in the text I mentioned how being relentless with one’s confusion is helpful; she’s one of the clearest examples I can think of. She came into the project right as I was struggling to model one of our superconducting-qubit gates. I was knee-deep in a convoluted formalism, drowning in inefficient numerical simulations that were leading nowhere. She asked a bunch of questions about our system and my modeling attempts for which I had no good answers for, especially because her expertise in both AMO and open systems really made my explanations look weak. I mean this in the best way I can: polishing my arguments and deeply enquiring about modeling decisions forced us to zoom out and look at simpler, more-efficient ways in which we could model our physical setup. I can’t even begin to quantify Yuxin’s patience and helpfulness in the project, nor how much I learned from working closely with her.<br>\nResearch, of course, is about asking questions. Trying to clarify confusion and asking in the most transparent way possible are discomforts I still struggle with (much like with Zoom calls), but I’ve learned to appreciate these convoluted scenarios and sometimes even thrive in them. Not being the smartest or most-experienced person in a room has lots of perks. You can learn a lot, although you might need to ask one or two dumb questions to get there.<br>\n- It turns on and off by itself,<br>\nit goes out after hours.<br>\nCHARLY GARCÍA<br>\nThe happiness machine<br>\n↩︎<br>\n- I do have, however, a handbook of criteria detailing what makes a useful autonomous quantum machine useful, though. ↩︎<br>\n- Quantum thermodynamicists call these photon-emitting devices autonomous quantum clocks. ↩︎<\/p>","content_hash":"43a118f0636504057fd08f9563d3306f","author":"José Antonio Marín Guzmán","published_at":"2026-10-08T15:27:53","fetched_at":"2026-11-26 16:16:00","word_count":1329,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"7w","domain":"quantumfrontiers.com"},{"id":"f42f1089f5b28a25","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18260","title":"Marcus theory and Marcus practice","url":"https://quantumfrontiers.com/2026/09/27/marcus-theory-and-marcus-practice/","summary":"Rudy Marcus was 91 years old when I took a course from him. His age was, arguably, not his most remarkable quality. The course took place during the second spring of my PhD. I was completing not only the academic year, but also my course requirements. Why not, I figured, indulge in traditional statistical mechanics? Statistical mechanics neighbors, and partially overlaps with, thermodynamics. Modern approaches to statistical mechanics include fancy toolkits imparted in physics courses: the renor","content":"<p>Rudy Marcus was 91 years old when I took a course from him. His age was, arguably, not his most remarkable quality.<br>\nThe course took place during the second spring of my PhD. I was completing not only the academic year, but also my course requirements. Why not, I figured, indulge in traditional statistical mechanics? Statistical mechanics neighbors, and partially overlaps with, thermodynamics. Modern approaches to statistical mechanics include fancy toolkits imparted in physics courses: the renormalization-group method; Ginzburg–Landau theory; and the latter theory’s successor, topological order. I craved a more traditional approach, as won’t surprise readers of this blog. So I ditched the physics course list and signed up for Chemistry 166.<br>\nRudy didn’t disappoint. He began the course with a tradition passed down from a founder of thermodynamics: Boltzmann’s H theorem. The theorem amounts to the first argument ever published for the second law of thermodynamics: every (sufficiently large) closed, isolated system’s entropy increases or remains constant; it doesn’t decrease. Rederiving Boltzmann’s H theorem, I felt as I would while holding a lace collar worn by Queen Elizabeth I: as though I were touching history.<br>\nRudy proceeded through more of the greatest hits in statistical mechanics. For instance, the Fokker–Planck and Langevin equations describe random processes. Examples include the subject of one of Einstein’s most famous papers: the motion of a pollen grain suspended in a liquid and buffeted by the liquid’s molecules. Chemistry 166 provided much of the bread and butter, meat and potatoes, and even tofu and edamame of a thermodynamicist’s education.<br>\nRudy advanced step by step, rederiving every result in class. He recommended a textbook; but I refer to my lecture notes, rather than to the text, to refresh my memory about course topics nowadays. When I encounter complex integrals (a certain type of calculus) in statistical mechanics, I think back to Rudy’s treatment of them. The course also crystallized my understanding of the fluctuation–dissipation theorem, which describes systems perturbed slightly out of equilibrium; examples include a magnet subjected to a weak magnetic field.1 For the course’s final project, I studied quantum master equations—which featured in a Quantum Frontiers post afterward.<br>\nNo less than his explanations of science, Rudy’s enthusiasm for science impressed itself upon me. Again, he taught Chemistry 166 at age 91. He continued to collaborate on research. Whenever I saw him, even after the course ended, he asked for news about quantum information theory—which he didn’t work on.<br>\nTwo and a half years after the course, Rudy gave a speech at a dinner in honor of a couple’s engagement. The groom was pursuing a PhD in applied physics, and the bride worked as an engineer. The groom asked if Rudy had advice for young scientists. Rudy responded immediately: plenty of science remains to be done, so keep exploring.<br>\nDuring his speech, Rudy described his upbringing in Montreal. His high school had produced a “who’s who” of Canadians, in his words—and not because the school demanded high tuitions or offered tutors and social connections. Discrimination pushed Jewish working-class children out of other schools and into Baron Byng, where some students worked hard enough to thrive. Alumni include artists; judges; physicists; William Shatner, who played Captain Kirk in the original Star Trek series…and Rudy Marcus.<br>\nWhich leads me to the quality arguably more remarkable than Rudy’s teaching Chemistry 166 at age 91: he’d won a Nobel Prize in chemistry. Unlike most chemists, Rudy worked as a theorist, rather than an experimentalist. He developed a framework now called Marcus theory. It predicts the rate at which electrons hop between molecules. I can’t tell you much more about Marcus theory because I don’t know much more about it: Rudy had enough humility that, to my memory, he mentioned his theory only once in class, in passing.<br>\nAlthough I know little about Marcus theory, I’ve seen much of Marcus practice. In 2022, I emailed Rudy to ask where a holiday card could reach him. The pandemic had isolated enough people that I’d determined to reach out to more acquaintances. Rudy replied, “I have been working at home, meeting twice a week on zoom with my now small research group.” He was 98 years old. His curiosity, learning, mentoring, and exploring continued.<br>\nRudy passed away this July, five days before his 103rd birthday. I hope to learn Marcus theory someday. But I’d be even more grateful to undertake Marcus practice for even a decent fraction of the time for which he did.<br>\n1How rapidly does the system respond to the perturbation? This nonequilibrium response depends on a correlation function evaluated on an equilibrium state, according to the fluctuation–dissipation theorem. To understand why, imagine preparing the system in a thermal state, perturbing the system at an early time, and measuring the system later. What information can you extract about the perturbation? A two-time correlation function encodes this information. Imagine Fourier-transforming a two-time correlation function. The Fourier transform is proportional to a second derivative of a free energy, according to the fluctuation–dissipation theorem. (The second derivative should sound plausible because it depends on a two-time correlation function.) Second derivatives of free energies equal response functions, such as the magnetic susceptibility. Therefore, a nonequilibrium response depends on an equilibrium correlator.<\/p>","content_hash":"03441b4c88ad1e7bcaaf5c5d077f227b","author":"Nicole Yunger Halpern","published_at":"2026-09-27T19:29:51","fetched_at":"2026-11-26 16:16:00","word_count":869,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"8w","domain":"quantumfrontiers.com"},{"id":"abcdfe6532909136","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18268","title":"Quantum Computers Need More than “Magic”","url":"https://quantumfrontiers.com/2026/09/20/quantum-computers-need-more-than-magic/","summary":"The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.&nbsp; Between the bringing of the bread a","content":"<p>The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.<br>\nBetween the bringing of the bread and the serving of the soup, the conversation at my end of the table typically turns to my topic of research: quantum computers. These theoretical machines harness quantum physics to outperform their classical counterparts. Quantum computers hold great promise for the future, with applications ranging from drug discovery to cybersecurity. Yet, despite their promise, we still do not have a satisfying answer to the fundamental question: what makes quantum computers computationally stronger than classical computers?<br>\nTo answer this question, imagine that tonight, instead of the soup, the cooks are brewing a happiness potion. This potion causes the drinker to be joyful and content for the rest of the evening. The cooks know how to brew the potion perfectly well; they discovered the list of ingredients in the nineties and have been successfully brewing ever since. But the cooks still cannot solve one mystery: what makes the potion different from the soup? What ingredient sets the potion apart from the soup?<br>\nThe cooks come up with a simple approach. They leave out one ingredient in each serving, and then carefully observe the formal-goers. They find that almost every seat is filled by a happy student, chatting away to their neighbours, indicating a working potion. However, one student’s spirits have not been lifted, as they were solely served a simple soup. The cooks conclude that the ingredient they withheld for that student was essential. They name this ingredient magic.<br>\nIn my research, the potion is a quantum computer, the soup is a classical computer, and magic is the actual technical term used for quantum states that promote certain classical computers to quantum computers. Without magic, these quantum computers are computationally no stronger than a normal laptop.<br>\nSo magic is necessary for quantum computational advantage, but is it enough? Over a decade ago, researchers found that, for quantum computers built on qutrits, the answer is no. To understand what a qutrit is, consider the regular bit: a switch that’s either zero or one. The qubit, the quantum generalization of the bit, can be both zero and one simultaneously. The qutrit is a roomier qubit that can be zero, one, two, or any of those simultaneously.<br>\nIt is possible to build quantum computers using qutrits. However, the vast majority of quantum computers are built on qubits, the quantum generalisation of the everyday bit. My colleagues and I have recently discovered that for qubit-based quantum computers, too, magic is not enough to gain an advantage over classical computers. Picture the cooks dumping jar after jar of magic into a soup, only to find that the soup never gains magical powers. Potions need more than magic. Potions also need Kirkwood-Dirac negativity.<br>\nWhat is Kirkwood-Dirac negativity? The idea developed by John Kirkwood and Paul Dirac builds on probabilities—for example, the odds of obtaining a heads upon flipping a coin. One can describe a quantum computer using numbers that behave similarly to probabilities but come with a twist: they may be negative. These negative “probabilities” mark where quantum departs from classical. The main result of our paper is that this negativity, too, is a necessary ingredient: without it, no amount of magic will turn the soup into a potion.<br>\nAt this point in the conversation, I am typically cut off by the arrival of the soup. The conversation moves on from quantum computers to different subjects, and I usually look up at the paintings staring down at me. One of them is of Dirac, who spent many dinners discussing quantum theory in the same dining hall. The University of Cambridge is a special place.<\/p>","content_hash":"8c54ccd29fbd109c79f02546399e0593","author":"jjthio","published_at":"2026-09-20T16:49:32","fetched_at":"2026-11-26 16:16:00","word_count":678,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"9w","domain":"quantumfrontiers.com"},{"id":"3f8f2a08f44c12ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18162","title":"How can objects interact without touching?","url":"https://quantumfrontiers.com/2026/09/06/how-can-objects-interact-without-touching/","summary":"Rethinking the electric field Have you ever wondered what an electric field actually is?&nbsp; The electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.&nbsp; Most textbooks define the electric field ","content":"<p>Rethinking the electric field<br>\nHave you ever wondered what an electric field actually is?<br>\nThe electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.<br>\nMost textbooks define the electric field as a property of space or a physical entity surrounding electric charges, or with the equation of force per unit charge. These definitions help us understand what the electric field does and its effect on electrically charged particles, but they do not fully answer what an electric field actually is and how it influences charges. Thus, I started thinking about the question: what allows charges to influence each other without touching?<br>\nThis question led me down a path that began with a simple observation in everyday life, and it eventually pointed toward much deeper ideas in modern physics.<br>\nObjects Influenced by Their Surroundings<br>\nBefore talking about electric fields, let’s consider a more basic question: Does it seem reasonable that objects can be influenced by their surroundings?<br>\nMost people would answer yes. We have all seen examples of objects responding to something else nearby, such as the Earth orbiting the Sun, a compass needle reacting to a magnet, and our phones responding to signals from a WiFi router. But what is the mechanism behind these interactions?<br>\nA simple physical phenomenon that we can look at is a balloon rubbed on a piece of clothing that can pick up strands of our hair. Many of us have seen this demonstration in kindergarten or first grade of elementary school. This might seem completely ordinary, but if we pause and think about it, something strange is happening – the balloon is influencing the hair without touching it.<br>\nHow is that possible? One answer is simply that the balloon “pulls” on the hair, but this raises more questions. How does the balloon reach the hair? What is happening in the space between them? These questions suggest that something is missing from the picture of objects pulling on each other directly through contact.<br>\nTo put this in the context of physics, we might all have learned that “like charges repel, and opposite charges attract”. We might have solved equations on how fast charges would move away from or toward each other. We were always told to just accept it because these motions result from the electric field. But why do these observations happen? What is happening between the charges?<br>\nHistorically, physics encountered the same problem. If one object can influence another at a distance, it is natural to ask what is happening in the space between them. One guiding principle that physicists often use is the concept of locality. Locality is the idea that an object can only be directly influenced by its immediate surroundings. Thus, an influence should not simply leap across space from one object to another, and changes should propagate through intermediate regions step by step.<br>\nAt first glance, locality seems reasonable because it matches many of our everyday experiences. If I push a book across a table, my hand influences the book through direct contact. The influence does not appear to jump instantaneously across the table.<br>\nHowever, locality creates a tension when we return to the scenario of the balloon pulling on strands of hair. If locality is true, something must be happening in the space between the balloon and the hair. But from a standard electromagnetic perspective, the space between the balloon and the hair is empty. Therefore, we have encountered a contradiction: if what is between the balloon and the hair is empty space, then what is responsible for transmitting the influence? Neither the usual electromagnetism nor locality tells us the answer to these questions.<br>\nThe Classical Electric Field<br>\nIn the usual electromagnetic picture, the answer to the puzzle is the electric field. Rather than allowing charges to influence one another directly across space, the theory assigns an electric field to the space surrounding charges. The field acts as the intermediary through which influence is transmitted.<br>\nA useful way to think about the electric field is that it assigns information to every point in space. If we imagine a charged particle that is placed at a particular location, the electric field tells us how that particle would move. This charged particle is what physicists call a test charge. By observing how the test charge behaves, we can infer information about the electric field at that location.<br>\nThis could seem like a satisfying answer as the electric field tells us how influence is transmitted, but it does not tell us what kind of thing is doing the transmission. Is the electric field a physical substance? Is it a mathematical tool? Or is it something else?<br>\nIt might be easy to fall back on the idea that the electric field ultimately works through tiny particles physically touching one another. After all, contact interactions are among the most familiar interactions that we experience.<br>\nBut physics challenges this intuition as well. It is surprisingly difficult to define what it means for two objects to “touch”. We usually think of the balloon attracting hair as an example of action at a distance, whereas pressing a hand on a table feels like direct physical contact. However, at the microscopic level, the two situations are fundamentally similar. If we could zoom in on our fingertip and the table with a microscope, we would find that the atoms in our skin never make contact with the atoms in the table. This is because of the repulsion between the electron clouds surrounding the atoms, which prevents the two atomic nuclei from overlapping. Say if we scale the atom in the table up to be the size of a marble, then the nearest atom in our fingertip would still be separated from it by a few centimeters. In the end, nothing is truly “touching” in the intuitive, physical sense.<br>\nThus, the idea of contact does not solve our problem. We are forced to ask the same question again: what is it that allows these interactions to occur? To answer that question, I turned to a different perspective of thinking about electric fields.<br>\nThe Electric Field as A Dynamical Structure<br>\nFrom our intuition, it is natural to imagine the electric field as some invisible substance filling space. This is often the picture suggested by the common field line diagrams in physics textbooks, which make the field appear to flow outward or inward from charges, almost like a moving fluid.<br>\nA useful analogy is the ocean. A boat floating on water can move because waves pass beneath it. The boat responds to changes in its surrounding waves rather than to some direct push from a distant object. Similarly, charged particles respond to changes in the electric field around them. We can then view the electric field as a dynamical structure that governs how the state of the world can evolve.<br>\nHowever, the ocean analogy can only take us so far. Ocean waves are made of water molecules. Sound waves are made of vibrating air molecules. But what is the electric field made of? When light travels through empty space, it seems that there is no material medium at all.<br>\nThis brings us back to the mystery: if locality suggests that something must exist in the space between interacting objects, and if the electric field is not made of the ordinary matter that we understand, then what exactly is occupying the space?<br>\nTo answer this question, we have to rethink what we mean by “empty” space itself.<br>\nEmpty Space is Not Empty<br>\nConventionally, we have always imagined empty space as exactly what the name suggests—empty. Just like if all the particles were removed and nothing was remaining. But modern physics suggests a very different picture.<br>\nIn quantum field theory, what we call “empty space” is not truly empty. Empty space is filled with underlying quantum fields that permeate all of space and time, even in the absence of particles. Even when the surface of the ocean looks perfectly still, the water is still there. The ocean is not defined only by visible waves, but by the underlying medium that can support waves in the first place. The waves are patterns of motion of the ocean itself, just like the electric field. These fields are part of the fundamental structure of the universe from which physical phenomena emerge. Quantum field theory suggests that particles are not independent objects moving through an otherwise empty space. Rather, they are localized patterns or excitations of underlying fields that already exist throughout the universe.<br>\nFrom this perspective, the electric field is not something that is added to empty space. It is part of the fundamental dynamical structure of space itself.<br>\nConclusion<br>\nAt the beginning, I asked a simple question: how can objects influence each other without touching? The straightforward answer is the electric field. Charges create electric fields, and those fields determine how other charges move. But what is an electric field? Is it an invisible material filling space between objects, or is it a dynamical structure that governs how physical systems in the world evolve?<br>\nFrom the perspective of quantum field theory, quantum fields permeate all of space and time. Particles are not separate objects moving through an empty space, but are excitations of these underlying fields; electric fields are not secondary matter surrounding charged particles, but are particular configurations of the underlying electromagnetic quantum fields. What we observe as the motion of a charged particle is the result of its interaction with the electromagnetic field, whose local state determines how the particle evolves.<br>\nIn the end, our original question may not have a single definitive answer. But asking it revealed a shift in perspective, and physics has repeatedly shown that every explanation opens the door to an even more fundamental question. Stopping at this step, a new mystery emerges: what are these underlying quantum fields themselves? What are they made of, and where do they arise from?<\/p>","content_hash":"72ad48be59eb5d47ff76fadb3908d2c5","author":"adelynnt","published_at":"2026-09-06T13:17:26","fetched_at":"2026-11-26 16:16:00","word_count":1697,"read_time_minutes":9,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"11w","domain":"quantumfrontiers.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-11-26 16:15:59","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"148w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-11-26 16:15:59","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"153w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-11-26 16:15:59","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"154w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":null,"content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-11-26 16:15:59","word_count":79,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"156w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":null,"content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-11-26 16:15:59","word_count":76,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"158w","domain":"medium.com"},{"id":"1edf7f311f4678be","feed_id":"qiskit-blog","guid":"https://medium.com/p/69e861fbfc88","title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":null,"content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-11-26 16:15:59","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"159w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":null,"content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-11-26 16:15:59","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"160w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":null,"content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-11-26 16:15:59","word_count":87,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"161w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":null,"content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-11-26 16:15:59","word_count":75,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"162w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":null,"content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-11-26 16:15:59","word_count":86,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"164w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"6ca426c1a5cc0e0b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49194","title":"Riverlane and Nature Research Intelligence Release 2026 Quantum Error Correction Report Highlighting Shift to Full-Stack Engineering","url":"https://quantumcomputingreport.com/riverlane-and-nature-research-intelligence-release-2026-quantum-error-correction-report-highlighting-shift-to-full-stack-engineering/","summary":"The Quantum Error Correction Report 2026 indicates a shift in the quantum computing industry from physics demonstrations to full-stack engineering of fault-tolerant machines. Key findings show significant growth in QEC research, patent activity, and public funding, with a notable trend towards high-rate quantum low-density parity-check (qLDPC) codes. The report highlights challenges in real-time decoding and cross-layer system integration as the industry moves towards large-scale fault tolerance","content":"<p>Riverlane, in collaboration with Nature Research Intelligence (part of Springer Nature), has published The Quantum Error Correction Report 2026, the third annual edition of its global assessment of quantum error correction (QEC) research, intellectual property, funding, and systems engineering. Drawing on Dimensions publication and grant records (January 2021 to August 2026), Patsnap patent family data, and interviews with 15 experts across 12 organizations, the report finds that the quantum computing industry is transitioning from isolated physics demonstrations to full-stack engineering of fault-tolerant machines.<br>\n| Key Metrics & Benchmarks from The Quantum Error Correction Report 2026 |  |  | <br>\n|---|---|---|<br>\n| Category | Headline Figures (2021–August 2026) | Leading Contributors & Ecosystem Shifts | <br>\n| QEC Research Output | 36.4% CAGR (2021–2025); nearly 1,600 publications indexed in 2026 through August 4. | U.S. leads output (24.4%, 1,174 papers) ahead of China (14.3%, 691); Caltech (108), UChicago (95), and Yale (95) top institutions. | <br>\n| Code Family Adoption | Surface codes lead cumulative volume (1,156 papers); qLDPC code papers grew 127% year-over-year. | Growing adoption of long-range qLDPC, CSS, and concatenated codes on modular and reconfigurable hardware. | <br>\n| Patent Activity | More than 6× growth in published QEC patent families, rising from 27 in 2021 to 169 in 2025 (114 YTD in 2026). | Microsoft, Google, and Riverlane hold 94 combined patent families, ahead of IBM (12), NTT (10), LG Electronics (10), and Alice & Bob (10). | <br>\n| Public Funding & Validation | ~$2.5 billion in tracked QEC research grants since 2021 (led by the U.S. at $1.17B and EU/Belgium at $435.6M). | Shift toward architecture validation via DARPA QBI, UK ProQure, France’s expanded PROQCIMA (1,000-logical-qubit target), and $2B in U.S. Commerce LOIs. | <br>\nWhile geometrically local surface codes remain the most experimentally validated foundation for near-term roadmaps, the report documents a sharp pivot toward high-rate quantum low-density parity-check (qLDPC) codes and multi-code stacks enabled by modular superconducting couplers and reconfigurable neutral-atom and trapped-ion architectures. Recent milestones reviewed in the study include Google Quantum AI’s magic-state cultivation achieving 0.9999(1) fidelity, Quantinuum’s beyond-break-even iceberg code demonstrations across up to 94 logical qubits on its 98-qubit Helios processor, and Oratomic’s resource estimates reducing physical qubit requirements for RSA-2048 factoring to as few as 10,000 qubits.<br>\nLooking ahead to 2027, experts from IBM Research, Google Quantum AI, Quantinuum, IonQ, NVIDIA, Oak Ridge National Laboratory, and Riverlane identify whole-machine real-time decoding and cross-layer system integration as the primary bottlenecks. Because superconducting processors execute error-correction cycles in roughly one microsecond, roughly 1,000 times faster than millisecond-scale trapped-ion and neutral-atom systems, scaling syndrome decoding and control feedback across full multi-module architectures remains a central engineering hurdle before MegaQuOp-scale fault tolerance is realized.<br>\nDownload The Quantum Error Correction Report 2026 from Riverlane here, and view Riverlane’s previous 2025 and 2024 editions here and here.<\/p>","content_hash":"395b1e75c7a13dbb91e0bf8effc24a59","author":"Mohamed Abdel-Kareem","published_at":"2026-11-26T05:14:05","fetched_at":"2026-11-26 16:15:57","word_count":473,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"11h","domain":"quantumcomputingreport.com"},{"id":"de582307e0e59679","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49190","title":"Equal1, NVIDIA, and Dell Technologies Demonstrate Real-Time Hybrid Quantum-Classical Rack Integration at SC26","url":"https://quantumcomputingreport.com/equal1-nvidia-and-dell-technologies-demonstrate-real-time-hybrid-quantum-classical-rack-integration-at-sc26/","summary":"At SC26, Equal1, NVIDIA, and Dell Technologies showcased a real-time hybrid quantum-classical computing integration. They demonstrated Equal1's RacQ quantum computer integrated with Dell servers in a standard rack. This setup utilizes NVIDIA's software for gate tuning and low-latency communication, with Dell's QIO orchestrating hybrid execution. The post Equal1, NVIDIA, and Dell Technologies Demonstrate Real-Time Hybrid Quantum-Classical Rack Integration at SC26 appeared first on Quantum Computi","content":"<p>Silicon spin-qubit developer Equal1 has collaborated with NVIDIA and Dell Technologies to demonstrate an integrated hybrid quantum-classical computing architecture at the SC26 supercomputing conference in Chicago. Hosted at the Dell Technologies booth, the demonstration paired Equal1’s 1.6 kW rack-mounted RacQ silicon quantum computer with Dell data center servers inside a standard rack footprint.<br>\nThe joint software and interconnect stack combines NVIDIA Ising Calibration open models for automated gate tuning—including real-time controlled-Z (CZ) gate calibration, with NVIDIA NVQLink to provide ultra-low-latency round-trip communication between quantum processors and GPUs. Hybrid execution across the classical and quantum hardware is coordinated by the Dell Quantum Intelligent Orchestrator (QIO) software prototype.<br>\nRead Equal1’s technical announcement here and CEO Jason Lynch’s blog post on quantum-AI power economics here, and view Equal1’s SC26 showcase post on LinkedIn here. Related QCR coverage includes our earlier reports on QuEra and Dell Technologies’ hybrid quantum-classical integration at SC25 here and NVIDIA’s NVQLink architecture here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\n- Players →Companies and institutions across the quantum industry, by segment.<br>\n- Scorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"cf3e600cefdb6c6d73f1cce0756e8d6b","author":"Mohamed Abdel-Kareem","published_at":"2026-11-26T04:48:05","fetched_at":"2026-11-26 16:15:57","word_count":239,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"11h","domain":"quantumcomputingreport.com"},{"id":"eca4005057b2a37f","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49184","title":"Classiq Updates Qmod Compiler to Synthesize 2048-Bit Shor’s Algorithm in Under 10 Seconds","url":"https://quantumcomputingreport.com/classiq-updates-qmod-compiler-to-synthesize-2048-bit-shors-algorithm-in-under-10-seconds/","summary":"Classiq has upgraded its Qmod quantum programming language and compiler, allowing the Shor's algorithm for a 2048-bit RSA-scale integer to compile in under ten seconds. The improvement addresses a bottleneck in quantum software by preserving classical control structures during synthesis and enabling symbolic indexing of quantum qubit arrays. The post Classiq Updates Qmod Compiler to Synthesize 2048-Bit Shor’s Algorithm in Under 10 Seconds appeared first on Quantum Computing Report.","content":"<p>Classiq has introduced architectural upgrades to its Qmod quantum programming language and synthesis compiler that enable the period-finding subroutine of Shor’s algorithm for a 2048-bit RSA-scale integer to compile in under ten seconds. Detailed in a technical post by Classiq’s Matan Vax, the release addresses a long-standing bottleneck in fault-tolerant quantum software tooling, where flat circuit representations unroll classical loops and duplicate subroutines, causing synthesis runtimes and program sizes to blow up as qubit counts grow.<br>\nRather than flattening circuits, the updated Qmod compiler preserves classical control structures—including repeat, foreach, and conditional blocks—throughout synthesis and permits classical iteration variables to symbolically index quantum qubit arrays. This symbolic indexing allows built-in arithmetic modules, Quantum Fourier Transforms, and Quantum Phase Estimation routines to synthesize in nearly constant time with respect to operand width, while keeping the coprime base a as a runtime execution parameter so a single compiled program can be reused across multiple Shor iterations.<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\n- Players →Companies and institutions across the quantum industry, by segment.<br>\n- Scorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"f4cfcf7ede57a628d5cb1d303a056e85","author":"Mohamed Abdel-Kareem","published_at":"2026-11-26T04:13:57","fetched_at":"2026-11-26 16:15:58","word_count":231,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"12h","domain":"quantumcomputingreport.com"},{"id":"402a033116c41534","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49180","title":"University of Sussex and Universal Quantum Demonstrate Laser-Free Axial-Mode Entangling Gate on Doppler-Cooled Trapped Ions","url":"https://quantumcomputingreport.com/university-of-sussex-and-universal-quantum-demonstrate-laser-free-axial-mode-entangling-gate-on-doppler-cooled-trapped-ions/","summary":"Researchers from the University of Sussex and Universal Quantum have demonstrated a high-fidelity, all-electronic two-qubit entangling gate using Doppler-cooled ytterbium ions. This laser-free gate operates on the axial stretch mode, achieving Bell-state fidelities above fault-tolerant thresholds without ground-state cooling. The innovation offers improved compatibility for quantum computing architectures by simplifying cooling processes and enhancing gate robustness. The post University of Suss","content":"<p>Researchers from the University of Sussex (Sussex Centre for Quantum Technologies) and Universal Quantum have experimentally demonstrated a high-fidelity, all-electronic two-qubit entangling gate operating on the axial stretch mode of Doppler-cooled ytterbium-171 (171Yb+) ions without ground-state cooling. Detailed in a preprint on arXiv, the σz ⊗ σz geometric phase gate uses submerged current-carrying wires and global microwave pulses to achieve Bell-state fidelities well above fault-tolerant thresholds at a mean thermal occupation of n̄ = 50(5) phonons—approximately 2.5 times the Doppler cooling limit.<br>\n| All-Electronic Axial-Mode Gate Specifications & Sequence Comparison |  |  | <br>\n|---|---|---|<br>\n| Gate Protocol / Parameter | Control Sequence & Timing | Measured Fidelity & Robustness | <br>\n| Blackman-Ramped Sequence | Two 150 μs gradient pulses (300 μs total gate time, 10 μs ramps, ~35 T/m axial gradient at 506.88 kHz) separated by a microwave Hahn-echo π-pulse. | 100.0+0.0−0.4% Bell-state fidelity (parity contrast 1.003(7)); maintains >99% fidelity across ±0.18 kHz detuning error. | <br>\n| AESE Modulated Sequence | Two 285 μs super-Gaussian amplitude and detuning-ramped pulses (570 μs total gate time) for adiabatic elimination of spin-motion entanglement. | 100.0+0.0−0.3% Bell-state fidelity (parity contrast 1.004(7)); widens >99% fidelity window ~4× to −0.68 to +0.80 kHz and cuts 1 kHz mode-noise sensitivity by 230×. | <br>\n| Trap & Scaling Projection | 171Yb+ pair trapped 125 μm above a 54 K microfabricated surface Paul trap with buried wires (11 μm deep) under a 1 μm gold ground plane. | Replacing the copper mount with a ceramic or silicon spacer to suppress eddy currents projects ~90 μs gates at >99.99% fidelity (75 μm ion height, 190 T/m). | <br>\nTo prevent stray oscillating electric fields from heating or ejecting the ions, the team fabricated the current-carrying wires 11 micrometers beneath the surface of the microchip beneath an embedded gold grounding layer. By driving the axial stretch mode (499.63 kHz) rather than a radial mode, the architecture preserves compatibility with mixed-species sympathetic cooling across ions of differing masses, eliminates time-consuming sideband cooling sequences, and relaxes shuttling waveform tolerances in modular quantum charge-coupled device (QCCD) processors.<br>\nModeling of the chip mount further indicated that eddy currents in the underlying copper heat sink currently induce AC Zeeman shifts that cap the applied magnetic gradient; substituting a non-conductive ceramic mount or silicon spacer is projected to reduce those unwanted fields by two orders of magnitude and enable sub-100-microsecond gates exceeding 99.99% fidelity.<br>\nRead the full research paper on arXiv here.<\/p>","content_hash":"872f79c01b95514d97eaba494fd70786","author":"Mohamed Abdel-Kareem","published_at":"2026-11-26T03:58:16","fetched_at":"2026-11-26 16:15:58","word_count":409,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"12h","domain":"quantumcomputingreport.com"},{"id":"9860a470021eed50","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49176","title":"Quantum eMotion Completes C$32 Million ($22.5 Million USD) Acquisition of Cybersecurity Provider Plurilock Security","url":"https://quantumcomputingreport.com/quantum-emotion-completes-c32-million-22-5-million-usd-acquisition-of-cybersecurity-provider-plurilock-security/","summary":"Quantum eMotion Corp. has completed its C$31.98 million acquisition of Plurilock Security Inc., a Canadian cybersecurity company. This strategic move combines Quantum eMotion's quantum cryptography with Plurilock's cybersecurity operations, enhancing their offerings in critical services, identity management, and cloud security across North America and NATO. Plurilock's shares are set to delist from the TSX Venture Exchange around November 26. The post Quantum eMotion Completes C$32 Million ($22.","content":"<p>Quantum eMotion Corp. (NYSE American: QNC; TSXV: QNC; FSE: 34Q0) has closed its acquisition of Canadian cybersecurity company Plurilock Security Inc. (TSXV: PLUR; OTCQB: PLCKF) in a cash-and-stock transaction valued at approximately C$31.98 million ($22.5 million USD). Under the court-approved plan of arrangement, Quantum eMotion acquired 100% of Plurilock’s 114,231,441 common shares for C$0.084 in cash and 0.0763 of a Quantum eMotion share per Plurilock share, representing an implied price of C$0.28 per share.<br>\nThe transaction pairs Quantum eMotion’s quantum-generated entropy and post-quantum cryptography portfolio with Plurilock’s established enterprise and public-sector cybersecurity operations, which span Critical Services, identity and access management, cloud security, and procurement channels across Canada, the United States, and NATO. Following shareholder approval on November 18 and final clearance from the Supreme Court of British Columbia on November 20, Plurilock’s shares are scheduled to delist from the TSX Venture Exchange on or about November 26.<br>\nRead Quantum eMotion’s official press release here, view the Newsfile announcement here, and read Plurilock CEO Ian Paterson’s post on LinkedIn here. Related QCR coverage includes our earlier reports on the initial acquisition agreement here, the information circular filing here, and Plurilock shareholder approval here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\n- Players →Companies and institutions across the quantum industry, by segment.<br>\n- Scorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"ef6e3ff4d336ca6c2ff4d055d9826f73","author":"Mohamed Abdel-Kareem","published_at":"2026-11-26T03:53:09","fetched_at":"2026-11-26 16:15:58","word_count":278,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"12h","domain":"quantumcomputingreport.com"},{"id":"c030ab350da0bbe3","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49169","title":"European Commission Proposes EU Quantum Act and Sovereign Tech Equity Fund to Scale Industrial Capacity by 2030","url":"https://quantumcomputingreport.com/european-commission-proposes-eu-quantum-act-and-sovereign-tech-equity-fund-to-scale-industrial-capacity-by-2030/","summary":"The European Commission has proposed the EU Quantum Act, a legislative framework for quantum technologies, and a €50 billion Sovereign Tech Equity Fund to boost industrial capacity by 2030. This initiative aims to align national and EU programs, address the private growth-capital gap, and establish global industrial leadership in quantum technology. The proposal includes significant funding, research and innovation targets, infrastructure development, and supply chain security measures. The post","content":"<p>The European Commission has formally proposed the EU Quantum Act (COM(2026) 965), the European Union’s first legislative framework dedicated to quantum technologies, alongside plans to establish a Sovereign Tech Equity Fund (STEF) targeted at up to €50 billion ($54.85 billion USD) across quantum, artificial intelligence, semiconductors, and cloud infrastructure. Presented by Executive Vice-President Henna Virkkunen, the regulation creates the Quantum Europe Framework Initiative to align national and Union programs, close Europe’s private growth-capital gap, and establish global industrial leadership by 2030.<br>\n| EU Quantum Act (COM(2026) 965) Legislative & Technical Architecture |  |  | <br>\n|---|---|---|<br>\n| Pillar / Instrument | Core Mechanism & Governance | Key Milestones, Budgets & Requirements | <br>\n| Financing & Sovereign Tech Equity Fund | Public-private equity vehicle with the EIB Group and Member States under the 2028–2034 MFF and European Competitiveness Fund. | Targets up to €50 billion across critical sovereign tech; Impact Assessment identifies €12.9B–€18.1B in European quantum financing needs (2028–2034). | <br>\n| Quantum Grand Challenges & R&I | Quantum Excellence Network and stage-gated Grand Challenges implemented via the EuroHPC Joint Undertaking (chips via Chips JU). | Targets ~100 error-corrected logical qubits per system by 2030 (scaling to thousands by 2035), GNSS-denied PNT by 2030, and 50 km metropolitan quantum networks. | <br>\n| Infrastructures & Industrial Scale-Up | European Quantum Service Platform, Strategic Projects, Quantum Innovation Hubs, and national Competence & Acceleration Centres. | Federates EuroHPC quantum systems, EuroQCI terrestrial-space QKD networks (by 2031), and Q-MRI clinical pilots; grants Strategic Projects the Competitiveness Seal. | <br>\n| Procurement, PQC & Supply Chains | Union-controlled procurement rules, NIS2 post-quantum cryptography mandates, and critical-component monitoring. | Requires PQC and crypto-agility in NIS2 public procurements six months after entry into force; authorizes a digital twin of the EU quantum supply chain. | <br>\nWhile the European Union hosts roughly one-third of the world’s quantum companies and committed an estimated €8.6 billion in public quantum funding through 2025, Commission figures show European startups attracted only €1.1 billion ($1.2 billion USD) (roughly 5% of global private investment) in 2025 compared with €7 billion ($7.67 billion USD) in the United States. To convert scientific output into domestic production, the proposal authorizes direct equity investments through the Sovereign Tech Equity Fund, designates cross-border Strategic Projects, and establishes a federated European Quantum Service Platform alongside specialized innovation hubs and national competence centers.<br>\nOn security and industrial resilience, the regulation restricts public quantum procurement to Union-controlled suppliers (including system integrators) and reciprocal partners, empowers the Commission to mandate EU-sourced critical components, and requires NIS2-covered public administrations to procure post-quantum cryptographic and crypto-agile solutions starting six months after the law takes effect. The proposal also enables a supply-chain digital twin to track component chokepoints and grants the Commission delegated authority to impose binding post-quantum migration milestones if national transitions lag.<br>\nThe proposal now moves to the European Parliament and the Council under the ordinary legislative procedure—with discussions continuing next week at the European Quantum Technologies Conference (EQTC) in Dublin during Ireland’s EU Council Presidency—while funding allocations will be settled during the 2028–2034 Multiannual Financial Framework negotiations. Welcoming the framework’s logical-qubit milestones and procurement rules, IQM Quantum Computers, Dublin-based silicon spin-qubit developer Equal1, and the European Quantum Industry Consortium (QuIC)—which represents over 240 member organizations and opens a two-week member consultation on November 27—urged lawmakers to ensure CMOS-manufactured quantum chips are fully supported alongside Chips Act 2.0, establish a dedicated quantum window in the Sovereign Tech Equity Fund, grant State aid eligibility for quantum chip foundries, and secure €7.7 billion to €12.3 billion in five-year public purchase commitments rewarding European design, manufacturing, and proven deployments.<br>\nRead the European Commission’s press release here, explore the Quantum Act policy overview here and Q&A here, and download the full legislative text COM(2026) 965 here and Annexes here. View commentary from the High-Level Advisory Board on Quantum Technologies here, IQM CEO Jan Goetz here, QuIC Executive Director Cécile Perrault here, and Equal1 here.<\/p>","content_hash":"51e9dacfdf489e729887d7276043d0ea","author":"Mohamed Abdel-Kareem","published_at":"2026-11-26T02:57:24","fetched_at":"2026-11-26 16:15:58","word_count":658,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"bc1e91ee40cd14df","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49165","title":"IQM Quantum Computers Sells 54-Qubit Radiance R3 System to South Korean Quantum-AI Infrastructure Firm QAI","url":"https://quantumcomputingreport.com/iqm-quantum-computers-sells-54-qubit-radiance-r3-system-to-south-korean-quantum-ai-infrastructure-firm-qai/","summary":"IQM Quantum Computers sold a 54-qubit Radiance R3 system to QAI Co., Ltd. in South Korea for EUR 8-10 million. The quantum computer will be installed in QAI's AI data center in Seoul by the end of 2027, making it IQM's first deployment in a private commercial data center in Asia. QAI will offer Quantum-as-a-Service to various organizations, supporting South Korea's national quantum strategy. The post IQM Quantum Computers Sells 54-Qubit Radiance R3 System to South Korean Quantum-AI Infrastructur","content":"<p>IQM Quantum Computers (Nasdaq: IQMX) has received an order valued between EUR 8 million and EUR 10 million from South Korean data center and cloud infrastructure company QAI Co., Ltd. for an on-premises 54-qubit IQM Radiance R3 superconducting quantum computer. Scheduled for delivery and installation at QAI’s private AI data center in Seoul by the end of 2027, the agreement marks IQM’s first deployment into a private commercial data center in Asia and its second system sale in South Korea following an earlier IQM Spark installation at Chungbuk National University.<br>\nDesigned for low-latency integration alongside classical high-performance computing clusters, the 54-qubit Radiance R3 features tunable couplers arranged in a square-lattice topology that natively supports surface-code error correction, pulse-level access, and modular component upgrades. QAI plans to couple the processor with its GPU-based AI infrastructure and offer domestic access to enterprises, universities, and public organizations through its Quantum-as-a-Service (QaaS) cloud platform across drug discovery, battery materials, financial optimization, and logistics scheduling.<br>\nThe deployment aligns with South Korea’s national quantum strategy under the Ministry of Science and ICT, which targets broad domestic quantum computing utilization by 2035 alongside expanded industry and workforce development.<br>\nRead IQM’s press release here, view the official inside-information release on GlobeNewswire here, and access IQM’s SEC Form 6-K filings on EDGAR here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\n- Players →Companies and institutions across the quantum industry, by segment.<br>\n- Scorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"1ce0a79f0d6b8f1efb1e0e8398e40d0f","author":"Mohamed Abdel-Kareem","published_at":"2026-11-26T02:18:06","fetched_at":"2026-11-26 16:15:58","word_count":299,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"bab10e9a8dd32e2f","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49161","title":"Zapata Quantum and University of Maryland Launch ForShor.ai Formal Verification Challenge for AI-Assisted Quantum Algorithm Design","url":"https://quantumcomputingreport.com/zapata-quantum-and-university-of-maryland-launch-forshor-ai-formal-verification-challenge-for-ai-assisted-quantum-algorithm-design/","summary":"Zapata Quantum and the University of Maryland have launched ForShor.ai, a formal verification challenge combining formal theorem proving with AI to optimize quantum factoring subroutines. The initiative invites researchers to submit recursive arithmetic schedules, which are then verified for mathematical correctness and asymptotic gate complexity. This aims to ensure that AI-discovered optimizations are inspectable and reusable in fault-tolerant quantum software. The post Zapata Quantum and Univ","content":"<p>Zapata Quantum (OTCQB: ZPTA) and the University of Maryland (Joint Center for Quantum Information and Computer Science) have launched ForShor.ai, an open research challenge combining formal theorem proving with artificial intelligence to optimize quantum factoring subroutines. Developed with early grant support from the Unitary Foundation and scientific advisor Peter Shor, the initiative invites human researchers and AI agents to submit recursive arithmetic schedules to a public leaderboard, where an automated Lean 4 harness verifies mathematical correctness and asymptotic gate complexity before exporting circuits to Qualtran for logical resource estimation.<br>\n| ForShor Formal Verification Harness & Resource Estimation Specifications |  |  | <br>\n|---|---|---|<br>\n| Component / Benchmark | Technical Architecture & Scope | Verified Bounds & Resource Metrics | <br>\n| Lean 4 Verification Harness | ~180 Lean 4 files (~3,500 declarations, Apache 2.0) formalizing recursive Toom–Cook PhaseProduct and Cooley–Tukey QFT. | Proves end-to-end order-finding correctness and O(n2+ε) elementary gate scaling for any policy passing four decidable checks. | <br>\n| Policy Search Bottleneck | Exact exhaustive search over interpolation tables vs. heuristic/agentic policy optimization for n = 2048 bits. | Exact search at arity k = 8 requires ≥7.5 × 103 GiB memory and ~3.2 × 1051 core-hours, motivating AI-guided search. | <br>\n| Qualtran Logical Resource Estimates | Verified intermediate representation lowered to Qualtran Bloqs with Ross–Selinger T-gate synthesis (δ = 0.01). | 1.685 × 1012 T-gates at n = 2048 using varying arity k = (6, 5, 3), crossing Gidney–Ekerå discrete-log factoring at ~3.8 × 106 bits. | <br>\n| Open Challenge Scope | Six-week initial community challenge covering PhaseProduct (Shor) and PhaseTripleProduct (Regev). | Serves as a proving ground for formal verification capabilities in Zapata’s Quantum Pilot software platform. | <br>\nRather than treating AI-generated quantum circuits as opaque black boxes, ForShor exposes a constrained policy-search interface governing how recursive Toom-Cook multiplication splits bit registers and schedules reversible additions, shifts, and negations. Any submitted policy that passes four kernel-checked conditions automatically inherits machine-checked proofs of Shor order-finding success probability and subcubic gate scaling, avoiding the need to re-prove surrounding modular exponentiation or continued-fraction logic.<br>\nBy pairing machine-checked correctness with interactive proof maps, open documentation, and a community Discord, the partners aim to ensure that AI-discovered optimizations remain inspectable and reusable across broader fault-tolerant software stacks, including Zapata’s Quantum Pilot platform.<br>\nRead Zapata Quantum’s press release here, view CTO Yudong Cao’s technical blog post here, read the accompanying preprint on arXiv here, explore the interactive Lean proof map and challenge platform here, and see our earlier coverage of the University of Maryland and Zapata Quantum formal verification partnership here.<\/p>","content_hash":"a269f4ed8f079c9ea97e22ec1b5f3878","author":"Mohamed Abdel-Kareem","published_at":"2026-11-26T02:05:25","fetched_at":"2026-11-26 16:15:58","word_count":432,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"e6c49b0fe91c79c0","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10379","title":"HOLY SHIT HOLY SHIT HOLY SHIT HOLY SHIT","url":"https://scottaaronson.blog/?p=10379","summary":"I feel like my previous posts (and post titles), and podcasts, and talks, have failed to do full justice to the magnitude of what&#8217;s now happening, so I&#8217;m trying again. Last night, we h
