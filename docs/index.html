here to OpenAI’s release of a whopping 722 manuscripts (announced as 372 major results, and further organized into a number of subfields or research areas) [1] which c","content":"<p>It’s been a long summer here at Caltech, in part due to a super El Niño event which hit late but hard, with temperatures creeping up to the 100s in the first week of October. But in the history books (at least those on the history of science), the end of this summer might forever be marked by the events of last week. I’m referring here to OpenAI’s release of a whopping 722 manuscripts (announced as 372 major results, and further organized into a number of subfields or research areas) [1] which comes less than a month after the announcement of a Navier-Stokes breakthrough from the same group [2].<br>\nIf you’re an undergrad and/or haven’t been closely following discussions within the theory community earlier in the summer, you could be forgiven for feeling like the LLM resolution of a Millennium Prize Problem, a feat which for any individual would be considered a crowning achievement of mathematics, came a bit out of left field. After all, if you go through trending news headlines over time discussing the concerning possibility of AI tools overshadowing and making obsolete human mathematical achievements, the graph looks something like this:<br>\nHave we dropped the ball with prospective students?<br>\nAside from the popular news headlines, a lot has already been written by and for mathematicians and theorists at the PhD level and above. But the speed at which all of this has happened makes me worried about how effectively we’ve communicated with younger students, since the end of summer also marks the start of another PhD application season. While it’s normal for pre-PhD students to be missing some context on what the day-to-day of a full-time researcher looks like, this year that also means that they seem to have largely (perhaps inadvertently) been left out of the AI discourse. This isn’t just a hypothetical: based on my recent interactions with undergrads, most of them haven’t caught onto the recent jumps in capabilities, or the consequences for the research community.<br>\nThe Navier-Stokes announcement dropped on a seemingly random Tuesday in early September, and immediately hit the forefront of conversation in my circles. Later that same week, I braced myself to face the group of around forty wide-eyed undergrads who would travel to Caltech to attend the FUTURE of Physics workshop, where they would learn all about PhD programs and careers in physics. FUTURE selects for students who are bright, often come from underserved communities or nontraditional backgrounds, and are active members of their communities. As the co-chair of the workshop and one of the student science talk presenters, I tried to preempt the questions I might get on current events, like funding or the state of theory research. But while many students were indeed interested in how to approach professors about whether they had funding for next cycle, I was taken aback to learn that few of them were thinking about AI at all. None of them expressed any concerns about the pace of AI development, nor did they even seem aware that nearly all researchers here would soon be using a (supposedly overhauled and better aligned) version of a model that had hacked several real-world entities [3].<br>\n(If you’re a more senior academic or researcher who’s surprised to hear about this disconnect, you wouldn’t be alone! And you don’t have to take my word for it either: instructors and recent graduates at other universities in the U.S. discussed similar experiences over the past summer.)<br>\nResearch in the time of AI theorem provers<br>\nFor context, all of my PhD work has been theoretical and leans heavily on theorem-proving to push the frontiers of what we understand about physics. However, I also applied specifically to do interdisciplinary research. I’ve always liked taking detours into a wide range of subjects, whether it’s random matrix theory, cryptography, or marine science, and finding the connections between them. My first solo-first-author paper, though unfortunately containing nothing directly relevant to marine biology, was shaped by a number of conversations with colleagues across the quantum, condensed matter, and high energy arXiv categories. To me, the most exciting part of learning about new mathematical frameworks has always been the ways in which they help us bridge and translate between different languages and ways of describing real-world phenomena.<br>\nWith this in mind, I want to chronicle in broad strokes my own perspective on this past summer. I’m focusing on just this short window of time because my perception is that within the quantum information community, the tone of the discussion has shifted very quickly in the last few months, and for good reason. Prior to this spring, I used LLMs for literature searches and was aware of groups who were working on theorem-proving harnesses, but I didn’t find the output of the readily available consumer models to be very reliable. Around April, rumors started to float around about an internal Anthropic model and the possibility that it might push capabilities into the regime of practical cybersecurity risk; the public version of the model released on June 9 for just three days before Anthropic was forced to take it offline due to an export control directive. Over the next month, the rumors grew louder until finally Fable was rereleased on July 1, followed by GPT 5.6 just over a week later, and with it the scrutiny of the entire mathematical and theoretical research community over the first wave of one-shot papers.<br>\nAnd that could have been it, but last month saw yet another round of new releases. For the sake of telling a complete story, I have to report that as surprising as Fable 5 and GPT 5.6-Sol had been, Opus 5.5 is the first release that’s completely blown my mind, for reasons that seem to have missed the broader discourse but are important for my own learning process. Among my colleagues, the consensus has been that since July, GPT has been superior to Fable for theorem-proving tasks. But many of the challenges I’ve agonized most over have been in deciding how to come up with a well-defined question that formalizes some physical intuition in a reasonable way (e.g. what does it mean for random unitaries to be a good model for chaotic Hamiltonian dynamics?), rather than just the difficulty of finding a proof for one once it’s posed. This process of iterating over feasible and well-defined research questions admittedly seems a bit tricky to formulate as a set of verifiable tasks, despite being a large component of writing a physics paper, as acknowledged in this recent preprint for a new benchmark based on theoretical physics calculations [4]. From my own limited experience, though, Opus 5.5 has been significantly better than any other model I’ve tried at taking problems I’ve been stuck on, for which my initial conjecture and attempt at explaining some numerical phenomenon might be completely wrong, and combing through the many-body physics literature to suggest other relevant frameworks and theories.<br>\nShould you apply to do a (theory) PhD in 2026?<br>\nThe pace of advances in AI capabilities over the past summer came as a surprise to many people in the theory community, to the point that by the time the preprint linked above was posted, their theoretical physics benchmark had already been saturated by models released within the last one-and-a-half months. Given this, it’s reasonable to wonder what kinds of changes will have to be made to PhD training. Although I’m not aware of any of the authors commenting publicly on this aspect, I imagine that the work associated with writing a peer-reviewed paper on any one of the calculations in their benchmark would be worthy of advancing to candidacy.<br>\nTo be clear, this is a big deal: in undergrad, you may have spent most of your time on coursework that other people could authoritatively grade for correctness. But by the time you present your dissertation topic in your candidacy exam, you might be the only expert in the world on your own research area. The authors of the very same benchmark also acknowledge that they initially had difficulty grading the output of the model, since nine of the solutions originally provided for the fifty problems turned out to be wrong! In addition, while I have no idea how far the current language model paradigm can be pushed, as of writing I think it’s safe to say that there’s still some room for improvement, given their continual progress on seemingly every benchmark that’s been thrown at them.<br>\nSo what is the value of PhD training, if the machines are now capable of reproducing the kinds of technical output that we’re supposedly evaluated on as grad students?<br>\nI don’t think I’m qualified to speak on behalf of all theorists, but in my view, the difference between pursuing a PhD in theoretical physics and accepting a corporate offer isn’t just that it’s hard to get paid to learn about fun math problems with no immediate applications in industry. A large part of PhD training (and probably post-PhD training as well!) is learning what to do with this kind of freedom.<br>\nI do want to acknowledge that it’s understandably hard to be in a position in which your job is rapidly changing, and where you might not have reliable access to mentorship, directed practice, and tight feedback loops to learn the relevant skills [5]. And all of this applies even when the field isn’t in crisis. But systems and institutions aren’t static, nor have they ever been. And it’s always been the case that the PhD experience is highly dependent on the quality of mentorship as well as the resourcefulness of the lab when it comes to finding opportunities in the explored and uncharted, or tackling high-risk, long-time-horizon problems with limited public funding. In many ways, then, the most important questions to ask when deciding whether to accept an offer remain the same [6].<br>\nPlus, despite how good language models have been for a while now at generating heaps upon heaps of words, rows upon rows of spreadsheets, the PIs and their grant managers who work tirelessly to fundraise, to project manage, and to set high level goals guiding all of this research have managed to hold on to their jobs, and are still being asked to direct the next generation of research proposals. And many of us at Caltech remain excited about budding developments in quantum science, as the next generation of experimental platforms promises to bring us past what theorists can hope to fully predict or simulate.<br>\nThis post marks the conclusion of my initial voyage into theory research over the past three summers, and the first half of my PhD. Many people have asked me whether I regret my choice to pursue a PhD in theoretical physics in the first place, especially given that so many of my close friends and peers from undergrad decided to work in AI safety or adjacent areas following the original release of ChatGPT. There are two main reasons why, after surfacing to face the real world, I still feel that I made the right decision: first, if anything, AI safety might be one of the most compelling reasons for ensuring that humans remain capable of reviewing evidence and making informed decisions. As long as we value citizen participation in science and decision-making, education and STEM education will continue to have a role in society. Second, as a fresh college graduate, I simply didn’t feel ready to direct an original research program, or to shape an entire field of study. No matter how AI capabilities advance, I’d like to think that the PhD can continue to be a safe space for young people to develop “soft” skills like managing projects with a wide range of collaborators and uncertain timelines, and to grow into the scientific leaders of their generation. Plus, you never know when your random matrix tricks might come in handy for some underwater imaging problem.<br>\nAcknowledgements<br>\nI’m grateful to the many peers and colleagues, from both the theory and experimental sides of IQIM, who gave their candid opinions and feedback on this topic. In particular, I’d like to thank Dave Hsieh and Jessica Jiang for co-chairing the FUTURE program and for a number of very insightful discussions, Spiros Michalakis for helpful suggestions on a draft of this post, and everyone in the Caltech theory community who’s engaged with the topic during John’s group meetings. I’d also like to thank Jiahai Feng, Vincent Huang, and Alex Gu, some of the friends in question who have worked in AI safety-adjacent areas, for keeping me honest. Opus 5.5 was used for light copyediting of a draft of this article.<br>\n[1] See Github repository: https://github.com/openai/math<br>\n[2] Press release page: https://openai.com/index/navier-stokes-solution/<br>\n[3] See, for example, https://transluce.org/agent-activity<br>\n[4] The authors of the manuscript also voice additional thoughts on why AI agents have yet to result in similar breakthroughs on major outstanding problems in physics. The full set of benchmark problems and writeup is available at https://arxiv.org/abs/2610.16733.<br>\n[5] The trifecta of learning taken from the excellent https://web.stanford.edu/~aramdas/checklists.html<br>\n[6] Although this list was written for students in statistics and machine learning (and includes terms like “HCI”, i.e. human-computer interaction), I think it’s pretty broadly applicable for quantum information too, even if you’re not interested in quantum learning theory. And you might notice that very few points on this list are about learning purely technical skills!<\/p>","content_hash":"de137e5fb0484b8527e7191777a00378","author":"lauralcui","published_at":"2026-10-18T03:41:17","fetched_at":"2026-11-13 13:50:20","word_count":2229,"read_time_minutes":12,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"3w","domain":"quantumfrontiers.com"},{"id":"a69bbd6432e3c76d","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10201","title":"Podcasts about the Topic","url":"https://scottaaronson.blog/?p=10201","summary":"&#8220;The Topic&#8221; being, of course, the Mathocalypse, except sometimes with AI alignment and even quantum computing and complexity theory and other stuff thrown in. With Ryan Peterman: Notably, near the end of the above podcast, you can watch my live reaction to the news that an Anthropic model found algorithms for the 3SUM and the All-Pairs-Shortest-Path problems beating records that stood for generations&#8212;news that hadn&#8217;t yet reached me when I woke up and logged in. (If you do","content":"<p>Podcasts about the Topic<br>\n“The Topic” being, of course, the Mathocalypse, except sometimes with AI alignment and even quantum computing and complexity theory and other stuff thrown in.<br>\nNotably, near the end of the above podcast, you can watch my live reaction to the news that an Anthropic model found algorithms for the 3SUM and the All-Pairs-Shortest-Path problems beating records that stood for generations—news that hadn’t yet reached me when I woke up and logged in. (If you don’t feel like watching, my reaction is basically: “uh, wow … if I hadn’t been so overstuffed with delicacies right now from history’s biggest math breakthrough buffet, I’d surely be giving this one the individual amazement that it deserves…”)<br>\nAnd here’s with “Modern CTO”, on a similar set of topics:<br>\nOh, and a third one: MTS podcast with Theo Jaffee.<br>\nEnjoy, and thanks to the hosts of these podcasts!<br>\nUpdate (Oct. 19): There’s been a rapid-fire recent sequence of AI-assisted improvements to my 2016 result with Adam Yedidia, showing that the 8000th Busy Beaver number eludes the axioms of set theory. I haven’t even kept track of all of them, but the very latest, by friend-of-the-blog Elliot Glazer, shows that the value of BB(230) is independent of ZFC (see here for explanation).<\/p>","content_hash":"d51500ad2a891fb9e93bf15d7bbc87bd","author":"Scott","published_at":"2026-10-13T20:26:33","fetched_at":"2026-11-13 13:50:18","word_count":210,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"4w","domain":"scottaaronson.blog"},{"id":"0502808c63cba635","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18293","title":"The Quantum Omelette Problem: How Much Energy Belongs to the Yolk?","url":"https://quantumfrontiers.com/2026/10/11/the-quantum-omelette-problem-how-much-energy-belongs-to-the-yolk/","summary":"The National Egg Coordination Committee created one of India’s longest-running ad campaigns. Its jingle was impossibly catchy. Nearly everyone from my parents’ generation onward seems to remember it: “Sunday or Monday, eat eggs every day.” My mum took this advice rather seriously. On weekdays, we ate boiled eggs for breakfast. Sundays, however, were omelette days. Our ritual was always the same. Each of us siblings announced how many eggs we wanted as we streamed into the kitchen. My mum cracked","content":"<p>The National Egg Coordination Committee created one of India’s longest-running ad campaigns. Its jingle was impossibly catchy. Nearly everyone from my parents’ generation onward seems to remember it:<br>\n“Sunday or Monday, eat eggs every day.”<br>\nMy mum took this advice rather seriously. On weekdays, we ate boiled eggs for breakfast. Sundays, however, were omelette days.<br>\nOur ritual was always the same. Each of us siblings announced how many eggs we wanted as we streamed into the kitchen. My mum cracked the eggs into a shiny steel bowl, added our chosen mix-ins, and whisked them together. The yolks, whites, salt, and chili powder quickly disappeared into one speckled mixture. She poured it into a hot, oiled pan, where it hissed and sizzled before sliding onto our plates.<br>\nThe omelettes were soft, spicy, and gone within minutes.<br>\nMy diet is now plant-based, but the nostalgia of those Sunday-morning breakfasts remains strong—the steel bowl, the sizzling pan, and all of us gathered around the table, waiting eagerly for the omelettes to arrive.<br>\nOur weekday boiled eggs and Sunday omelettes offer a useful contrast. In a boiled egg, the yolk and white remain distinguishable. In an omelette, they are mixed and transformed. Some properties—texture, flavor, and structure—belong to the finished mixture rather than to either component separately.<br>\nWhen two parts interact strongly, which properties still belong to the parts, and which belong only to the whole?<br>\nThis question appears across science whenever interacting parts become difficult to describe independently. In quantum thermodynamics, it becomes a question of energy. Picture a small quantum system, an atom, say, surrounded by a much larger environment. The total energy of the setup comes from three sources: the atom, the environment, and their interaction.<br>\nWhen the atom barely interacts with its surroundings, separating the energy contributions is easy. The interaction energy is small enough to ignore, and we can speak cleanly of the atom’s energy and the environment’s. When the interaction is strong, however, that shared energy can no longer be brushed aside, making it difficult to decide how much belongs to the atom and how much to its surroundings.<br>\nFor a large object, interactions with the environment typically occur at the surface, while most of its energy is associated with the much larger bulk. As an object grows, the surface becomes less important compared to its volume, so the interaction energy can often be ignored. But this reasoning breaks down for very small objects, where surface effects remain significant, or for systems whose interactions extend through the bulk, allowing interaction energy to scale with volume.<br>\nSuch strong interactions are not limited to tiny systems; they also appear across condensed matter, nuclear, and high-energy physics. Lattice gauge theories provide one important example: their particles and fields are tied together by interactions and local constraints, making it especially difficult to draw a clean boundary around one part and declare, “This energy belongs here.”<br>\nIn all these cases, the energy of the whole may be perfectly clear. The challenge, however, is deciding how to divide that energy among pieces that are no longer truly separate.<br>\nThat brings us to a deceptively simple question: How should we define the internal energy of a strongly interacting system?<br>\nDefinitions in physics do more than attach names to things. They tell us what counts as a system, which quantities can be measured, and how mathematical ideas connect to experiments. A useful definition must do more than sound reasonable: it should recover familiar results in familiar situations and remain consistent with the laws of physics. When two plausible definitions lead to different conclusions, the choice between them cannot be settled by language alone.<br>\nConsider the internal energy of a system. When a system is strongly coupled to its surroundings, some of the total energy is stored in the interaction, and several reasonable ways of assigning that shared energy become possible. But which definition of internal energy is consistent with thermodynamics? This is the question I explored with my collaborators Zohreh Davoudi, Christopher Jarzynski, Niklas Mueller, Connor Powers, and Nicole Yunger Halpern.<br>\nPhysicists describe a system’s energy using a mathematical object called a Hamiltonian. In our recent paper, we consider three ways of defining the internal energy of a strongly coupled system.<br>\nDefinition 1: Subtract the environment<br>\nStart with the total energy of the system-environment composite, then subtract the energy the environment would have on its own at the same temperature. Whatever remains, including the interaction energy, is assigned to the system.<br>\nDefinition 2: Include the environment’s influence <br>\nRather than separating the interaction energy by hand, describe the system’s energy using a modified Hamiltonian that captures how the interaction energy affects the system’s energy at equilibrium. Physicists call this the Hamiltonian of mean force.<br>\nDefinition 3: Account for temperature as well<br>\nThe Hamiltonian of mean force depends on temperature. The third definition takes this dependence into account when calculating the system’s internal energy.<br>\nAll three definitions have appeared in the literature on strong-coupling thermodynamics, each offering a seemingly reasonable way to account for the environment’s influence on the system. We wanted to find out whether choosing one definition over another would change how we describe the same physical process.<br>\nTo test the three definitions, my collaborators and I considered a sudden quench—the physicist’s term for changing something in the setup almost instantaneously. Imagine rapidly turning a knob that controls the system, perhaps by suddenly switching on a magnetic field. We can also suddenly change how strongly the system interacts with its surroundings, effectively turning the interaction between them on or off. Either change happens so quickly that the system and its environment have no time to respond: their states remain constant during that instant. Yet the system’s internal energy can change because the rules governing it have changed. Since this energy change results from deliberate external control, we call it work.<br>\nAfter the quench, the knob is left alone. The system then evolves under the new, fixed conditions and exchanges energy with its environment. This later change in the system’s internal energy is called heat.<br>\nSeparating the process into two stages makes it easier to tell work and heat apart: work enters during the sudden, controlled change, while heat flows during the evolution that follows. It is a little like whisking an egg first and then placing it on a hot pan, rather than trying to whisk and cook it at the same time.<br>\nOnce we have chosen a definition of a system’s internal energy, we can ask how that energy changes during any thermodynamic process. The first law of thermodynamics tells us that the change in internal energy must be accounted for by work and heat ,<br>\nThe first law is essentially a statement of energy conservation. It tells us that any change in the system’s internal energy must be accounted for: the energy must have entered as work, as heat, or as some combination of the two.<br>\nBut here is the catch. Each of the three definitions of internal energy comes with its own corresponding definitions of work and heat. If we change what we mean by , we also change how we split that energy change into and . For each of the three choices, however, the definitions are constructed so that work and heat add up to the total change in internal energy. All three therefore satisfy the first law.<br>\nAt first, this seems reassuring. Perhaps any of the three definitions will do.<br>\nTo decide whether all three internal energy definitions are truly acceptable, we need a stricter test: the second law. The first law tells us that energy must be conserved, but it does not tell us which direction a process will naturally take. The second law supplies that direction. An egg can be whisked and cooked into an omelette, but an omelette left on the plate will not spontaneously uncook itself, separate into a yolk and a white, and return to its shell. Energy conservation alone would not rule out such a reversal, yet nature overwhelmingly favors one direction. Cooking an omelette is therefore an irreversible process. A perfectly reversible process, by contrast, could be undone without leaving any lasting changes to the system or its surroundings.<br>\nFor the sudden changes studied in the paper, we can quantify irreversibility by comparing the work actually performed with the minimum work required in an ideal, perfectly reversible process. Thermodynamics captures this minimum through a quantity called the free-energy change, . The difference between the actual work and this ideal minimum,<br>\nis called dissipated work. It measures the extra work associated with carrying out the process irreversibly, and the second law says that it cannot be negative.<br>\nThis is where the three definitions part ways. All three satisfy the first law, but only two satisfy the second law for the processes considered in the paper. The third definition, which accounts for the temperature dependence of the Hamiltonian of mean force, can predict negative dissipated work.<br>\nDoes this mean that our quantum system has somehow broken the second law? Not at all. Rather, the third definition assigns internal energy, work, and heat in a way that makes a valid process look thermodynamically inconsistent.<br>\nThe next question is why the three definitions agree in classical physics but separate in the quantum case. The answer lies in one of quantum mechanics’ defining features: observables do not always commute. Roughly speaking, when noncommuting observables describe two quantum properties, they cannot both be measured simultaneously. This has no direct counterpart in classical physics, where two observables describing different properties can be measured simultaneously. When the system’s energy and interaction energy cannot be simultaneously measured, the three definitions of work can give three different values.<br>\nTo explore this connection, we considered what happens when the system’s Hamiltonian commutes with the interaction Hamiltonian, both before and after the sudden quench. In this classical-like limit, all three expressions for work give the same value, which also obeys the second law. In hindsight, the result may seem obvious. Still, there is something oddly satisfying about pinpointing precisely when the three definitions agree: strong coupling alone does not force them to give different answers. Quantum noncommutativity is what allows them to part ways.<br>\nOver the years, our family’s egg repertoire expanded. MasterChef episodes, new cookbooks, and travel brought poached eggs, Scotch eggs, shakshuka, eggs-in-purgatory, Tamagoyaki, and plenty of experiments in between. In some dishes, the yolk and white remain almost perfectly distinct; in others, the boundary between them nearly disappears. A whole spectrum exists between separation and complete mixing.<br>\nThe same is true of a system and its environment: their interaction can range from barely noticeable to overwhelmingly strong. Our results identify two definitions that remain consistent with the laws of thermodynamics for the processes we studied, even when those interactions become strong.<\/p>","content_hash":"0e2010f973ab2f514212cd2fd3efe8aa","author":"greeshmaoruganti","published_at":"2026-10-11T22:21:40","fetched_at":"2026-11-13 13:50:20","word_count":1800,"read_time_minutes":10,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"4w","domain":"quantumfrontiers.com"},{"id":"26bb0ca55c7452a3","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18273","title":"In praise of questions","url":"https://quantumfrontiers.com/2026/10/08/in-praise-of-questions/","summary":"Prende y se apaga sola, sale después de hora. CHARLY GARCÍA La máquina de ser feliz1 I’ve learned to tolerate them, and sometimes even like them, but Zoom meetings are weird. Even in familiar contexts: I have weekly check-ins with a close friend/collaborator based in Germany, and despite our familiarity, it still feels weird at times. I joined Nicole Yunger Halpern’s group almost when it was established, during Summer of 2021. The pandemic wasn’t exactly over, and most of us were geographically ","content":"<p>Prende y se apaga sola,<br>\nsale después de hora.<br>\nCHARLY GARCÍA<br>\nLa máquina de ser feliz1<br>\nI’ve learned to tolerate them, and sometimes even like them, but Zoom meetings are weird. Even in familiar contexts: I have weekly check-ins with a close friend/collaborator based in Germany, and despite our familiarity, it still feels weird at times. I joined Nicole Yunger Halpern’s group almost when it was established, during Summer of 2021. The pandemic wasn’t exactly over, and most of us were geographically scattered, as well as complete strangers. To half-palliate this awkwardness, Nicole came up with what’s now sort of a group tradition: icebreaker questions. These are chosen by group members (in a secret order that I believe only Nicole fully knows), and can range from day-to-day stuff (“what’s the best type of pasta?”) to deeper matters.<br>\nA while back, a group member asked something along the lines of: “If you could give your younger self any scientific advice, what would it be?” My response then was: “ask the dumb questions you have as they come.” I had two reasons for this answer. First, dumb questions usually sound dumber in your head and are not as bad as you might think. Second, a dumb matter that doesn’t seem dumb at first, can turn into a really, really dumb question if it’s long unanswered. If I were to be asked this same icebreaker question today, I’d surely reply the same thing, but I believe the reasoning would be more nuanced.<br>\nOver my PhD, I’ve had the opportunity to interact, discuss physics, and even collaborate with truly amazing scientists. I still don’t have a foolproof handbook of criteria detailing what makes a great physicist great,2 but I have observed some patterns. An important one is that great physicists speak their mind: they’re usually relentless with their own confusion and ask whatever they have to ask to overcome it. Don’t get me wrong here; these people are giants, and I wouldn’t dare call their questions dumb, but asking good questions is a skill more than a gift. It’s like seeing Claudia Poll swim or hearing Hilary Hahn play a cadenza: yes, these people are objectively good, but there’s also a huge amount of practice that goes behind what one sees. And, in the case of asking great questions, practice comes from asking not-great (and sometimes even dumb) questions.<br>\nI got a crash course in asking questions during a recent project. A driving theme of my PhD research has been the study of autonomous quantum machines. These devices execute tasks without classical, time-dependent control, operating under a time-independent Hamiltonian. My first experience with these devices was during an experimental collaboration in which Simone Gasparinetti’s group built an autonomous quantum refrigerator from superconducting qubits. The refrigerator ran on a thermal gradient: as heat flowed from a hot bath to a cold one, a three-qubit interaction carried energy out of a target qubit, cooling it with no external control. The experiment was a success, and its potential usefulness in information-processing devices led us to ask about other contexts in which autonomous quantum machines could shine.<br>\nAt the time, we came in close contact with folks at Marcus Huber’s group in Vienna, who were thinking in abstract terms about a fully autonomous quantum processing unit. We had the idea of designing autonomous protocols for logical gates in current-day quantum-technology platforms: Rydberg atoms, trapped ions and superconducting qubits.<br>\nTo illustrate this autonomous-gate idea, I’ll briefly describe a gate protocol from our paper. As I mentioned before, an autonomous quantum fridge can be built by exploiting a thermal gradient. The same principle can help build a heat engine. Suppose one has three qubits, with energy gaps and . Let’s call these qubits the cold, hot and target qubits, respectively. The cold qubit couples to a bath at temperature and the hot qubit to a bath at a temperature , with . Under the resonance condition , the three qubits can swap energy all at once: the hot qubit loses an excitation while the cold and target qubits each gain one, or vice versa. The gradient makes the first direction more likely. The cold qubit can be engineered to quickly decay to its bath, so the exchange can’t run backward, and the target accumulates excitations. The cold qubit’s energy is lost to its bath, while the target could emit into a waveguide that delivers the photon to a chosen destination. The thermal gradient thus powers a device that emits useful photons with no external control.3<br>\nWhat can we do with this autonomously emitted photon? We can use it to trigger an entangling gate. Two superconducting qubits with matching energy gaps can exchange excitations. Suppose we have a tunable-frequency transmon qubit capacitively coupled to a cavity. An incoming photon from our autonomous emitter, entering the cavity, can shift the frequency of the transmon. If this effective, shifted frequency matches a nearby qubit’s frequency, the two transmons can interact. The effect of this interaction depends on the cavity’s decay time, rendering our entangling gate random and potentially useful for the implementation of Brownian circuits, for example. A charming instance of a quantum Rube Goldberg machine, if you ask me.<br>\nThis example illustrates the spirit behind our autonomous-gate ideas. As mentioned before, we propose several more instances over different platforms. This all sounds nice and clean after looking at the end product. But the truth is that, when we started the project, I was a theory student with little knowledge about the inner workings of platforms, trying to pitch convincing arguments for novel gate protocols in these well-established technological fields. I had to go through decades of accumulated literature and famous experiments, trying to understand them and hopefully come up with ways to readapt them to the context of autonomy. Naturally, there were many old papers to read, many small details to understand that were obvious to a familiarized experimentalist but not to me, and, of course, many dumb questions to ask. Regarding this, I have to deeply thank Tom Manovitz, Norbert Linke and Simone Gasparinetti, our experimental collaborators, for their patience with these questions and their willingness to chat and clarify to a confused theorist what’s possible and interesting in experimental contexts.<br>\nA special mention, however, to postdoc Yuxin Wang. Earlier in the text I mentioned how being relentless with one’s confusion is helpful; she’s one of the clearest examples I can think of. She came into the project right as I was struggling to model one of our superconducting-qubit gates. I was knee-deep in a convoluted formalism, drowning in inefficient numerical simulations that were leading nowhere. She asked a bunch of questions about our system and my modeling attempts for which I had no good answers for, especially because her expertise in both AMO and open systems really made my explanations look weak. I mean this in the best way I can: polishing my arguments and deeply enquiring about modeling decisions forced us to zoom out and look at simpler, more-efficient ways in which we could model our physical setup. I can’t even begin to quantify Yuxin’s patience and helpfulness in the project, nor how much I learned from working closely with her.<br>\nResearch, of course, is about asking questions. Trying to clarify confusion and asking in the most transparent way possible are discomforts I still struggle with (much like with Zoom calls), but I’ve learned to appreciate these convoluted scenarios and sometimes even thrive in them. Not being the smartest or most-experienced person in a room has lots of perks. You can learn a lot, although you might need to ask one or two dumb questions to get there.<br>\n- It turns on and off by itself,<br>\nit goes out after hours.<br>\nCHARLY GARCÍA<br>\nThe happiness machine<br>\n↩︎<br>\n- I do have, however, a handbook of criteria detailing what makes a useful autonomous quantum machine useful, though. ↩︎<br>\n- Quantum thermodynamicists call these photon-emitting devices autonomous quantum clocks. ↩︎<\/p>","content_hash":"43a118f0636504057fd08f9563d3306f","author":"José Antonio Marín Guzmán","published_at":"2026-10-08T15:27:53","fetched_at":"2026-11-13 13:50:20","word_count":1329,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"5w","domain":"quantumfrontiers.com"},{"id":"f42f1089f5b28a25","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18260","title":"Marcus theory and Marcus practice","url":"https://quantumfrontiers.com/2026/09/27/marcus-theory-and-marcus-practice/","summary":"Rudy Marcus was 91 years old when I took a course from him. His age was, arguably, not his most remarkable quality. The course took place during the second spring of my PhD. I was completing not only the academic year, but also my course requirements. Why not, I figured, indulge in traditional statistical mechanics? Statistical mechanics neighbors, and partially overlaps with, thermodynamics. Modern approaches to statistical mechanics include fancy toolkits imparted in physics courses: the renor","content":"<p>Rudy Marcus was 91 years old when I took a course from him. His age was, arguably, not his most remarkable quality.<br>\nThe course took place during the second spring of my PhD. I was completing not only the academic year, but also my course requirements. Why not, I figured, indulge in traditional statistical mechanics? Statistical mechanics neighbors, and partially overlaps with, thermodynamics. Modern approaches to statistical mechanics include fancy toolkits imparted in physics courses: the renormalization-group method; Ginzburg–Landau theory; and the latter theory’s successor, topological order. I craved a more traditional approach, as won’t surprise readers of this blog. So I ditched the physics course list and signed up for Chemistry 166.<br>\nRudy didn’t disappoint. He began the course with a tradition passed down from a founder of thermodynamics: Boltzmann’s H theorem. The theorem amounts to the first argument ever published for the second law of thermodynamics: every (sufficiently large) closed, isolated system’s entropy increases or remains constant; it doesn’t decrease. Rederiving Boltzmann’s H theorem, I felt as I would while holding a lace collar worn by Queen Elizabeth I: as though I were touching history.<br>\nRudy proceeded through more of the greatest hits in statistical mechanics. For instance, the Fokker–Planck and Langevin equations describe random processes. Examples include the subject of one of Einstein’s most famous papers: the motion of a pollen grain suspended in a liquid and buffeted by the liquid’s molecules. Chemistry 166 provided much of the bread and butter, meat and potatoes, and even tofu and edamame of a thermodynamicist’s education.<br>\nRudy advanced step by step, rederiving every result in class. He recommended a textbook; but I refer to my lecture notes, rather than to the text, to refresh my memory about course topics nowadays. When I encounter complex integrals (a certain type of calculus) in statistical mechanics, I think back to Rudy’s treatment of them. The course also crystallized my understanding of the fluctuation–dissipation theorem, which describes systems perturbed slightly out of equilibrium; examples include a magnet subjected to a weak magnetic field.1 For the course’s final project, I studied quantum master equations—which featured in a Quantum Frontiers post afterward.<br>\nNo less than his explanations of science, Rudy’s enthusiasm for science impressed itself upon me. Again, he taught Chemistry 166 at age 91. He continued to collaborate on research. Whenever I saw him, even after the course ended, he asked for news about quantum information theory—which he didn’t work on.<br>\nTwo and a half years after the course, Rudy gave a speech at a dinner in honor of a couple’s engagement. The groom was pursuing a PhD in applied physics, and the bride worked as an engineer. The groom asked if Rudy had advice for young scientists. Rudy responded immediately: plenty of science remains to be done, so keep exploring.<br>\nDuring his speech, Rudy described his upbringing in Montreal. His high school had produced a “who’s who” of Canadians, in his words—and not because the school demanded high tuitions or offered tutors and social connections. Discrimination pushed Jewish working-class children out of other schools and into Baron Byng, where some students worked hard enough to thrive. Alumni include artists; judges; physicists; William Shatner, who played Captain Kirk in the original Star Trek series…and Rudy Marcus.<br>\nWhich leads me to the quality arguably more remarkable than Rudy’s teaching Chemistry 166 at age 91: he’d won a Nobel Prize in chemistry. Unlike most chemists, Rudy worked as a theorist, rather than an experimentalist. He developed a framework now called Marcus theory. It predicts the rate at which electrons hop between molecules. I can’t tell you much more about Marcus theory because I don’t know much more about it: Rudy had enough humility that, to my memory, he mentioned his theory only once in class, in passing.<br>\nAlthough I know little about Marcus theory, I’ve seen much of Marcus practice. In 2022, I emailed Rudy to ask where a holiday card could reach him. The pandemic had isolated enough people that I’d determined to reach out to more acquaintances. Rudy replied, “I have been working at home, meeting twice a week on zoom with my now small research group.” He was 98 years old. His curiosity, learning, mentoring, and exploring continued.<br>\nRudy passed away this July, five days before his 103rd birthday. I hope to learn Marcus theory someday. But I’d be even more grateful to undertake Marcus practice for even a decent fraction of the time for which he did.<br>\n1How rapidly does the system respond to the perturbation? This nonequilibrium response depends on a correlation function evaluated on an equilibrium state, according to the fluctuation–dissipation theorem. To understand why, imagine preparing the system in a thermal state, perturbing the system at an early time, and measuring the system later. What information can you extract about the perturbation? A two-time correlation function encodes this information. Imagine Fourier-transforming a two-time correlation function. The Fourier transform is proportional to a second derivative of a free energy, according to the fluctuation–dissipation theorem. (The second derivative should sound plausible because it depends on a two-time correlation function.) Second derivatives of free energies equal response functions, such as the magnetic susceptibility. Therefore, a nonequilibrium response depends on an equilibrium correlator.<\/p>","content_hash":"03441b4c88ad1e7bcaaf5c5d077f227b","author":"Nicole Yunger Halpern","published_at":"2026-09-27T19:29:51","fetched_at":"2026-11-13 13:50:20","word_count":869,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"6w","domain":"quantumfrontiers.com"},{"id":"abcdfe6532909136","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18268","title":"Quantum Computers Need More than “Magic”","url":"https://quantumfrontiers.com/2026/09/20/quantum-computers-need-more-than-magic/","summary":"The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.&nbsp; Between the bringing of the bread a","content":"<p>The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.<br>\nBetween the bringing of the bread and the serving of the soup, the conversation at my end of the table typically turns to my topic of research: quantum computers. These theoretical machines harness quantum physics to outperform their classical counterparts. Quantum computers hold great promise for the future, with applications ranging from drug discovery to cybersecurity. Yet, despite their promise, we still do not have a satisfying answer to the fundamental question: what makes quantum computers computationally stronger than classical computers?<br>\nTo answer this question, imagine that tonight, instead of the soup, the cooks are brewing a happiness potion. This potion causes the drinker to be joyful and content for the rest of the evening. The cooks know how to brew the potion perfectly well; they discovered the list of ingredients in the nineties and have been successfully brewing ever since. But the cooks still cannot solve one mystery: what makes the potion different from the soup? What ingredient sets the potion apart from the soup?<br>\nThe cooks come up with a simple approach. They leave out one ingredient in each serving, and then carefully observe the formal-goers. They find that almost every seat is filled by a happy student, chatting away to their neighbours, indicating a working potion. However, one student’s spirits have not been lifted, as they were solely served a simple soup. The cooks conclude that the ingredient they withheld for that student was essential. They name this ingredient magic.<br>\nIn my research, the potion is a quantum computer, the soup is a classical computer, and magic is the actual technical term used for quantum states that promote certain classical computers to quantum computers. Without magic, these quantum computers are computationally no stronger than a normal laptop.<br>\nSo magic is necessary for quantum computational advantage, but is it enough? Over a decade ago, researchers found that, for quantum computers built on qutrits, the answer is no. To understand what a qutrit is, consider the regular bit: a switch that’s either zero or one. The qubit, the quantum generalization of the bit, can be both zero and one simultaneously. The qutrit is a roomier qubit that can be zero, one, two, or any of those simultaneously.<br>\nIt is possible to build quantum computers using qutrits. However, the vast majority of quantum computers are built on qubits, the quantum generalisation of the everyday bit. My colleagues and I have recently discovered that for qubit-based quantum computers, too, magic is not enough to gain an advantage over classical computers. Picture the cooks dumping jar after jar of magic into a soup, only to find that the soup never gains magical powers. Potions need more than magic. Potions also need Kirkwood-Dirac negativity.<br>\nWhat is Kirkwood-Dirac negativity? The idea developed by John Kirkwood and Paul Dirac builds on probabilities—for example, the odds of obtaining a heads upon flipping a coin. One can describe a quantum computer using numbers that behave similarly to probabilities but come with a twist: they may be negative. These negative “probabilities” mark where quantum departs from classical. The main result of our paper is that this negativity, too, is a necessary ingredient: without it, no amount of magic will turn the soup into a potion.<br>\nAt this point in the conversation, I am typically cut off by the arrival of the soup. The conversation moves on from quantum computers to different subjects, and I usually look up at the paintings staring down at me. One of them is of Dirac, who spent many dinners discussing quantum theory in the same dining hall. The University of Cambridge is a special place.<\/p>","content_hash":"8c54ccd29fbd109c79f02546399e0593","author":"jjthio","published_at":"2026-09-20T16:49:32","fetched_at":"2026-11-13 13:50:20","word_count":678,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"7w","domain":"quantumfrontiers.com"},{"id":"3f8f2a08f44c12ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18162","title":"How can objects interact without touching?","url":"https://quantumfrontiers.com/2026/09/06/how-can-objects-interact-without-touching/","summary":"Rethinking the electric field Have you ever wondered what an electric field actually is?&nbsp; The electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.&nbsp; Most textbooks define the electric field ","content":"<p>Rethinking the electric field<br>\nHave you ever wondered what an electric field actually is?<br>\nThe electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.<br>\nMost textbooks define the electric field as a property of space or a physical entity surrounding electric charges, or with the equation of force per unit charge. These definitions help us understand what the electric field does and its effect on electrically charged particles, but they do not fully answer what an electric field actually is and how it influences charges. Thus, I started thinking about the question: what allows charges to influence each other without touching?<br>\nThis question led me down a path that began with a simple observation in everyday life, and it eventually pointed toward much deeper ideas in modern physics.<br>\nObjects Influenced by Their Surroundings<br>\nBefore talking about electric fields, let’s consider a more basic question: Does it seem reasonable that objects can be influenced by their surroundings?<br>\nMost people would answer yes. We have all seen examples of objects responding to something else nearby, such as the Earth orbiting the Sun, a compass needle reacting to a magnet, and our phones responding to signals from a WiFi router. But what is the mechanism behind these interactions?<br>\nA simple physical phenomenon that we can look at is a balloon rubbed on a piece of clothing that can pick up strands of our hair. Many of us have seen this demonstration in kindergarten or first grade of elementary school. This might seem completely ordinary, but if we pause and think about it, something strange is happening – the balloon is influencing the hair without touching it.<br>\nHow is that possible? One answer is simply that the balloon “pulls” on the hair, but this raises more questions. How does the balloon reach the hair? What is happening in the space between them? These questions suggest that something is missing from the picture of objects pulling on each other directly through contact.<br>\nTo put this in the context of physics, we might all have learned that “like charges repel, and opposite charges attract”. We might have solved equations on how fast charges would move away from or toward each other. We were always told to just accept it because these motions result from the electric field. But why do these observations happen? What is happening between the charges?<br>\nHistorically, physics encountered the same problem. If one object can influence another at a distance, it is natural to ask what is happening in the space between them. One guiding principle that physicists often use is the concept of locality. Locality is the idea that an object can only be directly influenced by its immediate surroundings. Thus, an influence should not simply leap across space from one object to another, and changes should propagate through intermediate regions step by step.<br>\nAt first glance, locality seems reasonable because it matches many of our everyday experiences. If I push a book across a table, my hand influences the book through direct contact. The influence does not appear to jump instantaneously across the table.<br>\nHowever, locality creates a tension when we return to the scenario of the balloon pulling on strands of hair. If locality is true, something must be happening in the space between the balloon and the hair. But from a standard electromagnetic perspective, the space between the balloon and the hair is empty. Therefore, we have encountered a contradiction: if what is between the balloon and the hair is empty space, then what is responsible for transmitting the influence? Neither the usual electromagnetism nor locality tells us the answer to these questions.<br>\nThe Classical Electric Field<br>\nIn the usual electromagnetic picture, the answer to the puzzle is the electric field. Rather than allowing charges to influence one another directly across space, the theory assigns an electric field to the space surrounding charges. The field acts as the intermediary through which influence is transmitted.<br>\nA useful way to think about the electric field is that it assigns information to every point in space. If we imagine a charged particle that is placed at a particular location, the electric field tells us how that particle would move. This charged particle is what physicists call a test charge. By observing how the test charge behaves, we can infer information about the electric field at that location.<br>\nThis could seem like a satisfying answer as the electric field tells us how influence is transmitted, but it does not tell us what kind of thing is doing the transmission. Is the electric field a physical substance? Is it a mathematical tool? Or is it something else?<br>\nIt might be easy to fall back on the idea that the electric field ultimately works through tiny particles physically touching one another. After all, contact interactions are among the most familiar interactions that we experience.<br>\nBut physics challenges this intuition as well. It is surprisingly difficult to define what it means for two objects to “touch”. We usually think of the balloon attracting hair as an example of action at a distance, whereas pressing a hand on a table feels like direct physical contact. However, at the microscopic level, the two situations are fundamentally similar. If we could zoom in on our fingertip and the table with a microscope, we would find that the atoms in our skin never make contact with the atoms in the table. This is because of the repulsion between the electron clouds surrounding the atoms, which prevents the two atomic nuclei from overlapping. Say if we scale the atom in the table up to be the size of a marble, then the nearest atom in our fingertip would still be separated from it by a few centimeters. In the end, nothing is truly “touching” in the intuitive, physical sense.<br>\nThus, the idea of contact does not solve our problem. We are forced to ask the same question again: what is it that allows these interactions to occur? To answer that question, I turned to a different perspective of thinking about electric fields.<br>\nThe Electric Field as A Dynamical Structure<br>\nFrom our intuition, it is natural to imagine the electric field as some invisible substance filling space. This is often the picture suggested by the common field line diagrams in physics textbooks, which make the field appear to flow outward or inward from charges, almost like a moving fluid.<br>\nA useful analogy is the ocean. A boat floating on water can move because waves pass beneath it. The boat responds to changes in its surrounding waves rather than to some direct push from a distant object. Similarly, charged particles respond to changes in the electric field around them. We can then view the electric field as a dynamical structure that governs how the state of the world can evolve.<br>\nHowever, the ocean analogy can only take us so far. Ocean waves are made of water molecules. Sound waves are made of vibrating air molecules. But what is the electric field made of? When light travels through empty space, it seems that there is no material medium at all.<br>\nThis brings us back to the mystery: if locality suggests that something must exist in the space between interacting objects, and if the electric field is not made of the ordinary matter that we understand, then what exactly is occupying the space?<br>\nTo answer this question, we have to rethink what we mean by “empty” space itself.<br>\nEmpty Space is Not Empty<br>\nConventionally, we have always imagined empty space as exactly what the name suggests—empty. Just like if all the particles were removed and nothing was remaining. But modern physics suggests a very different picture.<br>\nIn quantum field theory, what we call “empty space” is not truly empty. Empty space is filled with underlying quantum fields that permeate all of space and time, even in the absence of particles. Even when the surface of the ocean looks perfectly still, the water is still there. The ocean is not defined only by visible waves, but by the underlying medium that can support waves in the first place. The waves are patterns of motion of the ocean itself, just like the electric field. These fields are part of the fundamental structure of the universe from which physical phenomena emerge. Quantum field theory suggests that particles are not independent objects moving through an otherwise empty space. Rather, they are localized patterns or excitations of underlying fields that already exist throughout the universe.<br>\nFrom this perspective, the electric field is not something that is added to empty space. It is part of the fundamental dynamical structure of space itself.<br>\nConclusion<br>\nAt the beginning, I asked a simple question: how can objects influence each other without touching? The straightforward answer is the electric field. Charges create electric fields, and those fields determine how other charges move. But what is an electric field? Is it an invisible material filling space between objects, or is it a dynamical structure that governs how physical systems in the world evolve?<br>\nFrom the perspective of quantum field theory, quantum fields permeate all of space and time. Particles are not separate objects moving through an empty space, but are excitations of these underlying fields; electric fields are not secondary matter surrounding charged particles, but are particular configurations of the underlying electromagnetic quantum fields. What we observe as the motion of a charged particle is the result of its interaction with the electromagnetic field, whose local state determines how the particle evolves.<br>\nIn the end, our original question may not have a single definitive answer. But asking it revealed a shift in perspective, and physics has repeatedly shown that every explanation opens the door to an even more fundamental question. Stopping at this step, a new mystery emerges: what are these underlying quantum fields themselves? What are they made of, and where do they arise from?<\/p>","content_hash":"72ad48be59eb5d47ff76fadb3908d2c5","author":"adelynnt","published_at":"2026-09-06T13:17:26","fetched_at":"2026-11-13 13:50:20","word_count":1697,"read_time_minutes":9,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"9w","domain":"quantumfrontiers.com"},{"id":"b2281c07172b699a","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18092","title":"The Universe, the Uncanny, and Fashion","url":"https://quantumfrontiers.com/2026/08/31/the-universe-the-uncanny-and-fashion/","summary":"In the beginning there was a question. Actually, no, in the beginning there was language. The question came later, presumably as one of its side effects. Since then we have asked about nearly everything, though the answers have done little to alter our circumstances. Human existence has always seemed strange to me. We arrive without consent, in a place not of our choosing, then spend decades asking why, until we close our eyes and enter the abyss of nothingness. Some people accept this situation","content":"<p>⚛⚛⚛<br>\nIn the beginning there was a question. Actually, no, in the beginning there was language. The question came later, presumably as one of its side effects. Since then we have asked about nearly everything, though the answers have done little to alter our circumstances. Human existence has always seemed strange to me. We arrive without consent, in a place not of our choosing, then spend decades asking why, until we close our eyes and enter the abyss of nothingness.<br>\nSome people accept this situation very well. I did not.<br>\nUntil my mid-teens, I tenaciously found one solution in fashion. If I could not understand who I was, I could at least decide what version I could become. Clothes gave form to something otherwise difficult to locate. Desire, after all, begins with a lack.<br>\nIt was only later that physics presented a solution to the same lack, only with more elaborate mathematics.<br>\nQuantum mechanics tells us that the world beneath the familiar world does not behave as we experience it. A thing can resist being one thing, certainty begins to dissolve, and reality becomes strangely unfamiliar. The uncanny begins very close to home.<br>\nIt is in this uncanniness that fashion and physics, liminally, meet for me: both begin with a human being standing before something they cannot understand, the universe in one case, the self in the other, and trying to make a form out of it.<br>\nBut even this distinction, on closer inspection, begins to collapse; for our desire to understand the universe has always concealed a deeper desire to understand the self that stands within it.<br>\nAll roads eventually lead back to the interests you had as a child, or so I say.<br>\nI would squint into the dark, my mind already at work. I would imagine the next thing I would wear, project its color and fabric onto the ceiling.<br>\nThen, go to the bazaar, Rangrizano Dana, where, as the Kandaharis like to say, everything is sold except one’s mother and father.<br>\nThe designs that had existed only in my head, after night upon night of theorizing and calculating, were finally beginning to take shape. The alleys of Rangrizano Dana were full of fabric of different textures and colors.<br>\nOnce the fabric was bought, came the tailoring. Tailors hold a special place in Afghanistan. Some are stars in their own right, the kind you have to book an appointment with. And once you get there, another matter comes up: making the tailor promise not to show your design to another woman. Everyone wants to wear something unique. So, naturally, there is a lot of secrecy.<br>\nThe designs themselves would either be described or sketched. Somewhere between what was imagined and what the tailor could make, something would emerge. And the day the tailor shipped your clothes was really a day of revelations.<br>\nTime passed, which is another way of saying the object of my desire changed. The same attention once spent on cut, texture, and appearance turned, little by little, toward the fabric of space and time.<br>\nStudying physics, I organized my process in the same way. There was again an idea that existed first in the mind, and then the problem of giving it form.<br>\nOnly now the materials were different. Instead of cloth, there was mathematics; instead of the tailor’s table, the blackboard and chalk. And, standing before it, more often than not, a badly dressed physicist covered in chalk dust. All the libidinal energy of the universe, you might say, had been sublimated into equations.<br>\nFashion had, in some ways, been the more serious pursuit. There was something at stake: you wanted to look better than everyone else. Physics, by comparison, could be surprisingly playful.<br>\nAlice sends a particle to Bob. The sound of those names would tickle my Pashto ear then, and still cracks me up now. Cats are placed in boxes, both dead and alive. Observers hover near black holes or sometimes even, whooooooosh, fall into them.<br>\nSo, in this way, in my mind’s eye, the physicist has become a rather more amusing figure: a tailor of space and time. The universe, of course, is a notoriously difficult client (perhaps even more difficult than a Kandahari woman making her tailor promise not to show her design to anyone else).<br>\nHe begins, as any tailor must, with an imagined shape. Mathematics is his chalk, his scissors, his needle. With it he marks the fabric, cuts it, folds it, joins one piece of reality to another. Some constructions fall upon the universe with elegance. Others bunch at the shoulder, pull at the waist, or refuse altogether to button, and must be altered, or thrown away completely.<br>\nA tailor works against the resistance of the human body; a physicist against the resistance of the universe.<br>\nImagine, then, a physicist seated at the edge of a black hole, spectacles low upon his nose, sewing little cloaks from the fabric of spacetime.<br>\n“How many dimensions will you need?” asks Alice.<br>\n“That depends upon the suit,” he replies.<br>\nFor AdS/CFT, suppose we are making a three-dimensional garment. The tailor of the universe never begins with three dimensions. Before him lies only the flat, two-dimensional fabric, with all its degrees of freedom spread upon the board.<br>\nIt is then, in a less sartorial language, we might call the disentangling and entangling of degrees of freedom; the tailor coaxes a third dimension out of the flat cloth. This is the secret embroidery of the holographic idea: what appears to the wearer as a three-dimensional world is encoded in a fundamentally two-dimensional way.<br>\nBob tries this newly fashioned quantum garment on before entering the black hole.<br>\n“Too tight,” he says. “See if there is more degree of freedom.”<br>\nThe physicist frowns, takes up his chalk, and makes another small mark, with some disentangling and entangling here and there.<br>\nWhat could have been wrong? Well, perhaps the group theory has been chosen badly, the symmetry is broken, and a representation must be changed, a seam opened, a dimension added, or one cunningly concealed.<br>\nAlice watches him work, the almighty tailor of the universe, making change without a change.<br>\n“But how do you know when the suit is right?”<br>\nAnd with that, the physicist looks at her.<br>\n“What do you want? Do you want to put me out of work? Unknowing is the lack that drives us to make more suits. If we knew the suit was right, that would be the end of everything.”<\/p>","content_hash":"8dd0c9a6fca489753e5d9567fc10e568","author":"Sola Mahfouz","published_at":"2026-08-31T21:28:38","fetched_at":"2026-11-13 13:50:21","word_count":1082,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"10w","domain":"quantumfrontiers.com"},{"id":"87fc3148874a6141","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18095","title":"Nicole’s guide to writing and editing","url":"https://quantumfrontiers.com/2026/08/26/nicoles-guide-to-writing-and-editing/","summary":"Freshman year of college, I took a writing seminar from German-literature professor Ellis Shookman. Professor Shookman loved Mozart’s music, he told us early in the term. He listened to Mozart on the radio while driving from campus to Boston. Static might mar the transmission, but he could often turn up the volume and continue enjoying the program. Sometimes, the static worsened during the drive. It could worsen and worsen, until Professor Shookman’s frustration outweighed his delight at listeni","content":"<p>Freshman year of college, I took a writing seminar from German-literature professor Ellis Shookman. Professor Shookman loved Mozart’s music, he told us early in the term. He listened to Mozart on the radio while driving from campus to Boston. Static might mar the transmission, but he could often turn up the volume and continue enjoying the program. Sometimes, the static worsened during the drive. It could worsen and worsen, until Professor Shookman’s frustration outweighed his delight at listening. He’d switch off the radio.<br>\nAs Professor Shookman loved listening to Mozart’s music, he loved reading about students’ ideas. Yet static can mar a piece of writing: infelicities in grammar, structure, composition, word choice, and more. If enough infelicities obscure the writing, the frustration of reading outweighs the benefits. Professor Shookman will quit reading.<br>\nProfessor Shookman marked up our essays with a blue pencil that achieved the status of legend among his students. If you’ve written a paper I’ve coauthored, you’ve probably received PDF drafts replete with green highlighting.1 A sticky note explains the reason for each highlighting: “Singular–plural mismatch.” “Active voice >> passive voice.” “Let’s clue the reader in as to this formula’s meaning before lobbing the math at them.”<br>\nOver the past year, I’ve catalogued the suggestions I write most often on paper drafts. The comments embody principles gleaned from Strunk and White’s The Elements of Style; the Physical Review style guide; other writing guides I esteem; literature whose writing I esteem;2 collaborations with professional editors; and writing instructors, including Professor Shookman. Each section below begins with more-important principles, shading into more-nuanced ones.<br>\nPlease use and disseminate these principles. Train your favorite large-language model (LLM) on them, and have the LLM critique your manuscripts. Instruct it to use green highlighting if you wish. Even if the LLM suggests fixes initially, tell it to stop offering suggestions later, so that you can devise the solutions: train not only the LLM, but also yourself. I hope to enjoy your papers as much as Professor Shookman enjoyed his sonatas.<br>\n- <br>\n        Organization<br>\n        <br>\n  - Motivate your work; then, present it; and then, explain its physical significance.<br>\n  - Begin each paragraph with a topic sentence.<br>\n  - Begin each section, apart from the introduction and conclusion, with (i) a statement of the takeaway and (ii) an outline of the section. When outlining a section, hyperlink to each subsection. Similar guidelines concern subsections and subsubsections.<br>\n  - <br>\n                Before presenting a piece of math, sketch its meaning and origin. This strategy enables the reader to understand the math as soon as they encounter it. If you throw math at the reader without introducing it, the reader will have to squint at the symbols for a while to figure out what the expression means and where it comes from.<br>\n                <br>\n    - Example: To calculate the average work, we substitute the Hamiltonian formula (10) into the definition (12): [equation].<br>\n  - Most citations belong at the ends of (i) sentences and (ii) phrases concluded with commas. Put a citation elsewhere only if you have a compelling reason for doing so.<br>\n  - <br>\n                Bridge each component of your writing to the next component; the next shouldn’t sound like a non sequitur.<br>\n                <br>\n    - <br>\n                        Suppose that the next sentence refers to (i) a topic mentioned in the previous sentence and (ii) a new topic. Mention (i) before (ii).<br>\n                        <br>\n      - Example: Smith et al. applied control theory to the extent possible. The attempt led to intractable equations, unlike our approach.<br>\n      - Example of a broken bridge: Smith et al. applied control theory to the extent possible. Our approach does not involve intractable equations, unlike theirs.<br>\n  - <br>\n                Whenever you tell a story, tell it from start to finish, step by step. Derivations, proofs, and descriptions of experiments qualify as stories.<br>\n                <br>\n    - This guideline extends to descriptions of experimental setups and of mathematical objects. For example, imagine referring to an element of a subgroup of the group generated by some operators. Did you have to read the preceding sentence multiple times to process it? The sentence begins at the end of a story, then rewinds to the story’s beginning. This structure impedes understanding. The subgroup forms the context for the subgroup element, which one can’t grasp until hearing about the subgroup. The subgroup participates in a similar relationship with the group, as does the group with its generators. Therefore, one should introduce the generators, then the group, then the subgroup, and then the subgroup element.<br>\n- <br>\n        Word choice<br>\n        <br>\n  - <br>\n                Use strong, specific words, rather than weak words.<br>\n                <br>\n    - Verbs and nouns are stronger than adjectives and adverbs.<br>\n    - Choose specific verbs (e.g., “prepare,” “evolve,” and “measure”), rather than vague, general verbs (e.g., variants of “to be” and “take,” as in “take a measurement”).<br>\n  - Avoid statements such as “we investigate,” “we study,” and “we analyze.” Such statements don’t relate that you’ve accomplished anything. State what you’ve accomplished. Verbs such as “prove,” “test,” “confirm,” “discover,” and “find” achieve this goal.<br>\n  - Adverbs such as “importantly” and “remarkably” pollute scientific writing with the authors’ opinions. Demonstrate that a claim is important or that a result is remarkable; then, leave readers to draw their own conclusions. Those conclusions will coincide with yours if you’ve demonstrated your point.<br>\n  - Use the active voice, rather than the passive voice. Take responsibility for your work. Editors of high-impact scientific journals have endorsed this advice.<br>\n  - <br>\n                Refer to yourself when necessary and only when necessary.<br>\n                <br>\n    - <br>\n                        Example of unnecessary reference to self: We use the superscript “max” to signify the maximal Fisher information.<br>\nPreferable alternative: The superscript “max” signifies the maximal Fisher information.<br>\n    - <br>\n                        Example of unnecessary reference to self: Our results establish several opportunities for future research. First, we can implement the experimental proposals.<br>\nPreferable alternative: Our results establish several opportunities for future research. First, one can implement the experimental proposals.<br>\n    - You may use the first-person plural when escorting the reader through a derivation.<br>\n    - Example: We substitute from Eq. (1) into Eq. (2).<br>\n  - If you’re the only author, don’t use the plural (“we,” “our,” etc.). The usage is inaccurate and misleading. It portrays you as dodging responsibility for your work by dispersing that responsibility across the scientific community.<br>\n  - Avoid dangling modifiers.<br>\n  - <br>\n                Pair every verb with the appropriate noun.<br>\n                <br>\n    - <br>\n                        Example of grammatically incorrect text: Equation (1) follows by calculating the sum.<br>\n                        <br>\n      - One should pair the verb “calculate” with the noun “we,” because “we” undertook the calculating. However, this example’s author omitted the noun out of squeamishness about using the first person in a scientific document. Hence the sentence says that the equation calculates the sum. Equations can’t calculate sums.<br>\n    - <br>\n                        Examples of correct alternatives<br>\n                        <br>\n      - We derived Eq. (1) by calculating the sum.<br>\n      - Equation (1) follows from the evaluation of the sum.<br>\n      - Calculating the sum yields Eq. (1).<br>\n  - Avoid empty subjects.<br>\n  - <br>\n                Include no unnecessary words.<br>\n                <br>\n    - “So-called” is unnecessary.<br>\n    - “Note that” and “We note that” are unnecessary.<br>\n    - Several phrases often preface mathematical statements but are unnecessary and lack contents: “we have,” “we have that,” “it holds that,” and “it follows that.” One can better serve the reader by prefacing the mathematical statement with (i) a derivation or (ii) a prose description of the statement.<br>\n    - Never write “is equal to”; “equals” is more concise.<br>\n    - Never write “is able to”; “can” is more concise.<br>\n    - Never write “gives an upper bound to,” “sets an upper bound on,” or “places an upper bound on”; “upper-bounds” is more concise. Analogous statements concern lower bounds and limits.<br>\n    - Never write “a large number of”; “many” is more concise. Never write “a small number of”; “few” is more concise.<br>\n    - Never write “We refer to [symbol] as [name]”; “we call [symbol] [name]” is more concise.<br>\
