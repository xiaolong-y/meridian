s.<br>\n    - <br>\n                        Examples of correct alternatives<br>\n                        <br>\n      - We derived Eq. (1) by calculating the sum.<br>\n      - Equation (1) follows from the evaluation of the sum.<br>\n      - Calculating the sum yields Eq. (1).<br>\n  - Avoid empty subjects.<br>\n  - <br>\n                Include no unnecessary words.<br>\n                <br>\n    - “So-called” is unnecessary.<br>\n    - “Note that” and “We note that” are unnecessary.<br>\n    - Several phrases often preface mathematical statements but are unnecessary and lack contents: “we have,” “we have that,” “it holds that,” and “it follows that.” One can better serve the reader by prefacing the mathematical statement with (i) a derivation or (ii) a prose description of the statement.<br>\n    - Never write “is equal to”; “equals” is more concise.<br>\n    - Never write “is able to”; “can” is more concise.<br>\n    - Never write “gives an upper bound to,” “sets an upper bound on,” or “places an upper bound on”; “upper-bounds” is more concise. Analogous statements concern lower bounds and limits.<br>\n    - Never write “a large number of”; “many” is more concise. Never write “a small number of”; “few” is more concise.<br>\n    - Never write “We refer to [symbol] as [name]”; “we call [symbol] [name]” is more concise.<br>\n    - Never write “as long as”; “if” is more concise.<br>\n    - Never write “a single”; “one” is more concise.<br>\n    - Never write “in case” or “in the case that”; “if” is more concise (and “in the case that” suffers from a grammatical error).<br>\n    - The symbol means “greater than”; and , “greater than or equal to.” Don’t translate into “strictly greater than”; the “strictly” is unnecessary. Analogous statements concern and .<br>\n  - Avoid contractions, which are too informal for professional writing.<br>\n  - The possessive is not a contraction and belongs in professional writing. It facilitates conciseness.<br>\n  - <br>\n                Use the word “for” only when it belongs. Physicists often write “for” when they mean “if,” “per,” “at,” or something else.<br>\n                <br>\n    - <br>\n                        Example of inappropriate use: The function vanishes for odd arguments.<br>\nCorrected statement: If the argument is odd, the function vanishes.<br>\n    - <br>\n                        Example of inappropriate use: We performed 10 trials for each parameter value.<br>\nCorrected statement: We performed 10 trials per parameter value.<br>\n    - <br>\n                        Example of inappropriate use: The function is smaller for small x values.<br>\nCorrected statement: The function is smaller at small x values.<br>\n  - Write “we evolve the state,” “we measure,” etc. only if you’re an experimentalist who undertakes those actions. Alternatives include “Consider measuring,” “Suppose the system evolves,” and the command tense (e.g., “One can measure this quantity as follows: prepare the qubit in . Evolve it under …”).<br>\n  - The condition defines a regime, not a limit. The conditions and define limits and are inequivalent to .<br>\n  - Write “first,” “second,” “last,” etc., not “firstly,” “secondly,” “lastly,” etc. (I defer in this matter to The Elements of Style.)<br>\n  - Humans can assume, suppose, etc. Mathematical expressions, protocols, etc. can’t.<br>\n  - One multiplies factors together and sums terms. Don’t call factors terms and vice versa.<br>\n  - If you mean “X equals Y,” say so. Don’t write “X agrees with Y,” “X matches Y,” or “we identify X with Y.” The latter three phrases are vaguer, and two of them contain more words, than “X equals Y.”<br>\n  - <br>\n                Regarding the words “general” and “generally”:<br>\n                <br>\n    - A general object subsumes every example of that object. If any example behaves unlike a supposedly general object, don’t call the object general.<br>\n    - <br>\n                        Many claims contain the term “general,” “generally,” or “in general” but don’t need the term.<br>\n                        <br>\n      - Example of a sentence that contains “generally”: The terms generally commute.<br>\n      - Equivalent, more concise sentence: The terms commute.<br>\n    - Physicists tend to use the words “general” and “generic” differently. By “general,” physicists usually mean “subsuming every example.” By “generic,” we usually mean “typical,” or “common.”<br>\n  - <br>\n                “Then” makes sense (i) in discussions of chronology and (ii) in if–then statements. Don’t use “then” outside these contexts.<br>\n                <br>\n    - Example of inappropriate use: “Define Then Y.”<br>\n    - Examples of appropriate alternatives <br>\n      - Define This definition implies Y.<br>\n      - If then Y.<br>\n      - Define such that Y.<br>\n  - Don’t justify any equation with “we used that [such-and-such is true],” which violates the rules of grammar. Grammatically correct alternatives include “We applied [a property],” “The equation follows from [a property],” and “…since [such-and-such is true].”<br>\n  - <br>\n                Regarding tense:<br>\n                <br>\n    - When describing what you’ve accomplished, use only one tense.<br>\n    - Experiments happened in the past, so describe them in the past tense.<br>\n    - <br>\n                        When describing a proof’s steps, use the present tense.<br>\n                        <br>\n      - Example: We Taylor-approximate the function about . Substituting into Eq. (1) yields [equation].<br>\n  - <br>\n                Nouns, verbs, and adjectives should agree about whether a quantity is singular or plural.<br>\n                <br>\n    - Example of singular–plural mismatch: The equations are a rule for evolving the cellular automaton.<br>\n    - Example alternative: The equations form a rule for evolving the cellular automaton.<br>\n  - <br>\n                “Admit of” means “allow for,” or “permit.” The phrase needs the “of.”<br>\n                <br>\n    - Example: The formula admits of the following interpretation.<br>\n  - Use a pronoun only if the reader can identify its antecedent without ambiguity.<br>\n  - “Spin” has many meanings: “a quantum property that resembles angular momentum,” “a particle endowed with that property,” “the observable ,” “the spin quantum number ,” “the observable ” “the magnetic spin quantum number ” and “the observable .” Leave no ambiguity about which object you have in mind.<br>\n  - When referring to an appendix or a supplementary note, specify which you have in mind. Don’t write “the appendix,” “the appendices,” “the supplementary material,” or the like. By guiding the reader more precisely, you’ll smooth their path toward learning more about your work.<br>\n  - The gerund is the verb form that ends in “ing.” If you attribute the gerund to a subject (e.g., to a person), use the possessive.<br>\n    - Example: The students’ organizing of the conference enhanced their leadership skills.<br>\n- <br>\n        Punctuation<br>\n        <br>\n  - Consider any list that contains at least three items. If no item contains a comma, separate the items with commas. If any item contains a comma, separate the items with semicolons.<br>\n  - In American English, periods and commas belong inside quotation marks. (Example: She told me, “Have a good day.”) In British English, periods and commas belong outside quotation marks. (Example: She told me, “Have a good day”.)<br>\n  - To write quotation marks in LaTeX, don’t use your keyboard’s quotation-mark key; use the appropriate keys.<br>\n  - <br>\n                Regarding hyphens:<br>\n                <br>\n    - The hyphen (-) feeds into punctuation of three types: the hyphen (-), the en dash (–), and the em dash (—).<br>\n    - The hyphen appears in some compound words, as in “non-negative.”<br>\n    - <br>\n                        In American English, em dashes can separate ideas within a sentence. Don’t separate any em dash from neighboring text with a space.<br>\n                        <br>\n      - Example of appropriate use: The sample—the only product of this experiment—barely survived.<br>\n      - Example of inappropriate use: The sample — the only product of this experiment — barely survived.<br>\n      - Example of appropriate use: He told me only one sample had survived—hardly what I wanted to hear.<br>\n    - <br>\n                        This article specifies how to use the en dash. One use is “to separate the names of two or more people used as a compound modifier.”<br>\n                        <br>\n      - Example: Feynman–Kitaev clock<br>\n    - Hyphenate compound adjectives.<br>\n    - <br>\n                        If an adverb ends in “-ly,” it probably shouldn’t precede a hyphen.<br>\n                        <br>\n      - Example of inappropriate hyphenation: strongly-coupled systems<br>\n    - Follow a prefix with a hyphen if and only if the Physical Review style guide indicates that you should.<br>\n  - A complete clause must follow any semicolon (unless the semicolon separates items in a list).<br>\n- <br>\n        Math<br>\n        <br>\n  - Introduce only necessary notation, which readers will have enough trouble remembering. If a mathematical symbol appears only once, eliminate it. If a symbol appears only twice, try to eliminate it.<br>\n  - Every sentence must obey the rules of English grammar, punctuation, and syntax, regardless of whether the sentence contains mathematical symbols. All math-containing sentences must end with punctuation marks. If a sentence contains a list of mathematical expressions, precede the final expressions with an “and.” If the list contains at least three mathematical expressions, separate them with commas.<br>\n  - Introduce almost every mathematical symbol before you use it. If you introduce a symbol after using it, the reader will encounter the first use, stop, feel confused for a while, tentatively continue, find the definition, return to the earlier use to understand it, and then progress again. This back-and-forth breaks up the reading process. You may define a mathematical symbol after using it only if (i) the symbol is very common, known to nearly all physicists, and unmistakeable and (ii) defining the symbol earlier would disrupt the text’s flow.<br>\n  - <br>\n                If you define a new function, denote it by only one letter. (I defer in this matter to the Physical Review style guide.)<br>\n                <br>\n    - Example:<br>\n    - Examples of disallowed notation: ,<br>\n  - <br>\n                Suppose that a superscript or subscript stands for a word or phrase without representing any variable or constant. The superscript/subscript must not be italicized. (I defer in this matter to Physical Review style guide.)<br>\n                <br>\n    - Example: Let denote the measurement outcome.<br>\n  - <br>\n                If a variable or constant appears in a superscript, parenthesize it. The parentheses communicate that the superscript isn’t an exponent.<br>\n                <br>\n    - Example: Let denote the Pauli- operator of qubit<br>\n    - If a superscript is not italicized (stands for a word or phrase), don’t parenthesize it.<br>\n  - <br>\n                Regarding the definition of a symbol :<br>\n                <br>\n    - If you write alone on one side of a defining equation, use \\coloneqq or \\eqqcolon: \\coloneqq [expression], or [expression] \\eqqcolon . The symbols \\coloneqq and \\eqqcolon relate more information than does , encoding directionality.<br>\n    - Use if does not appear alone on its side of the equation: [function of ] [result of replacing with its definition in the equation’s left-hand side].<br>\n  - <br>\n                Refer to the Cartesian axes using the formatting “[italicized letter]-axis.” Don’t include any hat, boldface, or \\vec symbol.<br>\n                <br>\n    - Example: -axis<br>\n  - Avoid denoting any index by , which means to physicists. Use instead, unless you’re writing for engineers (who denote by ).<br>\n  - Don’t use the lowercase letter l (“ell”) as an index; readers might mistake it for a one. Use (\\ell) instead.<br>\n  - Give every set-off equation a number. Readers (and coauthors) may want to refer to the equation easily when discussing the paper. Save them (and us) from having to say, e.g., “that equation halfway down page three.”<br>\n  - When writing a set-off mathematical expression, use the align environment, not the equation environment. Using the align environment, one can easily extend an expression across multiple lines.<br>\n  - <br>\n                Regarding a set-off mathematical expression that extends across multiple lines:<br>\n                <br>\n    - <br>\n                        Format the expression as follows by default.<br>\n                        <br>\n      - Put an & symbol immediately leftward of the first = sign or analogous symbol (e.g., ).<br>\n      - If any subsequent line begins with another = sign (or analogous symbol), put an & immediately leftward of the symbol. (I’ll stop writing “or analogous symbol.”)<br>\n      - Suppose that a subsequent line begins with a , –, , or . Find the symbol immediately rightward of the initial = sign. Begin the new line directly below that symbol.<br>\n      - Example:<br>\n    - <br>\n                        Modify the default formatting if necessary (a) to reduce the number of lines used in a PRL submission or (b) if the initial = appears awkwardly far to the right.<br>\n                        <br>\n      - Example of (b):<br>\n    - <br>\n                        Suppose a new line begins with a term or factor, such as the  in the example under (A). Put the corresponding , –, , or  at the beginning of the new line, not at the end of the previous line.<br>\n                        <br>\n      - Examples of inappropriate placement:<br>\n  - The symbol means “approximately equals”; and ~, “scales as.” Approximations convey more information than scaling relations do.<br>\n  - Use big-O-type notation or ~ symbols, not both; they’re partially redundant.<br>\n  - <br>\n                \\ldots, rather than \\cdots, should stand in for elements that fit a pattern.<br>\n                <br>\n    - Example:<br>\n  - <br>\n                When using \\ldots as in the previous rule, present at least two initial examples of the pattern. One can’t define the pattern.<br>\n                <br>\n    - Contains insufficient examples: For example, if is odd, then and fit the template.<br>\n  - Parentheses (), square brackets [], and curly braces {} are delimiters. If you nest them, do so in the order dictated by the Physical Review style guide. You may need to use boldface parentheses, encoded via \\bm{} commands enabled by the bm package.<br>\n  - If delimiters enclose a symbol, it shouldn’t protrude above or below them (unless the delimiters would have to be grotesquely enormous). Use the \\left and \\right commands if the delimiters appear on the same line.<br>\n  - <br>\n                An operator  isn’t a matrix; a matrix represents an operator in terms of a particular basis. Therefore, no equals sign should interrelate an  and a matrix. An arrow can.<br>\n                <br>\n    - Example:<br>\n  - Every real number is complex. Don’t say “complex” if you mean “nonreal.”<br>\n  - Consider introducing a mathematical symbol in a prose sentence without using a comma or colon. Put the symbol immediately after the word that names the object represented by the symbol.<br>\n    - Example of inappropriate placement: the set of real numbers<br>\n    - Examples of appropriate placements<br>\n      - the set of real numbers<br>\n      - the set of real numbers and<br>\n      - Recall the set of real numbers, , in Lemma 1.<br>\n- <br>\n        More mechanics of writing<br>\n        <br>\n  - Use concise sentences, as advocated for in The Elements of Style. The reader can hold only so many ideas in their head at once.<br>\n  - <br>\n                Structure sentences simply, as advocated for in The Elements of Style. The reader should be able to grasp each sentence easily.<br>\n                <br>\n    - Avoid nesting ideas within a sentence, to avoid convoluting the sentence’s structure.<br>\n    - Example of sentence with convoluted, nested structure: Any model of equilibrium and nonequilibrium behaviors of systems observed in tabletop experiments and high-energy colliders must obey the laws of relativistic quantum mechanics.<br>\n    - Visualization of the nesting: [Any model of ([(equilibrium and nonequilibrium) behaviors] of {systems observed in [(tabletop experiments) and (high-energy colliders)]})] must obey [the laws of (relativistic quantum mechanics)].<br>\n  - The ideal paper title has the structure of a newspaper headline: it presents a claim, containing a subject and a predicate.<br>\n  - <br>\n                Regarding abbreviations:<br>\n                <br>\n    - Don’t abbreviate the first word in any sentence.<br>\n    - Abbreviate “Figure,” “Section,” “Professor,” and “Appendix” if such a word appears partway through a sentence.<br>\n    - Don’t abbreviate “Sections.”<br>\n  - <br>\n                Regarding acronyms:<br>\n                <br>\n    - Write every acronym in capital letters, as per the Physical Review style guide.<br>\n    - Introduce each acronym the first time you use it.<br>\n    - Thereafter, use only the acronym, not the spelled-out phrase, throughout the rest of the document’s main text. You may spell out the phrase in section, figure, and table titles if doing so improves the document’s clarity.<br>\n  - Every paragraph should contain at least three sentences.<br>\n  - Wherever you insert a blank line into your LateX code, a new paragraph begins in the corresponding PDF. Insert a blank line only if you wish to begin a new paragraph. This advice applies immediately before and after set-off equations.<br>\n  - Never begin a subsection immediately after a section title. Between the two titles, overview the section. Analogous rules govern subsections and subsubsections.<br>\n  - <br>\n                Put the word “only” in the appropriate place.<br>\n                <br>\n    - For example, suppose you’ve sampled data at a point in parameter space and sampled data at no other points. “We sampled data only at ” is correct; “We only sampled data at ” is probably not. The latter claim means that (i) you might have sampled data at and (ii) you did nothing to the data apart from sample it: you didn’t analyze the data, discuss the data, etc.<br>\n  - Specify subjects and objects precisely. Often, a physicist will describe an idea in multiple lines. In the following sentence, the physicist will attempt to encapsulate the idea in the word “this.” The pronoun is too vague to specify the idea. This what? Follow the pronoun with a noun.<br>\n- <br>\n        When in doubt, consult the Physical Review style guide or The Elements of Style.<br>\n        <br>\n  - If those references don’t contain the information you seek, search for it in online writing guides. Not all such guides have equal merit, however. Lean toward guides written by human editors or published by college writing centers.<br>\n1 Collaborators have wondered why I use green; a student guessed it’s my favorite color. It isn’t; but I bleed green, having graduated from the Big Green, also known as Dartmouth College. Sometimes, I highlight certain pieces of text for one reason (e.g., to point out logical inconsistencies) and other text for another reason (e.g., to point out grammatical inconsistencies). Green distinguishes the first highlightings, while orange distinguishes the second: when not bleeding Dartmouth green, I bleed Caltech orange.<br>\n2 Don’t learn how to write from physics papers.<\/p>","content_hash":"cb63495572f799cafd887f5e70ed4de7","author":"Nicole Yunger Halpern","published_at":"2026-08-26T23:53:01","fetched_at":"2026-11-12 06:22:53","word_count":3986,"read_time_minutes":20,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"11w","domain":"quantumfrontiers.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-11-12 06:22:51","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"145w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-11-12 06:22:51","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"151w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-11-12 06:22:52","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"152w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":null,"content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-11-12 06:22:52","word_count":79,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"154w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":null,"content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-11-12 06:22:52","word_count":76,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"156w","domain":"medium.com"},{"id":"1ed <script type="module">

  // ═══════════════════════════════════════════════════════════════
  // D.0  PRETEXT IMPORT (dynamic, with canvas fallback)
  // ═══════════════════════════════════════════════════════════════

  var _pretext = null;
  try {
    var mod = await import('https://cdn.jsdelivr.net/npm/@chenglou/pretext@0.0.3/dist/layout.js');
    _pretext = { prepare: mod.prepare, layout: mod.layout };
  } catch (e) {
    // CDN unreachable — fall back to canvas-only measurement
  }

  // ═══════════════════════════════════════════════════════════════
  // D.1  COLOR CONSTANTS
  // ═══════════════════════════════════════════════════════════════

  function readColors() {
    var s = getComputedStyle(document.documentElement);
    return {
      bg:      s.getPropertyValue('--bg').trim(),
      card:    s.getPropertyValue('--card').trim(),
      text:    s.getPropertyValue('--text').trim(),
      dim:     s.getPropertyValue('--dim').trim(),
      muted:   s.getPropertyValue('--muted').trim(),
      up:      s.getPropertyValue('--up').trim(),
      down:    s.getPropertyValue('--down').trim(),
      accent:  s.getPropertyValue('--accent').trim(),
      spark:   s.getPropertyValue('--spark').trim(),
      score:   s.getPropertyValue('--score').trim(),
      link:    s.getPropertyValue('--link').trim(),
      hoverBg: 'rgba(45, 43, 40, 0.03)',
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.2  FONT CONSTANTS
  // ═══════════════════════════════════════════════════════════════

  var FONTS = {
    cardHeader:   '500 8px "IBM Plex Mono", monospace',
    metricName:   '400 8px "IBM Plex Mono", monospace',
    metricValue:  '500 10px "IBM Plex Mono", monospace',
    metricChange: '400 8px "IBM Plex Mono", monospace',
    newsScore:    '500 8px "IBM Plex Mono", monospace',
    newsTitle:    '400 9px "IBM Plex Mono", monospace',
    newsDomain:   '400 7px "IBM Plex Mono", monospace',
    newsMeta:     '400 7px "IBM Plex Mono", monospace',
  };

  // ═══════════════════════════════════════════════════════════════
  // D.3  TEXT MEASUREMENT
  // ═══════════════════════════════════════════════════════════════

  function withAlpha(color, alpha) {
    if (color.charAt(0) === '#') {
      var r = parseInt(color.slice(1, 3), 16);
      var g = parseInt(color.slice(3, 5), 16);
      var b = parseInt(color.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }
    // Handle rgb() format
    var m = color.match(/[\d.]+/g);
    if (m && m.length >= 3) {
      return 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',' + alpha + ')';
    }
    return color;
  }

  var _measureCanvas = document.createElement('canvas');
  var _measureCtx = _measureCanvas.getContext('2d');

  function measureWidth(text, font) {
    _measureCtx.font = font;
    return _measureCtx.measureText(text).width;
  }

  // Pretext-powered multi-line height prediction (canvas fallback for single line)
  function measureTextHeight(text, font, maxWidth, lineHeight) {
    if (_pretext) {
      var prepared = _pretext.prepare(text, font);
      return _pretext.layout(prepared, maxWidth, lineHeight);
    }
    // Fallback: assume single line if text fits, else estimate line count
    var w = measureWidth(text, font);
    var lines = Math.max(1, Math.ceil(w / maxWidth));
    return { height: lines * lineHeight, lineCount: lines };
  }

  function truncateText(text, font, maxWidth) {
    var fullWidth = measureWidth(text, font);
    if (fullWidth <= maxWidth) return text;

    var ellipsis = '\u2026';
    var ellipsisWidth = measureWidth(ellipsis, font);
    var targetWidth = maxWidth - ellipsisWidth;
    if (targetWidth <= 0) return ellipsis;

    var lo = 0, hi = text.length;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (measureWidth(text.slice(0, mid), font) <= targetWidth) {
        lo = mid;
      } else {
        hi = mid - 1;
      }
    }
    return text.slice(0, lo) + ellipsis;
  }

  // ═══════════════════════════════════════════════════════════════
  // D.3b MASONRY LAYOUT ENGINE (pure JS positioning)
  // ═══════════════════════════════════════════════════════════════

  function computeMetricMinWidth(group) {
    var PAD = 4, GAP = 4, SPARK_W = 56;
    var metrics = group.metrics || [];
    if (metrics.length === 0) return 220;

    var nameWidths = metrics.map(function(m) { return measureWidth(m.name || '', FONTS.metricName); });
    var maxName = Math.max.apply(null, nameWidths);
    var valueWidths = metrics.map(function(m) { return measureWidth(m.formatted_value || '', FONTS.metricValue); });
    var maxValue = Math.max.apply(null, valueWidths);
    var changeTexts = metrics.map(function(m) {
      var t = m.formatted_change || '';
      if (m.change_period) t += ' ' + m.change_period;
      return t;
    });
    var changeWidths = changeTexts.map(function(t) { return measureWidth(t, FONTS.metricChange); });
    var maxChange = Math.max.apply(null, changeWidths);

    return PAD * 2 + maxName + GAP * 3 + SPARK_W + maxValue + maxChange;
  }

  function indexOfMin(arr) {
    var minIdx = 0;
    for (var i = 1; i < arr.length; i++) {
      if (arr[i] < arr[minIdx]) minIdx = i;
    }
    return minIdx;
  }

  function layoutDashboard(wrappers, data, gap) {
    var container = document.querySelector('.dashboard');
    var viewportWidth = container.clientWidth;
    if (viewportWidth < 1) return;

    // 1. Build card descriptors with measured min widths
    var cards = [];
    for (var i = 0; i < wrappers.length; i++) {
      var w = wrappers[i];
      var type = w.dataset.cardType;
      var cardData = null, minW = 220;

      if (type === 'metric') {
        var idx = parseInt(w.dataset.cardIndex, 10);
        cardData = data.metric_groups[idx];
        if (cardData) minW = computeMetricMinWidth(cardData);
      } else {
        var feedId = w.dataset.feedId;
        for (var f = 0; f < data.feeds.length; f++) {
          if (data.feeds[f].id === feedId) { cardData = data.feeds[f]; break; }
        }
        minW = 280;
      }
      cards.push({ wrapper: w, type: type, data: cardData, minWidth: minW });
    }

    // 2. Column count derived from widest card's measured width
    var allMinWidths = cards.map(function(c) { return c.minWidth; });
    var minColWidth = allMinWidths.length ? Math.max.apply(null, allMinWidths) : 260;
    minColWidth = Math.max(minColWidth, 220);

    var colCount = Math.max(1, Math.floor((viewportWidth + gap) / (minColWidth + gap)));
    var colWidth = (viewportWidth - (colCount - 1) * gap) / colCount;

    // 3. Masonry: pack each card into the shortest column
    var BORDER = 2; // 1px border top + 1px border bottom on .card-wrapper
    var colHeights = [];
    for (var c = 0; c < colCount; c++) colHeights.push(0);

    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var isNews = card.type === 'news';

      // Card height from content (news cards use pretext-measured variable heights)
      var cardH;
      if (isNews && card.data) {
        var newsLayout = computeNewsCardLayout(card.data, colWidth);
        cardH = newsLayout.totalHeight;
      } else {
        var headerH = 16, rowH = 16;
        var rowCount = (card.data && card.data.metrics) ? card.data.metrics.length : 0;
        cardH = headerH + rowCount * rowH;
      }

      // Find shortest column
      var bestCol = indexOfMin(colHeights);
      var bestY = colHeights[bestCol];

      // Position card
      var x = bestCol * (colWidth + gap);
      card.wrapper.style.left = Math.round(x) + 'px';
      card.wrapper.style.top = Math.round(bestY) + 'px';
      card.wrapper.style.width = Math.round(colWidth) + 'px';

      // Update column height (account for wrapper border)
      colHeights[bestCol] = bestY + cardH + BORDER + gap;
    }

    // 4. Set container height
    container.style.height = Math.round(Math.max.apply(null, colHeights)) + 'px';
  }

  // ═══════════════════════════════════════════════════════════════
  // D.4  METRIC CARD LAYOUT
  // ═══════════════════════════════════════════════════════════════

  function computeMetricCardLayout(group, containerWidth) {
    var PAD = 4;
    var GAP = 4;
    var HEADER_H = 16;
    var ROW_H = 16;
    var SPARK_W = 56;

    var metrics = group.metrics || [];

    var nameWidths = metrics.map(function(m) {
      return measureWidth(m.name || '', FONTS.metricName);
    });
    var valueWidths = metrics.map(function(m) {
      return measureWidth(m.formatted_value || '', FONTS.metricValue);
    });

    var changeTexts = metrics.map(function(m) {
      var t = m.formatted_change || '';
      if (m.change_period) t += ' ' + m.change_period;
      return t;
    });
    var changeWidths = changeTexts.map(function(t) {
      return measureWidth(t, FONTS.metricChange);
    });

    var maxValue = valueWidths.length ? Math.max.apply(null, valueWidths) : 0;
    var maxChange = changeWidths.length ? Math.max.apply(null, changeWidths) : 0;

    var fixedWidth = PAD * 2 + GAP * 3 + SPARK_W + maxValue + maxChange;
    var nameCol = Math.max(containerWidth - fixedWidth, 40);

    // Ensure value and change columns don't overlap
    var valueX = PAD + nameCol + GAP + SPARK_W + GAP;
    var changeX = containerWidth - PAD - maxChange;
    if (valueX + maxValue + GAP > changeX) {
      // Shrink sparkline to make room
      var overflow = (valueX + maxValue + GAP) - changeX;
      SPARK_W = Math.max(SPARK_W - overflow, 20);
      valueX = PAD + nameCol + GAP + SPARK_W + GAP;
    }

    var cols = {
      name:   { x: PAD, width: nameCol },
      spark:  { x: PAD + nameCol + GAP, width: SPARK_W },
      value:  { x: valueX, width: maxValue },
      change: { x: changeX, width: maxChange },
    };

    return {
      headerHeight: HEADER_H,
      rowHeight: ROW_H,
      padding: PAD,
      columns: cols,
      totalHeight: HEADER_H + metrics.length * ROW_H,
      changeTexts: changeTexts,
      _metricCount: metrics.length,
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.5  NEWS CARD LAYOUT
  // ═══════════════════════════════════════════════════════════════

  function computeNewsCardLayout(feed, containerWidth) {
    var PAD = 4;
    var GAP = 6;
    var HEADER_H = 16;
    var ROW_H = 18;

    var stories = feed.stories || [];

    var scoreWidths = stories.map(function(s) {
      return measureWidth(String(s.score || 0), FONTS.newsScore);
    });
    var scoreCol = scoreWidths.length ? Math.max(Math.max.apply(null, scoreWidths), 20) : 20;

    var metaTexts = stories.map(function(s) {
      return (s.time_ago || '') + ' ' + (s.comments || 0) + 'c';
    });
    var metaWidths = metaTexts.map(function(t) {
      return measureWidth(t, FONTS.newsMeta);
    });
    var metaCol = metaWidths.length ? Math.max(Math.max.apply(null, metaWidths), 30) : 30;

    var titleX = PAD + scoreCol + GAP;
    var titleWidth = Math.max(containerWidth - titleX - GAP - metaCol - PAD, 60);

    // Measure each title height via pretext (supports multi-line wrapping)
    var rowYOffsets = [];
    var y = HEADER_H;
    var rowHeights = stories.map(function(s) {
      var h = measureTextHeight(s.title || '', FONTS.newsTitle, titleWidth, ROW_H);
      rowYOffsets.push(y);
      var rh = Math.max(h.height, ROW_H); // at least one row tall
      y += rh;
      return rh;
    });

    return {
      headerHeight: HEADER_H,
      rowHeight: ROW_H,
      padding: PAD,
      columns: {
        score: { x: PAD, width: scoreCol },
        title: { x: titleX, width: titleWidth },
        meta:  { x: containerWidth - PAD - metaCol, width: metaCol },
      },
      totalHeight: y,
      rowHeights: rowHeights,
      rowYOffsets: rowYOffsets,
      metaTexts: metaTexts,
      _storyCount: stories.length,
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.6  DRAWING FUNCTIONS
  // ═══════════════════════════════════════════════════════════════

  function drawCardHeader(ctx, name, width, headerHeight, colors) {
    // Header background
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, width, headerHeight);

    // Header bottom border
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(0, headerHeight - 0.5);
    ctx.lineTo(width, headerHeight - 0.5);
    ctx.stroke();

    // Chevron
    ctx.font = FONTS.cardHeader;
    ctx.fillStyle = colors.muted;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('>', 4, headerHeight / 2);

    // Section name
    ctx.fillStyle = colors.accent;
    var chevronWidth = measureWidth('> ', FONTS.cardHeader);
    ctx.fillText(name.toUpperCase(), 4 + chevronWidth, headerHeight / 2);
  }

  function drawDottedSeparator(ctx, y, width, colors) {
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1;
    ctx.setLineDash([1, 2]);
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(width, y + 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawSparkline(ctx, values, x, y, width, height, colors) {
    if (!values || values.length < 2) return;

    var min = Infinity, max = -Infinity;
    for (var i = 0; i < values.length; i++) {
      if (values[i] < min) min = values[i];
      if (values[i] > max) max = values[i];
    }
    var range = max - min;
    if (range === 0) range = 1;

    var pad = 3;
    var drawH = height - pad * 2;
    var drawW = width;
    var stepX = drawW / (values.length - 1);

    ctx.save();
    ctx.beginPath();

    for (var i = 0; i < values.length; i++) {
      var px = x + i * stepX;
      var py = y + pad + drawH - ((values[i] - min) / range) * drawH;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    ctx.strokeStyle = colors.spark;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // Area fill with gradient
    ctx.lineTo(x + drawW, y + height);
    ctx.lineTo(x, y + height);
    ctx.closePath();

    var grad = ctx.createLinearGradient(0, y, 0, y + height);
    grad.addColorStop(0, withAlpha(colors.spark, 0.09));
    grad.addColorStop(1, withAlpha(colors.spark, 0.01));
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.restore();
  }

  function drawMetricRow(ctx, metric, rowIndex, layout, colors, changeText, isHovered) {
    var y = layout.headerHeight + rowIndex * layout.rowHeight;
    var cols = layout.columns;

    // Hover background
    if (isHovered) {
      ctx.fillStyle = colors.hoverBg;
      ctx.fillRect(0, y, cols.change.x + cols.change.width + layout.padding, layout.rowHeight);
    }

    var textY = y + layout.rowHeight * 0.72;

    // Metric name (truncate if needed)
    ctx.font = FONTS.metricName;
    ctx.fillStyle = colors.dim;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    var displayName = truncateText(metric.name || '', FONTS.metricName, cols.name.width);
    ctx.fillText(displayName, cols.name.x, textY);

    // Sparkline
    var sparkValues = metric.sparkline_values;
    if (sparkValues && sparkValues.length >= 2) {
      drawSparkline(ctx, sparkValues, cols.spark.x, y + 1, cols.spark.width, layout.rowHeight - 2, colors);
    }

    // Value (right-aligned within value column)
    ctx.font = FONTS.metricValue;
    ctx.fillStyle = colors.text;
    ctx.textAlign = 'right';
    ctx.fillText(metric.formatted_value || '', cols.value.x + cols.value.width, textY);

    // Change (right-aligned)
    ctx.font = FONTS.metricChange;
    if (metric.change_class === 'up') {
      ctx.fillStyle = colors.up;
    } else if (metric.change_class === 'down') {
      ctx.fillStyle = colors.down;
    } else {
      ctx.fillStyle = colors.dim;
    }
    ctx.textAlign = 'right';
    ctx.fillText(changeText, cols.change.x + cols.change.width, textY);

    // Row separator (except last row)
    var totalMetrics = (layout._metricCount !== undefined) ? layout._metricCount : 999;
    if (rowIndex < totalMetrics - 1) {
      drawDottedSeparator(ctx, y + layout.rowHeight, cols.change.x + cols.change.width + layout.padding, colors);
    }
  }

  function drawNewsRow(ctx, story, rowIndex, layout, colors, metaText, isHovered) {
    var y = layout.rowYOffsets ? layout.rowYOffsets[rowIndex] : (layout.headerHeight + rowIndex * layout.rowHeight);
    var rh = layout.rowHeights ? layout.rowHeights[rowIndex] : layout.rowHeight;
    var cols = layout.columns;

    // Hover background
    if (isHovered) {
      ctx.fillStyle = colors.hoverBg;
      ctx.fillRect(0, y, cols.meta.x + cols.meta.width + layout.padding, rh);
    }

    var textY = y + layout.rowHeight * 0.68;

    // Score (right-aligned)
    ctx.font = FONTS.newsScore;
    ctx.fillStyle = colors.score;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'right';
    ctx.fillText(String(story.score || 0), cols.score.x + cols.score.width, textY);

    // Title (truncated) + domain
    ctx.font = FONTS.newsTitle;
    ctx.fillStyle = colors.text;
    ctx.textAlign = 'left';
    var titleText = story.title || '';
    var domainText = story.domain ? ' (' + story.domain + ')' : '';
    var domainWidth = domainText ? measureWidth(domainText, FONTS.newsDomain) : 0;
    var availableForTitle = cols.title.width - domainWidth - 2;
    var displayTitle = truncateText(titleText, FONTS.newsTitle, availableForTitle);
    ctx.fillText(displayTitle, cols.title.x, textY);

    // Domain (after title)
    if (domainText) {
      var titleDisplayWidth = measureWidth(displayTitle, FONTS.newsTitle);
      ctx.font = FONTS.newsDomain;
      ctx.fillStyle = colors.dim;
      ctx.fillText(domainText, cols.title.x + titleDisplayWidth + 1, textY);
    }

    // Meta (time + comments, right-aligned)
    ctx.font = FONTS.newsMeta;
    ctx.fillStyle = colors.dim;
    ctx.textAlign = 'right';

    // Draw time and comments link separately
    var timeText = story.time_ago || '';
    var commentsText = (story.comments || 0) + 'c';
    var commentsWidth = measureWidth(commentsText, FONTS.newsMeta);
    var timeWidth = measureWidth(timeText, FONTS.newsMeta);
    var spacing = measureWidth(' ', FONTS.newsMeta);

    var metaRight = cols.meta.x + cols.meta.width;

    // Comments (right side, link-colored)
    ctx.fillStyle = colors.link;
    ctx.fillText(commentsText, metaRight, textY);

    // Time (left of comments)
    ctx.fillStyle = colors.dim;
    ctx.fillText(timeText, metaRight - commentsWidth - spacing, textY);

    // Row separator (except last row)
    var totalStories = (layout._storyCount !== undefined) ? layout._storyCount : 999;
    if (rowIndex < totalStories - 1) {
      drawDottedSeparator(ctx, y + rh, cols.meta.x + cols.meta.width + layout.padding, colors);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // D.7  CARD RENDER ORCHESTRATORS
  // ═══════════════════════════════════════════════════════════════

  function setupCanvas(canvas, logicalWidth, logicalHeight) {
    var dpr = window.devicePixelRatio || 1;
    var pw = Math.round(logicalWidth * dpr);
    var ph = Math.round(logicalHeight * dpr);
    // Only resize when dimensions change (avoids GPU buffer reallocation on hover)
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
      canvas.style.width = logicalWidth + 'px';
      canvas.style.height = logicalHeight + 'px';
    }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, logicalWidth, logicalHeight);
    return ctx;
  }

  function renderMetricCard(wrapper, group, colors, hoverIndex) {
    var canvas = wrapper.querySelector('canvas');
    var width = wrapper.clientWidth;
    if (width < 1) return;

    var layout = computeMetricCardLayout(group, width);
    wrapper._layout = layout;
    wrapper._data = group;

    var ctx = setupCanvas(canvas, width, layout.totalHeight);

    // Card background
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, width, layout.totalHeight);

    // Header
    drawCardHeader(ctx, group.name, width, layout.headerHeight, colors);

    // Metric rows
    var metrics = group.metrics || [];
    for (var i = 0; i < metrics.length; i++) {
      drawMetricRow(ctx, metrics[i], i, layout, colors, layout.changeTexts[i], i === hoverIndex);
    }

    // Accessibility
    var label = group.name + ': ' + metrics.map(function(m) {
      return m.name + ' ' + (m.formatted_value || '');
    }).join(', ');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', label);
  }

  function renderNewsCard(wrapper, feed, colors, hoverIndex) {
    var canvas = wrapper.querySelector('canvas');
    var width = wrapper.clientWidth;
    if (width < 1) return;

    var layout = computeNewsCardLayout(feed, width);
    var stories = feed.stories || [];
    wrapper._layout = layout;
    wrapper._data = feed;

    var ctx = setupCanvas(canvas, width, layout.totalHeight);

    // Card background
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, width, layout.totalHeight);

    // Header
    drawCardHeader(ctx, feed.name, width, layout.headerHeight, colors);

    // News rows
    for (var i = 0; i < stories.length; i++) {
      drawNewsRow(ctx, stories[i], i, layout, colors, layout.metaTexts[i], i === hoverIndex);
    }

    // Only create/update link overlays on initial render or resize, not on hover
    if (!wrapper._overlaysCreated || wrapper._lastOverlayWidth !== width) {
      createLinkOverlays(wrapper, stories, layout);
      wrapper._overlaysCreated = true;
      wrapper._lastOverlayWidth = width;
    }

    // Accessibility
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', feed.name + ' feed: ' + stories.length + ' stories');
  }

  // ═══════════════════════════════════════════════════════════════
  // D.8  LINK OVERLAYS
  // ═══════════════════════════════════════════════════════════════

  function createLinkOverlays(wrapper, stories, layout) {
    var linksDiv = wrapper.querySelector('.links');
    linksDiv.innerHTML = '';

    for (var i = 0; i < stories.length; i++) {
      var story = stories[i];
      var rowY = layout.rowYOffsets ? layout.rowYOffsets[i] : (layout.headerHeight + i * layout.rowHeight);
      var rh = layout.rowHeights ? layout.rowHeights[i] : layout.rowHeight;

      // Title link
      var a = document.createElement('a');
      a.href = story.url || ('https://news.ycombinator.com/item?id=' + story.id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', story.title);
      a.style.cssText = 'top:' + rowY + 'px;left:' + layout.columns.title.x + 'px;width:' + layout.columns.title.width + 'px;height:' + rh + 'px;';
      linksDiv.appendChild(a);

      // HN comments link
      var hn = document.createElement('a');
      hn.href = 'https://news.ycombinator.com/item?id=' + story.id;
      hn.target = '_blank';
      hn.rel = 'noopener';
      hn.setAttribute('aria-label', (story.comments || 0) + ' comments on Hacker News');
      var commentsWidth = measureWidth((story.comments || 0) + 'c', FONTS.newsMeta);
      var hnLeft = layout.columns.meta.x + layout.columns.meta.width - commentsWidth;
      hn.style.cssText = 'top:' + rowY + 'px;left:' + hnLeft + 'px;width:' + commentsWidth + 'px;height:' + rh + 'px;';
      linksDiv.appendChild(hn);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // D.9  HOVER SYSTEM
  // ═══════════════════════════════════════════════════════════════

  function attachHoverHandlers(wrapper, colors) {
    var canvas = wrapper.querySelector('canvas');
    var currentHover = -1;

    canvas.addEventListener('mousemove', function(e) {
      var layout = wrapper._layout;
      if (!layout) return;

      var rect = canvas.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var row;
      if (layout.rowYOffsets) {
        // Variable-height rows: binary search for the row containing y
        row = -1;
        for (var r = 0; r < layout.rowYOffsets.length; r++) {
          var ry = layout.rowYOffsets[r];
          var rh = layout.rowHeights[r];
          if (y >= ry && y < ry + rh) { row = r; break; }
        }
      } else {
        row = Math.floor((y - layout.headerHeight) / layout.rowHeight);
        var maxRow = wrapper.dataset.cardType === 'metric'
          ? (layout._metricCount || 0) - 1
          : (layout._storyCount || 0) - 1;
        if (row < 0 || row > maxRow) row = -1;
      }

      if (row !== currentHover) {
        currentHover = row;
        if (wrapper.dataset.cardType === 'metric') {
          renderMetricCard(wrapper, wrapper._data, colors, row);
        } else {
          renderNewsCard(wrapper, wrapper._data, colors, row);
        }
      }
    });

    canvas.addEventListener('mouseleave', function() {
      if (currentHover !== -1) {
        currentHover = -1;
        if (wrapper.dataset.cardType === 'metric') {
          renderMetricCard(wrapper, wrapper._data, colors, -1);
        } else {
          renderNewsCard(wrapper, wrapper._data, colors, -1);
        }
      }
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // D.10 RESIZE OBSERVER
  // ═══════════════════════════════════════════════════════════════

  function setupResizeObserver(wrappers, colors) {
    if (!window.ResizeObserver) return;

    var resizeTimeout = null;
    var observer = new ResizeObserver(function() {
      if (resizeTimeout) clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        layoutDashboard(wrappers, DASHBOARD_DATA, 3);
        renderAllCards(wrappers, colors);
      }, 50);
    });

    observer.observe(document.querySelector('.dashboard'));
    return observer;
  }

  // ═══════════════════════════════════════════════════════════════
  // D.11 INITIALIZATION
  // ═══════════════════════════════════════════════════════════════

  function renderAllCards(wrappers, colors) {
    var data = DASHBOARD_DATA;

    wrappers.forEach(function(wrapper) {
      var type = wrapper.dataset.cardType;
      if (type === 'metric') {
        var idx = parseInt(wrapper.dataset.cardIndex, 10);
        var group = data.metric_groups[idx];
        if (group) renderMetricCard(wrapper, group, colors, -1);
      } else if (type === 'news') {
        var feedId = wrapper.dataset.feedId;
        var feed = null;
        for (var i = 0; i < data.feeds.length; i++) {
          if (data.feeds[i].id === feedId) { feed = data.feeds[i]; break; }
        }
        if (feed) renderNewsCard(wrapper, feed, colors, -1);
      }
    });
  }

  function initDashboard() {
    var colors = readColors();
    var wrappers = Array.prototype.slice.call(document.querySelectorAll('.card-wrapper'));

    // Compute masonry layout from measured text, then render canvases
    layoutDashboard(wrappers, DASHBOARD_DATA, 3);
    renderAllCards(wrappers, colors);

    // Attach hover handlers
    wrappers.forEach(function(wrapper) {
      attachHoverHandlers(wrapper, colors);
    });

    // Responsive resize
    setupResizeObserver(wrappers, colors);

    // ═════════════════════════════════════════════════════════════
    // D.12 DEBUG MODE
    // ═════════════════════════════════════════════════════════════

    if (location.search.indexOf('debug=1') !== -1) {
      wrappers.forEach(function(wrapper) {
        var canvas = wrapper.querySelector('canvas');
        var ctx = canvas.getContext('2d');
        var dpr = window.devicePixelRatio || 1;
        var layout = wrapper._layout;
        if (!layout) return;

        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.lineWidth = 0.5;
        ctx.setLineDash([2, 2]);

        // Column boundaries
        var cols = layout.columns;
        Object.keys(cols).forEach(function(key) {
          var col = cols[key];
          ctx.beginPath();
          ctx.moveTo(col.x, 0);
          ctx.lineTo(col.x, layout.totalHeight);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(col.x + col.width, 0);
          ctx.lineTo(col.x + col.width, layout.totalHeight);
          ctx.stroke();
        });

        // Row boundaries
        ctx.strokeStyle = 'rgba(0, 0, 255, 0.2)';
        if (layout.rowYOffsets) {
          // Variable-height rows
          for (var r = 0; r < layout.rowYOffsets.length; r++) {
            var ry = layout.rowYOffsets[r];
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
          // Bottom edge of last row
          if (layout.rowYOffsets.length > 0) {
            var lastIdx = layout.rowYOffsets.length - 1;
            var ry = layout.rowYOffsets[lastIdx] + layout.rowHeights[lastIdx];
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
        } else {
          var rowH = layout.rowHeight;
          var count = layout._metricCount || layout._storyCount || 0;
          for (var r = 0; r <= count; r++) {
            var ry = layout.headerHeight + r * rowH;
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
        }

        ctx.restore();
      });
    }
  }

  // Wait for IBM Plex Mono to load before measuring/rendering
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 8px "IBM Plex Mono"'),
      document.fonts.load('500 10px "IBM Plex Mono"'),
    ]).then(initDashboard).catch(function() {
      // Font load failed (CDN down?), render with fallback monospace
      initDashboard();
    });
  } else {
    // Fallback for browsers without Font Loading API
    window.addEventListener('load', initDashboard);
  }

</script>

</body>
</html>
