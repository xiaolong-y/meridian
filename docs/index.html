 to have dinner with the Senior Fellows on Monday nights. It was a rather stuffy occasion. And, though I don’t think they do this anymore, after a sumptuous meal we would literally retire for brandy and cigars. Once, while puffing on his cigar after dinner, Mark had an inspiration. He gathered up a few junior fellows and led them to a theater for a movie he thought everyone should see right away. The movie was Conan the Barbarian. And everyone had a blast. That was a perfect Mark moment.<br>\nAs the news about Mark has spread, accolades have poured in from physicists all over the world. He was admired not just for his scientific brilliance, but almost as much for his quirky sense of humor and his kindness. Mark was a wonderful friend to many of us. When you were with him, you were sure to laugh and feel good. He touched the lives of countless colleagues, students and friends. We miss him terribly but there are so many memories that we’ll cherish. We are all so very fortunate to have known and loved Professor Mark Wise.<\/p>","content_hash":"16ba809d0f95d93d22fda6941a21cb29","author":"preskill","published_at":"2026-07-18T14:51:44","fetched_at":"2026-09-26 15:39:44","word_count":1258,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"10w","domain":"quantumfrontiers.com"},{"id":"b545e0dccbf6b2f6","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9940","title":"Held Prize call for nominations (+ call for postdocs)","url":"https://scottaaronson.blog/?p=9940","summary":"Here at the National Academy of Sciences, it seems that my first job is to serve on the selection committee for the prestigious Michael and Sheila Held Prize in combinatorial and discrete optimization and related areas. The committee chair, my former MIT colleague Madhu Sudan (now at Harvard), invited me to share the following message here on Shtetl-Optimized. (I&#8217;d add: put in the effort to nominate someone, and you can actually influence how things go!) Dear Colleagues I am writing to see","content":"<p>Held Prize call for nominations (+ call for postdocs)<br>\nHere at the National Academy of Sciences, it seems that my first job is to serve on the selection committee for the prestigious Michael and Sheila Held Prize in combinatorial and discrete optimization and related areas. The committee chair, my former MIT colleague Madhu Sudan (now at Harvard), invited me to share the following message here on Shtetl-Optimized. (I’d add: put in the effort to nominate someone, and you can actually influence how things go!)<br>\nDear Colleagues<br>\nI am writing to seek nominations for the 2027 Michael and Sheila Held Prize. The scope of the prize and nomination needs are described below. If you intend to nominate someone I would appreciate a heads up by email to madhu@cs.harvard.edu one month before the deadline (so email by Sept 8, 2026) to let me know your nomination is coming. (We may also reach out to you in response to coordinate multiple/overlapping nominations.)<br>\nThe Held prize honors outstanding, innovative, creative, and influential research in the areas of combinatorial and discrete optimization, or related parts of computer science, such as the design and analysis of algorithms and complexity theory. This $100,000 prize is intended to recognize recent work (defined as published within the last eight years, i.e., on or after October 6, 2018).<br>\nAll nominations must be submitted online by Monday, October 5, 2026 and include:<br>\n1. Nomination letter describing the candidate’s work and why he or she should be selected for the award. No more than three (3) pages.<br>\n2. Curriculum vitae. No more than two (2) pages.<br>\n3. Bibliography listing no more than twelve (12) of the nominee’s most significant publications.<br>\n4. Suggested citation. A 50-word summary stating why the nominee should be considered for this award.<br>\n5. Two letters of support. No more than one letter of support can be written by someone of the same primary work institution as the nominee.<br>\nThe Held Prize is given to a person or a set of persons, as supported by a paper or a body of work. Unless otherwise stated, preference will be given to scientists who may be earlier in their careers or those whose work has not been recognized by other prizes or awards. Nomination restrictions can be found here. Joint nominations will only be considered when nominees have collaborated closely on the paper to be recognized by the award. If nominating multiple individuals for a paper with additional authors, please clearly explain the reason for nominating those chosen, as well as the reason for excluding other collaborators, if applicable.<br>\nPlease feel free to circulate this call further within your department<br>\nBest<br>\nMadhu Sudan, on behalf of The Michael and Sheila Held Prize Selection Committee<br>\nAnd while I have your attention, a second CS theory announcement: David Soloveichik, my wonderful friend and colleague in UT Austin’s Electrical and Computer Engineering Department, has funding for a postdoc for 1-2 years, to work on the thermodynamics of computation here at UT. This is a topic that I’ve been trying to learn more about as well, so I might get involved too! David writes, “the big picture is to think of thermodynamics (energy dissipation / entropy production) as CS complexity measures like time and space usage.” If you’re on the postdoc market and this sounds potentially up your alley, email David to learn more.<\/p>","content_hash":"f5423da0ec24117f1eff7f928e10495d","author":"Scott","published_at":"2026-07-11T20:25:14","fetched_at":"2026-09-26 15:39:39","word_count":559,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"10w","domain":"scottaaronson.blog"},{"id":"2e8a415a9c2306af","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17993","title":"The physicists of Florence","url":"https://quantumfrontiers.com/2026/06/28/the-physicists-of-florence/","summary":"A scientist in Florence can’t avoid bumping into colleagues.&nbsp; When visiting the Renaissance’s birthplace last summer, I ran into a fellow physicist even on a Saturday morning. I was wandering around the Uffizi Gallery, a museum blessed with some of the greatest hits in western art. A familiar face arrested me on the first floor. Another colleague cropped up outside the museum. (Some might classify him as an applied physicist or an engineer, but he exhibited a theoretical physicist’s overact","content":"<p>A scientist in Florence can’t avoid bumping into colleagues.<br>\nWhen visiting the Renaissance’s birthplace last summer, I ran into a fellow physicist even on a Saturday morning. I was wandering around the Uffizi Gallery, a museum blessed with some of the greatest hits in western art. A familiar face arrested me on the first floor.<br>\nAnother colleague cropped up outside the museum. (Some might classify him as an applied physicist or an engineer, but he exhibited a theoretical physicist’s overactive imagination.)<br>\nOne colleague, I’d been looking forward to meeting for over four years. Jae Dong Noh is a professor of physics at the University of Seoul in South Korea. He’d conducted the first numerical tests (classical-computer simulations) of an idea I’d helped midwife, the non-Abelian eigenstate thermalization hypothesis (NAETH). An earlier blog post described this mouthful, which predicts how certain quantum many-particle systems thermalize, or experience the flow of time. These systems’ dynamics conserve properties, analogous to energy, that are incompatible: one can’t measure the properties simultaneously, as one can’t measure a quantum particle’s position and momentum simultaneously. Because incompatibility helps distinguish quantum from classical physics, such systems’ thermodynamics qualifies as particularly quantum.<br>\nJae Dong modeled such a system and others numerically in a paper. I admired his computational techniques and his grasp of symmetries (for experts: how non-Abelian symmetries affect chaotic quantum systems’ energy-level statistics). My postdoc Aleks Lasek was planning a more thorough numerical test of the NAETH, so I reached out to Jae Dong, and a collaboration crystallized.<br>\nSeoul operates thirteen hours ahead of Maryland, but we managed to Zoom because Jae Dong is a night owl and I’m an early bird.1 Zoom introduced me to a man perpetually dressed in a neat button-down shirt and sweater, silver overriding the black in his hair. The neatness extended to Jae Dong’s explanations: if Aleks and I didn’t understand one of his emails, he’d explain it quietly and calmly, untangling the confusion as though pulling a comb through wool.<br>\nThe collaboration settled into a rhythm: I’d pose a question or propose a goal, Jae Dong would respond with an analytical calculation,2 I’d find holes in the calculation, Jae Dong would plug the holes, I’d re-check the argument’s logic, and we’d repeat the cycle. Had I been in Jae Dong’s shoes, I’d have swallowed the constant objections as I’ve swallowed grape-flavored cough medicine,3 but he always responded with equanimity—sometimes even good cheer—and a possible solution. Meanwhile, Aleks and then-undergraduate Jade LeSchack checked our analytical arguments numerically.<br>\nSo smoothly did the collaboration hum along that we coauthored two papers before ever meeting in person. One demonstrates numerically that two quantum many-body systems (for experts: nonintegrable Heisenberg models) obey the NAETH.4 In the other paper, we derive a symmetry relation from the NAETH. If the 17-syllable NAETH is a mouthful, the symmetry’s name is half a mouthful: a Kubo–Martin–Schwinger (KMS) relation. It’s important because (i) it enables us to calculate how rapidly a thermodynamic system responds to a stimulus, such as a weak magnetic field, and (ii) physicists go gaga over symmetries generally.<br>\nThe KMS relation constrains thermal states—essentially, systems that have temperatures. Your typical isolated many-particle quantum system looks thermal if you can observe just a small chunk of it at a time. Accordingly, Jae Dong and collaborators had proved that isolated many-particle quantum systems obey the KMS relation approximately. The larger the system, the more accurate the approximation.<br>\nWe extended his argument to systems whose dynamics conserve incompatible properties. Such an extension might sound simple, but its proof filled 24 pages of appendices. (For experts: Clebsch–Gordan coefficients are tricky blighters.) We discovered that, under certain conditions, incompatible conserved quantities can reduce the extent to which a quantum system obeys the KMS relation. Quantum incompatibility can augment deviations from conventional thermodynamics.<br>\nJae Dong planned to present about our work at StatPhys, an international statistical-physics conference, which Florence was hosting in 2024. Throughout the two-and-a-half months before the conference, the KMS relation consumed our team. (For experts: Clebsch–Gordan coefficients are very tricky blighters.) I even hid in my hotel room, working and reworking our proofs, during another conference during that time.<br>\nThe toil paid off. We submitted our KMS manuscript for public scrutiny the day I flew to Florence—because not only Jae Dong would be representing our team at StatPhys. I was looking forward to meeting him there for the first time.<br>\nThe StatPhys committee outdid itself. The opening ceremony unfolded in Florence’s Palazzo Vecchio, where members of the Medici dynasty once lived. Giorgio Parisi, who won a Nobel Prize for statistical physics in 2021, lectured at the ceremony.<br>\nThe meat of the conference took place in two other palaces, the Palazzo dei Congressi and the Palazzo degli Affari. In one of them, I met Jae Dong. Although we’d shown that quantum incompatibility can defy thermodynamic predictions, he met my expectations.<br>\nWe discovered another thermodynamic phenomenon challenged by incompatible conserved quantities, so stay tuned for another paper and blog post. Some colleagues, one can’t avoid; others are worth engaging with again and again.<br>\n1 Aleks has confessed to night-owl habits, but physics motivates him to adapt. Some days, he’s emailed me results before even I’ve woken up. Who needs coffee when the thrill of discovery electrifies one minutes after one hops out of bed?<br>\n2 An exact calculation written out on paper, as opposed to a numerical, or approximate, calculation performed by a silicon-based classical computer.<br>\n3 Does anyone like the grape flavor? Why do companies bother producing it?<br>\n4 Rohit Patil and Marcos Rigol, too, have checked numerically that a system obeys the NAETH.<\/p>","content_hash":"6173f9141ac80f9dc998875c56638f43","author":"Nicole Yunger Halpern","published_at":"2026-06-29T00:00:38","fetched_at":"2026-09-26 15:39:44","word_count":933,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"12w","domain":"quantumfrontiers.com"},{"id":"177414df5f2a25a8","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17969","title":"Nicole’s guide to handling failure and rejection","url":"https://quantumfrontiers.com/2026/05/20/nicoles-guide-to-handling-failure-and-rejection/","summary":"It’s happening.&nbsp; Your inbox registers an email from the chair of a faculty-hiring committee. With trembling fingers, you click on the message. “We’ve been grateful for the opportunity to learn about your work…The decision was very difficult…many highly qualified candidates…” Months of labor, soul-searching, strain, and anxiety give way to despair. The committee has filled the position, and not with you. I recently published advice about how to proceed if you receive an offer of a faculty po","content":"<p>It’s happening.<br>\nYour inbox registers an email from the chair of a faculty-hiring committee. With trembling fingers, you click on the message. “We’ve been grateful for the opportunity to learn about your work…The decision was very difficult…many highly qualified candidates…” Months of labor, soul-searching, strain, and anxiety give way to despair. The committee has filled the position, and not with you.<br>\nI recently published advice about how to proceed if you receive an offer of a faculty position. But what if you don’t receive an offer—what if hiring committees reject you? Or scholarship committees, grant committees, admissions committees, or potential advisors? What if a journal referee shreds your magnum opus? Or a program committee declines your submission to a conference?<br>\nFailure suffuses science as dinner suffuses a nighttime diaper, for two reasons. First, undertaking science is difficult. By “undertaking science,” I mean formulating and proving theorems, cajoling equipment into working, identifying bugs in code, extracting meaning from noisy data, etc. Second, science doesn’t unfold in a vacuum. Human beings do science within a society fraught with opinions, emotions, and limited resources. These challenges lead to the failures and rejections that this article addresses most. (If you’re a member of my group and you’re facing a failure due to the difficulty of undertaking science, come talk with me.)<br>\nWhat can you do if failure or rejection ails thee? The rest of this article prescribes, in chronological order, steps that will help you recover. You can even turn your lemons into, if not lemonade, then not-entirely-unappetizing lemon meringue pie.<br>\nImmediately after receiving the news:<br>\n- Read the communication once—or, if you must, twice. Don’t linger over the letter for longer than necessary.<br>\n- Put the communication away, so you won’t see it unless you try to. If the news came via email, remove the message from your inbox.<br>\n- Lower your heart rate. Electrified with anger? Expend that energy; go for a walk, for a run, or to the gym, if possible. If you can’t, breathe deeply for several minutes, extending your exhalations.<br>\n- Review records of your successes. I maintain a folder called “Nice messages.” It contains notices of awards I’ve received, kudos on papers I’ve published, messages such as “Thanks for everything this past semester! Your class was probably my favorite one,” and every compliment I’ve received from the taciturn John Preskill via email. Review evidence—remind yourself—that you’re not a failure even though you’re experiencing failure or rejection.<br>\nAvoid thinking about the news for a few days. Imagine cutting yourself on a kitchen knife. The wound may sting and bleed initially. But the blood clots and the stinging diminishes if you cover the wound and don’t aggravate it.<br>\nAfter experiencing a failure or rejection, invite a colleague to lunch, and ask about their recent reading and travels. Dive into a project that will absorb you. Visit a museum, or watch a movie. Remove the letdown from your thoughts.<br>\nConsider seeking input from a mentor, especially if you’ve never experienced a failure or rejection of this type before. Mentors have more experience and so can put obstacles in perspective. For example, suppose you’re a student who’s received an upsetting referee report from a journal. The report might look mild to a faculty member, who’s likely received far more, and more-upsetting, reports. What sounds harsh to you might sound quotidian to an advisor, whose lack of distress might reassure you.<br>\nAlso, mentors notice upsides that you’ve overlooked. Perhaps the referee trashed your presentation of an idea but tacitly approved of the idea itself. The trashing might have drowned out the approval during your reading. Yet the approval could justify a resubmission to the journal, upending your belief in the cause’s hopelessness. Relatedly, a mentor can help you identify strategies for moving past the failure. Maybe this journal won’t publish your paper but another journal is soliciting contributions to a relevant special collection.<br>\nAs a PhD student, I applied for an internship at a company developing a quantum computer. I broke an obligation and flew out of state to interview for the position. No offer materialized. To process the outcome, I spoke with a more-advanced researcher I trusted. He not only offered a mature perspective, but also had access to inside information. The team liked me, he reported, but my interests didn’t overlap with theirs enough. In a sense, I’d grown too independent. As independence marks maturity in PhD students, the rejection came to double as a compliment. Today, I remain on friendly terms with multiple people from that team, and a student of mine just landed an internship at a quantum-computing company.<br>\nChart a path past the failure or rejection. Cue the lemon meringue pie. Did a hiring committee reject an application of yours? Email the committee’s chair, thanking them for considering your application. Express your hope of improving your materials so that you can try again the following year. Ask if the chair would provide feedback via phone or Zoom.1<br>\nPursue the path you’ve charted. To ease the burden, consider undertaking lighter tasks before more-arduous ones. I recently received a laundry list of requests about a manuscript from an editor—and when I say laundry, I mean the equivalent of hauling a multiple-pound bag to a stream, scrubbing everything by hand while the wind attempts to blow cleaned items into the mud, and then hauling everything back. I began with the tasks that required little effort. Dispatching them, I crossed about half the requests off my to-do list. The list looked more manageable as a result; I felt better-equipped to handle the trickiest work.<br>\nCelebrate your triumphs. Don’t let failures and rejections consume your attention; carve out time for your successes. If you recognize them, you’ll remember them the next time you face failure; they’ll cushion you when you fall.<br>\nI recently failed at a task over a hundred times (yes, I counted). After 28 months of trying, I succeeded. I celebrated by treating myself to lunch at the National Gallery of Art.2 Why not gather ye rosebuds while ye may? This success afforded me the opportunity to fail at a new task.<br>\nAlways remember, what matters in the long run is not any one failure or rejection, but your persistence despite failures and rejections. I progressed to the Rhodes Scholarship competition’s final round two years in a row. Each year, a committee interviewed and rejected me. I’d poured time, sweat, and blood into my applications and interview preparations. I felt like I had no more blood to squeeze into the applications I then had to write for graduate programs because of those rejections. Those rejections, though, led me to become a student of John Preskill’s. Over a decade later, I’m not kicking myself.<br>\nShare about your favorite failures in the comments section below!<br>\n1Not via email, which doesn’t offer the same freedom.<br>\n2Its Garden Café had enticed me for years, but I can rarely bring myself to pay for food when I can prepare it myself.<\/p>","content_hash":"b80ff55d8863d3327a44766ce180a0c2","author":"Nicole Yunger Halpern","published_at":"2026-05-21T00:20:32","fetched_at":"2026-09-26 15:39:44","word_count":1165,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"18w","domain":"quantumfrontiers.com"},{"id":"2b1b4a6dc4ac6b5f","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17917","title":"How I learned to stop worrying and…no, I’ve always adored entropy","url":"https://quantumfrontiers.com/2026/04/12/how-i-learned-to-stop-worrying-andno-ive-always-adored-entropy/","summary":"When I was pursuing a PhD at Caltech, so was my friend Jeremy. He used to throw a dinner party every few months. The email invitations welcomed friends to partake of his cooking and, if we wished, to help him cook. I didn’t help cook; but, when I arrived, the mess of pots and pans drew me to the kitchen like vinegar drawing a pathological fly. I couldn’t sit still while cookware needed cleaning, so I scrubbed and rinsed the pans and spoons and bowls. Jeremy, an applied-physics student, commented","content":"<p>When I was pursuing a PhD at Caltech, so was my friend Jeremy. He used to throw a dinner party every few months. The email invitations welcomed friends to partake of his cooking and, if we wished, to help him cook. I didn’t help cook; but, when I arrived, the mess of pots and pans drew me to the kitchen like vinegar drawing a pathological fly. I couldn’t sit still while cookware needed cleaning, so I scrubbed and rinsed the pans and spoons and bowls. Jeremy, an applied-physics student, commented on my adeptness at decreasing entropy.<br>\nIt’s the story of my life, I replied.<br>\nIn fourth grade, my classmates and I cleaned our desks every Friday afternoon. Once a student finished, my teacher dismissed him or her onto the playground. My neighbor’s desk horrified me like the disaster in a hurricane’s wake, so I neatened his desk after finishing with mine.1 Another friend requested the same favor. A third classmate offered to pay me for cleaning his desk, but I’d have undertaken the chore for its own sake. Ordering the world offered me fulfillment.<br>\nFrom cleaning a fourth-grade desk, I progressed to pursuing a PhD in theoretical physics. The two pursuits might seem to resemble each other no more than Dr. Jekyll and Mr. Hyde; yet, to me, the path between them is but a step. I trained as a theoretical physicist because I love organizing ideas. Caltech paid me to build models, propose definitions and theorems, and structure proofs—to dream up ideas and identify the optimal arrangements for them. I needed that pay, being an adult, as I hadn’t needed my fourth-grade classmate’s desk-cleaning fee. Yet I organized ideas for the same reason that drove me to organize my neighbor’s notebooks.<br>\nMany people have called entropy a measure of disorder. To see why, imagine that Jeremy’s crew has used thirty utensils while cooking. The chefs can have scattered the utensils across the kitchen in many ways: they may have dropped forks on the floor, left spoons in the sink, arranged spatulas on the drying rack, or filled a vase with knives like a modern-art bouquet. In few of these configurations do the forks lie in their compartment of the utensil drawer, the spoons lie in their compartment, etc. We call such configurations neat. Most of the other configurations, we call messy.<br>\nA system’s entropy is the number of configurations consistent with known large-scale properties of the system, such as the number of forks.2 More configurations are consistent with messiness (and a fixed number of forks and so on) than with neatness (and the same number of forks and so on). Messiness tends to correlate with high entropy. People often say, therefore, that entropy quantifies messiness. Hence Jeremy’s complimenting me on my decreasing of entropy.<br>\nJeremy’s dinner parties came to mind as I read the book The Mattering Instinct, published by Rebecca Newberger Goldstein this January. Rebecca is a philosopher of science and a writer. I had the good fortune to meet her through my undergraduate mentor Marcelo Gleiser, who’s had another cameo or two on Quantum Frontiers. Rebecca’s latest book covers what she calls the mattering instinct: the longing to know that we matter.<br>\nWe spend scads of energy and time on securing our “survival and flourishing,” as Rebecca says. We feed ourselves; work to earn money to purchase food; clean, shelter, and clothe ourselves; ingrain ourselves in societies that offer some degree of security; and more. Do we deserve all this effort? We long for assurance that, in the immortal words of L’Oreal, we’re worth it.<br>\nSurvival and flourishing, Rebecca writes, requires us to decrease entropy. Every closed, isolated system’s entropy increases or remains constant, according to the second law of thermodynamics. Entropy increases as a system becomes more uniform, loosely speaking. The system’s particles spread out across space, these particles’ temperature comes to equal those particles’ temperature, and so on. In contrast, your body exists because its particles clump together in a certain shape consistently. You withstand heat waves and snow because homeostasis maintains your temperature despite your environment’s temperature. You keep your body’s entropy low to survive. Rebecca therefore casts us as fighting entropy.<br>\nAs a thermodynamicist, I agree with Rebecca. Yet I also adore entropy. It helps explain why time flows, quantifies uncertainty, and determines the maximal efficiencies with which we can perform tasks such as communication. What versatility and richness! Entropy also embodies tension and subtlety: its mathematical definition looks obscure at first glance, yet entropy helps explain familiar phenomena such as aging. For these reasons, before beginning my PhD, I told a potential advisor that I could imagine devoting the next five years of my life to entropy.<br>\nI therefore aspire to rehabilitate entropy’s reputation. Novelist Terry Pratchett endeared mortality to millions of readers through anthropomorphism. His character Death, a mainstay of the Discworld series of novels, elicits empathy and fondness. I won’t anthropomorphize entropy here,3 but I aim to replace conflict with cooperation in the narrative above. To survive and flourish, I hold, we partner with entropy. How? We create oodles of entropy in our environments. This entropy increase offsets the entropy decrease that supports life.<br>\nFor example, imagine working at a desalination plant. You’d process high-entropy water throughout which salt has spread. You’d concentrate the salt in a tiny region, reducing the water’s entropy. This reduction, producing fresh water, could support your city’s drinking, cooking, and toothbrushing needs.<br>\nTo reduce the water’s entropy, you’d create loads more entropy. You’d eat breakfast before work, consuming energy stored neatly in your waffle’s chemical bonds. Your body would later break the bonds, releasing the energy. Some energy would power your muscles, so you could program the desalination system, test its output, etc. But much of the chemical energy would transform into heat radiated by your body. The heat would warm up the air molecules around you, magnifying their random jigglings and jostlings. You’d increase the entropy of the air—your environment—to decrease the water’s entropy. The air’s entropy increase would outweigh the water’s entropy decrease.<br>\nOrganisms survive and flourish by producing entropy in their environments. In fact, organisms have a knack for generating entropy. Entropy and life thereby further each other. A glass-half-full thinker could conclude that we partner with entropy.<br>\nSo did I partner with entropy as a PhD student, applying it to solve problems in quantum information theory and thermodynamics. So did I partner with entropy in fourth grade and at Jeremy’s apartment, deriving satisfaction from my cleaning. Rebecca would call these activities’ ultimate aim (beyond the aim of, e.g., not sitting beside a pigsty in fourth grade) mattering. She writes that we reduce entropy (within our immediate vicinities) to satisfy the mattering instinct. Rebecca’s proposition describes my behaviors with uncanny precision, I realized upon reading her book.<br>\nWhich I’ve now finished. So pardon me while I return to washing forks in the quantum kitchen of the universe.<br>\nWith thanks to Jeremy for his friendship…and food.<br>\n1I also ensured that my neighbor brought home, every afternoon, the sweater he’d brought to school that morning. Before I took charge, he’d ended up with three forgotten sweaters crammed into his cubby.<br>\n2At least, one entropy is. Many other entropies exist.<br>\n3If you anthropomorphize entropy elsewhere, let me know.<\/p>","content_hash":"fa0db26cbcb786f59f298f893b38d64a","author":"Nicole Yunger Halpern","published_at":"2026-04-13T00:06:06","fetched_at":"2026-09-26 15:39:44","word_count":1213,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"23w","domain":"quantumfrontiers.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-09-26 15:39:42","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"139w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":     return color;
  }

  var _measureCanvas = document.createElement('canvas');
  var _measureCtx = _measureCanvas.getContext('2d');

  function measureWidth(text, font) {
    _measureCtx.font = font;
    return _measureCtx.measureText(text).width;
  }

  // Pretext-powered multi-line height prediction (canvas fallback for single line)
  function measureTextHeight(text, font, maxWidth, lineHeight) {
    if (_pretext) {
      var prepared = _pretext.prepare(text, font);
      return _pretext.layout(prepared, maxWidth, lineHeight);
    }
    // Fallback: assume single line if text fits, else estimate line count
    var w = measureWidth(text, font);
    var lines = Math.max(1, Math.ceil(w / maxWidth));
    return { height: lines * lineHeight, lineCount: lines };
  }

  function truncateText(text, font, maxWidth) {
    var fullWidth = measureWidth(text, font);
    if (fullWidth <= maxWidth) return text;

    var ellipsis = '\u2026';
    var ellipsisWidth = measureWidth(ellipsis, font);
    var targetWidth = maxWidth - ellipsisWidth;
    if (targetWidth <= 0) return ellipsis;

    var lo = 0, hi = text.length;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (measureWidth(text.slice(0, mid), font) <= targetWidth) {
        lo = mid;
      } else {
        hi = mid - 1;
      }
    }
    return text.slice(0, lo) + ellipsis;
  }

  // ═══════════════════════════════════════════════════════════════
  // D.3b MASONRY LAYOUT ENGINE (pure JS positioning)
  // ═══════════════════════════════════════════════════════════════

  function computeMetricMinWidth(group) {
    var PAD = 4, GAP = 4, SPARK_W = 56;
    var metrics = group.metrics || [];
    if (metrics.length === 0) return 220;

    var nameWidths = metrics.map(function(m) { return measureWidth(m.name || '', FONTS.metricName); });
    var maxName = Math.max.apply(null, nameWidths);
    var valueWidths = metrics.map(function(m) { return measureWidth(m.formatted_value || '', FONTS.metricValue); });
    var maxValue = Math.max.apply(null, valueWidths);
    var changeTexts = metrics.map(function(m) {
      var t = m.formatted_change || '';
      if (m.change_period) t += ' ' + m.change_period;
      return t;
    });
    var changeWidths = changeTexts.map(function(t) { return measureWidth(t, FONTS.metricChange); });
    var maxChange = Math.max.apply(null, changeWidths);

    return PAD * 2 + maxName + GAP * 3 + SPARK_W + maxValue + maxChange;
  }

  function indexOfMin(arr) {
    var minIdx = 0;
    for (var i = 1; i < arr.length; i++) {
      if (arr[i] < arr[minIdx]) minIdx = i;
    }
    return minIdx;
  }

  function layoutDashboard(wrappers, data, gap) {
    var container = document.querySelector('.dashboard');
    var viewportWidth = container.clientWidth;
    if (viewportWidth < 1) return;

    // 1. Build card descriptors with measured min widths
    var cards = [];
    for (var i = 0; i < wrappers.length; i++) {
      var w = wrappers[i];
      var type = w.dataset.cardType;
      var cardData = null, minW = 220;

      if (type === 'metric') {
        var idx = parseInt(w.dataset.cardIndex, 10);
        cardData = data.metric_groups[idx];
        if (cardData) minW = computeMetricMinWidth(cardData);
      } else {
        var feedId = w.dataset.feedId;
        for (var f = 0; f < data.feeds.length; f++) {
          if (data.feeds[f].id === feedId) { cardData = data.feeds[f]; break; }
        }
        minW = 280;
      }
      cards.push({ wrapper: w, type: type, data: cardData, minWidth: minW });
    }

    // 2. Column count derived from widest card's measured width
    var allMinWidths = cards.map(function(c) { return c.minWidth; });
    var minColWidth = allMinWidths.length ? Math.max.apply(null, allMinWidths) : 260;
    minColWidth = Math.max(minColWidth, 220);

    var colCount = Math.max(1, Math.floor((viewportWidth + gap) / (minColWidth + gap)));
    var colWidth = (viewportWidth - (colCount - 1) * gap) / colCount;

    // 3. Masonry: pack each card into the shortest column
    var BORDER = 2; // 1px border top + 1px border bottom on .card-wrapper
    var colHeights = [];
    for (var c = 0; c < colCount; c++) colHeights.push(0);

    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var isNews = card.type === 'news';

      // Card height from content (news cards use pretext-measured variable heights)
      var cardH;
      if (isNews && card.data) {
        var newsLayout = computeNewsCardLayout(card.data, colWidth);
        cardH = newsLayout.totalHeight;
      } else {
        var headerH = 16, rowH = 16;
        var rowCount = (card.data && card.data.metrics) ? card.data.metrics.length : 0;
        cardH = headerH + rowCount * rowH;
      }

      // Find shortest column
      var bestCol = indexOfMin(colHeights);
      var bestY = colHeights[bestCol];

      // Position card
      var x = bestCol * (colWidth + gap);
      card.wrapper.style.left = Math.round(x) + 'px';
      card.wrapper.style.top = Math.round(bestY) + 'px';
      card.wrapper.style.width = Math.round(colWidth) + 'px';

      // Update column height (account for wrapper border)
      colHeights[bestCol] = bestY + cardH + BORDER + gap;
    }

    // 4. Set container height
    container.style.height = Math.round(Math.max.apply(null, colHeights)) + 'px';
  }

  // ═══════════════════════════════════════════════════════════════
  // D.4  METRIC CARD LAYOUT
  // ═══════════════════════════════════════════════════════════════

  function computeMetricCardLayout(group, containerWidth) {
    var PAD = 4;
    var GAP = 4;
    var HEADER_H = 16;
    var ROW_H = 16;
    var SPARK_W = 56;

    var metrics = group.metrics || [];

    var nameWidths = metrics.map(function(m) {
      return measureWidth(m.name || '', FONTS.metricName);
    });
    var valueWidths = metrics.map(function(m) {
      return measureWidth(m.formatted_value || '', FONTS.metricValue);
    });

    var changeTexts = metrics.map(function(m) {
      var t = m.formatted_change || '';
      if (m.change_period) t += ' ' + m.change_period;
      return t;
    });
    var changeWidths = changeTexts.map(function(t) {
      return measureWidth(t, FONTS.metricChange);
    });

    var maxValue = valueWidths.length ? Math.max.apply(null, valueWidths) : 0;
    var maxChange = changeWidths.length ? Math.max.apply(null, changeWidths) : 0;

    var fixedWidth = PAD * 2 + GAP * 3 + SPARK_W + maxValue + maxChange;
    var nameCol = Math.max(containerWidth - fixedWidth, 40);

    // Ensure value and change columns don't overlap
    var valueX = PAD + nameCol + GAP + SPARK_W + GAP;
    var changeX = containerWidth - PAD - maxChange;
    if (valueX + maxValue + GAP > changeX) {
      // Shrink sparkline to make room
      var overflow = (valueX + maxValue + GAP) - changeX;
      SPARK_W = Math.max(SPARK_W - overflow, 20);
      valueX = PAD + nameCol + GAP + SPARK_W + GAP;
    }

    var cols = {
      name:   { x: PAD, width: nameCol },
      spark:  { x: PAD + nameCol + GAP, width: SPARK_W },
      value:  { x: valueX, width: maxValue },
      change: { x: changeX, width: maxChange },
    };

    return {
      headerHeight: HEADER_H,
      rowHeight: ROW_H,
      padding: PAD,
      columns: cols,
      totalHeight: HEADER_H + metrics.length * ROW_H,
      changeTexts: changeTexts,
      _metricCount: metrics.length,
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.5  NEWS CARD LAYOUT
  // ═══════════════════════════════════════════════════════════════

  function computeNewsCardLayout(feed, containerWidth) {
    var PAD = 4;
    var GAP = 6;
    var HEADER_H = 16;
    var ROW_H = 18;

    var stories = feed.stories || [];

    var scoreWidths = stories.map(function(s) {
      return measureWidth(String(s.score || 0), FONTS.newsScore);
    });
    var scoreCol = scoreWidths.length ? Math.max(Math.max.apply(null, scoreWidths), 20) : 20;

    var metaTexts = stories.map(function(s) {
      return (s.time_ago || '') + ' ' + (s.comments || 0) + 'c';
    });
    var metaWidths = metaTexts.map(function(t) {
      return measureWidth(t, FONTS.newsMeta);
    });
    var metaCol = metaWidths.length ? Math.max(Math.max.apply(null, metaWidths), 30) : 30;

    var titleX = PAD + scoreCol + GAP;
    var titleWidth = Math.max(containerWidth - titleX - GAP - metaCol - PAD, 60);

    // Measure each title height via pretext (supports multi-line wrapping)
    var rowYOffsets = [];
    var y = HEADER_H;
    var rowHeights = stories.map(function(s) {
      var h = measureTextHeight(s.title || '', FONTS.newsTitle, titleWidth, ROW_H);
      rowYOffsets.push(y);
      var rh = Math.max(h.height, ROW_H); // at least one row tall
      y += rh;
      return rh;
    });

    return {
      headerHeight: HEADER_H,
      rowHeight: ROW_H,
      padding: PAD,
      columns: {
        score: { x: PAD, width: scoreCol },
        title: { x: titleX, width: titleWidth },
        meta:  { x: containerWidth - PAD - metaCol, width: metaCol },
      },
      totalHeight: y,
      rowHeights: rowHeights,
      rowYOffsets: rowYOffsets,
      metaTexts: metaTexts,
      _storyCount: stories.length,
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // D.6  DRAWING FUNCTIONS
  // ═══════════════════════════════════════════════════════════════

  function drawCardHeader(ctx, name, width, headerHeight, colors) {
    // Header background
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, width, headerHeight);

    // Header bottom border
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(0, headerHeight - 0.5);
    ctx.lineTo(width, headerHeight - 0.5);
    ctx.stroke();

    // Chevron
    ctx.font = FONTS.cardHeader;
    ctx.fillStyle = colors.muted;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('>', 4, headerHeight / 2);

    // Section name
    ctx.fillStyle = colors.accent;
    var chevronWidth = measureWidth('> ', FONTS.cardHeader);
    ctx.fillText(name.toUpperCase(), 4 + chevronWidth, headerHeight / 2);
  }

  function drawDottedSeparator(ctx, y, width, colors) {
    ctx.strokeStyle = colors.muted;
    ctx.lineWidth = 1;
    ctx.setLineDash([1, 2]);
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(width, y + 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawSparkline(ctx, values, x, y, width, height, colors) {
    if (!values || values.length < 2) return;

    var min = Infinity, max = -Infinity;
    for (var i = 0; i < values.length; i++) {
      if (values[i] < min) min = values[i];
      if (values[i] > max) max = values[i];
    }
    var range = max - min;
    if (range === 0) range = 1;

    var pad = 3;
    var drawH = height - pad * 2;
    var drawW = width;
    var stepX = drawW / (values.length - 1);

    ctx.save();
    ctx.beginPath();

    for (var i = 0; i < values.length; i++) {
      var px = x + i * stepX;
      var py = y + pad + drawH - ((values[i] - min) / range) * drawH;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    ctx.strokeStyle = colors.spark;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // Area fill with gradient
    ctx.lineTo(x + drawW, y + height);
    ctx.lineTo(x, y + height);
    ctx.closePath();

    var grad = ctx.createLinearGradient(0, y, 0, y + height);
    grad.addColorStop(0, withAlpha(colors.spark, 0.09));
    grad.addColorStop(1, withAlpha(colors.spark, 0.01));
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.restore();
  }

  function drawMetricRow(ctx, metric, rowIndex, layout, colors, changeText, isHovered) {
    var y = layout.headerHeight + rowIndex * layout.rowHeight;
    var cols = layout.columns;

    // Hover background
    if (isHovered) {
      ctx.fillStyle = colors.hoverBg;
      ctx.fillRect(0, y, cols.change.x + cols.change.width + layout.padding, layout.rowHeight);
    }

    var textY = y + layout.rowHeight * 0.72;

    // Metric name (truncate if needed)
    ctx.font = FONTS.metricName;
    ctx.fillStyle = colors.dim;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    var displayName = truncateText(metric.name || '', FONTS.metricName, cols.name.width);
    ctx.fillText(displayName, cols.name.x, textY);

    // Sparkline
    var sparkValues = metric.sparkline_values;
    if (sparkValues && sparkValues.length >= 2) {
      drawSparkline(ctx, sparkValues, cols.spark.x, y + 1, cols.spark.width, layout.rowHeight - 2, colors);
    }

    // Value (right-aligned within value column)
    ctx.font = FONTS.metricValue;
    ctx.fillStyle = colors.text;
    ctx.textAlign = 'right';
    ctx.fillText(metric.formatted_value || '', cols.value.x + cols.value.width, textY);

    // Change (right-aligned)
    ctx.font = FONTS.metricChange;
    if (metric.change_class === 'up') {
      ctx.fillStyle = colors.up;
    } else if (metric.change_class === 'down') {
      ctx.fillStyle = colors.down;
    } else {
      ctx.fillStyle = colors.dim;
    }
    ctx.textAlign = 'right';
    ctx.fillText(changeText, cols.change.x + cols.change.width, textY);

    // Row separator (except last row)
    var totalMetrics = (layout._metricCount !== undefined) ? layout._metricCount : 999;
    if (rowIndex < totalMetrics - 1) {
      drawDottedSeparator(ctx, y + layout.rowHeight, cols.change.x + cols.change.width + layout.padding, colors);
    }
  }

  function drawNewsRow(ctx, story, rowIndex, layout, colors, metaText, isHovered) {
    var y = layout.rowYOffsets ? layout.rowYOffsets[rowIndex] : (layout.headerHeight + rowIndex * layout.rowHeight);
    var rh = layout.rowHeights ? layout.rowHeights[rowIndex] : layout.rowHeight;
    var cols = layout.columns;

    // Hover background
    if (isHovered) {
      ctx.fillStyle = colors.hoverBg;
      ctx.fillRect(0, y, cols.meta.x + cols.meta.width + layout.padding, rh);
    }

    var textY = y + layout.rowHeight * 0.68;

    // Score (right-aligned)
    ctx.font = FONTS.newsScore;
    ctx.fillStyle = colors.score;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'right';
    ctx.fillText(String(story.score || 0), cols.score.x + cols.score.width, textY);

    // Title (truncated) + domain
    ctx.font = FONTS.newsTitle;
    ctx.fillStyle = colors.text;
    ctx.textAlign = 'left';
    var titleText = story.title || '';
    var domainText = story.domain ? ' (' + story.domain + ')' : '';
    var domainWidth = domainText ? measureWidth(domainText, FONTS.newsDomain) : 0;
    var availableForTitle = cols.title.width - domainWidth - 2;
    var displayTitle = truncateText(titleText, FONTS.newsTitle, availableForTitle);
    ctx.fillText(displayTitle, cols.title.x, textY);

    // Domain (after title)
    if (domainText) {
      var titleDisplayWidth = measureWidth(displayTitle, FONTS.newsTitle);
      ctx.font = FONTS.newsDomain;
      ctx.fillStyle = colors.dim;
      ctx.fillText(domainText, cols.title.x + titleDisplayWidth + 1, textY);
    }

    // Meta (time + comments, right-aligned)
    ctx.font = FONTS.newsMeta;
    ctx.fillStyle = colors.dim;
    ctx.textAlign = 'right';

    // Draw time and comments link separately
    var timeText = story.time_ago || '';
    var commentsText = (story.comments || 0) + 'c';
    var commentsWidth = measureWidth(commentsText, FONTS.newsMeta);
    var timeWidth = measureWidth(timeText, FONTS.newsMeta);
    var spacing = measureWidth(' ', FONTS.newsMeta);

    var metaRight = cols.meta.x + cols.meta.width;

    // Comments (right side, link-colored)
    ctx.fillStyle = colors.link;
    ctx.fillText(commentsText, metaRight, textY);

    // Time (left of comments)
    ctx.fillStyle = colors.dim;
    ctx.fillText(timeText, metaRight - commentsWidth - spacing, textY);

    // Row separator (except last row)
    var totalStories = (layout._storyCount !== undefined) ? layout._storyCount : 999;
    if (rowIndex < totalStories - 1) {
      drawDottedSeparator(ctx, y + rh, cols.meta.x + cols.meta.width + layout.padding, colors);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // D.7  CARD RENDER ORCHESTRATORS
  // ═══════════════════════════════════════════════════════════════

  function setupCanvas(canvas, logicalWidth, logicalHeight) {
    var dpr = window.devicePixelRatio || 1;
    var pw = Math.round(logicalWidth * dpr);
    var ph = Math.round(logicalHeight * dpr);
    // Only resize when dimensions change (avoids GPU buffer reallocation on hover)
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
      canvas.style.width = logicalWidth + 'px';
      canvas.style.height = logicalHeight + 'px';
    }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, logicalWidth, logicalHeight);
    return ctx;
  }

  function renderMetricCard(wrapper, group, colors, hoverIndex) {
    var canvas = wrapper.querySelector('canvas');
    var width = wrapper.clientWidth;
    if (width < 1) return;

    var layout = computeMetricCardLayout(group, width);
    wrapper._layout = layout;
    wrapper._data = group;

    var ctx = setupCanvas(canvas, width, layout.totalHeight);

    // Card background
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, width, layout.totalHeight);

    // Header
    drawCardHeader(ctx, group.name, width, layout.headerHeight, colors);

    // Metric rows
    var metrics = group.metrics || [];
    for (var i = 0; i < metrics.length; i++) {
      drawMetricRow(ctx, metrics[i], i, layout, colors, layout.changeTexts[i], i === hoverIndex);
    }

    // Accessibility
    var label = group.name + ': ' + metrics.map(function(m) {
      return m.name + ' ' + (m.formatted_value || '');
    }).join(', ');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', label);
  }

  function renderNewsCard(wrapper, feed, colors, hoverIndex) {
    var canvas = wrapper.querySelector('canvas');
    var width = wrapper.clientWidth;
    if (width < 1) return;

    var layout = computeNewsCardLayout(feed, width);
    var stories = feed.stories || [];
    wrapper._layout = layout;
    wrapper._data = feed;

    var ctx = setupCanvas(canvas, width, layout.totalHeight);

    // Card background
    ctx.fillStyle = colors.card;
    ctx.fillRect(0, 0, width, layout.totalHeight);

    // Header
    drawCardHeader(ctx, feed.name, width, layout.headerHeight, colors);

    // News rows
    for (var i = 0; i < stories.length; i++) {
      drawNewsRow(ctx, stories[i], i, layout, colors, layout.metaTexts[i], i === hoverIndex);
    }

    // Only create/update link overlays on initial render or resize, not on hover
    if (!wrapper._overlaysCreated || wrapper._lastOverlayWidth !== width) {
      createLinkOverlays(wrapper, stories, layout);
      wrapper._overlaysCreated = true;
      wrapper._lastOverlayWidth = width;
    }

    // Accessibility
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', feed.name + ' feed: ' + stories.length + ' stories');
  }

  // ═══════════════════════════════════════════════════════════════
  // D.8  LINK OVERLAYS
  // ═══════════════════════════════════════════════════════════════

  function createLinkOverlays(wrapper, stories, layout) {
    var linksDiv = wrapper.querySelector('.links');
    linksDiv.innerHTML = '';

    for (var i = 0; i < stories.length; i++) {
      var story = stories[i];
      var rowY = layout.rowYOffsets ? layout.rowYOffsets[i] : (layout.headerHeight + i * layout.rowHeight);
      var rh = layout.rowHeights ? layout.rowHeights[i] : layout.rowHeight;

      // Title link
      var a = document.createElement('a');
      a.href = story.url || ('https://news.ycombinator.com/item?id=' + story.id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', story.title);
      a.style.cssText = 'top:' + rowY + 'px;left:' + layout.columns.title.x + 'px;width:' + layout.columns.title.width + 'px;height:' + rh + 'px;';
      linksDiv.appendChild(a);

      // HN comments link
      var hn = document.createElement('a');
      hn.href = 'https://news.ycombinator.com/item?id=' + story.id;
      hn.target = '_blank';
      hn.rel = 'noopener';
      hn.setAttribute('aria-label', (story.comments || 0) + ' comments on Hacker News');
      var commentsWidth = measureWidth((story.comments || 0) + 'c', FONTS.newsMeta);
      var hnLeft = layout.columns.meta.x + layout.columns.meta.width - commentsWidth;
      hn.style.cssText = 'top:' + rowY + 'px;left:' + hnLeft + 'px;width:' + commentsWidth + 'px;height:' + rh + 'px;';
      linksDiv.appendChild(hn);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // D.9  HOVER SYSTEM
  // ═══════════════════════════════════════════════════════════════

  function attachHoverHandlers(wrapper, colors) {
    var canvas = wrapper.querySelector('canvas');
    var currentHover = -1;

    canvas.addEventListener('mousemove', function(e) {
      var layout = wrapper._layout;
      if (!layout) return;

      var rect = canvas.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var row;
      if (layout.rowYOffsets) {
        // Variable-height rows: binary search for the row containing y
        row = -1;
        for (var r = 0; r < layout.rowYOffsets.length; r++) {
          var ry = layout.rowYOffsets[r];
          var rh = layout.rowHeights[r];
          if (y >= ry && y < ry + rh) { row = r; break; }
        }
      } else {
        row = Math.floor((y - layout.headerHeight) / layout.rowHeight);
        var maxRow = wrapper.dataset.cardType === 'metric'
          ? (layout._metricCount || 0) - 1
          : (layout._storyCount || 0) - 1;
        if (row < 0 || row > maxRow) row = -1;
      }

      if (row !== currentHover) {
        currentHover = row;
        if (wrapper.dataset.cardType === 'metric') {
          renderMetricCard(wrapper, wrapper._data, colors, row);
        } else {
          renderNewsCard(wrapper, wrapper._data, colors, row);
        }
      }
    });

    canvas.addEventListener('mouseleave', function() {
      if (currentHover !== -1) {
        currentHover = -1;
        if (wrapper.dataset.cardType === 'metric') {
          renderMetricCard(wrapper, wrapper._data, colors, -1);
        } else {
          renderNewsCard(wrapper, wrapper._data, colors, -1);
        }
      }
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // D.10 RESIZE OBSERVER
  // ═══════════════════════════════════════════════════════════════

  function setupResizeObserver(wrappers, colors) {
    if (!window.ResizeObserver) return;

    var resizeTimeout = null;
    var observer = new ResizeObserver(function() {
      if (resizeTimeout) clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        layoutDashboard(wrappers, DASHBOARD_DATA, 3);
        renderAllCards(wrappers, colors);
      }, 50);
    });

    observer.observe(document.querySelector('.dashboard'));
    return observer;
  }

  // ═══════════════════════════════════════════════════════════════
  // D.11 INITIALIZATION
  // ═══════════════════════════════════════════════════════════════

  function renderAllCards(wrappers, colors) {
    var data = DASHBOARD_DATA;

    wrappers.forEach(function(wrapper) {
      var type = wrapper.dataset.cardType;
      if (type === 'metric') {
        var idx = parseInt(wrapper.dataset.cardIndex, 10);
        var group = data.metric_groups[idx];
        if (group) renderMetricCard(wrapper, group, colors, -1);
      } else if (type === 'news') {
        var feedId = wrapper.dataset.feedId;
        var feed = null;
        for (var i = 0; i < data.feeds.length; i++) {
          if (data.feeds[i].id === feedId) { feed = data.feeds[i]; break; }
        }
        if (feed) renderNewsCard(wrapper, feed, colors, -1);
      }
    });
  }

  function initDashboard() {
    var colors = readColors();
    var wrappers = Array.prototype.slice.call(document.querySelectorAll('.card-wrapper'));

    // Compute masonry layout from measured text, then render canvases
    layoutDashboard(wrappers, DASHBOARD_DATA, 3);
    renderAllCards(wrappers, colors);

    // Attach hover handlers
    wrappers.forEach(function(wrapper) {
      attachHoverHandlers(wrapper, colors);
    });

    // Responsive resize
    setupResizeObserver(wrappers, colors);

    // ═════════════════════════════════════════════════════════════
    // D.12 DEBUG MODE
    // ═════════════════════════════════════════════════════════════

    if (location.search.indexOf('debug=1') !== -1) {
      wrappers.forEach(function(wrapper) {
        var canvas = wrapper.querySelector('canvas');
        var ctx = canvas.getContext('2d');
        var dpr = window.devicePixelRatio || 1;
        var layout = wrapper._layout;
        if (!layout) return;

        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.lineWidth = 0.5;
        ctx.setLineDash([2, 2]);

        // Column boundaries
        var cols = layout.columns;
        Object.keys(cols).forEach(function(key) {
          var col = cols[key];
          ctx.beginPath();
          ctx.moveTo(col.x, 0);
          ctx.lineTo(col.x, layout.totalHeight);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(col.x + col.width, 0);
          ctx.lineTo(col.x + col.width, layout.totalHeight);
          ctx.stroke();
        });

        // Row boundaries
        ctx.strokeStyle = 'rgba(0, 0, 255, 0.2)';
        if (layout.rowYOffsets) {
          // Variable-height rows
          for (var r = 0; r < layout.rowYOffsets.length; r++) {
            var ry = layout.rowYOffsets[r];
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
          // Bottom edge of last row
          if (layout.rowYOffsets.length > 0) {
            var lastIdx = layout.rowYOffsets.length - 1;
            var ry = layout.rowYOffsets[lastIdx] + layout.rowHeights[lastIdx];
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
        } else {
          var rowH = layout.rowHeight;
          var count = layout._metricCount || layout._storyCount || 0;
          for (var r = 0; r <= count; r++) {
            var ry = layout.headerHeight + r * rowH;
            ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width / dpr, ry); ctx.stroke();
          }
        }

        ctx.restore();
      });
    }
  }

  // Wait for IBM Plex Mono to load before measuring/rendering
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 8px "IBM Plex Mono"'),
      document.fonts.load('500 10px "IBM Plex Mono"'),
    ]).then(initDashboard).catch(function() {
      // Font load failed (CDN down?), render with fallback monospace
      initDashboard();
    });
  } else {
    // Fallback for browsers without Font Loading API
    window.addEventListener('load', initDashboard);
  }

</script>

</body>
</html>
