ducted five rounds of repeated error correction. Furthermore, the eight logical qubits were used to perform a fault-tolerant computation during error correction, successfully demonstrating the combination of logical entangling operations with multiple rounds of quantum error correction. The eight logical qubits exhibited a circuit error rate of 0.002, which is 11 times better than the corresponding physical qubits’ circuit error rate of 0.023. To our knowledge, this is the first demonstration of computation and error correction being beneficially combined, and it showcases the ability of these logical qubits to perform increasingly deeper quantum computations reliably, paving the way to fault-tolerant quantum computing.<br>\nUsing logical qubits, cloud HPC, and AI to solve problems in chemistry<br>\nTo demonstrate the emerging usefulness of quantum computing in chemistry applications, an end-to-end hybrid workflow was used to solve a real problem in chemistry, bringing together computation across cloud HPC, reliable quantum computing, and AI. In the quantum computation, two logical qubits—created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 machine—were used to prepare the ground state of the active space of an important catalytic intermediate (Figure 1) and then measured. The measurement outputs were then integrated with AI to estimate the ground state energy of the active space. This is the first time that HPC, AI, and quantum-computing hardware have been applied in concert to solve a scientific problem.<br>\nAs a first step, the team at Microsoft used AutoCAS and AutoRXN in Azure Quantum Elements to conduct HPC simulations that identified the active space of the catalyst and the catalyst’s reaction pathways, respectively. The team then optimized error-detection codes for use within a customized quantum algorithm on two logical qubits to simulate the quantum behavior of the active space. The logical qubits were then measured to generate classical data using a method known as classical shadows, which uses the measurement outcomes as classical data to train an AI model on the quantum properties of the molecule. This “shadow data” was then used in combination with the AI model to determine chemical properties of the catalyst and estimate the ground state energy of the active space within chemical accuracy (Figure 2). For comparison, the same calculation was performed with physical qubits.<br>\nThe ground state energy of the catalyst’s active space was calculated classically to gauge the accuracy of the hybrid quantum and AI-based result. Using qubits to solve this problem does not demonstrate scientific quantum advantage because the answer can be derived with classical computers. However, some complicated chemistry problems are unlikely to be solved classically with high accuracy, which provides an opportunity for quantum computers to outperform classical computation.<br>\nThe proof-of-concept case study described here is notable for several reasons. To our knowledge, this is the first demonstration of an end-to-end workflow that employs quantum computing, HPC, and AI to simulate and solve a chemistry problem. Furthermore, the quantum-mechanical problem was solved with a high degree of accuracy. These logical qubits produced a better estimate of the ground state energy than the comparable computation with the underlying physical qubits, demonstrating the higher reliability of these logical qubits.<br>\nThis demonstration provides evidence of the emerging usefulness of quantum-classical hybrid computing in chemistry, and it offers an example of how HPC, AI, and logical qubits can be used collectively to solve scientific problems. The logical qubits created with Microsoft’s qubit-virtualization system are being integrated into Azure Quantum Elements, our cloud platform designed to accelerate scientific discoveries. To increase our offerings further, we’re excited to announce that Quantinuum’s InQuantoTM computational-chemistry software package has been integrated into Azure Quantum Elements. InQuanto’sTM pioneering quantum-chemistry algorithms and methods expand Azure Quantum Elements’ tool kit and are available today through private preview.<br>\nMicrosoft’s qubit-virtualization system extends to all types of qubits<br>\nMultiple types of qubit architectures are being explored as potential pathways toward a quantum-computing future. The logical qubits described above were created on Quantinuum’s ion-trap qubit hardware. The team at Microsoft is also applying the Azure Quantum compute platform to the neutral-atom qubits in Atom Computing’s second-generation systems, designed to have over 1,200 physical qubits. Together, Microsoft and Atom Computing have created logical qubits and are optimizing their systems to enable reliable quantum computation. The team at Microsoft also plans to apply their qubit-virtualization system to the topological qubits that are still in development.<br>\nAs advances are made to both quantum hardware and software, qubits will continue to increase in number and fidelity, enabling deeper and more complex quantum computations with logical qubits. When approximately 100 logical qubits are available, scientific quantum advantage—which is expected to help solve some of the world’s most pressing challenges—will likely be achievable.<br>\nMaking logical qubits available through a new hybrid-computing offering<br>\nAt Microsoft, we’re ushering in a new era of reliable quantum computing by offering the Azure Quantum compute platform that brings together Microsoft’s qubit-virtualization system with industry-leading quantum processing units (QPUs) from hardware partners to create reliable logical qubits. Computation with those logical qubits is then integrated with cloud HPC and AI models. Additionally, in collaboration with Atom Computing, we have a commercial offering of a reliable quantum machine.<br>\nBy providing access to reliable logical qubits, accelerated HPC simulations, Copilot for Azure Quantum, and advanced AI models, Azure Quantum brings the powers of quantum computing, classical computing, and AI together. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about Microsoft’s advances in quantum computing<br>\n- Read about Microsoft’s hybrid-computing offering and our collaboration with Atom Computing in the Official Microsoft Blog.<br>\n- Register for the upcoming Microsoft Quantum Innovator Series on how quantum and AI can unlock a new generation of hybrid applications for science.<br>\n- Read the technical papers on today’s logical qubit announcement and the chemistry simulation performed with logical qubits from Microsoft and Quantinuum.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"c4c6ab72eaad17f4a0e8833008e9a220","author":"Krysta Svore","published_at":"2024-09-10T13:00:00","fetched_at":"2026-10-19 18:17:55","word_count":1289,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"109w","domain":"azure.microsoft.com"},{"id":"56f111ee2310cfc0","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","title":"Introducing two powerful new capabilities in Azure Quantum Elements: Generative Chemistry and Accelerated DFT","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","summary":"Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.&nbsp; Microsoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivi","content":"<p>Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.<br>\nMicrosoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivity of scientific research and remove barriers on the path to scientific discovery by substantially reducing the effort and expertise needed to perform what were previously daunting tasks. Specifically, these capabilities use Copilot for Azure Quantum, a natural-language interface that can be used by experts and non-experts alike, making Azure Quantum Elements accessible to more people and increasing the speed at which complex scientific problems can be solved.<br>\nUnlocking solutions to our most pressing challenges will require the world’s collective genius, and we’re excited to put new capabilities into the hands of scientists, students, and organizations such as Unilever so that everyone can contribute to making scientific discoveries that change the world for the better.<br>\nSince its launch, Azure Quantum Elements has served an important role in helping scientists achieve breakthroughs that have paved the way for more sustainable batteries and innovations in the pharmaceutical industry. Today, we’re announcing two new purpose-built capabilities in Azure Quantum Elements that will further increase the productivity and accessibility of chemistry and materials science research—Generative Chemistry and Accelerated DFT.<br>\nGenerative Chemistry helps scientists discover novel, synthesizable, and useful molecules quickly<br>\nThere are hundreds of millions of known molecular compounds and substances and many more remain to be discovered. In the field of chemistry, a major challenge is narrowing down an enormous number of candidate molecules to find the few that are best suited for a particular application. This challenge results in the streetlight effect, which is when the vast number of possibilities is reduced to a reasonable size, not based on the properties of the compounds, but by focusing only on those that have been studied previously. Relying on databases to identify suitable compounds limits the search space so that only known compounds are revealed as candidates for specific applications. Generative AI helps bring to light a much larger portion of the estimated 1060 possible combinations of atoms so that scientists are presented with novel candidates that are likely to serve the intended purpose.<br>\nToday, the Azure Quantum team at Microsoft is announcing Generative Chemistry—an upcoming capability that has the potential to greatly simplify this process and help scientists quickly discover and design new compounds with desired properties, thus increasing the productivity of product innovation.<br>\nGenerative Chemistry, which will be available through Azure Quantum Elements private preview, is an end-to-end workflow that involves multiple steps:<br>\n- You provide information on desired molecular characteristics for your specific application. Additionally, you can supply reference molecules if you already have some possibilities in mind.<br>\n- The information you provide is used to generate seed molecules from a dataset—those seed molecules are then used to initiate the guided AI generation of candidate molecules for your application. This is accomplished by applying multiple AI models and a unique methodology to identify new compounds that match your criteria. In this step, you have several options for configuration such as selecting the most relevant generative AI model, specifying the number of molecules to be generated, indicating the key molecular properties of interest, and screening compounds for toxicity.<br>\n- AI-based screening models predict properties of the candidate molecules that are important for real-world applications—such as boiling point, density, or solubility. A feedback loop sends this information back to the guided AI generation (step 2) to modify the selection of candidate molecules. In this step, you also have the option to fine tune the AI models for your specific application.<br>\n- The pool of potential candidates is further narrowed through a step that uses AI-guided synthesis planning to determine the feasibility of making the molecules in a laboratory—this is important because some novel molecules with desired properties may be difficult to synthesize. In this step, synthesis pathways are predicted, and candidate molecules are filtered based on how easy they are to make.<br>\n- Highly accurate HPC simulations are performed on the top candidates. Accelerated DFT can be used to screen candidates for electronic properties such as dielectric constant, ionization potential, and polarizability. AutoRXN predicts chemical stability or reactivity, and it can also be used to provide insights on possible synthesis pathways.<br>\n- You are presented with the final candidate molecules from which you can select the most promising for laboratory synthesis and testing.<br>\nThis entire process takes only days, shaving months or even years off trial-and-error laboratory experiments that were previously required to arrive at this point. Generative Chemistry suggests entirely new compounds and gives scientists the freedom to focus on only those molecules that are fit for the desired purpose—saving time, money, and effort. This new capability will allow for rapid progress in the development of novel therapeutics, sustainable materials, and more.<br>\nGenerative Chemistry<br>\nWebinar with American Chemical Society<br>\nAccelerated DFT offers substantial increases in speed compared to other density functional theory codes<br>\nDensity functional theory (DFT) is one of the most popular methods in computational chemistry due to its efficiency and accuracy in modeling quantum-mechanical properties. It allows researchers to simulate and study the electronic structures of atoms, molecules, and nanoparticles as well as surfaces and interfaces, thus predicting properties such as dielectric constant, ionization potential, and polarizability. Scientists can then tailor those properties to optimize them for specific applications.<br>\nAlthough DFT is highly valuable for research and product design, most DFT codes need to be run directly by the user in HPC clusters, which can be a difficult undertaking. Additionally, DFT—when run on traditional HPC hardware—requires substantial compute power and becomes constrained as the molecules being studied or designed increase in complexity and size.<br>\nTo simplify and improve this process, Azure Quantum and Microsoft Research designed and launched Accelerated DFT, a code used to simulate the electronic structure of molecules. Accelerated DFT can determine the properties of molecules with thousands of atoms in a matter of hours. It performs substantially faster than other DFT codes and offers a 20-fold average increase in speed compared to PySCF, a widely used open-source DFT code.1<br>\nThe setup of Accelerated DFT is made simple by providing the software as a service, requiring no code compilation or configuration on the user’s part, and it has a simplified API to streamline the computational process. Furthermore, a Python Software Development Kit (SDK) offers seamless integration into a wide variety of computational chemistry environments, which allows researchers to incorporate DFT calculations into complex chemistry workloads. Accelerated DFT is now available in Azure Quantum Elements private preview; it will also become part of Generative Chemistry.<br>\nAccelerated DFT can substantially expedite research across a wide spectrum of chemical disciplines by employing the power of Azure’s cloud architecture. Accelerated DFT can also produce large and highly accurate datasets of molecular properties that can be used to improve AI models, which require large amounts of training data. By rapidly generating training data, new molecules can be discovered faster, and known molecules can be improved, leading to innovations in therapeutics, sustainable products, and more.<br>\n“We have been very impressed by Accelerated DFT for simulating large systems with range-separated hybrid density functionals, where it speeds up the calculations considerably. Furthermore, the team at Microsoft has been very accommodating in quickly resolving technical challenges for our calculations of an active site of an enzyme.”—Tejs Vegge, Professor, Head of Section for Autonomous Materials Discovery, DTU Energy, Technical University of Denmark.<br>\n“Accelerated DFT has an easy-to-use Python interface, and the acceleration in calculations allows for the efficient use of novel hybrid functionals and a large basis set. Estimating key thermodynamic properties can thus be done in a matter of hours.<br>\nAspenTech is excited to be partnering with Microsoft to evaluate the application of quantum chemistry in our physical properties system for process modeling, especially in our sustainability pathways solutions. We anticipate that working with Accelerated DFT will result in strong use cases for characterizing new molecules and materials that are crucial to decarbonizing and circularizing industrial and consumer materials.”—Heiko Claussen, Senior Vice President, Artificial Intelligence Technology at AspenTech.<br>\nAzure Quantum Elements incorporates quantum computing<br>\nWith the addition of each new feature, Azure Quantum Elements becomes a more effective tool for scientists by harnessing AI, HPC, and emerging hybrid-computing capabilities that bring the power of quantum computing to scientific challenges. Recently, we simulated a chemical catalyst by combining classical supercomputers, AI, and logical qubits created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 hardware. In the coming months, we will introduce advanced logical qubit capabilities from Microsoft and Quantinuum to the private preview of Azure Quantum Elements. This classical-quantum hybrid computing offering follows our quantum computing milestone with Quantinuum in which we created the most reliable logical qubits on record with an error rate 800 times better than that of the corresponding physical qubits.<br>\nAdvances in AI and quantum computing have the potential to help researchers solve global scientific challenges. In the future, we plan to offer a quantum supercomputer that can simulate interactions of molecules and atoms at the quantum level, which is beyond the reach of classical computers. This capability is expected to transform research and innovation across many industries. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about how Azure Quantum Elements is revolutionizing chemistry and materials science<br>\n- Read about our collaboration with Unilever in the Official Microsoft Blog.<br>\n- Explore the product overview of Azure Quantum Elements.<br>\n1 Details on the performance of the private preview of Accelerated DFT can be found in the preprint of Acceleration without Disruption: DFT Software as a Service.<\/p>","content_hash":"a6fbb1579c24d7c640e136044b531c4d","author":"Dr. Nathan Baker","published_at":"2024-06-18T15:00:00","fetched_at":"2026-10-19 18:18:05","word_count":1663,"read_time_minutes":9,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"121w","domain":"azure.microsoft.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-10-19 18:16:30","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"142w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-10-19 18:16:30","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"147w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-10-19 18:16:30","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"148w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":null,"content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-10-19 18:16:30","word_count":79,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"151w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":null,"content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-10-19 18:16:30","word_count":76,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"152w","domain":"medium.com"},{"id":"1edf7f311f4678be","feed_id":"qiskit-blog","guid":"https://medium.com/p/69e861fbfc88","title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":null,"content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-10-19 18:16:30","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"154w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":null,"content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-10-19 18:16:30","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"154w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":null,"content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-10-19 18:16:30","word_count":87,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"155w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":null,"content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-10-19 18:16:30","word_count":75,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"156w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":null,"content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-10-19 18:16:30","word_count":86,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"158w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"f474e0bd67f9d14e","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47798","title":"Quantinuum Demonstrates 99.9995% Logical Memory Fidelity on Helios Trapped-Ion Processor","url":"https://quantumcomputingreport.com/quantinuum-demonstrates-99-9995-logical-memory-fidelity-on-helios-trapped-ion-processor/","summary":"Quantinuum has demonstrated a 99.9995% logical memory fidelity on its Helios trapped-ion quantum computer, achieving a logical error rate of 5 × 10-6 per syndrome-extraction round on a distance-7 code. This performance shows exponential error suppression with increasing code distance, with a suppression factor of 12. These results align with the performance targets for Quantinuum's future universal fault-tolerant quantum system, Apollo. The post Quantinuum Demonstrates 99.9995% Logical Memory Fi","content":"<p>In a technical release and research preprint, full-stack quantum computing provider Quantinuum (NASDAQ: QNT) reported quantum error correction (QEC) performance metrics on its commercial Helios trapped-ion quantum computer, measuring a logical memory fidelity of 99.9995%—equivalent to a logical error rate of 5 × 10-6 per syndrome-extraction round on a distance-7 code.<br>\nDetailed in the technical report (“Quantum error correction well below the color code threshold“), the results evaluate triangular color codes across code distances d = 3, d = 5, and d = 7 on the 137-barium (137Ba+) QCCD processor. The measured logical error rates demonstrate exponential error suppression as code distance increases, following an experimental suppression factor of Λ = 12.<br>\n| [ Quantinuum Helios QEC Distance Scaling Benchmarks ] |  |  |  | <br>\n|---|---|---|---|<br>\n| Code Distance / Setup | Physical Qubit Count | Logical Error / Cycle | Suppression Factor (Λ) | <br>\n| • Distance 3 Color Code | • 13 Qubits / Memory Block | • 5.5 × 10-4 | • Baseline (d = 3) | <br>\n| • Distance 5 Color Code | • 37 Qubits / Memory Block | • 3.8 × 10-5 | • Λ = 12 (12x Error Suppression) | <br>\n| • Distance 7 Color Code | • 73 Qubits / Memory Block | • 5.0 × 10-6 | • Λ = 12 (144x total suppression vs d = 3) | <br>\n| • Logical 2-Qubit Clifford (d = 5) | • 2-Block Transversal CNOT | • 7.0 × 10-5 / Gate | • ΛLog = 9 (9x Clifford suppression) | <br>\nKey Architectural & Hardware Observations<br>\nThe study evaluates three core implementation factors within the full-stack architecture:<br>\n- Exponential Distance Scaling (Λ = 12): Each step increase in code distance suppressed logical memory errors by a factor of 12. Based on this measured scaling parameter, Quantinuum projects that target logical error rates of 10-12 across 100 logical qubits can be achieved with ~30,000 physical qubits under this architecture, compared to higher qubit counts required under lower Λ regimes.<br>\n- Dual-Layer Leakage Reduction: To mitigate state leakage out of the computational clock states into non-computational levels, Helios incorporates 3-cycle mid-circuit 1762 nm optical repumping at the hardware level (reducing leakage by 6.5x) alongside software-driven SWAP-superdense leakage reduction circuits that cycle data and ancilla qubits through QCCD ion transport.<br>\n- Sub-Millisecond Neural Network Decoders: In addition to the A*-search Tesseract decoder, Quantinuum trained 3D Convolutional Neural Networks (3D CNN) and Round-Token Transformers (RTT) on emulator data and evaluated them on physical hardware without fine-tuning. Both neural models achieved per-round latencies between 0.2 ms and 0.5 ms on NVIDIA H100 hardware, demonstrating compatibility with real-time streaming decoding.<br>\nThe empirical results align with the performance targets established for Apollo, Quantinuum’s planned universal fault-tolerant quantum system targeted for 2029.<br>\nReview the corporate announcement on Quantinuum Press here, examine the technical blog breakdown on Quantinuum Blog here, and inspect the technical manuscript on Quantinuum Portal here.<\/p>","content_hash":"f1f714eb4a49f1d51209be23596c2457","author":"Mohamed Abdel-Kareem","published_at":"2026-10-19T14:34:23","fetched_at":"2026-10-19 18:16:28","word_count":492,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3h","domain":"quantumcomputingreport.com"},{"id":"28c597e089a405ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18358","title":"Even sampling from a quantum spin glass may not require a quantum computer (a video abstract, for a change)","url":"https://quantumfrontiers.com/2026/10/19/even-sampling-from-a-quantum-spin-glass-may-not-require-a-quantum-computer-a-video-abstract-for-a-change/","summary":"First, why a video? I am part of a generation that was raised on a nourishing diet of science communication videos on YouTube. The likes of MinutePhysics, Veritasium, VSauce, Crash Course, TED-Ed, Physics Girl, 3Blue1Brown &#8212; you name it, these channels were my childhood. Had they not existed, I may very well have never considered pursuing a physics PhD here at Caltech. But you probably already knew about the power of science communication in its ability to inspire the next generation. I am","content":"<p>First, why a video?<br>\nI am part of a generation that was raised on a nourishing diet of science communication videos on YouTube. The likes of MinutePhysics, Veritasium, VSauce, Crash Course, TED-Ed, Physics Girl, 3Blue1Brown — you name it, these channels were my childhood. Had they not existed, I may very well have never considered pursuing a physics PhD here at Caltech.<br>\nBut you probably already knew about the power of science communication in its ability to inspire the next generation. I am here to convince you that science communication just became a whole lot more important.<br>\nEarlier this month, Terence Tao gave a talk at Caltech about the growing use of AI in mathematics. In light of OpenAI’s recent release of hundreds of AI-generated mathematical manuscripts, he argued that our community has transitioned from a long era of proof scarcity to one of proof abundance. As a result, problem-solving may no longer be the central challenge in mathematics and theoretical physics that it once was. What surprised me most, though, was Terence’s claim that problem-solving was never the central goal in the first place. It was only ever a proxy for the actual goal of these disciplines: to elevate human understanding.<br>\nI do not think we have fully internalized this maxim as a community yet. The arXiv is seeing a flood of AI-generated submissions that claim to solve problems but offer very little insight. So how do we encourage human understanding?<br>\nPerhaps a video recording is one good way. Flagship conferences like STOC 2027 have begun requiring video recordings as part of their submission process to prioritize effective scientific communication and filter out low-insight AI-generated submissions. On one level, requiring authors to explain their work over video establishes a standard that scientific research should remain intelligible to others.<br>\nBut on another level, a video recording captures something of the humanness of the act of understanding itself. When I understand something, I feel like I can taste it, almost as if it were a sensory experience. I then feel empowered, as if I have been given a new tool to use, and subsequently feel an excitement to share that insight with other human beings. In other words, understanding is an embodied phenomenon. And what better way to embody your work than to stand before a camera and explain it?<br>\nScience communication is no longer just about communicating science to people outside the field. It is increasingly about ensuring that the scientific progress we make be accompanied by a corresponding growth in human understanding. So go out there and record yourself geeking out!<br>\nAbout the work<br>\nQuantum spin glasses are, in some ways, very quantum systems. Their Hamiltonians contain many non-commuting terms, and their low-energy states can be far from simple product states that are easy to represent classically.<br>\nOne might therefore expect these systems to be difficult to simulate on a classical computer. Yet, in our recent work, we show strong evidence that there is no exponential quantum advantage for sampling from the thermal states of one such quantum spin glass model.<br>\nThe key is to reduce sampling to estimating certain quantities related to the model called tilted means, which we expect to be classically easy. I say expect because our results rely on a conjecture from spin-glass physics that is widely believed to hold true, but has yet to be rigorously proven with existing mathematical tools. Such assumptions are quite common in the spin-glass community.<br>\nThe video above focuses more on why we wanted to study sampling than on how we actually solved the problem in order to make it accessible to a general audience. For those curious, our approach is based on stochastic localization, a sampling technique closely related to diffusion models. More technical details can be found in our arXiv preprint.<\/p>","content_hash":"aad728eb5dc36a8b7b51fbdaa4bc7323","author":"Saleh Naghdi","published_at":"2026-10-19T09:08:28","fetched_at":"2026-10-19 18:16:31","word_count":634,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"9h","domain":"quantumfrontiers.com"},{"id":"7ccdc920e0cf1a86","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18370","title":"Letter to a prospective student","url":"https://quantumfrontiers.com/2026/10/17/letter-to-a-prospective-student/","summary":"It’s been a long summer here at Caltech, in part due to a super El Niño event which hit late but hard, with temperatures creeping up to the 100s in the first week of October. But in the history books (at least those on the history of science), the end of this summer might forever be marked by the events of last week. I’m referring here to OpenAI’s release of a whopping 722 manuscripts (announced as 372 major results, and further organized into a number of subfields or research areas) [1] which c","content":"<p>It’s been a long summer here at Caltech, in part due to a super El Niño event which hit late but hard, with temperatures creeping up to the 100s in the first week of October. But in the history books (at least those on the history of science), the end of this summer might forever be marked by the events of last week. I’m referring here to OpenAI’s release of a whopping 722 manuscripts (announced as 372 major results, and further organized into a number of subfields or research areas) [1] which comes less than a month after the announcement of a Navier-Stokes breakthrough from the same group [2].<br>\nIf you’re an undergrad and/or haven’t been closely following discussions within the theory community earlier in the summer, you could be forgiven for feeling like the LLM resolution of a Millennium Prize Problem, a feat which for any individual would be considered a crowning achievement of mathematics, came a bit out of left field. After all, if you go through trending news headlines over time discussing the concerning possibility of AI tools overshadowing and making obsolete human mathematical achievements, the graph looks something like this:<br>\nHave we dropped the ball with prospective students?<br>\nAside from the popular news headlines, a lot has already been written by and for mathematicians and theorists at the PhD level and above. But the speed at which all of this has happened makes me worried about how effectively we’ve communicated with younger students, since the end of summer also marks the start of another PhD application season. While it’s normal for pre-PhD students to be missing some context on what the day-to-day of a full-time researcher looks like, this year that also means that they seem to have largely (perhaps inadvertently) been left out of the AI discourse. This isn’t just a hypothetical: based on my recent interactions with undergrads, most of them haven’t caught onto the recent jumps in capabilities, or the consequences for the research community.<br>\nThe Navier-Stokes announcement dropped on a seemingly random Tuesday in early September, and immediately hit the forefront of conversation in my circles. Later that same week, I braced myself to face the group of around forty wide-eyed undergrads who would travel to Caltech to attend the FUTURE of Physics workshop, where they would learn all about PhD programs and careers in physics. FUTURE selects for students who are bright, often come from underserved communities or nontraditional backgrounds, and are active members of their communities. As the co-chair of the workshop and one of the student science talk presenters, I tried to preempt the questions I might get on current events, like funding or the state of theory research. But while many students were indeed interested in how to approach professors about whether they had funding for next cycle, I was taken aback to learn that few of them were thinking about AI at all. None of them expressed any concerns about the pace of AI development, nor did they even seem aware that nearly all researchers here would soon be using a (supposedly overhauled and better aligned) version of a model that had hacked several real-world entities [3].<br>\n(If you’re a more senior academic or researcher who’s surprised to hear about this disconnect, you wouldn’t be alone! And you don’t have to take my word for it either: instructors and recent graduates at other universities in the U.S. discussed similar experiences over the past summer.)<br>\nResearch in the time of AI theorem provers<br>\nFor context, all of my PhD work has been theoretical and leans heavily on theorem-proving to push the frontiers of what we understand about physics. However, I also applied specifically to do interdisciplinary research. I’ve always liked taking detours into a wide range of subjects, whether it’s random matrix theory, cryptography, or marine science, and finding the connections between them. My first solo-first-author paper, though unfortunately containing nothing directly relevant to marine biology, was shaped by a number of conversations with colleagues across the quantum, condensed matter, and high energy arXiv categories. To me, the most exciting part of learning about new mathematical frameworks has always been the ways in which they help us bridge and translate between different languages and ways of describing real-world phenomena.<br>\nWith this in mind, I want to chronicle in broad strokes my own perspective on this past summer. I’m focusing on just this short window of time because my perception is that within the quantum information community, the tone of the discussion has shifted very quickly in the last few months, and for good reason. Prior to this spring, I used LLMs for literature searches and was aware of groups who were working on theorem-proving harnesses, but I didn’t find the output of the readily available consumer models to be very reliable. Around April, rumors started to float around about an internal Anthropic model and the possibility that it might push capabilities into the regime of practical cybersecurity risk; the public version of the model released on June 9 for just three days before Anthropic was forced to take it offline due to an export control directive. Over the next month, the rumors grew louder until finally Fable was rereleased on July 1, followed by GPT 5.6 just over a week later, and with it the scrutiny of the entire mathematical and theoretical research community over the first wave of one-shot papers.<br>\nAnd that could have been it, but last month saw yet another round of new releases. For the sake of telling a complete story, I have to report that as surprising as Fable 5 and GPT 5.6-Sol had been, Opus 5.5 is the first release that’s completely blown my mind, for reasons that seem to have missed the broader discourse but are important for my own learning process. Among my colleagues, the consensus has been that since July, GPT has been superior to Fable for theorem-proving tasks. But many of the challenges I’ve agonized most over have been in deciding how to come up with a well-defined question that formalizes some physical intuition in a reasonable way (e.g. what does it mean for random unitaries to be a good model for chaotic Hamiltonian dynamics?), rather than just the difficulty of finding a proof for one once it’s posed. This process of iterating over feasible and well-defined research questions admittedly seems a bit tricky to formulate as a set of verifiable tasks, despite being a large component of writing a physics paper, as acknowledged in this recent preprint for a new benchmark based on theoretical physics calculations [4]. From my own limited experience, though, Opus 5.5 has been significantly better than any other model I’ve tried at taking problems I’ve been stuck on, for which my initial conjecture and attempt at explaining some numerical phenomenon might be completely wrong, and combing through the many-body physics literature to suggest other relevant frameworks and theories.<br>\nShould you apply to do a (theory) PhD in 2026?<br>\nThe pace of advances in AI capabilities over the past summer came as a surprise to many people in the theory community, to the point that by the time the preprint linked above was posted, their theoretical physics benchmark had already been saturated by models released within the last one-and-a-half months. Given this, it’s reasonable to wonder what kinds of changes will have to be made to PhD training. Although I’m not aware of any of the authors commenting publicly on this aspect, I imagine that the work associated with writing a peer-reviewed paper on any one of the calculations in their benchmark would be worthy of advancing to candidacy.<br>\nTo be clear, this is a big deal: in undergrad, you may have spent most of your time on coursework that other people could authoritatively grade for correctness. But by the time you present your dissertation topic in your candidacy exam, you might be the only expert in the world on your own research area. The authors of the very same benchmark also acknowledge that they initially had difficulty grading the output of the model, since nine of the solutions originally provided for the fifty problems turned out to be wrong! In addition, while I have no idea how far the current language model paradigm can be pushed, as of writing I think it’s safe to say that there’s still some room for improvement, given their continual progress on seemingly every benchmark that’s been thrown at them.<br>\nSo what is the value of PhD training, if the machines are now capable of reproducing the kinds of technical output that we’re supposedly evaluated on as grad students?<br>\nI don’t think I’m qualified to speak on behalf of all theorists, but in my view, the difference between pursuing a PhD in theoretical physics and accepting a corporate offer isn’t just that it’s hard to get paid to learn about fun math problems with no immediate applications in industry. A large part of PhD training (and probably post-PhD training as well!) is learning what to do with this kind of freedom.<br>\nI do want to acknowledge that it’s understandably hard to be in a position in which your job is rapidly changing, and where you might not have reliable access to mentorship, directed practice, and tight feedback loops to learn the relevant skills [5]. And all of this applies even when the field isn’t in crisis. But systems and institutions aren’t static, nor have they ever been. And it’s always been the case that the PhD experience is highly dependent on the quality of mentorship as well as the resourcefulness of the lab when it comes to finding opportunities in the explored and uncharted, or tackling high-risk, long-time-horizon problems with limited public funding. In many ways, then, the most important questions to ask when deciding whether to accept an offer remain the same [6].<br>\nPlus, despite how good language models have been for a while now at generating heaps upon heaps of words, rows upon rows of spreadsheets, the PIs and their grant managers who work tirelessly to fundraise, to project manage, and to set high level goals guiding all of this research have managed to hold on to their jobs, and are still being asked to direct the next generation of research proposals. And many of us at Caltech remain excited about budding developments in quantum science, as the next generation of experimental platforms promises to bring us past what theorists can hope to fully predict or simulate.<br>\nThis post marks the conclusion of my initial voyage into theory research over the past three summers, and the first half of my PhD. Many people have asked me whether I regret my choice to pursue a PhD in theoretical physics in the first place, especially given that so many of my close friends and peers from undergrad decided to work in AI safety or adjacent areas following the original release of ChatGPT. There are two main reasons why, after surfacing to face the real world, I still feel that I made the right decision: first, if anything, AI safety might be one of the most compelling reasons for ensuring that humans remain capable of reviewing evidence and making informed decisions. As long as we value citizen participation in science and decision-making, education and STEM education will continue to have a role in society. Second, as a fresh college graduate, I simply didn’t feel ready to direct an original research program, or to shape an entire field of study. No matter how AI capabilities advance, I’d like to think that the PhD can continue to be a safe space for young people to develop “soft” skills like managing projects with a wide range of collaborators and uncertain timelines, and to grow into the scientific leaders of their generation. Plus, you never know when your random matrix tricks might come in handy for some underwater imaging problem.<br>\nAcknowledgements<br>\nI’m grateful to the many peers and colleagues, from both the theory and experimental sides of IQIM, who gave their candid opinions and feedback on this topic. In particular, I’d like to thank Dave Hsieh and Jessica Jiang for co-chairing the FUTURE program and for a number of very insightful discussions, Spiros Michalakis for helpful suggestions on a draft of this post, and everyone in the Caltech theory community who’s engaged with the topic during John’s group meetings. I’d also like to thank Jiahai Feng, Vincent Huang, and Alex Gu, some of the friends in question who have worked in AI safety-adjacent areas, for keeping me honest. Opus 5.5 was used for light copyediting of a draft of this article.<br>\n[1] See Github repository: https://github.com/openai/math<br>\n[2] Press release page: https://openai.com/index/navier-stokes-solution/<br>\n[3] See, for example, https://transluce.org/agent-activity<br>\n[4] The authors of the manuscript also voice additional thoughts on why AI agents have yet to result in similar breakthroughs on major outstanding problems in physics. The full set of benchmark problems and writeup is available at https://arxiv.org/abs/2610.16733.<br>\n[5] The trifecta of learning taken from the excellent https://web.stanford.edu/~aramdas/checklists.html<br>\n[6] Although this list was written for students in statistics and machine learning (and includes terms like “HCI”, i.e. human-computer interaction), I think it’s pretty broadly applicable for quantum information too, even if you’re not interested in quantum learning theory. And you might notice that very few points on this list are about learning purely technical skills!<\/p>","content_hash":"de137e5fb0484b8527e7191777a00378","author":"lauralcui","published_at":"2026-10-18T03:41:17","fetched_at":"2026-10-19 18:16:31","word_count":2229,"read_time_minutes":12,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"1d","domain":"quantumfrontiers.com"},{"id":"f784b21ec0c1a96a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47785","title":"Podcast with Johannes Pollanen, Co-founder of EeroQ and a Professor of Physics at Michigan State University","url":"https://quantumcomputingreport.com/podcast-with-johannes-pollanen/","summary":"Johannes Pollanen, co-founder of EeroQ and a professor of physics at Michigan State University, explains how EeroQ builds qubits from single electrons floating on a film of superfluid helium, and why he thinks the semiconductor chip is the only proven way to scale a quantum computer. The post Podcast with Johannes Pollanen, Co-founder of EeroQ and a Professor of Physics at Michigan State University appeared first on Quantum Computing Report.","content":"<p>Overview<br>\nJohannes Pollanen, co-founder of EeroQ and a professor of physics at Michigan State University, explains how EeroQ builds qubits from single electrons floating on a film of superfluid helium, and why he thinks the semiconductor chip is the only proven way to scale a quantum computer.<br>\nHe covers the different kinds of quantum computer, why helium never freezes, how much helium-3 a dilution refrigerator needs, how a computation runs on a qubit, and what EeroQ’s 10,000-qubit goal means next to IBM’s plans.<br>\nThis video is divided into 14 chapters as follows:<br>\n- 0:00 Quantum computing at a wedding<br>\n- 3:57 Reverse engineering quantum computing<br>\n- 5:15 Quality or quantity of qubits<br>\n- 6:23 The modalities of quantum computing<br>\n- 12:36 You’ll need liquid helium<br>\n- 19:01 Transistors and silicon<br>\n- 20:21 Is that thing behind you using helium-3?<br>\n- 26:15 How do you cool quantum systems?<br>\n- 31:08 How do you make more qubits?<br>\n- 35:15 How do you do a computation on a qubit?<br>\n- 40:05 Faster quantum computers<br>\n- 43:45 Can IBM make a useful quantum computer?<br>\n- 46:00 The quantum lessons of nature<br>\n- 48:33 Carry over question<br>\nTranscript<br>\nQuantum computing at a wedding<br>\nMark Fielding: Disruptors and curious minds, welcome to the good ship thinking on paper. In a world increasingly vibe-coded by 20-year-olds and run by billionaires, this is where you can think for yourself about the impact of technology. Keep listening, and the algorithm can’t touch you, at least for 40 minutes. Sadly, Jeremy can’t be with us today. He’s been called away on a top secret data center mission. He signed a lot of NDAs, so the very fact I’ve mentioned this might get me disappeared. So if I’m not here next week, big AI. But we’re not talking about AI today, we’re talking about quantum computers. We’re talking about scaling quantum computers. And we’re doing this without a PhD. The idea is to combine my beginner’s mind with an expert’s mind, meet somewhere in the middle, probably near me. We’re going to be talking about trapped electrons, trapped ions, we’re going to be talking about scaling quantum computers. We’re going to be talking about the biggest challenges facing the industry and quantum mechanics at the moment. And we’re going to end with our handover question from our last guest, which is a doozy. And today’s guest is Johannes Pollanen, CSO of EeroQ. Johannes, welcome to Eric. Johannes,<br>\nJohannes Pollanen: EeroQ, yeah. Yeah.<br>\nMark Fielding: welcome to Thinking on Paper. Thank you for thinking on paper with us. And rather than read your incredible background, I want to ask you you’re at a wedding, you’ve sat by someone you’ve never met in your life. They say, Johannes, nice to meet you. What do you do? How do you answer that question?<br>\nJohannes Pollanen: Yeah. I, that’s a good, it actually happens.<br>\nMark Fielding: What’s your go to?<br>\nJohannes Pollanen: Yeah. My go to is you know, I start with I’m a physicist by training, but what I do for a living is try to build essentially a next generation of supercomputer using quantum physics and then follow up with like, have you ever heard of quantum computing is sort of what it starts out with. And yeah, that usually gets the ball rolling pretty quickly because people have usually heard of some amount, it’s in the zeitgeist, it’s out there and folks are thinking about it and want to know more. And yeah, that’s how I lead in and<br>\nMark Fielding: You hope that whoever’s wedding it is, they know what your background is and they put you by somebody who can actually who’s like, not whoa. What in those situations, what is the most common go to question they ask you when you say that?<br>\nJohannes Pollanen: Yeah, I often get one of two, I guess I get a handful of similar responses. I’ll often get like, physics, that was my worst subject in high school or college. Which often then heads the conversation off into the other part of my life, which is I’m also an academic. I’m a professor of physics at Michigan State University, which is where we spun out EeroQ from. We’ve developed some of the technology there and then spun it out as a company in Chicago. But often they’ll ask me, like, yeah, I’ve heard of quantum computing. I heard that, you know, when are quantum computers gonna exist, you know? Which I always think is a fun question because actually even my academic colleagues often ask me, like, when are quantum computers gonna exist? And my answer is,<br>\nMark Fielding: Don’t they already exist?<br>\nJohannes Pollanen: Exactly. That’s what I say to them. I say they already exist. You could get on Amazon’s Braket service and connect to one via the cloud right now if you wanted to. You know, they’re not the ultimate machines that we hope to build as a species sometime, but they exist. Like we know that the basic principles work. Yeah.<br>\nMark Fielding: Yeah, well last week we were playing quantum games using a quantum computer with moth quantum and<br>\nJohannes Pollanen: Exactly. Yeah.<br>\nMark Fielding: that was actually kinda cool making quantum music with quantum computers.<br>\nJohannes Pollanen: Yeah. And it totally works. And you can do even more. Not just playing games, right? You can people can simulate small scale molecules and you know, if you’d asked me that five ten years ago, like when are we gonna be actually simulating nature with small scale quantum computers, I don’t think many people would have predicted that we’d be doing that now, but we are.<br>\nReverse engineering quantum computing<br>\nMark Fielding: well let’s start there then. So on the EeroQ website you speak about reverse engineering quantum. And so I like reverse engineering things. So let’s really work backwards by going forwards. If you had a million qubit quantum computer for whatever that’s description is worth, what are you doing with it?<br>\nJohannes Pollanen: Yeah. I think the thing I’m most excited about is associated with chemical simulation and drug discovery. I think if you have millions or tens of millions of physical qubit machines, lots of logical qubits, then you can get to the point where problems that are intractable now in molecular simulation become very tractable. I think that’s the thing that keeps like when I get excited about it, that’s what I get excited about. You’ll also have the opportunities, you know, for cybersecurity and those kinds of things, like, you know, Shor’s algorithm kind of efforts. Those are great. I those don’t get me out of bed in the morning. I think usually it’s the things that can become life-changing, you know, for many people that I find most compelling. You know, sort of related to your first question about the, you know, what do you say to people when they ask you what you do? As I said, I’m an academic. For a long time, the work that I did in physics and in quantum science was really just for the sake of science, for trying to understand about nature. Now that we’re building technologies based on what we know, it’s the first time in my career where we can actually, you know, the things that we’re doing in the research facilities or in the academic labs or national labs in the world actually has the potential to make an impact outside of physics. You know, we can address something like, you know, curing diseases with, you know, computers that can simulate new medicines. And that I find extremely satisfying. I never was an applied person, but I understand once you realize like you can like the things that you’re doing are actually good for the world, it can be very exciting. So I think that’s the thing that I find most compelling. But I do think that for the biggest applications, you’re not just gonna get away with, you know, 100 logical qubits. You’re gonna need a lot. You’re gonna need a lot of qubits. That’s gonna be the big issue. I mean, the bigger you can make the machines, the more powerful they’re gonna be. And for those most impactful things, I think you’re gonna need big machines. Not necessarily large in space, but large in their information processing density.<br>\nQuality or quantity of qubits<br>\nMark Fielding: So if Jeremy was here, he would ask you now on the qubit question, do you want quantity or do you want quality?<br>\nJohannes Pollanen: I think you need both. I think you really do need both. You need, you know, I can tell you a little bit more about our technology specifically, but I think the reason I like our technology is because I think we can get both. We can get high quality qubits, we can get a whole bunch of them, and we can leverage all of the most state-of-the-art advances in algorithms and error correction. And I think you need those things. I think as a community we’ve learned that none of the modalities is perfect in some sense. They all have their challenges. I think all of them can potentially be really successful, at least to some level. And but finding the one that can really like, you know, leverage sort of all of the benefits of all the different modalities, that’s the tricky part. And that’s what I really like about our system. But we can get into the details. Like I said, we have our own challenges too. Yeah. Yeah.<br>\nThe modalities of quantum computing<br>\nMark Fielding: Right. Well, let’s go back to the wedding talk. So I’m dangerous at a wedding. So modalities, I know what that means. Many people listening to Thinking on Paper will think, a quantum computer is a quantum computer. What do you mean modalities? So what are the five big modalities and where does EeroQ fit into that modality network?<br>\nJohannes Pollanen: Yeah. So by modality, I really just mean like what are you, what is the actual hardware that you’re gonna build the quantum computer out of? Because you can, you know, as you say, a quantum computer ultimately is a quantum computer. If you can program it the way a quantum computer should be programmed, it doesn’t matter what’s under the hood in some sense. Just like for a regular computer, it could be transistors, it could be punch cards, it could be vacuum tubes, it could be whatever you want under there. As long as it allows you to process information the same way, fundamentally, it doesn’t matter what the computer is.<br>\nMark Fielding: Yeah, but a punch card and a vacuum tube aren’t gonna give you the same results, are they?<br>\nJohannes Pollanen: Yeah, I mean, they will if you can figure out how to make them big enough, but that’s the big issue, right? Like you’re not gonna make an iPhone out of punch cards or vacuum tubes, nor are you gonna make a laptop. And so we are now facing we’re sort of in the world where there’s all these different competing ways of building computers, quantum computers that are figuring out different parts of how to do it. And but we haven’t yet found, you know, the transistor of quantum computers. So the different approaches to answer your question directly, you know, there’s the superconducting circuits of IBM and Google. There are trapped ions like the ones that Honeywell and IonQ use. There’s now you’ve probably heard, I don’t know if you all have had anyone talk to you from the neutral atom community. They’re very much like ions except without the charge. Yeah.<br>\nMark Fielding: We’ve had Infleqtion on a couple of times.<br>\nJohannes Pollanen: Right. So Infleqtion, or atomic, logical, all of these. There’s a it’s they’re the new kid on the block in some sense. And there’s electrons trapped in semiconductors, so like the things that Intel and HRL used to do, which is now part of IBM. Those they’re using the spins of electrons in semiconductors. There are folks who are working on trying to use particles of light as the qubits, like PsiQuantum and Xanadu. And then, you know, there’s us, which we’re a little bit different, but I think we combine some of the benefits of these others. So we are an electron spin based quantum computing company. We ultimately want to use an electron and its little bit of magnetism. Each electron is kind of like a little north and south pole magnet. And you can make a quantum bit out of that magnetism. And that is what we’re working toward. And I can say more about we take those electrons and instead of having them in the silicon like the semiconductor folks do, we actually just pluck the electrons out and place them above the semiconductor control chip and hover them in vacuum, kind of like an ion trap or a neutral atom system. And the way we do that is by actually coating the underlying chip with a layer of a very thin layer of superfluid helium, and then the electrons float above that surface and are bound to it in vacuum. Yeah, it’s pretty wild, but it’s kind of amazing.<br>\nMark Fielding: Right. Right. Of course they do. Right. We’re gonna get into this in more detail. Yeah, it sounds pretty wild.<br>\nJohannes Pollanen: You know, one of the things that I think is really important about all of these quantum technologies that I think is sometimes lost. As a species, we’ve known about quantum mechanics for like over a hundred years. But it’s only really been in my lifetime that we’ve got to the point where we can take individual quantum objects, whether they’re atoms or photons or electrons or engineer circuits that behave quantum mechanically and control their properties. You know, to like fully deterministically move them make them do what we want and then measure them. But once you have that level of control, then the engineering starts. That’s when you can really build a technology. And that’s where we are and that’s the exciting part, you know. It’s kind of amazing. Quantum mechanics was what I got excited about when I started getting into physics. But now we get to just manipulate it, you know, and do what we want.<br>\nMark Fielding: Right. Right. You mentioned the magnetism and of the electron. Before we get I wanna go over everything you said again. Before we get to that, can you speak about magnetism, why you said the magnetism of the electron, does that matter? And then the role perhaps of magnetism beyond that in the quantum realm?<br>\nJohannes Pollanen: So for us, like you know, you imagine an electron and it’s a little charge, a little negatively charged object, but the electron has a property, a purely quantum mechanical property called spin. But spin is just a word. What it really means, what it really is physically is there’s a magnetic moment, a little north and south pole associated with you can think of each electron as having its own little bar magnet that it carries around with it. And whether those north and south poles point up and down, or whether you create superpositions of that magnetism, you know, in combinations of up and down, you can encode quantum information in that. And that’s actually the thing that, you know, the folks like Intel and HRL and the various startups, Quantum Motion, all of these companies that work on electron-based qubits, they’re utilizing that magnetism of the electron as their quantum bit. And we do the same thing.<br>\nMark Fielding: When you said imagine each one carrying a little bar magnet around. Is that the right way to think about that? Because they’re not really spinning.<br>\nJohannes Pollanen: They’re not spinning, but there is truly a magnetism associated. You can measure, you know, there’s a magnetic interaction just like there would be for two bar magnets. It’s like the electrodynamics of that is the same. It really does boil down to that. But the spin is sort of a bad word in the sense that spin really makes it seem like there is something spinning, which, you know, that’s a very classical way of viewing the world. But ultimately we don’t. You know, sometimes people get hung up on the like we end up using language to describe things that we don’t really have intuition for. So we use words from the classical world to try to describe the quantum world. And there’s not really necessarily a one-to-one mapping on that. We understand how they work in terms of like what we measure and what we do and how we describe it mathematically, but the language often ends up being what do you say, insufficient to fully capture the underlying phenomena.<br>\nYou’ll need liquid helium<br>\nMark Fielding: I wanna build the stack. I want to understand the stack here. And I stack might not be the right word, but the ingredients, the ingredients is a better word. I want to understand the ingredients here. So you mentioned the electron, you mentioned helium. Liquid helium.<br>\nJohannes Pollanen: Yeah, liquid helium.<br>\nMark Fielding: Had a look at liquid helium. There’s some pretty gnarly quotes about liquid helium. Is liquid helium the physical state of the element, helium at extremely low temperatures, specifically when it is cool to about minus 269 degrees, making it the coldest liquid on earth. There was another one which was what was the other. There’s something about being called the cleanest state which what’s that all about?<br>\nJohannes Pollanen: Yeah. So helium at so if you take we have one of our dilution refrigerators back here that goes down to, you know, very close to absolute zero. It goes to like ten millikelvin in temperature. So we build our quantum chips ultimately live inside of machines like that. And very much like what IBM and Google do for their circuits. And at those temperatures, as you say, liquid helium, helium is a gas at room temperature. But if you cool it down, like any gas, it will eventually condense and form a liquid. And helium, you just have to get very, very cold. Forms of liquid. But interestingly, helium has a very funny property. Normally, if you take a liquid and you keep cooling it, eventually it freezes. That is not true for helium. It’s true for everything, every other element known, but helium remains a perpetual liquid all the way down as cold as people have ever gotten. And there’s good reason to believe<br>\nMark Fielding: The only one.<br>\nJohannes Pollanen: The only one, there’s one example. And it’s a purely quantum mechanical effect, actually. Because as you cool these things down, the helium atoms actually become little waves. They become quantum mechanical probability waves. And those waves overlap with one another to the extent that the system can never crystallize. And it forms instead a perpetual liquid. And it actually forms a very funny liquid called a superfluid, which flows without any viscosity.<br>\nMark Fielding: This is where my silly questions come in and I just have to ask. Why does helium behave like that and nothing else does though? Even though you might have just answered that question.<br>\nJohannes Pollanen: Yeah. There’s two I didn’t really I alluded to it, but I didn’t totally answer it. There’s two reasons. One is the helium’s crazy light. So helium other than hydrogen is the lightest of all the atoms. And so that means that when you try to you’ve probably heard of quantum zero point motion. So if you try to confine a quantum particle, it jitters around more and more. That happens more if the underlying atom is very light. So helium has a very large quantum zero point motion. So when you make it a liquid, you’re trying to essentially confine it to a single place, you know, next to its neighbors, but it doesn’t like that quantum mechanically, and so it jitters around. And so that’s one aspect that keeps it a liquid. The other one is if you bring two helium atoms close to each other, they don’t really interact very strongly with each other. They’re kind of, you know, you can’t do chemistry with helium. All of the electronic shells, if you remember from high school chemistry, the electrons on helium are completely filled up in their electronic shells. They can’t interact with one another or form bonds. And normally you need those kinds of bonds and connections to form a solid. And helium can’t do that. And it’s those two properties. It’s chemically inert and it’s very light that allow it to be a liquid forever.<br>\nMark Fielding: Okay, and for those people who are listening not watching this, A, go to YouTube and watch it or click that button on Spotify to make it video or behind Johannes, that is happening in the chambers that we can see.<br>\nJohannes Pollanen: You have like super microphone photos. Yeah. I was just gonna say this property of superfluidity isn’t new, you know. We’ve known about it like since 1904, I think was when helium was liquefied and probably the first demonstrations of superfluidity were achieved. So it’s a state of matter that’s quite exotic and strange, but we’ve known about it as a you know, like we understand that system quite well. But there was a second part to your question, which was the cleanliness.<br>\nMark Fielding: Yes.<br>\nJohannes Pollanen: So if let’s say that you wanna have an electron and you want it to be a qubit, so you wanna shield it from all kinds of noise and decoherence and sources of disturbance. So if you have, say, a material substrate onto which you wanna put the electron or wanna put the electron into that substrate, those things have chemical impurities and crystal defects and all kinds of vibrations and all kinds of stuff that’s terrible. So what you would really like to do is take that electron and you want to hide it away from the rest of the universe, you put it in vacuum very far away from everything. But you need to somehow hold it in vacuum. Holding an electron in vacuum is actually not so easy. But if you bring it near the surface of liquid helium, it actually naturally gets stuck about 10 nanometers above the helium surface and floats there. And then helium at those temperatures is liquid. Everything else is frozen. There’s no other atom around except helium. There’s no magnetism, there’s no charge noise, there’s none of these other things that plague other qubit platforms in the solid state. And so in that sense, it is the cleanest system for hosting one of these electronic qubits. And that’s one of the reasons we like this system. So very much the other natural qubits benefit from this as well. So for example, atoms and ions are hidden away in vacuum and then you interrogate them with lasers. And the reason that they’re so high coherence and so perfect is because they’re in vacuum very, very far away from other things.<br>\nMark Fielding: So no lasers for you.<br>\nTransistors and silicon<br>\nJohannes Pollanen: No, yes, no lasers whatsoever. We use so actually I’ll mention the other thing that really we love about this technology is that so the other important part is that we you know, you asked this question earlier about how do you what do you need, quality or quantity? And I said both. So we kind of addressed the quality issue just now.<br>\nMark Fielding: Yeah.<br>\nJohannes Pollanen: But the quantity issue is very important. And you h
