e, according to the fluctuation–dissipation theorem. To understand why, imagine preparing the system in a thermal state, perturbing the system at an early time, and measuring the system later. What information can you extract about the perturbation? A two-time correlation function encodes this information. Imagine Fourier-transforming a two-time correlation function. The Fourier transform is proportional to a second derivative of a free energy, according to the fluctuation–dissipation theorem. (The second derivative should sound plausible because it depends on a two-time correlation function.) Second derivatives of free energies equal response functions, such as the magnetic susceptibility. Therefore, a nonequilibrium response depends on an equilibrium correlator.<\/p>","content_hash":"03441b4c88ad1e7bcaaf5c5d077f227b","author":"Nicole Yunger Halpern","published_at":"2026-09-27T19:29:51","fetched_at":"2026-11-17 01:29:04","word_count":869,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"7w","domain":"quantumfrontiers.com"},{"id":"abcdfe6532909136","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18268","title":"Quantum Computers Need More than “Magic”","url":"https://quantumfrontiers.com/2026/09/20/quantum-computers-need-more-than-magic/","summary":"The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.&nbsp; Between the bringing of the bread a","content":"<p>The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.<br>\nBetween the bringing of the bread and the serving of the soup, the conversation at my end of the table typically turns to my topic of research: quantum computers. These theoretical machines harness quantum physics to outperform their classical counterparts. Quantum computers hold great promise for the future, with applications ranging from drug discovery to cybersecurity. Yet, despite their promise, we still do not have a satisfying answer to the fundamental question: what makes quantum computers computationally stronger than classical computers?<br>\nTo answer this question, imagine that tonight, instead of the soup, the cooks are brewing a happiness potion. This potion causes the drinker to be joyful and content for the rest of the evening. The cooks know how to brew the potion perfectly well; they discovered the list of ingredients in the nineties and have been successfully brewing ever since. But the cooks still cannot solve one mystery: what makes the potion different from the soup? What ingredient sets the potion apart from the soup?<br>\nThe cooks come up with a simple approach. They leave out one ingredient in each serving, and then carefully observe the formal-goers. They find that almost every seat is filled by a happy student, chatting away to their neighbours, indicating a working potion. However, one student’s spirits have not been lifted, as they were solely served a simple soup. The cooks conclude that the ingredient they withheld for that student was essential. They name this ingredient magic.<br>\nIn my research, the potion is a quantum computer, the soup is a classical computer, and magic is the actual technical term used for quantum states that promote certain classical computers to quantum computers. Without magic, these quantum computers are computationally no stronger than a normal laptop.<br>\nSo magic is necessary for quantum computational advantage, but is it enough? Over a decade ago, researchers found that, for quantum computers built on qutrits, the answer is no. To understand what a qutrit is, consider the regular bit: a switch that’s either zero or one. The qubit, the quantum generalization of the bit, can be both zero and one simultaneously. The qutrit is a roomier qubit that can be zero, one, two, or any of those simultaneously.<br>\nIt is possible to build quantum computers using qutrits. However, the vast majority of quantum computers are built on qubits, the quantum generalisation of the everyday bit. My colleagues and I have recently discovered that for qubit-based quantum computers, too, magic is not enough to gain an advantage over classical computers. Picture the cooks dumping jar after jar of magic into a soup, only to find that the soup never gains magical powers. Potions need more than magic. Potions also need Kirkwood-Dirac negativity.<br>\nWhat is Kirkwood-Dirac negativity? The idea developed by John Kirkwood and Paul Dirac builds on probabilities—for example, the odds of obtaining a heads upon flipping a coin. One can describe a quantum computer using numbers that behave similarly to probabilities but come with a twist: they may be negative. These negative “probabilities” mark where quantum departs from classical. The main result of our paper is that this negativity, too, is a necessary ingredient: without it, no amount of magic will turn the soup into a potion.<br>\nAt this point in the conversation, I am typically cut off by the arrival of the soup. The conversation moves on from quantum computers to different subjects, and I usually look up at the paintings staring down at me. One of them is of Dirac, who spent many dinners discussing quantum theory in the same dining hall. The University of Cambridge is a special place.<\/p>","content_hash":"8c54ccd29fbd109c79f02546399e0593","author":"jjthio","published_at":"2026-09-20T16:49:32","fetched_at":"2026-11-17 01:29:05","word_count":678,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"8w","domain":"quantumfrontiers.com"},{"id":"3f8f2a08f44c12ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18162","title":"How can objects interact without touching?","url":"https://quantumfrontiers.com/2026/09/06/how-can-objects-interact-without-touching/","summary":"Rethinking the electric field Have you ever wondered what an electric field actually is?&nbsp; The electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.&nbsp; Most textbooks define the electric field ","content":"<p>Rethinking the electric field<br>\nHave you ever wondered what an electric field actually is?<br>\nThe electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.<br>\nMost textbooks define the electric field as a property of space or a physical entity surrounding electric charges, or with the equation of force per unit charge. These definitions help us understand what the electric field does and its effect on electrically charged particles, but they do not fully answer what an electric field actually is and how it influences charges. Thus, I started thinking about the question: what allows charges to influence each other without touching?<br>\nThis question led me down a path that began with a simple observation in everyday life, and it eventually pointed toward much deeper ideas in modern physics.<br>\nObjects Influenced by Their Surroundings<br>\nBefore talking about electric fields, let’s consider a more basic question: Does it seem reasonable that objects can be influenced by their surroundings?<br>\nMost people would answer yes. We have all seen examples of objects responding to something else nearby, such as the Earth orbiting the Sun, a compass needle reacting to a magnet, and our phones responding to signals from a WiFi router. But what is the mechanism behind these interactions?<br>\nA simple physical phenomenon that we can look at is a balloon rubbed on a piece of clothing that can pick up strands of our hair. Many of us have seen this demonstration in kindergarten or first grade of elementary school. This might seem completely ordinary, but if we pause and think about it, something strange is happening – the balloon is influencing the hair without touching it.<br>\nHow is that possible? One answer is simply that the balloon “pulls” on the hair, but this raises more questions. How does the balloon reach the hair? What is happening in the space between them? These questions suggest that something is missing from the picture of objects pulling on each other directly through contact.<br>\nTo put this in the context of physics, we might all have learned that “like charges repel, and opposite charges attract”. We might have solved equations on how fast charges would move away from or toward each other. We were always told to just accept it because these motions result from the electric field. But why do these observations happen? What is happening between the charges?<br>\nHistorically, physics encountered the same problem. If one object can influence another at a distance, it is natural to ask what is happening in the space between them. One guiding principle that physicists often use is the concept of locality. Locality is the idea that an object can only be directly influenced by its immediate surroundings. Thus, an influence should not simply leap across space from one object to another, and changes should propagate through intermediate regions step by step.<br>\nAt first glance, locality seems reasonable because it matches many of our everyday experiences. If I push a book across a table, my hand influences the book through direct contact. The influence does not appear to jump instantaneously across the table.<br>\nHowever, locality creates a tension when we return to the scenario of the balloon pulling on strands of hair. If locality is true, something must be happening in the space between the balloon and the hair. But from a standard electromagnetic perspective, the space between the balloon and the hair is empty. Therefore, we have encountered a contradiction: if what is between the balloon and the hair is empty space, then what is responsible for transmitting the influence? Neither the usual electromagnetism nor locality tells us the answer to these questions.<br>\nThe Classical Electric Field<br>\nIn the usual electromagnetic picture, the answer to the puzzle is the electric field. Rather than allowing charges to influence one another directly across space, the theory assigns an electric field to the space surrounding charges. The field acts as the intermediary through which influence is transmitted.<br>\nA useful way to think about the electric field is that it assigns information to every point in space. If we imagine a charged particle that is placed at a particular location, the electric field tells us how that particle would move. This charged particle is what physicists call a test charge. By observing how the test charge behaves, we can infer information about the electric field at that location.<br>\nThis could seem like a satisfying answer as the electric field tells us how influence is transmitted, but it does not tell us what kind of thing is doing the transmission. Is the electric field a physical substance? Is it a mathematical tool? Or is it something else?<br>\nIt might be easy to fall back on the idea that the electric field ultimately works through tiny particles physically touching one another. After all, contact interactions are among the most familiar interactions that we experience.<br>\nBut physics challenges this intuition as well. It is surprisingly difficult to define what it means for two objects to “touch”. We usually think of the balloon attracting hair as an example of action at a distance, whereas pressing a hand on a table feels like direct physical contact. However, at the microscopic level, the two situations are fundamentally similar. If we could zoom in on our fingertip and the table with a microscope, we would find that the atoms in our skin never make contact with the atoms in the table. This is because of the repulsion between the electron clouds surrounding the atoms, which prevents the two atomic nuclei from overlapping. Say if we scale the atom in the table up to be the size of a marble, then the nearest atom in our fingertip would still be separated from it by a few centimeters. In the end, nothing is truly “touching” in the intuitive, physical sense.<br>\nThus, the idea of contact does not solve our problem. We are forced to ask the same question again: what is it that allows these interactions to occur? To answer that question, I turned to a different perspective of thinking about electric fields.<br>\nThe Electric Field as A Dynamical Structure<br>\nFrom our intuition, it is natural to imagine the electric field as some invisible substance filling space. This is often the picture suggested by the common field line diagrams in physics textbooks, which make the field appear to flow outward or inward from charges, almost like a moving fluid.<br>\nA useful analogy is the ocean. A boat floating on water can move because waves pass beneath it. The boat responds to changes in its surrounding waves rather than to some direct push from a distant object. Similarly, charged particles respond to changes in the electric field around them. We can then view the electric field as a dynamical structure that governs how the state of the world can evolve.<br>\nHowever, the ocean analogy can only take us so far. Ocean waves are made of water molecules. Sound waves are made of vibrating air molecules. But what is the electric field made of? When light travels through empty space, it seems that there is no material medium at all.<br>\nThis brings us back to the mystery: if locality suggests that something must exist in the space between interacting objects, and if the electric field is not made of the ordinary matter that we understand, then what exactly is occupying the space?<br>\nTo answer this question, we have to rethink what we mean by “empty” space itself.<br>\nEmpty Space is Not Empty<br>\nConventionally, we have always imagined empty space as exactly what the name suggests—empty. Just like if all the particles were removed and nothing was remaining. But modern physics suggests a very different picture.<br>\nIn quantum field theory, what we call “empty space” is not truly empty. Empty space is filled with underlying quantum fields that permeate all of space and time, even in the absence of particles. Even when the surface of the ocean looks perfectly still, the water is still there. The ocean is not defined only by visible waves, but by the underlying medium that can support waves in the first place. The waves are patterns of motion of the ocean itself, just like the electric field. These fields are part of the fundamental structure of the universe from which physical phenomena emerge. Quantum field theory suggests that particles are not independent objects moving through an otherwise empty space. Rather, they are localized patterns or excitations of underlying fields that already exist throughout the universe.<br>\nFrom this perspective, the electric field is not something that is added to empty space. It is part of the fundamental dynamical structure of space itself.<br>\nConclusion<br>\nAt the beginning, I asked a simple question: how can objects influence each other without touching? The straightforward answer is the electric field. Charges create electric fields, and those fields determine how other charges move. But what is an electric field? Is it an invisible material filling space between objects, or is it a dynamical structure that governs how physical systems in the world evolve?<br>\nFrom the perspective of quantum field theory, quantum fields permeate all of space and time. Particles are not separate objects moving through an empty space, but are excitations of these underlying fields; electric fields are not secondary matter surrounding charged particles, but are particular configurations of the underlying electromagnetic quantum fields. What we observe as the motion of a charged particle is the result of its interaction with the electromagnetic field, whose local state determines how the particle evolves.<br>\nIn the end, our original question may not have a single definitive answer. But asking it revealed a shift in perspective, and physics has repeatedly shown that every explanation opens the door to an even more fundamental question. Stopping at this step, a new mystery emerges: what are these underlying quantum fields themselves? What are they made of, and where do they arise from?<\/p>","content_hash":"72ad48be59eb5d47ff76fadb3908d2c5","author":"adelynnt","published_at":"2026-09-06T13:17:26","fetched_at":"2026-11-17 01:29:05","word_count":1697,"read_time_minutes":9,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"10w","domain":"quantumfrontiers.com"},{"id":"b2281c07172b699a","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18092","title":"The Universe, the Uncanny, and Fashion","url":"https://quantumfrontiers.com/2026/08/31/the-universe-the-uncanny-and-fashion/","summary":"In the beginning there was a question. Actually, no, in the beginning there was language. The question came later, presumably as one of its side effects. Since then we have asked about nearly everything, though the answers have done little to alter our circumstances. Human existence has always seemed strange to me. We arrive without consent, in a place not of our choosing, then spend decades asking why, until we close our eyes and enter the abyss of nothingness. Some people accept this situation","content":"<p>⚛⚛⚛<br>\nIn the beginning there was a question. Actually, no, in the beginning there was language. The question came later, presumably as one of its side effects. Since then we have asked about nearly everything, though the answers have done little to alter our circumstances. Human existence has always seemed strange to me. We arrive without consent, in a place not of our choosing, then spend decades asking why, until we close our eyes and enter the abyss of nothingness.<br>\nSome people accept this situation very well. I did not.<br>\nUntil my mid-teens, I tenaciously found one solution in fashion. If I could not understand who I was, I could at least decide what version I could become. Clothes gave form to something otherwise difficult to locate. Desire, after all, begins with a lack.<br>\nIt was only later that physics presented a solution to the same lack, only with more elaborate mathematics.<br>\nQuantum mechanics tells us that the world beneath the familiar world does not behave as we experience it. A thing can resist being one thing, certainty begins to dissolve, and reality becomes strangely unfamiliar. The uncanny begins very close to home.<br>\nIt is in this uncanniness that fashion and physics, liminally, meet for me: both begin with a human being standing before something they cannot understand, the universe in one case, the self in the other, and trying to make a form out of it.<br>\nBut even this distinction, on closer inspection, begins to collapse; for our desire to understand the universe has always concealed a deeper desire to understand the self that stands within it.<br>\nAll roads eventually lead back to the interests you had as a child, or so I say.<br>\nI would squint into the dark, my mind already at work. I would imagine the next thing I would wear, project its color and fabric onto the ceiling.<br>\nThen, go to the bazaar, Rangrizano Dana, where, as the Kandaharis like to say, everything is sold except one’s mother and father.<br>\nThe designs that had existed only in my head, after night upon night of theorizing and calculating, were finally beginning to take shape. The alleys of Rangrizano Dana were full of fabric of different textures and colors.<br>\nOnce the fabric was bought, came the tailoring. Tailors hold a special place in Afghanistan. Some are stars in their own right, the kind you have to book an appointment with. And once you get there, another matter comes up: making the tailor promise not to show your design to another woman. Everyone wants to wear something unique. So, naturally, there is a lot of secrecy.<br>\nThe designs themselves would either be described or sketched. Somewhere between what was imagined and what the tailor could make, something would emerge. And the day the tailor shipped your clothes was really a day of revelations.<br>\nTime passed, which is another way of saying the object of my desire changed. The same attention once spent on cut, texture, and appearance turned, little by little, toward the fabric of space and time.<br>\nStudying physics, I organized my process in the same way. There was again an idea that existed first in the mind, and then the problem of giving it form.<br>\nOnly now the materials were different. Instead of cloth, there was mathematics; instead of the tailor’s table, the blackboard and chalk. And, standing before it, more often than not, a badly dressed physicist covered in chalk dust. All the libidinal energy of the universe, you might say, had been sublimated into equations.<br>\nFashion had, in some ways, been the more serious pursuit. There was something at stake: you wanted to look better than everyone else. Physics, by comparison, could be surprisingly playful.<br>\nAlice sends a particle to Bob. The sound of those names would tickle my Pashto ear then, and still cracks me up now. Cats are placed in boxes, both dead and alive. Observers hover near black holes or sometimes even, whooooooosh, fall into them.<br>\nSo, in this way, in my mind’s eye, the physicist has become a rather more amusing figure: a tailor of space and time. The universe, of course, is a notoriously difficult client (perhaps even more difficult than a Kandahari woman making her tailor promise not to show her design to anyone else).<br>\nHe begins, as any tailor must, with an imagined shape. Mathematics is his chalk, his scissors, his needle. With it he marks the fabric, cuts it, folds it, joins one piece of reality to another. Some constructions fall upon the universe with elegance. Others bunch at the shoulder, pull at the waist, or refuse altogether to button, and must be altered, or thrown away completely.<br>\nA tailor works against the resistance of the human body; a physicist against the resistance of the universe.<br>\nImagine, then, a physicist seated at the edge of a black hole, spectacles low upon his nose, sewing little cloaks from the fabric of spacetime.<br>\n“How many dimensions will you need?” asks Alice.<br>\n“That depends upon the suit,” he replies.<br>\nFor AdS/CFT, suppose we are making a three-dimensional garment. The tailor of the universe never begins with three dimensions. Before him lies only the flat, two-dimensional fabric, with all its degrees of freedom spread upon the board.<br>\nIt is then, in a less sartorial language, we might call the disentangling and entangling of degrees of freedom; the tailor coaxes a third dimension out of the flat cloth. This is the secret embroidery of the holographic idea: what appears to the wearer as a three-dimensional world is encoded in a fundamentally two-dimensional way.<br>\nBob tries this newly fashioned quantum garment on before entering the black hole.<br>\n“Too tight,” he says. “See if there is more degree of freedom.”<br>\nThe physicist frowns, takes up his chalk, and makes another small mark, with some disentangling and entangling here and there.<br>\nWhat could have been wrong? Well, perhaps the group theory has been chosen badly, the symmetry is broken, and a representation must be changed, a seam opened, a dimension added, or one cunningly concealed.<br>\nAlice watches him work, the almighty tailor of the universe, making change without a change.<br>\n“But how do you know when the suit is right?”<br>\nAnd with that, the physicist looks at her.<br>\n“What do you want? Do you want to put me out of work? Unknowing is the lack that drives us to make more suits. If we knew the suit was right, that would be the end of everything.”<\/p>","content_hash":"8dd0c9a6fca489753e5d9567fc10e568","author":"Sola Mahfouz","published_at":"2026-08-31T21:28:38","fetched_at":"2026-11-17 01:29:05","word_count":1082,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"11w","domain":"quantumfrontiers.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-11-17 01:29:03","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"146w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-11-17 01:29:03","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"151w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-11-17 01:29:03","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"152w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":null,"content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-11-17 01:29:03","word_count":79,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"155w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":null,"content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-11-17 01:29:03","word_count":76,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"156w","domain":"medium.com"},{"id":"1edf7f311f4678be","feed_id":"qiskit-blog","guid":"https://medium.com/p/69e861fbfc88","title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":null,"content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-11-17 01:29:03","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"158w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":null,"content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-11-17 01:29:03","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"158w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":null,"content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-11-17 01:29:04","word_count":87,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"159w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":null,"content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-11-17 01:29:04","word_count":75,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"160w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":null,"content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-11-17 01:29:04","word_count":86,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"162w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"a0e5f6f63b04a137","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48798","title":"IBM, Fermilab, and NVIDIA Unveil Modular Quantum Co-Design Platform, Slurm HRES Integration, and GPU QEC Tools at SC26","url":"https://quantumcomputingreport.com/ibm-fermilab-and-nvidia-unveil-modular-quantum-co-design-platform-slurm-hres-integration-and-gpu-qec-tools-at-sc26/","summary":"At SC26, IBM, Fermilab, and NVIDIA unveiled a modular quantum-classical co-design platform, integrating GPUs with quantum processors. They also announced native quantum resource scheduling in Slurm 26.11 and new GPU-accelerated quantum error-correction (QEC) software, including the TCBP-JOBS algorithm and CUDA-Q QEC 0.9.0. These advancements aim to improve quantum computing workflows, error correction, and resource management in supercomputing environments. The post IBM, Fermilab, and NVIDIA Unv","content":"<p>At the SC26 supercomputing conference in Chicago, IBM, NVIDIA, and the U.S. Department of Energy’s Fermi National Accelerator Laboratory (Fermilab) announced plans for a modular quantum-classical co-design platform, accompanied by native quantum resource scheduling in Slurm 26.11 and new GPU-accelerated quantum error-correction (QEC) software releases.<br>\n| SC26 Quantum-HPC Co-Design, Scheduling & QEC Stack |  |  | <br>\n|---|---|---|<br>\n| Platform Layer | Key Partners & Software | Technical Scope & Measured Benchmarks | <br>\n| Modular Co-Design Platform | Fermilab SQMS Center, IBM, NVIDIA (DGX B200 + Nighthawk) | Co-locates GPUs with 120-qubit Nighthawk QPUs (7,500 2Q ops, 100k samples/s) and future SQMS SRF cavities. | <br>\n| TCBP-JOBS & CUDA-Q QEC 0.9.0 | NVIDIA CUDA-Q QEC 0.9.0, Decoding Server, task graphs | Delivers up to 4.5x lower LER and 10x to 13,000x faster decoding than Tesseract (24.2M shots in 45 min). | <br>\n| HPC Workload Scheduling | Slurm 26.11 Hierarchical Resources (HRES) + QRMI & QDMI | Adopted by IBM, Quantinuum, Pasqal, IQM, Alice & Bob, and MQSC to schedule shared QPUs across HPC nodes. | <br>\nFermilab, IBM, and NVIDIA Plan Modular Co-Design Platform<br>\nBuilding on the long-running collaboration between IBM and Fermilab’s Superconducting Quantum Materials and Systems (SQMS) Center, the three organizations will physically co-locate NVIDIA DGX B200 systems with IBM Quantum Nighthawk processors. Fermilab will coordinate researcher access and hybrid workflows through its HEPCloud infrastructure to study lattice gauge theories, neutrino interactions, and nuclear physics simulations.<br>\nIn its initial phase, the testbed will emulate inter-module communication links to quantify how routing errors, latency, and classical feedback affect multi-QPU execution. A subsequent phase plans to integrate Fermilab’s ultracoherent superconducting radio-frequency (SRF) cavity hardware as quantum memories, entanglement buffers, and bosonic error-correction resources, complementing the IBM-ORNL-AMD co-design platform deployed earlier this month in Poughkeepsie.<br>\nGPU-Accelerated QEC Decoders and Runtime Frameworks<br>\nDetailed in a technical study by NVIDIA researchers, the new TCBP-JOBS algorithm pairs Trajectory-Calibrated Belief Propagation (TCBP) with GPU-parallel Jittered Ordered Statistics Decoding Beam Search (JOBS) across surface, color, and bivariate-bicycle quantum low-density parity-check (qLDPC) codes. At physical error rates between 0.1% and 0.4%, TCBP-JOBS maintains millisecond-scale serial latencies (4.08 ms for 12-round gross-code memory and 13.5 ms for logical lattice surgery at 0.2% error) suitable for neutral-atom and trapped-ion feed-forward operations, while exact search decoders such as Tesseract remain more accurate in ultra-low-noise regimes (0.01% to 0.05%).<br>\nReleased inside CUDA-Q QEC 0.9.0 alongside a containerized Decoding Server, composable parallel-window task graphs, and 1.3x to 3.2x faster Relay-BP kernels, TCBP-JOBS joins broader SC26 QEC tooling including IBM and AMD’s open-source Pelagos GPU simulation suite, a multi-institutional hierarchical decoding taxonomy co-authored by AMD, HPE, Riverlane, Xanadu, IQM, and IBM, and an NVQLink FPGA control bridge demonstrated by Altera and Oxford Quantum Circuits.<br>\nNative Multi-Node QPU Scheduling in Slurm 26.11<br>\nTo eliminate custom middleware at the roughly 30 supercomputing centers deploying more than 50 quantum processors worldwide, NVIDIA, IBM, and Pasqal integrated the open-source Quantum Resource Management Interface (QRMI) and Quantum Device Management Interface (QDMI) directly into Slurm 26.11’s Hierarchical Resources (HRES) scheduler. Because QPUs operate as shared multi-node resources rather than node-local accelerators, HRES allows administrators to allocate, reserve, and account for quantum hardware alongside CPUs and GPUs under standard cluster policies.<br>\nReview the official announcements from IBM here, Fermilab here, and NVIDIA here, along with technical blogs from IBM Quantum here and NVIDIA here. Access the TCBP-JOBS technical paper here, the CUDA-Q QEC 0.9.0 release notes here, and the multi-institutional hierarchical decoding review on arXiv here.<br>\nRelated QCR coverage includes our reports on IBM and AMD’s open-source Pelagos GPU decoder framework here, the IBM, RIKEN, and NVIDIA 79x accuracy gain on iron-sulfur cluster simulations here, the U.S. Department of Energy’s Quantum Genesis initiative here, the multi-institutional QRMI consortium expansion here, IBM’s 520-qubit Nighthawk r3 roadmap here, and the IBM-ORNL-AMD co-located error-correction platform here.<\/p>","content_hash":"f7620f70f891ddc65a4d2e0c9d84f72b","author":"Mohamed Abdel-Kareem","published_at":"2026-11-16T19:25:37","fetched_at":"2026-11-17 01:28:59","word_count":636,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"6h","domain":"quantumcomputingreport.com"},{"id":"836a628ccac3d65a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48799","title":"IBM, RIKEN, and NVIDIA Achieve 79x Accuracy Gain in Quantum-Classical Simulations of Iron-Sulfur Clusters","url":"https://quantumcomputingreport.com/ibm-riken-and-nvidia-achieve-79x-accuracy-gain-in-quantum-classical-simulations-of-iron-sulfur-clusters/","summary":"Researchers from IBM Quantum, RIKEN, and NVIDIA have achieved a 79-fold improvement in energy accuracy for quantum-classical simulations of iron-sulfur clusters. This was done by initializing Sample-Based Quantum Diagonalization (SQD) with broken-symmetry unrestricted Hartree-Fock (BS-UHF) reference states, bringing ground-state energy estimates for a 72-qubit [Fe4S4(SCH3)4]2− active space within 4.3 millihartree of high-precision classical benchmarks. The study highlights the importance of refe","content":"<p>Researchers from IBM Quantum, RIKEN, and NVIDIA have demonstrated a 79-fold improvement in energy accuracy for quantum-classical simulations of strongly correlated iron-sulfur clusters by initializing Sample-Based Quantum Diagonalization (SQD) with broken-symmetry unrestricted Hartree-Fock (BS-UHF) reference states. Executed on the ibm_kingston quantum processor alongside RIKEN’s NVIDIA GB200-powered ROQUO supercomputer, the calculation brought ground-state energy estimates for a 72-qubit [Fe4S4(SCH3)4]2− active space within 4.3 millihartree of high-precision classical density-matrix renormalization group (DMRG) benchmarks.<br>\n| Broken-Symmetry SQD Benchmark Profile on [Fe4S4(SCH3)4]2− |  |  | <br>\n|---|---|---|<br>\n| Workflow Dimension | Experimental & Algorithmic Configuration | Measured Outcome & Reference Comparison | <br>\n| Molecular System & Circuit | CAS(54e, 36o) active space; 88 active qubits on ibm_kingston | Executed 1-layer LUCJ circuit (3,944 CZ gates, 2Q depth 276) across 5 million hardware shots (~25 min QPU). | <br>\n| Reference Preparation | Atom-localized Noodleman BS-UHF initial density | Lowered starting mean-field energy by ~534 mHa vs. closed-shell RHF (−327.0809 Ha vs. −326.5474 Ha). | <br>\n| Subspace Diagonalization | qcsc-prefect workflow across ROQUO, Miyabi-G, and Fugaku | Reached −327.235076 Ha at subspace dimension d = 3 × 1010 (512 to 517 mHa deeper than RHF-seeded SQD). | <br>\n| Asymptotic Extrapolation | Gaussian-in-log d extrapolation (d → ∞) | Yielded −327.244468 ± 1.05 mHa, matching extrapolated DMRG (−327.244797 ± 0.46 mHa) within 0.33 mHa. | <br>\nIron-sulfur cubane clusters play central roles in biological electron transfer and catalysis, but their antiferromagnetically coupled iron centers create dense multireference electronic correlations that challenge closed-shell quantum chemistry approximations. Previous SQD studies initialized from restricted Hartree-Fock (RHF) determinants stalled more than 500 millihartree above exact ground-state benchmarks even at large subspace dimensions.<br>\nBy extending the open-source qcsc-prefect workflow to construct spin-polarized, fragment-localized Noodleman initial guesses verified via internal and external stability analysis, the team steered quantum sampling directly toward chemically relevant magnetic configurations. After validating the method on a 40-qubit [2Fe-2S] dimer using ibm_fez, the researchers scaled configuration recovery to 36 nodes (144 NVIDIA GB200 GPUs) of ROQUO and demonstrated cross-architecture checkpoint portability across JCAHPC’s Miyabi-G GPU cluster and RIKEN’s CPU-based Fugaku supercomputer.<br>\nSupported by Japan’s New Energy and Industrial Technology Development Organization (NEDO) under its quantum-supercomputer hybrid platform initiative, the study highlights reference-state preparation as a primary driver of SQD accuracy alongside subspace size and GPU-accelerated Davidson diagonalization.<br>\nRead the full technical preprint on arXiv here, review the accompanying OpenMP GPU offload study for SQD diagonalization here, and see IBM’s SC26 technical overview here.<br>\nRelated QCR coverage includes the IBM, Fermilab, and NVIDIA modular co-design platform and Slurm 26.11 integration here, IBM and AMD’s open-source Pelagos GPU decoder framework here, the Cleveland Clinic, RIKEN, and IBM 12,635-atom Gordon Bell finalist simulation here, and IBM’s quantum-centric supercomputing reference architecture here.<\/p>","content_hash":"81b2bcbe0241da38cef99ee8624fb2a5","author":"Mohamed Abdel-Kareem","published_at":"2026-11-16T19:08:33","fetched_at":"2026-11-17 01:29:00","word_count":453,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"6h","domain":"quantumcomputingreport.com"},{"id":"d41e147f6b13337a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48801","title":"IBM and AMD Open-Source Pelagos GPU Decoder Framework for Large-Scale qLDPC Error Correction Simulations","url":"https://quantumcomputingreport.com/ibm-and-amd-open-source-pelagos-gpu-decoder-framework-for-large-scale-qldpc-error-correction-simulations/","summary":"IBM and AMD have open-sourced Pelagos, a GPU-accelerated quantum error-correction (QEC) decoding framework for evaluating qLDPC codes at supercomputing scale. This release, announced at SC26, aims to advance quantum computing through vendor-neutral, efficient error correction, building on a joint QEC co-design platform. Pelagos offers significant speedups and efficient multi-GPU orchestration, enabling large-scale simulations crucial for fault-tolerant quantum computing. The post IBM and AMD Ope","content":"<p>IBM Research and AMD have open-sourced Pelagos (distributed on PyPI as pelagos-decoder), a vendor-neutral, GPU-accelerated quantum error-correction (QEC) decoding framework designed to evaluate quantum low-density parity-check (qLDPC) codes at supercomputing scale. Announced at SC26 alongside a multi-GPU scaling study and a six-organization hierarchical decoding survey co-authored by AMD, HPE, IBM, IQM, Riverlane, and Xanadu, the release advances the joint QEC co-design platform established earlier this month by IBM, AMD, and Oak Ridge National Laboratory (ORNL).<br>\n| IBM & AMD Pelagos Open-Source Decoder Architecture & Benchmarks |  |  | <br>\n|---|---|---|<br>\n| Technical Dimension | Implementation Specification | Measured Scaling & Performance | <br>\n| Algorithm & Kernel Stack | Disordered-memory Relay-BP (Relay-BP-S) in fused Triton kernels | Targets AMD ROCm/HIP, NVIDIA CUDA, and Intel SPIR-V GPUs with up to 97x single-GPU speedup vs. 1 CPU core. | <br>\n| Multi-GPU Orchestration | Process-isolated HIP workers, parallel host prep, shared memory | Eliminates single-process runtime contention and pipe serialization across 8-GPU nodes. | <br>\n| One-Gross [[144, 12, 12]] | 12 noisy rounds + 1 noiseless round (p = 0.003, R = 50) | Reached 3,845 decodes/s on 8x AMD Instinct MI355X (6.23x E2E scaling) and 2,686 decodes/s on 8x MI300X. | <br>\n| Two-Gross [[288, 12, 18]] | 18 noisy rounds + 1 noiseless round (p = 0.003, R = 50) | Achieved 7.58x GPU decode scaling on MI300X and 7.45x GPU decode scaling (1,265 decodes/s) on ORNL’s Lux MI355X. | <br>\nEvaluating fault-tolerant qLDPC codes such as bivariate-bicycle memories requires simulating billions of circuit-level error syndromes to resolve logical error rates down to 10−12. Written in the open-source Triton GPU programming language under an Apache 2.0 license, Pelagos keeps belief-propagation message arrays, convergence flags, and candidate selection resident in GPU high-bandwidth memory while autotuning between syndrome-major and edge-major layouts.<br>\nIn an accompanying technical study deployed on ORNL’s AMD Instinct MI355X-powered Lux supercomputer, researchers from AMD and IBM replaced single-process threaded dispatch with persistent per-GPU worker processes and shared-memory output buffers, cutting eight-GPU host preprocessing overhead on two-gross circuits from 3.21 seconds to 0.73 seconds. Alongside the software release, authors from AMD, HPE, Riverlane, Xanadu, IQM, and IBM published a comprehensive taxonomy mapping single-code predecoding cascades, sliding-window streaming pipelines, and concatenated-code interfaces across CPUs, GPUs, FPGAs, ASICs, and cryogenic hardware, noting that real-time reaction targets span three orders of magnitude from microsecond superconducting cycles to millisecond-scale trapped-ion and neutral-atom schedules.<br>\nRead technical blogs from IBM Quantum here and AMD Developer Central here, explore the Pelagos source code and tutorials on GitHub here, review the multi-GPU scaling preprint on arXiv here, and access the multi-institutional hierarchical decoding survey here.<br>\nRelated QCR SC26 coverage includes the IBM, Fermilab, and NVIDIA modular co-design platform and Slurm 26.11 integration here, the IBM, RIKEN, and NVIDIA 79x accuracy gain on iron-sulfur cluster simulations here, and the ORNL-IBM-AMD co-located error-correction platform in Poughkeepsie here.<\/p>","content_hash":"0012920b2acae99c6acb193d9219117d","author":"Mohamed Abdel-Kareem","published_at":"2026-11-16T18:57:56","fetched_at":"2026-11-17 01:29:00","word_count":478,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"6h","domain":"quantumcomputingreport.com"},{"id":"0da679643a8d430e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18451","title":"For azure views","url":"https://quantumfrontiers.com/2026/11/15/for-azure-views/","summary":"The first time I moved to England, I brought the book The Age of Wonder. In it, biographer Richard Holmes sketches scientists who marveled at nature during the Romantic Era. I met Joseph Banks, William and Caroline Herschel, and Humphry Davy while reveling in condensed-matter theory as a research assistant at Lancaster University. This August, I moved to the University of Cambridge for the rest of the summer and much of the fall. My baggage included an e-copy of Holmes’s most recent book. The Bo","content":"<p>The first time I moved to England, I brought the book The Age of Wonder. In it, biographer Richard Holmes sketches scientists who marveled at nature during the Romantic Era. I met Joseph Banks, William and Caroline Herschel, and Humphry Davy while reveling in condensed-matter theory as a research assistant at Lancaster University.<br>\nThis August, I moved to the University of Cambridge for the rest of the summer and much of the fall. My baggage included an e-copy of Holmes’s most recent book. The Boundless Deep profiles Alfred Tennyson, who served as poet laureate of the United Kingdom for approximately 42 of Victoria’s nearly 64 years as queen. Even if Tennyson’s name doesn’t ring a bell, some of his verses might—partially because those verses chime with a bell’s sonorousness. Tennyson wrote, “’Tis better to have loved and lost / Than never to have loved at all,” in an elegy for a friend. That friend’s death—the heartlessness and violence of mortality—led Tennyson to write of “Nature, red in tooth and claw.” He also glorified heroism, depicting the ancient Greek Odysseus as yearning “[t]o strive, to seek, to find, and not to yield.”1<br>\nTennyson grew up in Lincolnshire, on the eastern coast of England. He adored the sea, whose wildness and grandeur infused his spirit. As an undergraduate at the University of Cambridge, Tennyson formed friendships that helped sustain him for decades. Former schoolmates hosted him in their homes, encouraged him, criticized him with affection, and urged him to publish his poetry. For years, Tennyson published little: he drifted from house to house, chain-smoked, recited poetry to friends for hours in the evenings, and waffled about his love for fellow Lincolnshire native Emily Sellwood. The two married once Tennyson published his elegy and the public responded with rapture. The poet laureateship followed that year.<br>\nHolmes tracks not only Tennyson’s path through literature, but also the poet’s appetite for science and technology. Discoveries and inventions fascinated Tennyson. At Cambridge, he studied under William Whewell, whose contributions to mathematics, physics, astronomy, geology and more defy cataloguing. The back of Holmes’s book lists “some popular science books read by Young Tennyson.” They include Darwin’s On the Origin of Species by Means of Natural Selection; a guide to microscopes; and a treatise by mathematician, co-founder of computer science, and steampunk inspiration Charles Babbage.<br>\nScience suffused Tennyson’s poetry, Holmes argues. The biographer illustrates with The Princess, an 1847 poem that advocates for higher education for women. The poem opens with a science festival: “a fire-balloon / Rose gem-like up before the dusky groves.” In steampunk fashion, “round the lake / A little clock-work steamer paddling plied / And shook the lilies.” You can read the rest of the description in what appears to be a first edition. The scene opens in the stanza that begins nearly halfway down the following right-hand page.<br>\nSub-librarian Steven Archer plucked the book for me from the Wren Library at Trinity College, Cambridge this November. Trinity postdoctoral fellow Andrea Pizzi had guessed that I’d appreciate the library and invited me to visit. He guessed correctly.<br>\nThe Boundless Deep has appealed to me not only because it highlights the Victorian era—what has become my era—or because it meshes science with poetry. I also view the book as offering guidance about a technology gnawing at society today: artificial intelligence. You don’t need for me to recap the shock delivered by AI to many people’s sense of humanity, the horror sweeping the globe. But did you know how similarly the Victorians felt?<br>\nDuring the 1800s, geologists Charles Lyell, Roderick Murchison, and others found evidence of extinctions. They unearthed fossils from species extinguished eons beforehand. The scale of those destructions boggled the Victorians’ minds. A species consists of so many creatures—so many wriggling, striving living beings. How could an entire species disappear from the face of the Earth? How could so many species have disappeared? Would humanity share their fate? If so, why bother living, striving, wriggling?<br>\nAs Holmes writes, “Geology soon became an area of spiritual terror, with claustrophobic glimpses of a cruel, meaningless, godless physical world closing in on the heels of humanity. It was full of monsters, dust and extinctions, making nonsense of any idea of progress or individual immortality.” Nature, red in tooth and claw, indeed.<br>\nI’ve been reading The Boundless Deep alongside headlines about cyber hacks, job losses, bias studies, and mathematician breakdowns attributable to AI. To the extent that AI poses problems for society, I don’t have silver bullets. But I take comfort in humanity’s having experienced similar tremors in the past. Granted, AI and extinctions differ in some ways, despite resembling each other. And perhaps we shouldn’t respond as the Victorians did. Most people today take extinctions for granted, and schoolchildren effuse about the fossils that alarmed Tennyson’s contemporaries. Perhaps future generations will view AI as the Victorians viewed those fossils. Either way, we’re not alone: the Victorians felt as many people do today.<br>\nAnd we know how Tennyson responded: with poetry.<br>\nWith thanks to Andrea Pizzi; Steven Archer; the Isaac Newton Institute for Mathematical Sciences; and King’s College, Cambridge.<br>\n1Tennyson used the Latin name Ulysses for Odysseus.<\/p>","content_hash":"b634a4defa5a2fd77fc11680ee92e61e","author":"Nicole Yunger Halpern","published_at":"2026-11-16T07:25:25","fetched_at":"2026-11-17 01:29:04","word_count":859,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"18h","domain":"quantumfrontiers.com"},{"id":"15ed5140f2487e8c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48792","title":"Qatar Ministry of Communications and Information Technology Signs Post-Quantum Readiness Agreement with SignQuantum and QANplatform","url":"https://quantumcomputingreport.com/qatar-ministry-of-communications-and-information-technology-signs-post-quantum-readiness-agreement-with-signquantum-and-qanplatform/","summary":"The Ministry of Communications and Information Technology of Qatar has partnered with SignQuantum and QANplatform to explore post-quantum cryptography for public-sector data, aligning with Qatar's National Vision 2030. This collaboration, announced at MWC26 Doha, aims to enhance long-term data integrity by using SignQuantum's PQC document signing and QANplatform's quantum-resistant blockchain for secure, auditable digital records. The agreement focuses on knowledge sharing and workflow assessmen","content":"<p>Supplies tamper-evident time-stamping to verify signature longevity over multi-decade lifecycles.<br>\nDesigned for organizations requiring long-term auditability, SignQuantum’s architecture anchors signed electronic transactions onto QANplatform’s distributed ledger. According to QANplatform Co-Founder and Chief Technology Officer Johann Polecsak, pairing post-quantum signatures with immutable ledger anchoring mitigates future key-compromise and verification risks for government records.<br>\nUnder the agreement signed alongside MCIT Digital Economy Department Director Faraj Jassim Abdulla, SignQuantum Chief Executive Officer Nazmath Nazeer, and MBK Holding Chairman Sheikh Mansoor Bin Khalifa Al-Thani, the parties will conduct technical knowledge sharing and assess candidate workflows, with any future pilot deployments or commercial contracts subject to separate government evaluation and procurement approvals.<br>\nOfficial announcement details are available via QANplatform here.<br>\nNovember 16, 2026<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"1088cb76c3517302f0b515b00c314b70","author":"Mohamed Abdel-Kareem","published_at":"2026-11-16T00:39:05","fetched_at":"2026-11-17 01:29:00","word_count":201,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"7528f86476b0c8d2","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48789","title":"Cross-Platform Cloud Benchmark Reveals Wide Gap Between Physical Qubit Counts and Entangled GHZ State Sizes","url":"https://quantumcomputingreport.com/cross-platform-cloud-benchmark-reveals-wide-gap-between-physical-qubit-counts-and-entangled-ghz-state-sizes/","summary":"A new study benchmarked nine cloud-accessible quantum processors, revealing a significant gap between the number of physical qubits and the size of entangled GHZ states achievable without error mitigation. The research, which utilized standard remote cloud workflows, found that large superconducting processors only maintain multipartite entanglement across a small fraction of their physical registers. This highlights the challenges in achieving high-fidelity multipartite entanglement in current ","content":"<p>A Spanish research consortium led by Gradiant, the University of the Basque Country (UPV/EHU), and the Basque Center for Applied Mathematics (BCAM), alongside partners from the University of Deusto, Mondragon Unibertsitatea, Ikerlan, Vicomtech, and Quantum Mads, has benchmarked nine cloud-accessible quantum processors across five hardware vendors using Greenberger-Horne-Zeilinger (GHZ) state generation. Executed through standard remote cloud workflows without error mitigation, the study shows that large superconducting processors maintain multipartite entanglement across less than a quarter of their physical registers.<br>\n| Cross-Platform Cloud GHZ Benchmark Results (Default Compilation, No Error Mitigation) |  |  |  |  | <br>\n|---|---|---|---|---|<br>\n| Backend (Architecture) | Physical Qubits | Max Passing GHZ Size (N*) | Register Utilization | Per-Qubit GHZ Error (εq) | <br>\n| IBM Phoenix (Nighthawk r2, Square) | 120 | 27 (Y = 0.438) | 23% | 3.0% | <br>\n| IBM Basquecountry (Heron r2, Heavy-Hex) | 156 | 24 (Y = 0.430) | 15% | 3.5% | <br>\n| IBM Pittsburgh (Heron r3, Heavy-Hex) | 156 | 21 (Y = 0.510) | 13% | 3.2% | <br>\n| IQM Emerald (Crystal 54, Square) | 54 | 20 (Y = 0.421) | 37% | 4.2% | <br>\n| IBM Miami (Nighthawk r1, Square) | 120 | 18 (Y = 0.423) | 15% | 4.7% | <br>\n| IQM Garnet (Crystal 20, Square) | 20 | 13 (Y = 0.437) | 65% | 6.2% | <br>\n| AQT IBEX Q1 (Trapped-Ion, All-to-All) | 12 | 12 (Y = 0.711) | 100% | 2.8% | <br>\n| Rigetti Cepheus-1 (Chiplet Square) | 107 | 4 (Y = 0.491) | 4% | 16.3% | <br>\n| CESGA Qmio / OQC (Coaxmon, Sparse) | 32 | 3 (Y = 0.513) | 9% | 20.0% | <br>\nImplementing the multipartite entanglement protocol from the QuSquare benchmark suite, the researchers used Direct Fidelity Estimation (DFE) across 2,952 randomly sampled stabilizers per circuit size to evaluate processors accessed via the IBM Quantum Platform, Amazon Braket, and the Galicia Supercomputing Center (CESGA). While previous single-vendor demonstrations have reported larger entangled states using custom pulse compilation, post-selection, and readout mitigation, this evaluation isolated out-of-the-box performance experienced by typical cloud users.<br>\nThe authors note that benchmark outcomes depend heavily on the statistical decision rule applied to the genuine multipartite entanglement (GME) threshold (F = 0.5). While all nine devices passed the non-exclusion boundary (Y + ε ≥ 0.5) at some register size, tightening the criterion to strictly certify GME (Y − ε ≥ 0.5) reduced the passing cohort to four systems: IBM Phoenix (up to 16 to 22 qubits), IBM Basquecountry (16 to 22 qubits), AQT IBEX Q1 (12 qubits), and IQM Garnet (8 to 11 qubits).<br>\nComparing hardware specifications against observed fidelities also demonstrated that median calibration metrics are unreliable predictors of multi-qubit performance. On superconducting backends, effective per-qubit GHZ error rates exceeded median two-qubit gate errors by roughly one order of magnitude, highlighting the impact of unmitigated readout errors, idling decoherence, crosstalk, and compiler qubit-chain selection.<br>\nRead the full preprint on arXiv here, access the normalized experimental dataset and calibration snapshots on Zenodo here, and explore the open-source benchmarking codebase on GitHub here.<\/p>","content_hash":"6b8b51ee5467c78c106591bc856c57e5","author":"Mohamed Abdel-Kareem","published_at":"2026-11-16T00:31:18","fetched_at":"2026-11-17 01:29:00","word_count":523,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"a0e4bf6201213896","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10321","title":"More podcasts, conversations, talks","url":"https://scottaaronson.blog/?p=10321","summary":"Here&#8217;s my talk &#8220;Are We Cooked?&#8221; about the AI Mathocalypse&#8212;the one where, every time I give it, I need to update it with all the big theorems AI has proved since the last time I gave the talk. This version is from the Institute for Foundations of Machine Learning (IFML) here at UT Austin, back on October 2 (so, ancient times). Here I am with Rabbi Neil Blumofe of Agudas Achim synagogue in Austin. Rabbi Blumofe asks me about quantum mechanics, AI, consciousness, free will, ","content":"<p>Here’s my talk “Are We Cooked?” about the AI Mathocalypse—the one where, every time I give it, I need to update it with all the big theorems AI has proved since the last time I gave the talk. This version is from the Institute for Foundations of Machine Learning (IFML) here at UT Austin, back on October 2 (so, ancient times).<br>\nHere I am with Rabbi Neil Blumofe of Agudas Achim synagogue in Austin. Rabbi Blumofe asks me about quantum mechanics, AI, consciousness, free will, why I say “please” and “thank you” to GPT, and why I blog about Israel. The questions from the audience, unexpectedly, were more like “will cryptocurrencies that use RSA or Diffie-Hellman take longer to break with quantum computers than those that use elliptic curve cryptography?” Thanks to Rabbi Blumofe for doing this.<br>\nAnd here’s a podcast with Yu Shen, with Chinese subtitles. I haven’t watched this one and don’t remember what we talked about. (Oh — looking at the title graphic, apparently we talked about when AI will solve the P vs NP problem?)<br>\n28 Responses to “More podcasts, conversations, talks”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"1cccb8b5b7ab1073bfd9994fcbd0afb6","author":"Scott","published_at":"2026-11-15T14:30:28","fetched_at":"2026-11-17 01:28:57","word_count":343,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1d","domain":"scottaaronson.blog"},{"id":"d0e760539fc20e1e","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48772","title":"Making Quantum SDKs More Accessible: Lessons from Contributing to Qiskit","url":"https://quantumcomputingreport.com/making-quantum-sdks-more-accessiblelessons-from-contributing-to-qiskit/","summary":"Software developer Gloria Amos describes her experience in making a contribution to the open source Qiskit platform and provides insights into some of the things contributors should watch out for. The post Making Quantum SDKs More Accessible: Lessons from Contributing to Qiskit appeared first on Quantum Computing Report.","content":"<p>By Gloria Amos<br>\nWhen the Code Works but the Documentation Falls Short<br>\nQuantum Software Development Kits (SDKs), such as IBM’s Qiskit, Google Cirq, and PennyLane, provide developers with the tools to build, simulate, and execute quantum programs. However, having functional software does not guarantee that its capabilities are clearly communicated. Well-written documentation is an integral part of making quantum technology accessible to both developers and researchers. A 2025 exploratory study involving 251 quantum programming practitioners found that 60.6% learn quantum languages from official documentation, citing inadequate or incorrect documentation and usage examples as significant challenges. Furthermore, the Unitary Foundation’s 2025 Quantum Open Source Software Survey revealed that project documentation and source code ranked above chatbots as primary information sources for developers. This highlights the critical importance of clear documentation and understandable code in quantum software development.<br>\nAs efforts to lower the barriers to entry for quantum computing increase, providing simplified, easily understandable documentation is essential. While quantum programming cannot eliminate the need to understand complex quantum concepts, SDK maintainers can reduce unnecessary ambiguity in how these concepts are exposed through software. My experience contributing to Qiskit offers a practical example of how improving documentation accuracy and implementing appropriate testing can make existing quantum functionalities more accessible.<br>\nA Quantum SDK provides an integrated collection of APIs, compilers, transpilers, simulators, libraries, and interfaces that help developers optimize, execute, and debug quantum algorithms. IBM Quantum defines the Qiskit SDK as an open-source tool for working with quantum computers at the level of extended (static, dynamic, and scheduled) quantum circuits, operators, and primitives. Consequently, making quantum SDKs more accessible involves various efforts to make these powerful tools more readily available to the community.<br>\nWhere Quantum SDKs Create Developer Friction<br>\nA recent paper, A Taxonomy of Real Faults for Hybrid Quantum-Classical Software Architectures by Avner Bensoussan et al., notes that online quantum documentation does not always reflect the latest API versions. As a result, programs have a short life expectancy, forcing developers to constantly adapt their code to newer versions.<br>\nBecause quantum computing is often seen as abstract and confusing, ambiguous or outdated documentation creates significant friction in the developer experience. Quantum operations, qubit ordering, measurements, and mathematical representations require specialized knowledge that conventional software developers may lack. Incomplete API descriptions, omitted edge cases in examples, and discrepancies between documented parameters and actual functionalities introduce avoidable confusion. Therefore, well-written documentation must explain concepts clearly using foundational terms. Accurate explanations, practical examples, and understandable APIs effectively reduce the barriers to entry.<br>\nWhat a Qiskit Contribution Revealed<br>\nAs a junior developer without a STEM background or a physics undergraduate degree, I became curious about quantum computing and its potential to solve problems beyond the reach of classical computers. I began exploring quantum information and looked for beginner-friendly issues in the Qiskit SDK to contribute to. Contributing to open-source projects is widely recognized as an excellent way to connect with industry experts, gain experience, and strengthen technical skills. During this process, I found a reopened issue regarding confusing API References documentation, which had originally been opened by a quantum software engineering researcher.<br>\nThe Issue<br>\nUpon investigating the issue, I confirmed inconsistencies between the implemented functionalities and the explanations provided to developers. For example, the PolynomialPauliRotationsGate covers “X”, “Y”, and “Z” bases, but the documentation only mentioned the default “Y” basis. Additionally, the most and least significant qubits were not clearly defined. There was also a typo in the mapping for the HalfAdderGate. Together, these inconsistencies caused avoidable misunderstandings for both developers and researchers. After investigating these issues, I used the official Qiskit documentation as a guide to make several changes to add concise mappings, correct wording, and added “X” and “Z” basis test coverage.<br>\nThe Role of Testing<br>\nAfter a careful review of my initial pull request, repository maintainers notified me that there was no test coverage for the newly added bases. I subsequently added test coverage for the “X” and “Z” basis cases in test_functional_pauli_rotations.py. Because I was working through a browser editor and could not run the test suite locally, the maintainers manually checked and confirmed the tests were correct. This experience taught me that testing is crucial for software reliability, as it verifies that the implementation behaves as expected and aligns with the documentation. Ultimately, my pull request passed 27 checks, was backported, and merged successfully.<br>\nConclusion<br>\nContributing to Qiskit demonstrated that improving quantum software goes beyond introducing new features and tools. It also involves making existing tools easier to understand and ensuring that functionalities, tests, and documentation are perfectly aligned. My contribution highlighted how clearly written documentation, thorough testing, and open-source collaboration work together to elevate software quality. While these practices cannot remove the inherent complexities of quantum computing, they successfully eliminate avoidable confusion from the developer experience. Ultimately, the usefulness of a Quantum SDK depends not only on its technical capabilities but also on how easily developers can understand and apply it for the greater good.<br>\nGloria Amos is a software developer.<\/p>","content_hash":"371ff11cc24d46beabe1b7773cbd3649","author":"Doug Finke","published_at":"2026-11-14T22:44:27","fetched_at":"2026-11-17 01:29:01","word_count":829,"read_time_minutes":5,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"e20b092b87fbbaa4","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48768","title":"Who’s News: Strategic Appointments at SemiQon, OrangeQS, IonQ, Haiqu, and Jij","url":"https://quantumcomputingreport.com/whos-news-strategic-appointments-at-semiqon-orangeqs-ionq-haiqu-and-jij/","summary":"This article announces several strategic appointments in the quantum technology sector. SemiQon appointed Dr. Thierry Botter as CCO, OrangeQS named Raj Badoni as CCO, and IonQ expanded its finance leadership with Gary Merrill as CFO and Thomas A. Austin as CAO. Additionally, Haiqu appointed Kortny Rolston-Duce as Head of Ecosystem Development and Marketing, and Jij named Oren Bernstein as VP of Business Development for North America. The post Who’s News: Strategic Appointments at SemiQon, Orange","content":"<p>SemiQon has appointed Dr. Thierry Botter as Chief Commercial Officer (CCO). Botter most recently served a five-year term as Executive Director of the European Quantum Industry Consortium (QuIC), stepping down in August 2026 after helping grow the association to over 230 members. Earlier in his career, he held advanced technology and innovation leadership roles at Airbus. At SemiQon, Botter will lead global commercialization and market expansion for the company’s cryogenically optimized CMOS hardware solutions. The full press release is available here.<br>\nOrangeQS has appointed semiconductor industry veteran Raj Badoni as Chief Commercial Officer (CCO). Badoni brings two decades of commercial and customer-centric leadership experience across the semiconductor and photonics sectors, having previously held senior roles at KLA, ASM, Onto Innovation, and SMART Photonics. In his new position, he will oversee global sales, commercial strategy, and ecosystem collaborations—including the OrangeQS MAX Partnership Program—to scale automated quantum chip testing infrastructure. The official announcement can be found here.<br>\nIonQ (NYSE: IONQ) has expanded its executive finance leadership with the appointments of Gary Merrill as Chief Financial Officer (CFO), effective early December, and Thomas A. Austin as Chief Accounting Officer (CAO), effective immediately, succeeding Inder M. Singh. Merrill joins from Commvault Systems, where he served as both CFO and Chief Commercial Officer, driving SaaS expansion and financial transformation. Austin brings over three decades of accounting and regulatory compliance experience, having previously served as CAO at Juniper Networks and Vice President of Corporate Finance at EMC Corporation and Dell Technologies. The complete release is accessible here.<br>\nHaiqu has appointed Kortny Rolston-Duce as Head of Ecosystem Development and Marketing. Rolston-Duce brings extensive quantum industry and national laboratory experience, having previously served as Director of Ecosystem Development at Quantinuum—where she also held communic
