 scheme that I proposed at OpenAI back in 2022—as far as I know, the first LLM watermarking proposal, though far from the last one. I’m gratified that Anthropic credits me for this, even though I shirked my duty by never publishing a paper about it (by the time I sat down to write one, it seemed like the whole field had already assimilated my scheme and moved beyond it—AI just moves too fast for me!).<br>\nFor those who don’t know, watermarking means slightly changing the way that an LLM operates to insert a subtle signal that lets you prove later, with high statistical confidence, that a text indeed came from your specific LLM. It uses the randomness that’s already present anyway in LLM outputs, replacing some of it by pseudorandomness that favors certain word combinations over others in a way that’s later detectable, given only the sequence of tokens itself (not the prompt or the probabilities) along with the key of the pseudorandom generator. Christ, Gunn, and Zamir then substantially improved my scheme to get true cryptographic indistinguishability, and there have been other improvements since.<br>\nI’d been meaning to blog about this for days. Thankfully, Zvi Mowshowitz, the world’s foremost blogger about AI, has now written a wonderful post, entitled AI Text Watermarking Is Free And Good, which saves me from the need to write my own long post. In particular, Zvi masterfully explains the central point that I needed to explain to everyone back in 2022-23: why, contrary to many people’s intuitions, there’s no inherent tradeoff between watermarking and the quality of LLM output. Basically, nearly every LLM output was already a sample from a cloud of exponentially many possibilities, all of them about equally good, so there’s plenty of room to steer within that cloud without affecting anything that an ordinary user would notice. As my kids would put it, the math mathes.<br>\nAs Zvi explains, the central technical drawback of watermarking schemes like the one I proposed, and what Anthropic is now using, is that it’s possible to remove the watermarks with a little extra work (even stuff as simple as, e.g., translating between English and French, asking the LLM for words interspersed with emojis and then removing the emojis, or using an open model to paraphrase the output). Zvi gives detailed arguments for why he expects watermarking to remain a net positive in practice despite this vulnerability.<br>\nI could add that, in addition, there’s recent progress (see here for example) on what I’ve called “semantic watermarking,” or watermarking at the level of the underlying concept vectors rather than the tokens themselves. This actually seems to work, albeit with no theoretical guarantees, and will hopefully make removing watermarks a lot harder—although the Barak et al. impossibility result suggests that under plausible assumptions, no LLM watermarking method will be completely foolproof.<br>\nAnyway, I worked out my scheme in Fall 2022, then gave lots of talks about it (including, as it happens, at Anthropic), and also worked with Hendrik Kirchner at OpenAI, who actually implemented and tested my scheme. Unfortunately, OpenAI leadership decided against deploying watermarking, worried mostly about risks to the product (i.e., customers disliking the idea, and leaving for a competing LLM that doesn’t watermark). You can read this Wall Street Journal investigation from two years ago for more. I was hopeful that the State of California was going to solve the collective-action problem by mandating watermarking for AI models, but then they decided to do that for audiovisual content only, for some reason exempting text.<br>\nNevertheless, Google DeepMind implemented something very similar to my proposal in its SynthID, deployed in all its Gemini text models. But they heavily restricted who gets to detect the watermark, which made their admirable decision of limited use to my academic colleagues, who’ve been begging me for a way to detect whether their students are using AI to cheat. (For now, I mainly send them to Pangram, a leading AI detector not based on watermarking, as a first line of defense.)<br>\nAnd now, apparently to comply with EU regulations, Anthropic says they’ve deployed a watermarking scheme like mine where anyone will be able to do detection (though they also say in their FAQ that they’re still working on the detection API). Even OpenAI suggests that it plans to follow suit. So, four years after I seriously thought about this, it looks to my surprise like this is actually happening. Thanks, EU!<br>\nTell you what: read Zvi’s post, and then whatever questions you still have, you can come here and ask in the comments. Just please don’t use Claude to write the comments. With any luck, I’ll eventually be able catch you if you do.<\/p>","content_hash":"b6777d61483bf14799989cd65d0e0ea9","author":"Scott","published_at":"2026-08-22T21:31:52","fetched_at":"2026-10-10 11:48:09","word_count":815,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"6w","domain":"scottaaronson.blog"},{"id":"e99c42efa1cfdbe8","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10020","title":"Better than gold","url":"https://scottaaronson.blog/?p=10020","summary":"What’s about the only thing more badass than a 17-year-old winning a gold medal at the International Olympiad in Informatics (IOI)? That 17-year-old intentionally forfeiting his gold medal by wearing an Israeli flag while the medal was announced, defying the IOI’s boycott of Israel (for background on this boycott, see my post from 2024). Kol HaKavod (mad respect) to Yotam Budnik, who incredibly, has also won a Gold Medal (which he was allowed to keep, apparently) at the International Math Olympi","content":"<p>What’s about the only thing more badass than a 17-year-old winning a gold medal at the International Olympiad in Informatics (IOI)?<br>\nThat 17-year-old intentionally forfeiting his gold medal by wearing an Israeli flag while the medal was announced, defying the IOI’s boycott of Israel (for background on this boycott, see my post from 2024).<br>\nKol HaKavod (mad respect) to Yotam Budnik, who incredibly, has also won a Gold Medal (which he was allowed to keep, apparently) at the International Math Olympiad.  And congratulations to the entire Israeli team, which (incredibly) would apparently have had a higher overall score than the US team, had it been allowed to compete as an official team at all.<br>\n\t\t\t\t\t<br>\n\t\t\t\t\t\tThis entry was posted<br>\n\t\t\t\t\t\t\t\t\t\t\t\ton Thursday, August 20th, 2026 at 11:27 am\t\t\t\t\t\tand is filed under Announcements, Rage Against Doofosity.<br>\n\t\t\t\t\t\tYou can follow any responses to this entry through the RSS 2.0 feed.<br>\n\t\t\t\t\t\t\t\t\t\t\t\t\tYou can leave a response, or trackback from your own site.<br>\n\t\t\t\t\t\t<br>\n\t\t\t\t\t<br>\n\t\t\t\t<br>\n\t\t <br>\n\t<br>\n\t<br>\n\t<br>\n <br>\nYou can use rich HTML in comments!  You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<\/p>","content_hash":"da88d82a593087b461bb9bfed5f1d1bb","author":"Scott","published_at":"2026-08-20T16:27:20","fetched_at":"2026-10-10 11:48:09","word_count":223,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"7w","domain":"scottaaronson.blog"},{"id":"898efbcbd461300a","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10014","title":"Michael Rabin memorial conference","url":"https://scottaaronson.blog/?p=10014","summary":"Friend-of-the-blog (well, mainly just friend) Adi Akavia has asked me to publicize that she&#8217;s helping to organize an exciting CS conference called Mind-IL at Tel Aviv University on October 26, in memory of the Israeli-American Turing Award winner Michael O. Rabin, who passed away in April. Please note that October 26 is the day before the Israeli election, for any Israeli citizenship holders living abroad who might want an academic excuse to come to Israel and vote. Update (August 19): Avi","content":"<p>Friend-of-the-blog (well, mainly just friend) Adi Akavia has asked me to publicize that she’s helping to organize an exciting CS conference called Mind-IL at Tel Aviv University on October 26, in memory of the Israeli-American Turing Award winner Michael O. Rabin, who passed away in April.  Please note that October 26 is the day before the Israeli election, for any Israeli citizenship holders living abroad who might want an academic excuse to come to Israel and vote.<br>\nUpdate (August 19): Avi Wigderson also asked me to advertise a conference, to be held September 16-18 at Bletchley Park in the UK, to commemorate the 90th anniversary of Alan Turing’s “On Computable Numbers” paper.<br>\n\t\t\t\t\t<br>\n\t\t\t\t\t\tThis entry was posted<br>\n\t\t\t\t\t\t\t\t\t\t\t\ton Sunday, August 16th, 2026 at 3:45 pm\t\t\t\t\t\tand is filed under Announcements, Complexity.<br>\n\t\t\t\t\t\tYou can follow any responses to this entry through the RSS 2.0 feed.<br>\n\t\t\t\t\t\t\t\t\t\t\t\t\tYou can leave a response, or trackback from your own site.<br>\n\t\t\t\t\t\t<br>\n\t\t\t\t\t<br>\n\t\t\t\t<br>\n\t\t <br>\n\t<br>\n\t<br>\n\t<br>\n <br>\nYou can use rich HTML in comments!  You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<\/p>","content_hash":"80eea57d237b5a1d2ff26066a0af8de3","author":"Scott","published_at":"2026-08-16T20:45:15","fetched_at":"2026-10-10 11:48:10","word_count":219,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"7w","domain":"scottaaronson.blog"},{"id":"eef69dabe3ee090e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18033","title":"Interacting collaborators reveal noninteracting fermions","url":"https://quantumfrontiers.com/2026/08/09/interacting-collaborators-reveal-noninteracting-fermions/","summary":"By day, I work as an experimentalist on laser-cooling molecules1, but I&#8217;ve never fully surrendered my theoretical-physics license. I started as an undergraduate in Lincoln Carr&#8217;s group at the Colorado School of Mines in Golden, CO. I learned from his expertise in simulations and complex systems. Since then I&#8217;ve moonlighted as a theorist while also pursuing an unrelated PhD and, now, an unrelated postdoc position. With Nicole Yunger Halpern and other collaborators, we devised a ","content":"<p>By day, I work as an experimentalist on laser-cooling molecules1, but I’ve never fully surrendered my theoretical-physics license. I started as an undergraduate in Lincoln Carr’s group at the Colorado School of Mines in Golden, CO. I learned from his expertise in simulations and complex systems. Since then I’ve moonlighted as a theorist while also pursuing an unrelated PhD and, now, an unrelated postdoc position. With Nicole Yunger Halpern and other collaborators, we devised a quantum circuit whose dynamics looked complex when run on a quantum computer. It took six years and five collaborators across four countries to discover that, for the right settings, these complex dynamics could be understood when viewed from the right angle.<br>\nSome time ago, I told you about quantum cellular automata (QCA). These quantum machines are built from one-dimensional strings of qubits. A qubit changes its state depending on the state of its two nearest neighbors. Different rules are encoded into three-qubit gates that change a central qubit based on the state of its left and right neighbors. Some rules induce change for many combinations of neighbor states. Others, less. We apply this neighborhood-constrained update in two waves, first to every other qubit, then to the ones skipped in the first wave. This is a common quantum circuit structure called a brickwork pattern. We call one rule the Goldilocks QCA: A qubit is updated if one of its neighbors is a 0 while the other is a 1 (activity); otherwise the qubit does not change its state (inactivity).<br>\nRepeating brickwork layers of the Goldilocks rule, we found, balances activity and inactivity to be “just right,” as Goldilocks might say. Striking this balance produced surprisingly rich patterns of quantum correlation. The same type of network structure is found in complex classical systems like metabolic pathways, social networks, and brain activity. What’s more, the observed patterns of connectivity persist through thousands of circuit layers while other QCA tend towards uniformity.<br>\nOur new paper, Integrability of Goldilocks quantum cellular automata, answers a question that’s been lurking underneath that first result for the last several years. Why does this balance produce such rich and persistent structure? Some Goldilocks QCA, we prove, map onto free fermions, one of the simplest examples of exactly solvable quantum dynamics. How does uncovering this simplification explain the persistent complex patterns? The answer follows from the concept of conservation laws. Piecing together this understanding required assembling an international team of experts who generously shared their knowledge and time. I’ll tell a bit of this scientific story through the lens of our collaboration’s history.<br>\nA key inspiration for this work started with a May 2020 video call with Norman Margolus, an MIT-affiliated researcher and pioneer of using cellular automata to model real systems. In the 1980s he worked on a custom computer chip called CAM-6, and later CAM-8, that was dedicated to simulating massive arrays of cellular automata with the limited computational resources of the era2. He proudly showed us beautiful pictures of cellular automata simulating phenomena like optical refraction and chemical reactions.<br>\nHe told us a story about trying to mimic fluid flow with the simple local rules of classical cellular automata. These models, called lattice gas automata, were first defined on a square lattice. While they did show fluid-like behavior, these models did not quite correctly conserve momentum3. Moving to a hexagonal lattice fixed up these problems and the community was able to devise cellular automata that quantitatively modeled continuum fluid flow.<br>\nPart of that story stuck with me: conservation laws are fundamental ingredients of a physical model. Our Goldilocks quantum cellular automata, we observe, exhibit persistent complex structures. Could some conservation law be behind these observations? If found, could these conservation laws be harnessed for more efficient simulations? Going even further, could there be enough conservation laws to exactly solve the dynamics (at least in principle)? This property would buy the system membership in a special class called integrable systems.<br>\nAn integrable system conserves enough quantities, often called charges in the quantum setting, that you can compute its future state from its conservation laws and its initial conditions. Two-body gravitational orbits are a classic example. The initial positions and velocities set the orbital energy and angular momentum in the center-of-mass reference frame. Those two conserved quantities let you write down an exact equation for the orbit’s shape.<br>\nA chaotic system, by contrast, may conserve energy and even a few other quantities, but not enough for us to solve for the state arbitrarily far in the future. To find out what a chaotic system does, you have to evolve the equations of motion approximately—one small time step at a time. Chaotic systems are the norm in nature; integrable ones are rare. To illustrate their qualitative differences, compare the regularity of the above orbit to the trend towards uniformity in the above lattice-gas simulation. In the quantum regime, physicists still don’t fully agree on the precise definition of integrability, though conservation of many independent quantities is a strong indicator.<br>\nIn August 2020, Nicole emailed Lorenzo Piroli about his preprint on QCA, now published as Phys. Rev. Lett. 125, 190402. Lorenzo was a postdoc at the Max Planck Institute for Quantum Optics in Garching, Germany when we first met. He is now an associate professor at the University of Bologna and expert in many-body quantum dynamics. The correspondence that unfolded set the blueprint for the research effort that followed. One of us would ask a question, and Lorenzo would respond incredibly fast with accurate and useful detail. He started working with us to understand why the Goldilocks QCA dynamics appeared so unique. Lorenzo would suggest computations, I would implement them, and we would discuss what the results meant.<br>\nThen came an echo of the collaboration’s inception. In May 2021, Nicole pointed out a relevant preprint from Tomaž Prosen, now published in Chaos 31, 093101. Tomaž is a Slovenian physicist at the University of Ljubljana and a leading researcher in the fields of quantum chaos and integrability. I sent an email about the connections between our work and his. He responded with enthusiasm. He shared some code that would, through exhaustive search, find quantities conserved by our QCA.<br>\nThe code’s brute-force approach meant the algorithm could only find conservation laws defined over, at most, a 5-qubit subsystem. A tantalizing signal emerged: the number of conserved quantities supported by 5 qubits exceeded the number supported by 3 qubits. Having more and more conserved quantities as you look at larger neighborhoods is a signature of integrability. Soon after, Tomaž proved one of our Goldilocks QCA is integrable using a well-established toolkit from statistical mechanics called Yang-Baxter integrability. He built a parametric transfer matrix, essentially a machine that spits out a new conserved quantity every time you turn its mathematical crank4.<br>\nBut there was a wrinkle. The transfer matrix generates charges that mutually commute, meaning you can measure them simultaneously. For example, you can know a quantum particle’s kinetic energy and momentum simultaneously because those operators commute. Yet, the search algorithm kept finding charges that did not commute with each other, like a particle’s position and momentum. The only explanation was that our QCA has more charges than the transfer matrix method guarantees, and more than are minimally required for integrability. This extra-conservation-law property, called superintegrability, also shows up in two-body gravitational orbits. In addition to energy and angular momentum, orbits conserve the Runge-Lenz vector. Nicole is an expert on noncommuting charges, so this is where one of her main research efforts entered the QCA collaboration.<br>\nNext came a key insight from Lorenzo: the automaton we had been considering was one member of a larger family of integrable Goldilocks QCA. He showed this using a Jordan-Wigner transformation, a mathematical dictionary that translates between the language of qubits and the language of fermions. Complexity in the qubit language transformed into simplicity in the fermion language. Under this translation, our QCA mapped to noninteracting, or free, fermions: particles that never bump into or influence each other. That lack of interaction is what makes free-fermion dynamics easy to calculate. A system of free fermions is a well-known example of superintegrability.<br>\nAlong the way, Lorenzo recruited his friend and collaborator Eric Vernier, a CNRS researcher based in Paris, France. He is an expert on vertex models. The classical version of the six-vertex model was developed in the 1930s to explain a troubling mystery: Water ice appears to have more entropy than permitted by the third law of thermodynamics at near-zero temperature. In the six-vertex model, a water molecule’s oxygen atom is envisioned at every vertex in a square lattice. Each molecule contributes two hydrogen ions, to use Baxter’s terminology, that fall along the lattice edges. Intermolecular hydrogen bonds between adjacent molecules slightly alter the intramolecular O-H bonds. To maintain electrical neutrality, each oxygen (lattice vertex) has two nearby and two far-away hydrogen ions (four edges), leading to six possible ice vertices. The vertices are commonly visualized in three ways: 1) as the dots representing hydrogen ions located on edges near or far from each vertex, 2) as electric dipole arrows pointing into (“ion is close”) or out of (“ion is far”) each vertex, or 3) as thick (downward- and leftward-pointing dipoles) and thin (upward- and rightward-pointing dipoles) edges. Despite the model’s simplicity (2D square lattice) compared to real ice (3D tetrahedral lattice), it agrees with experimentally measured entropy values to better than 2%.<br>\nMore recently, vertex models have been adapted from two-dimensional classical crystals to one-dimensional quantum systems that evolve in time. Eric showed us how the ice vertices relate to QCA circuit rules. In doing so, Eric uncovered an even larger set of integrable Goldilocks QCA than that found by Lorenzo. Eventually, Lorenzo’s Jordan-Wigner transformation method and Eric’s six-vertex method agreed on the complete family of integrable Goldilocks QCA.<br>\nWe finally had our Avengers-style collaboration: individual heroes brought together to wield their unique strengths. With Lincoln’s supervision, I developed the QCA models and performed the computations. Lorenzo found the Jordan-Wigner transformation. Tomaž found the first signals of integrability and delivered a set of conservation laws. Nicole brought her expertise in quantum thermodynamics, clarifying how the noncommuting charges constrain dynamics. Eric made the six-vertex connection. We drafted and redrafted the paper until it balanced the scientific story, the analytical derivations, and the numerical evidence.<br>\nBecause the discovered family of Goldilocks QCA maps to free fermions, we can efficiently simulate them classically. I simulated 256 qubits on my laptop this way. These large simulations were satisfying: I had worked with this model for years with an order of magnitude fewer qubits and even saw the dynamics implemented on Google’s Sycamore-era hardware with 23 qubits. Most Goldilocks QCA are consistent with chaos rather than integrability, and therefore hard to simulate classically. Therefore, our work gives experimentalists a tunable model: dial in integrable dynamics for something checkable at large qubit number. Set up chaotic dynamics for a potential demonstration of quantum advantage.<br>\nWhile preparing this post, I opened my old email account to check the timeline set out above. I looked through nearly six years of email chains, some with hundreds of messages, full of logistics for coordinating each author’s ever-changing time zone, and dozens of calculations and results that never made it into the paper. This collaboration helped me grow as a researcher in a big way.<br>\nI found old emails where Nicole was coaching me on messaging potential collaborators. I can hardly believe she dedicated so much effort to mentoring me. We have never met in person, despite our shared work starting when I was an undergraduate and she was a graduate student more than a decade ago. If you know Nicole, you can probably believe it easily. I had similar moments with each collaborator. They all gave their time and expertise generously over the many years this paper took to come together.<br>\nAs I continue my efforts in experimental physics, I will pay forward the effort and generosity shared with me by this collaboration. I may even keep my theoretical-physics license for a while longer.<br>\n- “By day” doesn’t mean “by daylight.” Laser labs are almost always in a windowless basement. ↩︎<br>\n- CAM-6 featured 32 kB of cell-state memory (CAM-8 had 8 MB ), far less than the memory currently used by this author’s numerous open browser tabs. ↩︎<br>\n- The coarse-grained momentum flux tensor was anisotropic. ↩︎<br>\n- Logarithmic derivatives of the parametric transfer matrix generate the conserved charges. ↩︎<\/p>","content_hash":"7a735b5fb80b174f001fd526c2f747a1","author":"Logan Hillberry","published_at":"2026-08-10T04:34:38","fetched_at":"2026-10-10 11:48:13","word_count":2078,"read_time_minutes":11,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"8w","domain":"quantumfrontiers.com"},{"id":"5b4a6d9fa436625e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18023","title":"Wise guy","url":"https://quantumfrontiers.com/2026/07/26/wise-guy/","summary":"In my closet, in a basket labeled “Random stuff,” sits a bag of quarters. They total only a few dollars, but their worth to me exceeds their monetary value. I received the quarters from Mark Wise. Mark taught a course about the Standard Model of particle physics at my master’s program at the Perimeter Institute for Theoretical Physics, near Toronto. Perimeter borrowed him from Caltech, to whose faculty he belonged. Mark had grown up in Canada and studied at the University of Toronto; so he didn’","content":"<p>In my closet, in a basket labeled “Random stuff,” sits a bag of quarters. They total only a few dollars, but their worth to me exceeds their monetary value. I received the quarters from Mark Wise.<br>\nMark taught a course about the Standard Model of particle physics at my master’s program at the Perimeter Institute for Theoretical Physics, near Toronto. Perimeter borrowed him from Caltech, to whose faculty he belonged. Mark had grown up in Canada and studied at the University of Toronto; so he didn’t mind visiting Canada even in the depths of winter.<br>\nWhat would Mark have minded? He projected a mild manner—an innocuousness—that suited his sense of humor, which he often directed at himself. Mark had a bald patch and glasses, and he wore a mustache. Physics jokes and science-fiction references decorated his T-shirts, one of which he wore beneath a black suit jacket to our first class. His voice was nasal; it grated a little. But I relished listening to Mark’s lectures.<br>\nMark’s lecturing exemplified clarity, because he knew particle physics so deeply. When he walked us through its Lagrangians and scattering diagrams, his conclusions seemed inescapable. His lectures’ logic and structure appealed to me as someone who’s been hyper-organized since at least fourth grade.<br>\nYet Mark cared about us students beyond the requirements of pedagogy. His T-shirts invited conversation from those who arrived to class early. Whenever a student answered or asked a question, he tossed them a quarter. Sometimes, he’d pause to examine the quarter, deliberate about whether to toss a Canadian quarter or an American one, or opine about the motto printed on the coin. (Mark confessed to having lower standards than those ingrained in the New Hampshire state motto, “Live free or die.” Where he came from, “We just wanna live!”)<br>\nSome days, Mark found little change in his pocket and announced that he needed to return to the bank for more quarters. The announcements sounded like complaints. He didn’t need to return to the bank, though, as nobody needs to bring doughnuts to the office for sharing.<br>\nI discovered the icing on the doughnut two years later, as a PhD student at Caltech. I sat in on part of a quantum course taught by Mark. To every student who completed the course, Mark gave a T-shirt that read, “Licensed quantum mechanic.” I received a T-shirt, although I only sat in on part of the course. I’ve never worn it, because I’ve wanted never to wear it out.<br>\nIn 2024 and 2025, I co-taught a course on quantum-steampunk creative writing. Students learned about quantum physics, quantum technologies, and thermodynamics. Quanta are discrete units. For example, a photon is a quantum of energy. I illustrated quanta with coins, which are discrete units of money. From then on, I tossed a quarter to every student who answered or asked a question about quantum physics. (I joked that I should have tossed pennies, the minimal units of money, but chose quarters because inflation had been high recently.) I adapted Mark’s tradition to thermodynamics—the study of energy—by tossing Hershey’s kisses—dense packets of energy.<br>\nBefore moving out of Caltech, I said goodbye to Mark. He worked among the high-energy theorists, rather than the quantum information or condensed-matter theorists, so I had to hunt down his office. He smiled and made a joke, of course.<br>\nMark passed away this summer. His Caltech colleague John Preskill published a eulogy as a blog post here. (I learned from John’s post that inflation led Mark to upgrade his quarters to dollar coins. So much for feeling generous about upgrading from pennies to quarters.) When asked about the student experience at Caltech, Mark would say, “Caltech is heaven for professors.” Irony would creep into his voice and body language as he’d continue, “Doesn’t that mean it’s heaven for students, too?” I worked my rear off as a student at Caltech and Perimeter, but I’d call both environments fairly heavenly. Mark and his ilk are reasons why.<\/p>","content_hash":"29483380dda95046de91af6ee44d08c2","author":"Nicole Yunger Halpern","published_at":"2026-07-27T00:00:10","fetched_at":"2026-10-10 11:48:13","word_count":664,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"10w","domain":"quantumfrontiers.com"},{"id":"940ccef49342d4c1","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18008","title":"My friend Mark Wise","url":"https://quantumfrontiers.com/2026/07/18/my-friend-mark-wise/","summary":"Mark Wise, the John A. McCone Professor of High Energy Physics at Caltech, passed away on July 10 at age 72. At a recent memorial service, John Preskill made these remarks. I’m John Preskill, Mark’s colleague on the Caltech physics faculty for more than four decades. Our friendship goes back even farther. My wife Roberta and I met Mark and Jackie not long after they arrived at Harvard in 1980. We’ve been friends since then. We attended the bris for both Barry and Jonathan during those Harvard da","content":"<p>Mark Wise, the John A. McCone Professor of High Energy Physics at Caltech, passed away on July 10 at age 72. At a recent memorial service, John Preskill made these remarks.<br>\nI’m John Preskill, Mark’s colleague on the Caltech physics faculty for more than four decades. Our friendship goes back even farther. My wife Roberta and I met Mark and Jackie not long after they arrived at Harvard in 1980. We’ve been friends since then. We attended the bris for both Barry and Jonathan during those Harvard days. Mark and Jackie have two boys and we have two girls who are a few years younger, who were thrilled to connect with Barry and Jonathan when the families would get together for occasions like Passover or Hanukkah or Thanksgiving. When the kids were little, Mark and I would sometimes muse about the potential for forging even closer family ties if those relationships blossomed.<br>\nThat didn’t happen. But Mark would preside at each Seder with a light hand, sprinkling the occasion with corny jokes as was his style, and Jackie would be determined to make it to the end of that customized family-friendly Haggadah she had meticulously prepared. The children, meanwhile, would be wondering when they’d be able to continue their game of sock baseball.<br>\nMany of you know that Mark was deeply dedicated to his family and friends. I’ll make some brief remarks about three facets of Mark I know especially well: Mark the scientist, Mark the teacher and mentor, and Mark the colleague and friend.<br>\nBecause of his self-deprecating manner, those of you who are not scientists may not appreciate Mark’s stature as a physicist. He was one of the most influential figures in theoretical particle physics of his generation. It was not obvious things would turn out that way. Growing up in Toronto, Mark was an indifferent student, and his poor grades reflected that lack of interest. As a 9th grader, though, it struck him that he better change his ways and figure out how to make something of his life. He liked sports — the possibility of being a professional athlete was briefly considered, but discarded. Somehow he decided that science would be a better fit. I’m not sure why — he had recently failed math. But he worked hard and had inspiring teachers, so by the time he finished high school Mark was an excellent student, and he sailed into the University of Toronto well prepared to major in physics,<br>\nAt U of T, Mark came under the influence of a young professor, Nathan Isgur, who would later become his close research collaborator. Under Nathan’s guidance, Mark sought admission to the PhD programs of the most prestigious US research universities, intent on a career devoted to deep exploration of the fundamental laws of physics. He was rejected everywhere he applied. He should have been discouraged. But he wasn’t. Mark shrugged and said: “It’s okay. I’ll stay another year in Toronto, I’ll get a master’s degree, I’ll apply again and I’ll get in somewhere.” And that’s what happened. He went to Stanford, where, under the kind tutelage of Fred Gilman, Mark took off like a rocket. Hired to the Caltech faculty in 1982, he was a tenured full professor three years later at the age of 31, and appointed as the John A. McCone Professor of High Energy Physics while still in his 30s.<br>\nMark liked action movies, such as those starring Arnold Schwarzenegger or Clint Eastwood. In serious moments, we would sometimes ponder together why we’re successful at what we do, and Mark would always quote Clint Eastwood as Harry Callahan in Magnum Force: “A man’s got to know his limitations.” We would both laugh, but those were words of wisdom. Mark understood what he did well as a research scientist and what he was less good at. Finding problems he could solve that would have interesting consequences for experiments that had been done or could be done was where he excelled – he did it again and again. Mark never lost his zest for calculating things, often by hand with pen and paper, his head resting on one arm with his glasses pushed up onto his forehead as he scribbled. Getting to an answer that was experimentally relevant never stopped giving him a thrill.<br>\nMark also never lost his sense of appreciation for the teachers and mentors who had inspired and helped him. Perhaps that’s why he became such a dedicated teacher and mentor himself. It’s hard to impress Caltech students, but Mark’s lectures where extremely popular, not just for their pedagogical value but also for the humanity and humor he displayed. Students had to pay attention because otherwise one might miss the jokes, which inevitably became known as “Wisecracks.” There is even an account on X with the handle @MarkWiseSays, curated by students who want to preserve Mark’s pithy lessons in physics and in life.<br>\nFor example, Mark might say: “If you really get depressed, I recommend diagonalizing a 2×2 matrix.” For physics students, this is both funny and sage advice. Or he might say. “This calculation will knock your socks off.” A cliché you might hear from anyone. But who besides Mark would then proceed to remove his shoes, rip off his socks, hurl them at the blackboard, put his shoes back on and resume lecturing?<br>\nMost famously, Mark would come to class with an ample supply of coins. He would ask the class questions, sometimes about physics and sometimes random trivia, rewarding a student who gave an answer Mark approved of by tossing a coin. At first the coins were quarters. But Mark, who had a scholarly interest in finance as well as physics, eventually felt that due to inflation he needed to upgrade to dollar coins. These are harder to come by, so it took frequent visits to the bank to make sure he wouldn’t run out. His antics in class made Mark human and approachable, and students responded. Mark felt that many Caltech students don’t fully realize how smart they are. He saw part of his job as building their self-confidence and relieving their stress.<br>\nAs a colleague and mentor to graduate students and postdoctoral scholars, Mark was highly collaborative. He believed that interactions with others sparked his creativity. He was never at all pompous. I know this started early. When we were in the Harvard Society of Fellows we were obligated to have dinner with the Senior Fellows on Monday nights. It was a rather stuffy occasion. And, though I don’t think they do this anymore, after a sumptuous meal we would literally retire for brandy and cigars. Once, while puffing on his cigar after dinner, Mark had an inspiration. He gathered up a few junior fellows and led them to a theater for a movie he thought everyone should see right away. The movie was Conan the Barbarian. And everyone had a blast. That was a perfect Mark moment.<br>\nAs the news about Mark has spread, accolades have poured in from physicists all over the world. He was admired not just for his scientific brilliance, but almost as much for his quirky sense of humor and his kindness. Mark was a wonderful friend to many of us. When you were with him, you were sure to laugh and feel good. He touched the lives of countless colleagues, students and friends. We miss him terribly but there are so many memories that we’ll cherish. We are all so very fortunate to have known and loved Professor Mark Wise.<\/p>","content_hash":"16ba809d0f95d93d22fda6941a21cb29","author":"preskill","published_at":"2026-07-18T14:51:44","fetched_at":"2026-10-10 11:48:14","word_count":1258,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"11w","domain":"quantumfrontiers.com"},{"id":"2e8a415a9c2306af","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17993","title":"The physicists of Florence","url":"https://quantumfrontiers.com/2026/06/28/the-physicists-of-florence/","summary":"A scientist in Florence can’t avoid bumping into colleagues.&nbsp; When visiting the Renaissance’s birthplace last summer, I ran into a fellow physicist even on a Saturday morning. I was wandering around the Uffizi Gallery, a museum blessed with some of the greatest hits in western art. A familiar face arrested me on the first floor. Another colleague cropped up outside the museum. (Some might classify him as an applied physicist or an engineer, but he exhibited a theoretical physicist’s overact","content":"<p>A scientist in Florence can’t avoid bumping into colleagues.<br>\nWhen visiting the Renaissance’s birthplace last summer, I ran into a fellow physicist even on a Saturday morning. I was wandering around the Uffizi Gallery, a museum blessed with some of the greatest hits in western art. A familiar face arrested me on the first floor.<br>\nAnother colleague cropped up outside the museum. (Some might classify him as an applied physicist or an engineer, but he exhibited a theoretical physicist’s overactive imagination.)<br>\nOne colleague, I’d been looking forward to meeting for over four years. Jae Dong Noh is a professor of physics at the University of Seoul in South Korea. He’d conducted the first numerical tests (classical-computer simulations) of an idea I’d helped midwife, the non-Abelian eigenstate thermalization hypothesis (NAETH). An earlier blog post described this mouthful, which predicts how certain quantum many-particle systems thermalize, or experience the flow of time. These systems’ dynamics conserve properties, analogous to energy, that are incompatible: one can’t measure the properties simultaneously, as one can’t measure a quantum particle’s position and momentum simultaneously. Because incompatibility helps distinguish quantum from classical physics, such systems’ thermodynamics qualifies as particularly quantum.<br>\nJae Dong modeled such a system and others numerically in a paper. I admired his computational techniques and his grasp of symmetries (for experts: how non-Abelian symmetries affect chaotic quantum systems’ energy-level statistics). My postdoc Aleks Lasek was planning a more thorough numerical test of the NAETH, so I reached out to Jae Dong, and a collaboration crystallized.<br>\nSeoul operates thirteen hours ahead of Maryland, but we managed to Zoom because Jae Dong is a night owl and I’m an early bird.1 Zoom introduced me to a man perpetually dressed in a neat button-down shirt and sweater, silver overriding the black in his hair. The neatness extended to Jae Dong’s explanations: if Aleks and I didn’t understand one of his emails, he’d explain it quietly and calmly, untangling the confusion as though pulling a comb through wool.<br>\nThe collaboration settled into a rhythm: I’d pose a question or propose a goal, Jae Dong would respond with an analytical calculation,2 I’d find holes in the calculation, Jae Dong would plug the holes, I’d re-check the argument’s logic, and we’d repeat the cycle. Had I been in Jae Dong’s shoes, I’d have swallowed the constant objections as I’ve swallowed grape-flavored cough medicine,3 but he always responded with equanimity—sometimes even good cheer—and a possible solution. Meanwhile, Aleks and then-undergraduate Jade LeSchack checked our analytical arguments numerically.<br>\nSo smoothly did the collaboration hum along that we coauthored two papers before ever meeting in person. One demonstrates numerically that two quantum many-body systems (for experts: nonintegrable Heisenberg models) obey the NAETH.4 In the other paper, we derive a symmetry relation from the NAETH. If the 17-syllable NAETH is a mouthful, the symmetry’s name is half a mouthful: a Kubo–Martin–Schwinger (KMS) relation. It’s important because (i) it enables us to calculate how rapidly a thermodynamic system responds to a stimulus, such as a weak magnetic field, and (ii) physicists go gaga over symmetries generally.<br>\nThe KMS relation constrains thermal states—essentially, systems that have temperatures. Your typical isolated many-particle quantum system looks thermal if you can observe just a small chunk of it at a time. Accordingly, Jae Dong and collaborators had proved that isolated many-particle quantum systems obey the KMS relation approximately. The larger the system, the more accurate the approximation.<br>\nWe extended his argument to systems whose dynamics conserve incompatible properties. Such an extension might sound simple, but its proof filled 24 pages of appendices. (For experts: Clebsch–Gordan coefficients are tricky blighters.) We discovered that, under certain conditions, incompatible conserved quantities can reduce the extent to which a quantum system obeys the KMS relation. Quantum incompatibility can augment deviations from conventional thermodynamics.<br>\nJae Dong planned to present about our work at StatPhys, an international statistical-physics conference, which Florence was hosting in 2024. Throughout the two-and-a-half months before the conference, the KMS relation consumed our team. (For experts: Clebsch–Gordan coefficients are very tricky blighters.) I even hid in my hotel room, working and reworking our proofs, during another conference during that time.<br>\nThe toil paid off. We submitted our KMS manuscript for public scrutiny the day I flew to Florence—because not only Jae Dong would be representing our team at StatPhys. I was looking forward to meeting him there for the first time.<br>\nThe StatPhys committee outdid itself. The opening ceremony unfolded in Florence’s Palazzo Vecchio, where members of the Medici dynasty once lived. Giorgio Parisi, who won a Nobel Prize for statistical physics in 2021, lectured at the ceremony.<br>\nThe meat of the conference took place in two other palaces, the Palazzo dei Congressi and the Palazzo degli Affari. In one of them, I met Jae Dong. Although we’d shown that quantum incompatibility can defy thermodynamic predictions, he met my expectations.<br>\nWe discovered another thermodynamic phenomenon challenged by incompatible conserved quantities, so stay tuned for another paper and blog post. Some colleagues, one can’t avoid; others are worth engaging with again and again.<br>\n1 Aleks has confessed to night-owl habits, but physics motivates him to adapt. Some days, he’s emailed me results before even I’ve woken up. Who needs coffee when the thrill of discovery electrifies one minutes after one hops out of bed?<br>\n2 An exact calculation written out on paper, as opposed to a numerical, or approximate, calculation performed by a silicon-based classical computer.<br>\n3 Does anyone like the grape flavor? Why do companies bother producing it?<br>\n4 Rohit Patil and Marcos Rigol, too, have checked numerically that a system obeys the NAETH.<\/p>","content_hash":"6173f9141ac80f9dc998875c56638f43","author":"Nicole Yunger Halpern","published_at":"2026-06-29T00:00:38","fetched_at":"2026-10-10 11:48:14","word_count":933,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"14w","domain":"quantumfrontiers.com"},{"id":"9ec4a1e77cd711a1","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14585","title":"Majorana 2 – Microsoft’s Scalable Quantum Processor With Reliable, Long-Lasting Qubits","url":"https://quantum.microsoft.com/en-us/insights/blogs/majorana-2-scalable-quantum-processor","summary":"Majorana 2 contains qubits that are 1,000x more reliable than those in our previous quantum processing unit. The new material stack, which swaps aluminum for lead, creates highly reliable topological qubits with operations on the microsecond scale and lifetimes with a mean of 20 seconds, occasionally exceeding one minute. This rapid progress, enabled by AI, has cut our timeline in half for delivering a scalable quantum computer—now anticipated by 2029. To produce the fault-tolerant quantum compu","content":"<p>Figure 2. The new hybrid material stack, designed with AI, consists of lead atop a composite quantum well.<br>\n <br>\n <br>\nAdvancing through DARPA's Quantum Benchmarking Initiative<br>\nThe Defense Advanced Research Projects Agency (DARPA) previously advanced Microsoft as one of only two companies to the final phase of their rigorous program to evaluate quantum systems. The Microsoft Quantum team continues to make progress in DARPA’s Underexplored Systems for Utility-Scale Quantum Computing (US2QC), one of the programs that makes up their larger Quantum Benchmarking Initiative (QBI). <br>\n <br>\nDARPA’s US2QC program and its broader QBI represent a rigorous approach to evaluating quantum systems that could solve problems that are beyond the capabilities of classical computers. To date, the US2QC program has brought together experts from organizations including DARPA, Air Force Research Laboratory, Johns Hopkins University Applied Physics Laboratory, Los Alamos National Laboratory, Oak Ridge National Laboratory, Lawrence Berkeley National Laboratory, and Lawrence Livermore National Laboratory to verify quantum hardware, software, and applications. Going forward, the QBI is expected to engage with even more experts in the testing and evaluation of quantum computers.<br>\n <br>\nPreviously, DARPA selected Microsoft for an earlier phase upon an assessment that we could plausibly build a utility-scale quantum computer in a reasonable timeframe. DARPA then evaluated the Microsoft Quantum team’s architectural designs and engineering plan for a fault-tolerant quantum computer. As a result of this careful analysis, DARPA and Microsoft executed an agreement to begin the final phase of the program. During this phase, Microsoft intends to build a fault-tolerant prototype based on topological qubits in years, not decades—a crucial acceleration step toward utility-scale quantum computing. <br>\n <br>\nOur accelerated roadmap to a scalable quantum machine<br>\nBy overcoming formidable obstacles in physics, Majorana 1 was realized. Over the year that followed, the Microsoft Quantum team met the engineering challenges of manufacturing topological qubits with Majorana 2. Based on this rapid progress, we are accelerating our roadmap to a scalable, practical quantum computer—we have cut our timeline in half and now aim to reach this target by 2029. This achievement will mark a major milestone on the path to a transformative fault-tolerant quantum computer that has the potential to solve problems that affect all of humanity. <br>\n <br>\nLearn more about the latest advances from Microsoft Quantum<\/p>","content_hash":"77e9d2d8ab9da04a0904063abd3ac23d","author":"Chetan Nayak","published_at":"2026-06-02T18:30:00","fetched_at":"2026-10-10 11:48:22","word_count":378,"read_time_minutes":2,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"18w","domain":"quantum.microsoft.com"},{"id":"00e76eede1b889de","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2026/01/22/powerful-new-developer-tools-increase-the-versatility-of-the-microsoft-quantum-platform/","title":"Powerful new developer tools increase the versatility of the Microsoft Quantum platform","url":"https://azure.microsoft.com/en-us/blog/quantum/2026/01/22/powerful-new-developer-tools-increase-the-versatility-of-the-microsoft-quantum-platform/","summary":"The field of quantum computing has advanced beyond the level of error-prone physical qubits to an era of reliable quantum computation with logical qubits. To continue making progress toward fault-tolerant quantum machines, advances in both quantum hardware and software are required. Microsoft is committed to providing the tools that developers and scientists need to enable applications on the quantum machines that exist today, as well as the fault-tolerant machines of the future. New tools that ","content":"<p>The field of quantum computing has advanced beyond the level of error-prone physical qubits to an era of reliable quantum computation with logical qubits. To continue making progress toward fault-tolerant quantum machines, advances in both quantum hardware and software are required. Microsoft is committed to providing the tools that developers and scientists need to enable applications on the quantum machines that exist today, as well as the fault-tolerant machines of the future.<br>\nNew tools that simplify quantum development<br>\nThe Microsoft Quantum Development Kit (QDK) is an open-source developer toolkit for building quantum applications. It provides everything needed—from simulators to a modern programming experience—for developers to build and execute quantum code, both locally and on quantum hardware. The QDK is integrated with VS Code and GitHub Copilot to help you write, test, and execute quantum code. Microsoft’s QDK installs and runs on laptops, and GitHub Copilot makes it quick and easy to get started.<br>\nDomain libraries and workflows available with Microsoft’s QDK include those for error correction and chemistry, with other applications on the horizon. The included tools reduce the effort and expertise needed for researchers to design, test, and implement quantum chemistry applications or the error correction codes needed to create logical qubits. Both these tools and the QDK are open source and interoperable with the most popular quantum programming languages and frameworks, including Q#, OpenQASM, Qiskit, and Cirq. The quantum chemistry toolkit supports WSL and Docker support for reproducibility and portability across systems.<br>\nAI-enabled quantum programming<br>\nMicrosoft’s QDK is fully integrated with VS Code and GitHub Copilot. After installing the QDK extension from the VS Code Marketplace, GitHub Copilot simplifies the use of QDK features in VS Code, including Python and Jupyter integration, circuit rendering, IntelliSense, breakpoint debugging, local simulators, visualizations, histograms, hardware submission, and resource estimation. With GitHub Copilot and the QDK, programming tasks such as code generation, unit tests, and job submissions are faster and easier than ever before.<br>\nQDK for scientific applications<br>\nFor today’s quantum computers to help solve complex scientific problems, those problems must first be simplified and optimized to fit within hardware constraints. Microsoft’s QDK for chemistry provides the advanced tools that developers and quantum researchers need to transform complex challenges into problems that today’s quantum computers can tackle efficiently. This toolkit is designed by chemists to make quantum development for chemistry applications more accessible.<br>\nWe are very excited about the launch of Microsoft’s QDK for chemistry. We believe the modular design of the platform will be a true game changer for quantum chemistry, enabling scalability, flexibility, and widespread adoption across the community.<br>\nAt Algorithmiq, our long-standing experience in building a computational chemistry platform allows us to fully appreciate the level of sophistication that Microsoft’s QDK brings to integrating complex tools and workflows, like ours.<br>\nWe’ve been delighted to have played a small part in shaping this launch and look forward to seeing the impact it will have on the field.<br>\n—Guillermo García-Pérez, Chief Scientific Officer and Co-founder, Algorithmiq<br>\nTurning complex quantum chemistry problems into actionable results requires more than advanced quantum algorithms. It requires the seamless integration of classical data preparation, circuit optimization, and post processing of quantum data. Microsoft’s QDK for chemistry delivers a holistic, end-to-end solution for quantum chemistry, combining best-in-class classical chemistry methods with state-of-the-art algorithms designed for near-term quantum hardware. Efficient classical preprocessing methods reduce problem size while preserving essential chemical accuracy, and chemistry-aware quantum algorithms dramatically reduce circuit depth—shrinking gate counts from thousands to single digits for certain problems.<br>\nWe aim to empower quantum development, with the tools and environments researchers already use—such as VS Code and Python—enhanced with built-in visualization, circuit introspection, and AI-assisted coding capabilities.<br>\nQDK for chemistry provides a unified, intuitive interface for molecular modeling and electronic structure preparation, supporting a broad range of quantum chemistry methods and software packages. Automated workflows with built-in pipelines for Hamiltonian generation and active space selection help researchers move efficiently from problem definition to quantum execution.<br>\nNative VS Code extensions enable real-time molecular and circuit visualization, making it easier to iterate, debug, and refine quantum applications. With support for visualizing molecules and molecular orbitals, rendering quantum circuits with deep-circuit compression, and running workloads on both QDK simulators and quantum hardware, the QDK for chemistry streamlines the entire quantum chemistry development workflow—from classical preparation to quantum simulation, execution, and postprocessing.<br>\nTo ensure continued alignment with rapidly evolving quantum algorithms, Microsoft’s QDK for chemistry is built with adaptability and extensibility in mind. It features plug-and-play integration that supports simulations with any chemistry code, quantum language, or algorithmic package, minimizing configuration overhead. As a result, it will continue to make challenging problems tractable and accelerate time to insight as it scales seamlessly toward the next generation of quantum computing.<br>\nQDK for error correction<br>\nMicrosoft has a longstanding heritage of building tools to further our own quantum error correction research and development. QDK for error correction makes these tools available for the broader quantum community. The tools needed for typical quantum error correction research and development workflows will now be included in Microsoft’s QDK. These include open-source modules for characterizing, validating, and debugging encoded quantum programs, customizable encoding and decoding strategies that align with target runtimes, and customizable notebook samples for common use cases. Tooling packages will be released over time with full availability expected later in 2026.<br>\nThe QDK is part of our highly adaptable platform<br>\nThe QDK is included as part of the Microsoft Quantum platform, which brings together quantum hardware, software, AI, and high-performance computing to create an end-to-end solution powered by Azure. By correcting the errors in high-quality physical qubits, our platform enables the reliable computation needed to realize groundbreaking use cases of quantum computing. Now, with new tools provided through Microsoft’s QDK and supported by GitHub Copilot, the platform enables quantum development, chemistry, and error correction, making it even more versatile.<br>\nThe Microsoft Quantum platform combines our advanced qubit-virtualization system with quantum processing units (QPUs) from industry-leading hardware providers to create logical qubits. It includes an innovative quantum operating system to help customers manage, control, and monitor the quantum device while integrating with Azure. The platform also includes a quantum engine that orchestrates quantum hardware and error correction.<br>\nThe Microsoft Quantum platform is being designed to be highly versatile and integrable with multiple types of quantum hardware. By applying our platform to Atom Computing’s neutral-atom qubits, we are co-designing Magne, the world’s most powerful quantum computer. Defining features of Magne will be revealed by QuNorth, a Nordic quantum initiative, at the Discover Magne event on January 26, 2026 in Copenhagen, Denmark.<br>\nMicrosoft will help provide the necessary skilling to ensure that Nordic developers can unlock the full potential of Magne once deployed. This training is being developed in partnership with qBraid and a cohort of academic and industry partners across the Nordics. The training materials, which are tailored to application engineers and error correction researchers, will help grow regional expertise in reliable quantum computing, and position the Nordic quantum ecosystem to set new benchmarks for innovation.<br>\nGet started with Microsoft’s QDK today<br>\n- Download Microsoft’s QDK and QDK for chemistry<br>\n- Read the technical paper on Microsoft’s QDK for chemistry<br>\n- Explore the VS Code Marketplace<br>\n- Learn more about Microsoft’s QDK<\/p>","content_hash":"97b474e3a31f6cbff252701dfbf0d7e2","author":"Matthias Troyer","published_at":"2026-01-22T16:00:00","fetched_at":"2026-10-10 11:48:31","word_count":1204,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"37w","domain":"azure.microsoft.com"},{"id":"9ce0e464f94a90fc","feed_id":"microsoft-quantum","guid":"https://www.microsoft.com/en-us/security/blog/2025/08/20/quantum-safe-security-progress-towards-next-generation-cryptography/","title":"Quantum-safe security: Progress towards next-generation cryptography","url":"https://www.microsoft.com/en-us/security/blog/2025/08/20/quantum-safe-security-progress-towards-next-generation-cryptography/","summary":"Quantum computing promises transformative advancements, yet it also poses a very real risk to today’s cryptographic security. In the future scalable quantum computing could break public-key cryptography methods currently in use and undermine digital signatures, resulting in compromised authentication systems and identity verification. Starting your journey to become quantum-safe Read the blog › While scalable quantum computing is not available today, the time to prepare is now. Microsoft is prep","content":"<p>Quantum computing promises transformative advancements, yet it also poses a very real risk to today’s cryptographic security. In the future scalable quantum computing could break public-key cryptography methods currently in use and undermine digital signatures, resulting in compromised authentication systems and identity verification.<br>\nStarting your journey to become quantum-safe<br>\nWhile scalable quantum computing is not available today, the time to prepare is now. Microsoft is preparing to be quantum-safe and partnering with regulatory and technical bodies like the National Institute of Standards and Technology (NIST), Internet Engineering Task Force (IETF), International Organization for Standardization (ISO), Distributed Management Task Force (DMTF), Open Compute Project (OCP), and European Telecommunications Standards Institute (ETSI) to align on quantum-safe encryption standards and support worldwide interoperability.<br>\nThe opportunity and challenge ahead<br>\nMigration to post quantum cryptography (PQC) is not a flip-the-switch moment, it’s a multiyear transformation that requires immediate planning and coordinated execution to avoid a last-minute scramble.<br>\nIt is also an opportunity for every organization to address legacy technology and practices and implement improved cryptographic standards. By acting now, organizations can upgrade to modern cryptographical architectures that are inherently quantum safe, upgrade existing systems with the latest standards in cryptography, and embrace crypto-agility (the ability to easily change algorithms) to modernize their cryptographic standards and practices and prepare for scalable quantum computing.<br>\nThe investment in a quantum future<br>\nAt Microsoft, we have been investing in this shift by developing both the advances in quantum computing, such as the Majorana 1 quantum processor and 4D geometric error correction codes, and the requirements for PQC.<br>\nOur PQC effort began in 2014 when we published research on post-quantum algorithms and later quantum cryptanalysis to more rigorously determine when contemporary algorithms will be broken. To contribute to PQC algorithm development we participated in four submissions to the original 2017 NIST PQC call and one submission to the current call. Since 2018 we have been experimenting with verified versions of PQC algorithms and in 2019 Microsoft Research completed testing of an experimental PQC-protected VPN tunnel between Redmond, Washington, and Scotland using the Project Natick underwater datacenter.<br>\nTo support standards development and foster the integration of post-quantum cryptographic algorithms into internet protocols, Microsoft joined as a founding member of the Open Quantum Safe project. Additionally, we led the integration workstream of the NIST NCCoE Post-Quantum project. Microsoft Research was contributing to updating the ISO cryptography standard to include PQC, with our FrodoKEM cryptosystem, developed in collaboration with academic and industry partners, poised to become an ISO standard algorithm.<br>\nIn 2024, we announced and contributed Adams Bridge Accelerator, an open-source quantum resilient cryptographic hardware accelerator and integrated into Caliptra 2.0, part of Open Compute Project (OCP).<br>\nFinally, to help customers and partners begin exploration and integration of quantum-safe algorithms into their environments we previewed PQC capabilities for Windows Insiders and Linux and updated SymCrypt to support verified PQC algorithms. This will help them proactively prepare their software and services for PQC support.<br>\nCreating a Quantum Safe Program<br>\nIn 2023, Charlie Bell, Executive Vice President for Microsoft Security, outlined Microsoft’s vision to build a quantum-safe future, which led to the creation of the Microsoft Quantum Safe Program (QSP). This program unifies and accelerates Microsoft’s efforts to protect our infrastructure, as well as that of our customers, partners, and ecosystems, from the evolving risk of quantum computing.<br>\nThe following timelines shows a consolidated view of where we are today, and what to expect in the near future as we progress this important program as an industry.<br>\nThe Microsoft QSP is aligned with United States government requirements and timelines for quantum safety, including the US Office of Management and Budget (OMB), the Cybersecurity and Infrastructure Security Agency (CISA), NIST, and the National Security Agency’s guidance for organizations to start preparing and transitioning for PQC enablement. We also closely monitor quantum-safe initiatives from international governments, including the European Union, Japan, Canada, Australia, and the United Kingdom, to align with their efforts.<br>\nYou can learn more about our collaboration with standards bodies and recommendations for effective government policies to accelerate the quantum-safe transition in the Microsoft On the Issues blog by Amy Hogan Burney, Vice President, Customer Security and Trust.<br>\nThe Microsoft QSP strategy<br>\nOur QSP is a comprehensive and company-wide effort to enable Microsoft, our customers, and partners, to transition smoothly and securely into the quantum era. The program is governed by the QSP leadership team with representatives across all major business groups, research and engineering divisions, and functions.<br>\nThe QSP strategy is guided by three priorities:<br>\n- Make Microsoft quantum safe by updating Microsoft first- and third-party services, supply chain, and ecosystem to become quantum safe and crypto-agile.<br>\n- Support customers, partners, and ecosystems to become quantum safe with appropriate tools and guidance.<br>\n- Promote global research, standards, and solutions for quantum-safe technologies and crypto-agility.<br>\nOur quantum-safe journey began with an enterprise-wide inventory to assess and prioritize cryptographic asset risks. From there, we partnered with industry leaders to address critical dependencies, investing in quantum safe research and collaborating on hardware and firmware innovation. We accelerated the adoption of quantum-resilient algorithms across core infrastructure, supported by Microsoft’s open-source silicon initiatives.<br>\nAs a result of this foundational work, we are aligned with global government timelines, striving to meet even the most forward-leaning CNSA 2.0 deadlines outlined in CNSSP-15. Combining the different regulations’ aspects and timelines worldwide, Microsoft’s roadmap aims to complete transition of its services and products by 2033—two years before the 2035 deadline set by most governments—aiming to enable early adoption of quantum-safe capabilities by 2029, gradually making them default in subsequent years, or sooner where possible.<br>\nTo maintain resilience of Microsoft’s services and systems against quantum computers powerful enough to break modern cryptographic algorithms, we’ve developed a phased transition strategy built on a modular framework. This approach considers each service unique requirements, performance constraints, and risk profile, resulting in either a direct shift to full PQC or a hybrid approach combining classical and quantum-resistant algorithms as an interim step. Therefore, as early adoption will begin by 2029, core services will reach maturity a few years before then.<br>\nHere are the three key phases for this strategy:<br>\n1. Foundational security components<br>\nMicrosoft has integrated PQC algorithms into foundational components like SymCrypt, the primary cryptographic library that provides consistent cryptographic security across Windows, Microsoft Azure, Microsoft 365 and other platforms. SymCrypt supports both symmetric (for example, AES [Advanced Encryption Standard]) and asymmetric algorithms (for example, RSA [Rivest–Shamir–Adleman], ECDSA [Elliptic Curve Digital Signature Algorithm]), providing essential cryptographic operations such as encryption, decryption, signing, verification, hashing, and key exchange. Most recently we’ve made ML-KEM (Module-Lattice Key Encapsulation Mechanism) and ML-DSA (Module-Lattice Digital Signature Algorithm) available through Cryptography API: Next Generation (CNG) and Certificate and Cryptographic messaging functions. These capabilities are available to Windows Insiders and Linux customers now, with additional foundational capabilities coming through the next five years, always aligning and timebound to evolving industry standards and advancements.<br>\nAs quantum computing advances, the threat of Harvest Now, Decrypt Later (HNDL) cyberattacks become increasingly pressing—where threat actors record and store encrypted data today with the intention of decrypting it once quantum capabilities mature. To counter this risk, security protocol standards are prioritizing quantum-safe key exchange mechanisms. For instance, TLS 1.3 is being enhanced to support both hybrid and pure post-quantum key exchange methods, making it a robust adaptable foundation for integrating PQC algorithms. With version 1.9.0 of SymCrypt-OpenSSL, we’ve enabled TLS hybrid key exchange as per the latest IETF internet draft, providing an early opportunity to help prepare for HNDL threats. This capability will be coming to Windows TLS stack soon.<br>\n2. Core infrastructure services<br>\nUpdating foundational components in products and services, considered core infrastructure service, to provide quantum safety for Microsoft and our customers from future quantum risks. Examples include Microsoft Entra authentication, key and secret management, and signing services. By prioritizing these services, Microsoft will protect the most sensitive and essential components first, providing a strong foundation for the broader transition.<br>\n3. All services and endpoints<br>\nIntegrating PQC into Windows, Azure services, Microsoft 365, data platforms, AI services, and networking enables the broader ecosystem of Microsoft services to be quantum safe, providing comprehensive protection across all platforms and applications.<br>\nWhat’s next<br>\nIn our previous blog, Starting your journey to become quantum safe, we provided some practical recommendations and services for customers to start their quantum-safe journey. In future updates, we will continue to provide insights and guidance, grounded in practical experience as we take these critical steps on a most important journey.<br>\nTransitioning to a quantum-safe environment is a complex but essential process and we encourage our customers and partners to start developing their strategy now.<br>\nTo learn more about Microsoft Security solutions, visit our website. Bookmark the Security blog to keep up with our expert coverage on security matters. Also, follow us on LinkedIn (Microsoft Security) and X (@MSFTSecurity) for the latest news and updates on cybersecurity.<\/p>","content_hash":"d1770d848210544227f3a95decc97fcd","author":"Mark Russinovich and Michal Braverman-Blumenstyk","published_at":"2025-08-20T16:00:00","fetched_at":"2026-10-10 11:48:33","word_count":1480,"read_time_minutes":8,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"59w","domain":"microsoft.com"},{"id":"6b17bba369386971","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14359","title":"Microsoft advances quantum error correction with a family of novel four-dimensional codes","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/06/19/microsoft-advances-quantum-error-correction-with-a-family-of-novel-four-dimensional-codes/","summary":"Microsoft Quantum is continuing to advance the global quantum ecosystem by adding cutting-edge features to its compute platform. By developing powerful error-correction codes that are applicable to many types of qubits, we are advancing the field of quantum computing while putting it within reach of experts and nonexperts alike. Microsoft’s novel four-dimensional geometric codes require very few physical qubits per logical qubit, can check for errors in a single shot, and exhibit a 1,000-fold re","content":"<p>Microsoft Quantum is continuing to advance the global quantum ecosystem by adding cutting-edge features to its compute platform. By developing powerful error-correction codes that are applicable to many types of qubits, we are advancing the field of quantum computing while putting it within reach of experts and nonexperts alike. Microsoft’s novel four-dimensional geometric codes require very few physical qubits per logical qubit, can check for errors in a single shot, and exhibit a 1,000-fold reduction in error rates.<br>\nAddressing the need for fault-tolerant quantum computers<br>\nMost of today’s quantum computers operate with qubits that are prone to errors and thus are not capable of reliable computation on their own. To realize the promise of complex problem-solving abilities in quantum computers, there are two prerequisites:<br>\n- Use physical qubits with high fidelities.<br>\n- Apply error-correction codes that can create reliable, logical qubits with error rates that are substantially lower than those of the corresponding physical qubits.<br>\nAs demonstrated through our collaborations with multiple hardware partners, Microsoft has state-of-the-art capabilities in error correction. Our qubit-virtualization system, which is a core component of the Microsoft Quantum compute platform, enables the creation and entanglement of reliable logical qubits from high-quality physical qubits.<br>\nPreviously, we created and entangled 24 reliable logical qubits by applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral atoms. In that study, we demonstrated our ability to detect and correct errors—and correct for losses of qubits—during computation, thus enabling reliable and highly accurate quantum computation. The teams also created 28 logical qubits with the ability to detect and correct errors while performing reliable computation.<br>\nBy detecting and correcting errors during computation, the Microsoft Quantum compute platform creates logical qubits from high-quality physical qubits to enable reliable quantum computation.<br>\nMicrosoft’s new four-dimensional (4D) geometric codes<br>\nEven high-quality physical qubits require error correction to create and entangle the logical qubits that enable reliable quantum computation. To that end, Microsoft has developed a family of novel 4D geometric codes, which are available in the Microsoft Quantum compute platform and are suitable for qubits with all-to-all connectivity such as neutral atoms, ion traps, and photonics. These powerful codes can reduce the error rates of physical qubits by orders of magnitude to reach the level required for quantum circuits to operate reliably.<br>\nMicrosoft’s new 4D geometric codes:<br>\n- Require very few physical qubits to make each logical qubit: Rotating the codes in four dimensions achieves a fivefold reduction in the number of physical qubits required to make logical qubits.<br>\n- Have efficient logical operations: The codes exhibit high performance and have the single-shot property that enables them to correct errors quickly.<br>\n- Improve the performance of quantum hardware: A 1,000-fold reduction in error rate can be achieved by lowering the physical error rate from 10-3 (one per thousand) to a logical error rate of approximately 10-6 (one per million).<br>\nWith these features, this family of novel codes provides several benefits. The codes reduce the number of steps required to diagnose errors, resulting in low-depth operations and computations. Additionally, these codes reduce the number of physical qubits needed to achieve fault-tolerant quantum computing, accelerating the path to utility scale.<br>\nThis family of codes is one of many that is available for inclusion in the Microsoft Quantum compute platform. It comes with a complete set of efficient operations that makes compilation of any quantum algorithm possible. Incorporation of these codes into our full-stack will enable the creation and entanglement of 50 logical qubits in the near term, with the potential to scale to thousands of logical qubits in the future.<br>\nThe Microsoft Quantum advantage<br>\nAt Microsoft, we are bringing the capabilities for quantum advantage forward by coupling state-of-the-art quantum hardware with the Microsoft Quantum compute platform, which includes error correction, cloud high-performance computing, and advanced AI models. And now, these capabilities can be paired with Microsoft Discovery—our platform designed to accelerate scientific progress.<br>\nIn addition to the strength of the co-optimized hardware and software, Microsoft’s team of experts is available to provide insight and technical expertise on use cases, industry challenges, and opportunities for innovation and collaborative research projects. This allows customers to explore quantum applications, generate new datasets with reliable quantum computing, improve the performance or accuracy of AI models, and provide regional skilling and education in quantum computing.<br>\nMicrosoft and Atom Computing<br>\nTogether, Microsoft and Atom Computing have co-designed a pairing of neutral-atom qubits with the Microsoft Quantum compute platform. Atom Computing’s neutral-atom qubits have several advantages over some other qubit technologies, including their ability to be tightly packed in arrays due to their lack of charge, which offers extensive scalability. Additionally, they can be moved around to allow interactions with other atoms, they have low susceptibility to noise, and they have the high fidelities needed for quantum error correction to work.<br>\nSince our last announcement on our collaboration with Atom Computing, the company has demonstrated improved mid-circuit measurement with qubit reset and reuse on their hardware. This technique—which allows for the measurement of a subset of qubits while preserving both measured and unmeasured qubits—improves error correction, increases the complexity of quantum computations that can be performed, and paves the way for fault-tolerant quantum computing. Additionally, the two-qubit gate fidelity of Atom Computing’s neutral atoms is 99.6%, which remains the highest fidelity of neutral-atom qubits in a commercial system.<br>\nThe high fidelities, all-to-all connectivity, and long coherence times available with Atom Computing’s neutral-atom qubits make them well suited for the creation of logical qubits with the Microsoft Quantum compute platform.<br>\nTogether, Microsoft and Atom Computing apply state-of-the-art error correction to high-quality physical qubits to enable reliable quantum computation.<br>\nReliable quantum computing is here<br>\nWe are in the early stages of reliable quantum computing, and the impact that this technology will have is just beginning to be realized. Practical applications will start to be revealed as researchers in various industries adopt a co-design approach to explore interactions between quantum architectures, algorithms, and applications
