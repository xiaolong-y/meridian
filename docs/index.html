ermodynamicists tend to cultivate and apply quantum information theory. Yet the boundary between the communities has blurred, and many scientists (including yours truly) shuttle between the two.<br>\nWhen Quantum Science and Technology published the roadmap, lead editor Steve Campbell announced the event to us coauthors. He’d wrangled the 69 of us into agreeing to contribute, choosing topics, drafting chapters, adhering to limitations on word counts and citations, responding to referee reports, and editing. An idiom refers to the herding of cats, but it would gain in poignancy by referring to the herding of academics. Little wonder Steve wrote in his email, “I’ll leave it to someone else to pick up the mantle and organise Roadmap #2.” I look forward to seeing that roadmap—and, perhaps, contributing to it. Who wants to pencil in Australia with me?<br>\n1Hi, Mom and Dad.<\/p>","content_hash":"1baca7438c6e4bd1438f9a0a1de4e1d6","author":"Nicole Yunger Halpern","published_at":"2026-02-12T00:46:52","fetched_at":"2026-07-29 02:10:26","word_count":581,"read_time_minutes":3,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"23w","domain":"quantumfrontiers.com"},{"id":"00e76eede1b889de","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2026/01/22/powerful-new-developer-tools-increase-the-versatility-of-the-microsoft-quantum-platform/","title":"Powerful new developer tools increase the versatility of the Microsoft Quantum platform","url":"https://azure.microsoft.com/en-us/blog/quantum/2026/01/22/powerful-new-developer-tools-increase-the-versatility-of-the-microsoft-quantum-platform/","summary":"The field of quantum computing has advanced beyond the level of error-prone physical qubits to an era of reliable quantum computation with logical qubits. To continue making progress toward fault-tolerant quantum machines, advances in both quantum hardware and software are required. Microsoft is committed to providing the tools that developers and scientists need to enable applications on the quantum machines that exist today, as well as the fault-tolerant machines of the future. New tools that ","content":"<p>The field of quantum computing has advanced beyond the level of error-prone physical qubits to an era of reliable quantum computation with logical qubits. To continue making progress toward fault-tolerant quantum machines, advances in both quantum hardware and software are required. Microsoft is committed to providing the tools that developers and scientists need to enable applications on the quantum machines that exist today, as well as the fault-tolerant machines of the future.<br>\nNew tools that simplify quantum development<br>\nThe Microsoft Quantum Development Kit (QDK) is an open-source developer toolkit for building quantum applications. It provides everything needed—from simulators to a modern programming experience—for developers to build and execute quantum code, both locally and on quantum hardware. The QDK is integrated with VS Code and GitHub Copilot to help you write, test, and execute quantum code. Microsoft’s QDK installs and runs on laptops, and GitHub Copilot makes it quick and easy to get started.<br>\nDomain libraries and workflows available with Microsoft’s QDK include those for error correction and chemistry, with other applications on the horizon. The included tools reduce the effort and expertise needed for researchers to design, test, and implement quantum chemistry applications or the error correction codes needed to create logical qubits. Both these tools and the QDK are open source and interoperable with the most popular quantum programming languages and frameworks, including Q#, OpenQASM, Qiskit, and Cirq. The quantum chemistry toolkit supports WSL and Docker support for reproducibility and portability across systems.<br>\nAI-enabled quantum programming<br>\nMicrosoft’s QDK is fully integrated with VS Code and GitHub Copilot. After installing the QDK extension from the VS Code Marketplace, GitHub Copilot simplifies the use of QDK features in VS Code, including Python and Jupyter integration, circuit rendering, IntelliSense, breakpoint debugging, local simulators, visualizations, histograms, hardware submission, and resource estimation. With GitHub Copilot and the QDK, programming tasks such as code generation, unit tests, and job submissions are faster and easier than ever before.<br>\nQDK for scientific applications<br>\nFor today’s quantum computers to help solve complex scientific problems, those problems must first be simplified and optimized to fit within hardware constraints. Microsoft’s QDK for chemistry provides the advanced tools that developers and quantum researchers need to transform complex challenges into problems that today’s quantum computers can tackle efficiently. This toolkit is designed by chemists to make quantum development for chemistry applications more accessible.<br>\nWe are very excited about the launch of Microsoft’s QDK for chemistry. We believe the modular design of the platform will be a true game changer for quantum chemistry, enabling scalability, flexibility, and widespread adoption across the community.<br>\nAt Algorithmiq, our long-standing experience in building a computational chemistry platform allows us to fully appreciate the level of sophistication that Microsoft’s QDK brings to integrating complex tools and workflows, like ours.<br>\nWe’ve been delighted to have played a small part in shaping this launch and look forward to seeing the impact it will have on the field.<br>\n—Guillermo García-Pérez, Chief Scientific Officer and Co-founder, Algorithmiq<br>\nTurning complex quantum chemistry problems into actionable results requires more than advanced quantum algorithms. It requires the seamless integration of classical data preparation, circuit optimization, and post processing of quantum data. Microsoft’s QDK for chemistry delivers a holistic, end-to-end solution for quantum chemistry, combining best-in-class classical chemistry methods with state-of-the-art algorithms designed for near-term quantum hardware. Efficient classical preprocessing methods reduce problem size while preserving essential chemical accuracy, and chemistry-aware quantum algorithms dramatically reduce circuit depth—shrinking gate counts from thousands to single digits for certain problems.<br>\nWe aim to empower quantum development, with the tools and environments researchers already use—such as VS Code and Python—enhanced with built-in visualization, circuit introspection, and AI-assisted coding capabilities.<br>\nQDK for chemistry provides a unified, intuitive interface for molecular modeling and electronic structure preparation, supporting a broad range of quantum chemistry methods and software packages. Automated workflows with built-in pipelines for Hamiltonian generation and active space selection help researchers move efficiently from problem definition to quantum execution.<br>\nNative VS Code extensions enable real-time molecular and circuit visualization, making it easier to iterate, debug, and refine quantum applications. With support for visualizing molecules and molecular orbitals, rendering quantum circuits with deep-circuit compression, and running workloads on both QDK simulators and quantum hardware, the QDK for chemistry streamlines the entire quantum chemistry development workflow—from classical preparation to quantum simulation, execution, and postprocessing.<br>\nTo ensure continued alignment with rapidly evolving quantum algorithms, Microsoft’s QDK for chemistry is built with adaptability and extensibility in mind. It features plug-and-play integration that supports simulations with any chemistry code, quantum language, or algorithmic package, minimizing configuration overhead. As a result, it will continue to make challenging problems tractable and accelerate time to insight as it scales seamlessly toward the next generation of quantum computing.<br>\nQDK for error correction<br>\nMicrosoft has a longstanding heritage of building tools to further our own quantum error correction research and development. QDK for error correction makes these tools available for the broader quantum community. The tools needed for typical quantum error correction research and development workflows will now be included in Microsoft’s QDK. These include open-source modules for characterizing, validating, and debugging encoded quantum programs, customizable encoding and decoding strategies that align with target runtimes, and customizable notebook samples for common use cases. Tooling packages will be released over time with full availability expected later in 2026.<br>\nThe QDK is part of our highly adaptable platform<br>\nThe QDK is included as part of the Microsoft Quantum platform, which brings together quantum hardware, software, AI, and high-performance computing to create an end-to-end solution powered by Azure. By correcting the errors in high-quality physical qubits, our platform enables the reliable computation needed to realize groundbreaking use cases of quantum computing. Now, with new tools provided through Microsoft’s QDK and supported by GitHub Copilot, the platform enables quantum development, chemistry, and error correction, making it even more versatile.<br>\nThe Microsoft Quantum platform combines our advanced qubit-virtualization system with quantum processing units (QPUs) from industry-leading hardware providers to create logical qubits. It includes an innovative quantum operating system to help customers manage, control, and monitor the quantum device while integrating with Azure. The platform also includes a quantum engine that orchestrates quantum hardware and error correction.<br>\nThe Microsoft Quantum platform is being designed to be highly versatile and integrable with multiple types of quantum hardware. By applying our platform to Atom Computing’s neutral-atom qubits, we are co-designing Magne, the world’s most powerful quantum computer. Defining features of Magne will be revealed by QuNorth, a Nordic quantum initiative, at the Discover Magne event on January 26, 2026 in Copenhagen, Denmark.<br>\nMicrosoft will help provide the necessary skilling to ensure that Nordic developers can unlock the full potential of Magne once deployed. This training is being developed in partnership with qBraid and a cohort of academic and industry partners across the Nordics. The training materials, which are tailored to application engineers and error correction researchers, will help grow regional expertise in reliable quantum computing, and position the Nordic quantum ecosystem to set new benchmarks for innovation.<br>\nGet started with Microsoft’s QDK today<br>\n- Download Microsoft’s QDK and QDK for chemistry<br>\n- Read the technical paper on Microsoft’s QDK for chemistry<br>\n- Explore the VS Code Marketplace<br>\n- Learn more about Microsoft’s QDK<\/p>","content_hash":"97b474e3a31f6cbff252701dfbf0d7e2","author":"Matthias Troyer","published_at":"2026-01-22T16:00:00","fetched_at":"2026-07-29 02:10:47","word_count":1204,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"26w","domain":"azure.microsoft.com"},{"id":"9ce0e464f94a90fc","feed_id":"microsoft-quantum","guid":"https://www.microsoft.com/en-us/security/blog/2025/08/20/quantum-safe-security-progress-towards-next-generation-cryptography/","title":"Quantum-safe security: Progress towards next-generation cryptography","url":"https://www.microsoft.com/en-us/security/blog/2025/08/20/quantum-safe-security-progress-towards-next-generation-cryptography/","summary":"Quantum computing promises transformative advancements, yet it also poses a very real risk to today’s cryptographic security. In the future scalable quantum computing could break public-key cryptography methods currently in use and undermine digital signatures, resulting in compromised authentication systems and identity verification. Starting your journey to become quantum-safe Read the blog › While scalable quantum computing is not available today, the time to prepare is now. Microsoft is prep","content":"<p>Quantum computing promises transformative advancements, yet it also poses a very real risk to today’s cryptographic security. In the future scalable quantum computing could break public-key cryptography methods currently in use and undermine digital signatures, resulting in compromised authentication systems and identity verification.<br>\nStarting your journey to become quantum-safe<br>\nWhile scalable quantum computing is not available today, the time to prepare is now. Microsoft is preparing to be quantum-safe and partnering with regulatory and technical bodies like the National Institute of Standards and Technology (NIST), Internet Engineering Task Force (IETF), International Organization for Standardization (ISO), Distributed Management Task Force (DMTF), Open Compute Project (OCP), and European Telecommunications Standards Institute (ETSI) to align on quantum-safe encryption standards and support worldwide interoperability.<br>\nThe opportunity and challenge ahead<br>\nMigration to post quantum cryptography (PQC) is not a flip-the-switch moment, it’s a multiyear transformation that requires immediate planning and coordinated execution to avoid a last-minute scramble.<br>\nIt is also an opportunity for every organization to address legacy technology and practices and implement improved cryptographic standards. By acting now, organizations can upgrade to modern cryptographical architectures that are inherently quantum safe, upgrade existing systems with the latest standards in cryptography, and embrace crypto-agility (the ability to easily change algorithms) to modernize their cryptographic standards and practices and prepare for scalable quantum computing.<br>\nThe investment in a quantum future<br>\nAt Microsoft, we have been investing in this shift by developing both the advances in quantum computing, such as the Majorana 1 quantum processor and 4D geometric error correction codes, and the requirements for PQC.<br>\nOur PQC effort began in 2014 when we published research on post-quantum algorithms and later quantum cryptanalysis to more rigorously determine when contemporary algorithms will be broken. To contribute to PQC algorithm development we participated in four submissions to the original 2017 NIST PQC call and one submission to the current call. Since 2018 we have been experimenting with verified versions of PQC algorithms and in 2019 Microsoft Research completed testing of an experimental PQC-protected VPN tunnel between Redmond, Washington, and Scotland using the Project Natick underwater datacenter.<br>\nTo support standards development and foster the integration of post-quantum cryptographic algorithms into internet protocols, Microsoft joined as a founding member of the Open Quantum Safe project. Additionally, we led the integration workstream of the NIST NCCoE Post-Quantum project. Microsoft Research was contributing to updating the ISO cryptography standard to include PQC, with our FrodoKEM cryptosystem, developed in collaboration with academic and industry partners, poised to become an ISO standard algorithm.<br>\nIn 2024, we announced and contributed Adams Bridge Accelerator, an open-source quantum resilient cryptographic hardware accelerator and integrated into Caliptra 2.0, part of Open Compute Project (OCP).<br>\nFinally, to help customers and partners begin exploration and integration of quantum-safe algorithms into their environments we previewed PQC capabilities for Windows Insiders and Linux and updated SymCrypt to support verified PQC algorithms. This will help them proactively prepare their software and services for PQC support.<br>\nCreating a Quantum Safe Program<br>\nIn 2023, Charlie Bell, Executive Vice President for Microsoft Security, outlined Microsoft’s vision to build a quantum-safe future, which led to the creation of the Microsoft Quantum Safe Program (QSP). This program unifies and accelerates Microsoft’s efforts to protect our infrastructure, as well as that of our customers, partners, and ecosystems, from the evolving risk of quantum computing.<br>\nThe following timelines shows a consolidated view of where we are today, and what to expect in the near future as we progress this important program as an industry.<br>\nThe Microsoft QSP is aligned with United States government requirements and timelines for quantum safety, including the US Office of Management and Budget (OMB), the Cybersecurity and Infrastructure Security Agency (CISA), NIST, and the National Security Agency’s guidance for organizations to start preparing and transitioning for PQC enablement. We also closely monitor quantum-safe initiatives from international governments, including the European Union, Japan, Canada, Australia, and the United Kingdom, to align with their efforts.<br>\nYou can learn more about our collaboration with standards bodies and recommendations for effective government policies to accelerate the quantum-safe transition in the Microsoft On the Issues blog by Amy Hogan Burney, Vice President, Customer Security and Trust.<br>\nThe Microsoft QSP strategy<br>\nOur QSP is a comprehensive and company-wide effort to enable Microsoft, our customers, and partners, to transition smoothly and securely into the quantum era. The program is governed by the QSP leadership team with representatives across all major business groups, research and engineering divisions, and functions.<br>\nThe QSP strategy is guided by three priorities:<br>\n- Make Microsoft quantum safe by updating Microsoft first- and third-party services, supply chain, and ecosystem to become quantum safe and crypto-agile.<br>\n- Support customers, partners, and ecosystems to become quantum safe with appropriate tools and guidance.<br>\n- Promote global research, standards, and solutions for quantum-safe technologies and crypto-agility.<br>\nOur quantum-safe journey began with an enterprise-wide inventory to assess and prioritize cryptographic asset risks. From there, we partnered with industry leaders to address critical dependencies, investing in quantum safe research and collaborating on hardware and firmware innovation. We accelerated the adoption of quantum-resilient algorithms across core infrastructure, supported by Microsoft’s open-source silicon initiatives.<br>\nAs a result of this foundational work, we are aligned with global government timelines, striving to meet even the most forward-leaning CNSA 2.0 deadlines outlined in CNSSP-15. Combining the different regulations’ aspects and timelines worldwide, Microsoft’s roadmap aims to complete transition of its services and products by 2033—two years before the 2035 deadline set by most governments—aiming to enable early adoption of quantum-safe capabilities by 2029, gradually making them default in subsequent years, or sooner where possible.<br>\nTo maintain resilience of Microsoft’s services and systems against quantum computers powerful enough to break modern cryptographic algorithms, we’ve developed a phased transition strategy built on a modular framework. This approach considers each service unique requirements, performance constraints, and risk profile, resulting in either a direct shift to full PQC or a hybrid approach combining classical and quantum-resistant algorithms as an interim step. Therefore, as early adoption will begin by 2029, core services will reach maturity a few years before then.<br>\nHere are the three key phases for this strategy:<br>\n1. Foundational security components<br>\nMicrosoft has integrated PQC algorithms into foundational components like SymCrypt, the primary cryptographic library that provides consistent cryptographic security across Windows, Microsoft Azure, Microsoft 365 and other platforms. SymCrypt supports both symmetric (for example, AES [Advanced Encryption Standard]) and asymmetric algorithms (for example, RSA [Rivest–Shamir–Adleman], ECDSA [Elliptic Curve Digital Signature Algorithm]), providing essential cryptographic operations such as encryption, decryption, signing, verification, hashing, and key exchange. Most recently we’ve made ML-KEM (Module-Lattice Key Encapsulation Mechanism) and ML-DSA (Module-Lattice Digital Signature Algorithm) available through Cryptography API: Next Generation (CNG) and Certificate and Cryptographic messaging functions. These capabilities are available to Windows Insiders and Linux customers now, with additional foundational capabilities coming through the next five years, always aligning and timebound to evolving industry standards and advancements.<br>\nAs quantum computing advances, the threat of Harvest Now, Decrypt Later (HNDL) cyberattacks become increasingly pressing—where threat actors record and store encrypted data today with the intention of decrypting it once quantum capabilities mature. To counter this risk, security protocol standards are prioritizing quantum-safe key exchange mechanisms. For instance, TLS 1.3 is being enhanced to support both hybrid and pure post-quantum key exchange methods, making it a robust adaptable foundation for integrating PQC algorithms. With version 1.9.0 of SymCrypt-OpenSSL, we’ve enabled TLS hybrid key exchange as per the latest IETF internet draft, providing an early opportunity to help prepare for HNDL threats. This capability will be coming to Windows TLS stack soon.<br>\n2. Core infrastructure services<br>\nUpdating foundational components in products and services, considered core infrastructure service, to provide quantum safety for Microsoft and our customers from future quantum risks. Examples include Microsoft Entra authentication, key and secret management, and signing services. By prioritizing these services, Microsoft will protect the most sensitive and essential components first, providing a strong foundation for the broader transition.<br>\n3. All services and endpoints<br>\nIntegrating PQC into Windows, Azure services, Microsoft 365, data platforms, AI services, and networking enables the broader ecosystem of Microsoft services to be quantum safe, providing comprehensive protection across all platforms and applications.<br>\nWhat’s next<br>\nIn our previous blog, Starting your journey to become quantum safe, we provided some practical recommendations and services for customers to start their quantum-safe journey. In future updates, we will continue to provide insights and guidance, grounded in practical experience as we take these critical steps on a most important journey.<br>\nTransitioning to a quantum-safe environment is a complex but essential process and we encourage our customers and partners to start developing their strategy now.<br>\nTo learn more about Microsoft Security solutions, visit our website. Bookmark the Security blog to keep up with our expert coverage on security matters. Also, follow us on LinkedIn (Microsoft Security) and X (@MSFTSecurity) for the latest news and updates on cybersecurity.<\/p>","content_hash":"d1770d848210544227f3a95decc97fcd","author":"Mark Russinovich and Michal Braverman-Blumenstyk","published_at":"2025-08-20T16:00:00","fetched_at":"2026-07-29 02:10:48","word_count":1480,"read_time_minutes":8,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"48w","domain":"microsoft.com"},{"id":"6b17bba369386971","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14359","title":"Microsoft advances quantum error correction with a family of novel four-dimensional codes","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/06/19/microsoft-advances-quantum-error-correction-with-a-family-of-novel-four-dimensional-codes/","summary":"Microsoft Quantum is continuing to advance the global quantum ecosystem by adding cutting-edge features to its compute platform. By developing powerful error-correction codes that are applicable to many types of qubits, we are advancing the field of quantum computing while putting it within reach of experts and nonexperts alike. Microsoft’s novel four-dimensional geometric codes require very few physical qubits per logical qubit, can check for errors in a single shot, and exhibit a 1,000-fold re","content":"<p>Microsoft Quantum is continuing to advance the global quantum ecosystem by adding cutting-edge features to its compute platform. By developing powerful error-correction codes that are applicable to many types of qubits, we are advancing the field of quantum computing while putting it within reach of experts and nonexperts alike. Microsoft’s novel four-dimensional geometric codes require very few physical qubits per logical qubit, can check for errors in a single shot, and exhibit a 1,000-fold reduction in error rates.<br>\nAddressing the need for fault-tolerant quantum computers<br>\nMost of today’s quantum computers operate with qubits that are prone to errors and thus are not capable of reliable computation on their own. To realize the promise of complex problem-solving abilities in quantum computers, there are two prerequisites:<br>\n- Use physical qubits with high fidelities.<br>\n- Apply error-correction codes that can create reliable, logical qubits with error rates that are substantially lower than those of the corresponding physical qubits.<br>\nAs demonstrated through our collaborations with multiple hardware partners, Microsoft has state-of-the-art capabilities in error correction. Our qubit-virtualization system, which is a core component of the Microsoft Quantum compute platform, enables the creation and entanglement of reliable logical qubits from high-quality physical qubits.<br>\nPreviously, we created and entangled 24 reliable logical qubits by applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral atoms. In that study, we demonstrated our ability to detect and correct errors—and correct for losses of qubits—during computation, thus enabling reliable and highly accurate quantum computation. The teams also created 28 logical qubits with the ability to detect and correct errors while performing reliable computation.<br>\nBy detecting and correcting errors during computation, the Microsoft Quantum compute platform creates logical qubits from high-quality physical qubits to enable reliable quantum computation.<br>\nMicrosoft’s new four-dimensional (4D) geometric codes<br>\nEven high-quality physical qubits require error correction to create and entangle the logical qubits that enable reliable quantum computation. To that end, Microsoft has developed a family of novel 4D geometric codes, which are available in the Microsoft Quantum compute platform and are suitable for qubits with all-to-all connectivity such as neutral atoms, ion traps, and photonics. These powerful codes can reduce the error rates of physical qubits by orders of magnitude to reach the level required for quantum circuits to operate reliably.<br>\nMicrosoft’s new 4D geometric codes:<br>\n- Require very few physical qubits to make each logical qubit: Rotating the codes in four dimensions achieves a fivefold reduction in the number of physical qubits required to make logical qubits.<br>\n- Have efficient logical operations: The codes exhibit high performance and have the single-shot property that enables them to correct errors quickly.<br>\n- Improve the performance of quantum hardware: A 1,000-fold reduction in error rate can be achieved by lowering the physical error rate from 10-3 (one per thousand) to a logical error rate of approximately 10-6 (one per million).<br>\nWith these features, this family of novel codes provides several benefits. The codes reduce the number of steps required to diagnose errors, resulting in low-depth operations and computations. Additionally, these codes reduce the number of physical qubits needed to achieve fault-tolerant quantum computing, accelerating the path to utility scale.<br>\nThis family of codes is one of many that is available for inclusion in the Microsoft Quantum compute platform. It comes with a complete set of efficient operations that makes compilation of any quantum algorithm possible. Incorporation of these codes into our full-stack will enable the creation and entanglement of 50 logical qubits in the near term, with the potential to scale to thousands of logical qubits in the future.<br>\nThe Microsoft Quantum advantage<br>\nAt Microsoft, we are bringing the capabilities for quantum advantage forward by coupling state-of-the-art quantum hardware with the Microsoft Quantum compute platform, which includes error correction, cloud high-performance computing, and advanced AI models. And now, these capabilities can be paired with Microsoft Discovery—our platform designed to accelerate scientific progress.<br>\nIn addition to the strength of the co-optimized hardware and software, Microsoft’s team of experts is available to provide insight and technical expertise on use cases, industry challenges, and opportunities for innovation and collaborative research projects. This allows customers to explore quantum applications, generate new datasets with reliable quantum computing, improve the performance or accuracy of AI models, and provide regional skilling and education in quantum computing.<br>\nMicrosoft and Atom Computing<br>\nTogether, Microsoft and Atom Computing have co-designed a pairing of neutral-atom qubits with the Microsoft Quantum compute platform. Atom Computing’s neutral-atom qubits have several advantages over some other qubit technologies, including their ability to be tightly packed in arrays due to their lack of charge, which offers extensive scalability. Additionally, they can be moved around to allow interactions with other atoms, they have low susceptibility to noise, and they have the high fidelities needed for quantum error correction to work.<br>\nSince our last announcement on our collaboration with Atom Computing, the company has demonstrated improved mid-circuit measurement with qubit reset and reuse on their hardware. This technique—which allows for the measurement of a subset of qubits while preserving both measured and unmeasured qubits—improves error correction, increases the complexity of quantum computations that can be performed, and paves the way for fault-tolerant quantum computing. Additionally, the two-qubit gate fidelity of Atom Computing’s neutral atoms is 99.6%, which remains the highest fidelity of neutral-atom qubits in a commercial system.<br>\nThe high fidelities, all-to-all connectivity, and long coherence times available with Atom Computing’s neutral-atom qubits make them well suited for the creation of logical qubits with the Microsoft Quantum compute platform.<br>\nTogether, Microsoft and Atom Computing apply state-of-the-art error correction to high-quality physical qubits to enable reliable quantum computation.<br>\nReliable quantum computing is here<br>\nWe are in the early stages of reliable quantum computing, and the impact that this technology will have is just beginning to be realized. Practical applications will start to be revealed as researchers in various industries adopt a co-design approach to explore interactions between quantum architectures, algorithms, and applications.<br>\nThe most groundbreaking use cases of quantum computing are likely to be achieved when quantum is used to improve and accelerate other technologies, such as high-performance computing and AI. By providing customers with the tools they need to learn quantum computing, develop algorithms, and design quantum applications, Microsoft is enabling customers to maximize the potential benefits of enhancing other technologies with quantum.<br>\nLearn more about quantum<br>\n- Explore the Microsoft Quantum compute platform.<br>\n- Read the theory-based paper on the family of novel 4D error-correction codes.<br>\n- Read the paper on the quantum error correction achieved by incorporating Atom Computing’s QPUs into the Microsoft Quantum compute platform.<\/p>","content_hash":"fd54504b8b56050668d3db61cbcfc3a7","author":"Krysta Svore","published_at":"2025-06-19T20:00:00","fetched_at":"2026-07-29 02:10:59","word_count":1092,"read_time_minutes":6,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"57w","domain":"azure.microsoft.com"},{"id":"fda519d43db4a205","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14344","title":"Transforming R&D with agentic AI: Introducing Microsoft Discovery","url":"https://azure.microsoft.com/en-us/blog/transforming-rd-with-agentic-ai-introducing-microsoft-discovery/","summary":"We are announcing a new enterprise agentic platform called Microsoft Discovery to accelerate research and development (R&amp;D) at Microsoft Build 2025.Our goal is to bring the power of AI to scientists and engineers to transform the entire discovery process—from advanced knowledge reasoning and hypothesis formulation to experimental simulation and iterative learning. Microsoft Discovery enables researchers to collaborate with a team of specialized AI agents combined with a graph-based knowledge","content":"<p>We are announcing a new enterprise agentic platform called Microsoft Discovery to accelerate research and development (R&D) at Microsoft Build 2025.<br>\nOur goal is to bring the power of AI to scientists and engineers to transform the entire discovery process—from advanced knowledge reasoning and hypothesis formulation to experimental simulation and iterative learning. Microsoft Discovery enables researchers to collaborate with a team of specialized AI agents combined with a graph-based knowledge engine, to drive scientific outcomes with speed, scale, and accuracy.<br>\nWe have architected Microsoft Discovery to be highly extensible, enabling researchers to integrate the latest Microsoft innovations with their own models, tools, and datasets as well as a wide range of partner and open-source solutions. Built on top of Microsoft Azure, trust, compliance, transparency, and governance are key design principles of this enterprise-ready platform to enable responsible innovation, keeping the researcher in control.<br>\nAt Microsoft, our researchers have leveraged the advanced AI models and high-performance computing (HPC) simulation tools in Microsoft Discovery to discover a novel coolant prototype with promising properties for immersion cooling in datacenters in about 200 hours—a process that otherwise would have taken months, if not years. This rapid discovery lays the groundwork for future developments in safer and sustainable solutions across multiple industries and is a demonstration of how Microsoft Discovery can potentially transform R&D in any company.<br>\nWe are working with a notable set of Microsoft customers who are interested in co-innovating in diverse industries including chemistry and materials, silicon design, energy, manufacturing, and pharma. We are also working with a broad partner base that is building on top of the platform to drive this acceleration, and we couldn’t be more excited. The possibilities are endless as we realize the full potential of AI in R&D and we are just getting started!<br>\nThe agentic vision for science<br>\nAt Microsoft, we want to amplify the ingenuity of scientists to usher in a new era of accelerating discovery and expand the horizons of research. Doing so requires empowering R&D teams with transformative technologies that can drive meaningful business impact. However, R&D has very specific challenges compared to other domains:<br>\n- Scientific knowledge is vast, nuanced, and distributed.<br>\n- The discovery process is diverse and dynamic, involving multiple highly specialized methods and tasks, making it very hard to connect the dots across the different domains involved.<br>\n- R&D is iterative. There are rarely simple, clear-cut answers. Instead, scientific knowledge evolves through evidence, discourse, and refinement.<br>\nThis complexity demands a new paradigm—one that isn’t aimed at doing the same experiments faster, but rather fundamentally changing the paradigm of how we approach R&D.<br>\nImagine if every researcher could collaborate with a tireless team of intelligent, synergistic AI agents with the sole purpose of accelerated innovation. This is our vision for a new agentic R&D paradigm, embedding AI in every stage of the scientific method.<br>\nIn this new world, people and specialized AI agents will cooperatively refine knowledge and experimentation in real time in a continuous, iterative cycle of discovery—all while maintaining the control, transparency, and trust that enterprises and governmental institutions require. This requires a comprehensive platform where AI can capture both the scientific domain and the cognitive processes involved in managing scientific thought. To realize this vision, scientific AI agents must be able to:<br>\n- Reason over a complex and contextual graph connecting all knowledge sources.<br>\n- Specialize across distinct domains and tasks.<br>\n- Learn from results and adapt entire research plans accordingly.<br>\nIntroducing Microsoft Discovery<br>\nWe are taking a big step toward realizing this vision with Microsoft Discovery, bringing agentic R&D to life by leveraging the latest innovations from Microsoft and the broader scientific ecosystem.<br>\nGraph-based scientific co-reasoning <br>\nThe advent of large language models (LLMs) hinted at this new era, offering capabilities to speed up certain scientific tasks, particularly for information retrieval and hypothesis generation. However, LLMs often lack the contextual understanding required to deeply reason over distributed, nuanced, and often contradictory scientific data.<br>\nMicrosoft Discovery<br>\nGet started today by using Azure HPC and Azure AI Foundry infrastructure.<br>\nMicrosoft Discovery is built on top of a powerful graph-based knowledge engine. Instead of merely retrieving facts, this engine builds graphs of nuanced relationships between proprietary data as well as external scientific research. This allows the platform to have a deep understanding of conflicting theories, diverse experimental results, and even underlying assumptions across disciplines.<br>\nThis contextual reasoning is also transparent. Rather than outputting monolithic answers, it keeps the expert in the loop with detailed source tracking and reasoning, providing the level of transparency in AI systems that builds trust, ensures accountability, and allows experts to validate and understand every step or make any adjustments as needed.<br>\nSpecialized discovery agents for conducting research<br>\nInstead of siloed and static pipelines, Microsoft Discovery implements a continuous and iterative R&D cycle where researchers can guide and orchestrate a team of specialized AI agents that learn and adapt over time—not just for reasoning, but for conducting research itself. The definition of these specialized agents captures both domain knowledge and process logic, simply through natural language.<br>\nR&D teams will be able to build a custom AI team aligned to their specific processes and knowledge, easily encoding these agents with their expertise and methodologies to ensure they can adapt and orchestrate as research progresses. This approach is far more flexible than hard-coding behaviors of today’s digital simulation tools, which often are highly specialized and lack streamlined integration with others, and it means that research teams no longer require computational expertise to drive impact. As an example, users can access and define various agents’ specialties, such as ‘molecular properties simulation specialist’ or ‘literature review specialist.’ They can even suggest which tools or models the agents should use or create, and how they should collaborate with others.<br>\nThis organic, bidirectional collaboration is a game-changer for managing R&D: agents are not only capable of working for the researchers, but with them in a manner that can truly amplify human ingenuity—seeing both the forest and the trees at once.<br>\nAt the center of this collaboration is Microsoft Copilot, acting as a scientific AI assistant that orchestrates these specialized agents based on the researcher’s prompts. Copilot is aware of all the tools, models, and knowledge bases in a customer’s catalog on the platform, can identify which agents to leverage, and can set up end-to-end workflows that cover the full discovery process by combining advanced AI and HPC simulations through the joint work of these agents.<br>\nExtensible and enterprise-ready<br>\nMicrosoft Discovery is built on top of Azure infrastructure and services, leveraging by design the trust, compliance, and governance controls at the core of Microsoft’s secure cloud foundation.<br>\nWe believe in the power of an open ecosystem that leverages the strengths of Microsoft’s latest advancements in combination with other innovative solutions from customers and partners. Microsoft Discovery allows R&D teams to extend the platform’s catalog by bringing their toolkit of choice to cover their specific research needs in a comprehensive scientific bookshelf. This extensibility at the core of Microsoft Discovery simplifies the onboarding of their choice of computational tools, models, and knowledge bases—whether they are custom developments, open-source, or commercial solutions. As we bring to market new capabilities in reliable quantum computing and embodied AI, the platform will remain future-proofed with the best technologies available at Microsoft and across the industry.<br>\nReal impact: Discovering a novel, non-PFAS coolant prototype<br>\nOver the past months, we have made significant strides aiding computational scientists in their research and incorporating cutting-edge innovations from Microsoft Research. This has led to remarkable breakthroughs, such as discovering a novel solid-state electrolyte candidate that uses 70% less lithium in collaboration with the Department of Energy’s Pacific Northwest National Laboratory (PNNL) and enabling rapid computational simulations that accelerate scientific discoveries at Unilever. Microsoft Discovery is designed to bring these innovations to every scientist—not only those with deep computational expertise.<br>\nOne of the more exciting early use cases of Microsoft Discovery is unfolding at the Pacific Northwest National Laboratory, where scientists are using Microsoft Discovery’s advanced generative AI and HPC capabilities to further develop machine learning models that predict and optimize complex chemical separations—a critical process in nuclear science. These separations are essential for effectively isolating radioactive elements after the nuclear fission process, a notoriously time-sensitive and incredibly chemically complex task. In the future, the team aims to use these advancements to reduce the time scientists must spend in hazardous radioactive environments, while improving yields and purity, enhancing both safety and efficiency.<br>\n—Scott Godwin, Director, Center for Cloud Computing, Pacific Northwest National Laboratory<br>\nBy leveraging advanced AI models and HPC tools for simulation that will be available on Microsoft Discovery, Microsoft researchers discovered a novel, non-PFAS, immersion datacenter coolant prototype in about 200 hours.1 Current coolants often take many years to develop and can contain harmful PFAS-based chemicals that make them unviable to use, as there’s a global push to ban these “forever chemicals” in favor of more environmentally friendly options in this industry and many others.<br>\nAfter the digital discovery process, we successfully synthesized this coolant prototype in under four months, and it’s currently under further analysis and refinement. We have already tested some of the primary properties of this material and they align to the AI predictions, which is a testament to the accuracy of the predictive models used. While this project is only an experiment, it lays the groundwork for future developments and improvements in coolant technology and demonstrates how the combination of HPC and specialized AI models can accelerate and transform R&D processes.<br>\nAccording to Daniel Pope, founder of Submer, a company whose mission is to build datacenters with a strong focus on sustainability, efficiency, and a smarter usage of resources:<br>\nThe speed and depth of molecular screening achieved by Microsoft Discovery would’ve been impossible with traditional methods. What once took years of lab work and trial and error, Microsoft Discovery can accomplish in just weeks, and with greater confidence.<br>\nA growing ecosystem<br>\nWe are putting this enterprise-grade platform into the hands of global innovators to demonstrate real-world impact across industries—from chemistry and pharma to manufacturing and silicon design.<br>\nIt’s only with a strong ecosystem that we’ll be able to realize the full potential of Microsoft Discovery, and it’s why we’re working with customers, partners, and other Microsoft teams to bring first-party advancements together with leading industry tools and domain expertise.<br>\nCustomers and internal collaborators<br>\nGSK is working to revolutionize healthcare, uniting science, technology and talent—including world-class partnerships—to get ahead of disease together. The company uses tech to advance science and accelerate the development and delivery of medicines and vaccines to positively impact the health of people at scale.<br>\nGSK’s depth and breadth of data and integrated use of tech across every part of its business—from early scientific exploration through to manufacture and delivery of medicines and vaccines in market—provide a unique offering when working with others. The company looks forward to a possible partnership with Microsoft with the intent of further advancing GSK’s generative platforms for parallel prediction and testing, creating new medicines with greater speed and precision, and potentially transforming medicinal chemistry to new unimaginable levels. The possibilities ahead are exciting, and together, we can strive for the most innovative solutions for patients and for health.<br>\nThe Estée Lauder Companies has gained a worldwide reputation for high-quality skincare, makeup, haircare and fragrance products that deliver highly effective results demonstrated by extensive research and product evaluation. The company is excited to harness the power of Microsoft Discovery to further accelerate the development of products that uphold the finest standards of excellence.<br>\nOur proprietary R&D data, stemming from the minds of our brilliant scientists and nearly 80 years of research, development, and experimentation, is a key competitive advantage. The Microsoft Discovery platform will help us to unleash the power of our data to drive fast, agile, breakthrough innovation and high-quality, personalized products that will delight our consumers.<br>\n—Kosmas Kretsos, PhD, MBA, Vice President, R&D and Innovation Technology, The Estée Lauder Companies<br>\nAdditionally, Microsoft is releasing a medical research agent that uses the same graph-based knowledge engine available in Microsoft Discovery to enhance information retrieval by synthesizing insights from trusted medical journals. As part of a broader set of specialized agents in the healthcare agent orchestrator code sample in Azure AI Foundry, this agent enables researchers and developers to deliver actionable and evidence-based guidance tailored specifically to complex, multi-disciplinary healthcare workflows—such as cancer care.<br>\nDomain-specific offerings<br>\nCombining Microsoft’s and NVIDIA’s strengths in generative Al and scientific computing, we plan to integrate Microsoft Discovery with NVIDIA ALCHEMI and NVIDIA BioNeMo NIM microservices to accelerate breakthroughs in materials and life sciences. Materials researchers will now have access to state-of-the-art inference capabilities for candidate identification, property mapping, and synthetic data generation. Biomolecular R&D teams will be able to accelerate Al model development for drug discovery, leveraging pre-trained BioNeMo Al workflows, all in Microsoft Discovery’s unified, enterprise-grade platform.<br>\nResearchers can also deploy their AI agents on high-performance NVIDIA-accelerated Azure AI Foundry infrastructure, enabling them to efficiently process and synthesize large volumes of scientific data with exceptional speed and responsiveness for accelerated discovery and enhanced research outcomes.<br>\nAI is dramatically accelerating the pace of scientific discovery. By integrating NVIDIA ALCHEMI and BioNeMo NIM microservices into Azure Discovery, we’re giving scientists the ability to move from data to discovery with unprecedented speed, scale, and efficiency.<br>\n—Dion Harris, Senior Director of Accelerated Data Center Solutions, NVIDIA<br>\nAdditionally, we plan to integrate Synopsys’ industry solutions in Microsoft Discovery to accelerate semiconductor engineering, helping both hardware designers and software developers deliver superior products.<br>\nSemiconductor engineering is among the most complex, consequential, and high-stakes scientific endeavors of our time, which makes it an extremely compelling use case for artificial intelligence. By integrating Synopsys’ pioneering AI-powered design solutions with Microsoft Discovery, we can realize the potential of agentic AI, re-engineer chip design workflows, supercharge engineering productivity, and accelerate the pace of technology innovation.<br>\n—Raja Tabet, Senior Vice President, Engineering Excellence Group, Synopsys<br>\nMicrosoft is also working with PhysicsX, planning to integrate the company’s physics AI foundation models into Microsoft Discovery so customers can unlock new levels of automation, optimization, and performance across engineering and manufacturing.<br>\nThe Microsoft Discovery platform represents a seismic shift in how AI can accelerate scientific discovery and engineering. This is about transforming how complex physical systems are designed, built, and operated across advanced industries—in aerospace and defense, semiconductors, minerals and materials, energy, and automotive. Together, PhysicsX and Microsoft are building the software infrastructure that will define the next era of engineering.<br>\n—Jacomo Corbo, Chief Executive Officer and Cofounder, PhysicsX<br>\nIntegration support<br>\nLastly, we’re excited to partner with a growing list of software integrators, such as Accenture and Capgemini, to help customers and collaborators scale custom platform deployments.<br>\nTogether with Microsoft, we are shaping a bold AI vision for organizations who use deep science to bring innovative products to patients and consumers. Our laboratory transformation strategies and Microsoft’s Microsoft Discovery platform create a dynamic ecosystem for scientific advancement. This collaboration will help us realize the laboratory of the future, enabling scientists to push the boundaries of discovery, experimentation, and testing with greater speed and precision.<br>\n—Adam Borenstein, Managing Director, Global Laboratory Reinvention Lead, Accenture<br>\nWe are excited to be bringing the Microsoft Discovery platform and AI agents to R&D-intensive sectors. We believe these technologies have the potential to enable expert scientists to unlock step changes in the pace of innovation, bringing transformative benefits to business and society. This partnership will drive productivity in laboratory-driven R&D by drawing on Capgemini’s industry experience, specialist physical and biological AI capabilities, and science-led ‘lab-in-the-loop’ intellectual property, including that of Cambridge Consultants, the deep tech powerhouse of Capgemini. For our clients this could mean accelerated discovery and predictive modelling or other competitive advantages through using data and AI at scale.<br>\n—Roshan Gya, Chief Executive Officer, Capgemini Invent<br>\nReady to take the next steps?<br>\nLearn more about how Microsoft Discovery can help scientists and engineers transform research and development:<br>\n- Watch the announcement of Microsoft Discovery at the Microsoft Build 2025 Keynote.<br>\n- Sign up to receive updates on the Microsoft Discovery preview<br>\n¹Based on the definitions of PFAS provided by the Organisation for Economic Co-operation and Development (OECD) (2021), the U.S. Environmental Protection Agency and Buck et. al. (2011)<\/p>","content_hash":"19018fa2d51b3b31d2279d5c4c79bcdb","author":"Aseem Datar","published_at":"2025-05-19T16:05:00","fetched_at":"2026-07-29 02:11:08","word_count":2706,"read_time_minutes":14,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"62w","domain":"azure.microsoft.com"},{"id":"c07b2ffa91188e08","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2025/02/19/microsoft-unveils-majorana-1-the-worlds-first-quantum-processor-powered-by-topological-qubits/","title":"Microsoft unveils Majorana 1, the world’s first quantum processor powered by topological qubits","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/02/19/microsoft-unveils-majorana-1-the-worlds-first-quantum-processor-powered-by-topological-qubits/","summary":"Built with a breakthrough class of materials called a topoconductor, Majorana 1 marks a transformative leap toward practical quantum computing. Quantum computers promise to transform science and society—but only after they achieve the scale that once seemed distant and elusive, and their reliability is ensured by quantum error correction. Today, we’re announcing rapid advancements on the path to useful quantum computing: Majorana 1: the world’s first Quantum Processing Unit (QPU) powered by a To","content":"<p>Built with a breakthrough class of materials called a topoconductor, Majorana 1 marks a transformative leap toward practical quantum computing.<br>\nQuantum computers promise to transform science and society—but only after they achieve the scale that once seemed distant and elusive, and their reliability is ensured by quantum error correction. Today, we’re announcing rapid advancements on the path to useful quantum computing:<br>\n- Majorana 1: the world’s first Quantum Processing Unit (QPU) powered by a Topological Core, designed to scale to a million qubits on a single chip.<br>\n- A hardware-protected topological qubit: research published today in Nature, along with data shared at the Station Q meeting, demonstrate our ability to harness a new type of material and engineer a radically different type of qubit that is small, fast, and digitally controlled.<br>\n- A device roadmap to reliable quantum computation: our path from single-qubit devices to arrays that enable quantum error correction.<br>\n- Building the world’s first fault-tolerant prototype (FTP) based on topological qubits: Microsoft is on track to build an FTP of a scalable quantum computer—in years, not decades—as part of the final phase of the Defense Advanced Research Projects Agency (DARPA) Underexplored Systems for Utility-Scale Quantum Computing (US2QC) program.<br>\nTogether, these milestones mark a pivotal moment in quantum computing as we advance from scientific exploration to technological innovation.<br>\nMicrosoft Quantum Innovator Series<br>\nJoin Chetan Nayak to learn about the advancements Microsoft is making in quantum computing.<br>\nHarnessing a new type of material<br>\nAll of today’s announcements build on our team’s recent breakthrough: the world’s first topoconductor. This revolutionary class of materials enables us to create topological superconductivity, a new state of matter that previously existed only in theory. The advance stems from Microsoft’s innovations in the design and fabrication of gate-defined devices that combine indium arsenide (a semiconductor) and aluminum (a superconductor). When cooled to near absolute zero and tuned with magnetic fields, these devices form topological superconducting nanowires with Majorana Zero Modes (MZMs) at the wires’ ends.<br>\nFor nearly a century, these quasiparticles existed only in textbooks. Now, we can create and control them on demand in our topoconductors. MZMs are the building blocks of our qubits, storing quantum information through ‘parity’—whether the wire contains an even or odd number of electrons. In conventional superconductors, electrons bind into Cooper pairs and move without resistance. Any unpaired electron can be detected because its presence requires extra energy. Our topoconductors are different: here, an unpaired electron is shared between a pair of MZMs, making it invisible to the environment. This unique property protects the quantum information.<br>\nWhile this makes our topoconductors ideal candidates for qubits, it also presents a challenge: How do we read quantum information that is so well hidden? How can we distinguish between, say, 1,000,000,000 and 1,000,000,001 electrons?<br>\nOur solution to this measurement challenge works as follows (also see Figure 1):<br>\n- We use digital switches to couple both ends of the nanowire to a quantum dot, which is a tiny semiconductor device that can store electrical charge.<br>\n- This connection increases the dot’s ability to hold charge. Crucially, the exact increase depends on the parity of the nanowire.<br>\n- We measure this change using microwaves. The dot’s ability to hold charge determines how the microwaves reflect off the quantum dot. As a result, they return carrying an imprint of the nanowire’s quantum state.<br>\nWe designed our devices so these changes are large enough to measure reliably in a single shot. Our initial measurements had an error probability of 1%, and we’ve identified clear paths to significantly reduce this.<br>\nOur system shows impressive stability. External energy—such as electromagnetic radiation—can break Cooper pairs, creating unpaired electrons that can flip the qubit’s state from even to odd parity. However, our results show that this is rare, occurring only once per millisecond on average. This indicates that the shielding that envelops our processor is effective at keeping such radiation out. We are exploring ways to reduce this even further.<br>\nIt’s perhaps not surprising that quantum computation would require us to engineer a new state of matter specifically designed to enable it. What’s remarkable is how accurate our readout technique already is, demonstrating that we are harnessing this exotic state of matter for quantum computation.<br>\nRevolutionizing quantum control through digital precision<br>\nThis readout technique enables a fundamentally different approach to quantum computing in which measurements are used to perform calculations.<br>\nTraditional quantum computing rotates quantum states through precise angles, requiring complex analog control signals customized for each qubit. This complicates quantum error correction (QEC), which must rely on these same sensitive operations to detect and correct errors.<br>\nOur measurement-based approach simplifies QEC dramatically. We perform error correction entirely through measurements activated by simple digital pulses that connect and disconnect quantum dots from nanowires. This digital control makes it practical to manage the large numbers of qubits needed for real-world applications.<br>\nFrom physics to engineering<br>\nWith the core building blocks now demonstrated—quantum information encoded in MZMs, protected by topology, and processed through measurements—we’re ready to move from physics breakthrough to practical implementation.<br>\nThe next step is a scalable architecture built around a single-qubit device called a tetron (see Figure 2). At the Station Q meeting, we shared data demonstrating the basic operation of this qubit. One fundamental operation—measuring the parity of one of the topological nanowires in a tetron—uses the same technique described in our Nature paper.<br>\nAnother key operation puts the qubit in a superposition of parity states. This, too, is performed by a microwave reflectometry measurement of a quantum dot, but in a different measurement configuration in which we decouple the first quantum dot from the nanowire and connect a different dot to both nanowires at one end of the device. By performing these two orthogonal Pauli measurements, Z and X, we’ve demonstrated measurement-based control—a crucial milestone that unlocks the next steps on our roadmap.<br>\nOur roadmap now leads systematically toward scalable QEC. The next steps will involve a 4×2 tetron array. We will first use a two-qubit subset to demonstrate entanglement and measurement-based braiding transformations. Using the entire eight-qubit array, we will then implement quantum error detection on two logical qubits.<br>\nThe built-in error protection of topological qubits simplifies QEC. Moreover, our custom QEC codes reduce overhead roughly tenfold compared to the previous state-of-the-art approach. This dramatic reduction means that our scalable system can be built from fewer physical qubits and has the potential to run at a faster clock speed.<br>\nDARPA’s recognition of our approach<br>\nThe Defense Advanced Research Projects Agency (DARPA) has selected Microsoft as one of two companies to advance to the final phase of their rigorous benchmarking program known as Underexplored Systems for Utility-Scale Quantum Computing (US2QC)—one of the programs that makes up DARPA’s larger Quantum Benchmarking Initiative (QBI). Microsoft views this recognition as validation of our roadmap for building a fault-tolerant quantum computer with topological qubits.<br>\nDARPA’s US2QC program and its broader Quantum Benchmarking Initiative represent a rigorous approach to evaluating quantum systems that could solve problems that are beyond the capabilities of classical computers. To date, the US2QC program has brought together experts from DARPA, Air Force Research Laboratory, Johns Hopkins University Applied Physics Laboratory, Los Alamos National Laboratory, Oak Ridge National Laboratory, and NASA Ames Research Center to verify quantum hardware, software, and applications. Going forward, the larger Quantum Benchmarking Initiative is expected to engage with even more experts in the testing and evaluation of quantum computers.<br>\nPreviously, DARPA selected Microsoft for an earlier phase upon an assessment that we could plausibly build a utility-scale quantum computer in a reasonable timeframe. DARPA then evaluated the Microsoft quantum team’s architectural designs and engineering plan for a fault-tolerant quantum computer. As a result of this careful analysis, DARPA and Microsoft have executed an agreement to begin the final phase of the program. During this phase, Microsoft intends to build a fault-tolerant prototype based on topological qubits in years, not decades—a crucial acceleration step toward utility-scale quantum computing.<br>\nUnlocking quantum’s promise<br>\nEighteen months ago, we laid out our roadmap to a quantum supercomputer. Today we hit our second milestone, demonstrating the world’s first topological qubit. And we’ve already placed eight topological qubits on a chip designed to house one million.<br>\nA million-qubit quantum computer isn’t just a milestone—it’s a gateway to solving some of the world’s most difficult problems. Even today’s most powerful supercomputers cannot accurately predict the quantum processes that determine the properties of the materials essential to our future. But quantum computing at this scale could lead to innovations like self-healing materials that repair cracks in bridges, sustainable agriculture, and safer chemical discovery. What today requires billions of dollars in exhaustive experimental searches and wet-lab experiments could be found, instead, through calculation on a quantum computer.<br>\nOur path to useful quantum computing is clear. The foundational technology is proven, and we believe our architecture is scalable. Our new agreement with DARPA shows a commitment to relentless progress toward our goal: building a machine that can drive scientific discovery and solve problems that matter. Stay tuned for more updates on our journey.<br>\nStay informed of Microsoft’s advancements in quantum computing:<br>\n- Check out Dr. Chetan Nayak on the Microsoft Research Podcast as he explores these groundbreaking advances.<br>\n- Read our papers in Nature and on arXiv.<br>\n- Join us to become quantum ready.<br>\n- Read the Microsoft Source story about today’s news.<br>\n- Hear the Microsoft quantum team discuss these milestones:<\/p>","content_hash":"15c89a87936902d9a78c8878dc5851b8","author":"Chetan Nayak","published_at":"2025-02-19T16:00:00","fetched_at":"2026-07-29 02:11:19","word_count":1567,"read_time_minutes":8,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"74w","domain":"azure.microsoft.com"},{"id":"c87bca6f7346a09c","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2025/01/14/2025-the-year-to-become-quantum-ready/","title":"2025: The year to become Quantum-Ready","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/01/14/2025-the-year-to-become-quantum-ready/","summary":"We find ourselves in an exciting and pivotal time. We are at the advent of the reliable quantum computing era. This past November, Microsoft successfully created and entangled 24 logical qubits in collaboration with Atom Computing. As our industry looks toward the next 12 months, the pace of quantum research and development is only going to accelerate, making this a critical and catalyzing time for business leaders to act. We’re seeing a growing need for business leaders to have the information ","content":"<p>We find ourselves in an exciting and pivotal time. We are at the advent of the reliable quantum computing era. This past November, Microsoft successfully created and entangled 24 logical qubits in collaboration with Atom Computing. As our industry looks toward the next 12 months, the pace of quantum research and development is only going to accelerate, making this a critical and catalyzing time for business leaders to act. We’re seeing a growing need for business leaders to have the information and tools to understand better the depth of these amazing technical breakthroughs and the business applications and value they open up. In a business decision-maker study, 12% said their organizations were prepared to assess quantum opportunities. Clearly, there is an urgent need for leaders to get more information and better understand how technical advancements in quantum will enable real-world impact.<br>\nLeaders in global companies, investment funds, and governments across the world are making multi-billion-dollar investments in quantum computing. Those organizations that are in the throes of planning a comprehensive quantum-ready strategy are creating durable, competitive differentiation for their organizations and positioning themselves to harness the full power of quantum as it scales. Clearly, without strategic readiness, it’s a challenging proposition for leaders to assess the risks and returns, or to design effective and responsible quantum strategies that are necessary to create a full-on quantum roadmap for their organization.<br>\nThis is why at Microsoft we are excited to announce our new Quantum Ready program, designed to address these exact challenges by providing business leaders with the insights and tools needed to:<br>\n- Build practical, high-impact hybrid applications.<br>\n- Invest in strategic skilling and access to reliable quantum computers for experimentation.<br>\n- Embrace quantum safety and focus on cryptographic agility.<br>\n- Prepare for scale such that your investments are future-proofed.<br>\nBecoming quantum-ready is both a business and a global imperative. In fact, the United Nations announced 2025 as the International Year of Quantum Science and Technology (IYQ), reflecting the transformative impact quantum mechanics has had in the past century, and setting the stage for the next wave of quantum innovation. As part of this global initiative, Microsoft will be a leading partner with the IYQ, along with the American Physical Society (APS), to celebrate 100 years of quantum innovation. We are so excited to partner with APS and other leading institutions to support the IYQ as it engages with communities from across the world to scale awareness of how quantum science and applications will transform industries.<br>\nQuantum Ready<br>\nQuantum Ready can help future proof your organization today for a quantum-powered tomorrow<br>\nHybrid applications: Business value and security for today and tomorrow<br>\nGiven the rapid pace of innovation, it’s critical that organizations start exploring, identifying, and building an application roadmap that sets them up for success in a quantum future. Doing so will clarify where and when quantum will provide tangible business value and guide both how and to what degree, you should invest to become quantum-ready today.<br>\nThrough our Quantum Ready program, leaders will have an opportunity to engage with Microsoft in one-on-one workshops and industry-specific forums to accelerate their strategic readiness and identify high-value use cases. We hope to bring learnings that result from these industry-specific forums to the broader ecosystem to provide practical insights in the form of custom industry outlook reports to help guide your organization’s leadership and company strategy.<br>\nAdditionally, business leaders need to start preparing for a quantum-safe future; not because there is an immediate threat but because a transition to emerging cryptographic standards will take time. Security is a top priority at Microsoft—this is why we established the Microsoft Quantum Safe Program to enable security alignment from both business and technical perspectives.<br>\nCultivating a quantum-ready culture: Skilling and vision for the hybrid era<br>\nCultivating a culture of innovation begins with robust workforce skilling and training, empowering teams with the knowledge and mindset to embrace quantum-enabled possibilities. Putting this mindset into practice requires providing access to a unified hybrid platform integrating resilient quantum computing, classical supercomputing, and AI. Especially when 76% of leaders indicate that a quantum skills crisis is causing a deceleration in innovation, the organizations that can harness the power of these complementary technologies—and who understand their use is not a matter of either or, but when and how—are in a distinct position to stay ahead.<br>\nOur Quantum Ready program will offer different skilling and training opportunities to help prepare business and government leaders with resources, frameworks, and tools they need to:<br>\n- Understand why quantum technology is positioned to help revolutionize your business operations, talent strategies, and infrastructure.<br>\n- Gain an early-mover competitive edge by creating a quantum strategy that aligns the technology’s potential with your specific business and innovation goals.<br>\n- Explore deep insight and guidance into the impact quantum computing will make in your industry and what it means for your organization.<br>\nActing for success: Preparation for scale with the right partner<br>\nSo, where and how should organizations start? Navigating the many skilling, strategy, and culture considerations is not easy, and it requires the right partners: those with experience putting state-of-the-art hybrid tools into practice with real-world, impactful applications; those who carefully consider the risks quantum pose and are working to mitigate them with leading security solutions and commitments to safe use; and finally, those with an open ecosystem approach to future-proof your investments.<br>\nFrom envisioning new use cases and identifying co-innovation opportunities to receiving first access to visionary industry insights, outlook reports, skilling, workshops, and other exciting new programs to come, sign up here to join Microsoft’s Quantum Ready program. We look forward to connecting with you soon!<br>\nLearn how Microsoft can help you become quantum ready<br>\n- Join the Quantum Ready program.<br>\n- Explore the video learning modules in our Quantum Ready program.<\/p>","content_hash":"0cb778ae31331d9f5d2329c67a5aa941","author":"Mitra Azizirad","published_at":"2025-01-14T16:00:00","fetched_at":"2026-07-29 02:11:29","word_count":964,"read_time_minutes":5,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"80w","domain":"azure.microsoft.com"},{"id":"6bdde094fa0e91d3","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/11/19/microsoft-and-atom-computing-offer-a-commercial-quantum-machine-with-the-largest-number-of-entangled-logical-qubits-on-record/","title":"Microsoft and Atom Computing offer a commercial quantum machine with the largest number of entangled logical qubits on record","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/11/19/microsoft-and-atom-computing-offer-a-commercial-quantum-machine-with-the-largest-number-of-entangled-logical-qubits-on-record/","summary":"Azure Elements Purpose built to accelerate scientific discovery ↗ Microsoft and Atom Computing have made rapid progress in reliable quantum computing by creating and entangling 24 logical qubits made from neutral atoms—they have also demonstrated the ability to detect and correct errors, and perform computation, on 28 logical qubits. Together, the companies are offering a reliable quantum machine built with these state-of-the-art logical qubits and Microsoft’s qubit-virtualization system, and in","content":"<p>Azure Elements<br>\nMicrosoft and Atom Computing have made rapid progress in reliable quantum computing by creating and entangling 24 logical qubits made from neutral atoms—they have also demonstrated the ability to detect and correct errors, and perform computation, on 28 logical qubits. Together, the companies are offering a reliable quantum machine built with these state-of-the-art logical qubits and Microsoft’s qubit-virtualization system, and integrated with Azure Elements. This comprehensive package is available to order today with delivery in 2025. The results reported here showcase the advances being made toward scientific quantum advantage, which will require not only reliable quantum computation, but also integration with AI and high-performance computing.<br>\nAtom Computing’s neutral-atom qubits<br>\nIn the quantum computing industry, multiple types of physical qubits are being explored as potential pathways to hybrid quantum-classical supercomputing. But not all types of qubits allow for the quantum error correction needed to enable more reliable quantum computing. And without reliable quantum computing, valuable solutions to classically intractable problems are unlikely to be achieved. It’s essential to graduate from computing with noisy physical qubits to operating with reliable, logical ones.<br>\nOne type of qubit that opens opportunities for more reliable quantum computation, with more and better logical qubits, is based on neutral atoms. Our partner, Atom Computing, uses neutral atoms as qubits to store and process quantum information through manipulation with pulses of light. Compared to other qubit technologies, neutral atoms have several advantages including the ability to be tightly packed in arrays while being held in place by lasers, as well as the ability to be moved around so that they can interact with other atoms to enable all-to-all connectivity. Neutral atoms also have low susceptibility to noise and the high fidelities needed for quantum error correction to work. Due to their lack of charge, neutral atoms can be kept only microns (millionths of a meter) apart. Thus, atomic arrays can accommodate large numbers of neutral atoms, each of which serves as a physical qubit, in a small amount of space, offering extensive scalability.<br>\nAtom Computing recently announced that they have achieved 99.6% two-qubit gate fidelity, which represents the highest fidelity of neutral-atom qubits in a commercial system and unlocks the ability to perform meaningful error correction. Qubits with such low error rates and all-to-all connectivity are prime candidates for Microsoft’s custom qubit-virtualization system, which creates logical qubits and enables the detection and correction of errors while performing reliable quantum computation.<br>\nQuantum Insider<br>\nWebinar with Dr. Krysta Svore and Dr. Ben Bloom on the offering from Microsoft and Atom Computing<br>\nAzure Quantum compute platform<br>\nTo enable reliable quantum computing, Microsoft has developed the Azure Quantum compute platform. This compute platform combines Microsoft’s advanced qubit-virtualization system with quantum-processing units (QPUs) from our industry-leading hardware partners to create logical qubits by detecting and correcting the errors inherent in the QPU’s physical qubits, in turn enabling reliable quantum computation.<br>\nMicrosoft’s qubit-virtualization system is a core component of the Azure Quantum compute platform and builds on Microsoft’s world-class quantum error correction innovations. It offers high performance quantum error correction, custom-tailored for the underlying QPU and can be applied to a variety of QPU types. By co-designing the quantum computer with Atom Computing, we are enabling faster, more advanced, and more efficient quantum error correction as part of our qubit-virtualization system.<br>\nCreating and entangling logical qubits<br>\nTo enable complex quantum computations, qubits must meet several criteria. The physical qubits must have low enough error rates to enable error detection and correction so that they can be used to create reliable logical qubits. Those logical qubits must then be able to not only be entangled, but also to undergo many logical operations without failure to enable successful solutions to complex computations.<br>\nBy applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral-atom qubits, the teams created 24 logical qubits and entangled them in a cat state, or Greenberger-Horne-Zeilinger (GHZ) state—this represents the highest number of entangled logical qubits on record. Entanglement of the qubits is evidenced by their error rates being significantly below the 50% threshold for entanglement (Figure 1).<br>\nWhen using neutral atoms as qubits and attempting to hold them in place with lasers, some atoms can still become lost, resulting in a loss of that qubit and its quantum information. Thus, the teams took steps to not only detect errors but also to detect and correct losses of neutral-atom qubits during experiments. After creating logical qubits from neutral atoms and detecting errors and losses, the error rate in the logical qubits was 10.2%, which is 4.1 times better than the baseline physical error rate of 42% (Figure 1). When errors were detected and losses were detected and corrected, the error rate was 26.6%, which is 1.6 times better than the physical error rate (Figure 1). This is the first demonstra
