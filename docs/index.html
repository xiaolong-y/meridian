ou your dream job. Even if you receive only one offer. You might still garner resources that can help your research program and family to thrive. Don’t feel shy, sheepish, or ashamed to negotiate. If you remain polite and considerate, you won’t offend anyone. Besides, the hiring committee, department chair, and dean expect you to negotiate. The department chair might even hope that you do so; vide infra.<br>\nWhen I was a PhD student, Caltech offered a workshop about negotiation to women grad students. The workshop helped participants build skills, knowledge, and self-assurance that would benefit us when we negotiated contracts. I recommend attending a workshop, taking a course, reading a book, or watching videos about negotiation. Contact your institution’s professional-development office about opportunities and suggestions. If you’re reading this blog post before applying for jobs—any jobs—start now.<br>\nWhat can you negotiate for? Many of the items on your list of priorities. Certain institutions might lack the freedom to negotiate certain items, though. For example, a union might determine salaries. Don’t let such a discovery discourage you; explore the options thoroughly.<br>\nView the department chair as an ally. The department chair negotiates on your behalf with administrators higher up in the university hierarchy, such as deans. The chair aims to garner as many resources as possible for you—and, by extension, for their department. Explain to the department chair (or to the committee chair who might explain to the department chair) what you need and why you need it, to help strengthen their argument.<br>\nAs soon as you know you’ll decline an offer, decline it politely. Your notification will free the committee to attract another candidate. Imagine you’re Candidate #2 on the priority list. Wouldn’t you want the current offer recipient to decline their offer as soon as their conscience allows? Now, imagine you’re the hiring-committee chair. You’re worried that Candidate #1 will decline—and, by the time they decline, other institutions will have snapped up the other top candidates. As Candidate #1, demonstrate toward the committee chair and toward Candidate #2 the consideration that you’d value if in their shoes.<br>\nSavor the moment. You’ve just survived the faculty-application process, one of the most stressful periods of your life. The faculty life is no walk in the park, either. Nor will you necessarily sleep soundly between the receipt of your first offer and your signing of a contract. The prospect of more offers could leave you in limbo. If you receive multiple offers, choosing between them—choosing the course of your and your family’s life—may stress you as much as applying did. So remember to feel grateful for the source of your anxiety. Give yourself credit for your accomplishment.<br>\nCongratulations!<br>\n1Please do! They’ll want to celebrate with you.<br>\n2I recommend targeting undergrads who’ll work with you for more than a summer. Training an undergrad takes nearly a summer; you and the student will benefit from having time to take advantage of that training.<\/p>","content_hash":"b8b5aa16c40214d1f982707435a49e2f","author":"Nicole Yunger Halpern","published_at":"2026-03-11T23:40:50","fetched_at":"2026-08-08 12:39:01","word_count":1932,"read_time_minutes":10,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"21w","domain":"quantumfrontiers.com"},{"id":"d6c7d6e9b377d977","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17836","title":"What is next in quantum advantage?","url":"https://quantumfrontiers.com/2026/02/28/what-is-next-in-quantum-advantage/","summary":"We are now at an exciting point in our process of developing quantum computers and understanding their computational power: It has been demonstrated that quantum computers can outperform classical ones (if you buy my argument from Parts 1 and 2 of this mini series). And it has been demonstrated that quantum fault-tolerance is possible for at least a few logical qubits. Together, these form the elementary building blocks of useful quantum computing. And yet: the devices we have seen so far are st","content":"<p>We are now at an exciting point in our process of developing quantum computers and understanding their computational power: It has been demonstrated that quantum computers can outperform classical ones (if you buy my argument from Parts 1 and 2 of this mini series). And it has been demonstrated that quantum fault-tolerance is possible for at least a few logical qubits. Together, these form the elementary building blocks of useful quantum computing.<br>\nAnd yet: the devices we have seen so far are still nowhere near being useful for any advantageous application in, say, condensed-matter physics or quantum chemistry, which is where the promise of quantum computers lies.<br>\nSo what is next in quantum advantage?<br>\nThis is what this third and last part of my mini-series on the question “Has quantum advantage been achieved?” is about.<br>\nThe 100 logical qubits regime<br>\nI want to have in mind the regime in which we have 100 well-functioning logical qubits, so 100 qubits on which we can run maybe 100 000 gates.<br>\nBuilding devices operating in this regime will require thousand(s) of physical qubits and is therefore well beyond the proof-of-principle quantum advantage and fault-tolerance experiments that have been done. At the same time, it is (so far) still one or more orders of magnitude away from any of the first applications such as simulating, say, the Fermi-Hubbard model or breaking cryptography. In other words, it is a qualitatively different regime from the early fault-tolerant computations we can do now. And yet, there is not a clear picture for what we can and should do with such devices.<br>\nThe next milestone: classically verifiable quantum advantage<br>\nIn this post, I want to argue that a key milestone we should aim for in the 100 logical qubit regime is classically verifiable quantum advantage. Achieving this will not only require the jump in quantum device capabilities but also finding advantage schemes that allow for classical verification using these limited resources.<br>\nWhy is it an interesting and feasible goal and what is it anyway?<br>\nTo my mind, the biggest weakness of the RCS experiments is the way they are verified. I discussed this extensively in the last posts—verification uses XEB which can be classically spoofed, and only actually measured in the simulatable regime. Really, in a quantum advantage experiment I would want there to be an efficient procedure that will without any reasonable doubt convince us that a computation must have been performed by a quantum computer when we run it. In what I think of as classically verifiable quantum advantage, a (classical) verifier would come up with challenge circuits which they would then send to a quantum server. These would be designed in such a way that once the server returns classical samples from those circuits, the verifier can convince herself that the server must have run a quantum computation.<br>\nThis is the jump from a physics-type experiment (the sense in which advantage has been achieved) to a secure protocol that can be used in settings where I do not want to trust the server and the data it provides me with. Such security may also allow a first application of quantum computers: to generate random numbers whose genuine randomness can be certified—a task that is impossible classically.<br>\nHere is the problem: On the one hand, we do know of schemes that allow us to classically verify that a computer is quantum and generate random numbers, so called cryptographic proofs of quantumness (PoQ). A proof of quantumness is a highly reliable scheme in that its security relies on well-established cryptography. Their big drawback is that they require a large number of qubits and operations, comparable to the resources required for factoring. On the other hand, the computations we can run in the advantage regime—basically, random circuits—are very resource-efficient but not verifiable.<br>\nThe 100-logical-qubit regime lies right in the middle, and it seems more than plausible that classically verifiable advantage is possible in this regime. The theory challenge ahead of us is to find it: a quantum advantage scheme that is very resource-efficient like RCS and also classically verifiable like proofs of quantumness.<br>\nWith this in mind, let me spell out some concrete goals that we can achieve using 100 logical qubits on the road to classically verifiable quantum advantage.<br>\n1. Demonstrate fault-tolerant quantum advantage<br>\nBefore we talk about verifiable advantage, the first experiment I would like to see is one that combines the two big achievements of the past years, and shows that quantum advantage and fault-tolerance can be achieved simultaneously. Such an experiment would be similar in type to the RCS experiments, but run on encoded qubits with gate sets that match that encoding. During the computation, noise would be suppressed by correcting for errors using the code. In doing so, we could reach the near-perfect regime of RCS as opposed to the finite-fidelity regime that current RCS experiments operate in (as I discussed in detail in Part 2).<br>\nRandom circuits with a quantum advantage that are particularly easy to implement fault-tolerantly are so-called IQP circuits. In those circuits, the gates are controlled-NOT gates and diagonal gates, so rotations , which just add a phase to a basis state as . The only “quantumness” comes from the fact that each input qubit is in the superposition state , and that all qubits are measured in the basis. This is an example of an example of an IQP circuit:<br>\nAs it so happens, IQP circuits are already really well understood since one of the first proposals for quantum advantage was based on IQP circuits (VerIQP1), and for a lot of the results in random circuits, we have precursors for IQP circuits, in particular, their ideal and noisy complexity (SimIQP). This is because their near-classical structure makes them relatively easy to study. Most importantly, their outcome probabilities are simple (but exponentially large) sums over phases that can just be read off from which gates are applied in the circuit and we can use well-established classical techniques like Boolean analysis and coding theory to understand those.<br>\nIQP gates are natural for fault-tolerance because there are codes in which all the operations involved can be implemented transversally. This means that they only require parallel physical single- or two-qubit gates to implement a logical gate rather than complicated fault-tolerant protocols which are required for universal circuits. This is in stark contrast to universal circuit which require resource-intensive fault-tolerant protocols. Running computations with IQP circuits would also be a step towards running real computations in that they can involve structured components such as cascades of CNOT gates and the like. These show up all over fault-tolerant constructions of algorithmic primitives such as arithmetic or phase estimation circuits.<br>\nOur concrete proposal for an IQP-based fault-tolerant quantum advantage experiment in reconfigurable-atom arrays is based on interleaving diagonal gates and CNOT gates to achieve super-fast scrambling (ftIQP1). A medium-size version of this protocol was implemented by the Harvard group (LogicalExp) but with only a bit more effort, it could be performed in the advantage regime.<br>\nIn those proposals, verification will still suffer from the same problems of standard RCS experiments, so what’s up next is to fix that!<br>\n2. Closing the verification loophole<br>\nI said that a key milestone for the 100-logical-qubit regime is to find schemes that lie in between RCS and proofs of quantumness in terms of their resource requirements but at the same time allow for more efficient and more convincing verification than RCS. Naturally, there are two ways to approach this space—we can make quantum advantage schemes more verifiable, and we can make proofs of quantumness more resource-efficient.<br>\nFirst, let’s focus on the former approach and set a more moderate goal than full-on classical verification of data from an untrusted server. Are there variants of RCS that allow us to efficiently verify that finite-fidelity RCS has been achieved if we trust the experimenter and the data they hand us?<br>\n2.1 Efficient quantum verification using random circuits with symmetries<br>\nIndeed, there are! I like to think of the schemes that achieve this as random circuits with symmetries. A symmetry is an operator such that the outcome state of the computation (or some intermediate state) is invariant under the symmetry, so . The idea is then to find circuits that exhibit a quantum advantage and at the same time have symmetries that can be easily measured, say, using only single-qubit measurements or a single gate layer. Then, we can use these measurements to check whether or not the pre-measurement state respects the symmetries. This is a test for whether the quantum computer prepared the correct state, because errors or deviations from the true state would violate the symmetry (unless they were adversarially engineered).<br>\nIn random circuits with symmetries, we can thus use small, well-characterized measurements whose outcomes we trust to probe whether a large quantum circuit has been run correctly. This is possible in a scenario I call the trusted experimenter scenario.<br>\nThe trusted experimenter scenario<br>\nIn this scenario, we receive data from an actual experiment in which we trust that certain measurements were actually and correctly performed.<br>\nHere are some examples of random circuits with symmetries, which allow for efficient verification of quantum advantage in the trusted experimenter scenario.<br>\nGraph states. My first example are locally rotated graph states (GStates). These are states that are prepared by CZ gates acting according to the edges of a graph on an initial all- state, and a layer of single-qubit -rotations is performed before a measurement in the basis. (Yes, this is also an IQP circuit.) The symmetries of this circuit are locally rotated Pauli operators, and can therefore be measured using only single-qubit rotations and measurements. What is more, these symmetries fully determine the graph state. Determining the fidelity then just amounts to averaging the expectation values of the symmetries, which is so efficient you can even do it in your head. In this example, we need measuring the outcome state to obtain hard-to-reproduce samples and measuring the symmetries are done in two different (single-qubit) bases.<br>\nWith 100 logical qubits, samples from classically intractable graph states on several 100 qubits could be easily generated.<br>\nBell sampling. The drawback of this approach is that we need to make two different measurements for verification and sampling. But it would be much more neat if we could just verify the correctness of a set of classically hard samples by only using those samples. For an example where this is possible, consider two copies of the output state of a random circuit, so . This state is invariant under a swap of the two copies, and in fact the expectation value of the SWAP operator in a noisy state preparation of determines the purity of the state, so . It turns out that measuring all pairs of qubits in the state in the pairwise basis of the four Bell states , where is one of the four Pauli matrices , this is hard to simulate classically (BellSamp). You may also observe that the SWAP operator is diagonal in the Bell basis, so its expectation value can be extracted from the Bell-basis measurements—our hard to simulate samples. To do this, we just average sign assignments to the samples according to their parity.<br>\nIf the circuit is random, then under the same assumptions as those used in XEB for random circuits, the purity is a good estimator of the fidelity, so . So here is an example, where efficient verification is possible directly from hard-to-simulate classical samples under the same assumptions as those used to argue that XEB equals fidelity.<br>\nWith 100 logical qubits, we can achieve quantum advantage which is at least as hard as the current RCS experiments that can also be efficiently (physics-)verified from the classical data.<br>\nFault-tolerant circuits. Finally, suppose that we run a fault-tolerant quantum advantage experiment. Then, there is a natural set of symmetries of the state at any point in the circuit, namely, the stabilizers of the code we use. In a fault-tolerant experiment we repeatedly measure those stabilizers mid-circuit, so why not use that data to assess the quality of the logical state? Indeed, it turns out that the logical fidelity can be estimated efficiently from stabilizer expectation values even in situations in which the logical circuit has a quantum advantage (SyndFid).<br>\nWith 100 logical qubits, we could therefore just run fault-tolerant IQP circuits in the advantage regime (ftIQP1) and the syndrome data would allow us to estimate the logical fidelity.<br>\nIn all of these examples of random circuits with symmetries, coming up with classical samples that pass the verification tests is very easy, so the trusted-experimenter scenario is crucial for this to work. (Note, however, that it may be possible to add tests to Bell sampling that make spoofing difficult.) At the same time, these proposals are very resource-efficient in that they only increase the cost of a pure random-circuit experiment by a relatively small amount. What is more, the required circuits have more structure than random circuits in that they typically require gates that are natural in fault-tolerant implementations of quantum algorithms.<br>\nPerforming random circuit sampling with symmetries is therefore a natural next step en-route to both classically verifiable advantage that closes the no-efficient verification loophole, and towards implementing actual algorithms.<br>\nWhat if we do not want to afford that level of trust in the person who runs the quantum circuit, however?<br>\n2.2 Classical verification using random circuits with planted secrets<br>\nIf we do not trust the experimenter, we are in the untrusted quantum server scenario.<br>\nThe untrusted quantum server scenario<br>\nIn this scenario, we delegate a quantum computation to an untrusted (presumably remote) quantum server—think of using a Google or Amazon cloud server to run your computation. We can communicate with this server using classical information.<br>\nIn the untrusted server scenario, we can hope to use ideas from proofs of quantumness such as the use of classical cryptography to design families of quantum circuits in which some secret structure is planted. This secret structure should give the verifier a way to check whether a set of samples passes a certain verification test. At the same time it should not be detectable, or at least not be identifiable from the circuit description alone.<br>\nThe simplest example of such secret structure could be a large peak in an otherwise flat output distribution of a random-looking quantum circuit. To do this, the verifier would pick a (random) string and design a circuit such that the probability of seeing in samples, is large. If the peak is hidden well, finding it just from the circuit description would require searching through all of the outcome bit strings and even just determining one of the outcome probabilities is exponentially difficult. A classical spoofer trying to fake the samples from a quantum computer would then be caught immediately: the list of samples they hand the verifier will not even contain unless they are unbelievably lucky, since there are exponentially many possible choices of .<br>\nUnfortunately, planting such secrets seems to be very difficult using universal circuits, since the output distributions are so unstructured. This is why we have not yet found good candidates of circuits with peaks, but some tries have been made (Peaks,ECPeaks,HPeaks)<br>\nWe do have a promising candidate, though—IQP circuits! The fact that the output distributions of IQP circuits are quite simple could very well help us design sampling schemes with hidden secrets. Indeed, the idea of hiding peaks has been pioneered by Shepherd and Bremner (VerIQP1) who found a way to design classically hard IQP circuits with a large hidden Fourier coefficient. The presence of this large Fourier coefficient can easily be checked from a few classical samples, and random IQP circuits do not have any large Fourier coefficients. Unfortunately, for that construction and a variation thereof (VerIQP2), it turned out that the large coefficient can be detected quite easily from the circuit description (ClassIQP1,ClassIQP2).<br>\nTo this day, it remains an exciting open question whether secrets can be planted in (maybe IQP) circuit families in a way that allows for efficient classical verification. Even finding a scheme with some large gap between verification and simulation times would be exciting, because it would for the first time allow us to verify a quantum computing experiment in the advantage regime using only classical computation.<br>\nTowards applications: certifiable random number generation<br>\nBeyond verified quantum advantage, sampling schemes with hidden secrets may be usable to generate classically certifiable random numbers: You sample from the output distribution of a random circuit with a planted secret, and verify that the samples come from the correct distribution using the secret. If the distribution has sufficiently high entropy, truly random numbers can be extracted from them. The same can be done for RCS, except that some acrobatics are needed to get around the problem that verification is just as costly as simulation (CertRand, CertRandExp). Again, a large gap between verification and simulation times would probably permit such certified random number generation.<br>\nThe goal here is firstly a theoretical one: Come up with a planted-secret RCS scheme that has a large verification-simulation gap. But then, of course, it is an experimental one: actually perform such an experiment to classically verify quantum advantage.<br>\nShould an IQP-based scheme of circuits with secrets exist, 100 logical qubits is the regime where it should give a relevant advantage.<br>\nThree milestones<br>\nAltogether, I proposed three milestones for the 100 logical qubit regime.<br>\n- Perform fault-tolerant quantum advantage using random IQP circuits. This will allow an improvement of the fidelity towards performing near-perfect RCS and thus closes the scalability worries of noisy quantum advantage I discussed in my last post.<br>\n- Perform RCS with symmetries. This will allow for efficient verification of quantum advantage in the trusted experimenter scenario and thus make a first step toward closing the verification loophole.<br>\n- Find and perform RCS schemes with planted secrets. This will allow us to verify quantum advantage in the remote untrusted server scenario and presumably give a first useful application of quantum computers to generate classically certified random numbers.<br>\nAll of these experiments are natural steps towards performing actually useful quantum algorithms in that they use more structured circuits than just random universal circuits and can be used to benchmark the performance of the quantum devices in an advantage regime. Moreover, all of them close some loophole of the previous quantum advantage demonstrations, just like follow-up experiments to the first Bell tests have closed the loopholes one by one.<br>\nI argued that IQP circuits will play an important role in achieving those milestones since they are a natural circuit family in fault-tolerant constructions and promising candidates for random circuit constructions with planted secrets. Developing a better understanding of the properties of the output distributions of IQP circuits will help us achieve the theory challenges ahead.<br>\nExperimentally, the 100 logical qubit regime is exactly the regime to shoot for with those circuits since while IQP circuits are somewhat easier to simulate than universal random circuits, 100 qubits is well in the classically intractable regime.<br>\nWhat I did not talk about<br>\nLet me close this mini-series by touching on a few things that I would have liked to discuss more.<br>\nFirst, there is the OTOC experiment by the Google team (OTOC) which has spawned quite a debate. This experiment claims to achieve quantum advantage for an arguably more natural task than sampling, namely, computing expectation values. Computing expectation values is at the heart of quantum-chemistry and condensed-matter applications of quantum computers. And it has the nice property that it is what the Google team called “quantum-verifiable” (and what I would call “hopefully-in-the-future-verifiable”) in the following sense: Suppose we perform an experiment to measure a classically hard expectation value on a noisy device now, and suppose this expectation value actually carries some signal, so it is significantly far away from zero. Once we have a trustworthy quantum computer in the future, we will be able to check that the outcome of this experiment was correct and hence quantum advantage was achieved. There is a lot of interesting science to discuss about the details of this experiment and maybe I will do so in a future post.<br>\nFinally, I want to mention an interesting theory challenge that relates to the noise-scaling arguments I discussed in detail in Part 2: The challenge is to understand whether quantum advantage can be achieved in the presence of a constant amount of local noise. What do we know about this? On the one hand, log-depth random circuits with constant local noise are easy to simulate classically (SimIQP,SimRCS), and we have good numerical evidence that random circuits at very low depths are easy to simulate classically even without noise (LowDSim). So is there a depth regime in between the very low depth and the log-depth regime in which quantum advantage persists under constant local noise? Is this maybe even true in a noise regime that does not permit fault-tolerance (see this interesting talk)? In the regime in which fault-tolerance is possible, it turns out that one can construct simple fault-tolerance schemes that do not require any quantum feedback, so there are distributions that are hard to simulate classically even in the presence of constant local noise.<br>\nSo long, and thanks for all the fish!<br>\nI hope that in this mini-series I could convince you that quantum advantage has been achieved. There are some open loopholes but if you are happy with physics-level experimental evidence, then you should be convinced that the RCS experiments of the past years have demonstrated quantum advantage.<br>\nAs the devices are getting better at a rapid pace, there is a clear goal that I hope will be achieved in the 100-logical-qubit regime: demonstrate fault-tolerant and verifiable advantage (for the experimentalists) and come up with the schemes to do that (for the theorists)! Those experiments would close the loopholes of the current RCS experiments. And they would work as a stepping stone towards actual algorithms in the advantage regime.<br>\nI want to end with a huge thanks to Spiros Michalakis, John Preskill and Frederik Hahn who have patiently read and helped me improve these posts!<br>\nReferences<br>\nFault-tolerant quantum advantage<br>\n(ftIQP1) Hangleiter, D. et al. Fault-Tolerant Compiling of Classically Hard Instantaneous Quantum Polynomial Circuits on Hypercubes. PRX Quantum 6, 020338 (2025).<br>\n(LogicalExp) Bluvstein, D. et al. Logical quantum processor based on reconfigurable atom arrays. Nature 626, 58–65 (2024).<br>\nRandom circuits with symmetries<br>\n(BellSamp) Hangleiter, D. & Gullans, M. J. Bell Sampling from Quantum Circuits. Phys. Rev. Lett. 133, 020601 (2024).<br>\n(GStates) Ringbauer, M. et al. Verifiable measurement-based quantum random sampling with trapped ions. Nat Commun 16, 1–9 (2025).<br>\n(SyndFid) Xiao, X., Hangleiter, D., Bluvstein, D., Lukin, M. D. & Gullans, M. J. In-situ benchmarking of fault-tolerant quantum circuits.<br>\nI. Clifford circuits. arXiv:2601.21472<br>\nII. Circuits with a quantum advantage. (coming soon!)<br>\nVerification with planted secrets<br>\n(PoQ) Brakerski, Z., Christiano, P., Mahadev, U., Vazirani, U. & Vidick, T. A Cryptographic Test of Quantumness and Certifiable Randomness from a Single Quantum Device. in 2018 IEEE 59th Annual Symposium on Foundations of Computer Science (FOCS) 320–331 (2018).<br>\n(VerIQP1) Shepherd, D. & Bremner, M. J. Temporally unstructured quantum computation. Proceedings of the Royal Society of London A: Mathematical, Physical and Engineering Sciences 465, 1413–1439 (2009).<br>\n(VerIQP2) Bremner, M. J., Cheng, B. & Ji, Z. Instantaneous Quantum Polynomial-Time Sampling and Verifiable Quantum Advantage: Stabilizer Scheme and Classical Security. PRX Quantum 6, 020315 (2025).<br>\n(ClassIQP1) Kahanamoku-Meyer, G. D. Forging quantum data: classically defeating an IQP-based quantum test. Quantum 7, 1107 (2023).<br>\n(ClassIQP2) Gross, D. & Hangleiter, D. Secret-Extraction Attacks against Obfuscated Instantaneous Quantum Polynomial-Time Circuits. PRX Quantum 6, 020314 (2025).<br>\n(Peaks) Aaronson, S. & Zhang, Y. On verifiable quantum advantage with peaked circuit sampling. arXiv:2404.14493<br>\n(ECPeaks) Deshpande, A., Fefferman, B., Ghosh, S., Gullans, M. & Hangleiter, D. Peaked quantum advantage using error correction. arXiv:2510.05262<br>\n(HPeaks) Gharibyan, H. et al. Heuristic Quantum Advantage with Peaked Circuits. arXiv:2510.25838<br>\nCertifiable random numbers<br>\n(CertRand) Aaronson, S. & Hung, S.-H. Certified Randomness from Quantum Supremacy. in Proceedings of the 55th Annual ACM Symposium on Theory of Computing 933–944 (Association for Computing Machinery, New York, NY, USA, 2023).<br>\n(CertRandExp) Liu, M. et al. Certified randomness amplification by dynamically probing remote random quantum states. arXiv:2511.03686<br>\nOTOC<br>\n(OTOC) Abanin, D. A. et al. Observation of constructive interference at the edge of quantum ergodicity. Nature 646, 825–830 (2025).<br>\nNoisy complexity<br>\n(SimIQP) Bremner, M. J., Montanaro, A. & Shepherd, D. J. Achieving quantum supremacy with sparse and noisy commuting quantum computations. Quantum 1, 8 (2017).<br>\n(SimRCS) Aharonov, D., Gao, X., Landau, Z., Liu, Y. & Vazirani, U. A polynomial-time classical algorithm for noisy random circuit sampling. in Proceedings of the 55th Annual ACM Symposium on Theory of Computing 945–957 (2023).<br>\n(LowDSim) Napp, J. C., La Placa, R. L., Dalzell, A. M., Brandão, F. G. S. L. & Harrow, A. W. Efficient Classical Simulation of Random Shallow 2D Quantum Circuits. Phys. Rev. X 12, 021021 (2022).<\/p>","content_hash":"842c0145af14ad2f6a3364cd38cea035","author":"Dominik Hangleiter","published_at":"2026-02-28T20:01:25","fetched_at":"2026-08-08 12:39:01","word_count":4153,"read_time_minutes":21,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"22w","domain":"quantumfrontiers.com"},{"id":"2e0d545a26c4a802","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17823","title":"Quantum cartography","url":"https://quantumfrontiers.com/2026/02/11/quantum-cartography/","summary":"My husband and I visited the Library of Congress on the final day of winter break this year. In a corner, we found a facsimile of a hand-drawn map: the world as viewed by sixteenth-century Europeans. North America looked like it had been dieting, having shed landmass relative to the bulk we knew. Australia didn’t appear. Yet the map’s aesthetics hit home: yellowed parchment, handwritten letters, and symbolism abounded. Never mind street view; I began hungering for an “antique” setting on Google ","content":"<p>My husband and I visited the Library of Congress on the final day of winter break this year. In a corner, we found a facsimile of a hand-drawn map: the world as viewed by sixteenth-century Europeans. North America looked like it had been dieting, having shed landmass relative to the bulk we knew. Australia didn’t appear. Yet the map’s aesthetics hit home: yellowed parchment, handwritten letters, and symbolism abounded. Never mind street view; I began hungering for an “antique” setting on Google maps.<br>\nApproximately four weeks after that trip, I participated in the release of another map: the publication of the review “Roadmap on quantum thermodynamics” in the journal Quantum Science and Technology. The paper contains 24 chapters, each (apart from the introduction) profiling one opportunity within the field of quantum thermodynamics. My erstwhile postdoc Aleks Lasek and I wrote the chapter about the thermodynamics of incompatible conserved quantities, as Quantum Frontiers fans1 might guess from earlier blog posts.<br>\nAllow me to confess an ignoble truth: upon agreeing to coauthor the roadmap, I doubted whether it would impact the community enough to merit my time. Colleagues had published the book Thermodynamics in the Quantum Regime seven years earlier. Different authors had contributed different chapters, each about one topic on the rise. Did my community need such a similar review so soon after the book’s publication? If I printed a map of a city the last time I visited, should I print another map this time?<br>\nApparently so. I often tout the swiftness with which quantum thermodynamics is developing, yet not even I predicted the appetite for the roadmap. Approximately thirty papers cited the arXiv version of the paper during the first nine months of its life—before the journal publication. I shouldn’t have likened the book and roadmap to maps of a city; I should have likened them to maps of a terra incognita undergoing exploration. Such maps change constantly, let alone over seven years.<br>\nTwo trends unite many of the roadmap’s chapters, like a mountain range and a river. First, several chapters focus on experiments. Theorists founded quantum thermodynamics and dominated the field for decades, but experimentalists are turning the tables. Even theory-heavy chapters, like Aleks’s and mine, mention past experiments and experimental opportunities.<br>\nSecond, several chapters blend quantum thermodynamics with many-body physics. Many-body physicists share interests with quantum thermodynamicists: thermalization and equilibrium, the absence thereof, and temperature. Yet many-body physicists belong to another tribe. They tend to interact with each other differently than quantum thermodynamicists do, write papers differently, adhere to different standards, and deploy different mathematical toolkits. Many-body-physicists use random-matrix theory, mean field theory, Wick transformations, and the like. Quantum thermodynamicists tend to cultivate and apply quantum information theory. Yet the boundary between the communities has blurred, and many scientists (including yours truly) shuttle between the two.<br>\nWhen Quantum Science and Technology published the roadmap, lead editor Steve Campbell announced the event to us coauthors. He’d wrangled the 69 of us into agreeing to contribute, choosing topics, drafting chapters, adhering to limitations on word counts and citations, responding to referee reports, and editing. An idiom refers to the herding of cats, but it would gain in poignancy by referring to the herding of academics. Little wonder Steve wrote in his email, “I’ll leave it to someone else to pick up the mantle and organise Roadmap #2.” I look forward to seeing that roadmap—and, perhaps, contributing to it. Who wants to pencil in Australia with me?<br>\n1Hi, Mom and Dad.<\/p>","content_hash":"1baca7438c6e4bd1438f9a0a1de4e1d6","author":"Nicole Yunger Halpern","published_at":"2026-02-12T00:46:52","fetched_at":"2026-08-08 12:39:01","word_count":581,"read_time_minutes":3,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"25w","domain":"quantumfrontiers.com"},{"id":"00e76eede1b889de","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2026/01/22/powerful-new-developer-tools-increase-the-versatility-of-the-microsoft-quantum-platform/","title":"Powerful new developer tools increase the versatility of the Microsoft Quantum platform","url":"https://azure.microsoft.com/en-us/blog/quantum/2026/01/22/powerful-new-developer-tools-increase-the-versatility-of-the-microsoft-quantum-platform/","summary":"The field of quantum computing has advanced beyond the level of error-prone physical qubits to an era of reliable quantum computation with logical qubits. To continue making progress toward fault-tolerant quantum machines, advances in both quantum hardware and software are required. Microsoft is committed to providing the tools that developers and scientists need to enable applications on the quantum machines that exist today, as well as the fault-tolerant machines of the future. New tools that ","content":"<p>The field of quantum computing has advanced beyond the level of error-prone physical qubits to an era of reliable quantum computation with logical qubits. To continue making progress toward fault-tolerant quantum machines, advances in both quantum hardware and software are required. Microsoft is committed to providing the tools that developers and scientists need to enable applications on the quantum machines that exist today, as well as the fault-tolerant machines of the future.<br>\nNew tools that simplify quantum development<br>\nThe Microsoft Quantum Development Kit (QDK) is an open-source developer toolkit for building quantum applications. It provides everything needed—from simulators to a modern programming experience—for developers to build and execute quantum code, both locally and on quantum hardware. The QDK is integrated with VS Code and GitHub Copilot to help you write, test, and execute quantum code. Microsoft’s QDK installs and runs on laptops, and GitHub Copilot makes it quick and easy to get started.<br>\nDomain libraries and workflows available with Microsoft’s QDK include those for error correction and chemistry, with other applications on the horizon. The included tools reduce the effort and expertise needed for researchers to design, test, and implement quantum chemistry applications or the error correction codes needed to create logical qubits. Both these tools and the QDK are open source and interoperable with the most popular quantum programming languages and frameworks, including Q#, OpenQASM, Qiskit, and Cirq. The quantum chemistry toolkit supports WSL and Docker support for reproducibility and portability across systems.<br>\nAI-enabled quantum programming<br>\nMicrosoft’s QDK is fully integrated with VS Code and GitHub Copilot. After installing the QDK extension from the VS Code Marketplace, GitHub Copilot simplifies the use of QDK features in VS Code, including Python and Jupyter integration, circuit rendering, IntelliSense, breakpoint debugging, local simulators, visualizations, histograms, hardware submission, and resource estimation. With GitHub Copilot and the QDK, programming tasks such as code generation, unit tests, and job submissions are faster and easier than ever before.<br>\nQDK for scientific applications<br>\nFor today’s quantum computers to help solve complex scientific problems, those problems must first be simplified and optimized to fit within hardware constraints. Microsoft’s QDK for chemistry provides the advanced tools that developers and quantum researchers need to transform complex challenges into problems that today’s quantum computers can tackle efficiently. This toolkit is designed by chemists to make quantum development for chemistry applications more accessible.<br>\nWe are very excited about the launch of Microsoft’s QDK for chemistry. We believe the modular design of the platform will be a true game changer for quantum chemistry, enabling scalability, flexibility, and widespread adoption across the community.<br>\nAt Algorithmiq, our long-standing experience in building a computational chemistry platform allows us to fully appreciate the level of sophistication that Microsoft’s QDK brings to integrating complex tools and workflows, like ours.<br>\nWe’ve been delighted to have played a small part in shaping this launch and look forward to seeing the impact it will have on the field.<br>\n—Guillermo García-Pérez, Chief Scientific Officer and Co-founder, Algorithmiq<br>\nTurning complex quantum chemistry problems into actionable results requires more than advanced quantum algorithms. It requires the seamless integration of classical data preparation, circuit optimization, and post processing of quantum data. Microsoft’s QDK for chemistry delivers a holistic, end-to-end solution for quantum chemistry, combining best-in-class classical chemistry methods with state-of-the-art algorithms designed for near-term quantum hardware. Efficient classical preprocessing methods reduce problem size while preserving essential chemical accuracy, and chemistry-aware quantum algorithms dramatically reduce circuit depth—shrinking gate counts from thousands to single digits for certain problems.<br>\nWe aim to empower quantum development, with the tools and environments researchers already use—such as VS Code and Python—enhanced with built-in visualization, circuit introspection, and AI-assisted coding capabilities.<br>\nQDK for chemistry provides a unified, intuitive interface for molecular modeling and electronic structure preparation, supporting a broad range of quantum chemistry methods and software packages. Automated workflows with built-in pipelines for Hamiltonian generation and active space selection help researchers move efficiently from problem definition to quantum execution.<br>\nNative VS Code extensions enable real-time molecular and circuit visualization, making it easier to iterate, debug, and refine quantum applications. With support for visualizing molecules and molecular orbitals, rendering quantum circuits with deep-circuit compression, and running workloads on both QDK simulators and quantum hardware, the QDK for chemistry streamlines the entire quantum chemistry development workflow—from classical preparation to quantum simulation, execution, and postprocessing.<br>\nTo ensure continued alignment with rapidly evolving quantum algorithms, Microsoft’s QDK for chemistry is built with adaptability and extensibility in mind. It features plug-and-play integration that supports simulations with any chemistry code, quantum language, or algorithmic package, minimizing configuration overhead. As a result, it will continue to make challenging problems tractable and accelerate time to insight as it scales seamlessly toward the next generation of quantum computing.<br>\nQDK for error correction<br>\nMicrosoft has a longstanding heritage of building tools to further our own quantum error correction research and development. QDK for error correction makes these tools available for the broader quantum community. The tools needed for typical quantum error correction research and development workflows will now be included in Microsoft’s QDK. These include open-source modules for characterizing, validating, and debugging encoded quantum programs, customizable encoding and decoding strategies that align with target runtimes, and customizable notebook samples for common use cases. Tooling packages will be released over time with full availability expected later in 2026.<br>\nThe QDK is part of our highly adaptable platform<br>\nThe QDK is included as part of the Microsoft Quantum platform, which brings together quantum hardware, software, AI, and high-performance computing to create an end-to-end solution powered by Azure. By correcting the errors in high-quality physical qubits, our platform enables the reliable computation needed to realize groundbreaking use cases of quantum computing. Now, with new tools provided through Microsoft’s QDK and supported by GitHub Copilot, the platform enables quantum development, chemistry, and error correction, making it even more versatile.<br>\nThe Microsoft Quantum platform combines our advanced qubit-virtualization system with quantum processing units (QPUs) from industry-leading hardware providers to create logical qubits. It includes an innovative quantum operating system to help customers manage, control, and monitor the quantum device while integrating with Azure. The platform also includes a quantum engine that orchestrates quantum hardware and error correction.<br>\nThe Microsoft Quantum platform is being designed to be highly versatile and integrable with multiple types of quantum hardware. By applying our platform to Atom Computing’s neutral-atom qubits, we are co-designing Magne, the world’s most powerful quantum computer. Defining features of Magne will be revealed by QuNorth, a Nordic quantum initiative, at the Discover Magne event on January 26, 2026 in Copenhagen, Denmark.<br>\nMicrosoft will help provide the necessary skilling to ensure that Nordic developers can unlock the full potential of Magne once deployed. This training is being developed in partnership with qBraid and a cohort of academic and industry partners across the Nordics. The training materials, which are tailored to application engineers and error correction researchers, will help grow regional expertise in reliable quantum computing, and position the Nordic quantum ecosystem to set new benchmarks for innovation.<br>\nGet started with Microsoft’s QDK today<br>\n- Download Microsoft’s QDK and QDK for chemistry<br>\n- Read the technical paper on Microsoft’s QDK for chemistry<br>\n- Explore the VS Code Marketplace<br>\n- Learn more about Microsoft’s QDK<\/p>","content_hash":"97b474e3a31f6cbff252701dfbf0d7e2","author":"Matthias Troyer","published_at":"2026-01-22T16:00:00","fetched_at":"2026-08-08 12:39:21","word_count":1204,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"28w","domain":"azure.microsoft.com"},{"id":"9ce0e464f94a90fc","feed_id":"microsoft-quantum","guid":"https://www.microsoft.com/en-us/security/blog/2025/08/20/quantum-safe-security-progress-towards-next-generation-cryptography/","title":"Quantum-safe security: Progress towards next-generation cryptography","url":"https://www.microsoft.com/en-us/security/blog/2025/08/20/quantum-safe-security-progress-towards-next-generation-cryptography/","summary":"Quantum computing promises transformative advancements, yet it also poses a very real risk to today’s cryptographic security. In the future scalable quantum computing could break public-key cryptography methods currently in use and undermine digital signatures, resulting in compromised authentication systems and identity verification. Starting your journey to become quantum-safe Read the blog › While scalable quantum computing is not available today, the time to prepare is now. Microsoft is prep","content":"<p>Quantum computing promises transformative advancements, yet it also poses a very real risk to today’s cryptographic security. In the future scalable quantum computing could break public-key cryptography methods currently in use and undermine digital signatures, resulting in compromised authentication systems and identity verification.<br>\nStarting your journey to become quantum-safe<br>\nWhile scalable quantum computing is not available today, the time to prepare is now. Microsoft is preparing to be quantum-safe and partnering with regulatory and technical bodies like the National Institute of Standards and Technology (NIST), Internet Engineering Task Force (IETF), International Organization for Standardization (ISO), Distributed Management Task Force (DMTF), Open Compute Project (OCP), and European Telecommunications Standards Institute (ETSI) to align on quantum-safe encryption standards and support worldwide interoperability.<br>\nThe opportunity and challenge ahead<br>\nMigration to post quantum cryptography (PQC) is not a flip-the-switch moment, it’s a multiyear transformation that requires immediate planning and coordinated execution to avoid a last-minute scramble.<br>\nIt is also an opportunity for every organization to address legacy technology and practices and implement improved cryptographic standards. By acting now, organizations can upgrade to modern cryptographical architectures that are inherently quantum safe, upgrade existing systems with the latest standards in cryptography, and embrace crypto-agility (the ability to easily change algorithms) to modernize their cryptographic standards and practices and prepare for scalable quantum computing.<br>\nThe investment in a quantum future<br>\nAt Microsoft, we have been investing in this shift by developing both the advances in quantum computing, such as the Majorana 1 quantum processor and 4D geometric error correction codes, and the requirements for PQC.<br>\nOur PQC effort began in 2014 when we published research on post-quantum algorithms and later quantum cryptanalysis to more rigorously determine when contemporary algorithms will be broken. To contribute to PQC algorithm development we participated in four submissions to the original 2017 NIST PQC call and one submission to the current call. Since 2018 we have been experimenting with verified versions of PQC algorithms and in 2019 Microsoft Research completed testing of an experimental PQC-protected VPN tunnel between Redmond, Washington, and Scotland using the Project Natick underwater datacenter.<br>\nTo support standards development and foster the integration of post-quantum cryptographic algorithms into internet protocols, Microsoft joined as a founding member of the Open Quantum Safe project. Additionally, we led the integration workstream of the NIST NCCoE Post-Quantum project. Microsoft Research was contributing to updating the ISO cryptography standard to include PQC, with our FrodoKEM cryptosystem, developed in collaboration with academic and industry partners, poised to become an ISO standard algorithm.<br>\nIn 2024, we announced and contributed Adams Bridge Accelerator, an open-source quantum resilient cryptographic hardware accelerator and integrated into Caliptra 2.0, part of Open Compute Project (OCP).<br>\nFinally, to help customers and partners begin exploration and integration of quantum-safe algorithms into their environments we previewed PQC capabilities for Windows Insiders and Linux and updated SymCrypt to support verified PQC algorithms. This will help them proactively prepare their software and services for PQC support.<br>\nCreating a Quantum Safe Program<br>\nIn 2023, Charlie Bell, Executive Vice President for Microsoft Security, outlined Microsoft’s vision to build a quantum-safe future, which led to the creation of the Microsoft Quantum Safe Program (QSP). This program unifies and accelerates Microsoft’s efforts to protect our infrastructure, as well as that of our customers, partners, and ecosystems, from the evolving risk of quantum computing.<br>\nThe following timelines shows a consolidated view of where we are today, and what to expect in the near future as we progress this important program as an industry.<br>\nThe Microsoft QSP is aligned with United States government requirements and timelines for quantum safety, including the US Office of Management and Budget (OMB), the Cybersecurity and Infrastructure Security Agency (CISA), NIST, and the National Security Agency’s guidance for organizations to start preparing and transitioning for PQC enablement. We also closely monitor quantum-safe initiatives from international governments, including the European Union, Japan, Canada, Australia, and the United Kingdom, to align with their efforts.<br>\nYou can learn more about our collaboration with standards bodies and recommendations for effective government policies to accelerate the quantum-safe transition in the Microsoft On the Issues blog by Amy Hogan Burney, Vice President, Customer Security and Trust.<br>\nThe Microsoft QSP strategy<br>\nOur QSP is a comprehensive and company-wide effort to enable Microsoft, our customers, and partners, to transition smoothly and securely into the quantum era. The program is governed by the QSP leadership team with representatives across all major business groups, research and engineering divisions, and functions.<br>\nThe QSP strategy is guided by three priorities:<br>\n- Make Microsoft quantum safe by updating Microsoft first- and third-party services, supply chain, and ecosystem to become quantum safe and crypto-agile.<br>\n- Support customers, partners, and ecosystems to become quantum safe with appropriate tools and guidance.<br>\n- Promote global research, standards, and solutions for quantum-safe technologies and crypto-agility.<br>\nOur quantum-safe journey began with an enterprise-wide inventory to assess and prioritize cryptographic asset risks. From there, we partnered with industry leaders to address critical dependencies, investing in quantum safe research and collaborating on hardware and firmware innovation. We accelerated the adoption of quantum-resilient algorithms across core infrastructure, supported by Microsoft’s open-source silicon initiatives.<br>\nAs a result of this foundational work, we are aligned with global government timelines, striving to meet even the most forward-leaning CNSA 2.0 deadlines outlined in CNSSP-15. Combining the different regulations’ aspects and timelines worldwide, Microsoft’s roadmap aims to complete transition of its services and products by 2033—two years before the 2035 deadline set by most governments—aiming to enable early adoption of quantum-safe capabilities by 2029, gradually making them default in subsequent years, or sooner where possible.<br>\nTo maintain resilience of Microsoft’s services and systems against quantum computers powerful enough to break modern cryptographic algorithms, we’ve developed a phased transition strategy built on a modular framework. This approach considers each service unique requirements, performance constraints, and risk profile, resulting in either a direct shift to full PQC or a hybrid approach combining classical and quantum-resistant algorithms as an interim step. Therefore, as early adoption will begin by 2029, core services will reach maturity a few years before then.<br>\nHere are the three key phases for this strategy:<br>\n1. Foundational security components<br>\nMicrosoft has integrated PQC algorithms into foundational components like SymCrypt, the primary cryptographic library that provides consistent cryptographic security across Windows, Microsoft Azure, Microsoft 365 and other platforms. SymCrypt supports both symmetric (for example, AES [Advanced Encryption Standard]) and asymmetric algorithms (for example, RSA [Rivest–Shamir–Adleman], ECDSA [Elliptic Curve Digital Signature Algorithm]), providing essential cryptographic operations such as encryption, decryption, signing, verification, hashing, and key exchange. Most recently we’ve made ML-KEM (Module-Lattice Key Encapsulation Mechanism) and ML-DSA (Module-Lattice Digital Signature Algorithm) available through Cryptography API: Next Generation (CNG) and Certificate and Cryptographic messaging functions. These capabilities are available to Windows Insiders and Linux customers now, with additional foundational capabilities coming through the next five years, always aligning and timebound to evolving industry standards and advancements.<br>\nAs quantum computing advances, the threat of Harvest Now, Decrypt Later (HNDL) cyberattacks become increasingly pressing—where threat actors record and store encrypted data today with the intention of decrypting it once quantum capabilities mature. To counter this risk, security protocol standards are prioritizing quantum-safe key exchange mechanisms. For instance, TLS 1.3 is being enhanced to support both hybrid and pure post-quantum key exchange methods, making it a robust adaptable foundation for integrating PQC algorithms. With version 1.9.0 of SymCrypt-OpenSSL, we’ve enabled TLS hybrid key exchange as per the latest IETF internet draft, providing an early opportunity to help prepare for HNDL threats. This capability will be coming to Windows TLS stack soon.<br>\n2. Core infrastructure services<br>\nUpdating foundational components in products and services, considered core infrastructure service, to provide quantum safety for Microsoft and our customers from future quantum risks. Examples include Microsoft Entra authentication, key and secret management, and signing services. By prioritizing these services, Microsoft will protect the most sensitive and essential components first, providing a strong foundation for the broader transition.<br>\n3. All services and endpoints<br>\nIntegrating PQC into Windows, Azure services, Microsoft 365, data platforms, AI services, and networking enables the broader ecosystem of Microsoft services to be quantum safe, providing comprehensive protection across all platforms and applications.<br>\nWhat’s next<br>\nIn our previous blog, Starting your journey to become quantum safe, we provided some practical recommendations and services for customers to start their quantum-safe journey. In future updates, we will continue to provide insights and guidance, grounded in practical experience as we take these critical steps on a most important journey.<br>\nTransitioning to a quantum-safe environment is a complex but essential process and we encourage our customers and partners to start developing their strategy now.<br>\nTo learn more about Microsoft Security solutions, visit our website. Bookmark the Security blog to keep up with our expert coverage on security matters. Also, follow us on LinkedIn (Microsoft Security) and X (@MSFTSecurity) for the latest news and updates on cybersecurity.<\/p>","content_hash":"d1770d848210544227f3a95decc97fcd","author":"Mark Russinovich and Michal Braverman-Blumenstyk","published_at":"2025-08-20T16:00:00","fetched_at":"2026-08-08 12:39:21","word_count":1480,"read_time_minutes":8,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"50w","domain":"microsoft.com"},{"id":"6b17bba369386971","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14359","title":"Microsoft advances quantum error correction with a family of novel four-dimensional codes","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/06/19/microsoft-advances-quantum-error-correction-with-a-family-of-novel-four-dimensional-codes/","summary":"Microsoft Quantum is continuing to advance the global quantum ecosystem by adding cutting-edge features to its compute platform. By developing powerful error-correction codes that are applicable to many types of qubits, we are advancing the field of quantum computing while putting it within reach of experts and nonexperts alike. Microsoft’s novel four-dimensional geometric codes require very few physical qubits per logical qubit, can check for errors in a single shot, and exhibit a 1,000-fold re","content":"<p>Microsoft Quantum is continuing to advance the global quantum ecosystem by adding cutting-edge features to its compute platform. By developing powerful error-correction codes that are applicable to many types of qubits, we are advancing the field of quantum computing while putting it within reach of experts and nonexperts alike. Microsoft’s novel four-dimensional geometric codes require very few physical qubits per logical qubit, can check for errors in a single shot, and exhibit a 1,000-fold reduction in error rates.<br>\nAddressing the need for fault-tolerant quantum computers<br>\nMost of today’s quantum computers operate with qubits that are prone to errors and thus are not capable of reliable computation on their own. To realize the promise of complex problem-solving abilities in quantum computers, there are two prerequisites:<br>\n- Use physical qubits with high fidelities.<br>\n- Apply error-correction codes that can create reliable, logical qubits with error rates that are substantially lower than those of the corresponding physical qubits.<br>\nAs demonstrated through our collaborations with multiple hardware partners, Microsoft has state-of-the-art capabilities in error correction. Our qubit-virtualization system, which is a core component of the Microsoft Quantum compute platform, enables the creation and entanglement of reliable logical qubits from high-quality physical qubits.<br>\nPreviously, we created and entangled 24 reliable logical qubits by applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral atoms. In that study, we demonstrated our ability to detect and correct errors—and correct for losses of qubits—during computation, thus enabling reliable and highly accurate quantum computation. The teams also created 28 logical qubits with the ability to detect and correct errors while performing reliable computation.<br>\nBy detecting and correcting errors during computation, the Microsoft Quantum compute platform creates logical qubits from high-quality physical qubits to enable reliable quantum computation.<br>\nMicrosoft’s new four-dimensional (4D) geometric codes<br>\nEven high-quality physical qubits require error correction to create and entangle the logical qubits that enable reliable quantum computation. To that end, Microsoft has developed a family of novel 4D geometric codes, which are available in the Microsoft Quantum compute platform and are suitable for qubits with all-to-all connectivity such as neutral atoms, ion traps, and photonics. These powerful codes can reduce the error rates of physical qubits by orders of magnitude to reach the level required for quantum circuits to operate reliably.<br>\nMicrosoft’s new 4D geometric codes:<br>\n- Require very few physical qubits to make each logical qubit: Rotating the codes in four dimensions achieves a fivefold reduction in the number of physical qubits required to make logical qubits.<br>\n- Have efficient logical operations: The codes exhibit high performance and have the single-shot property that enables them to correct errors quickly.<br>\n- Improve the performance of quantum hardware: A 1,000-fold reduction in error rate can be achieved by lowering the physical error rate from 10-3 (one per thousand) to a logical error rate of approximately 10-6 (one per million).<br>\nWith these features, this family of novel codes provides several benefits. The codes reduce the number of steps required to diagnose errors, resulting in low-depth operations and computations. Additionally, these codes reduce the number of physical qubits needed to achieve fault-tolerant quantum computing, accelerating the path to utility scale.<br>\nThis family of codes is one of many that is available for inclusion in the Microsoft Quantum compute platform. It comes with a complete set of efficient operations that makes compilation of any quantum algorithm possible. Incorporation of these codes into our full-stack will enable the creation and entanglement of 50 logical qubits in the near term, with the potential to scale to thousands of logical qubits in the future.<br>\nThe Microsoft Quantum advantage<br>\nAt Microsoft, we are bringing the capabilities for quantum advantage forward by coupling state-of-the-art quantum hardware with the Microsoft Quantum compute platform, which includes error correction, cloud high-performance computing, and advanced AI models. And now, these capabilities can be paired with Microsoft Discovery—our platform designed to accelerate scientific progress.<br>\nIn addition to the strength of the co-optimized hardware and software, Microsoft’s team of experts is available to provide insight and technical expertise on use cases, industry challenges, and opportunities for innovation and collaborative research projects. This allows customers to explore quantum applications, generate new datasets with reliable quantum computing, improve the performance or accuracy of AI models, and provide regional skilling and education in quantum computing.<br>\nMicrosoft and Atom Computing<br>\nTogether, Microsoft and Atom Computing have co-designed a pairing of neutral-atom qubits with the Microsoft Quantum compute platform. Atom Computing’s neutral-atom qubits have several advantages over some other qubit technologies, including their ability to be tightly packed in arrays due to their lack of charge, which offers extensive scalability. Additionally, they can be moved around to allow interactions with other atoms, they have low susceptibility to noise, and they have the high fidelities needed for quantum error correction to work.<br>\nSince our last announcement on our collaboration with Atom Computing, the company has demonstrated improved mid-circuit measurement with qubit reset and reuse on their hardware. This technique—which allows for the measurement of a subset of qubits while preserving both measured and unmeasured qubits—improves error correction, increases the complexity of quantum computations that can be performed, and paves the way for fault-tolerant quantum computing. Additionally, the two-qubit gate fidelity of Atom Computing’s neutral atoms is 99.6%, which remains the highest fidelity of neutral-atom qubits in a commercial system.<br>\nThe high fidelities, all-to-all connectivity, and long coherence times available with Atom Computing’s neutral-atom qubits make them well suited for the creation of logical qubits with the Microsoft Quantum compute platform.<br>\nTogether, Microsoft and Atom Computing apply state-of-the-art error correction to high-quality physical qubits to enable reliable quantum computation.<br>\nReliable quantum computing is here<br>\nWe are in the early stages of reliable quantum computing, and the impact that this technology will have is just beginning to be realized. Practical applications will start to be revealed as researchers in various industries adopt a co-design approach to explore interactions between quantum architectures, algorithms, and applications.<br>\nThe most groundbreaking use cases of quantum computing are likely to be achieved when quantum is used to improve and accelerate other technologies, such as high-performance computing and AI. By providing customers with the tools they need to learn quantum computing, develop algorithms, and design quantum applications, Microsoft is enabling customers to maximize the potential benefits of enhancing other technologies with quantum.<br>\nLearn more about quantum<br>\n- Explore the Microsoft Quantum compute platform.<br>\n- Read the theory-based paper on the family of novel 4D error-correction codes.<br>\n- Read the paper on the quantum error correction achieved by incorporating Atom Computing’s QPUs into the Microsoft Quantum compute platform.<\/p>","content_hash":"fd54504b8b56050668d3db61cbcfc3a7","author":"Krysta Svore","published_at":"2025-06-19T20:00:00","fetched_at":"2026-08-08 12:39:31","word_count":1092,"read_time_minutes":6,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"59w","domain":"azure.microsoft.com"},{"id":"fda519d43db4a205","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14344","title":"Transforming R&D with agentic AI: Introducing Microsoft Discovery","url":"https://azure.microsoft.com/en-us/blog/transforming-rd-with-agentic-ai-introducing-microsoft-discovery/","summary":"We are announcing a new enterprise agentic platform called Microsoft Discovery to accelerate research and development (R&amp;D) at Microsoft Build 2025.Our goal is to bring the power of AI to scientists and engineers to transform the entire discovery process—from advanced knowledge reasoning and hypothesis formulation to experimental simulation and iterative learning. Microsoft Discovery enables researchers to collaborate with a team of specialized AI agents combined with a graph-based knowledge","content":"<p>We are announcing a new enterprise agentic platform called Microsoft Discovery to accelerate research and development (R&D) at Microsoft Build 2025.<br>\nOur goal is to bring the power of AI to scientists and engineers to transform the entire discovery process—from advanced knowledge reasoning and hypothesis formulation to experimental simulation and iterative learning. Microsoft Discovery enables researchers to collaborate with a team of specialized AI agents combined with a graph-based knowledge engine, to drive scientific outcomes with speed, scale, and accuracy.<br>\nWe have architected Microsoft Discovery to be highly extensible, enabling researchers to integrate the latest Microsoft innovations with their own models, tools, and datasets as well as a wide range of partner and open-source solutions. Built on top of Microsoft Azure, trust, compliance, transparency, and governance are key design principles of this enterprise-ready platform to enable responsible innovation, keeping the researcher in control.<br>\nAt Microsoft, our researchers have leveraged the advanced AI models and high-performance computing (HPC) simulation tools in Microsoft Discovery to discover a novel coolant prototype with promising properties for immersion cooling in datacenters in about 200 hours—a process that otherwise would have taken months, if not years. This rapid discovery lays the groundwork for future developments in safer and sustainable solutions across multiple industries and is a demonstration of how Microsoft Discovery can potentially transform R&D in any company.<br>\nWe are working with a notable set of Microsoft customers who are interested in co-innovating in diverse industries including chemistry and materials, silicon design, energy, manufacturing, and pharma. We are also working with a broad partner base that is building on top of the platform to drive this acceleration, and we couldn’t be more excited. The possibilities are endless as we realize the full potential of AI in R&D and we are just getting started!<br>\nThe agentic vision for science<br>\nAt Microsoft, we want to amplify the ingenuity of scientists to usher in a new era of accelerating discovery and expand the horizons of research. Doing so requires empowering R&D teams with transformative technologies that can drive meaningful business impact. However, R&D has very specific challenges compared to other domains:<br>\n- Scientific knowledge is vast, nuanced, and distributed.<br>\n- The discovery process is diverse and dynamic, involving multiple highly specialized methods and tasks, making it very hard to connect the dots across the different domains involved.<br>\n- R&D is iterative. There are rarely simple, clear-cut answers. Instead, scientific knowledge evolves through evidence, discourse, and refinement.<br>\nThis complexity demands a new paradigm—one that isn’t aimed at doing the same experiments faster, but rather fundamentally changing the paradigm of how we approach R&D.<br>\nImagine if every researcher could collaborate with a tireless team of intelligent, synergistic AI agents with the sole purpose of accelerated innovation. This is our vision for a new agentic R&D paradigm, embedding AI in every stage of the scientific method.<br>\nIn this new world, people and specialized AI agents will cooperatively refine knowledge and experimentation in real time in a continuous, iterative cycle of discovery—all while maintaining the control, transparency, and trust that enterprises and governmental institutions require. This requires a comprehensive platform where AI can capture both the scientific domain and the cognitive processes involved in managing scientific thought. To realize this vision, scientific AI agents must be able to:<br>\n- Reason over a complex and contextual graph connecting all knowledge sources.<br>\n- Specialize across distinct domains and tasks.<br>\n- Learn from results and adapt entire research plans accordingly.<br>\nIntroducing Microsoft Discovery<br>\nWe are taking a big step toward realizing this vision with Microsoft Discovery, bringing agentic R&D to life by leveraging the latest innovations from Microsoft and the broader scientific ecosystem.<br>\nGraph-based scientific co-reasoning <br>\nThe advent of large language models (LLMs) hinted at this new era, offering capabilities to speed up certain scientific tasks, particularly for information retrieval and hypothesis generation. However, LLMs often lack the contextual understanding required to deeply reason over distributed, nuanced, and often contradictory scientific data.<br>\nMicrosoft Discovery<br>\nGet started today by using Azure HPC and Azure AI Foundry infrastructure.<br>\nMicrosoft Discovery is built on top of a powerful graph-based knowledge engine. Instead of merely retrieving facts, this engine builds graphs of nuanced relationships between proprietary data as well as external scientific research. This allows the platform to have a deep understanding of conflicting theories, diverse experimental results, and even underlying assumptions across disciplines.<br>\nThis contextual reasoning is also transparent. Rather than outputting monolithic answers, it keeps the expert in the loop with detailed source tracking and reasoning, providing the level of transparency in AI systems that builds trust, ensures accountability, and allows experts to validate and understand every step or make any adjustments as needed.<br>\nSpecialized discovery agents for conducting research<br>\nInstead of siloed and static pipelines, Microsoft Discovery implements a continuous and iterative R&D cycle where researchers can guide and orchestrate a team of specialized AI agents that learn and adapt over time—not just for reasoning, but for conducting research itself. The definition of these specialized agents captures both domain knowledge and process logic, simply through natural language.<br>\nR&D teams will be able to build a custom AI team aligned to their specific processes and knowledge, easily encoding these agents with their expertise and methodologies to ensure they can adapt and orchestrate as research progresses. This approach is far more flexible than hard-coding behaviors of today’s digital simulation tools, which often are highly specialized and lack streamlined integration with others, and it means that research teams no longer require computational expertise to drive impact. As an example, users can access and define various agents’ specialties, such as ‘molecular properties simulation specialist’ or ‘literature review specialist.’ They can even suggest which tools or models the agents should use or create, and how they should collaborate with others.<br>\nThis organic, bidirectional collaboration is a game-changer for managing R&D: agents are not only capable of working for the researchers, but with them in a manner that can truly amplify human ingenuity—seeing both the forest and the trees at once.<br>\nAt the center of this collaboration is Microsoft Copilot, acting as a scientific AI assistant that orchestrates these specialized agents based on the researcher’s prompts. Copilot is aware of all the tools, models, and knowledge bases in a customer’s catalog on the platform, can identify which agents to leverage, and can set up end-to-end workflows that cover the full discovery process by combining advanced AI and HPC simulations through the joint work of these agents.<br>\nExtensible and enterprise-ready<br>\nMicrosoft Discovery is built on top of Azure infrastructure and services, leveraging by design the trust, compliance, and governance controls at the core of Microsoft’s secure cloud foundation.<br>\nWe believe in the power of an open ecosystem that leverages the strengths of Microsoft’s latest advancements in combination with other innovative solutions from customers and partners. Microsoft Discovery allows R&D teams to extend the platform’s catalog by bringing their toolkit of choice to cover their specific research needs in a comprehensive scientific bookshelf. This extensibility at the core of Microsoft Discovery simplifies the onboarding of their choice of computational tools, models, and knowledge bases—whether they are custom developments, open-source, or commercial solutions. As we bring to market new capabilities in reliable quantum computing and embodied AI, the platform will remain future-proofed with the best technologies available at Microsoft and across the industry.<br>\nReal impact: Discovering a novel, non-PFAS coolant prototype<br>\nOver the past months, we have made significant strides aiding computational scientists in their research and incorporating cutting-edge innovations from Microsoft Research. This has led to remarkable breakthroughs, such as discovering a novel solid-state electrolyte candidate that uses 70% less lithium in collaboration with the Department of Energy’s Pacific Northwest National Laboratory (PNNL) and enabling rapid computational simulations that accelerate scientific discoveries at Unilever. Microsoft Discovery is designed to bring these innovations to every scientist—not only those with deep computational expertise.<br>\nOne of the more exciting early use cases of Microsoft Discovery is unfolding at the Pacific Northwest National Laboratory, where scientists are using Microsoft Discovery’s advanced generative AI and HPC capabilities to further develop machine learning models that predict and optimize complex chemical separations—a critical process in nuclear science. These separations are essential for effectively isolating radioactive elements after the nuclear fission process, a notoriously time-sensitive and incredibly chemically complex task. In the future, the team aims to use these advancements to reduce the time scientists must spend in hazardous radioactive environments, while improving yields and purity, enhancing both safety and efficiency.<br>\n—Scott Godwin, Director, Center for Cloud Computing, Pacific Northwest National Laboratory<br>\nBy leveraging advanced AI models and HPC tools for simulation that will be available on Microsoft Discovery, Microsoft researchers discovered a novel, non-PFAS, immersion datacenter coolant prototype in about 200 hours.1 Current coolants often take many years to develop and can contain harmful PFAS-based chemicals that make them unviable to use, as there’s a global push to ban these “forever chemicals” in favor of more environmentally friendly options in this industry and many others.<br>\nAfter the digital discovery process, we successfully synthesized this coolant prototype in under four months, and it’s currently under further analysis and refinement. We have already tested some of the primary properties of this material and they align to the AI predictions, which is a testament to the accuracy of the predictive models used. While this project is only an experiment, it lays the groundwork for future developments and improvements in coolant technology and demonstrates how the combination of HPC and specialized AI models can accelerate and transform R&D processes.<br>\nAccording to Daniel Pope, founder of Submer, a company whose mission is to build
