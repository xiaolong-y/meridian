ave to we built quantum computers out of a variety of things and but we’ve never figured out how to build a lot of quantum bits onto a platform. In fact, in all of human history, we’ve never figured out how to make lots of anything on the computational side, except for transistors in silicon. So like the things that give you iPhones and laptops and the best supercomputers and GPUs, that is built on a semiconductor manufacturing process that only exists. We’ve only ever invented it once in all of human history. And so what we do is we actually build the underlying substrate beneath the helium out of that semiconductor material, the same way that chip builders build iPhone chips and Intel builds their quantum computers, their quantum chips, except we then combine it with this pristine helium surface with electron qubits trapped above. And I have, you know, you asked about show and tell earlier, I have one of our chips here. In the very center of this board is something about, you know, three by five millimeter chip and that can house, you know, thousands or tens of thousands of electrons. And being able to make it tiny like that is really important. You want to jam as many qubits onto a single monolithic chip as possible. And that is sort of our philosophy. You gotta get quality and quantity in as small a footprint as possible.<br>\nIs that thing behind you using helium-3?<br>\nMark Fielding: Right. I want to lead up to that. I want to know how many qubits you can put on that and how many there are. First of all, just another helium question because at Thinking on Paper, we connect all technologies with tech, agnostic, we speak about all things. Not so long ago, we had a former NASA scientist who wants to go to the moon to mine helium three. And when we were speaking to him, one of the reasons he said that we need to go to the moon to mine helium three is because the quantum industry uses it for their cooling. Is that thing behind you using helium three?<br>\nJohannes Pollanen: Yep. Yeah, this machine uses helium three. The helium that I’m talking about for our chips is helium four. It’s the more standard one. But there is all of these behind our director of operations here is that dilution refrigerator and that thing has helium three in it. Like these cooling systems have that. You know, in an ideal world when we that system has something like 20 liters of helium three gas. And each dilution refrigerator needs that amount and you never lose it as long as you, you know, their safety is in place to kind of recollect it. Yeah, it keeps it.<br>\nMark Fielding: Okay, it circulates around. Okay.<br>\nJohannes Pollanen: Yeah. And but it is still, you know, to make more of these, helium three is a resource that isn’t very naturally occurring. It is not so to give you a sense, you know, helium isn’t around on Earth, that’s about a part per million out of the air, because most of it when it’s in the air escapes out into outer space. It’s actually so light that it can get enough speed to get itself out of the atmosphere. So there’s about a part per million of the air is helium and about a part per million of that is helium three. So it’s a tiny fraction. And finding new sources for helium three is really important. It is extremely rare.<br>\nMark Fielding: Very rare isotope. Well, we know there’s a show. I’ll put it in the link for our show on Helium Three because it’s all about nuclear weapons as well. So it’s a very interesting. Yeah, yeah. It’s<br>\nJohannes Pollanen: Yeah, when you said it went That’s right. Yeah, there’s an interesting history there on how low temperature physics intersected with some other innovations that we made as a species.<br>\nMark Fielding: Right. Could you do the show and tell again? Could you hold up the chip to the camera again, Johannes?<br>\nJohannes Pollanen: Yeah, absolutely. Yeah. So this is our Wonder Lake chip. Am I kidding?<br>\nMark Fielding: Wonderlake.<br>\nJohannes Pollanen: Yeah, we named all of our chips after Lakes. Wonder Lake is a lake nearby in Chicago that we named this one after. And this one was prototyped. We design the chip and then it gets manufactured by a commercial semiconductor foundry using the standard processes that are made to like I said, make the chips in your iPhone or in your laptop. And this device was this Wonder Lake architecture was built so that we could demonstrate that we can move electrons around to do error correcting codes. So like the neutral atoms or ions, we can move our qubits around. And this was built so that we could have something like 2500 electrons on that chip.<br>\nMark Fielding: Does twenty five hundred electrons equate to twenty five hundred qubits?<br>\nJohannes Pollanen: No, so actually our qubits ultimately will be so we can get into the details of various things, but ultimately our qubits are built from two electron objects. So we make what are called singlet triplet qubits out of two electrons. And that harkens to some of the things that the silicon spin people do, like us. We share similarity with them. And so it equates to something like, you know, half that many qubits. We don’t have thousands of qubits on this chip. This was really just designed to show that we can do the choreograph the error correction that we’ll eventually need to do. But to give you a sense our ultimate goal is to build chips that are not that much bigger than that, than the thing I just showed you and to fit, you know, millions or tens of millions of electrons and tens of qubits ultimately qubits on that kind of footprint.<br>\nMark Fielding: So this is how we scale. This is the famous this is how we scale quantum computing.<br>\nJohannes Pollanen: This is our thesis for sure. Because again, I think, if you’re gonna set out to scale quantum computers, you have, I think, two options. You’re limited to two choices. One, use the one scaling architecture that we have ever built in all of human history, which is CMOS manufacturing and semiconductors, or you have to invent something equivalent. And the second of those sounds really hard to me, given that all of humanity has invented this once. And so I’m picking that particular battle. Like we have work to do on the quantum front and on the error correction front and all this stuff, but I think that’s a more tractable problem than inventing some other technology that we can scale to the level of, you know, ten to the ten transistors that we can do in your laptop.<br>\nHow do you cool quantum systems?<br>\nMark Fielding: Right. So we have the wafer, we have the liquid helium, we have the two electrons that are floating on that.<br>\nJohannes Pollanen: They’re floating. They’re bound. It’s actually quite so the electron is to give you a sense of why, you know, like why on earth would it get stuck there? So if you have this layer of liquid and you bring an electron nearby, the helium underneath polarizes because of the electron charge. So the helium is a dielectric. So if you bring a charge near a dielectric, it polarizes a little positive charge on the other side. And so then this electron sees a positive image charge in the liquid and gets stuck to it. It sees it and wants to go toward you know, if you have a negative charge and a positive charge, they try to get close to each other. And so the electron creates its own like fictitious positive image charge in the liquid and tries to get to it. But it can’t go in because the helium is completely inert. There are no open electronic states, so it just gets and those two things compete and it ends up finding itself, you know, 10 nanometers above the helium surface. And this is yeah.<br>\nMark Fielding: Just gonna pull on another thread there because we spoke about dielectric fluids a few weeks ago and we were speaking about cooling AI data centers. So there’s another thinking on paper thread for everyone to pull on. But sorry, continue.<br>\nJohannes Pollanen: No, that’s a good point, actually. One of the things that we spend a lot of time one of the questions that comes up in some quantum technologies a little bit in the weeds, but how does one get heat out of the chips? You know, there can be power dissipation problems on the chip that one has to solve, particularly at scale. So we think a lot about these kinds of problems. And the dielectric helium actually is the it has at those temperatures, you know, very near absolute zero, it has the highest thermal conductivity of any known liquid, any known substance, correctly. So it pulls heat out very efficiently. So we benefit naturally from that aspect. But what was I saying? But yeah, that’s why the other thing I wanted to emphasize is all of this sounds crazy exotic. Actually, if you talk to anybody about their quantum technologies, it always sounds exotic. But all of these things have been known for a long time. So like I think the first trapping experiments of electrons above the surface of helium happened well before I was born. They happened in the boy, late sixties, early seventies.<br>\nMark Fielding: Yeah, okay.<br>\nJohannes Pollanen: You know? And people have been building up from there. You know, it’s and it started out as just<br>\nMark Fielding: Was that Bell Labs or something?<br>\nJohannes Pollanen: Yeah, the first experiments were done at Bell Labs and some universities. But yeah, it was it’s pretty amazing that, you know, you build up from these Bell Labs at the time had a real knack for laying the foundation for all kinds of technologies. I don’t think none of those ideas that they originally had were intended to be technologies at the time. They were really just like interesting aspects of nature that they wanted to realize and then people have built off of that, us.<br>\nMark Fielding: You have the wafer, you have the helium, you have the electrons. At the moment, how many qubits do you have? Right. So why why is that challenge? Why are you stuck there or not? Why are you there? And why can’t one just be ten? Why can’t ten just be a hundred? And why can’t a hundred just be a thousand?<br>\nJohannes Pollanen: One. So this is now you’re getting to our challenge. Yeah. Yeah. So this idea of making qubits out of electrons on helium has been around for a while. It was actually the first proposals were made back in the nineties. But then nobody really it’s an artifact of history in the sense that, you know, people back in the nineties didn’t actually even like the first ion trap experiments were really going on then. Nobody really invented superconducting qubits or the techniques for measuring them. Silicon spin qubits didn’t exist, neutral atoms definitely didn’t exist. And so you had this community of people that had been working on electrons on helium, and then there were other communities working on quantum computing, and they just didn’t talk to each other. And then this sort of started to change near the end of my PhD. Our colleague Steve Lyon, who’s an electrical engineer at Princeton and the chief technical officer here at EeroQ, had this idea of using electron spins for quantum computing. But again, nobody was really trying to make it work, honestly. The community was doing other things. And then some academics started saying, you know what, we could use some of the techniques that people develop for superconducting qubits to do this kind of readout. But they mostly worked on it in academic environments, kind of one graduate student at a time, you know, and things go slow in those kinds of environments. But you kind of had this ecosystem building around quantum computing generally. And so when we came onto the stage, when I started my faculty position, my background before coming to MSU and before EeroQ was I was at the Quantum Institute of the Institute for Quantum Information and Matter at Caltech. And that’s where I really cut my teeth on quantum computing and thinking about like what systems could be really good. And I felt like this one had a lot of the benefits. Steve and I had talked for years about, you know, how to scale these kinds of systems. And I thought, you know what, this actually needs a real effort. Somebody needs to try. And so what we did is we set out to try and we developed essentially it took us about 18 months to build the first qubits, the first charge qubits out of electrons on helium and get that working. And now we’re developing the spin qubit part. And it just needed somebody to try and to utilize the techniques that people had built up over years in other parts of quantum computing. And that’s really what we’re leveraging to catch up. But this gets at the heart of, you know, I said everybody has their challenges. I’d say we’re a little earlier than most. Not everybody, but we’re a little earlier than most on the quantum part. But we’re way ahead on the scaling part. I feel very confident in that part. I don’t think many of our colleagues have ideas about how to really build large-scale systems and we’re catching up. I mean, that’s the sort of two-minute version of the history. But it’s an interesting random walk through history and science and technology development that has led us to where we are and why it’s taken long. Yeah.<br>\nHow do you make more qubits?<br>\nMark Fielding: But what does it take to go from one to ten to a hundred to a thousand though?<br>\nJohannes Pollanen: Yeah. Good question. So what we’re doing, what we do, the way we do our device development is we build the quantum devices in-house and test them here. So we when I say in-house, we use our nanofabrication engineers use academic clean rooms to build prototype devices that we then rinse and repeat and test. And things work sometimes, sometimes they don’t, but we have a very clear roadmap on how to go that. We have a recent the paper that we published recently that demonstrated this first coupling to a charge qubit of an electron on helium is in nature physics from earlier this year. And it’s just the rinse and repeat process until we get the materials right to do the readout and get everything working appropriately. And, you know, I’d say that we’re working faster than an academic environment ever could. You know, like it took us about 18 months to get this charge qubit readout working. That idea had been around for more than 10 years before that, you know, and we just jumped on it. Instead of having one person work on it, we had, you know, a fab team, a design team, a theory team, and a measurement team, and it cracks in 18 months. And we’re doing the next step is to build these two electron spin qubits, measure their fidelities, get all the two qubit gates working. So that’s the process. But in parallel, we work with the semiconductor foundries to build these chips. So we’re not leaving scaling as an afterthought. We’re doing both of these things, you know, full speed ahead on that. And then actually, so we I used to say we build the quantum devices in-house, we build the scaling architectures with the semiconductor foundries, and eventually we have to start integrating. Well, actually now we’re at the integration stage. So we’re taking our single qubit kind of devices and starting to integrate them with the stuff that comes from this commercial foundries.<br>\nMark Fielding: So do you have a timeline? Do or no timelines are impossible, aren’t they?<br>\nJohannes Pollanen: God. Yeah, they are. I mean, predicting the future is always strange. But I think there’s some interesting I always think it’s gonna be faster than people I mean, it’s been faster than I would have expected with quantum computing. You know, I started this earlier, I said like if you’d asked me five or ten years ago, would we be simulating small scale molecules on quantum computers that are connected to the cloud? I would have like, that’s crazy talk. You’re just speaking like it’s nonsense. And that is exactly where we are now. We take it for granted, but if you had a time machine and could go back five years, people would have been like, What are you talking about? That doesn’t really work that way. A really good yeah, I mean our goal is to have in the next couple years a ten thousand true qubit system built on a chip like this, that we can connect to the cloud or sell to people on premise. That machine I will mention is still even at 10,000 qubits, it’s essentially a NISC machine. So it’s one that you can do little error correcting experiments on, but it’s not the full-scale machine that we need to attack the biggest problems in the world. That needs, I think, millions or tens of millions of qubits. And then we go from the 10,000 to that million. So we’re working on the 10,000 qubit chip now. Because I think we’ve got these pieces worked out and we’ve figured out from these other systems and how things work. We figured out what works and what doesn’t, and now we’re just putting it together.<br>\nHow do you do a computation on a qubit?<br>\nMark Fielding: When I finish recording this, I’m gonna go see some friends and family. And I’m gonna say, I’ve just recorded a podcast on quantum computing with EeroQ and Johannes was he’s a quantum physicist. And they’re gonna say, Yeah, but how does a quantum computer work, Mark? What is it? And we have these notions that we can understand gates, ones and zeros, ons and off. It doesn’t matter if there’s a trillion of them, okay, we can still kind of see that and understand it conceptually from a very high level. When people talk about doing computation on qubits, then my brain stops working and I can’t visualize how that works. Like how do you do a computation on a qubit?<br>\nJohannes Pollanen: So I mean there’s two kind of answers, right? There’s the abstract answer, which is what you already alluded to. You run gates. You know, you start with an input string of information that you know you have some number of qubits, you encode a certain sequence of zeros and ones in that. Then you let it evolve in time where you get qubits to interact with each other and you run these gates in a very abstract way. And then at the end and these that’s right, they’re quantum gates.<br>\nMark Fielding: These are quantum gates, not the regular gates that we are familiar with, and they’re not the same.<br>\nJohannes Pollanen: They’re not the same. And depending on I once we go from abstract to physical, I’ll get to that point.<br>\nMark Fielding: Okay, sorry.<br>\nJohannes Pollanen: No, but that’s a good point. But it is quantum gates, and then at the very end you perform a measurement of all those qubits again, and that gives you a data point for your answer. And then you have to repeat that. So in that sequence of gates that you run, the quantum gates, you’ve encoded an algorithm. There’s a process for moving information around. And then at the end, the measurement tells you what the final answer is. And that is what every quantum algorithm looks like. And there may be other pieces where you’re doing error correction in the middle, but that’s what the algorithm looks like. And then you have to somehow, that’s the abstract level. And then for a given modality, a given kind of hardware, you have to realize how do you make that happen in reality on a chip, you know? And for us, it involves moving electrons close to one another, far apart, close to other close to wires that are on the chip to cause single electrons to change their state, and then to move them around to readout zones to do the readout. So we’re essentially our algorithms look like shuttling electrons around. Actually a lot like the ion traps or neutral atoms. And instead of lasers for readout, we use on-chip circuits for the readout. Does that help at all? Or does it make it worse?<br>\nMark Fielding: Well it probably makes it worse before it makes it better, but like I said in the green room, we do these shows that one day we speak to enough people, it will click and it will become clear to everyone who’s listening. I’m sure some people will know exactly what you’re talking about. Some people are like, What? Briefly quantum algorithms, are they agnostic to the modality?<br>\nJohannes Pollanen: Not entirely. So for example, error correction is a type of algorithm. So if you try to do if you’re trying to fix errors that happen in a quantum computer, that is an algorithm that you’re running. It can be mapped abstractly onto a series of gates and measurements, and that is a process that is an algorithm. So some algorithms, like some error correcting algorithms like the surface code, which is the most famous of all the quantum computing error correcting algorithms, was developed with the qubits being connected to their nearest neighbors. So that’s a level of connectivity to the circuit. You have qubits are connected to the ones that are the left, the right, just in front of them and behind them on the circuit. And that allows you to do the surface code. There’s a new class of error correcting algorithms called quantum LDPC codes that require a different kind of connectivity. So you need to be able to like take a qubit that’s over here and connect it to a qubit over here somehow. That means you could either do information swapping between a whole chain of qubits, or you can actually move the qubits around to get them to talk to each other. But those two algorithms are like the surface code and these quantum LDPC codes. They are not agnostic to the underlying hardware. Because if your hardware can’t be reconfigured, if you can’t move your qubits, it limits what you’re able to do algorithmically.<br>\nMark Fielding: That makes a lot of sense to me, actually. Like I can visualize that, so that does help.<br>\nJohannes Pollanen: Yeah. So it’s not and that’s true. I picked error correction as an example, but similar things could be true for other algorithms, right? Like depending on how the circuit is actually architected and laid out and how the connectivity is between qubits and what operations are easy and hard, then that determines like how easily that algorithm can be run on one machine or another. In principle, it could always be run you can come up with some way to do it, it just won’t be it will be wildly not ideal to run on a particular kind of modality. And a big one is connectivity, this issue of how well do you connect. This is where ions, atoms, and us really shine. That you can move the qubits around.<br>\nFaster quantum computers<br>\nMark Fielding: I literally sit here and ask you questions all day so I won’t. I want to move on to some bigger questions and then I’ll carry over question aware of time. Before I do that though, somebody who’s listening to this who knows far more than I and they’re like I tuned in to hear about EeroQ what have I missed for those people who know much more about the industry? What would they want to hear from you?<br>\nJohannes Pollanen: It’s a good question. I think I’ve mostly touched on one of the more subtle points that we it’s further down in our roadmap and something that is a little bit more of a trade secret on our side, but I can allude to it because people might be interested, is this electron motion that we have allows us to make two qubit and with some other pieces, single qubit rotations that allows us to do all of quantum computing. There’s a questions of speed. How fast can you run the machines? And so our 10,000 qubit chips, which we’re working on building right now, are relatively slow. They’re similar to neutral atoms or ions, but we actually have some trade secrets that allow us to get to much faster gates ultimately that we’re actually starting to build now, the first prototypes of. And so we ultimately something that I swept under the rug and we didn’t really talk about is you need Quality, quantity, and ideally you want speed. You want to be able to make the computations happen quickly. I mean that’s sort of intuitive, right? It’s hard to imagine having a slow, small quantum computer. You want something that’s you know lots of qubits on a small footprint going really fast with high quality qubits. That’s what we tried, that’s what we want, and that’s what we’re building. At least that’s our vision on this.<br>\nMark Fielding: What is the biggest unanswered question in quantum mechanics or quantum computer? I don’t even know if I should differentiate between those terms today.<br>\nJohannes Pollanen: I think yeah, I think we understand quantum mechanics pretty well. I mean, like I said, I there’s not a lot of I mean, so okay, one of the issues with quantum mechanics that I think people get hung up on is it makes no sense, right? Intuitively. Like there’s a counterintuition between our everyday lives and when you hear about superposition and entanglement and all these things. But we know those things are right. We know superposition works, we know quantum entanglement works, We just don’t have a link it’s just unfortunate that our human brains don’t have a language that allows us to describe that other than mathematics and experiment and like actually making technologies<br>\nMark Fielding: Poetry.<br>\nJohannes Pollanen: Poetry, you know, that’s a great actually leaning on analogy goes a long way. It builds intuitions and But it does also bring about this mystique and this mystery. It’s not mysterious. It’s really, we understand quantum mechanics. I mean, we understand it so much that we can build technologies out of it. I mean that you if you do if there’s like big unknown things about something, it’s really hard to build. If we didn’t fundamentally understand something about how transistors work, we couldn’t make an iPhone, you know? And<br>\nMark Fielding: So what’s the biggest unanswered question challenge in quantum computing today?<br>\nJohannes Pollanen: How to build a big system. I think this is gonna be the real issue is like how to build a really big system. How do you build a large scale? Because I you know, we started this conversation with like quantum computers exist already. You can play with small toy versions of quantum computers in a variety of modalities. But when do we get to the point where we actually build a machine that’s big enough to do something useful? That’s what I want. I wanna build that machine.<br>\nCan IBM make a useful quantum computer?<br>\nMark Fielding: I don’t know what they’re up to now, but just briefly on IBM, over a hundred, I think they’ve spoken about a hundred, their Starling chip that we’re running out of time for that. We’ve got three years left, I think, until that comes to fruition. Do you think are you saying that they’re not gonna hit their goals? Do you think they’ll hit their goals? And if they do hit their goals, do you think that actually is a useful quantum computer?<br>\nJohannes Pollanen: I my suspicion is is that I’m, you know, the large scale quantum computers that are built out of I won’t single out IBM, but superconducting qubits are they’re really great because they’re fast. You can print them out on a circuit, you know, you can fabricate them, so you can make them wherever you want. You can change the connectivity of the circuit by making different designs. Each qubit is a little bit different, and so that’s a big problem for superconducting circuits. And the other problem is that they’re quite large. You know, they have they typically each you know, I showed you this millimeter scale chip that fits thousands of electrons or tens of thousands. And we double the size of this and we can fit millions or tens of millions. Each one of the superconducting qubits essentially has a millimeter size length scale built into it. Each qubit does. So that’s tricky. I think that that’s a hard challenge to battle. I mean, I think what their solution is is quite brute force to build big systems with lots of dilution refrigerators network together. I’ll be interested to see how that evolves. I think there’s a lot of really hard engineering challenges that make I don’t know how to hook up a bunch of dilution refrigerators together that, you know, my background is in really hardcore low temperature physics, and that sounds like a hard problem to me. I’d like to build everything as small as possible into a with as many qubits as densely packed using something that we understand in one dilution refrigerator. That’s my vision. And maybe we need two or three, but I don’t want to have to build thousands or tens of thousands of these. So I don’t know. I’m hopeful. Like it, but I do want to, I’m a everybody always gives me a little bit of a hard time because I’m an internal optimist. So I think all of these technologies are gonna continue to be successful for a while. Because we’ve still got a long, a long way to go. There’s all, you know, you read all this hype, but there’s<br>\nMark Fielding: We’ve barely started by the sounds of it.<br>\nJohannes Pollanen: Yeah, I mean, there’s so much good work that still needs to be done for ions or neutral atoms or superconducting or us or anybody. You really have to have there’s a lot of good stuff that needs to still happen. But the potential makes it worth it, in my opinion.<br>\nThe quantum lessons of nature<br>\nMark Fielding: Right, I’m gonna bring Jeremy back on, who’s not here if you’ve just joined us. Jeremy has been stolen by big tech. And he would talk about Richard Feynman now, and he would talk about nature and technology and technology in nature, and he would ask you how do we combine these two things? What have you learned from nature? And what have you learnt about nature?<br>\nJohannes Pollanen: I’ve learned, I think, that we have to move in concert with nature. So we have to nature provides us things like electrons or atoms or ions that are identical, that are pre-made by the universe to be perfect. There is no other perfection, I think, in the world, but like It’s amazing that every atom in the universe is created the same. I mean, modulo isotopes and things. But if you have two of the same isotopes, you can’t distinguish these particles from one another. You can’t put a label on there, right? They’re as perfectly matched as possible. That’s, I think, that we can’t do that in our own technologies. We don’t know how to make things perfectly. Even the best transistors that we make, each one is a little, they can’t be identical. And so we have to figure out how to take the things that we know how to make to the best of our ability and interface them with the perfection of nature. That’s sort of, I think, a real powerful. That’s what I’ve that’s one of the things I’ve certainly learned from nature. The other thing I’ve learned is quantum entanglement is truly complex. It is really, it’s ultimately the many particle entanglement that gives quantum computing its power. The fact that these systems can be They require so much information to understand a many body or many particle entangled state. That’s a true statement. And the flip side is if you have the ability to control that in a quantum computer with many qubits that are all entangled with each other, then you have immense computational power. Those are two sides of the same coin.<br>\nCarry over question<br>\nMark Fielding: Now there should be some cut to the music. We should have some cool funky music because we have our thinking on paper handover question where one guest leaves a question for the next guest and then you leave a question for the next guest. Last week’s guest was Jeff Chang, and Jeff Chang is a writer and musician. He wrote the book, Water mirror echo, like the history of Bruce Lee in Asian America. He wrote another book called Can’t Stop, Won’t Stop, which is the history of hip hop. And he, the producer of DJ Shadow, Incredible Man, we spoke about AI. His question he left for you was If not for humans, then what is technology for?<br>\nJohannes Pollanen: That is a great question. If yeah. I mean it sort of is for humans, but he wants something else. So Yeah<br>\nMark Fielding: I’m not sure what he wants, like yeah, cause maybe if he was kinda it was he was riffing on it and he I mean I don’t know if his real question is like, what is technology for? Well you can take it wherever you want.<br>\nJohannes Pollanen: Yeah. I mean it yeah. It’s a great question. I think you know, when I think of what is technology for, I think it’s my feeling is it’s try to at least so one of the things that I find very satisfying about physics, but more generally about my interaction with the universe is that I like to figure stuff out. And in some sense, it’s I like to figure out what’s true, which statements, which things are true, which things are false, and how do we take the true things and learn more about the world? When we’ve done that, we’ve done amazing things. And technology helps us, it’s a grounding on how to solve problems and figure out what’s true. So I think that’s an important piece. And it connects with you know, human flourishing and well-being. I think, you know, I think that’s another really important thing. I mean, there aren’t very many things that I you know, there’s often you can argue about values and traditions and approaches, but you’d love technology to help you improve the lot of humanity. You know, I think everybody can agree that we want people to be well and to flourish and whatever that means, you know, there are good answers to those kinds of and where technology can help that, I think it’s really important. I don’t know if that’s what he was looking for, but that’s what comes to mind immediately for me.<br>\nMark Fielding: I will share it with him, I’m sure that’s what he was looking for. And you are working with a technology that has perhaps the ultimate potential to make that a reality one day. So no pressure, Johannes. No pressure.<br>\nJohannes Pollanen: No, we the pressure is the pressure’s there, the pressure’s real, but the pressure is good. Because if you’re not pressured, what are we doing?<br>\nMark Fielding: Do you have a question that you could ask for our next guest? It doesn’t have to be about technology. It can be about anything you want. Maybe something’s gnawing away at you at the moment and you’d like somebody else to have a go at, or maybe it’s something deep, profound. It can be something frivolous.<br>\nJohannes Pollanen: Yeah. I did have a question, and it’s associated with AI because we interface with AI a lot here, in our work, but it’s also surprised me I’m no expert in AI for the record. I don’t know how to I’m but I’m a user of AI. And one thing I’m always really curious about when I interact with anybody, the question I have for them is how has you know, there’s all these promises of how AI is going to be great for everything. But my question is always, how has AI changed your life already? What’s an example? Not something generic, something very specific. Like, I feel like people find these little solutions or little uses of AI. I found them myself. I have a few examples if you want to hear. But they’re really fantastic ways of it, it’s made my life better in so many ways already. And I’m a little bit surprised that it’s been able to do that so quickly.<br>\nMark Fielding: Share your examples, please.<br>\nJohannes Pollanen: Yeah. So so one, for example, I at some point I’ve been using it as a I really love distance running. So I’ve been using it as a coach for my running. It’s an amazing coach. It’s incredible. It can build workout routines, it can do all this thing, and it’s like super easy. And another one is I I think I mentioned earlier I’m originally from Finland. So I’m a native when I was born in Finland, we moved to the States when I was a little kid. And when my parents were still alive, I essentially only spoke Finnish to them. We spoke Finnish at home, and that was the driver. And I don’t get a chance to speak Finnish anybody until I realize ChatGPT is an amazing conversation partner in Finnish. So if you want to learn how to speak a foreign language, ChatGPT or Claude can just talk to you. It’s incredible. It’s like talking to, it’s like one of the most amazing hacks I’ve ever discovered. And it’s brought back my language for me. It’s like I suddenly dream in Finnish again because I do this every morning, just chat with ChatGPT about in Finnish about like the news or some, you know, some something totally mundane.<br>\nMark Fielding: Right, Johannes. Thinking on paper, our tagline is well, we start every show with Disruptors and Curious Minds. Welcome to Thinking on Paper. It’s the human story of technology. How do you could you say that in Finnish on to the camera?<br>\nJohannes Pollanen: boi. Yeah that’s right. Except a bunch of Finnish people are gonna listen. Yksi asia, minkä mä voin sanoa, että ChatGPT on oikein hyvä, jos sä haluut oppia puhua suomen kieltä. If you want to learn how to speak Finnish, you should chat with ChatGPT. Kiitos.<br>\nMark Fielding: How do you say thank you in Finnish? Kitos.<br>\nJohannes Pollanen: CSO of EeroQ, thank you for a wonderful (Wait, Mark Fielding should be saying this, but it was split. Correcting for formatting consistency).<br>\nMark Fielding: CSO of EeroQ, thank you for a wonderful conversation. Thank you for thinking on paper with us. If you’re listening to this, please comment with questions. We have lots more quantum computing episodes lined up. But we want to hear your questions because your questions will help our questions.xyz and please share this with one quantum curious friend. Because you must have one. Until next time. Thank you and stay disruptive. Be curious. Keep thinking on paper.<br>\nJohannes Pollanen: Thank you.<\/p>","content_hash":"6380b2c54958572a001563a8c6b88de6","author":"Doug Finke","published_at":"2026-10-17T19:39:40","fetched_at":"2026-10-19 18:16:28","word_count":10723,"read_time_minutes":54,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"83b35b55063fda0a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47779","title":"Review Evaluates AI and Quantum Computing Paradigms for Adaptive Combinatorial Optimization","url":"https://quantumcomputingreport.com/review-evaluates-ai-and-quantum-computing-paradigms-for-adaptive-combinatorial-optimization/","summary":"A new review paper by Hoong Chuin Lau examines the intersection of AI and quantum computing for combinatorial optimization, categorizing research into three paradigms: AI-for-Quantum Optimization (AI-for-QO), Quantum-for-AI (Q-for-AI), and AI-Quantum Co-Optimization. The study, which analyzed 119 papers, concludes that AI-assisted quantum optimization shows promise, while quantum-assisted AI models are largely unproven. The review emphasizes that scaling quantum optimization is a systems enginee","content":"<p>In a comprehensive review paper published on arXiv, Hoong Chuin Lau from the Singapore Management University has analyzed the intersection of artificial intelligence and quantum computing for combinatorial optimization, proposing a taxonomy and evidence hierarchy to evaluate adaptive hybrid workflows.<br>\nTitled “Beyond QAOA: A Review of AI and Quantum Computing for Adaptive Combinatorial Optimization“, the study evaluates 119 papers—coding 67 in detail—and concludes that while AI-assisted quantum optimization shows clear benefits in reducing hardware calls and managing constraints, quantum-assisted AI models remain largely unproven for practical advantage on current hardware.<br>\n[ M0–M5 Evidence Hierarchy for Adaptive Quantum Optimization ]<br>\n• Zero studies reach M5 in the screened corpus; median experiment size is 16 qubits.<br>\nThe review categorizes research into three distinct paradigms: AI-for-QO (AI tuning parameters, initialization, or execution settings of a quantum solver), Q-for-AI (embedding quantum layers inside machine learning models), and AI–Quantum Co-Optimization (learned policies that allocate work dynamically between classical and quantum routines). The analysis finds that 22 out of 52 core studies included no classical baseline, and only 10 out of 24 applicable studies isolated the quantum contribution via proper ablation tests.<br>\nThe paper highlights that scaling quantum optimization is increasingly a systems engineering problem rather than a pure qubit-count challenge. Constraints, penalty weights, slack encodings, and transpiled two-qubit gate depths often dictate performance before circuit parameters are chosen. Consequently, the review emphasizes selective quantum use—developing learned controllers that predict whether the marginal benefit of invoking a quantum processor outweighs its computational, sampling, and queueing costs.<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"4171d7994cad0d296e8937dc7e90fcc7","author":"Mohamed Abdel-Kareem","published_at":"2026-10-17T17:32:22","fetched_at":"2026-10-19 18:16:28","word_count":325,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"3b39d12bd28fb32b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47768","title":"RIKEN Demonstrates High-Fidelity Simultaneous Control of Silicon Spin Qubits Above 99.9% Threshold","url":"https://quantumcomputingreport.com/riken-demonstrates-high-fidelity-simultaneous-control-of-silicon-spin-qubits-above-99-9-threshold/","summary":"Researchers at RIKEN and collaborators have achieved high-fidelity simultaneous control of five silicon spin qubits, maintaining over 99.9% accuracy. They overcame crosstalk caused by AC-Stark shifts through a new calibration protocol, enabling the use of a single microwave control line. This breakthrough meets the fault-tolerant threshold for quantum error correction and paves the way for more scalable quantum computers. The post RIKEN Demonstrates High-Fidelity Simultaneous Control of Silicon ","content":"<p>In a study published in Nature Physics, researchers from RIKEN, National Taiwan University, ETH Zurich, and TU Delft have demonstrated simultaneous high-fidelity single-qubit operations across a five-qubit silicon (28Si/SiGe) quantum dot array using a single, shared microwave control line.<br>\nDetailed in the paper (“Simultaneous high-fidelity single-qubit gates in a spin qubit array“, the team identified AC-Stark shifts as the main source of parallel drive crosstalk and introduced an N(N-1) pairwise calibration protocol that preserves gate fidelities above 99.9% during simultaneous 5-qubit operation.<br>\n| [ Gate Fidelity Performance Under Parallel Driving Conditions ] |  |  |  | <br>\n|---|---|---|---|<br>\n| Driving Condition / Mode | Qubit Targets | Primitive Gate Fidelity (Fp) | Key Operational Features | <br>\n| • Individual 1-Qubit Drive (125 ns) | • Q1, Q2, Q3, Q4, Q5 | • 99.993% – 99.998% | • Kaiser-window pulse shaping. | <br>\n| • Simultaneous 2-Qubit Drive | • Q2-Q3 / Q3-Q4 / Q1-Q3 | • > 99.99% | • AC-Stark phase compensation. | <br>\n| • Simultaneous 3-Qubit Drive | • Q2-Q3-Q4 / Q1-Q3-Q5 | • > 99.99% (e.g., 99.9966% on Q4) | • 250 ns pulse duration. | <br>\n| • Simultaneous 5-Qubit Drive | • All 5 Qubits (Q1 to Q5) | • ≥ 99.90% (e.g., 99.977% on Q3) | • Sustained across 250 & 500 ns. | <br>\nOvercoming Parallel Drive Crosstalk in Silicon Spin Arrays<br>\nBecause idle silicon spin qubits dephase significantly faster (T2* ≈ 10 μs) than driven qubits (T2,R ≈ 100 μs), running cyclic quantum error correction (QEC) protocols requires simultaneous multi-qubit operations. However, driving multiple spin qubits in parallel previously caused gate fidelities to degrade from >99.9% down to 99.5%.<br>\nThe team identified off-resonant microwave-drive-induced AC-Stark shifts as the primary source of parallel gate errors. Because the resulting phase shifts (Δφij) sum linearly, the crosstalk can be compensated by measuring pairwise phase accumulation between individual qubit pairs, scaling as N(N-1) rather than 2N-N-1.<br>\n- Exceeding the 99.9% Fault-Tolerant Threshold: All five qubits maintained simultaneous single-qubit gate fidelities ≥99.9% during fully parallel five-qubit operation, satisfying the minimum requirements for 2D surface code QEC.<br>\n- Low Residual Exchange (Joff < 16.6 kHz): Decoupled CZ sequence measurements confirmed that residual exchange interactions between neighboring quantum dots remained below 16.6 kHz during single-qubit driving.<br>\n- Wiring Reduction for Scalable QPUs: Demonstrating high-fidelity parallel control using a single impedance-matched microwave transmission line reduces physical wiring density and thermal loads, supporting modular silicon spin-qubit unit cells of ~10 qubits per shared control line.<br>\nThe researchers note that replacing the surface micromagnets with integrated back-end-of-line (BEOL) nanomagnets could double the local field gradient, enabling faster gate operations (2–3 MHz) at lower microwave power and opening a pathway toward 10-qubit parallel control modules in commercial silicon manufacturing.<br>\nWhat This Means (In Plain English)<br>\nTo run quantum error correction on a silicon quantum computer, the processor must execute operations on many qubits at the exact same time. However, when qubits sit idle waiting for their turn, their delicate quantum states rapidly decay (dephase) within microseconds. Previously, turning on microwave signals to control multiple silicon spin qubits simultaneously caused severe interference (crosstalk), causing gate accuracy to drop sharply. Physicists at RIKEN discovered that this crosstalk is caused by “AC-Stark shifts”—a predictable shift in a qubit’s frequency caused by neighboring microwave pulses. By proving that these shifts add up linearly, the team developed a simple pairwise calibration trick to offset the frequency shifts. Using a single shared microwave control line, they operated up to three silicon qubits simultaneously at 99.99% accuracy, and all five qubits at ≥99.9% accuracy—crossing the fault-tolerant threshold needed for practical error-corrected quantum chips.<br>\nReview the research paper in Nature Physics here and examine the open data repository on Zenodo here.<\/p>","content_hash":"5ef9bc0316ee6018cf5a20e829695dde","author":"Mohamed Abdel-Kareem","published_at":"2026-10-17T16:27:43","fetched_at":"2026-10-19 18:16:28","word_count":622,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"3de75c7c5915547c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47764","title":"Harvard, Anthropic, and QuEra Use LLMs to Discover Quantum Circuits with Up to 9,100x Lower Resource Costs","url":"https://quantumcomputingreport.com/harvard-anthropic-and-quera-use-llms-to-discover-quantum-circuits-with-up-to-9100x-lower-resource-costs/","summary":"Researchers from Harvard, Anthropic, and QuEra Computing developed an AI framework that uses Large Language Models (LLMs) to discover and optimize fault-tolerant quantum circuits. This framework significantly reduces the resource costs of core computational primitives, achieving up to 9,100x lower costs compared to hand-crafted baselines. The LLMs achieved this by proposing complete Python programs for circuits, which were then evaluated and refined through an evolutionary process, leading to th","content":"<p>In a joint technical study published on arXiv and an official release by Anthropic, scientists from Harvard University, Anthropic, and QuEra Computing have introduced an evolutionary AI framework where Large Language Models (LLMs) automatically discover, write, and optimize fault-tolerant quantum circuits.<br>\nDetailed in the paper (“Discovering state-of-the-art quantum circuits with large language models“) and Anthropic’s technical release (“Designing more efficient quantum circuits with Claude“), the research demonstrates that pairing LLM code proposals with an independent classical evaluator reduces the space-time resource costs (T × Q-cost) of core computational primitives by 4.1x to over 9,100x relative to hand-crafted baselines.<br>\n| [ Resource Improvements Across Eight Compilation Subroutines ] |  |  |  | <br>\n|---|---|---|---|<br>\n| Compilation Subroutine / Task | Baseline (T, Q) | Discovered (T, Q) | TQ-Cost Gain (G_TQ) | <br>\n| • Reed–Solomon DQI Decoder | • (5.1 × 106, 1,938) | • (4.4 × 105, 1,837) | • 12x Reduction | <br>\n| • Hermitian DQI Decoder | • (1.0 × 108, 1.9 × 105) | • (9.3 × 105, 2,395) | • > 9,100x Reduction | <br>\n| • HHL Rotation Angle (arcsin) | • (1.6 × 104, 300) | • (1,348, 115) | • 32x Reduction | <br>\n| • Coulomb Potential (1/√\\|\\|x\\|\\|²) | • (6,355, 252) | • (1,140, 142) | • 9.9x Reduction | <br>\n| • Fixed-Point Gaussian (e-x²) | • (2.4 × 104, 362) | • (1,583, 139) | • 39x Reduction | <br>\n| • Fe₂S₂; Alias–Select (Chemistry) | • (5.5 × 104, 139) | • (1.5 × 104, 126) | • 4.1x Reduction | <br>\n| • Non-Abelian Lattice-Gauge Sim. | • (1.3 × 106, 1,927) | • (1.7 × 105, 1,859) | • 7.7x Reduction | <br>\n| • Prime-Field Modular Inversion | • (1.9 × 106, 1,446) | • (4.0 × 106, 935) | • New Divsteps Architecture | <br>\nEvolutionary AI Framework and Closed-Loop Co-Design<br>\nRather than relying on local gate-level rewrites, the system deployed frontier LLM models (Claude Mythos 5) in an automated closed loop: proposing complete Python programs across distinct algorithmic families, evaluating basis trajectories in a classical simulator (kickmix model), receiving feedback on Toffoli gate counts and peak qubit footprints, and autonomously refining circuit architectures.<br>\nHighlighting the impact of algorithmic optimization over pure hardware scaling, the research notes that classical estimates for simulating the FeMoco iron–sulfur cluster dropped from 50 trillion Toffoli gates in 2017 to ~340 million through circuit redesigns—a ~150,000-fold reduction achieved over eight years of human research. In contrast, the AI framework arrived at a new reversible modular inversion architecture in a single 53-hour autonomous run with minimal human intervention.<br>\nThe evolutionary search repeatedly uncovered three fundamental co-design principles:<br>\n- Conditional Routing over Conditional Arithmetic: Replacing separate, expensive conditional arithmetic blocks for every execution branch with inexpensive controlled SWAP gates that route selected data through a single shared, uncontrolled arithmetic block.<br>\n- Branch Decoding from Evolving Arithmetic State: Eliminating massive qubit history stacks by decoding intermediate branch choices directly from mathematical invariants present in the updated arithmetic registers during the uncomputation pass.<br>\n- Bounded Resource Allocation via Failure Budgets: Allocating history stack space and loop bounds to match typical inputs rather than worst-case limits, permitting a controlled failure rate (ε ~ 10-4) to save hundreds of ancilla qubits.<br>\nModular Inversion, Formal Proofs, and DQI Decoding<br>\nIn the eighth task—prime-field modular inversion for elliptic-curve cryptography—the framework discovered a new reversible architecture for divsteps, a classical constant-time modular inversion algorithm previously considered unusable in quantum circuits due to history storage overhead. Rather than storing full branch histories, the AI derived a 2-adic mathematical formula that extracts intermediate branch choices directly from the updated registers, verifying the proof in the Lean theorem prover. By decoding 87.6% of ambiguous branch decisions and storing only 12.4% on a 60-qubit stack, the circuit established a new Pareto frontier for fault-tolerant point addition.<br>\nFor the Hermitian code Decoded quantum interferometry (DQI) decoder (>9,100x savings), the AI replaced raw null-space matrix storage with an in-place Lanczos recurrence and a striped phase scan, dropping the peak qubit count from 190,000 to 2,395 and Toffoli gates from 100 million to 930,000. For Reed–Solomon decoders, switching from the extended Euclidean algorithm to Berlekamp–Massey decoding delivered a 12x reduction in Toffoli gates.<br>\nReview Yuval Boger’s post on LinkedIn here, examine the research feature on Anthropic Research here,and inspect the technical manuscript on arXiv here.<\/p>","content_hash":"37ea9edf82919f468abee814a83cc50f","author":"Mohamed Abdel-Kareem","published_at":"2026-10-17T10:28:31","fetched_at":"2026-10-19 18:16:29","word_count":732,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"757f8404b7a364f1","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47759","title":"MIT Physicists Use First-Principles AI to Resolve Non-Abelian Anyon Order at Strong Landau Level Mixing","url":"https://quantumcomputingreport.com/mit-physicists-use-first-principles-ai-to-resolve-non-abelian-anyon-order-at-strong-landau-level-mixing/","summary":"MIT researchers used a specialized self-attention neural network to solve complex equations related to quantum particles, confirming the existence of anti-Pfaffian topological states. This breakthrough provides a roadmap for building noise-resistant topological qubits in materials like monolayer WSe2 and semiconductor quantum wells. The post MIT Physicists Use First-Principles AI to Resolve Non-Abelian Anyon Order at Strong Landau Level Mixing appeared first on Quantum Computing Report.","content":"<p>In a research study published on arXiv, physicists at the Massachusetts Institute of Technology (MIT)—Pierre-Antoine Graham, Ahmed Abouelkomsan, and Liang Fu—have demonstrated the first complete, non-perturbative solution of the non-Abelian fractional quantum Hall (FQH) problem across all Landau levels.<br>\nDetailed in the paper (“Non-Abelian quantum Hall states at strong Landau level mixing: finding anyons with first-principles AI“), the team deployed a self-attention neural network wave function (MagNet) to solve the continuous real-space Hamiltonian for spin-polarized electrons at filling factor ν = 3/2, identifying the anti-Pfaffian as the ground-state topological order under realistic inter-level mixing.<br>\n| [ Summary of Neural Network VMC Benchmark Results (ν = 3/2 FQH State) ] |  |  | <br>\n|---|---|---|<br>\n| Parameter / Metric | NN-VMC Result | Physical Significance | <br>\n| • Variational Energy (κ = 1.0) | • 5.75 ℏωc (NN) vs 6.08 ℏωc (ED) | • Substantially lower energy achieved by capturing inter-level mixing. | <br>\n| • Ground-State Degeneracy | • 6-fold (N = 18) / 2-fold (N = 21) | • Matches theoretical non-Abelian torus topology for even/odd particles. | <br>\n| • Anyon Quantum Dimension (da) | • dσ = √2 (ΔSn = log√2) | • First-principles proof of Ising-type non-Abelian anyons. | <br>\n| • Candidate State Overlap | • Anti-Pfaffian > Pfaffian >> PH-Pfaffian | • Anti-Pfaffian favored across all mixing scales κ ∈ [0.5, 5.0]. | <br>\n| • Phase Boundary Transition | • κ = 20.0 | • Non-Abelian liquid melts into a triangular Wigner crystal. | <br>\nOvercoming the 30-Year Landau Level Mixing Bottleneck<br>\nNon-Abelian anyons in even-denominator FQH states (such as ν = 5/2 or ν = 3/2) host non-local degenerate ground states suitable for fault-tolerant topological quantum computation. However, identifying whether the ground state is a Moore–Read Pfaffian, an anti-Pfaffian, or a particle-hole (PH) Pfaffian has remained contentious. Conventional numerical exact diagonalization (ED) truncates calculations to a single Landau level, failing when Coulomb interactions create strong Landau level mixing (κ = U / ℏωc ≥ 1).<br>\nTo solve this without approximations, the MIT team developed a momentum-resolved extension of their MagNet neural network ansatz:<br>\n- Continuous Real-Space Architecture: The network parametrizes many-body electron orbitals using multi-head self-attention and multilayer perceptrons, enforcing exact magnetic boundary conditions on a torus while summing center-of-mass magnetic translations to isolate specific momentum sectors.<br>\n- First-Principles Anyon Extraction: Minimally Entangled State (MES) analysis over noncontractible torus cuts revealed that two of the six degenerate ground states exhibit an excess Rényi entanglement entropy of ΔSn = log√2, proving the emergence of non-Abelian Ising anyons (dσ = √2) without inputting prior topological assumptions.<br>\n- Anti-Pfaffian Dominance: Overlap calculations across mixing parameters up to κ = 5 confirmed that breaking particle-hole symmetry through Landau level mixing consistently favors the anti-Pfaffian topological order over the Pfaffian and PH-Pfaffian.<br>\n- Landau Level Depletion & Wigner Crystallization: The model revealed that strong mixing depletes electron occupations in both the lowest (n = 0) and first-excited (n = 1) Landau levels, transferring weight into n ≥ 2 levels. At extreme mixing (κ = 20), the pair correlation function g(r) develops crystalline peaks, tracking the transition from a non-Abelian Hall liquid to a Wigner crystal.<br>\nThe findings provide direct theoretical guidance for ongoing non-Abelian experiments in monolayer WSe2, ZnO, and wide GaAs quantum wells where strong Landau level mixing dominates.<br>\nWhat This Means (In Plain English)<br>\nTopological quantum computers aim to store and process information using “non-Abelian anyons”—exotic quantum quasiparticles whose braided movements naturally shield quantum information from environmental noise and decoherence. For over three decades, theoretical physicists predicted these particles should exist in two-dimensional electron liquids under strong magnetic fields. However, proving exactly which quantum state nature prefers remained an open question because classical supercomputers could not handle the mathematical complexity of electrons jumping between energy levels (a phenomenon known as Landau level mixing). By using a specialized self-attention neural network, the MIT team solved these complex continuous equations from first principles without pre-programmed physics assumptions. Their AI model proved that realistic energy-level mixing favors a specific topological state called the anti-Pfaffian, confirming the presence of Ising-type non-Abelian anyons and providing a clear computational roadmap for building noise-resistant topological qubits in materials like monolayer WSe2 and semiconductor quantum wells.<br>\nReview Ahmed Abouelkomsan’s summary on LinkedIn here and inspect the technical manuscript on arXiv here.<\/p>","content_hash":"9d46d9f4d5476b27ec5921e4757a2404","author":"Mohamed Abdel-Kareem","published_at":"2026-10-17T09:57:46","fetched_at":"2026-10-19 18:16:29","word_count":719,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"db32e39bab962569","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47755","title":"D-Wave Demonstrates 3D Analog-Digital Quantum Simulation of Higher-Order Topological Insulators Using 728 Qubits","url":"https://quantumcomputingreport.com/d-wave-demonstrates-3d-analog-digital-quantum-simulation-of-higher-order-topological-insulators-using-728-qubits/","summary":"D-Wave has successfully demonstrated 3D analog-digital quantum simulation of higher-order topological insulators using up to 728 qubits on an Advantage2 superconducting quantum annealing processor. This achievement, detailed in a research study on arXiv, involved new analog-digital quantum control protocols to measure localized boundary modes and extract 3D bulk topological invariants. This breakthrough confirms the utility of analog-digital quantum annealing hardware as a programmable simulator","content":null,"content_hash":"f735bc765c584d6fd770c503c6d8e982","author":"Mohamed Abdel-Kareem","published_at":"2026-10-17T09:18:12","fetched_at":"2026-10-19 18:16:29","word_count":64,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"74f26371e48bd4d3","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47749","title":"Open Quantum Launches Native Qrisp Integration for High-Level QPU Execution Across IonQ, Rigetti, IQM, and AQT Hardware","url":"https://quantumcomputingreport.com/open-quantum-launches-native-qrisp-integration-for-high-level-qpu-execution-across-ionq-rigetti-iqm-and-aqt-hardware/","summary":"Open Quantum has launched a native Qrisp integration, enabling high-level QPU execution across IonQ, Rigetti, IQM, and AQT hardware. This allows developers to compile and execute Qrisp programs directly on physical QPUs without writing vendor-specific gate-level code. The integration simplifies quantum programming by providing software-engineering abstractions, automated qubit allocation, and memory management. The post Open Quantum Launches Native Qrisp Integration for High-Level QPU Execution ","content":null,"content_hash":"f6b1802b73192b12d002f86f83f33737","author":"Mohamed Abdel-Kareem","published_at":"2026-10-17T08:56:59","fetched_at":"2026-10-19 18:16:29","word_count":64,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"76ecde478aeea85d","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47745","title":"Chalmers Next Labs, ConScience, and NQFF Validate Superconducting Qubit Chip Stability Across International Testbeds","url":"https://quantumcomputingreport.com/chalmers-next-labs-conscience-and-nqff-validate-superconducting-qubit-chip-stability-across-international-testbeds/","summary":"A joint study by Chalmers Next Labs AB, ConScience AB, and Singapore’s National Quantum Federated Foundry (NQFF) validated the stability of a superconducting quantum processor (QiB1) when transported between international research facilities. The study, conducted under the WACQT–NQFF Twin Testbed initiative, confirmed that environmental changes between Gothenburg and Singapore did not degrade the processor’s performance. This collaboration is now being commercialized as a standardized cross-faci","content":null,"content_hash":"db98bdaa939da620a823156e70f343c6","author":"Mohamed Abdel-Kareem","published_at":"2026-10-17T08:22:29","fetched_at":"2026-10-19 18:16:29","word_count":65,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"ebdfa091886ba011","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47740","title":"MIT Bengaluru Inaugurates Q-HUB@MAHE and Deploys QuantrolOx’s Open-Architecture VIDYAQAR Quantum System","url":"https://quantumcomputingreport.com/mit-bengaluru-inaugurates-q-hubmahe-and-deploys-quantroloxs-open-architecture-vidyaqar-quantum-system/","summary":"Manipal Institute of Technology (MIT Bengaluru) has inaugurated the Manipal House of Quantum (Q-HUB@MAHE) in Bengaluru, India, on October 13, 2026. This facility features QuantrolOx’s VIDYAQAR open-architecture quantum system, a 25-qubit-capable dilution refrigeration platform that is part of a national roadmap to scale to over 1,000 qubits. The initiative aims to train 100 quantum engineers by December 2026 and allows researchers to test and benchmark quantum components using custom Python work","content":"<p>Manipal Institute of Technology (MIT Bengaluru), a constituent unit of the Manipal Academy of Higher Education (MAHE), has officially inaugurated the Manipal House of Quantum (Quantum-Hub@MAHE) in Bengaluru, India. Operating as the technical centerpiece of the new facility, quantum control automation company QuantrolOx has brought its VIDYAQAR open-architecture quantum system live to support hardware experimentation, component benchmarking, and workforce development under India’s National Quantum Mission.<br>\nI. Inauguration of Q-HUB@MAHE and Indo-European Hardware Consortium<br>\nOfficially inaugurated on October 13, 2026, by Chief Guest Dr. Sridhar Vembu (Chief Scientist & Co-Founder, Zoho Corp) and Dr. Marcus Rommel (CTO, ConScience), the Q-HUB facility operationalizes a multi-vendor consortium formalizing Memorandums of Agreement between QuantrolOx (Finland), Bluefors (Finland), Qblox (Netherlands), and ConScience (Sweden) to build open quantum infrastructure in India.<br>\nThe facility commences operations with a 25-qubit-capable dilution refrigeration platform, representing Phase 1 of a structured national roadmap that targets scaling to 150-qubit proof-of-concept platforms and ultimately industrial-grade systems exceeding 1,000 qubits. To address global quantum workforce shortages, the initiative aims to train 100 quantum engineers by December 2026, following hands-on technical training completed by MAHE faculty and students at QuantrolOx’s testing facilities at QuTech and the House of Quantum in Delft.<br>\nII. VIDYAQAR System Architecture and Component Automation<br>\nAt the core of Q-HUB is QuantrolOx’s VIDYAQAR platform, designed to solve vendor lock-in by providing a fully open, modular quantum computing testbed. Engineers and researchers can test, replace, and benchmark individual sub-assemblies—ranging from QPUs and parametric amplifiers to cryogenic cabling and control electronics—using custom Python workflows via the Quantum EDGE SDK.<br>\n| [ QuantrolOx VIDYAQAR System Specifications & Consortium Architecture ] |  |  | <br>\n|---|---|---|<br>\n| Hardware / Software Layer | Integrated Partner Components | Operational Capabilities & Roadmap | <br>\n| • Quantum Processor (QPU) | • ConScience QiB2 Superconducting QPU | • 7-qubit versatile chip designed for exploring multi-qubit coupling architectures. | <br>\n| • Cryogenic Infrastructure | • Bluefors LD 400 Dilution Refrigerator | • 25-qubit capable open-architecture sub-kelvin measurement system. | <br>\n| • Control Electronics | • Qblox Cluster Modular Quantum Control | • Modular, scalable microwave and pulse-generation instrumentation. | <br>\n| • Automation Software | • QuantrolOx Quantum EDGE™ + SDK | • Automated bring-up, characterization, tuning workflows, and Quantum EDGE Academy. | <br>\nBy pairing automated QPU bring-up and characterization software with interchangeable hardware layers, VIDYAQAR allows researchers to prototype indigenous quantum components while executing one-click calibration workflows. The live deployment builds upon QuantrolOx and MAHE’s initial Q-HUB partnership, complements QuantrolOx’s 5-year QPU industrialization partnership with UC Berkeley, and expands on QuantrolOx and QURECA’s Quantum EDGE Academy workforce initiative.<br>\nReview the launch update on LinkedIn here, inspect MAHE’s event announcement on LinkedIn here, read the press release via PR Newswire India here, and examine the full platform brochure on Google Drive here.<\/p>","content_hash":"32df6d7025c8e3047712ba600a8633cd","author":"Mohamed Abdel-Kareem","published_at":"2026-10-17T08:08:29","fetched_at":"2026-10-19 18:16:30","word_count":466,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2d","domain":"quantumcomputingreport.com"},{"id":"a69bbd6432e3c76d","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10201","title":"Podcasts about the Topic","url":"https://scottaaronson.blog/?p=10201","summary":"&#8220;The Topic&#8221; being, of course, the Mathocalypse, except sometimes with AI alignment and even quantum computing and complexity theory and other stuff thrown in. With Ryan Peterman: Notably, near the end of the above podcast, you can watch my live reaction to the news that an Anthropic model found algorithms for the 3SUM and the All-Pairs-Shortest-Path problems beating records that stood for generations&#8212;news that hadn&#8217;t yet reached me when I woke up and logged in. (If you do","content":"<p>Podcasts about the Topic<br>\n“The Topic” being, of course, the Mathocalypse, except sometimes with AI alignment and even quantum computing and complexity theory and other stuff thrown in.<br>\nNotably, near the end of the above podcast, you can watch my live reaction to the news that an Anthropic model found algorithms for the 3SUM and the All-Pairs-Shortest-Path problems beating records that stood for generations—news that hadn’t yet reached me when I woke up and logged in. (If you don’t feel like watching, my reaction is basically: “uh, wow … if I hadn’t been so overstuffed with delicacies right now from history’s biggest math breakthrough buffet, I’d surely be giving this one the individual amazement that it deserves…”)<br>\nAnd here’s with “Modern CTO”, on a similar set of topics:<br>\nOh, and a third one: MTS podcast with Theo Jaffee.<br>\nEnjoy, and thanks to the hosts of these podcasts!<br>\nUpdate (Oct. 19): There’s been a rapid-fire recent sequence of AI-assisted improvements to my 2016 result with Adam Yedidia, showing that the 8000th Busy Beaver number eludes the axioms of set theory. I haven’t even kept track of all of them, but the very latest, by friend-of-the-blog Elliot Glazer, shows that the value of BB(230) is independent of ZFC (see here for explanation).<\/p>","content_hash":"d51500ad2a891fb9e93bf15d7bbc87bd","author":"Scott","published_at":"2026-10-13T20:26:33","fetched_at":"2026-10-19 18:16:22","word_count":210,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5d","domain":"scottaaronson.blog"},{"id":"0502808c63cba635","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18293","title":"The Quantum Omelette Problem: How Much Energy Belongs to the Yolk?","url":"https://quantumfrontiers.com/2026/10/11/the-quantum-omelette-problem-how-much-energy-belongs-to-the-yolk/","summary":"The National Egg Coordination Committee created one of India’s longest-running ad campaigns. Its jingle was impossibly catchy. Nearly everyone from my parents’ generation onward seems to remember it: “Sunday or Monday, eat eggs every day.” My mum took this advice rather seriously. On weekdays, we ate boiled eggs for breakfast. Sundays, however, were omelette days. Our ritual was always the same. Each of us siblings announced how many eggs we wanted as we streamed into the kitchen. My mum cracked","content":"<p>The National Egg Coordination Committee created one of India’s longest-running ad campaigns. Its jingle was impossibly catchy. Nearly everyone from my parents’ generation onward seems to remember it:<br>\n“Sunday or Monday, eat eggs every day.”<br>\nMy mum took this advice rather seriously. On weekdays, we ate boiled eggs for breakfast. Sundays, however, were omelette days.<br>\nOur ritual was always the same. Each of us siblings announced how many eggs we wanted as we streamed into the kitchen. My mum cracked the eggs into a shiny steel bowl, added our chosen mix-ins, and whisked them together. The yolks, whites, salt, and chili powder quickly disappeared into one speckled mixture. She poured it into a hot, oiled pan, where it hissed and sizzled before sliding onto our plates.<br>\nThe omelettes were soft, spicy, and gone within minutes.<br>\nMy diet is now plant-based, but the nostalgia of those Sunday-morning breakfasts remains strong—the steel bowl, the sizzling pan, and all of us gathered around the table, waiting eagerly for the omelettes to arrive.<br>\nOur weekday boiled eggs and Sunday omelettes offer a useful contrast. In a boiled egg, the yolk and white remain distinguishable. In an omelette, they are mixed and transformed. Some properties—texture, flavor, and structure—belong to the finished mixture rather than to either component separately.<br>\nWhen two parts interact strongly, which properties still belong to the parts, and which belong only to the whole?<br>\nThis question appears across science whenever interacting parts become difficult to describe independently. In quantum thermodynamics, it becomes a question of energy. Picture a small quantum system, an atom, say, surrounded by a much larger environment. The total energy of the setup comes from three sources: the atom, the environment, and their interaction.<br>\nWhen the atom barely interacts with its surroundings, separating the energy contributions is easy. The interaction energy is small enough to ignore, and we can speak cleanly of the atom’s energy and the environment’s. When the interaction is strong, however, that shared energy can no longer be brushed aside, making it difficult to decide how much belongs to the atom and how much to its surroundings.<br>\nFor a large object, interactions with the environment typically occur at the surface, while most of its energy is associated with the much larger bulk. As an object grows, the surface becomes less important compared to its volume, so the interaction energy can often be ignored. But this reasoning breaks down for very small objects, where surface effects remain significant, or for systems whose interactions extend through the bulk, allowing interaction energy to scale with volume.<br>\nSuch strong interactions are not limited to tiny systems; they also appear across condensed matter, nuclear, and high-energy physics. Lattice gauge theories provide one important example: their particles and fields are tied together by interactions and local constraints, making it especially difficult to draw a clean boundary around one part and declare, “This energy belongs here.”<br>\nIn all these cases, the energy of the whole may be perfectly clear. The challenge, however, is deciding how to divide that energy among pieces that are no longer truly separate.<br>\nThat brings us to a deceptively simple question: How should we define the internal energy of a strongly interacting system?<br>\nDefinitions in physics do more than attach names to things. They tell us what counts as a system, which quantities can be measured, and how mathematical ideas connect to experiments. A useful definition must do more than sound reasonable: it should recover familiar results in familiar situations and remain consistent with the laws of physics. When two plausible definitions lead to different conclusions, the choice between them cannot be settled by language alone.<br>\nConsider the internal energy of a system. When a system is strongly coupled to its surroundings, some of the total energy is stored in the interaction, and several reasonable ways of assigning that shared energy become possible. But which definition of internal energy is consistent with thermodynamics? This is the question I explored with my collaborators Zohreh Davoudi, Christopher Jarzynski, Niklas Mueller, Connor Powers, and Nicole Yunger Halpern.<br>\nPhysicists describe a system’s energy using a mathematical object called a Hamiltonian. In our recent paper, we consider three ways of defining the internal energy of a strongly coupled system.<br>\nDefinition 1: Subtract the environment<br>\nStart with the total energy of the system-environment composite, then subtract the energy the environment would have on its own at the same temperature. Whatever remains, including the interaction energy, is assigned to the system.<br>\nDefinition 2: Include the environment’s influence <br>\nRather than separating the interaction energy by hand, describe the system’s energy using a modified Hamiltonian that captures how the interaction energy affects the system’s energy at equilibrium. Physicists call this the Hamiltonian of mean force.<br>\nDefinition 3: Account for temperature as well<br>\nThe Hamiltonian of mean force depends on temperature. The third definition takes this dependence into account when calculating the system’s internal energy.<br>\nAll three definitions have appeared in the literature on strong-coupling thermodynamics, each offering a seemingly reasonable way to account for the environment’s influence on the system. We wanted to find out whether choosing one definition over another would change how we describe the same physical process.<br>\nTo test the three definitions, my collaborators and I considered a sudden quench—the physicist’s term for changing something in the setup almost instantaneously. Imagine rapidly turning a knob that controls the system, perhaps by suddenly switching on a magnetic field. We can also suddenly change how strongly the system interacts with its surroundings, effectively turning the interaction between them on or off. Either change happens so quickly that the system and its environment have no time to respond: their states remain constant during that instant. Yet the system’s internal energy can change because the rules governing it have changed. Since this energy change results from deliberate external control, we call it work.<br>\nAfter the quench, the knob is left alone. The system then evolves under the new, fixed conditions and exchanges energy with its environment. This later change in the system’s internal energy is called heat.<br>\nSeparating the process into two stages makes it easier to tell work and heat apart: work enters during the sudden, controlled change, while heat flows during the evolution that follows. It is a little like whisking an egg first and then placing it on a hot pan, rather than trying to whisk and cook it at the same time.<br>\nOnce we have chosen a definition of a system’s internal energy, we can ask how that energy changes during any thermodynamic process. The first law of thermodynamics tells us that the change in internal energy must be accounted for by work and heat ,<br>\nThe first law is essentially a statement of energy conservation. It tells us that any change in the system’s internal energy must be accounted for: the energy must have entered as work, as heat, or as some combination of the two.<br>\nBut here is the catch. Each of the three definitions of internal energy comes with its own corresponding definitions of work and heat. If we change what we mean by , we also change how we split that energy change into and . For each of the three choices, however, the definitions are constructed so that work and heat add up to the total change in internal energy. All three therefore satisfy the first law.<br>\nAt first, this seems reassuring. Perhaps any of the three definitions will do.<br>\nTo decide whether all three internal energy definitions are truly acceptable, we need a stricter test: the second law. The first law tells us that energy must be conserved, but it does not tell us which direction a process will naturally take. The second law supplies that direction. An egg can be whisked and cooked into an omelette, but an omelette left on the plate will not
