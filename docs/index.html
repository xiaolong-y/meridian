their import statements accordingly, using from qiskit.circuit.library import ... instead of from qiskit.extensions import ... .<br>\n- UCPauliRotGate,- UCRXGate,- UCRYGate,- UCRZGate,- UnitaryGate,- HamiltonianGate,- Initialize<br>\nThe following qiskit.extensions classes have been deprecated, due to them being similar to existing functionality elsewhere:<br>\n- SingleQubitUnitaryand- Snapshot<br>\nAdditionally, the following QuantumCircuit methods have been deprecated as part of this change:<br>\n- .isometry(), .- snapshot(),- .ucrx(),- .ucry(),- .ucrz(),- .squ(),- .diagonal()and- .hamiltonian()<br>\nUnroller transpiler pass<br>\nThe Unroller pass has been deprecated due to its functionality being superseded by the BasisTranslator pass, which can be used in a wider range of use cases than was possible with the Unroller pass.<br>\nFor users currently using the Unroller pass, we recommended updating your code to use a custom pass manager with the BasisTranslator pass. For example:<br>\nfrom qiskit.transpiler import PassManager<br>\nfrom qiskit.transpiler.passes import UnrollCustomDefinitions, BasisTranslator<br>\nfrom qiskit.circuit.equivalence_library import SessionEquivalenceLibrary as sel<br>\ncircuit = YOUR_CIRCUIT<br>\nbasis_gates = YOUR_BASIS_GATE_LIST<br>\npm = PassManager(<br>\n [<br>\n   UnrollCustomDefinitions(sel, basis_gates=basis_gates),<br>\n   BasisTranslator(sel, target_basis=basis_gates),<br>\n ]<br>\n)<br>\npm.run(circuit)In addition, as part of this deprecation, the use of the unroller value for the translation_method argument in the transpile() function is also deprecated. Users should use the default translator option instead. So, instead of transpile(qc, backend, translation_method=\"unroller\", ...) , users can use transpile(qc, backend, ...) .<br>\nbind_parameters()<br>\nThe functionality of assign_parameters() is the same as that of bind_parameters() , so we’ve made the decision to deprecate bind_parameters() in an effort to clean up the Qiskit codebase. Users should update their code to use assign_parameters() instead of bind_parameters() going forward.<br>\nDuplicated circuit gate methods<br>\nThere are certain QuantumCircuit methods that apply the same gate as another existing method, so duplicated gate methods have been deprecated, and going forward only one gate method will exist for each gate. The following methods are being deprecated by this change:<br>\n- .i()is deprecated; users should use- .id()instead<br>\n- .cnot()is deprecated; users should use- .cx()instead<br>\n- .toffoli()is deprecated; users should use- .ccx()instead<br>\n- .mct()is deprecated; users should use- .mcx()instead<br>\n- .fredkin()is deprecated; users should use- .cswap()instead<br>\nBreaking changes<br>\nIn this section we’ll highlight any changes that could cause user’s existing code to break when updating to this latest version, such as deprecated classes/functions that have now been removed.<br>\nDeprecated code from numerous prior releases has been removed<br>\nDue to the upcoming release of Qiskit 1.0, we are doing as much as we can to remove outdated code that has been throwing deprecation warnings for 3 months or more (in line with the removal timeline stipulated in our deprecation policy). In this release we have removed all code that was deprecated in Qiskit (Terra) releases 0.16, 0.19, 0.20 and 0.21. Users who are using deprecated code from these release versions should check the deprecation warnings for information on how to update your code, or consider pinning your Qiskit version to v0.44 or earlier.<br>\nSingleton Gates<br>\nDue to unparameterised and non-controlled gates being refactored to singletons, users will no longer be able to set the label, condition, duration, or unit attributes after instantiating a gate object. Instead users will now only be able to set these attributes as arguments when creating a new gate object, or use the new method .to_mutable() to get a mutable copy of the gate and set the attribute on that copy instead of the original object.<br>\nFor example, the following code will now throw an error:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate()<br>\nxgate.label = \"My X Gate\"Instead, this example could be refactored like so:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate(label=\"My X Gate\")or alternatively:<br>\nfrom qiskit.circuit.library import XGate<br>\nx_gate = XGate().to_mutable()<br>\nxgate.label = \"My X Gate\"And there you have it! The most important details of the latest release. Remember, if you want to put ideas forward for future versions of Qiskit, you can always open a GitHub issue to request a feature or report a bug! And if you want to follow what’s coming up in the next release (as well as releases for other packages in the Qiskit Ecosystem), you can take a look at the Qiskit Release Planning Wiki.<br>\nMany people contributed to this release, special thanks to (in alphabetical order): Abby Mitchell, Abhiraj Shrotriya, Abigail J. Cross, Alexander Ivrii, AlexanderGroeger, Andir16, Aniket Patil, Christopher J. Wood, David McKay, Diego Emilio Serrano, Edwin Navarro, Elena Peña Tapia, Eric Arellano, Erick Winston, Evgenii Zheltonozhskii, Henry Zou, Hunter Kemeny, Ikko Eltociear Ashimine, Ikko Hamamura, Jake Lishman, Jay M. Gambetta, John Lapeyre, Joonghoon Lee, Julien Gacon, Kevin Hartman, Kevin J. Sung, Kyle Lund, Luciano Bello, Mahnoor Fatima, Matthew Treinish, Michał Górny, MozammilQ, Naoki Kanazawa, Paul Nation, Pieter Eendebak, Raghav, Raynel Sanchez, Ryuhei Yoshida, SamD-1998, Santhosh G S, Simone Gasperini, Takashi Imamichi, Toshinari Itoko, TsafrirA, Will Shanks, adigaboy, atharva-satpute, danielleodigie, jaeunkim, rht<\/p>","content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-07-29 02:10:21","word_count":1976,"read_time_minutes":10,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"142w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":"<p>Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics<br>\nBy Zhiding Liang, Jinglei Cheng, and Hanrui Wang<br>\nThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?<br>\nTraditionally, researchers approach VQAs at the gate-level. More specifically, they focus on the design of a type of quantum circuit structure known as the “ansatz,” which serves as a kind of template for the quantum state that we believe is close to the solution of the problem at hand. The challenge with this approach is that gate-level quantum circuits have a lot of redundancies and inefficiencies that limit the execution of intricate quantum algorithms on the noisy quantum computing hardware we have today. Fortunately, there’s a new kid on the block who could very well open up a world of possibilities for running VQA algorithms on near-term quantum hardware. It’s called the Parameterized Quantum Pulse Circuit.<br>\nIn this blog post, we will showcase how to use a tool from the Qiskit Ecosystem called Qiskit Dynamics to simulate the parameterized quantum pulse circuits, with a focus on the variational quantum eigensolver (VQE) algorithm. More specifically, we will demonstrate the Pulse ansatz on near-term superconducting hardware by using part of the PAN [1] algorithm, implementing a pulse-based ansatz for estimating the H2 molecule’s ground state energy.<br>\nPulse programming in Qiskit<br>\nOne of the useful features of Qiskit is that it gives us a lot of flexibility. Most Qiskit users focus on gate-level operations. However, when we’re working with transmon qubits in superconducting hardware, we know the quantum system executes qubit operations by firing microwave pulses at the qubits. Qiskit provides both gate-level and pulse-level programming capabilities, allowing us to get much more creative with how we approach algorithms like VQE.<br>\nWithin Qiskit’s Pulse programming, users can customize pulse shapes for transmon qubits, adjusting parameters like amplitude, phase, shape, and frequency. (Check the Qiskit Pulse module for more details.) Users can also use the Qiskit Ecosystem project Qiskit Dynamics to quickly and efficiently simulate the generated pulse schedules.<br>\nPulse circuits offer much more versatility than gate-level programming, but they come at the cost of precision, leading to potential uncertainties in the resulting unitary matrix. This precision is crucial for non-variational algorithms that demand exact rotations and operations. However, in variational quantum algorithms, the primary goal is to approximate a specific quantum state, not to achieve perfect accuracy. Experiments in previous research — VQP [2] and Pan [1] by Liang, Zhiding, et al., and [3] by Egger, Daniel J, et al. — confirm that shorter circuit latency pulses can effectively achieve these outcomes on IBM hardware via pulse access with both quantum machine learning (QML) and quantum chemistry tasks, such as running the VQE algorithm.<br>\nVariational Quantum Eigensolver<br>\nThe Variational Quantum Eigensolver (VQE) is a prominent example of variational quantum algorithms. A comprehensive review of its methods and best practices can be found in the VQE documentation provided in Qiskit. Distinct from conventional quantum algorithms that require fault-tolerant quantum computers for proper execution, VQE can be tailored for efficient operations on our current generation of noisy quantum devices.<br>\nWhen using the typical gate-level approach, we begin the process of using a VQE algorithm by expressing a system’s Hamiltonian with weighted Pauli matrices, which we can translate into quantum circuits. Next, we deploy an ansatz, essentially a quantum circuit with tunable parameters, to prepare the ground eigenstate of the Hamiltonian. Further measurement of this eigenstate gives us the Hamiltonian’s ground state energy. The power of VQE lies in its iterative nature. It employs classical optimization techniques to adjust the ansatz parameters, minimizing the Hamiltonian’s expectation value and thereby approximating the system’s lowest energy state.<br>\nDifferent ansatz structures have been proposed, from hardware-efficient models to the UCCSD, and each possesses its own advantages and challenges. Some researchers have even proposed a search-based algorithm, the QuantumNAS [4], to simplify the process of finding the best ansatz. As quantum computing continues to advance, VQE remains a popular area of focus, with ongoing studies exploring innovative ansatz structures and optimization strategies to enhance its precision and applicability.<br>\nBefore diving into pulse-level VQE, let’s quickly recap the traditional gate-level approach:<br>\n- In gate-level VQE, the parameters we deal with are the angles of rotation gates.<br>\n- The ansatz, or the quantum circuit that approximates the desired quantum state, is composed of these parameterized gates (e.g. rotation gates) and fixed gates.<br>\n- The primary objective is to tweak these parameters such that the quantum state closely approximates the lowest energy state.<br>\nNow, let’s look at how pulse-level VQE differs from the usual approach:<br>\n- Instead of focusing on gate-level parameters, pulse-level VQE shifts attention to the parameters of quantum pulses.<br>\n- These quantum pulses are essentially microwave pulses that act directly on superconducting quantum qubits.<br>\n- By directly controlling the quantum pulses, we can significantly reduce circuit latency.<br>\nWhy Pulse-Level VQE?<br>\nYou might be wondering, “why should I bother with pulse-level VQE when the gate-level approach already exists?” Here are some compelling reasons:<br>\n- Expands the Design Space. Working with pulses allows us to potentially access areas of the Hilbert space that are inaccessible with a CNOT-based circuit decomposition. For example, leakage outside of the computational sub-space may allow the variational algorithm to take short-cuts.<br>\n- Lowers calibration cost. One of the challenges with quantum gates is calibration. With pulse-level VQE, the lack of calibration is automatically addressed as the parameters are updated to mitigate these errors. For example, quantum pulses can sometimes suffer from issues like overrotation and underrotation. Pulse-level VQE inherently corrects these errors by adjusting the parameters to find the optimal quantum state.<br>\n- Reduces Latency. By directly controlling the quantum pulses, the need for intermediate gate operations is reduced, leading to faster quantum computations.<br>\nHow to build parameterized pulse circuits in Qiskit<br>\nTo construct a pulse schedule, we can use the built-in functionality offered by Qiskit Pulse. This allows us to exercise control over the parameters in the quantum pulses, and extract the corresponding pulses from gates.<br>\nFor instance, let’s generate a bell state pulse schedule by directly obtaining the corresponding pulses from the gate-level circuit.<br>\nfrom qiskit import QuantumCircuit, pulse<br>\nfrom qiskit_dynamics.backend import DynamicsBackend<br>\nqc_test = QuantumCircuit(2)<br>\nqc_test.h(0)<br>\nqc_test.cx(0,1)<br>\nqc_test.measure_all()<br>\nwith pulse.build(backend) as pulse_test:<br>\n  pulse.call(qc_test)<br>\npulse_test.draw()We can visualize the pulse schedule as follows:<br>\nFurthermore, we can build parameterized quantum pulse circuits (see example code below). Here, we use the drag pulse shape from a single qubit gate, since drag pulse is the native pulse in IBM’s superconducting quantum machines. By using drag pulses, we can avoid population leaking outside of the computational subspace. However, we can also build a parameterized pulse from scratch depending on our needs.<br>\nfrom qiskit.pulse import Schedule, GaussianSquare, Drag, Delay, Play, ControlChannel, DriveChannel<br>\ndef drag_pulse(backend, amp, angle):<br>\n  backend_defaults = backend.defaults()<br>\n  inst_sched_map = backend_defaults.instruction_schedule_map<br>\n  x_pulse = inst_sched_map.get(‘x’, (0)).filter(channels = [DriveChannel(0)], instruction_types=[Play]).instructions[0][1].pulse<br>\n  duration_parameter = x_pulse.parameters[‘duration’]<br>\n  sigma_parameter = x_pulse.parameters[‘sigma’]<br>\n  beta_parameter = x_pulse.parameters[‘beta’]<br>\n  pulse1 = Drag(duration=duration_parameter, sigma=sigma_parameter, beta=beta_parameter, amp=amp, angle=angle)<br>\n  return pulse1How to simulate the pulse circuit with Qiskit Dynamics<br>\nTo run the pulse circuit using Qiskit Dynamics, first we need to initialize Qiskit Dynamics itself.<br>\nfrom qiskit_dynamics import Solver, DynamicsBackend<br>\nfrom qiskit_dynamics.backend import default_experiment_result_function<br>\nfrom qiskit_dynamics.array import Array<br>\nimport jax<br>\nfrom qiskit.providers.fake_provider import *<br>\ngate_backend = FakeManila()<br>\ngate_backend.configuration().hamiltonian[‘qub’] = {‘0’: 2,’1': 2,’2': 2,’3': 2,’4': 2}<br>\njax.config.update(“jax_enable_x64”, True)<br>\njax.config.update(“jax_platform_name”, “cpu”)<br>\nArray.set_default_backend(“jax”)<br>\npulse_backend = DynamicsBackend.from_backend(gate_backend, evaluation_mode=”sparse”)<br>\nsolver_options = {“method”: “jax_odeint”, “atol”: 1e-6, “rtol”: 1e-8}<br>\npulse_backend.set_options(solver_options=solver_options)<br>\npulse_backend.configuration = lambda: gate_backend.configuration()After the initialization, let’s try to run the pulse_test (the Bell state circuit we showed in the last section) on Qiskit Dynamics.<br>\nresults = pulse_backend.run(pulse_test).result()<br>\ncounts = results.get_counts()Pulse based VQE for Ground State Energy of H2<br>\nWe will now perform ground state energy estimation for the H2 molecule using our Pulse-based VQE. We’ll need to start with the following preprocessing steps:<br>\n- Use ‘sto-3g’ Gaussian equations to fit the spin orbital of the H2 molecule with bond length equals 0.735.<br>\n- Through the Fermionic mapping, we get the Pauli strings and corresponding coefficients that describe the problem. Based on these Pauli strings, we can generate the observable layer for the VQE algorithm.<br>\nfrom qiskit_nature.units import DistanceUnit<br>\nfrom qiskit_nature.second_q.drivers import PySCFDriver<br>\nfrom qiskit_nature.second_q.mappers import JordanWignerMapper,ParityMapper,QubitConverter<br>\nimport numpy as np<br>\nsimplified_h2_molecule = \"\"\"<br>\nH 0.0 0.0 0.0<br>\nH 0.0 0.0 0.735<br>\n\"\"\"<br>\ndriver = PySCFDriver(<br>\n  atom=ultra_simplified_ala_string.strip(),basis='sto3g',<br>\n  charge=0,<br>\n  spin=0,<br>\n  unit=DistanceUnit.ANGSTROM<br>\n)<br>\nqmolecule = driver.run()We define the VQE and build our own custom pulse ansatz. Then we can use the Qiskit Dynamics module to obtain the results of the estimated energy of H2. (For more details regarding implementation based on the PAN [1] algorithm, please refer to this pulse-level VQE tool based on Qiskit-Pulse and Qiskit-Dynamics.)<br>\ndef vqe(params,pauli_dict,pulse_backend, backend,n_qubit,n_shot):<br>\n  print(“params in def chemistry in vqe.py: “, params)<br>\n  # assert(len(params)%2==0)<br>\n  width_len = int(len(params)-1*(n_qubit-1))<br>\n  split_ind = int(width_len/2)<br>\n  amp = np.array(params[:split_ind])<br>\n  angle = np.array(params[split_ind:width_len])*np.pi*2<br>\n  width_1 = (np.array(params[width_len:]))<br>\n  num_items = (1024–256) // 16 + 1<br>\n  width_norm = (width_1–256) / (1024–256)<br>\n  width_norm = np.clip(width_norm, 0, 1)<br>\n  width = (np.round(width_norm * (num_items — 1)) * 16 + 256).astype(int)<br>\n  amp = amp.tolist()<br>\n  angle = angle.tolist()<br>\n  width = width.tolist()<br>\n  keys = [key for key in pauli_dict]<br>\n  values = [pauli_dict[key] for key in pauli_dict]<br>\n  expect_values = []<br>\n  for key, value in zip(keys, values):<br>\n    prepulse = HE_pulse(backend, amp, angle, width)<br>\n    expect = vqe_one(prepulse, n_qubit, n_shot, pulse_backend, backend, key, value)<br>\n    expect_values.append(expect)<br>\n  print(“E for cur_iter: “,sum(expect_values))<br>\n  return sum(expect_values)Here is a plot showing the convergence of estimated energy while training pulse-based VQE for the H2 molecule.<br>\nConclusion<br>\nPulse-level VQE offers a promising avenue for quantum optimization. By shifting the focus from gate-level parameters to quantum pulse parameters, we can address several challenges inherent in quantum computing, such as calibration and rotation errors.<br>\nWe hope this blog post provides you with a deeper understanding of pulse-level VQE and its advantages. Stay tuned for more insights into the fascinating world of quantum computing!<br>\nReferences<br>\n[1] Liang, Zhiding, et al. “Pan: Pulse ansatz on nisq machines.” arXiv preprint arXiv:2208.01215 (2022).<br>\n[2] Liang, Zhiding, et al. “Variational quantum pulse learning.” 2022 IEEE International Conference on Quantum Computing and Engineering (QCE). IEEE, 2022.<br>\n[3] Egger, Daniel J, et al. “Pulse variational quantum eigensolver on cross-resonance-based hardware.” PhysRevResearch.5.033159. American Physical Society (2023).<br>\n[4] Wang, Hanrui, et al. “Quantumnas: Noise-adaptive search for robust quantum circuits.” 2022 IEEE International Symposium on High-Performance Computer Architecture (HPCA). IEEE, 2022.<\/p>","content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-07-29 02:10:22","word_count":1754,"read_time_minutes":9,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"142w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":"<p>Sitemap<br>\nOpen in app<br>\nSign up<br>\nSign in<br>\nMedium Logo<br>\nGet app<br>\nWrite<br>\nSearch<br>\nSign up<br>\nSign in<\/p>","content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-07-29 02:10:24","word_count":18,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"143w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":"<p>Important changes to Qiskit documentation and learning resources<br>\nToday, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.<br>\nQiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made since Qiskit’s inception. However, it has been challenging to maintain Qiskit documentation and educational resources in their current form. We’ve also received lots of user feedback that these resources needed to be consolidated and better-organized to make Qiskit easier to use on real quantum hardware. Our hope is that the community will no longer need to jump between scattered, disjointed resources to develop quantum programs.<br>\nThat’s why we’re migrating Qiskit educational resources and documentation into the IBM Quantum Platform — to offer a more unified experience for users. Our eventual plan is to sunset all of the content on Qiskit.org and move it to the IBM Quantum Platform.<br>\nIBM Quantum is committed to open-source software development and education, so none of the old content is going away. Community-built content, such as the Qiskit Textbook, will be handed off to the community and remain available on GitHub.<br>\nThings will look a little different — so let’s walk you through the changes.<br>\nQiskit Documentation<br>\nQiskit and Qiskit Runtime documentation are moving to https://docs.quantum-computing.ibm.com/<br>\nThis migration is ongoing, with content due to be fully removed from Qiskit.org by the end of the year. Qiskit.org/documentation and qiskit.org/ecosystem/ibm-runtime/ will go away and redirect to https://docs.quantum-computing.ibm.com.<br>\nDocs will also be structured differently. Instead of API reference, tutorials, how-to guides and explanations, the content will be split into the following sections (to support natural workflows):<br>\n- Install: Begin using our tools and platforms with install and setup instructions.<br>\n- Build: Design and develop quantum circuits with primitives and advanced methods like dynamic circuits and mid-circuit measurements. You can also find our circuit library here.<br>\n- Verify: Validate and evaluate your quantum circuits.<br>\n- Run: Run on our hardware with job configuration options such as sessions.<br>\n- API reference: Find API references for Qiskit, Qiskit Runtime IBM Client, Qiskit IBM Runtime Rest API, and Qiskit IBM Provider in the API reference drop-down menu above. You can also find the Error code registry here.<br>\nUsers will have two ways to submit feedback and report bugs. For non API ref content, they should report issues/feedback in https://github.com/Qiskit/documentation/issues/new/choose. For any user interface-related issues, click the feedback button.<br>\nQiskit and Runtime docs will remain open source, and we still welcome community feedback and contributions to documentation. The translations program will also continue. We are currently working to define a robust process to facilitate contributions, so we are temporarily pausing contribution reviews until the content migration is complete. More details to come.<br>\nQiskit Textbook<br>\nStarting today, the following courses will redirect to the new learning app:<br>\n- Basics of quantum information, with John Watrous<br>\n- Fundamentals of quantum algorithms, with John Watrous<br>\n- Variational algorithm design<br>\n- Qiskit tutorials<br>\nWe invite you to explore IBM Quantum Learning to read these courses and explore the new Quantum-Safe Cryptographycourse. Over the next few months, we’re planning more free courses to help you learn foundations of quantum information, and experiment with Qiskit Runtime and IBM Quantum.<br>\nWe will sunset the textbook and the syllabus creation tool on November 29, 2023. Legacy textbook pages will remain available through a public archive on Github. Once archived, this content will not be maintained by IBMers, and new external contributions will not be accepted. We understand that the textbook is a much-beloved resource, and you’ll still be able to stand up the textbook locally with the instructions in the README.<br>\nWhy we’re making this change<br>\nMoving docs and learning resources will bring things closer to the same platform that developers, researchers, and students use every day for running actual workloads on quantum systems. Now, they’ll be able to find all of their resources in one, easy-to-navigate place.<br>\nIBM Quantum Platform will now be the home for all education, from the basics of quantum computing and programming with Qiskit to experimenting and prototyping with Qiskit Runtime on IBM Quantum systems. We’ll continue to develop this content in the open to promote trust and transparency within the quantum community, but moving it to the IBM Quantum Platform will help to ensure the quality of this content continues to be high as possible.<br>\nWe’re excited about this change, and hope that the result will be a seamless quantum computing experience for everyone. We look forward to building together.<\/p>","content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-07-29 02:10:24","word_count":789,"read_time_minutes":4,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"144w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":"<p>A guide to the Qiskit circuit library<br>\nBy Robert Davis, Julien Gacon, Abby Mitchell, and Luciano Bello<br>\nWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the process) by simply using circuits that already exist. That’s just one reason why we created the Qiskit circuit library.<br>\nThe Qiskit circuit library is a collection of valuable, well-studied circuits and gates that Qiskit users can easily plug into their quantum circuits. These include useful tools for a wide array of quantum computing applications—including quantum machine learning, quantum chemistry, circuits for benchmarking, and even a number of circuits that are hard to simulate classically. Whether you’re a complete beginner or a bona fide Qiskit wizard, we’re sure you’ll find something useful in our extensive circuit library module.<br>\nWhy every Qiskit user should give the circuit library a closer look<br>\nBefore we launched the circuit library a few years ago, users could only run quantum circuits they had constructed manually. If a user wanted to implement a phase estimation, a Fourier transform, or a variational circuit—really anything at all—they either had to build it themselves, or build a function that generated the circuit for them. In either case, the process was cumbersome, and documentation was limited and disorganized.<br>\nAs the Qiskit community began to grow, we developed a clearer sense of which circuits were most important to users. Eventually, we began to organize these into the circuit library we have today. This library is designed to be a repository of building blocks—a collection of any and all circuits we think are valuable to users. Here, we define “valuable” circuits as those that are either (1) widely used for common quantum computing tasks, (2) difficult to simulate classically, or (3) useful for quantum hardware benchmarking.<br>\nFor example, the quantum Fourier transform (QFT) is an essential building block in a number of quantum algorithms including quantum phase estimation and the famous Shor’s algorithm. Now, if they really want to, a user can certainly run a QFT on quantum hardware by building the circuit manually. That might look something like this:<br>\nimport numpy as np<br>\nfrom qiskit import QuantumCircuit<br>\ndef build_qft(n):<br>\n   circuit = QuantumCircuit(n)<br>\n   for j in reversed(range(n)):<br>\n       circuit.h(j)<br>\n       for k in reversed(range(j)):<br>\n           circuit.cp(np.pi * 2. ** (k - j), j, k)<br>\n   for j in range(n // 2):<br>\n       circuit.swap(j, n - j - 1)<br>\n   return circuit<br>\nqft = build_qft(5)But users who want to save time on this common quantum computing task can simply import the QFT from the circuit library and use it in their subroutines like so:<br>\nfrom qiskit.circuit.library import QFT<br>\nqft = QFT(5)Most Qiskit users are aware the circuit library exists, but not everyone realizes just how useful it can be. That’s why we suggest all users spend time familiarizing themselves with it. The circuit library provides essential tools for building quantum algorithms, and gives users the ability to write programs at a higher level of abstraction. Gates and other elements found in the circuit library are developed so that users can easily plug them into their own quantum circuits using the QuantumCircuit.append() method, meaning users shouldn’t need to concern themselves with the lower level details of how those elements actually work.<br>\nThe circuit library also provides tools that help users investigate properties of the quantum system itself, such as measuring quantum volume, and it offers useful information about the gates and circuits we use most often. It really is a library in the truest sense—in many cases; documentation for gates and other objects include links to a paper detailing the theory upon which they’re based.<br>\nNow, let’s take a look at some of the different kinds of circuits and gates that users will find in the Qiskit Circuit Library.<br>\nVariational quantum circuits (“N-local circuits”)<br>\nThe N-local circuits sub-module of the circuit library contains a selection of subclasses that serve as parameterized models in variational algorithms, such as the variational quantum eigensolver (VQE) algorithm and the quantum approximate optimization algorithm (QAOA).<br>\nIn fields like chemistry and physics, these algorithms serve to approximate wave functions efficiently, which is a task that is generally hard for classical computers. Variational algorithms are also useful for problems in classical optimization and machine learning, where a quantum computer might enable a better optimization of the objective.<br>\nLet’s take a look at an example of how to define a problem instance for a VQE algorithm, using the EfficientSU2 ansatz circuit taken from the circuit library. In this example, we’ll derive our Hamiltonian from a quantum chemistry problem:<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nhamiltonian = SparsePauliOp.from_list(<br>\n    [(\"YZ\", 0.3980), (\"ZI\", -0.3980), (\"ZZ\", -0.0113), (\"XX\", 0.1810)]<br>\n)As mentioned above, our choice of ansatz is the EfficientSU2 circuit. By default, the EfficientSU2 circuit linearly entangles qubits. This makes it ideal for use in quantum hardware with limited connectivity:<br>\nfrom qiskit.circuit.library import EfficientSU2<br>\nansatz = EfficientSU2(hamiltonian.num_qubits)<br>\nansatz.draw(\"mpl\")Here’s what the circuit looks like:<br>\nTry printing with the following code to see how the circuit is structured!<br>\nBased on the previous figure, we know that our ansatz circuit is defined by a vector of parameters, θi, with the total number given by:<br>\nnum_params = ansatz.num_parameters<br>\nprint(num_params)And in this case we get the output:<br>\n16For an example on how to use the circuit library to run a VQE, see: https://qiskit.org/ecosystem/algorithms/tutorials/01_algorithms_introduction.html<br>\nData encoding circuits<br>\nData encoding circuits enable the preparation of input data for QML applications. There are several techniques to encode classical data, or features, into a quantum state, for example:<br>\n- Amplitude encoding: Encode the features into the amplitude of a basis state. This allows to store 2^nnumbers in a single state, but can be costly to implement<br>\n- Basis encoding: Encode an integer kby preparing the corresponding basis state|k><br>\n- Angle encoding: Encode features as rotation angles in a variational quantum circuit<br>\nDeciding which of these approaches is best really depends upon the specifics of your application. On current quantum computers, however, we often use angle encoding.<br>\nOne example is the ZZFeatureMap found in the circuit library:<br>\nfrom qiskit.circuit.library import ZZFeatureMap<br>\nfeature = [0.2, 0.4, 0.8]<br>\nfeature_map = ZZFeatureMap(feature_dimension=len(feature))<br>\nencoded = feature_map.assign_parameters(feature)<br>\nencoded.draw('mpl')which prints<br>\nTry printing with the following code to see how the circuit is structured!<br>\nencoded.decompose().draw('mpl')For an example of how to use data encoding circuits for classication, see: https://qiskit.org/ecosystem/machine-learning/tutorials/02_neural_network_classifier_and_regressor.html.<br>\nTime evolution circuits<br>\nTime evolution circuits allow us to evolve a quantum state in time. Physics researchers make use of them for a wide-array of applications, including investigations of thermalization properties or potential phase transitions of a system. Time evolution circuits are also a fundamental building block of chemistry wave functions—e.g., for unitary coupled-cluster trial states—and of the QAOA algorithm we use for optimization problems.<br>\nfrom qiskit.circuit.library import PauliEvolutionGate<br>\nfrom qiskit.circuit import QuantumCircuit<br>\nfrom qiskit.quantum_info import SparsePauliOp<br>\nhamiltonian = SparsePauliOp([\"ZZI\", \"IZZ\"])<br>\n# prepare an initial state with a Hamadard on the middle qubit<br>\nstate = QuantumCircuit(3)<br>\nstate.h(1)<br>\nevolution = PauliEvolutionGate(hamiltonian, time=1)<br>\n# evolve state by appending the evolution gate<br>\nstate.append(evolution)<br>\nstate.draw('mpl')And in this case we get the output:<br>\nBenchmarking and complexity theory circuits<br>\nBenchmarking and complexity theory circuits are a vital tool for anyone working with quantum computers. They give us a sense of how well our hardware is actually working, and the true level of computational complexity involved in the problems we want to solve.<br>\nOne of the most important examples of this is the QuantumVolume circuit, which allows us to quantify the largest random circuit of equal width and depth that a near-term quantum computer of relatively modest size can successfully implement. This single metric can help us understand how well the quantum computer is doing in terms of fidelity of operations, qubit connectivity, gate set calibration, and circuit rewiring tool chains.<br>\nA quantum volume model circuit comprises layers of Haar random elements of SU(4) applied between corresponding pairs of qubits in a random bipartition. Here’s an example of a quantum volume circuit built in Qiskit that runs on four qubits:<br>\nfrom qiskit.circuit.library import QuantumVolume<br>\nqv = QuantumVolume(4)<br>\nqv.decompose().decompose().draw('mpl')Some quantum circuits have been shown to deliver advantage over classical algorithms. Many readers will already be familiar with some of the more famous examples of these circuits, which include Shor’s algorithm for prime factorizationand the Grover search algorithm.<br>\nThe circuit library contains circuits that are conjectured to be hard to simulate classically, such as the IQP circuit. (Learn more about the IQP circuit here.)<br>\nIt also contains building blocks for algorithms that are believed to provide quantum advantage. Some of these are of a more practical nature. For example, Qiskit users can build the circuit for Grover’s algorithm by using GroverOperator.<br>\nOthers are of more theoretical interest. For example, Fourier checking uses the FourierChecking method. (Click here to learn more about Fourier checking.)<br>\nLet’s take a look at an example of the IQP circuit:<br>\nfrom qiskit.circuit.library import IQP<br>\ninteractions = [[6, 5, 3], [5, 4, 5], [3, 5, 1]]<br>\ncircuit = IQP(interactions)<br>\ncircuit.decompose().draw(\"mpl\")Arithmetic circuits<br>\nSome users may be surprised to learn that the circuit library includes numerous quantum circuits that are designed to perform classical arithmetic operations on qubit states or state amplitudes, such as addition or multiplication. These are useful for applications like amplitude estimation, which have the potential to be valuable in finance applications, and in algorithms like HHL, which is a proposed method for solving linear systems of equations.<br>\nAs an example, let’s try adding two 3-bit-long numbers, using a ripple-carry circuit to perform in-place addition (CDKMRippleCarryAdder). This adder take two numbers—A and B—then it adds them, and “sets” B with the result. In this example, A=2 and B=3:<br>\nfrom qiskit.circuit.library import CDKMRippleCarryAdder<br>\nadder = CDKMRippleCarryAdder(3)  # Create an adder of 3-bit-long numbers<br>\nfrom qiskit import QuantumCircuit, QuantumRegister, ClassicalRegister<br>\n# Create the number A=2<br>\nreg_a = QuantumRegister(3, 'a')<br>\nnumber_a = QuantumCircuit(reg_a)<br>\nnumber_a.initialize('010') # number 2 - equivalent to format(2, '03b')<br>\n# Create the number B=3<br>\nreg_b = QuantumRegister(3, 'b')<br>\nnumber_b = QuantumCircuit(reg_b)<br>\nnumber_b.initialize('011')  # number 3 - equivalent to format(3, '03b')<br>\n# Create a circuit to hold everything, including a classical register to put the result<br>\nreg_result = ClassicalRegister(3)<br>\ncircuit = QuantumCircuit(*adder.qregs, reg_result)<br>\n# Compose setting A and B with the adder. Measure the result in B<br>\ncircuit = circuit.compose(number_a, qubits=reg_a).compose(number_b, qubits=reg_b).compose(adder)<br>\ncircuit.measure(reg_b, reg_result)<br>\ncircuit.draw('mpl')By calling the sampler in qiskit.primitives.Sampler, it is possible to simulate the execution of this circuit and observe that the result is 5.<br>\nfrom qiskit.primitives import Sampler<br>\nresult = Sampler().run(circuit).result()<br>\nprint(result.quasi_dists[0].keys())dict_keys([5])Standard gates<br>\nThe Standard Gates section of the Qiskit Circuit Library is a foundational toolbox for building up a wide array of quantum circuits—from the humble X Gate all the way to more complex multi-controlled rotation gates.<br>\nUsers can add standard gates to their circuits by calling the gates as methods—e.g., circuit.x(3) will append an X Gate to the qubit 3. That's the most common way to use them. With that being said, this is still an incredibly useful section of the circuit library, and of our documentation in general, as it provides some very useful information about the matrices underlying these gates.<br>\nLet’s take a look at an example of how to append a multi-controlled CNOT to an existing quantum circuit, using the circuit library as a reference. In the following example we are constructing a multi-controlled X Gate (MCXGate) with 4 control qubits from the circuit library and applying it to a quantum circuit, specifying the control qubits are at indices 0,1,2 and 4:<br>\nfrom qiskit import QuantumCircuit<br>\nfrom qiskit.circuit.library import MCXGate<br>\n# create circuit<br>\ncircuit = QuantumCircuit(5)<br>\n# initialise MCX gate with 4 control qubits<br>\ngate = MCXGate(4)<br>\n# append gate to circuit, specifying qubit indices<br>\ncircuit.append(gate, [0, 1, 4, 2, 3])<br>\ncircuit.draw('mpl')The resulting quantum circuit looks like this:<br>\nAnd here’s an example of how we would transpile that to a quantum backend:<br>\nfrom qiskit import transpile<br>\nfrom qiskit.providers.fake_provider import FakeTokyo<br>\nbackend = FakeTokyo()<br>\ntranspiled = transpile(circuit, backend)<br>\ntranspiled.draw('mpl', idle_wires=False)Other interesting circuits<br>\nThis article only scratches the surface in terms of describing the many, many different types of circuits that are available in the Qiskit Circuit Library. Some other notable examples include the quantum Fourier transform (QFT), which is an essential subroutine in many algorithms, PhaseOracle, which implements the oracles used in grover search, and multi-control multi-target gate (MCMT), which makes it possible to (for example) implement an X gate acting on two qubits and controlled by three others.<br>\nBe sure to head over to the Qiskit Circuit Library to learn more about how to put these resources to use in your research.<\/p>","content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-07-29 02:10:25","word_count":2123,"read_time_minutes":11,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"146w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"6e4ef277469f70b8","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44624","title":"QTREX Quantum Partners with Northeastern University to Advance Cryogenic Interconnects","url":"https://quantumcomputingreport.com/qtrex-quantum-partners-with-northeastern-university-to-advance-cryogenic-interconnects/","summary":"Israel-based hardware developer QTREX Quantum Ltd. (Nasdaq: QTEX) has launched a research collaboration with Northeastern University to develop advanced micro-system structures for cryogenic quantum interconnects. Pursuant to the agreement, Northeastern grants QTREX a first option to negotiate a commercial license for all sole or jointly developed intellectual property arising directly from the joint research. Led [...] The post QTREX Quantum Partners with Northeastern University to Advance Cryo","content":"<p>Israel-based hardware developer QTREX Quantum Ltd. (Nasdaq: QTEX) has launched a research collaboration with Northeastern University to develop advanced micro-system structures for cryogenic quantum interconnects. Pursuant to the agreement, Northeastern grants QTREX a first option to negotiate a commercial license for all sole or jointly developed intellectual property arising directly from the joint research. Led by Prof. Benyamin Davaji, the effort pairs Northeastern’s Quantum Materials and Sensing Institute with QTREX’s Additively Manufactured Electronics (AME) platform to expand the company’s vertically integrated quantum connectivity pipeline.<br>\nThe research program focuses on evaluating three-dimensional additively manufactured micro-system structures and interconnect geometries designed to withstand sub-Kelvin operational conditions inside dilution cryostats. Joint engineering teams will characterize conductive, dielectric, and superconducting materials under cryogenic thresholds to ensure low thermal dissipation and signal integrity. By leveraging micron-scale additive deposition, the initiative aims to address a critical hardware bottleneck in scaling quantum processors: replacing traditional bulky, hand-assembled coaxial wiring harnesses with high-density, three-dimensional routing channels printed directly into monolithic structural interfaces.<br>\nThe collaboration builds on QTREX’s recent operational pivot from legacy medical technology toward advanced quantum packaging and defense electronics. Following its recent fabrication of a single-build AME cryogenic chip carrier and an Israel Innovation Authority grant for custom RF dielectric substrates, this university partnership establishes a structured pathway to translate academic micro-system research into commercialized quantum hardware.<br>\nReview the official corporate press release on GlobeNewswire here, and explore our previous coverage of the QTREX Cryogenic AME Chip Carrier here and IIA Cryogenic Material Grant here.<br>\nJuly 27, 2026<\/p>","content_hash":"3ac8ddd61ecd55364e71491e410948d0","author":"Mohamed Abdel-Kareem","published_at":"2026-07-27T15:39:04","fetched_at":"2026-07-29 02:10:16","word_count":252,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"6eea72cd53b78f2a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44619","title":"AT&T Expands D-Wave Partnership to Optimize Telecom Network Operations and Agentic AI","url":"https://quantumcomputingreport.com/att-expands-d-wave-partnership-to-optimize-telecom-network-operations-and-agentic-ai/","summary":"Telecommunications leader AT&amp;T (NYSE: T) has signed a commercial agreement with D-Wave Quantum Inc. (NASDAQ: QBTS) to expand its use of quantum annealing technology across its network infrastructure operations. Building on initial pilot benchmarks—where D-Wave's quantum annealing hardware reduced a network optimization processing workload from one hour down to under 15 seconds—AT&amp;T plans to integrate [...] The post AT&#038;T Expands D-Wave Partnership to Optimize Telecom Network Operatio","content":"<p>Telecommunications leader AT&T (NYSE: T) has signed a commercial agreement with D-Wave Quantum Inc. (NASDAQ: QBTS) to expand its use of quantum annealing technology across its network infrastructure operations. Building on initial pilot benchmarks—where D-Wave’s quantum annealing hardware reduced a network optimization processing workload from one hour down to under 15 seconds—AT&T plans to integrate quantum optimization into its operational tooling, including its deployment of agentic artificial intelligence (AI) systems.<br>\nIntegrating Quantum Annealing into Agentic AI Workflows<br>\nAT&T’s network management architecture increasingly relies on autonomous agentic AI tools to handle high-intensity operational tasks, such as outage detection, automated fault isolation, and incident mitigation. In 2025 alone, these automated systems helped reduce total customer downtime by 12 million hours. Under the expanded agreement, AT&T will layer D-Wave’s quantum annealing capabilities directly into these agentic workflows to handle combinatorial optimization bottlenecks that challenge classical compute clusters:<br>\n- Outage Detection and Response: Accelerating real-time re-routing and power distribution decisions during unexpected physical fiber cuts or weather disruptions.<br>\n- Field Technician Routing: Optimizing dispatch schedules and route planning for field operations across dense urban and rural service zones.<br>\n- Traffic Management and Capacity Planning: Managing dynamic bandwidth allocation across converged 5G and fiber networks as AI-driven data demand scales up.<br>\n- Network Build Planning: Improving physical layout calculations and capital expenditure efficiency for infrastructure expansion.<br>\nMulti-Platform Strategy and Future Gate-Model Applications<br>\nBeyond current annealing deployments via the Leap™ quantum cloud platform, AT&T is evaluating D-Wave’s accelerated gate-model development pipeline for future network security and quantum communications infrastructure. Following D-Wave’s recent acquisition of Quantum Circuits, Inc. (QCI) and its dual-rail superconducting architecture roadmap, AT&T’s Chief Data Office is exploring how future fault-tolerant systems could support quantum key distribution (QKD) protocols, network encryption, and quantum-resilient communications architectures.<br>\nReview the official corporate press release via the D-Wave Newsroom here, and examine our previous coverage of D-Wave’s Gate-Model Roadmap here and Fortune 100 Commercial Milestones here.<br>\nJuly 27, 2026<\/p>","content_hash":"64514707af63c3e59b3d8566ebff0923","author":"Mohamed Abdel-Kareem","published_at":"2026-07-27T15:29:47","fetched_at":"2026-07-29 02:10:16","word_count":321,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"5b4a6d9fa436625e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18023","title":"Wise guy","url":"https://quantumfrontiers.com/2026/07/26/wise-guy/","summary":"In my closet, in a basket labeled “Random stuff,” sits a bag of quarters. They total only a few dollars, but their worth to me exceeds their monetary value. I received the quarters from Mark Wise. Mark taught a course about the Standard Model of particle physics at my master’s program at the Perimeter Institute for Theoretical Physics, near Toronto. Perimeter borrowed him from Caltech, to whose faculty he belonged. Mark had grown up in Canada and studied at the University of Toronto; so he didn’","content":"<p>In my closet, in a basket labeled “Random stuff,” sits a bag of quarters. They total only a few dollars, but their worth to me exceeds their monetary value. I received the quarters from Mark Wise.<br>\nMark taught a course about the Standard Model of particle physics at my master’s program at the Perimeter Institute for Theoretical Physics, near Toronto. Perimeter borrowed him from Caltech, to whose faculty he belonged. Mark had grown up in Canada and studied at the University of Toronto; so he didn’t mind visiting Canada even in the depths of winter.<br>\nWhat would Mark have minded? He projected a mild manner—an innocuousness—that suited his sense of humor, which he often directed at himself. Mark had a bald patch and glasses, and he wore a mustache. Physics jokes and science-fiction references decorated his T-shirts, one of which he wore beneath a black suit jacket to our first class. His voice was nasal; it grated a little. But I relished listening to Mark’s lectures.<br>\nMark’s lecturing exemplified clarity, because he knew particle physics so deeply. When he walked us through its Lagrangians and scattering diagrams, his conclusions seemed inescapable. His lectures’ logic and structure appealed to me as someone who’s been hyper-organized since at least fourth grade.<br>\nYet Mark cared about us students beyond the requirements of pedagogy. His T-shirts invited conversation from those who arrived to class early. Whenever a student answered or asked a question, he tossed them a quarter. Sometimes, he’d pause to examine the quarter, deliberate about whether to toss a Canadian quarter or an American one, or opine about the motto printed on the coin. (Mark confessed to having lower standards than those ingrained in the New Hampshire state motto, “Live free or die.” Where he came from, “We just wanna live!”)<br>\nSome days, Mark found little change in his pocket and announced that he needed to return to the bank for more quarters. The announcements sounded like complaints. He didn’t need to return to the bank, though, as nobody needs to bring doughnuts to the office for sharing.<br>\nI discovered the icing on the doughnut two years later, as a PhD student at Caltech. I sat in on part of a quantum course taught by Mark. To every student who completed the course, Mark gave a T-shirt that read, “Licensed quantum mechanic.” I received a T-shirt, although I only sat in on part of the course. I’ve never worn it, because I’ve wanted never to wear it out.<br>\nIn 2024 and 2025, I co-taught a course on quantum-steampunk creative writing. Students learned about quantum physics, quantum technologies, and thermodynamics. Quanta are discrete units. For example, a photon is a quantum of energy. I illustrated quanta with coins, which are discrete units of money. From then on, I tossed a quarter to every student who answered or asked a question about quantum physics. (I joked that I should have tossed pennies, the minimal units of money, but chose quarters because inflation had been high recently.) I adapted Mark’s tradition to thermodynamics—the study of energy—by tossing Hershey’s kisses—dense packets of energy.<br>\nBefore moving out of Caltech, I said goodbye to Mark. He worked among the high-energy theorists, rather than the quantum information or condensed-matter theorists, so I had to hunt down his office. He smiled and made a joke, of course.<br>\nMark passed away this summer. His Caltech colleague John Preskill published a eulogy as a blog post here. (I learned from John’s post that inflation led Mark to upgrade his quarters to dollar coins. So much for feeling generous about upgrading from pennies to quarters.) When asked about the student experience at Caltech, Mark would say, “Caltech is heaven for professors.” Irony would creep into his voice and body language as he’d continue, “Doesn’t that mean it’s heaven for students, too?” I worked my rear off as a student at Caltech and Perimeter, but I’d call both environments fairly heavenly. Mark and his ilk are reasons why.<\/p>","content_hash":"29483380dda95046de91af6ee44d08c2","author":"Nicole Yunger Halpern","published_at":"2026-07-27T00:00:10","fetched_at":"2026-07-29 02:10:25","word_count":664,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"2d","domain":"quantumfrontiers.com"},{"id":"79fab1013ed17d6c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44475","title":"Who’s News: Strategic Appointments at Quantum Computing Inc. and Quantinuum","url":"https://quantumcomputingreport.com/whos-news-strategic-appointments-at-quantum-computing-inc-and-quantinuum/","summary":"Quantum Computing Inc. (QCi) has appointed Susan Hunt as Chief Revenue Officer (CRO). Hunt brings over 30 years of experience in enterprise sales and go-to-market execution across AI, cloud computing, and telecommunications, having previously held executive roles at Orbital Insight, Nuance Communications, LivePerson, Salesforce, and Sprint PCS. Concurrently, former CRO Pouya Dianat has transitioned into [...] The post Who’s News: Strategic Appointments at Quantum Computing Inc. and Quantinuum ap","content":"<p>Quantum Computing Inc. (QCi) has appointed Susan Hunt as Chief Revenue Officer (CRO). Hunt brings over 30 years of experience in enterprise sales and go-to-market execution across AI, cloud computing, and telecommunications, having previously held executive roles at Orbital Insight, Nuance Communications, LivePerson, Salesforce, and Sprint PCS. Concurrently, former CRO Pouya Dianat has transitioned into the newly created role of Chief Product Officer (CPO) to direct QCi’s product strategy and manage the commercialization roadmap across its photonics and semiconductor portfolio. The official release is available here.<br>\nQuantinuum has appointed Robin Schulman as Chief Legal Officer (CLO) and Company Secretary, effective July 13, 2026, and Rory O’Byrne as Chief People Officer (CPO), effective May 26, 2026. Both report to President and CEO Dr. Rajeeb Hazra. Schulman previously served as Chief Legal Officer and Head of Corporate Affairs at GitLab, as well as CLO at Couchbase and New Relic. O’Byrne brings over 25 years of human resources experience, most recently serving as Chief People Officer for Advanced Energy. Both appointments support the company’s organizational operations as a publicly listed entity. The complete announcement can be found here.<br>\nWe wish all these organizations and individuals success in their new endeavors.<br>\nJuly 25, 2026<\/p>","content_hash":"705b31c8da67be4f7104e19b5d04449b","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T19:35:53","fetched_at":"2026-07-29 02:10:16","word_count":200,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"d29ed1deccb5a712","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44605","title":"Quantum Elements Launches “Orbit” as Qiskit Function for Automated Error Suppression","url":"https://quantumcomputingreport.com/quantum-elements-launches-orbit-as-qiskit-function-for-automated-error-suppression/","summary":"Quantum software provider Quantum Elements has released Orbit, an advanced error suppression tool accessible as a Qiskit Function in the IBM Qiskit Functions Catalog. Designed to streamline noise management for quantum developers, Orbit provides members of the IBM Quantum Network with an automated, low-overhead suite to improve circuit execution fidelity on live processors. The tool [...] The post Quantum Elements Launches &#8220;Orbit&#8221; as Qiskit Function for Automated Error Suppression ap","content":null,"content_hash":"ab83012164d8eef4efa2a80b526bfcb3","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T19:28:21","fetched_at":"2026-07-29 02:10:17","word_count":70,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"8a364e2d0736e995","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44608","title":"Qedma Integrates QESEM Error Mitigation Software with Quantinuum Platform","url":"https://quantumcomputingreport.com/qedma-integrates-qesem-error-mitigation-software-with-quantinuum-platform/","summary":"Quantum software provider Qedma has announced a technical integration with Quantinuum, making its Quantum Error Suppression and Error Mitigation (QESEM) platform directly available across Quantinuum’s trapped-ion hardware systems. Developed over the past year through Qedma’s role as a founding member of the Quantinuum Startup Partner Program, the integration combines Qedma’s hardware-agnostic noise-reduction algorithms with Quantinuum’s [...] The post Qedma Integrates QESEM Error Mitigation Soft","content":"<p>Quantum software provider Qedma has announced a technical integration with Quantinuum, making its Quantum Error Suppression and Error Mitigation (QESEM) platform directly available across Quantinuum’s trapped-ion hardware systems. Developed over the past year through Qedma’s role as a founding member of the Quantinuum Startup Partner Program, the integration combines Qedma’s hardware-agnostic noise-reduction algorithms with Quantinuum’s high-fidelity quantum CCD (QCCD) architecture. The joint solution aims to enhance circuit accuracy, enabling enterprise and research users to run deeper, more complex quantum workloads across chemistry, materials science, and financial modeling.<br>\nQuantinuum’s systems are widely recognized for achieving high average two-qubit gate fidelities, making them strong candidates for algorithms approaching the limits of classical simulation. However, as quantum circuits scale in depth and qubit count, cumulative hardware noise remains a key constraint for utility-scale applications. The integration of QESEM directly addresses these scaling bottlenecks:<br>\n- Suppression and Mitigation: QESEM applies characterization, transpilation, and unbiased mitigation techniques to reduce error rates in quantum output without adding excessive sampling overhead.<br>\n- Complex Workload Execution: In initial validation runs on Quantinuum hardware, QESEM demonstrated measurable fidelity improvements on complex quantum simulations, allowing researchers to push closer to classical computational boundaries.<br>\n- Seamless Workflow: The integration allows enterprise developers using Quantinuum’s software ecosystem to deploy Qedma’s error mitigation stack directly into their existing job submission pipelines.<br>\nFounded by CEO Dr. Asif Sinay alongside quantum fault-tolerance pioneer Prof. Dorit Aharonov and condensed matter physicist Prof. Netanel Lindner, Qedma focuses on software-driven noise reduction to bridge the gap between noisy intermediate-scale quantum (NISQ) devices and full fault tolerance. For Quantinuum, the alliance reinforces its strategy of pairing its QCCD hardware stack with third-party software tools to accelerate ecosystem adoption and time-to-market for enterprise end-users.<br>\nReview the official integration release on the Qedma Newsroom here.<br>\nJuly 25, 2026<\/p>","content_hash":"d9f2009e17f6ad70d81160ae96d0c0b3","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T19:28:09","fetched_at":"2026-07-29 02:10:17","word_count":297,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"00175c90814dde13","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44600","title":"IQMP and Q-STAR Sign MoU to Connect Illinois and Japanese Quantum Ecosystems","url":"https://quantumcomputingreport.com/iqmp-and-q-star-sign-mou-to-connect-illinois-and-japanese-quantum-ecosystems/","summary":"The Illinois Quantum and Microelectronics Park (IQMP) has signed a Memorandum of Understanding (MoU) with Japan’s Quantum STrategic industry Alliance for Revolution (Q-STAR) to build cross-border commercialization pathways, joint R&amp;D pipelines, and supply chain connections between Japan and Illinois. Signed at the Global Quantum Forum in Chicago by IQMP CEO Harley Johnson and Q-STAR Global [...] The post IQMP and Q-STAR Sign MoU to Connect Illinois and Japanese Quantum Ecosystems appeared fi","content":"<p>The Illinois Quantum and Microelectronics Park (IQMP) has signed a Memorandum of Understanding (MoU) with Japan’s Quantum STrategic industry Alliance for Revolution (Q-STAR) to build cross-border commercialization pathways, joint R&D pipelines, and supply chain connections between Japan and Illinois. Signed at the Global Quantum Forum in Chicago by IQMP CEO Harley Johnson and Q-STAR Global Consortium Alliances Working Group Chair Hirofumi Mori, the agreement establishes a framework for scaling quantum startups, facilitating capital flow, and integrating industrial supply chains between both markets.<br>\nBilateral Commercialization and Supply Chain Integration<br>\nFounded in 2021, Q-STAR represents more than 160 Japanese corporations and institutions—including major industrial enterprises such as Toshiba, NEC, NTT, and Hitachi—alongside early-stage ventures and academic centers. The partnership focuses on four operational collaboration tracks:<br>\n- Capital and Market Access: Connecting Japanese and Illinois-based startups with cross-border venture capital, incubator networks, and non-dilutive government funding.<br>\n- Supply Chain Co-Development: Identifying critical hardware, cryogenic, optical, and fabrication components to strengthen domestic supply chains in both nations.<br>\n- Joint R&D and Enterprise Pilots: Facilitating collaborative research programs between universities, national labs, and enterprise end-users across quantum computing, sensing, and networking.<br>\n- Workforce and Technology Transfer: Exchanging technical expertise and establishing talent pipelines between Japanese industrial leaders and Chicago-area research hubs.<br>\nStrengthening Illinois–Japan Economic Ties<br>\nThe MoU builds on diplomatic and trade momentum between Illinois and Japan. Following executive trade missions—including Governor JB Pritzker’s mission to Japan in late 2024, a Japanese delegation visit to Chicago in mid-2025, and a JETRO-led mission to Tokyo in March 2026—the agreement formalizes institutional channels between Japan’s technology sector and the 128-acre IQMP campus on Chicago’s South Side. Facilitated by the Illinois Economic Development Corporation (ILEDC) and the Illinois Department of Commerce and Economic Opportunity (DCEO), the initiative aims to accelerate the transition of quantum research into deployable commercial applications across both ecosystems.<br>\nReview the official partnership announcement on IQMP here, and review our previous coverage of Q-STAR’s Bilateral Alliances here and the IQMP Campus Groundbreaking here.<br>\nJuly 25, 2026<\/p>","content_hash":"302f1f999a1d328b95d5f436200da081","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T18:42:54","fetched_at":"2026-07-29 02:10:17","word_count":331,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"c8e1f18c25927603","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44593","title":"Infleqtion to Deploy Fault-Tolerant Neutral-Atom Quantum Computer at Illinois Quantum Park","url":"https://quantumcomputingreport.com/infleqtion-to-deploy-fault-tolerant-neutral-atom-quantum-computer-at-illinois-quantum-park/","summary":"Quantum computing and sensing company Infleqtion (NYSE: INFQ) has announced plans to deploy its fault-tolerant, neutral-atom quantum computer—Sqale—at the Illinois Quantum &amp; Microelectronics Park (IQMP) in Chicago, with hardware delivery scheduled for 2027. In parallel, the company opened its new Chicago Quantum Innovation Center, an application development hub that will initially function as a center [...] The post Infleqtion to Deploy Fault-Tolerant Neutral-Atom Quantum Computer at Illinoi","content":"<p>Quantum computing and sensing company Infleqtion (NYSE: INFQ) has announced plans to deploy its fault-tolerant, neutral-atom quantum computer—Sqale—at the Illinois Quantum & Microelectronics Park (IQMP) in Chicago, with hardware delivery scheduled for 2027. In parallel, the company opened its new Chicago Quantum Innovation Center, an application development hub that will initially function as a center of excellence for applying quantum optimization to the U.S. energy grid.<br>\nHardware Architecture: Low-Latency QPU-GPU Coupling<br>\nInfleqtion’s Sqale platform utilizes laser-controlled neutral atoms to execute quantum logic gates. The platform deployed at IQMP is engineered for fault-tolerant operations, targeting an initial demonstration of over 50 logical qubits on a trajectory toward 100 logical qubits, supported by a physical architecture scaling beyond 1,000 physical qubits. Key technical features of the deployed platform include:<br>\n- NVIDIA NVQLink Integration: Integrates direct NVQLink interconnects to enable low-latency, high-bandwidth coupling between Infleqtion’s neutral-atom QPU and GPU-accelerated classical computing clusters, facilitating hybrid quantum-classical workflows.<br>\n- NQAC Access via Superstaq: Users and research institutions will access the system through the National Quantum Algorithm Center (NQAC) using Infleqtion’s flagship Superstaq quantum compilation and optimization software.<br>\nChicago Quantum Innovation Center: Smart Grid Optimization<br>\nThe newly established Chicago Quantum Innovation Center will focus its applied R&D on electrical power grid management, addressing computational bottlenecks caused by rising data center loads and AI power demand. The center’s work is driven in collaboration with the National Quantum Algorithm Center (NQAC) under its inaugural Grand Challenges program. The multidisciplinary project pairs Prof. Fred Chong and researcher Dhirpal Shah at the University of Chicago with Infleqtion (led by CTO Pranav Gokhale), energy provider Constellation Energy, and the Electric Power Research Institute (EPRI).<br>\nKey focus areas spanning grid management and clean energy infrastructure include:<br>\n- Quantum Fuel Loading Optimization (Q-FLO): Developing hybrid quantum-classical algorithms to optimize fuel assembly arrangements in nuclear reactors, maximizing energy yield while adhering to strict regulatory safety limits.<br>\n- Grid Contingency Analysis & Unit Commitment: Modeling real-time power generation scheduling and cascading grid failures so operators can respond to disruptions faster.<br>\n- Next-Generation Materials & Storage: Simulating battery chemistry for denser energy storage and discovering zero-loss superconducting transmission materials.<br>\nThe energy initiative builds on Infleqtion’s active awards, including the ARPA-E-funded ENCODE project and the broader NQAC Grand Challenges program.<br>\nCommercial Scale and Regional Ecosystem Impact<br>\nThe deployment builds on Infleqtion’s operating record in global markets, including its 100-physical-qubit deployment at the U.K. National Quantum Computing Centre (NQCC) and hardware installations in Japan. Following its public listing on the New York Stock Exchange (NYSE: INFQ), Infleqtion’s commitment expands its footprint at the $500 million IQMP campus. By joining anchor tenants such as PsiQuantum and IBM, Infleqtion strengthens Chicago’s position as a global hub for utility-scale quantum hardware and applied algorithm development.<br>\nReview the official corporate press release on the Infleqtion Newsroom here, read the featured story on the IQMP Blog: Solving Energy Challenges with Quantum Algorithms here, and explore our previous QCR coverage of Infleqtion’s $50M Illinois Neutral-Atom Program here, the NQAC Grand Challenges Energy Award with Constellation & EPRI here, Infleqtion’s Neutral-Atom Core Architectural Milestones here, and the IQMP Campus Groundbreaking here.<br>\nJuly 25, 2026<\/p>","content_hash":"48e3a3ba7dbf577daaf77868bf1aa309","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T18:32:34","fetched_at":"2026-07-29 02:10:17","word_count":519,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"a37ccf9821ff3476","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44580","title":"Zero Point Cryogenics and Ability Engineering Technology Anchor IQMP FaQtory in Chicago","url":"https://quantumcomputingreport.com/zero-point-cryogenics-and-ability-engineering-technology-anchor-iqmp-faqtory-in-chicago/","summary":"Following the federal funding rollout for The Bloch Quantum Tech Hub, the Illinois Quantum and Microelectronics Park (IQMP) has secured its first two physical supply-chain tenants: Edmonton-based dilution refrigerator manufacturer Zero Point Cryogenics (ZPC) and Illinois-based precision engineering firm Ability Engineering Technology (AET). Both companies will establish operational footprints at the IQMP FaQtory—a specialized campus [...] The post Zero Point Cryogenics and Ability Engineering Te","content":"<p>Following the federal funding rollout for The Bloch Quantum Tech Hub, the Illinois Quantum and Microelectronics Park (IQMP) has secured its first two physical supply-chain tenants: Edmonton-based dilution refrigerator manufacturer Zero Point Cryogenics (ZPC) and Illinois-based precision engineering firm Ability Engineering Technology (AET). Both companies will establish operational footprints at the IQMP FaQtory—a specialized campus facility designed under The Bloch umbrella to house component suppliers, fabricators, and hardware developers alongside anchor quantum computing firms. Supported by state tax incentive programs, these dual expansions mark the first practical steps toward building a localized Midwest quantum manufacturing supply chain.<br>\n                         [ IQMP FaQtory Tenant Matrix ]<br>\n  Anchor Campus       ──► Illinois Quantum and Microelectronics Park (IQMP, Chicago, IL).<br>\n  Facility Hub        ──► The IQMP FaQtory (Supported by EDA Tech Hubs & State Quantum Funds).<br>\n  Tenant 1 (ZPC)      ──► Zero Point Cryogenics (U.S. Innovation & Service Hub / MICRO Act).<br>\n  Tenant 2 (AET)      ──► Ability Engineering Technology (R&D Satellite Office / EDGE Program).<br>\n  Core Capabilities   ──► Ultra-low-temp dilution fridges, vacuum chambers, & rapid prototyping.Zero Point Cryogenics Establishes First U.S. Hub<br>\nSpun out of low-temperature physics research at the University of Alberta in 2017, Zero Point Cryogenics designs and builds custom “cryogen-free” (dry) dilution refrigerators. These ultra-low-temperature systems are essential infrastructure for superconducting and spin-qubit architectures, keeping physical hardware near absolute zero during operation. Supported by the state’s Manufacturing Illinois Chips for Real Opportunity (MICRO) Act, ZPC will establish its first U.S. location at the IQMP:<br>\n- Operations & Workforce: The Chicago facility will host ZPC’s U.S. research and development, sales, installation, and field service operations, creating over 20 specialized engineering jobs in Illinois.<br>\n- On-Campus Support: ZPC will provide direct maintenance, rapid hardware integration, and technical service to neighboring quantum computing developers and research labs across North America.<br>\n- Global Footprint: While ZPC’s primary manufacturing remains anchored in Alberta, Canada, the Chicago hub serves as its main U.S. service center.<br>\nAbility Engineering Technology Modernizes Operations & IQMP Presence<br>\nPrecision engineering firm Ability Engineering Technology (AET)—headquartered in South Holland, Illinois, since 1947—is expanding its advanced manufacturing footprint through a two-location investment supported by the state’s Economic Development for a Growing Economy (EDGE) program. AET specializes in engineered-to-order process equipment for cryogenic, vacuum, and high-pressure industrial applications:<br>\n- IQMP Satellite Office: AET will open a new R&D satellite office at the IQMP FaQtory focused on rapid prototyping, small-scale fabrication, equipment modification, and workforce training directly alongside quantum hardware developers.<br>\n- South Holland Plant Modernization: In parallel, AET is upgrading its existing 35,000-square-foot manufacturing plant in South Holland with structural improvements, advanced handling cranes, and new workflow machinery.<br>\n- Incentives & Investment: Under the EDGE agreement, AET has committed to investing at least $1.8 million, creating five new full-time positions, and retaining 23 existing manufacturing jobs.<br>\nTranslating Federal Tech Hub Capital into Localized Infrastructure<br>\nThe dual announcements were made by Illinois Governor JB Pritzker during the second annual Global Quantum Forum in Chicago. Backed by $500 million in state funding for the IQMP, $200 million for the Chicago Quantum Exchange (CQE), and federal support from the U.S. EDA Tech Hubs initiative, the addition of ZPC and AET establishes a localized supply chain for custom cryogenic hardware and precision vacuum engineering across the Midwest.<br>\nBy co-locating custom cryogenic hardware makers and precision vacuum engineers directly next door to anchor hardware developers (including IBM, PsiQuantum, Infleqtion, Pasqal, Diraq, and Quantum Machines), the IQMP FaQtory aims to shorten hardware iteration cycles and reduce reliance on overseas component sourcing.<br>\nReview official tenant expansion details on the IQMP News Portal here, explore state executive announcements on the Illinois State Release Portal here, Illinois DCEO Hub here, and Illinois EDC Portal here, examine corporate expansion details via Zero Point Cryogenics here, and explore our previous coverage of the IQMP & CQE State Investments here and the Bloch Tech Hub EDA Federal Funding here.<br>\nJuly 25, 2026<\/p>","content_hash":"1fcf7f94297675121d3bbaf8049a6f29","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T15:14:29","fetched_at":"2026-07-29 02:10:17","word_count":641,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"5a17d4fc47829e60","feed_id":"quantum-computing-report",
