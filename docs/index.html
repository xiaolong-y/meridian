  <title>Meridian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FFFCF0;
      --card: #F2F0E5;
      --text: #2D2B28;
      --dim: #6F6E69;
      --muted: #DAD8CE;
      --up: #66800B;
      --down: #AF3029;
      --accent: #205EA6;
      --spark: #8B5CF6;
      --score: #AD8301;
      --link: #24837B;
      --particle: #24837B;
    }

    html { font-size: 10px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding: 4px;
      min-height: 100vh;
      font-weight: 400;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 4px 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--muted);
    }

    .title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .timestamp { color: var(--dim); font-size: 9px; }

    .dashboard {
      position: relative;
    }

    .card-wrapper {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 2px;
      overflow: hidden;
      /* top, left, width set by JS layout engine */
    }

    .card-wrapper canvas {
      display: block;
      width: 100%;
    }

    .card-wrapper .links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card-wrapper .links a {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      color: transparent;
      text-decoration: none;
      display: block;
    }

    footer {
      margin-top: 8px;
      padding: 6px 4px;
      border-top: 1px solid var(--muted);
      text-align: center;
      color: var(--dim);
      font-size: 7px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .footer-links {
      margin-bottom: 6px;
    }

    .footer-links a {
      margin: 0 4px;
    }

    .ascii-footer {
      margin: 8px auto 4px;
      font-size: 8px;
      line-height: 1.1;
      color: var(--dim);
      opacity: 0.5;
      user-select: none;
      overflow: hidden;
      max-width: 400px;
    }

    .ascii-footer .particle {
      display: inline-block;
      color: var(--particle);
      opacity: 0.4;
    }

    .ascii-footer .meridian-text {
      color: var(--dim);
      letter-spacing: 1px;
    }

    @keyframes particleDrift {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.6; transform: translateY(-1px); }
    }

    .ascii-footer .p1 { animation: particleDrift 3s ease-in-out infinite; }
    .ascii-footer .p2 { animation: particleDrift 3s ease-in-out infinite 0.3s; }
    .ascii-footer .p3 { animation: particleDrift 3s ease-in-out infinite 0.6s; }
    .ascii-footer .p4 { animation: particleDrift 3s ease-in-out infinite 0.9s; }
    .ascii-footer .p5 { animation: particleDrift 3s ease-in-out infinite 1.2s; }
    .ascii-footer .p6 { animation: particleDrift 3s ease-in-out infinite 1.5s; }

    @media (prefers-reduced-motion: reduce) {
      .ascii-footer .particle {
        animation: none;
        opacity: 0.3;
      }
    }

    noscript p {
      text-align: center;
      padding: 20px;
      color: var(--dim);
      font-size: 9px;
    }
  </style>
</head>

"domain":"Quantum Computing Report","time_ago":"1d"},{"id":"5b4a6d9fa436625e","title":"Wise guy","url":"read/5b4a6d9fa436625e.html","score":0,"comments":0,"domain":"Quantum Frontiers (Caltech)","time_ago":"2d"},{"id":"79fab1013ed17d6c","title":"Who’s News: Strategic Appointments at Quantum Computing Inc. and Quantinuum","url":"read/79fab1013ed17d6c.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"3d"},{"id":"d29ed1deccb5a712","title":"Quantum Elements Launches “Orbit” as Qiskit Function for Automated Error Suppression","url":"read/d29ed1deccb5a712.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"3d"},{"id":"8a364e2d0736e995","title":"Qedma Integrates QESEM Error Mitigation Software with Quantinuum Platform","url":"read/8a364e2d0736e995.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"3d"},{"id":"00175c90814dde13","title":"IQMP and Q-STAR Sign MoU to Connect Illinois and Japanese Quantum Ecosystems","url":"read/00175c90814dde13.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"3d"},{"id":"c8e1f18c25927603","title":"Infleqtion to Deploy Fault-Tolerant Neutral-Atom Quantum Computer at Illinois Quantum Park","url":"read/c8e1f18c25927603.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"3d"}]}],"card_order":[{"type":"metric","index":0},{"type":"metric","index":1},{"type":"feed","id":"hn_tech"},{"type":"metric","index":2},{"type":"metric","index":3},{"type":"metric","index":4},{"type":"feed","id":"hn_ai"},{"type":"metric","index":5},{"type":"metric","index":6},{"type":"metric","index":7},{"type":"feed","id":"hn_startups"},{"type":"metric","index":8},{"type":"feed","id":"rss_quantum"}],"rss_entries":[{"id":"6e4ef277469f70b8","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44624","title":"QTREX Quantum Partners with Northeastern University to Advance Cryogenic Interconnects","url":"https://quantumcomputingreport.com/qtrex-quantum-partners-with-northeastern-university-to-advance-cryogenic-interconnects/","summary":"Israel-based hardware developer QTREX Quantum Ltd. (Nasdaq: QTEX) has launched a research collaboration with Northeastern University to develop advanced micro-system structures for cryogenic quantum interconnects. Pursuant to the agreement, Northeastern grants QTREX a first option to negotiate a commercial license for all sole or jointly developed intellectual property arising directly from the joint research. Led [...] The post QTREX Quantum Partners with Northeastern University to Advance Cryo","content":"<p>Israel-based hardware developer QTREX Quantum Ltd. (Nasdaq: QTEX) has launched a research collaboration with Northeastern University to develop advanced micro-system structures for cryogenic quantum interconnects. Pursuant to the agreement, Northeastern grants QTREX a first option to negotiate a commercial license for all sole or jointly developed intellectual property arising directly from the joint research. Led by Prof. Benyamin Davaji, the effort pairs Northeastern’s Quantum Materials and Sensing Institute with QTREX’s Additively Manufactured Electronics (AME) platform to expand the company’s vertically integrated quantum connectivity pipeline.<br>\nThe research program focuses on evaluating three-dimensional additively manufactured micro-system structures and interconnect geometries designed to withstand sub-Kelvin operational conditions inside dilution cryostats. Joint engineering teams will characterize conductive, dielectric, and superconducting materials under cryogenic thresholds to ensure low thermal dissipation and signal integrity. By leveraging micron-scale additive deposition, the initiative aims to address a critical hardware bottleneck in scaling quantum processors: replacing traditional bulky, hand-assembled coaxial wiring harnesses with high-density, three-dimensional routing channels printed directly into monolithic structural interfaces.<br>\nThe collaboration builds on QTREX’s recent operational pivot from legacy medical technology toward advanced quantum packaging and defense electronics. Following its recent fabrication of a single-build AME cryogenic chip carrier and an Israel Innovation Authority grant for custom RF dielectric substrates, this university partnership establishes a structured pathway to translate academic micro-system research into commercialized quantum hardware.<br>\nReview the official corporate press release on GlobeNewswire here, and explore our previous coverage of the QTREX Cryogenic AME Chip Carrier here and IIA Cryogenic Material Grant here.<br>\nJuly 27, 2026<\/p>","content_hash":"3ac8ddd61ecd55364e71491e410948d0","author":"Mohamed Abdel-Kareem","published_at":"2026-07-27T15:39:04","fetched_at":"2026-07-29 02:10:16","word_count":252,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"6eea72cd53b78f2a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44619","title":"AT&T Expands D-Wave Partnership to Optimize Telecom Network Operations and Agentic AI","url":"https://quantumcomputingreport.com/att-expands-d-wave-partnership-to-optimize-telecom-network-operations-and-agentic-ai/","summary":"Telecommunications leader AT&amp;T (NYSE: T) has signed a commercial agreement with D-Wave Quantum Inc. (NASDAQ: QBTS) to expand its use of quantum annealing technology across its network infrastructure operations. Building on initial pilot benchmarks—where D-Wave's quantum annealing hardware reduced a network optimization processing workload from one hour down to under 15 seconds—AT&amp;T plans to integrate [...] The post AT&#038;T Expands D-Wave Partnership to Optimize Telecom Network Operatio","content":"<p>Telecommunications leader AT&T (NYSE: T) has signed a commercial agreement with D-Wave Quantum Inc. (NASDAQ: QBTS) to expand its use of quantum annealing technology across its network infrastructure operations. Building on initial pilot benchmarks—where D-Wave’s quantum annealing hardware reduced a network optimization processing workload from one hour down to under 15 seconds—AT&T plans to integrate quantum optimization into its operational tooling, including its deployment of agentic artificial intelligence (AI) systems.<br>\nIntegrating Quantum Annealing into Agentic AI Workflows<br>\nAT&T’s network management architecture increasingly relies on autonomous agentic AI tools to handle high-intensity operational tasks, such as outage detection, automated fault isolation, and incident mitigation. In 2025 alone, these automated systems helped reduce total customer downtime by 12 million hours. Under the expanded agreement, AT&T will layer D-Wave’s quantum annealing capabilities directly into these agentic workflows to handle combinatorial optimization bottlenecks that challenge classical compute clusters:<br>\n- Outage Detection and Response: Accelerating real-time re-routing and power distribution decisions during unexpected physical fiber cuts or weather disruptions.<br>\n- Field Technician Routing: Optimizing dispatch schedules and route planning for field operations across dense urban and rural service zones.<br>\n- Traffic Management and Capacity Planning: Managing dynamic bandwidth allocation across converged 5G and fiber networks as AI-driven data demand scales up.<br>\n- Network Build Planning: Improving physical layout calculations and capital expenditure efficiency for infrastructure expansion.<br>\nMulti-Platform Strategy and Future Gate-Model Applications<br>\nBeyond current annealing deployments via the Leap™ quantum cloud platform, AT&T is evaluating D-Wave’s accelerated gate-model development pipeline for future network security and quantum communications infrastructure. Following D-Wave’s recent acquisition of Quantum Circuits, Inc. (QCI) and its dual-rail superconducting architecture roadmap, AT&T’s Chief Data Office is exploring how future fault-tolerant systems could support quantum key distribution (QKD) protocols, network encryption, and quantum-resilient communications architectures.<br>\nReview the official corporate press release via the D-Wave Newsroom here, and examine our previous coverage of D-Wave’s Gate-Model Roadmap here and Fortune 100 Commercial Milestones here.<br>\nJuly 27, 2026<\/p>","content_hash":"64514707af63c3e59b3d8566ebff0923","author":"Mohamed Abdel-Kareem","published_at":"2026-07-27T15:29:47","fetched_at":"2026-07-29 02:10:16","word_count":321,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"5b4a6d9fa436625e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18023","title":"Wise guy","url":"https://quantumfrontiers.com/2026/07/26/wise-guy/","summary":"In my closet, in a basket labeled “Random stuff,” sits a bag of quarters. They total only a few dollars, but their worth to me exceeds their monetary value. I received the quarters from Mark Wise. Mark taught a course about the Standard Model of particle physics at my master’s program at the Perimeter Institute for Theoretical Physics, near Toronto. Perimeter borrowed him from Caltech, to whose faculty he belonged. Mark had grown up in Canada and studied at the University of Toronto; so he didn’","content":"<p>In my closet, in a basket labeled “Random stuff,” sits a bag of quarters. They total only a few dollars, but their worth to me exceeds their monetary value. I received the quarters from Mark Wise.<br>\nMark taught a course about the Standard Model of particle physics at my master’s program at the Perimeter Institute for Theoretical Physics, near Toronto. Perimeter borrowed him from Caltech, to whose faculty he belonged. Mark had grown up in Canada and studied at the University of Toronto; so he didn’t mind visiting Canada even in the depths of winter.<br>\nWhat would Mark have minded? He projected a mild manner—an innocuousness—that suited his sense of humor, which he often directed at himself. Mark had a bald patch and glasses, and he wore a mustache. Physics jokes and science-fiction references decorated his T-shirts, one of which he wore beneath a black suit jacket to our first class. His voice was nasal; it grated a little. But I relished listening to Mark’s lectures.<br>\nMark’s lecturing exemplified clarity, because he knew particle physics so deeply. When he walked us through its Lagrangians and scattering diagrams, his conclusions seemed inescapable. His lectures’ logic and structure appealed to me as someone who’s been hyper-organized since at least fourth grade.<br>\nYet Mark cared about us students beyond the requirements of pedagogy. His T-shirts invited conversation from those who arrived to class early. Whenever a student answered or asked a question, he tossed them a quarter. Sometimes, he’d pause to examine the quarter, deliberate about whether to toss a Canadian quarter or an American one, or opine about the motto printed on the coin. (Mark confessed to having lower standards than those ingrained in the New Hampshire state motto, “Live free or die.” Where he came from, “We just wanna live!”)<br>\nSome days, Mark found little change in his pocket and announced that he needed to return to the bank for more quarters. The announcements sounded like complaints. He didn’t need to return to the bank, though, as nobody needs to bring doughnuts to the office for sharing.<br>\nI discovered the icing on the doughnut two years later, as a PhD student at Caltech. I sat in on part of a quantum course taught by Mark. To every student who completed the course, Mark gave a T-shirt that read, “Licensed quantum mechanic.” I received a T-shirt, although I only sat in on part of the course. I’ve never worn it, because I’ve wanted never to wear it out.<br>\nIn 2024 and 2025, I co-taught a course on quantum-steampunk creative writing. Students learned about quantum physics, quantum technologies, and thermodynamics. Quanta are discrete units. For example, a photon is a quantum of energy. I illustrated quanta with coins, which are discrete units of money. From then on, I tossed a quarter to every student who answered or asked a question about quantum physics. (I joked that I should have tossed pennies, the minimal units of money, but chose quarters because inflation had been high recently.) I adapted Mark’s tradition to thermodynamics—the study of energy—by tossing Hershey’s kisses—dense packets of energy.<br>\nBefore moving out of Caltech, I said goodbye to Mark. He worked among the high-energy theorists, rather than the quantum information or condensed-matter theorists, so I had to hunt down his office. He smiled and made a joke, of course.<br>\nMark passed away this summer. His Caltech colleague John Preskill published a eulogy as a blog post here. (I learned from John’s post that inflation led Mark to upgrade his quarters to dollar coins. So much for feeling generous about upgrading from pennies to quarters.) When asked about the student experience at Caltech, Mark would say, “Caltech is heaven for professors.” Irony would creep into his voice and body language as he’d continue, “Doesn’t that mean it’s heaven for students, too?” I worked my rear off as a student at Caltech and Perimeter, but I’d call both environments fairly heavenly. Mark and his ilk are reasons why.<\/p>","content_hash":"29483380dda95046de91af6ee44d08c2","author":"Nicole Yunger Halpern","published_at":"2026-07-27T00:00:10","fetched_at":"2026-07-29 02:10:25","word_count":664,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"2d","domain":"quantumfrontiers.com"},{"id":"79fab1013ed17d6c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44475","title":"Who’s News: Strategic Appointments at Quantum Computing Inc. and Quantinuum","url":"https://quantumcomputingreport.com/whos-news-strategic-appointments-at-quantum-computing-inc-and-quantinuum/","summary":"Quantum Computing Inc. (QCi) has appointed Susan Hunt as Chief Revenue Officer (CRO). Hunt brings over 30 years of experience in enterprise sales and go-to-market execution across AI, cloud computing, and telecommunications, having previously held executive roles at Orbital Insight, Nuance Communications, LivePerson, Salesforce, and Sprint PCS. Concurrently, former CRO Pouya Dianat has transitioned into [...] The post Who’s News: Strategic Appointments at Quantum Computing Inc. and Quantinuum ap","content":"<p>Quantum Computing Inc. (QCi) has appointed Susan Hunt as Chief Revenue Officer (CRO). Hunt brings over 30 years of experience in enterprise sales and go-to-market execution across AI, cloud computing, and telecommunications, having previously held executive roles at Orbital Insight, Nuance Communications, LivePerson, Salesforce, and Sprint PCS. Concurrently, former CRO Pouya Dianat has transitioned into the newly created role of Chief Product Officer (CPO) to direct QCi’s product strategy and manage the commercialization roadmap across its photonics and semiconductor portfolio. The official release is available here.<br>\nQuantinuum has appointed Robin Schulman as Chief Legal Officer (CLO) and Company Secretary, effective July 13, 2026, and Rory O’Byrne as Chief People Officer (CPO), effective May 26, 2026. Both report to President and CEO Dr. Rajeeb Hazra. Schulman previously served as Chief Legal Officer and Head of Corporate Affairs at GitLab, as well as CLO at Couchbase and New Relic. O’Byrne brings over 25 years of human resources experience, most recently serving as Chief People Officer for Advanced Energy. Both appointments support the company’s organizational operations as a publicly listed entity. The complete announcement can be found here.<br>\nWe wish all these organizations and individuals success in their new endeavors.<br>\nJuly 25, 2026<\/p>","content_hash":"705b31c8da67be4f7104e19b5d04449b","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T19:35:53","fetched_at":"2026-07-29 02:10:16","word_count":200,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"d29ed1deccb5a712","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44605","title":"Quantum Elements Launches “Orbit” as Qiskit Function for Automated Error Suppression","url":"https://quantumcomputingreport.com/quantum-elements-launches-orbit-as-qiskit-function-for-automated-error-suppression/","summary":"Quantum software provider Quantum Elements has released Orbit, an advanced error suppression tool accessible as a Qiskit Function in the IBM Qiskit Functions Catalog. Designed to streamline noise management for quantum developers, Orbit provides members of the IBM Quantum Network with an automated, low-overhead suite to improve circuit execution fidelity on live processors. The tool [...] The post Quantum Elements Launches &#8220;Orbit&#8221; as Qiskit Function for Automated Error Suppression ap","content":null,"content_hash":"ab83012164d8eef4efa2a80b526bfcb3","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T19:28:21","fetched_at":"2026-07-29 02:10:17","word_count":70,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"8a364e2d0736e995","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44608","title":"Qedma Integrates QESEM Error Mitigation Software with Quantinuum Platform","url":"https://quantumcomputingreport.com/qedma-integrates-qesem-error-mitigation-software-with-quantinuum-platform/","summary":"Quantum software provider Qedma has announced a technical integration with Quantinuum, making its Quantum Error Suppression and Error Mitigation (QESEM) platform directly available across Quantinuum’s trapped-ion hardware systems. Developed over the past year through Qedma’s role as a founding member of the Quantinuum Startup Partner Program, the integration combines Qedma’s hardware-agnostic noise-reduction algorithms with Quantinuum’s [...] The post Qedma Integrates QESEM Error Mitigation Soft","content":"<p>Quantum software provider Qedma has announced a technical integration with Quantinuum, making its Quantum Error Suppression and Error Mitigation (QESEM) platform directly available across Quantinuum’s trapped-ion hardware systems. Developed over the past year through Qedma’s role as a founding member of the Quantinuum Startup Partner Program, the integration combines Qedma’s hardware-agnostic noise-reduction algorithms with Quantinuum’s high-fidelity quantum CCD (QCCD) architecture. The joint solution aims to enhance circuit accuracy, enabling enterprise and research users to run deeper, more complex quantum workloads across chemistry, materials science, and financial modeling.<br>\nQuantinuum’s systems are widely recognized for achieving high average two-qubit gate fidelities, making them strong candidates for algorithms approaching the limits of classical simulation. However, as quantum circuits scale in depth and qubit count, cumulative hardware noise remains a key constraint for utility-scale applications. The integration of QESEM directly addresses these scaling bottlenecks:<br>\n- Suppression and Mitigation: QESEM applies characterization, transpilation, and unbiased mitigation techniques to reduce error rates in quantum output without adding excessive sampling overhead.<br>\n- Complex Workload Execution: In initial validation runs on Quantinuum hardware, QESEM demonstrated measurable fidelity improvements on complex quantum simulations, allowing researchers to push closer to classical computational boundaries.<br>\n- Seamless Workflow: The integration allows enterprise developers using Quantinuum’s software ecosystem to deploy Qedma’s error mitigation stack directly into their existing job submission pipelines.<br>\nFounded by CEO Dr. Asif Sinay alongside quantum fault-tolerance pioneer Prof. Dorit Aharonov and condensed matter physicist Prof. Netanel Lindner, Qedma focuses on software-driven noise reduction to bridge the gap between noisy intermediate-scale quantum (NISQ) devices and full fault tolerance. For Quantinuum, the alliance reinforces its strategy of pairing its QCCD hardware stack with third-party software tools to accelerate ecosystem adoption and time-to-market for enterprise end-users.<br>\nReview the official integration release on the Qedma Newsroom here.<br>\nJuly 25, 2026<\/p>","content_hash":"d9f2009e17f6ad70d81160ae96d0c0b3","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T19:28:09","fetched_at":"2026-07-29 02:10:17","word_count":297,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"00175c90814dde13","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44600","title":"IQMP and Q-STAR Sign MoU to Connect Illinois and Japanese Quantum Ecosystems","url":"https://quantumcomputingreport.com/iqmp-and-q-star-sign-mou-to-connect-illinois-and-japanese-quantum-ecosystems/","summary":"The Illinois Quantum and Microelectronics Park (IQMP) has signed a Memorandum of Understanding (MoU) with Japan’s Quantum STrategic industry Alliance for Revolution (Q-STAR) to build cross-border commercialization pathways, joint R&amp;D pipelines, and supply chain connections between Japan and Illinois. Signed at the Global Quantum Forum in Chicago by IQMP CEO Harley Johnson and Q-STAR Global [...] The post IQMP and Q-STAR Sign MoU to Connect Illinois and Japanese Quantum Ecosystems appeared fi","content":"<p>The Illinois Quantum and Microelectronics Park (IQMP) has signed a Memorandum of Understanding (MoU) with Japan’s Quantum STrategic industry Alliance for Revolution (Q-STAR) to build cross-border commercialization pathways, joint R&D pipelines, and supply chain connections between Japan and Illinois. Signed at the Global Quantum Forum in Chicago by IQMP CEO Harley Johnson and Q-STAR Global Consortium Alliances Working Group Chair Hirofumi Mori, the agreement establishes a framework for scaling quantum startups, facilitating capital flow, and integrating industrial supply chains between both markets.<br>\nBilateral Commercialization and Supply Chain Integration<br>\nFounded in 2021, Q-STAR represents more than 160 Japanese corporations and institutions—including major industrial enterprises such as Toshiba, NEC, NTT, and Hitachi—alongside early-stage ventures and academic centers. The partnership focuses on four operational collaboration tracks:<br>\n- Capital and Market Access: Connecting Japanese and Illinois-based startups with cross-border venture capital, incubator networks, and non-dilutive government funding.<br>\n- Supply Chain Co-Development: Identifying critical hardware, cryogenic, optical, and fabrication components to strengthen domestic supply chains in both nations.<br>\n- Joint R&D and Enterprise Pilots: Facilitating collaborative research programs between universities, national labs, and enterprise end-users across quantum computing, sensing, and networking.<br>\n- Workforce and Technology Transfer: Exchanging technical expertise and establishing talent pipelines between Japanese industrial leaders and Chicago-area research hubs.<br>\nStrengthening Illinois–Japan Economic Ties<br>\nThe MoU builds on diplomatic and trade momentum between Illinois and Japan. Following executive trade missions—including Governor JB Pritzker’s mission to Japan in late 2024, a Japanese delegation visit to Chicago in mid-2025, and a JETRO-led mission to Tokyo in March 2026—the agreement formalizes institutional channels between Japan’s technology sector and the 128-acre IQMP campus on Chicago’s South Side. Facilitated by the Illinois Economic Development Corporation (ILEDC) and the Illinois Department of Commerce and Economic Opportunity (DCEO), the initiative aims to accelerate the transition of quantum research into deployable commercial applications across both ecosystems.<br>\nReview the official partnership announcement on IQMP here, and review our previous coverage of Q-STAR’s Bilateral Alliances here and the IQMP Campus Groundbreaking here.<br>\nJuly 25, 2026<\/p>","content_hash":"302f1f999a1d328b95d5f436200da081","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T18:42:54","fetched_at":"2026-07-29 02:10:17","word_count":331,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"c8e1f18c25927603","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44593","title":"Infleqtion to Deploy Fault-Tolerant Neutral-Atom Quantum Computer at Illinois Quantum Park","url":"https://quantumcomputingreport.com/infleqtion-to-deploy-fault-tolerant-neutral-atom-quantum-computer-at-illinois-quantum-park/","summary":"Quantum computing and sensing company Infleqtion (NYSE: INFQ) has announced plans to deploy its fault-tolerant, neutral-atom quantum computer—Sqale—at the Illinois Quantum &amp; Microelectronics Park (IQMP) in Chicago, with hardware delivery scheduled for 2027. In parallel, the company opened its new Chicago Quantum Innovation Center, an application development hub that will initially function as a center [...] The post Infleqtion to Deploy Fault-Tolerant Neutral-Atom Quantum Computer at Illinoi","content":"<p>Quantum computing and sensing company Infleqtion (NYSE: INFQ) has announced plans to deploy its fault-tolerant, neutral-atom quantum computer—Sqale—at the Illinois Quantum & Microelectronics Park (IQMP) in Chicago, with hardware delivery scheduled for 2027. In parallel, the company opened its new Chicago Quantum Innovation Center, an application development hub that will initially function as a center of excellence for applying quantum optimization to the U.S. energy grid.<br>\nHardware Architecture: Low-Latency QPU-GPU Coupling<br>\nInfleqtion’s Sqale platform utilizes laser-controlled neutral atoms to execute quantum logic gates. The platform deployed at IQMP is engineered for fault-tolerant operations, targeting an initial demonstration of over 50 logical qubits on a trajectory toward 100 logical qubits, supported by a physical architecture scaling beyond 1,000 physical qubits. Key technical features of the deployed platform include:<br>\n- NVIDIA NVQLink Integration: Integrates direct NVQLink interconnects to enable low-latency, high-bandwidth coupling between Infleqtion’s neutral-atom QPU and GPU-accelerated classical computing clusters, facilitating hybrid quantum-classical workflows.<br>\n- NQAC Access via Superstaq: Users and research institutions will access the system through the National Quantum Algorithm Center (NQAC) using Infleqtion’s flagship Superstaq quantum compilation and optimization software.<br>\nChicago Quantum Innovation Center: Smart Grid Optimization<br>\nThe newly established Chicago Quantum Innovation Center will focus its applied R&D on electrical power grid management, addressing computational bottlenecks caused by rising data center loads and AI power demand. The center’s work is driven in collaboration with the National Quantum Algorithm Center (NQAC) under its inaugural Grand Challenges program. The multidisciplinary project pairs Prof. Fred Chong and researcher Dhirpal Shah at the University of Chicago with Infleqtion (led by CTO Pranav Gokhale), energy provider Constellation Energy, and the Electric Power Research Institute (EPRI).<br>\nKey focus areas spanning grid management and clean energy infrastructure include:<br>\n- Quantum Fuel Loading Optimization (Q-FLO): Developing hybrid quantum-classical algorithms to optimize fuel assembly arrangements in nuclear reactors, maximizing energy yield while adhering to strict regulatory safety limits.<br>\n- Grid Contingency Analysis & Unit Commitment: Modeling real-time power generation scheduling and cascading grid failures so operators can respond to disruptions faster.<br>\n- Next-Generation Materials & Storage: Simulating battery chemistry for denser energy storage and discovering zero-loss superconducting transmission materials.<br>\nThe energy initiative builds on Infleqtion’s active awards, including the ARPA-E-funded ENCODE project and the broader NQAC Grand Challenges program.<br>\nCommercial Scale and Regional Ecosystem Impact<br>\nThe deployment builds on Infleqtion’s operating record in global markets, including its 100-physical-qubit deployment at the U.K. National Quantum Computing Centre (NQCC) and hardware installations in Japan. Following its public listing on the New York Stock Exchange (NYSE: INFQ), Infleqtion’s commitment expands its footprint at the $500 million IQMP campus. By joining anchor tenants such as PsiQuantum and IBM, Infleqtion strengthens Chicago’s position as a global hub for utility-scale quantum hardware and applied algorithm development.<br>\nReview the official corporate press release on the Infleqtion Newsroom here, read the featured story on the IQMP Blog: Solving Energy Challenges with Quantum Algorithms here, and explore our previous QCR coverage of Infleqtion’s $50M Illinois Neutral-Atom Program here, the NQAC Grand Challenges Energy Award with Constellation & EPRI here, Infleqtion’s Neutral-Atom Core Architectural Milestones here, and the IQMP Campus Groundbreaking here.<br>\nJuly 25, 2026<\/p>","content_hash":"48e3a3ba7dbf577daaf77868bf1aa309","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T18:32:34","fetched_at":"2026-07-29 02:10:17","word_count":519,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"a37ccf9821ff3476","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44580","title":"Zero Point Cryogenics and Ability Engineering Technology Anchor IQMP FaQtory in Chicago","url":"https://quantumcomputingreport.com/zero-point-cryogenics-and-ability-engineering-technology-anchor-iqmp-faqtory-in-chicago/","summary":"Following the federal funding rollout for The Bloch Quantum Tech Hub, the Illinois Quantum and Microelectronics Park (IQMP) has secured its first two physical supply-chain tenants: Edmonton-based dilution refrigerator manufacturer Zero Point Cryogenics (ZPC) and Illinois-based precision engineering firm Ability Engineering Technology (AET). Both companies will establish operational footprints at the IQMP FaQtory—a specialized campus [...] The post Zero Point Cryogenics and Ability Engineering Te","content":"<p>Following the federal funding rollout for The Bloch Quantum Tech Hub, the Illinois Quantum and Microelectronics Park (IQMP) has secured its first two physical supply-chain tenants: Edmonton-based dilution refrigerator manufacturer Zero Point Cryogenics (ZPC) and Illinois-based precision engineering firm Ability Engineering Technology (AET). Both companies will establish operational footprints at the IQMP FaQtory—a specialized campus facility designed under The Bloch umbrella to house component suppliers, fabricators, and hardware developers alongside anchor quantum computing firms. Supported by state tax incentive programs, these dual expansions mark the first practical steps toward building a localized Midwest quantum manufacturing supply chain.<br>\n                         [ IQMP FaQtory Tenant Matrix ]<br>\n  Anchor Campus       ──► Illinois Quantum and Microelectronics Park (IQMP, Chicago, IL).<br>\n  Facility Hub        ──► The IQMP FaQtory (Supported by EDA Tech Hubs & State Quantum Funds).<br>\n  Tenant 1 (ZPC)      ──► Zero Point Cryogenics (U.S. Innovation & Service Hub / MICRO Act).<br>\n  Tenant 2 (AET)      ──► Ability Engineering Technology (R&D Satellite Office / EDGE Program).<br>\n  Core Capabilities   ──► Ultra-low-temp dilution fridges, vacuum chambers, & rapid prototyping.Zero Point Cryogenics Establishes First U.S. Hub<br>\nSpun out of low-temperature physics research at the University of Alberta in 2017, Zero Point Cryogenics designs and builds custom “cryogen-free” (dry) dilution refrigerators. These ultra-low-temperature systems are essential infrastructure for superconducting and spin-qubit architectures, keeping physical hardware near absolute zero during operation. Supported by the state’s Manufacturing Illinois Chips for Real Opportunity (MICRO) Act, ZPC will establish its first U.S. location at the IQMP:<br>\n- Operations & Workforce: The Chicago facility will host ZPC’s U.S. research and development, sales, installation, and field service operations, creating over 20 specialized engineering jobs in Illinois.<br>\n- On-Campus Support: ZPC will provide direct maintenance, rapid hardware integration, and technical service to neighboring quantum computing developers and research labs across North America.<br>\n- Global Footprint: While ZPC’s primary manufacturing remains anchored in Alberta, Canada, the Chicago hub serves as its main U.S. service center.<br>\nAbility Engineering Technology Modernizes Operations & IQMP Presence<br>\nPrecision engineering firm Ability Engineering Technology (AET)—headquartered in South Holland, Illinois, since 1947—is expanding its advanced manufacturing footprint through a two-location investment supported by the state’s Economic Development for a Growing Economy (EDGE) program. AET specializes in engineered-to-order process equipment for cryogenic, vacuum, and high-pressure industrial applications:<br>\n- IQMP Satellite Office: AET will open a new R&D satellite office at the IQMP FaQtory focused on rapid prototyping, small-scale fabrication, equipment modification, and workforce training directly alongside quantum hardware developers.<br>\n- South Holland Plant Modernization: In parallel, AET is upgrading its existing 35,000-square-foot manufacturing plant in South Holland with structural improvements, advanced handling cranes, and new workflow machinery.<br>\n- Incentives & Investment: Under the EDGE agreement, AET has committed to investing at least $1.8 million, creating five new full-time positions, and retaining 23 existing manufacturing jobs.<br>\nTranslating Federal Tech Hub Capital into Localized Infrastructure<br>\nThe dual announcements were made by Illinois Governor JB Pritzker during the second annual Global Quantum Forum in Chicago. Backed by $500 million in state funding for the IQMP, $200 million for the Chicago Quantum Exchange (CQE), and federal support from the U.S. EDA Tech Hubs initiative, the addition of ZPC and AET establishes a localized supply chain for custom cryogenic hardware and precision vacuum engineering across the Midwest.<br>\nBy co-locating custom cryogenic hardware makers and precision vacuum engineers directly next door to anchor hardware developers (including IBM, PsiQuantum, Infleqtion, Pasqal, Diraq, and Quantum Machines), the IQMP FaQtory aims to shorten hardware iteration cycles and reduce reliance on overseas component sourcing.<br>\nReview official tenant expansion details on the IQMP News Portal here, explore state executive announcements on the Illinois State Release Portal here, Illinois DCEO Hub here, and Illinois EDC Portal here, examine corporate expansion details via Zero Point Cryogenics here, and explore our previous coverage of the IQMP & CQE State Investments here and the Bloch Tech Hub EDA Federal Funding here.<br>\nJuly 25, 2026<\/p>","content_hash":"1fcf7f94297675121d3bbaf8049a6f29","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T15:14:29","fetched_at":"2026-07-29 02:10:17","word_count":641,"read_time_minutes":4,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"5a17d4fc47829e60","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44569","title":"Bloq Quantum Expands Quantum Education and Workforce Ecosystem in India via Strategic Partnerships","url":"https://quantumcomputingreport.com/bloq-quantum-expands-quantum-education-and-workforce-ecosystem-in-india-via-strategic-partnerships/","summary":"Enterprise quantum software infrastructure provider Bloq Quantum has announced two strategic partnerships in Kerala, India, designed to accelerate quantum skilling, academic research, and institutional deployment across the region. The company signed a Memorandum of Understanding (MoU) with Sree Buddha College of Engineering (SBCE) to establish an undergraduate quantum computing laboratory and entered an alliance with [...] The post Bloq Quantum Expands Quantum Education and Workforce Ecosystem ","content":null,"content_hash":"656fe9a74a69e3e5d7b9535838f89f98","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T13:44:37","fetched_at":"2026-07-29 02:10:17","word_count":66,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"3d87c229a9e3971c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=44564","title":"SKKU Researchers Identify Room-Temperature “Spin Qubit” Defect in Zinc Oxide Semiconductors","url":"https://quantumcomputingreport.com/skku-researchers-identify-room-temperature-spin-qubit-defect-in-zinc-oxide-semiconductors/","summary":"The computational workflow of defect candidate search with critical parameters. An international research team led by Professor Hosung Seo at Sungkyunkwan University (SKKU)—in collaboration with researchers at the University of Wisconsin–Madison and the University of Washington—has computationally identified a novel atomic defect in zinc oxide (ZnO) capable of functioning as a high-fidelity \"spin qubit.\" Published [...] The post SKKU Researchers Identify Room-Temperature &#8220;Spin Qubit&#8221;","content":"<p>An international research team led by Professor Hosung Seo at Sungkyunkwan University (SKKU)—in collaboration with researchers at the University of Wisconsin–Madison and the University of Washington—has computationally identified a novel atomic defect in zinc oxide (ZnO) capable of functioning as a high-fidelity “spin qubit.” Published in PRX Quantum, the findings propose a molybdenum-oxygen-vacancy complex [(MoZnvO)2+] as an optically addressable, deep-level spin-triplet defect. The discovery marks the first time a robust, room-temperature spin qubit has been identified in ZnO, a wide-bandgap semiconductor already deeply integrated into global commercial fabrication processes.<br>\nOvercoming the Diamond NV-Center Manufacturing Bottleneck<br>\nCurrently, the nitrogen-vacancy (NV) center in diamond is the gold standard for solid-state spin qubits because it can retain quantum information at room temperature. However, diamond is notoriously difficult to grow as large-area single crystals and is fundamentally incompatible with standard CMOS manufacturing techniques. Zinc oxide offers a highly compelling alternative: it can be grown via Molecular Beam Epitaxy (MBE) as ultra-high-purity, large-area wafers and is naturally “magnetically quiet” (oxygen isotopes are 99.7% free of nuclear spin, reducing decoherence noise).<br>\nWhile shallow donor defects (like Indium or Gallium) have previously been studied in ZnO, their low binding energy restricts operation to cryogenic temperatures and limits emission to the UV spectrum. In contrast, the newly identified deep-level (MoZnvO)2+ defect features localized spin-triplet ground states that provide superior thermal stability.<br>\nFirst-Principles Design and Defect Characterization<br>\nUsing state-of-the-art Density Functional Theory (DFT) and Green’s function (GW) simulations, the team systematically screened substitutional defects across the periodic table, ultimately focusing on the molybdenum substitution. The resulting (MoZnvO)2+ complex exhibited three critical physical properties essential for a viable quantum light source and spin-photon interface:<br>\n- Suppressed Phonon Coupling (HR Factor): The defect demonstrated an exceptionally small Huang-Rhys (HR) factor of ∼5, compared to 10–30 for previously known ZnO defects. This results in minimal energy leakage into crystal lattice vibrations (phonons) during photon emission, yielding a sharp, high-efficiency zero-phonon line (ZPL) in the visible spectrum.<br>\n- Millisecond Spin Coherence (T2): First-principles calculations predict that the electron spin can maintain coherence for roughly 4 milliseconds (T2 ≈ 4 ms), limited primarily by paramagnetic impurity concentrations rather than intrinsic lattice noise.<br>\n- High-Fidelity Single-Shot Readout: The defect features strong spin-orbit coupling (SOC) combined with a suppressed Jahn-Teller distortion. This unique electronic geometry enables spin-selective intersystem crossing (ISC), allowing researchers to accurately read the qubit’s spin state in a single optical measurement even at elevated temperatures—a critical requirement for quantum error correction logic.<br>\nBy establishing a theoretical pathway to scalable, room-temperature spin qubits in a standard oxide semiconductor, the SKKU-led team aims to accelerate the mass production of integrated quantum networks and ultra-sensitive solid-state quantum sensors.<br>\nRead the full open-access theoretical paper, “Deep Spin Defects in Zinc Oxide for High-Fidelity Single-Shot Readout,” published in PRX Quantum here. For broader university highlights, review the summary on the SKKU Research Hub here.<br>\nJuly 25, 2026<\/p>","content_hash":"5977d0fde2807b9b23d1946548dc6259","author":"Mohamed Abdel-Kareem","published_at":"2026-07-25T13:16:52","fetched_at":"2026-07-29 02:10:17","word_count":479,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"3d","domain":"quantumcomputingreport.com"},{"id":"56d3ec48ebb90f58","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9949","title":"NISQ and quantum supremacy did not fail","url":"https://scottaaronson.blog/?p=9949","summary":"A week ago, a philosopher named Amit Hagar put out a preprint entitled The NISQ Trap: Eight Years of Demonstrations the Hardware was Built to Lose. Here&#8217;s the abstract: With a single clear exception, every NISQ-era flagship demonstration of &#8216;quantum advantage&#8217; has, within eighteen months of its announcement, been classically reproduced, shown to rest on classically tractable structure, or closed by a simulability theorem. Six theoretical results from 2024 through April 2026 exp","content":"<p>NISQ and quantum supremacy did not fail<br>\nA week ago, a philosopher named Amit Hagar put out a preprint entitled The NISQ Trap: Eight Years of Demonstrations the Hardware was Built to Lose. Here’s the abstract:<br>\nWith a single clear exception, every NISQ-era flagship demonstration of ‘quantum advantage’ has, within eighteen months of its announcement, been classically reproduced, shown to rest on classically tractable structure, or closed by a simulability theorem. Six theoretical results from 2024 through April 2026 explain the pattern: the regions of circuit-space NISQ hardware can run with sufficient fidelity coincide with the regions classical algorithms compress efficiently, because the features that admit one (low effective depth, strong algebraic structure, geometric locality) are the features that admit the other. This reading dates the NISQ programme from its 2018 articulation as an interim retreat from the unmet conditions of the 1996 threshold theorems, characterises the eight years that followed as a closed loop in which the demonstrations the hardware could run were drawn from regions classical methods could already reach, and locates the exit from the loop where the threshold theorems originally located it: in fault tolerance. The empirical pattern could in principle break with a demonstration that escapes the current simulability results. After eight years and more than thirty advantage-class announcements, the burden of producing such a demonstration falls to the defenders of NISQ.<br>\nYou can also read some debates about the paper on SciRate here. I think it’s fair to say that the paper is purely polemical, without new ideas, and Pangram agrees with my suspicion (and that of a SciRate commenter) that significant portions of it are AI-generated.<br>\nNevertheless, the basic thesis—that quantum supremacy in the NISQ (Noisy Intermediate Scale Quantum computing) era has been a failure, or even an example of pathological science—seems surprisingly widely shared, along with the opposite thesis that quantum computing already gives oodles of useful advantages for optimization and finance.<br>\nSo it seems worth stating for the record that I have an extremely different view. I would say:<br>\n- Sampling-based quantum supremacy experiments, including those based on Random Circuit Sampling and BosonSampling, passed the point about two years ago where, absent a breakthrough in classical algorithms, they quite clearly are beating what can easily be simulated on any existing classical computer. Hagar seems to claim that these experiments have been killed by the October 2025 paper Classical simulation of noisy random circuits from exponential decay of correlation, but he ignores that the algorithm from that paper still needs time that’s exponential in the circuit depth (see Theorem 2).<br>\n- Indeed, simulating deep ~100-qubit random circuits, like those that Google and Quantinuum have now demonstrated experimentally, still seems pretty hopeless with any current classical method. This is particularly true for Quantinuum’s experiments, which had high enough gate fidelity to maintain a Linear Cross-Entropy score of order 1 (i.e., they’re no longer all that “noisy”). The central drawback of these experiments is no longer lack of confidence about quantum advantage; rather, it’s just that we only get samples as output, and directly verifying the quality of the samples seems just as intractable for a classical computer as spoofing the samples.<br>\n- As of this past year, however, we have some strong candidates for verifiable quantum advantage. One is the Google OTOC experiment, as even Hagar himself acknowledges (that’s his “single clear exception”). A second is the simulations of the 2D Fermi-Hubbard model on Quantinuum and Google machines, like this one. The 1D Fermi-Hubbard model can be classically simulated pretty easily (see here for example), but the 2D one still presents challenges, meaning that in some regimes, the best available estimates of certain observables apparently now come from quantum computers. I wish I could write about other examples that will be public shortly.<br>\n- Yes, the “real” goal remains, as it’s been since the 1990s, to build a scalable fault-tolerant quantum computer—and I’m glad that Hagar (unlike, say, Gil Kalai) never suggests that we’ve learned anything to rule that goal out. In the meantime, an intermediate goal would be to use NISQ devices to do physics and chemistry simulations that are commercially useful, or that help solve important scientific problems. The point of quantum supremacy experiments, you might say, is that by demonstrating the reality of quantum speedup about as clearly as it can be demonstrated with current hardware, they let us cleanly turn our attention to those more ambitious goals.<br>\nAnyway, my son and I need to catch a plane to Utah now, for the next iteration of the wonderful Epsilon Camp, where I’ll again be teaching theoretical computer science to 11- and 12-year-olds. But feel free to discuss in the comments! Nothing about world affairs in this thread please, just quantum supremacy.<br>\nUpdate (July 19): Not unrelated to the subject of this post, here’s a podcast I did with Gill Eapen of “Scientific Sense” about the current situation in quantum computing including recent experimental victories.<\/p>","content_hash":"4927b7fb3c445c237aba8e1e02997b76","author":"Scott","published_at":"2026-07-18T20:38:44","fetched_at":"2026-07-29 02:10:14","word_count":824,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"940ccef49342d4c1","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18008","title":"My friend Mark Wise","url":"https://quantumfrontiers.com/2026/07/18/my-friend-mark-wise/","summary":"Mark Wise, the John A. McCone Professor of High Energy Physics at Caltech, passed away on July 10 at age 72. At a recent memorial service, John Preskill made these remarks. I’m John Preskill, Mark’s colleague on the Caltech physics faculty for more than four decades. Our friendship goes back even farther. My wife Roberta and I met Mark and Jackie not long after they arrived at Harvard in 1980. We’ve been friends since then. We attended the bris for both Barry and Jonathan during those Harvard da","content":"<p>Mark Wise, the John A. McCone Professor of High Energy Physics at Caltech, passed away on July 10 at age 72. At a recent memorial service, John Preskill made these remarks.<br>\nI’m John Preskill, Mark’s colleague on the Caltech physics faculty for more than four decades. Our friendship goes back even farther. My wife Roberta and I met Mark and Jackie not long after they arrived at Harvard in 1980. We’ve been friends since then. We attended the bris for both Barry and Jonathan during those Harvard days. Mark and Jackie have two boys and we have two girls who are a few years younger, who were thrilled to connect with Barry and Jonathan when the families would get together for occasions like Passover or Hanukkah or Thanksgiving. When the kids were little, Mark and I would sometimes muse about the potential for forging even closer family ties if those relationships blossomed.<br>\nThat didn’t happen. But Mark would preside at each Seder with a light hand, sprinkling the occasion with corny jokes as was his style, and Jackie would be determined to make it to the end of that customized family-friendly Haggadah she had meticulously prepared. The children, meanwhile, would be wondering when they’d be able to continue their game of sock baseball.<br>\nMany of you know that Mark was deeply dedicated to his family and friends. I’ll make some brief remarks about three facets of Mark I know especially well: Mark the scientist, Mark the teacher and mentor, and Mark the colleague and friend.<br>\nBecause of his self-deprecating manner, those of you who are not scientists may not appreciate Mark’s stature as a physicist. He was one of the most influential figures in theoretical particle physics of his generation. It was not obvious things would turn out that way. Growing up in Toronto, Mark was an indifferent student, and his poor grades reflected that lack of interest. As a 9th grader, though, it struck him that he better change his ways and figure out how to make something of his life. He liked sports — the possibility of being a professional athlete was briefly considered, but discarded. Somehow he decided that science would be a better fit. I’m not sure why — he had recently failed math. But he worked hard and had inspiring teachers, so by the time he finished high school Mark was an excellent student, and he sailed into the University of Toronto well prepared to major in physics,<br>\nAt U of T, Mark came under the influence of a young professor, Nathan Isgur, who would later become his close research collaborator. Under Nathan’s guidance, Mark sought admission to the PhD programs of the most prestigious US research universities, intent on a career devoted to deep exploration of the fundamental laws of physics. He was rejected everywhere he applied. He should have been discouraged. But he wasn’t. Mark shrugged and said: “It’s okay. I’ll stay another year in Toronto, I’ll get a master’s degree, I’ll apply again and I’ll get in somewhere.” And that’s what happened. He went to Stanford, where, under the kind tutelage of Fred Gilman, Mark took off like a rocket. Hired to the Caltech faculty in 1982, he was a tenured full professor three years later at the age of 31, and appointed as the John A. McCone Professor of High Energy Physics while still in his 30s.<br>\nMark liked action movies, such as those starring Arnold Schwarzenegger or Clint Eastwood. In serious moments, we would sometimes ponder together why we’re successful at what we do, and Mark would always quote Clint Eastwood as Harry Callahan in Magnum Force: “A man’s got to know his limitations.” We would both laugh, but those were words of wisdom. Mark understood what he did well as a research scientist and what he was less good at. Finding problems he could solve that would have interesting consequences for experiments that had been done or could be done was where he excelled – he did it again and again. Mark never lost his zest for calculating things, often by hand with pen and paper, his head resting on one arm with his glasses pushed up onto his forehead as he scribbled. Getting to an answer that was experimentally relevant never stopped giving him a thrill.<br>\nMark also never lost his sense of appreciation for the teachers and mentors who had inspired and helped him. Perhaps that’s why he became such a dedicated teacher and mentor himself. It’s hard to impress Caltech students, but Mark’s lectures where extremely popular, not just for their pedagogical value but also for the humanity and humor he displayed. Students had to pay attention because otherwise one might miss the jokes, which inevitably became known as “Wisecracks.” There is even an account on X with the handle @MarkWiseSays, curated by students who want to preserve Mark’s pithy lessons in physics and in life.<br>\nFor example, Mark might say: “If you really get depressed, I recommend diagonalizing a 2×2 matrix.” For physics students, this is both funny and sage advice. Or he might say. “This calculation will knock your socks off.” A cliché you might hear from anyone. But who besides Mark would then proceed to remove his shoes, rip off his socks, hurl them at the blackboard, put his shoes back on and resume lecturing?<br>\nMost famously, Mark would come to class with an ample supply of coins. He would ask the class questions, sometimes about physics and sometimes random trivia, rewarding a student who gave an answer Mark approved of by tossing a coin. At first the coins were quarters. But Mark, who had a scholarly interest in finance as well as physics, eventually felt that due to inflation he needed to upgrade to dollar coins. These are harder to come by, so it took frequent visits to the bank to make sure he wouldn’t run out. His antics in class made Mark human and approachable, and students responded. Mark felt that many Caltech students don’t fully realize how smart they are. He saw part of his job as building their self-confidence and relieving their stress.<br>\nAs a colleague and mentor to graduate students and postdoctoral scholars, Mark was highly collaborative. He believed that interactions with others sparked his creativity. He was never at all pompous. I know this started early. When we were in the Harvard Society of Fellows we were obligated to have dinner with the Senior Fellows on Monday nights. It was a rather stuffy occasion. And, though I don’t think they do this anymore, after a sumptuous meal we would literally retire for brandy and cigars. Once, while puffing on his cigar after dinner, Mark had an inspiration. He gathered up a few junior fellows and led them to a theater for a movie he thought everyone should see right away. The movie was Conan the Barbarian. And everyone had a blast. That was a perfect Mark moment.<br>\nAs the news about Mark has spread, accolades have poured in from physicists all over the world. He was admired not just for his scientific brilliance, but almost as much for his quirky sense of humor and his kindness. Mark was a wonderful friend to many of us. When you were with him, you were sure to laugh and feel good. He touched the lives of countless colleagues, students and friends. We miss him terribly but there are so many memories that we’ll cherish. We are all so very fortunate to have known and loved Professor Mark Wise.<\/p>","content_hash":"16ba809d0f95d93d22fda6941a21cb29","author":"preskill","published_at":"2026-07-18T14:51:44","fetched_at":"2026-07-29 02:10:25","word_count":1258,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"1w","domain":"quantumfrontiers.com"},{"id":"b545e0dccbf6b2f6","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9940","title":"Held Prize call for nominations (+ call for postdocs)","url":"https://scottaaronson.blog/?p=9940","summary":"Here at the National Academy of Sciences, it seems that my first job is to serve on the selection committee for the prestigious Michael and Sheila Held Prize in combinatorial and discrete optimization and related areas. The committee chair, my former MIT colleague Madhu Sudan (now at Harvard), invited me to share the following message here on Shtetl-Optimized. (I&#8217;d add: put in the effort to nominate someone, and you can actually influence how things go!) Dear Colleagues I am writing to see","content":"<p>Held Prize call for nominations (+ call for postdocs)<br>\nHere at the National Academy of Sciences, it seems that my first job is to serve on the selection committee for the prestigious Michael and Sheila Held Prize in combinatorial and discrete optimization and related areas. The committee chair, my former MIT colleague Madhu Sudan (now at Harvard), invited me to share the following message here on Shtetl-Optimized. (I’d add: put in the effort to nominate someone, and you can actually influence how things go!)<br>\nDear Colleagues<br>\nI am writing to seek nominations for the 2027 Michael and Sheila Held Prize. The scope of the prize and nomination needs are described below. If you intend to nominate someone I would appreciate a heads up by email to madhu@cs.harvard.edu one month before the deadline (so email by Sept 8, 2026) to let me know your nomination is coming. (We may also reach out to you in response to coordinate multiple/overlapping nominations.)<br>\nThe Held prize honors outstanding, innovative, creative, and influential research in the areas of combinatorial and discrete optimization, or related parts of computer science, such as the design and analysis of algorithms and complexity theory. This $100,000 prize is intended to recognize recent work (defined as published within the last eight years, i.e., on or after October 6, 2018).<br>\nAll nominations must be submitted online by Monday, October 5, 2026 and include:<br>\n1. Nomination letter describing the candidate’s work and why he or she should be selected for the award. No more than three (3) pages.<br>\n2. Curriculum vitae. No more than two (2) pages.<br>\n3. Bibliography listing no more than twelve (12) of the nominee’s most significant publications.<br>\n4. Suggested citation. A 50-word summary stating why the nominee should be considered for this award.<br>\n5. Two letters of support. No more than one letter of support can be written by someone of the same primary work institution as the nominee.<br>\nThe Held Prize is given to a person or a set of persons, as supported by a paper or a body of work. Unless otherwise stated, preference will be given to scientists who may be earlier in their careers or those whose work has not been recognized by other prizes or awards. Nomination restrictions can be found here. Joint nominations will only be considered when nominees have collaborated closely on the paper to be recognized by the award. If nominating multiple individuals for a paper with additional authors, please clearly explain the reason for nominating those chosen, as well as the reason for excluding other collaborators, if applicable.<br>\nPlease feel free to circulate this call further within your department<br>\nBest<br>\nMadhu Sudan, on behalf of The Michael and Sheila Held Prize Selection Committee<br>\nAnd while I have your attention, a second CS theory announcement: David Soloveichik, my wonderful friend and colleague in UT Austin’s Electrical and Computer Engineering Department, has funding for a postdoc for 1-2 years, to work on the thermodynamics of computation here at UT. This is a topic that I’ve been trying to learn more about as well, so I might get involved too! David writes, “the big picture is to think of thermodynamics (energy dissipation / entropy production) as CS complexity measures like time and space usage.” If you’re on the postdoc market and this sounds potentially up your alley, email David to learn more.<\/p>","content_hash":"f5423da0ec24117f1eff7f928e10495d","author":"Scott","published_at":"2026-07-11T20:25:14","fetched_at":"2026-07-29 02:10:14","word_count":559,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"7338cb05c1437b9a","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9930","title":"Announcing BQP Partners: my and my brother’s new angel-investing venture","url":"https://scottaaronson.blog/?p=9930","summary":"As I&#8217;ve written before, these past couple years I&#8217;ve often felt like the last remaining person in either quantum computing or AI who lacked a stake in some startup company whose valuation is right now shooting into interstellar space. My academic colleagues, including the ones who seemed the most singleminded about quantum oracle separations and other gloriously useless pursuits? One by one, like in a zombie movie, I learn that they too have now launched startups, and invariably rais","content":"<p>Announcing BQP Partners: my and my brother’s new angel-investing venture<br>\nAs I’ve written before, these past couple years I’ve often felt like the last remaining person in either quantum computing or AI who lacked a stake in some startup company whose valuation is right now shooting into interstellar space. My academic colleagues, including the ones who seemed the most singleminded about quantum oracle separations and other gloriously useless pursuits? One by one, like in a zombie movie, I learn that they too have now launched startups, and invariably raised tens of millions of dollars, for the sorts of ideas we might’ve idly traded at coffee breaks back in the day, before getting back to our real work.<br>\nSo why didn’t I join this rollicking party? Partly because of a lifelong fear that, the instant my self-worth became tied to how much money I made, I’d need to humble myself before people who bluster and bully and lie and hype and conceal … yet who nevertheless succeed at becoming orders of magnitude richer than me. I’ve been terrified of even starting down that road, of whether I’d still be myself at the end of it.<br>\nIt’s also partly that I can’t stand failure, or regret, or being wrong. Of course, as an academic researcher I also fail, and regret things, and am wrong constantly—but there it feels tolerable, because normally I can tell myself that it’s all just down to my inborn limitations. After all, if I could’ve solved the major open problem that someone else solved, or written the brilliant book that someone else wrote, then presumably I would’ve done it!<br>\nClearly, though, I could’ve mined bitcoin in 2010. I could’ve gotten an early stake in Amazon or Google. It’s not even like those ideas never crossed my mind. I just … didn’t act on them, for some reason. (But even if I had, I’d probably just be full of regret that I hadn’t done even more.) Thus, my only way to avoid paralyzing regrets, has been to tell myself constantly that I’m not in the forecasting or money-making businesseses in the first place.<br>\nIt helped that, insofar as I’m shallow or covetous, insofar as I’ve desired things of this world rather than insight or eternal truth, it’s never really been money that I cared about, but just being respected and liked. Elon Musk is the richest man on earth, but also one of the most despised—which isn’t a bargain that I could imagine ever appealing to me.<br>\nPlus, when I actually meet billionaires, I don’t find myself envious of their mansions or cars or anything else that they have; I don’t feel like such things would make my life any happier. Maybe I slightly envy their ability to fund the causes they care about, or their professional staffs who relieve them of drudgery, but mostly I envy the way their wealth announces, to whatever extent it does: “I was right when others weren’t.” Again, though, I’ve never trusted the world to cause me to be right about the future valuations of companies or anything similar, so I’ve settled for having been right about PostBQP and algebrization and BosonSampling.<br>\nThe bottom line is that I made a choice decades ago to forgo trying to get rich, no matter how many of my friends did the same, and to strive instead to discover and tell the truth—to be a professor, a blogger, a jokester, and an “objective” arbiter and commentator. “Then, surely, everyone will like me!” my internal monologue went. “Then, surely, they’ll be grateful for all the free service I’ve rendered them—for decades of blogging, without once so much as asking for a donation or running an ad!”<br>\nHAHAHAHAHAHA.<br>\nAs any regular reader will know, my attempts to be loved as a blogger backfired pretty spectacularly. Or rather: they did lead to thousands of strangers liking me (and I’m grateful for every last one of you), but they also led to probably an order of magnitude more strangers hating me, and congregating on Reddit and Twitter and elsewhere to discuss how badly I suck. And of course, trying to shift that balance by writing what people want to hear, rather than what I actually believe, was never within my realistic option set.<br>\nIn the startup context, it didn’t matter how carefully I avoided taking a direct stake for or against any of the companies I blogged about. People on Twitter simply assumed that I had a stake—for example, that I must’ve shorted D-Wave or IonQ, or invested in their competitors, or had equity in AI companies. For why else would anyone write what I wrote?<br>\nAmusingly, my attackers here typically did have precisely the conflicts-of-interest that they falsely accused me of having, but that was never at issue; only my imaginary conflicts-of-interest were. Even as the Scott-haters greedily filled their pockets (or tried to), I alone needed to keep turning my pockets out to prove that they were still empty.<br>\nSo then, screw it! In partnership with my brother David Aaronson, who’s long done investing professionally, and on David’s guidance and encouragement, I’m hereby embarking on a new policy.<br>\nNamely: when I hear about a brand-new startup that sounds relevant to my interests—in quantum, AI, or anything else—and I like and trust the founders (ideally, because of their previous academic research work), David and I will often make a small seed investment if the founders are open to it. Or, of course, we might become advisors or get involved in some other way.<br>\nIn fact, David and I are launching BQP Partners—the link goes to our AngelList, where you can read about how to invest with us if you’re interested. (See also whether you can spot any differences between David’s writing style and preoccupations and mine!)<br>\nSo far, David and I are investing in:<br>\n- Oratomic (the new neutral-atom quantum computing startup out of Pasadena started by Dolev Bluvstein, John Preskill, and Hsin-Yuan Huang among others, which I previously blogged about here). See here for their Series A announcement this week.<br>\n- A non-quantum startup being cofounded by someone whose scientific work I’ve admired. I’ll write more about this one as soon as I’m able to!<br>\nI have little doubt that more potential investments will come our way very soon (some, probably, as a direct result of this post).<br>\nCrucially, I can handle my burden of regret—the “why didn’t I do this much earlier, if I was going to do it at all?” question—by telling myself that friends of mine were not founding companies left and right until very recently. I can also tell myself that I’m doing this less as a bet about the future (in which case … what if I’m wrong?), than simply as a way to support brilliant colleagues doing things that I genuinely admire.<br>\nWhen I blog about a company, I’ll always disclose if I have a financial position that presents a clear conflict of interest, so you can judge for yourself whether to listen to me. (Although, if that’s the sort of thing you’d demand, then you probably weren’t listening to me in the first place, were you?)<br>\nHaving reflected on it a lot these past few months, I’m happy with my new policy and with my and David’s new venture, and I’m curious to see where it goes. I’m at peace with the possibility that we’ll lose our shirts, but I’m even at peace with a more disturbing possibility—that we’ll make millions and then people will scream at me online for being a sellout, a hack, and a shill. Those people, as I’ve learned, were going to scream at me anyway.<\/p>","content_hash":"051030c743bd6805eb4a5618e7c097b8","author":"Scott","published_at":"2026-07-10T14:59:33","fetched_at":"2026-07-29 02:10:14","word_count":1278,"read_time_minutes":7,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"1315212e5059f57e","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9909","title":"Happy 250th!","url":"https://scottaaronson.blog/?p=9909","summary":"I’m at the New Jersey shore with family and friends, where we&#8217;ve spent this Fourth of July eating hot dogs, playing miniature golf, and wading into the ocean that my great-grandparents crossed to escape calamities they knew about and much greater calamities that they didn’t. Tonight we’ll see the fireworks, weather permitting. And yes, on the crowded beach today you can find people sporting MAGA and &#8220;45-47&#8221; hats, and even a giant &#8220;Trump 2028” flag&#8212;a stark reminder o","content":"<p>Happy 250th!<br>\nI’m at the New Jersey shore with family and friends, where we’ve spent this Fourth of July eating hot dogs, playing miniature golf, and wading into the ocean that my great-grandparents crossed to escape calamities they knew about and much greater calamities that they didn’t. Tonight we’ll see the fireworks, weather permitting.<br>\nAnd yes, on the crowded beach today you can find people sporting MAGA and “45-47” hats, and even a giant “Trump 2028” flag—a stark reminder of the millions who would redefine the meaning of our 250-year-old experiment to something dark and authoritarian, the opposite of what its founders intended. Of course, those forces find mirror images on the left end of the political spectrum, where one can find millions more who fully agree with MAGA about the failures of liberalism and the Enlightenment, differing only on the secondary question of which racist thugs should rule instead.<br>\nDespite everything, I don’t believe that both factions together constitute a majority. Even on the beach, the MAGA hats are vastly outnumbered by “250” banners and girls in stars-and-stripes bikinis, Americans who just want to celebrate.<br>\nDespite everything, I remain thoroughly American if I’ve ever been anything, and invested in the country’s future if I’ve ever been invested in anything.<br>\nJD Vance and his friends, who might rule the country after the predictable failure of “Trump 2028,” make a huge deal about “Heritage Americans.” Of course the point of such phrases is to exclude those like me, and recent immigrants, and even (incredibly) JD’s own wife. On reflection, though: could I, too, count as a Heritage American at this point? After all, my family has now been here for half the country’s history. My grandfather, who grew up in poverty, became a professional boxer in Philadelphia and Atlantic City during the Great Depression. He then joined the Army and ended up clearing German mines in North Africa and Italy in WWII. He was assigned to a company of Southerners, who had never met a Jew and were shocked that my grandfather didn’t have horns—but by the war’s end, my grandfather and the relatively few others in his company who remained alive had become best friends. My grandfather told me that he could understand the German POWs who they captured tolerably well, since German was similar enough to Yiddish, but who he could never understand was the British.<br>\nAs for me, I grew up in the town of Washington Crossing, PA, maybe a mile’s walk from where this happened (and where it’s still reenacted every Christmas):<br>\nMy earliest childhood hero (that I can remember) was Ben Franklin, whose institute in Philadelphia I visited often. I didn’t even recognize as unusual at the time how the founding of the country didn’t feel like a remote abstraction to me, but was all around me, as if it was yesterday.<br>\nThat the founders of the United States created the model for all time of how to bend the arc of human history a little bit away from its usual horribleness, of how to overthrow a despotism without instituting an even worse despotism in its place, of how to found a new civilization on ideas and principles rather than raw power … is one of those things that seemed true to me as a child and that still seems true to me today.<br>\nMay this greatest experiment continue for another 250 years. May it triumph against all those within and without who would see it destroyed.<\/p>","content_hash":"3a30e3d3d1afbb3ccdbeac222610dfc2","author":"Scott","published_at":"2026-07-04T21:52:01","fetched_at":"2026-07-29 02:10:14","word_count":581,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3w","domain":"scottaaronson.blog"},{"id":"140b89421c9aa2f9","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=9902","title":"An American privacy emergency: Guest post from Cynthia Dwork et al.","url":"https://scottaaronson.blog/?p=9902","summary":"Scott&#8217;s foreword: Cynthia Dwork is Gordon McKay Professor of Computer Science at Harvard, and a pioneer in the fields of differential privacy and algorithmic fairness. On my recent travels to the SigmaWest science camp and then STOC, there was much talk about a recent Trump administration action that would ban not only differential privacy, but essentially all modern techniques for preserving privacy in large datasets, for example in the 2030 US Census. I realize that many of us have &#822","content":"<p>An American privacy emergency: Guest post from Cynthia Dwork et al.<br>\nScott’s foreword
