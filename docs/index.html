  <title>Meridian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FFFCF0;
      --card: #F2F0E5;
      --text: #2D2B28;
      --dim: #6F6E69;
      --muted: #DAD8CE;
      --up: #66800B;
      --down: #AF3029;
      --accent: #205EA6;
      --spark: #8B5CF6;
      --score: #AD8301;
      --link: #24837B;
      --particle: #24837B;
    }

    html { font-size: 10px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding: 4px;
      min-height: 100vh;
      font-weight: 400;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 4px 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--muted);
    }

    .title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .timestamp { color: var(--dim); font-size: 9px; }

    .dashboard {
      position: relative;
    }

    .card-wrapper {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 2px;
      overflow: hidden;
      /* top, left, width set by JS layout engine */
    }

    .card-wrapper canvas {
      display: block;
      width: 100%;
    }

    .card-wrapper .links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card-wrapper .links a {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      color: transparent;
      text-decoration: none;
      display: block;
    }

    footer {
      margin-top: 8px;
      padding: 6px 4px;
      border-top: 1px solid var(--muted);
      text-align: center;
      color: var(--dim);
      font-size: 7px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .footer-links {
      margin-bottom: 6px;
    }

    .footer-links a {
      margin: 0 4px;
    }

    .ascii-footer {
      margin: 8px auto 4px;
      font-size: 8px;
      line-height: 1.1;
      color: var(--dim);
      opacity: 0.5;
      user-select: none;
      overflow: hidden;
      max-width: 400px;
    }

    .ascii-footer .particle {
      display: inline-block;
      color: var(--particle);
      opacity: 0.4;
    }

    .ascii-footer .meridian-text {
      color: var(--dim);
      letter-spacing: 1px;
    }

    @keyframes particleDrift {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.6; transform: translateY(-1px); }
    }

    .ascii-footer .p1 { animation: particleDrift 3s ease-in-out infinite; }
    .ascii-footer .p2 { animation: particleDrift 3s ease-in-out infinite 0.3s; }
    .ascii-footer .p3 { animation: particleDrift 3s ease-in-out infinite 0.6s; }
    .ascii-footer .p4 { animation: particleDrift 3s ease-in-out infinite 0.9s; }
    .ascii-footer .p5 { animation: particleDrift 3s ease-in-out infinite 1.2s; }
    .ascii-footer .p6 { animation: particleDrift 3s ease-in-out infinite 1.5s; }

    @media (prefers-reduced-motion: reduce) {
      .ascii-footer .particle {
        animation: none;
        opacity: 0.3;
      }
    }

    noscript p {
      text-align: center;
      padding: 20px;
      color: var(--dim);
      font-size: 9px;
    }
  </style>
</head>

Opal Dynamics Simulator on IBM Quantum Functions, Achieving 12× Speedup on Nighthawk","url":"read/113185c57594a547.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"1h"},{"id":"e9780d70bffcc90b","title":"Q-CTRL Expands Fire Opal Suite with Constrained Optimization, Estimator Twirling, and Monte Carlo Solver","url":"read/e9780d70bffcc90b.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"2h"},{"id":"09d0d896a3e45666","title":"Q-CTRL Demonstrates Push-Button Cold-Start Calibration on QuantWare Superconducting QPUs","url":"read/09d0d896a3e45666.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"4h"},{"id":"39a0691f00b17b6d","title":"Q-CTRL Achieves RTCA DO-160 Airworthiness Qualification for Ironstone Opal Quantum Navigation","url":"read/39a0691f00b17b6d.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"4h"},{"id":"91869947c697ce6c","title":"Anyon Technologies and Q-CTRL Partner on Self-Calibrating Hybrid Quantum Supercomputers","url":"read/91869947c697ce6c.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"4h"},{"id":"049827754791bcdf","title":"IBM, Mitsubishi Chemical, and Keio Train Generative Quantum Eigensolvers on 70-Qubit Hardware","url":"read/049827754791bcdf.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"5h"},{"id":"1fa713f00bd214db","title":"Patero and Horizen Labs Partner on Enterprise Post-Quantum Migration and Network Protection","url":"read/1fa713f00bd214db.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"5h"},{"id":"3f8fd75072be643e","title":"Xanadu Reports Q3 2026 Results with $286M Cash Balance and Expanding R&D Commitments","url":"read/3f8fd75072be643e.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"6h"}]}],"card_order":[{"type":"metric","index":0},{"type":"metric","index":1},{"type":"feed","id":"hn_tech"},{"type":"metric","index":2},{"type":"metric","index":3},{"type":"metric","index":4},{"type":"feed","id":"hn_ai"},{"type":"metric","index":5},{"type":"metric","index":6},{"type":"metric","index":7},{"type":"feed","id":"hn_startups"},{"type":"metric","index":8},{"type":"feed","id":"rss_quantum"}],"rss_entries":[{"id":"113185c57594a547","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48666","title":"Q-CTRL Deploys Fire Opal Dynamics Simulator on IBM Quantum Functions, Achieving 12× Speedup on Nighthawk","url":"https://quantumcomputingreport.com/q-ctrl-deploys-fire-opal-dynamics-simulator-on-ibm-quantum-functions-achieving-12x-speedup-on-nighthawk/","summary":"Q-CTRL has deployed its Fire Opal Dynamics Simulator on IBM Quantum Functions, achieving a 12x speedup on Nighthawk r2 processors compared to Heron r3 systems for large-scale fermionic many-body physics simulations. This allows researchers to execute complex simulations with a single API call, significantly accelerating computational chemistry and materials modeling. The Dynamics Simulator, available in the IBM Quantum Functions Catalog, employs advanced techniques like deterministic crosstalk s","content":"<p>Quantum infrastructure software provider Q-CTRL has released its Dynamics Simulator function inside the IBM Quantum Functions Catalog, enabling researchers to execute large-scale fermionic many-body physics simulations on IBM superconducting processors via a single automated API call. Following its initial rollout in Fire Opal and recent benchmarks on IBM’s Nighthawk r2 (ibm_phoenix) architecture, the pipeline demonstrated a 12× execution speedup over IBM Heron r3 systems with less than 1% fidelity deviation.<br>\n| Q-CTRL Fire Opal Dynamics Simulator Hardware Benchmarks |  |  | <br>\n|---|---|---|<br>\n| Benchmark Metric | IBM Heron r3 (ibm_boston) | IBM Nighthawk r2 (ibm_phoenix) | <br>\n| Workload Scale | Up to 60 sites (120 qubits, 30 Trotter steps, 9,057 2Q gates) & 31 sites (62 qubits, 90 Trotter steps, 13,829 2Q gates) | 30-site Fermi-Hubbard chain (60 qubits, 30 Trotter steps, 4,497 2Q gates, 2Q depth 152) | <br>\n| QPU Pipeline Runtime | 4 minutes 25 seconds (30-site reference, including noise characterization) | 23 seconds (12× faster QPU execution) | <br>\n| Classical Comparison | Up to 3,000× faster than ITensor CPU baseline (36× vs. symmetry-exploiting H200 GPU tensor networks) | >400× faster lower-bound runtime vs. GPU-accelerated classical solvers | <br>\n| Simulation Accuracy | Within ~1% RMSE of converged tensor-network references | <1% deviation (7.895 × 10−3 RMSE) vs. Heron r3 baseline | <br>\nComputational chemistry and materials modeling consume roughly one-third of global supercomputer capacity, yet simulating time-evolving, strongly correlated electrons remains constrained by exponential entanglement growth in classical tensor networks. While IBM’s Nighthawk square-lattice topology increases average qubit connectivity by 60% over heavy-hex Heron chips—reducing SWAP routing overhead—denser nearest-neighbor coupling amplifies residual quantum crosstalk. Earlier validation on Nighthawk r1 (ibm_miami) showed that staggered dynamical decoupling extends median effective coherence times sixfold, from 27 μs to 160 μs.<br>\nThe Dynamics Simulator abstracts Hamiltonian mapping, Trotter-Suzuki synthesis, qubit routing, and deterministic crosstalk suppression behind a high-level Python interface (q-ctrl/dynamics-simulator). By preventing coherent errors during execution without extra measurement shots, Q-CTRL previously simulated 1D Fermi-Hubbard dynamics up to 120 qubits on IBM Heron hardware across 90 Trotter steps. While follow-up classical research utilizing symmetry-exploiting tensor contractions on NVIDIA H200 GPUs narrowed Q-CTRL’s initial 3,000× CPU speedup to 36×, transitioning the workflow to Nighthawk r2 restored an order-of-magnitude runtime margin.<br>\nAvailable in Small, Medium, and Large workload tiers for IBM Quantum Premium, Flex, and On-Prem Plan users, the Dynamics Simulator completes Q-CTRL’s three-function lineup in the IBM Quantum Functions Catalog alongside its Performance Management and Optimization Solver functions.<br>\nOfficial release details are available in Q-CTRL’s IBM Quantum Functions announcement here, the Nighthawk r2 benchmark analysis here, the Nighthawk r1 crosstalk suppression study here, and the initial Fire Opal Dynamics Simulator release here. Catalog listings and documentation are accessible for the Dynamics Simulator here (docs here), Performance Management here (docs here), and the Optimization Solver here (docs here). Supporting scientific manuscripts include Q-CTRL’s Fermi-Hubbard hardware study on arXiv here, the GPU tensor-network benchmarking response on arXiv here, and the supercomputer chemistry workload study in Machine Learning: Science and Technology here. Related QCR coverage of Q-CTRL’s initial materials simulation speedup is available here, recent Fire Opal solver and compiler updates here, and IBM’s QDC 2026 Nighthawk roadmap here.<\/p>","content_hash":"cc0a3b8d3c09e5a5cf16fb11ea591b5b","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T04:27:04","fetched_at":"2026-11-12 06:22:50","word_count":529,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1h","domain":"quantumcomputingreport.com"},{"id":"e9780d70bffcc90b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48668","title":"Q-CTRL Expands Fire Opal Suite with Constrained Optimization, Estimator Twirling, and Monte Carlo Solver","url":"https://quantumcomputingreport.com/q-ctrl-expands-fire-opal-suite-with-constrained-optimization-estimator-twirling-and-monte-carlo-solver/","summary":"Q-CTRL has updated its Fire Opal platform with new features including constrained optimization for QAOA, significantly increasing approximation ratios. They've also introduced Monte Carlo integration for quantitative finance, capable of scaling hardware execution up to 17-27 qubits. Additionally, Fire Opal now includes Estimator Pauli Twirling to improve signal-to-noise ratio with zero additional QPU shot overhead. The post Q-CTRL Expands Fire Opal Suite with Constrained Optimization, Estimator ","content":"<p>Q-CTRL has rolled out a series of algorithmic and compiler upgrades to its Fire Opal error-suppression and solver platform, adding native hard-constraint support for the Quantum Approximate Optimization Algorithm (QAOA), zero-overhead Pauli twirling for expectation values, and a dedicated Monte Carlo integration function for quantitative finance.<br>\n| Fire Opal Q3 2026 Feature & Solver Additions |  |  | <br>\n|---|---|---|<br>\n| Capability / Module | Technical Mechanism | Measured Performance Impact | <br>\n| Constrained QAOA ( solve_qaoa) | Enforces hard Hamming-weight-1 constraints directly without objective penalty terms | Increases approximation ratios by up to 500%; validated on 120-qubit rail station routing, 50-qubit graph partitioning, and 156-qubit Max-Cut and HOBO spin-glass benchmarks. | <br>\n| Monte Carlo Integration ( integrate_monte_carlo) | Quantum signal processing (QSP) amplitude estimation paired with adaptive Bayesian inference | Scales hardware execution up to 17–27 qubits (compared to ~5-qubit industry baselines) with quadratic sample complexity scaling. | <br>\n| Estimator Pauli Twirling | Symmetrically transforms circuits across existing shot budgets to average residual noise | Improves estimator signal-to-noise ratio with zero additional QPU shot overhead. | <br>\n| Compiler Control Flag | reduce_approximation=True option in IbmRunOptions | Relaxes gate-elision thresholds for exact execution of sensitive, hand-crafted circuits. | <br>\nIn standard QAOA implementations, problem constraints—such as portfolio allocation limits or logistics routing rules—are enforced via soft penalty terms in the cost Hamiltonian, wasting quantum circuit depth exploring invalid states. By embedding hard Hamming-weight-1 constraints directly into the solver pipeline, Fire Opal restricts evolution to feasible configurations across both its standalone client (fireopal.solve_qaoa) and the IBM Quantum Functions Optimization Solver. Demonstrated workflows include a 120-qubit train-station routing instance (30 trains across four candidate paths) alongside 156-qubit higher-order binary optimization (HOBO) spin-glass problems and 50-qubit weighted graph partitioning.<br>\nAlongside the optimization and estimator updates (fireopal.estimate_expectation), Q-CTRL introduced integrate_monte_carlo—paired with a new quantitative finance module in its Black Opal training platform—to estimate derivative prices and tail-risk metrics without requiring users to manually construct quantum signal processing circuits. Built-in constructors support lognormal, normal, uniform, and Gaussian copula distributions alongside European call pricing, delta, and fixed-income objectives.<br>\nTechnical release notes are available on the Q-CTRL blog for the Fire Opal solver updates here, the Monte Carlo integration release here, and Q-CTRL’s enterprise deployment analysis here, with industry case studies accessible here. Q-CTRL API documentation and tutorials cover solve_qaoa here, the 120-qubit train-station routing guide here, estimate_expectation here, IbmRunOptions here, and the Monte Carlo integration overview here. Catalog listings and documentation for IBM Quantum Functions are available for the Optimization Solver here (docs here, 156-qubit HOBO tutorial here) and Performance Management here (docs here). Related QCR coverage of independent cross-stack error management benchmarks on 156-qubit IBM Heron hardware is available here.<\/p>","content_hash":"5ec3c4858efcebb4ac5c22abb3e47af2","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T04:15:56","fetched_at":"2026-11-12 06:22:50","word_count":449,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"2h","domain":"quantumcomputingreport.com"},{"id":"09d0d896a3e45666","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48660","title":"Q-CTRL Demonstrates Push-Button Cold-Start Calibration on QuantWare Superconducting QPUs","url":"https://quantumcomputingreport.com/q-ctrl-demonstrates-push-button-cold-start-calibration-on-quantware-superconducting-qpus/","summary":"Q-CTRL has demonstrated an autonomous, cold-start calibration process for QuantWare superconducting processors using its Boulder Opal control platform. This technology can bring a 21-qubit QuantWare Contralto-D21 device from an uncalibrated state to operational gate fidelities in under three hours, significantly reducing the manual effort and time typically required. This innovation addresses a major bottleneck in scaling superconducting quantum computers by automating the complex tuning and sta","content":"<p>Quantum infrastructure software provider Q-CTRL has released hardware benchmarking data demonstrating fully autonomous, cold-start bring-up and gate calibration on QuantWare D-Line superconducting processors using its Boulder Opal control platform. Validated on a 21-qubit QuantWare Contralto-D21 device, the physics-informed AI state machine tuned five-qubit feedline blocks from an uncalibrated state to operational gate fidelities in under three hours without manual specialist intervention.<br>\nReplaces multi-day manual tuning cycles across resonator mapping and qubit discovery.<br>\nSingle-Qubit Gate Fidelity<br>\n99.95% median (SX gates)<br>\nAutomated Rabi, Ramsey, and readout optimization across stable transmon registers.<br>\nTwo-Qubit Gate Fidelity<br>\n>98% peak / 96% device median (CZ gates)<br>\nFlux spectroscopy and closed-loop pulse optimization across coupled qubit pairs.<br>\nUpcoming Roadmap<br>\nQuantWare A-Line & runtime recalibration<br>\nAdds tunable-coupler support, task parallelization, and continuous drift tracking in late 2026.<br>\nScaling superconducting quantum computers presents a severe operational bottleneck because dozens of interdependent control parameters—ranging from traveling-wave parametric amplifier (TWPA) biases to qubit drive frequencies and flux pulses—must be iteratively tuned and stabilized against environmental drift. Conventional scripted calibration routines frequently fail when hardware frequencies drift outside narrow scan windows, requiring experimental physicists to intervene manually.<br>\nBoulder Opal encodes architecture-specific characterization and calibration routines into an automated state machine capable of detecting out-of-range anomalies, filtering false-positive resonances, and recovering underperforming qubits autonomously. Every calibration pass logs parameter histories, diagnostic plots, and optimized control waveforms into a web-based visualization dashboard for hardware inspection.<br>\nTechnical details and calibration metrics are available on the Q-CTRL blog here. Related QCR coverage of Q-CTRL’s autonomous calibration integration with Anyon Technologies for enterprise data centers is available here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"4d0692fdf46dbf6f8483f6c9079688ab","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T02:20:58","fetched_at":"2026-11-12 06:22:50","word_count":344,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"4h","domain":"quantumcomputingreport.com"},{"id":"39a0691f00b17b6d","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48656","title":"Q-CTRL Achieves RTCA DO-160 Airworthiness Qualification for Ironstone Opal Quantum Navigation","url":"https://quantumcomputingreport.com/q-ctrl-achieves-rtca-do-160-airworthiness-qualification-for-ironstone-opal-quantum-navigation/","summary":"Q-CTRL's Ironstone Opal quantum magnetic navigation system has achieved RTCA DO-160 airworthiness qualification, becoming the first quantum navigation payload certified for commercial aerospace and UAV deployment. This system offers a passive alternative to satellite-based positioning, addressing issues of GPS jamming and spoofing by using atomic quantum sensors to measure Earth's magnetic field. It has undergone flight evaluations with partners like Airbus and Lockheed Martin, and its AI-driven","content":"<p>Quantum infrastructure and sensing company Q-CTRL has announced that its Ironstone Opal quantum magnetic navigation system has achieved safety-of-flight qualification under the commercial aviation RTCA DO-160 environmental testing standard. Unveiled ahead of live demonstrations at the Farnborough International Airshow, the milestone marks the first quantum navigation payload certified for commercial aerospace and uncrewed aerial vehicle (UAV) deployment.<br>\nMeets commercial aerospace environmental, electromagnetic, and vibration safety-of-flight criteria.<br>\nNavigation Accuracy<br>\nRNP 0.3 (<0.3 nautical miles over 95% of flight)<br>\nSatisfies international civil aviation accuracy thresholds without satellite signals.<br>\nHardware Variants<br>\nCrewed aviation unit & <1 kg UAV module<br>\nSupports fuselage or wing-mounted integration on commercial airliners and NATO Class II+ drones.<br>\nExport Classification<br>\nITAR-Free<br>\nPermits international commercial and allied defense deployment without U.S. munitions restrictions.<br>\nRising global incidents of GPS jamming and spoofing—disrupting more than 1,500 commercial flights daily—have prompted aviation regulators and defense agencies to seek passive alternatives to satellite-based positioning. Unlike conventional inertial navigation systems that accumulate positional drift over long flights, Ironstone Opal measures subtle variations in Earth’s crustal magnetic field using atomic quantum sensors and matches them to onboard geomagnetic maps.<br>\nTo operate reliably inside magnetically noisy aircraft frames, the platform pairs quantum magnetometers with AI-driven software ruggedization that filters out airframe interference in real time. The passive, non-emitting architecture has undergone flight evaluations with commercial and defense partners, including Airbus and Lockheed Martin, as well as U.S. defense programs.<br>\nDetails on the DO-160 qualification are available from Q-CTRL here, alongside background on Q-CTRL’s flight trials with Airbus here and Lockheed Martin’s quantum PNT overview here. Related QCR coverage of Q-CTRL’s $24.4M DARPA Robust Quantum Sensors (RoQS) award is available here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"7ee0a0f0364e501173fb02ef4e41f612","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T01:51:20","fetched_at":"2026-11-12 06:22:50","word_count":356,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"4h","domain":"quantumcomputingreport.com"},{"id":"91869947c697ce6c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48652","title":"Anyon Technologies and Q-CTRL Partner on Self-Calibrating Hybrid Quantum Supercomputers","url":"https://quantumcomputingreport.com/anyon-technologies-and-q-ctrl-partner-on-self-calibrating-hybrid-quantum-supercomputers/","summary":"Anyon Technologies and Q-CTRL have partnered to create self-calibrating hybrid quantum supercomputers. They are integrating Q-CTRL's autonomous calibration software, Boulder Opal, with Anyon's superconducting quantum computing systems, which use NVIDIA GPUs. This collaboration aims to automate the setup and maintenance of quantum processors, reducing operational costs and making quantum computing more accessible for commercial use by eliminating manual tuning. The post Anyon Technologies and Q-C","content":"<p>Superconducting quantum hardware developer Anyon Technologies and quantum infrastructure software vendor Q-CTRL have formed a strategic partnership to integrate autonomous calibration and maintenance software into Anyon’s modular quantum computing systems. The collaboration pairs Q-CTRL’s Boulder Opal control platform with Anyon’s NVIDIA GPU-coupled processors to eliminate manual tuning bottlenecks in enterprise data-center environments.<br>\nAutomates cold-start boot-up, closed-loop gate calibration, and continuous drift stabilization.<br>\nOperating superconducting quantum processors typically requires dedicated teams of experimental physicists to manually bring up devices, map qubit frequencies, and recalibrate gates as hardware parameters drift over time. This labor-intensive workflow drives up operating costs and limits system availability for commercial users.<br>\nBy embedding Boulder Opal’s physics-informed control routines directly into Anyon’s hardware stack, the integrated system manages bring-up and parameter tuning automatically. The architecture is designed to present the quantum processor as an on-demand hardware accelerator alongside classical compute clusters without requiring end users to manage low-level pulse calibrations.<br>\nOfficial announcement details are available from Q-CTRL here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"81eb0754dc4b574c03c35727dd7a51ef","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T01:40:46","fetched_at":"2026-11-12 06:22:50","word_count":243,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"4h","domain":"quantumcomputingreport.com"},{"id":"049827754791bcdf","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48648","title":"IBM, Mitsubishi Chemical, and Keio Train Generative Quantum Eigensolvers on 70-Qubit Hardware","url":"https://quantumcomputingreport.com/ibm-mitsubishi-chemical-and-keio-train-generative-quantum-eigensolvers-on-70-qubit-hardware/","summary":"IBM Quantum, Mitsubishi Chemical, Keio University, and NVIDIA have successfully demonstrated a quantum hardware training framework for generative quantum eigensolvers on a 70-qubit processor. This framework, using an autoregressive transformer, was used to simulate complex organotin photoresist molecules with significantly reduced gate counts and circuit depths compared to conventional methods. The research highlights a new approach to overcoming the challenges of simulating strongly correlated ","content":"<p>A research consortium comprising IBM Quantum, Mitsubishi Chemical Corporation, Keio University, and NVIDIA has demonstrated an in-the-loop quantum hardware training framework for autoregressive circuit generators up to 70 qubits. Published on arXiv, the study used the 156-qubit IBM Heron processor ibm_kobe to train transformer-based Generative Quantum Eigensolver (GQE) policies, which were subsequently applied zero-shot to simulate complex organotin photoresist molecules for extreme ultraviolet (EUV) lithography.<br>\n| 70-Qubit GQE-SQD vs. Conventional LUCJ Ansatz Performance |  |  | <br>\n|---|---|---|<br>\n| Architecture Dimension | Hardware-Trained GQE Policy | Transpiled LUCJ Baseline | <br>\n| State Preparation Model | Autoregressive transformer conditioned on molecular descriptors | Fixed spin-balanced Local Unitary Cluster Jastrow operator | <br>\n| 2-Qubit Gate Count (56–70 Qubits) | 64 to 160 gates | 4,248 to 6,952 gates | <br>\n| Transpiled Circuit Depth | 44 to 134 layers | 428 to 536 layers | <br>\n| Active Space Target | Organotin hydroxides and hydrates (32 to 70 qubits) | Identical chemical active-space benchmarks | <br>\n| DMRG Agreement (46–70 Qubits) | 27 of 28 runs within 15 mHa (median 4.5 mHa deviation) | 22.7 to 204.1 mHa raw deviation before excitation injection | <br>\nSimulating strongly correlated electrons in organometallic clusters presents an exponential barrier for classical configuration interaction methods, while deep parameterized circuits quickly decohere on physical quantum processors. Under Sample-based Quantum Diagonalization (SQD), the quantum processor only samples salient bitstring configurations, after which a classical processor reconstructs the active subspace and diagonalizes the molecular Hamiltonian. State preparation quality dictates recovery accuracy, but conventional ansätze often generate prohibitive gate depths once mapped to physical hardware topologies.<br>\nTo eliminate manual circuit synthesis, the team implemented a two-stage reinforcement learning curriculum. After initial pre-training on a noiseless simulator across transition-metal complexes, training continued directly on the ibm_kobe processor across 46- and 70-qubit active spaces. The Stage-2 training loop incorporated a specialized reward penalty to prevent policy collapse onto the classical Hartree–Fock state, consuming 120 million physical hardware shots across 600 calibration jobs.<br>\nThe resulting policies were deployed without retraining against 11 active-space tiers of methyltin trihydroxide, Sn(OH)3-Me, and its mono- and di-hydrates. In operational inference, the policy proposes ten candidate circuits that are executed in a single quantum batch job. A classical ranking pass evaluates configuration counts to select the optimal circuit, after which subspace recovery and Hamiltonian diagonalization proceed entirely on local GPUs without requiring additional quantum execution time.<br>\nThe research was supported in part by Japan’s Cross-ministerial Strategic Innovation Promotion Program (SIP) and the RIKEN JHPC-quantum initiative. Full technical details are available in the preprint on arXiv here, open-source code on GitHub here, and experimental datasets on Zenodo here.<\/p>","content_hash":"8e08020a2fc4285c5430455ff7302dd6","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T00:40:47","fetched_at":"2026-11-12 06:22:51","word_count":441,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"5h","domain":"quantumcomputingreport.com"},{"id":"1fa713f00bd214db","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48644","title":"Patero and Horizen Labs Partner on Enterprise Post-Quantum Migration and Network Protection","url":"https://quantumcomputingreport.com/patero-and-horizen-labs-partner-on-enterprise-post-quantum-migration-and-network-protection/","summary":"Patero and Horizen Labs have partnered to help enterprises migrate their digital communications to quantum-resistant encryption. The collaboration combines Horizen Labs' advisory services with Patero's discovery and hybrid encryption platforms to identify cryptographic assets, sequence migrations, and validate quantum-resilient controls on live infrastructure. This partnership aims to address the engineering challenges of transitioning enterprise IT architectures to quantum-safe standards. The p","content":"<p>Post-quantum security provider Patero and cryptography advisory firm Horizen Labs have announced a commercial collaboration to assist enterprises in transitioning digital communications to quantum-resistant encryption. The partnership combines Horizen Labs’ quantum risk advisory services with Patero’s automated discovery and hybrid encryption platforms to help organizations sequence migrations and validate quantum-resilient controls on live infrastructure.<br>\nAudits infrastructure to identify active cryptographic algorithms, certificates, and visibility gaps.<br>\nAdvisory Framework<br>\nHorizen Labs Advisory Services<br>\nStructures migration roadmaps based on data confidentiality lifespan and operational risk.<br>\nLive Network Enforcement<br>\nPatero CryptoQoR™<br>\nDeploys hybrid post-quantum encryption protocols across scoped data-in-motion connections.<br>\nDeployment Focus<br>\nHigh-priority network conduits<br>\nProtects administrative access paths and inter-site communications against harvest-now, decrypt-later threats.<br>\nTransitioning enterprise IT architectures to quantum-safe standards presents significant engineering friction, as legacy public-key algorithms are deeply embedded across distributed services, operational pipelines, and third-party software. Without end-to-end estate mapping, organizations struggle to determine which cryptographic assets are exposed to intercept-now, decrypt-later risks or identify where protocol changes could trigger system outages.<br>\nThe joint engagement model structures client readiness into defined phases. Horizen Labs establishes the risk governance framework, determining which business operations require immediate cryptographic agility and defining performance criteria for live-traffic trials. Technical teams then conduct pilot runs on production routes, validating interoperability and ensuring verifiable rollback paths before committing capital to enterprise-wide infrastructure overhauls.<br>\nPatero is based within the Quantum Startup Foundry at the University of Maryland, College Park. Details on the partnership are available via the joint press release here. Related QCR reporting on post-quantum deployment frameworks and federal distribution channels includes Carahsoft’s federal catalog expansion with IonQ and PQSecure here, and the CUSP national quantum strategy report here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"db6a1d3b1762172c01bff240573bacda","author":"Mohamed Abdel-Kareem","published_at":"2026-11-12T00:23:47","fetched_at":"2026-11-12 06:22:51","word_count":358,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"5h","domain":"quantumcomputingreport.com"},{"id":"3f8fd75072be643e","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48640","title":"Xanadu Reports Q3 2026 Results with $286M Cash Balance and Expanding R&D Commitments","url":"https://quantumcomputingreport.com/xanadu-reports-q3-2026-results-with-286m-cash-balance-and-expanding-rd-commitments/","summary":"Xanadu reported a 32% year-over-year revenue increase to $1.31 million in Q3 2026, driven by DARPA contracts and commercial partnerships. Despite an expanded operating loss due to increased R&#038;D, the company maintains a strong liquidity position with $286.5 million in cash and significant funding commitments. Operationally, Xanadu is focused on reducing photonic error rates through industrial partnerships to advance its logical qubit roadmap. The post Xanadu Reports Q3 2026 Results with $286","content":"<p>Publicly traded photonic quantum computing company Xanadu (NASDAQ/TSX: XNDU) has announced its financial results for the third quarter ended September 30, 2026. The Canadian developer reported a 32% year-over-year revenue increase to $1.31 million alongside expanded research and development expenditures of $25.56 million, supported by an unrestricted cash balance of $286.47 million and approximately $150 million in newly formalized sovereign funding commitments.<br>\n| Xanadu Quantum Technologies Q3 2026 Financial & Capital Overview |  |  | <br>\n|---|---|---|<br>\n| Financial Metric | Q3 2026 (USD) | Q3 2025 (USD) | <br>\n| Total Revenue | $1,305,000 | $987,000 | <br>\n| Research & Development | $25,560,000 | $15,301,000 | <br>\n| General & Administrative | $9,150,000 | $4,002,000 | <br>\n| Loss from Operations | $(34,627,000) | $(20,696,000) | <br>\n| Adjusted EBITDA Loss | $(26,270,000) | $(15,446,000) | <br>\n| GAAP Net Loss | $(32,196,000) | $(20,298,000) | <br>\n| Cash & Cash Equivalents | $286,473,000 | $16,164,000 (Dec 31, 2025) | <br>\nRevenue growth during the quarter was driven by contract deliveries under the U.S. Defense Advanced Research Projects Agency (DARPA) Quantum Benchmarking Initiative (QBI) alongside commercial partner milestones. The expansion in operating loss reflects accelerated tapeout volumes, experimental silicon nitride wafer fabrication, and engineering additions. Net capital expenditures reached $8.4 million for the quarter, primarily tied to precision optical test instruments.<br>\nThe company enters the final quarter of 2026 with a liquidity structure that includes $286.5 million in balance-sheet cash, a definitive $140 million non-dilutive loan agreement with the Government of Canada under the Strategic Response Fund (SRF) to support its 158,000-square-foot “Inception” manufacturing facility in Toronto, and provisional approval for a $10 million DARPA QBI extension. Furthermore, $232.8 million remains available under its synthetic at-the-market equity facility, providing a combined capital base of $669 million.<br>\nOperationally, the results coincide with industrial partnerships intended to control photonic error rates ahead of the company’s logical qubit roadmap. These initiatives include silicon nitride and superconducting detector manufacturing at GlobalFoundries, lithographic line-edge roughness mitigation with ASML, modular cryostat development with Bluefors, and classical control co-design via the open-source Backline platform with AMD.<br>\nOfficial earnings disclosures are available via Xanadu’s Investor Relations announcement here, the Q3 2026 Investor Presentation here, and the SEC Form 6-K filing here.<\/p>","content_hash":"535cda21e4024d4261f1a60fe563fadf","author":"Mohamed Abdel-Kareem","published_at":"2026-11-11T23:40:52","fetched_at":"2026-11-12 06:22:51","word_count":375,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"6h","domain":"quantumcomputingreport.com"},{"id":"e5c8086579beb9cf","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48636","title":"U.S. Quantum Primacy Commission Outlines Industrial Strategy to Counter Global Supply-Chain Risks","url":"https://quantumcomputingreport.com/u-s-quantum-primacy-commission-outlines-industrial-strategy-to-counter-global-supply-chain-risks/","summary":"A U.S. Quantum Primacy Commission report warns that despite a current U.S. lead in quantum computing, China's higher public funding and lower manufacturing costs threaten long-term competitiveness. The report outlines a four-pillar strategy (Discovery, Development, Deployment, Scale) to maintain U.S. quantum primacy, emphasizing federal intervention to address supply chain vulnerabilities and domestic disparities in funding and infrastructure. A final report with detailed proposals is expected i","content":"<p>The Commission on U.S. Quantum Primacy (CUSP), an advisory coalition convened by the Special Competitive Studies Project (SCSP), has published its preliminary strategy report, Defining the American Quantum Era. Co-chaired by U.S. Senators Todd Young (R-IN) and Ben Ray Luján (D-NM) alongside SCSP President Ylli Bajraktari, the report warns that while the United States maintains an advantage in fundamental research and operational cloud platforms, severe domestic disparities in cleanroom capital costs, cryogenic supply chains, and annual public funding threaten long-term commercial competitiveness.<br>\n| CUSP Strategic Roadmap: Four Pillars of U.S. Quantum Primacy |  |  | <br>\n|---|---|---|<br>\n| Strategic Pillar | Recommended Programmatic Mechanism | Industrial & Operational Objective | <br>\n| Discovery | Dedicated Algorithm & Foundational Research Tracks | Stabilizes multi-year agency funding and creates open-access programs to discover novel mathematical primitives and algorithmic families. | <br>\n| Development | ECP-Style Co-Design & NIST Interoperability Effort | Funds concurrent hardware-software engineering modeled after DOE’s Exascale Computing Project; standardizes multi-QPU benchmarks with industry. | <br>\n| Deployment | DOE Grand Challenges & Accelerated PQC Migration | Establishes repeatable hybrid quantum-classical workflows while transitioning critical civilian infrastructure to post-quantum cryptography. | <br>\n| Scale | National Quantum Foundry Access Program & DPA Title III | Provides shared microfabrication and packaging facilities to offset high cleanroom buildout costs; secures domestic cryogenics and helium-3 supply lines. | <br>\nThe report defines quantum primacy as the enduring capability to discover, engineer, manufacture, and field quantum systems across national security and commercial markets. Drawing on data from 2021 through 2025, the commission highlights a growing industrial imbalance: while U.S. entities operated an estimated 39 to 73 deployed quantum computers in 2025 compared to China’s 15 to 18, China’s estimated public funding of $3 billion annually outpaces the U.S. federal commitment of approximately $1 billion. Furthermore, domestic fabrication faces acute economic pressure, with U.S. cleanroom construction costs averaging $800 to $1,000 per square foot compared to approximately $150 per square foot in China.<br>\nSupply chain concentration represents a primary vulnerability. The report notes that following international export controls, domestic dilution refrigerator production within China expanded roughly 58% between 2021 and 2025, compared to 35% growth in the United States. To address these vulnerabilities, the commission recommends federal intervention to safeguard specialized radio-frequency electronics, optical modulators, and cryogenic isotopes before production bottlenecks restrict commercial scale.<br>\nThe commission comprises executive leadership from IBM, Google Quantum AI, IonQ, SandboxAQ, DARPA, Los Alamos National Laboratory, Sandia National Laboratories, and the University of Maryland. A comprehensive final report detailing specific legislative provisions, workforce initiatives, and budget proposals is scheduled for publication in Spring 2027.<br>\nOfficial release details are available from the Special Competitive Studies Project here, the executive summary portal here, and the complete preliminary report on SCSP PDF here.<\/p>","content_hash":"0847720fce3f92a46d2c608664e2fcec","author":"Mohamed Abdel-Kareem","published_at":"2026-11-11T19:20:01","fetched_at":"2026-11-12 06:22:51","word_count":460,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"11h","domain":"quantumcomputingreport.com"},{"id":"2aa8e3d7f4143ee2","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48623","title":"Quantum Computing Inc. Reports Q3 2026 Financial Results: Revenue Reaches $9.5M, Surpassing First-Half Total on Acquired Photonics and Semiconductor Integration","url":"https://quantumcomputingreport.com/quantum-computing-inc-reports-q3-2026-financial-results-revenue-reaches-9-5m-surpassing-first-half-total-on-acquired-photonics-and-semiconductor-integration/","summary":"Quantum Computing Inc. (QCI) reported strong Q3 2026 financial results, with revenue reaching $9.5 million, surpassing the entire first half of 2026 due to successful integration of acquired companies. The company maintained a debt-free balance sheet with $1.3 billion in capital reserves. QCI also achieved significant commercial and technological milestones, including its first pharmaceutical contract, an international academic partnership, and advancements in its Dirac platform and photonic edg","content":"<p>Quantum Computing Inc. (Nasdaq: QUBT) has announced its financial results for the third quarter ended September 30, 2026. The Hoboken, New Jersey-based integrated quantum photonics and nanosemiconductor company reported accelerating top-line growth, generating more revenue in Q3 than during the entire first half of 2026 combined. Performance was driven by the commercial integration of its acquisitions—Luminar Semiconductor Inc. (LSI), NuCrypt, and NHanced Semiconductors—while the company maintained a debt-free balance sheet with approximately $1.3 billion in total cash, investments, and accrued interest reserves.<br>\nThe table below summarizes key GAAP financial metrics for Q3 2026 compared with the prior quarter (Q2 2026) and the year-ago quarter (Q3 2025).<br>\n| Amounts in $M (except per share) | Q3’2026 | Q2’2026 | Q3’2025 | % vs Q2’2026 | % vs Q3’2025 | <br>\n|---|---|---|---|---|---|<br>\n| Revenue | $9.50 | $5.55 | $0.38 | +71.1% | +2,374.0% | <br>\n| Operating Expenses | $29.01 | $21.85 | $10.53 | +32.8% | +175.5% | <br>\n| Operating Loss | ($28.59) | ($23.01) | ($10.40) | -24.2% | -174.8% | <br>\n| Net Income (Loss) | ($15.15) | ($11.75) | $2.38 | -28.9% | N/M | <br>\n| Cash and Short-Term Investments | $901.61* | $954.17* | $1,117.30 (12/31/25) | -5.5% | -19.3% | <br>\n*Note: Cash and Short-Term Investments strictly aggregates Cash and Cash Equivalents ($174.28M) and Short-Term Investments ($727.33M), totaling $901.61M as of September 30, 2026. Adding long-term investments ($396.20M) and total accrued interest receivable ($10.22M) brings total capital reserves to $1.31 billion ($1,308.04M), with zero long-term debt. Historical comparative baseline reflects December 31, 2025 balances ($737.88M cash + $379.42M short-term investments = $1,117.30M).<br>\nFinancial Highlights & Capital Position<br>\nQCi generated $9.50 million in revenue for Q3 2026, marking a 71.1% sequential increase over Q2 2026 ($5.55M) and a substantial expansion from $384 thousand in Q3 2025. Third-quarter revenue exceeded the $9.24 million generated across the entire first half of 2026. Top-line expansion was primarily driven by commercial deliveries of photonic components, quantum communications hardware, and advanced semiconductor packaging services to aerospace, government, and industrial customers following the integration of LSI, NuCrypt, and NHanced.<br>\nGross profit totaled $428 thousand, representing a gross margin of 4.5%, as the company continues to scale foundry operations and optimize capacity utilization across its fabrication facilities.<br>\nOperating expenses for the quarter rose to $29.01 million, compared to $21.85 million in Q2 2026 and $10.53 million in Q3 2025. The year-over-year increase was driven by expanded research and development personnel, scaling commercial go-to-market teams, and approximately $1.0 million in acquisition-related transaction and integration expenses. Operating loss widened to ($28.59) million.<br>\nGAAP Net Loss for Q3 2026 was ($15.15) million, or ($0.07) per basic and diluted share, compared to net income of $2.38 million in Q3 2025 (which had been elevated by a $9.25M warrant derivative fair-value gain). The operating loss was partially offset below the line by $13.05 million in interest and other income earned on the company’s $1.31 billion liquid asset base and a $458 thousand derivative liability fair-value gain.<br>\nContract backlog stood at $39.1 million as of September 30, 2026, compared to $42.5 million at the end of Q2 2026, reflecting contract execution and revenue conversion during the period.<br>\nCommercial Milestones & Academic Collaborations<br>\n- First Pharmaceutical Commercial Contract: Entered into a commercial agreement with INmune Bio to apply QCi’s Dirac quantum optimization platform, combined with AI and conventional data analytics, to clinical and biomedical datasets for investigational Alzheimer’s disease therapeutics. This marks QCi’s initial commercial deployment within the biopharmaceutical sector.<br>\n- International Academic Partnership: Signed a framework agreement with Hamad Bin Khalifa University in Qatar to advance quantum computing research, education, and workforce training. The collaboration provides cloud-based access to QCi’s Dirac-3 entropy quantum optimization platform to investigate optimization, sensing, and quantum-secured communication use cases.<br>\n- Commercial Integration of Foundry and Packaging Assets: Advanced the integration of Fab 1 (thin-film lithium niobate / TFLN chip prototyping in Tempe, Arizona) and Fab 2 (advanced packaging and 3D heterogeneous integration in North Carolina and Indiana), expanding customer engagements across commercial defense and aerospace supply chains.<br>\nTechnology Roadmap & Manufacturing Progress<br>\n- Dirac Platform Benchmarking: Progressed toward publishing head-to-head benchmarking results for the 10,000-variable Dirac-3 system against classical mathematical solvers, validating the capabilities of room-temperature entropy quantum optimization for complex logistics and financial portfolio modeling.<br>\n- Photonic Edge AI (NeuraWave): Continued commercialization of its NeuraWave photonic reservoir computing platform following its deployment-readiness milestone and framework agreement with Planck Dynamics for high-efficiency AI inference.<br>\n- TFLN Process Development: Advanced wafer-scale process development for proprietary thin-film lithium niobate (TFLN) optical chips, targeting complete on-chip detector integration and hybrid 3D integration with silicon photonics to support telecommunications and quantum-secure communications (QKD) hardware.<br>\nResources and Further Reading<br>\nAdditional details regarding this report can be found in the Quantum Computing Inc. Q3 2026 earnings press release here, the QCi Investor Presentation here, and the company’s SEC Form 8-K filing here.<\/p>","content_hash":"f3ed4d366ef91321bb367d80404ac751","author":"Mohamed Abdel-Kareem","published_at":"2026-11-11T18:37:34","fetched_at":"2026-11-12 06:22:51","word_count":814,"read_time_minutes":5,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"11h","domain":"quantumcomputingreport.com"},{"id":"f98a357a67e50529","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10318","title":"Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!","url":"https://scottaaronson.blog/?p=10318","summary":"Enjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code&#8217;s limitations. She doesn&#8217;t get to the soundness analysis. Feel free to ask questions in the comments. I mig","content":"<p>Enjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code’s limitations. She doesn’t get to the soundness analysis.<br>\nFeel free to ask questions in the comments. I might write some notes here later with my own doofus understanding of Dana’s talk. Experts are of course hard at work on more formal writeups of the proof (which will hopefully be more comprehensible than the AI’s writeup).<br>\nThis entry was posted<br>\non Tuesday, November 10th, 2026 at 2:27 pm and is filed under AI, Announcements, Complexity.<br>\nYou can follow any responses to this entry through the RSS 2.0 feed.<br>\nYou can leave a response, or trackback from your own site.<br>\n38 Responses to “Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"f7a800a85a7d77e79118fdb829a66b1d","author":"Scott","published_at":"2026-11-10T20:27:28","fetched_at":"2026-11-12 06:22:47","word_count":340,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1d","domain":"scottaaronson.blog"},{"id":"3a6f0747d33bd6f2","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10295","title":"Aaronson-Ambainis Conjecture proved!  (By AI, of course)","url":"https://scottaaronson.blog/?p=10295","summary":"The &#8220;For Dummies&#8221; Version (apologies for not including this earlier): Yes, an AI solved a big open problem about quantum computing No, this doesn&#8217;t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter What it does, is to rule out a potential class of quantum speedups that most of us didn&#8217;t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially ","content":"<p>Aaronson-Ambainis Conjecture proved! (By AI, of course)<br>\nThe “For Dummies” Version (apologies for not including this earlier):<br>\n- Yes, an AI solved a big open problem about quantum computing<br>\n- No, this doesn’t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter<br>\n- What it does, is to rule out a potential class of quantum speedups that most of us didn’t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially faster than any classical algorithm)<br>\n- It means my prediction was right, so you should listen to me more in the future!<br>\nWe now, of course, live in age where longstanding open problems in quantum computing theory (and all theoretical computer science, and all math) are dropping like flies, to the extent that there’s no way I could possibly do a post on each and every bombshell. But I can’t exactly avoid the Aaronson-Ambainis Conjecture, given that my name is on it, and that I cared about the answer to this one (back in 2019, I even blogged about an attempted solution that ultimately turned out to be fallacious).<br>\nFor those tuning in from home, the AA Conjecture, which Andris and I posed back in 2009, says that every degree-d polynomial p:{0,1}n→[0,1] in n Boolean variables, with constant variance, has some variable whose influence is at least 1/poly(d). The reason Andris and I cared about this conjecture is that, as we proved, it implies that there’s no superpolynomial advantage of quantum query complexity over classical query complexity for decision problems that works on most Boolean inputs. Or, in terms of complexity classes, that there’s no hope of separating P from BQP relative to a random oracle, without proving P≠BQP or something of the kind in the unrelativized world. This would finally answer a question of Fortnow and Rogers from 1998.<br>\nThe connection between quantum algorithms and polynomials came from the famous 1998 paper of Beals et al., which showed that, if Q is a quantum algorithm that makes T queries to an oracle X, then Pr[Q(X) accepts] can be written as a multivariate real polynomial p(X) in the bits of X, of degree at most 2T. The proof of my and Andris’s result is then simply this: take the polynomial p, find in it a variable of influence at least 1/poly(T), and query that variable, and keep repeating until there’s no longer such an influential variable—at which point, by assumption, p is nearly a constant polynomial, which means you’ve learned whether Q accepts with high probability over X. This provides a classical simulation of the quantum algorithm Q—a simulation that makes poly(T) queries to the oracle X and that works for most X’s.<br>\nThe AA Conjecture caught on to an extent Andris and I couldn’t have predicted. Some who worked on it barely even cared about the implication for quantum computing, and just wanted to solve the problem about polynomials! There were, I’m both proud and sorry to report, Fourier analysis experts and grad students who oriented their whole research programs around trying to prove AA, with lots of proofs of special cases, some of them very recent. A proof of full AA was one of the last remaining open problems in quantum query complexity that everyone seemed to agree was centrally important. I was surprised, honestly, to see it missing from OpenAI’s Mathocalypse dump a few weeks ago. Surely they tried it, so was it really so much harder than all the problems that were solved?<br>\nNow a startup called Physical Superintelligence has announced a proof of the AA Conjecture, specifically showing that there’s a variable of influence at least ~1/d6, which they say they obtained using their proprietary research harness on an internal Claude model. (What role the harness played, compared to the internal model, is something I don’t know.) The effort was led by David Turturean and Jim Halverson at PSI. They actually let me know about this several weeks ago, but I had to keep it secret until the announcement late last week.<br>\nI haven’t yet understood the proof, although I hope to. In the meantime, though, I believe the proof is correct for two reasons. Firstly, there’s a Lean certificate, and secondly, human experts (I’m no longer an expert on my own conjecture!) have already gone over it and understood it. In fact, there’s already a beautiful-looking exposition written by Guy Blanc of MIT and Jordan Docter, Carmen Strassle, and Li-Yang Tan of Stanford, which looks like a perfect starting point for those seeking to go much deeper. Or, for those seeking to go only slightly deeper, PSI’s blog post on the advance is sufficiently well-written that it saves me from the need to write too much more here.<br>\nAlas, as reported by Ashley Montanaro, there were the usual forehead-banging misconceptions about what this result means for quantum computing. So for example, Pedro Domingos of U. of Washington blasted out to his 137,000 X followers that the proof means that “the dream of quantum supremacy is dead.” The truth, as Pedro knows perfectly well (or easily could know), is that it rules out one particular type of quantum supremacy (namely, for yes-or-no problems relative to random oracles) that we’d already conjectured didn’t exist anyway. It doesn’t undermine any form of quantum supremacy that we did conjecture to exist! It has zero effect, for example, on Shor’s factoring algorithm, which uses a highly non-random (periodic) oracle for the key internal step. It has zero effect on the simulation of quantum physics and chemistry, which generally doesn’t depend on oracle algorithms at all. Even just relative to random oracles, the Yamakawa-Zhandry breakthrough from 2022 dramatically underscored that, if we switch our attention from decision problems to other kind of problems (in Yamakawa and Zhandry’s case, to NP search problems), then exponential quantum speedups do become possible. Anyway, this was sufficiently intellectually dishonest on Pedro’s part that it makes me disinclined to take him seriously about anything ever again [ADDED: I appreciate that Pedro has now posted a partial correction, saying “or maybe not”].<br>\nBut, OK, given how radically new it is to have an AI solve so many of our longstanding open problems, I suppose “people are wildly misinterpreting a QC advance on social media” is an almost comfortingly familiar problem to have!<br>\nIf you’re wondering how I feel about the proof of AA—well, much like my wife Dana with the Unique Games Conjecture, it’s many different emotions at once.<br>\n- Satisfied that our conjecture turned out to be true after all (it’s nice to be 100% right about something from time to time!)<br>\n- Awestruck by the new reality of the world in which we live in<br>\n- Disappointed that humans didn’t get to snag this conjecture before the robots did (with some more years, I think it’s very likely that they would have)<br>\n- Fatigued by the endless wonders from Aladdin’s Cave, the neverending buffet of solutions to longstanding open problems, wondering when if ever we’ll have time to digest it all<br>\nAnyway, huge congratulations to David Turturean and Jim Halverson, to Physical Superintelligence, and of course to Claude on this achievement!<\/p>","content_hash":"e46a0b6f8c333f0b84c8d702e495bd88","author":"Scott","published_at":"2026-11-08T21:44:31","fetched_at":"2026-11-12 06:22:47","word_count":1204,"read_time_minutes":7,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"3d","domain":"scottaaronson.blog"},{"id":"9759b0106f7703ca","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10283","title":"Thoughts on a historic week","url":"https://scottaaronson.blog/?p=10283","summary":"As everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole&#8212;because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI&#8217;s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin&#8217;s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it. But","content":"<p>Thoughts on a historic week<br>\nAs everyone knows, this week was a (an?) historic one for the State of Texas and for the United States as a whole—because this is the week when my wife Dana finally gave a 3-hour public lecture on OpenAI’s recent proof of the Unique Games Conjecture! Thanks so much to the nearly 200 people who joined us in person or via Zoom, and to the staff of UT Austin’s CS department for pulling the event together on short notice. Video will be up on YouTube as soon as we can manage it.<br>\nBut also, yes, there was an election.<br>\nI remember that, when Dana and I moved to Texas in the summer of 2016, we were excited to be a small part of what seemed at the time like Texas’s impending transformation into a cosmopolitan blue state.<br>\nAnd now the prophecy is finally being fulfilled. But so many strange and harrowing things have happened in the interim, that I feel like Murph when her father finally returns to her at the end of the movie Interstellar.<br>\nSo it turns out that, indeed, the Democrats could’ve easily recaptured both houses of Congress without any need to sell their souls to the likes of Hasan Piker or Abdul El-Sayed. And now the keffiyeh-clad revolutionaries will claim a mandate directly from the people, to put to the sword all the evil landlords and techbros and kulaks and bourgeoisie and (obviously) Zionists, and thereby finally usher in the utopia that failed the first 10,000 times it was tried. I see them as more likely to inspire a Republican comeback in 2028 (as unlikely as it seems this week) than to achieve their stated goals.<br>\nFor please remember that the socialist firebrands massively underperformed more moderate Democrats on Tuesday—it looks like the socialists were merely lifted up by the same tide of justified anti-MAGA rage. Yes, in the US and across the Western world, some university humanities departments continue to churn out young people who’d see my family’s slaughter as an inspiring (or at least deeply understandable) act of revolutionary justice, and who vote on that basis. By and large, though, the American voters simply belatedly realized that Trump is a charlatan who was never going to deliver anything he promised, and also they wanted cheaper gas.<br>\nThe Allied victory over Nazi Germany was glorious, it called for parades and dancing in the street, and it was 3,000% earned by Nazi behavior if anything in human history ever was. It left only one tiny problem for the future—namely that, within the winning coalition, the fans of liberal democracy, science, and Enlightenment still needed to confront the Stalinists, whose evil rivaled even the Nazis’, yet who believed their fanatical ideology to be the one vindicated by events. Why was I so often thinking about that these past couple days?<br>\nThere was, of course, also a big election in Israel. Given the results, I pray that Gadi Eisenkot finds some way to form a coalition, or at least soft coalition, with Israel’s Arab parties, since that’s clearly what it will now take finally to topple Netanyahu, a man whose corruption (like Trump’s or Ken Paxton’s) knows no bounds. I’m under no illusions that this step would do anything to appease the hundreds of millions of protesters around the world whose true demand (as they’ll explain if you ask them) never had anything to do with Israeli policies or Gaza or the West Bank or Bibi Netanyahu, but was always simply that Israel cease to exist—that Israel’s Jews either “go back to Poland” or the other countries where their grandparents were murdered or expelled, or preferably just die, as on October 7.<br>\nNevertheless, I pray for a coalition of moderate Israeli Jews and Arabs, firstly because it’s morally right, secondly because it’s politically expedient, and thirdly because it will impress on at least some fair-minded observers the enormity of the moral chasm here—that, whereas the Arab countries expelled or murdered virtually all of their Jews, the State of Israel not only tolerates its Arab minority but gives it the right to vote and to wield power.<br>\nWhatever else one can say, Israel’s Arabs have been sufficiently loyal to their nation that, on October 7, Hamas murdered them right along with the Jews, treating them as Zionist collaborators and traitors to Islam. I’d like to see that loyalty rewarded with a role in Israel’s governing coalition.<br>\nAs is becoming standard practice with my political posts, I’m closing the comments—because life is short, and these days, the overwhelming majority of comments that I get on posts like this one, whichever ideological axe they’re grinding, are not ones that engender in me even minimal respect for their authors. I apologize to those who would’ve actually pursued a thoughtful dialogue with me or others had I left the comments open—to all five of you, or however many righteous men of Sodom there might be.<\/p>","content_hash":"5eccb21b41c4e341023a500092effa66","author":"Scott","published_at":"2026-11-05T17:48:44","fetched_at":"2026-11-12 06:22:48","word_count":827,"read_time_minutes":5,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"6d","domain":"scottaaronson.blog"},{"id":"d96a14c03a92c48b","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10270","title":"Podcasts about the Topic: Part III, with Brian Greene","url":"https://scottaaronson.blog/?p=10270","summary":"Boooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems! So it seems like a perfect occasion to share yet another podcast. I know I&#8217;ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don&#8217;t talk about OpenAI&#8217;s refutation of the Exponential Time Hypothesis be","content":"<p>Boooooo! What spooooky times we now live in, with AI rapidly advancing in capabilities and solving more and more major open math problems!<br>\nSo it seems like a perfect occasion to share yet another podcast. I know I’ve been dropping them like every day, but this is a special one, with Brian Greene for his World Science Festival, recorded in-person when I visited Columbia University a week ago. Note that we don’t talk about OpenAI’s refutation of the Exponential Time Hypothesis because the announcement of that was still two days in the future!<br>\nBonus Addition From Just This Morning (Nov. 3):Another podcast, about quantum computing, foundations of quantum mechanics, AI, consciousness, and I forget what else … this one with writer Robert Wright, whose book The Moral Animal made a huge impression on me back when I was 13 years old!<br>\n53 Responses to “Podcasts about the Topic: Part III, with Brian Greene”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"5f31b5c964cb91b5a2d2cebf734ed352","author":"Scott","published_at":"2026-10-31T21:40:33","fetched_at":"2026-11-12 06:22:48","word_count":310,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"0083cc178c901677","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10232","title":"Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)","url":"https://scottaaronson.blog/?p=10232","summary":"In my &#8220;Mathocalypse&#8221; post, I mentioned that my wife Dana&#8212;who&#8217;s been working on Subhash Khot&#8217;s Unique Games Conjecture since ~2009, for the entire time I&#8217;ve known her&#8212;has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI&#8217;s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, ","content":"<p>Talk by Dana Moshkovitz: The Unique Games Conjecture – Proved (!!?)<br>\nIn my “Mathocalypse” post, I mentioned that my wife Dana—who’s been working on Subhash Khot’s Unique Games Conjecture since ~2009, for the entire time I’ve known her—has for the past few weeks (while on sabbatical at the Simons Institute in Berkeley) been spending essentially all of her time laboring to understand OpenAI’s recent proof of the conjecture. Having now studied the proof closely in collaboration with Subhash Khot himself, Johan Håstad, Dor Minzer, and other colleagues, and (naturally) GPT-6 Astra, Dana probably now understands this crown jewel of OpenAI’s release as well as anyone does. This week, she gave two well-received whiteboard talks on the proof at Simons Institute. So, I and others encouraged her to give the same talks next week at UT Austin when she’s back here, and Dana agreed! Because of the large timely interest, we’re going to do a live Zoom option, and will also record the talk for later sharing on YouTube. Please note: While all are welcome, this is a 2-hour technical talk. The first hour will review key ideas from hardness of approximation, while the second hour will describe the new construction. —SA<br>\nTitle: The Unique Games Conjecture – Proved (!!?)<br>\nSpeaker: Dana Moshkovitz (UT Austin)<br>\nWhen: Wednesday Nov. 4, 3:30-5:30pm US Central (with a brief break in the middle)<br>\nWhere: UT Austin, Gates Dell Complex 6.302. Live Zoom will be available here, and a recording will be available later.<br>\nAbstract: The Unique Games Conjecture of Khot says that it is NP-hard, given a system of linear equations of the form xi-xj=bij (mod p) over variables x1…xn, where 99% fraction of the equations can be satisfied, to find an assignment satisfying 1% of the equations (here p is a sufficiently large constant).<br>\nThis conjecture implies optimal inapproximability results for many optimization problems.<br>\nA few weeks ago OpenAI released a writeup with a proof of the Unique Games Conjecture, as well as a Lean formalization of the proof. The writeup, like others released that day, is not written in a way that’s especially readable to human mathematicians.<br>\nMy goal in this talk is to offer my mental map of the proof, in a way that’s helpful to theoretical computer scientists who are familiar with the area. I think of the innovation as a new code construction, “Hadamard with a noise test.” I’ll sketch how it fits into the NP-hardness reduction. Then I’ll describe the code construction fully and sketch its soundness analysis.<br>\nI’ll also point out a couple of ingredients of the proof that are of independent interest, like a simple quadratic that behaves “like a linear,” and a probability bound using a trick with harmonic numbers.<\/p>","content_hash":"f81a4183271bf90cffcc544e4703c469","author":"Scott","published_at":"2026-10-30T23:27:34","fetched_at":"2026-11-12 06:22:48","word_count":454,"read_time_minutes":3,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"19962db08186efd4","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10239","title":"Podcasts about the Topic: Part II","url":"https://scottaaronson.blog/?p=10239","summary":"As always, I strongly recommend 2x speed, which compensates somewhat for my verbal infelicities! New! More podcasts keep dropping! This one is with the AI alignment researcher Roman Yampolskiy, about &#8230; well, AI alignment, plus the Mathocalypse, plus quantum computing, plus whether the universe is a simulation, and I forget what else! Man do the YouTube comments make me despair of humanity though. Another one that recently dropped, with Sophia Aryan: With Curt Jaimungal: The title Curt put ","content":"<p>Podcasts about the Topic: Part II<br>\nAs always, I strongly recommend 2x speed, which compensates somewhat for my verbal infelicities!<br>\nNew! More podcasts keep dropping! This one is with the AI alignment researcher Roman Yampolskiy, about … well, AI alignment, plus the Mathocalypse, plus quantum computing, plus whether the universe is a simulation, and I forget what else! Man do the YouTube comments make me despair of humanity though.<br>\nAnother one that recently dropped, with Sophia Aryan:<br>\nThe title Curt put next to my head could’ve been in reference to many, many things! But sorry, he just mean AI. He and I start with the Mathacre, of course, but then we get onto the firewall paradox and then Curt starts asking about computational complexity and the Second Law, and then about Integrated Information Theory.<br>\nAh, and another one that just dropped! Man’s Search for Meaning podcast (recorded in-person in Austin), with Yannick Bernard, who asked me about quantum computing, AI, my personal story, grade-skipping, antisemitism, and I don’t even remember what else. I didn’t refuse to answer anything. (Note: this one was recorded over the summer, which is why I so weirdly omit the latest AI math breakthroughs!)<br>\nOK, despite the title of this post, short break from “The Topic.” Here’s an absolute masterpiece of mathematical exposition, from the “Polylog” YouTube channel, which tells the story of the determination of Busy Beaver values through spectacular animations. I play cameo roles in the video, although I embarrass myself (as the video silently points out) by transposing two digits in the value of BB(5)…!<br>\nJust for old times’ sake, a short podcast about quantum computing with Danny Li.<br>\nAnd, coming soon (not on YouTube quite yet): a conversation about the Mathacre with celebrated physics popularizer (and character on The Big Bang Theory) Brian Greene, recorded in-person in NYC during my recent trip to speak in the math department at Columbia University!<br>\nAnd to preempt the inevitable comments about it: yes, my students just came to my office to tell me that an OpenAI model has now refuted the Exponential Time Hypothesis, by giving an algorithm to solve 3SAT in an amount of time that scales roughly like exp(n/√log(n)). Even as we struggle to digest the previous courses, the endless buffet continues!<\/p>","content_hash":"7dc0b77b2276479ae01c78d4fd42e578","author":"Scott","published_at":"2026-10-26T22:03:37","fetched_at":"2026-11-12 06:22:49","word_count":379,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"971900c926d04767","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18331","title":"Lunch with Horace Walpole","url":"https://quantumfrontiers.com/2026/10/25/l
