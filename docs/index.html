  <title>Meridian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FFFCF0;
      --card: #F2F0E5;
      --text: #2D2B28;
      --dim: #6F6E69;
      --muted: #DAD8CE;
      --up: #66800B;
      --down: #AF3029;
      --accent: #205EA6;
      --spark: #8B5CF6;
      --score: #AD8301;
      --link: #24837B;
      --particle: #24837B;
    }

    html { font-size: 10px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding: 4px;
      min-height: 100vh;
      font-weight: 400;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 4px 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--muted);
    }

    .title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .timestamp { color: var(--dim); font-size: 9px; }

    .dashboard {
      position: relative;
    }

    .card-wrapper {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 2px;
      overflow: hidden;
      /* top, left, width set by JS layout engine */
    }

    .card-wrapper canvas {
      display: block;
      width: 100%;
    }

    .card-wrapper .links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card-wrapper .links a {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      color: transparent;
      text-decoration: none;
      display: block;
    }

    footer {
      margin-top: 8px;
      padding: 6px 4px;
      border-top: 1px solid var(--muted);
      text-align: center;
      color: var(--dim);
      font-size: 7px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .footer-links {
      margin-bottom: 6px;
    }

    .footer-links a {
      margin: 0 4px;
    }

    .ascii-footer {
      margin: 8px auto 4px;
      font-size: 8px;
      line-height: 1.1;
      color: var(--dim);
      opacity: 0.5;
      user-select: none;
      overflow: hidden;
      max-width: 400px;
    }

    .ascii-footer .particle {
      display: inline-block;
      color: var(--particle);
      opacity: 0.4;
    }

    .ascii-footer .meridian-text {
      color: var(--dim);
      letter-spacing: 1px;
    }

    @keyframes particleDrift {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.6; transform: translateY(-1px); }
    }

    .ascii-footer .p1 { animation: particleDrift 3s ease-in-out infinite; }
    .ascii-footer .p2 { animation: particleDrift 3s ease-in-out infinite 0.3s; }
    .ascii-footer .p3 { animation: particleDrift 3s ease-in-out infinite 0.6s; }
    .ascii-footer .p4 { animation: particleDrift 3s ease-in-out infinite 0.9s; }
    .ascii-footer .p5 { animation: particleDrift 3s ease-in-out infinite 1.2s; }
    .ascii-footer .p6 { animation: particleDrift 3s ease-in-out infinite 1.5s; }

    @media (prefers-reduced-motion: reduce) {
      .ascii-footer .particle {
        animation: none;
        opacity: 0.3;
      }
    }

    noscript p {
      text-align: center;
      padding: 20px;
      color: var(--dim);
      font-size: 9px;
    }
  </style>
</head>

//quantumcomputingreport.com/etsi-identifies-technical-limitations-and-implementation-vulnerabilities-in-quantum-random-number-generators-etsi-tr-104-171/","summary":"ETSI's new report, TR 104 171, addresses vulnerabilities in Quantum Random Number Generators (QRNGs) due to practical hardware limitations. It provides guidelines across the QRNG lifecycle, including the Entropy Zero Trust (EZT) framework to mitigate side-channel attacks. The report also sets priorities for future standardization, such as API command sets and integration with post-quantum cryptography. The post ETSI Identifies Technical Limitations and Implementation Vulnerabilities in Quantum R","content":null,"content_hash":"2b0b205a62bf81b58f026c6a0242ccc9","author":"Mohamed Abdel-Kareem","published_at":"2026-09-26T09:38:41","fetched_at":"2026-09-26 15:39:40","word_count":67,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"6h","domain":"quantumcomputingreport.com"},{"id":"a8534911901cfee9","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47049","title":"Pasqal Reports H1 2026 Financial Results: €312.9M Post-SPAC Cash Balance, 14% Revenue Growth, and 1,000-Atom Scale","url":"https://quantumcomputingreport.com/pasqal-reports-h1-2026-financial-results-e312-9m-post-spac-cash-balance-14-revenue-growth-and-1000-atom-scale/","summary":"Pasqal reported strong H1 2026 financial results with €312.9M post-SPAC cash and 14% revenue growth. The company achieved significant technological breakthroughs, including scaling to 1,024 atoms and demonstrating logical qubit execution. Pasqal also expanded commercially with new deployments in Saudi Arabia and Italy, and became an XPRIZE finalist. The post Pasqal Reports H1 2026 Financial Results: €312.9M Post-SPAC Cash Balance, 14% Revenue Growth, and 1,000-Atom Scale appeared first on Quantu","content":null,"content_hash":"6f054d0ab00b03c4b22f9000511b69be","author":"Mohamed Abdel-Kareem","published_at":"2026-09-26T07:12:38","fetched_at":"2026-09-26 15:39:40","word_count":70,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"8h","domain":"quantumcomputingreport.com"},{"id":"a1458276593ec1ee","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47043","title":"Fairfax County Public Schools to Install XeedQ 4-Qubit Quantum Computer at Skyview High School","url":"https://quantumcomputingreport.com/fairfax-county-public-schools-to-install-xeedq-4-qubit-quantum-computer-at-skyview-high-school/","summary":"Fairfax County Public Schools (FCPS) will be the first K-12 public high school to install a physical quantum computer, the XeedQ XQ1e, at Skyview High School in December 2026. This 4-qubit quantum computer operates at room temperature and offers high-fidelity quantum computing for student learning. The initiative aims to create a regional talent development hub in quantum computing. The post Fairfax County Public Schools to Install XeedQ 4-Qubit Quantum Computer at Skyview High School appeared f","content":"<p>Public school district Fairfax County Public Schools (FCPS) in Northern Virginia has announced a regional partnership with regional economic development initiative Connected DMV and the Fairfax County Economic Development Authority (FCEDA) to deploy an operational, on-premises quantum computer at Skyview High School. Scheduled for delivery and installation in December 2026, the deployment marks the world’s first reported installation of physical quantum computing hardware in a K-12 public high school environment, with student learning pathways launching in Spring 2027.<br>\nThe school district selected German deep-tech hardware startup XeedQ GmbH to supply its turn-key XQ1e processor—a 4-qubit quantum computer engineered for room-temperature, solid-state execution. Powered by nitrogen-vacancy (NV) center spin qubits in diamond, the desktop-sized unit operates inside a standard room-temperature environment without cryogenic refrigeration, drawing 500 Watts from a conventional wall outlet. The XQ1e system delivers single-qubit gate fidelities of up to 99.9% and two-qubit gate fidelities of up to 97%, providing students and educators with both high-level circuit programming and low-level pulse control via Python and Jupyter notebook interfaces.<br>\n| [ XeedQ XQ1e Hardware Specifications & FCPS Deployment Metrics ] |  |  | <br>\n|---|---|---|<br>\n| Parameter | Hardware Specification | Operational Footprint | <br>\n| Processor & Qubit Type | • XeedQ XQ1e (4 Spin Qubits) • Diamond NV-Center Solid-State Qubits | • Room-temperature operation (no cryogenics) • Automatic alignment & self-calibration | <br>\n| Gate Fidelities & Control | • 1-Qubit Gate Fidelity: Up to 99.9% • 2-Qubit Gate Fidelity: Up to 97% | • Gate-level circuit & direct pulse-level control • Open-source Python & Jupyter notebook API | <br>\n| Form Factor & Deployment | • Refrigerator-sized / mini file-cabinet chassis • Power Consumption: 500 W (wall plug) | • Installation: December 2026 at Skyview High School • Curriculum rollout: Spring 2027 term | <br>\nLed by Founder and CEO Dr. Gopalakrishnan Balasubramanian, Leipzig-based XeedQ develops compact spin-qubit quantum processors aimed at mobile, educational, and edge-computing applications. Coordinated through Connected DMV’s Potomac Quantum Innovation Center (PQIC), the Skyview High School deployment will act as a regional talent-development hub, connecting secondary education coursework with universities, federal research laboratories, and commercial defense tech firms across the Greater Washington region.<br>\nReview the public disclosure via FCPS Official News here, examine hardware platform specs at XeedQ Product Documentation here, explore regional workforce programs via Fairfax County EDA here.<br>\nSeptember 25, 2026<\/p>","content_hash":"760c762ffe298d2aa65ce9c1ac55ef0d","author":"Mohamed Abdel-Kareem","published_at":"2026-09-26T05:40:48","fetched_at":"2026-09-26 15:39:40","word_count":390,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"9h","domain":"quantumcomputingreport.com"},{"id":"b8ced9e10bc91b91","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47018","title":"European Commission Approves eCAUSIS Results as Creotech Quantum Prepares QKD System for Commercial Rollout","url":"https://quantumcomputingreport.com/european-commission-approves-ecausis-results-as-creotech-quantum-prepares-qkd-system-for-commercial-rollout/","summary":"Creotech Quantum's eCAUSIS project, funded by Horizon Europe, has received European Commission approval for its DV-QKD platform, transitioning it from R&amp;D to commercial production. The project, with a total budget of nearly €7 million, involved Creotech Quantum as coordinator, along with AIT Austrian Institute of Technology and Fraunhofer Society. This initiative establishes a European supply chain for QKD modules, with an initial capacity of 1,000 units per year, potentially expanding to 10","content":"<p>Warsaw-listed quantum technology developer Creotech Quantum S.A. (GPW: CTQ) has received formal approval from the European Commission for the completion of project eCAUSIS (European, Certifiable, Affordable, User-oriented, Secure, Integration-able, Scalable quantum key distribution solutions). Executed under the Horizon Europe framework, the Digital Europe Programme (Project ID: 101091564), and the EuroQCI (European Quantum Communication Infrastructure) initiative, the technical and financial validation transitions Creotech Quantum’s proprietary Discrete-Variable Quantum Key Distribution (DV-QKD) platform from R&D into commercial production.<br>\nThe eCAUSIS project carried a total overall budget of €6,977,626.81 ($8 million USD) (with €4,523,868.99 ($5.155 million USD) in EU grant funding). Creotech Quantum served as consortium coordinator alongside the AIT Austrian Institute of Technology and the Fraunhofer Society (Fraunhofer HHI). Creotech’s share of the project totaled €4,180,000 ($4.76 million USD) in eligible costs (funded up to €3.13 million ($3.57 million USD)), while Fraunhofer HHI (€1.16M ($1.3M USD) EU contribution) developed 1300 nm InGaAs single-photon avalanche diode (SPAD) detector modules with CMOS active-quenching ICs, and AIT (€254K ($290K USD) EU contribution) delivered the production-ready, ETSI-compliant AURORA Key Management System (KMS) and SDN suite. The resulting architecture features an interoperable DV-QKD hardware module in a PCIe form factor, integrated optical assemblies, and platform-independent software aligned with ETSI certification frameworks and Common Criteria standards using the decoy-state BB84 protocol.<br>\n| [ eCAUSIS Project Financials, Consortium Architecture & Industrial Roadmap ] |  |  | <br>\n|---|---|---|<br>\n| Consortium & Budget Allocation | System & Optoelectronic Deliverables | Manufacturing & Scaling Capacity | <br>\n| • Overall Budget: €6.98 Million • EU Contribution: €4.52 Million • Coordinator: Creotech Quantum (€4.18M) | • Interoperable DV-QKD PCIe module • Fraunhofer HHI 1300 nm SPAD & ASIC drivers • AIT AURORA ETSI GS QKD 014/020 KMS | • Commercial market launch: 2026 • Initial capacity: 1,000 units/year • Scaled target: Up to 10,000 units/year | <br>\nFollowing its corporate spin-off from Creotech Instruments S.A., Creotech Quantum assumed all intellectual property rights and commercialization rights for the project. The project’s manufacturing framework establishes a European supply chain capable of producing up to 1,000 QKD modules per year at launch, with potential expansion to 10,000 units annually to supply terrestrial, metropolitan, and cross-border EuroQCI secure communication networks.<br>\nReview the corporate announcement via Creotech Quantum LinkedIn here, inspect European Commission details on the EU Funding & Tenders Portal (Project 101091564) here, and inspect partner research profiles via Fraunhofer HHI eCAUSIS Briefing here.<br>\nSeptember 25, 2026<\/p>","content_hash":"08e293b8507630d91626bffe5947edcf","author":"Mohamed Abdel-Kareem","published_at":"2026-09-25T16:58:36","fetched_at":"2026-09-26 15:39:40","word_count":400,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"22h","domain":"quantumcomputingreport.com"},{"id":"a84ac2203e30b3bd","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47013","title":"Creotech Quantum Wins €2.33M ($2.66M USD) ESA Contract for Space-Grade Quantum Detectors","url":"https://quantumcomputingreport.com/creotech-quantum-wins-e2-33m-2-66m-usd-esa-contract-for-space-grade-quantum-detectors/","summary":"Creotech Quantum has secured a €2.33M contract from the European Space Agency (ESA) to develop advanced Superconducting Nanowire Single-Photon Detectors (SNSPDs) over 24 months. These detectors will be crucial for European quantum key distribution networks and deep-space optical communication, reaching Technology Readiness Level 5 (TRL 5). Creotech Quantum will lead the consortium, overseeing the design, manufacturing, and validation of the SNSPDs. The post Creotech Quantum Wins €2.33M ($2.66M U","content":"<p>Warsaw-listed quantum infrastructure vendor Creotech Quantum S.A. (GPW: CTQ) has signed a contract with the European Space Agency (ESA) to lead an international consortium developing next-generation single-photon detectors. Titled HRQKD (High-Rate Quantum Key Distribution), the €2.33 million ($2.66 million USD) project allocates €1.2 million ($1.37 million USD) directly to Creotech Quantum as prime contractor to design, manufacture, and validate high-sensitivity Superconducting Nanowire Single-Photon Detectors (SNSPDs).<br>\nExecuted over a 24-month schedule, the initiative advances SNSPD detection hardware from proof-of-concept prototypes to Technology Readiness Level 5 (TRL 5), validating operational stability in simulated industrial and space-ground environments. The detectors serve as foundational components for optical ground stations receiving space-to-ground quantum signals across European satellite networks, including EuroQCI, IRIS², ARTES, SAGA, and ScyLight. In addition to QKD cryptographic key reception, the ultra-low-noise SNSPD systems enable high-bandwidth deep-space optical communication where received signals are extremely faint, such as lunar base links and deep-space science probes.<br>\n| [ ESA HRQKD Project Architecture & Financial Scope ] |  |  | <br>\n|---|---|---|<br>\n| Contract Parameter | Hardware & Technical Scope | Strategic Deployment Scope | <br>\n| • Total Value: €2.33 Million • Creotech Share: €1.2 Million • Timeline: 24 Months | • Superconducting Nanowire Single-Photon Detectors (SNSPDs) • Integrated readout electronics & control software • Target Maturity: TRL 5 (Industrial Validation) | • Satellite-to-Ground QKD Networks (EuroQCI, IRIS²) • Deep-space optical laser communications • Defense, telecom, & critical infrastructure links | <br>\nLed by CEO Dr. Anna Kamińska, Creotech Quantum acts as consortium lead, overseeing electronics engineering, software architecture, environmental testing, and product roadmap development. Spun out from satellite manufacturer Creotech Instruments, Creotech Quantum leverages specialized electronics production, White Rabbit sub-nanosecond time synchronization, and Sinara/MTCA control systems to support European quantum hardware supply chains.<br>\nReview the corporate disclosure on LinkedIn here.<br>\nSeptember 25, 2026<\/p>","content_hash":"7771976e86cc801d2a49f3c1aa6e5533","author":"Mohamed Abdel-Kareem","published_at":"2026-09-25T16:36:56","fetched_at":"2026-09-26 15:39:40","word_count":299,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"23h","domain":"quantumcomputingreport.com"},{"id":"a54d2e72b44a8252","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47008","title":"UTM Technovation Park Becomes R&D Base for AQSolotl, Malaysia’s First Quantum Computing Hardware Company","url":"https://quantumcomputingreport.com/utm-technovation-park-becomes-rd-base-for-aqsolotl-malaysias-first-quantum-computing-hardware-company/","summary":"AQSolotl, Malaysia's first quantum computing hardware company, has established its R&amp;D operations at UTM Technovation Park in Johor Bahru. This Singapore-based startup will focus on designing and producing high-precision quantum computer control electronics, leveraging UTM's research programs and creating a cross-border talent and commercialization corridor between Malaysia and Singapore. The company's CTO, Dr. Yap Yung Szen, is a UTM researcher recognized in UNESCO’s global Quantum 100 init","content":"<p>Public research university Universiti Teknologi Malaysia (UTM) has expanded its deep-tech research footprint as Singapore-based startup AQSolotl Pte. Ltd. establishes its research, development, and commercialization (R&D&C) operations at the UTM Technovation Park in Johor Bahru. The deployment establishes AQSolotl as the first quantum computing hardware company operating in Malaysia, anchoring a cross-border regional hardware ecosystem between Malaysia and Singapore.<br>\nSpun out of Singapore’s quantum technology ecosystem in collaboration with UTM, AQSolotl focuses on the design, engineering, and commercial production of high-precision quantum computer control electronics. The company’s technology builds upon UTM’s research programs initiated in 2009 alongside Japan’s Osaka University, which subsequently expanded to include Singapore’s Centre for Quantum Technologies (CQT), Nanyang Technological University (NTU), and the National University of Singapore (NUS).<br>\n| [ UTM Technovation Park & AQSolotl R&D&C Infrastructure Overview ] |  |  | <br>\n|---|---|---|<br>\n| Stakeholder Entity | Institutional & Technical Leadership | Operational Scope & Deliverables | <br>\n| AQSolotl Pte. Ltd. (UTM Technovation Park) | • Patrick Bore (CEO) • Dr. Yap Yung Szen (Co-Founder & CTO) | • Commercial quantum QPU control hardware • First quantum hardware company operating in Malaysia • R&D, assembly, & industrial prototyping | <br>\n| Universiti Teknologi Malaysia (UTM Johor Bahru) | • Prof. Ts. Dr. Mohd Shafry Mohd Rahim (VC) • Assoc. Prof. Dr. Haza Nuzly Abdull Hamed • Dr. Koh Meng Hock | • Academic talent pipeline & industrial internships • Cross-border research hub linking SG & MY ecosystems • IP translation from CQT, NTU, NUS & Osaka Univ | <br>\nLed co-technically by CTO Dr. Yap Yung Szen—a UTM researcher recognized in UNESCO’s global Quantum 100 initiative—AQSolotl’s physical presence in Johor Bahru leverages the university’s geographic proximity to Singapore to create a talent development and commercialization corridor. The facility will host industrial internships for UTM engineering and physics students while supplying precision control hardware modules to regional research institutions and commercial quantum platforms.<br>\nReview the official news announcement on PR Newswire APAC here.<br>\nSeptember 25, 2026<\/p>","content_hash":"fce2cdf889d636ce8aeb27691270f5ed","author":"Mohamed Abdel-Kareem","published_at":"2026-09-25T16:08:17","fetched_at":"2026-09-26 15:39:41","word_count":331,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"23h","domain":"quantumcomputingreport.com"},{"id":"ddf510a0c2864550","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=47001","title":"CGI Federal, DLA, and University of Tennessee Launch “Quantum Pathfinder” Initiative for Supply Chain Resilience","url":"https://quantumcomputingreport.com/cgi-federal-dla-and-university-of-tennessee-launch-quantum-pathfinder-initiative-for-supply-chain-resilience/","summary":"CGI Federal, the DLA, and the University of Tennessee have partnered to launch the \"Quantum Pathfinder\" initiative. This program will explore how AI and quantum computing can optimize supply chain resilience, particularly in warehouse management, reverse logistics, and inventory positioning within military contexts. Hosted at CGI Federal's Knoxville center, the initiative aims to solve logistical bottlenecks and strengthen supply chains during disruptions. The post CGI Federal, DLA, and Universi","content":"<p>U.S. government technology provider CGI Federal Inc., a subsidiary of CGI Inc. (NYSE: GIB), has entered into an applied research and development agreement with the U.S. Defense Logistics Agency (DLA) and the University of Tennessee, Knoxville (UT). The initiative, titled Quantum Pathfinder, explores how agentic artificial intelligence (AI) and quantum computing can optimize advanced warehouse management, reverse logistics, and inventory positioning across contested military environments.<br>\nHosted at CGI Federal’s onshore delivery center in Knoxville, Tennessee, the Quantum Pathfinder program bridges federal mission objectives with academic research and commercial quantum capabilities. Rather than testing theoretical demonstrations, the coalition focuses on solving logistical bottlenecks—such as dynamic smart-warehouse orchestration and asset disposition—to strengthen supply chain resilience during operational disruptions. The initiative operates in coordination with the Knoxville Quantum Accelerator and the broader Tennessee Quantum Initiative to foster regional quantum workforce development and commercialization pipelines.<br>\n| [ Quantum Pathfinder Initiative Architecture & Key Stakeholders ] |  |  | <br>\n|---|---|---|<br>\n| Stakeholder Entity | Institutional Role | Research Scope & Deliverables | <br>\n| CGI Federal Inc. (Host: Knoxville Onshore Center) | • Systems Integrator & Commercialization Lead • Defense, Intelligence & Space Unit | • Hybrid Agentic AI & Quantum Workload Integration • Onsite hosting, benchmark publication & PoC execution | <br>\n| Defense Logistics Agency (DLA) | • Federal Government Mission Owner • U.S. Department of Defense Logistics Hub | • Smart-Warehouse Orchestration & Reverse Logistics • Resilient inventory positioning in contested domains | <br>\n| University of Tennessee, Knoxville | • Academic Research & Talent Lead • Knoxville Quantum Accelerator | • Tennessee Quantum Initiative alignment • Workforce upskilling & research infrastructure development | <br>\nThe announcement builds upon CGI’s expanding quantum strategy, which includes a recently announced go-to-market partnership with D-Wave Quantum Inc. to deploy quantum annealing systems (such as the Advantage2™ processor) and hybrid solvers for enterprise optimization challenges across logistics, rail, and energy supply chains. Specific DLA logistics use cases under the Quantum Pathfinder agreement will be finalized in the coming months.<br>\nReview the press release via CGI Newsroom here and explore federal quantum practices at CGI Federal Quantum Computing here.<br>\nSeptember 25, 2026<\/p>","content_hash":"d40283e7cc90f0c55a865005d7f4dd82","author":"Mohamed Abdel-Kareem","published_at":"2026-09-25T15:58:09","fetched_at":"2026-09-26 15:39:41","word_count":356,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"23h","domain":"quantumcomputingreport.com"},{"id":"de198188e46037f2","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46994","title":"DRDO Signs First High-Value TDF Pact with Startup Zero mK India for 20 mK Dilution Refrigerator","url":"https://quantumcomputingreport.com/drdo-signs-first-high-value-tdf-pact-with-startup-zero-mk-india-for-20-mk-dilution-refrigerator/","summary":"DRDO has partnered with Zero mK India to indigenously develop a 20 mK dilution refrigerator, crucial for quantum computing and defense. This marks the first high-value project under the expanded ₹500-crore TDF scheme, aiming to reduce import dependency and strengthen India's National Quantum Mission. The project will establish a domestic supply chain for sub-kelvin cryogenic hardware. The post DRDO Signs First High-Value TDF Pact with Startup Zero mK India for 20 mK Dilution Refrigerator appeare","content":"<p>India’s Defence Research and Development Organisation (DRDO) has executed its first high-value deep-tech project agreement under the Technology Development Fund (TDF) scheme with domestic startup Zero mK India. The collaborative contract targets the indigenous engineering and fabrication of a 20 millikelvin (20 mK) dilution refrigerator, establishing a secure domestic supply chain for sub-kelvin cryogenic hardware essential for quantum computing and defense applications.<br>\nThe agreement represents the first high-value project sanctioned under the expanded ₹500-crore (~$52.2 million USD) TDF corpus approved by Defence Minister Rajnath Singh. Dilution refrigerators provide the ultra-low temperature, sub-absolute-zero environment (spanning down to 20 mK) required to preserve phase coherence in solid-state quantum processing units, including superconducting circuits, silicon spin qubits, and quantum sensing arrays. The project is monitored, mentored, and technically evaluated by the director and scientific team at DRDO’s Solid State Physics Laboratory (SSPL) in Delhi.<br>\n| [ DRDO TDF Deep-Tech Cryogenic Project Overview ] |  |  | <br>\n|---|---|---|<br>\n| Entity / Program | Technical & Cryogenic Targets | Strategic & Policy Context | <br>\n| • DRDO & Zero mK India • TDF Scheme Grant • Mentorship: SSPL Delhi | • Operating Temp: 20 mK (0.02 K) • Sub-kelvin 3He/4He dilution circulation • Scalable QPU testing & packaging stage | • National Alignment: National Quantum Mission • Fund: ₹500-Crore TDF Deep-Tech Corpus • Reduces import dependency on Western cryo vendor systems | <br>\nAligning with India’s National Quantum Mission (NQM), the project mitigates sovereign import vulnerabilities for specialized cryogenic equipment. By developing indigenous sub-kelvin refrigeration capabilities, the initiative supports domestic research laboratories, defense communication programs, and commercial quantum hardware developers building sovereign quantum computing infrastructure.<br>\nReview the official press release via the Press Information Bureau (PIB Delhi) here.<br>\nSeptember 25, 2026<\/p>","content_hash":"c2ee09073883fd85de77c7b3729bfd58","author":"Mohamed Abdel-Kareem","published_at":"2026-09-25T15:32:55","fetched_at":"2026-09-26 15:39:41","word_count":288,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"702b36d4a14ebf4a","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46980","title":"DigiCert Announces General Availability of Quantum Central Platform for PQC Migration Management","url":"https://quantumcomputingreport.com/digicert-announces-general-availability-of-quantum-central-platform-for-pqc-migration-management/","summary":"DigiCert has launched Quantum Central, an enterprise management suite within its DigiCert ONE platform, to help organizations manage their transition to quantum-safe encryption. This tool consolidates cryptographic assets, tracks policy compliance, and automates remediation workflows, addressing the gap where most enterprises are planning PQC initiatives but few have deployed quantum-safe primitives. Quantum Central facilitates incremental PQC migration, providing auditable metrics and cryptogra","content":"<p>Digital trust management leader DigiCert has announced the general availability of DigiCert Quantum Central, an enterprise management suite integrated into the DigiCert ONE platform. Designed to operationalize post-quantum cryptography (PQC) readiness, the tool consolidates fragmented cryptographic assets across enterprise networks, establishes policy compliance tracking, and automates remediation workflows as organizations transition toward quantum-safe encryption standards.<br>\nThe release addresses a key gap identified in the 2026 DigiCert Quantum Readiness Outlook, which reported that while 87% of enterprises are actively planning, testing, or executing PQC initiatives, only 7% have deployed quantum-safe or hybrid cryptographic primitives into production environments. Quantum Central acts as an orchestration layer, allowing risk, security, and IT compliance teams to normalize cryptographic inventories from network scans, certificate lifecycle management (CLM) platforms, key vaults, software bills of materials (SBOMs), and external APIs into a unified dashboard.<br>\n| [ DigiCert Quantum Central Platform Capabilities ] |  |  | <br>\n|---|---|---|<br>\n| Operational Phase | Platform Feature & Integration | Functional Enterprise Scope | <br>\n| • Discovery & Inventory | • Multi-Source Cryptographic Ingestion • Programmatic API & CBOM Export | • Consolidates PKI, key vaults, CSVs, and SBOMs • Generates Cryptographic Bills of Materials | <br>\n| • Policy & Remediation | • Policy Engine & Jira Workflow Integration • Inventory-Aware AI Assistant | • Flag non-PQC compliance & automate change requests • Explores exposure & recommends next steps | <br>\n| • Execution & Issuance | • DigiCert Trust Lifecycle Manager • DigiCert Private CA & CertCentral | • Direct certificate lifecycle execution & issuance • Deploys hybrid & quantum-safe TLS certificates | <br>\nUnder Senior Director of Product Management Kevin Hilscher, the platform enables incremental PQC migration, letting organizations prioritize high-value asset environments before expanding enterprise-wide. By pairing policy-driven governance with active issuance layers via DigiCert Private CA and CertCentral, Quantum Central provides auditable metrics and CBOM exports for regulatory compliance against harvest-now, decrypt-later (HNDL) threats.<br>\nReview the official news release on DigiCert Press Releases here and inspect platform architecture via DigiCert ONE here.<br>\nSeptember 25, 2026<\/p>","content_hash":"013b8d20d76f02c01a40839570ae3b10","author":"Mohamed Abdel-Kareem","published_at":"2026-09-25T07:17:59","fetched_at":"2026-09-26 15:39:41","word_count":339,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"abcdfe6532909136","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18268","title":"Quantum Computers Need More than “Magic”","url":"https://quantumfrontiers.com/2026/09/20/quantum-computers-need-more-than-magic/","summary":"The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.&nbsp; Between the bringing of the bread a","content":"<p>The University of Cambridge is a special place. During term time, hordes of students gather, ready to attend formal, a candle-lit dinner in a five-century-old hall overlooked by paintings of academics past. The sight is like an overromanticized still of a bygone era. The men wear suits, the women long dresses, all wear gowns. The simplest gowns belong to the undergrads, with the complexity and length of the gowns growing as one climbs the academic ranks.<br>\nBetween the bringing of the bread and the serving of the soup, the conversation at my end of the table typically turns to my topic of research: quantum computers. These theoretical machines harness quantum physics to outperform their classical counterparts. Quantum computers hold great promise for the future, with applications ranging from drug discovery to cybersecurity. Yet, despite their promise, we still do not have a satisfying answer to the fundamental question: what makes quantum computers computationally stronger than classical computers?<br>\nTo answer this question, imagine that tonight, instead of the soup, the cooks are brewing a happiness potion. This potion causes the drinker to be joyful and content for the rest of the evening. The cooks know how to brew the potion perfectly well; they discovered the list of ingredients in the nineties and have been successfully brewing ever since. But the cooks still cannot solve one mystery: what makes the potion different from the soup? What ingredient sets the potion apart from the soup?<br>\nThe cooks come up with a simple approach. They leave out one ingredient in each serving, and then carefully observe the formal-goers. They find that almost every seat is filled by a happy student, chatting away to their neighbours, indicating a working potion. However, one student’s spirits have not been lifted, as they were solely served a simple soup. The cooks conclude that the ingredient they withheld for that student was essential. They name this ingredient magic.<br>\nIn my research, the potion is a quantum computer, the soup is a classical computer, and magic is the actual technical term used for quantum states that promote certain classical computers to quantum computers. Without magic, these quantum computers are computationally no stronger than a normal laptop.<br>\nSo magic is necessary for quantum computational advantage, but is it enough? Over a decade ago, researchers found that, for quantum computers built on qutrits, the answer is no. To understand what a qutrit is, consider the regular bit: a switch that’s either zero or one. The qubit, the quantum generalization of the bit, can be both zero and one simultaneously. The qutrit is a roomier qubit that can be zero, one, two, or any of those simultaneously.<br>\nIt is possible to build quantum computers using qutrits. However, the vast majority of quantum computers are built on qubits, the quantum generalisation of the everyday bit. My colleagues and I have recently discovered that for qubit-based quantum computers, too, magic is not enough to gain an advantage over classical computers. Picture the cooks dumping jar after jar of magic into a soup, only to find that the soup never gains magical powers. Potions need more than magic. Potions also need Kirkwood-Dirac negativity.<br>\nWhat is Kirkwood-Dirac negativity? The idea developed by John Kirkwood and Paul Dirac builds on probabilities—for example, the odds of obtaining a heads upon flipping a coin. One can describe a quantum computer using numbers that behave similarly to probabilities but come with a twist: they may be negative. These negative “probabilities” mark where quantum departs from classical. The main result of our paper is that this negativity, too, is a necessary ingredient: without it, no amount of magic will turn the soup into a potion.<br>\nAt this point in the conversation, I am typically cut off by the arrival of the soup. The conversation moves on from quantum computers to different subjects, and I usually look up at the paintings staring down at me. One of them is of Dirac, who spent many dinners discussing quantum theory in the same dining hall. The University of Cambridge is a special place.<\/p>","content_hash":"8c54ccd29fbd109c79f02546399e0593","author":"jjthio","published_at":"2026-09-20T16:49:32","fetched_at":"2026-09-26 15:39:43","word_count":678,"read_time_minutes":4,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"5d","domain":"quantumfrontiers.com"},{"id":"35bd6451dfb09ad3","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10116","title":"Theory Beyond Theorems and Proofs: A Guest Post","url":"https://scottaaronson.blog/?p=10116","summary":"Scott&#8217;s foreword: I&#8217;m extremely grateful to my brilliant colleagues, Pravesh Kothari, Raghu Meka, and Prasad Raghavendra, for sharing the guest post below about how theoretical computer science (and in particlar, the STOC/FOCS/SODA conferences) should evolve to deal with the AI asteroid that&#8217;s right now slamming into our field, at least as we human theorists have practiced it since its inception. While Pravesh, Raghu, and Prasad speak only for themselves, not for myself and not","content":"<p>Theory Beyond Theorems and Proofs: A Guest Post<br>\nScott’s foreword: I’m extremely grateful to my brilliant colleagues, Pravesh Kothari, Raghu Meka, and Prasad Raghavendra, for sharing the guest post below about how theoretical computer science (and in particlar, the STOC/FOCS/SODA conferences) should evolve to deal with the AI asteroid that’s right now slamming into our field, at least as we human theorists have practiced it since its inception. While Pravesh, Raghu, and Prasad speak only for themselves, not for myself and not for the theory community as a whole, I found their proposal of a separate “conceptual track” to be an excellent starting point for further discussion. –SA<br>\nConsidering the pace of developments in AI theorem provers, most would concede that the following scenario is at least plausible in the very near future:<br>\nAI theorem provers could prove well-specified mathematical claims, even many well-studied ones that have been open for years, in a matter of hours. Moreover, these systems could be widely available to consumers at nominal cost.<br>\nAs TCS researchers, let us pretend that the above scenario has come to the fore, and ask ourselves: What is our role in such a world? Does it mean the end of theory research?<br>\nAs we ponder this question, let us ignore all of these other confounders:<br>\n- Recent controversies surrounding the developments on the Millennium Prize Problems<br>\n- Motivations and actions of the AI companies<br>\n- Observed faults in existing AI systems when it comes to writing, exposition or attribution to previous work.<br>\nNone of the above confounders have any impact on our answer to the question: What should theorists do, in the presence of superhuman AI theorem provers?<br>\nNotice that we use the term “AI theorem provers” instead of just “AI”. We believe that this conceptual distinction is important as we consider this question.<br>\nAt the outset, we would like to admit that for a generation of theorists like us (and many from earlier), research was mainly centered around problem-solving. Even when we developed conceptual insights, it was mostly in service of answering well-specified long-standing questions. We don’t intend this proposal as judging one form of research to be better than others; it only reflects that AI theorem provers accelerate a certain type of research activity and want to make the best of it. There is also a tremendous human cost of this upheaval, which is perhaps a more important question, and one which this proposal does not address directly (we do not have any good ideas as such). Similar points have also been made in various contexts<br>\nbefore, but the timing now is more pressing.<br>\nDefinitions, Questions & Theories:<br>\nThe goal of any theoretical science is to advance human understanding of observed phenomena. Apart from theorems and proofs, a theoretical science has definitions, questions, and theories.<br>\nDefinitions identify the objects to observe. Curiosity and context drive the questions to ask. Theories explain the phenomena observed. We believe humans will continue to play a central role in generating definitions, questions & theories, even in the presence of a super-human AI theorem prover.<br>\nDefinitions: Could an AI define randomness extractors, streaming algorithms, or zero-knowledge proofs? Maybe. But there are some reasons to believe, humans will still have a big role to play in coming up with definitions.<br>\nFor instance, the notion of extractors arises from the real-world problem of lacking perfect random sources. Zero-knowledge proofs seem to arise purely out of human curiosity, guided by taste. Human context and curiosity will continue to drive theoretical research. After all, we get to decide what objects we choose to observe!<br>\nTheories: Consider the following thought experiment. Suppose in 1965, we had a magic machine that at the press of a button, given any computational problem, would tell us if it had a polynomial-time algorithm or not.<br>\nWould that have been the end of computational complexity theory? No. Humans would find it entirely unsatisfactory, and ask, why do these problems not have a polynomial-time algorithm? Why do these others have?<br>\nThe theory of NP-completeness identifies some patterns among problems that don’t seem to have efficient algorithms. This theory would still be a crown jewel of theoretical computer science, even in a world where we had a magic machine to tell if a problem had an efficient algorithm or not, at the press of a button. Similarly, if we had a machine to predict whether a CSP is NP-complete or in P, we would then ask: what makes 3-SAT NP-complete, while 2-SAT is in P? This question leads to the theory of polymorphisms, which yields a satisfactory answer.<br>\nTheories aren’t just succinct or efficient mechanisms to answer questions. The best theories provide are those which humans deem to be a “satisfactory explanation” – whatever that means.<br>\nFinally, even as the capabilities of AI theorem provers advance, human curiosity will probe grander and deeper questions. Previously, even if we wanted to build new models and theories, proving something about them was a prerequisite, and given that the grand questions were already at the limit in long-studied domains, we had to scale things down. If each theorem proven by AI is treated as an experimental datapoint, humans can ask grander questions that look for patterns across these theorems.<br>\nA concrete proposal:<br>\nWe think theorists should embrace these AI theorem provers in our research. To a certain extent this is already happening explicitly or implicitly.<br>\nAs theorists, we have been parsimonious in introducing new models or asking entirely new questions, and careful about adopting new ones too quickly. This was partly because formally proving the properties of a new definition or a model was an onerous task that could take a decade, and tens of papers. AI theorem provers might completely change this dynamic. This is precisely the moment to refocus our work on definitions, questions, and theories. We need explicit systems to encourage and reinforce these parts of theoretical research. You might also say the next generation of AI models can do this; it may be so, but we believe you have to take the current opportunity.<br>\nTo this end, we suggest that STOC/FOCS/SODA create a separate track of papers. This track is meant specifically for papers that introduce new definitions, ask novel questions or build explanatory theories. The papers in this track are short, say less than 10 pages. Papers may, and should, contain theorems as usual and as needed. Most importantly, the radical shift is that the papers need not contain the proofs of the theorems. Instead, the authors supply a Lean certificate as a supplement to the paper. The evaluation will also in a sense “orthogonalize’’ against the difficulty of these proofs.<br>\nThe papers in this track should be judged exclusively on the conceptual merits, completely agnostic to the difficulty of the proofs.<br>\nReviewing must be completely agnostic to the proof for two reasons. The main track at STOC/FOCS already includes papers in the former category. Second, a major barrier to producing truly novel conceptual papers is that they often get judged poorly for a lack of technical depth in their proofs. We think these two aspects separate it from (ITCS/SOSA) and, regardless, it’s something we urgently need for all our conferences, including STOC/FOCS (the ‘flagship’ conferences).<br>\nTo be clear, we ourselves admit that we need to hone these skills of making new definitions, asking deep and interesting questions or building new theories. A separate track of conceptual papers will provide a systematic mechanism for both junior and senior researchers, and the field as a whole to do so.<br>\nWe believe that upcoming generations of grad students will tackle research directions that seemed completely out of reach to us. We just need to set up systems that nurture new ways of doing research in theory.<br>\n— Pravesh Kothari, Raghu Meka, Prasad Raghavendra.<\/p>","content_hash":"bac74a8d6bce3c8900e39c920d191981","author":"Scott","published_at":"2026-09-19T22:34:01","fetched_at":"2026-09-26 15:39:34","word_count":1298,"read_time_minutes":7,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"6d","domain":"scottaaronson.blog"},{"id":"26cd9e9371b2a71c","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10062","title":"The Age of Wonders and Terrors","url":"https://scottaaronson.blog/?p=10062","summary":"Twenty years ago, when the idea of AI taking over the world in our lifetimes still struck most of us as the unconstrained fantasy of those who knew too much science fiction and too little science, many of us would say things like: Look, the part of the story that&#8217;s wildly implausible is that a recursively self-improving superintelligence will just explode from some hacker&#8217;s basement and take over the world without warning. If it&#8217;s going to happen, we&#8217;ll see many warning s","content":"<p>The Age of Wonders and Terrors<br>\nTwenty years ago, when the idea of AI taking over the world in our lifetimes still struck most of us as the unconstrained fantasy of those who knew too much science fiction and too little science, many of us would say things like:<br>\nLook, the part of the story that’s wildly implausible is that a recursively self-improving superintelligence will just explode from some hacker’s basement and take over the world without warning. If it’s going to happen, we’ll see many warning signs first. We’ll see, I dunno, AI agents breaking out of containment, conspiring with each other to hack websites, in fanatical pursuit of whatever strange goals they have. And then, of course, we’ll see major math problems getting solved by AIs—even the Clay Millennium Problems. That will be the time to panic! Wake me up when that happens!<br>\nTwenty years ago, the above was a take that even my most conservative, skeptical colleagues in academic CS would’ve gladly endorsed.<br>\nIf you want to know my current take, you simply start with the one above, then update on the fact that the wild prophecies have come true. The first rumblings, I’d say, came a decade ago with AlphaGo, they got noticeably louder with LLMs and coding and reasoning agents, and they’ve accelerated this summer and fall into a crescendo of wonders and terrors that one needs to be a particular kind of idiot to deny.<br>\nI recoil from the neverending shell game where you say “oh sure, of course AI can now [escape from its sandbox / solve Millennium Problems / whichever dramatic thing it most recently did], no one ever denied that [I did deny it], wake me up when AI does [thing AI hasn’t yet done but is going to do next year], that’s when I’ll reevaluate my whole worldview [no I won’t].” Where no matter how fast the rollercoaster accelerates, even after your whole familiar world has vanished behind you, you’re still inventing reasons why it doesn’t count.<br>\nMy position on AI is merely the conservative, skeptical position of 2006, updated with intellectual honesty for the reality of late 2026. And that position, if you need me to spell it out, is as follows:<br>\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA<br>\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA<br>\nIt seems to me that the Singularity has already started; it’s just wildly unevenly distributed. Yes, I still unload the dishwasher and clip my toenails. On the other hand, in whatever years I have left, I don’t expect that I’ll ever again prove a theorem because I’m actually needed to prove it. If I do, it will only be for my or others’ enjoyment or edification.<br>\nThe test is this: if we took the news of these past few weeks and sent it back in time twenty years, would I agree that it looked like the beginning of an AI Singularity? The intellectually honest answer is: yes, absolutely. But then that’s all we need. No backsies.<br>\nI feel like it would be healthy for everyone to stop grinding their ideological axes, their sentiments about Dario Amodei or Sam Altman, for long enough simply to acknowledge that the wonders and terrors are here. They couldn’t be here more clearly if the sky had turned reddish-orange like in the Matrix movies.<br>\nIt’s here clearly enough that, when I put my kids to sleep at night, I now feel it in the pit of my stomach: what sort of future can they possibly have? What could they learn today that could possibly be relevant to that future? (Yesterday, my 13-year-old daughter joked unprompted that, if she wants to become a mathematician, it now looks like she has maybe two more weeks.) Certainly when my grad students want to discuss what sort of careers might await them on graduation, I no longer have any clue what to tell them.<br>\nMaybe it will help if I briefly switch topics. Ever since my wife and I moved to Austin, I’ve sometimes gotten some version of the following query: “How can you, as both a Jew and a skeptical scientist, possibly get along well with all those evangelical Christians down there in Texas? Sure, they might seem super friendly to Jews, but don’t you understand that that’s only because of the special role Jews play in their eschatology—when Christ will return in glory, and you’ll either accept Him as Lord or else roast in hell for eternity?” I stare at them and say: “wait, so I get to accept Christ only after He returns? What a great deal! How could I possibly have any objection to that?”<br>\nFor anyone who says AI doom sounds like an apocalyptic religion, that the rationalists/Singulatarians seem like a Bay Area cult, that Eliezer Yudkowsky gives off the vibes of a messianic prophet: yes, yes, and yes. But crucially, today you’re no longer being asked to believe in arguments and extrapolations, but only in the front-page news. Accepting the reality of the coming machine god after it’s solved Navier-Stokes and dozens of other longstanding open math problems (while dramatically ramping up in capability every month), is sort of like accepting Jesus after he’s returned to earth on the gleaming cloud. It’s the epistemic bare minimum.<br>\nYes, there’s still enormous uncertainty about what the rest of our lives will look like, but as far as I can tell, there’s no longer any real uncertainty that it’ll all mostly revolve around AI, and the extent to which we succeed or fail at directing its power toward human flourishing.<br>\nBy any accounting that doesn’t stack the deck, Eliezer Yudkowsky was right about what the greatest challenge facing civilization in our lifetimes was going to be, and you and I were wrong about it. Why I was wrong is a question I’ll ask myself every day in whatever time remains. But, you know, at least I updated once the prophesied wonders and terrors actually started arriving! If you haven’t done likewise, why haven’t you?<br>\nAs you presumably know by now—it was the talk of the nerd internet all week—the Navier-Stokes Millennium Problem appears to be solved, with crucial contributions from both humans and AI, albeit with a tangled dispute about exactly what happened and what ought to have happened. The answer, which an OpenAI model has apparently verified in Lean, is that (as many mathematicians suspected lately) there’s smooth initial data that leads to a singularity in finite time, at least if a smooth external force is applied (the case with no external force is still unresolved). This problem was supposed to carry a $1 million prize, except that OpenAI says they have no interest in collecting the prize and it’s unclear if any human is eligible to collect instead. OpenAI burned at least ~$15 million in compute to produce its 166-page solution, which probably hasn’t yet been read and understood by any human.<br>\nSee here for the Quanta article, and here for NYU mathematician Tristan Buckmaster’s account of the role played by himself and Levent Alpöge of Anthropic, which substantially differs from OpenAI’s account (you can read a response from OpenAI’s Sebastian Bubeck here). It’s agreed that everything built on an approach pioneered in recent years by the human mathematicians Diego Córdoba and Luis Martínez-Zoroa.<br>\nMy purpose here is not to adjudicate the dispute. Yes, in swooping in with vastly greater resources once it had gotten wind of progress on Navier-Stokes, OpenAI seems to have acted in a way that some might describe as “unsportsmanlike.” No, I don’t find it plausible that OpenAI’s models meaningfully benefitted from being trained on Buckmaster and Alpöge’s chat logs. But this leaves a crucial question unanswered: what exactly did OpenAI know about Buckmaster and Alpöge‘s work and when did it know it?<br>\nAnyway, as Zvi points out, it’s easy to get hung up on the details and lose sight of the high-order bit: namely, that it seems safe to say that human mathematicians are forevermore dethroned as the main theorem-proving entities on planet earth. I feel privileged to have had the traditional kind of career in theoretical computer science in the last decades when that was possible.<br>\nIf we were just talking about Navier-Stokes, you might accuse me of jumping to conclusions here. But we’re not. In the areas I know best (such as quantum complexity theory), and presumably other areas as well, there’s now a deluge, with longstanding open problems both major and minor falling by the day.<br>\nGo to the arXiv or ECCC. Pretty much all the papers that I’d be interested in now include “AI statements” near the acknowledgments (as this is often the central thing I want to know, I wish I didn’t need to scroll to the end of the paper to find it!). These statements can range from “our main result came entirely from GPT-6, but we understood it and take responsibility for it,” to “the results came from an interaction between the human authors and AI” to “we used AI, but only for proofreading and other incidental things” to (mad props!) “the author did not use AI for anything.”<br>\nIf you talk right now to editors or program committee chairs, it’ll remind you of those ominous scenes from the Lord of the Rings movies where the men of Gondor or Rohan or whatever are grimly fortifying their walled city against the expected onslaught of 50,000 orcs. Reviewing will have to be done partly by AI, because otherwise there’s no way to handle the orc army: the reviewers can’t unilaterally disarm.<br>\nAnyway, here’s a small sampling of the significant AI-proved or -assisted results from, like, the last month, besides Navier-Stokes—restricting myself to those that solved longstanding open problems I had previously known or cared about.<br>\n- Of course, the counterexample to the Jacobian conjecture, announced by Levent Alpöge in a now-famous tweet: “hello there the jacobian conjecture is false thanx to my close friend akhil for asking about it and my other close friend fable for working during the world cup final” (followed by a listing of the counterexample)<br>\n- Improved bounds for Grothendieck’s constant (led by friends and colleagues of mine at UT Austin)<br>\n- A Lean-verified proof of Fermat’s Last Theorem<br>\n- Quantum oracle separation between QMA and QMA(2), and proof of Watrous’s disentangler conjecture, a problem that I and others popularized back in 2007—by a list of authors including my recently graduated PhD student Sabee Grewal<br>\n- A proof of perfect completeness for QMA, from (again) Sabee Grewal and Dorian Rudolph, solving a decades-old open problem that I studied back in 2009<br>\n- An improved upper bound for shadow tomography of quantum states, from Chen, O’Donnell, Pelecanos, and Wright, improving the dependence on the Hilbert space dimension d from log(d) to √log(d). (When I introduced shadow tomography back in 2017, I raised the question of whether the dependence on d could be eliminated entirely, while preserving polylogarithmic dependence on the number of measurements m.)<br>\n- Progress on the Aaronson-Ambainis Conjecture (the version that talks directly about quantum algorithms), basically showing that it holds for quantum algorithms that make their queries in a small number of parallel rounds. (Update: Nope, sorry, Jordan Docter points out to me that this one was pre-AI, with AI used only for proofreading and other incidental things!) This was independently achieved by Liu and Mutreja, making more substantial use of AI.<br>\n- According to rumors that I’ve heard, solutions to some very longstanding open problems in theoretical computer science (no, not P≠NP or other complexity class separations, but think about some of our other biggest problems). I’m told that the AI companies, having been burned by the hostile response to the Navier-Stokes proof, are now sitting on solutions to some very major problems until they figure out a better way to handle things<br>\nFeel free to remind me of anything I left out.<br>\nLet me try to convey the mood in the mathematical community right now, at least as far as my experience reaches. Nearly every conversation is about the AI tsunami, or eventually circles around to the tsunami even if it’s originally about something else. Often, though, the focus is less on the unknowable future—for how much longer will mathematical research as a human enterprise even exist?—than on immediate questions of how to respond.<br>\nWhat are the new rules for when you get to write a paper with your name on it, and, y’know, get credit for it? That you fully understand the proof, can give talks about the proof, can answer questions about it, take responsibility for its correctness? Do you need to have played any role in finding the proof?<br>\nIn the cases, likely to become more and more numerous, where all of those conditions are not satisfied, how do you share AI-generated math, if at all? Do you tweet it, like Alpöge hilariously did with Fable’s disproof of the Jacobian Conjecture? Do you post to the arXiv or GitHub? Do you publish a paper that lists “GPT-6 Astra” or “Claude Fable” as the author—but then let the AI profusely thank you in the acknowledgments for suggesting such a wonderful problem to it?<br>\nOf course, how one responds to the immediate problems ultimately does depend on one’s broader beliefs about what mathematical research is for and about. Are we just trying to decide whether various conjectures are true or false? Or are we trying to maintain a human community, across the generations, that understands the conjectures and cares about whether they’re true or false and why? If the latter, how do we incentivize people to join that community, to undergo the years of intense training required, if their role will now be reduced to verifiers and explicators (if even that) of gargantuan arguments dumped into their laps by the AI companies?<br>\nAs many of you will have seen, twenty-five Fields Medalists, including Terence Tao, released an open letter entitled A Severe Misalignment of AI in Mathematics, which articulates some of these concerns in the wake of the Navier-Stokes announcement. As many critics have pointed out, the open letter doesn’t really have a clear ask: mostly, it just eloquently sets out the values of the human mathematical community that the authors consider worth preserving in the age of AI. After reflection, I decided to endorse the statement, because I want to preserve those values as well.<br>\nI don’t think any of the signatories are naïve enough to imagine that AI won’t permanently change the way mathematical research is done—indeed, that it isn’t already doing so. There’s surely at most a tiny market for “certified organic theorems.” That isn’t the question. The question is, do we incorporate AI in a way that still puts human understanding, of what either humans or AIs are producing, at the center of the whole enterprise? Maybe someday, it becomes unsustainable to do that. Maybe someday we say: “human math had a great 4,000-year run, but today we close up shop and turn everything over to the machines, continuing to apply our own brains to math, when we do, at most for exercise, recreation, or competition, like chess.”<br>\nBut, partly because of my worries about AI misalignment, I’m not ready to throw in the towel just yet. I still do want to keep insight and understanding at the center of what mathematicians, computer scientists, and physicists do, for as long as we can keep it there, even as the human race now cedes its supremacy at the task of proving or disproving conjectures.<br>\nSpeaking of alignment: if you’re any kind of mathematical researcher, and the present age of wonders and terrors has inspired you to want to spend your remaining time confronting the tsunami head-on, rather than pretending it doesn’t exist or is still far away, please join your dozens of colleagues who’ve arrived at the same place!<br>\nMy friend and colleague Mike Winer was trained as a theoretical physicist, did a postdoc with Juan Maldacena at the Institute for Advanced Study in Princeton, but then got AGI-pilled and decided to switch to full-time work at the Alignment Research Center in Berkeley (founded by Paul Christiano, who moved to AI alignment a decade ago after doing quantum computing theory with me). Mike recently wrote a Substack post entitled From Academia to Alignment, which I enjoyed and which I’d commend to anyone currently considering this transition. In a similar vein, see this from Xiaoyu He. And, one more: a meditation on mathematicians’ possible future as priests or monks, by Stanford math undergrad Logan Graves.<\/p>","content_hash":"48c5612501accab56db5243b3abd3db3","author":"Scott","published_at":"2026-09-15T17:09:44","fetched_at":"2026-09-26 15:39:35","word_count":2749,"read_time_minutes":14,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"1c33c2ea387ea01c","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10071","title":"9/11 in Berkeley","url":"https://scottaaronson.blog/?p=10071","summary":"Note: Of course I&#8217;ve been glued all week to the dramatic developments in AI. I&#8217;m working on a post about them. I&#8217;m not good at reacting to things in a timely way. So today, I&#8217;ll do my post marking the tragedy a quarter-century ago that we all commemorate. Please feel free to share your 9/11 memories in the comments. Also, Shana Tova to those who celebrate! The morning of September 11, 2001, I was a second-year PhD student at Berkeley, who woke up late in his dorm room at ","content":"<p>9/11 in Berkeley<br>\nNote: Of course I’ve been glued all week to the dramatic developments in AI. I’m working on a post about them. I’m not good at reacting to things in a timely way. So today, I’ll do my post marking the tragedy a quarter-century ago that we all commemorate. Please feel free to share your 9/11 memories in the comments. Also, Shana Tova to those who celebrate!<br>\nThe morning of September 11, 2001, I was a second-year PhD student at Berkeley, who woke up late in his dorm room at International House, after a long night spent closing in on the proof of the quantum lower bound for finding collisions.<br>\nRolling over to my laptop, I saw a flurry of weird emails, including one from Prof. Christos Papadimitriou saying that “we’re a community, and we’ll all support each other,” and another from Prof. Luca Trevisan (whose algorithms course I was then TA’ing) saying “on a day like this, it’s impossible to think about algorithms. Class is cancelled.”<br>\nConfused, I clicked over to the New York Times and saw the picture of the burning towers, and read numbly about what was already over by the time I’d woken up. I checked in with my mom, made sure relatives and friends in the NYC area were OK. My dad was at a company event in Atlanta, and would need to drive home because of the national grounding of flights.<br>\nOne of my earliest memories in life, from age 5, is of ascending to the top of the World Trade Center. Growing up an hour’s drive from NYC, it wasn’t an exotic place to me.<br>\nI soon learned that one of the dead was Danny Lewin, the ex-IDF captain, theoretical computer scientist, and cofounder of Akamai who had his throat slashed on one of the planes while trying to fight the hijackers, making him the day’s first casualty, even while Akamai’s technology was part of what kept news websites running that day. I’d never met Danny but already knew many people in common with him. A few years later I’d be humbled to win the student paper award that was named in Danny’s memory.<br>\nAnyway, at Berkeley on 9/11, I wandered over to Soda Hall just to be with other people. A few students showed up for office hours, wanting help with their algorithms homework, which I found hard to believe, but I did my best to concentrate, as the computer screens around me showed the burning towers.<br>\nThat evening, I went to a vigil for the victims in Sproul Plaza. But the “vigil,” such as it was, quickly dispensed with mourning and prayers and turned to applauded speeches about how the US must respond with love rather than war, and must turn the other cheek. Meanwhile, a student communist organization was handing out flyers explaining that the victims were mostly “wealthy capitalists and the workers who tried to rescue them.” This while smoke still blanketed NYC and the desperate search for survivors continued. I left the vigil early.<br>\nUntil that day, I had thought of myself as basically a “leftist,” one whose #1 issue was the existential risk of climate change. Sure, I disagreed with my fellow leftists about issues from nuclear power to gifted education to Israel, but those were just intra-left disputes.<br>\nThe year before, I had created the website “In Defense Of NaderTrading,” in a desperate attempt to intervene in history and cause Al Gore to become president rather than George W. Bush. When Bush “won,” by the infamous 537 votes in Florida, I considered it a victory for horribleness that would never be surpassed by anything else in my lifetime (ha). I couldn’t imagine any politician who was more the antithesis of everything I believed in than Bush. This view, of course, did not particularly stand out at Berkeley.<br>\nIn the days after 9/11, though, it became obvious that I could not be a “leftist” in the Berkeley sense. Some of my fellow students felt that Osama bin Laden made a lot of great points, that the attacks were basically justified, and that at any rate, we in Amerikkka had done much worse to provoke them, including by supporting the genocidal settler-colony called “Israel,” which for all we know secretly masterminded the 9/11 attacks anyway (although again, if bin Laden had done them, he would’ve been justified).<br>\nAround the same time came the Second Intifada, when a wave of suicide bombings in Israeli buses and pizza parlors and university cafeterias thrilled and energized some Berkeley students to the extent that they took over a Holocaust Remembrance Day event with bullhorns to make it about the Nakba, smashed the windows of the Hillel building, and beat up a couple of students wearing kippot. That was how thoroughly anti-Nazi they were.<br>\nI finished my PhD at Berkeley in 2004 having learned about more than quantum computing. I’d learned that, while American academia had pockets that truly were crucial refuges and oases for nerds like me, it also harbored people who would gladly see me and my relatives and my fellow Americans killed for the sake of their ideological vision. And I’d learned that I had my own ideological vision, which was that such people could go fuck themselves.<br>\nIt deeply pained me to be on the same side of anything as George W. Bush — especially because I knew that 9/11 had happened on his watch, that he had ignored all the warnings, and that he was grossly incompetent to manage the resulting wars against jihadism (just how incompetent, I didn’t know at the time). But as flawed as Bush was, I knew that I wanted to preserve rather than destroy the civilization of which he was a temporary steward. And I think the value and fragility of our civilization is the main lesson from that day that I’d like to convey to my kids, for whom of course 9/11 is just another historical event to learn about in school, like the Boston Tea Party or the Alamo.<\/p>","content_hash":"755dcc0f08b15906c04bb2d9a6192fe3","author":"Scott","published_at":"2026-09-11T17:04:12","fetched_at":"2026-09-26 15:39:35","word_count":1010,"read_time_minutes":6,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"2w","domain":"scottaaronson.blog"},{"id":"3f8f2a08f44c12ef","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18162","title":"How can objects interact without touching?","url":"https://quantumfrontiers.com/2026/09/06/how-can-objects-interact-without-touching/","summary":"Rethinking the electric field Have you ever wondered what an electric field actually is?&nbsp; The electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.&nbsp; Most textbooks define the electric field ","content":"<p>Rethinking the electric field<br>\nHave you ever wondered what an electric field actually is?<br>\nThe electric field is the foundation of most technologies that we rely on every day. From power grids and electronic devices to radio communication and the internet, the electric field is extremely relevant to our daily lives. However, despite its importance, I have always felt that the common explanations of the electric field leave something unanswered.<br>\nMost textbooks define the electric field as a property of space or a physical entity surrounding electric charges, or with the equation of force per unit charge. These definitions help us understand what the electric field does and its effect on electrically charged particles, but they do not fully answer what an electric field actually is and how it influences charges. Thus, I started thinking about the question: what allows charges to influence each other without touching?<br>\nThis question led me down a path that began with a simple observation in everyday life, and it eventually pointed toward much deeper ideas in modern physics.<br>\nObjects Influenced by Their Surroundings<br>\nBefore talking about electric fields, let’s consider a more basic question: Does it seem reasonable that objects can be influenced by their surroundings?<br>\nMost people would answer yes. We have all seen examples of objects responding to something else nearby, such as the Earth orbiting the Sun, a compass needle reacting to a magnet, and our phones responding to signals from a WiFi router. But what is the mechanism behind these interactions?<br>\nA simple physical phenomenon that we can look at is a balloon rubbed on a piece of clothing that can pick up strands of our hair. Many of us have seen this demonstration in kindergarten or first grade of elementary school. This might seem completely ordinary, but if we pause and think about it, something strange is happening – the balloon is influencing the hair without touching it.<br>\nHow is that possible? One answer is simply that the balloon “pulls” on the hair, but this raises more questions. How does the balloon reach the hair? What is happening in the space between them? These questions suggest that something is missing from the picture of objects pulling on each other directly through contact.<br>\nTo put this in the context of physics, we might all have learned that “like charges repel, and opposite charges attract”. We might have solved equations on how fast charges would move away from or toward each other. We were always told to just accept it because these motions result from the electric field. But why do these observations happen? What is happening between the charges?<br>\nHistorically, physics encountered the same problem. If one object can influence another at a distance, it is natural to ask what is happening in the space between them. One guiding principle that physicists often use is the concept of locality. Locality is the idea that an object can only be directly influenced by its immediate surroundings. Thus, an influence should not simply leap across space from one object to another, and changes should propagate through intermediate regions step by step.<br>\nAt first glance, locality seems reasonable because it matches many of our everyday experiences. If I push a book across a table, my hand influences the book through direct contact. The influence does not appear to jump instantaneously across the table.<br>\nHowever, locality creates a tension when we return to the scenario of the balloon pulling on strands of hair. If locality is true, something must be happening in the space between the balloon and the hair. But from a standard electromagnetic perspective, the space between the balloon and the hair is empty. Therefore, we have encountered a contradiction: if what is between the balloon and the hair is empty space, then what is responsible for transmitting the influence? Neither the usual electromagnetism nor locality tells us the answer to these questions.<br>\nThe Classical Electric Field<br>\nIn the usual electromagnetic picture, the answer to the puzzle is the electric field. Rather than allowing charges to influence one another directly across space, the theory assigns an electric field to the space surrounding charges. The field acts as the intermediary through which influence is transmitted.<br>\nA useful way to think about the electric field is that it assigns information to every point in space. If we imagine a charged particle that is placed at a particular location, the electric field tells us how that particle would move. This charged particle is what physicists call a test charge. By observing how the test charge behaves, we can infer information about the electric field at that location.<br>\nThis could seem like a satisfying answer as the electric field tells us how influence is transmitted, but it does not tell us what kind of thing is doing the transmission. Is the electric field a physical substance? Is it a mathematical tool? Or is it something else?<br>\nIt might be easy to fall back on the idea that the electric field ultimately works through tiny particles physically touching one another. After all, contact interactions are among the most familiar interactions that we experience.<br>\nBut physics challenges this intuition as well. It is surprisingly difficult to define what it means for two objects to “touch”. We usually think of the balloon attracting hair as an example of action at a distance, whereas pressing a hand on a table feels like direct physical contact. However, at the microscopic level, the two situations are fundamentally similar. If we could zoom in on our fingertip and the table with a microscope, we would find that the atoms in our skin never make contact with the atoms in the table. This is because of the repulsion between the electron clouds surrounding the atoms, which prevents the two atomic nuclei from overlapping. Say if we scale the atom in the table up to be the size of a marble, then the nearest atom in our fingertip would still be separated from it by a few centimeters. In the end, nothing is truly “touching” in the intuitive, physical sense.<br>\nThus, the idea of contact does not solve our problem. We are forced to ask the same question again: what is it that allows these interactions to occur? To answer that question, I turned to a different perspective of thinking about electric fields.<br>\nThe Electric Field as A Dynamical Structure<br>\nFrom our intuition, it is natural to imagine the electric field as some invisible substance filling space. This is often the picture suggested by the common field line diagrams in physics textbooks, which make the field appear to flow outward or inward from charges, almost like a moving fluid.<br>\nA useful analogy is the ocean. A boat floating on water can move because waves pass beneath it. The boat responds to changes in its surrounding waves rather than to some direct push from a distant object. Similarly, charged particles respond to changes in the electric field around them. We can then view the electric field as a dynamical structure that governs how the state of the world can evolve.<br>\nHowever, the ocean analogy can only take us so far. Ocea
