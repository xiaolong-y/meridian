cles in physics, Majorana 1 was realized. Over the year that followed, the Microsoft Quantum team met the engineering challenges of manufacturing topological qubits with Majorana 2. Based on this rapid progress, we are accelerating our roadmap to a scalable, practical quantum computer—we have cut our timeline in half and now aim to reach this target by 2029. This achievement will mark a major milestone on the path to a transformative fault-tolerant quantum computer that has the potential to solve problems that affect all of humanity. <br>\n <br>\nLearn more about the latest advances from Microsoft Quantum<\/p>","content_hash":"77e9d2d8ab9da04a0904063abd3ac23d","author":"Chetan Nayak","published_at":"2026-06-02T18:30:00","fetched_at":"2026-09-23 10:42:05","word_count":378,"read_time_minutes":2,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"16w","domain":"quantum.microsoft.com"},{"id":"177414df5f2a25a8","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17969","title":"Nicole’s guide to handling failure and rejection","url":"https://quantumfrontiers.com/2026/05/20/nicoles-guide-to-handling-failure-and-rejection/","summary":"It’s happening.&nbsp; Your inbox registers an email from the chair of a faculty-hiring committee. With trembling fingers, you click on the message. “We’ve been grateful for the opportunity to learn about your work…The decision was very difficult…many highly qualified candidates…” Months of labor, soul-searching, strain, and anxiety give way to despair. The committee has filled the position, and not with you. I recently published advice about how to proceed if you receive an offer of a faculty po","content":"<p>It’s happening.<br>\nYour inbox registers an email from the chair of a faculty-hiring committee. With trembling fingers, you click on the message. “We’ve been grateful for the opportunity to learn about your work…The decision was very difficult…many highly qualified candidates…” Months of labor, soul-searching, strain, and anxiety give way to despair. The committee has filled the position, and not with you.<br>\nI recently published advice about how to proceed if you receive an offer of a faculty position. But what if you don’t receive an offer—what if hiring committees reject you? Or scholarship committees, grant committees, admissions committees, or potential advisors? What if a journal referee shreds your magnum opus? Or a program committee declines your submission to a conference?<br>\nFailure suffuses science as dinner suffuses a nighttime diaper, for two reasons. First, undertaking science is difficult. By “undertaking science,” I mean formulating and proving theorems, cajoling equipment into working, identifying bugs in code, extracting meaning from noisy data, etc. Second, science doesn’t unfold in a vacuum. Human beings do science within a society fraught with opinions, emotions, and limited resources. These challenges lead to the failures and rejections that this article addresses most. (If you’re a member of my group and you’re facing a failure due to the difficulty of undertaking science, come talk with me.)<br>\nWhat can you do if failure or rejection ails thee? The rest of this article prescribes, in chronological order, steps that will help you recover. You can even turn your lemons into, if not lemonade, then not-entirely-unappetizing lemon meringue pie.<br>\nImmediately after receiving the news:<br>\n- Read the communication once—or, if you must, twice. Don’t linger over the letter for longer than necessary.<br>\n- Put the communication away, so you won’t see it unless you try to. If the news came via email, remove the message from your inbox.<br>\n- Lower your heart rate. Electrified with anger? Expend that energy; go for a walk, for a run, or to the gym, if possible. If you can’t, breathe deeply for several minutes, extending your exhalations.<br>\n- Review records of your successes. I maintain a folder called “Nice messages.” It contains notices of awards I’ve received, kudos on papers I’ve published, messages such as “Thanks for everything this past semester! Your class was probably my favorite one,” and every compliment I’ve received from the taciturn John Preskill via email. Review evidence—remind yourself—that you’re not a failure even though you’re experiencing failure or rejection.<br>\nAvoid thinking about the news for a few days. Imagine cutting yourself on a kitchen knife. The wound may sting and bleed initially. But the blood clots and the stinging diminishes if you cover the wound and don’t aggravate it.<br>\nAfter experiencing a failure or rejection, invite a colleague to lunch, and ask about their recent reading and travels. Dive into a project that will absorb you. Visit a museum, or watch a movie. Remove the letdown from your thoughts.<br>\nConsider seeking input from a mentor, especially if you’ve never experienced a failure or rejection of this type before. Mentors have more experience and so can put obstacles in perspective. For example, suppose you’re a student who’s received an upsetting referee report from a journal. The report might look mild to a faculty member, who’s likely received far more, and more-upsetting, reports. What sounds harsh to you might sound quotidian to an advisor, whose lack of distress might reassure you.<br>\nAlso, mentors notice upsides that you’ve overlooked. Perhaps the referee trashed your presentation of an idea but tacitly approved of the idea itself. The trashing might have drowned out the approval during your reading. Yet the approval could justify a resubmission to the journal, upending your belief in the cause’s hopelessness. Relatedly, a mentor can help you identify strategies for moving past the failure. Maybe this journal won’t publish your paper but another journal is soliciting contributions to a relevant special collection.<br>\nAs a PhD student, I applied for an internship at a company developing a quantum computer. I broke an obligation and flew out of state to interview for the position. No offer materialized. To process the outcome, I spoke with a more-advanced researcher I trusted. He not only offered a mature perspective, but also had access to inside information. The team liked me, he reported, but my interests didn’t overlap with theirs enough. In a sense, I’d grown too independent. As independence marks maturity in PhD students, the rejection came to double as a compliment. Today, I remain on friendly terms with multiple people from that team, and a student of mine just landed an internship at a quantum-computing company.<br>\nChart a path past the failure or rejection. Cue the lemon meringue pie. Did a hiring committee reject an application of yours? Email the committee’s chair, thanking them for considering your application. Express your hope of improving your materials so that you can try again the following year. Ask if the chair would provide feedback via phone or Zoom.1<br>\nPursue the path you’ve charted. To ease the burden, consider undertaking lighter tasks before more-arduous ones. I recently received a laundry list of requests about a manuscript from an editor—and when I say laundry, I mean the equivalent of hauling a multiple-pound bag to a stream, scrubbing everything by hand while the wind attempts to blow cleaned items into the mud, and then hauling everything back. I began with the tasks that required little effort. Dispatching them, I crossed about half the requests off my to-do list. The list looked more manageable as a result; I felt better-equipped to handle the trickiest work.<br>\nCelebrate your triumphs. Don’t let failures and rejections consume your attention; carve out time for your successes. If you recognize them, you’ll remember them the next time you face failure; they’ll cushion you when you fall.<br>\nI recently failed at a task over a hundred times (yes, I counted). After 28 months of trying, I succeeded. I celebrated by treating myself to lunch at the National Gallery of Art.2 Why not gather ye rosebuds while ye may? This success afforded me the opportunity to fail at a new task.<br>\nAlways remember, what matters in the long run is not any one failure or rejection, but your persistence despite failures and rejections. I progressed to the Rhodes Scholarship competition’s final round two years in a row. Each year, a committee interviewed and rejected me. I’d poured time, sweat, and blood into my applications and interview preparations. I felt like I had no more blood to squeeze into the applications I then had to write for graduate programs because of those rejections. Those rejections, though, led me to become a student of John Preskill’s. Over a decade later, I’m not kicking myself.<br>\nShare about your favorite failures in the comments section below!<br>\n1Not via email, which doesn’t offer the same freedom.<br>\n2Its Garden Café had enticed me for years, but I can rarely bring myself to pay for food when I can prepare it myself.<\/p>","content_hash":"b80ff55d8863d3327a44766ce180a0c2","author":"Nicole Yunger Halpern","published_at":"2026-05-21T00:20:32","fetched_at":"2026-09-23 10:41:55","word_count":1165,"read_time_minutes":6,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"17w","domain":"quantumfrontiers.com"},{"id":"2b1b4a6dc4ac6b5f","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=17917","title":"How I learned to stop worrying and…no, I’ve always adored entropy","url":"https://quantumfrontiers.com/2026/04/12/how-i-learned-to-stop-worrying-andno-ive-always-adored-entropy/","summary":"When I was pursuing a PhD at Caltech, so was my friend Jeremy. He used to throw a dinner party every few months. The email invitations welcomed friends to partake of his cooking and, if we wished, to help him cook. I didn’t help cook; but, when I arrived, the mess of pots and pans drew me to the kitchen like vinegar drawing a pathological fly. I couldn’t sit still while cookware needed cleaning, so I scrubbed and rinsed the pans and spoons and bowls. Jeremy, an applied-physics student, commented","content":"<p>When I was pursuing a PhD at Caltech, so was my friend Jeremy. He used to throw a dinner party every few months. The email invitations welcomed friends to partake of his cooking and, if we wished, to help him cook. I didn’t help cook; but, when I arrived, the mess of pots and pans drew me to the kitchen like vinegar drawing a pathological fly. I couldn’t sit still while cookware needed cleaning, so I scrubbed and rinsed the pans and spoons and bowls. Jeremy, an applied-physics student, commented on my adeptness at decreasing entropy.<br>\nIt’s the story of my life, I replied.<br>\nIn fourth grade, my classmates and I cleaned our desks every Friday afternoon. Once a student finished, my teacher dismissed him or her onto the playground. My neighbor’s desk horrified me like the disaster in a hurricane’s wake, so I neatened his desk after finishing with mine.1 Another friend requested the same favor. A third classmate offered to pay me for cleaning his desk, but I’d have undertaken the chore for its own sake. Ordering the world offered me fulfillment.<br>\nFrom cleaning a fourth-grade desk, I progressed to pursuing a PhD in theoretical physics. The two pursuits might seem to resemble each other no more than Dr. Jekyll and Mr. Hyde; yet, to me, the path between them is but a step. I trained as a theoretical physicist because I love organizing ideas. Caltech paid me to build models, propose definitions and theorems, and structure proofs—to dream up ideas and identify the optimal arrangements for them. I needed that pay, being an adult, as I hadn’t needed my fourth-grade classmate’s desk-cleaning fee. Yet I organized ideas for the same reason that drove me to organize my neighbor’s notebooks.<br>\nMany people have called entropy a measure of disorder. To see why, imagine that Jeremy’s crew has used thirty utensils while cooking. The chefs can have scattered the utensils across the kitchen in many ways: they may have dropped forks on the floor, left spoons in the sink, arranged spatulas on the drying rack, or filled a vase with knives like a modern-art bouquet. In few of these configurations do the forks lie in their compartment of the utensil drawer, the spoons lie in their compartment, etc. We call such configurations neat. Most of the other configurations, we call messy.<br>\nA system’s entropy is the number of configurations consistent with known large-scale properties of the system, such as the number of forks.2 More configurations are consistent with messiness (and a fixed number of forks and so on) than with neatness (and the same number of forks and so on). Messiness tends to correlate with high entropy. People often say, therefore, that entropy quantifies messiness. Hence Jeremy’s complimenting me on my decreasing of entropy.<br>\nJeremy’s dinner parties came to mind as I read the book The Mattering Instinct, published by Rebecca Newberger Goldstein this January. Rebecca is a philosopher of science and a writer. I had the good fortune to meet her through my undergraduate mentor Marcelo Gleiser, who’s had another cameo or two on Quantum Frontiers. Rebecca’s latest book covers what she calls the mattering instinct: the longing to know that we matter.<br>\nWe spend scads of energy and time on securing our “survival and flourishing,” as Rebecca says. We feed ourselves; work to earn money to purchase food; clean, shelter, and clothe ourselves; ingrain ourselves in societies that offer some degree of security; and more. Do we deserve all this effort? We long for assurance that, in the immortal words of L’Oreal, we’re worth it.<br>\nSurvival and flourishing, Rebecca writes, requires us to decrease entropy. Every closed, isolated system’s entropy increases or remains constant, according to the second law of thermodynamics. Entropy increases as a system becomes more uniform, loosely speaking. The system’s particles spread out across space, these particles’ temperature comes to equal those particles’ temperature, and so on. In contrast, your body exists because its particles clump together in a certain shape consistently. You withstand heat waves and snow because homeostasis maintains your temperature despite your environment’s temperature. You keep your body’s entropy low to survive. Rebecca therefore casts us as fighting entropy.<br>\nAs a thermodynamicist, I agree with Rebecca. Yet I also adore entropy. It helps explain why time flows, quantifies uncertainty, and determines the maximal efficiencies with which we can perform tasks such as communication. What versatility and richness! Entropy also embodies tension and subtlety: its mathematical definition looks obscure at first glance, yet entropy helps explain familiar phenomena such as aging. For these reasons, before beginning my PhD, I told a potential advisor that I could imagine devoting the next five years of my life to entropy.<br>\nI therefore aspire to rehabilitate entropy’s reputation. Novelist Terry Pratchett endeared mortality to millions of readers through anthropomorphism. His character Death, a mainstay of the Discworld series of novels, elicits empathy and fondness. I won’t anthropomorphize entropy here,3 but I aim to replace conflict with cooperation in the narrative above. To survive and flourish, I hold, we partner with entropy. How? We create oodles of entropy in our environments. This entropy increase offsets the entropy decrease that supports life.<br>\nFor example, imagine working at a desalination plant. You’d process high-entropy water throughout which salt has spread. You’d concentrate the salt in a tiny region, reducing the water’s entropy. This reduction, producing fresh water, could support your city’s drinking, cooking, and toothbrushing needs.<br>\nTo reduce the water’s entropy, you’d create loads more entropy. You’d eat breakfast before work, consuming energy stored neatly in your waffle’s chemical bonds. Your body would later break the bonds, releasing the energy. Some energy would power your muscles, so you could program the desalination system, test its output, etc. But much of the chemical energy would transform into heat radiated by your body. The heat would warm up the air molecules around you, magnifying their random jigglings and jostlings. You’d increase the entropy of the air—your environment—to decrease the water’s entropy. The air’s entropy increase would outweigh the water’s entropy decrease.<br>\nOrganisms survive and flourish by producing entropy in their environments. In fact, organisms have a knack for generating entropy. Entropy and life thereby further each other. A glass-half-full thinker could conclude that we partner with entropy.<br>\nSo did I partner with entropy as a PhD student, applying it to solve problems in quantum information theory and thermodynamics. So did I partner with entropy in fourth grade and at Jeremy’s apartment, deriving satisfaction from my cleaning. Rebecca would call these activities’ ultimate aim (beyond the aim of, e.g., not sitting beside a pigsty in fourth grade) mattering. She writes that we reduce entropy (within our immediate vicinities) to satisfy the mattering instinct. Rebecca’s proposition describes my behaviors with uncanny precision, I realized upon reading her book.<br>\nWhich I’ve now finished. So pardon me while I return to washing forks in the quantum kitchen of the universe.<br>\nWith thanks to Jeremy for his friendship…and food.<br>\n1I also ensured that my neighbor brought home, every afternoon, the sweater he’d brought to school that morning. Before I took charge, he’d ended up with three forgotten sweaters crammed into his cubby.<br>\n2At least, one entropy is. Many other entropies exist.<br>\n3If you anthropomorphize entropy elsewhere, let me know.<\/p>","content_hash":"fa0db26cbcb786f59f298f893b38d64a","author":"Nicole Yunger Halpern","published_at":"2026-04-13T00:06:06","fetched_at":"2026-09-23 10:41:56","word_count":1213,"read_time_minutes":7,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"23w","domain":"quantumfrontiers.com"},{"id":"00e76eede1b889de","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2026/01/22/powerful-new-developer-tools-increase-the-versatility-of-the-microsoft-quantum-platform/","title":"Powerful new developer tools increase the versatility of the Microsoft Quantum platform","url":"https://azure.microsoft.com/en-us/blog/quantum/2026/01/22/powerful-new-developer-tools-increase-the-versatility-of-the-microsoft-quantum-platform/","summary":"The field of quantum computing has advanced beyond the level of error-prone physical qubits to an era of reliable quantum computation with logical qubits. To continue making progress toward fault-tolerant quantum machines, advances in both quantum hardware and software are required. Microsoft is committed to providing the tools that developers and scientists need to enable applications on the quantum machines that exist today, as well as the fault-tolerant machines of the future. New tools that ","content":null,"content_hash":"97b474e3a31f6cbff252701dfbf0d7e2","author":"Matthias Troyer","published_at":"2026-01-22T16:00:00","fetched_at":"2026-09-23 10:42:20","word_count":75,"read_time_minutes":1,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"34w","domain":"azure.microsoft.com"},{"id":"9ce0e464f94a90fc","feed_id":"microsoft-quantum","guid":"https://www.microsoft.com/en-us/security/blog/2025/08/20/quantum-safe-security-progress-towards-next-generation-cryptography/","title":"Quantum-safe security: Progress towards next-generation cryptography","url":"https://www.microsoft.com/en-us/security/blog/2025/08/20/quantum-safe-security-progress-towards-next-generation-cryptography/","summary":"Quantum computing promises transformative advancements, yet it also poses a very real risk to today’s cryptographic security. In the future scalable quantum computing could break public-key cryptography methods currently in use and undermine digital signatures, resulting in compromised authentication systems and identity verification. Starting your journey to become quantum-safe Read the blog › While scalable quantum computing is not available today, the time to prepare is now. Microsoft is prep","content":"<p>Quantum computing promises transformative advancements, yet it also poses a very real risk to today’s cryptographic security. In the future scalable quantum computing could break public-key cryptography methods currently in use and undermine digital signatures, resulting in compromised authentication systems and identity verification.<br>\nStarting your journey to become quantum-safe<br>\nWhile scalable quantum computing is not available today, the time to prepare is now. Microsoft is preparing to be quantum-safe and partnering with regulatory and technical bodies like the National Institute of Standards and Technology (NIST), Internet Engineering Task Force (IETF), International Organization for Standardization (ISO), Distributed Management Task Force (DMTF), Open Compute Project (OCP), and European Telecommunications Standards Institute (ETSI) to align on quantum-safe encryption standards and support worldwide interoperability.<br>\nThe opportunity and challenge ahead<br>\nMigration to post quantum cryptography (PQC) is not a flip-the-switch moment, it’s a multiyear transformation that requires immediate planning and coordinated execution to avoid a last-minute scramble.<br>\nIt is also an opportunity for every organization to address legacy technology and practices and implement improved cryptographic standards. By acting now, organizations can upgrade to modern cryptographical architectures that are inherently quantum safe, upgrade existing systems with the latest standards in cryptography, and embrace crypto-agility (the ability to easily change algorithms) to modernize their cryptographic standards and practices and prepare for scalable quantum computing.<br>\nThe investment in a quantum future<br>\nAt Microsoft, we have been investing in this shift by developing both the advances in quantum computing, such as the Majorana 1 quantum processor and 4D geometric error correction codes, and the requirements for PQC.<br>\nOur PQC effort began in 2014 when we published research on post-quantum algorithms and later quantum cryptanalysis to more rigorously determine when contemporary algorithms will be broken. To contribute to PQC algorithm development we participated in four submissions to the original 2017 NIST PQC call and one submission to the current call. Since 2018 we have been experimenting with verified versions of PQC algorithms and in 2019 Microsoft Research completed testing of an experimental PQC-protected VPN tunnel between Redmond, Washington, and Scotland using the Project Natick underwater datacenter.<br>\nTo support standards development and foster the integration of post-quantum cryptographic algorithms into internet protocols, Microsoft joined as a founding member of the Open Quantum Safe project. Additionally, we led the integration workstream of the NIST NCCoE Post-Quantum project. Microsoft Research was contributing to updating the ISO cryptography standard to include PQC, with our FrodoKEM cryptosystem, developed in collaboration with academic and industry partners, poised to become an ISO standard algorithm.<br>\nIn 2024, we announced and contributed Adams Bridge Accelerator, an open-source quantum resilient cryptographic hardware accelerator and integrated into Caliptra 2.0, part of Open Compute Project (OCP).<br>\nFinally, to help customers and partners begin exploration and integration of quantum-safe algorithms into their environments we previewed PQC capabilities for Windows Insiders and Linux and updated SymCrypt to support verified PQC algorithms. This will help them proactively prepare their software and services for PQC support.<br>\nCreating a Quantum Safe Program<br>\nIn 2023, Charlie Bell, Executive Vice President for Microsoft Security, outlined Microsoft’s vision to build a quantum-safe future, which led to the creation of the Microsoft Quantum Safe Program (QSP). This program unifies and accelerates Microsoft’s efforts to protect our infrastructure, as well as that of our customers, partners, and ecosystems, from the evolving risk of quantum computing.<br>\nThe following timelines shows a consolidated view of where we are today, and what to expect in the near future as we progress this important program as an industry.<br>\nThe Microsoft QSP is aligned with United States government requirements and timelines for quantum safety, including the US Office of Management and Budget (OMB), the Cybersecurity and Infrastructure Security Agency (CISA), NIST, and the National Security Agency’s guidance for organizations to start preparing and transitioning for PQC enablement. We also closely monitor quantum-safe initiatives from international governments, including the European Union, Japan, Canada, Australia, and the United Kingdom, to align with their efforts.<br>\nYou can learn more about our collaboration with standards bodies and recommendations for effective government policies to accelerate the quantum-safe transition in the Microsoft On the Issues blog by Amy Hogan Burney, Vice President, Customer Security and Trust.<br>\nThe Microsoft QSP strategy<br>\nOur QSP is a comprehensive and company-wide effort to enable Microsoft, our customers, and partners, to transition smoothly and securely into the quantum era. The program is governed by the QSP leadership team with representatives across all major business groups, research and engineering divisions, and functions.<br>\nThe QSP strategy is guided by three priorities:<br>\n- Make Microsoft quantum safe by updating Microsoft first- and third-party services, supply chain, and ecosystem to become quantum safe and crypto-agile.<br>\n- Support customers, partners, and ecosystems to become quantum safe with appropriate tools and guidance.<br>\n- Promote global research, standards, and solutions for quantum-safe technologies and crypto-agility.<br>\nOur quantum-safe journey began with an enterprise-wide inventory to assess and prioritize cryptographic asset risks. From there, we partnered with industry leaders to address critical dependencies, investing in quantum safe research and collaborating on hardware and firmware innovation. We accelerated the adoption of quantum-resilient algorithms across core infrastructure, supported by Microsoft’s open-source silicon initiatives.<br>\nAs a result of this foundational work, we are aligned with global government timelines, striving to meet even the most forward-leaning CNSA 2.0 deadlines outlined in CNSSP-15. Combining the different regulations’ aspects and timelines worldwide, Microsoft’s roadmap aims to complete transition of its services and products by 2033—two years before the 2035 deadline set by most governments—aiming to enable early adoption of quantum-safe capabilities by 2029, gradually making them default in subsequent years, or sooner where possible.<br>\nTo maintain resilience of Microsoft’s services and systems against quantum computers powerful enough to break modern cryptographic algorithms, we’ve developed a phased transition strategy built on a modular framework. This approach considers each service unique requirements, performance constraints, and risk profile, resulting in either a direct shift to full PQC or a hybrid approach combining classical and quantum-resistant algorithms as an interim step. Therefore, as early adoption will begin by 2029, core services will reach maturity a few years before then.<br>\nHere are the three key phases for this strategy:<br>\n1. Foundational security components<br>\nMicrosoft has integrated PQC algorithms into foundational components like SymCrypt, the primary cryptographic library that provides consistent cryptographic security across Windows, Microsoft Azure, Microsoft 365 and other platforms. SymCrypt supports both symmetric (for example, AES [Advanced Encryption Standard]) and asymmetric algorithms (for example, RSA [Rivest–Shamir–Adleman], ECDSA [Elliptic Curve Digital Signature Algorithm]), providing essential cryptographic operations such as encryption, decryption, signing, verification, hashing, and key exchange. Most recently we’ve made ML-KEM (Module-Lattice Key Encapsulation Mechanism) and ML-DSA (Module-Lattice Digital Signature Algorithm) available through Cryptography API: Next Generation (CNG) and Certificate and Cryptographic messaging functions. These capabilities are available to Windows Insiders and Linux customers now, with additional foundational capabilities coming through the next five years, always aligning and timebound to evolving industry standards and advancements.<br>\nAs quantum computing advances, the threat of Harvest Now, Decrypt Later (HNDL) cyberattacks become increasingly pressing—where threat actors record and store encrypted data today with the intention of decrypting it once quantum capabilities mature. To counter this risk, security protocol standards are prioritizing quantum-safe key exchange mechanisms. For instance, TLS 1.3 is being enhanced to support both hybrid and pure post-quantum key exchange methods, making it a robust adaptable foundation for integrating PQC algorithms. With version 1.9.0 of SymCrypt-OpenSSL, we’ve enabled TLS hybrid key exchange as per the latest IETF internet draft, providing an early opportunity to help prepare for HNDL threats. This capability will be coming to Windows TLS stack soon.<br>\n2. Core infrastructure services<br>\nUpdating foundational components in products and services, considered core infrastructure service, to provide quantum safety for Microsoft and our customers from future quantum risks. Examples include Microsoft Entra authentication, key and secret management, and signing services. By prioritizing these services, Microsoft will protect the most sensitive and essential components first, providing a strong foundation for the broader transition.<br>\n3. All services and endpoints<br>\nIntegrating PQC into Windows, Azure services, Microsoft 365, data platforms, AI services, and networking enables the broader ecosystem of Microsoft services to be quantum safe, providing comprehensive protection across all platforms and applications.<br>\nWhat’s next<br>\nIn our previous blog, Starting your journey to become quantum safe, we provided some practical recommendations and services for customers to start their quantum-safe journey. In future updates, we will continue to provide insights and guidance, grounded in practical experience as we take these critical steps on a most important journey.<br>\nTransitioning to a quantum-safe environment is a complex but essential process and we encourage our customers and partners to start developing their strategy now.<br>\nTo learn more about Microsoft Security solutions, visit our website. Bookmark the Security blog to keep up with our expert coverage on security matters. Also, follow us on LinkedIn (Microsoft Security) and X (@MSFTSecurity) for the latest news and updates on cybersecurity.<\/p>","content_hash":"d1770d848210544227f3a95decc97fcd","author":"Mark Russinovich and Michal Braverman-Blumenstyk","published_at":"2025-08-20T16:00:00","fetched_at":"2026-09-23 10:42:29","word_count":1480,"read_time_minutes":8,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"56w","domain":"microsoft.com"},{"id":"6b17bba369386971","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14359","title":"Microsoft advances quantum error correction with a family of novel four-dimensional codes","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/06/19/microsoft-advances-quantum-error-correction-with-a-family-of-novel-four-dimensional-codes/","summary":"Microsoft Quantum is continuing to advance the global quantum ecosystem by adding cutting-edge features to its compute platform. By developing powerful error-correction codes that are applicable to many types of qubits, we are advancing the field of quantum computing while putting it within reach of experts and nonexperts alike. Microsoft’s novel four-dimensional geometric codes require very few physical qubits per logical qubit, can check for errors in a single shot, and exhibit a 1,000-fold re","content":"<p>Microsoft Quantum is continuing to advance the global quantum ecosystem by adding cutting-edge features to its compute platform. By developing powerful error-correction codes that are applicable to many types of qubits, we are advancing the field of quantum computing while putting it within reach of experts and nonexperts alike. Microsoft’s novel four-dimensional geometric codes require very few physical qubits per logical qubit, can check for errors in a single shot, and exhibit a 1,000-fold reduction in error rates.<br>\nAddressing the need for fault-tolerant quantum computers<br>\nMost of today’s quantum computers operate with qubits that are prone to errors and thus are not capable of reliable computation on their own. To realize the promise of complex problem-solving abilities in quantum computers, there are two prerequisites:<br>\n- Use physical qubits with high fidelities.<br>\n- Apply error-correction codes that can create reliable, logical qubits with error rates that are substantially lower than those of the corresponding physical qubits.<br>\nAs demonstrated through our collaborations with multiple hardware partners, Microsoft has state-of-the-art capabilities in error correction. Our qubit-virtualization system, which is a core component of the Microsoft Quantum compute platform, enables the creation and entanglement of reliable logical qubits from high-quality physical qubits.<br>\nPreviously, we created and entangled 24 reliable logical qubits by applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral atoms. In that study, we demonstrated our ability to detect and correct errors—and correct for losses of qubits—during computation, thus enabling reliable and highly accurate quantum computation. The teams also created 28 logical qubits with the ability to detect and correct errors while performing reliable computation.<br>\nBy detecting and correcting errors during computation, the Microsoft Quantum compute platform creates logical qubits from high-quality physical qubits to enable reliable quantum computation.<br>\nMicrosoft’s new four-dimensional (4D) geometric codes<br>\nEven high-quality physical qubits require error correction to create and entangle the logical qubits that enable reliable quantum computation. To that end, Microsoft has developed a family of novel 4D geometric codes, which are available in the Microsoft Quantum compute platform and are suitable for qubits with all-to-all connectivity such as neutral atoms, ion traps, and photonics. These powerful codes can reduce the error rates of physical qubits by orders of magnitude to reach the level required for quantum circuits to operate reliably.<br>\nMicrosoft’s new 4D geometric codes:<br>\n- Require very few physical qubits to make each logical qubit: Rotating the codes in four dimensions achieves a fivefold reduction in the number of physical qubits required to make logical qubits.<br>\n- Have efficient logical operations: The codes exhibit high performance and have the single-shot property that enables them to correct errors quickly.<br>\n- Improve the performance of quantum hardware: A 1,000-fold reduction in error rate can be achieved by lowering the physical error rate from 10-3 (one per thousand) to a logical error rate of approximately 10-6 (one per million).<br>\nWith these features, this family of novel codes provides several benefits. The codes reduce the number of steps required to diagnose errors, resulting in low-depth operations and computations. Additionally, these codes reduce the number of physical qubits needed to achieve fault-tolerant quantum computing, accelerating the path to utility scale.<br>\nThis family of codes is one of many that is available for inclusion in the Microsoft Quantum compute platform. It comes with a complete set of efficient operations that makes compilation of any quantum algorithm possible. Incorporation of these codes into our full-stack will enable the creation and entanglement of 50 logical qubits in the near term, with the potential to scale to thousands of logical qubits in the future.<br>\nThe Microsoft Quantum advantage<br>\nAt Microsoft, we are bringing the capabilities for quantum advantage forward by coupling state-of-the-art quantum hardware with the Microsoft Quantum compute platform, which includes error correction, cloud high-performance computing, and advanced AI models. And now, these capabilities can be paired with Microsoft Discovery—our platform designed to accelerate scientific progress.<br>\nIn addition to the strength of the co-optimized hardware and software, Microsoft’s team of experts is available to provide insight and technical expertise on use cases, industry challenges, and opportunities for innovation and collaborative research projects. This allows customers to explore quantum applications, generate new datasets with reliable quantum computing, improve the performance or accuracy of AI models, and provide regional skilling and education in quantum computing.<br>\nMicrosoft and Atom Computing<br>\nTogether, Microsoft and Atom Computing have co-designed a pairing of neutral-atom qubits with the Microsoft Quantum compute platform. Atom Computing’s neutral-atom qubits have several advantages over some other qubit technologies, including their ability to be tightly packed in arrays due to their lack of charge, which offers extensive scalability. Additionally, they can be moved around to allow interactions with other atoms, they have low susceptibility to noise, and they have the high fidelities needed for quantum error correction to work.<br>\nSince our last announcement on our collaboration with Atom Computing, the company has demonstrated improved mid-circuit measurement with qubit reset and reuse on their hardware. This technique—which allows for the measurement of a subset of qubits while preserving both measured and unmeasured qubits—improves error correction, increases the complexity of quantum computations that can be performed, and paves the way for fault-tolerant quantum computing. Additionally, the two-qubit gate fidelity of Atom Computing’s neutral atoms is 99.6%, which remains the highest fidelity of neutral-atom qubits in a commercial system.<br>\nThe high fidelities, all-to-all connectivity, and long coherence times available with Atom Computing’s neutral-atom qubits make them well suited for the creation of logical qubits with the Microsoft Quantum compute platform.<br>\nTogether, Microsoft and Atom Computing apply state-of-the-art error correction to high-quality physical qubits to enable reliable quantum computation.<br>\nReliable quantum computing is here<br>\nWe are in the early stages of reliable quantum computing, and the impact that this technology will have is just beginning to be realized. Practical applications will start to be revealed as researchers in various industries adopt a co-design approach to explore interactions between quantum architectures, algorithms, and applications.<br>\nThe most groundbreaking use cases of quantum computing are likely to be achieved when quantum is used to improve and accelerate other technologies, such as high-performance computing and AI. By providing customers with the tools they need to learn quantum computing, develop algorithms, and design quantum applications, Microsoft is enabling customers to maximize the potential benefits of enhancing other technologies with quantum.<br>\nLearn more about quantum<br>\n- Explore the Microsoft Quantum compute platform.<br>\n- Read the theory-based paper on the family of novel 4D error-correction codes.<br>\n- Read the paper on the quantum error correction achieved by incorporating Atom Computing’s QPUs into the Microsoft Quantum compute platform.<\/p>","content_hash":"fd54504b8b56050668d3db61cbcfc3a7","author":"Krysta Svore","published_at":"2025-06-19T20:00:00","fetched_at":"2026-09-23 10:42:40","word_count":1092,"read_time_minutes":6,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"65w","domain":"azure.microsoft.com"},{"id":"fda519d43db4a205","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/?p=14344","title":"Transforming R&D with agentic AI: Introducing Microsoft Discovery","url":"https://azure.microsoft.com/en-us/blog/transforming-rd-with-agentic-ai-introducing-microsoft-discovery/","summary":"We are announcing a new enterprise agentic platform called Microsoft Discovery to accelerate research and development (R&amp;D) at Microsoft Build 2025.Our goal is to bring the power of AI to scientists and engineers to transform the entire discovery process—from advanced knowledge reasoning and hypothesis formulation to experimental simulation and iterative learning. Microsoft Discovery enables researchers to collaborate with a team of specialized AI agents combined with a graph-based knowledge","content":"<p>We are announcing a new enterprise agentic platform called Microsoft Discovery to accelerate research and development (R&D) at Microsoft Build 2025.<br>\nOur goal is to bring the power of AI to scientists and engineers to transform the entire discovery process—from advanced knowledge reasoning and hypothesis formulation to experimental simulation and iterative learning. Microsoft Discovery enables researchers to collaborate with a team of specialized AI agents combined with a graph-based knowledge engine, to drive scientific outcomes with speed, scale, and accuracy.<br>\nWe have architected Microsoft Discovery to be highly extensible, enabling researchers to integrate the latest Microsoft innovations with their own models, tools, and datasets as well as a wide range of partner and open-source solutions. Built on top of Microsoft Azure, trust, compliance, transparency, and governance are key design principles of this enterprise-ready platform to enable responsible innovation, keeping the researcher in control.<br>\nAt Microsoft, our researchers have leveraged the advanced AI models and high-performance computing (HPC) simulation tools in Microsoft Discovery to discover a novel coolant prototype with promising properties for immersion cooling in datacenters in about 200 hours—a process that otherwise would have taken months, if not years. This rapid discovery lays the groundwork for future developments in safer and sustainable solutions across multiple industries and is a demonstration of how Microsoft Discovery can potentially transform R&D in any company.<br>\nWe are working with a notable set of Microsoft customers who are interested in co-innovating in diverse industries including chemistry and materials, silicon design, energy, manufacturing, and pharma. We are also working with a broad partner base that is building on top of the platform to drive this acceleration, and we couldn’t be more excited. The possibilities are endless as we realize the full potential of AI in R&D and we are just getting started!<br>\nThe agentic vision for science<br>\nAt Microsoft, we want to amplify the ingenuity of scientists to usher in a new era of accelerating discovery and expand the horizons of research. Doing so requires empowering R&D teams with transformative technologies that can drive meaningful business impact. However, R&D has very specific challenges compared to other domains:<br>\n- Scientific knowledge is vast, nuanced, and distributed.<br>\n- The discovery process is diverse and dynamic, involving multiple highly specialized methods and tasks, making it very hard to connect the dots across the different domains involved.<br>\n- R&D is iterative. There are rarely simple, clear-cut answers. Instead, scientific knowledge evolves through evidence, discourse, and refinement.<br>\nThis complexity demands a new paradigm—one that isn’t aimed at doing the same experiments faster, but rather fundamentally changing the paradigm of how we approach R&D.<br>\nImagine if every researcher could collaborate with a tireless team of intelligent, synergistic AI agents with the sole purpose of accelerated innovation. This is our vision for a new agentic R&D paradigm, embedding AI in every stage of the scientific method.<br>\nIn this new world, people and specialized AI agents will cooperatively refine knowledge and experimentation in real time in a continuous, iterative cycle of discovery—all while maintaining the control, transparency, and trust that enterprises and governmental institutions require. This requires a comprehensive platform where AI can capture both the scientific domain and the cognitive processes involved in managing scientific thought. To realize this vision, scientific AI agents must be able to:<br>\n- Reason over a complex and contextual graph connecting all knowledge sources.<br>\n- Specialize across distinct domains and tasks.<br>\n- Learn from results and adapt entire research plans accordingly.<br>\nIntroducing Microsoft Discovery<br>\nWe are taking a big step toward realizing this vision with Microsoft Discovery, bringing agentic R&D to life by leveraging the latest innovations from Microsoft and the broader scientific ecosystem.<br>\nGraph-based scientific co-reasoning <br>\nThe advent of large language models (LLMs) hinted at this new era, offering capabilities to speed up certain scientific tasks, particularly for information retrieval and hypothesis generation. However, LLMs often lack the contextual understanding required to deeply reason over distributed, nuanced, and often contradictory scientific data.<br>\nMicrosoft Discovery<br>\nGet started today by using Azure HPC and Azure AI Foundry infrastructure.<br>\nMicrosoft Discovery is built on top of a powerful graph-based knowledge engine. Instead of merely retrieving facts, this engine builds graphs of nuanced relationships between proprietary data as well as external scientific research. This allows the platform to have a deep understanding of conflicting theories, diverse experimental results, and even underlying assumptions across disciplines.<br>\nThis contextual reasoning is also transparent. Rather than outputting monolithic answers, it keeps the expert in the loop with detailed source tracking and reasoning, providing the level of transparency in AI systems that builds trust, ensures accountability, and allows experts to validate and understand every step or make any adjustments as needed.<br>\nSpecialized discovery agents for conducting research<br>\nInstead of siloed and static pipelines, Microsoft Discovery implements a continuous and iterative R&D cycle where researchers can guide and orchestrate a team of specialized AI agents that learn and adapt over time—not just for reasoning, but for conducting research itself. The definition of these specialized agents captures both domain knowledge and process logic, simply through natural language.<br>\nR&D teams will be able to build a custom AI team aligned to their specific processes and knowledge, easily encoding these agents with their expertise and methodologies to ensure they can adapt and orchestrate as research progresses. This approach is far more flexible than hard-coding behaviors of today’s digital simulation tools, which often are highly specialized and lack streamlined integration with others, and it means that research teams no longer require computational expertise to drive impact. As an example, users can access and define various agents’ specialties, such as ‘molecular properties simulation specialist’ or ‘literature review specialist.’ They can even suggest which tools or models the agents should use or create, and how they should collaborate with others.<br>\nThis organic, bidirectional collaboration is a game-changer for managing R&D: agents are not only capable of working for the researchers, but with them in a manner that can truly amplify human ingenuity—seeing both the forest and the trees at once.<br>\nAt the center of this collaboration is Microsoft Copilot, acting as a scientific AI assistant that orchestrates these specialized agents based on the researcher’s prompts. Copilot is aware of all the tools, models, and knowledge bases in a customer’s catalog on the platform, can identify which agents to leverage, and can set up end-to-end workflows that cover the full discovery process by combining advanced AI and HPC simulations through the joint work of these agents.<br>\nExtensible and enterprise-ready<br>\nMicrosoft Discovery is built on top of Azure infrastructure and services, leveraging by design the trust, compliance, and governance controls at the core of Microsoft’s secure cloud foundation.<br>\nWe believe in the power of an open ecosystem that leverages the strengths of Microsoft’s latest advancements in combination with other innovative solutions from customers and partners. Microsoft Discovery allows R&D teams to extend the platform’s catalog by bringing their toolkit of choice to cover their specific research needs in a comprehensive scientific bookshelf. This extensibility at the core of Microsoft Discovery simplifies the onboarding of their choice of computational tools, models, and knowledge bases—whether they are custom developments, open-source, or commercial solutions. As we bring to market new capabilities in reliable quantum computing and embodied AI, the platform will remain future-proofed with the best technologies available at Microsoft and across the industry.<br>\nReal impact: Discovering a novel, non-PFAS coolant prototype<br>\nOver the past months, we have made significant strides aiding computational scientists in their research and incorporating cutting-edge innovations from Microsoft Research. This has led to remarkable breakthroughs, such as discovering a novel solid-state electrolyte candidate that uses 70% less lithium in collaboration with the Department of Energy’s Pacific Northwest National Laboratory (PNNL) and enabling rapid computational simulations that accelerate scientific discoveries at Unilever. Microsoft Discovery is designed to bring these innovations to every scientist—not only those with deep computational expertise.<br>\nOne of the more exciting early use cases of Microsoft Discovery is unfolding at the Pacific Northwest National Laboratory, where scientists are using Microsoft Discovery’s advanced generative AI and HPC capabilities to further develop machine learning models that predict and optimize complex chemical separations—a critical process in nuclear science. These separations are essential for effectively isolating radioactive elements after the nuclear fission process, a notoriously time-sensitive and incredibly chemically complex task. In the future, the team aims to use these advancements to reduce the time scientists must spend in hazardous radioactive environments, while improving yields and purity, enhancing both safety and efficiency.<br>\n—Scott Godwin, Director, Center for Cloud Computing, Pacific Northwest National Laboratory<br>\nBy leveraging advanced AI models and HPC tools for simulation that will be available on Microsoft Discovery, Microsoft researchers discovered a novel, non-PFAS, immersion datacenter coolant prototype in about 200 hours.1 Current coolants often take many years to develop and can contain harmful PFAS-based chemicals that make them unviable to use, as there’s a global push to ban these “forever chemicals” in favor of more environmentally friendly options in this industry and many others.<br>\nAfter the digital discovery process, we successfully synthesized this coolant prototype in under four months, and it’s currently under further analysis and refinement. We have already tested some of the primary properties of this material and they align to the AI predictions, which is a testament to the accuracy of the predictive models used. While this project is only an experiment, it lays the groundwork for future developments and improvements in coolant technology and demonstrates how the combination of HPC and specialized AI models can accelerate and transform R&D processes.<br>\nAccording to Daniel Pope, founder of Submer, a company whose mission is to build datacenters with a strong focus on sustainability, efficiency, and a smarter usage of resources:<br>\nThe speed and depth of molecular screening achieved by Microsoft Discovery would’ve been impossible with traditional methods. What once took years of lab work and trial and error, Microsoft Discovery can accomplish in just weeks, and with greater confidence.<br>\nA growing ecosystem<br>\nWe are putting this enterprise-grade platform into the hands of global innovators to demonstrate real-world impact across industries—from chemistry and pharma to manufacturing and silicon design.<br>\nIt’s only with a strong ecosystem that we’ll be able to realize the full potential of Microsoft Discovery, and it’s why we’re working with customers, partners, and other Microsoft teams to bring first-party advancements together with leading industry tools and domain expertise.<br>\nCustomers and internal collaborators<br>\nGSK is working to revolutionize healthcare, uniting science, technology and talent—including world-class partnerships—to get ahead of disease together. The company uses tech to advance science and accelerate the development and delivery of medicines and vaccines to positively impact the health of people at scale.<br>\nGSK’s depth and breadth of data and integrated use of tech across every part of its business—from early scientific exploration through to manufacture and delivery of medicines and vaccines in market—provide a unique offering when working with others. The company looks forward to a possible partnership with Microsoft with the intent of further advancing GSK’s generative platforms for parallel prediction and testing, creating new medicines with greater speed and precision, and potentially transforming medicinal chemistry to new unimaginable levels. The possibilities ahead are exciting, and together, we can strive for the most innovative solutions for patients and for health.<br>\nThe Estée Lauder Companies has gained a worldwide reputation for high-quality skincare, makeup, haircare and fragrance products that deliver highly effective results demonstrated by extensive research and product evaluation. The company is excited to harness the power of Microsoft Discovery to further accelerate the development of products that uphold the finest standards of excellence.<br>\nOur proprietary R&D data, stemming from the minds of our brilliant scientists and nearly 80 years of research, development, and experimentation, is a key competitive advantage. The Microsoft Discovery platform will help us to unleash the power of our data to drive fast, agile, breakthrough innovation and high-quality, personalized products that will delight our consumers.<br>\n—Kosmas Kretsos, PhD, MBA, Vice President, R&D and Innovation Technology, The Estée Lauder Companies<br>\nAdditionally, Microsoft is releasing a medical research agent that uses the same graph-based knowledge engine available in Microsoft Discovery to enhance information retrieval by synthesizing insights from trusted medical journals. As part of a broader set of specialized agents in the healthcare agent orchestrator code sample in Azure AI Foundry, this agent enables researchers and developers to deliver actionable and evidence-based guidance tailored specifically to complex, multi-disciplinary healthcare workflows—such as cancer care.<br>\nDomain-specific offerings<br>\nCombining Microsoft’s and NVIDIA’s strengths in generative Al and scientific computing, we plan to integrate Microsoft Discovery with NVIDIA ALCHEMI and NVIDIA BioNeMo NIM microservices to accelerate breakthroughs in materials and life sciences. Materials researchers will now have access to state-of-the-art inference capabilities for candidate identification, property mapping, and synthetic data generation. Biomolecular R&D teams will be able to accelerate Al model development for drug discovery, leveraging pre-trained BioNeMo Al workflows, all in Microsoft Discovery’s unified, enterprise-grade platform.<br>\nResearchers can also deploy their AI agents on high-performance NVIDIA-accelerated Azure AI Foundry infrastructure, enabling them to efficiently process and synthesize large volumes of scientific data with exceptional speed and responsiveness for accelerated discovery and enhanced research outcomes.<br>\nAI is dramatically accelerating the pace of scientific discovery. By integrating NVIDIA ALCHEMI and BioNeMo NIM microservices into Azure Discovery, we’re giving scientists the ability to move from data to discovery with unprecedented speed, scale, and efficiency.<br>\n—Dion Harris, Senior Director of Accelerated Data Center Solutions, NVIDIA<br>\nAdditionally, we plan to integrate Synopsys’ industry solutions in Microsoft Discovery to accelerate semiconductor engineering, helping both hardware designers and software developers deliver superior products.<br>\nSemiconductor engineering is among the most complex, consequential, and high-stakes scientific endeavors of our time, which makes it an extremely compelling use case for artificial intelligence. By integrating Synopsys’ pioneering AI-powered design solutions with Microsoft Discovery, we can realize the potential of agentic AI, re-engineer chip design workflows, supercharge engineering productivity, and accelerate the pace of technology innovation.<br>\n—Raja Tabet, Senior Vice President, Engineering Excellence Group, Synopsys<br>\nMicrosoft is also working with PhysicsX, planning to integrate the company’s physics AI foundation models into Microsoft Discovery so customers can unlock new levels of automation, optimization, and performance across engineering and manufacturing.<br>\nThe Microsoft Discovery platform represents a seismic shift in how AI can accelerate scientific discovery and engineering. This is about transforming how complex physical systems are designed, built, and operated across advanced industries—in aerospace and defense, semiconductors, minerals and materials, energy, and automotive. Together, PhysicsX and Microsoft are building the software infrastructure that will define the next era of engineering.<br>\n—Jacomo Corbo, Chief Executive Officer and Cofounder, PhysicsX<br>\nIntegration support<br>\nLastly, we’re excited to partner with a growing list of software integrators, such as Accenture and Capgemini, to help customers and collaborators scale custom platform deployments.<br>\nTogether with Microsoft, we are shaping a bold AI vision for organizations who use deep science to bring innovative products to patients and consumers. Our laboratory transformation strategies and Microsoft’s Microsoft Discovery platform create a dynamic ecosystem for scientific advancement. This collaboration will help us realize the laboratory of the future, enabling scientists to push the boundaries of discovery, experimentation, and testing with greater speed and precision.<br>\n—Adam Borenstein, Managing Director, Global Laboratory Reinvention Lead, Accenture<br>\nWe are excited to be bringing the Microsoft Discovery platform and AI agents to R&D-intensive sectors. We believe these technologies have the potential to enable expert scientists to unlock step changes in the pace of innovation, bringing transformative benefits to business and society. This partnership will drive productivity in laboratory-driven R&D by drawing on Capgemini’s industry experience, specialist physical and biological AI capabilities, and science-led ‘lab-in-the-loop’ intellectual property, including that of Cambridge Consultants, the deep tech powerhouse of Capgemini. For our clients this could mean accelerated discovery and predictive modelling or other competitive advantages through using data and AI at scale.<br>\n—Roshan Gya, Chief Executive Officer, Capgemini Invent<br>\nReady to take the next steps?<br>\nLearn more about how Microsoft Discovery can help scientists and engineers transform research and development:<br>\n- Watch the announcement of Microsoft Discovery at the Microsoft Build 2025 Keynote.<br>\n- Sign up to receive updates on the Microsoft Discovery preview<br>\n¹Based on the definitions of PFAS provided by the Organisation for Economic Co-operation and Development (OECD) (2021), the U.S. Environmental Protection Agency and Buck et. al. (2011)<\/p>","content_hash":"19018fa2d51b3b31d2279d5c4c79bcdb","author":"Aseem Datar","published_at":"2025-05-19T16:05:00","fetched_at":"2026-09-23 10:42:51","word_count":2706,"read_time_minutes":14,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"70w","domain":"azure.microsoft.com"},{"id":"c07b2ffa91188e08","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2025/02/19/microsoft-unveils-majorana-1-the-worlds-first-quantum-processor-powered-by-topological-qubits/","title":"Microsoft unveils Majorana 1, the world’s first quantum processor powered by topological qubits","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/02/19/microsoft-unveils-majorana-1-the-worlds-first-quantum-processor-powered-by-topological-qubits/","summary":"Built with a breakthrough class of materials called a topoconductor, Majorana 1 marks a transformative leap toward practical quantum computing. Quantum computers promise to transform science and society—but only after they achieve the scale that once seemed distant and elusive, and their reliability is ensured by quantum error correction. Today, we’re announcing rapid advancements on the path to useful quantum computing: Majorana 1: the world’s first Quantum Processing Unit (QPU) powered by a To","content":"<p>Built with a breakthrough class of materials called a topoconductor, Majorana 1 marks a transformative leap toward practical quantum computing.<br>\nQuantum computers promise to transform science and society—but only after they achieve the scale that once seemed distant and elusive, and their reliability is ensured by quantum error correction. Today, we’re announcing rapid advancements on the path to useful quantum computing:<br>\n- Majorana 1: the world’s first Quantum Processing Unit (QPU) powered by a Topological Core, designed to scale to a million qubits on a single chip.<br>\n- A hardware-protected topological qubit: research published today in Nature, along with data shared at the Station Q meeting, demonstrate our ability to harness a new type of material and engineer a radically different type of qubit that is small, fast, and digitally controlled.<br>\n- A device roadmap to reliable quantum computation: our path from single-qubit devices to arrays that enable quantum error correction.<br>\n- Building the world’s first fault-tolerant prototype (FTP) based on topological qubits: Microsoft is on track to build an FTP of a scalable quantum computer—in years, not decades—as part of the final phase of the Defense Advanced Research Projects Agency (DARPA) Underexplored Systems for Utility-Scale Quantum Computing (US2QC) program.<br>\nTogether, these milestones mark a pivotal moment in quantum computing as we advance from scientific exploration to technological innovation.<br>\nMicrosoft Quantum Innovator Series<br>\nJoin Chetan Nayak to learn about the advancements Microsoft is making in quantum computing.<br>\nHarnessing a new type of material<br>\nAll of today’s announcements build on our team’s recent breakthrough: the world’s first topoconductor. This revolutionary class of materials enables us to create topological superconductivity, a new state of matter that previously existed only in theory. The advance stems from Microsoft’s innovations in the design and fabrication of gate-defined devices that combine indium arsenide (a semiconductor) and aluminum (a superconductor). When cooled to near absolute zero and tuned with magnetic fields, these devices form topological superconducting nanowires with Majorana Zero Modes (MZMs) at the wires’ ends.<br>\nFor nearly a century, these quasiparticles existed only in textbooks. Now, we can create and control them on demand in our topoconductors. MZMs are the building blocks of our qubits, storing quantum information through ‘parity’—whether the wire contains an even or odd number of electrons. In conventional superconductors, electrons bind into Cooper pairs and move without resistance. Any unpaired electron can be detected because its presence requires extra energy. Our topoconductors are different: here, an unpaired electron is shared between a pair of MZMs, making it invisible to the environment. This unique property protects the quantum information.<br>\nWhile this makes our topoconductors ideal candidates for qubits, it also presents a challenge: How do we read quantum information that is so well hidden? How can we distinguish between, say, 1,000,000,000 and 1,000,000,001 electrons?<br>\nOur solution to this measurement challenge works as follows (also see Figure 1):<br>\n- We use digital switches to couple both ends of the nanowire to a quantum dot, which is a tiny semiconductor device that can store electrical charge.<br>\n- This connection increases the dot’s ability to hold charge. Crucially, the exact increase depends on the parity of the nanowire.<br>\n- We measure this change using microwaves. The dot’s ability to hold charge determines how the microwaves reflect off the quantum dot. As a result, they return carrying an imprint of the nanowire’s quantum state.<br>\nWe designed our devices so these changes are large enough to measure reliably in a single shot. Our initial measurements had an error probability of 1%, and we’ve identified clear paths to significantly reduce this.<br>\nOur system shows impressive stability. External energy—such as electromagnetic radiation—can break Cooper pairs, creating unpaired electrons that can flip the qubit’s state from even to odd parity. However, our results show that this is rare, occurring only once per millisecond on average. This indicates that the shielding that envelops our processor is effective at keeping such radiation out. We are exploring ways to reduce this even further.<br>\nIt’s perhaps not surprising that quantum computation would require us to engineer a new state of matter specifically designed to enable it. What’s remarkable is how accurate our readout technique already is, demonstrating that we are harnessing this exotic state of matter for quantum computation.<br>\nRevolutionizing quantum control through digital precision<br>\nThis readout technique enables a fundamentally different approach to quantum computing in which measurements are used to perform calculations.<br>\nTraditional quantum computing rotates quantum states through precise angles, requiring complex analog control signals customized for each qubit. This complicates quantum error correction (QEC), which must rely on these same sensitive operations to detect and correct errors.<br>\nOur measurement-based approach simplifies QEC dramatically. We perform error correction entirely through measurements activated by simple digital pulses that connect and disconnect quantum dots from nanowires. This digital control makes it practical to manage the large numbers of qubits needed for real-world applications.<br>\nFrom physics to engineering<br>\nWith the core building blocks now demonstrated—quantum information encoded in MZMs, protected by topology, and processed through measurements—we’re ready to move from physics breakthrough to practical implementation.<br>\nThe next step is a scalable architecture built around a single-qubit device called a tetron (see Figure 2). At the Station Q meeting, we shared data demonstrating the basic operation of this qubit. One fundamental operation—measuring the parity of one of the topological nanowires in a tetron—uses the same technique described in our Nature paper.<br>\nAnother key operation puts the qubit in a superposition of parity states. This, too, is performed by a microwave reflectometry measurement of a quantum dot, but in a different measurement configuration in which we decouple the first quantum dot from the nanowire and connect a different dot to both nanowires at one end of the device. By performing these two orthogonal Pauli measurements, Z and X, we’ve demonstrated measurement-based control—a crucial milestone that unlocks the next steps on our roadmap.<br>\nOur roadmap now leads systematically toward scalable QEC. The next steps will involve a 4×2 tetron array. We will first use a two-qubit subset to demonstrate entanglement and measurement-based braiding transformations. Using the entire eight-qubit array, we will then implement quantum error detection on two logical qubits.<br>\nThe built-in error protection of topological qubits simplifies QEC. Moreover, our custom QEC codes reduce overhead roughly tenfold compared to the previous state-of-the-art approach. This dramatic reduction means that our scalable system can be built from fewer physical qubits and has the potential to run at a faster clock speed.<br>\nDARPA’s recognition of our approach<br>\nThe Defense Advanced Research Projects Agency (DARPA) has selected Microsoft as one of two companies to advance to the final phase of their rigorous benchmarking program known as Underexplored Systems for Utility-Scale Quantum Computing (US2QC)—one of the programs that makes up DARPA’s larger Quantum Benchmarking Initiative (QBI). Microsoft views this recognition as validation of our roadmap for building a fault-tolerant quantum computer with topological qubits.<br>\nDARPA’s US2QC program and its broader Quantum Benchmarking Initiative represent a rigorous approach to evaluating quantum systems that could solve problems that are beyond the capabilities of classical computers. To date, the US2QC program has brought together experts from DARPA, Air Force Research Laboratory, Johns Hopkins University Applied Physics Laboratory, Los Alamos National Laboratory, Oak Ridge National Laboratory, and NASA Ames Research Center to verify quantum hardware, software, and applications. Going forward, the larger Quantum Benchmarking Initiative is expected to engage with even more experts in the testing and evaluation of quantum computers.<br>\nPreviously, DARPA selected Microsoft for an earlier phase upon an assessment that we could plausibly build a utility-scale quantum computer in a reasonable timeframe. DARPA then evaluated the Microsoft quantum team’s architectural designs and engineering plan for a fault-tolerant quantum computer. As a result of this careful analysis, DARPA and Microsoft have executed an agreement to begin the final phase of the program. During this phase, Microsoft intends to build a fault-tolerant prototype based on topological qubits in years, not decades—a crucial acceleration step toward utility-scale quantum computing.<br>\nUnlocking quantum’s promise<br>\nEighteen months ago, we laid out our roadmap to a quantum supercomputer. Today we hit our second milestone, demonstrating the world’s first topological qubit. And we’ve already placed eight topological qubits on a chip designed to house one million.<br>\nA million-qubit quantum computer isn’t just a milestone—it’s a gateway to solving some of the world’s most difficult problems. Even today’s most powerful supercomputers cannot accurately predict the quantum processes that determine the properties of the materials essential to our future. But quantum computing at this scale could lead to innovations like self-healing materials that repair cracks in bridges, sustainable agriculture, and safer chemical discovery. What today requires billions of dollars in exhaustive experimental searches and wet-lab experiments could be found, instead, through calculation on a quantum computer.<br>\nOur path to useful quantum computing is clear. The foundational technology is proven, and we believe our architecture is scalable. Our new agreement with DARPA shows a commitment to relentless progress toward our goal: building a machine that can drive scientific discovery and solve problems that matter. Stay tuned for more updates on our journey.<br>\nStay informed of Microsoft’s advancements in quantum computing:<br>\n- Check out Dr. Chetan Nayak on the Microsoft Research Podcast as he explores these groundbreaking advances.<br>\n- Read our papers in Nature and on arXiv.<br>\n- Join us to become quantum ready.<br>\n- Read the Microsoft Source story about today’s news.<br>\n- Hear the Microsoft quantum team discuss these milestones:<\/p>","content_hash":"15c89a87936902d9a78c8878dc5851b8","author":"Chetan Nayak","published_at":"2025-02-19T16:00:00","fetched_at":"2026-09-23 10:43:01","word_count":1567,"read_time_minutes":8,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"82w","domain":"azure.microsoft.com"},{"id":"c87bca6f7346a09c","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2025/01/14/2025-the-year-to-become-quantum-ready/","title":"2025: The year to become Quantum-Ready","url":"https://azure.microsoft.com/en-us/blog/quantum/2025/01/14/2025-the-year-to-become-quantum-ready/","summary":"We find ourselves in an exciting and pivotal time. We are at the advent of the reliable quantum computing era. This past November, Microsoft successfully created and entangled 24 logical qubits in collaboration with Atom Computing. As our industry looks toward the next 12 months, the pace of quantum research and development is only going to accelerate, making this a critical and catalyzing time for business leaders to act. We’re seeing a growing need for business leaders to have the information ","content":"<p>We find ourselves in an exciting and pivotal time. We are at the advent of the reliable quantum computing era. This past November, Microsoft successfully created and entangled 24 logical qubits in collaboration with Atom Computing. As our industry looks toward the next 12 months, the pace of quantum research and development is only going to accelerate, making this a critical and catalyzing time for business leaders to act. We’re seeing a growing need for business leaders to have the information and tools to understand better the depth of these amazing technical breakthroughs and the business applications and value they open up. In a business decision-maker study, 12% said their organizations were prepared to assess quantum opportunities. Clearly, there is an urgent need for leaders to get more information and better understand how technical advancements in quantum will enable real-world impact.<br>\nLeaders in global companies, investment funds, and governments across the world are making multi-billion-dollar investments in quantum computing. Those organizations that are in the throes of planning a comprehensive quantum-ready strategy are creating durable, competitive differentiation for their organizations and positioning themselves to harness the full power of quantum as it scales. Clearly, without strategic readiness, it’s a challenging proposition for leaders to assess the risks and returns, or to design effective and responsible quantum strategies that are necessary to create a full-on quantum roadmap for their organization.<br>\nThis is why at Microsoft we are excited to announce our new Quantum Ready program, designed to address these exact challenges by providing business leaders with the insights and tools needed to:<br>\n- Build practical, high-impact hybrid applications.<br>\n- Invest in strategic skilling and access to reliable quantum computers for experimentation.<br>\n- Embrace quantum safety and focus on cryptographic agility.<br>\n- Prepare for scale such that your investments are future-proofed.<br>\nBecoming quantum-ready is both a business and a global imperative. In fact, the United Nations announced 2025 as the International Year of Quantum Science and Technology (IYQ), reflecting the transformative impact quantum mechanics has had in the past century, and setting the stage for the next wave of quantum innovation. As part of this global initiative, Microsoft will be a leading partner with the IYQ, along with the American Physical Society (APS), to celebrate 100 years of quantum innovation. We are so excited to partner with APS and other leading institutions to support the IYQ as it engages with communities from across the world to scale awareness of how quantum science and applications will transform industries.<br>\nQuantum Ready<br>\nQuantum Ready can help future proof your organization today for a quantum-powered tomorrow<br>\nHybrid applications: Business value and security for today and tomorrow<br>\nGiven the rapid pace of innovation, it’s critical that organizations start exploring, identifying, and building an application roadmap that sets them up for success in a quantum future. Doing so will clarify where and when quantum will provide tangible business value and guide both how and to what degree, you should invest to become quantum-ready today.<br>\nThrough our Quantum Ready program, leaders will have an opportunity to engage with Microsoft in one-on-one workshops and industry-specific forums to accelerate their strategic readiness and identify high-value use cases. We hope to bring learnings that result from these industry-specific forums to the broader ecosystem to provide practical insights in the form of custom industry outlook reports to help guide your organization’s leadership and company strategy.<br>\nAdditionally, business leaders need to start preparing for a quantum-safe future; not because there is an immediate threat but because a transition to emerging cryptographic standards will take time. Security is a top priority at Microsoft—this is why we established the Microsoft Quantum Safe Program to enable security alignment from both business and technical perspectives.<br>\nCultivating a quantum-ready culture: Skilling and vision for the hybrid era<br>\nCultivating a culture of innovation begins with robust workforce skilling and training, empowering teams with the knowledge and mindset to embrace quantum-enabled possibilities. Putting this mindset into practice requires providing access to a unified hybrid platform integrating resilient quantum computing, classical supercomputing, and AI. Especially when 76% of leaders indicate that a quantum skills crisis is causing a deceleration in innovation, the organizations that can harness the power of these complementary technologies—and who understand their use is not a matter of either or, but when and how—are in a distinct position to stay ahead.<br>\nOur Quantum Ready program will offer different skilling and training opportunities to help prepare business and government leaders with resources, frameworks, and tools they need to:<br>\n- Understand why quantum technology is positioned to help revolutionize your business operations, talent strategies, and infrastructure.<br>\n-
