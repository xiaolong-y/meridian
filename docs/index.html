 Gain an early-mover competitive edge by creating a quantum strategy that aligns the technology’s potential with your specific business and innovation goals.<br>\n- Explore deep insight and guidance into the impact quantum computing will make in your industry and what it means for your organization.<br>\nActing for success: Preparation for scale with the right partner<br>\nSo, where and how should organizations start? Navigating the many skilling, strategy, and culture considerations is not easy, and it requires the right partners: those with experience putting state-of-the-art hybrid tools into practice with real-world, impactful applications; those who carefully consider the risks quantum pose and are working to mitigate them with leading security solutions and commitments to safe use; and finally, those with an open ecosystem approach to future-proof your investments.<br>\nFrom envisioning new use cases and identifying co-innovation opportunities to receiving first access to visionary industry insights, outlook reports, skilling, workshops, and other exciting new programs to come, sign up here to join Microsoft’s Quantum Ready program. We look forward to connecting with you soon!<br>\nLearn how Microsoft can help you become quantum ready<br>\n- Join the Quantum Ready program.<br>\n- Explore the video learning modules in our Quantum Ready program.<\/p>","content_hash":"0cb778ae31331d9f5d2329c67a5aa941","author":"Mitra Azizirad","published_at":"2025-01-14T16:00:00","fetched_at":"2026-09-23 10:43:12","word_count":964,"read_time_minutes":5,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"88w","domain":"azure.microsoft.com"},{"id":"6bdde094fa0e91d3","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/11/19/microsoft-and-atom-computing-offer-a-commercial-quantum-machine-with-the-largest-number-of-entangled-logical-qubits-on-record/","title":"Microsoft and Atom Computing offer a commercial quantum machine with the largest number of entangled logical qubits on record","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/11/19/microsoft-and-atom-computing-offer-a-commercial-quantum-machine-with-the-largest-number-of-entangled-logical-qubits-on-record/","summary":"Azure Elements Purpose built to accelerate scientific discovery ↗ Microsoft and Atom Computing have made rapid progress in reliable quantum computing by creating and entangling 24 logical qubits made from neutral atoms—they have also demonstrated the ability to detect and correct errors, and perform computation, on 28 logical qubits. Together, the companies are offering a reliable quantum machine built with these state-of-the-art logical qubits and Microsoft’s qubit-virtualization system, and in","content":"<p>Azure Elements<br>\nMicrosoft and Atom Computing have made rapid progress in reliable quantum computing by creating and entangling 24 logical qubits made from neutral atoms—they have also demonstrated the ability to detect and correct errors, and perform computation, on 28 logical qubits. Together, the companies are offering a reliable quantum machine built with these state-of-the-art logical qubits and Microsoft’s qubit-virtualization system, and integrated with Azure Elements. This comprehensive package is available to order today with delivery in 2025. The results reported here showcase the advances being made toward scientific quantum advantage, which will require not only reliable quantum computation, but also integration with AI and high-performance computing.<br>\nAtom Computing’s neutral-atom qubits<br>\nIn the quantum computing industry, multiple types of physical qubits are being explored as potential pathways to hybrid quantum-classical supercomputing. But not all types of qubits allow for the quantum error correction needed to enable more reliable quantum computing. And without reliable quantum computing, valuable solutions to classically intractable problems are unlikely to be achieved. It’s essential to graduate from computing with noisy physical qubits to operating with reliable, logical ones.<br>\nOne type of qubit that opens opportunities for more reliable quantum computation, with more and better logical qubits, is based on neutral atoms. Our partner, Atom Computing, uses neutral atoms as qubits to store and process quantum information through manipulation with pulses of light. Compared to other qubit technologies, neutral atoms have several advantages including the ability to be tightly packed in arrays while being held in place by lasers, as well as the ability to be moved around so that they can interact with other atoms to enable all-to-all connectivity. Neutral atoms also have low susceptibility to noise and the high fidelities needed for quantum error correction to work. Due to their lack of charge, neutral atoms can be kept only microns (millionths of a meter) apart. Thus, atomic arrays can accommodate large numbers of neutral atoms, each of which serves as a physical qubit, in a small amount of space, offering extensive scalability.<br>\nAtom Computing recently announced that they have achieved 99.6% two-qubit gate fidelity, which represents the highest fidelity of neutral-atom qubits in a commercial system and unlocks the ability to perform meaningful error correction. Qubits with such low error rates and all-to-all connectivity are prime candidates for Microsoft’s custom qubit-virtualization system, which creates logical qubits and enables the detection and correction of errors while performing reliable quantum computation.<br>\nQuantum Insider<br>\nWebinar with Dr. Krysta Svore and Dr. Ben Bloom on the offering from Microsoft and Atom Computing<br>\nAzure Quantum compute platform<br>\nTo enable reliable quantum computing, Microsoft has developed the Azure Quantum compute platform. This compute platform combines Microsoft’s advanced qubit-virtualization system with quantum-processing units (QPUs) from our industry-leading hardware partners to create logical qubits by detecting and correcting the errors inherent in the QPU’s physical qubits, in turn enabling reliable quantum computation.<br>\nMicrosoft’s qubit-virtualization system is a core component of the Azure Quantum compute platform and builds on Microsoft’s world-class quantum error correction innovations. It offers high performance quantum error correction, custom-tailored for the underlying QPU and can be applied to a variety of QPU types. By co-designing the quantum computer with Atom Computing, we are enabling faster, more advanced, and more efficient quantum error correction as part of our qubit-virtualization system.<br>\nCreating and entangling logical qubits<br>\nTo enable complex quantum computations, qubits must meet several criteria. The physical qubits must have low enough error rates to enable error detection and correction so that they can be used to create reliable logical qubits. Those logical qubits must then be able to not only be entangled, but also to undergo many logical operations without failure to enable successful solutions to complex computations.<br>\nBy applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral-atom qubits, the teams created 24 logical qubits and entangled them in a cat state, or Greenberger-Horne-Zeilinger (GHZ) state—this represents the highest number of entangled logical qubits on record. Entanglement of the qubits is evidenced by their error rates being significantly below the 50% threshold for entanglement (Figure 1).<br>\nWhen using neutral atoms as qubits and attempting to hold them in place with lasers, some atoms can still become lost, resulting in a loss of that qubit and its quantum information. Thus, the teams took steps to not only detect errors but also to detect and correct losses of neutral-atom qubits during experiments. After creating logical qubits from neutral atoms and detecting errors and losses, the error rate in the logical qubits was 10.2%, which is 4.1 times better than the baseline physical error rate of 42% (Figure 1). When errors were detected and losses were detected and corrected, the error rate was 26.6%, which is 1.6 times better than the physical error rate (Figure 1). This is the first demonstration on record of loss correction in a commercial neutral-atom system.<br>\nTwenty-eight logical qubits, created from 112 physical qubits, were used to perform successful computations based on the Bernstein-Vazirani algorithm. Furthermore, the logical qubits were able to produce a more accurate solution than the corresponding computation based on physical qubits. The ability to compute while detecting and correcting errors is a critical component to scaling to achieve scientific quantum advantage.<br>\nFigure 1. Error rates of physical qubits (baseline) and the logical qubits created from them. The 24 logical qubits, which were entangled in a cat state, were created by applying Microsoft’s qubit-virtualization system to Atom Computing’s neutral atoms. The entanglement of the logical qubits is evidenced by the error rate being below the 50% threshold (dashed line). The error rate of the logical qubits varied depending on whether losses were only detected or were detected and corrected. In both cases, the logical qubits demonstrated a higher fidelity of entanglement than the corresponding physical qubits.<br>\nCommercial offering from Microsoft and Atom Computing<br>\nMicrosoft and Atom Computing are offering a state-of-the-art reliable quantum computer built from Atom’s neutral-atom hardware and Microsoft’s qubit-virtualization system, and that integrates with Azure Elements. This offering is a comprehensive scientific suite that combines logical qubits, cloud HPC, and advanced AI models that, together, enable exploration across multiple fields, including chemistry and materials science, while also providing opportunities for skilling and education.<br>\nAzure Elements, which is included in the offering, uses AI and cloud high-performance computing (HPC) to greatly accelerate the pace of scientific research and discovery. Capabilities of Azure Elements include Generative Chemistry, which brings the power of generative AI to chemistry research to enable the rapid discovery of molecules that are novel, synthesizable, and useful. In addition, Accelerated DFT offers substantial increases in speed over other DFT (density functional theory) codes for modeling quantum-mechanical properties. These and other user-friendly features of Azure Elements greatly increase the productivity of scientific research, especially when coupled with the quantum capabilities of the Azure Quantum compute platform.<br>\nThis suite—offered by Microsoft and Atom Computing—will enable not only exploration of quantum applications, but also the creation of new datasets by the quantum computer that may be used to train AI models for improved performance or accuracy. And while the offering targets scientific discovery, it’s also possible to explore how quantum capabilities may provide solutions to complex problems in other industries.<br>\n“We are excited to continue our collaboration with Microsoft, which has already led to significant milestones in quantum computing. By coupling our state-of-the-art neutral-atom qubits with Microsoft’s qubit-virtualization system, we are now able to offer reliable logical qubits on a commercial quantum machine. This system will enable rapid progress in multiple fields including chemistry and materials science.” — Dr. Ben Bloom, Founder and CEO of Atom Computing<br>\nLearn more about our latest achievements in quantum computing<br>\n- Register to watch the Quantum Insider webinar with Dr. Krysta Svore and Dr. Ben Bloom on the offering from Microsoft and Atom Computing.<br>\n- Read the technical paper describing how Microsoft and Atom Computing created and entangled 24 logical qubits.<br>\n- Read the technical paper on Atom Computing’s best-in-class two-qubit gate fidelity.<br>\n- Read Jason Zander’s LinkedIn article on today’s announcement.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"df1fee32ff5f9655d1de9694cdb1d912","author":"Krysta Svore","published_at":"2024-11-19T13:30:00","fetched_at":"2026-09-23 10:43:21","word_count":1343,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"96w","domain":"azure.microsoft.com"},{"id":"07071061f61a76ac","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/09/10/microsoft-and-quantinuum-create-12-logical-qubits-and-demonstrate-a-hybrid-end-to-end-chemistry-simulation/","title":"Microsoft and Quantinuum create 12 logical qubits and demonstrate a hybrid, end-to-end chemistry simulation","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/09/10/microsoft-and-quantinuum-create-12-logical-qubits-and-demonstrate-a-hybrid-end-to-end-chemistry-simulation/","summary":"Microsoft and Quantinuum applied Azure Quantum’s qubit-virtualization system to Quantinuum’s H2 trapped-ion quantum computer to create 12 highly reliable logical qubits. Additionally, the teams demonstrated the emerging capabilities of reliable quantum computing by using two logical qubits, integrated with an AI model and cloud high-performance computing (HPC), to accurately estimate the ground state energy of the active space of an important catalytic intermediate. These achievements demonstrat","content":"<p>Microsoft and Quantinuum applied Azure Quantum’s qubit-virtualization system to Quantinuum’s H2 trapped-ion quantum computer to create 12 highly reliable logical qubits. Additionally, the teams demonstrated the emerging capabilities of reliable quantum computing by using two logical qubits, integrated with an AI model and cloud high-performance computing (HPC), to accurately estimate the ground state energy of the active space of an important catalytic intermediate. These achievements demonstrate continued progress toward scientific quantum advantage, a milestone that will be reached when a hybrid quantum-classical supercomputer can solve scientific problems too complex for classical computers alone.<br>\nMicrosoft Quantum Innovation Series<br>\nHow can quantum and AI unlock a new generation of hybrid applications for science?<br>\nTripling the number of highly reliable logical qubits<br>\nEarlier this year, Microsoft and Quantinuum created the most reliable logical qubits on record by applying Microsoft’s qubit-virtualization system to Quantinuum’s H-Series ion-trap qubits. At the time of that announcement, the teams had created four logical qubits from 30 physical qubits on Quantinuum’s H2 machine, with a logical error rate 800 times better than the physical error rate.<br>\nBy expanding Microsoft’s error-correction algorithms and optimizing them for Quantinuum’s H2 machine, which now has 56 qubits with 99.8% two-qubit fidelity, the teams have created 12 highly reliable logical qubits. Previously, Microsoft and Quantinuum entangled two logical qubits in a Bell state preparation, whereas in this study, all 12 logical qubits were entangled in a more complex arrangement known as a cat state, or Greenberger-Horne-Zeilinger (GHZ) state. When these logical qubits were entangled, they exhibited a circuit error rate of 0.0011, which is 22 times better than the corresponding physical qubits’ circuit error rate of 0.024.<br>\nMicrosoft and Quantinuum demonstrated several fault-tolerant computations with the improved logical qubits. On eight logical qubits, the teams successfully conducted five rounds of repeated error correction. Furthermore, the eight logical qubits were used to perform a fault-tolerant computation during error correction, successfully demonstrating the combination of logical entangling operations with multiple rounds of quantum error correction. The eight logical qubits exhibited a circuit error rate of 0.002, which is 11 times better than the corresponding physical qubits’ circuit error rate of 0.023. To our knowledge, this is the first demonstration of computation and error correction being beneficially combined, and it showcases the ability of these logical qubits to perform increasingly deeper quantum computations reliably, paving the way to fault-tolerant quantum computing.<br>\nUsing logical qubits, cloud HPC, and AI to solve problems in chemistry<br>\nTo demonstrate the emerging usefulness of quantum computing in chemistry applications, an end-to-end hybrid workflow was used to solve a real problem in chemistry, bringing together computation across cloud HPC, reliable quantum computing, and AI. In the quantum computation, two logical qubits—created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 machine—were used to prepare the ground state of the active space of an important catalytic intermediate (Figure 1) and then measured. The measurement outputs were then integrated with AI to estimate the ground state energy of the active space. This is the first time that HPC, AI, and quantum-computing hardware have been applied in concert to solve a scientific problem.<br>\nAs a first step, the team at Microsoft used AutoCAS and AutoRXN in Azure Quantum Elements to conduct HPC simulations that identified the active space of the catalyst and the catalyst’s reaction pathways, respectively. The team then optimized error-detection codes for use within a customized quantum algorithm on two logical qubits to simulate the quantum behavior of the active space. The logical qubits were then measured to generate classical data using a method known as classical shadows, which uses the measurement outcomes as classical data to train an AI model on the quantum properties of the molecule. This “shadow data” was then used in combination with the AI model to determine chemical properties of the catalyst and estimate the ground state energy of the active space within chemical accuracy (Figure 2). For comparison, the same calculation was performed with physical qubits.<br>\nThe ground state energy of the catalyst’s active space was calculated classically to gauge the accuracy of the hybrid quantum and AI-based result. Using qubits to solve this problem does not demonstrate scientific quantum advantage because the answer can be derived with classical computers. However, some complicated chemistry problems are unlikely to be solved classically with high accuracy, which provides an opportunity for quantum computers to outperform classical computation.<br>\nThe proof-of-concept case study described here is notable for several reasons. To our knowledge, this is the first demonstration of an end-to-end workflow that employs quantum computing, HPC, and AI to simulate and solve a chemistry problem. Furthermore, the quantum-mechanical problem was solved with a high degree of accuracy. These logical qubits produced a better estimate of the ground state energy than the comparable computation with the underlying physical qubits, demonstrating the higher reliability of these logical qubits.<br>\nThis demonstration provides evidence of the emerging usefulness of quantum-classical hybrid computing in chemistry, and it offers an example of how HPC, AI, and logical qubits can be used collectively to solve scientific problems. The logical qubits created with Microsoft’s qubit-virtualization system are being integrated into Azure Quantum Elements, our cloud platform designed to accelerate scientific discoveries. To increase our offerings further, we’re excited to announce that Quantinuum’s InQuantoTM computational-chemistry software package has been integrated into Azure Quantum Elements. InQuanto’sTM pioneering quantum-chemistry algorithms and methods expand Azure Quantum Elements’ tool kit and are available today through private preview.<br>\nMicrosoft’s qubit-virtualization system extends to all types of qubits<br>\nMultiple types of qubit architectures are being explored as potential pathways toward a quantum-computing future. The logical qubits described above were created on Quantinuum’s ion-trap qubit hardware. The team at Microsoft is also applying the Azure Quantum compute platform to the neutral-atom qubits in Atom Computing’s second-generation systems, designed to have over 1,200 physical qubits. Together, Microsoft and Atom Computing have created logical qubits and are optimizing their systems to enable reliable quantum computation. The team at Microsoft also plans to apply their qubit-virtualization system to the topological qubits that are still in development.<br>\nAs advances are made to both quantum hardware and software, qubits will continue to increase in number and fidelity, enabling deeper and more complex quantum computations with logical qubits. When approximately 100 logical qubits are available, scientific quantum advantage—which is expected to help solve some of the world’s most pressing challenges—will likely be achievable.<br>\nMaking logical qubits available through a new hybrid-computing offering<br>\nAt Microsoft, we’re ushering in a new era of reliable quantum computing by offering the Azure Quantum compute platform that brings together Microsoft’s qubit-virtualization system with industry-leading quantum processing units (QPUs) from hardware partners to create reliable logical qubits. Computation with those logical qubits is then integrated with cloud HPC and AI models. Additionally, in collaboration with Atom Computing, we have a commercial offering of a reliable quantum machine.<br>\nBy providing access to reliable logical qubits, accelerated HPC simulations, Copilot for Azure Quantum, and advanced AI models, Azure Quantum brings the powers of quantum computing, classical computing, and AI together. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about Microsoft’s advances in quantum computing<br>\n- Read about Microsoft’s hybrid-computing offering and our collaboration with Atom Computing in the Official Microsoft Blog.<br>\n- Register for the upcoming Microsoft Quantum Innovator Series on how quantum and AI can unlock a new generation of hybrid applications for science.<br>\n- Read the technical papers on today’s logical qubit announcement and the chemistry simulation performed with logical qubits from Microsoft and Quantinuum.<br>\n- Get the latest news and announcements from Azure Quantum.<\/p>","content_hash":"c4c6ab72eaad17f4a0e8833008e9a220","author":"Krysta Svore","published_at":"2024-09-10T13:00:00","fetched_at":"2026-09-23 10:43:30","word_count":1289,"read_time_minutes":7,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"106w","domain":"azure.microsoft.com"},{"id":"56f111ee2310cfc0","feed_id":"microsoft-quantum","guid":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","title":"Introducing two powerful new capabilities in Azure Quantum Elements: Generative Chemistry and Accelerated DFT","url":"https://azure.microsoft.com/en-us/blog/quantum/2024/06/18/introducing-two-powerful-new-capabilities-in-azure-quantum-elements-generative-chemistry-and-accelerated-dft/","summary":"Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.&nbsp; Microsoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivi","content":"<p>Azure Quantum Elements is making research in chemistry and materials science faster, easier, and more productive by integrating new tools based on generative AI and high-performance computing.<br>\nMicrosoft’s mission is to empower every person and every organization on the planet to achieve more. Azure Quantum Elements contributes to this mission by offering scientific capabilities based on AI and cloud high-performance computing (HPC). These user-friendly tools greatly increase the productivity of scientific research and remove barriers on the path to scientific discovery by substantially reducing the effort and expertise needed to perform what were previously daunting tasks. Specifically, these capabilities use Copilot for Azure Quantum, a natural-language interface that can be used by experts and non-experts alike, making Azure Quantum Elements accessible to more people and increasing the speed at which complex scientific problems can be solved.<br>\nUnlocking solutions to our most pressing challenges will require the world’s collective genius, and we’re excited to put new capabilities into the hands of scientists, students, and organizations such as Unilever so that everyone can contribute to making scientific discoveries that change the world for the better.<br>\nSince its launch, Azure Quantum Elements has served an important role in helping scientists achieve breakthroughs that have paved the way for more sustainable batteries and innovations in the pharmaceutical industry. Today, we’re announcing two new purpose-built capabilities in Azure Quantum Elements that will further increase the productivity and accessibility of chemistry and materials science research—Generative Chemistry and Accelerated DFT.<br>\nGenerative Chemistry helps scientists discover novel, synthesizable, and useful molecules quickly<br>\nThere are hundreds of millions of known molecular compounds and substances and many more remain to be discovered. In the field of chemistry, a major challenge is narrowing down an enormous number of candidate molecules to find the few that are best suited for a particular application. This challenge results in the streetlight effect, which is when the vast number of possibilities is reduced to a reasonable size, not based on the properties of the compounds, but by focusing only on those that have been studied previously. Relying on databases to identify suitable compounds limits the search space so that only known compounds are revealed as candidates for specific applications. Generative AI helps bring to light a much larger portion of the estimated 1060 possible combinations of atoms so that scientists are presented with novel candidates that are likely to serve the intended purpose.<br>\nToday, the Azure Quantum team at Microsoft is announcing Generative Chemistry—an upcoming capability that has the potential to greatly simplify this process and help scientists quickly discover and design new compounds with desired properties, thus increasing the productivity of product innovation.<br>\nGenerative Chemistry, which will be available through Azure Quantum Elements private preview, is an end-to-end workflow that involves multiple steps:<br>\n- You provide information on desired molecular characteristics for your specific application. Additionally, you can supply reference molecules if you already have some possibilities in mind.<br>\n- The information you provide is used to generate seed molecules from a dataset—those seed molecules are then used to initiate the guided AI generation of candidate molecules for your application. This is accomplished by applying multiple AI models and a unique methodology to identify new compounds that match your criteria. In this step, you have several options for configuration such as selecting the most relevant generative AI model, specifying the number of molecules to be generated, indicating the key molecular properties of interest, and screening compounds for toxicity.<br>\n- AI-based screening models predict properties of the candidate molecules that are important for real-world applications—such as boiling point, density, or solubility. A feedback loop sends this information back to the guided AI generation (step 2) to modify the selection of candidate molecules. In this step, you also have the option to fine tune the AI models for your specific application.<br>\n- The pool of potential candidates is further narrowed through a step that uses AI-guided synthesis planning to determine the feasibility of making the molecules in a laboratory—this is important because some novel molecules with desired properties may be difficult to synthesize. In this step, synthesis pathways are predicted, and candidate molecules are filtered based on how easy they are to make.<br>\n- Highly accurate HPC simulations are performed on the top candidates. Accelerated DFT can be used to screen candidates for electronic properties such as dielectric constant, ionization potential, and polarizability. AutoRXN predicts chemical stability or reactivity, and it can also be used to provide insights on possible synthesis pathways.<br>\n- You are presented with the final candidate molecules from which you can select the most promising for laboratory synthesis and testing.<br>\nThis entire process takes only days, shaving months or even years off trial-and-error laboratory experiments that were previously required to arrive at this point. Generative Chemistry suggests entirely new compounds and gives scientists the freedom to focus on only those molecules that are fit for the desired purpose—saving time, money, and effort. This new capability will allow for rapid progress in the development of novel therapeutics, sustainable materials, and more.<br>\nGenerative Chemistry<br>\nWebinar with American Chemical Society<br>\nAccelerated DFT offers substantial increases in speed compared to other density functional theory codes<br>\nDensity functional theory (DFT) is one of the most popular methods in computational chemistry due to its efficiency and accuracy in modeling quantum-mechanical properties. It allows researchers to simulate and study the electronic structures of atoms, molecules, and nanoparticles as well as surfaces and interfaces, thus predicting properties such as dielectric constant, ionization potential, and polarizability. Scientists can then tailor those properties to optimize them for specific applications.<br>\nAlthough DFT is highly valuable for research and product design, most DFT codes need to be run directly by the user in HPC clusters, which can be a difficult undertaking. Additionally, DFT—when run on traditional HPC hardware—requires substantial compute power and becomes constrained as the molecules being studied or designed increase in complexity and size.<br>\nTo simplify and improve this process, Azure Quantum and Microsoft Research designed and launched Accelerated DFT, a code used to simulate the electronic structure of molecules. Accelerated DFT can determine the properties of molecules with thousands of atoms in a matter of hours. It performs substantially faster than other DFT codes and offers a 20-fold average increase in speed compared to PySCF, a widely used open-source DFT code.1<br>\nThe setup of Accelerated DFT is made simple by providing the software as a service, requiring no code compilation or configuration on the user’s part, and it has a simplified API to streamline the computational process. Furthermore, a Python Software Development Kit (SDK) offers seamless integration into a wide variety of computational chemistry environments, which allows researchers to incorporate DFT calculations into complex chemistry workloads. Accelerated DFT is now available in Azure Quantum Elements private preview; it will also become part of Generative Chemistry.<br>\nAccelerated DFT can substantially expedite research across a wide spectrum of chemical disciplines by employing the power of Azure’s cloud architecture. Accelerated DFT can also produce large and highly accurate datasets of molecular properties that can be used to improve AI models, which require large amounts of training data. By rapidly generating training data, new molecules can be discovered faster, and known molecules can be improved, leading to innovations in therapeutics, sustainable products, and more.<br>\n“We have been very impressed by Accelerated DFT for simulating large systems with range-separated hybrid density functionals, where it speeds up the calculations considerably. Furthermore, the team at Microsoft has been very accommodating in quickly resolving technical challenges for our calculations of an active site of an enzyme.”—Tejs Vegge, Professor, Head of Section for Autonomous Materials Discovery, DTU Energy, Technical University of Denmark.<br>\n“Accelerated DFT has an easy-to-use Python interface, and the acceleration in calculations allows for the efficient use of novel hybrid functionals and a large basis set. Estimating key thermodynamic properties can thus be done in a matter of hours.<br>\nAspenTech is excited to be partnering with Microsoft to evaluate the application of quantum chemistry in our physical properties system for process modeling, especially in our sustainability pathways solutions. We anticipate that working with Accelerated DFT will result in strong use cases for characterizing new molecules and materials that are crucial to decarbonizing and circularizing industrial and consumer materials.”—Heiko Claussen, Senior Vice President, Artificial Intelligence Technology at AspenTech.<br>\nAzure Quantum Elements incorporates quantum computing<br>\nWith the addition of each new feature, Azure Quantum Elements becomes a more effective tool for scientists by harnessing AI, HPC, and emerging hybrid-computing capabilities that bring the power of quantum computing to scientific challenges. Recently, we simulated a chemical catalyst by combining classical supercomputers, AI, and logical qubits created with Microsoft’s qubit-virtualization system and Quantinuum’s H1 hardware. In the coming months, we will introduce advanced logical qubit capabilities from Microsoft and Quantinuum to the private preview of Azure Quantum Elements. This classical-quantum hybrid computing offering follows our quantum computing milestone with Quantinuum in which we created the most reliable logical qubits on record with an error rate 800 times better than that of the corresponding physical qubits.<br>\nAdvances in AI and quantum computing have the potential to help researchers solve global scientific challenges. In the future, we plan to offer a quantum supercomputer that can simulate interactions of molecules and atoms at the quantum level, which is beyond the reach of classical computers. This capability is expected to transform research and innovation across many industries. To advance the safe use of these technologies, we will ensure that they are developed and deployed responsibly. We will continue to adopt thoughtful safeguards, building on our commitments to responsible AI and embracing responsible computing practices as these capabilities grow.<br>\nLearn more about how Azure Quantum Elements is revolutionizing chemistry and materials science<br>\n- Read about our collaboration with Unilever in the Official Microsoft Blog.<br>\n- Explore the product overview of Azure Quantum Elements.<br>\n1 Details on the performance of the private preview of Accelerated DFT can be found in the preprint of Acceleration without Disruption: DFT Software as a Service.<\/p>","content_hash":"a6fbb1579c24d7c640e136044b531c4d","author":"Dr. Nathan Baker","published_at":"2024-06-18T15:00:00","fetched_at":"2026-09-23 10:43:40","word_count":1663,"read_time_minutes":9,"feed_title":"Microsoft Quantum Blog","category":"quantum","tier":"curated","site_url":"https://cloudblogs.microsoft.com/quantum","time_ago":"118w","domain":"azure.microsoft.com"},{"id":"70cb23508ea7f281","feed_id":"qiskit-blog","guid":"https://medium.com/p/0e7fa442c00c","title":"The Qiskit blog is moving!","url":"https://medium.com/qiskit/the-qiskit-blog-is-moving-0e7fa442c00c?source=rss----85f9df9eaa17---4","summary":"That’s right, folks—we’re saying goodbye to our longtime home here on Medium.com. Check our new space at ibm.com/quantum/blog for all future Qiskit blogs.The Qiskit team has spent over seven years building a wonderful community here on the Medium platform. In that time, we’ve used this space to share not only the latest news and updates about Qiskit itself, but also to publish a collection of fascinating stories written by Qiskit users exploring the wide world of quantum software development and","content":null,"content_hash":"ea17a56ceeb515ab3a969d319e3e4f1a","author":"Qiskit","published_at":"2024-01-25T15:24:02","fetched_at":"2026-09-23 10:41:54","word_count":80,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"138w","domain":"medium.com"},{"id":"5a3dfc7e049f187e","feed_id":"qiskit-blog","guid":"https://medium.com/p/a8d59c3533a4","title":"Coming soon: Qiskit 1.0!","url":"https://medium.com/qiskit/coming-soon-qiskit-1-0-a8d59c3533a4?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Jake Lishman, Luciano Bello, Matthew Treinish &amp; Blake JohnsonQiskit 1.0 will be released in February 2024 🎉This is a huge milestone, the culmination of six years of open-source efforts, all made possible by the continued enthusiasm of thousands of users and the ongoing support of hundreds of contributors.In this article you’ll find the following:What this upcoming major version means for usersHow to test out 1.0 functionality before the stable releaseHow to upgrade to Qiski","content":null,"content_hash":"e1dc89a2606f6ea93ba090fdfbd2b668","author":"Qiskit","published_at":"2023-12-20T16:34:16","fetched_at":"2026-09-23 10:41:54","word_count":77,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"143w","domain":"medium.com"},{"id":"2c9cd317131160fe","feed_id":"qiskit-blog","guid":"https://medium.com/p/cb22cdf8c9a7","title":"A Christmas Closed-Timelike-Curve: Could the story of Scrooge actually happen in a quantum universe?","url":"https://medium.com/qiskit/a-christmas-closed-timelike-curve-could-the-story-of-scrooge-actually-happen-in-a-quantum-universe-cb22cdf8c9a7?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordTraveling backwards and forwards in time is a common trope that appears often in science fiction. However, as we enter the holiday season, I find myself contemplating a famous time travel story rooted in a very different genre — specifically, a piece of Victorian era morality literature by Charles Dickens. And as usual, I’m doing it from the perspective of quantum mechanics.https://medium.com/media/aa3a8cae883b340d821f54bfe8573059/hrefHav","content":null,"content_hash":"da275350588fe2807f10db81d612f041","author":"Qiskit","published_at":"2023-12-13T18:05:12","fetched_at":"2026-09-23 10:41:54","word_count":71,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"144w","domain":"medium.com"},{"id":"e430312bb851d498","feed_id":"qiskit-blog","guid":"https://medium.com/p/5baff541e826","title":"A new chapter for Qiskit algorithms and applications","url":"https://medium.com/qiskit/a-new-chapter-for-qiskit-algorithms-and-applications-5baff541e826?source=rss----85f9df9eaa17---4","summary":"In recent months, the Qiskit Ecosystem has undergone a series of changes, additions, migrations, and upgrades all driven by a common goal: to provide the community with a greater role in the development of algorithms and applications. To align with this goal, we have moved the applications repositories, relocated the algorithms in Qiskit into their own repository, and welcomed external partners as additional maintainers to the repositories. This blog post delves into the hows and whys of these c","content":null,"content_hash":"eeaf28244eb2af74fab71efe264c0a9d","author":"Qiskit","published_at":"2023-11-27T13:01:49","fetched_at":"2026-09-23 10:41:54","word_count":79,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"147w","domain":"medium.com"},{"id":"06e08f724bb318f8","feed_id":"qiskit-blog","guid":"https://medium.com/p/f443698bbb98","title":"Quantum Glasses, a Qiskit Ecosystem package for Bloch sphere simulations","url":"https://medium.com/qiskit/quantum-glasses-a-qiskit-ecosystem-package-for-bloch-sphere-simulations-f443698bbb98?source=rss----85f9df9eaa17---4","summary":"By Jay ShahThe Bloch sphere is one of the most popular and recognizable tools for helping new learners understand quantum computing fundamentals. Now, there’s a Qiskit Ecosystem project that helps users visualize Bloch spheres with just a few clicks on a convenient GUI-based tool.The Quantum-Glasses package is a Tkinter GUI app designed to help users visualize the effects of single-qubit quantum gates via interactive Bloch Sphere simulations. Built using Qiskit, the package is a recent addition ","content":null,"content_hash":"558841af1439f2127de131e729b144e4","author":"Qiskit","published_at":"2023-11-15T15:56:43","fetched_at":"2026-09-23 10:41:54","word_count":76,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"148w","domain":"medium.com"},{"id":"1edf7f311f4678be","feed_id":"qiskit-blog","guid":"https://medium.com/p/69e861fbfc88","title":"Qiskit v0.45 is here!","url":"https://medium.com/qiskit/qiskit-v0-45-is-here-69e861fbfc88?source=rss----85f9df9eaa17---4","summary":"By Abby Mitchell, Luciano Bello, Matthew Treinish, Jake LishmanWe’re excited to announce the release of Qiskit v0.45! Read on for a summary of the key highlights and, as always, you can find the full release notes in our documentation here. With this being the last release before Qiskit 1.0, you’ll notice a lot of changes which we’ve highlighted in the article below.https://medium.com/media/2a90b517f858bdc9e088ff5dacdb1a4e/hrefThe TL;DRThe biggest updates we’re going to cover include the followi","content":null,"content_hash":"2f2fbc977e72c89eebcd71819a58069f","author":"Qiskit","published_at":"2023-11-06T15:31:57","fetched_at":"2026-09-23 10:41:54","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"150w","domain":"medium.com"},{"id":"1c698740e3ed404c","feed_id":"qiskit-blog","guid":"https://medium.com/p/768249daf8dd","title":"Enhance variational quantum algorithms with Qiskit Pulse and Qiskit Dynamics","url":"https://medium.com/qiskit/enhance-variational-quantum-algorithms-with-qiskit-pulse-and-qiskit-dynamics-768249daf8dd?source=rss----85f9df9eaa17---4","summary":"By Zhiding Liang, Jinglei Cheng, and Hanrui WangThe world of quantum computing is always evolving. Researchers and scientists are constantly pushing the boundaries, looking for ways to improve the methods they use to harness the power of quantum mechanics. Variational quantum algorithms (VQAs), for example, have gained significant traction in recent years as useful tools for exploring optimization and quantum chemistry problems. But how can we make them even better?Traditionally, researchers app","content":null,"content_hash":"510e136070d74b86267a34e07b75b30b","author":"Qiskit","published_at":"2023-11-01T14:23:29","fetched_at":"2026-09-23 10:41:54","word_count":72,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"150w","domain":"medium.com"},{"id":"ca848ed189237007","feed_id":"qiskit-blog","guid":"https://medium.com/p/6e9adf7a09e0","title":"Schrödinger’s cat meets Qiskit: Why do we never see cats that are both dead and alive?","url":"https://medium.com/qiskit/schr%C3%B6dingers-cat-meets-qiskit-why-do-we-never-see-cats-that-are-both-dead-and-alive-6e9adf7a09e0?source=rss----85f9df9eaa17---4","summary":"By Maria Violaris, PhD student at the University of OxfordCan a cat be dead and alive at the same time? In 1935, quantum physicist Erwin Schrödinger came up with a thought experiment showing that, according to quantum mechanics, a cat can exist in a superposition of being alive and dead. Schrödinger’s aim was to demonstrate the absurdity of quantum mechanics. In everyday life, we never see cats that are simultaneously alive and dead — indeed, we never see any large object in a state of quantum s","content":null,"content_hash":"83b935e606108eb41b1d15e04b67954c","author":"Qiskit","published_at":"2023-10-25T14:26:01","fetched_at":"2026-09-23 10:41:54","word_count":87,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"151w","domain":"medium.com"},{"id":"2824c77ba62ee873","feed_id":"qiskit-blog","guid":"https://medium.com/p/7f4e346b19ab","title":"Important changes to Qiskit documentation and learning resources","url":"https://medium.com/qiskit/important-changes-to-qiskit-documentation-and-learning-resources-7f4e346b19ab?source=rss----85f9df9eaa17---4","summary":"Today, we’re announcing important changes to Qiskit.org that you should be aware of. Starting on November 29, 2023, Qiskit Documentation and Qiskit educational resources will live on IBM Quantum Platform and will be removed from Qiskit.org. We will be slowly moving content over until then.Qiskit is, first and foremost, an open source programming language and technology for programming quantum computers. We remain committed to our open source community, and value the contributions they have made ","content":null,"content_hash":"97af5b2f9b800e1d650531dd6c8198dc","author":"Qiskit","published_at":"2023-10-18T14:03:38","fetched_at":"2026-09-23 10:41:54","word_count":75,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"152w","domain":"medium.com"},{"id":"b97ccd4560535286","feed_id":"qiskit-blog","guid":"https://medium.com/p/36ee0f189956","title":"A guide to the Qiskit circuit library","url":"https://medium.com/qiskit/a-guide-to-the-qiskit-circuit-library-36ee0f189956?source=rss----85f9df9eaa17---4","summary":"By Robert Davis, Julien Gacon, Abby Mitchell, and Luciano BelloWhen it comes to quantum circuits, sometimes the “do it yourself” approach is best. Even for common subroutines like the quantum Fourier transform (QFT), a user may find that it’s better to build their circuit by hand, so they can implement it in a way that works for their specific use case. But in many cases, the circuits we need are well-studied, and we can avoid having to reinvent the wheel (potentially creating bugs in the proces","content":null,"content_hash":"2cef328a268fc1d03f9923d456f6a50b","author":"Qiskit","published_at":"2023-10-04T13:48:39","fetched_at":"2026-09-23 10:41:54","word_count":86,"read_time_minutes":1,"feed_title":"Qiskit Blog","category":"quantum","tier":"curated","site_url":"https://medium.com/qiskit","time_ago":"154w","domain":"medium.com"}],"rss_by_category":{"quantum":[{"id":"4cf19ae70ff5838c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46779","title":"IonQ Partners with SDT to Deploy Superion 256 Quantum System and Establish SiV Quantum Memory Assembly Hub in South Korea","url":"https://quantumcomputingreport.com/ionq-partners-with-sdt-to-deploy-superion-256-quantum-system-and-establish-siv-quantum-memory-assembly-hub-in-south-korea/","summary":"IonQ partners with SDT to deploy a Superion 256 quantum system and establish a SiV quantum memory assembly hub in South Korea, expanding their collaboration from software to hardware. This agreement strengthens IonQ's presence in the Asia-Pacific region, supporting biomedical and pharmaceutical research through hybrid quantum infrastructure. The post IonQ Partners with SDT to Deploy Superion 256 Quantum System and Establish SiV Quantum Memory Assembly Hub in South Korea appeared first on Quantum","content":null,"content_hash":"da08bf5b4faedec6872d3f4fcc086726","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T06:17:34","fetched_at":"2026-09-23 10:41:53","word_count":73,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"4h","domain":"quantumcomputingreport.com"},{"id":"eee568e15d90d1e5","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46771","title":"QuEra Computing Joins Maryland’s Capital of Quantum Initiative and Opens Facility in Discovery District","url":"https://quantumcomputingreport.com/quera-computing-joins-marylands-capital-of-quantum-initiative-and-opens-facility-in-discovery-district/","summary":"QuEra Computing has opened an office in Maryland's Discovery District, joining the Capital of Quantum initiative. This expansion includes a partnership with UMD's QLab, providing cloud access to QuEra's 256-qubit Aquila neutral-atom quantum computer. The post QuEra Computing Joins Maryland’s Capital of Quantum Initiative and Opens Facility in Discovery District appeared first on Quantum Computing Report.","content":"<p>Boston-based neutral-atom quantum developer QuEra Computing has expanded its physical hardware footprint by establishing an office in the Discovery District Maryland (DDM). The expansion integrates QuEra into Maryland’s statewide Capital of Quantum (COQ) initiative—a regional technology cluster anchored by the University of Maryland (UMD) designed to coordinate over $500 million in public, federal, and private quantum investments.<br>\nLocated in DDM’s Discovery Center alongside existing facilities for Microsoft, Quantum Motion, IQM, and Riverlane, the new office provides proximity to federal research entities, including NIST, NASA Goddard, and the U.S. Army Research Laboratory. Concurrently, QuEra expanded its partnership with UMD’s National Quantum Laboratory (QLab), granting university researchers, educators, and regional startups cloud access to its 256-qubit Aquila neutral-atom processing platform to accelerate algorithm development, hardware benchmarking, and quantum workforce training.<br>\n| [ QuEra Computing Maryland Ecosystem Integration ] |  |  | <br>\n|---|---|---|<br>\n| Ecosystem Layer | Hardware & Regional Infrastructure | Strategic & Technical Scope | <br>\n| Discovery District Footprint | • Discovery Center Facility (College Park, MD) • Proximity to NIST, NASA Goddard, ARL | • Physical expansion within Capital of Quantum • Direct access to UMD engineering talent | <br>\n| UMD QLab Access | • QuEra Aquila Neutral-Atom QPU • 256-Qubit Analog/Digital Reconfigurable Array | • Hands-on algorithm and application testing • Neutral-atom workforce education & R&D | <br>\nQuEra’s neutral-atom platform introduces a distinct hardware modality to the Capital of Quantum ecosystem, which already hosts trapped-ion, silicon CMOS, and superconducting quantum architectures. Neutral-atom systems utilize room-temperature vacuum chambers, optical tweezers, and dynamic laser-driven qubit repositioning to execute algorithm-specific connectivity maps without fixed physical wiring or dilution refrigeration.<br>\nReview the corporate announcement via QuEra Press Room here, and explore our prior coverage of Microsoft’s Quantum Research Center and Hardware Makerspace Opening in Maryland here, Quantum Motion’s Hardware Base in the Discovery District here, IQM’s U.S. Quantum Technology Center in Maryland here, and Riverlane’s U.S. Headquarters Expansion in College Park here.<br>\nSeptember 22, 2026<\/p>","content_hash":"8944c538dc32c8ce64ad163276a2bab8","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T04:56:57","fetched_at":"2026-09-23 10:41:53","word_count":326,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"5h","domain":"quantumcomputingreport.com"},{"id":"a734276785214a5f","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46765","title":"QuEra Computing and HPE Partner to Integrate Fault-Tolerant Neutral-Atom QPUs with On-Premises HPE Cray Supercomputers","url":"https://quantumcomputingreport.com/quera-computing-and-hpe-partner-to-integrate-fault-tolerant-neutral-atom-qpus-with-on-premises-hpe-cray-supercomputers/","summary":"QuEra Computing and HPE are partnering to integrate QuEra's neutral-atom quantum processing units (QPUs) with HPE Cray supercomputers, enabling on-premises, hybrid quantum-classical supercomputing for national laboratories and enterprises. This collaboration aims to develop integrated hardware, co-design algorithms, and establish low-latency software for secure and efficient high-performance computing. The post QuEra Computing and HPE Partner to Integrate Fault-Tolerant Neutral-Atom QPUs with On","content":"<p>Neutral-atom quantum hardware developer QuEra Computing and enterprise infrastructure provider Hewlett Packard Enterprise (HPE) have entered into a strategic collaboration to integrate fault-tolerant quantum processing units (QPUs) with on-premises high-performance computing (HPC) environments powered by the HPE Cray supercomputing platform. The partnership establishes an engineering framework for national laboratories, HPC centers, and enterprise data centers to deploy tightly coupled, hybrid quantum-classical supercomputers.<br>\nThe joint technical effort focuses on developing integrated hardware testbeds, co-designing hybrid algorithms, establishing low-latency software interoperability, and benchmarking system-level performance when pairing QuEra’s neutral-atom architecture directly with HPE Cray system interconnects. Deploying fault-tolerant QPUs on-premises addresses strict sovereign data residency and latency requirements, allowing high-density classical HPC clusters to offload specific compute-bound subproblems to neutral-atom hardware. The initiative aligns with U.S. national scientific programs, including the U.S. Department of Energy’s Genesis Mission.<br>\n| [ QuEra & HPE Hybrid HPC Deployment Model ] |  |  | <br>\n|---|---|---|<br>\n| Deployment Path | Hardware Platform & Integration | Operational Use Case & Capacity | <br>\n| On-Premises HPC Deployment | • HPE Cray Supercomputing Platform • Tightly Coupled On-Site Integration • Planned Scaling to Gigaquop Systems | • Sovereign & High-Security Data Workloads • Real-Time Hybrid Co-Processing • Direct Low-Latency Interconnects | <br>\n| Cloud Access Access Model | • Cloud Provider Deployment • QuEra Libra QPU (>256 Logical Qubits) • Megaquop-Class Operations (~106 Ops) | • Elastic Simulation & Burst Compute • Application R&D & Algorithm Prototyping • Interim Compute Ahead of On-Site Installs | <br>\nUnder this strategy, organizations can utilize cloud-based access to QuEra’s upcoming Libra system—a megaquop-class, 256+ logical qubit processor targeted for 2028 availability—to develop algorithms and application expertise, while transitioning production workloads to on-premises HPE Cray clusters as physical hardware is installed.<br>\nReview the corporate announcement via QuEra Press Room here and inspect HPC framework specs at HPE Labs Quantum Computing here.<br>\nSeptember 22, 2026<\/p>","content_hash":"f27f8926c61c96ea4e1ccb4bc067022d","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T04:44:17","fetched_at":"2026-09-23 10:41:53","word_count":312,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"5h","domain":"quantumcomputingreport.com"},{"id":"3711c5bf64e5119b","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46759","title":"Babcock and Arqit Demonstrate Quantum-Safe Tactical Communications at DVD 2026","url":"https://quantumcomputingreport.com/babcock-and-arqit-demonstrate-quantum-safe-tactical-communications-at-dvd-2026/","summary":"Babcock International Group and Arqit Quantum Inc. successfully demonstrated quantum-safe tactical communications at DVD 2026, using Arqit’s NetworkSecure software to encrypt operational data across various networks. This collaboration showcases a software-defined encryption protocol for securing tactical data against post-quantum threats within existing military communication infrastructure. The post Babcock and Arqit Demonstrate Quantum-Safe Tactical Communications at DVD 2026 appeared first o","content":"<p>UK defense contractor Babcock International Group (FTSE: BAB) and quantum-safe encryption software vendor Arqit Quantum Inc. (NASDAQ: ARQQ) conducted a live tactical communications demonstration at the DVD 2026 defense exposition in Millbrook, UK. Executed under a strategic Memorandum of Understanding (MoU), the trial demonstrated software-defined, quantum-safe encryption across multi-bearer networks in contested tactical environments without relying on dedicated physical inline hardware encryptors.<br>\nDuring the demonstration, operational scenario data collected at one site was encrypted using Arqit’s NetworkSecure software platform and transmitted across IP bearers (combining 4G/5G, Wi-Fi, SATCOM, and Mobile Ad-Hoc Networks / MANETs) to Babcock’s Ground Deployed Advanced Mortar System (GDAMS). Integrated into Babcock’s Advanced Layered System Architecture, the software-defined encryption protocol secures tactical data in transit against post-quantum decryption and intercepted data exploitation while maintaining low-latency execution across core-to-edge defense networks.<br>\n| [ Babcock & Arqit DVD 2026 Tactical Demonstration Architecture ] |  |  | <br>\n|---|---|---|<br>\n| Demonstration Subsystem | Underlying Hardware & Network Bearers | Tactical Security Objective | <br>\n| Arqit NetworkSecure | • Software-Defined PQC Layer • Out-of-Band Key Generation Engine | • Elimination of Physical Inline Hardware Encryptors • Defense against Post-Quantum Interception | <br>\n| Babcock Integration | • Advanced Layered System Architecture • GDAMS Mobile Firepower Platform | • Secure Core-to-Edge Data Transfer • Multi-Bearer Operations (4G/5G, SATCOM, MANET) | <br>\nThe joint capability demonstrates software-defined cryptographic agility across crewed and uncrewed land, maritime, and air platforms, providing defense organizations with an adaptable encryption model that integrates directly into existing military communications infrastructure.<br>\nReview the official press release via Arqit Investor Relations here.<br>\nSeptember 22, 2026<\/p>","content_hash":"5b2f44689775ec52d75cf97b3f3591ac","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T04:31:58","fetched_at":"2026-09-23 10:41:53","word_count":265,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"6h","domain":"quantumcomputingreport.com"},{"id":"da92e70f9f987075","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46751","title":"Quantum XChange Partners with Carahsoft to Distribute FIPS-Validated Phio TX Platform Across Federal Agencies","url":"https://quantumcomputingreport.com/quantum-xchange-partners-with-carahsoft-to-distribute-fips-validated-phio-tx-platform-across-federal-agencies/","summary":"Quantum XChange partnered with Carahsoft to distribute its FIPS-validated Phio TX platform to federal agencies, helping them meet post-quantum migration deadlines. The platform provides a crypto-agile management overlay, allowing agencies to hot-swap post-quantum algorithms and protocols without re-architecting applications. The post Quantum XChange Partners with Carahsoft to Distribute FIPS-Validated Phio TX Platform Across Federal Agencies appeared first on Quantum Computing Report.","content":"<p>Post-quantum cybersecurity vendor Quantum XChange has entered into a strategic distribution partnership with IT aggregator Carahsoft Technology Corp. Under the agreement, Carahsoft will serve as Quantum XChange’s Master Government Aggregator, distributing the Phio TX® cryptographic management platform across U.S. federal, state, local, and education sectors through procurement contracts including TIPS, OMNIA Partners, and The Quilt.<br>\nThe distribution initiative focuses on assisting federal agencies in achieving compliance with mandated post-quantum migration timelines outlined in Executive Order 14412 and OMB Memorandum M-26-15. Designed to mitigate “Harvest Now, Decrypt Later” interception risks, the Phio TX® platform provides a crypto-agile management overlay validated under FIPS 140-3 and FIPS 203 (ML-KEM). The architecture decouples key generation and distribution from primary data channels, allowing agencies to hot-swap post-quantum algorithms (PQC), quantum key distribution (QKD) protocols, and classical symmetric keys under unified policy controls without requiring application re-architecture or hardware downtime.<br>\n| [ Quantum XChange Phio TX Federal Distribution Architecture ] |  |  | <br>\n|---|---|---|<br>\n| Platform Module | Standards & Cryptographic Protocols | Procurement & Mandate Alignment | <br>\n| Phio TX Engine | • FIPS 140-3 & FIPS 203 (ML-KEM) Validated • Out-of-band Key Generation & Delivery | • EO 14412 & OMB M-26-15 Compliance • Zero-Downtime Algorithm Hot-Swapping | <br>\n| Carahsoft Distribution | • Master Government Aggregator Channels • Reseller & Systems Integrator Network | • Contract Vehicles: TIPS (#220105) • OMNIA Partners (#R240303) & The Quilt | <br>\nBy routing key delivery out-of-band, the platform overlays existing network infrastructure to enforce quantum-safe encryption without introducing latency to inline data paths. The partnership expands Carahsoft’s public sector cybersecurity portfolio, enabling government agencies to transition from PQC readiness assessments to active deployment across enterprise communications networks.<br>\nReview the corporate announcement via Carahsoft Press Room here.<br>\nSeptember 22, 2026<\/p>","content_hash":"6d1ed9e1852570f404d2420e8ee03078","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T04:24:04","fetched_at":"2026-09-23 10:41:53","word_count":295,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"6h","domain":"quantumcomputingreport.com"},{"id":"df3e4ef25fff127c","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46740","title":"Microsoft Opens 15,000-Square-Foot Quantum Research Center and Hardware Makerspace in Maryland Discovery District","url":"https://quantumcomputingreport.com/microsoft-opens-15000-square-foot-quantum-research-center-and-hardware-makerspace-in-maryland-discovery-district/","summary":"Microsoft Quantum has opened a 15,000-square-foot Quantum Research Center in Maryland, partnering with the University of Maryland and supported by the Capital of Quantum initiative. The facility features a hardware makerspace, classified research zones, and testing infrastructure for quantum system integration and workforce training. Microsoft also unveiled its Quantum Development Kit (QDK) for analytics and published a paper on scalable logical qubits. The post Microsoft Opens 15,000-Square-Foo","content":null,"content_hash":"46145cee90e822f5d8b0fd2c6fee7c36","author":"Mohamed Abdel-Kareem","published_at":"2026-09-23T03:46:48","fetched_at":"2026-09-23 10:41:53","word_count":67,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"6h","domain":"quantumcomputingreport.com"},{"id":"e97065a1861d5e06","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=46735","title":"Interview with Matthias Troyer, Vice President & Technical Fellow at Microsoft","url":"https://quantumcomputingreport.com/interview-with-matthias-troyer-vice-president-technical-fellow-at-microsoft/","summary":"Overview In this interview, Global Quantum Intelligence's George Schwartz and Microsoft's Matthias Troyer discuss the primary pathways, economic realities, and technical bottlenecks associated with scaling quantum computing to achieve practical utility. They analyze the viability of various qubit architectures—highlighting why Microsoft favors topological and neutral atom technologies over alternatives like transmons—and evaluate target applications, concluding [...] The post Interview with Matt","content":"<p>Overview<br>\nIn this interview, Global Quantum Intelligence’s George Schwartz and Microsoft’s Matthias Troyer discuss the primary pathways, economic realities, and technical bottlenecks associated with scaling quantum computing to achieve practical utility. They analyze the viability of various qubit architectures—highlighting why Microsoft favors topological and neutral atom technologies over alternatives like transmons—and evaluate target applications, concluding that quantum chemistry offers true commercial value while big data, machine learning, and optimization face significant speed and data I/O limitations. Additionally, Troyer addresses the necessity of accelerating transitions to post-quantum cryptography, details how AI integration can help resolve critical classical embedding problems in molecular simulations, and advocates for evaluating quantum developments using holistic metrics—specifically end-to-end cost in “dollars per solution” and a four-dimensional framework for measuring logical qubit capabilities.<br>\nTranscript<br>\nGeorge Schwartz:<br>\nAt GQI, we’re tracking the quantum ecosystem, and we’re seeing all these incredible different modalities, projections, a lot of things that happen at this conference of QEC, all these different types of improvements in decoding, for example with Nvidia, what you were showing today in your talk about all the parallels between CPU and a QPU. We want to stay in pace with the industry as possible and really want to get insights and also your thoughts here about fault tolerance, utility scale, and you had really great points about when you’re working at scaling, how do you make it cost effective. To have the discussion going in that direction, I can let you comment a little bit in general and then I can have maybe some specific questions.<br>\nMatthias Troyer:<br>\nSo that’s for background for you, for understanding, or do you want to publish something based on that? Just for context for me.<br>\nGeorge Schwartz:<br>\nWe’re probably going to write up the transcript, but more just for understanding. One thing we often do is a lot of technical due diligence with a lot of different players in the industry, and we see that, for example, there’s an absence in the ecosystem of a benchmark that people are thinking about. There’s been these talks about logical qubits, Quantinuum had this fantastic talk earlier from Sandia about their new terms of quops, Preskill had their idea of quops, which is the same acronym, which is a little bit confusing. Maybe let’s go to a first question here to help guide the conversation.<br>\nWe see that you guys are obviously very bullish with Majoranas for obvious reasons, but you’ve also had some chats with some of the atom folks, neutrals and trapped ions. Can you speak to some of the current strengths of those architectures that you particularly like, and if those strengths you think will be enduring as you’re reaching towards fault tolerance and utility scale?<br>\nMatthias Troyer:<br>\nI think the strength of the topo(logical) qubit is, you heard me maybe in the talk about here, is that the control at scale will be easiest there. And that goes back then to the cost issues, right? What will it cost to do a calculation? That’s what DARPA really pushed hard first, because that was back in ’21 before the quantum benchmarking program started. That’s when DARPA asked us and said, “Look, Matthias, we have convinced ourselves that there is no commercial application for quantum computing because it will be too expensive, and there’s no technology with a clear path to scale. Seeing that, quantum is only a threat to crypto, and if that’s the case, then we should actually stop funding in quantum computing.”<br>\nGeorge Schwartz:<br>\nThat would make a lot of scientists here sad.<br>\nMatthias Troyer:<br>\nIt makes sense. If there’s no commercial application, if there’s no commercial value ever, then okay, let’s do quantum science, wonderful science experiments, but we don’t have to push it towards building a logical qubit or quantum computer. But if there is a potential for commercial value, then somebody will build it, and then the US should be first. So it was that binary. And they had said at that point that they had convinced themselves that there’s no path, no application, and no path to scale, but Microsoft keeps saying chemistry is the application. I keep saying that. They would like to understand why, because their estimates showed that it’s not. And also they don’t think that transmons will scale or spin qubits or others, but we invest in the topological qubit, and their problem is they don’t understand about it. That then started the quantum benchmarking program, where they also looked at what could the applications be. Then it came to the same point, it’s quantum simulations, chemistry, materials. They confirmed that. The question still is, as I mentioned in the talk, is it cheap enough? That’s the big challenge. The value is clear, what people would pay, thousands for a key simulation. Can you do it at that price point? And that’s where we have a clear path that with topological qubits we get there.<br>\nNow, one could also get there with others. We looked at many technologies. We have transmon qubits at Microsoft. We have spin qubits at Microsoft. We decided not to embrace them because we didn’t see that path to scale. But then we saw that there’s progress on the neutral atoms. And that progress seemed promising, and that’s why we partnered with Atom Computing, because there we think there is a great opportunity for that technology to be the first one to reach the first utility scale. Because it’s easier to scale atoms than scaling solid state, and it’s easier scaling free space optics than scaling wires. And it’s also easier because actually the clock speeds are slower. That means doing the control stack is easier, the decoding is easier, because it’s slow! This is a great place to start. Currently, over the next two years, three years, the best technology I see are the neutral atoms.<br>\nGeorge Schwartz:<br>\nThere’s a few things I wanted to unpack there. At the beginning, you mentioned, and in your talk as well, that perhaps one of the greatest values is simulating chemistry, and obviously there is the ideas in cryptography, but there’s also things in optimization and machine learning. I think it was at some point you were a bit critical of the quadratic speedup of some algorithms. With the developments in QEC and these different resource estimates from physical to logical, do you not think those can be more cost effective?<br>\nMatthias Troyer:<br>\nThey are, but you still need billions to trillions of transistor switches to do a logical gate operation. That hasn’t changed. It might have shifted it by a factor of 10 or so. But in the meantime, in the last three years, GPUs have become 10 times more powerful. And the comparison always has been against a single GPU. That was against the GPU in the paper we had from three years ago. The current GPUs are 10 times more powerful. So there’s the race, and if the cost over time for a quadratic speedup for a small problem is, what we had then is when it’s a single 16-bit floating point operation, it’s a month. When it’s 1,000 operations, which is a simple cost function, it’s centuries. If the centuries goes to decades, it still doesn’t make a difference. So the more than quadratic speedup is still there. Then if a machine costs 100 million, for that you can buy many GPUs. There’s a big enough gap that the quadratic speedup limit will remain. And the same with I/O. It is just more costly to load data into a quantum computer. It will always be, because a logical qubit will always be more complex than a transistor. If you could get a logical qubit to be as cheap as a transistor with all of the control, then it might change, right? But that’s not what was going to happen. Simply the readout processing you need to do, all of the electronics there. There’s no way that big data will ever be an application for standard methods that are linear or quadratic, simply because I/O is so much slower.<br>\nGeorge Schwartz:<br>\nOkay, right.<br>\nMatthias Troyer:<br>\nBecause the clock speeds are slower. And with optimization, there have been papers around for 25 years that show that there’s a quadratic upper bound. There’s lots of quantum-inspired progress in algorithms where quantum ideas get developed for optimization that then get dequantized into new classical ideas. There’s huge impact that quantum algorithms have in optimization to develop new classical algorithms.<br>\nGeorge Schwartz:<br>\nOn that point of quantum chemistry, we’ve seen a lot of initiatives of integrating HPC with potentially QPUs, so maybe you can touch on which aspect in the workflow do you see the QPU providing the most value in chemistry simulations? We have these classical things like DFT, DMRG that are perhaps the gold standard in terms of chemistry simulations. Where do you think the QPU is going to provide the most benefit?<br>\nMatthias Troyer:<br>\nFor that, I’d like you to look at the paper we wrote on our QDK for chemistry, where we have implemented open source the entire workflow from the science problem with Copilot all the way down to getting the structure right that we do with classical force fields first, then refine it with DFT. Then one goes through it, and looks at chemical reactions. We look at the reaction path first with ML force fields, then with DFT, then coupled cluster for refinement. And then we see where it’s not good enough, and that’s where we’ll use the quantum computer. It will basically replace DMRG, for example. It will be a more accurate, more scalable version of DMRG, or full CI. That’s where you could say is technically the niche. With that then, you could ask the question: do you need it, or could you do it with DMRG? And the paper has shown that. The Garner Channel also said, ‘Hey, I can do it.’ He believes it, he trusts it, but others will say, ‘No, I don’t believe it.’ Ultimately, that’s the wrong question to ask, because ultimately the question is: will the person in the lab believe what you do? Will it be predictive? And for that, the question is not will someone be able to do something classically, but will it get something that is predictive. When you start a project upfront, you don’t know if the configurations you run into will be classically tractable. You don’t know whether for that molecule you can trust DMRG, or whether you can trust coupled cluster. You simply don’t know it, and that’s why you always want to in the end use the quantum computer to get the confidence that the answer is right. While you can say the place is doing full CI, DMRG more scalably, that is too narrow, because the bigger question is: you can use it to make the entire computational chemistry workflow predictive. And that’s the game changer.<br>\nGeorge Schwartz:<br>\nOkay. And we kind of think that scale is going to be tera-quop devices that are going to be thousands of logical qubits with very low error rates. We see that maybe before even mega, maybe giga-quop, that’s more straightforward, but then you still potentially have some concerns of control as you say, you have all these beams for Rydberg. Do you see a path for those neutrals to get to those tera-quop scales that are going to enable this?<br>\nMatthias Troyer:<br>\nI think they will get to the scale where we can do chemistry. The question is at which price point. That’s unclear. For the small machine, neutrals are the easiest to build. The Majorana devices, small machines will be cheaper, for sure. But as you scale, there’s a crossover. They will always remain useful, because for certain things you do smaller problems, they don’t need the big machines. There’s always a use also for CPUs and not just high-end GPUs, because certain tasks don’t need GPUs. Certain tasks can use a cell phone CPU. Certain tasks just use a laptop. Some tasks need a supercomputer. Some tasks will need quantum computers; some of them will run well on neutral atoms. Some of them will need something more powerful.<br>\nGeorge Schwartz:<br>\nAs it gets very powerful, one thing that we see through the community is there needs to be some classical verification, at least to some scale. Can you speak to how Microsoft is trying to develop that ability to simulate even larger molecules, like a digital twin if you will, up to some scale? Once we get to something of tera-quop, that’s going to be impossible, and that’s one of the reasons why we do it. But can you speak to those developments?<br>\nMatthias Troyer:<br>\nFor validating the chemistry calculation, or for validating the quantum computer?<br>\nGeorge Schwartz:<br>\nValidating the chemistry calculations to some scale.<br>\nMatthias Troyer:<br>\nI think that’s the same way we validate any classical supercomputer. Do you know how we do that?<br>\nGeorge Schwartz:<br>\nI can’t speak immediately off the top of my head.<br>\nMatthias Troyer:<br>\nHow do we validate HPC systems at scale? I do a calculation, for example fluid dynamics, that nobody else can do.<br>\nGeorge Schwartz:<br>\nPotentially build up a system and actually just have the fluids running and then make the measurement, or in this case make the pharmaceutical and test it.<br>\nMatthias Troyer:<br>\nFor HPC for fluid flows and other things, I run the program on a small machine, I test it, and then when I’m testing HPC codes, I look at certain limiting cases that I can solve within reasonable boundaries, special cases that I can solve on a laptop, and then I run it distributed, massively parallel, and I want to check whether in the cases where I know the answer, I get the right answer back. I can test it by running certain problems for which I know the solution, that are exactly solvable. That way I get confidence that the algorithm has no bug in it. There’s no way you can actually test something on a new machine that nobody else has done, but we’ve lived with that for the last century as we built computers that are bigger and more powerful. We find ways to get confident that they work. If your question now is, can you check whether the quantum computer works, then you can for example use Shor’s algorithm, do a calculation where you then can check whether you found the factors. There are certain things where you can check it. The chemistry algorithm is not that, but you can run a smaller chemistry problem that you solved classically on a quantum computer to see whether you get the same answers. You can run certain limiting cases like you can run it for free electrons without interaction, that you can solve with pen and paper and compare. You can say let me use only the Co
