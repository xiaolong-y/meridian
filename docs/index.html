  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FFFCF0;
      --card: #F2F0E5;
      --text: #2D2B28;
      --dim: #6F6E69;
      --muted: #DAD8CE;
      --up: #66800B;
      --down: #AF3029;
      --accent: #205EA6;
      --spark: #8B5CF6;
      --score: #AD8301;
      --link: #24837B;
      --particle: #24837B;
    }

    html { font-size: 10px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      padding: 4px;
      min-height: 100vh;
      font-weight: 400;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 4px 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--muted);
    }

    .title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .timestamp { color: var(--dim); font-size: 9px; }

    .dashboard {
      position: relative;
    }

    .card-wrapper {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 2px;
      overflow: hidden;
      /* top, left, width set by JS layout engine */
    }

    .card-wrapper canvas {
      display: block;
      width: 100%;
    }

    .card-wrapper .links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card-wrapper .links a {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      color: transparent;
      text-decoration: none;
      display: block;
    }

    footer {
      margin-top: 8px;
      padding: 6px 4px;
      border-top: 1px solid var(--muted);
      text-align: center;
      color: var(--dim);
      font-size: 7px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .footer-links {
      margin-bottom: 6px;
    }

    .footer-links a {
      margin: 0 4px;
    }

    .ascii-footer {
      margin: 8px auto 4px;
      font-size: 8px;
      line-height: 1.1;
      color: var(--dim);
      opacity: 0.5;
      user-select: none;
      overflow: hidden;
      max-width: 400px;
    }

    .ascii-footer .particle {
      display: inline-block;
      color: var(--particle);
      opacity: 0.4;
    }

    .ascii-footer .meridian-text {
      color: var(--dim);
      letter-spacing: 1px;
    }

    @keyframes particleDrift {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.6; transform: translateY(-1px); }
    }

    .ascii-footer .p1 { animation: particleDrift 3s ease-in-out infinite; }
    .ascii-footer .p2 { animation: particleDrift 3s ease-in-out infinite 0.3s; }
    .ascii-footer .p3 { animation: particleDrift 3s ease-in-out infinite 0.6s; }
    .ascii-footer .p4 { animation: particleDrift 3s ease-in-out infinite 0.9s; }
    .ascii-footer .p5 { animation: particleDrift 3s ease-in-out infinite 1.2s; }
    .ascii-footer .p6 { animation: particleDrift 3s ease-in-out infinite 1.5s; }

    @media (prefers-reduced-motion: reduce) {
      .ascii-footer .particle {
        animation: none;
        opacity: 0.3;
      }
    }

    noscript p {
      text-align: center;
      padding: 20px;
      color: var(--dim);
      font-size: 9px;
    }
  </style>
</head>

":"Quantum Computing Report","time_ago":"13h"},{"id":"61664148f0a59118","title":"Mastercard Launches Quantum Advisory Practice with QIZ Security and Releases PQC Readiness Whitepaper","url":"read/61664148f0a59118.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"13h"},{"id":"88af74d29878ce03","title":"BMO Demonstrates Quantum Utility in Game-Theoretic Machine Learning Feature Selection on IBM Nighthawk r2","url":"read/88af74d29878ce03.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"14h"},{"id":"8cf2205e971826d1","title":"Google Quantum AI Demonstrates Measurement Contextuality Across 105 Qubits on Willow Processors","url":"read/8cf2205e971826d1.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"14h"},{"id":"f81cc800d45cfe44","title":"Your Best Quantum Error Correction Engineer Might Be a Bot","url":"read/f81cc800d45cfe44.html","score":0,"comments":0,"domain":"Quantum Computing Report","time_ago":"15h"}]}],"card_order":[{"type":"metric","index":0},{"type":"metric","index":1},{"type":"feed","id":"hn_tech"},{"type":"metric","index":2},{"type":"metric","index":3},{"type":"metric","index":4},{"type":"feed","id":"hn_ai"},{"type":"metric","index":5},{"type":"metric","index":6},{"type":"metric","index":7},{"type":"feed","id":"hn_startups"},{"type":"metric","index":8},{"type":"feed","id":"rss_quantum"}],"rss_entries":[{"id":"d3144b1af24959fe","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49016","title":"University of Amsterdam Awards €800,000 Across Four Quantum Simulation Projects for Chemistry and Materials Design","url":"https://quantumcomputingreport.com/university-of-amsterdam-awards-e800000-across-four-quantum-simulation-projects-for-chemistry-and-materials-design/","summary":"The University of Amsterdam (UvA) has launched the Q-SIM4MMD initiative, investing €800,000 across four quantum simulation projects. These projects aim to explore quantum simulation and machine learning for molecular and materials discovery, focusing on applications like molecular design, bioinformatics, and developing safer molecules. The initiative connects researchers across various disciplines and seeks to integrate quantum approaches with classical modeling. The post University of Amsterdam","content":"<p>The University of Amsterdam (UvA) Faculty of Science has launched four two-year research projects under its new Q-SIM4MMD initiative, committing €200,000 in seed funding to each team (€800,000 ($877K USD) total) to evaluate quantum simulation and quantum machine learning for molecular and materials discovery. Embedded within UvA’s Molecular and Material Design Technology Hub (MMD TechHub), the effort is supported by a newly formed Q-Sim expertise group connecting researchers across physics, chemistry, life sciences, and computer science with the QuSoft research center and Quantum Delta NL Amsterdam.<br>\nUvA Q-SIM4MMD Funded Quantum Simulation Projects (€200,000 Each Over Two Years)<br>\nProject Title<br>\nPrincipal Investigators<br>\nTechnical Focus & Application Targets<br>\nQuantum Machine Learning for Molecular and Material Design<br>\nAlberto Pérez de Alba Ortíz, Clélia de Mulatier (UvA)<br>\nQuantum-circuit kernels for Bayesian optimization modeling PFAS and nanoplastic binding to human proteins.<br>\nExploring Quantum Computing in Bioinformatics<br>\nAalt-Jan van Dijk, Anna Heintz-Buschart (UvA)<br>\nBenchmarking hybrid quantum-classical workflows against classical tools for enzyme specificity and microbiome DNA analysis.<br>\nQuantum-assisted topological molecular representations for screening large chemical databases.<br>\nTesting Quantum Simulations Against Established Methods<br>\nPhilippe Corboz, Arghavan Safavi Naini (UvA), Natalia Chepiga (Oxford)<br>\nBenchmarking quantum simulations of 2D Hubbard models and spin-chain dynamics against classical tensor networks.<br>\nLaunched in June 2024 across eight Faculty of Science institutes, the MMD TechHub will assist the four project teams in transitioning proof-of-concept algorithms toward external public-private partnerships and follow-up industrial funding. By pairing domain chemists and biologists directly with quantum algorithm developers, the initiative aims to identify specific computational bottlenecks where near-term quantum processors or quantum-inspired methods can complement established classical modeling pipelines.<br>\nRead the University of Amsterdam announcement here, and view the ecosystem update from Quantum Delta NL Amsterdam here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"cc014fae2f4aebf96de20d88684dbc22","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T01:30:11","fetched_at":"2026-11-20 14:48:21","word_count":363,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"7dfd2801cc3840dd","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49012","title":"UCLA Researchers Model Collectively Enhanced Superconducting-Qubit Interfaces for Microwave-to-Optical Transduction","url":"https://quantumcomputingreport.com/ucla-researchers-model-collectively-enhanced-superconducting-qubit-interfaces-for-microwave-to-optical-transduction/","summary":"UCLA researchers have developed a theoretical model for enhancing microwave-to-optical quantum transduction using superconducting qubits. Their proposed architecture collectively couples multiple qubits to a shared optomechanical resonator, aiming to overcome limitations in current optical interconnects. The study shows that this collective coupling can improve conversion efficiency and bandwidth, with an auxiliary transmon further boosting single-photon optical target probability. The post UCLA","content":"<p>Researchers at the University of California, Los Angeles (UCLA) have published a theoretical and numerical study evaluating how ensembles of superconducting transmon qubits coupled collectively to a shared optomechanical resonator can enhance microwave-to-optical quantum transduction. Detailed in a technical preprint, the architecture addresses weak electromechanical coupling bottlenecks in optical interconnects designed to link cryogenic superconducting processors over low-loss fiber networks.<br>\nRather than routing signals through a single intermediate microwave resonator, the proposed interface couples multiple electrically distinct superconducting qubits directly to a common mechanical normal mode via displacement-dependent electrodes, while an optical cavity reads out the mechanical vibration through radiation pressure. In weak-excitation input-output simulations across ensembles of 4, 24, and 64 qubits, collective coupling increased peak external conversion efficiency from approximately 20% to 30% and 40% while broadening conversion bandwidth, though optical pump-induced mechanical heating bounded the optimal pump strength.<br>\nOperating near half excitation in the symmetric Dicke manifold accelerates electromechanical transfer nearly linearly with ensemble size, but the authors showed that this speedup is offset by the proportional relaxation exposure of additional excited qubits, leaving single-qubit coupling and lifetime as the governing coherence requirement. To isolate single-excitation transitions, the team introduced an auxiliary transmon that induces mechanical Kerr anharmonicity, raising lossless single-photon optical target probability in a four-qubit benchmark from 19.6% to 99.7% at 100 kHz anharmonicity, while quantifying how pair-dependent qubit-qubit disorder reduces gated optical retrieval efficiency from 58.1% to 35.4%.<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"41e493f06d73597b50f89f041ccad445","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T01:19:13","fetched_at":"2026-11-20 14:48:21","word_count":309,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"64ef65cd737f2aee","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49008","title":"Researchers Introduce QECLean Framework to Formally Verify Quantum Error-Correcting Codes in Lean 4","url":"https://quantumcomputingreport.com/researchers-introduce-qeclean-framework-to-formally-verify-quantum-error-correcting-codes-in-lean-4/","summary":"Researchers have developed QECLean, an open-source framework using Lean 4 to formally verify quantum error-correcting codes, addressing the difficulty of verifying complex, algorithmically discovered codes. It has successfully verified parameters for several significant QEC codes, including an IBM 360-qubit code and infinite planar code families. QECLean aims to validate AI-discovered codes and future quantum compilers by linking different mathematical representations within Lean's type system. ","content":"<p>Researchers from the University of Wisconsin-Madison and the University of Arizona (alongside QEC Labs) have introduced QECLean, an open-source formal verification framework built on the Lean 4 proof assistant to mechanically prove the parameters of quantum error-correcting (QEC) codes. Detailed in a technical preprint following a tutorial at IEEE Quantum Week 2026, the library addresses the growing challenge of verifying complex, algorithmically discovered QEC codes whose code distances are often too large for brute-force enumeration or constraint solvers.<br>\n| Quantum Error-Correcting Codes Formally Verified in QECLean |  |  | <br>\n|---|---|---|<br>\n| Code or Infinite Code Family | Verified Parameters [[n, k, d]] | Verification Approach & Significance | <br>\n| IBM 360-Qubit Bivariate Bicycle Code | [[360, 12, 24]] | Proved exact distance 24 via double-cover combinators (previously known only as an upper bound ≤ 24). | <br>\n| IBM Gross Code (Bivariate Bicycle) | [[144, 12, 12]] | Verified as a double cover of a [[72, 12, 6]] base code using kernel-checked certificates. | <br>\n| Oratomic Mitten Code | [[150, 30, 10]] | Verified high-rate (1/5) non-abelian lifted-product code via homological chain complexes. | <br>\n| Rotated Surface Code Family | [[L2, 1, L]] (odd L ≥ 3) | First machine-checked parametric distance proof across an infinite planar code family. | <br>\n| Toric & Triangular Color Families | [[2L2, 2, L]] and [[3r(r+1)+1, 1, 2r+1]] | Parametrically verified via homological wrapping invariants and boundary maps. | <br>\nBecause computing minimum code distance is NP-hard in general, conventional integer linear programming and satisfiability solvers typically stall on codes with distances above 18 and cannot certify infinite code families. QECLean bridges this gap by linking three mathematical representations within Lean’s dependent type system: stabilizer groups, binary symplectic check matrices, and homological chain complexes, allowing researchers to specify a code once and prove each property in the most tractable representation.<br>\nTo scale verification to large quantum low-density parity-check (qLDPC) architectures, Stavan Jain, Nithin Raveendran, and Aws Albarghouthi developed compositional code combinators, including a generalized double-cover combinator that derives the distance of a 2n-qubit lifted code from an n-qubit base code. While the current release verifies algebraic code distance rather than physical circuit-level fault tolerance or noise thresholds, the framework comprises roughly 57,000 lines of Lean code and 312,000 lines of kernel-checked certificates designed to validate AI-discovered codes and future verified quantum compilers.<br>\nRead the full research paper on arXiv here, access the open-source QECLean repository on GitHub here, and view the IEEE Quantum Week 2026 tutorial materials here.<\/p>","content_hash":"c9976e0d7597f9c97412bea307147f3a","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T01:11:39","fetched_at":"2026-11-20 14:48:21","word_count":419,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"2cbaf02e30ed06cc","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49004","title":"memQ and Infleqtion Sign MoU to Validate Quantum Networking Interoperability for Distributed Neutral-Atom Systems","url":"https://quantumcomputingreport.com/memq-and-infleqtion-sign-mou-to-validate-quantum-networking-interoperability-for-distributed-neutral-atom-systems/","summary":"memQ and Infleqtion have signed an MoU to validate interoperability between memQ’s quantum network architecture and Infleqtion’s quantum computing platform. This collaboration aims to enable modular multi-processor scaling by connecting separate quantum processing units. The initiative is crucial for enterprise and high-performance computing data centers to adopt standardized QPU-to-QPU networking. The post memQ and Infleqtion Sign MoU to Validate Quantum Networking Interoperability for Distribu","content":"<p>Quantum networking company memQ and neutral-atom quantum technology provider Infleqtion (NYSE: INFQ) have signed a memorandum of understanding (MoU) to pursue interoperability validation and certification between memQ’s extensible quantum network architecture (xQNA) and Infleqtion’s Sqale quantum computing platform and Superstaq software stack. The collaboration targets modular multi-processor scaling by enabling separate quantum processing units to connect and distribute workloads without collapsing quantum states.<br>\nBecause conventional data-center interconnects cannot preserve entanglement across independent quantum nodes, optical quantum networking is required to replicate the horizontal clustering model used in classical high-performance computing (HPC). Under the agreement, the two companies will evaluate how memQ’s optical connectivity and quantum control hardware interface with Infleqtion’s neutral-atom architecture and compiler workflows to support flexible, multi-system deployment configurations.<br>\nThe announcement follows Infleqtion’s 100-qubit Sqale deployment at the U.K. National Quantum Computing Centre and its roadmap to scale toward 1,000 logical qubits by 2030. While the MoU represents an early-stage validation framework subject to technical integration milestones, both companies noted that standardized QPU-to-QPU networking will be critical for enterprise and HPC data-center adoption.<br>\nRead the announcement on the memQ website here and view the press release in the Infleqtion newsroom here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"e94c3f3031fe695da6f4bd593ec8297b","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T01:04:26","fetched_at":"2026-11-20 14:48:21","word_count":276,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"61664148f0a59118","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=49000","title":"Mastercard Launches Quantum Advisory Practice with QIZ Security and Releases PQC Readiness Whitepaper","url":"https://quantumcomputingreport.com/mastercard-launches-quantum-advisory-practice-with-qiz-security-and-releases-pqc-readiness-whitepaper/","summary":"Mastercard has launched a Quantum Advisory Practice with QIZ Security to help financial institutions transition to post-quantum cryptography, addressing immediate \"harvest now, decrypt later\" risks. This initiative, aligned with G7 and FS-ISAC guidance, offers services like cryptographic asset discovery and remediation roadmaps. Mastercard is also conducting quantum research with Oxford Quantum Circuits, focusing on financial fraud protection. The post Mastercard Launches Quantum Advisory Practi","content":"<p>Mastercard (NYSE: MA), through its Advisors and Transformation division, has launched a dedicated Quantum Advisory Practice accompanied by a whitepaper titled Quantum Computing and Financial Services outlining post-quantum cryptography (PQC) transition strategies for banks, acquirers, payment service providers, and fintechs. Positioned around a 2029–2030 planning horizon and aligned with G7 Cyber Expert Group and Financial Services Information Sharing and Analysis Center (FS-ISAC) guidance, the initiative addresses immediate “harvest now, decrypt later” (HNDL) exposure across long-lived financial and customer datasets.<br>\nTo execute the advisory offering, Mastercard is partnering with cryptography management provider QIZ Security, which joins the practice to support automated cryptographic asset discovery, data-longevity risk registers, phased remediation roadmaps, cryptographic agility guardrails, and board-level reporting frameworks. Alongside its PQC readiness services, Mastercard highlighted ongoing quantum research and development with Oxford Quantum Circuits (OQC), including a hybrid quantum-classical pilot focused on financial fraud protection.<br>\nRead Mastercard’s official press release here, view the insights overview here, and download the November 2026 whitepaper here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"692b43d488264820dfc3350668875fdc","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T00:58:59","fetched_at":"2026-11-20 14:48:21","word_count":244,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"13h","domain":"quantumcomputingreport.com"},{"id":"88af74d29878ce03","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48996","title":"BMO Demonstrates Quantum Utility in Game-Theoretic Machine Learning Feature Selection on IBM Nighthawk r2","url":"https://quantumcomputingreport.com/bmo-demonstrates-quantum-utility-in-game-theoretic-machine-learning-feature-selection-on-ibm-nighthawk-r2/","summary":"BMO Financial Group, in collaboration with DUTH and IBM, has demonstrated a quantum machine learning feature-selection workflow on IBM quantum processors. They applied quantum game theory to identify high-value predictive variables in financial datasets, achieving comparable quality to classical methods with significantly fewer algorithmic samples. This milestone builds on BMO's earlier entry into the IBM Quantum Network and the launch of their AI &#038; Quantum Institute. The post BMO Demonstra","content":"<p>BMO Financial Group, in collaboration with the Democritus University of Thrace (DUTH) and IBM, has demonstrated a quantum machine learning feature-selection workflow on IBM superconducting processors, including the IBM Quantum Nighthawk r2 system. Reviewed by IBM’s quantum research team, the experiment applies quantum game theory to identify high-value predictive variables in financial datasets for downstream client modeling, risk assessment, and personalization workloads.<br>\nRather than treating feature selection as a conventional classical statistical search, the team adapted the Proxy Quantum Games framework developed by researchers at BMO, DUTH, and IBM. Within this formulation, each candidate variable in a dataset is modeled as a player in a quantum strategic game, receiving higher payoff scores when aligned with the target outcome variable and lower scores when uninformative or redundant. According to BMO, the quantum ranking approach achieved feature-selection quality comparable to classical baselines while requiring one to two orders of magnitude fewer algorithmic samples, though specific qubit counts, circuit depths, and wall-clock runtime comparisons have not yet been published.<br>\nThe milestone builds on BMO’s February 2025 entry into the IBM Quantum Network and the launch of the BMO Institute for Applied Artificial Intelligence & Quantum, alongside ecosystem collaborations with the Chicago Quantum Exchange and Quantum Industry Canada. BMO noted that the work remains at the early demonstration stage as the bank evaluates scalable hybrid integration within governed financial workflows.<br>\nRead BMO’s announcement here, view the overview on BMO’s AI portal here, and access the underlying Proxy Quantum Games paper in Parallel Processing Lettershere.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"acdc1629c72b917fe1188980b88234a9","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T00:36:52","fetched_at":"2026-11-20 14:48:21","word_count":333,"read_time_minutes":2,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"8cf2205e971826d1","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48991","title":"Google Quantum AI Demonstrates Measurement Contextuality Across 105 Qubits on Willow Processors","url":"https://quantumcomputingreport.com/google-quantum-ai-demonstrates-measurement-contextuality-across-105-qubits-on-willow-processors/","summary":"Google Quantum AI has demonstrated quantum measurement contextuality on 72-qubit and 105-qubit Willow processors, moving contextuality testing to large two-dimensional qubit arrays. This research, published in Science, establishes a hardware benchmark for coherent control errors and has implications for fault-tolerant computing and molecular simulations. The experiments verified that quantum observables do not have predetermined values independent of compatible measurements. The post Google Quan","content":"<p>Google Quantum AI has published cover research in Science demonstrating that quantum measurement contextuality persists at many-body scale on superconducting processors and yields measurable computational separations in bounded-resource tasks. Conducted on 72-qubit and 105-qubit Willow processors, the experiments move contextuality testing from small few-particle systems to large two-dimensional qubit arrays while establishing a hardware benchmark sensitive to coherent control errors.<br>\n| Google Quantum AI Contextuality & Bounded-Resource Hardware Benchmarks |  |  |  | <br>\n|---|---|---|---|<br>\n| Experimental Protocol | Qubit Scale | Measured Quantum Performance | Classical Theoretical Limit | <br>\n| Mermin-Peres Magic Square Game | 4 qubits (2 Bell pairs) | 98.30% ± 0.01% win rate (900,000 trials) | 88.89% (8/9 rounds) | <br>\n| Kochen-Specker-Bell Inequality (χKSB) | 2 data qubits + 1 ancilla | 5.618 ± 0.005 (540 sequential QND measurements) | χ ≤ 4.0 (quantum ceiling: 6.0) | <br>\n| N-Player GHZ Parity Game | Up to 71 qubits | Exceeded classical win rate across all sizes; 45-qubit genuine entanglement | 75% at N = 3, decaying toward 50% | <br>\n| 2D Hidden Linear Function (HLF) | 9 to 105 qubits | Success probability > 0.5; effective depth ~4 to ~6 layers | Logarithmic classical circuit depth | <br>\nUnlike entanglement alone, measurement contextuality captures the principle that quantum observables do not possess predetermined values independent of which compatible measurements are performed alongside them. To verify this property without disturbing the underlying quantum register during the state-independent Kochen-Specker-Bell test, the team used a resettable ancilla qubit and calibrated virtual-Z phase rotations to execute 540 consecutive quantum nondemolition (QND) measurements per run. At larger scales, randomized breadth-first-search Greenberger-Horne-Zeilinger (GHZ) state preparation sustained contextuality up to 71 qubits, while constant-depth four-layer controlled-Z circuits solved 2D hidden linear function instances across grids up to 105 qubits.<br>\nBeyond probing the theoretical resource linked to non-Clifford magic states in fault-tolerant computing, Google researchers noted that contextuality tasks provide a sensitive hardware diagnostic for structured applications such as molecular simulations in chemistry and materials science. Because structured parity and hidden-function tests require exact multi-qubit phase agreement, they expose small coherent over-rotations that random-circuit sampling tends to average out, offering a fixed physical ceiling against which future processors can be calibrated even though the Clifford-based test circuits remain efficiently simulable classically via tools such as Stim.<br>\nRead the peer-reviewed study in Science here, view Google’s overview announcement here, and read the technical deep dive on the Google Research blog here. Readers can also access foundational theoretical papers on quantum pseudo-telepathy by Brassard, Broadbent, and Tapp here, shallow-circuit quantum advantage by Bravyi, Gosset, and König here, and contextuality in magic state distillation by Howard et al. here.<\/p>","content_hash":"9b676dec5e22f9e74ce7234691dfe566","author":"Mohamed Abdel-Kareem","published_at":"2026-11-20T00:22:47","fetched_at":"2026-11-20 14:48:22","word_count":445,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"14h","domain":"quantumcomputingreport.com"},{"id":"f81cc800d45cfe44","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48987","title":"Your Best Quantum Error Correction Engineer Might Be a Bot","url":"https://quantumcomputingreport.com/your-best-quantum-error-correction-engineer-might-be-a-bot/","summary":"A description of how AI is playing an increasingly important role in assisting engineers developing new quantum error correction codes and quantum error correction decoders. The post Your Best Quantum Error Correction Engineer Might Be a Bot appeared first on Quantum Computing Report.","content":"<p>By Doug Finke<br>\nThe rate of innovation in quantum computing is accelerating. One of the reasons for this is that quantum providers are now using AI extensively for many of the design and other activities they used to do manually.<br>\nAt GQI, we categorize the interplay of AI and Quantum into three broad categories:<br>\n- AI for Quantum<br>\n- Quantum for AI<br>\n- Quantum + AI Hybrid Algorithms<br>\nAlthough “Quantum for AI” and the “Quantum + AI” may be a little further out due to their requirements for more powerful quantum computers which aren’t quite available yet, the AI for Quantum is here in spades today.<br>\nOne area that I would like to highlight in this article is the use of AI to help develop improved Quantum Error Correction (QEC) codes as well as new decoder algorithms that measure the ancilla qubits and figure out what errors have occurred and how to correct the errors. As we’ve discussed many times, one of the keys for achieving commercial quantum advantage is to utilize quantum error correction to make the calculations more accurate and reliable, and error-free.<br>\nOver the years, QEC codes have evolved from relatively simple codes such as the surface code or color code to very complex qLDPC (Quantum Low Density Parity Check) codes. In addition, research on QEC codes was performed with previous systems only contained a few dozen or perhaps a few hundred qubits. But soon, QEC codes will be required for systems that will contain thousands of qubits. The increase size greatly increases the complexity of the design.<br>\nIn the meantime, the requirements placed upon an engineer designing a QEC code keep getting more stringent and sometimes conflicting. At the same time, the engineers want to minimize the logical error rate, decrease the number of physical qubits per logical qubits, and minimize the cycle time it takes to perform a logical gate, error detection, and error correction process. There will be tradeoffs between these three factors and the engineer needs to figure out the best balance between these requirements.<br>\nThe scope of the problem and the enormous number of possibilities that need to be investigated grows to become more than what an individual can do manually as the quantum processer keep scaling up. This is where the AI assist because so helpful.<br>\nHere are a few examples of where AI is being called in to help.<br>\nIBM has created an open-source, LLM-guided evolutionary AI framework called OpenEvolve, The framework establishes a powerful, two-way interplay between classical AI and quantum computing. It utilizes large language models (LLMs) to generate informed hypotheses for algebraic expressions that could serve as valid code candidates. A recent test found 465 distinct quantum error correction code candidates. Some of the codes provided the lowest ratio of physical qubits per logical qubits to make maximum use of the available hardware, while others provided the best protection against errors by maximizing the number of errors that could still be corrected. Researchers can then review the different codes to see which one is most appropriate for their particular use case.<br>\nQC Design has introduced Meridian, a specialized AI platform designed to automate and optimize fault-tolerant quantum computing (FTQC) hardware architectures. In another test Meridian achieved a 14.6X median reduction in evaluated logical error rates compared to state-of-the-art methods published in scientific literature across an evaluation suite of over 100 fault-tolerance design tasks.<br>\nError correction codes contain both data qubits and ancilla qubits. Since one cannot directly measure a data qubit without destroying the information it contains, the ancilla qubits will contain certain patterns which can indirectly provide information on the states of the data qubits. The ancilla qubits are measured and return a pattern of ones and zeros that can be used to determine if there are any errors in the data qubits. Decoding this pattern is a critical function in fault tolerant quantum computers and is performed by classical electronic components such as FPGAs and GPUs. Ideally, a decoder will always be 100% correct in determining which qubits have errors, but this is never fully achieved, particularly if there are a large number qubit errors that exceed the number of errors the code was designed for. (This design point is called code distance.) Nonetheless, the goal of the error decoder design is to maximize the percentage of instances where it correctly decodes and corrects errors while do so in the shortest period of time.<br>\nGoogle has developed an AI-based decoder called AlphaQubit. This decoder uses a transformer-based neural networks to decode errors in quantum circuits, achieving superior performance compared to existing methods. In tests, AlphaQubit reduced errors by 6% over tensor network decoders and by 30% compared to correlated matching. The system also demonstrated adaptability to larger, simulated quantum devices with up to 241 qubits, maintaining high accuracy across extended error-correction rounds.<br>\nNVIDIA has introduced Ising Decoding which supports two variants of a 3D convolutional neural network model that can be optimized for either speed or accuracy to perform real-time decoding for quantum error correction. Ising Decoding models are up to 2.5x faster and 3x more accurate than pyMatching, the current open-source industry standard.<br>\nThese improvements provide direct benefits to end users. By reducing the number of physical qubits per logical qubits to implement a code, it will allow someone to use smaller and less costly quantum computer to run their program. In addition, those smaller quantum computers will be available earlier than the larger ones.<br>\nBy improving the error correction capability of the logical qubits, something that can be measured by the logical error rate and as well as by another measure called code distance, the accuracy rate of a user’s calculation will be better and minimize cases where the quantum computer returns the wrong answer.<br>\nAnd finally, improvements in the speed of the quantum error decoding and correction process, will directly result in reductions in the wall clock time needed to complete a user’s program. This can be quite significant for the larger problems that we expect that quantum computers will be used for in the future.<br>\nSo, while it may be an overstatement to say that complete quantum error correction design and implementation is being performed by a Bot, AI is certain assisting and accelerating the move to implement fault tolerant computers reducing the time it will take to start achieving commercial quantum advantage.<\/p>","content_hash":"c5cba6e72132f9ffb791d5d86efab7d3","author":"Doug Finke","published_at":"2026-11-19T23:44:15","fetched_at":"2026-11-20 14:48:22","word_count":1062,"read_time_minutes":6,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"15h","domain":"quantumcomputingreport.com"},{"id":"ee4c13cb8b69e882","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18473","title":"Love, Logical Gates, and Unrealistic Expectations","url":"https://quantumfrontiers.com/2026/11/18/love-logical-gates-and-unrealistic-expectations/","summary":"I have a confession. I watch YouTube recaps of movies and TV shows (at double speed) and then discuss them as if I had actually watched them. My wife hates it. We were at a party, and she overheard me discussing Game of Thrones. “He’s a phony! He hasn’t watched a single episode!” “I’m not sure what she’s talking about. Anyways, can you believe Arya killed the Night King?” I recently “watched” Materialists. It’s about Lucy Mason, a matchmaker whose clients shop for partners by spec sheet: height,","content":"<p>I have a confession. I watch YouTube recaps of movies and TV shows (at double speed) and then discuss them as if I had actually watched them. My wife hates it.<br>\nWe were at a party, and she overheard me discussing Game of Thrones.<br>\n“He’s a phony! He hasn’t watched a single episode!”<br>\n“I’m not sure what she’s talking about. Anyways, can you believe Arya killed the Night King?”<br>\nI recently “watched” Materialists. It’s about Lucy Mason, a matchmaker whose clients shop for partners by spec sheet: height, age, income, even star sign. One wants a 6′4″ man in his forties who earns over $500,000 and has a good hairline. She calls such guys “unicorns.”<br>\nThis is a lot like my job.<br>\nI’m looking for quantum error-correcting code unicorns. The main difference is my boxes are different: large code distance, high encoding rate, low-weight checks, low qubit degree, and cheap logical gates.<br>\nOf these, that last box has been on my mind a lot lately, and it’s the focus of our recent paper. What expectations should I have when searching for a code in this respect? Am I’m being as unrealistic as Lucy’s clients?<br>\nWhat are we looking for?<br>\nWe know of codes that make for excellent quantum memories. They pack many logical qubits into relatively few physical ones, protect them with a large code distance, and allow for errors to be checked in an efficient way: each check involves only a few physical qubits, and each physical qubit participates in only a few checks. Several boxes checked already. Not quite a unicorn, but close.<br>\nThe problem is that computation is another story. Intuitively, the more logical qubits we pack into a shared physical system, the harder it can become to operate on one without disturbing the others. This can make it difficult to implement addressable logical gates.<br>\nThere are several ways to implement such gates, and I won’t survey them here. But, among the cheapest are those implemented using only physical single-qubit gates and qubit permutations. The latter means rearranging the physical qubits, or sometimes just relabelling them in software. Note that, whether or not permutations are cheap is hardware dependent, but for neutral atom platforms they can be. Because the information is encoded collectively, these simple physical operations can produce various gates, including entangling logical gates.<br>\nThese gates have a lot going for them. The single-qubit operations fit into one parallel layer. They require no extra qubits or measurements. And when permutations are performed by physical rearrangement or software relabelling, they don’t spread errors between physical qubits. Single-qubit gates are also typically among the lowest error operations available on hardware.<br>\nIf you add one restriction—that the physical single-qubit gates must be Cliffords—these cheap gates become automorphism gates. The restriction is useful because we have tools for finding codes that support them. We can construct such codes analytically or search for them numerically. We’re much less good at doing the same for arbitrary single-qubit rotations. That combination of cheap implementation and tractable code design has made automorphism gates increasingly popular. They play a key role in most modern quantum computing architectures, for example, Mitten codes, IBM’s tour de Gross, and the Pinnacle architecture.<br>\nThese architectures use them both directly to perform logical gates and alongside the more resource-intensive method of code surgery to reduce its overhead. Surgery involves joint measurements between encoded systems, often with additional resource states and repeated measurement rounds. The aim is to let automorphism gates handle as much of the computation as possible, reducing how much surgery is needed.<br>\nNaturally, when searching for a code, we’d like a large automorphism group: a large collection of distinct logical operations available through these cheap physical ingredients.<br>\nHigh rate, large distance, simple checks, and now a large automorphism group. Add it to the list.<br>\nFour things I learned<br>\nIn our work we set out to understand how much automorphism gates can offer, and what a code has to give up to support them. Below are some things I learned (for a complete story you’ll need to read the paper).<br>\n(1) How much can you ask of one code?<br>\nSuppose I temporarily relax the other items on my checklist. I’ll allow as many physical qubits as needed and put aside concerns about encoding rate and check weight. Fix only the number of logical qubits, k. How large an automorphism group could a code possibly have?<br>\nFor stabilizer codes encoding k > 2 logical qubits, we determine the largest attainable automorphism group. In a suitable logical basis, it consists of all operations built from addressable logical phase gates (S) and controlled-NOT gates (CNOT). We also construct codes that attain this maximum. So this is a ceiling we can actually reach. (The cases k = 1 and k = 2 are special; we discuss them in the paper.)<br>\nCSS codes are an important family of quantum error-correcting codes. They allow bit-flip and phase-flip errors to be checked separately, and include most widely studied codes. CSS codes can also attain this maximum.<br>\nThe S gate changes the relative phase between a qubit’s two basis states by a quarter turn. CNOT flips a target qubit conditional on the state of the control qubit, and can generate entanglement. Addressability means we can apply S to any chosen logical qubit and CNOT to any chosen control–target pair. All combinations of these gates make up the group.<br>\nSo, is that a lot?<br>\nIt depends what you mean by “a lot.” Compared with the full logical Clifford group, this group contains exponentially fewer gates. But it shares a useful feature with the full Clifford group: adding just one suitable non-Clifford gate type makes it universal. Together, these gates let us approximate any quantum computation as accurately as we like.<br>\nClients could always ask Lucy for someone a little taller or a little wealthier. But with automorphism gates, there’s a clear limit to what you can ask for.<br>\n(2) The anatomy of a good match<br>\nThe automorphism gates of CSS codes have a useful structure. Every automorphism combines physical single-qubit Cliffords and permutations to produce a logical gate. For a CSS code, we find that—apart from a special case discussed in the paper—the Clifford layer and the permutation are each on their own valid logical gates. We can apply either part independently while preserving the encoding.<br>\nThis makes studying CSS automorphisms much simpler. We can study which logical gates come from physical single-qubit Cliffords, study which come from permutations, and then combine the answers.<br>\nThe two ingredients also have complementary capabilities. Physical single-qubit Cliffords cannot implement logical CNOT or SWAP gates. In the generic CSS setting, their largest attainable logical group is generated by addressable S and CZ gates, where CZ is a two-qubit entangling phase gate.<br>\nPermutations fill the other role. Their largest attainable logical group is generated by all addressable CNOTs, but they cannot implement logical S or CZ gates. Together, the two ingredients can attain the maximum automorphism group from the previous section.<br>\nLike good partners, they can each stand on their own—and together, they complete each other.<br>\n(3) High standards, higher qubit counts<br>\nIn the first result, I gave my ideal code an unlimited physical-qubit budget. Now it’s time to put that budget back into the picture.<br>\nFor a stabilizer code encoding k > 2 logical qubits, supporting all addressable logical CNOTs through automorphisms requires at least<br>\nphysical qubits. That’s exponential growth. Since the maximum automorphism group contains all these CNOTs, reaching that maximum inherits the same cost. This extends earlier bounds on phantom codes.<br>\nThis bound is tight: a certain type of phantom code attains it.<br>\nThe other ingredient from the previous section is considerably cheaper. Supporting all addressable logical S and CZ gates through physical single-qubit Cliffords requires only<br>\nWe also attain this quadratic bound with complete-graph codes. Their construction uses one physical qubit to store each logical qubits parity and one physical qubit for each pair of qubits to store the pairwise parities—whether the corresponding bits agree or differ. This information allows physical single-qubit phase gates to implement logical CZs.<br>\nThere is an important qualification. The bounds hold at every code distance, but our constructions attain these exact minima at distance one, where some single-qubit errors can go undetected. We can increase the distance through concatenation: encoding each physical qubit in a suitable additional code. This preserves the gate capabilities and adds physical qubits. Finding the optimal cost at a specified higher distance remains open.<br>\nSo a gate can be cheap to apply while demanding an expensive code.<br>\nAs with finding a partner, the details of the wish list matter. For quantum codes, the full set of addressable CNOTs is a much more expensive request than all addressable S and CZ gates.<br>\n(4) Looking for love in the wrong metrics<br>\nS and CZ have something important in common: they are diagonal gates. They change the relative phases between basis states without mixing those states. We wondered whether their relatively low qubit cost extends to diagonal non-Clifford gates.<br>\nIt does. Here we expand the physical toolbox beyond automorphisms, allowing diagonal single-qubit rotations that needn’t be Cliffords.<br>\nFor example, we construct codes supporting all addressable logical T, controlled-S, and controlled-controlled-Z (CCZ) gates using only physical single-qubit phase rotations. T applies an eighth-turn phase, while the controlled gates make phase changes depend on additional qubits. Supporting this whole collection requires only cubically many physical qubits.<br>\nMore generally, the polynomial scaling persists at every fixed level t of the Clifford hierarchy, a sequence of gate classes extending beyond Cliffords. We can support all addressable diagonal logical gates at that level using<br>\n\\(n = O(k^t)\\)<br>\nphysical qubits. Our complete-hypergraph codes attain the corresponding bounds by extending the pairwise-parity construction to larger subsets of logical qubits. As before, the exact minima occur at distance one, and suitable concatenation increases the distance while preserving the gates.<br>\nSo being non-Clifford doesn’t automatically make a gate set expensive in physical qubits. In this setting, the sharp cost separation lies between diagonal gates and CNOT-type gates.<br>\nThere’s another misleading metric: group size. These diagonal non-Clifford groups can contain many more logical operations than the entire CNOT group, yet require polynomially many physical qubits where the CNOT group requires exponentially many.<br>\nNeither the Clifford label nor the group’s size tells me what the relationship will cost.<br>\nHappily ever after, subject to constraints<br>\nSo how did this project change my approach to matchmaking code construction?<br>\nAutomorphism gates are not something to blindly maximize. Achieving the maximum comes at the price of an encoding rate that falls rapidly as k grows. Maximum gate sets may still be worthwhile for moderate k, especially as hardware scales. But, when high rate is a priority, I should choose automorphisms selectively, targeting the expensive operations I want them to replace.<br>\nI also need to look at the structure of the logical action. Neither Cliffordness nor logical-group size reliably predicts physical-qubit cost.<br>\nThere are plenty of questions left. Here are a few I’m particularly keen to answer:<br>\n- How does the minimum qubit cost depend on distance?<br>\n- How much can we save by asking for a smaller gate set—for example, CNOTs between only selected logical pairs?<br>\n- Can we extend the theory to arbitrary physical single-qubit gates? These retain the appeal of simple, depth-one circuits. We need better methods for finding and analyzing codes that support them.<br>\n- How should we uses automorphisms? They can perform logical gates directly or help make code surgery cheaper. What combination gives the greatest benefit for a particular workload and hardware platform?<br>\n- What changes if we allow more general physical two-qubit gates? These could act within a codeblock or between blocks. Which new logical operations become possible, and what do they cost in connectivity, circuit depth, and error spreading?<br>\nIf you’ve only skimmed this post, feel free to discuss it at your next party as though you read every word. Just make sure my wife isn’t there.<\/p>","content_hash":"736229971a457c62fdaccbb28fc199cf","author":"Shayan Majidy","published_at":"2026-11-19T06:00:00","fetched_at":"2026-11-20 14:48:23","word_count":1996,"read_time_minutes":10,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"1d","domain":"quantumfrontiers.com"},{"id":"d4e22bd05385ea14","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48960","title":"Qatar and France Sign Bilateral Letter of Intent on Digital Cooperation Highlighting Shared Quantum Ambitions","url":"https://quantumcomputingreport.com/qatar-and-france-sign-bilateral-letter-of-intent-on-digital-cooperation-highlighting-shared-quantum-ambitions/","summary":"Qatar and France have signed a Letter of Intent to enhance cooperation in AI, digital transformation, and quantum technologies. This agreement, formalized at the ITU Plenipotentiary Conference 2026, aims to strengthen their digital sectors and foster strategic autonomy. It also builds on existing commercial ties, including a recent deal for quantum computing deployment in Qatar by French company Quandela. The post Qatar and France Sign Bilateral Letter of Intent on Digital Cooperation Highlighti","content":"<p>According to Qatar’s Ministry of Communications and Information Technology (MCIT), the framework establishes mechanisms for exchanging technical expertise, developing digital applications across priority economic sectors, and building local digital competencies. During the signing, Minister Le Hénanff noted that both governments share a common vision of strategic autonomy in the digital sector and aligned ambitions in artificial intelligence and quantum technologies.<br>\nRead the official announcement from Qatar’s Ministry of Communications and Information Technology here, and view additional coverage from the Qatar News Agency via Qatar Tribune here.<br>\nIn GQI Portal<br>\nThe players behind the news<br>\nThe team that writes QCR tracks every company, deal and technology in the GQI Factory, GQI's verified database of the quantum industry. Next up: every story linked to its players, coming to QCR's paid plans.<br>\nPlayers →Companies and institutions across the quantum industry, by segment.<br>\nScorecards →How the players compare on hardware, software, funding and more.<br>\nNewsletter<br>\nQCR Alerts in your inbox<br>\nThe latest reporting and analysis from Quantum Computing Report. Free, unsubscribe any time.<\/p>","content_hash":"4cdebe2939bf4842caf96dd132f288ef","author":"Mohamed Abdel-Kareem","published_at":"2026-11-18T17:39:03","fetched_at":"2026-11-20 14:48:22","word_count":169,"read_time_minutes":1,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"1e93f3877b635bb6","feed_id":"quantum-computing-report","guid":"https://quantumcomputingreport.com/?p=48956","title":"Quandela and NVIDIA Benchmark Photonic Quantum Simulability Frontiers on H100 GPUs","url":"https://quantumcomputingreport.com/quandela-and-nvidia-benchmark-photonic-quantum-simulability-frontiers-on-h100-gpus/","summary":"Quandela, CNRS, and NVIDIA have established a \"simulability frontier\" for photonic quantum processors using NVIDIA H100 GPUs. Their research defines a unified metric for when quantum processors outperform classical simulations, moving beyond varying photon count thresholds. They've also released an open-source library, photonic-engines, to support this work. The post Quandela and NVIDIA Benchmark Photonic Quantum Simulability Frontiers on H100 GPUs appeared first on Quantum Computing Report.","content":"<p>Researchers from Quandela, CNRS, and NVIDIA have published a benchmarking study defining a standardized “simulability frontier” to measure when photonic quantum processors outpace exact classical simulation on a single NVIDIA H100 PCIe GPU. Detailed in a technical preprint and backed by the open-source photonic-engines GPU library, the work replaces disparate literature thresholds ranging from 50 to 98 photons with a unified throughput metric: the number of photonic inputs at which the fastest exact classical sampler sustains one sample per second across universal interferometers with twice as many optical modes as inputs (m = 2n).<br>\n| Exact Photonic Sampling & Resource Frontiers on One NVIDIA H100 GPU (m = 2n) |  |  | <br>\n|---|---|---|<br>\n| Photonic Modality / Resource Constraint | 1 Hz Exact Sampling Frontier (n*) | Key Scaling & Architectural Findings | <br>\n| Entangled Quantum Emitters | 31.0 photonic inputs (measured) | Matrix-product-state entanglement adds ~n/2 overhead; tick-by-tick trains hit 1 Hz at ~21–22 emitters. | <br>\n| Single Photons (Fock Inputs) | 38.3 photonic inputs (measured) | Exponential base β = 1.82; 8 H100 GPUs add +3.5 inputs, while 16,384 GPUs add +16.2 inputs. | <br>\n| Squeezed Light (0.5 photons/squeezer) | 41.5 photonic inputs (modelled, S = 104) | Loop-hafnian pair sieve scales as 2N/2 in detected photons; drops to 9.7 inputs at 1.5 photons/squeezer. | <br>\n| Coherent Superpositions (α = π/4) | 50.0 photonic inputs (measured) | Quantum coherence lowers the frontier by 14.2 inputs compared to incoherent lossy photons (64.2). | <br>\n| Memory & Floating-Point Precision | 13 photons (RAM) / ~55–62 (fp64) | Strong simulation hits the 80 GiB HBM2e cap at 13 photons; double precision fails near 55 single / 62 squeezed photons. | <br>\nBecause exact sampling complexity grows exponentially with detected photon counts, hardware parallelism yields only logarithmic gains, requiring roughly 1016 GPUs to reach 100 single-photon inputs without algorithmic breakthroughs. Conversely, replacing Clifford and Clifford’s 2018 boson-sampling algorithm with their 2020 output-collapsed formulation and custom CUDA kernels raised the single-photon frontier from 32.5 to 38.3 inputs on identical hardware, while adding one non-linear phase site (φ = π/2) reduced the frontier by 2.2 inputs and mid-circuit feed-forward across up to three modes shifted it by at most 0.2 inputs.<br>\nThe authors also highlight a practical operational distinction between single-shot hardness and real-time stream reproduction: a three-source entangled photonic processor operating at 1 GHz with 48 photons across 96 modes and 20% end-to-end transmission produces typical 10-photon samples that are individually easy to simulate, yet reproducing its continuous output stream in real time would require approximately 30 H100 GPUs. On energy metrics, direct board power measurements (270 to 344 W) showed an exact 38-photon sample consumes 7.3 × 10−2 Wh on an H100, placing potential energetic advantage thresholds below 12 photons relative to low-power photonic hardware.<br>\nRead Quandela’s technical blog post here, access the full research preprint on arXiv here, and explore the open-source photonic-engines repository on GitHub here.<\/p>","content_hash":"ed7b6e9b7ddecad4586a04adf0ca70d7","author":"Mohamed Abdel-Kareem","published_at":"2026-11-18T17:04:11","fetched_at":"2026-11-20 14:48:22","word_count":492,"read_time_minutes":3,"feed_title":"Quantum Computing Report","category":"quantum","tier":"curated","site_url":"https://quantumcomputingreport.com","time_ago":"1d","domain":"quantumcomputingreport.com"},{"id":"0da679643a8d430e","feed_id":"quantum-frontiers","guid":"http://quantumfrontiers.com/?p=18451","title":"For azure views","url":"https://quantumfrontiers.com/2026/11/15/for-azure-views/","summary":"The first time I moved to England, I brought the book The Age of Wonder. In it, biographer Richard Holmes sketches scientists who marveled at nature during the Romantic Era. I met Joseph Banks, William and Caroline Herschel, and Humphry Davy while reveling in condensed-matter theory as a research assistant at Lancaster University. This August, I moved to the University of Cambridge for the rest of the summer and much of the fall. My baggage included an e-copy of Holmes’s most recent book. The Bo","content":"<p>The first time I moved to England, I brought the book The Age of Wonder. In it, biographer Richard Holmes sketches scientists who marveled at nature during the Romantic Era. I met Joseph Banks, William and Caroline Herschel, and Humphry Davy while reveling in condensed-matter theory as a research assistant at Lancaster University.<br>\nThis August, I moved to the University of Cambridge for the rest of the summer and much of the fall. My baggage included an e-copy of Holmes’s most recent book. The Boundless Deep profiles Alfred Tennyson, who served as poet laureate of the United Kingdom for approximately 42 of Victoria’s nearly 64 years as queen. Even if Tennyson’s name doesn’t ring a bell, some of his verses might—partially because those verses chime with a bell’s sonorousness. Tennyson wrote, “’Tis better to have loved and lost / Than never to have loved at all,” in an elegy for a friend. That friend’s death—the heartlessness and violence of mortality—led Tennyson to write of “Nature, red in tooth and claw.” He also glorified heroism, depicting the ancient Greek Odysseus as yearning “[t]o strive, to seek, to find, and not to yield.”1<br>\nTennyson grew up in Lincolnshire, on the eastern coast of England. He adored the sea, whose wildness and grandeur infused his spirit. As an undergraduate at the University of Cambridge, Tennyson formed friendships that helped sustain him for decades. Former schoolmates hosted him in their homes, encouraged him, criticized him with affection, and urged him to publish his poetry. For years, Tennyson published little: he drifted from house to house, chain-smoked, recited poetry to friends for hours in the evenings, and waffled about his love for fellow Lincolnshire native Emily Sellwood. The two married once Tennyson published his elegy and the public responded with rapture. The poet laureateship followed that year.<br>\nHolmes tracks not only Tennyson’s path through literature, but also the poet’s appetite for science and technology. Discoveries and inventions fascinated Tennyson. At Cambridge, he studied under William Whewell, whose contributions to mathematics, physics, astronomy, geology and more defy cataloguing. The back of Holmes’s book lists “some popular science books read by Young Tennyson.” They include Darwin’s On the Origin of Species by Means of Natural Selection; a guide to microscopes; and a treatise by mathematician, co-founder of computer science, and steampunk inspiration Charles Babbage.<br>\nScience suffused Tennyson’s poetry, Holmes argues. The biographer illustrates with The Princess, an 1847 poem that advocates for higher education for women. The poem opens with a science festival: “a fire-balloon / Rose gem-like up before the dusky groves.” In steampunk fashion, “round the lake / A little clock-work steamer paddling plied / And shook the lilies.” You can read the rest of the description in what appears to be a first edition. The scene opens in the stanza that begins nearly halfway down the following right-hand page.<br>\nSub-librarian Steven Archer plucked the book for me from the Wren Library at Trinity College, Cambridge this November. Trinity postdoctoral fellow Andrea Pizzi had guessed that I’d appreciate the library and invited me to visit. He guessed correctly.<br>\nThe Boundless Deep has appealed to me not only because it highlights the Victorian era—what has become my era—or because it meshes science with poetry. I also view the book as offering guidance about a technology gnawing at society today: artificial intelligence. You don’t need for me to recap the shock delivered by AI to many people’s sense of humanity, the horror sweeping the globe. But did you know how similarly the Victorians felt?<br>\nDuring the 1800s, geologists Charles Lyell, Roderick Murchison, and others found evidence of extinctions. They unearthed fossils from species extinguished eons beforehand. The scale of those destructions boggled the Victorians’ minds. A species consists of so many creatures—so many wriggling, striving living beings. How could an entire species disappear from the face of the Earth? How could so many species have disappeared? Would humanity share their fate? If so, why bother living, striving, wriggling?<br>\nAs Holmes writes, “Geology soon became an area of spiritual terror, with claustrophobic glimpses of a cruel, meaningless, godless physical world closing in on the heels of humanity. It was full of monsters, dust and extinctions, making nonsense of any idea of progress or individual immortality.” Nature, red in tooth and claw, indeed.<br>\nI’ve been reading The Boundless Deep alongside headlines about cyber hacks, job losses, bias studies, and mathematician breakdowns attributable to AI. To the extent that AI poses problems for society, I don’t have silver bullets. But I take comfort in humanity’s having experienced similar tremors in the past. Granted, AI and extinctions differ in some ways, despite resembling each other. And perhaps we shouldn’t respond as the Victorians did. Most people today take extinctions for granted, and schoolchildren effuse about the fossils that alarmed Tennyson’s contemporaries. Perhaps future generations will view AI as the Victorians viewed those fossils. Either way, we’re not alone: the Victorians felt as many people do today.<br>\nAnd we know how Tennyson responded: with poetry.<br>\nWith thanks to Andrea Pizzi; Steven Archer; the Isaac Newton Institute for Mathematical Sciences; and King’s College, Cambridge.<br>\n1Tennyson used the Latin name Ulysses for Odysseus.<\/p>","content_hash":"b634a4defa5a2fd77fc11680ee92e61e","author":"Nicole Yunger Halpern","published_at":"2026-11-16T07:25:25","fetched_at":"2026-11-20 14:48:23","word_count":859,"read_time_minutes":5,"feed_title":"Quantum Frontiers (Caltech)","category":"quantum","tier":"curated","site_url":"https://quantumfrontiers.com","time_ago":"4d","domain":"quantumfrontiers.com"},{"id":"a0e4bf6201213896","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10321","title":"More podcasts, conversations, talks","url":"https://scottaaronson.blog/?p=10321","summary":"Here&#8217;s my talk &#8220;Are We Cooked?&#8221; about the AI Mathocalypse&#8212;the one where, every time I give it, I need to update it with all the big theorems AI has proved since the last time I gave the talk. This version is from the Institute for Foundations of Machine Learning (IFML) here at UT Austin, back on October 2 (so, ancient times). Here I am with Rabbi Neil Blumofe of Agudas Achim synagogue in Austin. Rabbi Blumofe asks me about quantum mechanics, AI, consciousness, free will, ","content":"<p>Here’s my talk “Are We Cooked?” about the AI Mathocalypse—the one where, every time I give it, I need to update it with all the big theorems AI has proved since the last time I gave the talk. This version is from the Institute for Foundations of Machine Learning (IFML) here at UT Austin, back on October 2 (so, ancient times).<br>\nHere I am with Rabbi Neil Blumofe of Agudas Achim synagogue in Austin. Rabbi Blumofe asks me about quantum mechanics, AI, consciousness, free will, why I say “please” and “thank you” to GPT, and why I blog about Israel. The questions from the audience, unexpectedly, were more like “will cryptocurrencies that use RSA or Diffie-Hellman take longer to break with quantum computers than those that use elliptic curve cryptography?” Thanks to Rabbi Blumofe for doing this.<br>\nAnd here’s a podcast with Yu Shen, with Chinese subtitles. I haven’t watched this one and don’t remember what we talked about. (Oh — looking at the title graphic, apparently we talked about when AI will solve the P vs NP problem?)<br>\n45 Responses to “More podcasts, conversations, talks”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"1cccb8b5b7ab1073bfd9994fcbd0afb6","author":"Scott","published_at":"2026-11-15T14:30:28","fetched_at":"2026-11-20 14:48:18","word_count":343,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"5d","domain":"scottaaronson.blog"},{"id":"f98a357a67e50529","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10318","title":"Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!","url":"https://scottaaronson.blog/?p=10318","summary":"Enjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code&#8217;s limitations. She doesn&#8217;t get to the soundness analysis. Feel free to ask questions in the comments. I mig","content":"<p>Enjoy all three hours of this! Dana covers what the Unique Games problem is and why people cared about it, the structure of a proof of its NP-hardness, exactly where the previous attempts to complete the proof (based on the Long Code and the Hadamard Code) got stuck, the new tree-based code that the AI discovered, and how the new code gets around the Long Code and Hadamard Code’s limitations. She doesn’t get to the soundness analysis.<br>\nFeel free to ask questions in the comments. I might write some notes here later with my own doofus understanding of Dana’s talk. Experts are of course hard at work on more formal writeups of the proof (which will hopefully be more comprehensible than the AI’s writeup).<br>\nThis entry was posted<br>\non Tuesday, November 10th, 2026 at 2:27 pm and is filed under AI, Announcements, Complexity.<br>\nYou can follow any responses to this entry through the RSS 2.0 feed.<br>\nYou can leave a response, or trackback from your own site.<br>\n129 Responses to “Dana’s talk on OpenAI’s proof of the Unique Games Conjecture, now on YouTube!”<br>\nLeave a Reply<br>\nYou can use rich HTML in comments! You can also use basic TeX, by enclosing it within $$ $$ for displayed equations or \\( \\) for inline equations.<br>\nComment Policies:<br>\nAfter two decades of mostly-open comments, in July 2024 Shtetl-Optimized transitioned to the following policy:<br>\nAll comments are treated, by default, as personal missives to me, Scott Aaronson---with no expectation either that they'll appear on the blog or that I'll reply to them.<br>\nAt my leisure and discretion, and in consultation with the Shtetl-Optimized Committee of Guardians, I'll put on the blog a curated selection of comments that I judge to be particularly interesting or to move the topic forward, and I'll do my best to answer those. But it will be more like Letters to the Editor. Anyone who feels unjustly censored is welcome to the rest of the Internet.<br>\nTo the many who've asked me for this over the years, you're welcome!<\/p>","content_hash":"f7a800a85a7d77e79118fdb829a66b1d","author":"Scott","published_at":"2026-11-10T20:27:28","fetched_at":"2026-11-20 14:48:18","word_count":340,"read_time_minutes":2,"feed_title":"Shtetl-Optimized","category":"quantum","tier":"curated","site_url":"https://scottaaronson.blog","time_ago":"1w","domain":"scottaaronson.blog"},{"id":"3a6f0747d33bd6f2","feed_id":"scott-aaronson","guid":"https://scottaaronson.blog/?p=10295","title":"Aaronson-Ambainis Conjecture proved!  (By AI, of course)","url":"https://scottaaronson.blog/?p=10295","summary":"The &#8220;For Dummies&#8221; Version (apologies for not including this earlier): Yes, an AI solved a big open problem about quantum computing No, this doesn&#8217;t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter What it does, is to rule out a potential class of quantum speedups that most of us didn&#8217;t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially ","content":"<p>Aaronson-Ambainis Conjecture proved! (By AI, of course)<br>\nThe “For Dummies” Version (apologies for not including this earlier):<br>\n- Yes, an AI solved a big open problem about quantum computing<br>\n- No, this doesn’t kill quantum supremacy, or change how we build quantum computers, or whatever else you read on Twitter<br>\n- What it does, is to rule out a potential class of quantum speedups that most of us didn’t believe would exist anyway (namely, those that would compute a yes-or-no property of exponentially many random bits, superpolynomially faster than any classical algorithm)<br>\n- It means my prediction was right, so you should listen to me more in the future!<br>\nWe now, of course, live in age where longstanding open problems in quantum computing theory (and all theoretical computer science, and all math) are dropping like flies, to the extent that there’s no way I could possibly do a post on each and every bombshell. But I can’t exactly avoid the Aaronson-Ambainis Conjecture, given that my name is on it, and that I cared about the answer to this one (back in 2019, I even blogged about an attempted solution that ultimately turned out to be fallacious).<br>\nFor those tuning in from home, the AA Conjecture, which Andris and I posed back in 2009, says that every degree-d polynomial p:{0,1}n→[0,1] in n Boolean variables, with constant variance, has some variable whose influence is at least 1/poly(d). The reason Andris and I cared about this conjecture is that, as we proved, it implies that there’s no superpolynomial advantage of quantum query complexity over classical query complexity for decision problems that works on most Boolean inputs. Or, in terms of complexity classes, that there’s no hope of separating P from BQP relative to a random oracle, without proving P≠BQP or something of the kind in the unrelativized world. This would finally answer a question of Fortnow and Rogers from 1998.<br>\nThe connection between quantum algorithms and polynomials came from the famous 1998 paper of Beals et al., which showed that, if Q is a quantum algorithm that makes T queries to an oracle X, then Pr[Q(X) accepts] can be written as a multivariate real polynomial p(X) in the bits of X, of degree at most 2T. The proof of my and Andris’s result is then simply this: take the polynomial p, find in it a variable of influence at least 1/poly(T), and query that variable, and keep repeating until there’s no longer such an influential variable—at which point, by assumption, p is nearly a constant polynomial, which means you’ve learned whether Q accepts with high probability over X. This provides a classical simulation of the quantum algorithm Q—a simulation that makes poly(T) queries to the oracle X and that works for most X’s.<br>\nThe AA Conjecture caught on to an extent Andris and I couldn’t have predicted. Some who worked on it barely even cared about the implication for quantum computing, and just wanted to solve the problem about polynomials! There were, I’m both proud and sorry to report, Fourier analysis experts and grad students who oriented their whole research programs around trying to prove AA, with lots of proofs of special cases, some of them very recent. A proof of full AA was one of the last remaining open problems in quantum query complexity that everyone seemed to agree was centrally important. I was surprised, honestly, to see it missing from OpenAI’s Mathocalypse dump a few weeks ago. Surely they tried it, so was it really so much harder than all the problems that were solved?<br>\nNow a startup called Physical Superintelligence has announced a proof of the AA Conjecture, specifically showing that there’s a variable of influence at least ~1/d6, which they say they obtained using their proprietary research harness on an internal Claude model. (What role the harness played, compared to the internal model, is something I don’t know.) The effort was led by David Turturean and Jim Halverson at PSI. They actually let me know about this several weeks ago, but I had to keep it secret until the announcement late last week.<br>\nI haven’t yet understood the proof, although I hope to. In the meantime, though, I believe the proof is correct for two reasons. Firstly, there’s a Lean certificate, and secondly, human experts (I’m no longer an expert on my own conjecture!) have already gone over it and understood it. In fact, there’s already a beautiful-looking exposition written by Guy Blanc of MIT and Jordan Docter, Carmen Strassle, and Li-Yang Tan of Stanford, which looks like a perfect starting point for those seeking to go much deeper. Or, for those seeking to go only slightly deeper, PSI’s blog post on the advance is sufficiently well-written that it saves me from the need to write too much more here.<br>\nAlas, as reported by Ashley Montanaro, there were the usual forehead-banging misconceptions about what this result means for quantum computing. So for example, Pedro Domingos of U. of Washington blasted out to his 137,000 X followers that the proof means that “the dream of quantum supremacy is dead.” The truth, as Pedro knows perfectly well (or easily could know), is that it rules out one particular type of quantum supremacy (namely, for yes-or-no problems relative to random oracles) that we’d already conjectured didn’t exist anyway. It doesn’t undermine any form of quantum supr
